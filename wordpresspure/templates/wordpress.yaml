apiVersion: v1
kind: Service
metadata:
  name: wordpressentrance
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/instance: wordpress
    app.kubernetes.io/name: wordpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.wordpresspure.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: wordpress
      app.kubernetes.io/name: wordpress
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: wordpress
        app.kubernetes.io/name: wordpress
      annotations:
        checksum/runtime: {{ include (print $.Template.BasePath "/runtime.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: docker.io/beclab/aboveos-busybox:1.37.0
          securityContext:
            runAsUser: 0
          command: [sh, -c, 'set -eu; mkdir -p /data/wordpress/wp-content /data/.olares-upgrade; chown 1000:1000 /data /data/wordpress /data/wordpress/wp-content /data/.olares-upgrade; chmod 700 /data/.olares-upgrade']
          volumeMounts:
            - name: data
              mountPath: /data
        - name: prepare-source-and-data
          image: docker.io/wordpress:7.1.3-php8.3-apache
          command: [php, /config/prepare.php]
          env:
            - name: WORDPRESS_DATABASE_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: WORDPRESS_DATABASE_PORT
              value: {{ .Values.mariadb.port | default 3306 | quote }}
            - name: WORDPRESS_DATABASE_NAME
              value: {{ .Values.mariadb.databases.wordpress | quote }}
            - name: WORDPRESS_DATABASE_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: WORDPRESS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_DATABASE_PASSWORD
            - name: WORDPRESS_USERNAME
              value: {{ .Values.olaresEnv.WORDPRESS_USERNAME | quote }}
            - name: WORDPRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_PASSWORD
            - name: SITE_DOMAIN
              value: {{ .Values.domain.wordpress | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: legacy-data
              mountPath: /legacy
              readOnly: true
            - name: code
              mountPath: /runtime
            - name: runtime
              mountPath: /config
        - name: database-snapshot
          image: docker.io/beclab/mariadb:11.4.3-noble
          command: [/bin/bash, /config/backup.sh]
          env:
            - name: WORDPRESS_DATABASE_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: WORDPRESS_DATABASE_PORT
              value: {{ .Values.mariadb.port | default 3306 | quote }}
            - name: WORDPRESS_DATABASE_NAME
              value: {{ .Values.mariadb.databases.wordpress | quote }}
            - name: WORDPRESS_DATABASE_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: WORDPRESS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_DATABASE_PASSWORD
            - name: WORDPRESS_USERNAME
              value: {{ .Values.olaresEnv.WORDPRESS_USERNAME | quote }}
            - name: WORDPRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_PASSWORD
            - name: SITE_DOMAIN
              value: {{ .Values.domain.wordpress | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /config
        - name: initialize-wordpress
          image: docker.io/wordpress:7.1.3-php8.3-apache
          command: [php, /config/initialize.php]
          env:
            - name: WORDPRESS_DATABASE_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: WORDPRESS_DATABASE_PORT
              value: {{ .Values.mariadb.port | default 3306 | quote }}
            - name: WORDPRESS_DATABASE_NAME
              value: {{ .Values.mariadb.databases.wordpress | quote }}
            - name: WORDPRESS_DATABASE_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: WORDPRESS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_DATABASE_PASSWORD
            - name: WORDPRESS_USERNAME
              value: {{ .Values.olaresEnv.WORDPRESS_USERNAME | quote }}
            - name: WORDPRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_PASSWORD
            - name: SITE_DOMAIN
              value: {{ .Values.domain.wordpress | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /bitnami/wordpress
              subPath: wordpress
            - name: code
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/wp-content
              subPath: wordpress/wp-content
            - name: runtime
              mountPath: /config
            - name: runtime
              mountPath: /usr/local/etc/php/conf.d/zz-olares-security.ini
              subPath: php.ini
      containers:
        - name: wordpress
          image: docker.io/wordpress:7.1.3-php8.3-apache
          command: [sh, /config/start.sh]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: WORDPRESS_DATABASE_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: WORDPRESS_DATABASE_PORT
              value: {{ .Values.mariadb.port | default 3306 | quote }}
            - name: WORDPRESS_DATABASE_NAME
              value: {{ .Values.mariadb.databases.wordpress | quote }}
            - name: WORDPRESS_DATABASE_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: WORDPRESS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_DATABASE_PASSWORD
            - name: WORDPRESS_USERNAME
              value: {{ .Values.olaresEnv.WORDPRESS_USERNAME | quote }}
            - name: WORDPRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WORDPRESS_PASSWORD
            - name: SITE_DOMAIN
              value: {{ .Values.domain.wordpress | quote }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1536Mi
          volumeMounts:
            - name: code
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/wp-content
              subPath: wordpress/wp-content
            - name: data
              mountPath: /bitnami/wordpress
              subPath: wordpress
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /config
            - name: runtime
              mountPath: /usr/local/etc/php/conf.d/zz-olares-security.ini
              subPath: php.ini
      volumes:
        - name: data
          hostPath:
            type: DirectoryOrCreate
            path: {{ .Values.userspace.appCache }}
        - name: legacy-data
          hostPath:
            type: DirectoryOrCreate
            path: {{ .Values.userspace.appData }}
        - name: code
          emptyDir: {}
        - name: runtime
          configMap:
            name: wordpress-runtime

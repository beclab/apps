apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-runtime
  namespace: {{ .Release.Namespace }}
data:
  apache.conf: |
    ServerRoot /etc/apache2
    ServerName localhost
    PidFile /tmp/wordpress-apache.pid
    DefaultRuntimeDir /tmp
    Listen 8080
    User #1000
    Group #1000
    IncludeOptional /etc/apache2/mods-enabled/*.load
    IncludeOptional /etc/apache2/mods-enabled/*.conf
    IncludeOptional /etc/apache2/conf-enabled/docker-php.conf
    ErrorLog /proc/self/fd/2
    LogLevel warn
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    <Directory />
      AllowOverride None
      Require all denied
    </Directory>
    <Directory /var/www/html>
      Options FollowSymLinks
      AllowOverride All
      Require all granted
    </Directory>
    <FilesMatch "^wp-config.*\.php$">
      Require all denied
    </FilesMatch>
  backup.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    umask 077
    state=/data/.olares-upgrade/7.1.3
    mkdir -p "$state"
    export MYSQL_PWD="$WORDPRESS_DATABASE_PASSWORD"
    for attempt in $(seq 1 90); do
      if mariadb --skip-ssl -h "$WORDPRESS_DATABASE_HOST" -P "${WORDPRESS_DATABASE_PORT:-3306}" -u "$WORDPRESS_DATABASE_USER" "$WORDPRESS_DATABASE_NAME" -Nse 'SELECT 1' >/dev/null 2>&1; then break; fi
      if [ "$attempt" = 90 ]; then echo 'Application database not ready' >&2; exit 1; fi
      sleep 2
    done
    if [ ! -s "$state/database.sql.gz" ]; then
      mariadb-dump --skip-ssl -h "$WORDPRESS_DATABASE_HOST" -P "${WORDPRESS_DATABASE_PORT:-3306}" -u "$WORDPRESS_DATABASE_USER" --single-transaction --quick --skip-lock-tables --hex-blob --routines --events "$WORDPRESS_DATABASE_NAME" | gzip > "$state/database.sql.gz.tmp"
      gzip -t "$state/database.sql.gz.tmp"
      gzip -dc "$state/database.sql.gz.tmp" | tail -n 12 | grep -q 'Dump completed'
      mv "$state/database.sql.gz.tmp" "$state/database.sql.gz"
    fi
    gzip -t "$state/database.sql.gz"
    echo 'Application database snapshot verified'
  initialize.php: |
    <?php
    declare(strict_types=1);
    if (function_exists('posix_geteuid') && posix_geteuid()!==1000) throw new RuntimeException('Expected uid1000');
    $lock=fopen('/data/.olares-upgrade/lock','c');if (!$lock || !flock($lock,LOCK_EX)) throw new RuntimeException('Cannot lock upgrade');
    if (!is_file('/data/.olares-upgrade/7.1.3/database.sql.gz')) throw new RuntimeException('Database snapshot missing');
    define('WP_INSTALLING',true);
    require '/var/www/html/wp-load.php';
    require_once ABSPATH.'wp-admin/includes/upgrade.php';
    if (!is_blog_installed()) {
        $user=getenv('WORDPRESS_USERNAME');$pass=getenv('WORDPRESS_PASSWORD');
        if (!$user || !$pass) throw new RuntimeException('Installation credentials missing');
        $v=wp_install("User's Blog!",$user,'user@example.com',true,'',$pass);
        if (is_wp_error($v)) throw new RuntimeException('WordPress installation failed');
        echo "Fresh WordPress installation completed\n";
    } else {wp_upgrade();echo "Existing WordPress database upgraded\n";}
    global $wp_version,$wp_db_version,$wpdb;
    if ($wp_version!=='7.1.3' || (int)get_option('db_version')!==(int)$wp_db_version) throw new RuntimeException('WordPress version/schema mismatch');
    if ($wpdb->last_error) throw new RuntimeException('Application database verification failed');
    file_put_contents('/data/.olares-upgrade/7.1.3/completed',"7.1.3\n");
    echo "WordPress version and schema verified\n";
  prepare.php: |
    <?php
    declare(strict_types=1);
    $data='/data/wordpress';$state='/data/.olares-upgrade/7.1.3';
    if (getmyuid() !== 1000 && function_exists('posix_geteuid') && posix_geteuid() !== 1000) throw new RuntimeException('Expected uid1000');
    foreach ([$data,"$data/wp-content",$state] as $p) if (!is_dir($p) && !mkdir($p,0755,true)) throw new RuntimeException('Cannot prepare application directory');
    $lock=fopen('/data/.olares-upgrade/lock','c');if (!$lock || !flock($lock,LOCK_EX)) throw new RuntimeException('Cannot lock upgrade');
    function run(array $cmd):void {$p=proc_open($cmd,[0=>['file','/dev/null','r'],1=>['file','/dev/null','w'],2=>STDERR],$pipes);if (!is_resource($p) || proc_close($p)!==0) throw new RuntimeException('File preparation failed');}
    function populated(string $dir):bool {if (!is_dir($dir)) return false;return count(array_diff(scandir($dir),['.','..']))>0;}
    // A completed older Data->Cache migration remains authoritative; do not replay stale source data.
    if (!is_file('/data/.migration_from_appdata_applied') && populated('/legacy/wordpress')) {
        if (is_file("$data/wp-config.php") || populated("$data/wp-content")) throw new RuntimeException('Both legacy Data and Cache contain site data without a migration marker; refusing to overwrite either');
        run(['cp','-R','/legacy/wordpress/.',"$data/"]);
        file_put_contents('/data/.migration_from_appdata_applied',"Imported legacy application data\n");
    }
    if (!is_file("$state/files.tar.gz")) {
        run(['tar','-czf',"$state/files.tar.gz.tmp",'-C','/data','wordpress']);
        run(['tar','-tzf',"$state/files.tar.gz.tmp"]);
        if (!rename("$state/files.tar.gz.tmp","$state/files.tar.gz")) throw new RuntimeException('Cannot retain file snapshot');
        chmod("$state/files.tar.gz",0600);
    }
    run(['tar','-tzf',"$state/files.tar.gz"]);
    run(['cp','-R','/usr/src/wordpress/.','/runtime/']);
    // Keep all saved files in place. Only conventional public root files enter the web root.
    // Unknown saved files may contain private exports or settings and must not become public.
    foreach (['.htaccess','.well-known','robots.txt','favicon.ico','favicon.png','ads.txt','app-ads.txt'] as $name) {
        if (file_exists("$data/$name") && !file_exists('/usr/src/wordpress/'.$name)) run(['cp','-R',"$data/$name",'/runtime/'.$name]);
    }
    if (!populated("$data/wp-content")) run(['cp','-R','/usr/src/wordpress/wp-content/.',"$data/wp-content/"]);
    if (!is_file("$data/wp-config.php")) {
        $keys='';foreach (['AUTH_KEY','SECURE_AUTH_KEY','LOGGED_IN_KEY','NONCE_KEY','AUTH_SALT','SECURE_AUTH_SALT','LOGGED_IN_SALT','NONCE_SALT'] as $key) $keys.="define('$key',".var_export(bin2hex(random_bytes(48)),true).");\n";
        $config= <<<'PHP'
    <?php
    define('DB_NAME',getenv('WORDPRESS_DATABASE_NAME'));
    define('DB_USER',getenv('WORDPRESS_DATABASE_USER'));
    define('DB_PASSWORD',getenv('WORDPRESS_DATABASE_PASSWORD'));
    define('DB_HOST',getenv('WORDPRESS_DATABASE_HOST').':'.(getenv('WORDPRESS_DATABASE_PORT')?:'3306'));
    define('DB_CHARSET','utf8mb4');define('DB_COLLATE','');
    $table_prefix='wp_';
    if (getenv('SITE_DOMAIN')) {define('WP_HOME','https://'.getenv('SITE_DOMAIN'));define('WP_SITEURL','https://'.getenv('SITE_DOMAIN'));}
    PHP;
        $config.="\n".$keys."if (!defined('ABSPATH')) define('ABSPATH','/var/www/html/');\nrequire_once ABSPATH.'wp-settings.php';\n";
        file_put_contents("$data/wp-config.php.tmp",$config);chmod("$data/wp-config.php.tmp",0600);rename("$data/wp-config.php.tmp","$data/wp-config.php");
    }
    // Preserve the durable configuration byte-for-byte; only its runtime copy loses the old chart's duplicate cookie suffix.
    $original=file_get_contents("$data/wp-config.php");
    $original=preg_replace("~\n// Cookie paths for HTTPS proxy - force all to root\n(?:define\('(?:COOKIEPATH|SITECOOKIEPATH|ADMIN_COOKIE_PATH|PLUGINS_COOKIE_PATH|COOKIE_DOMAIN)',[^\n]*\);\n?)+~",'',$original);
    file_put_contents('/runtime/wp-config-legacy.php',$original);chmod('/runtime/wp-config-legacy.php',0600);
    $wrapper= <<<'PHP'
    <?php
    if (!defined('ABSPATH')) define('ABSPATH','/var/www/html/');
    if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO']==='https') $_SERVER['HTTPS']='on';
    if (PHP_SAPI==='cli' && getenv('SITE_DOMAIN')) {$_SERVER['HTTP_HOST']=getenv('SITE_DOMAIN');$_SERVER['SERVER_NAME']=getenv('SITE_DOMAIN');$_SERVER['HTTPS']='on';}
    require '/var/www/html/wp-config-legacy.php';
    PHP;
    file_put_contents('/runtime/wp-config.php',$wrapper);chmod('/runtime/wp-config.php',0600);
    fwrite(STDOUT,"WordPress source and preserved data prepared\n");
  start.sh: |
    #!/bin/sh
    set -eu
    test "$(id -u)" = 1000
    exec apache2 -f /config/apache.conf -DFOREGROUND
  php.ini: |
    session.upload_progress.enabled=0
    expose_php=Off
    upload_max_filesize=500M
    post_max_size=500M
    memory_limit=512M

apiVersion: v1
kind: Service
metadata:
  name: wordpresspublic
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: wordpresspublic
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: {{ .Release.Name }}-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-proxy
spec:
  replicas: {{ (index .Values.workloads "wordpress-proxy").replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/proxy-config: {{ include (print $.Template.BasePath "/proxy-config.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}-proxy
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf
        - name: openresty-run
          emptyDir: {}
        - name: openresty-logs
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          readinessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                http_code=$(curl -s -o /dev/null -w "%{http_code}" http://wordpressentrance:80)
                # WordPress commonly answers with 302 (login / canonical URL); treat 2xx/3xx as ready.
                [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: openresty-run
              mountPath: /var/run/openresty
            - name: openresty-logs
              mountPath: /usr/local/openresty/nginx/logs

metadata:
  title: WordPress
  description: Outil de blog, plateforme de publication et CMS
spec:
  fullDescription: |
    WordPress alimente plus de 43 % du web — un chiffre qui augmente chaque jour. Des sites simples aux blogs, en passant par des portails complexes, des sites d'entreprise et même des applications, tout est construit avec WordPress.
    
    WordPress combine la simplicité pour les utilisateurs et les éditeurs avec une complexité sous le capot pour les développeurs. Cela le rend flexible tout en restant facile à utiliser.
    
    **Voici quelques-unes des fonctionnalités que nous pensons que vous allez aimer.**
    Simplicity
    
    Flexibility
    - Vous pouvez créer n'importe quel type de site web : un blog ou un site personnel, un photoblog, un site d'entreprise, un portfolio professionnel, un site gouvernemental, un magazine ou un site d'actualités, une communauté en ligne, voire un réseau de sites. Vous pouvez embeller votre site avec des thèmes et l'étendre avec des plugins. Vous pouvez même construire votre propre application.
    
    Publish with Ease
    - Vous pouvez créer des Articles et des Pages, les formater facilement, insérer des médias, et d'un clic votre contenu est en ligne.
    
    Publishing Tools
    - Créez des brouillons, planifiez la publication et consultez les révisions de vos articles. Rendez votre contenu public ou privé, et protégez articles et pages par un mot de passe.
    
    User Management
    - Vous pouvez avoir une variété de contributeurs sur votre site, et laisser d'autres faire simplement partie de votre communauté. Les administrateurs gèrent le site, les éditeurs travaillent sur le contenu, les auteurs et contributeurs écrivent ce contenu, et les abonnés ont un profil qu'ils peuvent gérer.
    
    Media Management
    - Vous pouvez téléverser rapidement et facilement des images et des médias vers WordPress. Glissez-déposez vos médias dans l'uploader pour les ajouter à votre site. Ajoutez du texte alt et des légendes, et insérez images et galeries dans votre contenu. Il y a quelques outils d'édition d'images avec lesquels vous pouvez vous amuser.
    
    Full Standards Compliance
    - Chaque morceau de code généré par WordPress est pleinement conforme aux normes établies par le W3C.
    
    Easy Theme System
    - WordPress est livré avec trois thèmes par défaut, mais s'ils ne vous conviennent pas, il existe un répertoire de thèmes avec des milliers de thèmes pour créer un beau site.
    
    Extend with Plugins
    - Il existe un répertoire de plugins avec des milliers de plugins. Ajoutez des galeries complexes, des réseaux sociaux, des forums, des widgets de réseaux sociaux, une protection antispam, des calendriers, des contrôles SEO fins et des formulaires.
    
    Built-in Comments
    - Les outils de commentaires de WordPress vous donnent tout ce dont vous avez besoin pour être un forum de discussion et modérer cette discussion.
    
    Search Engine Optimized
    - WordPress est optimisé pour les moteurs de recherche dès la sortie de la boîte. Pour un contrôle SEO plus fin, il existe de nombreux plugins SEO.
    
    Use WordPress in Your Language
    - WordPress est disponible dans plus de 70 langues.
    
    Easy Installation and Upgrades
    
    Importers
    - WordPress est livré avec des importateurs pour Blogger, LiveJournal, Movable Type, TypePad, Tumblr et WordPress.
    
    Own Your Data
    - Utiliser WordPress signifie que personne n'a accès à votre contenu. Possédez vos données — votre site, votre contenu, vos données.
    
    Freedom
    - WordPress est sous licence GPL, créée pour protéger vos libertés.
    
    Community
    - En tant que CMS open source le plus populaire du web, WordPress dispose d'une communauté dynamique et solidaire.
    
    Contribute
    - Vous aussi pouvez être WordPress ! Aidez à construire WordPress, répondez aux questions sur les forums d'assistance, rédigez de la documentation, traduisez WordPress dans votre langue, parlez à un WordCamp, écrivez sur WordPress sur votre blog. Quelle que soit votre compétence, nous serions ravis de vous avoir !
    
    Impliquez-vous sur https://make.wordpress.org/
  upgradeDescription: |
    v1.1.23 : Init-copy de Bitnami `/opt/bitnami/wordpress` vers un emptyDir et chown 1000 afin que l'uid 1000 puisse écrire `wp-config.php`. La persistance reste uniquement sous `/bitnami/wordpress`.
    
    v1.1.22 : Init-copy de Bitnami Apache `conf/bitnami` vers un emptyDir et chown 1000 afin que l'uid 1000 puisse créer des certificats. Conserver les chemins runtime emptyDir officiels d'OpenResty et une limite d'upload de 500 Mo.
    
    v1.1.21 : Donner à OpenResty officiel des chemins runtime emptyDir inscriptibles (`/var/run/openresty`, journaux nginx) et relever la limite d'upload du proxy à 500 Mo (`client_max_body_size 500m`).
    
    v1.1.16 : Optimiser les montages de données durables sur `appCache` et améliorer les contrôles de readiness du proxy.
    
    Remplacer l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Aligner les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    v1.1.14 : Déplacer `WORDPRESS_DATABASE_PASSWORD` et `WORDPRESS_PASSWORD` dans un Kubernetes Secret (`secretKeyRef`).
    
    v1.1.13 : Conserver les données WordPress durables sur `appCache` (pas de migration appData) ; conserver l'affinité du plan de contrôle (master).
    
    WordPress 6.4.2 est maintenant disponible !
    
    Cette version mineure comporte 7 corrections de bugs dans le Core. Les correctifs incluent un bug faisant que les répertoires de feuilles de style et de thèmes renvoyaient parfois des résultats incorrects.
    
    Cette version comporte également un correctif de sécurité. Comme il s'agit d'une version de sécurité, il est recommandé de mettre à jour vos sites immédiatement.
    
    L'équipe de sécurité a traité la vulnérabilité suivante dans cette version.
    
    Une vulnérabilité d'exécution de code à distance qui n'est pas directement exploitable dans le core ; toutefois, l'équipe de sécurité estime qu'il existe un potentiel de gravité élevée lorsqu'elle est combinée à certains plugins, en particulier dans les installations multisite.
    
    Lire l'article : https://wordpress.org/news/2023/12/wordpress-6-4-2-maintenance-security-release/

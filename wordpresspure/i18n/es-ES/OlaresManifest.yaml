metadata:
  title: WordPress
  description: Herramienta de blogs, plataforma de publicación y CMS
spec:
  upgradeDescription: |
    Actualiza WordPress a 7.1.3 con la imagen oficial y PHP 8.3.36. Actualiza la base de datos automáticamente y conserva las cuentas, los ajustes, las entradas, los medios, los complementos y los temas existentes.
  fullDescription: |
    WordPress impulsa más del 43 % de la web, una cifra que crece cada día. Desde sitios sencillos y blogs hasta portales complejos, sitios empresariales e incluso aplicaciones, todo se construye con WordPress.
    
    WordPress combina simplicidad para usuarios y editores con complejidad interna para desarrolladores. Eso lo hace flexible y a la vez fácil de usar.
    
    **Estas son algunas de las funciones que creemos que te encantarán.**
    Simplicity
    
    Flexibility
    - Puedes crear cualquier tipo de sitio web que quieras: un blog o sitio personal, un photoblog, un sitio de negocio, un portfolio profesional, un sitio gubernamental, una revista o sitio de noticias, una comunidad online, incluso una red de sitios. Puedes embellecer tu sitio con temas y ampliarlo con plugins. Incluso puedes construir tu propia aplicación.
    
    Publish with Ease
    - Puedes crear Entradas y Páginas, formatearlas fácilmente, insertar medios y, con un clic, tu contenido está en vivo en la web.
    
    Publishing Tools
    - Crea borradores, programa la publicación y consulta las revisiones de tus entradas. Haz tu contenido público o privado y protege entradas y páginas con una contraseña.
    
    User Management
    - Puedes tener una variedad de colaboradores en tu sitio y dejar que otros formen parte de tu comunidad. Los administradores gestionan el sitio, los editores trabajan con el contenido, los autores y colaboradores escriben ese contenido, y los suscriptores tienen un perfil que pueden gestionar.
    
    Media Management
    - Puedes subir imágenes y medios a WordPress de forma rápida y sencilla. Arrastra y suelta tus medios en el cargador para añadirlos a tu sitio. Añade texto alt y leyendas, e inserta imágenes y galerías en tu contenido. Hay algunas herramientas de edición de imágenes con las que puedes divertirte.
    
    Full Standards Compliance
    - Cada pieza de código generada por WordPress cumple plenamente los estándares establecidos por el W3C.
    
    Easy Theme System
    - WordPress incluye tres temas predeterminados, pero si no te convencen hay un directorio de temas con miles de opciones para crear un sitio hermoso.
    
    Extend with Plugins
    - Hay un directorio de plugins con miles de plugins. Añade galerías complejas, redes sociales, foros, widgets de redes sociales, protección antispam, calendarios, controles finos de SEO y formularios.
    
    Built-in Comments
    - Las herramientas de comentarios de WordPress te dan todo lo que necesitas para ser un foro de discusión y moderar esa discusión.
    
    Search Engine Optimized
    - WordPress está optimizado para motores de búsqueda desde el primer momento. Para un control SEO más fino, hay muchos plugins SEO.
    
    Use WordPress in Your Language
    - WordPress está disponible en más de 70 idiomas.
    
    Easy Installation and Upgrades
    
    Importers
    - WordPress incluye importadores para Blogger, LiveJournal, Movable Type, TypePad, Tumblr y WordPress.
    
    Own Your Data
    - Usar WordPress significa que nadie tiene acceso a tu contenido. Sé dueño de tus datos: tu sitio, tu contenido, tus datos.
    
    Freedom
    - WordPress está licenciado bajo la GPL, creada para proteger tus libertades.
    
    Community
    - Como el CMS open source más popular de la web, WordPress tiene una comunidad vibrante y solidaria.
    
    Contribute
    - ¡Tú también puedes ser WordPress! Ayuda a construir WordPress, responde preguntas en los foros de soporte, escribe documentación, traduce WordPress a tu idioma, habla en un WordCamp, escribe sobre WordPress en tu blog. Sea cual sea tu habilidad, ¡nos encantaría contar contigo!
    
    Participa en https://make.wordpress.org/

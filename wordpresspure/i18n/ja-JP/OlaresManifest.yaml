metadata:
  title: WordPress
  description: ブログツール、パブリッシングプラットフォーム、CMS
spec:
  fullDescription: |
    WordPress は Web の 43% 以上を支え、その割合は日々増加しています。シンプルなサイトやブログから、複雑なポータル、企業サイト、さらにはアプリケーションまで、すべてが WordPress で構築されています。
    
    WordPress は、ユーザーと発行者向けのシンプルさと、開発者向けの内部の複雑さを兼ね備えています。だから柔軟でありながら使いやすいのです。
    
    **気に入っていただけると思う機能の一部です。**
    Simplicity
    
    Flexibility
    - 個人ブログやサイト、フォトブログ、ビジネスサイト、プロフェッショナルなポートフォリオ、行政サイト、雑誌やニュースサイト、オンラインコミュニティ、さらにはサイトのネットワークまで、望むどんな種類の Web サイトでも作成できます。テーマで美しくし、プラグインで拡張できます。独自のアプリケーションを構築することも可能です。
    
    Publish with Ease
    - 投稿や固定ページを作成し、簡単に整形し、メディアを挿入し、ボタンひとつでコンテンツを Web に公開できます。
    
    Publishing Tools
    - 下書きの作成、公開の予約、投稿のリビジョン確認。コンテンツを公開／非公開にし、投稿やページをパスワードで保護できます。
    
    User Management
    - サイトに多様な貢献者を置き、他の人をコミュニティの一員にできます。管理者はサイトを管理し、編集者はコンテンツを扱い、投稿者と寄稿者はそのコンテンツを書き、購読者は管理可能なプロフィールを持ちます。
    
    Media Management
    - 画像やメディアを WordPress にすばやく簡単にアップロードできます。アップローダーにドラッグ＆ドロップしてサイトに追加。代替テキストやキャプションを追加し、コンテンツに画像やギャラリーを挿入できます。楽しめる画像編集ツールもいくつかあります。
    
    Full Standards Compliance
    - WordPress が生成するコードはすべて W3C が定める標準に完全準拠しています。
    
    Easy Theme System
    - WordPress には 3 つのデフォルトテーマが同梱されていますが、合わなければ何千ものテーマがあるテーマシレクトリから美しいサイトを作れます。
    
    Extend with Plugins
    - 何千ものプラグインがあるディレクトリがあります。複雑なギャラリー、ソーシャルネットワーキング、フォーラム、ソーシャルメディアウィジェット、スパム対策、カレンダー、SEO の細かい制御、フォームなどを追加できます。
    
    Built-in Comments
    - WordPress のコメントツールは、議論の場となり、その議論をモデレートするために必要なすべてを提供します。
    
    Search Engine Optimized
    - WordPress は最初から検索エンジン向けに最適化されています。より細かい SEO 制御には、多数の SEO プラグインがあります。
    
    Use WordPress in Your Language
    - WordPress は 70 以上の言語で利用できます。
    
    Easy Installation and Upgrades
    
    Importers
    - WordPress には Blogger、LiveJournal、Movable Type、TypePad、Tumblr、WordPress 用のインポーターが付属します。
    
    Own Your Data
    - WordPress を使うということは、誰もあなたのコンテンツにアクセスできないということです。サイト、コンテンツ、データ — すべて自分のものに。
    
    Freedom
    - WordPress は、あなたの自由を守るために作られた GPL の下でライセンスされています。
    
    Community
    - Web 上で最も人気のあるオープンソース CMS として、WordPress には活気ある支援的なコミュニティがあります。
    
    Contribute
    - あなたも WordPress の一員になれます！ WordPress の構築を手伝い、サポートフォーラムで質問に答え、ドキュメントを書き、自分の言語に翻訳し、WordCamp で話し、ブログで WordPress について書く。どんなスキルでも歓迎します！
    
    https://make.wordpress.org/ で参加しましょう。
  upgradeDescription: |
    v1.1.23: Bitnami の `/opt/bitnami/wordpress` を emptyDir に init-copy し chown 1000 して、uid 1000 が `wp-config.php` を書き込めるように。永続化は `/bitnami/wordpress` のみ。
    
    v1.1.22: Bitnami Apache の `conf/bitnami` を emptyDir に init-copy し chown 1000 して、uid 1000 が証明書を作成できるように。公式 OpenResty の emptyDir ランタイムパスと 500MB アップロード上限を維持。
    
    v1.1.21: 公式 OpenResty に書き込み可能な emptyDir ランタイムパス（`/var/run/openresty`、nginx ログ）を付与し、プロキシのアップロード上限を 500MB（`client_max_body_size 500m`）に引き上げ。
    
    v1.1.16: `appCache` 上の永続データマウントを最適化し、プロキシの readiness チェックを改善。
    
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替え。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
    
    v1.1.14: `WORDPRESS_DATABASE_PASSWORD` と `WORDPRESS_PASSWORD` を Kubernetes Secret（`secretKeyRef`）へ移動。
    
    v1.1.13: 永続 WordPress データを `appCache` に維持（appData 移行なし）; コントロールプレーン（master）アフィニティを維持。
    
    WordPress 6.4.2 が利用可能になりました！
    
    このマイナーリリースには Core のバグ修正が 7 件含まれます。スタイルシートおよびテーマディレクトリが誤った結果を返すことがある問題の修正も含まれます。
    
    本リリースにはセキュリティ修正も 1 件含まれます。セキュリティリリースのため、サイトを直ちに更新することを推奨します。
    
    セキュリティチームは本リリースで次の脆弱性に対処しました。
    
    コアでは直接悪用できないリモートコード実行の脆弱性ですが、一部のプラグインと組み合わせた場合、特にマルチサイトインストールで深刻度が高まる可能性があるとセキュリティチームは判断しています。
    
    投稿を読む: https://wordpress.org/news/2023/12/wordpress-6-4-2-maintenance-security-release/

metadata:
  title: WordPress
  description: Strumento per blog, piattaforma di publishing e CMS
spec:
  upgradeDescription: |
    Aggiorna WordPress alla versione 7.1.3 con l’immagine ufficiale e PHP 8.3.36. Aggiorna automaticamente il database e mantiene gli account, le impostazioni, gli articoli, i contenuti multimediali, i plug-in e i temi esistenti.
  fullDescription: |
    WordPress alimenta più del 43 % del web, una cifra che cresce ogni giorno. Dai siti semplici ai blog, fino a portali complessi, siti enterprise e persino applicazioni, tutto è costruito con WordPress.
    
    WordPress combina semplicità per utenti ed editori con complessità sotto il cofano per gli sviluppatori. Questo lo rende flessibile e al tempo stesso facile da usare.
    
    **Ecco alcune delle funzioni che pensiamo ti piaceranno.**
    Simplicity
    
    Flexibility
    - Puoi creare qualsiasi tipo di sito web desideri: un blog o sito personale, un photoblog, un sito aziendale, un portfolio professionale, un sito governativo, una rivista o sito di notizie, una community online, persino una rete di siti. Puoi rendere bello il tuo sito con i temi e ampliarlo con i plugin. Puoi anche costruire la tua applicazione.
    
    Publish with Ease
    - Puoi creare Articoli e Pagine, formattarli facilmente, inserire media e, con un clic, i tuoi contenuti sono online.
    
    Publishing Tools
    - Crea bozze, programma la pubblicazione e consulta le revisioni degli articoli. Rendi i contenuti pubblici o privati e proteggi articoli e pagine con una password.
    
    User Management
    - Puoi avere una varietà di collaboratori sul tuo sito e lasciare che altri facciano parte della tua community. Gli amministratori gestiscono il sito, gli editori lavorano sui contenuti, autori e contributori scrivono quei contenuti, e gli iscritti hanno un profilo che possono gestire.
    
    Media Management
    - Puoi caricare immagini e media su WordPress in modo rapido e semplice. Trascina i media nell'uploader per aggiungerli al sito. Aggiungi testo alt e didascalie e inserisci immagini e gallerie nei contenuti. Ci sono alcuni strumenti di editing immagini con cui divertirti.
    
    Full Standards Compliance
    - Ogni pezzo di codice generato da WordPress è pienamente conforme agli standard definiti dal W3C.
    
    Easy Theme System
    - WordPress include tre temi predefiniti, ma se non ti piacciono c'è una directory di temi con migliaia di opzioni per creare un sito bello.
    
    Extend with Plugins
    - C'è una directory di plugin con migliaia di plugin. Aggiungi gallerie complesse, social network, forum, widget social, protezione antispam, calendari, controlli SEO raffinati e moduli.
    
    Built-in Comments
    - Gli strumenti di commento di WordPress ti danno tutto ciò che serve per essere un forum di discussione e moderare quella discussione.
    
    Search Engine Optimized
    - WordPress è ottimizzato per i motori di ricerca fin da subito. Per un controllo SEO più fine ci sono molti plugin SEO.
    
    Use WordPress in Your Language
    - WordPress è disponibile in più di 70 lingue.
    
    Easy Installation and Upgrades
    
    Importers
    - WordPress include importer per Blogger, LiveJournal, Movable Type, TypePad, Tumblr e WordPress.
    
    Own Your Data
    - Usare WordPress significa che nessuno ha accesso ai tuoi contenuti. Possiedi i tuoi dati: il tuo sito, i tuoi contenuti, i tuoi dati.
    
    Freedom
    - WordPress è concesso in licenza GPL, creata per proteggere le tue libertà.
    
    Community
    - Come CMS open source più popolare sul web, WordPress ha una community vivace e solidale.
    
    Contribute
    - Anche tu puoi essere WordPress! Aiuta a costruire WordPress, rispondi alle domande nei forum di supporto, scrivi documentazione, traduci WordPress nella tua lingua, parla a un WordCamp, scrivi di WordPress sul tuo blog. Qualunque sia la tua abilità, ci farebbe piacere averti con noi!
    
    Partecipa su https://make.wordpress.org/

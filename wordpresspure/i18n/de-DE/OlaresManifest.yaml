metadata:
  title: WordPress
  description: Blog-Tool, Publishing-Plattform und CMS
spec:
  upgradeDescription: |
    Aktualisiert WordPress auf 7.1.3 mit dem offiziellen Image und PHP 8.3.36. Die Datenbank wird automatisch aktualisiert. Bestehende Konten, Website-Einstellungen, Beiträge, Medien, Plug-ins und Themes bleiben erhalten.
  fullDescription: |
    WordPress betreibt mehr als 43 % des Webs – und die Zahl steigt jeden Tag. Alles von einfachen Websites über Blogs bis hin zu komplexen Portalen und Unternehmenswebsites und sogar Anwendungen wird mit WordPress gebaut.
    
    WordPress kombiniert Einfachheit für Benutzer und Publisher mit unter der Haube liegender Komplexität für Entwickler. Das macht es flexibel und dennoch leicht zu bedienen.
    
    **Hier sind einige der Funktionen, von denen wir denken, dass Sie sie lieben werden.**
    Simplicity
    
    Flexibility
    - Sie können jede Art von Website erstellen, die Sie möchten: einen persönlichen Blog oder eine Website, einen Photoblog, eine Unternehmenswebsite, ein professionelles Portfolio, eine Regierungswebsite, eine Magazin- oder Nachrichtenwebsite, eine Online-Community, sogar ein Netzwerk von Websites. Sie können Ihre Website mit Themes schön gestalten und mit Plugins erweitern. Sie können sogar Ihre ganz eigene Anwendung bauen.
    
    Publish with Ease
    - Sie können Beiträge und Seiten erstellen, sie einfach formatieren, Medien einfügen, und mit einem Klick ist Ihr Inhalt live im Web.
    
    Publishing Tools
    - Entwürfe erstellen, die Veröffentlichung planen und Beitragsrevisionen ansehen. Inhalte öffentlich oder privat machen und Beiträge sowie Seiten mit einem Passwort schützen.
    
    User Management
    - Sie können eine Vielzahl von Mitwirkenden auf Ihrer Website haben und andere einfach Teil Ihrer Community sein lassen. Administratoren verwalten die Site, Redakteure arbeiten mit Inhalten, Autoren und Mitwirkende schreiben diese Inhalte, und Abonnenten haben ein Profil, das sie verwalten können.
    
    Media Management
    - Sie können Bilder und Medien schnell und einfach zu WordPress hochladen. Ziehen Sie Medien per Drag-and-Drop in den Uploader, um sie Ihrer Website hinzuzufügen. Fügen Sie Alt-Text und Bildunterschriften hinzu und fügen Sie Bilder sowie Galerien in Ihre Inhalte ein. Es gibt ein paar Bildbearbeitungswerkzeuge, mit denen Sie Spaß haben können.
    
    Full Standards Compliance
    - Jedes Stück von WordPress generierter Code entspricht vollständig den vom W3C festgelegten Standards.
    
    Easy Theme System
    - WordPress wird mit drei Standard-Themes geliefert, aber wenn die nicht passen, gibt es ein Theme-Verzeichnis mit Tausenden von Themes, um eine schöne Website zu erstellen.
    
    Extend with Plugins
    - Es gibt ein Plugin-Verzeichnis mit Tausenden von Plugins. Fügen Sie komplexe Galerien, soziale Netzwerke, Foren, Social-Media-Widgets, Spamschutz, Kalender, Feineinstellungen für SEO und Formulare hinzu.
    
    Built-in Comments
    - Die Kommentar-Tools von WordPress geben Ihnen alles, was Sie brauchen, um ein Diskussionsforum zu sein und diese Diskussion zu moderieren.
    
    Search Engine Optimized
    - WordPress ist direkt nach dem Auspacken für Suchmaschinen optimiert. Für feinere SEO-Kontrolle gibt es viele SEO-Plugins.
    
    Use WordPress in Your Language
    - WordPress ist in mehr als 70 Sprachen verfügbar.
    
    Easy Installation and Upgrades
    
    Importers
    - WordPress kommt mit Importern für Blogger, LiveJournal, Movable Type, TypePad, Tumblr und WordPress.
    
    Own Your Data
    - Mit WordPress hat niemand Zugriff auf Ihre Inhalte. Besitzen Sie Ihre Daten – Ihre Website, Ihre Inhalte, Ihre Daten.
    
    Freedom
    - WordPress ist unter der GPL lizenziert, die geschaffen wurde, um Ihre Freiheiten zu schützen.
    
    Community
    - Als das beliebteste Open-Source-CMS im Web hat WordPress eine lebendige und unterstützende Community.
    
    Contribute
    - Sie können auch WordPress sein! Helfen Sie, WordPress zu bauen, beantworten Sie Fragen in den Support-Foren, schreiben Sie Dokumentation, übersetzen Sie WordPress in Ihre Sprache, sprechen Sie auf einem WordCamp, schreiben Sie über WordPress in Ihrem Blog. Welche Fähigkeiten Sie auch haben – wir würden Sie gerne dabeihaben!
    
    Engagieren Sie sich unter https://make.wordpress.org/

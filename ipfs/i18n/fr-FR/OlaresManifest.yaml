  fullDescription: |
    IPFS est un système ouvert pour gérer des données sans serveur central.
    Ceci est une interface web pour IPFS, fournie avec Kubo et ipfs-desktop.
    Consultez les statistiques de votre nœud, explorez la forêt merkle alimentée par IPLD, voyez les pairs dans le monde et gérez vos fichiers, sans toucher à la CLI.

    **NOTE IMPORTANTE**
    Si vous rencontrez une erreur indiquant « could not connect to the IPFS API » au premier démarrage d'IPFS, suivez les correctifs courants sur la page d'accueil. Pour saisir la commande CLI, allez dans ControlHub. Puis, dans le pod « ipfs », ouvrez le Terminal.
    Vous devrez peut-être soumettre votre RPC API ADDRESS : https://35853774.YOUR_OLARES_NAME.olares.com/

    **Pourquoi IPFS ?**
    Ouvert :
    - Le réseau IPFS est distribué et participatif, ce qui réduit le problème des silos de données des serveurs centraux.

    Vérifiable :
    - L'intégrité de toutes les données est vérifiée par des fonctions de hachage, pour que vous obteniez toujours les données recherchées.

    Résilient :
    - Fichiers et données peuvent être stockés sur plusieurs nœuds, gardant le contenu disponible même lors de pannes critiques.

    En savoir plus sur IPFS : https://ipfs.tech/


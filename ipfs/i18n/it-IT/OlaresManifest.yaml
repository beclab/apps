  fullDescription: |
    IPFS è un sistema aperto per gestire dati senza un server centrale.
    Questa è un'interfaccia web per IPFS, fornita con Kubo e ipfs-desktop.
    Controlla le statistiche del nodo, esplora la foresta merkle basata su IPLD, vedi i peer nel mondo e gestisci i file, senza toccare la CLI.

    **NOTA IMPORTANTE**
    Se riscontri un errore "could not connect to the IPFS API" all'avvio di IPFS per la prima volta, segui le correzioni comuni nella pagina di benvenuto. Per inserire il comando CLI, vai a ControlHub. Poi, nel pod 'ipfs', apri il Terminale.
    Potresti dover inviare il tuo RPC API ADDRESS: https://35853774.YOUR_OLARES_NAME.olares.com/

    **Perché IPFS?**
    Aperto:
    - La rete IPFS è distribuita e partecipativa, riducendo il problema dei silos di dati dei server centrali.

    Verificabile:
    - L'integrità di tutti i dati è verificata con funzioni hash, così ottieni sempre i dati che cerchi.

    Resiliente:
    - File e dati possono essere memorizzati su più nodi, mantenendo i contenuti disponibili anche durante interruzioni critiche.

    Scopri di più su IPFS: https://ipfs.tech/


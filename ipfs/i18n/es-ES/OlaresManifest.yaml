metadata:
  title: IPFS
  description: Una interfaz para un nodo IPFS Kubo
spec:
  upgradeDescription: |
    **Correcciones de errores**
    - peers: la conexión acepta multiaddrs válidos (2199) (91ff2ca)
    - pinning: actualizar logo y enlace de scaleway (2194) (b8ac64f)

    **Cambios triviales**
    - deps: subir actions/cache de 3 a 4 (2196) (e131185)
    - desactivar analíticas countly y ocultar UI no usada (2216) (d137048), cierra #2198 /github.com/ipfs/ipfs-webui/pull/2216/files#r1556085374
    - renombres omitidos (api→rpc, .io→.tech) (51b2952)
    - optimizar caché de CI (2183) (b8a71d9)
    - actualizar package-lock.json (2200) (5abc5d0)
    - eliminar estuary (b560f5c)
    - Actualizar .github/dependabot.yml [skip ci] (f847301)
    - Actualizar .github/workflows/stale.yml [skip ci] (03c1c89)

    Changelog completo en: https://github.com/ipfs/ipfs-webui/releases/tag/v4.2.1

  fullDescription: |
    IPFS es un sistema abierto para gestionar datos sin un servidor central.
    Esta es una interfaz web para IPFS, incluida con Kubo e ipfs-desktop.
    Consulte las estadísticas de su nodo, explore el bosque merkle impulsado por IPLD, vea peers en todo el mundo y gestione sus archivos, sin tocar la CLI.

    **NOTA IMPORTANTE**
    Si encuentra un error que diga "could not connect to the IPFS API" al iniciar IPFS por primera vez, siga las correcciones habituales de la página de bienvenida. Para introducir el comando CLI, vaya a ControlHub. Luego, en el pod 'ipfs', abra la Terminal.
    Puede que deba enviar su RPC API ADDRESS: https://35853774.YOUR_OLARES_NAME.olares.com/

    **¿Por qué IPFS?**
    Abierto:
    - La red IPFS es distribuida y participativa, lo que reduce el problema de los silos de datos de los servidores centrales.

    Verificable:
    - La integridad de todos los datos se verifica con funciones hash, para que siempre obtenga los datos que busca.

    Resiliente:
    - Archivos y datos pueden almacenarse en varios nodos, manteniendo el contenido disponible incluso durante interrupciones críticas.

    Más sobre IPFS en: https://ipfs.tech/


  fullDescription: |
    IPFS は中央サーバーなしでデータを管理するオープンなシステムです。
    これは Kubo および ipfs-desktop に同梱される IPFS の Web インターフェースです。
    ノードの統計を確認し、IPLD 駆動の merkle フォレストを探索し、世界中のピアを見て、CLI に触れずにファイルを管理できます。

    **重要なお知らせ**
    初回起動時に「could not connect to the IPFS API」というエラーが出た場合は、ウェルカムページの一般的な修正に従ってください。CLI コマンドを入力するには ControlHub に移動し、「ipfs」ポッドでターミナルを開いてください。
    RPC API ADDRESS の送信が必要な場合があります：https://35853774.YOUR_OLARES_NAME.olares.com/

    **なぜ IPFS か？**
    オープン：
    - IPFS ネットワークは分散型で参加型であり、中央サーバーにありがちなデータサイロ問題を軽減します。

    検証可能：
    - すべてのデータの完全性はハッシュ関数で検証されるため、常に求めるデータを取得できます。

    耐障害性：
    - ファイルとデータは複数ノードに保存でき、重大な障害時でもコンテンツを利用可能に保ちます。

    IPFS の詳細：https://ipfs.tech/


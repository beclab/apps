  fullDescription: |
    IPFS ist ein offenes System zur Datenverwaltung ohne zentralen Server.
    Dies ist eine Weboberfläche für IPFS, ausgeliefert mit Kubo und ipfs-desktop.
    Prüfen Sie Ihre Knotenstatistiken, erkunden Sie den IPLD-gestützten Merkle-Forest, sehen Sie Peers weltweit und verwalten Sie Dateien – ohne die CLI anfassen zu müssen.

    **WICHTIGER HINWEIS**
    Wenn Sie beim ersten Start von IPFS den Fehler „could not connect to the IPFS API“ sehen, folgen Sie bitte den gängigen Fixes auf der Willkommensseite. Um den CLI-Befehl einzugeben, navigieren Sie zu ControlHub. Öffnen Sie dann im Pod „ipfs“ das Terminal.
    Möglicherweise müssen Sie Ihre RPC API ADDRESS übermitteln: https://35853774.YOUR_OLARES_NAME.olares.com/

    **Warum IPFS?**
    Offen:
    - Das IPFS-Netzwerk ist verteilt und partizipativ, was das Problem von Datensilos zentraler Server verringert.

    Verifizierbar:
    - Die Integrität aller Daten wird mit Hash-Funktionen geprüft, sodass Sie immer die gesuchten Daten erhalten.

    Widerstandsfähig:
    - Dateien und Daten können über mehrere Knoten gespeichert werden, sodass Inhalte auch bei kritischen Ausfällen bereitstehen.

    Mehr über IPFS: https://ipfs.tech/


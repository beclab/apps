  title: Rembg
  description: Rembg は画像の背景を除去するツールです
spec:
  fullDescription: |
    Rembg は画像の背景を除去するツールです

    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でサービスは1つだけインストールされます。各ユーザーはデスクトップエントリをインストールしてアクセスするか、共有エントランス経由でサービス API を呼び出せます。
  upgradeDescription: |

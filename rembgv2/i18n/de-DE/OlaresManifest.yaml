spec:
  fullDescription: |
    Rembg ist ein Werkzeug zum Entfernen von Bildhintergründen

    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer kann einen Desktop-Eintrag installieren, um darauf zuzugreifen, oder den gemeinsamen Eingang nutzen, um die Service-API aufzurufen.
  upgradeDescription: |

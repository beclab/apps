  fullDescription: |
    Rembg è uno strumento per rimuovere lo sfondo delle immagini

    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Nell'intero sistema Olares verrà installato un solo servizio. Ogni utente può installare una voce desktop per accedervi oppure usare l'ingresso condiviso per chiamare l'API del servizio.

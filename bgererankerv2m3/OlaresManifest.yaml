olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: bgererankerv2m3
  icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
  description: "A multilingual model for reranking search results by relevance"
  appid: bgererankerv2m3
  title: BGE-Reranker-v2-m3
  version: '1.0.8'
  categories:
    - AI
    - models
  tags:
    - rerank
sharedEntrances:
  - name: bgererankerv2m3
    host: sharedentrances-api
    port: 0
    title: BGE-Reranker-v2-m3 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
entrances:
  - name: rerankclient
    port: 8090
    host: download-svc
    title: BGE-Reranker-v2-m3
    icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
    openMethod: window
    authLevel: internal
  - name: rerankapi
    port: 8090
    host: download-svc
    title: BGE-Reranker-v2-m3 API
    icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
    invisible: true
    openMethod: window
    authLevel: internal
#   bgererankerv2m3 — rerank-server engine Deployment (== appid / Release.Name)
#   llminit            — llm-init (ENGINE_KIND=rerank): download + API proxy
workloadReplicas:
  bgererankerv2m3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: '0.1.0'
  fullDescription: |
    BGE-Reranker-v2-m3 evaluates a search query together with a candidate document and returns a relevance score. Search applications can use these scores to reorder results after an initial search, placing more relevant passages first.

    This multilingual model is available to compatible Olares applications for search and retrieval workflows. It scores documents supplied by an application; it does not search a document collection on its own.
  developer: BAAI
  website: https://huggingface.co/BAAI/bge-reranker-v2-m3
  sourceCode: https://huggingface.co/BAAI/bge-reranker-v2-m3
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  doc: https://huggingface.co/BAAI/bge-reranker-v2-m3
  license:
    - text: Apache-2.0
      url: https://huggingface.co/BAAI/bge-reranker-v2-m3
  accelerator:
    - mode: cpu
      requiredCpu: 1350m
      limitedCpu: "4"
      requiredMemory: 3Gi
      limitedMemory: 5Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi
    - mode: nvidia
      requiredCpu: 600m
      limitedCpu: "4"
      requiredMemory: 2Gi
      limitedMemory: 4Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 4096Mi
      limitedGPUMemory: 6144Mi
    - mode: nvidia-gb10
      requiredCpu: 600m
      limitedCpu: "4"
      requiredMemory: 3Gi
      limitedMemory: 6Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi
    - mode: intel
      requiredCpu: 3500m
      limitedCpu: "8"
      requiredMemory: 5Gi
      limitedMemory: 8Gi
      requiredDisk: 5Gi
      limitedDisk: 50Gi

    - mode: intel-gpu
      requiredCpu: 3500m
      limitedCpu: "8"
      requiredMemory: 5Gi
      limitedMemory: 8Gi
      requiredDisk: 5Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 4096Mi
      limitedGPUMemory: 6144Mi

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  allowMultipleInstall: true
  LLMGatewaySupported: true
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "bge-reranker-v2-m3"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "rerank"
    options:
    - title: Rerank
      value: rerank
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error

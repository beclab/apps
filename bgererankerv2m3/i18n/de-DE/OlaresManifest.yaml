metadata:
  title: BGE-Reranker-v2-m3
  description: "Ein mehrsprachiges Modell zur Sortierung von Suchergebnissen nach Relevanz"

spec:
  fullDescription: |
    BGE-Reranker-v2-m3 bewertet eine Suchanfrage zusammen mit einem vorgeschlagenen Dokument und gibt einen Relevanzwert zurück. Suchanwendungen können diese Werte nach einer ersten Suche nutzen, um relevantere Textstellen weiter oben anzuzeigen.

    Dieses mehrsprachige Modell steht kompatiblen Olares-Anwendungen für Such- und Abrufprozesse zur Verfügung. Es bewertet die von einer Anwendung bereitgestellten Dokumente und durchsucht keine Dokumentensammlung eigenständig.

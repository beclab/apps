metadata:
  title: BGE-Reranker-v2-m3
  description: "Un modèle multilingue pour réordonner les résultats de recherche par pertinence"

spec:
  fullDescription: |
    BGE-Reranker-v2-m3 analyse une requête de recherche avec un document candidat et renvoie un score de pertinence. Les applications de recherche peuvent utiliser ces scores après une première recherche pour placer les passages les plus pertinents en tête des résultats.

    Ce modèle multilingue est accessible aux applications Olares compatibles pour leurs processus de recherche et de récupération d'informations. Il évalue les documents fournis par une application ; il ne recherche pas lui-même dans une collection de documents.

metadata:
  title: BGE-Reranker-v2-m3
  description: "A multilingual model for reranking search results by relevance"

spec:
  fullDescription: |
    BGE-Reranker-v2-m3 evaluates a search query together with a candidate document and returns a relevance score. Search applications can use these scores to reorder results after an initial search, placing more relevant passages first.

    This multilingual model is available to compatible Olares applications for search and retrieval workflows. It scores documents supplied by an application; it does not search a document collection on its own.

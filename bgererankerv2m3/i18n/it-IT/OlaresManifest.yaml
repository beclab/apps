metadata:
  title: BGE-Reranker-v2-m3
  description: "Un modello multilingue per riordinare i risultati di ricerca per pertinenza"

spec:
  fullDescription: |
    BGE-Reranker-v2-m3 valuta una query di ricerca insieme a un documento candidato e restituisce un punteggio di pertinenza. Le applicazioni di ricerca possono usare questi punteggi dopo una prima ricerca per mostrare prima i passaggi più pertinenti.

    Questo modello multilingue è disponibile per i flussi di ricerca e recupero delle informazioni delle applicazioni Olares compatibili. Valuta i documenti forniti da un'applicazione, senza cercare autonomamente in una raccolta di documenti.

metadata:
  title: Vaultwarden
  description: Alternative Bitwarden compatible server written in Rust.
spec:
  upgradeDescription: |
    v1.0.4: Upgrade Vaultwarden from 1.36.0 to 1.37.5.
    - 1.37.0 through 1.37.5 are security releases and every one of them should be applied. 1.37.0 fixes eight Medium advisories, including SSRF through the icon endpoint, cross-organization cipher access and secret sharing, an organization policy bypass on directory import, a Send access-count bypass, unauthenticated WebSocket flooding, and organization import and enumeration issues. 1.37.4 fixes one High severity organization member revocation issue (GHSA-69q9-v8p6-xvx3) plus five Medium ones covering two-factor authentication, invitations, attachments and event logs. 1.37.5 fixes two Medium issues in website icons and emergency access.
    - 1.37.5 bundles web vault v2026.10.1. It is required for web vault 2026.7.1+ to turn two-step login methods on or off and for 2026.9.0+ to take over an account through emergency access.
    - Configuration is validated strictly now: invalid values abort startup. Numeric options outside their range (for example LOGIN_RATELIMIT_MAX_BURST, TRASH_AUTO_DELETE_DAYS, EVENTS_DAYS_RETAIN or SMTP_TIMEOUT above 65535, EMAIL_ATTEMPTS_LIMIT above 255), rate-limit or database timeouts below 1, DATABASE_MIN_CONNS larger than DATABASE_MAX_CONNS, or an invalid cron expression in DUO_CONTEXT_PURGE_SCHEDULE / PURGE_INCOMPLETE_SSO_AUTH will stop the container. Review any extra environment variable you added before upgrading.
    - 1.37.0 also rejects an unrecognised DATABASE_URL instead of silently falling back to SQLite, so check that value if you use an external database.
    - This chart injects only SIGNUPS_ALLOWED, WEBSOCKET_ENABLED and ADMIN_TOKEN and adds no new variable; the existing /data volume is reused as-is.
  fullDescription: |
    Vaultwarden is an alternative Bitwarden compatible server written in Rust, compatible with upstream Bitwarden clients.

    **Features**
    A nearly complete implementation of the Bitwarden Client API is provided, including:

    - [Personal Vault](https://bitwarden.com/help/managing-items/)
    - [Send](https://bitwarden.com/help/about-send/)
    - [Attachments](https://bitwarden.com/help/attachments/)
    - [Website icons](https://bitwarden.com/help/website-icons/)
    - [Personal API Key](https://bitwarden.com/help/personal-api-key/)
    - [Organizations](https://bitwarden.com/help/getting-started-organizations/)
      - [Collections](https://bitwarden.com/help/about-collections/),
        [Password Sharing](https://bitwarden.com/help/sharing/),
        [Member Roles](https://bitwarden.com/help/user-types-access-control/),
        [Groups](https://bitwarden.com/help/about-groups/),
        [Event Logs](https://bitwarden.com/help/event-logs/),
        [Admin Password Reset](https://bitwarden.com/help/admin-reset/),
        [Directory Connector](https://bitwarden.com/help/directory-sync/),
        [Policies](https://bitwarden.com/help/policies/)
    - [Multi/Two Factor Authentication](https://bitwarden.com/help/bitwarden-field-guide-two-step-login/)
      - [Authenticator](https://bitwarden.com/help/setup-two-step-login-authenticator/),
        [Email](https://bitwarden.com/help/setup-two-step-login-email/),
        [FIDO2 WebAuthn](https://bitwarden.com/help/setup-two-step-login-fido/),
        [YubiKey](https://bitwarden.com/help/setup-two-step-login-yubikey/),
        [Duo](https://bitwarden.com/help/setup-two-step-login-duo/)
    - [Emergency Access](https://bitwarden.com/help/emergency-access/)
    - [Vaultwarden Admin Backend](https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page)
    - [Modified Web Vault client](https://github.com/dani-garcia/bw_web_builds) (Bundled within our containers)
metadata:
  title: Vaultwarden
  description: 兼容 Bitwarden 客户端的 Rust 编写的自托管服务端。
spec:
  upgradeDescription: |
    v1.0.4：Vaultwarden 从 1.36.0 升级到 1.37.5。
    - 1.37.0 到 1.37.5 全部是安全修复版本，每一个都应当应用。1.37.0 修复了 8 个中危问题，包括通过图标端点触发的 SSRF、跨组织密码项访问与密钥共享、目录导入时的组织策略绕过、Send 访问计数绕过、未认证的 WebSocket 洪水攻击，以及组织导入与枚举相关问题。1.37.4 修复 1 个高危的组织成员撤销问题（GHSA-69q9-v8p6-xvx3），以及双重验证、邀请、附件与事件日志相关的 5 个中危问题。1.37.5 修复网站图标与紧急访问的 2 个中危问题。
    - 1.37.5 内置 Web Vault v2026.10.1。Web Vault 2026.7.1+ 开启或关闭两步登录方式、以及 2026.9.0+ 通过紧急访问接管账号，都需要此版本。
    - 配置校验变严格：非法取值会直接导致启动失败。数值型选项超出范围（例如 LOGIN_RATELIMIT_MAX_BURST、TRASH_AUTO_DELETE_DAYS、EVENTS_DAYS_RETAIN 或 SMTP_TIMEOUT 超过 65535，EMAIL_ATTEMPTS_LIMIT 超过 255）、限流与数据库超时小于 1、DATABASE_MIN_CONNS 大于 DATABASE_MAX_CONNS、DUO_CONTEXT_PURGE_SCHEDULE / PURGE_INCOMPLETE_SSO_AUTH 不是合法 cron 表达式，都会让容器无法启动。升级前请检查你自行添加的环境变量。
    - 1.37.0 起，无法识别的 DATABASE_URL 会被拒绝，而不再静默回退到 SQLite。使用外部数据库的请核对该值。
    - 本 chart 仅注入 SIGNUPS_ALLOWED、WEBSOCKET_ENABLED 与 ADMIN_TOKEN，未新增变量；原有 /data 数据卷沿用不变。
  fullDescription: |
    Vaultwarden 是一款兼容 Bitwarden 客户端的自托管服务端，由 Rust 编写。

    **功能特性**
    提供几乎完整的 Bitwarden 客户端 API 实现，包括：

    - [个人保险库](https://bitwarden.com/help/managing-items/)
    - [发送（Send）](https://bitwarden.com/help/about-send/)
    - [附件](https://bitwarden.com/help/attachments/)
    - [网站图标](https://bitwarden.com/help/website-icons/)
    - [个人 API 密钥](https://bitwarden.com/help/personal-api-key/)
    - [组织功能](https://bitwarden.com/help/getting-started-organizations/)
      - [集合](https://bitwarden.com/help/about-collections/),
        [密码共享](https://bitwarden.com/help/sharing/),
        [成员角色](https://bitwarden.com/help/user-types-access-control/),
        [群组](https://bitwarden.com/help/about-groups/),
        [事件日志](https://bitwarden.com/help/event-logs/),
        [管理员重置密码](https://bitwarden.com/help/admin-reset/),
        [目录连接器](https://bitwarden.com/help/directory-sync/),
        [策略](https://bitwarden.com/help/policies/)
    - [多重/双重身份验证](https://bitwarden.com/help/bitwarden-field-guide-two-step-login/)
      - [身份验证器](https://bitwarden.com/help/setup-two-step-login-authenticator/),
        [邮箱验证](https://bitwarden.com/help/setup-two-step-login-email/),
        [FIDO2 WebAuthn](https://bitwarden.com/help/setup-two-step-login-fido/),
        [YubiKey](https://bitwarden.com/help/setup-two-step-login-yubikey/),
        [Duo](https://bitwarden.com/help/setup-two-step-login-duo/)
    - [紧急访问](https://bitwarden.com/help/emergency-access/)
    - [Vaultwarden 管理后台](https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page)
    - [已修改的 Web Vault 客户端](https://github.com/dani-garcia/bw_web_builds)（已集成在容器中）

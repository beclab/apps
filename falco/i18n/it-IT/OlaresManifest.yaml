metadata:
  title: Falco
  description: Strumento di sicurezza runtime cloud native per rilevare comportamenti anomali
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Nell'intero sistema Olares verrà installato un solo servizio. Tuttavia, ogni utente deve installare una voce desktop per accedere e usare il servizio installato dall'amministratore Olares.

    **PANORAMICA**
    Falco è uno strumento di sicurezza runtime cloud native per sistemi operativi Linux. È progettato per rilevare e segnalare in tempo reale comportamenti anomali e potenziali minacce alla sicurezza.

    Nel suo nucleo, Falco è un agente di monitoraggio e rilevamento del kernel che osserva eventi, come le syscall, in base a regole personalizzate. Falco può arricchire questi eventi integrando metadati dal runtime dei container e da Kubernetes.

    **Funzionalità**
    * Rilevamento minacce in tempo reale basato sul monitoraggio delle syscall
    * Motore di regole personalizzate per definire policy di sicurezza
    * Consapevolezza di container e Kubernetes con arricchimento metadati
    * Supporto per il driver eBPF moderno (nessun modulo kernel richiesto)
    * Sistema di plugin per estendere le sorgenti dati
    * Canali di output multipli: stdout, file, syslog, HTTP, gRPC
    * Endpoint metriche Prometheus
    * Progetto CNCF graduated usato in produzione da varie organizzazioni
    * API di health check per monitorare lo stato di Falco

    Nota: Falco è un daemon di sicurezza a livello kernel. Richiede accesso privilegiato e può avere limitazioni in ambienti container standard.
  upgradeDescription: |
    Aggiornamento a v0.43.0

    Breaking Changes:
    * fix(userspace)!: mostra il percorso di configurazione della sorgente solo nelle build di debug (3787)

    Modifiche minori:
    * Ruotata la chiave GPG usata per firmare i pacchetti DEB/RPM
    * Deprecati probe eBPF legacy, motore gVisor e gRPC (3763)

    Bugfix:
    * Evitato crash per null pointer su fallimento di popen() in output_program (3722)

    Note di rilascio complete: https://github.com/falcosecurity/falco/releases/tag/0.43.0

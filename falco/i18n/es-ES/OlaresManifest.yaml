metadata:
  title: Falco
  description: Herramienta de seguridad en tiempo de ejecución cloud native para detectar comportamiento anormal
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el administrador de Olares.

    **RESUMEN**
    Falco es una herramienta de seguridad en tiempo de ejecución cloud native para sistemas operativos Linux. Está diseñada para detectar y alertar sobre comportamientos anormales y posibles amenazas de seguridad en tiempo real.

    En su núcleo, Falco es un agente de monitorización y detección del kernel que observa eventos, como syscalls, según reglas personalizadas. Falco puede enriquecer estos eventos integrando metadatos del runtime de contenedores y Kubernetes.

    **Funciones**
    * Detección de amenazas en tiempo real basada en monitorización de syscalls
    * Motor de reglas personalizadas para definir políticas de seguridad
    * Consciente de contenedores y Kubernetes con enriquecimiento de metadatos
    * Compatibilidad con el controlador eBPF moderno (sin módulo de kernel)
    * Sistema de plugins para ampliar fuentes de datos
    * Múltiples canales de salida: stdout, archivo, syslog, HTTP, gRPC
    * Endpoint de métricas Prometheus
    * Proyecto graduado de la CNCF usado en producción por varias organizaciones
    * API de health check para monitorizar el estado de Falco

    Nota: Falco es un daemon de seguridad a nivel de kernel. Requiere acceso privilegiado y puede tener limitaciones en entornos de contenedores estándar.
  upgradeDescription: |
    Actualización a v0.43.0

    Cambios incompatibles:
    * fix(userspace)!: mostrar la ruta de configuración de origen solo en builds de depuración (3787)

    Cambios menores:
    * Se ha rotado la clave GPG usada para firmar paquetes DEB/RPM
    * Deprecación de la sonda eBPF heredada, el motor gVisor y gRPC (3763)

    Correcciones:
    * Evitar un fallo por puntero nulo ante fallo de popen() en output_program (3722)

    Notas de la versión completa: https://github.com/falcosecurity/falco/releases/tag/0.43.0

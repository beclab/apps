metadata:
  title: Falco
  description: Cloud-natives Runtime-Sicherheitstool zur Erkennung abnormalen Verhaltens
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer muss dennoch einen Desktop-Eintrag installieren, um auf den vom Olares-Admin installierten Dienst zuzugreifen und ihn zu nutzen.

    **ÜBERSICHT**
    Falco ist ein cloud-natives Runtime-Sicherheitstool für Linux-Betriebssysteme. Es erkennt und warnt in Echtzeit vor abnormalem Verhalten und potenziellen Sicherheitsbedrohungen.

    Im Kern ist Falco ein Kernel-Monitoring- und Erkennungsagent, der Ereignisse wie Syscalls anhand benutzerdefinierter Regeln beobachtet. Falco kann diese Ereignisse durch Metadaten aus der Container-Runtime und Kubernetes anreichern.

    **Funktionen**
    * Echtzeit-Bedrohungserkennung basierend auf Syscall-Monitoring
    * Benutzerdefinierte Regel-Engine für Sicherheitsrichtlinien
    * Container- und Kubernetes-bewusst mit Metadaten-Anreicherung
    * Unterstützung für modernen eBPF-Treiber (kein Kernelmodul erforderlich)
    * Plugin-System zur Erweiterung der Datenquellen
    * Mehrere Ausgabekanäle: stdout, Datei, syslog, HTTP, gRPC
    * Prometheus-Metrik-Endpunkt
    * CNCF-graduiertes Projekt, das von verschiedenen Organisationen in Produktion eingesetzt wird
    * Health-Check-API zur Überwachung des Falco-Status

    Hinweis: Falco ist ein Kernel-Level-Sicherheitsdaemon. Es benötigt privilegierte Zugriffe und kann in Standard-Containerumgebungen Einschränkungen haben.
  upgradeDescription: |
    Upgrade auf v0.43.0

    Breaking Changes:
    * fix(userspace)!: Quell-Konfigurationspfad nur in Debug-Builds anzeigen (3787)

    Kleine Änderungen:
    * Der zum Signieren von DEB/RPM-Paketen verwendete GPG-Schlüssel wurde rotiert
    * Veraltete eBPF-Probe, gVisor-Engine und gRPC als deprecated markiert (3763)

    Bugfixes:
    * Nullzeiger-Absturz bei popen()-Fehler in output_program verhindert (3722)

    Vollständige Release Notes: https://github.com/falcosecurity/falco/releases/tag/0.43.0

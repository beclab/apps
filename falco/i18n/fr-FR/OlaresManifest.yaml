metadata:
  title: Falco
  description: Outil de sécurité runtime cloud native pour détecter les comportements anormaux
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé sur l'ensemble du système Olares. Cependant, chaque utilisateur doit installer une entrée de bureau pour accéder et utiliser le service installé par l'administrateur Olares.

    **APERÇU**
    Falco est un outil de sécurité runtime cloud native pour les systèmes d'exploitation Linux. Il est conçu pour détecter et alerter en temps réel sur les comportements anormaux et les menaces de sécurité potentielles.

    Au cœur, Falco est un agent de surveillance et de détection du noyau qui observe des événements, tels que les syscalls, selon des règles personnalisées. Falco peut enrichir ces événements en intégrant des métadonnées du runtime de conteneurs et de Kubernetes.

    **Fonctionnalités**
    * Détection de menaces en temps réel basée sur la surveillance des syscalls
    * Moteur de règles personnalisées pour définir des politiques de sécurité
    * Conscience des conteneurs et de Kubernetes avec enrichissement des métadonnées
    * Prise en charge du pilote eBPF moderne (aucun module noyau requis)
    * Système de plugins pour étendre les sources de données
    * Plusieurs canaux de sortie : stdout, fichier, syslog, HTTP, gRPC
    * Point de terminaison de métriques Prometheus
    * Projet CNCF gradué utilisé en production par diverses organisations
    * API de health check pour surveiller l'état de Falco

    Note : Falco est un démon de sécurité au niveau du noyau. Il nécessite un accès privilégié et peut avoir des limitations dans les environnements de conteneurs standards.
  upgradeDescription: |
    Mise à jour vers v0.43.0

    Changements incompatibles :
    * fix(userspace) ! : afficher le chemin de configuration source uniquement dans les builds de débogage (3787)

    Changements mineurs :
    * Rotation de la clé GPG utilisée pour signer les paquets DEB/RPM
    * Dépréciation de la sonde eBPF héritée, du moteur gVisor et de gRPC (3763)

    Corrections :
    * Prévention d'un plantage par pointeur nul en cas d'échec de popen() dans output_program (3722)

    Notes de version complètes : https://github.com/falcosecurity/falco/releases/tag/0.43.0

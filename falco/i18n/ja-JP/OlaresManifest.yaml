metadata:
  title: Falco
  description: 異常な動作を検出するクラウドネイティブなランタイムセキュリティツール
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でサービスは1つだけインストールされます。ただし、各ユーザーは Olares 管理者がインストールしたサービスにアクセス・利用するためにデスクトップエントリをインストールする必要があります。

    **概要**
    Falco は Linux オペレーティングシステム向けのクラウドネイティブなランタイムセキュリティツールです。異常な動作や潜在的なセキュリティ脅威をリアルタイムで検出・アラートするよう設計されています。

    中核として、Falco はカスタムルールに基づき syscall などのイベントを観測するカーネル監視・検出エージェントです。コンテナランタイムや Kubernetes からのメタデータを統合してイベントを強化できます。

    **機能**
    * syscall 監視に基づくリアルタイム脅威検出
    * セキュリティポリシー定義のためのカスタムルールエンジン
    * メタデータ強化によるコンテナ／Kubernetes 対応
    * モダン eBPF ドライバ対応（カーネルモジュール不要）
    * データソース拡張用プラグインシステム
    * 複数の出力チャネル：stdout、ファイル、syslog、HTTP、gRPC
    * Prometheus メトリクスエンドポイント
    * さまざまな組織で本番利用される CNCF 卒業プロジェクト
    * Falco ステータス監視用ヘルスチェック API

    注意：Falco はカーネルレベルのセキュリティデーモンです。正常動作には特権アクセスが必要で、標準的なコンテナ環境では制限がある場合があります。
  upgradeDescription: |
    v0.43.0 へのアップグレード

    破壊的変更:
    * fix(userspace)!: ソース設定パスをデバッグビルドのみ表示 (3787)

    軽微な変更:
    * DEB/RPM パッケージ署名用 GPG キーをローテーション
    * レガシー eBPF プローブ、gVisor エンジン、gRPC を非推奨化 (3763)

    バグ修正:
    * output_program での popen() 失敗時のヌルポインタクラッシュを防止 (3722)

    完全なリリースノート: https://github.com/falcosecurity/falco/releases/tag/0.43.0

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      listen 2802;
      access_log /dev/stdout;
      error_log /dev/stderr;

      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 300s;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      location / {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods GET,POST,PUT,DELETE,OPTIONS;
        add_header Access-Control-Allow-Headers "deviceType,token, authorization, content-type,x-csrftoken";

        if ($request_method = 'OPTIONS') {
          add_header Access-Control-Allow-Origin *;
          add_header Access-Control-Allow-Methods GET,POST,PUT,DELETE,OPTIONS;
          add_header Access-Control-Allow-Headers "deviceType,token, authorization, content-type,x-csrftoken";
          return 204;
        }

        add_header X-Frame-Options "";
        proxy_pass http://falco-webui.falcoserver-shared:2802;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: falcoclient
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: falcoclient
  template:
    metadata:
      labels:
        io.kompose.service: falcoclient
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: falco-nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 2802
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:2802)
                  [ "$http_code" -ge 200 ] && [ "$http_code" -lt 500 ]
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 240
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty

---
apiVersion: v1
kind: Service
metadata:
  name: falcoclient
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: falcoclient
  ports:
    - name: falcoclient
      protocol: TCP
      port: 2802
      targetPort: 2802

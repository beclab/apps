olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  hindsight: 1
  hindsight-control-plane: 1

metadata:
  name: hindsight
  appid: hindsight
  title: Hindsight
  description: Persistent memory for AI agents
  icon: https://cdn.olares.com/images/2026/10/ef713eea84bc4fbe32cc61b06f92d54d.png
  version: 0.0.17
  categories:
  - Developer Tools
  - developer

entrances:
- name: hindsight
  host: hindsight-control-plane
  port: 9999
  title: Hindsight
  icon: https://cdn.olares.com/images/2026/10/ef713eea84bc4fbe32cc61b06f92d54d.png
  authLevel: private
  openMethod: window
- name: api
  host: hindsight
  port: 8888
  title: Hindsight API
  icon: https://cdn.olares.com/images/2026/10/ef713eea84bc4fbe32cc61b06f92d54d.png
  authLevel: internal
  invisible: true

spec:
  developer: Vectorize
  website: https://hindsight.vectorize.io/
  sourceCode: https://github.com/vectorize-io/hindsight
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  featuredImage: https://cdn.olares.com/images/2026/10/3a4329d0471122defaae72d7790188c2.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/3a4329d0471122defaae72d7790188c2.png
  - https://cdn.olares.com/images/2026/10/9e3793d6515a00f16682266493be5466.png
  fullDescription: |
    Hindsight is an open-source, self-hosted memory service for AI agents.
    Retain experiences, recall relevant facts and reflect over stored memories
    to produce responses grounded in previous context.

    Organize memories into banks and inspect them through the web control plane.
    Connect Hermes or another compatible client through the Hindsight API.
    PostgreSQL with pgvector stores the memory data on your Olares device.

    Before use, configure a chat model and an embedding model in Olares Router,
    or supply an OpenAI-compatible endpoint that serves both model types.
    The package uses default-chat and default-embedding by default. Supply an
    valid API key if the endpoint requires authentication. A non-empty placeholder is supplied otherwise. Model inference is
    provided by that endpoint; this package does not bundle model weights.

    The API entrance is internal by default. Configure its access policy for
    your agent before connecting. Use a dedicated memory bank for each agent
    or project. Retain and reflect speed depends on your configured models;
    background memory processing also consumes model capacity.

    This package runs Hindsight 0.10.2 with separate API and control-plane
    services, supports amd64 and arm64, and sends one text per embedding request.
  versionName: 0.10.2
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  accelerator:
  - mode: cpu
    requiredCpu: "1"
    limitedCpu: "2"
    requiredMemory: 2Gi
    limitedMemory: 4Gi
    requiredDisk: 1Gi
    limitedDisk: 5Gi

middleware:
  postgres:
    username: hindsight
    databases:
    - name: hindsight
      extensions:
      - vector

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: router
    type: application
    version: '>=1.0.0-0'
    mandatory: true

envs:
- envName: HINDSIGHT_API_LLM_API_KEY
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: Optional API key for chat and embeddings. Defaults to not-required for Router without key validation. Enter a valid key if your endpoint requires authentication.
- envName: HINDSIGHT_API_LLM_BASE_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Optional OpenAI-compatible base URL. Leave empty to use https://router.<your Olares domain>/v1 automatically.
- envName: HINDSIGHT_API_LLM_MODEL
  type: string
  required: false
  editable: true
  applyOnChange: true
  default: default-chat
  description: Chat model name. default-chat follows Router's default chat route.
- envName: HINDSIGHT_API_EMBEDDINGS_MODEL
  type: string
  required: false
  editable: true
  applyOnChange: true
  default: default-embedding
  description: Embedding model name on the same base URL.

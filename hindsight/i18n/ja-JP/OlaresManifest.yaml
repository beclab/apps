metadata:
  title: Hindsight
  description: AI エージェントのための永続的な記憶
spec:
  fullDescription: |
    Hindsight は AI エージェント向けのオープンソース記憶サービスです。経験を保存し、関連する事実を検索し、保存された記憶を分析することで、過去の文脈に基づく回答を生成できます。

    記憶を個別のバンクに整理し、Web 管理画面で確認できます。Hindsight API を通じて Hermes や互換クライアントを接続します。PostgreSQL と pgvector が Olares デバイス上に記憶データを永続化します。

    利用前に Olares Router でチャットモデルと埋め込みモデルを設定するか、両方に対応する OpenAI 互換エンドポイントを指定してください。既定のモデル名は default-chat と default-embedding です。認証が有効な場合は有効な API キーを指定してください。それ以外は空でない仮の値が自動設定されます。このパッケージにはモデルの重みは含まれません。

    API 入口は既定で内部アクセスのみです。クライアント向けのアクセス設定を行い、エージェントやプロジェクトごとに独立したバンクを使用してください。Hermes の自動記憶を無効にした後は、必要に応じて hindsight_retain、hindsight_recall、hindsight_reflect の実行を明示的に依頼できます。

    Hindsight 0.10.2 の API と管理画面は別サービスとして動作し、amd64 と arm64 に対応します。埋め込みリクエストは一度に一つのテキストを送信します。保存、分析、バックグラウンド処理の速度はモデルの処理能力に依存し、混雑や低い同時実行上限によって遅延やエラーが発生する場合があります。

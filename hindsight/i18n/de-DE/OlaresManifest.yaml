metadata:
  title: Hindsight
  description: Dauerhaftes Gedächtnis für KI-Agenten
spec:
  fullDescription: |
    Hindsight ist ein quelloffener Gedächtnisdienst für KI-Agenten. Speichern Sie Erfahrungen, rufen Sie relevante Fakten ab und analysieren Sie gespeicherte Erinnerungen, um Antworten auf früheren Kontext zu stützen.

    Organisieren Sie Erinnerungen in getrennten Speicherbanken und prüfen Sie sie in der Weboberfläche. Verbinden Sie Hermes oder einen kompatiblen Client über die Hindsight-API. PostgreSQL mit pgvector speichert die Daten dauerhaft auf Ihrem Olares-Gerät.

    Konfigurieren Sie vor der Nutzung Chat- und Embedding-Modelle in Olares Router oder einen OpenAI-kompatiblen Endpunkt für beide Modelltypen. Die Standardnamen sind default-chat und default-embedding. Bei aktivierter Authentifizierung ist ein gültiger API-Schlüssel nötig; andernfalls wird automatisch ein nicht leerer Platzhalter verwendet. Modellgewichte sind nicht enthalten.

    Der API-Zugang ist standardmäßig intern. Konfigurieren Sie den Zugriff für Ihren Client und verwenden Sie eine eigene Speicherbank pro Agent oder Projekt. Wenn die automatische Speicherung in Hermes deaktiviert ist, fordern Sie hindsight_retain, hindsight_recall oder hindsight_reflect ausdrücklich an.

    Hindsight 0.10.2 nutzt getrennte API- und Webdienste und unterstützt amd64 sowie arm64. Jede Embedding-Anfrage enthält einen Text. Speicherung, Analyse und Hintergrundverarbeitung hängen von der Modellkapazität ab; ausgelastete Endpunkte mit geringer Parallelität können langsam antworten oder Fehler verursachen.

metadata:
  title: Hindsight
  description: Mémoire persistante pour les agents IA
spec:
  fullDescription: |
    Hindsight est un service de mémoire open source pour les agents IA. Conservez des expériences, retrouvez des faits pertinents et analysez les souvenirs enregistrés pour produire des réponses fondées sur le contexte précédent.

    Organisez les souvenirs dans des banques distinctes et consultez-les dans la console web. Connectez Hermes ou un autre client compatible à l’API Hindsight. PostgreSQL avec pgvector conserve les données sur votre appareil Olares.

    Avant utilisation, configurez des modèles de conversation et d’embedding dans Olares Router, ou un endpoint compatible OpenAI proposant les deux types. Les noms par défaut sont default-chat et default-embedding. Fournissez une clé API valide si l’authentification est activée ; sinon, une valeur de substitution non vide est fournie automatiquement. Le paquet ne contient pas de poids de modèles.

    L’accès à l’API est interne par défaut. Configurez l’accès pour votre client et utilisez une banque par agent ou projet. Après désactivation de la mémoire automatique dans Hermes, demandez explicitement hindsight_retain, hindsight_recall ou hindsight_reflect selon vos besoins.

    Hindsight 0.10.2 utilise des services API et console distincts et prend en charge amd64 et arm64. Chaque requête d’embedding contient un seul texte. La conservation, la réflexion et le traitement en arrière-plan dépendent de la capacité des modèles ; un endpoint saturé ou peu concurrent peut ralentir ou échouer.

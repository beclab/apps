metadata:
  title: Hindsight
  description: Mémoire persistante pour les agents IA
spec:
  fullDescription: |
    Hindsight est un service de mémoire open source pour les agents IA. Conservez des expériences, retrouvez des faits pertinents et analysez les souvenirs enregistrés pour produire des réponses fondées sur le contexte précédent.

    Organisez les souvenirs dans des banques distinctes et consultez-les dans la console web. Connectez Hermes ou un autre client compatible à l’API Hindsight. PostgreSQL avec pgvector conserve les données sur votre appareil Olares.

    Avant utilisation, configurez des modèles de conversation et d’embedding dans Olares Router, ou un endpoint compatible OpenAI proposant les deux types. Les noms par défaut sont default-chat et default-embedding. Fournissez une clé API valide si l’authentification est activée ; sinon, une valeur de substitution non vide est fournie automatiquement. Le paquet ne contient pas de poids de modèles.

    L’accès à l’API est interne par défaut. Configurez l’accès pour votre client et utilisez une banque par agent ou projet. Après désactivation de la mémoire automatique dans Hermes, demandez explicitement hindsight_retain, hindsight_recall ou hindsight_reflect selon vos besoins.

    Hindsight 1.2.3 utilise des services API, worker et console distincts et prend en charge amd64 et arm64. Chaque requête d’embedding contient un seul texte. La conservation, la réflexion et le traitement en arrière-plan dépendent de la capacité des modèles ; un endpoint saturé ou peu concurrent peut ralentir ou échouer.
  upgradeDescription: |
    Hindsight 1.2.3 : les onglets Memories, Experience et Observations affichent de nouveau des données, et les fichiers de connaissances mal formés, atypiques ou volumineux sont ingérés sans échec, sans nouvelle tentative inutile et sans saturer la mémoire.
    Le traitement mémoire s'exécute dans son propre service worker ; la consolidation en arrière-plan n'entre plus en concurrence avec les requêtes envoyées par vos agents via l'API.
    L'usage du chat et des embeddings se règle dans Paramètres : 32 valeurs couvrent la concurrence, les nouvelles tentatives, le backoff et les délais par opération (retain, recall, reflect, consolidation) ; un modèle saturé ralentit l'application au lieu de faire échouer les opérations mémoire.
    Les souvenirs existants sont migrés sur place au démarrage. Un modèle de chat et un modèle d'embedding servis par un point de terminaison compatible OpenAI restent nécessaires.

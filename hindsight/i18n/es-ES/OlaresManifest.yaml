metadata:
  title: Hindsight
  description: Memoria persistente para agentes de IA
spec:
  fullDescription: |
    Hindsight es un servicio de memoria de código abierto para agentes de IA. Guarda experiencias, recupera hechos relevantes y analiza recuerdos almacenados para generar respuestas basadas en el contexto anterior.

    Organiza recuerdos en bancos independientes y revísalos en la consola web. Conecta Hermes u otro cliente compatible mediante la API de Hindsight. PostgreSQL con pgvector conserva los datos en tu dispositivo Olares.

    Antes de usarlo, configura modelos de chat y embeddings en Olares Router o un endpoint compatible con OpenAI que proporcione ambos tipos. Los nombres predeterminados son default-chat y default-embedding. Introduce una clave API válida si la autenticación está activada; de lo contrario se usa automáticamente un valor de relleno no vacío. Este paquete no incluye los pesos de los modelos.

    El acceso a la API es interno por defecto. Configura el acceso para tu cliente y usa un banco separado por agente o proyecto. Tras desactivar la memoria automática en Hermes, solicita explícitamente hindsight_retain, hindsight_recall o hindsight_reflect cuando lo necesites.

    Hindsight 0.10.2 ejecuta la API y la consola como servicios separados y admite amd64 y arm64. Cada solicitud de embeddings envía un solo texto. El almacenamiento, la reflexión y el procesamiento en segundo plano dependen de la capacidad del modelo; un endpoint ocupado o con poca concurrencia puede responder lentamente o fallar.

metadata:
  title: Hindsight
  description: 为 AI 智能体提供持久记忆
spec:
  fullDescription: |
    Hindsight 是面向 AI 智能体的开源记忆服务。保存经历、检索相关事实，并基于已有记忆进行分析，使回答能够参考先前的上下文。

    将记忆组织为独立的记忆库，在网页控制台中查看。通过 Hindsight API 连接 Hermes 或其他兼容客户端。PostgreSQL 和 pgvector 在你的 Olares 设备上持久保存记忆数据。

    使用前需在 Olares Router 中配置聊天模型和嵌入模型，或提供同时支持这两类模型的 OpenAI 兼容端点。默认模型名称为 default-chat 和 default-embedding。如端点启用了密钥认证，请填写有效 API 密钥；否则会自动使用非空占位值。本应用不附带模型权重。

    API 入口默认仅限内部访问。请为目标客户端配置访问策略，并为不同智能体或项目使用独立记忆库。在 Hermes 中关闭自动记忆后，可按需明确要求调用 hindsight_retain、hindsight_recall 或 hindsight_reflect。

    本应用运行 Hindsight 0.10.2，API 与控制台分别部署，支持 amd64 和 arm64。每次嵌入请求仅发送一条文本。保存、分析与后台处理速度取决于模型服务容量；端点繁忙或并发限制较低时，可能出现响应缓慢或失败。

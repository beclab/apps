metadata:
  title: Hindsight
  description: Memoria persistente per agenti IA
spec:
  fullDescription: |
    Hindsight è un servizio di memoria open source per agenti IA. Conserva esperienze, recupera fatti rilevanti e analizza i ricordi salvati per generare risposte basate sul contesto precedente.

    Organizza i ricordi in banchi separati e consultali nella console web. Collega Hermes o un altro client compatibile tramite l’API Hindsight. PostgreSQL con pgvector conserva i dati sul tuo dispositivo Olares.

    Prima dell’uso, configura modelli di chat ed embedding in Olares Router oppure un endpoint compatibile con OpenAI che offra entrambi i tipi. I nomi predefiniti sono default-chat e default-embedding. Se l’autenticazione è attiva, fornisci una chiave API valida; altrimenti viene usato automaticamente un valore segnaposto non vuoto. Il pacchetto non include i pesi dei modelli.

    L’accesso all’API è interno per impostazione predefinita. Configura l’accesso per il client e usa un banco distinto per ogni agente o progetto. Dopo aver disattivato la memoria automatica in Hermes, richiedi esplicitamente hindsight_retain, hindsight_recall o hindsight_reflect quando serve.

    Hindsight 1.2.3 esegue API, worker e console come servizi separati e supporta amd64 e arm64. Ogni richiesta di embedding invia un solo testo. Conservazione, riflessione ed elaborazione in background dipendono dalla capacità dei modelli; un endpoint occupato o con bassa concorrenza può risultare lento o generare errori.
  upgradeDescription: |
    Hindsight 1.2.3: le schede Memories, Experience e Observations mostrano di nuovo i dati, e i file di conoscenza malformati, insoliti o di grandi dimensioni vengono importati senza errori, senza nuovi tentativi inutili e senza esaurire la memoria.
    L'elaborazione della memoria viene eseguita in un servizio worker dedicato: la consolidazione in background non compete più con le richieste che i tuoi agenti inviano tramite API.
    L'uso di chat ed embedding si regola in Impostazioni: 32 valori coprono concorrenza, nuovi tentativi, backoff e limiti di tempo per operazione (retain, recall, reflect, consolidazione); un modello saturo rallenta l'app invece di far fallire le operazioni di memoria.
    I ricordi esistenti vengono migrati in loco all'avvio. Servono ancora un modello chat e uno embedding dietro un endpoint compatibile con OpenAI.

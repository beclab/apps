metadata:
  title: Hindsight
  description: Memoria persistente per agenti IA
spec:
  fullDescription: |
    Hindsight è un servizio di memoria open source per agenti IA. Conserva esperienze, recupera fatti rilevanti e analizza i ricordi salvati per generare risposte basate sul contesto precedente.

    Organizza i ricordi in banchi separati e consultali nella console web. Collega Hermes o un altro client compatibile tramite l’API Hindsight. PostgreSQL con pgvector conserva i dati sul tuo dispositivo Olares.

    Prima dell’uso, configura modelli di chat ed embedding in Olares Router oppure un endpoint compatibile con OpenAI che offra entrambi i tipi. I nomi predefiniti sono default-chat e default-embedding. Se l’autenticazione è attiva, fornisci una chiave API valida; altrimenti viene usato automaticamente un valore segnaposto non vuoto. Il pacchetto non include i pesi dei modelli.

    L’accesso all’API è interno per impostazione predefinita. Configura l’accesso per il client e usa un banco distinto per ogni agente o progetto. Dopo aver disattivato la memoria automatica in Hermes, richiedi esplicitamente hindsight_retain, hindsight_recall o hindsight_reflect quando serve.

    Hindsight 0.10.2 esegue API e console come servizi separati e supporta amd64 e arm64. Ogni richiesta di embedding invia un solo testo. Conservazione, riflessione ed elaborazione in background dipendono dalla capacità dei modelli; un endpoint occupato o con bassa concorrenza può risultare lento o generare errori.

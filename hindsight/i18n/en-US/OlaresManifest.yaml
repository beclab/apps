metadata:
  title: Hindsight
  description: Persistent memory for AI agents
spec:
  fullDescription: |
    Hindsight is an open-source memory service for AI agents. Retain experiences, recall relevant facts and reflect over stored memories to produce responses grounded in previous context.

    Organize memories into banks and inspect them in the web control plane. Connect Hermes or another compatible client through the Hindsight API. PostgreSQL with pgvector persists the memory data on your Olares device.

    Before use, configure chat and embedding models in Olares Router, or supply an OpenAI-compatible endpoint serving both model types. The defaults are default-chat and default-embedding. Supply a valid API key if authentication is enabled; otherwise a non-empty placeholder is supplied automatically. This package does not bundle model weights.

    The API entrance is internal by default. Configure access for your intended client and use a separate bank for each agent or project. After disabling automatic memory in Hermes, explicitly request hindsight_retain, hindsight_recall or hindsight_reflect when needed.

    Hindsight 0.10.2 runs separate API and control-plane services on amd64 and arm64. Embedding batch size is one. Retain, reflect and background processing depend on model capacity; a busy or low-concurrency endpoint can cause slow responses or failures.

metadata:
  title: Hindsight
  description: Persistent memory for AI agents
spec:
  fullDescription: |
    Hindsight is an open-source memory service for AI agents. Retain experiences, recall relevant facts and reflect over stored memories to produce responses grounded in previous context.

    Organize memories into banks and inspect them in the web control plane. Connect Hermes or another compatible client through the Hindsight API. PostgreSQL with pgvector persists the memory data on your Olares device.

    Before use, configure chat and embedding models in Olares Router, or supply an OpenAI-compatible endpoint serving both model types. The defaults are default-chat and default-embedding. Supply a valid API key if authentication is enabled; otherwise a non-empty placeholder is supplied automatically. This package does not bundle model weights.

    The API entrance is internal by default. Configure access for your intended client and use a separate bank for each agent or project. After disabling automatic memory in Hermes, explicitly request hindsight_retain, hindsight_recall or hindsight_reflect when needed.

    Hindsight 1.2.3 runs separate API, worker and control-plane services on amd64 and arm64. Embedding batch size is one. Retain, reflect and background processing depend on model capacity; a busy or low-concurrency endpoint can cause slow responses or failures.
  upgradeDescription: |
    Hindsight 1.2.3. The Memories, Experience and Observations tabs show data again, and knowledge
    files that are malformed, unusual or large are ingested without failing, without needless
    retries, and without exhausting memory.
    Memory processing now runs in its own worker service, so background consolidation no longer
    competes with the requests your agents send through the API.
    Chat and embedding use is tunable in Settings: 32 values cover concurrency, retries, backoff
    and time limits for retain, recall, reflect and consolidation, so a busy model endpoint slows
    the app down instead of making memory operations fail.
    Existing memories are migrated in place at startup. The app still needs a chat model and an
    embedding model served by one OpenAI-compatible endpoint.

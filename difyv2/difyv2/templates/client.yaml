---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
        listen 8080;
        access_log /dev/stdout;
        error_log  /dev/stderr;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    600s;

        proxy_http_version 1.1;

        proxy_set_header Host                       $host;
        proxy_set_header X-Forwarded-Host           $http_host;
        proxy_set_header Authorization              $http_authorization;
        proxy_set_header Cookie                     $http_cookie;
        proxy_set_header X-Original-Forwarded-For  $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto         $scheme;
        proxy_set_header X-Real-IP                 $remote_addr;

        proxy_set_header Upgrade                    $http_upgrade;
        proxy_set_header Connection                 "upgrade";

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods    "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers    "Authorization, Content-Type, X-Requested-With, userid, token, X-CSRF-Token" always;
        add_header Access-Control-Expose-Headers   "Content-Length, Content-Range" always;
        add_header Access-Control-Max-Age          86400 always;

        location / {
            resolver coredns.kube-system.svc.cluster.local valid=10s;
            proxy_pass http://dify.difyv2server-shared:80;

            add_header X-Frame-Options "";

            proxy_next_upstream error timeout http_502 http_503 http_504 http_403;
            proxy_next_upstream_tries 3;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $http_origin always;
                add_header Access-Control-Allow-Credentials 'true' always;
                add_header Access-Control-Allow-Methods    "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers    "Authorization, Content-Type, X-Requested-With, userid, token, X-CSRF-Token" always;
                add_header Access-Control-Max-Age          86400 always;
                add_header Content-Length 0;
                add_header Content-Type 'text/plain charset=UTF-8';
                return 204;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: client
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: client
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: client
    spec:
      initContainers:
        - name: check-ready-backend
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for backend service to be ready..."
              for i in $(seq 1 60); do
                if nc -z dify.difyv2server-shared 80; then
                  echo "Backend port is open, checking HTTP response..."
                  # Accept any HTTP status code (2xx, 3xx, 4xx, 5xx) as long as we get a response
                  if wget -q --spider --timeout=5 --max-redirect=0 http://dify.difyv2server-shared:80/ 2>/dev/null || \
                     wget -q --spider --timeout=5 http://dify.difyv2server-shared:80/ 2>/dev/null; then
                    echo "Backend is ready!"
                    exit 0
                  fi
                fi
                echo "Waiting for backend... ($i/60)"
                sleep 5
              done
              echo "Backend did not become ready in time"
              exit 1
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: client
  ports:
    - name: client
      protocol: TCP
      port: 8080
      targetPort: 8080

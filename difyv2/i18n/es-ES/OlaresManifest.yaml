  title: Dify Shared
  description: El motor de innovación para aplicaciones GenAI
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una versión compartida de Dify. Solo se instalará un servicio en todo el sistema Olares. Aun así, cada usuario debe instalar una entrada de escritorio para acceder al servicio instalado por el Olares Admin.

    Tras la instalación, todos en este clúster Olares pueden usar la misma aplicación. Esta configuración compartida facilita compartir información, reduce el mantenimiento y usa menos recursos.

    **Nota de migración**
    Si usa una versión antigua de Dify, puede entrar en conflicto con Dify v1.0 o posterior. Recomendamos respaldar los datos, desinstalar la versión antigua e instalar esta versión más reciente.

    **RESUMEN**
    Dify es una plataforma open source de desarrollo de apps LLM. Su interfaz intuitiva combina flujo de trabajo de IA, pipeline RAG, capacidades de agente, gestión de modelos, observabilidad y más, para pasar del prototipo a producción. Funciones principales:

    1. Workflow: Construya y pruebe potentes flujos de IA en un lienzo visual, aprovechando todas las funciones siguientes y más.

    2. Soporte integral de modelos: Integración fluida con cientos de LLM propietarios / open source de docenas de proveedores de inferencia y soluciones autoalojadas, cubriendo GPT, Mistral, Llama3 y cualquier modelo compatible con la API de OpenAI. La lista completa de proveedores está aquí.

    3. Prompt IDE: Interfaz intuitiva para crear prompts, comparar el rendimiento de modelos y añadir funciones como text-to-speech a una app de chat.

    4. Pipeline RAG: Amplias capacidades RAG desde la ingestión de documentos hasta la recuperación, con soporte listo para usar de extracción de texto de PDF, PPT y otros formatos habituales.

    5. Capacidades de agente: Defina agentes basados en LLM Function Calling o ReAct y añada herramientas predefinidas o personalizadas. Dify ofrece más de 50 herramientas integradas para agentes de IA, como Google Search, DELL·E, Stable Diffusion y WolframAlpha.

    6. LLMOps: Supervise y analice registros y rendimiento de la aplicación a lo largo del tiempo. Mejore continuamente prompts, conjuntos de datos y modelos a partir de datos de producción y anotaciones.

    7. Backend-as-a-Service: Todas las ofertas de Dify tienen APIs correspondientes, para integrar Dify fácilmente en su lógica de negocio.
  upgradeDescription: |
    Actualización a Dify v1.13.3 - Mejoras de estabilidad y corrección

    **Nuevas funciones**

    - **Parámetros de modelo con referencia a variables:** Añadido soporte de referencia a variables para parámetros de modelo en nodos LLM, Question Classifier y Variable Extractor, permitiendo la configuración dinámica en workflows.

    **Correcciones de errores**

    - **Fiabilidad del streaming:** Corregidos problemas de replay y concurrencia de StreamsBroadcastChannel para mantener estable la entrega de eventos frontend/backend.
    - **Editor de workflows:** Corregido que los nodos pegados conservaran metadatos Loop/Iteration; se evitó pegar nodos HumanInput en contenedores inválidos.
    - **Ejecución en tiempo de ejecución:** Restaurada la lógica de transformación de mensajes de prompt; corregido el manejo de max_retries=0 en ejecución HTTP Request impulsada por el executor.
    - **Recuperación de conocimiento:** Conservados metadatos de citas en respuestas web; corregidos fallos cuando faltan metadatos de icono del dataset; corregido el filtrado de consultas de hit-count; restauradas vistas previas de chunks indexados.

    **Correcciones de empaquetado Olares**

    - Corregido que Worker se ejecutara en modo API (MODE=api) en lugar de Celery worker, lo que dejaba el procesamiento de documentos de la base de conocimiento en cola.
    - Añadida configuración WEAVIATE_GRPC_ENDPOINT para que la ingestión por lotes gRPC de Weaviate funcione correctamente, resolviendo documentos atascados al 0% durante el embedding.
    - Reducido el tamaño del pool de conexiones a la base de datos (SQLALCHEMY_POOL_SIZE) para ajustarse a los límites de la base compartida de Olares.

    **Otras mejoras**

    - Sandbox actualizado a 0.2.14, plugin daemon a 0.5.3
    - Varias refactorizaciones y optimizaciones de rendimiento en la plataforma

    Ver nota de versión completa en: https://github.com/langgenius/dify/releases/tag/1.13.3

metadata:
  title: Dify Shared
  description: Il motore di innovazione per applicazioni GenAI
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è una versione condivisa di Dify. Nell'intero sistema Olares verrà installato un solo servizio. Ogni utente deve comunque installare una voce desktop per accedere al servizio installato dall'Olares Admin.

    Dopo l'installazione, tutti su questo cluster Olares possono usare la stessa applicazione. Questa configurazione condivisa facilita la condivisione delle informazioni, riduce la manutenzione e usa meno risorse.

    **Nota di migrazione**
    Se usi una versione precedente di Dify, potrebbe entrare in conflitto con Dify v1.0 o successive. Consigliamo di fare backup dei dati, disinstallare la vecchia versione e poi installare questa versione più recente.

    **PANORAMICA**
    Dify è una piattaforma open source per lo sviluppo di app LLM. L'interfaccia intuitiva combina workflow AI, pipeline RAG, capacità agent, gestione modelli, osservabilità e altro, per passare rapidamente dal prototipo alla produzione. Funzionalità principali:

    1. Workflow: Costruisci e testa potenti workflow AI su un canvas visuale, sfruttando tutte le funzionalità seguenti e oltre.

    2. Supporto completo dei modelli: Integrazione fluida con centinaia di LLM proprietari / open source da dozzine di provider di inferenza e soluzioni self-hosted, coprendo GPT, Mistral, Llama3 e qualsiasi modello compatibile OpenAI API. L'elenco completo dei provider è qui.

    3. Prompt IDE: Interfaccia intuitiva per creare prompt, confrontare le prestazioni dei modelli e aggiungere funzioni come text-to-speech a un'app basata su chat.

    4. Pipeline RAG: Ampie capacità RAG dall'ingestione documenti al retrieval, con supporto out-of-the-box per estrazione testo da PDF, PPT e altri formati comuni.

    5. Capacità Agent: Definisci agent basati su LLM Function Calling o ReAct e aggiungi tool predefiniti o personalizzati. Dify offre oltre 50 tool integrati per AI agent, come Google Search, DELL·E, Stable Diffusion e WolframAlpha.

    6. LLMOps: Monitora e analizza log e prestazioni dell'applicazione nel tempo. Migliora continuamente prompt, dataset e modelli in base a dati di produzione e annotazioni.

    7. Backend-as-a-Service: Tutte le offerte Dify hanno API corrispondenti, così puoi integrare Dify facilmente nella tua logica di business.
  upgradeDescription: |
    Upgrade a Dify v1.13.3 - Miglioramenti di stabilità e correttezza

    **Nuove funzionalità**

    - **Parametri modello con riferimento a variabili:** Aggiunto supporto al riferimento variabili per i parametri modello nei nodi LLM, Question Classifier e Variable Extractor, consentendo la configurazione dinamica nei workflow.

    **Correzioni di bug**

    - **Affidabilità dello streaming:** Risolti problemi di replay e concorrenza di StreamsBroadcastChannel per mantenere stabile la consegna eventi frontend/backend.
    - **Editor workflow:** Corretto il fatto che i nodi incollati trattenessero metadati Loop/Iteration; impedito l'incolla di nodi HumanInput in container non validi.
    - **Esecuzione runtime:** Ripristinata la logica di trasformazione dei messaggi prompt; corretto il handling di max_retries=0 per l'esecuzione HTTP Request guidata dall'executor.
    - **Knowledge Retrieval:** Conservati i metadati di citazione nelle risposte web; corretti crash quando mancano metadati icona dataset; corretto il filtro query hit-count; ripristinate le anteprime dei chunk documentali indicizzati.

    **Fix di packaging Olares**

    - Corretto Worker in esecuzione in modalità API (MODE=api) invece di Celery worker, che lasciava l'elaborazione documenti della knowledge base bloccata in coda.
    - Aggiunta configurazione WEAVIATE_GRPC_ENDPOINT così l'ingestione batch gRPC Weaviate funziona correttamente, risolvendo documenti bloccati allo 0% durante l'embedding.
    - Ridotta la dimensione del pool di connessioni al database (SQLALCHEMY_POOL_SIZE) per rientrare nei limiti della DB condivisa Olares.

    **Altri miglioramenti**

    - Sandbox aggiornato a 0.2.14, plugin daemon a 0.5.3
    - Vari refactoring e ottimizzazioni delle prestazioni sulla piattaforma

    Note di rilascio complete: https://github.com/langgenius/dify/releases/tag/1.13.3

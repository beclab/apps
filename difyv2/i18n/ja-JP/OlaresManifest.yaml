metadata:
  title: Dify Shared
  description: GenAI アプリケーションのためのイノベーションエンジン
spec:
  fullDescription: |
    **重要なお知らせ**
    これは Dify の共有バージョンです。Olares システム全体にインストールされるサービスは 1 つだけです。ただし、各ユーザーは Olares Admin がインストールしたサービスにアクセスするためデスクトップエントリをインストールする必要があります。

    インストール後、この Olares クラスター上の全員が同じアプリケーションを使えます。共有セットアップにより情報共有が容易になり、保守作業とリソース使用も減らせます。

    **移行に関する注意**
    古いバージョンの Dify を使っている場合、Dify v1.0 以降と衝突する可能性があります。データのバックアップ、旧バージョンのアンインストール、その後この最新版のインストールを推奨します。

    **概要**
    Dify はオープンソースの LLM アプリ開発プラットフォームです。直感的な UI が AI ワークフロー、RAG パイプライン、エージェント能力、モデル管理、オブザーバビリティなどを組み合わせ、プロトタイプから本番へ素早く進めます。主な機能:

    1. ワークフロー: ビジュアルキャンバスで強力な AI ワークフローを構築・テストし、以下の機能などを活用。

    2. 包括的なモデルサポート: 数十の推論プロバイダーおよびセルフホストソリューションからの数百のプロプライエタリ／オープンソース LLM とシームレス統合。GPT、Mistral、Llama3、OpenAI API 互換モデルをカバー。対応プロバイダーの完全一覧はこちら。

    3. プロンプト IDE: プロンプト作成、モデル性能比較、チャットアプリへの text-to-speech などの追加機能向け直感的 UI。

    4. RAG パイプライン: ドキュメント取り込みから検索まで広範な RAG。PDF、PPT など一般的な形式からのテキスト抽出を標準サポート。

    5. エージェント機能: LLM Function Calling または ReAct に基づくエージェントを定義し、組み込みまたはカスタムツールを追加。Google Search、DELL·E、Stable Diffusion、WolframAlpha など 50 以上の組み込みツール。

    6. LLMOps: アプリログと性能を継続監視・分析。本番データとアノテーションに基づきプロンプト、データセット、モデルを改善。

    7. Backend-as-a-Service: Dify の全機能に対応 API があり、自社ビジネスロジックへ容易に統合可能。
  upgradeDescription: |
    Dify v1.13.3 へアップグレード - 安定性と正しさの改善

    **新機能**

    - **変数参照モデルパラメータ:** LLM、Question Classifier、Variable Extractor ノードのモデルパラメータに変数参照対応を追加し、ワークフロー内で動的設定可能に。

    **バグ修正**

    - **ストリーミング信頼性:** StreamsBroadcastChannel のリプレイと同時実行の問題を修正し、フロント／バックエンドのイベント配信を安定化。
    - **ワークフローエディタ:** 貼り付けノードが Loop/Iteration メタデータを保持する問題を修正；HumanInput ノードの無効コンテナへの貼り付けを防止。
    - **ランタイム実行:** プロンプトメッセージ変換ロジックを復元；executor 駆動 HTTP Request の max_retries=0 処理を修正。
    - **ナレッジ検索:** Web 応答の引用メタデータを保持；データセットアイコンメタデータ欠落時のクラッシュを修正；ヒット数クエリフィルタを修正；インデックス済みドキュメントチャンクのプレビューを復元。

    **Olares パッケージ修正**

    - Worker が Celery worker ではなく API モード（MODE=api）で動いていた問題を修正。ナレッジベース文書処理が queued のまま止まる原因だった。
    - WEAVIATE_GRPC_ENDPOINT 設定を追加し、Weaviate gRPC バッチ取り込みを正しく動作させ、埋め込み中 0% で止まる問題を解消。
    - Olares 共有 DB 接続上限に収めるため、データベース接続プールサイズ（SQLALCHEMY_POOL_SIZE）を削減。

    **その他の改善**

    - Sandbox を 0.2.14、plugin daemon を 0.5.3 にアップグレード
    - 複数のリファクタリングと性能最適化

    リリースノート全文: https://github.com/langgenius/dify/releases/tag/1.13.3

metadata:
  title: Dify Shared
  description: Die Innovations-Engine für GenAI-Anwendungen
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-Version von Dify. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer muss dennoch einen Desktop-Eintrag installieren, um den vom Olares Admin installierten Dienst zu nutzen.

    Nach der Installation können alle auf diesem Olares-Cluster dieselbe Anwendung nutzen. Das Shared-Setup erleichtert den Informationsaustausch, reduziert Wartungsaufwand und spart Ressourcen.

    **Migrationshinweis**
    Wenn Sie eine ältere Version von Dify nutzen, kann sie mit Dify v1.0 oder neuer kollidieren. Wir empfehlen, Daten zu sichern, die alte Version zu deinstallieren und dann diese neueste Version zu installieren.

    **ÜBERBLICK**
    Dify ist eine Open-Source-LLM-App-Entwicklungsplattform. Die intuitive Oberfläche kombiniert AI-Workflow, RAG-Pipeline, Agent-Fähigkeiten, Modellverwaltung, Observability und mehr — vom Prototyp zur Produktion. Kernfunktionen:

    1. Workflow: Leistungsstarke AI-Workflows auf einer visuellen Canvas erstellen und testen — mit allen folgenden Funktionen und mehr.

    2. Umfassende Modellunterstützung: Nahtlose Integration mit Hunderten proprietärer / Open-Source-LLMs von Dutzenden Inference-Anbietern und Self-Hosted-Lösungen — GPT, Mistral, Llama3 und beliebige OpenAI-API-kompatible Modelle. Die vollständige Liste unterstützter Anbieter finden Sie hier.

    3. Prompt-IDE: Intuitive Oberfläche zum Erstellen von Prompts, Vergleichen der Modellleistung und Hinzufügen von Funktionen wie Text-to-Speech zu Chat-Apps.

    4. RAG-Pipeline: Umfangreiche RAG-Fähigkeiten von Dokumentaufnahme bis Abruf, mit Out-of-the-Box-Unterstützung für Textextraktion aus PDFs, PPTs und anderen gängigen Formaten.

    5. Agent-Fähigkeiten: Agenten basierend auf LLM Function Calling oder ReAct definieren und vorgefertigte oder eigene Tools hinzufügen. Dify bietet über 50 eingebaute Tools für AI-Agenten, z. B. Google Search, DELL·E, Stable Diffusion und WolframAlpha.

    6. LLMOps: Anwendungsprotokolle und Leistung im Zeitverlauf überwachen und analysieren. Prompts, Datensätze und Modelle anhand von Produktionsdaten und Annotationen kontinuierlich verbessern.

    7. Backend-as-a-Service: Alle Angebote von Dify haben entsprechende APIs, sodass Sie Dify mühelos in Ihre Geschäftslogik integrieren können.
  upgradeDescription: |
    Upgrade auf Dify v1.13.3 - Verbesserungen an Stabilität und Korrektheit

    **Neue Funktionen**

    - **Variable-Reference-Modellparameter:** Variablenreferenz-Unterstützung für Modellparameter in LLM-, Question-Classifier- und Variable-Extractor-Nodes hinzugefügt, für dynamische Modellkonfiguration in Workflows.

    **Fehlerbehebungen**

    - **Streaming-Zuverlässigkeit:** StreamsBroadcastChannel-Replay- und Parallelitätsprobleme behoben, damit Frontend/Backend-Event-Zustellung stabil bleibt.
    - **Workflow-Editor:** Behoben, dass eingefügte Nodes Loop/Iteration-Metadaten behielten; Einfügen von HumanInput-Nodes in ungültige Container verhindert.
    - **Laufzeitausführung:** Prompt-Nachrichten-Transformationslogik wiederhergestellt; max_retries=0-Behandlung für executor-getriebene HTTP-Request-Ausführung korrigiert.
    - **Wissensabruf:** Zitationsmetadaten in Web-Antworten erhalten; Abstürze bei fehlenden Dataset-Icon-Metadaten behoben; Hit-Count-Query-Filterung korrigiert; Vorschauen indexierter Dokument-Chunks wiederhergestellt.

    **Olares-Paketierungsfixes**

    - Behoben, dass Worker im API-Modus (MODE=api) statt als Celery-Worker lief, wodurch Wissensbasis-Dokumentverarbeitung im Warteschlangenstatus stecken blieb.
    - WEAVIATE_GRPC_ENDPOINT-Konfiguration hinzugefügt, damit Weaviate-gRPC-Batch-Ingestion korrekt funktioniert und Dokumente nicht bei 0 % während des Embeddings stecken bleiben.
    - Datenbank-Connection-Pool-Größe (SQLALCHEMY_POOL_SIZE) reduziert, um in Olares-Shared-DB-Verbindungslimits zu passen.

    **Weitere Verbesserungen**

    - Sandbox auf 0.2.14, Plugin-Daemon auf 0.5.3 aktualisiert
    - Mehrere Refactorings und Leistungsoptimierungen auf der Plattform

    Vollständige Release Notes: https://github.com/langgenius/dify/releases/tag/1.13.3

metadata:
  title: Dify Shared
  description: Le moteur d'innovation pour les applications GenAI
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une version partagée de Dify. Un seul service sera installé sur l'ensemble du système Olares. Chaque utilisateur doit néanmoins installer une entrée bureau pour accéder au service installé par l'Olares Admin.

    Après installation, tout le monde sur ce cluster Olares peut utiliser la même application. Cette configuration partagée facilite le partage d'informations, réduit la maintenance et utilise moins de ressources.

    **Note de migration**
    Si vous utilisez une ancienne version de Dify, elle peut entrer en conflit avec Dify v1.0 ou ultérieur. Nous recommandons de sauvegarder vos données, de désinstaller l'ancienne version, puis d'installer cette dernière version.

    **APERÇU**
    Dify est une plateforme open source de développement d'apps LLM. Son interface intuitive combine workflow IA, pipeline RAG, capacités d'agent, gestion des modèles, observabilité et plus, pour passer rapidement du prototype à la production. Fonctionnalités principales :

    1. Workflow : Construisez et testez de puissants workflows IA sur un canevas visuel, en tirant parti de toutes les fonctionnalités suivantes et au-delà.

    2. Support complet des modèles : Intégration fluide avec des centaines de LLM propriétaires / open source de dizaines de fournisseurs d'inférence et solutions auto-hébergées, couvrant GPT, Mistral, Llama3 et tout modèle compatible API OpenAI. La liste complète des fournisseurs est ici.

    3. Prompt IDE : Interface intuitive pour créer des prompts, comparer les performances des modèles et ajouter des fonctions comme text-to-speech à une app de chat.

    4. Pipeline RAG : Vastes capacités RAG de l'ingestion de documents à la récupération, avec extraction de texte prête à l'emploi depuis PDF, PPT et autres formats courants.

    5. Capacités d'agent : Définissez des agents basés sur LLM Function Calling ou ReAct, et ajoutez des outils préintégrés ou personnalisés. Dify fournit plus de 50 outils intégrés pour agents IA, comme Google Search, DELL·E, Stable Diffusion et WolframAlpha.

    6. LLMOps : Surveillez et analysez les journaux et performances de l'application dans le temps. Améliorez en continu prompts, jeux de données et modèles à partir des données de production et annotations.

    7. Backend-as-a-Service : Toutes les offres Dify disposent d'API correspondantes, pour intégrer Dify facilement dans votre logique métier.
  upgradeDescription: |
    Mise à niveau vers Dify v1.13.3 - Améliorations de stabilité et de correction

    **Nouvelles fonctionnalités**

    - **Paramètres de modèle avec référence de variables :** Ajout du support de référence de variables pour les paramètres de modèle dans les nœuds LLM, Question Classifier et Variable Extractor, permettant une configuration dynamique dans les workflows.

    **Corrections de bugs**

    - **Fiabilité du streaming :** Correction des problèmes de replay et de concurrence de StreamsBroadcastChannel pour stabiliser la livraison d'événements frontend/backend.
    - **Éditeur de workflow :** Correction des nœuds collés conservant des métadonnées Loop/Iteration ; empêchement du collage de nœuds HumanInput dans des conteneurs invalides.
    - **Exécution runtime :** Restauration de la logique de transformation des messages prompt ; correction de la gestion max_retries=0 pour l'exécution HTTP Request pilotée par l'executor.
    - **Récupération de connaissances :** Conservation des métadonnées de citation dans les réponses web ; correction des plantages lorsque les métadonnées d'icône du dataset manquent ; correction du filtrage des requêtes hit-count ; restauration des aperçus de chunks de documents indexés.

    **Corrections d'empaquetage Olares**

    - Correction du Worker qui tournait en mode API (MODE=api) au lieu de Celery worker, ce qui bloquait le traitement des documents de la base de connaissances en file d'attente.
    - Ajout de la configuration WEAVIATE_GRPC_ENDPOINT pour que l'ingestion batch gRPC Weaviate fonctionne correctement, résolvant les documents bloqués à 0 % pendant l'embedding.
    - Réduction de la taille du pool de connexions base de données (SQLALCHEMY_POOL_SIZE) pour respecter les limites de la base partagée Olares.

    **Autres améliorations**

    - Sandbox mis à niveau vers 0.2.14, plugin daemon vers 0.5.3
    - Multiples refactorisations et optimisations de performance sur la plateforme

    Notes de version complètes : https://github.com/langgenius/dify/releases/tag/1.13.3

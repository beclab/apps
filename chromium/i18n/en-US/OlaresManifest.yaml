metadata:
  title: Chromium
  description: The open-source projects behind the Google Chrome browser
spec:
  fullDescription: |
    **About**
    Chromium is an open-source browser project that aims to build a safer, faster, and more stable way for all users to experience the web.

  upgradeDescription: |
    - Upgrade Chromium from 150.0.7871.114 to 156.0.8078.79
    - JPEG XL image display (155)
    - The reported CPU performance tier can be overridden in Settings (152)
    - Hidden embedded frames no longer play audio (155)

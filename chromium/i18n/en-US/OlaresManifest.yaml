metadata:
  title: Chromium
  description: The open-source projects behind the Google Chrome browser
spec:
  fullDescription: |
    **About**
    Chromium is an open-source browser project that aims to build a safer, faster, and more stable way for all users to experience the web.

  upgradeDescription: |
    Upgrade base image to `beclab/harveyff-chromium:ae9a7fca-ls44` (Olares-patched ls44). Force `PIXELFLUX_WAYLAND=false` for X11 Selkies on Olares One. Managed policies keep New Tab and default search on Google.

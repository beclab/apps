metadata:
  title: Chromium
  description: Google Chrome ブラウザを支えるオープンソースプロジェクト
spec:
  fullDescription: |
    **概要**
    Chromium は、すべてのユーザーにとってより安全で高速、安定したウェブ体験を構築することを目指すオープンソースのブラウザプロジェクトです。

  upgradeDescription: |
    - Chromium を 150.0.7871.114 から 156.0.8078.79 へアップグレード
    - JPEG XL 画像の表示に対応（155）
    - 報告される CPU 性能ティアを設定で上書き可能（152）
    - 非表示の埋め込みフレームは音声を再生しなくなりました（155）

metadata:
  title: Chromium
  description: Die Open-Source-Projekte hinter dem Google-Chrome-Browser
spec:
  fullDescription: |
    **Über**
    Chromium ist ein Open-Source-Browserprojekt, das darauf abzielt, für alle Nutzer eine sicherere, schnellere und stabilere Art zu schaffen, das Web zu erleben.

  upgradeDescription: |
    - Upgrade von Chromium 150.0.7871.114 auf 156.0.8078.79
    - Anzeige von JPEG-XL-Bildern (155)
    - Die gemeldete CPU-Leistungsstufe kann in den Einstellungen überschrieben werden (152)
    - Versteckte eingebettete Frames geben keinen Ton mehr wieder (155)

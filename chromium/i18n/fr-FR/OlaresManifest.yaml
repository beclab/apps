metadata:
  title: Chromium
  description: Les projets open source derrière le navigateur Google Chrome
spec:
  fullDescription: |
    **À propos**
    Chromium est un projet de navigateur open source qui vise à offrir à tous les utilisateurs une façon plus sûre, plus rapide et plus stable d'expérimenter le web.

  upgradeDescription: |
    - Mise à niveau de Chromium de 150.0.7871.114 vers 156.0.8078.79
    - Affichage des images JPEG XL (155)
    - Le niveau de performance CPU signalé peut être modifié dans les paramètres (152)
    - Les cadres intégrés masqués ne lisent plus l'audio (155)

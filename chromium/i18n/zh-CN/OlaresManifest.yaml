metadata:
  description: Google Chrome 浏览器背后的开源项目
  title: Chromium
spec:
  fullDescription: |
    **简介**
    Chromium 是一个开源浏览器项目，旨在为所有用户构建一种更安全、更快速、更稳定的网络体验方式。

  upgradeDescription: |
    - 将 Chromium 从 150.0.7871.114 升级至 156.0.8078.79
    - 支持显示 JPEG XL 图片（155）
    - 可在设置中覆盖上报的 CPU 性能档位（152）
    - 隐藏的内嵌框架不再播放声音（155）

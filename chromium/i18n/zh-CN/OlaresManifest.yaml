metadata:
  description: Google Chrome 浏览器背后的开源项目
  title: Chromium
spec:
  fullDescription: |
    **简介**
    Chromium 是一个开源浏览器项目，旨在为所有用户构建一种更安全、更快速、更稳定的网络体验方式。

  upgradeDescription: |
    基础镜像升级至 `beclab/harveyff-chromium:ae9a7fca-ls44`（Olares 适配 ls44）。Olares One 强制 `PIXELFLUX_WAYLAND=false` 走 X11 Selkies。企业策略保持新标签页与默认搜索为 Google。

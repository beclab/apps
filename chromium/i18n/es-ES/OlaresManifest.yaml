metadata:
  title: Chromium
  description: Los proyectos de código abierto detrás del navegador Google Chrome
spec:
  fullDescription: |
    **Acerca de**
    Chromium es un proyecto de navegador de código abierto que busca crear una forma más segura, rápida y estable para que todos los usuarios experimenten la web.

  upgradeDescription: |
    - Actualización de Chromium de 150.0.7871.114 a 156.0.8078.79
    - Visualización de imágenes JPEG XL (155)
    - El nivel de rendimiento de CPU informado se puede cambiar en Configuración (152)
    - Los marcos incrustados ocultos ya no reproducen audio (155)

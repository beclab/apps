metadata:
  title: Open Notebook
  description: Eine leistungsstarke Open-Source-, KI-gestützte Notiz-/Rechercheplattform, die Ihre Privatsphäre respektiert
spec:
  fullDescription: |
    Open Notebook ist eine Open-Source-, datenschutzorientierte Alternative zu Googles Notebook LM!
    
    In einer von Künstlicher Intelligenz geprägten Welt sollte die Fähigkeit zu denken und neues Wissen zu erwerben kein Privileg Weniger und nicht auf einen einzelnen Anbieter beschränkt sein.
    
    Open Notebook ermöglicht Ihnen:
    - Kontrolle über Ihre Daten: Halten Sie Ihre Recherche privat und sicher
    - Wahl Ihrer KI-Modelle: Unterstützung für über 16 Anbieter einschließlich OpenAI, Anthropic, Ollama, LM Studio und mehr — alles über die UI konfigurierbar
    - Multimodale Inhalte organisieren: PDFs, Videos, Audio, Webseiten und mehr
    - Professionelle Podcasts erzeugen: Fortschrittliche Mehrsprecher-Podcast-Generierung
    - Intelligent suchen: Volltext- und Vektorsuche über alle Ihre Inhalte
    - Mit Kontext chatten: KI-Gespräche auf Basis Ihrer Recherche
  upgradeDescription: |
    Chart-Refactoring an das Upstream-Layout von Open Notebook 1.14.0 angepasst.
    
    Deployment-Änderungen:
    - Einzelnes Datenvolume `/app/data` (Uploads, Podcasts, Caches liegen darunter)
    - Offizielles `docker-entrypoint.sh` für optionale Runtime-Installationen (Docling/Crawl4AI)
    - `FRONTEND_BIND_HOST=0.0.0.0` ersetzt das veraltete `HOSTNAME`-Binding
    - Legacy-SQLite-Seeding, config.toml-Init und appCache-Migrations-InitContainer entfernt
    - Einmalige Init führt Legacy-Host-`uploads/` und `config/` für Upgrades in `/app/data` zusammen
    - `OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=1` für llama.cpp-kompatible Embedding-Backends gesetzt
    
    Open Notebook 1.14.0 — offizielle Images, kein beclab-Mirror für App/Datenbank:
    - App: `lfnovo/open_notebook:1.14.0`
    - Datenbank: `surrealdb/surrealdb:v2`
    
    Vollständige Release Notes: https://github.com/lfnovo/open-notebook/releases/tag/v1.14.0

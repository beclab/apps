metadata:
  title: Open Notebook
  description: プライバシーを尊重する強力なオープンソース AI ノート／リサーチプラットフォーム
spec:
  fullDescription: |
    Open Notebook は、Google の Notebook LM に対するプライバシー重視のオープンソース代替です！
    
    人工知能が支配する世界で、考え、新しい知識を得る能力は一部の特権でも、単一プロバイダーに限定されるものでもあってはなりません。
    
    Open Notebook でできること:
    - データの管理: リサーチを非公開かつ安全に保つ
    - AI モデルの選択: OpenAI、Anthropic、Ollama、LM Studio など 16 以上のプロバイダーに対応 — すべて UI で設定可能
    - マルチモーダルコンテンツの整理: PDF、動画、音声、Web ページなど
    - プロ向けポッドキャスト生成: 高度なマルチスピーカーポッドキャスト生成
    - インテリジェント検索: コンテンツ全体の全文検索とベクトル検索
    - コンテキスト付きチャット: リサーチに基づく AI 会話
  upgradeDescription: |
    Chart のリファクタを Open Notebook 1.14.0 の upstream レイアウトに合わせました。
    
    デプロイ変更:
    - 単一データボリューム `/app/data`（アップロード、ポッドキャスト、キャッシュはその下）
    - Docling/Crawl4AI などの任意ランタイムインストール向け公式 `docker-entrypoint.sh`
    - 非推奨の `HOSTNAME` バインドを `FRONTEND_BIND_HOST=0.0.0.0` に置換
    - レガシー SQLite シーディング、config.toml init、appCache 移行 initContainer を削除
    - アップグレード時にホストのレガシー `uploads/` と `config/` を `/app/data` に一度だけマージ
    - llama.cpp 互換埋め込みバックエンド向けに `OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=1` を設定
    
    Open Notebook 1.14.0 — 公式イメージ、アプリ/DB の beclab ミラーなし:
    - App: `lfnovo/open_notebook:1.14.0`
    - Database: `surrealdb/surrealdb:v2`
    
    完全なリリースノート: https://github.com/lfnovo/open-notebook/releases/tag/v1.14.0

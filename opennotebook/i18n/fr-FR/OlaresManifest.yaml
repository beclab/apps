metadata:
  title: Open Notebook
  description: "Une puissante plateforme open source de prise de notes/recherche alimentée par l'IA qui respecte votre vie privée"
spec:
  fullDescription: |
    Open Notebook est une alternative open source axée sur la confidentialité à Notebook LM de Google !
    
    Dans un monde dominé par l'intelligence artificielle, la capacité de penser et d'acquérir de nouvelles connaissances ne devrait pas être un privilège réservé à quelques-uns, ni limitée à un seul fournisseur.
    
    Open Notebook vous permet de :
    - Contrôler vos données : Gardez votre recherche privée et sécurisée
    - Choisir vos modèles d'IA : Prise en charge de plus de 16 fournisseurs dont OpenAI, Anthropic, Ollama, LM Studio, etc. — tout configurable via l'UI
    - Organiser du contenu multimodal : PDF, vidéos, audio, pages web, etc.
    - Générer des podcasts professionnels : Génération avancée de podcasts multi-intervenants
    - Rechercher intelligemment : Recherche plein texte et vectorielle sur tout votre contenu
    - Discuter avec du contexte : Conversations IA alimentées par votre recherche
  upgradeDescription: |
    Refactorisation du Chart alignée sur la disposition upstream d'Open Notebook 1.14.0.
    
    Changements de déploiement :
    - Volume de données unique `/app/data` (uploads, podcasts et caches y vivent)
    - `docker-entrypoint.sh` officiel pour les installations runtime optionnelles (Docling/Crawl4AI)
    - `FRONTEND_BIND_HOST=0.0.0.0` remplace le binding déprécié `HOSTNAME`
    - Suppression du seeding SQLite legacy, de l'init config.toml et des init containers de migration appCache
    - Init unique fusionne les `uploads/` et `config/` legacy de l'hôte dans `/app/data` pour les mises à niveau
    - `OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=1` pour les backends d'embedding compatibles llama.cpp
    
    Open Notebook 1.14.0 — images officielles, pas de miroir beclab pour app/base de données :
    - App : `lfnovo/open_notebook:1.14.0`
    - Base de données : `surrealdb/surrealdb:v2`
    
    Notes de version complètes : https://github.com/lfnovo/open-notebook/releases/tag/v1.14.0

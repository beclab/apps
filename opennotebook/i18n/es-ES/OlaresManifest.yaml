metadata:
  title: Open Notebook
  description: Una potente plataforma open-source de notas/investigación impulsada por IA que respeta tu privacidad
spec:
  fullDescription: |
    ¡Open Notebook es una alternativa open source centrada en la privacidad a Notebook LM de Google!
    
    En un mundo dominado por la Inteligencia Artificial, la capacidad de pensar y adquirir nuevo conocimiento no debería ser un privilegio de unos pocos ni estar restringida a un único proveedor.
    
    Open Notebook te permite:
    - Controlar tus datos: Mantén tu investigación privada y segura
    - Elegir tus modelos de IA: Compatibilidad con más de 16 proveedores, incluidos OpenAI, Anthropic, Ollama, LM Studio y más — todo configurable vía UI
    - Organizar contenido multimodal: PDFs, vídeos, audio, páginas web y más
    - Generar podcasts profesionales: Generación avanzada de podcasts con varios hablantes
    - Buscar de forma inteligente: Búsqueda de texto completo y vectorial en todo tu contenido
    - Chatear con contexto: Conversaciones de IA impulsadas por tu investigación
  upgradeDescription: |
    Refactorización del Chart alineada con el layout upstream de Open Notebook 1.14.0.
    
    Cambios de despliegue:
    - Un solo volumen de datos `/app/data` (uploads, podcasts y cachés viven debajo)
    - `docker-entrypoint.sh` oficial para instalaciones runtime opcionales (Docling/Crawl4AI)
    - `FRONTEND_BIND_HOST=0.0.0.0` sustituye el binding obsoleto `HOSTNAME`
    - Eliminados el seeding legacy de SQLite, la init de config.toml y los init containers de migración appCache
    - Init única fusiona `uploads/` y `config/` legacy del host en `/app/data` para actualizaciones
    - `OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=1` para backends de embedding compatibles con llama.cpp
    
    Open Notebook 1.14.0 — imágenes oficiales, sin espejo beclab para app/base de datos:
    - App: `lfnovo/open_notebook:1.14.0`
    - Base de datos: `surrealdb/surrealdb:v2`
    
    Notas de la versión completas: https://github.com/lfnovo/open-notebook/releases/tag/v1.14.0

metadata:
  title: Open Notebook
  description: Una potente piattaforma open-source di appunti/ricerca basata su IA che rispetta la tua privacy
spec:
  fullDescription: |
    Open Notebook è un'alternativa open source incentrata sulla privacy a Notebook LM di Google!
    
    In un mondo dominato dall'Intelligenza Artificiale, la capacità di pensare e acquisire nuove conoscenze non dovrebbe essere un privilegio di pochi né limitata a un unico fornitore.
    
    Open Notebook ti consente di:
    - Controllare i tuoi dati: Mantieni la ricerca privata e sicura
    - Scegliere i tuoi modelli IA: Supporto per oltre 16 provider tra cui OpenAI, Anthropic, Ollama, LM Studio e altri — tutto configurabile via UI
    - Organizzare contenuti multimodali: PDF, video, audio, pagine web e altro
    - Generare podcast professionali: Generazione avanzata di podcast multi-speaker
    - Cercare in modo intelligente: Ricerca full-text e vettoriale su tutti i contenuti
    - Chatta con contesto: Conversazioni IA alimentate dalla tua ricerca
  upgradeDescription: |
    Refactoring del Chart allineato al layout upstream di Open Notebook 1.14.0.
    
    Modifiche al deployment:
    - Singolo volume dati `/app/data` (upload, podcast e cache vivono sotto di esso)
    - `docker-entrypoint.sh` ufficiale per installazioni runtime opzionali (Docling/Crawl4AI)
    - `FRONTEND_BIND_HOST=0.0.0.0` sostituisce il binding deprecato `HOSTNAME`
    - Rimossi seeding SQLite legacy, init di config.toml e init container di migrazione appCache
    - Init una tantum unisce `uploads/` e `config/` legacy dell'host in `/app/data` per gli upgrade
    - Impostato `OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=1` per backend di embedding compatibili con llama.cpp
    
    Open Notebook 1.14.0 — immagini ufficiali, nessuno mirror beclab per app/database:
    - App: `lfnovo/open_notebook:1.14.0`
    - Database: `surrealdb/surrealdb:v2`
    
    Note di rilascio complete: https://github.com/lfnovo/open-notebook/releases/tag/v1.14.0

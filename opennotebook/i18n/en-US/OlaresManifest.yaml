metadata:
  title: Open Notebook
  description: A powerful open-source, AI-powered note-taking/research platform that respects your privacy
spec:
  fullDescription: |
    Open Notebook is an open source, privacy-focused alternative to Google's Notebook LM!

    In a world dominated by Artificial Intelligence, having the ability to think and acquire new knowledge, is a skill that should not be a privilege for a few, nor restricted to a single provider.

    Open Notebook empowers you to:
    - Control your data: Keep your research private and secure
    - Choose your AI models: Support for 16+ providers including OpenAI, Anthropic, Ollama, LM Studio, and more — all configurable via UI
    - Organize multi-modal content: PDFs, videos, audio, web pages, and more
    - Generate professional podcasts: Advanced multi-speaker podcast generation
    - Search intelligently: Full-text and vector search across all your content
    - Chat with context: AI conversations powered by your research

  upgradeDescription: |
    Chart refactor aligned with Open Notebook 1.14.0 upstream layout.

    Deployment changes:
    - Single data volume `/app/data` (uploads, podcasts, caches live under it)
    - Official `docker-entrypoint.sh` for opt-in runtime installs (Docling/Crawl4AI)
    - `FRONTEND_BIND_HOST=0.0.0.0` replaces deprecated `HOSTNAME` binding
    - Removed legacy SQLite seeding, config.toml init, and appCache migration init containers
    - One-time init merges legacy host `uploads/` and `config/` into `/app/data` for upgrades
    - Set `OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=1` for llama.cpp-compatible embedding backends

    Open Notebook 1.14.0 — official images, no beclab mirror for app/database:
    - App: `lfnovo/open_notebook:1.14.0`
    - Database: `surrealdb/surrealdb:v2`

    Full release notes: https://github.com/lfnovo/open-notebook/releases/tag/v1.14.0

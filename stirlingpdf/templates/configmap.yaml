apiVersion: v1
kind: ConfigMap
metadata:
  name: stirlingpdf-config
  namespace: {{ .Release.Namespace }}
data:
  # Static defaults only. Login-related flags are set on the container env from olaresEnv
  # so Settings applyOnChange actually restarts the pod (envFrom alone does not).
  DISABLE_ADDITIONAL_FEATURES: "false"
  FAT_DOCKER: "true"
  SYSTEM_DEFAULTLOCALE: "en-US"
  SYSTEM_MAXFILESIZE: "200"
  METRICS_ENABLED: "true"
  SYSTEM_GOOGLEVISIBILITY: "true"
  SYSTEM_SHOWUPDATE: "false"
#  appName: "Stirling-PDF Olares"
#  homeDescription: "Locally hosted web application that allows you to perform various operations on PDF files"
#  appNameNavbar: "Stirling-PDF Olares"
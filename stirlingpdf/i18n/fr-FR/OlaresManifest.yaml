metadata:
  title: Stirling-PDF
  description: Une solution locale tout-en-un pour tous vos besoins PDF
spec:
  upgradeDescription: |
    v1.0.17 : Mettre Stirling-PDF à niveau de 2.14.2-fat vers 3.0.0-fat.

    La version 3 remanie l'espace de travail et améliore le traitement,
    l'automatisation, les signatures et l'administration. Upstream a testé
    PostgreSQL depuis v2.5.0 ; sauvegardez les données et la base avant migration.

    Notes : https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.0.0

    v1.0.12 : Mettre à niveau Stirling-PDF de 2.4.5 vers 2.14.2-fat.

    Chart / runtime :
    - Entrance authLevel=internal par défaut (VPN/LAN) ; définir public dans Paramètres pour un accès Internet sans VPN
    - SECURITY_ENABLELOGIN true par défaut ; envs login/storage liés au conteneur pour que Paramètres applyOnChange redémarre le pod
    - Supprimer SYSTEM_FRONTENDURL ; les sondes de santé utilisent /api/v1/info/status ; persister /storage sous appData
    - Supprimer la ramification hostPath Olares 1.12.3 (toujours utiliser les chemins appData/<dir>)

    Points forts depuis 2.4.5 :
    - Nouvelle UI de gestion de fichiers (fichiers à gauche, outils à droite) et stockage de dossiers côté serveur optionnel / My Files
    - Fusion et division propulsées par JPDFium avec jusqu'à ~99 % moins de mémoire ; runtime JDK 25
    - UI de signature partagée restaurée ; avertissement de connexion pour les déploiements professionnels
    - Page MCP (WIP), sélection de texte Ctrl+A dans le visualiseur PDF, langue par défaut en-US
    - Page de paramètres listant les licences frontend/backend tierces
    - Nettoyage de l'image Docker (deps inutilisées retirées) et divers correctifs de sécurité
    - Hotfix pour certains environnements Postgres échouant à charger les données utilisateur (2.14.2)
    - Correctifs pour la visibilité de signature de certificats, échecs rearrange-pages, rotation Multi Tool, et plus

    Remarque : l'upstream recommande une sauvegarde avant de grands sauts (surtout autour de 2.12.0).

    Notes de version : https://github.com/Stirling-Tools/Stirling-PDF/releases
    Dernière balise : https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
  fullDescription: |
    Stirling-PDF est un outil robuste de manipulation PDF basé sur le web et hébergé localement. Il vous permet d'effectuer diverses opérations sur des fichiers PDF, notamment la division, la fusion, la conversion, la réorganisation, l'ajout d'images, la rotation, la compression, et plus encore. Cette application web hébergée localement a évolué pour englober un ensemble complet de fonctionnalités, répondant à tous vos besoins PDF.

    Tous les fichiers et PDF existent soit exclusivement côté client, soit uniquement en mémoire serveur pendant l'exécution de la tâche, soit temporairement dans un fichier uniquement pour l'exécution de la tâche. Tout fichier téléchargé par l'utilisateur aura déjà été supprimé du serveur à ce moment-là.

    **Fonctionnalités**
    - Plus de 50 opérations PDF
    - Traitement et téléchargements de fichiers en parallèle
    - Prise en charge du mode sombre
    - Options de téléchargement personnalisées
    - « Pipelines » personnalisés pour exécuter plusieurs fonctionnalités dans une file automatisée
    - API pour l'intégration avec des scripts externes
    - Prise en charge optionnelle de la connexion et de l'authentification
    - Sauvegarde et import de la base de données
    - Fonctionnalités entreprise comme le SSO

    Liste complète des fonctionnalités : https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features

metadata:
  title: Stirling-PDF
  description: Ein lokal gehosteter One-Stop-Shop für alle Ihre PDF-Bedürfnisse
spec:
  upgradeDescription: |
    v1.0.17: Stirling-PDF von 2.14.2-fat auf 3.0.0-fat aktualisieren.

    Version 3 bringt einen neu gestalteten Arbeitsbereich sowie große
    Verbesserungen bei Verarbeitung, Automatisierung, Signatur und Verwaltung.
    Upstream testete PostgreSQL-Upgrades ab v2.5.0; Daten und Datenbank sichern.

    Hinweise: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.0.0

    v1.0.12: Stirling-PDF von 2.4.5 auf 2.14.2-fat aktualisieren.

    Chart / Runtime:
    - Standard-Entrance authLevel=internal (VPN/LAN); in den Einstellungen auf public setzen für Internetzugriff ohne VPN
    - SECURITY_ENABLELOGIN standardmäßig true; Login-/Storage-Envs am Container gebunden, damit Einstellungen applyOnChange den Pod neu startet
    - SYSTEM_FRONTENDURL entfernt; Health-Probes nutzen /api/v1/info/status; /storage unter appData persistieren
    - Olares 1.12.3: hostPath-Verzweigung entfernt (immer appData/<dir>-Pfade)

    Highlights seit 2.4.5:
    - Neue Dateiverwaltungs-UI (Dateien links, Tools rechts) und optionale serverseitige Ordnerspeicherung / My Files
    - JPDFium-gestütztes Zusammenführen und Teilen mit bis zu ~99 % weniger Speicherverbrauch; JDK-25-Runtime
    - Gemeinsame Signatur-UI wiederhergestellt; Login-Hinweis für Business-Deployments
    - MCP-Seite (WIP), Ctrl+A-Textauswahl im PDF-Viewer, Standardsprache en-US
    - Einstellungsseite mit Drittanbieter-Frontend-/Backend-Lizenzen
    - Docker-Image-Bereinigung (ungenutzte Abhängigkeiten entfernt) und diverse Sicherheitsfixes
    - Hotfix für bestimmte Postgres-Umgebungen, die Benutzerdaten nicht laden (2.14.2)
    - Fixes für Zertifikatssignatur-Sichtbarkeit, rearrange-pages-Fehler, Multi-Tool-Rotation und mehr

    Hinweis: Upstream empfiehlt ein Backup vor großen Sprüngen (besonders um 2.12.0).

    Vollständige Release Notes: https://github.com/Stirling-Tools/Stirling-PDF/releases
    Neuester Tag: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
  fullDescription: |
    Stirling-PDF ist ein robustes, lokal gehostetes webbasiertes PDF-Bearbeitungswerkzeug. Es ermöglicht verschiedene Operationen an PDF-Dateien, darunter Teilen, Zusammenführen, Konvertieren, Neuordnen, Bilder hinzufügen, Drehen, Komprimieren und mehr. Diese lokal gehostete Webanwendung hat sich zu einem umfassenden Funktionssatz entwickelt und deckt alle Ihre PDF-Anforderungen ab.

    Alle Dateien und PDFs existieren entweder ausschließlich auf der Clientseite, liegen nur während der Aufgabenausführung im Serverspeicher oder vorübergehend in einer Datei ausschließlich zur Ausführung der Aufgabe. Jede vom Benutzer heruntergeladene Datei ist zu diesem Zeitpunkt bereits vom Server gelöscht.

    **Funktionen**
    - 50+ PDF-Operationen
    - Parallele Dateiverarbeitung und Downloads
    - Dark-Mode-Unterstützung
    - Benutzerdefinierte Download-Optionen
    - Benutzerdefinierte „Pipelines“, um mehrere Funktionen in einer automatisierten Warteschlange auszuführen
    - API zur Integration mit externen Skripten
    - Optionale Login- und Authentifizierungsunterstützung
    - Datenbank-Backup und -Import
    - Enterprise-Funktionen wie SSO

    Vollständige Feature-Liste: https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features

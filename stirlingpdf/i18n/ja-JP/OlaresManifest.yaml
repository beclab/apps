metadata:
  title: Stirling-PDF
  description: すべての PDF ニーズに対応するローカルホストのワンストップショップ
spec:
  upgradeDescription: |
    v1.0.17: Stirling-PDF を 2.14.2-fat から 3.0.0-fat へ更新。

    バージョン 3 はワークスペースを刷新し、処理、自動化、署名、管理を
    大幅に改善します。上流は v2.5.0 以降の PostgreSQL 更新を検証済みです。
    更新前にアプリデータとデータベースをバックアップしてください。

    リリースノート: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.0.0

    v1.0.12: Stirling-PDF を 2.4.5 から 2.14.2-fat へアップグレード。

    Chart／ランタイム:
    - 既定のエントランス authLevel=internal（VPN/LAN）；VPN なしのインターネットアクセスには設定で public に変更
    - SECURITY_ENABLELOGIN 既定 true；設定の applyOnChange で Pod が再起動するよう login/storage env をコンテナにバインド
    - SYSTEM_FRONTENDURL を削除；ヘルスプローブは /api/v1/info/status；/storage を appData 配下に永続化
    - Olares 1.12.3 の hostPath 分岐を削除（常に appData/<dir> パスを使用）

    2.4.5 以降のハイライト:
    - 新ファイル管理 UI（左にファイル、右にツール）とオプションのサーバー側フォルダ保存／My Files
    - JPDFium による結合・分割でメモリ使用量を最大約 99% 削減；JDK 25 ランタイム
    - 共有署名 UI を復元；ビジネス展開向けログイン免責事項
    - MCP ページ（WIP）、PDF ビューアでの Ctrl+A テキスト選択、既定言語 en-US
    - サードパーティのフロント／バックエンドライセンスを列挙する設定ページ
    - Docker イメージの整理（未使用依存関係を削除）と各種セキュリティ修正
    - 一部の Postgres 環境でユーザーデータ読み込みに失敗する問題のホットフィックス（2.14.2）
    - 証明書署名の表示、rearrange-pages 失敗、Multi Tool 回転などの修正

    注: アップストリームは大きなジャンプ（特に 2.12.0 前後）の前にバックアップを推奨します。

    リリースノート: https://github.com/Stirling-Tools/Stirling-PDF/releases
    最新タグ: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
  fullDescription: |
    Stirling-PDF は、堅牢なローカルホストの Web ベース PDF 操作ツールです。分割、結合、変換、再配置、画像追加、回転、圧縮など、PDF ファイルに対するさまざまな操作を実行できます。このローカルホスト Web アプリは包括的な機能セットへと進化し、あらゆる PDF 要件に対応します。

    すべてのファイルと PDF はクライアント側のみに存在するか、タスク実行中のみサーバーメモリに置かれるか、タスク実行のためだけに一時的にファイルに置かれます。ユーザーがダウンロードしたファイルは、その時点でサーバーから削除されています。

    **機能**
    - 50 以上の PDF 操作
    - 並列ファイル処理とダウンロード
    - ダークモード対応
    - カスタムダウンロードオプション
    - 複数機能を自動キューで実行するカスタム「Pipelines」
    - 外部スクリプト連携用 API
    - オプションのログイン／認証サポート
    - データベースのバックアップとインポート
    - SSO などのエンタープライズ機能

    完全な機能一覧: https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features

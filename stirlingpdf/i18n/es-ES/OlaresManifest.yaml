metadata:
  title: Stirling-PDF
  description: Una tienda integral autoalojada localmente para todas sus necesidades de PDF
spec:
  upgradeDescription: |
    v1.0.17: Actualizar Stirling-PDF de 2.14.2-fat a 3.0.0-fat.

    La versión 3 rediseña el espacio de trabajo y mejora el procesamiento,
    la automatización, las firmas y la administración. Upstream probó
    actualizaciones PostgreSQL desde v2.5.0; haga copia de datos y base de datos.

    Notas: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.0.0

    v1.0.12: Actualizar Stirling-PDF de 2.4.5 a 2.14.2-fat.

    Chart / runtime:
    - Entrance authLevel=internal por defecto (VPN/LAN); establezca public en Ajustes para acceso a Internet sin VPN
    - SECURITY_ENABLELOGIN true por defecto; envs de login/storage enlazados en el contenedor para que Ajustes applyOnChange reinicie el pod
    - Eliminar SYSTEM_FRONTENDURL; las sondas de salud usan /api/v1/info/status; persistir /storage bajo appData
    - Eliminar la ramificación hostPath de Olares 1.12.3 (usar siempre rutas appData/<dir>)

    Destacados desde 2.4.5:
    - Nueva UI de gestión de archivos (archivos a la izquierda, herramientas a la derecha) y almacenamiento opcional de carpetas en el servidor / My Files
    - Fusión y división impulsadas por JPDFium con hasta ~99 % menos uso de memoria; runtime JDK 25
    - UI de firma compartida restaurada; aviso de inicio de sesión para despliegues empresariales
    - Página MCP (WIP), selección de texto Ctrl+A en el visor PDF, idioma predeterminado en-US
    - Página de configuración con licencias de frontend/backend de terceros
    - Limpieza de la imagen Docker (deps no usadas eliminadas) y varios fixes de seguridad
    - Hotfix para ciertos entornos Postgres que fallaban al cargar datos de usuario (2.14.2)
    - Fixes de visibilidad de firma de certificados, fallos de rearrange-pages, rotación Multi Tool y más

    Nota: Upstream recomienda una copia de seguridad antes de saltos grandes (especialmente en torno a 2.12.0).

    Notas de la versión: https://github.com/Stirling-Tools/Stirling-PDF/releases
    Última etiqueta: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
  fullDescription: |
    Stirling-PDF es una herramienta robusta de manipulación de PDF basada en web y alojada localmente. Le permite realizar diversas operaciones en archivos PDF, incluyendo dividir, fusionar, convertir, reorganizar, añadir imágenes, rotar, comprimir y más. Esta aplicación web alojada localmente ha evolucionado hasta abarcar un conjunto completo de funciones, cubriendo todos sus requisitos de PDF.

    Todos los archivos y PDF existen exclusivamente en el lado del cliente, residen en la memoria del servidor solo durante la ejecución de la tarea, o residen temporalmente en un archivo únicamente para la ejecución de la tarea. Cualquier archivo descargado por el usuario ya habrá sido eliminado del servidor en ese momento.

    **Características**
    - Más de 50 operaciones PDF
    - Procesamiento y descargas de archivos en paralelo
    - Soporte de modo oscuro
    - Opciones de descarga personalizadas
    - «Pipelines» personalizados para ejecutar varias funciones en una cola automatizada
    - API para integración con scripts externos
    - Soporte opcional de inicio de sesión y autenticación
    - Copia de seguridad e importación de la base de datos
    - Funciones empresariales como SSO

    Lista completa de funciones: https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features

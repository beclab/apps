metadata:
  title: Stirling-PDF
  description: Uno sportello unico ospitato localmente per tutte le tue esigenze PDF
spec:
  upgradeDescription: |
    v1.0.17: Aggiorna Stirling-PDF da 2.14.2-fat a 3.0.0-fat.

    La versione 3 rinnova lo spazio di lavoro e migliora elaborazione,
    automazione, firme e amministrazione. Upstream ha testato gli upgrade
    PostgreSQL da v2.5.0; eseguire prima il backup di dati e database.

    Note: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.0.0

    v1.0.12: Aggiorna Stirling-PDF da 2.4.5 a 2.14.2-fat.

    Chart / runtime:
    - Entrance authLevel=internal di default (VPN/LAN); imposta public in Impostazioni per accesso Internet senza VPN
    - SECURITY_ENABLELOGIN true di default; env di login/storage legati al container così Impostazioni applyOnChange riavvia il pod
    - Rimuovi SYSTEM_FRONTENDURL; le health probe usano /api/v1/info/status; persisti /storage sotto appData
    - Rimuovi la ramificazione hostPath di Olares 1.12.3 (usa sempre i percorsi appData/<dir>)

    Highlight da 2.4.5:
    - Nuova UI di gestione file (file a sinistra, strumenti a destra) e archiviazione cartelle lato server opzionale / My Files
    - Unione e divisione basate su JPDFium con fino a ~99 % in meno di uso memoria; runtime JDK 25
    - UI di firma condivisa ripristinata; disclaimer di login per deployment business
    - Pagina MCP (WIP), selezione testo Ctrl+A nel visualizzatore PDF, lingua predefinita en-US
    - Pagina delle impostazioni con licenze frontend/backend di terze parti
    - Pulizia immagine Docker (deps inutilizzate rimosse) e vari fix di sicurezza
    - Hotfix per certi ambienti Postgres che non caricavano i dati utente (2.14.2)
    - Fix per visibilità firma certificati, fallimenti rearrange-pages, rotazione Multi Tool e altro

    Nota: Upstream raccomanda un backup prima di grandi salti (soprattutto intorno a 2.12.0).

    Note di rilascio: https://github.com/Stirling-Tools/Stirling-PDF/releases
    Tag più recente: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
  fullDescription: |
    Stirling-PDF è un robusto strumento web di manipolazione PDF ospitato localmente. Consente di eseguire varie operazioni sui file PDF, tra cui divisione, unione, conversione, riorganizzazione, aggiunta di immagini, rotazione, compressione e altro. Questa applicazione web ospitata localmente si è evoluta fino a includere un set completo di funzionalità, rispondendo a tutti i requisiti PDF.

    Tutti i file e i PDF esistono esclusivamente sul lato client, risiedono nella memoria del server solo durante l'esecuzione dell'attività, oppure risiedono temporaneamente in un file solo per l'esecuzione dell'attività. Qualsiasi file scaricato dall'utente sarà già stato eliminato dal server a quel punto.

    **Funzionalità**
    - Oltre 50 operazioni PDF
    - Elaborazione e download di file in parallelo
    - Supporto dark mode
    - Opzioni di download personalizzate
    - «Pipelines» personalizzate per eseguire più funzionalità in una coda automatizzata
    - API per l'integrazione con script esterni
    - Supporto opzionale di login e autenticazione
    - Backup e importazione del database
    - Funzionalità enterprise come SSO

    Elenco completo delle funzionalità: https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features

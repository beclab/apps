metadata:
  title: Gemma3 27B (Ollama)
  description: Das derzeit leistungsfähigste Modell, das auf einer einzelnen GPU läuft

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.

    **MODEL OVERVIEW**
    Gemma ist eine leichte Modellfamilie von Google auf Basis der Gemini-Technologie. Die Gemma-3-Modelle sind multimodal — sie verarbeiten Text und Bilder — und bieten ein 128K-Kontextfenster mit Unterstützung für über 140 Sprachen. Verfügbar in Größen mit 270M, 1B, 4B, 12B und 27B Parametern, glänzen sie bei Aufgaben wie Fragebeantwortung, Zusammenfassung und Reasoning, während ihr kompaktes Design den Einsatz auf ressourcenbeschränkten Geräten ermöglicht.

    **Inputs and outputs**
    Input:
    - Textzeichenkette, z. B. eine Frage, ein Prompt oder ein zu zusammenfassendes Dokument
    - Bilder, normalisiert auf 896 x 896 Auflösung und jeweils auf 256 Tokens kodiert
    - Gesamter Eingabekontext von 128K Tokens für die Größen 4B, 12B und 27B sowie 32K Tokens für die Größe 1B

    Output:
    - Generierter Text als Antwort auf die Eingabe, z. B. eine Antwort auf eine Frage, Analyse von Bildinhalten oder Zusammenfassung eines Dokuments
    - Gesamter Ausgabekontext von 8192 Tokens

    **Key features**
    Image and text input: Multimodale Fähigkeiten ermöglichen Eingabe von Bildern und Text zum Verstehen und Analysieren visueller Daten.
    128K token context: Deutlich großer Eingabekontext für mehr Datenanalyse und komplexere Probleme.
    Function calling: Natürlichsprachliche Schnittstellen für Programmier-APIs aufbauen.
    Wide language support: In Ihrer Sprache arbeiten oder die Sprachfähigkeiten Ihrer KI-App mit Unterstützung für über 140 Sprachen erweitern.
    Developer friendly model sizes: Wählen Sie Modellgröße (270M, 1B, 4B, 12B, 27B) und Präzisionsstufe passend zu Aufgabe und Compute-Ressourcen.

  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.

    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

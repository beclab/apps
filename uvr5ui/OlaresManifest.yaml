olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: uvr5ui
  appid: uvr5ui
  title: UVR5 UI
  description: A web app for separating vocals and instruments from music
  version: 0.1.4
  icon: https://cdn.olares.com/images/2026/11/cb1f3e3a2c04c1b736c7c4a50dffbf93.png
  categories:
    - Creativity
    - AI
    - workspace
entrances:
  - name: uvr5ui
    title: UVR5 UI
    host: uvr5ui-svc
    port: 9999
    icon: https://cdn.olares.com/images/2026/11/cb1f3e3a2c04c1b736c7c4a50dffbf93.png
    authLevel: private
    openMethod: window
spec:
  versionName: "4f7d149"
  runAsUser: true
  supportArch:
    - amd64
  developer: Eddycrack864 and contributors
  website: https://github.com/Eddycrack864/UVR5-UI
  sourceCode: https://github.com/Eddycrack864/UVR5-UI
  fullDescription: |
    UVR5 UI separates an audio recording into individual tracks, such as vocals and accompaniment, to help musicians practise, prepare backing tracks and work on mixes.

    **Key features**

    - Choose separation models including BS-RoFormer, Mel-Band Roformer, MDX and Demucs.
    - Process individual files or folders, and combine model results with ensemble workflows.
    - Browse an existing NAS mount from the interface and save the separated tracks to the configured output folder.
    - Download models as needed and keep them on Olares for later use.

    **Before installing**

    Mount your NAS in Olares Files and create separate input and output folders before installing. Enter their paths relative to External during installation. Input files are mounted read-only; the output folder must allow writing. The app starts with a French interface; upstream language options are available in Settings.

    This is the community UVR5 UI web interface, not the official UVR desktop application. Separation quality and memory needs depend on the selected model and settings. Model downloads require an internet connection.
  locale:
    - en-US
    - fr-FR
  license:
    - text: MIT
      url: https://github.com/Eddycrack864/UVR5-UI/blob/main/LICENSE
  accelerator:
    - mode: nvidia
      requiredCpu: "1"
      limitedCpu: "6"
      requiredMemory: 4Gi
      limitedMemory: 16Gi
      requiredDisk: 12Gi
      limitedDisk: 60Gi
      requiredGPUMemory: 4Gi
      limitedGPUMemory: 8Gi
permission:
  appData: true
  appCache: true
  externalData: true
envs:
  - envName: NAS_INPUT_SUBPATH
    type: string
    required: true
    editable: true
    applyOnChange: true
    description: Existing input folder path relative to External after mounting the NAS
    regex: '^[^/].*[^/]$'
  - envName: NAS_OUTPUT_SUBPATH
    type: string
    required: true
    editable: true
    applyOnChange: true
    description: Existing writable output folder path relative to External
    regex: '^[^/].*[^/]$'
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
workloadReplicas:
  uvr5ui: 1

metadata:
  title: UVR5 UI
  description: A web app for separating vocals and instruments from music
spec:
  fullDescription: |
    UVR5 UI separates an audio recording into individual tracks, such as vocals and accompaniment, to help musicians practise, prepare backing tracks and work on mixes.

    **Key features**

    - Choose separation models including BS-RoFormer, Mel-Band Roformer, MDX and Demucs.
    - Process individual files or folders, and combine model results with ensemble workflows.
    - Browse an existing NAS mount from the interface and save the separated tracks to the configured output folder.
    - Download models as needed and keep them on Olares for later use.

    **Before installing**

    Mount your NAS in Olares Files and create separate input and output folders before installing. Enter their paths relative to External during installation. Input files are mounted read-only; the output folder must allow writing. The app starts with a French interface; upstream language options are available in Settings.

    This is the community UVR5 UI web interface, not the official UVR desktop application. Separation quality and memory needs depend on the selected model and settings. Model downloads require an internet connection.

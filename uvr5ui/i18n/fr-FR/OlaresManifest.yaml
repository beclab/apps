metadata:
  title: UVR5 UI
  description: Une application web pour séparer les voix et les instruments d’un morceau
spec:
  fullDescription: |
    UVR5 UI sépare un enregistrement audio en pistes distinctes, comme la voix et l’accompagnement, pour aider les musiciens à travailler un morceau, préparer des accompagnements et réaliser des mixages.

    **Fonctionnalités principales**

    - Choisissez des modèles de séparation, notamment BS-RoFormer, Mel-Band Roformer, MDX et Demucs.
    - Traitez un fichier ou un dossier et combinez les résultats de plusieurs modèles grâce aux ensembles.
    - Parcourez un NAS déjà monté depuis l’interface et enregistrez les pistes séparées dans le dossier de sortie configuré.
    - Téléchargez les modèles à la demande et conservez-les sur Olares pour les réutiliser.

    **Avant l’installation**

    Montez votre NAS dans Fichiers sur Olares et créez des dossiers distincts pour les entrées et les sorties avant l’installation. Saisissez leurs chemins relatifs à External pendant l’installation. Les fichiers d’entrée sont montés en lecture seule ; le dossier de sortie doit autoriser l’écriture. L’application démarre en français ; les langues proposées par le projet sont disponibles dans les paramètres.

    Il s’agit de l’interface web communautaire UVR5 UI, distincte de l’application de bureau officielle UVR. La qualité de séparation et les besoins en mémoire dépendent du modèle et des réglages. Le téléchargement des modèles nécessite une connexion Internet.

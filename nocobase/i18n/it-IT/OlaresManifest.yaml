metadata:
  title: NocoBase
  description: piattaforma no-code
spec:
  upgradeDescription: |
    Rilascio upstream: [NocoBase 2.2](https://www.nocobase.com/en/blog/2.2.0)

    **Modifica incompatibile**

    - Il passaggio da 1.x a 2.x è un aggiornamento major. Conserva un backup del database prima di aggiornare un'istanza esistente.
    - Gli URL dei file usano ora percorsi `/files/...` con controllo dei permessi. I reverse proxy devono inviare `/files/` a NocoBase, non al frontend.

    **Novità**

    - Frontend `/v/` indipendente e nuova esperienza mobile in `/v/mobile`.
    - Blocchi commento, aggiornamenti della knowledge base IA e un nodo transazione database nei workflow.

    L'accesso predefinito resta `admin@nocobase.com` / `admin123`. Cambialo dopo il primo accesso.

  fullDescription: |
    **Credenziali predefinite**
    Nome utente admin: admin@nocobase.com
    Password admin:  admin123
    Modificare nome utente e password il prima possibile.

    **PANORAMICA**
    NocoBase è una piattaforma di sviluppo no-code open-source orientata all'estensibilità.

    **Funzionalità**

    Guidata dal modello dati
    - Disaccoppiare dati e UI
    - Si possono creare più blocchi e azioni per la stessa tabella e record in qualsiasi quantità e forma
    - Supporto di database principale, database esterni e API di terze parti come sorgenti dati

    What you see is what you get
    - Passaggio con un clic tra modalità d'uso e modalità di configurazione
    - Le pagine fungono da tela dove vari blocchi e azioni compongono interfacce adatte, come Notion
    - La modalità di configurazione UI è pensata per utenti comuni, non per programmatori

    Tutto è implementato come plugin, progettato per lo sviluppo di estensioni
    - Adotta un'architettura a microkernel in cui tutte le funzionalità sono plugin, come Wordpress
    - I plugin sono pronti all'uso dopo l'installazione
    - Che siano pagine, blocchi, azioni, API o sorgenti dati, si possono sviluppare nuovi plugin per nuovi requisiti

    Logging e monitoraggio
    - Il plugin di logging offre log delle richieste di interfaccia e dei log operativi di sistema
    - Supporta configurazioni come livelli di log, policy di rolling, dimensione e formati di stampa
    - Una serie di plugin di telemetria integra strutture come OpenTelemetry e Prometheus, consentendo di monitorare qualsiasi metrica

    Integrazione con sistemi di terze parti
    - Usare database di terze parti come sorgenti dati
    - Utilizzare API di altri sistemi come sorgenti dati
    - Single Sign-On (SSO) per autenticazione senza interruzioni
    - Integrarsi senza soluzione di continuità con sistemi di terze parti, diventando un'unica entità
    - Implementare multi-applicazioni e applicazioni padre-figlio tra più applicazioni NocoBase


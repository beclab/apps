metadata:
  title: NocoBase
  description: plateforme no-code
spec:
  upgradeDescription: |
    Version amont : [NocoBase 2.2](https://www.nocobase.com/en/blog/2.2.0)

    **Changement cassant**

    - Le passage de 1.x à 2.x est une mise à jour majeure. Conservez une sauvegarde de la base avant de mettre à jour une instance existante.
    - Les URL de fichiers utilisent désormais des chemins `/files/...` contrôlés par les permissions. Les reverse proxies doivent envoyer `/files/` à NocoBase, pas au frontend.

    **Nouveautés**

    - Frontend `/v/` indépendant et nouvelle expérience mobile sous `/v/mobile`.
    - Blocs de commentaires, mises à jour de la base de connaissances IA, et nœud de transaction base de données dans les workflows.

    La connexion par défaut reste `admin@nocobase.com` / `admin123`. Modifiez-la après la première connexion.

  fullDescription: |
    **Identifiants par défaut**
    Nom d'utilisateur admin : admin@nocobase.com
    Mot de passe admin :  admin123
    Veuillez changer le nom d'utilisateur et le mot de passe dès que possible.

    **APERÇU**
    NocoBase est une plateforme de développement no-code open source axée sur l'extensibilité.

    **Fonctionnalités**

    Piloté par le modèle de données
    - Découpler données et UI
    - Plusieurs blocs et actions peuvent être créés pour la même table et le même enregistrement, en toute quantité et forme
    - Prise en charge de la base principale, de bases externes et d'API tierces comme sources de données

    What you see is what you get
    - Basculer en un clic entre mode d'utilisation et mode de configuration
    - Les pages servent de toile où divers blocs et actions composent des interfaces adaptées, à la manière de Notion
    - Le mode de configuration UI est conçu pour les utilisateurs ordinaires, pas les programmeurs

    Tout est implémenté en plugins, conçu pour le développement d'extensions
    - Adopte une architecture microkernel où toutes les fonctionnalités sont des plugins, comme Wordpress
    - Les plugins sont prêts à l'emploi dès l'installation
    - Qu'il s'agisse de pages, blocs, actions, API ou sources de données, de nouveaux plugins peuvent répondre à de nouveaux besoins

    Journalisation et surveillance
    - Le plugin de logging offre des journaux de requêtes d'interface et des journaux d'opérations système
    - Prend en charge des configurations telles que niveaux de log, politiques de rotation, taille et formats d'impression
    - Une série de plugins de télémétrie intègre des outils comme OpenTelemetry et Prometheus, permettant de surveiller n'importe quelle métrique

    Intégration avec des systèmes tiers
    - Utiliser des bases de données tierces comme sources de données
    - Utiliser des API d'autres systèmes comme sources de données
    - Single Sign-On (SSO) pour une authentification fluide
    - S'intégrer sans couture aux systèmes tiers, en formant une seule entité
    - Mettre en œuvre multi-applications et applications parent-enfant entre plusieurs applications NocoBase


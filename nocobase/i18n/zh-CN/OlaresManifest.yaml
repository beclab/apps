metadata:
  title: NocoBase
  description: 低代码平台
spec:
  fullDescription: |
    **默认凭证**
    初始化管理员:    admin@nocobase.com
    初始化管理员密码: admin123
    请尽快更改用户名和密码

    **应用概览**
    NocoBase 是一个极易扩展的开源无代码开发平台。 不必投入几年时间、数百万资金研发，花几分钟时间部署 NocoBase，马上拥有一个私有、可控、极易扩展的无代码开发平台。
    
    **功能亮点**
    数据模型驱动，“数据结构”与“使用界面”分离
    - 数据和 UI 解耦
    - 同一张表、同一条记录可以创建任意数量、任意形态的区块和操作
    - 支持主数据库、外部数据库、第三方 API 作为数据源

    所见即所得，使用超简单
    - 一键切换使用模式和配置模式
    - 页面就是一块画布，在画布上摆放各种区块和操作，组合出合适的界面，就像 Notion
    - 界面配置模式为普通人设计，而不是为程序员设计

    一切皆插件，为扩展开发而生
    - 采用微内核架构，全部功能都是插件，就像 Wordpress
    - 插件即插即用
    - 无论是页面、区块、操作，还是 API、数据源，都可以开发新的插件来满足新的需求

    日志和监控
    - 日志插件提供接口请求日志和系统运行日志
    - 日志支持级别、滚动策略、大小、打印格式等丰富的配置
    - 一系列遥测插件集成了 OpenTelemetry、Prometheus 等设施，让开发者可以监控任何指标

    与已有系统融合
    - 将第三方的数据库作为数据源
    - 将其他系统的 API 作为数据源
    - 单点登录 (SSO)，实现无缝身份验证
    - 与第三方系统互相嵌入，融为一体
    - 多个 NocoBase 应用之间实现多应用、父子应用

  upgradeDescription: |
    上游发布：[NocoBase 2.2](https://www.nocobase.com/en/blog/2.2.0)

    **破坏性变更**

    - 从 1.x 升到 2.x 是大版本升级。升级已有实例前请备份数据库。
    - 文件 URL 改为经权限校验的 `/files/...` 路径。反向代理必须把 `/files/` 转给 NocoBase，而不是前端。

    **变更**

    - 独立的 `/v/` 前端，以及 `/v/mobile` 下的新移动端体验。
    - 评论区块、AI 知识库更新，以及工作流数据库事务节点。

    默认登录仍为 `admin@nocobase.com` / `admin123`。首次登录后请修改。


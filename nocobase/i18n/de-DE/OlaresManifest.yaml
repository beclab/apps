metadata:
  title: NocoBase
  description: No-Code-Plattform
spec:
  upgradeDescription: |
    Upstream-Release: [NocoBase 2.2](https://www.nocobase.com/en/blog/2.2.0)

    **Breaking Change**

    - 1.x nach 2.x ist ein Major-Upgrade. Sichern Sie die Datenbank, bevor Sie eine bestehende Instanz aktualisieren.
    - Datei-URLs nutzen jetzt berechtigunggeprüfte `/files/...`-Pfade. Reverse Proxies müssen `/files/` an NocoBase senden, nicht an das Frontend.

    **Änderungen**

    - Unabhängiges `/v/`-Frontend und eine neue mobile Erfahrung unter `/v/mobile`.
    - Kommentarblöcke, Aktualisierungen der KI-Wissensbasis und ein Datenbank-Transaktionsknoten in Workflows.

    Der Standard-Login bleibt `admin@nocobase.com` / `admin123`. Ändern Sie ihn nach der ersten Anmeldung.

  fullDescription: |
    **Standard-Zugangsdaten**
    Admin-Benutzername: admin@nocobase.com
    Admin-Passwort:  admin123
    Bitte ändern Sie Benutzername und Passwort so bald wie möglich.

    **ÜBERSICHT**
    NocoBase ist eine erweiterbarkeitsorientierte, Open-Source-No-Code-Entwicklungsplattform.

    **Funktionen**

    Datenmodellgetrieben
    - Daten und UI entkoppeln
    - Mehrere Blöcke und Aktionen können für dieselbe Tabelle und denselben Datensatz in beliebiger Menge und Form erstellt werden
    - Unterstützung von Hauptdatenbank, externen Datenbanken und Drittanbieter-APIs als Datenquellen

    What you see is what you get
    - Ein-Klick-Wechsel zwischen Nutzungs- und Konfigurationsmodus
    - Seiten dienen als Leinwand, auf der verschiedene Blöcke und Aktionen zu passenden Oberflächen zusammengestellt werden – ähnlich wie Notion
    - Der UI-Konfigurationsmodus ist für normale Nutzer gedacht, nicht für Programmierer

    Alles als Plugins umgesetzt, für Erweiterungsentwicklung ausgelegt
    - Mikrokernel-Architektur, in der alle Funktionen Plugins sind – ähnlich wie Wordpress
    - Plugins sind nach Installation sofort einsatzbereit
    - Ob Seiten, Blöcke, Aktionen, APIs oder Datenquellen – neue Plugins können neue Anforderungen erfüllen

    Protokollierung & Überwachung
    - Das Logging-Plugin bietet Schnittstellen-Anfrageprotokolle und Systembetriebsprotokolle
    - Unterstützung von Konfigurationen wie Log-Leveln, Rolling-Richtlinien, Größe und Druckformaten
    - Eine Reihe von Telemetrie-Plugins integriert Einrichtungen wie OpenTelemetry und Prometheus, sodass Entwickler jede Metrik überwachen können

    Integration mit Drittsystemen
    - Drittanbieter-Datenbanken als Datenquellen nutzen
    - APIs anderer Systeme als Datenquellen nutzen
    - Single Sign-On (SSO) für nahtlose Authentifizierung
    - Nahtlose Integration mit Drittsystemen zu einer Einheit
    - Multi-Anwendungen und Parent-Child-Anwendungen zwischen mehreren NocoBase-Anwendungen umsetzen


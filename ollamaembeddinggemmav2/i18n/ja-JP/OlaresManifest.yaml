metadata:
  title: EmbeddingGemma (Ollama)
  description: 検索・検索取得・意味的類似向けの Google 製 3 億パラメータ埋め込みモデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **モデル概要**
    EmbeddingGemma は Gemma 3 技術に基づく Google 製の 3 億パラメータ埋め込みモデルです。検索、検索取得、分類、クラスタリング、意味的類似タスク向けにテキストのベクトル表現を生成します。100 以上の言語にわたる 3200 億以上のトークンで学習され、オンデバイスおよび CPU 展開向けに最適化されています。
  upgradeDescription: |
    Ollama ランタイム：ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API：beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 へアップグレード。

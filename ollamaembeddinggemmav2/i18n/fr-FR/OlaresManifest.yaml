metadata:
  title: EmbeddingGemma (Ollama)
  description: Modèle d'embedding Google de 300M de paramètres pour la recherche, la récupération et la similarité sémantique
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **APERÇU DU MODÈLE**
    EmbeddingGemma est un modèle d'embedding de 300M de paramètres de Google basé sur la technologie Gemma 3. Il produit des représentations vectorielles de texte pour la recherche, la récupération, la classification, le clustering et les tâches de similarité sémantique. Entraîné sur plus de 320 milliards de tokens dans plus de 100 langues, optimisé pour le déploiement on-device et CPU.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé dans Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Mise à niveau de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

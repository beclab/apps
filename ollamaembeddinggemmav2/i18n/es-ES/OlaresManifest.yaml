metadata:
  title: EmbeddingGemma (Ollama)
  description: Modelo de embeddings de Google de 300M de parámetros para búsqueda, recuperación y similitud semántica
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **RESUMEN DEL MODELO**
    EmbeddingGemma es un modelo de embeddings de 300M de parámetros de Google basado en la tecnología Gemma 3. Produce representaciones vectoriales de texto para tareas de búsqueda, recuperación, clasificación, clustering y similitud semántica. Entrenado con más de 320 mil millones de tokens en más de 100 idiomas, optimizado para despliegue en dispositivo y CPU.
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

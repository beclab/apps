metadata:
  title: EmbeddingGemma (Ollama)
  description: Modello di embedding di Google da 300M di parametri per ricerca, retrieval e similarità semantica
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA DEL MODELLO**
    EmbeddingGemma è un modello di embedding da 300M di parametri di Google basato sulla tecnologia Gemma 3. Produce rappresentazioni vettoriali del testo per ricerca, retrieval, classificazione, clustering e similarità semantica. Addestrato su oltre 320 miliardi di token in oltre 100 lingue, ottimizzato per il deployment on-device e su CPU.
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Upgrade dell'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

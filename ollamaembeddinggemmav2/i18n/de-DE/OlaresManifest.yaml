metadata:
  title: EmbeddingGemma (Ollama)
  description: Googles Embedding-Modell mit 300M Parametern für Suche, Abruf und semantische Ähnlichkeit
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **MODELLÜBERSICHT**
    EmbeddingGemma ist ein Embedding-Modell mit 300M Parametern von Google, basierend auf Gemma-3-Technologie. Es erzeugt Vektordarstellungen von Text für Suche, Abruf, Klassifikation, Clustering und semantische Ähnlichkeitsaufgaben. Trainiert auf über 320 Milliarden Tokens in mehr als 100 Sprachen, optimiert für On-Device- und CPU-Einsatz.
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.

    Upgrade des Olares-API-Proxy-Images auf beclab/harveyff-olares-ollama:v0.1.21.

  fullDescription: |
    **Modellübersicht**
    Qwen3.6-27B ist ein Vision-Language-Modell der Qwen-Serie (Alibaba). Es integriert multimodales Verständnis mit einem eingebauten Vision-Encoder, unterstützt sehr lange Kontextfenster und bietet Thinking-, Tool-Calling- und Vision-Fähigkeiten. Diese App stellt den `Q4_K_M`-GGUF-Build von `unsloth/Qwen3.6-27B-GGUF` über llama.cpp bereit.

    Empfohlen als Standardmodell für die meisten Szenarien, excelliert es bei agentischem Coding, multimodaler Vision, Konversation und Langtextverarbeitung. Besonders stark ist es auch bei automatisierten Terminaloperationen und dem Schreiben von Code.

    **Voreingestellte Konfiguration**
    - Modell: `unsloth/Qwen3.6-27B-GGUF:Q4_K_M` (mit `mmproj-F16.gguf`-Projektor für Vision)
    - Fähigkeiten: thinking, tools, vision
    - Engine-Args: `-c 131072 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1` (128K-Kontext, volles GPU-Offload, KV-Cache auf q8_0 quantisiert)
    - Erforderlicher GPU-Speicher: `23Gi`

    **Accelerator-Modi**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Nutzt `23Gi` GPU-Speicher; `-ngl all` für volle GPU  |
    | `nvidia-gb10`  | GPU (Spark)       | Wie oben, aber Speicher wird vom Pod verwaltet     |

    **So funktioniert es**
    Zuerst lädt die Model Console das Modell herunter und bereitet es vor, dann startet `llama.cpp` die Bereitstellung, sobald es bereit ist. Beide Teile laufen getrennt, teilen aber Dateien und Fortschrittsinformationen.

    **Stack**
    - **llama.cpp**: Führt das Modell aus und bedient API-Anfragen (Port 8081)
    - **Model Console**: Lädt das Modell herunter, zeigt den Fortschritt und stellt die OpenAI-API auf Port 8090 bereit, mit Proxy zu `llamacpp`.

    **Modellspeicher**
    Alle Modelldateien liegen in einem gemeinsamen Ordner unter `appCommon/huggingface`, gemountet als `/cache/hf/hub`. Alle ähnlichen Apps nutzen diesen Ort für Modelle.

  fullDescription: |
    **Panoramica del modello**
    Qwen3.6-27B è un modello visione-linguaggio della serie Qwen (Alibaba). Integra comprensione multimodale con un encoder di visione incorporato, supporta finestre di contesto molto lunghe e offre capacità di thinking, tool-calling e vision. Questa app serve il build GGUF `Q4_K_M` da `unsloth/Qwen3.6-27B-GGUF` tramite llama.cpp.

    Consigliato come modello predefinito per la maggior parte degli scenari, eccelle nel coding agentico, nella vision multimodale, nell'interazione conversazionale e nell'elaborazione di testi lunghi. Ottimo anche per operazioni di terminale automatizzate e scrittura di codice.

    **Configurazione preimpostata**
    - Modello: `unsloth/Qwen3.6-27B-GGUF:Q4_K_M` (con proiettore `mmproj-F16.gguf` per la vision)
    - Capacità: thinking, tools, vision
    - Argomenti engine: `-c 131072 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1` (contesto 128K, offload GPU completo, cache KV quantizzata a q8_0)
    - Memoria GPU richiesta: `23Gi`

    **Modalità accelerator**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` di memoria GPU; `-ngl all` per GPU completa  |
    | `nvidia-gb10`  | GPU (Spark)       | Come sopra, ma la memoria è gestita dal pod     |

    **Come funziona**
    Prima Model Console scarica e prepara il modello, poi `llama.cpp` inizia a servirlo quando è pronto. Le due parti girano separatamente ma condividono file e info di avanzamento.

    **Stack**
    - **llama.cpp**: Esegue il modello e serve le richieste API (porta 8081)
    - **Model Console**: Scarica il modello, mostra i progressi e fornisce l'API OpenAI sulla porta 8090, facendo proxy verso `llamacpp`.

    **Archiviazione modello**
    Tutti i file del modello sono in una cartella condivisa in `appCommon/huggingface`, montata come `/cache/hf/hub`. Tutte le app simili usano questa posizione per i modelli.

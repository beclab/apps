  fullDescription: |
    **Resumen del modelo**
    Qwen3.6-27B es un modelo visión-lenguaje de la serie Qwen (Alibaba). Integra comprensión multimodal con un codificador de visión integrado, admite ventanas de contexto muy largas y ofrece capacidades de thinking, tool-calling y visión. Esta app sirve el build GGUF `Q4_K_M` de `unsloth/Qwen3.6-27B-GGUF` mediante llama.cpp.

    Recomendado como modelo predeterminado para la mayoría de escenarios, destaca en coding agentico, visión multimodal, interacción conversacional y procesamiento de textos largos. También rinde especialmente bien en operaciones de terminal automatizadas y escritura de código.

    **Configuración preestablecida**
    - Modelo: `unsloth/Qwen3.6-27B-GGUF:Q4_K_M` (con proyector `mmproj-F16.gguf` para visión)
    - Capacidades: thinking, tools, vision
    - Args del motor: `-c 131072 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1` (contexto 128K, offload GPU completo, caché KV cuantizada a q8_0)
    - Memoria GPU requerida: `23Gi`

    **Modos de acelerador**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` de memoria GPU; `-ngl all` para GPU completa  |
    | `nvidia-gb10`  | GPU (Spark)       | Como arriba, pero la memoria la gestiona el pod     |

    **Cómo funciona**
    Primero, Model Console descarga el modelo y lo prepara; luego `llama.cpp` empieza a servirlo cuando está listo. Ambas partes se ejecutan por separado pero comparten archivos e información de progreso.

    **Stack**
    - **llama.cpp**: Ejecuta el modelo y atiende peticiones API (puerto 8081)
    - **Model Console**: Descarga el modelo, muestra el progreso y ofrece la API OpenAI en el puerto 8090, haciendo proxy a `llamacpp`.

    **Almacenamiento del modelo**
    Todos los archivos del modelo se guardan en una carpeta compartida en `appCommon/huggingface`, montada como `/cache/hf/hub`. Todas las apps similares usan esta ubicación para modelos.

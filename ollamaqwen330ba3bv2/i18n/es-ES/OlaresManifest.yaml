metadata:
  title: Qwen3 30B A3B (Ollama)
  description: La última generación de grandes modelos de lenguaje de la serie Qwen, con una suite completa de modelos densos y de mixture-of-experts (MoE)

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **Model OVERVIEW**
    Qwen3 es la última generación de grandes modelos de lenguaje de la serie Qwen, con una suite completa de modelos densos y de mixture-of-experts (MoE). Gracias a un entrenamiento extensivo, Qwen3 aporta avances revolucionarios en razonamiento, seguimiento de instrucciones, capacidades de agente y soporte multilingüe.

    Características clave:
    Soporte único para cambiar sin problemas entre el modo thinking (para razonamiento lógico complejo, matemáticas y código) y el modo non-thinking (para diálogo general eficiente) dentro de un mismo modelo, garantizando un rendimiento óptimo en diversos escenarios.

    Mejora significativa de las capacidades de razonamiento, superando a los modelos QwQ anteriores (en modo thinking) y a los modelos instruct Qwen2.5 (en modo non-thinking) en matemáticas, generación de código y razonamiento de sentido común.

    Alineación superior con las preferencias humanas, destacando en escritura creativa, role-playing, diálogos multiturno y seguimiento de instrucciones, para una experiencia conversacional más natural, atractiva e inmersiva.

    Experiencia en capacidades de agente, permitiendo una integración precisa con herramientas externas en modos thinking y non-thinking y logrando un rendimiento líder entre modelos open-source en tareas complejas basadas en agentes.

    Soporte de más de 100 idiomas y dialectos con sólidas capacidades de seguimiento de instrucciones multilingües y traducción.
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

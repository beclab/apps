metadata:
  title: Qwen3 30B A3B (Ollama)
  description: La dernière génération de grands modèles de langage de la série Qwen, offrant une suite complète de modèles dense et mixture-of-experts (MoE)

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **Model OVERVIEW**
    Qwen3 est la dernière génération de grands modèles de langage de la série Qwen, offrant une suite complète de modèles dense et mixture-of-experts (MoE). Grâce à un entraînement approfondi, Qwen3 apporte des avancées majeures en raisonnement, suivi d'instructions, capacités d'agent et support multilingue.

    Fonctionnalités clés :
    Prise en charge unique du basculement transparent entre le mode thinking (pour le raisonnement logique complexe, les maths et le code) et le mode non-thinking (pour un dialogue général efficace) au sein d'un même modèle, garantissant des performances optimales dans divers scénarios.

    Amélioration significative des capacités de raisonnement, surpassant les précédents modèles QwQ (en mode thinking) et les modèles instruct Qwen2.5 (en mode non-thinking) en mathématiques, génération de code et raisonnement de sens commun.

    Alignement supérieur sur les préférences humaines, excellant en écriture créative, jeu de rôle, dialogues multi-tours et suivi d'instructions, pour une expérience conversationnelle plus naturelle, engageante et immersive.

    Expertise des capacités d'agent, permettant une intégration précise avec des outils externes dans les deux modes et atteignant des performances de premier plan parmi les modèles open source sur des tâches agentiques complexes.

    Prise en charge de plus de 100 langues et dialectes avec de solides capacités de suivi d'instructions multilingues et de traduction.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé dans Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Mise à niveau de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

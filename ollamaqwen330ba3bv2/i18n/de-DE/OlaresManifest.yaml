metadata:
  title: Qwen3 30B A3B (Ollama)
  description: Die neueste Generation großer Sprachmodelle der Qwen-Serie mit einer umfassenden Suite dichter und Mixture-of-Experts-(MoE)-Modelle

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **ModellÜBERSICHT**
    Qwen3 ist die neueste Generation großer Sprachmodelle der Qwen-Serie und bietet eine umfassende Suite dichter und Mixture-of-Experts-(MoE)-Modelle. Dank umfangreichen Trainings liefert Qwen3 bahnbrechende Fortschritte bei Reasoning, Instruction-Following, Agent-Fähigkeiten und Mehrsprachigkeit.

    Hauptfunktionen:
    Einzigartige Unterstützung für nahtloses Umschalten zwischen Thinking-Modus (für komplexes logisches Reasoning, Mathematik und Coding) und Non-Thinking-Modus (für effizienten Allzweck-Dialog) innerhalb eines einzelnen Modells — für optimale Leistung in verschiedenen Szenarien.

    Deutliche Verbesserung der Reasoning-Fähigkeiten, die frühere QwQ-Modelle (im Thinking-Modus) und Qwen2.5-Instruct-Modelle (im Non-Thinking-Modus) bei Mathematik, Codegenerierung und Common-Sense-Reasoning übertreffen.

    Überlegene Ausrichtung an menschlichen Präferenzen — hervorragend in kreativem Schreiben, Rollenspiel, Mehrturn-Dialogen und Instruction-Following für natürlichere, fesselndere und immersivere Gespräche.

    Expertise bei Agent-Fähigkeiten — präzise Integration externer Tools in Thinking- und Non-Thinking-Modi und führende Leistung unter Open-Source-Modellen bei komplexen agentenbasierten Aufgaben.

    Unterstützung für über 100 Sprachen und Dialekte mit starken Fähigkeiten bei mehrsprachigem Instruction-Following und Übersetzung.
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.

    Upgrade des Olares-API-Proxy-Images auf beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: Qwen3 30B A3B (Ollama)
  description: 密なモデルと Mixture-of-Experts（MoE）モデルの包括的スイートを提供する、Qwen シリーズ最新世代の大規模言語モデル

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **Model OVERVIEW**
    Qwen3 は Qwen シリーズ最新世代の大規模言語モデルで、密なモデルと Mixture-of-Experts（MoE）モデルの包括的スイートを提供します。大規模な学習により、Qwen3 は推論、指示追従、エージェント能力、多言語対応で画期的な進歩を実現します。

    主な特長：
    単一モデル内で thinking モード（複雑な論理推論・数学・コーディング向け）と non-thinking モード（効率的な汎用対話向け）をシームレスに切り替え可能で、さまざまなシナリオで最適な性能を確保。

    推論能力を大幅に強化し、数学・コード生成・常識的論理推論で従来の QwQ（thinking モード）および Qwen2.5 instruct（non-thinking モード）を上回る。

    人間の嗜好への高いアラインメントにより、創作、ロールプレイ、マルチターン対話、指示追従で優れ、より自然で魅力的・没入感のある会話体験を提供。

    エージェント能力に精通し、thinking / non-thinking 両モードで外部ツールと精密に統合し、複雑なエージェントタスクでオープンソースモデルの中でトップクラスの性能を達成。

    100 以上の言語・方言をサポートし、多言語の指示追従と翻訳に強い能力を持つ。
  upgradeDescription: |
    Ollama ランタイム：ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API：beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 へアップグレード。

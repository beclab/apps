metadata:
  title: FreshRSS
  description: Un agregador de feeds gratuito y autoalojable
spec:
  fullDescription: |
    FreshRSS es un agregador de feeds RSS y Atom autoalojado. Es ligero, fácil de usar, potente y personalizable.
    
    **Funciones**
    - Control independiente de datos: Admite despliegue autoalojado, permitiendo a los usuarios tener control total sobre sus datos sin depender de terceros, garantizando privacidad y seguridad.
    - Open-Source y actualizaciones estables: Código abierto bajo licencia AGPL 3, con una comunidad activa. Ha mantenido iteraciones y actualizaciones continuas de 2023 a 2024, asegurando una sólida estabilidad.
    - Agregación de contenido multi-fuente: Agrega feeds RSS/Atom de sitios web, podcasts y canales de vídeo. También puede hacer scraping de sitios sin feeds oficiales para generar fuentes de suscripción personalizadas.
    - Gestión eficiente de contenido: Permite buscar y guardar consultas, generar nuevos feeds basados en reglas, y marcar, favoritar y categorizar artículos.
    - Sincronización en tiempo real y migración: Logra sincronización de contenido en tiempo real basada en WebSub, y admite importar/exportar listas de suscripción en formato OPML.
    - Personalización y permisos flexibles: Ofrece personalización de temas y extensiones, así como gestión de permisos multiusuario.
    - Adaptación multi-dispositivo y alta eficiencia: Diseño responsive compatible con ordenadores y móviles, capaz de gestionar eficientemente más de 1 millón de artículos y más de 50,000 feeds.
    - Soporte multiidioma e integración: Admite más de 15 idiomas y proporciona interfaces API para clientes de terceros o sistemas propios.
    - Despliegue de bajo umbral: Bajo umbral de despliegue, compatible con servidores web principales y documentación de instalación detallada, ideal para principiantes.
  upgradeDescription: |
    Actualizar FreshRSS a 1.29.1 (`freshrss/freshrss:1.29.1`), seguimiento de correcciones de 1.29.0.

    Destacados: importar URLs de feeds desde `.txt` además de OPML, CLI de exportación SQLite periódica, más fechas de feed, cookies, búsqueda en consultas compartidas y mejor compatibilidad de navegadores.

    Notas: https://github.com/FreshRSS/FreshRSS/releases/tag/1.29.1

metadata:
  title: FreshRSS
  description: 無料でセルフホスト可能なフィードアグリゲーター
spec:
  fullDescription: |
    FreshRSS はセルフホスト型の RSS / Atom フィードアグリゲーターです。軽量で扱いやすく、強力かつカスタマイズ可能です。
    
    **機能**
    - 独立したデータ管理: セルフホスト展開に対応し、サードパーティに依存せずデータを完全に管理でき、プライバシーとセキュリティを確保。
    - オープンソースと安定した更新: AGPL 3 ライセンスのオープンソースで、活発なコミュニティあり。2023〜2024 年も継続的に更新され、高い安定性を維持。
    - マルチソースのコンテンツ集約: Web サイトの RSS/Atom フィード、ポッドキャスト、動画チャンネルを集約。公式フィードがないサイトもスクレイピングして独自購読源を生成可能。
    - 効率的なコンテンツ管理: 検索とクエリ保存、ルールに基づく新フィード生成、記事のマーク・お気に入り・カテゴリ分けに対応。
    - リアルタイム同期と移行: WebSub に基づくリアルタイム同期、OPML 形式の購読リストのインポート／エクスポートに対応。
    - 柔軟なカスタマイズと権限: テーマと拡張のカスタマイズ、マルチユーザー権限管理を提供。
    - マルチデバイス対応と高効率: PC／スマホ対応のレスポンシブデザインで、100 万件超の記事と 5 万超のフィードを効率管理可能。
    - 多言語対応と統合: 15 以上の言語に対応し、サードパーティクライアントや独自システム向け API を提供。
    - 低い導入ハードル: 主要 Web サーバーと互換で、詳細なインストール文書あり、初心者でも始めやすい。
  upgradeDescription: |
    FreshRSS を 1.30.4（`freshrss/freshrss:1.30.4`）へ更新します。

    1.30.4 は 1.30.x のセキュリティ更新の続きです。1.30.3 は PHP CVE-2026-109618 と CVE-2026-109619 に対応するため、既定の Debian イメージを更新します（PHP 8.4.27、Apache 2.4.69）。1.30.4 は PHP `session.upload_progress` を無効にし、Alpine イメージを更新します。1.30.0 以降、1.30.1–1.30.2 はフィード更新、検索、共有の退行も修正します。変更履歴にスキーマ変更の記載はありません。PostgreSQL のデータと `/var/www/FreshRSS/data` はそのままです。`INTERNAL_HOST_ALLOWLIST` を設定しない限り、ローカルネットワークのフィードは拒否されたままです。

    詳細: https://github.com/FreshRSS/FreshRSS/releases/tag/1.30.4

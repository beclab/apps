metadata:
  title: FreshRSS
  description: Un aggregatore di feed gratuito e self-hostable
spec:
  fullDescription: |
    FreshRSS è un aggregatore di feed RSS e Atom self-hosted. È leggero, facile da usare, potente e personalizzabile.
    
    **Funzioni**
    - Controllo indipendente dei dati: Supporta il deployment self-hosted, consentendo agli utenti il pieno controllo sui propri dati senza dipendere da terze parti, garantendo privacy e sicurezza.
    - Open-Source e aggiornamenti stabili: Open-source sotto licenza AGPL 3, con una community attiva. Ha mantenuto iterazioni e aggiornamenti continui dal 2023 al 2024, assicurando solida stabilità.
    - Aggregazione di contenuti multi-fonte: Aggrega feed RSS/Atom di siti web, podcast e canali video. Può anche fare scraping di siti senza feed ufficiali per generare fonti di sottoscrizione personalizzate.
    - Gestione efficiente dei contenuti: Consente di cercare e salvare query, generare nuovi feed basati su regole e contrassegnare, mettere nei preferiti e categorizzare gli articoli.
    - Sync in tempo reale e migrazione: Ottiene sincronizzazione dei contenuti in tempo reale basata su WebSub e supporta import/export di liste di sottoscrizione in formato OPML.
    - Personalizzazione e permessi flessibili: Offre personalizzazione di temi ed estensioni, nonché gestione dei permessi multiutente.
    - Adattamento multi-dispositivo e ad alta efficienza: Design responsive compatibile con computer e telefoni, capace di gestire efficientemente oltre 1 milione di articoli e oltre 50,000 feed.
    - Supporto multilingue e integrazione: Supporta più di 15 lingue e fornisce interfacce API per client di terze parti o sistemi proprietari.
    - Deployment a bassa soglia: Bassa soglia di deployment, compatibile con i principali web server e documentazione di installazione dettagliata, adatto anche ai principianti.
  upgradeDescription: |
    Aggiornare FreshRSS a 1.30.4 (`freshrss/freshrss:1.30.4`).

    1.30.4 prosegue gli aggiornamenti di sicurezza 1.30.x. 1.30.3 aggiorna l’immagine Debian predefinita per PHP CVE-2026-109618 e CVE-2026-109619 (PHP 8.4.27, Apache 2.4.69). 1.30.4 disattiva PHP `session.upload_progress` e aggiorna l’immagine Alpine. Dal 1.30.0, 1.30.1–1.30.2 correggono anche regressioni di aggiornamento, ricerca e condivisione. I changelog non annunciano un cambio di schema. I dati PostgreSQL e `/var/www/FreshRSS/data` restano al loro posto. Gli indirizzi dei feed nella rete locale restano bloccati salvo impostare `INTERNAL_HOST_ALLOWLIST`.

    Dettagli: https://github.com/FreshRSS/FreshRSS/releases/tag/1.30.4

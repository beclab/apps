metadata:
  title: FreshRSS
  description: Un agrégateur de flux gratuit et auto-hébergeable
spec:
  fullDescription: |
    FreshRSS est un agrégateur de flux RSS et Atom auto-hébergé. Il est léger, facile à utiliser, puissant et personnalisable.
    
    **Fonctionnalités**
    - Contrôle indépendant des données : Prend en charge le déploiement auto-hébergé, permettant aux utilisateurs un contrôle total de leurs données sans dépendance tierce, garantissant confidentialité et sécurité.
    - Open source et mises à jour stables : Open source sous licence AGPL 3, avec une communauté active. Il a maintenu des itérations et mises à jour continues de 2023 à 2024, assurant une forte stabilité.
    - Agrégation de contenu multi-sources : Agrège les flux RSS/Atom de sites web, podcasts et chaînes vidéo. Peut aussi scraper des sites sans flux officiels pour générer des sources d'abonnement personnalisées.
    - Gestion efficace du contenu : Permet de rechercher et d'enregistrer des requêtes, de générer de nouveaux flux basés sur des règles, et de marquer, mettre en favori et catégoriser des articles.
    - Sync temps réel et migration : Obtient une synchronisation de contenu en temps réel basée sur WebSub, et prend en charge l'import/export de listes d'abonnements au format OPML.
    - Personnalisation et permissions flexibles : Offre la personnalisation de thèmes et d'extensions, ainsi que la gestion des permissions multi-utilisateurs.
    - Adaptation multi-appareils et haute efficacité : Design responsive compatible ordinateurs et téléphones, capable de gérer efficacement plus d'1 million d'articles et plus de 50 000 flux.
    - Support multilingue et intégration : Prend en charge plus de 15 langues et fournit des interfaces API pour des clients tiers ou des systèmes propriétaires.
    - Déploiement à faible seuil : Seuil de déploiement bas, compatible avec les serveurs web courants et documentation d'installation détaillée, adapté aux débutants.
  upgradeDescription: |
    Mettre à niveau FreshRSS vers 1.30.4 (`freshrss/freshrss:1.30.4`).

    1.30.4 poursuit les correctifs de sécurité 1.30.x. 1.30.3 met à jour l’image Debian par défaut pour PHP CVE-2026-109618 et CVE-2026-109619 (PHP 8.4.27, Apache 2.4.69). 1.30.4 désactive PHP `session.upload_progress` et met à jour l’image Alpine. Depuis 1.30.0, 1.30.1–1.30.2 corrigent aussi des régressions d’actualisation, de recherche et de partage. Les journaux de modifications n’annoncent pas de changement de schéma. Les données PostgreSQL et `/var/www/FreshRSS/data` restent en place. Les adresses de flux du réseau local restent refusées sauf si `INTERNAL_HOST_ALLOWLIST` est défini.

    Détails : https://github.com/FreshRSS/FreshRSS/releases/tag/1.30.4

metadata:
  title: n8n
  description: n8n は拡張可能なワークフロー自動化ツールです

spec:
  fullDescription: |
    n8n は拡張可能なワークフロー自動化ツールです。フェアコード配布モデルにより、ソースコードは常に可視で、セルフホスト可能、独自の関数・ロジック・アプリを追加できます。ノードベースのアプローチにより非常に汎用的で、あらゆるものをすべてに接続できます。

    **利用可能な連携**
    n8n にはワークフロー自動化用の 200 以上の異なるノードがあります。一覧はこちら: https://n8n.io/integrations

    **強力なワークフローを、本当に速く**
    - 本当に複雑なプロセスを処理  
    - シンプルなデバッグ  
    - テンプレートで素早く開始  
    - 必要なときはコード、不要なときは UI  
    - 作業を再利用

    **安心感**
    - あらゆるシステムに接続  
    - エラー処理をカスタマイズ  
    - 水平スケーリング  
    - 自前インフラでホスト

    **機能**
    - ビジュアルワークフローエディタ
    - JavaScript の実行
    - npm パッケージのインポート
    - ワークフローの待機
    - 条件分岐ロジック
    - Webhook トリガー
    - 失敗した実行の再試行
    - マルチトリガーワークフロー
    - ソースコード利用可能
    - ユーザー管理
    - カスタムノードの作成
    - 暗号化された認証情報ストア
    - ワークフローのコピー＆ペースト
    - ワークフローの JSON エクスポート
    - カスタムエラーワークフロー

  upgradeDescription: |
    n8n 2.40.7 → 2.49.5

    複数バージョンにわたるアップデートで、AI エージェントとワークフロー構築体験を強化しました。Google Vertex AI 認証情報、Microsoft Foundry（Claude 対応）、Anthropic プロンプトキャッシュを追加し、AI エージェントのツール呼び出し履歴や複数ターン記憶、MCP／Webhook 認証、実行安定性を向上しています。認証情報テスト時のトークン更新や式エンジンの不具合も修正されました。

    [リリースノート](https://github.com/n8n-io/n8n/releases/tag/n8n%402.49.5)

metadata:
  title: n8n
  description: n8n est un outil d'automatisation de workflows extensible

spec:
  fullDescription: |
    n8n est un outil d'automatisation de workflows extensible. Avec un modèle de distribution fair-code, n8n aura toujours un code source visible, sera disponible en auto-hébergement et vous permettra d'ajouter vos propres fonctions, logique et apps. L'approche par nœuds le rend très polyvalent, connectant n'importe quoi à tout.

    **Intégrations disponibles**
    n8n compte plus de 200 nœuds différents pour automatiser les workflows. La liste se trouve sur : https://n8n.io/integrations

    **Des workflows puissants, vraiment rapides**
    - Gérer des processus vraiment complexes  
    - Débogage simple  
    - Utiliser des modèles pour démarrer vite  
    - Du code quand il le faut, une UI sinon  
    - Réutiliser votre travail

    **L'esprit tranquille**
    - Se connecter à n'importe quel système  
    - Personnaliser la gestion des erreurs  
    - Mise à l'échelle horizontale  
    - Héberger sur votre propre infrastructure

    **Fonctionnalités**
    - Éditeur de workflow visuel
    - Exécuter du JavaScript
    - Import de paquets npm
    - Les workflows peuvent attendre
    - Logique conditionnelle et branchement
    - Déclencheurs webhook
    - Réessayer les exécutions échouées
    - Workflows multi-déclencheurs
    - Code source disponible
    - Gestion des utilisateurs
    - Créer des nœuds personnalisés
    - Magasin d'identifiants chiffré
    - Copier-coller des workflows
    - Exporter les workflows en JSON
    - Workflows d'erreur personnalisés

  upgradeDescription: |
    Mettre à niveau n8n vers 2.40.7 (chart 1.1.8).

    **Changements de déploiement**
    - Image : `n8nio/n8n:2.40.7`
    - HostPath, reverse-proxy et timeouts inchangés : `N8N_WEBHOOK_URL`, `N8N_PROTOCOL`, `N8N_EDITOR_BASE_URL`, `N8N_PROXY_HOPS`, `N8N_SECURE_COOKIE`, `N8N_RUNNERS_TASK_TIMEOUT=300`

    **Notes env / démarrage (2.33.0 → 2.40.7)**
    - Aucun changement obligatoire de commande de démarrage (entrypoint par défaut de l'image)
    - Aucune nouvelle variable d'environnement obligatoire pour ce chart
    - Mise à niveau rolling 2.x upstream ; les migrations de base de données s'exécutent automatiquement au démarrage

    **Notes importantes**
    - Vérifier la compatibilité des workflows dans Paramètres > Rapport de migration après la mise à niveau
    - npm latest / Docker Hub `latest` et `stable` pointent actuellement vers 2.40.7

    Voir : https://github.com/n8n-io/n8n/releases/tag/n8n%402.40.7

metadata:
  title: n8n
  description: n8n es una herramienta extensible de automatización de flujos de trabajo

spec:
  fullDescription: |
    n8n es una herramienta extensible de automatización de flujos de trabajo. Con un modelo de distribución fair-code, n8n tendrá siempre el código fuente visible, estará disponible para autoalojamiento y le permitirá añadir funciones, lógica y apps propias. El enfoque basado en nodos lo hace muy versátil, conectando cualquier cosa con todo.

    **Integraciones disponibles**
    n8n tiene más de 200 nodos distintos para automatizar flujos. La lista está en: https://n8n.io/integrations

    **Flujos potentes, muy rápido**
    - Gestionar procesos realmente complejos  
    - Depuración sencilla  
    - Usar plantillas para empezar rápido  
    - Código cuando lo necesite, UI cuando no  
    - Reutilizar su trabajo

    **Tranquilidad**
    - Conectar con cualquier sistema  
    - Personalizar el manejo de errores  
    - Escalado horizontal  
    - Alojar en su propia infraestructura

    **Características**
    - Editor visual de flujos
    - Ejecutar JavaScript
    - Importar paquetes npm
    - Los flujos pueden esperar
    - Lógica condicional y ramificación
    - Disparadores webhook
    - Reintentar ejecuciones fallidas
    - Flujos multi-disparador
    - Código fuente disponible
    - Gestión de usuarios
    - Crear nodos personalizados
    - Almacén de credenciales cifrado
    - Copiar y pegar flujos
    - Exportar flujos a JSON
    - Flujos de error personalizados

  upgradeDescription: |
    Actualizar n8n a 2.40.7 (chart 1.1.8).

    **Cambios de despliegue**
    - Imagen: `n8nio/n8n:2.40.7`
    - HostPath, reverse-proxy y timeouts sin cambios: `N8N_WEBHOOK_URL`, `N8N_PROTOCOL`, `N8N_EDITOR_BASE_URL`, `N8N_PROXY_HOPS`, `N8N_SECURE_COOKIE`, `N8N_RUNNERS_TASK_TIMEOUT=300`

    **Notas de env / arranque (2.33.0 → 2.40.7)**
    - Sin cambios obligatorios en el comando de arranque (entrypoint por defecto de la imagen)
    - Sin nuevas variables de entorno obligatorias para este chart
    - Actualización rolling 2.x de upstream; las migraciones de base de datos se ejecutan automáticamente al arrancar

    **Notas importantes**
    - Revise la compatibilidad de flujos en Ajustes > Informe de migración tras la actualización
    - npm latest / Docker Hub `latest` y `stable` apuntan actualmente a 2.40.7

    Véase: https://github.com/n8n-io/n8n/releases/tag/n8n%402.40.7

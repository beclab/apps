metadata:
  title: n8n
  description: n8n ist ein erweiterbares Workflow-Automatisierungstool

spec:
  fullDescription: |
    n8n ist ein erweiterbares Workflow-Automatisierungstool. Mit einem Fair-Code-Verteilungsmodell hat n8n stets sichtbaren Quellcode, ist selbst hostbar und erlaubt eigene Funktionen, Logik und Apps. Der knotenbasierte Ansatz macht n8n hochgradig vielseitig und verbindet alles mit allem.

    **Verfügbare Integrationen**
    n8n hat über 200 verschiedene Nodes zur Workflow-Automatisierung. Die Liste finden Sie unter: https://n8n.io/integrations

    **Leistungsstarke Workflows, wirklich schnell**
    - Wirklich komplexe Prozesse handhaben  
    - Einfaches Debugging  
    - Vorlagen für einen schnellen Start  
    - Code wenn nötig, UI wenn nicht  
    - Arbeit wiederverwenden

    **Ruhe bewahren**
    - Mit jedem System verbinden  
    - Fehlerbehandlung anpassen  
    - Horizontale Skalierung  
    - Auf eigener Infrastruktur hosten

    **Funktionen**
    - Visueller Workflow-Editor
    - JavaScript ausführen
    - npm-Paketimport
    - Workflows können warten
    - Bedingte Logik und Verzweigung
    - Webhook-Trigger
    - Fehlgeschlagene Ausführungen erneut versuchen
    - Multi-Trigger-Workflows
    - Quellcode verfügbar
    - Benutzerverwaltung
    - Eigene Nodes erstellen
    - Verschlüsselter Credential-Store
    - Workflows kopieren + einfügen
    - Workflows nach JSON exportieren
    - Eigene Fehler-Workflows

  upgradeDescription: |
    n8n auf 2.40.7 aktualisieren (Chart 1.1.8).

    **Bereitstellungsänderungen**
    - Image: `n8nio/n8n:2.40.7`
    - HostPath-, Reverse-Proxy- und Timeout-Envs unverändert: `N8N_WEBHOOK_URL`, `N8N_PROTOCOL`, `N8N_EDITOR_BASE_URL`, `N8N_PROXY_HOPS`, `N8N_SECURE_COOKIE`, `N8N_RUNNERS_TASK_TIMEOUT=300`

    **Env-/Startup-Hinweise (2.33.0 → 2.40.7)**
    - Keine erforderlichen Startup-Befehl-Änderungen (Standard-Image-Entrypoint)
    - Keine neuen Pflicht-Umgebungsvariablen für dieses Chart
    - Upstream-2.x-Rolling-Upgrade; Datenbankmigrationen laufen automatisch beim Start

    **Wichtige Hinweise**
    - Workflow-Kompatibilität nach dem Upgrade unter Einstellungen > Migrationsbericht prüfen
    - npm latest / Docker Hub `latest` und `stable` zeigen derzeit auf 2.40.7

    Siehe: https://github.com/n8n-io/n8n/releases/tag/n8n%402.40.7

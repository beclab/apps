metadata:
  title: n8n
  description: n8n 是一款可扩展的工作流自动化工具。

spec:
  fullDescription: |
    n8n 是一款可扩展的工作流自动化工具。n8n 采用开放源码，支持自托管，您还可以添加自定义功能和应用。n8n 的节点式架构让它具备高度的灵活性，能连接任何东西到一切。

    **海量工作流**
    n8n 提供超过 200 种不同节点用于自动化工作流。更多信息请见：https://n8n.io/integrations

    **快速构建强大的工作流程**
    - 处理复杂流程  
    - 简化调试  
    - 使用模板快速启动  
    - 需要编程时编码，不需要时用 UI  
    - 复用成果

    **安心无忧**
    - 接入任何系统  
    - 自定义错误处理  
    - 横向扩展  
    - 在自有基础设施上部署

    **功能**
    - 可视化工作流编辑器
    - 执行 JavaScript
    - 引入 npm 包
    - 工作流可暂停
    - 条件逻辑与分支
    - Webhook 触发
    - 重试失败任务
    - 多触发器工作流
    - 开放源代码
    - 用户管理
    - 制作自定义节点
    - 加密的凭证存储
    - 复制粘贴工作流
    - 工作流导出为 JSON
    - 定制错误处理流程

  upgradeDescription: |
    升级 n8n 至 2.33.0（chart 1.1.3）。移除旧版 Olares 1.12.3 appData 路径分支逻辑。

    **部署变更**
    - 镜像：`n8nio/n8n:2.33.0`
    - HostPath 统一使用 `userspace.appData/`（最低 Olares 1.12.6；删除 `sysVersion >= 1.12.3` 分支）
    - 仅使用 `N8N_WEBHOOK_URL`（移除已弃用的 `WEBHOOK_URL`）
    - 固定 `N8N_RUNNERS_TASK_TIMEOUT=300`，保持当前 5 分钟 Code/Runner 任务超时
    - 其余反代环境变量不变：`N8N_PROTOCOL`、`N8N_EDITOR_BASE_URL`、`N8N_PROXY_HOPS`、`N8N_SECURE_COOKIE`

    **环境变量 / 启动参数说明（2.27.5 → 2.33.0）**
    - 无需改启动命令（沿用镜像默认入口）
    - 可选新变量（本 Chart 未设置）：`N8N_SCHEDULER_MAX_ATTEMPTS`、`N8N_MCP_BASE_URL`、agents tracing 相关变量

    **重要提示**
    - 启动时自动执行数据库迁移
    - 请在「设置 > 迁移报告」检查工作流兼容性

    详见：https://github.com/n8n-io/n8n/releases/tag/n8n%402.33.0

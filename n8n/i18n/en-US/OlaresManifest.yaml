metadata:
  title: n8n
  description: n8n is an extendable workflow automation tool.

spec:
  fullDescription: |
    n8n is an extendable workflow automation tool. With a fair-code distribution model, n8n will always have visible source code, be available to self-host, and allow you to add your own custom functions, logic and apps. n8n's node-based approach makes it highly versatile, enabling you to connect anything to everything.

    **Available integrations**
    n8n has 200+ different nodes to automate workflows. The list can be found on: https://n8n.io/integrations

    **Build powerful workflows, really fast**
    - Handle really complex processes  
    - Simple debugging  
    - Use templates to get started fast  
    - Code when you need it, UI when you don't  
    - Reuse your work

    **Get peace of mind**
    - Connect to any system  
    - Customize error handling  
    - Horizontal scaling  
    - Host on your own infrastructure

    **Features**
    - Visual workflow editor
    - Run JavaScript
    - npm package import
    - Workflows can wait
    - Conditional logic and branching
    - Webhook triggers
    - Retry failed executions
    - Multi-trigger workflows
    - Source code available
    - User management
    - Create custom nodes
    - Encrypted credential store
    - Copy + paste workflows
    - Export workflows to JSON
    - Custom error workflows

  upgradeDescription: |
    Upgrade n8n to 2.33.0 (chart 1.1.3). Drop legacy Olares 1.12.3 appData path branching.

    **Deployment Changes**
    - Image: `n8nio/n8n:2.33.0`
    - HostPath always uses `userspace.appData/` (minimum Olares 1.12.6; remove `sysVersion >= 1.12.3` branch)
    - Use `N8N_WEBHOOK_URL` only (drop deprecated `WEBHOOK_URL`)
    - Pin `N8N_RUNNERS_TASK_TIMEOUT=300` to keep the current 5-minute Code/runner task timeout
    - Other reverse-proxy envs unchanged: `N8N_PROTOCOL`, `N8N_EDITOR_BASE_URL`, `N8N_PROXY_HOPS`, `N8N_SECURE_COOKIE`

    **Env / startup notes (2.27.5 → 2.33.0)**
    - No required startup-command changes (default image entrypoint)
    - Optional new vars (not set by this chart): `N8N_SCHEDULER_MAX_ATTEMPTS`, `N8N_MCP_BASE_URL`, agents-tracing related envs

    **Important Notes**
    - Database migrations run automatically on startup
    - Review workflow compatibility using Settings > Migration Report

    See: https://github.com/n8n-io/n8n/releases/tag/n8n%402.33.0

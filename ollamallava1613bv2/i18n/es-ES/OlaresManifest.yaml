metadata:
  title: LLaVA 1.6 13B (Ollama)
  description: Un novedoso modelo multimodal grande entrenado de extremo a extremo que combina un codificador de visión y Vicuna para comprensión visual y lingüística de propósito general
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla mediante la app de referencia.

    **RESUMEN DEL MODELO**
    LLaVA es un modelo multimodal que combina un codificador de visión y Vicuna para comprensión visual y lingüística de propósito general, logrando capacidades de chat impresionantes al estilo de GPT-4 multimodal.

    Es un modelo de lenguaje autorregresivo basado en la arquitectura transformer. LLM base: lmsys/vicuna-13b-v1.5

    **Novedades en LLaVA 1.6:**
    - Resolución de imagen de entrada aumentada hasta 4× más píxeles; compatible con 672x672, 336x1344, 1344x336.
    - Mejor razonamiento visual y OCR con una mezcla de datos de ajuste por instrucciones visuales mejorada.
    - Mejor conversación visual para más escenarios y aplicaciones.
    - Mejor conocimiento del mundo y razonamiento lógico.
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartido en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Imagen del proxy API de Olares actualizada a beclab/harveyff-olares-ollama:v0.1.21.

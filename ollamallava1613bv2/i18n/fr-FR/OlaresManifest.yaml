metadata:
  title: LLaVA 1.6 13B (Ollama)
  description: Un nouveau grand modèle multimodal entraîné de bout en bout qui combine un encodeur de vision et Vicuna pour la compréhension visuelle et linguistique à usage général
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.

    **APERÇU DU MODÈLE**
    LLaVA est un modèle multimodal qui combine un encodeur de vision et Vicuna pour la compréhension visuelle et linguistique à usage général, atteignant des capacités de chat impressionnantes dans l'esprit de GPT-4 multimodal.

    C'est un modèle de langage autorégressif basé sur l'architecture transformer. LLM de base : lmsys/vicuna-13b-v1.5

    **Nouveautés dans LLaVA 1.6 :**
    - Résolution d'image d'entrée augmentée jusqu'à 4× plus de pixels ; prise en charge de 672x672, 336x1344, 1344x336.
    - Meilleur raisonnement visuel et OCR grâce à un mélange de données d'ajustement d'instructions visuelles amélioré.
    - Meilleure conversation visuelle pour davantage de scénarios et d'applications.
    - Meilleure connaissance du monde et raisonnement logique.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé sous Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Image du proxy API Olares mise à jour vers beclab/harveyff-olares-ollama:v0.1.21.

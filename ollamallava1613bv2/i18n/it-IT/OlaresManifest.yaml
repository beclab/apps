metadata:
  title: LLaVA 1.6 13B (Ollama)
  description: Un nuovo grande modello multimodale addestrato end-to-end che combina un encoder di visione e Vicuna per la comprensione visiva e linguistica di uso generale
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA DEL MODELLO**
    LLaVA è un modello multimodale che combina un encoder di visione e Vicuna per la comprensione visiva e linguistica di uso generale, raggiungendo capacità di chat impressionanti nello spirito di GPT-4 multimodale.

    È un modello linguistico autoregressivo basato sull'architettura transformer. LLM di base: lmsys/vicuna-13b-v1.5

    **Novità in LLaVA 1.6:**
    - Risoluzione dell'immagine di input aumentata fino a 4× più pixel; supporta 672x672, 336x1344, 1344x336.
    - Migliore ragionamento visivo e OCR con un mix di dati di visual instruction tuning migliorato.
    - Migliore conversazione visiva per più scenari e applicazioni.
    - Migliore conoscenza del mondo e ragionamento logico.
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Aggiornata l'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: LLaVA 1.6 13B (Ollama)
  description: Ein neuartiges End-to-End trainiertes großes multimodales Modell, das einen Vision-Encoder und Vicuna für allgemeines visuelles und sprachliches Verständnis kombiniert
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Nach Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **MODELLÜBERSICHT**
    LLaVA ist ein multimodales Modell, das einen Vision-Encoder und Vicuna für allgemeines visuelles und sprachliches Verständnis kombiniert und beeindruckende Chat-Fähigkeiten im Geiste von multimodalem GPT-4 erreicht.

    Es ist ein autoregressives Sprachmodell auf Transformer-Architektur. Basis-LLM: lmsys/vicuna-13b-v1.5

    **Neu in LLaVA 1.6:**
    - Eingabebildauflösung auf bis zu 4× mehr Pixel erhöht; Unterstützung für 672x672, 336x1344, 1344x336.
    - Besseres visuelles Reasoning und OCR durch verbesserte visuelle Instruction-Tuning-Datenmischung.
    - Bessere visuelle Konversation für mehr Szenarien und Anwendungen.
    - Besseres Weltwissen und logisches Reasoning.
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.

    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

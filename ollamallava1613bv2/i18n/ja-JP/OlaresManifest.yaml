metadata:
  title: LLaVA 1.6 13B (Ollama)
  description: Vision エンコーダと Vicuna を組み合わせ、汎用的な視覚・言語理解を行う新規 End-to-End 学習の大規模マルチモーダルモデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスタ内の全ユーザーが参照アプリ経由で利用できます。

    **モデル概要**
    LLaVA は Vision エンコーダと Vicuna を組み合わせたマルチモーダルモデルで、汎用的な視覚・言語理解を行い、マルチモーダル GPT-4 の精神を模した印象的なチャット能力を実現します。

    Transformer アーキテクチャに基づく自己回帰言語モデルです。ベース LLM: lmsys/vicuna-13b-v1.5

    **LLaVA 1.6 の新機能:**
    - 入力画像解像度を最大4倍のピクセル数へ拡大。672x672、336x1344、1344x336 をサポート。
    - 改善された視覚指示チューニングデータ混合により、視覚推論と OCR が向上。
    - より多くのシナリオ・用途をカバーする視覚会話の改善。
    - 世界知識と論理推論の向上。
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache を Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。

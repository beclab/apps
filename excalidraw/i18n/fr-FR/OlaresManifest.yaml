metadata:
  title: Excalidraw
  description: Tableau blanc virtuel pour croquis de diagrammes style dessin à main levée
spec:
  upgradeDescription: |
    Mise à jour vers la compilation officielle b2b2815 (2026-05-06), avec une empreinte fixe. nginx utilise UID 1000 et des fichiers temporaires.
  fullDescription: |
    Excalidraw est un tableau blanc virtuel open source au style dessin à main levée. Vous pouvez créer de beaux diagrammes, wireframes ou ce que vous voulez avec un rendu dessiné à la main.

    Collaboratif et chiffré de bout en bout.

    **Fonctionnalités**
    - Gratuit et open source.
    - Tableau blanc infini basé sur un canevas.
    - Style dessin à main levée.
    - Mode sombre.
    - Personnalisable.
    - Prise en charge des images.
    - Prise en charge des bibliothèques de formes.
    - Localisation (i18n).
    - Export vers PNG, SVG et presse-papiers.
    - Format ouvert — exportez les dessins en fichier JSON .excalidraw.
    - Large éventail d'outils — rectangle, cercle, losange, flèche, ligne, dessin libre, gomme…
    - Liaison de flèches et flèches étiquetées.
    - Annuler / Rétablir.
    - Zoom et panoramique.

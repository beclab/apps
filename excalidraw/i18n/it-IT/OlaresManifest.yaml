metadata:
  title: Excalidraw
  description: Lavagna virtuale per schizzare diagrammi in stile disegnato a mano
spec:
  upgradeDescription: |
    Aggiornamento alla build ufficiale b2b2815 (2026-05-06), con digest fisso. nginx viene eseguito con UID 1000 e file temporanei.
  fullDescription: |
    Excalidraw è una lavagna virtuale open source in stile disegnato a mano. Puoi creare bellissimi diagrammi, wireframe o ciò che preferisci con aspetto disegnato a mano.

    Collaborativa e crittografata end-to-end.

    **Funzionalità**
    - Gratuita e open-source.
    - Lavagna infinita basata su canvas.
    - Stile disegnato a mano.
    - Dark mode.
    - Personalizzabile.
    - Supporto immagini.
    - Supporto librerie di forme.
    - Localizzazione (i18n).
    - Esportazione in PNG, SVG e appunti.
    - Formato aperto: esporta i disegni come file JSON .excalidraw.
    - Ampia gamma di strumenti: rettangolo, cerchio, diamante, freccia, linea, disegno libero, gomma…
    - Binding delle frecce e frecce etichettate.
    - Annulla / Ripeti.
    - Zoom e panning.

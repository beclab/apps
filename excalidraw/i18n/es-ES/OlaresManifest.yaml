metadata:
  title: Excalidraw
  description: Pizarra virtual para bocetos de diagramas con estilo a mano
spec:
  upgradeDescription: |
    Actualización a la compilación oficial b2b2815 (2026-05-06), fijada por el resumen de la imagen. nginx se ejecuta con UID 1000 y archivos temporales.
  fullDescription: |
    Excalidraw es una pizarra virtual de código abierto con estilo dibujado a mano. Puedes crear hermosos diagramas, wireframes o lo que quieras con aspecto dibujado a mano.

    Colaborativa y cifrada de extremo a extremo.

    **Funciones**
    - Gratis y de código abierto.
    - Pizarra infinita basada en lienzo.
    - Estilo dibujado a mano.
    - Modo oscuro.
    - Personalizable.
    - Soporte de imágenes.
    - Soporte de bibliotecas de formas.
    - Localización (i18n).
    - Exportar a PNG, SVG y portapapeles.
    - Formato abierto: exporta dibujos como archivo JSON .excalidraw.
    - Amplia gama de herramientas: rectángulo, círculo, diamante, flecha, línea, dibujo libre, borrador…
    - Enlace de flechas y flechas etiquetadas.
    - Deshacer / Rehacer.
    - Zoom y desplazamiento.

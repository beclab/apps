metadata:
  title: Excalidraw
  description: Virtuelles Whiteboard zum Skizzieren handgezeichneter Diagramme
spec:
  upgradeDescription: |
    Aktualisierung auf den offiziellen Release-Build b2b2815 (2026-05-06), fixiert per Image-Digest. nginx läuft mit UID 1000 und temporären Laufzeitdateien.
  fullDescription: |
    Excalidraw ist ein quelloffenes virtuelles Whiteboard im Handzeichnungsstil. Sie können wunderschöne handgezeichnete Diagramme, Wireframes oder alles, was Sie möchten, erstellen.

    Kollaborativ und Ende-zu-Ende-verschlüsselt.

    **Funktionen**
    - Kostenlos & Open Source.
    - Unendliches, canvas-basiertes Whiteboard.
    - Handgezeichneter Stil.
    - Dark Mode.
    - Anpassbar.
    - Bildunterstützung.
    - Unterstützung für Shape-Bibliotheken.
    - Lokalisierung (i18n).
    - Export nach PNG, SVG & Zwischenablage.
    - Offenes Format – Zeichnungen als .excalidraw-JSON-Datei exportieren.
    - Große Auswahl an Werkzeugen – Rechteck, Kreis, Raute, Pfeil, Linie, Freihand, Radierer…
    - Pfeilbindung & beschriftete Pfeile.
    - Rückgängig / Wiederholen.
    - Zoom- und Schwenkunterstützung.

metadata:
  title: Excalidraw
  description: 手描き風ダイアグラムを描く仮想ホワイトボード
spec:
  upgradeDescription: |
    公式 release ビルド b2b2815（2026-05-06）へ更新し、イメージのダイジェストを固定します。nginx を UID 1000 で実行し、一時ファイルに書き込み可能な場所を使用します。
  fullDescription: |
    Excalidraw はオープンソースの手描きスタイル仮想ホワイトボードです。美しい手描き風のダイアグラム、ワイヤーフレームなど、好きなものを作成できます。

    共同編集対応でエンドツーエンド暗号化。

    **機能**
    - 無料＆オープンソース。
    - 無限のキャンバスベースホワイトボード。
    - 手描き風スタイル。
    - ダークモード。
    - カスタマイズ可能。
    - 画像サポート。
    - シェイプライブラリ対応。
    - ローカライズ（i18n）対応。
    - PNG、SVG、クリップボードへのエクスポート。
    - オープンフォーマット — 図面を .excalidraw JSON ファイルとしてエクスポート。
    - 豊富なツール — 矩形、円、菱形、矢印、線、フリーハンド、消しゴムなど。
    - 矢印のバインドとラベル付き矢印。
    - 元に戻す / やり直し。
    - ズームとパンに対応。

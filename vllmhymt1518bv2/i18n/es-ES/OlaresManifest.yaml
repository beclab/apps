metadata:
  title: HY-MT1.5-1.8B (vLLM)
  description: Modelo de traducción multilingüe de Hunyuan
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar una entrada de escritorio para acceder o usar la entrada compartida para llamar a la API del servicio.
    
    **DESCRIPCIÓN GENERAL**
    Hunyuan-MT comprende un modelo de traducción, Hunyuan-MT-7B, y un modelo ensemble, Hunyuan-MT-Chimera. El modelo de traducción se usa para traducir el texto fuente al idioma de destino, mientras que el modelo ensemble integra múltiples salidas de traducción para producir un resultado de mayor calidad. Principalmente admite la traducción mutua entre 33 idiomas, incluidas cinco lenguas de minorías étnicas de China.
    
    **Funciones y ventajas clave**
    - En la competición WMT25, el modelo logró el primer puesto en 30 de las 31 categorías lingüísticas en las que participó.
    - Hunyuan-MT-7B alcanza un rendimiento líder en la industria entre modelos de escala comparable
    - Hunyuan-MT-Chimera-7B es el primer modelo ensemble de traducción de código abierto de la industria, elevando la calidad de traducción a un nuevo nivel
    - Se ha propuesto un marco de entrenamiento integral para modelos de traducción, desde pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement, logrando resultados SOTA para modelos de tamaño similar
  upgradeDescription: |
    Actualizar el runtime vLLM a v0.22.0-cu129; activar la optimización -O3 y persistir la caché de torch.compile / FlashInfer.

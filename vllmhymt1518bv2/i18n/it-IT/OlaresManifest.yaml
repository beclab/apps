metadata:
  title: HY-MT1.5-1.8B (vLLM)
  description: Modello di traduzione multilingue di Hunyuan
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Ogni utente può installare una voce desktop per accedere o usare l'ingresso condiviso per chiamare l'API del servizio.
    
    **PANORAMICA**
    Hunyuan-MT comprende un modello di traduzione, Hunyuan-MT-7B, e un modello ensemble, Hunyuan-MT-Chimera. Il modello di traduzione traduce il testo sorgente nella lingua di destinazione, mentre il modello ensemble integra più uscite di traduzione per produrre un risultato di qualità superiore. Supporta principalmente la traduzione reciproca tra 33 lingue, incluse cinque lingue di minoranze etniche in Cina.
    
    **Funzionalità e vantaggi principali**
    - Nella competizione WMT25, il modello ha ottenuto il primo posto in 30 delle 31 categorie linguistiche a cui ha partecipato.
    - Hunyuan-MT-7B raggiunge prestazioni leader nel settore tra modelli di scala comparabile
    - Hunyuan-MT-Chimera-7B è il primo modello ensemble di traduzione open source del settore, elevando la qualità della traduzione a un nuovo livello
    - È stato proposto un framework di training completo per modelli di traduzione, da pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement, raggiungendo risultati SOTA per modelli di dimensioni simili
  upgradeDescription: |
    Aggiornare il runtime vLLM a v0.22.0-cu129; abilitare l'ottimizzazione -O3 e rendere persistente la cache di torch.compile / FlashInfer.

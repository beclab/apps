metadata:
  title: HY-MT1.5-1.8B (vLLM)
  description: Mehrsprachiges Übersetzungsmodell von Hunyuan
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsame App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer kann einen Desktop-Eintrag installieren, um zuzugreifen, oder den gemeinsamen Eingang nutzen, um die Service-API aufzurufen.
    
    **ÜBERBLICK**
    Hunyuan-MT umfasst ein Übersetzungsmodell, Hunyuan-MT-7B, und ein Ensemble-Modell, Hunyuan-MT-Chimera. Das Übersetzungsmodell übersetzt Quelltext in die Zielsprache, während das Ensemble-Modell mehrere Übersetzungsausgaben integriert, um ein qualitativ hochwertigeres Ergebnis zu erzeugen. Es unterstützt vor allem die gegenseitige Übersetzung unter 33 Sprachen, einschließlich fünf ethnischer Minderheitensprachen in China.
    
    **Wichtige Funktionen und Vorteile**
    - Beim WMT25-Wettbewerb belegte das Modell in 30 von 31 Sprachkategorien, an denen es teilnahm, den ersten Platz.
    - Hunyuan-MT-7B erreicht branchenführende Leistung unter Modellen vergleichbarer Größe
    - Hunyuan-MT-Chimera-7B ist das erste quelloffene Übersetzungs-Ensemble-Modell der Branche und hebt die Übersetzungsqualität auf ein neues Niveau
    - Ein umfassendes Trainingsframework für Übersetzungsmodelle wurde vorgeschlagen, von Pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement, und erreicht SOTA-Ergebnisse für Modelle ähnlicher Größe
  upgradeDescription: |
    vLLM-Runtime auf v0.22.0-cu129 aktualisieren; -O3-Optimierung aktivieren und torch.compile- / FlashInfer-Cache persistieren.

metadata:
  title: HY-MT1.5-1.8B (vLLM)
  description: Hunyuan による多言語翻訳モデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でインストールされるサービスは 1 つだけです。各ユーザーはデスクトップエントリをインストールしてアクセスするか、共有エントランスを使ってサービス API を呼び出せます。
    
    **概要**
    Hunyuan-MT は翻訳モデル Hunyuan-MT-7B とアンサンブルモデル Hunyuan-MT-Chimera で構成されます。翻訳モデルはソーステキストを対象言語に翻訳し、アンサンブルモデルは複数の翻訳出力を統合してより高品質な結果を生成します。主に中国の 5 つの少数民族言語を含む 33 言語間の相互翻訳をサポートします。
    
    **主な機能と利点**
    - WMT25 競技会では、参加した 31 の言語カテゴリのうち 30 で 1 位を獲得しました。
    - Hunyuan-MT-7B は同規模のモデルの中で業界をリードする性能を達成
    - Hunyuan-MT-Chimera-7B は業界初のオープンソース翻訳アンサンブルモデルで、翻訳品質を新たな水準へ引き上げます
    - pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement にまたがる包括的な翻訳モデルトレーニングフレームワークが提案され、同規模モデルで SOTA を達成
  upgradeDescription: |
    vLLM ランタイムを v0.22.0-cu129 にアップグレード；-O3 最適化を有効化し、torch.compile / FlashInfer キャッシュを永続化。

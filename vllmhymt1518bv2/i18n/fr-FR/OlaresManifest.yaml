metadata:
  title: HY-MT1.5-1.8B (vLLM)
  description: Modèle de traduction multilingue de Hunyuan
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé sur l'ensemble du système Olares. Chaque utilisateur peut installer une entrée bureau pour y accéder ou utiliser l'entrée partagée pour appeler l'API du service.
    
    **APERÇU**
    Hunyuan-MT comprend un modèle de traduction, Hunyuan-MT-7B, et un modèle d'ensemble, Hunyuan-MT-Chimera. Le modèle de traduction sert à traduire le texte source vers la langue cible, tandis que le modèle d'ensemble intègre plusieurs sorties de traduction pour produire un résultat de meilleure qualité. Il prend principalement en charge la traduction mutuelle entre 33 langues, dont cinq langues de minorités ethniques en Chine.
    
    **Fonctionnalités et avantages clés**
    - Lors de la compétition WMT25, le modèle a obtenu la première place dans 30 des 31 catégories linguistiques auxquelles il a participé.
    - Hunyuan-MT-7B atteint des performances de premier plan parmi les modèles d'échelle comparable
    - Hunyuan-MT-Chimera-7B est le premier modèle d'ensemble de traduction open source de l'industrie, portant la qualité de traduction à un nouveau niveau
    - Un cadre d'entraînement complet pour les modèles de traduction a été proposé, allant de pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement, atteignant des résultats SOTA pour des modèles de taille similaire
  upgradeDescription: |
    Mettre à jour le runtime vLLM vers v0.22.0-cu129 ; activer l'optimisation -O3 et persister le cache torch.compile / FlashInfer.

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: ytdlpv3
  description: Powerful yt-dlp integration for built-in downloader in Olares
  icon: https://app.cdn.olares.com/appstore/ytdlp/icon.png
  appid: ytdlpv3
  version: '1.1.21'
  title: yt-dlp Plugin
  categories:
    - homelab
    - Fun
  tags:
    - downloader

sharedEntrances:
  - name: ytdlp
    host: sharedentrances-ytdlp
    port: 0
    title: yt-dlp API
    icon: https://app.cdn.olares.com/appstore/ytdlp/icon.png
    invisible: true
    authLevel: internal
entrances:
  - name: ytdlp-svc
    port: 3082
    host: ytdlp-svc
    title: yt-dlp API
    icon: https://app.cdn.olares.com/appstore/ytdlp/icon.png
    authLevel: private
    invisible: true

workloadReplicas:
  ytdlpv3: 1

spec:
  versionName: '1.0.10'
  fullDescription: |
    This app integrates yt-dlp with Olares' built-in downloader, enabling you to download audio and video from supported websites directly through LarePass or Wise.

    yt-dlp is a powerful and feature-rich command-line tool, based on youtube-dl, that downloads videos and audio from YouTube, Vimeo, and hundreds of other sites.

    **Key Features**

    - Download audio and video from thousands of supported websites.
    - Automatically select the best available download format.
    - Extract audio tracks with ease.
    - Embed subtitles and rich metadata.
    - Support login-restricted pages using cookies.
    - Handle segmented livestream downloads.

    **For Olares Users**

    This application is shared across your Olares system. Once an admin installs it, the Save to Olares feature can make use of yt-dlp for every user.

    Apps like Wise and RSS Subscribe can leverage this plugin to extract information and media from video platforms such as YouTube.

    For more information and advanced usage, see the [yt-dlp documentation](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file).
  developer: yt-dlp
  website: https://github.com/yt-dlp/yt-dlp
  sourceCode: https://github.com/yt-dlp/yt-dlp
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file
  requiredMemory: 200Mi
  limitedMemory: 1Gi
  requiredDisk: 128Mi
  limitedDisk: 256Mi
  requiredCpu: 200m
  limitedCpu: 1
  supportArch:
    - amd64
    - arm64
  onlyAdmin: true
  license:
    - text: Unlicense
      url: https://github.com/yt-dlp/yt-dlp?tab=Unlicense-1-ov-file#Unlicense-1-ov-file

permission:
  appData: true
  appCache: true
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
middleware:
  postgres:
    username: ytdlp
    databases:
      - name: ytdlp

metadata:
  title: yt-dlp Plugin
  description: Integrazione yt-dlp potente per il downloader integrato di Olares
spec:
  fullDescription: |
    Questa app integra yt-dlp con il downloader integrato di Olares, permettendo di scaricare audio e video dai siti supportati direttamente tramite LarePass o Wise.

    yt-dlp è uno strumento da riga di comando potente e ricco di funzioni, basato su youtube-dl, che scarica video e audio da YouTube, Vimeo e centinaia di altri siti.

    **Funzionalità principali**

    - Scarica audio e video da migliaia di siti supportati.
    - Seleziona automaticamente il miglior formato di download disponibile.
    - Estrae facilmente le tracce audio.
    - Incorpora sottotitoli e metadati ricchi.
    - Supporta le pagine protette da accesso usando i cookie.
    - Gestisce i download di livestream segmentati.

    **Per gli utenti Olares**

    Questa applicazione è condivisa in tutto il sistema Olares. Dopo l'installazione da parte di un admin, la funzione Save to Olares può usare yt-dlp per ogni utente.

    App come Wise e RSS Subscribe possono usare questo plugin per estrarre informazioni e media da piattaforme video come YouTube.

    Per ulteriori informazioni e un uso avanzato, consulta la [documentazione yt-dlp](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file).

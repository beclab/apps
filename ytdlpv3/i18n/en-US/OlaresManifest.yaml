metadata:
  title: yt-dlp Plugin
  description: Powerful yt-dlp integration for built-in downloader in Olares
spec:
  fullDescription: |
    This app integrates yt-dlp with Olares' built-in downloader, enabling you to download audio and video from supported websites directly through LarePass or Wise.

    yt-dlp is a powerful and feature-rich command-line tool, based on youtube-dl, that downloads videos and audio from YouTube, Vimeo, and hundreds of other sites.

    **Key Features**

    - Download audio and video from thousands of supported websites.
    - Automatically select the best available download format.
    - Extract audio tracks with ease.
    - Embed subtitles and rich metadata.
    - Support login-restricted pages using cookies.
    - Handle segmented livestream downloads.

    **For Olares Users**

    This application is shared across your Olares system. Once an admin installs it, the Save to Olares feature can make use of yt-dlp for every user.

    Apps like Wise and RSS Subscribe can leverage this plugin to extract information and media from video platforms such as YouTube.

    For more information and advanced usage, see the [yt-dlp documentation](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file).
  upgradeDescription: |

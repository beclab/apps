metadata:
  title: yt-dlp Plugin
  description: Leistungsstarke yt-dlp-Integration für den integrierten Downloader in Olares
spec:
  fullDescription: |
    Diese App integriert yt-dlp in den integrierten Olares-Downloader und ermöglicht Downloads von Audio und Video unterstützter Websites direkt über LarePass oder Wise.

    yt-dlp ist ein leistungsstarkes, funktionsreiches Kommandozeilen-Tool auf Basis von youtube-dl, das Videos und Audio von YouTube, Vimeo und Hunderten weiterer Seiten herunterlädt.

    **Funktionen**

    - Audio und Video von Tausenden unterstützter Websites herunterladen.
    - Automatisch das beste verfügbare Downloadformat wählen.
    - Audiospuren einfach extrahieren.
    - Untertitel und umfangreiche Metadaten einbetten.
    - Seiten mit Login über Cookies unterstützen.
    - Segmentierte Livestream-Downloads verarbeiten.

    **Für Olares-Nutzer**

    Diese Anwendung ist in Ihrem Olares-System geteilt. Sobald ein Admin sie installiert, kann die Funktion Save to Olares yt-dlp für jeden Nutzer verwenden.

    Apps wie Wise und RSS Subscribe können dieses Plugin nutzen, um Informationen und Medien von Videoplattformen wie YouTube zu extrahieren.

    Weitere Informationen und erweiterte Nutzung finden Sie in der [yt-dlp-Dokumentation](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file).

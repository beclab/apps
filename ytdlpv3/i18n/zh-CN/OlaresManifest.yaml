metadata:
  title: yt-dlp Plugin
  description: 为 Olares 内置下载器提供强大的 yt-dlp 集成
spec:
  fullDescription: |
    此应用将 yt-dlp 接入 Olares 内置下载器，可直接通过 LarePass 或 Wise 从受支持的网站下载音频和视频。

    yt-dlp 是一款基于 youtube-dl 的功能丰富的命令行工具，可从 YouTube、Vimeo 以及数百个其他网站下载视频和音频。

    **主要功能**

    - 从数千个受支持的网站下载音频和视频。
    - 自动选择当前可用的最佳下载格式。
    - 轻松提取音轨。
    - 嵌入字幕和丰富的元数据。
    - 使用 cookies 支持需要登录的页面。
    - 处理分段直播下载。

    **Olares 用户说明**

    此应用在整个 Olares 系统中共享。管理员安装后，Save to Olares 功能即可为每位用户使用 yt-dlp。

    Wise 和 RSS Subscribe 等应用可借助此插件，从 YouTube 等视频平台提取信息和媒体。

    更多信息和高级用法请参阅 [yt-dlp 文档](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file)。

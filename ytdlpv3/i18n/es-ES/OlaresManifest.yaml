metadata:
  title: yt-dlp Plugin
  description: Integración potente de yt-dlp para el descargador integrado de Olares
spec:
  fullDescription: |
    Esta aplicación integra yt-dlp con el descargador integrado de Olares, para descargar audio y vídeo de sitios compatibles directamente a través de LarePass o Wise.

    yt-dlp es una herramienta de línea de comandos potente y rica en funciones, basada en youtube-dl, que descarga vídeo y audio de YouTube, Vimeo y cientos de otros sitios.

    **Funciones principales**

    - Descargar audio y vídeo de miles de sitios web compatibles.
    - Seleccionar automáticamente el mejor formato de descarga disponible.
    - Extraer pistas de audio con facilidad.
    - Incrustar subtítulos y metadatos enriquecidos.
    - Admitir páginas con inicio de sesión mediante cookies.
    - Gestionar descargas de livestreams segmentados.

    **Para usuarios de Olares**

    Esta aplicación se comparte en todo el sistema Olares. Cuando un admin la instala, la función Save to Olares puede usar yt-dlp para cada usuario.

    Aplicaciones como Wise y RSS Subscribe pueden aprovechar este complemento para extraer información y medios de plataformas de vídeo como YouTube.

    Para más información y uso avanzado, consulte la [documentación de yt-dlp](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file).

metadata:
  title: yt-dlp Plugin
  description: Intégration yt-dlp puissante pour le téléchargeur intégré d'Olares
spec:
  fullDescription: |
    Cette application intègre yt-dlp au téléchargeur intégré d'Olares, pour télécharger de l'audio et de la vidéo depuis les sites pris en charge, directement via LarePass ou Wise.

    yt-dlp est un outil en ligne de commande puissant et riche en fonctionnalités, basé sur youtube-dl, qui télécharge des vidéos et de l'audio depuis YouTube, Vimeo et des centaines d'autres sites.

    **Fonctionnalités principales**

    - Télécharger de l'audio et de la vidéo depuis des milliers de sites pris en charge.
    - Sélectionner automatiquement le meilleur format de téléchargement disponible.
    - Extraire facilement les pistes audio.
    - Intégrer les sous-titres et des métadonnées riches.
    - Prendre en charge les pages protégées par connexion à l'aide de cookies.
    - Gérer les téléchargements de livestreams segmentés.

    **Pour les utilisateurs Olares**

    Cette application est partagée sur tout votre système Olares. Une fois installée par un admin, la fonction Save to Olares peut utiliser yt-dlp pour chaque utilisateur.

    Des applications comme Wise et RSS Subscribe peuvent s'appuyer sur ce plugin pour extraire informations et médias depuis des plateformes vidéo telles que YouTube.

    Pour plus d'informations et un usage avancé, voir la [documentation yt-dlp](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file).

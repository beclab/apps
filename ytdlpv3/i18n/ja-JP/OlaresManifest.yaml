metadata:
  title: yt-dlp Plugin
  description: Olares内蔵ダウンローダー向けの強力なyt-dlp連携
spec:
  fullDescription: |
    このアプリはyt-dlpをOlaresの内蔵ダウンローダーと連携し、LarePassまたはWiseから対応サイトの音声と動画を直接ダウンロードできるようにします。

    yt-dlpはyoutube-dlをベースにした高機能なコマンドラインツールで、YouTube、Vimeo、その他数百のサイトから動画と音声をダウンロードします。

    **主な機能**

    - 数千の対応サイトから音声と動画をダウンロードする。
    - 利用可能な最良のダウンロード形式を自動で選択する。
    - 音声トラックを簡単に抽出する。
    - 字幕と豊富なメタデータを埋め込む。
    - cookiesを使ってログイン制限のあるページに対応する。
    - セグメント化されたライブ配信のダウンロードを処理する。

    **Olaresユーザー向け**

    このアプリケーションはOlaresシステム全体で共有されます。adminがインストールすると、Save to Olares機能が各ユーザー向けにyt-dlpを利用できます。

    WiseやRSS Subscribeなどのアプリは、このプラグインを使ってYouTubeなどの動画プラットフォームから情報とメディアを抽出できます。

    詳細と高度な使い方は[yt-dlpドキュメント](https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file)を参照してください。

metadata:
  title: Qwen3 14B (Ollama)
  description: 密なモデルと Mixture-of-Experts（MoE）モデルの包括的スイートを提供する、Qwen シリーズ最新世代の大規模言語モデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    
    **モデル概要**
    Qwen3 は Qwen シリーズ最新世代の大規模言語モデルで、密なモデルと Mixture-of-Experts（MoE）モデルの包括的なスイートを提供します。広範な学習に基づき、推論、指示追従、エージェント能力、多言語対応で画期的な進歩を実現します。
    
    主な機能:
    複雑な論理推論・数学・コーディング向けの thinking モードと、効率的な汎用対話向けの non-thinking モードを単一モデル内でシームレスに切り替え可能で、さまざまなシナリオで最適な性能を確保。
    
    推論能力が大幅に強化され、数学・コード生成・常識的論理推論において、従来の QwQ（thinking モード）および Qwen2.5 instruct（non-thinking モード）を上回ります。
    
    人間の嗜好との整合性が高く、創作、ロールプレイ、マルチターン対話、指示追従に優れ、より自然で没入感のある会話体験を提供します。
    
    エージェント能力に優れ、thinking / non-thinking 両モードで外部ツールと精密に統合でき、複雑なエージェントタスクでオープンソースモデルの中でもトップクラスの性能を達成します。
    
    100 以上の言語・方言をサポートし、多言語の指示追従と翻訳に強い能力を備えます。
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。
    
    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。

metadata:
  title: Qwen3 14B (Ollama)
  description: "L'ultima generazione di grandi modelli linguistici della serie Qwen, con una suite completa di modelli densi e mixture-of-experts (MoE)"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    
    **PANORAMICA DEL MODELLO**
    Qwen3 è l'ultima generazione di grandi modelli linguistici della serie Qwen, con una suite completa di modelli densi e mixture-of-experts (MoE). Basato su un training esteso, Qwen3 offre avanzamenti rivoluzionari in ragionamento, instruction-following, capacità agentiche e supporto multilingue.
    
    Funzioni chiave:
    Supporto unico per il passaggio fluido tra modalità thinking (per ragionamento logico complesso, matematica e coding) e modalità non-thinking (per dialogo generale efficiente) all'interno di un unico modello, garantendo prestazioni ottimali in vari scenari.
    
    Miglioramento significativo delle capacità di ragionamento, superando i precedenti modelli QwQ (in modalità thinking) e i modelli instruct Qwen2.5 (in modalità non-thinking) in matematica, generazione di codice e ragionamento di senso comune.
    
    Allineamento superiore alle preferenze umane, eccellendo in scrittura creativa, role-playing, dialoghi multi-turno e instruction following, per un'esperienza conversazionale più naturale e coinvolgente.
    
    Competenza nelle capacità agentiche, consentendo un'integrazione precisa con strumenti esterni in modalità thinking e non-thinking e raggiungendo prestazioni di punta tra i modelli open-source in compiti agentici complessi.
    
    Supporto di oltre 100 lingue e dialetti con solide capacità di instruction following multilingue e traduzione.
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Aggiornamento dell'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: Qwen3 14B (Ollama)
  description: La dernière génération de grands modèles de langage de la série Qwen, offrant une suite complète de modèles dense et mixture-of-experts (MoE)
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    
    **APERÇU DU MODÈLE**
    Qwen3 est la dernière génération de grands modèles de langage de la série Qwen, offrant une suite complète de modèles dense et mixture-of-experts (MoE). Construit sur un entraînement approfondi, Qwen3 apporte des avancées majeures en raisonnement, suivi d'instructions, capacités d'agent et support multilingue.
    
    Fonctionnalités clés :
    Prise en charge unique du basculement fluide entre le mode thinking (pour le raisonnement logique complexe, les maths et le code) et le mode non-thinking (pour un dialogue général efficace) au sein d'un même modèle, garantissant des performances optimales dans divers scénarios.
    
    Amélioration significative des capacités de raisonnement, surpassant les précédents modèles QwQ (en mode thinking) et les modèles instruct Qwen2.5 (en mode non-thinking) en mathématiques, génération de code et raisonnement de bon sens.
    
    Alignement supérieur sur les préférences humaines, excellant en écriture créative, jeux de rôle, dialogues multi-tours et suivi d'instructions, pour une expérience conversationnelle plus naturelle et immersive.
    
    Expertise en capacités d'agent, permettant une intégration précise avec des outils externes en modes thinking et non-thinking, et atteignant des performances de premier plan parmi les modèles open source sur des tâches agentiques complexes.
    
    Prise en charge de plus de 100 langues et dialectes avec de solides capacités de suivi d'instructions multilingues et de traduction.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé sous Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.
    
    Mise à jour de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: Fish Speech
  description: TTS open source SOTA
spec:
  fullDescription: |
    **NOTE IMPORTANTE**  
    Il s'agit d'une app partagée. Un seul service sera installé sur l'ensemble du système Olares. Chaque utilisateur peut installer une entrée bureau pour accéder ou utiliser l'entrée partagée afin d'appeler l'API du service.

    **APERÇU**
    Text-to-Speech et clonage vocal véritablement humains

    Checkpoint inclus : [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — la dernière version pro de la famille TTS / clonage vocal expressif de Fish Audio.
    
    FishAudio-S2 Pro est un modèle expressif de text-to-speech (TTS) et de clonage vocal développé par Fish Audio, conçu pour générer une parole naturelle, réaliste et riche en émotion — ni robotique, ni plate, ni limitée à la narration studio.
    
    FishAudio-S2 Pro se concentre sur la façon dont les humains parlent vraiment : avec émotion, variation, pauses et intention.

    Fonctionnalités
    - TTS zero-shot et few-shot : fournissez un échantillon vocal de 10 à 30 secondes pour générer un TTS de haute qualité.

    - Support multilingue et cross-lingual : collez du texte multilingue dans la zone de saisie — sans vous soucier de la langue. Pris en charge : anglais, japonais, coréen, chinois, français, allemand, arabe et espagnol.

    - Pas de dépendance aux phonèmes : forte généralisation ; ne repose pas sur les phonèmes pour le TTS. Gère le texte dans n'importe quel système d'écriture.

    - Très précis : faible CER (Character Error Rate) d'environ 0.4 % et WER (Word Error Rate) d'environ 0.8 % pour Seed-TTS Eval.

    - Rapide : accéléré par torch compile ; facteur temps réel d'environ 1:7 sur GPU Nvidia RTX 4090.

    - Inférence WebUI : interface web Gradio facile à utiliser, compatible Chrome, Firefox, Edge et autres.
    
    - Inférence GUI : interface graphique PyQt6 qui fonctionne avec le serveur API. Compatible Linux, Windows et macOS.

  upgradeDescription: |
    - feat(model) : bascule du checkpoint inclus vers fishaudio/s2-pro (dernière version pro TTS / clonage vocal expressif).
    - chore(runtime) : la commande du conteneur fishspeech interroge désormais le marqueur `.s2-pro.done` du Job de téléchargement s2-pro avant de lancer la WebUI, pour ne pas démarrer avant que les poids soient sur disque.
    - fix(cuda) : contourner `uv run` au démarrage du conteneur et lancer `run_webui.py` directement avec `/app/.venv/bin/python` (plus `UV_NO_SYNC=1` / `UV_FROZEN=1`). Auparavant, `start_webui.sh` utilisait `uv run`, qui faisait un `uv sync` implicite sans `--extra cu129` et rétrogradait torch vers cu126 — Blackwell (sm_120) échouait alors avec « no kernel image is available for execution on the device ». Le venv cu129 embarqué est désormais préservé.
    - fix(docker) : passer CUDA 12.6 → 12.9 pour le support Blackwell (sm_120) (#1225). CUDA 12.6 / cu126 échoue avec « no kernel image available » sur les GPU Blackwell (série RTX 5000, sm_120) ; la mise à niveau vers CUDA 12.9 / cu129 corrige cela. CUDA_VER et UV_EXTRA sont exposés comme build args surchargeables dans compose.base.yml pour que les utilisateurs avec d'anciens pilotes puissent passer CUDA_VER=12.6.0 UV_EXTRA=cu126.

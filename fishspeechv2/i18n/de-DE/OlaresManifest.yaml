metadata:
  title: Fish Speech
  description: SOTA Open-Source-TTS
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**  
    Dies ist eine Shared App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer kann einen Desktop-Eintrag installieren, um den Shared Entrance für den API-Aufruf zu nutzen.

    **ÜBERBLICK**
    Wahrhaft menschenähnliche Text-to-Speech und Voice Cloning

    Gebündelter Checkpoint: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — die neueste Pro-Tier-Veröffentlichung der expressiven TTS-/Voice-Cloning-Familie von Fish Audio.
    
    FishAudio-S2 Pro ist ein expressives Text-to-Speech-(TTS)- und Voice-Cloning-Modell von Fish Audio, das Sprache natürlich, realistisch und emotional reich erzeugen soll — nicht roboterhaft, nicht flach und nicht auf Studio-Narration beschränkt.
    
    FishAudio-S2 Pro konzentriert sich darauf, wie Menschen wirklich sprechen: mit Emotion, Variation, Pausen und Absicht.

    Funktionen
    - Zero-shot- & Few-shot-TTS: 10- bis 30-sekündige Sprachprobe eingeben, um hochwertige TTS-Ausgabe zu erzeugen.

    - Mehrsprachig & cross-lingual: Mehrsprachigen Text einfach in das Eingabefeld kopieren — ohne Sprachsorge. Derzeit unterstützt: Englisch, Japanisch, Koreanisch, Chinesisch, Französisch, Deutsch, Arabisch und Spanisch.

    - Keine Phonem-Abhängigkeit: Das Modell generalisiert stark und braucht keine Phoneme für TTS. Es verarbeitet Text in beliebigen Schriftsystemen.

    - Hohe Genauigkeit: Niedrige CER (Character Error Rate) von ca. 0.4 % und WER (Word Error Rate) von ca. 0.8 % für Seed-TTS Eval.

    - Schnell: Mit torch compile beschleunigt; Echtzeitfaktor ca. 1:7 auf einer Nvidia RTX 4090 GPU.

    - WebUI-Inferenz: Einfache, Gradio-basierte Web-UI kompatibel mit Chrome, Firefox, Edge und anderen Browsern.
    
    - GUI-Inferenz: PyQt6-Oberfläche, die nahtlos mit dem API-Server arbeitet. Unterstützt Linux, Windows und macOS.

  upgradeDescription: |
    - feat(model): gebündelten Checkpoint auf fishaudio/s2-pro umgestellt (neueste Pro-Tier expressive TTS-/Voice-Cloning-Veröffentlichung).
    - chore(runtime): der Befehl des fishspeech-Containers pollt nun den `.s2-pro.done`-Marker des s2-pro-Download-Jobs, bevor die WebUI startet, damit sie nicht vor dem Vorhandensein der Gewichte startet.
    - fix(cuda): `uv run` beim Containerstart umgehen und `run_webui.py` direkt mit `/app/.venv/bin/python` starten (plus `UV_NO_SYNC=1` / `UV_FROZEN=1`). Zuvor nutzte `start_webui.sh` des Images `uv run`, was zur Laufzeit ein implizites `uv sync` ohne `--extra cu129` ausführte und torch stillschweigend auf cu126 herabstufte — Blackwell (sm_120) scheiterte dann mit „no kernel image is available for execution on the device“. Das gebackene cu129-venv bleibt nun unverändert.
    - fix(docker): CUDA 12.6 → 12.9 für Blackwell-(sm_120)-Unterstützung (#1225). CUDA 12.6 / cu126 scheitert mit „no kernel image available“ auf Blackwell-GPUs (RTX 5000 Serie, sm_120); Upgrade auf CUDA 12.9 / cu129 behebt das. CUDA_VER und UV_EXTRA sind als überschreibbare Build-Args in compose.base.yml exponiert, sodass Nutzer mit älteren Treibern weiterhin CUDA_VER=12.6.0 UV_EXTRA=cu126 setzen können.

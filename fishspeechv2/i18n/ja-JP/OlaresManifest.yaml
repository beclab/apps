metadata:
  title: Fish Speech
  description: SOTA オープンソース TTS
spec:
  fullDescription: |
    **重要なお知らせ**  
    これは共有アプリです。Olares システム全体にインストールされるサービスは 1 つだけです。各ユーザーはデスクトップエントリをインストールして共有エントランス経由でサービス API を利用できます。

    **概要**
    真に人間らしい Text-to-Speech とボイスクローニング

    同梱チェックポイント: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — Fish Audio の表現力豊かな TTS / ボイスクローニング系列の最新プロティア版。
    
    FishAudio-S2 Pro は Fish Audio が開発した表現力豊かなテキスト読み上げ（TTS）およびボイスクローニングモデルで、自然でリアル、感情豊かな音声を生成するよう設計されています — ロボット的でも平坦でもなく、スタジオ風ナレーションに限定されません。
    
    FishAudio-S2 Pro は人が実際に話す様子に焦点を当てます: 感情、抑揚、間、意図。

    機能
    - ゼロショット & フューショット TTS: 10〜30 秒の音声サンプルを入力して高品質 TTS を生成。

    - 多言語・クロスリンガル対応: 入力欄に多言語テキストを貼るだけ — 言語を気にする必要なし。現在対応: 英語、日本語、韓国語、中国語、フランス語、ドイツ語、アラビア語、スペイン語。

    - 音素依存なし: 強い汎化能力があり、TTS に音素を必要としません。あらゆる文字体系のテキストを処理可能。

    - 高精度: Seed-TTS Eval で CER（文字誤り率）約 0.4%、WER（単語誤り率）約 0.8%。

    - 高速: torch compile で加速。Nvidia RTX 4090 GPU でリアルタイム係数約 1:7。

    - WebUI 推論: Gradio ベースの使いやすい Web UI。Chrome、Firefox、Edge などに対応。
    
    - GUI 推論: API サーバーと連携する PyQt6 グラフィカルインターフェース。Linux、Windows、macOS 対応。

  upgradeDescription: |
    - feat(model): 同梱チェックポイントを fishaudio/s2-pro に切替（最新プロティアの表現力 TTS / ボイスクローニング）。
    - chore(runtime): fishspeech コンテナのコマンドが WebUI 起動前に s2-pro ダウンロード Job の `.s2-pro.done` マーカーをポーリングするようになり、重みがディスクに揃う前に起動しなくなりました。
    - fix(cuda): コンテナ起動時の `uv run` を回避し `/app/.venv/bin/python` で `run_webui.py` を直接起動（加えて `UV_NO_SYNC=1` / `UV_FROZEN=1`）。以前はイメージの `start_webui.sh` が `uv run` を使い、ランタイムで `--extra cu129` なしの暗黙的 `uv sync` が走り torch が cu126 に静かにダウングレード — Blackwell (sm_120) で "no kernel image is available for execution on the device" が発生。焼き込み済み cu129 venv はそのまま保持されます。
    - fix(docker): Blackwell (sm_120) 対応のため CUDA 12.6 → 12.9 に更新 (#1225)。CUDA 12.6 / cu126 は Blackwell GPU（RTX 5000 シリーズ、sm_120）で "no kernel image available" となり、CUDA 12.9 / cu129 へのアップグレードで解消。compose.base.yml で CUDA_VER と UV_EXTRA を上書き可能なビルド引数として公開し、古いドライバ利用者は CUDA_VER=12.6.0 UV_EXTRA=cu126 を渡せます。

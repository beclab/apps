metadata:
  title: Fish Speech
  description: TTS open source SOTA
spec:
  fullDescription: |
    **NOTA IMPORTANTE**  
    Questa è un'app condivisa. Nell'intero sistema Olares verrà installato un solo servizio. Ogni utente può installare una voce desktop per accedere o usare l'entrance condivisa e chiamare l'API del servizio.

    **PANORAMICA**
    Text-to-Speech e Voice Cloning davvero umani

    Checkpoint incluso: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — l'ultima release pro-tier della famiglia TTS / voice-cloning espressiva di Fish Audio.
    
    FishAudio-S2 Pro è un modello espressivo di text-to-speech (TTS) e voice cloning di Fish Audio, progettato per generare parlato naturale, realistico ed emotivamente ricco — non robotico, non piatto e non limitato alla narrazione da studio.
    
    FishAudio-S2 Pro si concentra su come parlano davvero le persone: con emozione, variazioni, pause e intenzione.

    Funzionalità
    - TTS zero-shot e few-shot: inserisci un campione vocale di 10–30 secondi per generare TTS di alta qualità.

    - Supporto multilingue e cross-lingual: incolla testo multilingue nell'input — senza preoccuparti della lingua. Attualmente: inglese, giapponese, coreano, cinese, francese, tedesco, arabo e spagnolo.

    - Nessuna dipendenza dai fonemi: forte generalizzazione; non richiede fonemi per il TTS. Gestisce testo in qualsiasi script.

    - Alta accuratezza: CER (Character Error Rate) bassa ~0.4% e WER (Word Error Rate) ~0.8% su Seed-TTS Eval.

    - Veloce: accelerato con torch compile; fattore real-time circa 1:7 su GPU Nvidia RTX 4090.

    - Inferenza WebUI: UI web Gradio facile da usare, compatibile con Chrome, Firefox, Edge e altri.
    
    - Inferenza GUI: interfaccia grafica PyQt6 che lavora con il server API. Supporta Linux, Windows e macOS.

  upgradeDescription: |
    - feat(model): passaggio del checkpoint incluso a fishaudio/s2-pro (ultima release pro-tier TTS / voice-cloning espressiva).
    - chore(runtime): il comando del container fishspeech ora attende il marker `.s2-pro.done` del Job di download s2-pro prima di avviare la WebUI, così non parte prima che i pesi siano su disco.
    - fix(cuda): bypass di `uv run` all'avvio del container e lancio diretto di `run_webui.py` con `/app/.venv/bin/python` (più `UV_NO_SYNC=1` / `UV_FROZEN=1`). Prima `start_webui.sh` usava `uv run`, che eseguiva un `uv sync` implicito senza `--extra cu129` e degradava torch a cu126 — Blackwell (sm_120) falliva con "no kernel image is available for execution on the device". Il venv cu129 baked è ora preservato.
    - fix(docker): aggiornamento CUDA 12.6 → 12.9 per supporto Blackwell (sm_120) (#1225). CUDA 12.6 / cu126 fallisce con "no kernel image available" su GPU Blackwell (serie RTX 5000, sm_120); l'upgrade a CUDA 12.9 / cu129 lo risolve. CUDA_VER e UV_EXTRA sono esposti come build args sovrascrivibili in compose.base.yml così utenti con driver più vecchi possono passare CUDA_VER=12.6.0 UV_EXTRA=cu126.

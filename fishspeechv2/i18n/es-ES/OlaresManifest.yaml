metadata:
  title: Fish Speech
  description: TTS open source de última generación
spec:
  fullDescription: |
    **NOTA IMPORTANTE**  
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar una entrada de escritorio para acceder o usar la entrada compartida y llamar a la API del servicio.

    **RESUMEN**
    Text-to-Speech y clonación de voz verdaderamente humanos

    Checkpoint incluido: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — la última versión pro de la familia TTS / clonación de voz expresiva de Fish Audio.
    
    FishAudio-S2 Pro es un modelo expresivo de text-to-speech (TTS) y clonación de voz de Fish Audio, diseñado para generar habla natural, realista y emocionalmente rica — no robótica, no plana ni limitada a narración de estudio.
    
    FishAudio-S2 Pro se centra en cómo hablan realmente las personas: con emoción, variación, pausas e intención.

    Características
    - TTS zero-shot y few-shot: introduzca una muestra vocal de 10 a 30 segundos para generar TTS de alta calidad.

    - Soporte multilingüe y cross-lingual: pegue texto multilingüe en el cuadro — sin preocuparse por el idioma. Actualmente: inglés, japonés, coreano, chino, francés, alemán, árabe y español.

    - Sin dependencia de fonemas: fuerte generalización; no depende de fonemas para TTS. Maneja texto en cualquier escritura.

    - Alta precisión: CER (Character Error Rate) baja de ~0.4 % y WER (Word Error Rate) de ~0.8 % en Seed-TTS Eval.

    - Rápido: acelerado con torch compile; factor en tiempo real ~1:7 en una GPU Nvidia RTX 4090.

    - Inferencia WebUI: UI web fácil basada en Gradio, compatible con Chrome, Firefox, Edge y otros.
    
    - Inferencia GUI: interfaz PyQt6 que funciona con el servidor API. Compatible con Linux, Windows y macOS.

  upgradeDescription: |
    - feat(model): cambiar el checkpoint incluido a fishaudio/s2-pro (última versión pro de TTS / clonación de voz expresiva).
    - chore(runtime): el comando del contenedor fishspeech ahora espera el marcador `.s2-pro.done` del Job de descarga s2-pro antes de lanzar la WebUI, para no arrancar antes de que los pesos estén en disco.
    - fix(cuda): evitar `uv run` al inicio del contenedor y lanzar `run_webui.py` directamente con `/app/.venv/bin/python` (más `UV_NO_SYNC=1` / `UV_FROZEN=1`). Antes, `start_webui.sh` usaba `uv run`, que hacía un `uv sync` implícito sin `--extra cu129` y degradaba torch a cu126 — Blackwell (sm_120) fallaba con "no kernel image is available for execution on the device". El venv cu129 embebido se conserva tal cual.
    - fix(docker): subir CUDA 12.6 → 12.9 para soporte Blackwell (sm_120) (#1225). CUDA 12.6 / cu126 falla con "no kernel image available" en GPUs Blackwell (serie RTX 5000, sm_120); actualizar a CUDA 12.9 / cu129 lo corrige. CUDA_VER y UV_EXTRA se exponen como build args anulables en compose.base.yml para que usuarios con drivers antiguos puedan pasar CUDA_VER=12.6.0 UV_EXTRA=cu126.

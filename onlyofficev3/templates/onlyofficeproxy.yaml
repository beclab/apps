apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: "{{ .Release.Namespace }}"
data:
  nginx.conf: |
{{ include "onlyofficev3.nginx.conf" . | indent 4 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyofficeproxy
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: onlyoffice
spec:
  replicas: {{ .Values.workloads.onlyofficeproxy.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: onlyoffice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: onlyoffice
      annotations:
        checksum/nginx-config: {{ include "onlyofficev3.nginx.conf" . | sha256sum }}
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
                  [ "$http_code" -ge 200 ] && [ "$http_code" -lt 500 ]
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 240
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty

---
apiVersion: v1
kind: Service
metadata:
  name: onlyofficeproxy
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    io.kompose.service: onlyoffice
  ports:
    - name: onlyoffice
      protocol: TCP
      port: 8080
      targetPort: 8080

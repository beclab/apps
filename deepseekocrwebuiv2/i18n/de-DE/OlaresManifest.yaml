metadata:
  title: DeepSeek-OCR-2 WebUI
  description: Sofort einsatzbereite DeepSeek-OCR-2-Weboberfläche
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsam genutzte App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer kann einen Desktop-Eintrag für den Zugriff installieren oder den gemeinsamen Zugang verwenden, um die Dienst-API aufzurufen.

    **ÜBERBLICK**
    DeepSeek-OCR-WebUI ist eine intelligente Webanwendung zur Bilderkennung auf Basis des DeepSeek-OCR-2-Modells (Visual Causal Flow) und bietet eine intuitive Benutzeroberfläche sowie leistungsstarke Erkennungsfunktionen.

    **Wichtigste Vorteile**
    - DeepSeek-OCR-2-Modell – OCR der nächsten Generation mit Visual-Causal-Flow-Architektur
    - 7 Erkennungsmodi – Document, OCR, Chart, Find, Freeform usw.
    - Bounding-Box-Visualisierung – Der Find-Modus markiert Positionen automatisch
    - Stapelverarbeitung – Sequentielle Erkennung mehrerer Bilder
    - PDF-Unterstützung – PDF-Dateien hochladen und automatisch in Bilder umwandeln
    - Moderne Oberfläche – Attraktive Farbverläufe und Animationseffekte
    - Mehrsprachigkeit – Vereinfachtes Chinesisch, traditionelles Chinesisch, Englisch und Japanisch
    - GPU-Beschleunigung – Leistungsstarke Inferenz mit NVIDIA-GPU
    - Automatischer Modelldownload – Integrierter HuggingFace-Downloader mit Fortschrittsanzeige
    - ModelScope-Ausweichlösung – Automatischer Wechsel zu ModelScope, wenn HuggingFace nicht verfügbar ist
  upgradeDescription: |
    Modelldownloader und OCR-Dienst wurden für eine bessere Ressourcenisolierung und Lebenszyklusverwaltung in unabhängige Deployments getrennt.

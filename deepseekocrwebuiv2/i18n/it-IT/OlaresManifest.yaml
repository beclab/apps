metadata:
  title: DeepSeek-OCR-2 WebUI
  description: Interfaccia web DeepSeek-OCR-2 pronta all'uso
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Ogni utente può installare un collegamento sul desktop per accedervi oppure usare l'accesso condiviso per chiamare l'API del servizio.

    **PANORAMICA**
    DeepSeek-OCR-WebUI è un'applicazione web intelligente per il riconoscimento delle immagini basata sul modello DeepSeek-OCR-2 (Visual Causal Flow), con un'interfaccia intuitiva e potenti capacità di riconoscimento.

    **Caratteristiche principali**
    - Modello DeepSeek-OCR-2: OCR di nuova generazione basato sull'architettura Visual Causal Flow
    - 7 modalità di riconoscimento: Document, OCR, Chart, Find, Freeform e altre
    - Visualizzazione dei riquadri: la modalità Find annota automaticamente le posizioni
    - Elaborazione in batch: riconoscimento sequenziale di più immagini
    - Supporto PDF: carica PDF e li converte automaticamente in immagini
    - Interfaccia moderna: sfondi sfumati ed effetti di animazione
    - Supporto multilingue: cinese semplificato, cinese tradizionale, inglese e giapponese
    - Accelerazione GPU: inferenza ad alte prestazioni con GPU NVIDIA
    - Download automatico del modello: downloader HuggingFace integrato con avanzamento
    - Ripiego su ModelScope: passaggio automatico a ModelScope se HuggingFace non è disponibile
  upgradeDescription: |
    Il downloader dei modelli e il servizio OCR sono stati separati in Deployment indipendenti per migliorare l'isolamento delle risorse e la gestione del ciclo di vita.

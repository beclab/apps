metadata:
  title: DeepSeek-OCR-2 WebUI
  description: Interfaz web de DeepSeek-OCR-2 lista para usar
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar un acceso en el escritorio o utilizar la entrada compartida para llamar a la API del servicio.

    **DESCRIPCIÓN GENERAL**
    DeepSeek-OCR-WebUI es una aplicación web inteligente de reconocimiento de imágenes basada en el modelo DeepSeek-OCR-2 (Visual Causal Flow), con una interfaz intuitiva y potentes funciones de reconocimiento.

    **Características principales**
    - Modelo DeepSeek-OCR-2: OCR de última generación con arquitectura Visual Causal Flow
    - 7 modos de reconocimiento: Document, OCR, Chart, Find, Freeform, etc.
    - Visualización de cuadros delimitadores: el modo Find anota automáticamente las posiciones
    - Procesamiento por lotes: reconocimiento secuencial de varias imágenes
    - Compatibilidad con PDF: carga archivos PDF y los convierte automáticamente en imágenes
    - Interfaz moderna: atractivos fondos degradados y efectos de animación
    - Compatibilidad multilingüe: chino simplificado, chino tradicional, inglés y japonés
    - Aceleración por GPU: inferencia de alto rendimiento con GPU NVIDIA
    - Descarga automática del modelo: descargador integrado de HuggingFace con seguimiento del progreso
    - Alternativa ModelScope: cambio automático a ModelScope cuando HuggingFace no está disponible
  upgradeDescription: |
    El descargador de modelos y el servicio OCR se han separado en Deployments independientes para mejorar el aislamiento de recursos y la gestión del ciclo de vida.

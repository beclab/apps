metadata:
  title: DeepSeek-OCR-2 WebUI
  description: すぐに使える DeepSeek-OCR-2 Web UI
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体にインストールされるサービスは1つだけです。各ユーザーはデスクトップエントリをインストールしてアクセスするか、共有エントランスからサービス API を呼び出せます。

    **概要**
    DeepSeek-OCR-WebUI は、DeepSeek-OCR-2 モデル（Visual Causal Flow）を基盤とするインテリジェントな画像認識 Web アプリケーションで、直感的なユーザーインターフェースと強力な認識機能を提供します。

    **主な特長**
    - DeepSeek-OCR-2 モデル – Visual Causal Flow アーキテクチャによる次世代 OCR
    - 7つの認識モード – Document、OCR、Chart、Find、Freeform など
    - バウンディングボックス表示 – Find モードで位置を自動的に注釈
    - バッチ処理 – 複数画像を順番に認識
    - PDF 対応 – PDF ファイルをアップロードして画像へ自動変換
    - モダンな UI – 美しいグラデーション背景とアニメーション効果
    - 多言語対応 – 簡体字中国語、繁体字中国語、英語、日本語
    - GPU アクセラレーション – NVIDIA GPU による高性能推論
    - モデルの自動ダウンロード – 進捗表示付きの HuggingFace ダウンローダーを内蔵
    - ModelScope フォールバック – HuggingFace が利用できない場合に ModelScope へ自動切り替え
  upgradeDescription: |
    リソースの分離とライフサイクル管理を改善するため、モデルダウンローダーと OCR サービスを独立した Deployment に分離しました。

metadata:
  title: DeepSeek-OCR-2 WebUI
  description: Interface Web DeepSeek-OCR-2 prête à l'emploi
spec:
  fullDescription: |
    **REMARQUE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé dans tout le système Olares. Chaque utilisateur peut installer un raccourci sur le bureau pour y accéder ou utiliser l'entrée partagée afin d'appeler l'API du service.

    **PRÉSENTATION**
    DeepSeek-OCR-WebUI est une application Web intelligente de reconnaissance d'images basée sur le modèle DeepSeek-OCR-2 (Visual Causal Flow), offrant une interface intuitive et de puissantes capacités de reconnaissance.

    **Points forts**
    - Modèle DeepSeek-OCR-2 – OCR nouvelle génération basé sur l'architecture Visual Causal Flow
    - 7 modes de reconnaissance – Document, OCR, Chart, Find, Freeform, etc.
    - Visualisation des cadres englobants – Le mode Find annote automatiquement les positions
    - Traitement par lots – Reconnaissance séquentielle de plusieurs images
    - Prise en charge des PDF – Importation des PDF et conversion automatique en images
    - Interface moderne – Fonds en dégradé et effets d'animation
    - Prise en charge multilingue – Chinois simplifié, chinois traditionnel, anglais et japonais
    - Accélération GPU – Inférence haute performance avec un GPU NVIDIA
    - Téléchargement automatique du modèle – Téléchargeur HuggingFace intégré avec suivi de progression
    - Repli sur ModelScope – Basculement automatique vers ModelScope si HuggingFace est indisponible
  upgradeDescription: |
    Le téléchargeur de modèles et le service OCR ont été séparés en Deployments indépendants afin d'améliorer l'isolation des ressources et la gestion du cycle de vie.

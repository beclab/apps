metadata:
  title: WeWe RSS
  description: Método de suscripción más elegante para cuentas oficiales de WeChat
spec:
  fullDescription: |
    Método de suscripción más elegante para cuentas oficiales de WeChat.

    Funciones
    La versión v2.x usa una nueva interfaz, más estable
    Soporte de suscripción a cuentas oficiales de WeChat (basado en WeChat Reading)
    Obtener el historial de la cuenta oficial y publicar artículos
    Actualización automática de contenido en segundo plano
    Generación de RSS de cuentas oficiales de WeChat (admite formato .atom.rss.json)
    Soporte de salida de contenido de texto completo, haciendo la lectura accesible
    Exportar OPML de todos los feeds
    Admite filtrado de títulos y la lógica "o" de varias palabras clave.
    Admite disparar actualizaciones de un solo feedid

  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los mounts de la configuración de nginx y las rutas de logs con el layout de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
    Actualizar a la versión 2.6.1

    Cambios
    - Corregido el problema de la imagen docker
    - Soporte para obtener artículos históricos de cuentas públicas
    - Conservada la limpieza HTML de artículos
    - Añadido retraso para actualizaciones continuas
    - Añadido un dominio espejo acelerado

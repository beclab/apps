metadata:
  title: WeWe RSS
  description: Elegantere Abonnementmethode für WeChat Official Accounts
spec:
  fullDescription: |
    Elegantere Abonnementmethode für WeChat Official Accounts.

    Funktionen
    Die Version v2.x nutzt eine neue Schnittstelle und ist stabiler
    Unterstützung für Abonnements von WeChat Official Accounts (basierend auf WeChat Reading)
    Abruf der Historie von Official Accounts und Veröffentlichungsartikel
    Automatische Inhaltsaktualisierung im Hintergrund
    RSS-Generierung für WeChat Official Accounts (unterstützt .atom.rss.json-Format)
    Unterstützung der Ausgabe des vollständigen Textinhalts für barrierefreies Lesen
    OPML-Export für alle Feeds
    Unterstützung der Filterung von Titeln und der „ODER“-Logik mehrerer Schlüsselwörter.
    Unterstützung zum Auslösen von Updates einzelner feedid

  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.
    Upgrade auf Version 2.6.1

    Änderungen
    - Problem mit dem Docker-Image behoben
    - Unterstützung zum Abrufen historischer Artikel von öffentlichen Accounts
    - HTML-Bereinigung von Artikeln beibehalten
    - Verzögerung für fortlaufende Updates hinzugefügt
    - Beschleunigte Mirror-Domain hinzugefügt

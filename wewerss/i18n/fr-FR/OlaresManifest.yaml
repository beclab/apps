metadata:
  title: WeWe RSS
  description: Méthode d'abonnement plus élégante pour les comptes officiels WeChat
spec:
  fullDescription: |
    Méthode d'abonnement plus élégante pour les comptes officiels WeChat.

    Fonctions
    La version v2.x utilise une nouvelle interface, plus stable
    Prise en charge de l'abonnement aux comptes officiels WeChat (basé sur WeChat Reading)
    Obtenir l'historique du compte officiel et publier des articles
    Mise à jour automatique du contenu en arrière-plan
    Génération RSS des comptes officiels WeChat (prend en charge le format .atom.rss.json)
    Prise en charge de la sortie du contenu en texte intégral, rendant la lecture accessible
    Export OPML de tous les flux
    Prend en charge le filtrage des titres et la logique « ou » de plusieurs mots-clés.
    Prend en charge le déclenchement des mises à jour d'un seul feedid

  upgradeDescription: |
    Passer l'image du reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) à l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.
    Mise à niveau vers la version 2.6.1

    Nouveautés
    - Correction du problème d'image docker
    - Prise en charge de la récupération d'articles historiques des comptes publics
    - Conservation du nettoyage HTML des articles
    - Ajout d'un délai pour les mises à jour continues
    - Ajout d'un domaine miroir accéléré

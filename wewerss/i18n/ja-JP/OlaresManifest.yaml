metadata:
  title: WeWe RSS
  description: より洗練された WeChat 公式アカウント購読方法
spec:
  fullDescription: |
    より洗練された WeChat 公式アカウント購読方法。

    機能
    v2.x バージョンは新しいインターフェースを使用し、より安定
    WeChat 公式アカウント購読をサポート（WeChat Reading ベース）
    公式アカウントの履歴取得と記事公開
    バックグラウンドでの自動コンテンツ更新
    WeChat 公式アカウントの RSS 生成（.atom.rss.json 形式対応）
    全文コンテンツ出力をサポートし、読みやすく
    全フィードの OPML エクスポート
    タイトルのフィルタリングと複数キーワードの「または」論理に対応。
    単一 feedid の更新トリガーに対応

  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
    バージョン 2.6.1 へアップグレード

    変更点
    - Docker イメージの問題を修正
    - 公開アカウントからの履歴記事取得をサポート
    - 記事 HTML クリーンアップを維持
    - 連続更新用の遅延を追加
    - 高速化ミラードメインを追加

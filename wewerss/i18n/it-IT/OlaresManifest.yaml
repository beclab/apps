metadata:
  title: WeWe RSS
  description: Metodo di sottoscrizione più elegante per gli account ufficiali WeChat
spec:
  fullDescription: |
    Metodo di sottoscrizione più elegante per gli account ufficiali WeChat.

    Funzioni
    La versione v2.x usa una nuova interfaccia, più stabile
    Supporto alla sottoscrizione di account ufficiali WeChat (basato su WeChat Reading)
    Ottenere la cronologia dell'account ufficiale e pubblicare articoli
    Aggiornamento automatico dei contenuti in background
    Generazione RSS degli account ufficiali WeChat (supporta il formato .atom.rss.json)
    Supporto all'output del contenuto a testo completo, rendendo la lettura accessibile
    Esportazione OPML di tutti i feed
    Supporta il filtraggio dei titoli e la logica "or" di più parole chiave.
    Supporta l'attivazione di aggiornamenti di un singolo feedid

  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico di Bitnami di `OPENRESTY_CONF_FILE`.
    Aggiornamento alla versione 2.6.1

    Novità
    - Risolto il problema dell'immagine docker
    - Supporto al recupero di articoli storici dagli account pubblici
    - Mantenuta la pulizia HTML degli articoli
    - Aggiunto ritardo per gli aggiornamenti continui
    - Aggiunto un dominio mirror accelerato

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  uptimekuma: 1
metadata:
  name: uptimekuma
  description: A fancy self-hosted monitoring tool
  icon: https://app.cdn.olares.com/appstore/uptimekuma/icon.png
  appid: uptimekuma
  version: '1.0.12'
  title: Uptime Kuma
  categories:
  - Developer Tools
  - developer
  tags:
  - monitoring

permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '2.5.5'
  upgradeDescription: |
    Chart 1.0.12 upgrades Uptime Kuma from the 1.x image tag `1` (chart appVersion 1.23.16) to 2.5.5.
    Image: docker.io/beclab/louislam-uptime-kuma:2.5.5. This is the root image. The rootless tag is not used, because Uptime Kuma does not recommend it for a v1 to v2 upgrade.

    The data directory stays at /app/data. When kuma.db exists, an init container copies it once to appData/backups/chart-1.0.12/data, then the application migrates that directory in place. Later starts and a directory without kuma.db skip the copy. Do not stop the pod while that migration is running. If it is interrupted, restore the copy and retry.

    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
    https://github.com/louislam/uptime-kuma/releases/tag/2.5.5
  featuredImage: https://app.cdn.olares.com/appstore/uptimekuma/1.jpg
  promoteImage:
  - https://app.cdn.olares.com/appstore/uptimekuma/1.jpg
  - https://app.cdn.olares.com/appstore/uptimekuma/2.jpg
  - https://app.cdn.olares.com/appstore/uptimekuma/3.jpg
  fullDescription: |
    Uptime Kuma is an easy-to-use self-hosted monitoring tool.

    Features
    Monitoring uptime for HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    Fancy, Reactive, Fast UI/UX
    Notifications via Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP), and 90+ notification services, click here for the full list
    20-second intervals
    Multi Languages
    Multiple status pages
    Map status pages to specific domains
    Ping chart
    Certificate info
    Proxy support
    2FA support

  developer: Louis Lam
  website: https://uptime.kuma.pet/
  sourceCode: https://github.com/louislam/uptime-kuma
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 128Mi
  limitedDisk: 256Mi
  requiredCpu: 0.25
  limitedCpu: 1
  doc: https://github.com/louislam/uptime-kuma/wiki
  license:
  - text: MIT
    url: https://github.com/louislam/uptime-kuma?tab=readme-ov-file#MIT-1-ov-file
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: uptimekuma
  port: 3001
  host: uptimekuma
  title: Uptime Kuma
  icon: https://app.cdn.olares.com/appstore/uptimekuma/icon.png
  openMethod: window

metadata:
  title: Uptime Kuma
  description: Una elegante herramienta de monitorización autoalojada
spec:
  upgradeDescription: |
    El chart 1.0.12 actualiza Uptime Kuma de la etiqueta de imagen 1.x `1` (appVersion 1.23.16) a 2.5.5.
    Imagen: docker.io/beclab/louislam-uptime-kuma:2.5.5. Es la imagen root. No se usa la etiqueta rootless, porque Uptime Kuma no la recomienda para pasar de v1 a v2.
    El directorio de datos sigue en /app/data. Si existe kuma.db, un init container lo copia una vez a appData/backups/chart-1.0.12/data y la aplicación migra ese directorio. Los arranques posteriores y un directorio sin kuma.db omiten la copia. No detenga el pod durante la migración.
    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
  fullDescription: |
    Uptime Kuma es una herramienta de monitorización autoalojada fácil de usar.

    Características
    Monitorización de disponibilidad para HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    IU/UX elegante, reactiva y rápida
    Notificaciones vía Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP) y más de 90 servicios de notificación; haga clic aquí para la lista completa
    Intervalos de 20 segundos
    Varios idiomas
    Varias páginas de estado
    Asignar páginas de estado a dominios específicos
    Gráfico de ping
    Información del certificado
    Soporte de proxy
    Soporte 2FA

metadata:
  title: Uptime Kuma
  description: Ein elegantes Self-Hosted-Monitoring-Tool
spec:
  upgradeDescription: |
    Chart 1.0.12 aktualisiert Uptime Kuma vom 1.x-Image-Tag `1` (appVersion 1.23.16) auf 2.5.5.
    Image: docker.io/beclab/louislam-uptime-kuma:2.5.5. Das ist das Root-Image. Das Rootless-Tag wird nicht verwendet, weil Uptime Kuma es für ein Upgrade von v1 auf v2 nicht empfiehlt.
    Das Datenverzeichnis bleibt /app/data. Wenn kuma.db existiert, kopiert ein Init-Container es einmal nach appData/backups/chart-1.0.12/data. Danach migriert die Anwendung das Verzeichnis vor Ort. Spätere Starts und ein Verzeichnis ohne kuma.db überspringen die Kopie. Den Pod während der Migration nicht stoppen.
    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
  fullDescription: |
    Uptime Kuma ist ein einfach zu bedienendes Self-Hosted-Monitoring-Tool.

    Funktionen
    Überwachung der Verfügbarkeit für HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    Elegante, reaktive, schnelle UI/UX
    Benachrichtigungen über Telegram, Discord, Gotify, Slack, Pushover, E-Mail (SMTP) und über 90 weitere Benachrichtigungsdienste – hier klicken für die vollständige Liste
    20-Sekunden-Intervalle
    Mehrsprachigkeit
    Mehrere Statusseiten
    Statusseiten bestimmten Domains zuordnen
    Ping-Diagramm
    Zertifikatsinformationen
    Proxy-Unterstützung
    2FA-Unterstützung

metadata:
  title: Uptime Kuma
  description: Un outil de surveillance auto-hébergé élégant
spec:
  upgradeDescription: |
    Le chart 1.0.12 met à jour Uptime Kuma de l'étiquette d'image 1.x `1` (appVersion 1.23.16) vers 2.5.5.
    Image : docker.io/beclab/louislam-uptime-kuma:2.5.5. C'est l'image root. L'étiquette rootless n'est pas utilisée, car Uptime Kuma ne la recommande pas pour passer de v1 à v2.
    Le répertoire de données reste /app/data. Si kuma.db existe, un init container le copie une fois vers appData/backups/chart-1.0.12/data, puis l'application migre ce répertoire. Les démarrages suivants et un répertoire sans kuma.db ignorent la copie. N'arrêtez pas le pod pendant la migration.
    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
  fullDescription: |
    Uptime Kuma est un outil de surveillance auto-hébergé facile à utiliser.

    Fonctionnalités
    Surveillance de la disponibilité pour HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    UI/UX élégante, réactive et rapide
    Notifications via Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP) et plus de 90 services de notification ; cliquez ici pour la liste complète
    Intervalles de 20 secondes
    Plusieurs langues
    Plusieurs pages d'état
    Associer des pages d'état à des domaines spécifiques
    Graphique de ping
    Informations sur le certificat
    Prise en charge des proxys
    Prise en charge de la 2FA

metadata:
  title: Uptime Kuma
  description: おしゃれなセルフホスト監視ツール
spec:
  upgradeDescription: |
    Chart 1.0.12 は Uptime Kuma を 1.x イメージタグ `1`（appVersion 1.23.16）から 2.5.5 に更新します。
    イメージは docker.io/beclab/louislam-uptime-kuma:2.5.5 です。これは root イメージです。v1 から v2 への更新では rootless タグは推奨されないため使いません。
    データディレクトリは /app/data のままです。kuma.db がある場合、init コンテナが一度 appData/backups/chart-1.0.12/data にコピーし、その後アプリケーションがその場で移行します。以降の起動と kuma.db がないディレクトリではコピーを省略します。移行中は Pod を停止しないでください。
    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
  fullDescription: |
    Uptime Kuma は使いやすいセルフホストの監視ツールです。

    機能
    HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers の稼働監視
    洗練された高速なリアクティブ UI/UX
    Telegram、Discord、Gotify、Slack、Pushover、Email (SMTP) など 90 以上の通知サービスに対応（一覧はこちら）
    20 秒間隔
    多言語対応
    複数のステータスページ
    ステータスページを特定ドメインに割り当て
    Ping チャート
    証明書情報
    プロキシ対応
    2FA 対応

metadata:
  title: Uptime Kuma
  description: Uno strumento di monitoraggio self-hosted elegante
spec:
  upgradeDescription: |
    Il chart 1.0.12 aggiorna Uptime Kuma dal tag immagine 1.x `1` (appVersion 1.23.16) a 2.5.5.
    Immagine: docker.io/beclab/louislam-uptime-kuma:2.5.5. È l'immagine root. Il tag rootless non è usato, perché Uptime Kuma non lo consiglia per il passaggio da v1 a v2.
    La directory dati resta /app/data. Se kuma.db esiste, un init container lo copia una volta in appData/backups/chart-1.0.12/data e l'applicazione migra quella directory. Gli avvii successivi e una directory senza kuma.db saltano la copia. Non fermare il pod durante la migrazione.
    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
  fullDescription: |
    Uptime Kuma è uno strumento di monitoraggio self-hosted facile da usare.

    Funzionalità
    Monitoraggio dell'uptime per HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    UI/UX elegante, reattiva e veloce
    Notifiche tramite Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP) e oltre 90 servizi di notifica; clicca qui per l'elenco completo
    Intervalli di 20 secondi
    Più lingue
    Più pagine di stato
    Mappa le pagine di stato a domini specifici
    Grafico ping
    Informazioni sul certificato
    Supporto proxy
    Supporto 2FA

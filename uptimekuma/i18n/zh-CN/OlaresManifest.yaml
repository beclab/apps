metadata:
  title: Uptime Kuma
  description: 一款精美的自托管监控工具

spec:
  upgradeDescription: |
    Chart 1.0.12 将 Uptime Kuma 从 1.x 镜像标签 `1`（chart appVersion 1.23.16）升级到 2.5.5。
    镜像为 docker.io/beclab/louislam-uptime-kuma:2.5.5。这是 root 镜像。v1 升到 v2 时官方不建议使用 rootless 标签。

    数据目录仍是 /app/data。若已有 kuma.db，init 容器会先把它复制到 appData/backups/chart-1.0.12/data，再由应用就地迁移。之后再次启动，以及没有 kuma.db 的目录，都会跳过复制。迁移过程中不要停止 Pod。如果中断，请恢复该副本后重试。

    https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2
    https://github.com/louislam/uptime-kuma/releases/tag/2.5.5
  fullDescription: |
    Uptime Kuma 是一款易于使用的自托管监控工具。

    功能
    监控 HTTP(s) / TCP / HTTP(s) 关键字 / HTTP(s) Json 查询 / Ping / DNS 记录 / 推送 / Steam 游戏服务器 / Docker 容器的正常运行时间
    精美、反应灵敏、快速的 UI/UX
    通过 Telegram、Discord、Gotify、Slack、Pushover、电子邮件 (SMTP) 和 90 多种通知服务发送通知，单击此处查看完整列表
    20 秒间隔
    多语言
    多个状态页面
    将状态页面映射到特定域
    Ping 图表
    证书信息
    代理支持
    2FA 支持
metadata:
  title: Nomic Embed v1.5 (Ollama)
  description: Un modèle d’embedding ouvert et performant avec une grande fenêtre de contexte de jetons
spec:
  fullDescription: |
    **REMARQUE IMPORTANTE**
    Ce modèle fonctionne uniquement sur CPU. Pour l’exécuter sur GPU, veuillez installer la version générique du programme Ollama.

    Il s’agit d’une application partagée. Une fois installée par l’Olares Admin, tous les utilisateurs du cluster peuvent l’utiliser via l’application de référence.

    **PRÉSENTATION DU MODÈLE**
    Nomic Embed est un nouveau modèle d’embedding de texte de Nomic AI qui prend en charge des séquences de longueur 8192. Il surpasse OpenAI Ada-002 et text-embedding-3-small sur les tâches à contexte court comme long.

    Excellente nouvelle ! : nomic-embed-text-v1.5 est désormais multimodal ! nomic-embed-vision-v1.5 est aligné sur l’espace d’embedding de nomic-embed-text-v1.5, ce qui signifie que tout embedding de texte est multimodal !
  upgradeDescription: |
    Environnement d’exécution Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé dans Home/Ollama/.nv (toutes les applications Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Mise à jour de l’image proxy Olares API vers beclab/harveyff-olares-ollama:v0.1.21.

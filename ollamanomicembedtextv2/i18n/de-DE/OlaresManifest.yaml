metadata:
  title: Nomic Embed v1.5 (Ollama)
  description: Ein leistungsstarkes offenes Einbettungsmodell mit großem Token-Kontextfenster
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dieses Modell läuft nur auf der CPU. Wenn Sie es auf einer GPU ausführen möchten, installieren Sie bitte die generische Version des Ollama-Programms.

    Dies ist eine gemeinsam genutzte App. Nach der Installation durch den Olares Admin können alle Benutzer im Cluster über die Referenz-App darauf zugreifen.

    **MODELLÜBERSICHT**
    Nomic Embed ist ein neues Texteinbettungsmodell von Nomic AI, das Sequenzen mit einer Länge von 8192 unterstützt. Es übertrifft OpenAI Ada-002 und text-embedding-3-small sowohl bei Aufgaben mit kurzem als auch langem Kontext.

    Spannendes Update!: nomic-embed-text-v1.5 ist jetzt multimodal! nomic-embed-vision-v1.5 ist auf den Einbettungsraum von nomic-embed-text-v1.5 abgestimmt, sodass jede Texteinbettung multimodal ist!
  upgradeDescription: |
    Ollama-Laufzeit: ollama/ollama:0.30.0. Gemeinsamer CUDA ComputeCache unter Home/Ollama/.nv (alle Ollama-Apps). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Olares API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

metadata:
  title: Nomic Embed v1.5 (Ollama)
  description: 大きなトークンコンテキストウィンドウを備えた高性能なオープン埋め込みモデル
spec:
  fullDescription: |
    **重要な注意**
    このモデルは CPU のみで動作します。GPU で実行する場合は、汎用版の Ollama プログラムをインストールしてください。

    これは共有アプリです。Olares Admin がインストールすると、クラスター内のすべてのユーザーが参照アプリを通じて利用できます。

    **モデル概要**
    Nomic Embed は Nomic AI の新しいテキスト埋め込みモデルで、長さ 8192 のシーケンスに対応します。短いコンテキストと長いコンテキストの両タスクで OpenAI Ada-002 および text-embedding-3-small を上回ります。

    注目のアップデート!: nomic-embed-text-v1.5 がマルチモーダルになりました！nomic-embed-vision-v1.5 は nomic-embed-text-v1.5 の埋め込み空間に整合されているため、あらゆるテキスト埋め込みがマルチモーダルになります！
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。Home/Ollama/.nv の共有 CUDA ComputeCache（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 に更新。

metadata:
  title: Nomic Embed v1.5 (Ollama)
  description: Un modelo abierto de embeddings de alto rendimiento con una amplia ventana de contexto de tokens
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Este modelo se ejecuta únicamente en CPU. Si quieres ejecutarlo en GPU, instala la versión genérica del programa Ollama.

    Esta es una aplicación compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden utilizarla mediante la aplicación de referencia.

    **DESCRIPCIÓN DEL MODELO**
    Nomic Embed es un nuevo modelo de embeddings de texto de Nomic AI que admite secuencias de 8192 de longitud. Supera a OpenAI Ada-002 y text-embedding-3-small en tareas de contexto tanto corto como largo.

    ¡Actualización emocionante!: ¡nomic-embed-text-v1.5 ahora es multimodal! nomic-embed-vision-v1.5 está alineado con el espacio de embeddings de nomic-embed-text-v1.5, lo que significa que cualquier embedding de texto es multimodal.
  upgradeDescription: |
    Entorno de ejecución de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las aplicaciones Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Imagen del proxy de Olares API actualizada a beclab/harveyff-olares-ollama:v0.1.21.

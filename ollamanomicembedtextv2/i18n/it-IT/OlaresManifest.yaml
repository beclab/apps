metadata:
  title: Nomic Embed v1.5 (Ollama)
  description: Un modello di embedding aperto ad alte prestazioni con un'ampia finestra di contesto dei token
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questo modello funziona solo su CPU. Per eseguirlo su GPU, installa la versione generica del programma Ollama.

    Questa è un'app condivisa. Dopo l'installazione da parte di Olares Admin, tutti gli utenti del cluster possono utilizzarla tramite l'app di riferimento.

    **PANORAMICA DEL MODELLO**
    Nomic Embed è un nuovo modello di embedding testuale di Nomic AI che supporta sequenze lunghe 8192. Supera OpenAI Ada-002 e text-embedding-3-small nelle attività con contesto sia breve sia lungo.

    Novità entusiasmante!: nomic-embed-text-v1.5 ora è multimodale! nomic-embed-vision-v1.5 è allineato allo spazio di embedding di nomic-embed-text-v1.5, quindi ogni embedding testuale è multimodale!
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Immagine proxy Olares API aggiornata a beclab/harveyff-olares-ollama:v0.1.21.

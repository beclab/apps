metadata:
  title: Qwen3 Embedding 0.6B (Ollama)
  description: Qwen3 Embedding 0.6B-Modell für Suche, Retrieval und semantische Ähnlichkeit
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    
    **MODELLÜBERSICHT**
    Qwen3-Embedding ist ein Text-Embedding-Modell mit 0,6B Parametern aus der Qwen3-Familie von Alibaba. Es erzeugt hochwertige Vektorrepräsentationen für Suche, Retrieval, Klassifikation, Clustering und semantische Ähnlichkeit.
    
    Hauptfunktionen:
    
    Mehrsprachige Unterstützung: Auf einer breiten Sprachpalette trainiert für starke crosslinguale Embedding- und Retrieval-Leistung.
    
    Kompakt und effizient: Mit 0,6B Parametern ist das Modell leichtgewichtig und GPU-beschleunigt und liefert schnelle Inferenz bei geringem Ressourcenverbrauch.
    
    Hochwertige Embeddings: Erzeugt dichte Vektorrepräsentationen, die semantische Bedeutung effektiv für Downstream-Aufgaben wie RAG, Suche und Clustering erfassen.
    
    Matryoshka Representation: Unterstützt flexible Embedding-Dimensionen und erlaubt Abwägungen zwischen Leistung und Effizienz.
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

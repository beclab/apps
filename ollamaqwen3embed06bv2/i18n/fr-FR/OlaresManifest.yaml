metadata:
  title: Qwen3 Embedding 0.6B (Ollama)
  description: Modèle Qwen3 Embedding 0.6B pour la recherche, la récupération et la similarité sémantique
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    
    **APERÇU DU MODÈLE**
    Qwen3-Embedding est un modèle d'embeddings texte à 0,6B paramètres de la famille Qwen3 d'Alibaba. Il génère des représentations vectorielles de haute qualité pour la recherche, la récupération, la classification, le clustering et la similarité sémantique.
    
    Fonctionnalités clés :
    
    Support multilingue : Entraîné sur un large ensemble de langues pour de solides performances d'embedding et de récupération cross-linguales.
    
    Compact et efficace : Avec 0,6B paramètres, le modèle est léger et accéléré par GPU, offrant une inférence rapide avec une faible consommation de ressources.
    
    Embeddings de haute qualité : Produit des représentations vectorielles denses qui capturent efficacement le sens sémantique pour des tâches en aval comme RAG, recherche et clustering.
    
    Représentation Matryoshka : Prend en charge des dimensions d'embedding flexibles, permettant des compromis entre performance et efficacité.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé sous Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.
    
    Mise à jour de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

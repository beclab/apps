metadata:
  title: Qwen3 Embedding 0.6B (Ollama)
  description: Modelo Qwen3 Embedding 0.6B para búsqueda, recuperación y similitud semántica
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla a través de la aplicación de referencia.
    
    **RESUMEN DEL MODELO**
    Qwen3-Embedding es un modelo de embeddings de texto de 0,6B parámetros de la familia Qwen3 de Alibaba. Genera representaciones vectoriales de alta calidad para búsqueda, recuperación, clasificación, clustering y similitud semántica.
    
    Funciones clave:
    
    Soporte multilingüe: Entrenado en un amplio conjunto de idiomas para un sólido rendimiento de embedding y recuperación cross-lingual.
    
    Compacto y eficiente: Con 0,6B parámetros, el modelo es ligero y acelerado por GPU, ofreciendo inferencia rápida con bajo uso de recursos.
    
    Embeddings de alta calidad: Produce representaciones vectoriales densas que capturan el significado semántico de forma efectiva para tareas posteriores como RAG, búsqueda y clustering.
    
    Representación Matryoshka: Admite dimensiones de embedding flexibles, permitiendo equilibrios entre rendimiento y eficiencia.
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: Qwen3 Embedding 0.6B (Ollama)
  description: 検索・検索抽出・意味的類似度向け Qwen3 Embedding 0.6B モデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    
    **モデル概要**
    Qwen3-Embedding は Alibaba の Qwen3 ファミリーによる 0.6B パラメータのテキスト埋め込みモデルです。検索、検索抽出、分類、クラスタリング、意味的類似度向けに高品質なベクトル表現を生成します。
    
    主な機能:
    
    多言語対応: 幅広い言語で学習し、強いクロスリンガル埋め込み・検索性能を発揮。
    
    コンパクトで効率的: 0.6B パラメータで軽量かつ GPU 加速され、低リソースで高速推論。
    
    高品質な埋め込み: RAG、検索、クラスタリングなどの下流タスク向けに意味を効果的に捉える密なベクトル表現を生成。
    
    マトリョーシカ表現: 柔軟な埋め込み次元をサポートし、性能と効率のトレードオフが可能。
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。
    
    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。

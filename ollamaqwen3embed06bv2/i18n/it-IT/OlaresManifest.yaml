metadata:
  title: Qwen3 Embedding 0.6B (Ollama)
  description: Modello Qwen3 Embedding 0.6B per ricerca, retrieval e similarità semantica
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    
    **PANORAMICA DEL MODELLO**
    Qwen3-Embedding è un modello di embedding testuale da 0,6B parametri della famiglia Qwen3 di Alibaba. Genera rappresentazioni vettoriali di alta qualità per ricerca, retrieval, classificazione, clustering e similarità semantica.
    
    Funzioni chiave:
    
    Supporto multilingue: Addestrato su un'ampia gamma di lingue per solide prestazioni di embedding e retrieval cross-lingual.
    
    Compatto ed efficiente: Con 0,6B parametri il modello è leggero e accelerato da GPU, offrendo inferenza rapida con basso uso di risorse.
    
    Embedding di alta qualità: Produce rappresentazioni vettoriali dense che catturano efficacemente il significato semantico per compiti downstream come RAG, ricerca e clustering.
    
    Rappresentazione Matryoshka: Supporta dimensioni di embedding flessibili, consentendo compromessi tra prestazioni ed efficienza.
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Aggiornamento dell'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

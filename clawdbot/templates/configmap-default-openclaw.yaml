
# Default openclaw.json for first-time install only.
# Used by init-config: copied to app-data-config only when the file does not exist.
# Helm upgrades do not overwrite existing openclaw.json (init only copies when missing).
# Get the top domain from the app domain
{{- $appDomainENV := split "," .Values.domain.clawdbot -}}
{{- $appDomain := index $appDomainENV "_0" -}}
{{- $topDomain := regexReplaceAll ".*?([^.]+\\.[^.]+)$" $appDomain "$1" -}}
{{- $gatewayToken := randAlphaNum 32 -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clawdbot-default-openclaw
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: clawdbot
data:
  openclaw.json: |
    {
      "update": {
        "checkOnStart": false,
        "auto": {
          "enabled": false
        }
      },    
      "agents": {
        "defaults": {
          "workspace": "/home/node/.openclaw/workspace",
          "thinkingDefault": "off",
          "timeoutSeconds": 300,
          "maxConcurrent": 4,
          "subagents": {
            "maxConcurrent": 8
          },
          "sandbox": {
            "mode": "off",
            "backend": "docker",
            "scope": "agent",
            "workspaceAccess": "rw",
            "docker": {
              "image": "beclab/harveyff-openclaw-sandbox-common:2026.7.29",
              "network": "bridge",
              "user": "1000:1000"
            },
            "prune": {
              "idleHours": 24,
              "maxAgeDays": 7
            }
          }
        }
      },
      "messages": {
        "ackReactionScope": "group-mentions"
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto"
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "loopback",
        "controlUi": {
          "allowedOrigins": ["https://{{ $appDomain }}"],
          "dangerouslyDisableDeviceAuth": true
        },        
        "auth": {
          "mode": "token",
          "token": "{{ $gatewayToken }}",
          "trustedProxy": {
            "allowLoopback": true,
            "userHeader": "x-forwarded-user"
          }
        },
        "trustedProxies": [
          "10.233.0.0/16",
          "10.244.0.0/16",
          "10.42.0.0/16",
          "127.0.0.1",
          "::1"
        ],
        "tailscale": {
          "mode": "off",
          "resetOnExit": false
        }
      }
    }


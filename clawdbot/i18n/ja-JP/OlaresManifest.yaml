metadata:
  title: OpenClaw
  description: マルチチャネル受信箱対応のパーソナル AI アシスタント
spec:
  fullDescription: |
    **OpenClaw** は、自分のデバイス上で動かす _パーソナル AI アシスタント_ です。
    すでに使っているチャネルで応答します。macOS/iOS/Android で話したり聞いたりでき、あなたが制御するライブ Canvas も描画できます。Gateway はコントロールプレーンにすぎず — プロダクトはアシスタントです。

    ローカルで速く、常時オンに感じる個人向けシングルユーザーアシスタントが欲しいなら、これです。

    **Tips**
    Gateway Restart
    - コンテナ化デプロイでは `openclaw gateway restart` は動作しません。`restart-gateway` を使い、稼働中のゲートウェイを停止し、最新設定を取り込み、約 5 秒で復帰させてください。同じセンチネルはクラッシュ後の 30 秒バックオフも短縮します。

    対応チャネル: 
    WhatsApp、Telegram、Slack、Discord、Google Chat、Signal、iMessage、BlueBubbles、IRC、Microsoft Teams、Matrix、Feishu、LINE、Mattermost、Nextcloud Talk、Nostr、Synology Chat、Tlon、Twitch、Zalo、Zalo Personal、WeChat、QQ、WebChat。

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — セッション、チャネル、ツール、イベントの単一コントロールプレーン。
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp、Telegram、Slack、Discord、Google Chat、Signal、BlueBubbles（iMessage）、iMessage（legacy）、IRC、Microsoft Teams、Matrix、Feishu、LINE、Mattermost、Nextcloud Talk、Nostr、Synology Chat、Tlon、Twitch、Zalo、Zalo Personal、WeChat、QQ、WebChat、macOS、iOS/Android。
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — 受信チャネル／アカウント／ピアを隔離エージェント（ワークスペース＋エージェント別セッション）へルーティング。
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — macOS/iOS のウェイクワードと Android の連続音声（ElevenLabs + システム TTS フォールバック）。
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui) 付きのエージェント駆動ビジュアルワークスペース。
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser、canvas、nodes、cron、sessions、Discord/Slack アクション。
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — macOS メニューバーアプリ + iOS/Android [nodes](https://docs.openclaw.ai/nodes)。
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — 同梱／管理／ワークスペーススキルによるオンボーディング主導セットアップ。

  upgradeDescription: |
    起動時の所有者とアクセス権の再帰的な変更を廃止しました。指定したディレクトリのみを準備し、UID/GID 1000 でファイルを初期化して既存のアクセス権を維持します。Homebrew の更新は中断後の再試行と読み取り専用ファイルに対応します。既存の所有者の問題は別途明示的な修復が必要です。

    CLI と Gateway でプロセス名前空間を共有し、端末でのトークン取得と Doctor チェックの失敗を修正しました。Gateway の再起動中も復旧用端末を使用できます。

    Chart 1.0.54 で OpenClaw を 2026.10.5 に更新します。

    主な更新：Gateway 再起動後の中断した会話の復元を改善。セッション・履歴の SQLite 処理と Gateway のメモリ使用量を削減。ダウンロードしたモデルカタログを Gateway の再起動なしで適用し、更新時に llama.cpp ルーターモデルの現在のコンテキスト上限とツールを維持します。

    https://github.com/openclaw/openclaw/releases/tag/v2026.10.5

    Chart 1.0.53でOpenClawを2026.10.1に更新します。

    Claude Haiku 5.5への対応が追加され、既存のエージェントがローカルClawsに移行されます。Code Modeのstore/load値は、複数の応答やGatewayの再起動をまたいで保持されます。

    データベースやDoctorの処理中断からの復旧、別々のDocker CLIコンテナ間やコンテナ再作成後の状態所有権、セッションの継続性、プラグインの起動が改善されました。応答の配信、メディア再生、複数のモデルプロバイダー連携も修正されています。

    Olaresは引き続きアプリ起動前にイメージ内のDoctorを実行し、CLIとGatewayに同じイメージを使用します。Olaresマーケットから更新してください。

    更新前にアプリのデータをバックアップしてください。Doctorは永続状態を移行する場合があります。古いイメージをインストールするだけでは、移行を元に戻せません。

    リリースノート：https://github.com/openclaw/openclaw/releases/tag/v2026.10.1

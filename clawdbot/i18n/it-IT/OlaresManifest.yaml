metadata:
  title: OpenClaw
  description: Assistente AI personale con supporto inbox multicanale
spec:
  fullDescription: |
    **OpenClaw** è un _assistente AI personale_ che esegui sui tuoi dispositivi.
    Ti risponde sui canali che già usi. Può parlare e ascoltare su macOS/iOS/Android e può renderizzare un Canvas live che controlli. Il Gateway è solo il control plane — il prodotto è l’assistente.

    Se vuoi un assistente personale single-user che sembri locale, veloce e sempre attivo, è questo.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` NON funziona nei deployment containerizzati. Usa `restart-gateway` per abbattere il gateway in esecuzione, caricare la config più recente e tornare online in ~5 secondi. Lo stesso sentinel accorcia anche la finestra di backoff di 30 secondi post-crash.

    Canali supportati: 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — singolo control plane per sessioni, canali, tool ed eventi.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — instrada canali/account/peer in ingresso verso agent isolati (workspace + sessioni per agent).
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — wake word su macOS/iOS e voce continua su Android (ElevenLabs + fallback TTS di sistema).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — workspace visuale guidato dall’agent con [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser, canvas, nodes, cron, sessions e azioni Discord/Slack.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — app menu bar macOS + [nodes](https://docs.openclaw.ai/nodes) iOS/Android.
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — setup guidato dall’onboarding con skill bundled/managed/workspace.

  upgradeDescription: |
    Versione upstream: [OpenClaw v2026.8.2](https://github.com/openclaw/openclaw/releases/tag/v2026.8.2)

    **Modifica incompatibile:** Alcuni plugin installati potrebbero non essere compatibili con OpenClaw v2026.8.2 e impedire l’avvio del Gateway; aggiorna i plugin prima dell’upgrade.

    **Novità**
    - Apri l’agente Home accanto alla pagina corrente, controlla l’istantanea del contesto di lavoro e allega il testo selezionato senza cambiare pagina.
    - Avvia sessioni in background da New Session e aprile dalla notifica di completamento.
    - I messaggi inoltrati tra sessioni mostrano ora la sessione di origine e l’agente mittente. Anche le azioni di sessione e l’esportazione delle trascrizioni sono più accessibili.
    - Gli upgrade conservano le configurazioni valide più recenti, interrompono le migrazioni di sessione incomplete e ripristinano il Gateway in modo più sicuro dopo un aggiornamento non riuscito.
    - Le conversazioni basate su strumenti restituiscono ora una risposta finale o un errore visibile invece di fermarsi dopo l’output dello strumento.
    - Le risposte vocali non pronunciano più il ragionamento interno; la consegna audio e i turni Talk successivi nel browser sono più affidabili.
    - Control UI aggiunge i temi CRT, Manuscript, Rosé e Miami.

    **Correzioni**
    - Migliorati il ripristino e i report dei processi pianificati, la continuità delle conversazioni, il recupero delle bozze, l’affidabilità del browser e le prestazioni con cronologie lunghe.
    - Privacy e sicurezza rafforzate tramite una migliore oscurazione dei log, limiti alle risposte MCP, autorizzazioni dello spazio di lavoro più sicure e dipendenze aggiornate per la decodifica delle immagini.

    **Modifiche alla configurazione durante l’upgrade da 2026.7.x**
    - Le sessioni non in sandbox possono accedere per impostazione predefinita alle altre sessioni dello stesso agente. Le installazioni con agenti condivisi possono impostare `tools.sessions.visibility` su `tree` o `self` per limitare l’accesso.
    - OpenClaw v2026.8.2 legge le variabili `OPENCLAW_*` al posto dei nomi precedenti `CLAWDBOT_*` o `MOLTBOT_*`. Rinomina le variabili personalizzate in `~/.openclaw/.env`, ad esempio da `CLAWDBOT_GATEWAY_TOKEN` a `OPENCLAW_GATEWAY_TOKEN`.
    - Il plugin OpenProse e il comando `/prose` sono stati rimossi. Segui la [guida alla migrazione di OpenProse](https://docs.openclaw.ai/prose) se usi ancora file `.prose`.
    - I riferimenti ai modelli inclusi `codex/*` e `openai-codex/*` ora usano `openai/*`.

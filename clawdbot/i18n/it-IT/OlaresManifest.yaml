metadata:
  title: OpenClaw
  description: Assistente AI personale con supporto inbox multicanale
spec:
  fullDescription: |
    **OpenClaw** è un _assistente AI personale_ che esegui sui tuoi dispositivi.
    Ti risponde sui canali che già usi. Può parlare e ascoltare su macOS/iOS/Android e può renderizzare un Canvas live che controlli. Il Gateway è solo il control plane — il prodotto è l’assistente.

    Se vuoi un assistente personale single-user che sembri locale, veloce e sempre attivo, è questo.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` NON funziona nei deployment containerizzati. Usa `restart-gateway` per abbattere il gateway in esecuzione, caricare la config più recente e tornare online in ~5 secondi. Lo stesso sentinel accorcia anche la finestra di backoff di 30 secondi post-crash.

    Canali supportati: 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — singolo control plane per sessioni, canali, tool ed eventi.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — instrada canali/account/peer in ingresso verso agent isolati (workspace + sessioni per agent).
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — wake word su macOS/iOS e voce continua su Android (ElevenLabs + fallback TTS di sistema).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — workspace visuale guidato dall’agent con [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser, canvas, nodes, cron, sessions e azioni Discord/Slack.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — app menu bar macOS + [nodes](https://docs.openclaw.ai/nodes) iOS/Android.
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — setup guidato dall’onboarding con skill bundled/managed/workspace.

  upgradeDescription: |
    Aggiornamento di OpenClaw alla versione 2026.9.6.

    **Principali novità del progetto originale**
    - Migliorato il recupero delle conversazioni incomplete e delle attività in corso dopo il riavvio di Gateway o Node.js.
    - Ripristinati report completi sull’utilizzo degli ultimi 30 giorni, con selezione delle date, suddivisione per autore e totali che includono le sessioni oltre l’elenco visibile.
    - Nuovo lettore GitHub per consultare issue pubbliche, pull request, commit e differenze accanto alla chat. Gli elenchi espliciti dei plugin consentiti devono includere `github` per abilitare le anteprime.
    - Supporto per file, Memory e Skills negli spazi di lavoro dei nodi associati; Gateway e nodo devono usare la stessa versione di OpenClaw.
    - Accesso ai connettori MCP e configurazione e test della ricerca web nelle impostazioni.
    - Migliorata la reattività di Gateway e risolti problemi della chat mobile, incluso il blocco durante l’invio di foto su iOS.

    **Modifiche alla distribuzione Olares**

    Corretta l’inizializzazione dopo aggiornamenti e riavvii con lo schema 23 del database degli agenti. Gli schemi precedenti supportati vengono salvati prima della migrazione tramite il codice OpenClaw incluso.

    Le nuove installazioni ascoltano sulla LAN e usano l’URL dell’ingresso Gateway di Olares per i codici QR di associazione mobile. Mantieni attiva la VPN LarePass su Android e iOS, anche sulla stessa rete locale, quando ti connetti tramite l’ingresso Internal.

    La configurazione, i token, i dispositivi associati e le aree di lavoro esistenti vengono conservati. Per un’installazione esistente, genera un codice di associazione mobile con `openclaw qr --url wss://<gateway-entrance-domain>`, oppure configura `plugins.entries.device-pair.config.publicUrl` prima di eseguire `openclaw qr`.

    Note di rilascio: https://github.com/openclaw/openclaw/releases/tag/v2026.9.6

metadata:
  title: OpenClaw
  description: Asistente AI personal con soporte de bandeja multicanal
spec:
  fullDescription: |
    **OpenClaw** es un _asistente AI personal_ que ejecutas en tus propios dispositivos.
    Te responde en los canales que ya usas. Puede hablar y escuchar en macOS/iOS/Android, y puede renderizar un Canvas en vivo que controlas. El Gateway es solo el plano de control — el producto es el asistente.

    Si quieres un asistente personal de un solo usuario que se sienta local, rápido y siempre activo, este es.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` NO funciona en despliegues containerizados. Usa `restart-gateway` para derribar el gateway en ejecución, cargar la config más reciente y volver online en ~5 segundos. El mismo sentinel también acorta la ventana de backoff de 30 segundos tras un crash.

    Canales admitidos: 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — plano de control único para sesiones, canales, herramientas y eventos.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — enruta canales/cuentas/peers entrantes a agents aislados (workspaces + sesiones por agent).
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — palabras de activación en macOS/iOS y voz continua en Android (ElevenLabs + fallback TTS del sistema).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — workspace visual impulsado por el agent con [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser, canvas, nodes, cron, sessions y acciones Discord/Slack.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — app de barra de menú macOS + [nodes](https://docs.openclaw.ai/nodes) iOS/Android.
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — setup guiado por onboarding con skills empaquetados/gestionados/de workspace.

  upgradeDescription: |
    Versión upstream: [OpenClaw v2026.8.2](https://github.com/openclaw/openclaw/releases/tag/v2026.8.2)

    **Cambio incompatible:** Algunos plugins instalados pueden no ser compatibles con OpenClaw v2026.8.2 e impedir que se inicie el Gateway; actualiza los plugins antes de la actualización.

    **Novedades**
    - Abre el agente Home junto a la página actual, revisa su instantánea del contexto de trabajo y adjunta texto seleccionado sin cambiar de página.
    - Inicia sesiones en segundo plano desde New Session y ábrelas desde la notificación de finalización.
    - Los mensajes reenviados entre sesiones muestran ahora la sesión de origen y el agente remitente. También es más fácil acceder a las acciones de sesión y exportar transcripciones.
    - Las actualizaciones conservan configuraciones válidas más recientes, detienen migraciones de sesiones incompletas y recuperan el Gateway con mayor seguridad tras una actualización fallida.
    - Las conversaciones que usan herramientas devuelven una respuesta final o un error visible en lugar de detenerse tras la salida de una herramienta.
    - Las respuestas de voz ya no reproducen razonamiento interno, y la entrega de audio y los turnos posteriores de Talk en el navegador son más fiables.
    - Control UI incorpora los temas CRT, Manuscript, Rosé y Miami.

    **Correcciones**
    - Se han mejorado la recuperación y los informes de tareas programadas, la continuidad de las conversaciones, la recuperación de borradores, la fiabilidad del navegador y el rendimiento con historiales largos.
    - Se han reforzado la privacidad y la seguridad con una mejor ocultación de datos en registros, límites para respuestas MCP, permisos de espacio de trabajo más seguros y dependencias de decodificación de imágenes actualizadas.

    **Cambios de configuración al actualizar desde 2026.7.x**
    - Las sesiones sin entorno aislado pueden acceder por defecto a otras sesiones del mismo agente. Las instalaciones con agentes compartidos pueden establecer `tools.sessions.visibility` en `tree` o `self` para restringir el acceso.
    - OpenClaw v2026.8.2 lee variables `OPENCLAW_*` en lugar de los nombres antiguos `CLAWDBOT_*` o `MOLTBOT_*`. Cambia el nombre de las variables personalizadas en `~/.openclaw/.env`; por ejemplo, de `CLAWDBOT_GATEWAY_TOKEN` a `OPENCLAW_GATEWAY_TOKEN`.
    - Se han eliminado el plugin OpenProse y el comando `/prose`. Sigue la [guía de migración de OpenProse](https://docs.openclaw.ai/prose) si todavía utilizas archivos `.prose`.
    - Las referencias de modelos incluidas `codex/*` y `openai-codex/*` usan ahora `openai/*`.

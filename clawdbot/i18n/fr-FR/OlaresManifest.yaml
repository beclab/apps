metadata:
  title: OpenClaw
  description: Assistant AI personnel avec prise en charge d’une boîte de réception multicanal
spec:
  fullDescription: |
    **OpenClaw** est un _assistant AI personnel_ que vous exécutez sur vos propres appareils.
    Il vous répond sur les canaux que vous utilisez déjà. Il peut parler et écouter sur macOS/iOS/Android, et peut rendre un Canvas live que vous contrôlez. La Gateway n’est que le plan de contrôle — le produit est l’assistant.

    Si vous voulez un assistant personnel mono-utilisateur qui se sente local, rapide et toujours disponible, c’est celui-ci.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` NE fonctionne PAS dans les déploiements containerisés. Utilisez `restart-gateway` pour abattre la gateway en cours, prendre la dernière config et revenir en ligne en ~5 secondes. Le même sentinel raccourcit aussi la fenêtre de backoff de 30 secondes après un crash.

    Canaux pris en charge : 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — plan de contrôle unique pour sessions, canaux, outils et événements.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — route les canaux/comptes/peers entrants vers des agents isolés (workspaces + sessions par agent).
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — mots de réveil sur macOS/iOS et voix continue sur Android (ElevenLabs + repli TTS système).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — espace de travail visuel piloté par l’agent avec [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser, canvas, nodes, cron, sessions et actions Discord/Slack.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — app barre de menus macOS + [nodes](https://docs.openclaw.ai/nodes) iOS/Android.
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — setup guidé par l’onboarding avec skills bundlés/gérés/workspace.

  upgradeDescription: |
    Supprime les modifications récursives des propriétaires et des permissions au démarrage. Seuls les répertoires indiqués sont préparés, et les fichiers sont initialisés avec UID/GID 1000 sans modifier les permissions existantes. Les mises à jour Homebrew prennent en charge les reprises après interruption et les fichiers en lecture seule. Les problèmes de propriétaire existants nécessitent une réparation distincte.

    Corrige l’accès au jeton et les vérifications Doctor dans le terminal en partageant l’espace de noms des processus entre CLI et Gateway. Le terminal de récupération reste disponible pendant les redémarrages de Gateway.

    Le chart 1.0.54 met OpenClaw à jour vers 2026.10.5.

    Principales nouveautés : meilleure reprise des conversations interrompues après un redémarrage de Gateway ; réduction des opérations SQLite pour les sessions et leur historique et de la mémoire utilisée ; application des catalogues de modèles téléchargés sans redémarrer Gateway, avec conservation des limites de contexte et des outils actuels des modèles du routeur llama.cpp lors des actualisations.

    https://github.com/openclaw/openclaw/releases/tag/v2026.10.5

    Le chart 1.0.53 met OpenClaw à jour vers 2026.10.1.

    Cette version ajoute la prise en charge de Claude Haiku 5.5 et migre les agents existants vers des Claws locaux. Les valeurs store/load de Code Mode sont conservées entre les réponses et après les redémarrages du Gateway.

    Elle améliore la reprise des bases de données et de Doctor après interruption, la gestion de la propriété de l’état entre les conteneurs Docker CLI et après leur recréation, la continuité des sessions et le démarrage des plugins. Elle corrige aussi la remise des réponses, la lecture multimédia et plusieurs intégrations de fournisseurs de modèles.

    Olares continue d’exécuter Doctor depuis l’image avant le démarrage de l’application et utilise la même image pour la CLI et le Gateway. Effectuez les mises à jour via le Marché Olares.

    Sauvegardez les données de l’application avant la mise à jour. Doctor peut migrer l’état persistant ; installer une ancienne image ne suffit pas à annuler ces migrations.

    Notes de version : https://github.com/openclaw/openclaw/releases/tag/v2026.10.1

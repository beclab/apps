metadata:
  title: OpenClaw
  description: Assistant AI personnel avec prise en charge d’une boîte de réception multicanal
spec:
  fullDescription: |
    **OpenClaw** est un _assistant AI personnel_ que vous exécutez sur vos propres appareils.
    Il vous répond sur les canaux que vous utilisez déjà. Il peut parler et écouter sur macOS/iOS/Android, et peut rendre un Canvas live que vous contrôlez. La Gateway n’est que le plan de contrôle — le produit est l’assistant.

    Si vous voulez un assistant personnel mono-utilisateur qui se sente local, rapide et toujours disponible, c’est celui-ci.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` NE fonctionne PAS dans les déploiements containerisés. Utilisez `restart-gateway` pour abattre la gateway en cours, prendre la dernière config et revenir en ligne en ~5 secondes. Le même sentinel raccourcit aussi la fenêtre de backoff de 30 secondes après un crash.

    Canaux pris en charge : 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — plan de contrôle unique pour sessions, canaux, outils et événements.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — route les canaux/comptes/peers entrants vers des agents isolés (workspaces + sessions par agent).
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — mots de réveil sur macOS/iOS et voix continue sur Android (ElevenLabs + repli TTS système).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — espace de travail visuel piloté par l’agent avec [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser, canvas, nodes, cron, sessions et actions Discord/Slack.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — app barre de menus macOS + [nodes](https://docs.openclaw.ai/nodes) iOS/Android.
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — setup guidé par l’onboarding avec skills bundlés/gérés/workspace.

  upgradeDescription: |
    Version upstream : [OpenClaw v2026.8.2](https://github.com/openclaw/openclaw/releases/tag/v2026.8.2)

    **Changement incompatible :** Certains plugins installés peuvent ne pas être compatibles avec OpenClaw v2026.8.2 et empêcher le démarrage du Gateway ; mettez les plugins à jour avant la mise à niveau.

    **Nouveautés**
    - Ouvrez l’agent Home à côté de la page actuelle, examinez son instantané de contexte de travail et joignez le texte sélectionné sans changer de page.
    - Lancez des sessions en arrière-plan depuis New Session et ouvrez-les depuis la notification de fin.
    - Les messages transférés entre sessions indiquent désormais la session source et l’agent expéditeur. Les actions de session et l’export des transcriptions sont aussi plus accessibles.
    - Les mises à niveau conservent les configurations valides plus récentes, arrêtent les migrations de session incomplètes et récupèrent le Gateway plus sûrement après un échec de mise à jour.
    - Les conversations utilisant des outils renvoient maintenant une réponse finale ou une erreur visible au lieu de s’arrêter après la sortie de l’outil.
    - Les réponses vocales ne prononcent plus le raisonnement interne. La livraison audio et les tours Talk ultérieurs dans le navigateur sont plus fiables.
    - Control UI ajoute les thèmes CRT, Manuscript, Rosé et Miami.

    **Correctifs**
    - Amélioration de la récupération et des rapports des tâches planifiées, de la continuité des conversations, de la récupération des brouillons, de la fiabilité du navigateur et des performances des historiques longs.
    - Renforcement de la confidentialité et de la sécurité grâce à une meilleure occultation des journaux, à des réponses MCP limitées, à des autorisations d’espace de travail plus sûres et à des dépendances de décodage d’images mises à jour.

    **Modifications de configuration lors d’une mise à niveau depuis 2026.7.x**
    - Les sessions hors sandbox peuvent désormais accéder par défaut aux autres sessions du même agent. Les déploiements avec agent partagé peuvent définir `tools.sessions.visibility` sur `tree` ou `self` pour restreindre l’accès.
    - OpenClaw v2026.8.2 lit les variables `OPENCLAW_*` au lieu des anciens noms `CLAWDBOT_*` ou `MOLTBOT_*`. Renommez les variables personnalisées dans `~/.openclaw/.env`, par exemple `CLAWDBOT_GATEWAY_TOKEN` en `OPENCLAW_GATEWAY_TOKEN`.
    - Le plugin OpenProse et la commande `/prose` ont été supprimés. Suivez le [guide de migration OpenProse](https://docs.openclaw.ai/prose) si vous utilisez encore des fichiers `.prose`.
    - Les références de modèles fournies `codex/*` et `openai-codex/*` utilisent maintenant `openai/*`.

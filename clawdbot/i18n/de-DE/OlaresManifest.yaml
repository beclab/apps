metadata:
  title: OpenClaw
  description: Persönlicher AI-Assistent mit Multi-Channel-Inbox-Unterstützung
spec:
  fullDescription: |
    **OpenClaw** ist ein _persönlicher AI-Assistent_, den Sie auf Ihren eigenen Geräten betreiben.
    Er antwortet Ihnen auf den Kanälen, die Sie bereits nutzen. Er kann auf macOS/iOS/Android sprechen und zuhören und ein Live-Canvas rendern, das Sie steuern. Das Gateway ist nur die Control Plane — das Produkt ist der Assistent.

    Wenn Sie einen persönlichen Single-User-Assistenten wollen, der lokal, schnell und immer verfügbar wirkt — das ist er.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` funktioniert in containerisierten Deployments NICHT. Nutzen Sie `restart-gateway`, um das laufende Gateway herunterzufahren, die neueste Config zu laden und innerhalb von ~5 Sekunden wieder online zu sein. Derselbe Sentinel verkürzt auch das 30-Sekunden-Backoff-Fenster nach einem Crash.

    Unterstützte Kanäle: 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — einzelne Control Plane für Sessions, Kanäle, Tools und Events.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — eingehende Kanäle/Konten/Peers an isolierte Agents (Workspaces + Sessions pro Agent) routen.
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — Wake Words auf macOS/iOS und kontinuierliche Stimme auf Android (ElevenLabs + System-TTS-Fallback).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — agentengesteuerter visueller Workspace mit [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — Browser, Canvas, Nodes, Cron, Sessions und Discord-/Slack-Aktionen.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — macOS-Menüleisten-App + iOS/Android-[Nodes](https://docs.openclaw.ai/nodes).
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — Onboarding-gesteuertes Setup mit gebündelten/verwalteten/Workspace-Skills.

  upgradeDescription: |
    Upstream-Release: [OpenClaw v2026.8.2](https://github.com/openclaw/openclaw/releases/tag/v2026.8.2)

    **Inkompatible Änderung:** Einige installierte Plugins sind möglicherweise nicht mit OpenClaw v2026.8.2 kompatibel und können den Start des Gateways verhindern; aktualisieren Sie die Plugins vor dem Upgrade.

    **Neuerungen**
    - Der Home-Agent lässt sich neben der aktuellen Seite öffnen. Dort können Sie seinen Arbeitskontext prüfen und markierten Text anhängen, ohne die Seite zu wechseln.
    - Hintergrundsitzungen lassen sich über New Session starten und aus der Abschlussbenachrichtigung öffnen.
    - Weitergeleitete sitzungsübergreifende Nachrichten zeigen jetzt Quellsitzung und sendenden Agenten. Sitzungsaktionen und der Export von Transkripten sind leichter erreichbar.
    - Upgrades bewahren neuere gültige Konfigurationen, stoppen unvollständige Sitzungsmigrationen und stellen das Gateway nach fehlgeschlagenen Updates sicherer wieder her.
    - Toolgestützte Unterhaltungen liefern jetzt eine abschließende Antwort oder einen sichtbaren Fehler, statt nach der Toolausgabe zu enden.
    - Sprachantworten geben keine internen Gedankengänge mehr wieder. Audioübertragung und spätere Browser-Talk-Runden sind zuverlässiger.
    - Die Control UI erhält die Designs CRT, Manuscript, Rosé und Miami.

    **Fehlerbehebungen**
    - Verbesserte Wiederherstellung und Berichterstattung geplanter Aufträge, Unterhaltungskontinuität, Entwurfswiederherstellung, Browserzuverlässigkeit und Leistung bei langen Verläufen.
    - Verbesserter Datenschutz und mehr Sicherheit durch bessere Protokollschwärzung, begrenzte MCP-Antworten, sicherere Workspace-Berechtigungen und aktualisierte Abhängigkeiten zur Bilddekodierung.

    **Konfigurationsänderungen beim Upgrade von 2026.7.x**
    - Sitzungen ohne Sandbox können standardmäßig auf andere Sitzungen desselben Agenten zugreifen. Bei gemeinsam genutzten Agenten kann `tools.sessions.visibility` für engeren Zugriff auf `tree` oder `self` gesetzt werden.
    - OpenClaw v2026.8.2 liest `OPENCLAW_*` statt der alten Namen `CLAWDBOT_*` oder `MOLTBOT_*`. Benennen Sie eigene Variablen in `~/.openclaw/.env` um, zum Beispiel `CLAWDBOT_GATEWAY_TOKEN` in `OPENCLAW_GATEWAY_TOKEN`.
    - Das OpenProse-Plugin und der Befehl `/prose` wurden entfernt. Wenn Sie noch `.prose`-Dateien verwenden, folgen Sie der [OpenProse-Migrationsanleitung](https://docs.openclaw.ai/prose).
    - Mitgelieferte Modellreferenzen `codex/*` und `openai-codex/*` verwenden jetzt `openai/*`.

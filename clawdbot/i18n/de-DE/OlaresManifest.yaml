metadata:
  title: OpenClaw
  description: Persönlicher AI-Assistent mit Multi-Channel-Inbox-Unterstützung
spec:
  fullDescription: |
    **OpenClaw** ist ein _persönlicher AI-Assistent_, den Sie auf Ihren eigenen Geräten betreiben.
    Er antwortet Ihnen auf den Kanälen, die Sie bereits nutzen. Er kann auf macOS/iOS/Android sprechen und zuhören und ein Live-Canvas rendern, das Sie steuern. Das Gateway ist nur die Control Plane — das Produkt ist der Assistent.

    Wenn Sie einen persönlichen Single-User-Assistenten wollen, der lokal, schnell und immer verfügbar wirkt — das ist er.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` funktioniert in containerisierten Deployments NICHT. Nutzen Sie `restart-gateway`, um das laufende Gateway herunterzufahren, die neueste Config zu laden und innerhalb von ~5 Sekunden wieder online zu sein. Derselbe Sentinel verkürzt auch das 30-Sekunden-Backoff-Fenster nach einem Crash.

    Unterstützte Kanäle: 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — einzelne Control Plane für Sessions, Kanäle, Tools und Events.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — eingehende Kanäle/Konten/Peers an isolierte Agents (Workspaces + Sessions pro Agent) routen.
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — Wake Words auf macOS/iOS und kontinuierliche Stimme auf Android (ElevenLabs + System-TTS-Fallback).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — agentengesteuerter visueller Workspace mit [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — Browser, Canvas, Nodes, Cron, Sessions und Discord-/Slack-Aktionen.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — macOS-Menüleisten-App + iOS/Android-[Nodes](https://docs.openclaw.ai/nodes).
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — Onboarding-gesteuertes Setup mit gebündelten/verwalteten/Workspace-Skills.

  upgradeDescription: |
    OpenClaw auf 2026.9.5 aktualisiert.

    **Wichtige Upstream-Änderungen**
    - Unterstützte Plugins lassen sich ohne Neustart des Gateway installieren und neu laden.
    - Gespräche können geteilt und inaktive Verläufe optional archiviert werden. Beim erneuten Öffnen wird der Verlauf wiederhergestellt.
    - Geführte Einrichtung spezialisierter Agenten und kleiner Teams in der Control UI hinzugefügt.
    - Hinweise zur Gerätekopplung und die erneute Browserverbindung nach Freigabe durch einen Administrator verbessert.

    Olares sichert bestehende Agentendatenbanken und migriert Schema v19/v20 vor dem Start auf v21. Konfiguration und Arbeitsbereiche bleiben erhalten. Vor dem Upgrade eine vollständige Sicherung anlegen.

    Release notes: https://github.com/openclaw/openclaw/releases/tag/v2026.9.5

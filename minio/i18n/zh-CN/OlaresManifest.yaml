metadata:
  description: 高性能、兼容 S3 的对象存储解决方案
  title: MinIO

spec:
  upgradeDescription: |
    MinIO 社区版源码仓库已归档。由于 Docker Hub 上的 minio/minio 镜像已无法公开拉取，Olares 改用此前转存的 beclab/minio-minio 镜像，MinIO 版本保持不变。
  fullDescription: |
    MinIO 是一款高性能、兼容 S3 的对象存储解决方案，采用 GNU AGPL v3.0 许可证发布。它专为速度和可扩展性而设计，以业界领先的性能为 AI/ML、分析和数据密集型工作负载提供支持。
    - 兼容 S3 API – 与现有 S3 工具无缝集成
    - 专为 AI 和分析打造 – 针对大规模数据管道进行了优化
    - 高性能 – 非常适合要求苛刻的存储工作负载。

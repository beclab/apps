# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   wisev3    — Wise frontend nginx Deployment (== appid / Release.Name; the
#               primary workload MUST be named after the release/appid)
#   knowledge — knowledge backend Deployment (knowledge + vectorcrawl +
#               camoufox + nginx, 4 containers)
workloads:
  wisev3:
    replicaCount: 1
  knowledge:
    replicaCount: 1

metadata:
  title: Wise
  description: Ihr digitaler geheimer Garten
spec:
  fullDescription: |
    Wise ist ein lokal-first Reader, der Artikel, Videos, Audio und Feeds
    in einer Bibliothek auf Olares sammelt. Damit speichern Sie Seiten, laden
    Dateien hoch, abonnieren Quellen und ordnen Ihre Lektüre.

    **Funktionen**

    - Websites, Blogs, Podcasts und Videokanäle per RSS abonnieren.
    - Webseiten mit der LarePass-Browsererweiterung oder der LarePass-Mobile-App speichern.
    - PDF-, EPUB-, Audio-, Video- und andere Dokumente in die Bibliothek hochladen.
    - Einträge mit Inbox, Read Later, Tags, Notizen und gefilterten Ansichten organisieren.
    - PDF-, Webartikel- und EPUB-Einträge über die Olares-Suche finden.
    - Eine vorhandene Feedliste aus einer OPML-Datei importieren.

    **Für Olares-Nutzer**

    Dies ist eine geteilte App. Ein Admin installiert sie einmal für das gesamte System.
    Jeder Nutzer erhält weiterhin einen Wise-Eingang. Alle Eingänge öffnen dieselbe
    geteilte Instanz.

    Einige Funktionen benötigen zusätzliche Market-Apps. Nutzen Sie RSS Subscribe
    für Feeds im Browser, YT-DLP für Mediendownloads und das Twitter/X-Plugin für Beiträge.

    Seiten mit Login können Cookies benötigen.

    Zu Einrichtung und Alltag siehe die [Wise-Dokumentation](https://docs.olares.com/manual/olares/wise/).

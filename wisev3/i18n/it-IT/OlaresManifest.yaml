metadata:
  title: Wise
  description: Il tuo giardino segreto digitale
spec:
  fullDescription: |
    Wise è un reader local-first che raccoglie articoli, video, audio e
    feed in un'unica libreria su Olares. Serve a salvare pagine, caricare
    file, seguire fonti e organizzare le letture.

    **Funzionalità principali**

    - Iscriviti a siti, blog, podcast e canali video tramite RSS.
    - Salva pagine web con l'estensione browser LarePass o l'app mobile LarePass.
    - Carica PDF, EPUB, audio, video e altri documenti nella libreria.
    - Organizza gli elementi con Inbox, Read Later, tag, note e viste filtrate.
    - Cerca PDF, articoli web e file EPUB con la ricerca Olares.
    - Importa un elenco di feed esistente da un file OPML.

    **Per gli utenti Olares**

    Questa è un'app condivisa. Un Admin la installa una sola volta per l'intero sistema.
    Ogni utente ottiene comunque un ingresso Wise. Tutti gli ingressi aprono la stessa
    istanza condivisa.

    Alcune funzioni richiedono altre app del Market. Usa RSS Subscribe
    per i feed nel browser, YT-DLP per i download multimediali e il plugin Twitter/X per i post.

    Le pagine protette da accesso possono richiedere cookie.

    Per l'installazione e l'uso quotidiano, consulta la [documentazione Wise](https://docs.olares.com/manual/olares/wise/).

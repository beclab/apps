metadata:
  title: Wise
  description: Tu jardín secreto digital
spec:
  fullDescription: |
    Wise es un lector local-first que reúne artículos, vídeos, audio y
    feeds en una sola biblioteca en Olares. Sirve para guardar páginas,
    subir archivos, seguir fuentes y organizar lo que quieres leer.

    **Funciones principales**

    - Suscribirse a sitios web, blogs, pódcast y canales de vídeo mediante RSS.
    - Guardar páginas web con la extensión de navegador LarePass o la app móvil LarePass.
    - Subir documentos PDF, EPUB, audio, vídeo y otros archivos a la biblioteca.
    - Organizar elementos con Inbox, Read Later, etiquetas, notas y vistas filtradas.
    - Buscar PDF, artículos web y archivos EPUB con la búsqueda de Olares.
    - Importar una lista de feeds existente desde un archivo OPML.

    **Para usuarios de Olares**

    Esta es una aplicación compartida. Un Admin la instala una sola vez para todo el sistema.
    Cada usuario sigue teniendo una entrada de Wise. Todas las entradas abren la misma
    instancia compartida.

    Algunas funciones necesitan aplicaciones adicionales de Market. Use RSS Subscribe
    para feeds en el navegador, YT-DLP para descargas de medios y el complemento Twitter/X para publicaciones.

    Las páginas con inicio de sesión pueden necesitar cookies.

    Para la configuración y el uso diario, consulte la [documentación de Wise](https://docs.olares.com/manual/olares/wise/).

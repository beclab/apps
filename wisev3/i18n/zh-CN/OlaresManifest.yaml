metadata:
  title: Wise
  description: 您的数字后花园
spec:
  fullDescription: |
    Wise 是一款本地优先的阅读器，可在 Olares 上将文章、视频、音频和订阅源汇入同一个资料库。用于保存网页、上传文件、订阅来源，并整理待读内容。

    **主要功能**

    - 通过 RSS 订阅网站、博客、播客和视频频道。
    - 使用 LarePass 浏览器扩展或 LarePass 移动应用保存网页。
    - 将 PDF、EPUB、音频、视频及其他文档上传到资料库。
    - 使用 Inbox、Read Later、标签、笔记和筛选视图整理条目。
    - 通过 Olares 搜索查找 PDF、网页文章和 EPUB 条目。
    - 从 OPML 文件导入已有的订阅列表。

    **Olares 用户说明**

    这是共享应用。由管理员在整个系统中安装一次。
    每位用户仍会获得 Wise 入口。所有入口都打开同一个共享实例。

    部分功能需要额外的 Market 应用。浏览器内订阅使用 RSS Subscribe，媒体下载使用 YT-DLP，帖子采集使用 Twitter/X 插件。

    需要登录才能访问的页面可能要用到 cookies。

    安装与日常使用请参阅 [Wise 文档](https://docs.olares.com/manual/olares/wise/)。

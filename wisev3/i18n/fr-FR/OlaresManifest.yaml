metadata:
  title: Wise
  description: Votre jardin secret numérique
spec:
  fullDescription: |
    Wise est un lecteur local-first qui rassemble articles, vidéos, audio et
    flux dans une seule bibliothèque sur Olares. Utilisez-le pour enregistrer
    des pages, importer des fichiers, suivre des sources et organiser vos lectures.

    **Fonctionnalités principales**

    - S'abonner à des sites, blogs, podcasts et chaînes vidéo via RSS.
    - Enregistrer des pages web avec l'extension navigateur LarePass ou l'application mobile LarePass.
    - Importer des documents PDF, EPUB, audio, vidéo et d'autres fichiers dans la bibliothèque.
    - Organiser les éléments avec Inbox, Read Later, des tags, des notes et des vues filtrées.
    - Rechercher des PDF, articles web et fichiers EPUB via la recherche Olares.
    - Importer une liste de flux existante depuis un fichier OPML.

    **Pour les utilisateurs Olares**

    Il s'agit d'une application partagée. Un Admin l'installe une seule fois pour tout le système.
    Chaque utilisateur dispose toujours d'une entrée Wise. Toutes les entrées ouvrent la même
    instance partagée.

    Certaines fonctions nécessitent des applications Market supplémentaires. Utilisez RSS Subscribe
    pour les flux dans le navigateur, YT-DLP pour les téléchargements média, et le plugin Twitter/X pour les publications.

    Les pages protégées par connexion peuvent nécessiter des cookies.

    Pour l'installation et l'usage quotidien, voir la [documentation Wise](https://docs.olares.com/manual/olares/wise/).

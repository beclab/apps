metadata:
  title: Wise
  description: Your Digital Secret Garden
spec:
  fullDescription: |
    Wise is a local-first reader that collects articles, videos, audio, and
    feeds into one library on Olares. Use it to save pages, upload files,
    subscribe to sources, and organize what you want to read.

    **Key features**

    - Subscribe to websites, blogs, podcasts, and video channels through RSS.
    - Save web pages with the LarePass browser extension or the LarePass mobile app.
    - Upload PDF, EPUB, audio, video, and other documents into the library.
    - Organize items with Inbox, Read Later, tags, notes, and filtered views.
    - Search PDF, web article, and EPUB items through Olares search.
    - Import an existing feed list from an OPML file.

    **For Olares users**

    This is a shared app. An Admin installs it once for the whole system.
    Every user still gets a Wise entrance. All entrances open the same
    shared instance.

    Some features need extra Market apps. Use RSS Subscribe for in-browser
    feeds, YT-DLP for media downloads, and the Twitter/X plugin for posts.

    Login-restricted pages may need cookies.

    For setup and daily use, see the [Wise documentation](https://docs.olares.com/manual/olares/wise/).

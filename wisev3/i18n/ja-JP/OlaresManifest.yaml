metadata:
  title: Wise
  description: あなたのデジタルな秘密の庭
spec:
  fullDescription: |
    Wiseは、記事、動画、音声、フィードをOlares上の1つのライブラリに集めるローカルファーストのリーダーです。ページの保存、ファイルのアップロード、ソースの購読、読みたい内容の整理に使います。

    **主な機能**

    - RSSでウェブサイト、ブログ、ポッドキャスト、動画チャンネルを購読する。
    - LarePassブラウザ拡張またはLarePassモバイルアプリでウェブページを保存する。
    - PDF、EPUB、音声、動画、その他の文書をライブラリにアップロードする。
    - Inbox、Read Later、タグ、ノート、フィルタビューで項目を整理する。
    - Olares検索でPDF、ウェブ記事、EPUB項目を探す。
    - OPMLファイルから既存のフィードリストをインポートする。

    **Olaresユーザー向け**

    これは共有アプリです。Adminがシステム全体に一度だけインストールします。
    各ユーザーには引き続きWiseの入口があります。すべての入口は同じ共有インスタンスを開きます。

    一部の機能には追加のMarketアプリが必要です。ブラウザ内フィードにはRSS Subscribe、メディアダウンロードにはYT-DLP、投稿にはTwitter/Xプラグインを使います。

    ログイン制限のあるページではcookiesが必要な場合があります。

    セットアップと日常の使い方は[Wiseドキュメント](https://docs.olares.com/manual/olares/wise/)を参照してください。

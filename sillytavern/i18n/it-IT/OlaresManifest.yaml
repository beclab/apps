metadata:
  title: SillyTavern
  description: Frontend LLM per power user
spec:
  fullDescription: |
    SillyTavern è un'interfaccia utente installata localmente che ti consente di interagire con LLM di generazione testo, motori di generazione immagini e modelli vocali TTS.
    
    Nato nel febbraio 2023 come fork di TavernAI 1.2.8, SillyTavern conta ora oltre 200 contributor e 2 anni di sviluppo indipendente, e continua a essere un software di riferimento per gli appassionati di IA esperti.
    
    **Funzioni principali**
    - Impostazioni avanzate di generazione testo con molti preset della community
    - Supporto World Info: crea lore ricche o risparmia token sulla character card
    - Chat di gruppo: stanze multi-bot in cui i personaggi parlano con te e/o tra loro
    - Ampie opzioni di personalizzazione UI: colori tema, immagini di sfondo, CSS personalizzato e altro
    - User personas: fai sapere all'IA qualcosa di te per maggiore immersione
    - Supporto RAG integrato: aggiungi documenti alle chat affinché l'IA li consulti
    - Ampio sottosistema di comandi chat e motore di scripting proprietario
    
    **SillyTavern supporta l'estensibilità.**
    - Espressioni emotive dei personaggi (sprite)
    - Auto-riepilogo della cronologia chat
    - Traduzione automatica di UI e chat
    - Generazione immagini Stable Diffusion/FLUX/DALL-E
    - Text-to-speech per i messaggi di risposta dell'IA
    - Capacità di ricerca web per aggiungere contesto reale ai prompt
    - Molte altre disponibili dal menu "Download Extensions & Assets".
  upgradeDescription: |
    Rilascio upstream: [SillyTavern 1.18.0](https://github.com/SillyTavern/SillyTavern/releases/tag/1.18.0)

    **Novità**

    - Sorgenti di chat-completion Cloudflare Workers AI e MiniMax, e supporto modelli più ampio tra cui DeepSeek v4, GPT 5.4/5.5, Gemma 4 e Claude Opus 4.7.
    - Rate limiting sull'autenticazione basic, una whitelist opzionale di indirizzi privati contro SSRF e una whitelist IP per i proxy SSO attendibili.
    - L'installazione di estensioni di terze parti chiede conferma. L'elenco assets raggruppa estensioni ufficiali e della community.

    **Correzioni**

    - Modifica del testo in Firefox su mobile, filtri dell'elenco personaggi all'avvio e un crash del server su messaggi cache-control vuoti.


metadata:
  title: Claude Code
  description: La CLI di coding agentica ufficiale di Anthropic che vive nel tuo terminale
spec:
  fullDescription: |
    **Panoramica**
    Claude Code è lo strumento di coding agentico ufficiale di Anthropic che vive nel tuo terminale. Comprende la tua codebase, esegue attività di routine tramite linguaggio naturale e ti aiuta ad andare veloce restando nel flusso.

    **Funzionalità principali**
    - TUI nativa da terminale con output degli strumenti in streaming, slash command, interrupt-and-redirect e ricca revisione dei diff.
    - Modifiche reali ai file, esecuzione shell, workflow git ed esecuzione test guidati dal linguaggio naturale.
    - Skills, Subagents e chiamate a tool compatibili con MCP.
    - Funziona con abbonamento Claude Pro/Max (OAuth) o una Console API key; supporta anche Amazon Bedrock e Google Vertex AI.
    - L'immagine workspace include runtime e toolchain comuni (Python, Node.js, Go, Rust, OpenJDK 21, Ruby, PHP, Lua) più client database (PostgreSQL, MySQL/MariaDB, Redis), git-lfs, compilatore protobuf, Gradle, tmux, dig/ss/nc, shellcheck, clang-format/tidy, graphviz e header -dev aggiuntivi (libpq, client MySQL, curl, ICU, LDAP) così gli agenti possono eseguire comandi di sviluppo tipici senza root.
    - DinD opzionale (`ENABLE_DIND`, attivo di default): `docker` / `docker compose` nel terminale (sidecar privilegiato).
    - `certbot` (Let's Encrypt) preinstallato nell'immagine; l'init prepara `cli.ini` e un wrapper `~/.local/bin/certbot` per uid 1000 (pattern opencode / clawdbot).

    **Configurazione iniziale**
    Apri l'ingresso `Claude Code CLI` ed esegui `claude` per avviare il login OAuth, oppure imposta `ANTHROPIC_API_KEY` nelle variabili d'ambiente dell'app e riavvia.

    **Usare un modello locale (Ollama / gateway compatibile Anthropic)**
    Per indirizzare Claude Code a un Ollama locale (o qualsiasi proxy `/v1/messages` compatibile Anthropic) nel tuo cluster Olares, configura queste variabili d'ambiente nelle impostazioni dell'app — senza `export`/`unset` manuale a ogni sessione:

    - `ANTHROPIC_BASE_URL` = `http://<your-shared-domain>` (es. l'ingresso condiviso di un'app Ollama Olares)
    - `ANTHROPIC_AUTH_TOKEN` = `ollama`
    - `ANTHROPIC_API_KEY` = (lasciare vuoto)
    - `ANTHROPIC_MODEL` = `qwen3-coder:30b` (o il modello esposto da quel gateway)
    - `CLAUDE_CODE_USE_BEDROCK` / `CLAUDE_CODE_USE_VERTEX` / `CLAUDE_CODE_USE_FOUNDRY` = false

    Queste variabili sono iniettate in modo condizionale: stringhe vuote e toggle `false` *non* vengono messe nell'env del container, così Claude Code le vede davvero unset (necessario — tratta `CLAUDE_CODE_USE_*` per presenza, non per valore).
  upgradeDescription: |
    Aggiorna Olares CLI a 1.12.7-cli.10 ed esporta offline le competenze integrate.
    Aggiorna PHP 8.3 CLI e le estensioni alla revisione di sicurezza Ubuntu 8.3.6-0ubuntu0.24.04.13 e Composer a 2.10.3.
    Crea un nuovo backup privato per questa revisione del Chart; conserva i backup precedenti, le competenze personalizzate e i permessi.

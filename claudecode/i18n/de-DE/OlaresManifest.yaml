metadata:
  title: Claude Code
  description: Anthropics offizielles agentisches Coding-CLI, das in Ihrem Terminal lebt
spec:
  fullDescription: |
    **Übersicht**
    Claude Code ist Anthropics offizielles agentisches Coding-Tool, das in Ihrem Terminal lebt. Es versteht Ihre Codebasis, führt Routineaufgaben über natürliche Sprache aus und hilft Ihnen, schnell voranzukommen, ohne den Flow zu verlassen.

    **Hauptfunktionen**
    - Terminal-native TUI mit Streaming-Tool-Ausgabe, Slash-Befehlen, Interrupt-and-Redirect und reichhaltiger Diff-Ansicht.
    - Echte Dateibearbeitungen, Shell-Ausführung, Git-Workflows und Testläufe gesteuert durch natürliche Sprache.
    - Skills, Subagents und MCP-kompatible Tool-Aufrufe.
    - Funktioniert mit Claude Pro/Max-Abo (OAuth) oder einem Console-API-Schlüssel; unterstützt auch Amazon Bedrock und Google Vertex AI.
    - Workspace-Image enthält gängige Sprachlaufzeiten und Build-Toolchains (Python, Node.js, Go, Rust, OpenJDK 21, Ruby, PHP, Lua) sowie Datenbank-Clients (PostgreSQL, MySQL/MariaDB, Redis), git-lfs, Protobuf-Compiler, Gradle, tmux, dig/ss/nc, shellcheck, clang-format/tidy, graphviz und zusätzliche -dev-Header (libpq, MySQL-Client, curl, ICU, LDAP), damit Agenten typische Dev-Befehle ohne Root ausführen können.
    - Optionales DinD (`ENABLE_DIND`, standardmäßig an): `docker` / `docker compose` im Terminal (privilegierter Sidecar).
    - `certbot` (Let's Encrypt) ist im Image vorinstalliert; Init setzt `cli.ini` und einen `~/.local/bin/certbot`-Wrapper für uid 1000 (opencode-/clawdbot-Muster).

    **Ersteinrichtung**
    Öffnen Sie den Eingang `Claude Code CLI` und führen Sie `claude` aus, um den OAuth-Login zu starten, oder setzen Sie `ANTHROPIC_API_KEY` in den App-Umgebungsvariablen und starten Sie neu.

    **Lokales Modell nutzen (Ollama / Anthropic-kompatibles Gateway)**
    Um Claude Code an ein lokales Ollama (oder einen Anthropic-kompatiblen `/v1/messages`-Proxy) in Ihrem Olares-Cluster zu richten, konfigurieren Sie diese Env-Variablen in den App-Einstellungen — kein manuelles `export`/`unset` pro Sitzung nötig:

    - `ANTHROPIC_BASE_URL` = `http://<your-shared-domain>` (z. B. der gemeinsame Eingang einer Ollama-Olares-App)
    - `ANTHROPIC_AUTH_TOKEN` = `ollama`
    - `ANTHROPIC_API_KEY` = (leer lassen)
    - `ANTHROPIC_MODEL` = `qwen3-coder:30b` (oder welches Modell dieses Gateway bereitstellt)
    - `CLAUDE_CODE_USE_BEDROCK` / `CLAUDE_CODE_USE_VERTEX` / `CLAUDE_CODE_USE_FOUNDRY` = false

    Diese Variablen werden bedingt injiziert: leere Strings und `false`-Schalter werden *nicht* in die Container-Env geschrieben, sodass Claude Code sie als wirklich unset sieht (erforderlich — es behandelt `CLAUDE_CODE_USE_*` nach Vorhandensein, nicht nach Wert).
  upgradeDescription: |
    Olares CLI auf 1.12.7-cli.10 aktualisieren und die eingebetteten Skills offline exportieren.
    PHP 8.3 CLI und Erweiterungen auf die Ubuntu-Sicherheitsrevision 8.3.6-0ubuntu0.24.04.13 und Composer auf 2.10.3 aktualisieren.
    Für diese Chart-Revision ein neues privates Workspace-Backup erstellen; ältere Backups, angepasste Skills und Dateirechte beibehalten.

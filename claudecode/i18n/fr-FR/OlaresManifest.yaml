metadata:
  title: Claude Code
  description: La CLI de coding agentique officielle d'Anthropic qui vit dans votre terminal
spec:
  fullDescription: |
    **Aperçu**
    Claude Code est l'outil de coding agentique officiel d'Anthropic qui vit dans votre terminal. Il comprend votre base de code, exécute des tâches de routine via le langage naturel et vous aide à avancer rapidement tout en restant dans le flux.

    **Fonctionnalités clés**
    - TUI native au terminal avec sortie d'outils en streaming, commandes slash, interrupt-and-redirect et revue riche des diffs.
    - Édition réelle de fichiers, exécution shell, workflows git et exécution de tests pilotés par le langage naturel.
    - Skills, Subagents et appels d'outils compatibles MCP.
    - Fonctionne avec un abonnement Claude Pro/Max (OAuth) ou une clé API Console ; prend aussi en charge Amazon Bedrock et Google Vertex AI.
    - L'image workspace inclut des runtimes et toolchains courants (Python, Node.js, Go, Rust, OpenJDK 21, Ruby, PHP, Lua) plus des clients de base de données (PostgreSQL, MySQL/MariaDB, Redis), git-lfs, compilateur protobuf, Gradle, tmux, dig/ss/nc, shellcheck, clang-format/tidy, graphviz et en-têtes -dev supplémentaires (libpq, client MySQL, curl, ICU, LDAP) pour que les agents exécutent des commandes de développement typiques sans root.
    - DinD optionnel (`ENABLE_DIND`, activé par défaut) : `docker` / `docker compose` dans le terminal (sidecar privilégié).
    - `certbot` (Let's Encrypt) préinstallé dans l'image ; l'init prépare `cli.ini` et un wrapper `~/.local/bin/certbot` pour uid 1000 (motif opencode / clawdbot).

    **Configuration initiale**
    Ouvrez l'entrée `Claude Code CLI` et exécutez `claude` pour lancer le flux de connexion OAuth, ou définissez `ANTHROPIC_API_KEY` dans les variables d'environnement de l'application et redémarrez.

    **Utiliser un modèle local (Ollama / passerelle compatible Anthropic)**
    Pour diriger Claude Code vers un Ollama local (ou tout proxy `/v1/messages` compatible Anthropic) déployé dans votre cluster Olares, configurez ces variables d'environnement dans les paramètres de l'application — pas de `export`/`unset` manuel à chaque session :

    - `ANTHROPIC_BASE_URL` = `http://<your-shared-domain>` (ex. l'entrée partagée d'une app Ollama Olares)
    - `ANTHROPIC_AUTH_TOKEN` = `ollama`
    - `ANTHROPIC_API_KEY` = (laisser vide)
    - `ANTHROPIC_MODEL` = `qwen3-coder:30b` (ou le modèle exposé par cette passerelle)
    - `CLAUDE_CODE_USE_BEDROCK` / `CLAUDE_CODE_USE_VERTEX` / `CLAUDE_CODE_USE_FOUNDRY` = false

    Ces variables sont injectées conditionnellement : les chaînes vides et les bascules `false` ne sont *pas* placées dans l'env du conteneur, afin que Claude Code les voie vraiment unset (requis — il traite `CLAUDE_CODE_USE_*` par présence, pas par valeur).
  upgradeDescription: |
    Met à jour Olares CLI vers 1.12.7-cli.10 et exporte hors ligne ses compétences intégrées.
    Met à jour PHP 8.3 CLI et ses extensions vers la révision de sécurité Ubuntu 8.3.6-0ubuntu0.24.04.13, et Composer vers 2.10.3.
    Crée une nouvelle sauvegarde privée pour cette révision du Chart ; conserve les anciennes sauvegardes, les compétences personnalisées et les permissions.

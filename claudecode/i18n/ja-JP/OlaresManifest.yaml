metadata:
  title: Claude Code
  description: ターミナルで動作する Anthropic 公式のエージェント型コーディング CLI
spec:
  fullDescription: |
    **概要**
    Claude Code はターミナルで動作する Anthropic 公式のエージェント型コーディングツールです。コードベースを理解し、自然言語で定型作業を実行し、フローを保ったまま高速に進められるよう支援します。

    **主な機能**
    - ストリーミングツール出力、スラッシュコマンド、割り込み＆リダイレクト、豊富な diff レビューを備えたターミナルネイティブ TUI。
    - 自然言語による実ファイル編集、シェル実行、git ワークフロー、テスト実行。
    - Skills、Subagents、MCP 互換ツール呼び出し。
    - Claude Pro/Max サブスクリプション（OAuth）または Console API キーで動作；Amazon Bedrock と Google Vertex AI もサポート。
    - ワークスペースイメージには一般的な言語ランタイムとビルドツールチェーン（Python、Node.js、Go、Rust、OpenJDK 21、Ruby、PHP、Lua）に加え、データベースクライアント（PostgreSQL、MySQL/MariaDB、Redis）、git-lfs、protobuf コンパイラ、Gradle、tmux、dig/ss/nc、shellcheck、clang-format/tidy、graphviz、追加の -dev ヘッダ（libpq、MySQL クライアント、curl、ICU、LDAP）が含まれ、エージェントが root なしで典型的な開発コマンドを実行できます。
    - オプションの DinD（`ENABLE_DIND`、デフォルトオン）：ターミナル内で `docker` / `docker compose`（特権サイドカー）。
    - イメージに `certbot`（Let's Encrypt）をプリインストール；init が `cli.ini` と uid 1000 向け `~/.local/bin/certbot` ラッパーを用意（opencode / clawdbot パターン）。

    **初回セットアップ**
    `Claude Code CLI` エントランスを開き、`claude` を実行して OAuth ログインを開始するか、アプリ環境変数に `ANTHROPIC_API_KEY` を設定して再起動してください。

    **ローカルモデルを使う（Ollama / Anthropic 互換ゲートウェイ）**
    Olares クラスタ内のローカル Ollama（または任意の Anthropic 互換 `/v1/messages` プロキシ）に Claude Code を向けるには、アプリ設定で次の環境変数を構成 — セッションごとに手動の `export`/`unset` は不要です：

    - `ANTHROPIC_BASE_URL` = `http://<your-shared-domain>`（例：Ollama Olares アプリの共有エントランス）
    - `ANTHROPIC_AUTH_TOKEN` = `ollama`
    - `ANTHROPIC_API_KEY` = （空のまま）
    - `ANTHROPIC_MODEL` = `qwen3-coder:30b`（またはそのゲートウェイが公開するモデル）
    - `CLAUDE_CODE_USE_BEDROCK` / `CLAUDE_CODE_USE_VERTEX` / `CLAUDE_CODE_USE_FOUNDRY` = false

    これらの変数は条件付きで注入されます：空文字と `false` トグルはコンテナ環境に *入れられない* ため、Claude Code はそれらを本当に未設定として扱います（必須 — `CLAUDE_CODE_USE_*` は値ではなく存在で判定）。
  upgradeDescription: |
    同梱の Olares CLI を 1.12.7-cli.10 に更新し、内蔵スキルをオフラインで展開します。
    PHP 8.3 CLI と拡張機能を Ubuntu セキュリティリビジョン 8.3.6-0ubuntu0.24.04.13 に、Composer を 2.10.3 に更新します。
    この Chart リビジョン用の新しい非公開バックアップを作成し、以前のバックアップ、カスタムスキル、ファイル権限を保持します。

metadata:
  title: Gemma4 12B Q8 (Ollama)
  description: "Inferenza locale multimodale Gemma4 12B (Unsloth Dynamic UD-Q8_K_XL)"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa dal proxy verso Ollama.

    **MODELLO**
    Usa la quantizzazione Unsloth Dynamic da `unsloth/gemma-4-12b-it-GGUF` (`gemma-4-12b-it-UD-Q8_K_XL.gguf` + `mmproj-F16.gguf`).
    UD-Q8_K_XL punta a una fedeltà superiore alle varianti Q4 restando pratico su GPU di fascia media (~14 GB di pesi su disco).
    Usa il chat template incorporato in GGUF per tool calling affidabile e input immagini. Thinking abilitato di default (OLLAMA_THINKING=""); i client possono disabilitarlo per richiesta.

    Gemma 4 12B è un modello multimodale denso da 12B parametri instruction-tuned.

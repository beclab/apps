metadata:
  title: Gemma4 12B Q8 (Ollama)
  description: "Gemma4 12B (Unsloth Dynamic UD-Q8_K_XL) multimodale lokale Inferenz"
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Nach Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    Der Benutzerverkehr geht über den Proxy zu Ollama.

    **MODELL**
    Verwendet Unsloth Dynamic Quant von `unsloth/gemma-4-12b-it-GGUF` (`gemma-4-12b-it-UD-Q8_K_XL.gguf` + `mmproj-F16.gguf`).
    UD-Q8_K_XL zielt auf höhere Wiedergabetreue als Q4-Varianten und bleibt auf mittelgroßen GPUs praktikabel (~14 GB Gewichte auf Disk).
    Nutzt das in GGUF eingebettete Chat-Template für zuverlässiges Tool Calling und Bildeingabe. Thinking ist standardmäßig aktiviert (OLLAMA_THINKING=""); Clients können es pro Anfrage deaktivieren.

    Gemma 4 12B ist ein dichtes, instruction-tuned multimodales Modell mit 12B Parametern.

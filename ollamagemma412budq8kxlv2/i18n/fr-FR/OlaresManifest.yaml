metadata:
  title: Gemma4 12B Q8 (Ollama)
  description: "Inférence locale multimodale Gemma4 12B (Unsloth Dynamic UD-Q8_K_XL)"
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODÈLE**
    Utilise la quantification Unsloth Dynamic de `unsloth/gemma-4-12b-it-GGUF` (`gemma-4-12b-it-UD-Q8_K_XL.gguf` + `mmproj-F16.gguf`).
    UD-Q8_K_XL vise une fidélité supérieure aux variantes Q4 tout en restant pratique sur des GPU de taille moyenne (~14 Go de poids sur disque).
    Utilise le modèle de chat intégré au GGUF pour un tool calling fiable et l'entrée d'images. Thinking activé par défaut (OLLAMA_THINKING="") ; les clients peuvent le désactiver par requête.

    Gemma 4 12B est un modèle multimodal dense de 12B paramètres ajusté par instructions.

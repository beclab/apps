metadata:
  title: Gemma4 12B Q8 (Ollama)
  description: "Gemma4 12B（Unsloth Dynamic UD-Q8_K_XL）マルチモーダル・ローカル推論"
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスタ内の全ユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。

    **モデル**
    `unsloth/gemma-4-12b-it-GGUF` の Unsloth Dynamic 量子化（`gemma-4-12b-it-UD-Q8_K_XL.gguf` + `mmproj-F16.gguf`）を使用します。
    UD-Q8_K_XL は Q4 系より高忠実度を狙いつつ、中規模 GPU で実用的です（ディスク上の重み約 14GB）。
    GGUF 埋め込みチャットテンプレートで信頼性の高いツール呼び出しと画像入力に対応。Thinking はデフォルト有効（OLLAMA_THINKING=""）。クライアントはリクエスト単位で無効化可能。

    Gemma 4 12B は 120 億パラメータの密な instruction-tuned マルチモーダルモデルです。

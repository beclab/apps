metadata:
  title: Gemma4 12B Q8 (Ollama)
  description: "Inferencia local multimodal Gemma4 12B (Unsloth Dynamic UD-Q8_K_XL)"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla mediante la app de referencia.
    El tráfico de usuarios pasa por el proxy hacia Ollama.

    **MODELO**
    Usa la cuantización Unsloth Dynamic de `unsloth/gemma-4-12b-it-GGUF` (`gemma-4-12b-it-UD-Q8_K_XL.gguf` + `mmproj-F16.gguf`).
    UD-Q8_K_XL busca mayor fidelidad que las variantes Q4 y sigue siendo práctico en GPUs de tamaño medio (~14 GB de pesos en disco).
    Usa la plantilla de chat embebida en GGUF para tool calling fiable y entrada de imágenes. Thinking activado por defecto (OLLAMA_THINKING=""); los clientes pueden desactivarlo por solicitud.

    Gemma 4 12B es un modelo multimodal denso de 12B parámetros ajustado por instrucciones.

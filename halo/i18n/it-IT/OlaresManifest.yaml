metadata:
  title: Halo
  description: Strumento open source potente e facile da usare per creare siti web
spec:
  fullDescription: |
    Halo è uno strumento open source potente e facile da usare per creare siti web. Grazie a numerosi modelli e plugin, ti aiuta a realizzare il sito ideale.

    **Funzionalità**

    **Architettura modulare**
    Halo adotta un'architettura modulare con basso accoppiamento e grande flessibilità. Consente di installare e disinstallare plugin su richiesta e offre un'interfaccia di sviluppo che garantisce estensibilità e manutenibilità.
    - Installazione e disinstallazione dei plugin in esecuzione
    - Facile integrazione con piattaforme di terze parti
    - Impostazioni configurabili unificate
    - Modelli personalizzati e generazione automatica di API RESTful

    **Temi ricchi di funzioni**
    Il meccanismo completo di modelli consente di personalizzare l'aspetto del sito.
    - Cambio dinamico del tema
    - Modifica e anteprima in tempo reale
    - Supporto multilingue
    - Altre funzioni tramite plugin

    **Editor**
    L'editor rich text offre titoli, paragrafi, citazioni, elenchi, blocchi di codice, stili, caricamento immagini, video e altro.
    - Supporto completo del rich text
    - Caricamento immagini tramite trascinamento
    - Estensioni dell'editor tramite plugin
  upgradeDescription: |
    Aggiornamento alla versione 2.26.0

    Novità
    - Plugin AI Foundation preinstallato
    - Accesso con codice email per account verificati
    - Modifica della categoria/voce di menu padre dalla console
    - Password per utenti OAuth2 nel centro utente e nei temi
    - Registrazione OAuth2 con verifica email prima delle risorse protette
    - I token personali mostrano ultimo uso e creazione
    - Ricerca e disinstallazione in batch dei temi, con eliminazione facoltativa della configurazione
    - Pannello scorciatoie dell'editor e scorciatoie multipiattaforma

    Ottimizzazioni
    - Gerarchie di categorie e menu ottimizzate
    - Miglioramenti a galleria, trova/sostituisci, tabelle, rientro e selezione
    - La ricerca globale carica meno dati e mostra indicazioni più chiare
    - I selettori dei modelli mostrano le descrizioni

    Correzioni
    - Accesso alla console con più ruoli
    - Accesso quando il nome utente coincide con l'email di un altro utente
    - Stato dei plugin, perdita di contesto e JAR orfani
    - Ritaglio anteprime, incolla nell'editor, menu duplicati e blocco impostazioni

    Pacchetto Olares
    - Immagine ufficiale halohub/halo:2.26.0 con uid 1000
    - init-permissions per proprietà appData e scrittura plugin
    - apiTimeout impostato a 0
    - Probe /actuator/health/liveness

    Ulteriori informazioni: https://github.com/halo-dev/halo/releases/tag/v2.26.0

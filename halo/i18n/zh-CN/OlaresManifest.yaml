metadata:
  description: 强大易用的开源建站工具
  title: Halo
spec:
  fullDescription: |
    Halo 是一款强大易用的开源建站工具。配合上丰富的模板与插件，可以帮助你构建你心中的理想站点。

    **功能特点**
    
    **可插拔架构**
    Halo 采用可插拔架构，功能模块之间耦合度低、灵活性提高。支持用户按需安装、卸载插件，操作便捷。同时提供插件开发接口以确保较高扩展性和可维护性。
    - 支持在运行时安装和卸载插件
    - 更加方便地集成三方平台
    - 统一的可配置设置表单
    - 支持自定义模型，自动生成 RESTful API

    **功能丰富的主题机制**
    Halo 提供完整的主题模板机制，用于构建前台界面。这意味着用户可以根据自己的喜好选择不同类型的主题模板来定制化自己的站点外观。
    - 动态切换主题模板
    - 支持实时编辑和预览效果
    - 多语言支持
    - 与插件配合实现更多功能

    **编辑器**
    Halo 的富文本编辑器提供了方便丰富的功能，包括添加标题、段落、引用、列表、代码块等元素，并支持设置样式属性、上传图片、插入视频等功能。这些工具让你的文章创作更加便捷和生动。
    - 完备的富文本格式支持
    - 支持拖拽和粘贴图片上传
    - 支持通过插件扩展编辑器
  upgradeDescription: |
    升级至 2.26.0 版本

    新特性
    - 预设 AI Foundation 插件
    - 支持已验证邮箱的账号使用邮箱验证码登录
    - 支持在控制台编辑上级分类和菜单项
    - 支持 OAuth2 注册用户在用户中心和主题模板中设置密码
    - 支持 OAuth2 注册并在访问受保护资源前完成邮箱验证
    - 个人访问令牌列表显示最后使用时间和创建时间
    - 主题管理支持搜索已安装主题，并可批量卸载及删除对应配置
    - 富文本编辑器新增快捷键提示与快捷键面板

    功能优化
    - 优化文章分类与菜单的层级关联结构
    - 改进编辑器图库加载、查找替换、表格、缩进与选择体验
    - 优化 Console 全局搜索的初始化数据量与进度/失败提示
    - 文章、页面和分类的自定义模板选择项显示模板描述

    问题修复
    - 修复拥有多个角色的用户可能无法正常访问 Console 的问题
    - 修复用户名与其他用户邮箱相同时可能无法正确登录的问题
    - 修复插件启动状态不刷新、上下文泄漏，以及升级/卸载后残留孤立 JAR 的问题
    - 修复附件预览裁剪、编辑器粘贴转存、菜单迁移重复创建，以及主题设置界面卡死等问题

    Olares 打包调整
    - 切换至官方 halohub/halo:2.26.0 镜像并以 uid 1000 运行
    - 增加 init-permissions，确保 appData 目录权限正确，避免初始化写插件失败
    - 设置 apiTimeout 为 0，避免初始化/setup 被网关 15 秒超时打断
    - 存活探针改用 /actuator/health/liveness

    请查看完整的发布说明以获取更多信息：https://github.com/halo-dev/halo/releases/tag/v2.26.0

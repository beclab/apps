metadata:
  title: Halo
  description: パワフルで使いやすいオープンソースの Web サイト構築ツール
spec:
  fullDescription: |
    Halo は、パワフルで使いやすいオープンソースの Web サイト構築ツールです。豊富なテンプレートとプラグインで理想のサイトを構築できます。

    **機能**

    **モジュラーアーキテクチャ**
    Halo は機能モジュール間の結合度が低い柔軟なモジュラー構造を採用しています。必要に応じてプラグインをインストール、アンインストールでき、高い拡張性と保守性を備えます。
    - 実行時のプラグインのインストールとアンインストール
    - サードパーティプラットフォームとの簡単な連携
    - 統一された設定
    - カスタムモデルと RESTful API の自動生成

    **機能豊富なテーマ**
    完全なテーマテンプレート機構により、好みに合わせてサイトの外観をカスタマイズできます。
    - テーマの動的変更
    - リアルタイム編集とプレビュー
    - 多言語対応
    - プラグインによる機能追加

    **エディター**
    リッチテキストエディターは、タイトル、段落、引用、リスト、コードブロック、スタイル設定、画像アップロード、動画挿入などに対応します。
    - リッチテキスト形式を完全サポート
    - ドラッグ＆ドロップで画像をアップロード
    - プラグインによるエディター拡張
  upgradeDescription: |
    バージョン 2.26.0 へアップグレード

    新機能
    - AI Foundation プラグインをプリセット
    - 確認済みアカウントのメール認証コードログイン
    - コンソールで親カテゴリー/メニュー項目を編集
    - ユーザーセンターとテーマで OAuth2 ユーザーのパスワードを設定
    - 保護リソースへのアクセス前にメール確認を行う OAuth2 登録
    - 個人アクセストークンに最終使用日時と作成日時を表示
    - テーマの検索と設定削除を選べる一括アンインストール
    - エディターのショートカットパネルとクロスプラットフォームショートカット

    機能改善
    - カテゴリーとメニューの階層構造を最適化
    - ギャラリー、検索/置換、表、インデント、選択操作を改善
    - コンソールのグローバル検索のデータ量を削減し、進捗/失敗表示を明確化
    - テーマテンプレート選択に説明を表示

    不具合修正
    - 複数ロールのユーザーのコンソールアクセス
    - ユーザー名が別ユーザーのメールと一致する場合のログイン
    - プラグイン状態、コンテキストリーク、孤立 JAR ファイル
    - 添付プレビュー、貼り付け、メニュー重複、テーマ設定のフリーズ

    Olares パッケージ
    - uid 1000 の公式 halohub/halo:2.26.0 イメージへ変更
    - appData 所有権とプラグイン書き込み用 init-permissions
    - apiTimeout を 0 に設定
    - /actuator/health/liveness を liveness probe に使用

    詳細: https://github.com/halo-dev/halo/releases/tag/v2.26.0

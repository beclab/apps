metadata:
  title: Halo
  description: Leistungsstarkes und benutzerfreundliches Open-Source-Werkzeug zum Erstellen von Websites
spec:
  fullDescription: |
    Halo ist ein leistungsstarkes, benutzerfreundliches Werkzeug zum Erstellen von Websites. Mit zahlreichen Vorlagen und Plugins hilft es Ihnen, Ihre ideale Website zu gestalten.

    **Funktionen**

    **Modulare Architektur**
    Halo nutzt eine modulare Architektur mit geringer Kopplung und hoher Flexibilität. Plugins können bei Bedarf zur Laufzeit installiert und deinstalliert werden. Eine Plugin-Entwicklungsschnittstelle sorgt für hohe Erweiterbarkeit und Wartbarkeit.
    - Installation und Deinstallation von Plugins zur Laufzeit
    - Einfache Integration von Drittanbieterplattformen
    - Einheitliche konfigurierbare Einstellungen
    - Benutzerdefinierte Modelle und automatisch erzeugte RESTful APIs

    **Funktionsreiche Themes**
    Der vollständige Theme-Vorlagenmechanismus ermöglicht die individuelle Gestaltung der Benutzeroberfläche.
    - Themes dynamisch wechseln
    - Bearbeitung und Vorschau in Echtzeit
    - Mehrsprachigkeit
    - Weitere Funktionen durch Plugins

    **Editor**
    Der Rich-Text-Editor bietet Titel, Absätze, Zitate, Listen, Codeblöcke, Stilattribute, Bilduploads, Videos und mehr.
    - Vollständige Unterstützung für Rich-Text
    - Drag-and-drop-Bildupload
    - Editor-Erweiterungen durch Plugins
  upgradeDescription: |
    Upgrade auf Version 2.26.0

    Neue Funktionen
    - Voreingestelltes AI Foundation-Plugin
    - Anmeldung per E-Mail-Bestätigungscode für verifizierte Konten
    - Übergeordnete Kategorie/Menüeinträge in der Konsole bearbeiten
    - Passwort für OAuth2-Benutzer im Benutzerzentrum und in Theme-Vorlagen setzen
    - OAuth2-Registrierung mit E-Mail-Prüfung vor geschützten Ressourcen
    - Persönliche Zugriffstoken zeigen letzte Nutzung und Erstellungszeit
    - Theme-Suche und Stapeldeinstallation mit optionalem Löschen der Konfiguration
    - Rich-Text-Editor mit Schnellzugriffsleiste und plattformübergreifenden Kürzeln

    Funktionsoptimierung
    - Kategorie- und Menühierarchien optimiert
    - Galerie, Suchen/Ersetzen, Tabellen, Einrückung und Auswahl im Editor verbessert
    - Globale Konsolensuche lädt weniger Daten und zeigt klarere Hinweise
    - Theme-Vorlagenauswahl zeigt Beschreibungen

    Fehlerbehebungen
    - Konsolenzugriff bei mehreren Rollen
    - Anmeldung, wenn Benutzername der E-Mail eines anderen Benutzers entspricht
    - Plugin-Status, Kontextleck und verwaiste JAR-Dateien
    - Vorschauzuschnitt, Einfügen im Editor, doppelte Menümigrationen und eingefrorene Theme-Einstellungen

    Olares-Paketierung
    - Offizielles Image halohub/halo:2.26.0 mit uid 1000
    - init-permissions für appData-Besitz und Plugin-Schreibzugriff
    - apiTimeout auf 0
    - Liveness-Probe /actuator/health/liveness

    Weitere Informationen: https://github.com/halo-dev/halo/releases/tag/v2.26.0

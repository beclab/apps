metadata:
  title: Halo
  description: Outil open source puissant et facile à utiliser pour créer des sites Web
spec:
  fullDescription: |
    Halo est un outil open source puissant et facile à utiliser pour créer des sites Web. Grâce à ses nombreux modèles et plugins, il vous aide à construire le site idéal.

    **Fonctionnalités**

    **Architecture modulaire**
    Halo adopte une architecture modulaire, faiblement couplée et plus flexible. Les plugins peuvent être installés et désinstallés à la demande. Une interface de développement garantit extensibilité et maintenabilité.
    - Installation et désinstallation des plugins à l'exécution
    - Intégration simplifiée des plateformes tierces
    - Paramètres configurables unifiés
    - Modèles personnalisés et génération automatique d'API RESTful

    **Thèmes riches en fonctionnalités**
    Le mécanisme complet de modèles permet de personnaliser l'apparence du site.
    - Changement dynamique de thème
    - Modification et aperçu en temps réel
    - Prise en charge multilingue
    - Fonctions supplémentaires grâce aux plugins

    **Éditeur**
    L'éditeur de texte enrichi propose titres, paragraphes, citations, listes, blocs de code, styles, importation d'images, vidéos et plus encore.
    - Prise en charge complète du texte enrichi
    - Importation d'images par glisser-déposer
    - Extension de l'éditeur via des plugins
  upgradeDescription: |
    Mise à niveau vers la version 2.26.0

    Nouveautés
    - Plugin AI Foundation prédéfini
    - Connexion par code e-mail pour les comptes vérifiés
    - Modification de la catégorie/entrée de menu parente dans la console
    - Mot de passe pour les utilisateurs OAuth2 dans le centre utilisateur et les thèmes
    - Inscription OAuth2 avec vérification e-mail avant les ressources protégées
    - Les jetons personnels affichent dernière utilisation et création
    - Recherche et désinstallation groupée de thèmes, avec suppression facultative de la configuration
    - Panneau de raccourcis de l'éditeur et raccourcis multiplateformes

    Optimisations
    - Hiérarchies des catégories et menus optimisées
    - Amélioration de la galerie, recherche/remplacement, tableaux, retrait et sélection
    - La recherche globale charge moins de données et fournit des indications plus claires
    - Les sélecteurs de modèles affichent leur description

    Corrections
    - Accès à la console avec plusieurs rôles
    - Connexion quand l'identifiant correspond à l'e-mail d'un autre utilisateur
    - État des plugins, fuite de contexte et JAR orphelins
    - Recadrage des aperçus, collage, doublons de menus et blocage des paramètres

    Paquet Olares
    - Image officielle halohub/halo:2.26.0 avec uid 1000
    - init-permissions pour appData et l'écriture des plugins
    - apiTimeout défini sur 0
    - Sonde /actuator/health/liveness

    Plus d'informations : https://github.com/halo-dev/halo/releases/tag/v2.26.0

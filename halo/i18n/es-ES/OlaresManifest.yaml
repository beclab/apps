metadata:
  title: Halo
  description: Herramienta de código abierto potente y fácil de usar para crear sitios web
spec:
  fullDescription: |
    Halo es una herramienta potente y fácil de usar para crear sitios web. Sus numerosas plantillas y plugins te ayudan a construir tu sitio ideal.

    **Funciones**

    **Arquitectura modular**
    Halo utiliza una arquitectura modular, con poco acoplamiento entre módulos y mayor flexibilidad. Permite instalar y desinstalar plugins bajo demanda e incluye una interfaz de desarrollo que garantiza escalabilidad y facilidad de mantenimiento.
    - Instalación y desinstalación de plugins en tiempo de ejecución
    - Integración más sencilla de plataformas de terceros
    - Ajustes configurables unificados
    - Modelos personalizados y generación automática de API RESTful

    **Temas con muchas funciones**
    Su completo mecanismo de plantillas permite personalizar la apariencia del sitio.
    - Cambio dinámico de tema
    - Edición y vista previa en tiempo real
    - Compatibilidad multilingüe
    - Más funciones mediante plugins

    **Editor**
    El editor de texto enriquecido incluye títulos, párrafos, citas, listas, bloques de código, estilos, carga de imágenes, vídeos y más.
    - Compatibilidad total con texto enriquecido
    - Carga de imágenes mediante arrastrar y soltar
    - Extensiones del editor mediante plugins
  upgradeDescription: |
    Actualización a la versión 2.26.0

    Novedades
    - Plugin AI Foundation preinstalado
    - Inicio de sesión por código de correo para cuentas verificadas
    - Edición de categoría/elemento de menú padre en la consola
    - Contraseña para usuarios OAuth2 en el centro de usuario y plantillas
    - Registro OAuth2 con verificación de correo antes de recursos protegidos
    - Los tokens personales muestran último uso y creación
    - Búsqueda y desinstalación masiva de temas, con borrado opcional de configuración
    - Panel de atajos del editor y atajos multiplataforma

    Optimización
    - Jerarquías de categorías y menús optimizadas
    - Mejoras en galería, buscar/reemplazar, tablas, sangría y selección
    - La búsqueda global carga menos datos y muestra indicaciones más claras
    - Los selectores de plantillas muestran descripciones

    Correcciones
    - Acceso a consola con varios roles
    - Inicio de sesión si el usuario coincide con el correo de otro usuario
    - Estado de plugins, fuga de contexto y archivos JAR huérfanos
    - Recorte de vistas previas, pegado, menús duplicados y bloqueo de ajustes

    Empaquetado Olares
    - Imagen oficial halohub/halo:2.26.0 con uid 1000
    - init-permissions para appData y escritura de plugins
    - apiTimeout en 0
    - Sonda /actuator/health/liveness

    Más información: https://github.com/halo-dev/halo/releases/tag/v2.26.0

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  halo: 1
metadata:
  name: halo
  description: Powerful and easy-to-use open source website building tool
  icon: https://app.cdn.olares.com/appstore/halo/icon.png
  appid: halo
  version: '1.1.30'
  title: Halo
  categories:
  - Creativity
  - Fun
  - workspace
  - homelab
  tags:
  - website-builder

permission:
  appData: true
  appCache: true
  userData:
    - Home
spec:
  versionName: '2.26.0'
  featuredImage: https://app.cdn.olares.com/appstore/halo/1.jpg
  promoteImage:
  - https://app.cdn.olares.com/appstore/halo/1.jpg
  - https://app.cdn.olares.com/appstore/halo/2.jpg
  - https://app.cdn.olares.com/appstore/halo/3.jpg    
  - https://app.cdn.olares.com/appstore/halo/4.jpg
  fullDescription: |
    Halo is a powerful and easy-to-use open source website building tool. With a variety of templates and plug-ins, it can help you build your ideal site.

    **Features**

    **Modular Architecture**
    Halo adopts a modular architecture, with low coupling between functional modules and improved flexibility. It supports users to install and uninstall plug-ins on demand, which is convenient to operate. At the same time, it provides a plug-in development interface to ensure high scalability and maintainability.
    - Supports installation and uninstallation of plug-ins at runtime
    - More convenient integration of third-party platforms
    - Unified configurable settings
    - Supports custom models and automatically generates RESTful APIs

    **Feature-rich theme**
    Halo provides a complete theme template mechanism for building the front-end interface. This means that users can choose different types of theme templates according to their preferences to customize the appearance of their site.
    - Change theme dynamically
    - Supports real-time editing and preview
    - Multi-language support
    - Get more with plug-ins

    **Editor**
    Halo's rich text editor provides convenient and rich functions, including adding elements such as titles, paragraphs, quotes, lists, code blocks, and supports setting style attributes, uploading pictures, inserting videos, etc. These tools make your article creation
    - Fully supports rich text format 
    - Supports drag and drop image upload
    - Supports editor extension through plug-ins
  upgradeDescription: |
    Upgrade to version 2.26.0

    New features
    - Preset AI Foundation plugin
    - Email verification code login for verified accounts
    - Edit parent category/menu item in console
    - Set password for OAuth2 users in user center and theme templates
    - OAuth2 registration with email verification before accessing protected resources
    - Personal access tokens show last used time and creation time
    - Theme management supports search and batch uninstall with optional config deletion
    - Rich text editor shortcut panel and cross-platform shortcuts

    Function optimization
    - Optimize category and menu hierarchy structures
    - Improve editor gallery loading, find/replace, table, indentation, and selection experience
    - Console global search loads less data and shows clearer progress/failure hints
    - Theme template selectors show template descriptions

    Bug fixes
    - Fix console access for users with multiple roles
    - Fix login when username matches another user's email
    - Fix plugin startup status refresh, context leak, and orphaned JAR files after upgrade/uninstall
    - Fix attachment preview cropping, editor paste transfer, menu migration duplicates, and theme setting freezes

    Olares packaging
    - Switch to official halohub/halo:2.26.0 image with uid 1000
    - Add init-permissions for appData ownership and setup plugin writes
    - Set apiTimeout to 0 to avoid setup timeout
    - Use /actuator/health/liveness for liveness probe

    Check out the release note for more information: https://github.com/halo-dev/halo/releases/tag/v2.26.0

  developer: Halo
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  requiredMemory: 1Gi
  limitedMemory: 3Gi
  requiredDisk: 128Mi
  limitedDisk: 5Gi
  requiredCpu: 0.75
  limitedCpu: 2
  doc: https://docs.halo.run/
  website: https://halo.run/
  sourceCode: https://github.com/halo-dev/halo
  supportArch:
    - amd64
    - arm64
  runAsUser: true
middleware:
  postgres:
    username: halo
    password: halo
    databases:
      - name: halo
        distributed: true
options:
  allowMultipleInstall: true
  apiTimeout: 0
  allowedOutboundPorts:
    - 465
    - 587
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
  policies:
    - uriRegex: ^/(system/setup)(/.*)?(\?.*)?$
      level: one_factor
      oneTime: false
      validDuration: 3600s
      entranceName: halo
entrances:
  - name: halo
    port: 8090
    host: halo-svc
    title: Halo
    icon: https://app.cdn.olares.com/appstore/halo/icon.png
    openMethod: window
    authLevel: public

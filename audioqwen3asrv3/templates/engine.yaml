{{- /* Qwen ASR engine: NVIDIA uses the qwen/vLLM image; Intel uses the OpenVINO image.
       One chart, four accelerator modes. Capabilities stay stt / stt_stream. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- /* MODEL_SUPPORTS: bare capability names; llm-init and the engine both take supports_* keys. */ -}}
{{- $supportsKeys := list -}}
{{- range $tok := splitList "," ($oe.MODEL_SUPPORTS | default "stt") -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- $supportsKeys = append $supportsKeys (ternary $tok (printf "supports_%s" $tok) (hasPrefix "supports_" $tok)) -}}
{{- end -}}
{{- end -}}
{{- $supportsRaw := join "," $supportsKeys -}}
{{- $enginePort := int ($oe.ENGINE_PORT | default "8000") -}}
{{- $cpuRequest := trim ($oe.CPU_REQUEST | default "500m") -}}
{{- $memRequest := trim ($oe.MEMORY_REQUEST | default "4Gi") -}}
{{- $cpuLimit := trim ($oe.CPU_LIMIT | default "6") -}}
{{- $memLimit := trim ($oe.MEMORY_LIMIT | default "16Gi") -}}
{{- /* GPU is OPTIONAL (REQUIRED_GPU_MEMORY = "" or "0" => CPU-only). */ -}}
{{- $gpuRaw := trim ($oe.REQUIRED_GPU_MEMORY | default "12Gi") -}}
{{- $wantGpu := and (ne $gpuRaw "") (ne $gpuRaw "0") -}}
{{- $gpuMiB := "" -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- if .Values.GPU -}}{{- $gpuType = .Values.GPU.Type | default "nvidia" -}}{{- else -}}{{- $gpuType = "nvidia" -}}{{- end -}}
{{- end -}}
{{- $isIntel := or (eq $gpuType "intel") (eq $gpuType "intel-gpu") -}}
{{- /* gb10 unified memory: size the pod from REQUIRED_GPU_MEMORY (12Gi).
       iGPU is also unified; its host envelope is MEMORY_LIMIT (16Gi), the
       same engine limit as Arc. intel-gpu (Arc) is discrete. */ -}}
{{- $unifiedMem := and $wantGpu (or (eq $gpuType "nvidia-gb10") (eq $gpuType "intel")) -}}
{{- /* ENGINE_IMAGE has no manifest default: filling one would pin every mode to the same image. */ -}}
{{- $engineImage := $oe.ENGINE_IMAGE | default (ternary "docker.io/beclab/audio-qwen-ov:v1.1.29" "docker.io/beclab/audio-qwen:v1.1.29" $isIntel) -}}
{{- if $wantGpu -}}
{{- $gpuMiB = include "llmbase.gpuMiB" $gpuRaw -}}
{{- if and $unifiedMem (eq $gpuType "nvidia-gb10") -}}
{{- $memRequest = printf "%sMi" $gpuMiB -}}
{{- $memLimit = printf "%sMi" $gpuMiB -}}
{{- else if and $unifiedMem (eq $gpuType "intel") -}}
{{- /* iGPU request is not the 16Gi limit. 6Gi + llm-init 256Mi = requiredMemory 6400Mi. */ -}}
{{- $memRequest = "6Gi" -}}
{{- end -}}
{{- end -}}
{{- /* Engine-native flags in llm-init's one channel; the engine derives its GPU share from the
       quota below. gb10 profiles a smaller KV budget after the encoder than a discrete slice, and
       graph capture is where startup has been seen to wedge holding the vGPU lock.
       A span count is not a measure of memory, so batching stays on and the engine sizes each
       call, except on the integrated GPU (gpu type intel, not Arc) when the smallest node
       reports under 48Gi: an empty box then adds --batch-max-spans 8 (at most eight spans
       a call). Arc keeps its own 32Gi and is not memory-pressured, so it is not capped.
       Unreadable memory leaves batching on. A filled ENGINE_ARGS replaces this whole string. */ -}}
{{- $hostBytes := 0 -}}
{{- range $n := (.Values.nodes | default list) -}}
{{- /* api.NodeInfo is a struct. toJson uses its json tags (memory.total); dig misses nothing without aborting the render. */ -}}
{{- $t := int (dig "memory" "total" 0 (fromJson (toJson $n))) -}}
{{- if and (gt $t 0) (or (eq $hostBytes 0) (lt $t $hostBytes)) -}}
{{- $hostBytes = $t -}}
{{- end -}}
{{- end -}}
{{- /* Arc (intel-gpu) is discrete. The cap is the integrated part sharing host memory. */ -}}
{{- $forceSerial := and (eq $gpuType "intel") (gt $hostBytes 0) (lt $hostBytes (mul 48 1073741824)) -}}
{{- $engineArgs := trim ($oe.ENGINE_ARGS | default "") -}}
{{- if eq $engineArgs "" -}}
{{- $engineArgs = printf "--max-model-len %s --enforce-eager --repetition-detection" (ternary "3072" "8192" (eq $gpuType "nvidia-gb10")) -}}
{{- if $forceSerial -}}
{{- $engineArgs = printf "%s --batch-max-spans 8" $engineArgs -}}
{{- end -}}
{{- end -}}
{{- $modelSan := regexReplaceAll "[^a-z0-9]+" (lower $modelName) "-" | trimAll "-" -}}
{{- $cname := printf "audio-%s" $modelSan | trunc 63 | trimSuffix "-" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: audio-engine
  annotations:
    audio.bytetrade.io/model: "{{ $modelName }}"
    audio.bytetrade.io/supports: "{{ $supportsRaw }}"
{{- if or $isIntel $wantGpu }}
    applications.app.bytetrade.io/gpu-inject: "{{ $cname }}"
{{- end }}
spec:
  replicas: {{ .Values.workloads.audioqwen3asrv3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: audio-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: audio-engine
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: "{{ .Values.userspace.appData }}/data"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ printf "%s/llm-init-run/%s" .Values.userspace.appCache .Release.Name }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: audio-wrappers
            defaultMode: 0555
{{- if $isIntel }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: drm
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
{{- end }}
      containers:
        - name: {{ $cname }}
          image: "{{ $engineImage }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/wrappers/qwen.sh"]
          env:
            - name: ENGINE_KIND
              value: audio
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: "{{ $modelSource }}"
            - name: MODEL_SUPPORTS
              value: "{{ $supportsRaw }}"
            - name: ENGINE_PORT
              value: "{{ $enginePort }}"
            - name: LOG_LEVEL
              value: "{{ $oe.LOG_LEVEL | default "info" }}"
            - name: WRAPPER_COMMON
              value: /run/llm-init/wrappers/common.sh
            - name: OLARES_GPU_MODE
              value: "{{ $gpuType }}"
            # Requests Router may hold open here at once; inference still runs one call at a time.
            - name: ENGINE_MAX_CONCURRENCY
              value: "{{ $oe.ENGINE_MAX_CONCURRENCY | default "3" }}"
{{- if $engineArgs }}
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
{{- end }}
{{- if $wantGpu }}
            - name: REQUIRED_GPU_MEMORY
              value: "{{ $gpuRaw }}"
{{- end }}
{{- if not $isIntel }}
            - name: VLLM_USE_V1
              value: "0"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
{{- end }}
            - name: HF_HOME
              value: /cache/hf
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
            - name: HUGGINGFACE_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              value: "{{ $hfToken }}"
{{- end }}
            - name: TZ
              value: Etc/UTC
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
{{- if $wantGpu }}
            - name: GPU_CORE_UTILIZATION_POLICY
              value: "{{ $oe.GPU_CORE_UTILIZATION_POLICY | default "disable" }}"
{{- end }}
          ports:
            - name: http
              containerPort: {{ $enginePort }}
          # No readinessProbe (like llamacpp): Ready at start so the app runs while the model downloads; llm-init gates /v1/*.
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: data
              mountPath: /tmp
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /wrappers
              readOnly: true
{{- if $isIntel }}
            - name: dri
              mountPath: /dev/dri
            - name: drm
              mountPath: /sys/class/drm
            - name: dshm
              mountPath: /dev/shm
{{- end }}
          resources:
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if and $wantGpu (not $unifiedMem) (not $isIntel) }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if and $wantGpu (not $unifiedMem) (not $isIntel) }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: audio-engine
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: audio-engine
spec:
  selector:
    io.kompose.service: audio-engine
  ports:
    - name: http
      port: {{ $enginePort }}
      targetPort: {{ $enginePort }}
  type: ClusterIP

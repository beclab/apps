olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audioqwen3asrv3
  icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
  description: A multilingual speech recognition model for recorded and live audio
  appid: audioqwen3asrv3
  title: Qwen3-ASR 1.7B
  version: '1.0.13'
  categories:
    - AI
    - models
  tags:
  - speech-to-text
  - audio
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audioqwen3asrv3api
    host: sharedentrances-api
    port: 0
    title: Qwen3-ASR 1.7B API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audioqwen3asrv3
    port: 8090
    host: download-svc
    title: Qwen3-ASR 1.7B
    icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audioqwen3asrv3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'Qwen/Qwen3-ASR-1.7B'
  fullDescription: |
    Qwen3-ASR 1.7B converts spoken audio in multiple languages into written text. It can transcribe a complete recording or process live audio while it is arriving.

    **Key features**
    - Transcribe speech in multiple languages.
    - Process complete audio recordings.
    - Support streaming recognition for live audio.
    - Make transcription available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `12Gi` of GPU memory is required.

  developer: Alibaba
  website: https://qwen.ai/
  sourceCode: https://huggingface.co/Qwen/Qwen3-ASR-1.7B
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  doc: https://huggingface.co/Qwen/Qwen3-ASR-1.7B
  license:
    - text: Apache-2.0
      url: https://huggingface.co/Qwen/Qwen3-ASR-1.7B

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "20Gi"
      requiredMemory: "4352Mi"
      requiredGPUMemory: "12Gi"
      limitedGPUMemory: "12Gi"
    - mode: nvidia-gb10
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "16Gi"
      requiredMemory: "12544Mi"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://Qwen/Qwen3-ASR-1.7B"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "Qwen/Qwen3-ASR-1.7B"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "stt,stt_stream"
    multiSelect: true
    splitter: ","
    options:
    - title: STT (offline transcription)
      value: stt
    - title: STT Stream (streaming ASR, WebSocket)
      value: stt_stream
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "12Gi"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "6"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "16Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    # Left blank on purpose: the built-in depends on the card, which a static default cannot express.
    description: "Engine-native flags (llm-init ENGINE_ARGS). Left empty, the chart uses
      \"--max-model-len 8192 --enforce-eager\", and 3072 instead of 8192 on a gb10, whose unified
      memory leaves a smaller KV budget after the encoder. Whatever is here REPLACES that whole
      list, so carry the flags over when adding one."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN

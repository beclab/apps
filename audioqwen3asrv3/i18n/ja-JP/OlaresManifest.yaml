metadata:
  description: 録音とライブ音声に対応する多言語音声認識モデル
  title: Qwen3-ASR 1.7B

spec:
  fullDescription: |
    Qwen3-ASR 1.7Bは、複数言語の音声をテキストに変換します。録音全体の文字起こしに加え、入力中のライブ音声を逐次処理できます。

    **主な機能**
    - 複数の言語で音声を文字起こしします。
    - 録音済みの音声全体を処理します。
    - ライブ音声のストリーミング認識に対応します。
    - 対応するOlaresアプリから文字起こし機能を利用できます。

    `12Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。

metadata:
  description: Un modelo de reconocimiento de voz multilingüe para grabaciones y audio en directo
  title: Qwen3-ASR 1.7B

spec:
  fullDescription: |
    Qwen3-ASR 1.7B convierte en texto el habla en varios idiomas. Puede transcribir una grabación completa o procesar audio en directo a medida que se recibe.

    **Funciones principales**
    - Transcribir voz en varios idiomas.
    - Procesar grabaciones de audio completas.
    - Admitir reconocimiento en streaming para audio en directo.
    - Poner la transcripción a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `12Gi` de memoria gráfica.

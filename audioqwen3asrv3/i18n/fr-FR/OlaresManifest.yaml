metadata:
  description: Un modèle de reconnaissance vocale multilingue pour les enregistrements et l'audio en direct
  title: Qwen3-ASR 1.7B

spec:
  fullDescription: |
    Qwen3-ASR 1.7B convertit la parole en texte dans plusieurs langues. Il peut transcrire un enregistrement complet ou traiter un flux audio en direct à mesure qu'il arrive.

    **Fonctionnalités principales**
    - Transcrire la parole dans plusieurs langues.
    - Traiter des enregistrements audio complets.
    - Prendre en charge la reconnaissance en continu pour l'audio en direct.
    - Mettre la transcription à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `12Gi` de mémoire vidéo est requis.

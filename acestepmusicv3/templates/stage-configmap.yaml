            "id": task_id,
            "kind": "draft",
            "status": "queued",
            "created_at": int(time.time()),
            "brief": brief,
            "instrumental": instrumental,
            "vocal_language": language,
            "warnings": [],
            "metrics": {},
        }
        with TASKS_LOCK:

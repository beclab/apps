metadata:
  title: ACE-Step Music XL-SFT
  description: "Musikerzeugung aus Textbeschreibungen und Liedtexten"

spec:
  fullDescription: |
    ACE-Step Music XL-SFT erzeugt Lieder mit Gesang oder Instrumentalmusik aus Textbeschreibungen und Liedtexten. Es stellt das Modell ACE-Step 1.5 XL-SFT und ein 4B-Sprachmodell für kompatible Olares-Musikanwendungen bereit.

    **Hauptfunktionen**

    - Songbeschreibungen und Liedtexte aus einer kurzen Idee entwerfen.
    - Musik mit Vorgaben für Stil, Tempo, Tonart und Gesangssprache erzeugen.
    - Einen ausgewählten Abschnitt einer vorhandenen Audiodatei neu erzeugen.
    - Zeitangaben zu Liedtexten für neu erzeugte Lieder mit Gesang bereitstellen.

    Diese App benötigt Olares 1.12.7 oder neuer und ist für eine NVIDIA-GPU mit 24 GiB Speicher auf einem amd64-System konfiguriert. Öffnen Sie Model Console, um die Modelle herunterzuladen und ihren Status zu prüfen. Erstellen Sie anschließend Songs in einer kompatiblen Musikanwendung.

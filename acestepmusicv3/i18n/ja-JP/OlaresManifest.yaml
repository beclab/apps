metadata:
  title: Music Studio
  description: "アイデアや歌詞から楽曲を制作するAI音楽スタジオ"

spec:
  fullDescription: |
    Music Studioは、アイデアや歌詞から歌声付きの楽曲やインストゥルメンタルを生成します。ACE-Step XL-SFTで音楽を制作し、指定した区間を作り直して、完成した楽曲をライブラリに保存できます。

    **主な機能**

    - 短いアイデアから歌詞や音楽スタイルの説明を作成。
    - 音楽スタイル、テンポ、キー、歌唱言語を設定。
    - 楽曲の指定区間を再生成。
    - 対応する歌声付き楽曲で同期歌詞を表示。
    - ライブラリで完成した楽曲を再生、ダウンロード、整理。

    初回利用時に、合計約30 GBの必要なモデルをダウンロードします。画面でダウンロードと読み込みの進捗を確認できます。モデルの準備が完了すると、制作画面が自動的に開きます。

    Olares 1.12.7以降と、24 GiBのメモリを備えたNVIDIA GPUを搭載するamd64システムが必要です。

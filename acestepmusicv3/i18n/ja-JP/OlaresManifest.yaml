metadata:
  title: ACE-Step Music XL-SFT
  description: "文章による説明と歌詞からの音楽生成"

spec:
  fullDescription: |
    ACE-Step Music XL-SFTは、文章による説明と歌詞から、ボーカル付きの楽曲やインストゥルメンタルを生成します。ACE-Step 1.5 XL-SFTモデルと4B言語モデルを、対応するOlaresの音楽アプリに提供します。

    **主な機能**

    - 短いアイデアから楽曲の説明や歌詞の草案を作成。
    - スタイル、テンポ、調性、歌唱言語を指定して音楽を生成。
    - 既存の音声の指定区間を再生成。
    - 新たに生成したボーカル付き楽曲の歌詞のタイミング情報を提供。

    このアプリにはOlares 1.12.7以降が必要です。24 GiBのメモリを搭載したNVIDIA GPUを持つamd64システム向けに構成されています。Model Consoleでモデルをダウンロードして状態を確認し、対応する音楽アプリで楽曲を作成してください。

metadata:
  title: Music Studio
  description: "Uno studio musicale IA per creare canzoni da idee e testi"

spec:
  fullDescription: |
    Music Studio trasforma idee e testi in canzoni con voce o musica strumentale. Crea musica con ACE-Step XL-SFT, modifica sezioni specifiche e salva i brani completati nella tua libreria.

    **Funzionalità principali**

    - Scrivi bozze di testi e descrizioni musicali a partire da una breve idea.
    - Imposta stile musicale, tempo, tonalità e lingua del canto.
    - Rigenera una sezione di un brano.
    - Visualizza testi sincronizzati per i brani vocali supportati.
    - Riproduci, scarica e organizza i brani completati nella libreria.

    Al primo utilizzo, Music Studio scarica i modelli necessari, per un totale di circa 30 GB. Puoi seguire sullo schermo l’avanzamento del download e del caricamento. La pagina di creazione si apre automaticamente quando i modelli sono pronti.

    Richiede Olares 1.12.7 o successivo e un sistema amd64 con GPU NVIDIA dotata di 24 GiB di memoria.

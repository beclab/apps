metadata:
  title: ACE-Step Music XL-SFT
  description: "Generazione musicale da descrizioni testuali e testi di canzoni"

spec:
  fullDescription: |
    ACE-Step Music XL-SFT genera canzoni con voce o musica strumentale a partire da descrizioni testuali e testi di canzoni. Fornisce il modello ACE-Step 1.5 XL-SFT e un modello linguistico 4B alle applicazioni musicali Olares compatibili.

    **Funzioni principali**

    - Abbozzare descrizioni e testi di canzoni a partire da una breve idea.
    - Generare musica impostando stile, tempo, tonalità e lingua del canto.
    - Rigenerare una sezione selezionata di un audio esistente.
    - Fornire la temporizzazione dei testi per le nuove canzoni con voce.

    Questa app richiede Olares 1.12.7 o versioni successive ed è configurata per una GPU NVIDIA con 24 GiB di memoria su un sistema amd64. Aprire Model Console per scaricare i modelli e verificarne lo stato, quindi usare un'applicazione musicale compatibile per creare canzoni.

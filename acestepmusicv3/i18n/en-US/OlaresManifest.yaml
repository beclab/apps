metadata:
  title: Music Studio
  description: "An AI music studio for creating songs from ideas and lyrics"

spec:
  fullDescription: |
    Music Studio turns your ideas and lyrics into songs with vocals or instrumental music. Create music with ACE-Step XL-SFT, refine selected sections, and save finished tracks in your library.

    **Key features**

    - Draft lyrics and song descriptions from a short idea.
    - Shape your music with style, tempo, key, and vocal language controls.
    - Regenerate a selected section of a track.
    - View synchronized lyrics for supported vocal tracks.
    - Play, download, and organize finished tracks in your library.

    On first use, Music Studio downloads the required models, totaling approximately 30 GB. You can follow download and loading progress on screen. The creation page opens automatically when the models are ready.

    Requires Olares 1.12.7 or later and an amd64 system with an NVIDIA GPU with 24 GiB of memory.

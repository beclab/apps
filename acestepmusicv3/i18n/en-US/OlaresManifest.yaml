metadata:
  title: ACE-Step Music XL-SFT
  description: "Music generation from text descriptions and lyrics"

spec:
  fullDescription: |
    ACE-Step Music XL-SFT generates songs with vocals or instrumental music from text descriptions and lyrics. It provides the ACE-Step 1.5 XL-SFT model and a 4B language model to compatible Olares music applications.

    **Key features**

    - Draft song descriptions and lyrics from a short idea.
    - Generate music with controls for style, tempo, key, and vocal language.
    - Regenerate a selected section of existing audio.
    - Provide lyric timing for newly generated vocal songs.

    This app requires Olares 1.12.7 or later and is configured for an NVIDIA GPU with 24 GiB of memory on an amd64 system. Open Model Console to download the models and check their status, then use a compatible music application to create songs.

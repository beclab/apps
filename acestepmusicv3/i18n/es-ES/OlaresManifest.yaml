metadata:
  title: ACE-Step Music XL-SFT
  description: "Generación musical a partir de descripciones textuales y letras"

spec:
  fullDescription: |
    ACE-Step Music XL-SFT genera canciones con voz o música instrumental a partir de descripciones textuales y letras. Proporciona el modelo ACE-Step 1.5 XL-SFT y un modelo de lenguaje 4B a las aplicaciones musicales Olares compatibles.

    **Funciones principales**

    - Crear borradores de descripciones y letras de canciones a partir de una idea breve.
    - Generar música ajustando el estilo, el tempo, la tonalidad y el idioma del canto.
    - Regenerar una sección seleccionada de un audio existente.
    - Proporcionar tiempos de las letras para las nuevas canciones con voz.

    Esta aplicación requiere Olares 1.12.7 o posterior y está configurada para una GPU NVIDIA con 24 GiB de memoria en un sistema amd64. Abre Model Console para descargar los modelos y comprobar su estado; después, usa una aplicación musical compatible para crear canciones.

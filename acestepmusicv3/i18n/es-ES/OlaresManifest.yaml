metadata:
  title: Music Studio
  description: "Un estudio de música con IA para crear canciones a partir de ideas y letras"

spec:
  fullDescription: |
    Music Studio convierte tus ideas y letras en canciones con voz o música instrumental. Crea música con ACE-Step XL-SFT, modifica fragmentos y guarda las pistas terminadas en tu biblioteca.

    **Funciones principales**

    - Redacta letras y descripciones musicales a partir de una idea breve.
    - Ajusta el estilo musical, el tempo, la tonalidad y el idioma de la voz.
    - Regenera un fragmento de una pista.
    - Consulta letras sincronizadas en las pistas vocales compatibles.
    - Reproduce, descarga y organiza las pistas terminadas en tu biblioteca.

    En el primer uso, Music Studio descarga los modelos necesarios, que ocupan aproximadamente 30 GB. Puedes seguir el progreso de descarga y carga en pantalla. La página de creación se abre automáticamente cuando los modelos están listos.

    Requiere Olares 1.12.7 o posterior y un sistema amd64 con una GPU NVIDIA de 24 GiB de memoria.

metadata:
  title: ACE-Step Music XL-SFT
  description: "Création musicale à partir de descriptions textuelles et de paroles"

spec:
  fullDescription: |
    ACE-Step Music XL-SFT génère des chansons avec voix ou de la musique instrumentale à partir de descriptions textuelles et de paroles. Il fournit le modèle ACE-Step 1.5 XL-SFT et un modèle de langage 4B aux applications musicales Olares compatibles.

    **Fonctionnalités principales**

    - Ébaucher des descriptions de chansons et des paroles à partir d'une idée brève.
    - Générer de la musique en réglant le style, le tempo, la tonalité et la langue chantée.
    - Régénérer une section sélectionnée d'un enregistrement audio existant.
    - Fournir le minutage des paroles pour les nouvelles chansons avec voix.

    Cette application nécessite Olares 1.12.7 ou une version ultérieure et est configurée pour un GPU NVIDIA doté de 24 GiB de mémoire sur un système amd64. Ouvrez Model Console pour télécharger les modèles et vérifier leur état, puis utilisez une application musicale compatible pour créer des chansons.

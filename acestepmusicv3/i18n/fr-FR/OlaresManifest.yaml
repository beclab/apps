metadata:
  title: Music Studio
  description: "Un studio musical IA pour créer des chansons à partir d’idées et de paroles"

spec:
  fullDescription: |
    Music Studio transforme vos idées et vos paroles en chansons ou en morceaux instrumentaux. Créez de la musique avec ACE-Step XL-SFT, retravaillez certains passages et conservez les morceaux terminés dans votre bibliothèque.

    **Fonctionnalités principales**

    - Rédiger des paroles et des descriptions musicales à partir d’une idée succincte.
    - Définir le style musical, le tempo, la tonalité et la langue du chant.
    - Régénérer un passage d’un morceau.
    - Afficher des paroles synchronisées pour les morceaux chantés compatibles.
    - Écouter, télécharger et organiser les morceaux terminés dans la bibliothèque.

    Lors de la première utilisation, Music Studio télécharge les modèles nécessaires, soit environ 30 Go au total. La progression du téléchargement et du chargement s’affiche à l’écran. La page de création s’ouvre automatiquement lorsque les modèles sont prêts.

    Nécessite Olares 1.12.7 ou version ultérieure et un système amd64 équipé d’un GPU NVIDIA avec 24 GiB de mémoire.

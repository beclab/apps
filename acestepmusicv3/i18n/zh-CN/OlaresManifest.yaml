metadata:
  title: ACE-Step Music XL-SFT
  description: "根据文字描述和歌词生成音乐"

spec:
  fullDescription: |
    ACE-Step Music XL-SFT 根据文字描述和歌词生成带人声的歌曲或纯音乐。它为兼容的 Olares 音乐应用提供 ACE-Step 1.5 XL-SFT 模型和一个 4B 语言模型。

    **主要功能**

    - 从简短创意起草歌曲描述和歌词。
    - 根据风格、速度、调性和演唱语言等设置生成音乐。
    - 重新生成已有音频中的指定片段。
    - 为新生成的带人声歌曲提供歌词时间信息。

    本应用要求 Olares 1.12.7 或更新版本，面向配备 24 GiB 显存 NVIDIA GPU 的 amd64 系统配置。打开 Model Console 下载模型并查看状态，然后通过兼容的音乐应用创作歌曲。

metadata:
  title: Music Studio
  description: "从歌曲想法和歌词创作音乐的 AI 工作室"

spec:
  fullDescription: |
    Music Studio 将歌曲想法和歌词变成带人声的歌曲或纯音乐。使用 ACE-Step XL-SFT 创作音乐、重新生成指定片段，并将完成的作品保存在曲库中。

    **主要功能**

    - 根据简短的歌曲想法起草歌词和音乐风格描述。
    - 设置音乐风格、速度、调性和演唱语言。
    - 重新生成歌曲中的指定片段。
    - 为支持的带人声作品显示同步歌词。
    - 在曲库中播放、下载和整理作品。

    首次使用需要下载约 30 GB 的模型文件。页面会显示下载和加载进度，模型准备完成后自动进入创作页面。

    需要 Olares 1.12.7 或更新版本，以及配备 24 GiB 显存 NVIDIA GPU 的 amd64 系统。

# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   acestepmusicv3 — ACE-Step 1.5 staged music engine
#   llminit        — Model Console, downloader, and standard API proxy
workloads:
  acestepmusicv3:
    replicaCount: 1
  llminit:
    replicaCount: 1
  music:
    replicaCount: 1

image: docker.io/beclab/music:0.1.36
imagePullPolicy: IfNotPresent
postgres:
  host: postgres
  port: 5432
  username: acestepmusic
  password: ""
  databases:
    music: music

metadata:
  title: Coder
  description: セルフホスト型クラウド開発環境
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。

    **変更履歴**
    パフォーマンス改善
    - count クエリを上限制限し、監査/接続ログにネイティブ UUID 操作を使用（backport #23835）（#24129、2f5d21d）

    メンテナンス
    - Go 1.25.8 バンプを release/2.31 にバックポート（#23941、2587364）
    - Iron Bank 依存関係の high / critical 修正をバックポート（#24110、960b8e7）

    完全なリリースノート：https://github.com/coder/coder/releases/tag/v2.31.9

  fullDescription: |
    Coder は、あらゆるクラウド、IDE、OS、Git プロバイダー、IDP で動作するセルフホスト型オープンソースのクラウド開発環境です。

    Coder により、組織はパブリックまたはプライベートのクラウドインフラ上に開発環境を構築できます。クラウド開発環境は Terraform で定義され、安全な高速 Wireguard® トンネルで接続され、未使用時は自動停止してコストを削減します。Coder は、エンジニアリングチームが最も有益なワークロードにクラウドを柔軟に使えるようにします。

    - Terraform でクラウド開発環境を定義
      - EC2 VM、Kubernetes Pod、Docker コンテナなど
    - アイドルリソースを自動停止してコスト削減
    - 開発者のオンボーディングを数日ではなく数秒で


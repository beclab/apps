metadata:
  title: Coder
  description: Ambienti di sviluppo cloud self-hosted
spec:
  upgradeDescription: |
    Passaggio dell'immagine reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico Bitnami di `OPENRESTY_CONF_FILE`.

    **Changelog**
    Miglioramenti delle prestazioni
    - Limitare le query count, usare operazioni UUID native per i log di audit/conn (backport #23835) (#24129, 2f5d21d)

    Manutenzione
    - Backport del bump di Go 1.25.8 su release/2.31 (#23941, 2587364)
    - Backport delle correzioni high e critical delle dipendenze Iron Bank (#24110, 960b8e7)

    Note di rilascio complete: https://github.com/coder/coder/releases/tag/v2.31.9

  fullDescription: |
    Coder è un ambiente di sviluppo cloud self-hosted e open source che funziona con qualsiasi cloud, IDE, SO, provider Git e IDP.

    Coder consente alle organizzazioni di configurare ambienti di sviluppo nella propria infrastruttura cloud pubblica o privata. Gli ambienti sono definiti con Terraform, collegati tramite un tunnel Wireguard® sicuro ad alta velocità e spenti automaticamente quando non utilizzati per risparmiare sui costi. Coder dà ai team di engineering la flessibilità di usare il cloud per i workload più vantaggiosi.

    - Definisci ambienti di sviluppo cloud in Terraform
      - VM EC2, pod Kubernetes, container Docker, ecc.
    - Spegnimento automatico delle risorse inattive per risparmiare sui costi
    - Onboarding degli sviluppatori in secondi invece che in giorni


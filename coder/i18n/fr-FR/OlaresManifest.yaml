metadata:
  title: Coder
  description: Environnements de développement cloud auto-hébergés
spec:
  upgradeDescription: |
    Remplacement de l'image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage Bitnami spécifique de `OPENRESTY_CONF_FILE`.

    **Journal des modifications**
    Améliorations des performances
    - Plafonner les requêtes count, utiliser des opérations UUID natives pour les journaux d'audit/conn (backport #23835) (#24129, 2f5d21d)

    Maintenance
    - Backport de la mise à niveau Go 1.25.8 vers release/2.31 (#23941, 2587364)
    - Backport des correctifs high et critical des dépendances Iron Bank (#24110, 960b8e7)

    Notes de version complètes : https://github.com/coder/coder/releases/tag/v2.31.9

  fullDescription: |
    Coder est un environnement de développement cloud open source et auto-hébergé qui fonctionne avec n'importe quel cloud, IDE, OS, fournisseur Git et IDP.

    Coder permet aux organisations de configurer des environnements de développement dans leur infrastructure cloud publique ou privée. Les environnements sont définis avec Terraform, connectés via un tunnel Wireguard® sécurisé haute vitesse, et arrêtés automatiquement lorsqu'ils ne sont pas utilisés pour réduire les coûts. Coder donne aux équipes d'ingénierie la flexibilité d'utiliser le cloud pour les charges les plus bénéfiques.

    - Définir des environnements de développement cloud dans Terraform
      - VMs EC2, pods Kubernetes, conteneurs Docker, etc.
    - Arrêt automatique des ressources inactives pour économiser
    - Intégrer les développeurs en quelques secondes plutôt qu'en plusieurs jours


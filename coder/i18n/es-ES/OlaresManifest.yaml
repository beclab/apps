metadata:
  title: Coder
  description: Entornos de desarrollo en la nube autoalojados
spec:
  upgradeDescription: |
    Cambiar la imagen del proxy inverso de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.

    **Registro de cambios**
    Mejoras de rendimiento
    - Limitar consultas count, usar operaciones UUID nativas para logs de auditoría/conexión (backport #23835) (#24129, 2f5d21d)

    Tareas de mantenimiento
    - Backport del bump de Go 1.25.8 a release/2.31 (#23941, 2587364)
    - Backport de correcciones high y critical de dependencias Iron Bank (#24110, 960b8e7)

    Notas de la versión completas: https://github.com/coder/coder/releases/tag/v2.31.9

  fullDescription: |
    Coder es un entorno de desarrollo en la nube autoalojado y de código abierto que funciona con cualquier nube, IDE, SO, proveedor Git e IDP.

    Coder permite a las organizaciones configurar entornos de desarrollo en su infraestructura de nube pública o privada. Los entornos se definen con Terraform, se conectan mediante un túnel Wireguard® seguro de alta velocidad y se apagan automáticamente cuando no se usan para ahorrar costes. Coder da a los equipos de ingeniería la flexibilidad de usar la nube para las cargas de trabajo más beneficiosas.

    - Defina entornos de desarrollo en la nube con Terraform
      - VMs EC2, pods de Kubernetes, contenedores Docker, etc.
    - Apague automáticamente recursos inactivos para ahorrar costes
    - Integre desarrolladores en segundos en lugar de días


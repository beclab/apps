metadata:
  title: Qwen3.6 35B A3B UD-KM (Ollama)
  description: "Qwen3.6 35B A3B MoE (Unsloth Dynamic UD-Q4_K_M) per inferenza locale multimodale"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Dopo l'installazione da parte di Olares Admin, tutti gli utenti del cluster possono utilizzarla tramite l'app di riferimento.
    Il traffico degli utenti passa attraverso il proxy verso Ollama.

    **MODELLO**
    Usa la quantizzazione Unsloth Dynamic da `unsloth/Qwen3.6-35B-A3B-GGUF` (`Qwen3.6-35B-A3B-UD-Q4_K_M.gguf` + `mmproj-F16.gguf`).
    La quantizzazione UD a precisione mista mantiene una qualità vicina a Q5_K_M e una velocità di decodifica prossima a Q4_K_M standard, conservando la visione completa (mmproj).
    Usa il modello di chat incorporato in GGUF per chiamate affidabili agli strumenti e input di immagini.

    Qwen3.6-35B-A3B è un modello Mixture-of-Experts: 35B parametri totali, con solo 3B attivati per token.
  upgradeDescription: |
    Runtime Ollama aggiornato a ollama/ollama:0.30.10.
    Proxy Olares API aggiornato a beclab/harveyff-olares-ollama:v0.1.22 (inoltro di image_url per OpenAI vision).

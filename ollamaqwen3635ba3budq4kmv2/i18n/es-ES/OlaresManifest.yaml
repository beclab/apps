metadata:
  title: Qwen3.6 35B A3B UD-KM (Ollama)
  description: "Qwen3.6 35B A3B MoE (Unsloth Dynamic UD-Q4_K_M) para inferencia local multimodal"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden utilizarla mediante la aplicación de referencia.
    El tráfico de los usuarios pasa por el proxy hacia Ollama.

    **MODELO**
    Usa la cuantización Unsloth Dynamic de `unsloth/Qwen3.6-35B-A3B-GGUF` (`Qwen3.6-35B-A3B-UD-Q4_K_M.gguf` + `mmproj-F16.gguf`).
    La cuantización UD de precisión mixta conserva una calidad cercana a Q5_K_M y mantiene el rendimiento de decodificación próximo al Q4_K_M estándar, conservando la visión completa (mmproj).
    Utiliza la plantilla de chat integrada en GGUF para llamadas fiables a herramientas y entrada de imágenes.

    Qwen3.6-35B-A3B es un modelo de mezcla de expertos: 35B parámetros totales, de los cuales solo 3B se activan por token.
  upgradeDescription: |
    Entorno de Ollama actualizado a ollama/ollama:0.30.10.
    Proxy de Olares API actualizado a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de OpenAI vision).

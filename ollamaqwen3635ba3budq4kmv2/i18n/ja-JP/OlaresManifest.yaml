metadata:
  title: Qwen3.6 35B A3B UD-KM (Ollama)
  description: "マルチモーダルなローカル推論向け Qwen3.6 35B A3B MoE（Unsloth Dynamic UD-Q4_K_M）"
spec:
  fullDescription: |
    **重要な注意**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内のすべてのユーザーが参照アプリを通じて利用できます。
    ユーザートラフィックはプロキシを経由して Ollama に送られます。

    **モデル**
    `unsloth/Qwen3.6-35B-A3B-GGUF` の Unsloth Dynamic 量子化（`Qwen3.6-35B-A3B-UD-Q4_K_M.gguf` + `mmproj-F16.gguf`）を使用します。
    混合精度 UD 量子化により、標準 Q4_K_M に近いデコードスループットを維持しながら Q5_K_M に近い品質を保ち、完全な画像認識（mmproj）も維持します。
    信頼性の高いツール呼び出しと画像入力のため、GGUF に埋め込まれたチャットテンプレートを使用します。

    Qwen3.6-35B-A3B は Mixture-of-Experts モデルです。総パラメーター数は 35B で、トークンごとに有効化されるのは 3B のみです。
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 に更新。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 に更新（OpenAI vision の image_url 転送）。

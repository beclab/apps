metadata:
  title: Qwen3.6 35B A3B UD-KM (Ollama)
  description: "Qwen3.6 35B A3B MoE (Unsloth Dynamic UD-Q4_K_M) für multimodale lokale Inferenz"
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsam genutzte App. Nach der Installation durch den Olares Admin können alle Benutzer im Cluster über die Referenz-App darauf zugreifen.
    Der Benutzerverkehr wird über den Proxy an Ollama weitergeleitet.

    **MODELL**
    Verwendet die Unsloth Dynamic-Quantisierung aus `unsloth/Qwen3.6-35B-A3B-GGUF` (`Qwen3.6-35B-A3B-UD-Q4_K_M.gguf` + `mmproj-F16.gguf`).
    Die UD-Quantisierung mit gemischter Präzision bewahrt eine Qualität nahe Q5_K_M, während der Dekodierungsdurchsatz nahe am standardmäßigen Q4_K_M bleibt und die vollständige Bildverarbeitung (mmproj) erhalten wird.
    Verwendet das in GGUF eingebettete Chat-Template für zuverlässige Tool-Aufrufe und Bildeingaben.

    Qwen3.6-35B-A3B ist ein Mixture-of-Experts-Modell: insgesamt 35B Parameter, von denen pro Token nur 3B aktiviert werden.
  upgradeDescription: |
    Ollama-Laufzeit auf ollama/ollama:0.30.10 aktualisiert.
    Olares API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisiert (Weiterleitung von OpenAI vision image_url).

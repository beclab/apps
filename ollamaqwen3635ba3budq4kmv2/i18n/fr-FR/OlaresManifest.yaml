metadata:
  title: Qwen3.6 35B A3B UD-KM (Ollama)
  description: "Qwen3.6 35B A3B MoE (Unsloth Dynamic UD-Q4_K_M) pour l’inférence locale multimodale"
spec:
  fullDescription: |
    **REMARQUE IMPORTANTE**
    Il s’agit d’une application partagée. Une fois installée par l’Olares Admin, tous les utilisateurs du cluster peuvent l’utiliser via l’application de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODÈLE**
    Utilise la quantification Unsloth Dynamic depuis `unsloth/Qwen3.6-35B-A3B-GGUF` (`Qwen3.6-35B-A3B-UD-Q4_K_M.gguf` + `mmproj-F16.gguf`).
    La quantification UD à précision mixte préserve une qualité proche de Q5_K_M tout en maintenant un débit de décodage proche du Q4_K_M standard, avec la vision complète (mmproj).
    Utilise le modèle de discussion intégré au GGUF pour des appels d’outils et des entrées d’images fiables.

    Qwen3.6-35B-A3B est un modèle à mélange d’experts : 35B paramètres au total, dont seulement 3B activés par jeton.
  upgradeDescription: |
    Mise à jour de l’environnement Ollama vers ollama/ollama:0.30.10.
    Mise à jour du proxy Olares API vers beclab/harveyff-olares-ollama:v0.1.22 (transfert de image_url pour OpenAI vision).

apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-audio-retention
  namespace: {{ .Release.Namespace }}
data:
  webui_retention.py: |
    """Own request files explicitly; never sweep legacy data or user inputs."""
    import contextvars
    import fcntl
    import hashlib
    import hmac
    import json
    import logging
    import os
    import re
    import shutil
    import tempfile
    import threading
    import time
    import uuid
    from pathlib import Path

    log = logging.getLogger('whisper.audio_retention')
    current_directory = contextvars.ContextVar('whisper_request_directory', default=None)
    MARKER = 'whisper-audio-request-v1'
    AUDIO_ROUTES = {
        '/speech-to-text', '/speech-to-text-url', '/service/transcribe',
        '/service/align', '/service/diarize', '/service/combine',
        '/v1/audio/transcriptions', '/v1/audio/translations', '/v1/audio/transcriptions/youtube',
    }

    class ManagedFiles:
        def __init__(self, root, retain=False, hours=24):
            self.root = Path(root).resolve()
            self.root.mkdir(parents=True, exist_ok=True)
            self.retain = retain
            self.seconds = float(hours) * 3600
            if not 3600 <= self.seconds <= 365 * 86400:
                raise ValueError('Audio retention must be between 1 and 8760 hours')
            self.last_cleanup = None

        def begin(self):
            directory = self.root / ('req-' + uuid.uuid4().hex)
            directory.mkdir(mode=0o700)
            if os.geteuid() == 0:
                os.chown(directory, 1000, 1000)
            lock = open(directory / '.active', 'x+b')
            fcntl.flock(lock, fcntl.LOCK_EX)
            (directory / '.managed.json').write_text(json.dumps({
                'kind': MARKER, 'created': time.time(), 'finished': None,
            }))
            return directory, lock

        def is_owned(self, path):
            directory = current_directory.get()
            path = Path(path)
            return directory is not None and not path.is_symlink() and path.resolve().parent == directory

        def release_loaded_files(self):
            if self.retain:
                return
            directory = current_directory.get()
            if directory is not None:
                for path in directory.iterdir():
                    if not path.name.startswith('.') and path.is_file() and not path.is_symlink():
                        path.unlink(missing_ok=True)

        def finish(self, directory, lock):
            try:
                if self.retain:
                    marker = directory / '.managed.json'
                    data = json.loads(marker.read_text())
                    data['finished'] = time.time()
                    pending = directory / '.managed.pending'
                    try:
                        pending.write_text(json.dumps(data))
                        pending.replace(marker)
                    except OSError:
                        log.exception('Could not update retention timestamp; original ownership marker preserved')
                else:
                    shutil.rmtree(directory)
            finally:
                lock.close()

        def inventory(self):
            count = size = active = 0
            for directory in self.root.iterdir():
                if directory.is_symlink() or not directory.is_dir() or not re.fullmatch(r'req-[0-9a-f]{32}', directory.name):
                    continue
                marker = directory / '.managed.json'
                if marker.is_symlink() or not marker.is_file():
                    continue
                try:
                    data = json.loads(marker.read_text())
                    if data.get('kind') != MARKER:
                        continue
                    flags = os.O_RDWR | os.O_NOFOLLOW
                    with os.fdopen(os.open(directory / '.active', flags), 'r+b') as lock:
                        try:
                            fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                        except BlockingIOError:
                            active += 1
                    for path in directory.iterdir():
                        if not path.name.startswith('.') and path.is_file() and not path.is_symlink():
                            count += 1
                            size += path.stat().st_size
                except (OSError, ValueError):
                    continue
            return {'files': count, 'bytes': size, 'active_requests': active}

        def cleanup(self, dry_run=True, hours=None):
            cutoff = time.time() - (self.seconds if hours is None else float(hours) * 3600)
            count = files = size = errors = 0
            for directory in list(self.root.iterdir()):
                if directory.is_symlink() or not directory.is_dir() or not re.fullmatch(r'req-[0-9a-f]{32}', directory.name):
                    continue
                marker = directory / '.managed.json'
                if marker.is_symlink() or not marker.is_file():
                    continue
                try:
                    with os.fdopen(os.open(directory / '.active', os.O_RDWR | os.O_NOFOLLOW), 'r+b') as lock:
                        try:
                            fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                        except BlockingIOError:
                            continue
                        data = json.loads(marker.read_text())
                        if data.get('kind') != MARKER:
                            continue
                        timestamp = data.get('finished') or data.get('created')
                        if not isinstance(timestamp, (float, int)) or timestamp > cutoff:
                            continue
                        candidates = [p for p in directory.iterdir() if not p.name.startswith('.') and p.is_file() and not p.is_symlink()]
                        candidate_bytes = sum(p.stat().st_size for p in candidates)
                        if not dry_run:
                            shutil.rmtree(directory)
                        count += 1
                        files += len(candidates)
                        size += candidate_bytes
                except (OSError, ValueError):
                    errors += 1
                    log.warning('Could not inspect a managed request directory', exc_info=True)
            result = {'dry_run': dry_run, 'directories': count, 'files': files, 'bytes': size, 'errors': errors}
            if not dry_run:
                self.last_cleanup = {'time': time.time(), **result}
            return result

    class RequestFilesMiddleware:
        def __init__(self, app, manager):
            self.app, self.manager = app, manager

        async def __call__(self, scope, receive, send):
            if scope['type'] != 'http' or scope.get('method') != 'POST' or scope.get('path', '').rstrip('/') not in AUDIO_ROUTES:
                return await self.app(scope, receive, send)
            directory, lock = self.manager.begin()
            token = current_directory.set(directory)
            try:
                await self.app(scope, receive, send)
            finally:
                try:
                    self.manager.finish(directory, lock)
                finally:
                    current_directory.reset(token)


    import functools
    import contextlib
    import inspect

    def install(api_app):
        """Share one request-file manager between Gradio callbacks and the API."""
        manager = ManagedFiles(
            os.getenv('AUDIO_REQUEST_DIR', '/request-data'),
            os.getenv('AUTO_DELETE_SOURCE_AUDIO', 'true').lower() == 'false',
            os.getenv('SOURCE_AUDIO_RETENTION_HOURS', '24'),
        )
        auto_cleanup = os.getenv('AUTO_CLEANUP_SOURCE_AUDIO', 'true').lower() != 'false'
        api_app.state.audio_storage = manager
        api_app.add_middleware(RequestFilesMiddleware, manager=manager)
        cache_root = Path(os.getenv('GRADIO_TEMP_DIR', '/tmp/gradio')).resolve()
        cache_users = {}
        audio_cache_sources = {}
        cache_mutex = threading.Lock()
        cache_inputs = contextvars.ContextVar('webui_cache_inputs', default=None)

        def is_cached_source(path):
            return not path.is_symlink() and cache_root in path.resolve().parents

        # Audio.preprocess can convert an uploaded recording before run() sees it.
        # Track that upload as well as the converted path, without touching originals
        # outside Gradio's dedicated cache.
        import gradio as gr
        original_preprocess = gr.Audio.preprocess
        @functools.wraps(original_preprocess)
        def preprocess_audio(self, payload):
            raw = getattr(payload, 'path', None)
            raw = Path(raw) if isinstance(raw, str) else None
            try:
                result = original_preprocess(self, payload)
            except Exception:
                if raw is not None and not manager.retain and is_cached_source(raw):
                    with cache_mutex:
                        if not cache_users.get(raw):
                            try:
                                raw.unlink(missing_ok=True)
                            except OSError:
                                log.exception('Could not release a failed recording upload')
                raise
            if raw is not None and isinstance(result, str) and is_cached_source(raw):
                with cache_mutex:
                    audio_cache_sources.setdefault(Path(result), set()).add(raw)
            return result
        preprocess_audio.__signature__ = inspect.signature(original_preprocess)
        gr.Audio.preprocess = preprocess_audio

        @contextlib.contextmanager
        def request_scope():
            # Nested callbacks and run() use the outer request's directory and lock.
            if current_directory.get() is not None:
                yield
                return
            directory, lock = manager.begin()
            token = current_directory.set(directory)
            inputs = set()
            cache_token = cache_inputs.set(inputs)
            try:
                yield
            finally:
                try:
                    if manager.retain and inputs:
                        marker = directory / '.managed.json'
                        metadata = json.loads(marker.read_text())
                        metadata['cache_sources'] = [str(path) for path in inputs]
                        pending = directory / '.cache-metadata.pending'
                        try:
                            pending.write_text(json.dumps(metadata))
                            pending.replace(marker)
                        except OSError:
                            log.exception('Could not record Gradio cache references; ownership marker preserved')
                    manager.finish(directory, lock)
                finally:
                    current_directory.reset(token)
                    cache_inputs.reset(cache_token)
                    with cache_mutex:
                        for path in inputs:
                            cache_users[path] -= 1
                            if cache_users[path] == 0:
                                cache_users.pop(path)
                                if not manager.retain and is_cached_source(path):
                                    try:
                                        path.unlink(missing_ok=True)
                                    except OSError:
                                        log.exception('Could not release a Gradio source cache file')

        original_cleanup = manager.cleanup
        def cleanup_with_cache(dry_run=True, hours=None):
            # Cache references are never allowed to escape this app's Gradio cache.
            references = []
            for directory in manager.root.iterdir():
                if directory.is_symlink() or not re.fullmatch(r'req-[0-9a-f]{32}', directory.name):
                    continue
                marker = directory / '.managed.json'
                if marker.is_symlink() or not marker.is_file():
                    continue
                try:
                    metadata = json.loads(marker.read_text())
                    if metadata.get('kind') == MARKER:
                        references.append((directory, metadata.get('cache_sources', [])))
                except (OSError, ValueError):
                    continue
            with cache_mutex:
                result = original_cleanup(dry_run, hours)
                if not dry_run:
                    for directory, sources in references:
                        if directory.exists():
                            continue  # Active, young, or failed-to-delete request.
                        for source in sources:
                            if not isinstance(source, str):
                                continue
                            path = Path(source)
                            if is_cached_source(path) and not cache_users.get(path):
                                try:
                                    path.unlink(missing_ok=True)
                                except OSError:
                                    result['errors'] += 1
                                    log.exception('Could not release an expired Gradio source cache file')
                    manager.last_cleanup = {'time': time.time(), **result}
                return result
        manager.cleanup = cleanup_with_cache

        def copy_input(audio):
            if not isinstance(audio, (str, os.PathLike)):
                return audio
            source = Path(audio)
            if manager.is_owned(source):
                return str(source)
            inputs = cache_inputs.get()
            with cache_mutex:
                # Keep the cache source until the last overlapping callback finishes.
                sources = {source} | audio_cache_sources.pop(source, set())
                for path in sources:
                    if inputs is not None and is_cached_source(path) and path not in inputs:
                        inputs.add(path)
                        cache_users[path] = cache_users.get(path, 0) + 1
                directory = current_directory.get()
                if manager.retain:
                    for raw in sources - {source}:
                        if is_cached_source(raw) and raw.is_file():
                            destination = directory / ('original-' + raw.name)
                            if destination.exists():
                                destination = directory / (uuid.uuid4().hex + '-' + raw.name)
                            with raw.open('rb') as incoming, destination.open('xb') as outgoing:
                                shutil.copyfileobj(incoming, outgoing)
                basename = source.name if not source.name.startswith('.') else 'audio' + source.suffix
                destination = directory / basename
                if destination.exists():
                    destination = directory / (uuid.uuid4().hex + '-' + basename)
                with source.open('rb') as incoming, destination.open('xb') as outgoing:
                    shutil.copyfileobj(incoming, outgoing)
                return str(destination)

        from modules.whisper.base_transcription_pipeline import BaseTranscriptionPipeline
        original_run = BaseTranscriptionPipeline.run
        @functools.wraps(original_run)
        def managed_run(self, audio, *args, **kwargs):
            with request_scope():
                return original_run(self, copy_input(audio), *args, **kwargs)
        BaseTranscriptionPipeline.run = managed_run

        for name in ('transcribe_file', 'transcribe_mic', 'transcribe_youtube'):
            original = getattr(BaseTranscriptionPipeline, name)
            def wrap(original):
                @functools.wraps(original)
                def callback(*args, **kwargs):
                    with request_scope():
                        return original(*args, **kwargs)
                # Gradio uses getfullargspec (which does not follow __wrapped__)
                # to inject gr.Progress without treating it as a UI input.
                callback.__signature__ = inspect.signature(original)
                return callback
            setattr(BaseTranscriptionPipeline, name, wrap(original))

        # Upstream's global modules/yt_tmp.wav races and ignores retention settings.
        from modules.utils import youtube_manager
        from modules.whisper import base_transcription_pipeline
        def download_youtube(yt):
            import subprocess
            directory = current_directory.get()
            if directory is None:
                raise RuntimeError('YouTube download requires an active managed request')
            raw = directory / 'youtube-source.webm'
            converted = directory / 'youtube-converted.wav'
            yt.streams.get_audio_only().download(output_path=str(directory), filename=raw.name)
            subprocess.run(['ffmpeg', '-y', '-i', str(raw), str(converted)], check=True, capture_output=True)
            return str(converted)
        youtube_manager.get_ytaudio = download_youtube
        base_transcription_pipeline.get_ytaudio = download_youtube
        # Its success-only unlink would bypass false/false retention.
        # Remove that one upstream unlink by replacing the function's global os
        # binding with a forwarding facade; other modules keep the real os module.
        class SourceOS:
            def __getattr__(self, name):
                return getattr(os, name)
            def remove(self, path, *args, **kwargs):
                if current_directory.get() is not None and manager.is_owned(path):
                    return  # The outer request owns deletion or retention.
                return os.remove(path, *args, **kwargs)
        # Module-scoped facade only affects upstream BaseTranscriptionPipeline helpers.
        base_transcription_pipeline.os = SourceOS()

        from fastapi import Header, HTTPException
        from pydantic import BaseModel, Field
        def authorize(authorization):
            expected = os.getenv('AUDIO_CLEANUP_TOKEN', '')
            provided = authorization.removeprefix('Bearer ') if authorization else ''
            if not expected or not hmac.compare_digest(provided.encode(), expected.encode()):
                raise HTTPException(403, 'Audio storage administration is disabled or the token is invalid')

        @api_app.get('/storage/audio', tags=['Audio storage'])
        def status(authorization: str = Header(default='')):
            authorize(authorization)
            return {'managed': manager.inventory(), 'auto_delete_source_audio': not manager.retain,
                    'auto_cleanup_source_audio': auto_cleanup, 'retention_hours': manager.seconds / 3600,
                    'last_cleanup': manager.last_cleanup, 'historical_outputs_excluded': True}

        class CleanupOptions(BaseModel):
            dry_run: bool = True
            older_than_hours: float = Field(default=manager.seconds / 3600, ge=1, le=8760)
        @api_app.post('/storage/audio/cleanup', tags=['Audio storage'])
        def cleanup(options: CleanupOptions, authorization: str = Header(default='')):
            authorize(authorization)
            return manager.cleanup(options.dry_run, options.older_than_hours)

        def sweep():
            while True:
                try:
                    manager.cleanup(dry_run=False)
                except Exception:
                    log.exception('Managed audio cleanup failed')
                time.sleep(3600)
        if auto_cleanup:
            threading.Thread(target=sweep, daemon=True, name='audio-cleanup').start()
        log.info('WebUI audio storage ready; auto_delete=%s auto_cleanup=%s', not manager.retain, auto_cleanup)
        return manager

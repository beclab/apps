metadata:
  title: Whisper-WebUI
  description: A Web UI for easy subtitle using whisper model.
spec:
  fullDescription: |
    **IMPORTANT NOTE**
    This is a shared app. Only one service will be installed across the entire Olares system.

    **PREREQUISITES**
    Configure **HF_TOKEN** and **HF_ENDPOINT** before installing. The admin token must have accepted the terms for:
    - `pyannote/speaker-diarization-3.1`
    - `pyannote/segmentation-3.0`

    llm-init pre-downloads: `Systran/faster-whisper-large-v2`, `pyannote/speaker-diarization-3.1`, `pyannote/segmentation-3.0`.

    **PERFORMANCE NOTE**
    The first transcription after install may take noticeably longer while models are loaded into GPU memory; subsequent requests are faster.

    **OVERVIEW**
    A Gradio-based browser interface for Whisper. You can use it as an Easy Subtitle Generator!

    **Features**
    Select the Whisper implementation you want to use between :
    - openai/whisper
    - SYSTRAN/faster-whisper (used by default)
    - Vaibhavs10/insanely-fast-whisper

    Generate subtitles from various sources, including :
    - Files
    - Youtube
    - Microphone

    Currently supported subtitle formats :
    - SRT
    - WebVTT
    - txt ( only text file without timeline )

    Speech to Text Translation
    - From other languages to English. ( This is Whisper's end-to-end speech-to-text translation feature )

    Text to Text Translation
    - Translate subtitle files using Facebook NLLB models
    - Translate subtitle files using DeepL API

    Pre-processing audio input with Silero VAD.

    Pre-processing audio input to separate BGM with UVR.

    Post-processing with speaker diarization using the pyannote model

  upgradeDescription: |
    Fix HF cache symlink path (chart 1.1.12).

    Engine startup used `tr '/' '--'` to build Hugging Face hub dir names, but
    `tr` maps characters one-to-one, so the second `-` was dropped. The lookup
    became `models--org-repo` instead of `models--org--repo`, every `link_repo`
    missed the cache, and logs showed three `[warn] missing HF cache dir` lines
    even though llm-init had already downloaded the models. Existing HF cache
    is reused — this does not re-download weights.

    Change Details:
    - Replace `tr '/' '--'` with `sed 's|/|--|g'` so softlinks under
      `/Whisper-WebUI/models/...` point at the real HF hub dirs.

    v1.1.11: Lightweight `/__entrance_ready` probe (no Gradio homepage GET).
    v1.1.10: Switch reverse-proxy to official OpenResty `1.29.2.5-bookworm-fat`.

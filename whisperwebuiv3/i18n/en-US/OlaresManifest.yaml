metadata:
  title: Whisper-WebUI
  description: A Web UI for easy subtitle using whisper model.
spec:
  fullDescription: |
    **IMPORTANT NOTE**
    This is a shared app. Only one service will be installed across the entire Olares system.

    **PREREQUISITES**
    Configure **HF_TOKEN** and **HF_ENDPOINT** before installing. The admin token must have accepted the terms for:
    - `pyannote/speaker-diarization-3.1`
    - `pyannote/segmentation-3.0`

    llm-init pre-downloads: `Systran/faster-whisper-large-v2`, `pyannote/speaker-diarization-3.1`, `pyannote/segmentation-3.0`.

    **PERFORMANCE NOTE**
    The first transcription after install may take noticeably longer while models are loaded into GPU memory; subsequent requests are faster.

    **OVERVIEW**
    A Gradio-based browser interface for Whisper. You can use it as an Easy Subtitle Generator!

    **Features**
    Select the Whisper implementation you want to use between :
    - openai/whisper
    - SYSTRAN/faster-whisper (used by default)
    - Vaibhavs10/insanely-fast-whisper

    Generate subtitles from various sources, including :
    - Files
    - Youtube
    - Microphone

    Currently supported subtitle formats :
    - SRT
    - WebVTT
    - txt ( only text file without timeline )

    Speech to Text Translation
    - From other languages to English. ( This is Whisper's end-to-end speech-to-text translation feature )

    Text to Text Translation
    - Translate subtitle files using Facebook NLLB models
    - Translate subtitle files using DeepL API

    Pre-processing audio input with Silero VAD.

    Pre-processing audio input to separate BGM with UVR.

    Post-processing with speaker diarization using the pyannote model

    **Audio deletion and retention**

    AUTO_DELETE_SOURCE_AUDIO=true removes managed uploads, URL downloads, and converted audio after processing, including failed requests. AUTO_CLEANUP_SOURCE_AUDIO=true checks hourly and removes expired retained files and abandoned requests, while skipping active requests. SOURCE_AUDIO_RETENTION_HOURS defaults to 24 (whole hours, 1–8760); the age starts at request completion, or folder creation for abandoned requests. This retention period does not delay immediate deletion.

    To keep audio for 7 days, set AUTO_DELETE_SOURCE_AUDIO=false, AUTO_CLEANUP_SOURCE_AUDIO=true, and SOURCE_AUDIO_RETENTION_HOURS=168. Set both switches to false for indefinite retention. Re-enabling cleanup can delete previously retained expired files; changing settings cannot restore deleted files.

    AUDIO_CLEANUP_TOKEN is an optional secret for GET /storage/audio and POST /storage/audio/cleanup. Leave it empty to disable these endpoints. Send Authorization: Bearer <token> to use them. Manual cleanup defaults to preview (dry_run=true); dry_run=false deletes eligible files even when automatic cleanup is disabled. Keep this token private.

    Originals on your device or in a selected input folder, subtitles, explicitly saved separated audio, models, settings, and historical outputs are preserved. Processed Gradio input cache copies are removed when deletion is enabled; upload again to rerun a deleted input. Unsubmitted Gradio uploads are temporary and do not survive an app stop or restart, regardless of request retention settings.

  upgradeDescription: |
    v1.1.23: Improve compatibility when upgrading existing installations.

    v1.1.22: Upgrade Whisper-WebUI to 1.0.8; add configurable request audio deletion and retention, protected cleanup, and NVIDIA GPU requirements. Preserve subtitles, selected-folder originals, settings, and historical outputs.

    v1.1.21: Model Console (llm-init) updated to v1.7.21.

    Fix HF cache symlink path (chart 1.1.12).

    Engine startup used `tr '/' '--'` to build Hugging Face hub dir names, but
    `tr` maps characters one-to-one, so the second `-` was dropped. The lookup
    became `models--org-repo` instead of `models--org--repo`, every `link_repo`
    missed the cache, and logs showed three `[warn] missing HF cache dir` lines
    even though llm-init had already downloaded the models. Existing HF cache
    is reused — this does not re-download weights.

    Change Details:
    - Replace `tr '/' '--'` with `sed 's|/|--|g'` so softlinks under
      `/Whisper-WebUI/models/...` point at the real HF hub dirs.

    v1.1.11: Lightweight `/__entrance_ready` probe (no Gradio homepage GET).
    v1.1.10: Switch reverse-proxy to official OpenResty `1.29.2.5-bookworm-fat`.

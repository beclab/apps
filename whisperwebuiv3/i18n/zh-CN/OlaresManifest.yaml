metadata:
  title: Whisper-WebUI
  description: 基于 whisper 模型的 Web 界面，可轻松生成字幕。
spec:
  fullDescription: |
    **使用须知**
    该应用为共享应用，在 Olares 内部仅会部署一个服务。

    **前置条件**
    安装前请配置 **HF_TOKEN** 和 **HF_ENDPOINT**。管理员 Token 须已在 Hugging Face 接受以下受限仓库条款：
    - `pyannote/speaker-diarization-3.1`
    - `pyannote/segmentation-3.0`

    llm-init 预下载：`Systran/faster-whisper-large-v2`、`pyannote/speaker-diarization-3.1`、`pyannote/segmentation-3.0`。

    **性能说明**
    安装后首次转写可能较慢（模型载入 GPU），后续请求会更快。

    **应用概览**
    基于 Gradio 的 Whisper 浏览器界面。您可以将其用作简易字幕生成器！

    **功能亮点**
    选择您想要使用的 Whisper 实现：
    - openai/whisper
    - SYSTRAN/faster-whisper（默认使用）
    - Vaibhavs10/insanely-fast-whisper

    从各种来源生成字幕，包括：
    - 文件
    - YouTube
    - 麦克风录音

    目前支持的字幕格式：
    - SRT
    - WebVTT
    - txt（仅限文本文件，无时间线）

    语音转文本
    - 从其他语言到英语（使用 Whisper 的端到端语音转文本翻译功能）

    文本转文本翻译
    - 使用 Facebook NLLB 模型翻译字幕文件
    - 使用 DeepL API 翻译字幕文件

    使用 Silero VAD 预处理音频输入。

    使用 UVR 预处理音频输入以分离背景音乐。

    使用 pyannote 模型进行说话人区分后处理

  upgradeDescription: |
    修复 HF 缓存软链路径（Chart 1.1.12）。

    引擎启动用 `tr '/' '--'` 拼 Hugging Face hub 目录名，但 `tr` 是逐字符映射，
    第二个 `-` 会被丢弃，实际查的是 `models--org-repo` 而非 `models--org--repo`。
    三个 `link_repo` 全部 miss，日志出现三条 `[warn] missing HF cache dir`，
    而 llm-init 其实已经下完模型。沿用已有 HF 缓存，不会重新下载权重。

    变更详情：
    - 将 `tr '/' '--'` 改为 `sed 's|/|--|g'`，使 `/Whisper-WebUI/models/...`
      下的软链指向真实 HF hub 目录。

    v1.1.11: 轻量 `/__entrance_ready` 探针（不再 GET Gradio 首页）。
    v1.1.10: 反向代理切换为官方 OpenResty `1.29.2.5-bookworm-fat`。

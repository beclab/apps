metadata:
  title: Gemma-4-12B (vLLM)
  description: "Gemma-4-12B (AWQ-INT4) bereitgestellt mit vLLM"
spec:
  upgradeDescription: |
    v1.0.24: Model Console (llm-init) wurde auf v1.7.21 aktualisiert.

    v1.0.23: Model Console wird auf llm-init v1.7.19 aktualisiert.

    v1.0.16: NVIDIA-Host-Speicherreservierung gesenkt, damit 1.12.6 Timeslice-Nodes leichter installieren können (Engine-Request 21Gi→6Gi, Chart requiredMemory 22Gi→7Gi). GPU-Quote unverändert.

    v1.0.12: ENGINE_ARGS verwendet die gemma4 Tool-Call- und Reasoning-Parser.

    v1.0.11: llm-init auf v1.3.5 aktualisiert.
    v1.0.10: `HF_TOKEN` in Kubernetes Secret (`secretKeyRef`) verschoben; HF-Env von `OLARES_SYSTEM_HUGGINGFACE_*` gemappt.

    v1.0.9: vLLM-Engine erhält Umgebungsvariable HF_HUB_CACHE für den gemeinsamen HF-Hub-Cache.
    v1.0.8: VLLM_MEMORY_LIMIT 30Gi; llm-init Limit 2Gi; limitedMemory 32Gi (30+2).
    v1.0.7: nvidia Host-Speicher — requiredMemory 22Gi, VLLM_MEMORY_REQUEST 21Gi, VLLM_MEMORY_LIMIT 26Gi, limitedMemory 30Gi.
    v1.0.6: nvidia Host-Speicher — requiredMemory 16Gi, VLLM_MEMORY_REQUEST 15Gi, VLLM_MEMORY_LIMIT 19Gi, limitedMemory 26Gi.
    v1.0.5: llm-init auf v1.3.1 aktualisiert.
  fullDescription: |
    **Modellübersicht**
    Gemma-4-12B-it ist ein instruction-tuned Vision-Language-Modell aus Googles Gemma-4-Familie. Es unterstützt multimodales Verständnis, Thinking, Tool Calling und Vision. Diese App stellt die `AWQ-INT4`-quantisierten Gewichte von `cyankiwi/gemma-4-12B-it-AWQ-INT4` über vLLM bereit.

    Gut geeignet für multimodale Aufgaben, die Text und Bilder kombinieren. Gemma-4-Modelle sind für breites multimodales Verständnis über Vision und Sprache ausgelegt.

    **Voreingestellte Konfiguration**
    - Modell: `cyankiwi/gemma-4-12B-it-AWQ-INT4`
    - Fähigkeiten: thinking, tools, vision
    - Engine-Args: `--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --tool-call-parser gemma4 --reasoning-parser gemma4 --enable-prefix-caching --enable-auto-tool-choice`
    - Erforderlicher GPU-Speicher: `23Gi`

    **Accelerator-Modi**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Nutzt `23Gi` GPU-Speicher; `--gpu-memory-utilization` in ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Wie `nvidia`: `23Gi` GPU-Speicher; `--gpu-memory-utilization` in ENGINE_ARGS |

    **So funktioniert es**
    Zuerst lädt die Model Console das Modell herunter und bereitet es vor, dann startet vLLM die Bereitstellung, sobald es bereit ist. Beide Container laufen im selben Pod und teilen Modellverzeichnis und Readiness-Sentinel.

    **Stack**
    - **vLLM** (Port 8000): führt das Modell aus und bedient API-Anfragen
    - **Model Console** (Port 8090): lädt das Modell herunter, zeigt den Fortschritt und stellt die OpenAI-API bereit, mit Proxy zu vLLM

    **Modellspeicher**
    Alle Modelldateien liegen in einem gemeinsamen Ordner unter `appCommon/huggingface`, gemountet als `/cache/hf/hub`. Alle ähnlichen Apps nutzen diesen Ort für Modelle.

options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
  - envName: ENABLE_HW_ACCEL
    type: bool
    default: 'false'
    required: false
    editable: true
    applyOnChange: true
    description: |
      **Olares 12.6 only.** Enable Intel/AMD iGPU hw transcoding on **cpu** install: mounts /dev/dri, supplementalGroups, privileged. On Olares **12.7+**, install with **intel** or **amd** accelerator instead — this env is ignored when gpu-inject is active.
      Host must expose /dev/dri. Set VIDEO_GID and RENDER_GID from the host if not on Olares One.
  - envName: VIDEO_GID
    type: int
    default: '44'
    required: false
    editable: true
    applyOnChange: true
    description: |
      **Olares 12.6 legacy path only** (when ENABLE_HW_ACCEL=true). GID of the host "video" group for /dev/dri/card*. Run `getent group video` on the host.
  - envName: RENDER_GID
    type: int
    default: '994'
    required: false
    editable: true
    applyOnChange: true
    description: |
      **Olares 12.6 legacy path only** (when ENABLE_HW_ACCEL=true). GID of the host "render" group for /dev/dri/renderD*. Run `getent group render` on the host.

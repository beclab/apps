olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: concat
  title: Concat
  description: Free, open-source video editing with an optional API and MCP bridge.
  icon: https://cdn.olares.com/images/2026/09/ab76a2eb1f91773844b5d97728d0f22d.png
  version: 0.2.5
  categories: [Creativity, workspace]
entrances:
  - name: concat
    host: concat
    port: 3000
    title: Concat
    icon: https://cdn.olares.com/images/2026/09/ab76a2eb1f91773844b5d97728d0f22d.png
    openMethod: window
    authLevel: private
  - name: concatapi
    host: concat
    port: 8080
    title: Concat API
    icon: https://cdn.olares.com/images/2026/09/ab76a2eb1f91773844b5d97728d0f22d.png
    authLevel: internal
    invisible: true
spec:
  versionName: "0.2.2"
  featuredImage: https://cdn.olares.com/images/2026/09/568f58a50c106148c3dd06a9477898f6.png
  promoteImage:
    - https://cdn.olares.com/images/2026/09/568f58a50c106148c3dd06a9477898f6.png
    - https://cdn.olares.com/images/2026/09/37cd0feac499ca36a7397bc2d54995f4.png
  fullDescription: |
    Concat is a free, open-source video editor. This Olares package runs the
    native editor in a browser-accessible desktop on your Olares device.

    Build edits with multiple video, audio and title tracks. Trim and arrange
    clips, add transitions, animate properties with keyframes, and export MP4.
    Noto CJK fonts are included for Chinese titles.

    An optional authenticated HTTP API and MCP bridge lets compatible clients
    create and edit projects, render previews and export videos. Automated
    editing temporarily pauses the desktop editor to avoid concurrent writes.

    Projects and exports are stored in Files > Home > Documents > Concat.
    The API entrance is internal and requires an application bearer token.

    This package includes Concat 0.2.2 Beta. Only amd64 is supported. Rendering
    uses the CPU; large projects may need additional memory and rendering time.
  developer: jub0t
  website: https://github.com/jub0t/Concat
  sourceCode: https://github.com/jub0t/Concat
  submitter: Olares
  locale: [en-US, zh-CN, de-DE, es-ES, it-IT, fr-FR, ja-JP]
  accelerator:
    - mode: cpu
      requiredCpu: "500m"
      limitedCpu: "4"
      requiredMemory: 2Gi
      limitedMemory: 8Gi
      requiredDisk: 4Gi
      limitedDisk: 20Gi
  supportArch: [amd64]
permission:
  appData: true
  userData: [Home]
workloadReplicas:
  concat: 1
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.7-0'

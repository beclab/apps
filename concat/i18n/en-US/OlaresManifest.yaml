metadata:
  title: Concat
  description: Free, open-source video editing with an optional API and MCP bridge.

spec:
  fullDescription: |
    Concat is a free, open-source video editor. This Olares package runs the
    native editor in a browser-accessible desktop on your Olares device.

    Build edits with multiple video, audio and title tracks. Trim and arrange
    clips, add transitions, animate properties with keyframes, and export MP4.
    Noto CJK fonts are included for Chinese titles.

    An optional authenticated HTTP API and MCP bridge lets compatible clients
    create and edit projects, render previews and export videos. Automated
    editing temporarily pauses the desktop editor to avoid concurrent writes.

    Projects and exports are stored in Files > Home > Documents > Concat.
    The API entrance is internal and requires an application bearer token.

    This package includes Concat 0.2.2 Beta. Only amd64 is supported. Rendering
    uses the CPU; large projects may need additional memory and rendering time.

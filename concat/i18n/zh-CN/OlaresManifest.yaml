metadata:
  title: Concat
  description: 免费开源的视频编辑器，支持可选的 API 和 MCP 自动化剪辑。

spec:
  fullDescription: |
    Concat 是一款免费开源的视频编辑器。本 Olares 应用在你的设备上运行原生
    编辑器，并提供可通过浏览器访问的桌面界面。

    使用多条视频、音频和标题轨道进行剪辑，裁剪和排列片段，添加转场，
    通过关键帧制作动画，并导出 MP4 视频。应用内置 Noto CJK 字体，支持中文标题。

    可选的 HTTP API 和 MCP 接口支持兼容客户端创建和编辑工程、渲染预览及导出
    视频。接口需要身份验证；自动化编辑期间会暂时暂停桌面编辑器，避免同时写入。

    工程和导出文件保存在文件应用的 Home > Documents > Concat 目录中。
    API 入口为内部访问级别，调用时还需提供应用的 Bearer Token。

    本应用包含 Concat 0.2.2 Beta，目前仅支持 amd64。渲染使用 CPU，
    较大的工程可能需要更多内存和更长的渲染时间。

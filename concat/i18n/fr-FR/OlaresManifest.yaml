metadata:
  title: Concat
  description: Éditeur vidéo gratuit et open source avec API et intégration MCP facultatives.

spec:
  fullDescription: |
    Concat est un éditeur vidéo gratuit et open source. Ce paquet Olares exécute
    l'éditeur natif sur votre appareil Olares dans un environnement de bureau
    accessible depuis un navigateur.

    Réalisez vos montages avec plusieurs pistes vidéo, audio et de titres.
    Coupez et organisez les clips, ajoutez des transitions, animez les propriétés
    à l'aide d'images clés et exportez au format MP4. Les polices Noto CJK sont
    incluses pour les titres en chinois.

    Une API HTTP et une intégration MCP facultatives, avec authentification,
    permettent aux clients compatibles de créer et de modifier des projets,
    de générer des aperçus et d'exporter des vidéos. Le montage automatisé met
    temporairement en pause l'éditeur de bureau afin d'éviter les écritures
    simultanées.

    Les projets et les exports sont enregistrés dans Files > Home > Documents >
    Concat. L'accès à l'API est interne et nécessite un jeton Bearer de
    l'application.

    Ce paquet contient Concat 0.2.2 Beta. Seule l'architecture amd64 est prise
    en charge. Le rendu utilise le processeur ; les projets volumineux peuvent
    nécessiter davantage de mémoire et de temps de rendu.

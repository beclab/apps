metadata:
  title: Concat
  description: Editor de vídeo gratuito y de código abierto con API e integración MCP opcionales.

spec:
  fullDescription: |
    Concat es un editor de vídeo gratuito y de código abierto. Este paquete de
    Olares ejecuta el editor nativo en tu dispositivo Olares y ofrece un
    escritorio accesible desde el navegador.

    Edita con varias pistas de vídeo, audio y títulos. Recorta y organiza clips,
    añade transiciones, anima propiedades con fotogramas clave y exporta a MP4.
    Se incluyen fuentes Noto CJK para títulos en chino.

    La API HTTP y la integración MCP opcionales, con autenticación, permiten
    que los clientes compatibles creen y editen proyectos, generen vistas
    previas y exporten vídeos. Durante la edición automatizada, el editor de
    escritorio se pausa temporalmente para evitar escrituras simultáneas.

    Los proyectos y las exportaciones se guardan en Files > Home > Documents >
    Concat. El acceso a la API es interno y requiere un token Bearer de la
    aplicación.

    Este paquete incluye Concat 0.2.2 Beta. Solo es compatible con amd64. El
    renderizado utiliza la CPU; los proyectos grandes pueden necesitar más
    memoria y tiempo de renderizado.

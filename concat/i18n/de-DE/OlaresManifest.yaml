metadata:
  title: Concat
  description: Kostenloser, quelloffener Videoeditor mit optionaler API und MCP-Anbindung.

spec:
  fullDescription: |
    Concat ist ein kostenloser, quelloffener Videoeditor. Dieses Olares-Paket
    führt den nativen Editor auf Ihrem Olares-Gerät aus und stellt den Desktop
    über den Browser bereit.

    Bearbeiten Sie Videos mit mehreren Video-, Audio- und Titelspuren. Kürzen
    und ordnen Sie Clips, fügen Sie Übergänge hinzu, animieren Sie Eigenschaften
    mit Keyframes und exportieren Sie MP4-Dateien. Noto-CJK-Schriften für
    chinesische Titel sind enthalten.

    Eine optionale HTTP-API und MCP-Anbindung mit Authentifizierung ermöglicht
    kompatiblen Clients, Projekte zu erstellen und zu bearbeiten, Vorschaubilder
    zu rendern und Videos zu exportieren. Bei automatisierter Bearbeitung wird
    der Desktop-Editor vorübergehend pausiert, um gleichzeitige Schreibzugriffe
    zu vermeiden.

    Projekte und Exporte werden in Files > Home > Documents > Concat gespeichert.
    Der API-Zugang ist intern und erfordert ein Bearer-Token der Anwendung.

    Dieses Paket enthält Concat 0.2.2 Beta. Nur amd64 wird unterstützt. Das
    Rendering erfolgt auf der CPU; große Projekte benötigen möglicherweise
    zusätzlichen Arbeitsspeicher und mehr Zeit zum Rendern.

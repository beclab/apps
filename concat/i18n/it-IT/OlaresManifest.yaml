metadata:
  title: Concat
  description: Editor video gratuito e open source con API e integrazione MCP opzionali.

spec:
  fullDescription: |
    Concat è un editor video gratuito e open source. Questo pacchetto Olares
    esegue l'editor nativo sul dispositivo Olares e offre un ambiente desktop
    accessibile dal browser.

    Crea montaggi con più tracce video, audio e titoli. Taglia e organizza le
    clip, aggiungi transizioni, anima le proprietà con i fotogrammi chiave ed
    esporta in MP4. Sono inclusi i font Noto CJK per i titoli in cinese.

    L'API HTTP e l'integrazione MCP opzionali, con autenticazione, consentono ai
    client compatibili di creare e modificare progetti, generare anteprime ed
    esportare video. Durante il montaggio automatizzato, l'editor desktop viene
    temporaneamente sospeso per evitare scritture simultanee.

    I progetti e le esportazioni vengono salvati in Files > Home > Documents >
    Concat. L'accesso all'API è interno e richiede un token Bearer
    dell'applicazione.

    Questo pacchetto include Concat 0.2.2 Beta. È supportata solo l'architettura
    amd64. Il rendering utilizza la CPU; i progetti di grandi dimensioni possono
    richiedere più memoria e più tempo per il rendering.

metadata:
  title: Concat
  description: 無料でオープンソースの動画編集アプリ。オプションの API と MCP 連携に対応。

spec:
  fullDescription: |
    Concat は無料でオープンソースの動画編集アプリです。この Olares パッケージは、
    Olares デバイス上でネイティブエディターを実行し、ブラウザーから操作できる
    デスクトップ環境を提供します。

    複数の動画・音声・タイトルのトラックを使って編集できます。クリップのトリミングや
    並べ替え、トランジションの追加、キーフレームによるアニメーション、MP4 への
    書き出しに対応しています。中国語のタイトル用に Noto CJK フォントを同梱しています。

    オプションの認証付き HTTP API と MCP 連携により、対応クライアントからプロジェクトの
    作成・編集、プレビューのレンダリング、動画の書き出しを行えます。自動編集の間は、
    同時書き込みを防ぐためにデスクトップエディターが一時停止します。

    プロジェクトと書き出したファイルは Files > Home > Documents > Concat に保存されます。
    API の入口は内部アクセス用で、アプリの Bearer トークンも必要です。

    このパッケージには Concat 0.2.2 Beta が含まれています。対応アーキテクチャは amd64
    のみです。レンダリングには CPU を使用するため、大きなプロジェクトではより多くの
    メモリとレンダリング時間が必要になる場合があります。

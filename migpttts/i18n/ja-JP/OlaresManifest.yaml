metadata:
  title: MiGPT-TTS
  description: MiGPT 向け TTS モジュール
spec:
  fullDescription: |
    MiGPT-TTS は MiGPT 用の TTS モジュールで、Volcano Engine、Microsoft Bing、OpenAI などの TTS サービスに対応します。
    
    デフォルトの SECRET_PATH : Olares2024@
    
    **使い方**
    https://github.com/idootop/mi-gpt-tts/blob/main/docs/api.md
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty
    （`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ
    `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト
    （`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、
    Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。

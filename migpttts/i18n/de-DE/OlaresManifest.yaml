metadata:
  title: MiGPT-TTS
  description: TTS-Modul für MiGPT
spec:
  fullDescription: |
    MiGPT-TTS ist ein TTS-Modul für MiGPT und unterstützt TTS-Dienste wie Volcano Engine, Microsoft Bing, OpenAI usw.
    
    Standard-SECRET_PATH : Olares2024@
    
    **Verwendung**
    https://github.com/idootop/mi-gpt-tts/blob/main/docs/api.md
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty
    (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image
    `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images
    (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`)
    und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.

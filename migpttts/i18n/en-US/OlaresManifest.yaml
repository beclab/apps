metadata:
  title: MiGPT-TTS
  description: TTS module for MiGPT
spec:
  fullDescription: |
    MiGPT-TTS is a TTS module for MiGPT, supporting TTS services such as Volcano Engine, Microsoft Bing, OpenAI, etc.

    Default SECRET_PATH : Olares2024@
    
    **How to use**
    https://github.com/idootop/mi-gpt-tts/blob/main/docs/api.md

  upgradeDescription: |
    Switch the reverse-proxy image from Bitnami OpenResty
    (`beclab/aboveos-bitnami-openresty:1.25.3-2`) to the official OpenResty image
    `openresty/openresty:1.29.2.5-bookworm-fat`.

    Align nginx config mounts and log paths with the official image layout
    (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`),
    and drop Bitnami-specific `OPENRESTY_CONF_FILE` wiring.

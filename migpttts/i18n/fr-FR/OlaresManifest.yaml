metadata:
  title: MiGPT-TTS
  description: Module TTS pour MiGPT
spec:
  fullDescription: |
    MiGPT-TTS est un module TTS pour MiGPT prenant en charge des services TTS tels que Volcano Engine, Microsoft Bing, OpenAI, etc.
    
    SECRET_PATH par défaut : Olares2024@
    
    **Utilisation**
    https://github.com/idootop/mi-gpt-tts/blob/main/docs/api.md
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty
    (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty
    `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle
    (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`),
    et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.

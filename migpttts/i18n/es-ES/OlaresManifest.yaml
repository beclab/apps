metadata:
  title: MiGPT-TTS
  description: Módulo TTS para MiGPT
spec:
  fullDescription: |
    MiGPT-TTS es un módulo TTS para MiGPT que admite servicios TTS como Volcano Engine, Microsoft Bing, OpenAI, etc.
    
    SECRET_PATH predeterminado : Olares2024@
    
    **Cómo usarlo**
    https://github.com/idootop/mi-gpt-tts/blob/main/docs/api.md
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty
    (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty
    `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial
    (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`),
    y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.

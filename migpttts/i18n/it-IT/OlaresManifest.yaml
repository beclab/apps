metadata:
  title: MiGPT-TTS
  description: Modulo TTS per MiGPT
spec:
  fullDescription: |
    MiGPT-TTS è un modulo TTS per MiGPT che supporta servizi TTS come Volcano Engine, Microsoft Bing, OpenAI, ecc.
    
    SECRET_PATH predefinito : Olares2024@
    
    **Come usarlo**
    https://github.com/idootop/mi-gpt-tts/blob/main/docs/api.md
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty
    (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty
    `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale
    (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`)
    e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.

metadata:
  title: RNA Sequencing
  description: Un flusso di lavoro end-to-end su GPU per scRNA-seq con RAPIDS
spec:
  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), e rimuovere il cablaggio specifico Bitnami di `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Il sequenziamento RNA a cellula singola (scRNA-seq) consente ai ricercatori di studiare l'attività genica in ogni cellula separatamente, rivelando variazione, tipi cellulari e stati cellulari che i metodi bulk nascondono. Ma questi grandi dataset ad alta dimensionalità richiedono molta potenza di calcolo.
    
    Questo playbook mostra un flusso di lavoro end-to-end su GPU per scRNA-seq usando RAPIDS-singlecell, una libreria basata su RAPIDS nell'ecosistema scverse®. Segue la familiare API Scanpy e consente ai ricercatori di eseguire i passaggi di preprocessamento dei dati, controllo qualità (QC) e pulizia, visualizzazione e indagine più velocemente degli strumenti CPU lavorando con matrici di conteggio sparse direttamente sulla GPU.
    
    Link al playbook: https://build.nvidia.com/spark/single-cell

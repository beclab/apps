metadata:
  title: RNA Sequencing
  description: Ein durchgängiger GPU-gestützter Workflow für scRNA-seq mit RAPIDS
spec:
  upgradeDescription: |
    Wechsel des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Nginx-Konfigurations-Mounts und Log-Pfade an das offizielle Image-Layout anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.
  fullDescription: |
    Einzelzell-RNA-Sequenzierung (scRNA-seq) ermöglicht es Forschern, die Genaktivität in jeder Zelle einzeln zu untersuchen und Variation, Zelltypen und Zellzustände freizulegen, die Bulk-Methoden verbergen. Doch diese großen, hochdimensionalen Datensätze erfordern starke Rechenleistung.
    
    Dieses Playbook zeigt einen durchgängigen GPU-gestützten Workflow für scRNA-seq mit RAPIDS-singlecell, einer RAPIDS-basierten Bibliothek im scverse®-Ökosystem. Es folgt der vertrauten Scanpy-API und lässt Forscher die Schritte Daten-Vorverarbeitung, Qualitätskontrolle (QC) und Bereinigung, Visualisierung und Untersuchung schneller als CPU-Tools ausführen, indem spärliche Zählmatrizen direkt auf der GPU verarbeitet werden.
    
    Playbook-Link: https://build.nvidia.com/spark/single-cell

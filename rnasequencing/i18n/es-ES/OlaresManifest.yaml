metadata:
  title: RNA Sequencing
  description: Un flujo de trabajo de extremo a extremo impulsado por GPU para scRNA-seq con RAPIDS
spec:
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alinear los montajes de configuración de nginx y las rutas de logs con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    La secuenciación de ARN unicelular (scRNA-seq) permite a los investigadores estudiar la actividad génica de cada célula por separado, revelando variación, tipos celulares y estados celulares que los métodos a granel ocultan. Pero estos conjuntos de datos grandes y de alta dimensión requieren mucha computación.
    
    Este playbook muestra un flujo de trabajo de extremo a extremo impulsado por GPU para scRNA-seq usando RAPIDS-singlecell, una biblioteca impulsada por RAPIDS en el ecosistema scverse®. Sigue la familiar API de Scanpy y permite a los investigadores ejecutar los pasos de preprocesamiento de datos, control de calidad (QC) y limpieza, visualización e investigación más rápido que las herramientas de CPU al trabajar con matrices de conteo dispersas directamente en la GPU.
    
    Enlace del playbook: https://build.nvidia.com/spark/single-cell

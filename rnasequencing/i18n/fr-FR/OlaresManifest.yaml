metadata:
  title: RNA Sequencing
  description: Un flux de travail de bout en bout accéléré par GPU pour le scRNA-seq avec RAPIDS
spec:
  upgradeDescription: |
    Remplacer l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Aligner les montages de configuration nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Le séquençage d'ARN unicellulaire (scRNA-seq) permet aux chercheurs d'étudier l'activité génique de chaque cellule individuellement, révélant variation, types cellulaires et états cellulaires que les méthodes en masse masquent. Mais ces grands jeux de données à haute dimensionnalité demandent une lourde puissance de calcul.
    
    Ce playbook présente un flux de travail de bout en bout accéléré par GPU pour le scRNA-seq avec RAPIDS-singlecell, une bibliothèque basée sur RAPIDS dans l'écosystème scverse®. Il suit l'API Scanpy familière et permet aux chercheurs d'exécuter les étapes de prétraitement des données, contrôle qualité (QC) et nettoyage, visualisation et investigation plus rapidement que les outils CPU en travaillant avec des matrices de comptage creuses directement sur le GPU.
    
    Lien du playbook : https://build.nvidia.com/spark/single-cell

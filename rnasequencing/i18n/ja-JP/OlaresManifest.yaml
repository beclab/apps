metadata:
  title: RNA Sequencing
  description: RAPIDS を使った scRNA-seq 向けエンドツーエンド GPU ワークフロー
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替え。
    
    nginx 設定マウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
  fullDescription: |
    単一細胞 RNA シーケンシング（scRNA-seq）により、研究者は各細胞ごとの遺伝子活動を調べ、バルク手法では隠れるばらつき、細胞タイプ、細胞状態を明らかにできます。しかしこれらの大規模・高次元データセットは重い計算を必要とします。
    
    このプレイブックは、scverse® エコシステム内の RAPIDS 搭載ライブラリ RAPIDS-singlecell を使った scRNA-seq 向けエンドツーエンド GPU ワークフローを示します。おなじみの Scanpy API に従い、スパースなカウント行列を GPU 上で直接扱うことで、データ前処理、品質管理（QC）とクリーンアップ、可視化、調査の各ステップを CPU ツールより高速に実行できます。
    
    プレイブックリンク: https://build.nvidia.com/spark/single-cell

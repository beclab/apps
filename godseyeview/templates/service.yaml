{{- /*
  The cluster-internal Service the Olares entrance fronts. Nothing is exposed on
  a node port: upstream deliberately publishes its port on loopback only, and
  the Olares entrance plus its auth level replace that.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: godseyeview-svc
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: godseyeview
spec:
  type: ClusterIP
  selector:
    app: godseyeview
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

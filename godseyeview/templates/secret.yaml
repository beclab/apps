{{- /*
  Provider keys, one Secret for the whole app.

  Every value here was entered by the user at install time (declared under
  `envs[]` in the OlaresManifest) — the chart carries no credentials of its own.
  Nothing is rendered when the app is installed keyless, so the workload gets no
  key env at all and upstream's own keyless defaults apply: Esri imagery plus the
  flights, vessels, satellites, quakes, weather and camera layers that need no
  signup.

  Add keys later by editing the app's environment in Olares, then restart it —
  these entries have applyOnChange: true.
*/ -}}
{{- $olaresEnv := default (dict) .Values.olaresEnv -}}
{{- $present := list -}}
{{- range $key := .Values.gevSecretKeys -}}
  {{- if index $olaresEnv $key -}}
    {{- $present = append $present $key -}}
  {{- end -}}
{{- end -}}
{{- if $present }}
apiVersion: v1
kind: Secret
metadata:
  name: godseyeview-keys
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: godseyeview
type: Opaque
stringData:
{{- range $key := $present }}
  {{ $key }}: {{ index $olaresEnv $key | quote }}
{{- end }}
{{- end }}

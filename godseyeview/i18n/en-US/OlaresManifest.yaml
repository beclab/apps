metadata:
  title: God's Eye View
  description: A 3D globe app for watching live aircraft, ships, satellites and public cameras
spec:
  fullDescription: |-
    God's Eye View puts live public data on a 3D globe that runs on your own
    Olares. When you open it, the globe turns with aircraft, ships and satellites
    in their real positions, alongside earthquakes, weather, wildfire hotspots,
    road traffic and public camera feeds placed into the cities they overlook.
    The data comes from public broadcasts and published feeds, and the app works
    without an API key to start.

    **Key features**

    - Live layers: aircraft (OpenSky, falling back to adsb.lol), vessels,
      satellite orbits from CelesTrak, earthquakes, and wildfire hotspots.
    - Around 4,000 public cameras — traffic cameras, harbour cameras and webcams —
      projected into the 3D scene instead of shown as thumbnails.
    - Photorealistic 3D cities, terrain and imagery once you add a free Cesium ion
      token or your own Google Maps key.
    - Sensor-style looks (CRT, night vision, FLIR/thermal) and a cockpit view that
      follows a tracked aircraft down to the runway.
    - Hands-free voice control with your own OpenAI or Gemini key: ask it to fly to
      an airport, follow one aircraft, or count flights over a region.
    - Rocket launches, radio and satellite passes need no key at all.

    **Before you install**

    - Some layers each need their own key: vessels, active fires, photorealistic 3D,
      street imagery and voice. Add them in this app's Environment settings after
      install; the rest of the globe works without them.
    - Road traffic is partly simulated along real road networks, and broadcasts go
      quiet at times — terrestrial AIS in open ocean, or aircraft that do not
      transmit ADS-B — so gaps in the live picture are normal.
    - The maintainers state that the app must not be used for navigation, emergency
      response or other safety-critical decisions.
    - The source is MIT licensed. Bundled datasets and data fetched at runtime
      belong to their own sources, and some, such as the submarine cable map, are
      non-commercial.

    **Project links**

    - [God's Eye View source and documentation](https://github.com/bilawalsidhu/gods-eye-view)

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: godseyeview
  appid: godseyeview
  title: God's Eye View
  # Market copy: one short phrase, sentence case, no final punctuation, noun phrase
  # that names the product category then its main use. Implementation details
  # (Node process, no database) belong in the chart, not here.
  description: A 3D globe app for watching live aircraft, ships, satellites and public cameras
  # The project's own mark, from its 512px PWA launcher icon (public/icons/icon-512.png),
  # composited to the Market spec: 256x256 RGBA, 35 KB, no wordmark. Hosted on Olares' own
  # Market image host so every installer and the catalog itself can fetch it anonymously.
  # Verified: HTTP 200, image/png, md5 f6f96af5f16e251375dab5ace0f8c335 (the filename here).
  # Do NOT swap this for an app-served path: the entrance is private and its domain is
  # per-install, so an anonymous fetch returns the login page instead of the image.
  icon: https://cdn.olares.com/images/2026/10/f6f96af5f16e251375dab5ace0f8c335.png
  version: 0.0.10
  # GitBot for a NEW submission validates against a narrower registry than the
  # Market display list and than older merged charts: it rejected `Utilities` with
  # "registered: [agents developer homelab models workspace]". Pick only from
  # those five, and only ones this packaging can honour: `agents` is out because
  # upstream states the local MCP server is not available under Docker, and
  # `models` is out because nothing here serves a model.
  categories:
  - homelab
  - workspace
  tags:
  - globe
  - osint
  - flight-tracking
  - ship-tracking
  - satellites
spec:
  # Upstream release the image was built from (bilawalsidhu/gods-eye-view).
  versionName: "0.3.0"
  supportArch:
  - amd64
  # Honest scope: the image is built and smoke-tested for amd64 only. This daemon
  # cannot execute foreign-arch images (`exec format error`, no qemu binfmt) and
  # there is no arm64 hardware to validate on, so arm64 is not declared. Adding it
  # later means a real cross-build plus a smoke test, then an UPDATE PR.
  # Attribution: the product is upstream's; this chart only packages it. Never
  # present the packager as the developer.
  developer: Bilawal Sidhu
  website: https://github.com/bilawalsidhu/gods-eye-view
  sourceCode: https://github.com/bilawalsidhu/gods-eye-view
  doc: https://github.com/bilawalsidhu/gods-eye-view#readme
  license:
  - text: MIT
    url: https://github.com/bilawalsidhu/gods-eye-view/blob/main/LICENSE
  # Only en-US is maintained; do not declare a locale without complete copy.
  locale:
  - en-US
  # Read from the authenticated GitHub account (`gh api user`), matching the
  # `owners` file. Packaging credit belongs here, never in the developer field.
  submitter: xXm-mXx
  # Market listing images, hosted on Olares' Market image host (filename is the file's md5).
  # Exactly one featuredImage; promoteImage lists the whole set with the hero first. Both
  # verified anonymous HTTP 200, image/png, 1440x900, and byte-identical to the composed
  # frames in godseyeview-images/. Real captures of this deployment, composited by Pillow;
  # no generated UI. Copy is lifted from the upstream README.
  featuredImage: https://cdn.olares.com/images/2026/10/aac3fabf1989882d31710bfc3a809846.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/aac3fabf1989882d31710bfc3a809846.png
  - https://cdn.olares.com/images/2026/10/d23742cf7b88a7409f0e344387cfa9a3.png
  fullDescription: |-
    God's Eye View puts live public data on a 3D globe that runs on your own
    Olares. When you open it, the globe turns with aircraft, ships and satellites
    in their real positions, alongside earthquakes, weather, wildfire hotspots,
    road traffic and public camera feeds placed into the cities they overlook.
    The data comes from public broadcasts and published feeds, and the app works
    without an API key to start.

    **Key features**

    - Live layers: aircraft (OpenSky, falling back to adsb.lol), vessels,
      satellite orbits from CelesTrak, earthquakes, and wildfire hotspots.
    - Around 4,000 public cameras — traffic cameras, harbour cameras and webcams —
      projected into the 3D scene instead of shown as thumbnails.
    - Photorealistic 3D cities, terrain and imagery once you add a free Cesium ion
      token or your own Google Maps key.
    - Sensor-style looks (CRT, night vision, FLIR/thermal) and a cockpit view that
      follows a tracked aircraft down to the runway.
    - Hands-free voice control with your own Gemini key: ask it to fly to an
      airport, follow one aircraft, or count flights over a region.
    - Street level: click a covered street and the nearest photo opens beside the
      globe. Panoramax and KartaView need no key, Mapillary a free client token,
      Google Street View your own Google Maps key.
    - A layout built for phones, where panels open as sheets under a tab bar, and
      an interface in English, Spanish, Russian or Simplified Chinese.
    - Rocket launches, radio and satellite passes need no key at all.

    **Before you install**

    - Some layers each need their own key: vessels, active fires, photorealistic 3D,
      street imagery and voice. Add them in this app's Environment settings after
      install; the rest of the globe works without them.
    - The app refuses requests that carry reverse-proxy headers, and the Olares
      entrance adds them. Gemini Live voice, the live layers, terrain and camera
      feeds are unaffected; OpenAI realtime voice, Google Places search and TomTom
      traffic tiles answer 403. This is the app's own anti-CSRF design, and it is
      why keys belong in this app's Environment settings: the in-app Provider
      Settings panel refuses proxied requests too.
    - Road traffic is partly simulated along real road networks, and broadcasts go
      quiet at times — terrestrial AIS in open ocean, or aircraft that do not
      transmit ADS-B — so gaps in the live picture are normal.
    - The maintainers state that the app must not be used for navigation, emergency
      response or other safety-critical decisions.
    - The source is MIT licensed. Bundled datasets and data fetched at runtime
      belong to their own sources, and some, such as the submarine cable map, are
      non-commercial.

    **Project links**

    - [God's Eye View source and documentation](https://github.com/bilawalsidhu/gods-eye-view)
  # User-facing changes in the release this update ships. Chart maintenance never
  # belongs here. If English carries this field, every declared locale must too —
  # gev-build/sync_locale_copy.py keeps the copies in step with the source.
  upgradeDescription: |-
    v0.3.0 — the app comes down to street level, onto your phone, and into more languages.
    - Street level: click a covered street and the nearest photo opens beside the
      globe — Panoramax and KartaView need no key, Mapillary a free client token,
      Google Street View your own Google Maps key.
    - A layout built for phones: a tab bar with one panel sheet at a time, easier
      tap targets and more responsive pinch zoom.
    - The interface now speaks Spanish, Russian and Simplified Chinese, or open it
      with ?lang=es, ?lang=ru or ?lang=zh-CN.
    - Short share links reopen the same view on any install, and can follow an
      aircraft or a satellite.
    - Import your own GeoJSON, KML, KMZ and GPX files; they never leave your device.
    - Voice: Gemini Live as an alternative to OpenAI realtime, hold Space and ask
      about what the cursor is on, and answers say when a layer is off or loading.
    - Ten new camera packs, about thirty new bikeshare systems, nine Ontario
      transit feeds, GNSS integrity, emergency squawks, air quality, and a star
      field from the Yale Bright Star Catalogue.
  # The image's own user is already uid/gid 1000; declaring this makes
  # app-service inject the same uid at pod level, which is what the userspace
  # mounts expect (Kubernetes overrides a Dockerfile USER).
  runAsUser: true
  # Cesium renders in the browser, not here; this is a Vite dev server that also
  # brokers the provider proxies, so it is modest but not tiny.
  requiredCpu: 100m
  limitedCpu: 2000m
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 2Gi
entrances:
- name: web
  host: godseyeview-svc
  port: 80
  title: God's Eye View
  icon: https://cdn.olares.com/images/2026/10/f6f96af5f16e251375dab5ace0f8c335.png
  # private, not public: this server brokering provider keys is the whole
  # security story of the app (see SECURITY.md). A public entrance would hand the
  # key proxies to anyone holding the URL.
  authLevel: private
  invisible: false
  # openMethod: window => the Desktop does window.open() and the app gets a real
  # browser tab. Without it the Desktop mounts the entrance in an iframe, and
  # God's Eye View sends `X-Frame-Options: DENY` on every document on purpose
  # (build/vite.js; it only relaxes framing for `?embed=1` documents listed in
  # GEV_EMBED_FRAME_ANCESTORS), so the framed window can only ever fail.
  # Do not "fix" this by loosening the app's framing headers: the Desktop path
  # also has to pass the app's Host allowlist, and DENY is a deliberate
  # clickjacking guard on a server that brokers provider keys.
  openMethod: window
permission:
  # .gev-cache = disk-cached provider responses (TLEs, terrain heights, TomTom
  # tiles, FIRMS); .gev-logs = voice diagnostics. Both hang off the process cwd,
  # which is /app inside the image.
  appCache: true
  appData: true
options:
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
  # Default entrance timeout is 15 s, which cuts the long-lived connections this
  # app depends on (live flight/vessel feeds, the Vite HMR socket, voice
  # sessions). 0 disables the cap; a negative value would silently fall back to
  # 15 s.
  apiTimeout: 0
envs:
- envName: GEV_EXTRA_ALLOWED_HOSTS
  required: false
  editable: true
  applyOnChange: true
  type: string
  description: >-
    Extra exact hostnames the server should answer, comma-separated. This install's
    own entrance domain is always allowed and cannot be removed, so a bad value here
    cannot lock you out. Set this when you add a custom entrance domain or serve the
    app through a reverse proxy on another name. Wildcards and leading dots are
    ignored by the app, so list each name in full.
- envName: OPENSKY_AUTH_MODE
  default: anon
  editable: true
  applyOnChange: true
  options:
  - title: Anonymous (no key, lower polling allowance)
    value: anon
  - title: Auto (try OAuth, then Basic, then anonymous)
    value: auto
  - title: OAuth (needs the OpenSky client pair below)
    value: oauth
  description: >-
    How the flight layer authenticates to OpenSky Network. Leave on anon for a
    keyless start; the app falls back to adsb.lol when OpenSky refuses.
- envName: GEV_RATELIMIT_GOOGLE_PER_MIN
  default: '60'
  editable: true
  applyOnChange: true
  type: int
  description: >-
    Per-IP throttle on the cost-bearing Google Places routes. .env.example
    recommends tightening from the 120 default whenever the server is not
    loopback-only, which an entrance never is. Not a billing cap.
- envName: GEV_RATELIMIT_OPENAI_PER_MIN
  default: '30'
  editable: true
  applyOnChange: true
  type: int
  description: Per-IP throttle on /api/realtime/token and the AI HUD summary.
- envName: CESIUM_ION_TOKEN
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: >-
    Free Cesium ion Community token. Unlocks photorealistic 3D, world terrain
    and ion imagery. Client-exposed by design — restrict it to this app's domain
    at Cesium.
- envName: GOOGLE_MAPS_API_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: >-
    Direct Google Photorealistic 3D Tiles and Street View, both fetched by the
    browser itself. Google place search goes through the app's proxy, which the
    entrance's forwarding headers make the app refuse. Metered; URL-restrict it.
    Client-exposed by design.
- envName: GOOGLE_MAPS_SERVER_API_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: >-
    Optional second Google key for the server-only Places / Street View Static
    calls, so the browser key can stay narrowly scoped. Server-side only.
- envName: OPENAI_API_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: >-
    OpenAI realtime voice and the AI HUD summary. Both are refused through a
    reverse proxy — the app rejects requests carrying forwarding headers — so here
    they answer 403: use GEMINI_API_KEY for voice on Olares. Metered; set your own
    limit in the OpenAI console, the app's $5 cap is not. The ChatGPT/Codex OAuth
    voice path is unavailable under a container.
- envName: GEMINI_API_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: >-
    Voice provider that does work behind Olares' entrance: Gemini Live, selectable
    in the GEV MIC chooser. Server-side only — the browser gets a short-lived
    credential, the key stays on the Node process.
- envName: AISSTREAM_API_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: Free signup at aisstream.io; enables live global vessels. Server-side only.
- envName: FIRMS_MAP_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: Free NASA FIRMS key for live active fires. Server-side only.
- envName: TOMTOM_API_KEY
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: >-
    Free-tier TomTom key for real flow speeds. The traffic proxy refuses requests
    carrying reverse-proxy headers, so behind Olares' entrance these tiles answer
    403 and the layer keeps running on its built-in simulation. Server-side only.
- envName: MAPILLARY_CLIENT_TOKEN
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: Street Level imagery. A public client token by design.
- envName: OPENSKY_CLIENT_ID
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: Only read when OPENSKY_AUTH_MODE is oauth or auto.
- envName: OPENSKY_CLIENT_SECRET
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: Only read when OPENSKY_AUTH_MODE is oauth or auto.
- envName: LL2_API_TOKEN
  required: false
  editable: true
  applyOnChange: true
  type: password
  description: Optional paid Launch Library 2 token for higher limits. Blank is fine.
workloadReplicas:
  godseyeview: 1

# Workload replicas are driven by app-service: install stages at 0 then scales
# up, and suspend/resume scale this map. The deployment template must consume
# this value, never a literal.
workloads:
  godseyeview:
    replicaCount: 1

# Built from the repo's Dockerfile.olares (see build-image.sh), pinned by tag.
# Pushed to Docker Hub and confirmed publicly pullable with no credentials at
# all (anonymous `docker manifest inspect`, plus a bare registry-API probe with
# an anonymous pull token → HTTP 200). The node holds no registry credentials,
# so a private repository would install and then never pull. The docker.io/
# prefix is written out rather than left implicit so the reference cannot drift
# to another registry. Every rebuild gets a NEW tag: a node keeps serving the
# layers it already cached under a tag it has seen.
image:
  repository: docker.io/mushrxxm/gods-eye-view
  tag: 0.3.0-amd64-r2

# Credentials reach the container through one Secret, and each key is only
# rendered when the user actually filled it in — an empty string would read as
# "configured" to this app and light up a layer whose key is missing.
# Every name here is also declared under `envs[]` in OlaresManifest.yaml.
gevSecretKeys:
- GOOGLE_MAPS_API_KEY
- GOOGLE_MAPS_SERVER_API_KEY
- CESIUM_ION_TOKEN
- MAPILLARY_CLIENT_TOKEN
- OPENAI_API_KEY
- GEMINI_API_KEY
- AISSTREAM_API_KEY
- FIRMS_MAP_KEY
- TOMTOM_API_KEY
- OPENSKY_CLIENT_ID
- OPENSKY_CLIENT_SECRET
- LL2_API_TOKEN

metadata:
  title: TradingAgents
  description: Framework de trading financier multi-agents LLM
spec:
  upgradeDescription: |
    Remplacer l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    TradingAgents est un framework de trading multi-agents qui reflète la dynamique des sociétés de trading réelles. En déployant des agents spécialisés alimentés par LLM — des analystes fondamentaux, experts en sentiment et analystes techniques au trader et à l'équipe de gestion des risques — la plateforme évalue collectivement les conditions de marché et éclaire les décisions de trading. De plus, ces agents engagent des discussions dynamiques pour identifier la stratégie optimale.

    > Le framework TradingAgents est conçu à des fins de recherche. La performance de trading peut varier selon de nombreux facteurs, y compris les modèles de langage backbone choisis, la température du modèle, les périodes de trading, la qualité des données et d'autres facteurs non déterministes. Il ne constitue pas un conseil financier, d'investissement ou de trading.

    Notre framework décompose les tâches de trading complexes en rôles spécialisés. Ainsi, le système adopte une approche robuste et évolutive de l'analyse de marché et de la prise de décision.

    **Équipe d'analystes**
    - Fundamentals Analyst : Évalue les finances et métriques de performance de l'entreprise, identifiant les valeurs intrinsèques et les signaux d'alerte potentiels.
    - Sentiment Analyst : Agrège titres, StockTwits et discussions Reddit en une lecture de sentiment pour jauger l'humeur de marché à court terme.
    - News Analyst : Surveille les actualités mondiales et indicateurs macroéconomiques, interprétant l'impact des événements sur les conditions de marché.
    - Technical Analyst : Utilise des indicateurs techniques (comme MACD et RSI) pour détecter des motifs de trading et prévoir les mouvements de prix.

    **Équipe de chercheurs**
    - Comprend des chercheurs haussiers et baissiers qui évaluent de façon critique les insights de l'équipe d'analystes. Par des débats structurés, ils équilibrent gains potentiels et risques inhérents.

    **Trader Agent**
    - Compose des rapports des analystes et chercheurs pour prendre des décisions de trading éclairées. Il détermine le timing et l'ampleur des trades sur la base d'insights de marché complets.

    **Gestion des risques et Portfolio Manager**
    - Évalue en continu le risque de portefeuille en mesurant volatilité, liquidité et autres facteurs. L'équipe de risques évalue et ajuste les stratégies, fournissant des rapports au Portfolio Manager pour la décision finale.
    Le Portfolio Manager approuve/rejette la proposition. Si approuvée, l'ordre est envoyé à l'exchange simulé et exécuté.

metadata:
  title: TradingAgents
  description: マルチエージェント LLM 金融トレーディングフレームワーク
spec:
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えます。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除します。
  fullDescription: |
    TradingAgents は、現実のトレーディングファームのダイナミクスを反映したマルチエージェント・トレーディングフレームワークです。ファンダメンタルアナリスト、センチメント専門家、テクニカルアナリストからトレーダー、リスク管理チームまで、専門の LLM 駆動エージェントを配備し、市場状況を協調的に評価して取引判断に活かします。さらにこれらのエージェントは動的な議論を行い、最適な戦略を見極めます。

    > TradingAgents フレームワークは研究目的で設計されています。取引実績は、選択したバックボーン言語モデル、モデル温度、取引期間、データ品質、その他の非決定的要因など多くの要素により変動し得ます。金融・投資・取引の助言を意図したものではありません。

    本フレームワークは複雑な取引タスクを専門ロールに分解します。これにより市場分析と意思決定への堅牢でスケーラブルなアプローチを実現します。

    **アナリストチーム**
    - Fundamentals Analyst：企業財務とパフォーマンス指標を評価し、本質的価値と潜在的な危険信号を特定。
    - Sentiment Analyst：ニュース見出し、StockTwits、Reddit の会話を集約し、短期の市場ムードを測るセンチメント読み取りを作成。
    - News Analyst：世界のニュースとマクロ経済指標を監視し、イベントが市場条件に与える影響を解釈。
    - Technical Analyst：MACD や RSI などのテクニカル指標を用い、取引パターンを検出し価格動向を予測。

    **リサーチャーチーム**
    - 強気・弱気のリサーチャーで構成され、アナリストチームの洞察を批判的に評価。構造化された議論で潜在利益と固有リスクのバランスを取る。

    **Trader Agent**
    - アナリストとリサーチャーの報告をまとめ、情報に基づく取引判断を行う。包括的な市場洞察に基づき、取引のタイミングと規模を決定。

    **リスク管理と Portfolio Manager**
    - 市場ボラティリティ、流動性、その他のリスク要因を評価し、ポートフォリオリスクを継続的に評価。リスク管理チームが戦略を評価・調整し、最終判断のため Portfolio Manager に評価レポートを提供。
    Portfolio Manager が取引提案を承認／却下。承認されれば、シミュレートされた取引所に注文が送られ実行されます。

metadata:
  title: TradingAgents
  description: Multi-Agenten-LLM-Finanzhandels-Framework
spec:
  upgradeDescription: |
    Wechsel des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifisches `OPENRESTY_CONF_FILE`-Wiring entfernen.
  fullDescription: |
    TradingAgents ist ein Multi-Agenten-Handelsframework, das die Dynamik realer Handelsfirmen widerspiegelt. Durch den Einsatz spezialisierter LLM-gestützter Agenten — von Fundamentalanalysten, Sentiment-Experten und technischen Analysten bis hin zu Trader und Risikomanagement-Team — bewertet die Plattform gemeinsam die Marktbedingungen und fließt in Handelsentscheidungen ein. Zudem führen diese Agenten dynamische Diskussionen, um die optimale Strategie zu finden.

    > Das TradingAgents-Framework ist für Forschungszwecke konzipiert. Die Handelsleistung kann von vielen Faktoren abhängen, darunter gewählte Backbone-Sprachmodelle, Modelltemperatur, Handelszeiträume, Datenqualität und andere nicht-deterministische Faktoren. Es ist nicht als Finanz-, Anlage- oder Handelsberatung gedacht.

    Unser Framework zerlegt komplexe Handelsaufgaben in spezialisierte Rollen. So erreicht das System einen robusten, skalierbaren Ansatz für Marktanalyse und Entscheidungsfindung.

    **Analystenteam**
    - Fundamentals Analyst: Bewertet Unternehmensfinanzen und Leistungskennzahlen, identifiziert intrinsische Werte und mögliche Warnsignale.
    - Sentiment Analyst: Aggregiert Schlagzeilen, StockTwits und Reddit-Diskussionen zu einer Sentiment-Einschätzung der kurzfristigen Marktstimmung.
    - News Analyst: Überwacht globale Nachrichten und makroökonomische Indikatoren und interpretiert deren Auswirkungen auf die Marktbedingungen.
    - Technical Analyst: Nutzt technische Indikatoren (wie MACD und RSI), um Handelsmuster zu erkennen und Kursbewegungen vorherzusagen.

    **Researcher-Team**
    - Besteht aus bullischen und bärischen Researchern, die die Erkenntnisse des Analystenteams kritisch bewerten. Durch strukturierte Debatten gleichen sie potenzielle Gewinne gegen inhärente Risiken ab.

    **Trader Agent**
    - Erstellt Berichte aus Analysten- und Researcher-Ergebnissen, um fundierte Handelsentscheidungen zu treffen. Er bestimmt Timing und Größe der Trades auf Basis umfassender Markteinblicke.

    **Risikomanagement und Portfolio Manager**
    - Bewertet kontinuierlich das Portfoliorisiko anhand von Marktvolatilität, Liquidität und anderen Risikofaktoren. Das Risikomanagement-Team bewertet und passt Handelsstrategien an und liefert Bewertungsberichte an den Portfolio Manager für die endgültige Entscheidung.
    Der Portfolio Manager genehmigt/lehnt den Transaktionsvorschlag ab. Bei Genehmigung wird die Order an die simulierte Börse gesendet und ausgeführt.

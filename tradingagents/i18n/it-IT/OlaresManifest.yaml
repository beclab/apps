metadata:
  title: TradingAgents
  description: Framework di trading finanziario multi-agente basato su LLM
spec:
  upgradeDescription: |
    Passare l'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    TradingAgents è un framework di trading multi-agente che rispecchia le dinamiche delle società di trading reali. Distribuendo agenti specializzati basati su LLM — da analisti fondamentali, esperti di sentiment e analisti tecnici al trader e al team di risk management — la piattaforma valuta collettivamente le condizioni di mercato e informa le decisioni di trading. Inoltre, questi agenti discutono dinamicamente per individuare la strategia ottimale.

    > Il framework TradingAgents è progettato a fini di ricerca. La performance di trading può variare in base a molti fattori, tra cui i modelli linguistici backbone scelti, la temperatura del modello, i periodi di trading, la qualità dei dati e altri fattori non deterministici. Non costituisce consulenza finanziaria, di investimento o di trading.

    Il nostro framework scompone compiti di trading complessi in ruoli specializzati. Così il sistema ottiene un approccio robusto e scalabile all'analisi di mercato e al decision-making.

    **Team di analisti**
    - Fundamentals Analyst: Valuta i bilanci e le metriche di performance aziendali, individuando valori intrinseci e possibili red flag.
    - Sentiment Analyst: Aggrega titoli, StockTwits e discussioni Reddit in una lettura di sentiment per misurare l'umore di mercato a breve termine.
    - News Analyst: Monitora notizie globali e indicatori macroeconomici, interpretando l'impatto degli eventi sulle condizioni di mercato.
    - Technical Analyst: Utilizza indicatori tecnici (come MACD e RSI) per rilevare pattern di trading e prevedere i movimenti di prezzo.

    **Team di researcher**
    - Comprende researcher rialzisti e ribassisti che valutano criticamente le insight del team di analisti. Attraverso dibattiti strutturati bilanciano potenziali guadagni e rischi intrinseci.

    **Trader Agent**
    - Compone report di analisti e researcher per prendere decisioni di trading informate. Determina timing e ampiezza delle operazioni sulla base di insight di mercato completi.

    **Risk Management e Portfolio Manager**
    - Valuta continuamente il rischio di portafoglio misurando volatilità, liquidità e altri fattori. Il team di risk management valuta e adegua le strategie, fornendo report al Portfolio Manager per la decisione finale.
    Il Portfolio Manager approva/rifiuta la proposta. Se approvata, l'ordine viene inviato all'exchange simulato ed eseguito.

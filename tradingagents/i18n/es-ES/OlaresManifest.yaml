metadata:
  title: TradingAgents
  description: Framework de trading financiero multiagente con LLM
spec:
  upgradeDescription: |
    Cambiar la imagen del proxy inverso de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    TradingAgents es un framework de trading multiagente que refleja la dinámica de las firmas de trading reales. Al desplegar agentes especializados impulsados por LLM —desde analistas fundamentales, expertos en sentimiento y analistas técnicos hasta el trader y el equipo de gestión de riesgos— la plataforma evalúa colectivamente las condiciones del mercado e informa las decisiones de trading. Además, estos agentes participan en debates dinámicos para identificar la estrategia óptima.

    > El framework TradingAgents está diseñado con fines de investigación. El rendimiento de trading puede variar según muchos factores, incluidos los modelos de lenguaje backbone elegidos, la temperatura del modelo, los periodos de trading, la calidad de los datos y otros factores no deterministas. No pretende ser asesoramiento financiero, de inversión o de trading.

    Nuestro framework descompone tareas de trading complejas en roles especializados. Así el sistema logra un enfoque robusto y escalable para el análisis de mercado y la toma de decisiones.

    **Equipo de analistas**
    - Fundamentals Analyst: Evalúa las finanzas y métricas de rendimiento de la empresa, identificando valores intrínsecos y posibles señales de alerta.
    - Sentiment Analyst: Agrega titulares, StockTwits y conversaciones de Reddit en una lectura de sentimiento para medir el ánimo del mercado a corto plazo.
    - News Analyst: Supervisa noticias globales e indicadores macroeconómicos, interpretando el impacto de los eventos en las condiciones del mercado.
    - Technical Analyst: Utiliza indicadores técnicos (como MACD y RSI) para detectar patrones de trading y prever movimientos de precios.

    **Equipo de investigadores**
    - Incluye investigadores alcistas y bajistas que evalúan críticamente las ideas del equipo de analistas. Mediante debates estructurados, equilibran posibles ganancias frente a riesgos inherentes.

    **Trader Agent**
    - Compone informes de analistas e investigadores para tomar decisiones de trading informadas. Determina el momento y la magnitud de las operaciones según una visión integral del mercado.

    **Gestión de riesgos y Portfolio Manager**
    - Evalúa continuamente el riesgo de la cartera midiendo volatilidad, liquidez y otros factores. El equipo de riesgos evalúa y ajusta estrategias, y entrega informes al Portfolio Manager para la decisión final.
    El Portfolio Manager aprueba/rechaza la propuesta. Si se aprueba, la orden se envía al exchange simulado y se ejecuta.

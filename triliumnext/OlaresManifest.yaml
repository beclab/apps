olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  triliumnext: 1
metadata:
  name: triliumnext
  description: TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  icon: https://cdn.olares.cn/images/2026/07/05/f5e9688a7a422466d893a33818836028.cropped-1783239809269.png
  appid: triliumnext
  version: '1.0.2'
  title: TriliumNext
  categories:
  - Productivity_v112
  - workspace
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.105.0'
  fullDescription: |
    TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  upgradeDescription: |
    Upgrade TriliumNext to 0.105.0.
    - Security & MCP: MCP server now requires authentication.
    - Text notes: Unsupported HTML tags disabled by default for cleaner pasting.
    - UI & Features: Custom note icon packs, note save indicator, custom PDF.js renderer, and updated jQuery 4.
    - Bug fixes and stability improvements.
  developer: TriliumNext
  website: https://github.com/TriliumNext/Trilium
  sourceCode: https://github.com/TriliumNext/Trilium
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 256Mi
  limitedMemory: 2048Mi
  requiredDisk: 256Mi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: triliumnext-service
  port: 8080
  host: triliumnext-service
  title: TriliumNext
  icon: https://cdn.olares.cn/images/2026/07/05/f5e9688a7a422466d893a33818836028.cropped-1783239809269.png
  openMethod: window

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  triliumnext: 1
metadata:
  name: triliumnext
  description: TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  icon: https://cdn.olares.cn/images/2026/07/05/f5e9688a7a422466d893a33818836028.cropped-1783239809269.png
  appid: triliumnext
  version: '1.0.4'
  title: TriliumNext
  categories:
  - Productivity_v112
  - workspace
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.106.1'
  fullDescription: |
    TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  upgradeDescription: |
    - Upgrade TriliumNext from 0.105.0 to 0.106.1. 0.106.1 is a security release and should be applied to any instance reachable from the network.
    - Fixes CVE-2026-111497: the Brotli decoder could write out of bounds. Trilium decompresses Brotli-encoded request bodies before authentication, so any client that could reach the server could send a malicious request; outbound requests such as link previews, image downloads and web search were affected through the responses they receive.
    - Drops the revoked eMudhra/emSign certificate authorities from the certificate store bundled with Node.js. While trusted, a man-in-the-middle with the right network position could impersonate HTTPS servers Trilium connects to, including sync between instances, link previews and LLM providers.
    - The Docker images now ship Node.js 24.22.1, taking in the October 2026 Node.js security releases with further TLS, HTTP and DNS fixes.
    - Includes the 0.106.0 feature work, notably a rebuilt Kanban board: column icons, colors and card limits, collapsible and archivable columns, an Inbox column, card templates, per-board properties, automatic sorting, header filtering and multi-select.
    - Data format is unchanged and the existing data volume is reused as-is. If the container reports unhealthy after the upgrade, recreate it and check that no healthcheck override is set in your compose file.
  developer: TriliumNext
  website: https://github.com/TriliumNext/Trilium
  sourceCode: https://github.com/TriliumNext/Trilium
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 256Mi
  limitedMemory: 2048Mi
  requiredDisk: 256Mi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: triliumnext-service
  port: 8080
  host: triliumnext-service
  title: TriliumNext
  icon: https://cdn.olares.cn/images/2026/07/05/f5e9688a7a422466d893a33818836028.cropped-1783239809269.png
  openMethod: window

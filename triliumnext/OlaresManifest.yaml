metadata:
  name: triliumnext
  description: TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  icon: https://cdn.olares.cn/images/2026/07/05/f5e9688a7a422466d893a33818836028.cropped-1783239809269.png
  appid: triliumnext
  version: '1.0.5'
  title: TriliumNext
  categories:
  - Productivity_v112
  - workspace
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.107.0'
  fullDescription: |
    TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  upgradeDescription: |
    - Upgrade TriliumNext from 0.106.1 to 0.107.0.
    - The database version goes from 240 to 242. It is migrated the first time this version opens it, after an automatic backup, and an earlier version refuses to open it afterwards, so the upgrade cannot be rolled back: back up the data volume before upgrading.
    - A text note is no longer a single document: notes can be embedded, quoted and referenced inside other notes and edited where they appear, laid out in columns and tabs, and mixed with drawings, attached files and video. Tables in text notes gain merged cells, sorting and bulk row and column operations.
    - The old layout has been removed. In multi-level `#sorted` values, the label names must now be written with `#`, so `#sorted="priority desc, dueDate"` becomes `#sorted="#priority desc, #dueDate"`; values without `#` fall back to sorting by title.
    - Synchronizing with a new device now requires TOTP when one is set; existing synchronization is unaffected. Includes the Node.js 24.22.1 update for CVE-2026-111497 and further hardening of ETAPI.
    - The Docker image can now also run entirely as a non-root user. This chart still starts the container as root and lets the entrypoint hand the data directory to the `node` user, so the existing volume keeps working unchanged.
  developer: TriliumNext
  website: https://github.com/TriliumNext/Trilium
  sourceCode: https://github.com/TriliumNext/Trilium
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 256Mi
  limitedMemory: 2048Mi
  requiredDisk: 256Mi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: triliumnext-service
  port: 8080
  host: triliumnext-service

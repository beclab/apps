metadata:
  title: TriliumNext
  description: TriliumNext 是一个强大的个人知识库管理工具，支持层级笔记、富文本编辑、关系图谱及高度可定制的脚本脚本。
spec:
  fullDescription: |
    TriliumNext 是一个个人知识库程序。它能够帮助您构建高度结构化的层级笔记，拥有强大的编辑、关联和扩展能力。

    **主要功能：**
    - **层级笔记**：支持无限深度的层级笔记分类，便于整理复杂的知识体系。
    - **Markdown与富文本**：内置功能丰富的 WYSIWYG 富文本编辑器，支持 Markdown 快捷输入、Mermaid 图表、数学公式等。
    - **笔记关系图谱**：自动分析笔记之间的链接，生成可视化的关联图谱。
    - **强大的脚本支持**：支持使用 JavaScript (前端和后端) 扩展笔记功能，实现自动化任务。
    - **版本控制与安全**：内置笔记版本历史管理，并支持对敏感笔记进行高强度加密。
  upgradeDescription: |
    - TriliumNext 从 0.106.1 升级到 0.107.0。
    - 数据库版本从 240 升到 242。新版首次打开数据时会在自动备份之后执行迁移，此后旧版本将拒绝打开该数据库，因此升级无法回滚：请先备份数据卷。
    - 文本笔记不再是一整篇文档：可以在笔记中嵌入、引用其他笔记并在原位编辑，支持分栏与标签页布局，也可以混排绘图、附件与视频。文本笔记中的表格新增合并单元格、排序与批量增删行列。
    - 旧版布局已被移除。多级 `#sorted` 取值中的标签名必须带 `#`，即 `#sorted="priority desc, dueDate"` 需改为 `#sorted="#priority desc, #dueDate"`；不带 `#` 的取值会退回到按标题排序。
    - 在已启用 TOTP 的实例上，与**新设备**同步现在需要 TOTP；已有同步不受影响。同时包含针对 CVE-2026-111497 的 Node.js 24.22.1 更新与 ETAPI 的进一步加固。
    - Docker 镜像现在也支持完全以非 root 用户运行。本 chart 仍以 root 启动容器并由入口脚本将数据目录交给 `node` 用户，现有数据卷用法不变。

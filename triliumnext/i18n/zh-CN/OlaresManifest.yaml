metadata:
  title: TriliumNext
  description: TriliumNext 是一个强大的个人知识库管理工具，支持层级笔记、富文本编辑、关系图谱及高度可定制的脚本脚本。
spec:
  fullDescription: |
    TriliumNext 是一个个人知识库程序。它能够帮助您构建高度结构化的层级笔记，拥有强大的编辑、关联和扩展能力。

    **主要功能：**
    - **层级笔记**：支持无限深度的层级笔记分类，便于整理复杂的知识体系。
    - **Markdown与富文本**：内置功能丰富的 WYSIWYG 富文本编辑器，支持 Markdown 快捷输入、Mermaid 图表、数学公式等。
    - **笔记关系图谱**：自动分析笔记之间的链接，生成可视化的关联图谱。
    - **强大的脚本支持**：支持使用 JavaScript (前端和后端) 扩展笔记功能，实现自动化任务。
    - **版本控制与安全**：内置笔记版本历史管理，并支持对敏感笔记进行高强度加密。
  upgradeDescription: |
    - TriliumNext 从 0.105.0 升级到 0.106.1。0.106.1 是安全修复版本，任何可从网络访问的实例都应及时更新。
    - 修复 CVE-2026-111497：Brotli 解码器可能越界写入。Trilium 在身份验证之前就会解压 Brotli 编码的请求体，因此旧版本中任何能访问服务器的客户端都可发送恶意请求；链接预览、图片下载、网页搜索等出站请求也会因接收到的响应受到影响。
    - 从 Node.js 内置证书库中移除已被撤销的 eMudhra/emSign 证书颁发机构。这些 CA 在受信任期间，具备相应网络位置的中间人可冒充 Trilium 连接的 HTTPS 服务器，涉及实例间同步、链接预览与 LLM 服务商。
    - Docker 镜像改用 Node.js 24.22.1，纳入 2026 年 10 月的 Node.js 安全更新，并包含更多 TLS、HTTP 与 DNS 修复。
    - 包含 0.106.0 的功能改进，主要是重构后的看板：列图标、颜色与卡片上限，列可折叠与归档，新增 Inbox 列，支持卡片模板、看板属性、自动排序、表头筛选与多选操作。
    - 数据格式未变，原有数据卷沿用。若升级后容器显示 unhealthy，请重建容器，并确认 compose 文件里没有覆盖 healthcheck。

metadata:
  title: Twitter/X Plugin
  description: Un plugin Wise per raccogliere contenuti da Twitter/X
spec:
  fullDescription: |
    Questo plugin aiuta Wise a salvare i post di Twitter/X e a scaricare i media allegati.

    Dopo l'installazione, Wise può riconoscere i link Twitter/X, salvare i post nella
    libreria e scaricare immagini, video e altri allegati.

    **Funzionalità principali**

    - Salva i post di Twitter/X in Wise.
    - Scarica i media allegati ai post.
    - Riconosce i link Twitter/X quando aggiungi un URL in Wise.

    **Per gli utenti Olares**

    Questa applicazione è condivisa in tutto il sistema Olares. Dopo l'installazione da parte di un admin,
    Wise può usarla per ogni utente.

    Per l'installazione e l'uso quotidiano, consulta la [documentazione Wise](https://docs.olares.com/manual/olares/wise/basics).
  upgradeDescription: |

metadata:
  title: Twitter/X Plugin
  description: A Wise plugin for collecting content from Twitter/X
spec:
  fullDescription: |
    This plugin helps Wise save Twitter/X posts and download attached media.

    After you install it, Wise can recognize Twitter/X links, save posts to
    your library, and download images, videos, and other attachments.

    **Key Features**

    - Save Twitter/X posts to Wise.
    - Download attached media from posts.
    - Recognize Twitter/X links when you add a URL in Wise.

    **For Olares Users**

    This application is shared across your Olares system. Once an admin
    installs it, Wise can use it for every user.

    For setup and daily use, see the [Wise documentation](https://docs.olares.com/manual/olares/wise/basics).
  upgradeDescription: |

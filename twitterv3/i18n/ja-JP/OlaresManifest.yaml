metadata:
  title: Twitter/X Plugin
  description: Twitter/Xからコンテンツを収集するWiseプラグイン
spec:
  fullDescription: |
    このプラグインは、WiseがTwitter/Xの投稿を保存し、添付メディアをダウンロードするのを助けます。

    インストール後、WiseはTwitter/Xリンクを認識し、投稿をライブラリに保存し、画像、動画、その他の添付ファイルをダウンロードできます。

    **主な機能**

    - Twitter/Xの投稿をWiseに保存する。
    - 投稿の添付メディアをダウンロードする。
    - WiseでURLを追加したときにTwitter/Xリンクを認識する。

    **Olaresユーザー向け**

    このアプリケーションはOlaresシステム全体で共有されます。adminが
    インストールすると、Wiseが各ユーザー向けにこれを利用できます。

    セットアップと日常の使い方は[Wiseドキュメント](https://docs.olares.com/manual/olares/wise/basics)を参照してください。

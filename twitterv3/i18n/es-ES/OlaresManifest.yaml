metadata:
  title: Twitter/X Plugin
  description: Un complemento de Wise para recopilar contenido de Twitter/X
spec:
  fullDescription: |
    Este complemento ayuda a Wise a guardar publicaciones de Twitter/X y a descargar los archivos multimedia adjuntos.

    Tras instalarlo, Wise puede reconocer enlaces de Twitter/X, guardar publicaciones en
    su biblioteca y descargar imágenes, vídeos y otros archivos adjuntos.

    **Funciones principales**

    - Guardar publicaciones de Twitter/X en Wise.
    - Descargar archivos multimedia adjuntos de las publicaciones.
    - Reconocer enlaces de Twitter/X al añadir una URL en Wise.

    **Para usuarios de Olares**

    Esta aplicación se comparte en todo el sistema Olares. Cuando un admin
    la instala, Wise puede usarla para cada usuario.

    Para la configuración y el uso diario, consulte la [documentación de Wise](https://docs.olares.com/manual/olares/wise/basics).
  upgradeDescription: |

metadata:
  title: Twitter/X Plugin
  description: 用于从 Twitter/X 采集内容的 Wise 插件
spec:
  fullDescription: |
    此插件帮助 Wise 保存 Twitter/X 帖子并下载附件媒体。

    安装后，Wise 可以识别 Twitter/X 链接、将帖子保存到资料库，并下载图片、视频及其他附件。

    **主要功能**

    - 将 Twitter/X 帖子保存到 Wise。
    - 下载帖子中的附件媒体。
    - 在 Wise 中添加 URL 时识别 Twitter/X 链接。

    **Olares 用户说明**

    此应用在整个 Olares 系统中共享。管理员安装后，Wise 即可为每位用户使用它。

    安装与日常使用请参阅 [Wise 文档](https://docs.olares.com/manual/olares/wise/basics)。
  upgradeDescription: |

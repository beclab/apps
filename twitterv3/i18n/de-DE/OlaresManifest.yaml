metadata:
  title: Twitter/X Plugin
  description: Ein Wise-Plugin zum Sammeln von Inhalten von Twitter/X
spec:
  fullDescription: |
    Dieses Plugin hilft Wise, Twitter/X-Beiträge zu speichern und angehängte Medien herunterzuladen.

    Nach der Installation kann Wise Twitter/X-Links erkennen, Beiträge in
    Ihrer Bibliothek speichern und Bilder, Videos und andere Anhänge herunterladen.

    **Funktionen**

    - Twitter/X-Beiträge in Wise speichern.
    - Angehängte Medien aus Beiträgen herunterladen.
    - Twitter/X-Links erkennen, wenn Sie in Wise eine URL hinzufügen.

    **Für Olares-Nutzer**

    Diese Anwendung ist in Ihrem Olares-System geteilt. Sobald ein Admin
    sie installiert, kann Wise sie für jeden Nutzer verwenden.

    Zu Einrichtung und Alltag siehe die [Wise-Dokumentation](https://docs.olares.com/manual/olares/wise/basics).
  upgradeDescription: |

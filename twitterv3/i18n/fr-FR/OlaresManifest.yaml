metadata:
  title: Twitter/X Plugin
  description: Un plugin Wise pour collecter du contenu depuis Twitter/X
spec:
  fullDescription: |
    Ce plugin aide Wise à enregistrer des publications Twitter/X et à télécharger les médias joints.

    Après l'installation, Wise peut reconnaître les liens Twitter/X, enregistrer les publications dans
    votre bibliothèque, et télécharger images, vidéos et autres pièces jointes.

    **Fonctionnalités principales**

    - Enregistrer des publications Twitter/X dans Wise.
    - Télécharger les médias joints aux publications.
    - Reconnaître les liens Twitter/X lorsque vous ajoutez une URL dans Wise.

    **Pour les utilisateurs Olares**

    Cette application est partagée sur tout votre système Olares. Une fois qu'un admin
    l'installe, Wise peut l'utiliser pour chaque utilisateur.

    Pour l'installation et l'usage quotidien, voir la [documentation Wise](https://docs.olares.com/manual/olares/wise/basics).
  upgradeDescription: |

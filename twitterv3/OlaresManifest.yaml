olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: twitterv3
  description: A Wise plugin for collecting content from Twitter/X.
  icon: https://app.cdn.olares.com/appstore/twitter/icon.png
  appid: twitterv3
  version: '1.1.8'
  title: Twitter/X Plugin
  categories:
    - homelab
    - Fun

sharedEntrances:
  - name: twitter
    host: sharedentrances-twitter
    port: 0
    title: Twitter/X API
    icon: https://app.cdn.olares.com/appstore/twitter/icon.png
    invisible: true
    authLevel: internal
entrances:
  - name: twitter-svc
    port: 3060
    host: twitter-svc
    title: Twitter/X plugin
    icon: https://app.cdn.olares.com/appstore/twitter/icon.png
    authLevel: private
    invisible: true

workloadReplicas:
  twitterv3: 1

spec:
  versionName: '1.0.2'
  fullDescription: |
    This plugin helps Wise save Twitter/X posts and download attached media.

    After you install it, Wise can recognize Twitter/X links, save posts to
    your library, and download images, videos, and other attachments.

    **Key Features**

    - Save Twitter/X posts to Wise.
    - Download attached media from posts.
    - Recognize Twitter/X links when you add a URL in Wise.

    **For Olares Users**

    This application is shared across your Olares system. Once an admin
    installs it, Wise can use it for every user.

    For setup and daily use, see the [Wise documentation](https://docs.olares.com/manual/olares/wise/basics).
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://docs.olares.com/manual/olares/wise/basics
  requiredMemory: 50Mi
  limitedMemory: 900Mi
  requiredDisk: 128Mi
  limitedDisk: 128Mi
  requiredCpu: 200m
  limitedCpu: 4
  supportArch:
    - amd64
    - arm64
  onlyAdmin: true

permission:
  appData: true
  appCache: true
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.8-0'
      type: system
    - name: wisev3
      type: application
      version: '>=1.2.29'
      mandatory: true

metadata:
  title: Agent Zero
  description: Agentisches KI-Framework
spec:
  upgradeDescription: |
    Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat` umgestellt.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images angepasst (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), und die Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernt.
  fullDescription: |
    Ein persönliches, organisches agentisches Framework, das mit Ihnen wächst und lernt
    - Agent Zero ist kein vordefiniertes agentisches Framework. Es ist darauf ausgelegt, dynamisch zu sein, organisch zu wachsen und beim Gebrauch zu lernen.
    - Agent Zero ist vollständig transparent, lesbar, verständlich, anpassbar und interaktiv.
    - Agent Zero nutzt den Computer als Werkzeug, um seine (Ihre) Aufgaben zu erledigen.

    **Hauptfunktionen**
    - Dynamischer Wachstumsmechanismus: Kein festes, vordefiniertes Framework. Es entwickelt sich und lernt autonom bei der Nutzung und wird mit der Zeit besser auf Ihre Bedürfnisse zugeschnitten.
    - Vollwertiger Aufgabenassistent: Sammelt automatisch Informationen, führt Code und Befehle aus und nutzt persistentes Gedächtnis, um Aufgaben schneller und zuverlässiger zu lösen.
    - Tiefe Computer-Ermächtigung: Nutzt das Betriebssystem als Kernwerkzeug, kann autonom Code schreiben und das Terminal verwenden, unterstützt benutzerdefinierte Tool-Erweiterungen und bietet außergewöhnliche Kompatibilität.
    - Multi-Agenten-Zusammenarbeit: Eine hierarchische Struktur, in der übergeordnete Agenten Aufgaben zuweisen und untergeordnete Agenten sie zur Ausführung zerlegen, sodass alle Agenten fokussiert bleiben und der Kontext sauber bleibt.
    - Extreme Anpassbarkeit: Keine fest einprogrammierten Einschränkungen. System-Prompts, Tool-Vorlagen und Kommunikationslogik können frei geändert werden, um jedes Szenario zu unterstützen.

metadata:
  title: Agent Zero
  description: Framework d'IA agentique
spec:
  upgradeDescription: |
    Remplacer l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image OpenResty officielle `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Un framework agentique personnel et organique qui grandit et apprend avec vous
    - Agent Zero n'est pas un framework agentique prédéfini. Il est conçu pour être dynamique, grandir de façon organique et apprendre à mesure que vous l'utilisez.
    - Agent Zero est entièrement transparent, lisible, compréhensible, personnalisable et interactif.
    - Agent Zero utilise l'ordinateur comme outil pour accomplir ses (vos) tâches.

    **Fonctionnalités clés**
    - Mécanisme de croissance dynamique : Ce n'est pas un framework fixe et prédéfini. Il évolue et apprend de façon autonome à mesure que vous l'utilisez, devenant de plus en plus adapté à vos besoins.
    - Assistant de tâches complet : Collecte automatiquement des informations, exécute du code et des commandes, et s'appuie sur une mémoire persistante pour résoudre les tâches plus rapidement et de façon plus fiable.
    - Autonomisation profonde de l'ordinateur : Utilise le système d'exploitation comme outil central, peut écrire du code de façon autonome et utiliser le terminal, prend en charge des extensions d'outils personnalisées et offre une compatibilité exceptionnelle.
    - Collaboration multi-agents : Une structure hiérarchique où les agents supérieurs assignent des tâches et les agents subordonnés les décomposent pour l'exécution, en gardant tous les agents concentrés et le contexte propre.
    - Personnalisation extrême : Aucune limitation codée en dur. Les prompts système, les modèles d'outils et la logique de communication peuvent tous être librement modifiés pour s'adapter à n'importe quel scénario.

metadata:
  title: Agent Zero
  description: エージェンティック AI フレームワーク
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
  fullDescription: |
    あなたとともに成長し学ぶ、個人向けの有機的なエージェンティック・フレームワーク
    - Agent Zero はあらかじめ定義されたエージェンティック・フレームワークではありません。動的で、有機的に成長し、使いながら学習するよう設計されています。
    - Agent Zero は完全に透明で、読みやすく、理解しやすく、カスタマイズ可能で、インタラクティブです。
    - Agent Zero はコンピュータをツールとして使い、その（あなたの）タスクを遂行します。

    **主な機能**
    - 動的成長メカニズム: 固定の事前定義フレームワークではありません。利用するにつれて自律的に進化・学習し、ニーズに合わせて最適化されていきます。
    - フル機能のタスクアシスタント: 情報を自動収集し、コードやコマンドを実行し、永続メモリを活用してタスクをより速く、より確実に解決します。
    - 深いコンピュータ活用: OS を中核ツールとして使い、自律的にコードを書きターミナルを操作でき、カスタムツール拡張をサポートし、優れた互換性を備えます。
    - マルチエージェント協調: 上位エージェントがタスクを割り当て、下位エージェントが分解して実行する階層構造により、各エージェントの集中とクリーンなコンテキストを維持します。
    - 極めて高いカスタマイズ性: ハードコードされた制限はありません。システムプロンプト、ツールテンプレート、通信ロジックを自由に変更し、あらゆるシナリオに適合できます。

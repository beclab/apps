metadata:
  title: Agent Zero
  description: Framework di IA agentica
spec:
  upgradeDescription: |
    Sostituire l'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) con l'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Un framework agentico personale e organico che cresce e impara con te
    - Agent Zero non è un framework agentico predefinito. È progettato per essere dinamico, crescere in modo organico e imparare mentre lo usi.
    - Agent Zero è completamente trasparente, leggibile, comprensibile, personalizzabile e interattivo.
    - Agent Zero usa il computer come strumento per portare a termine i suoi (i tuoi) compiti.

    **Funzionalità principali**
    - Meccanismo di crescita dinamica: Non è un framework fisso e predefinito. Evolue e impara in modo autonomo mentre lo usi, adattandosi sempre meglio alle tue esigenze.
    - Assistente completo per i compiti: Raccoglie automaticamente informazioni, esegue codice e comandi e sfrutta la memoria persistente per risolvere i compiti in modo più rapido e affidabile.
    - Potenziamento profondo del computer: Usa il sistema operativo come strumento centrale, può scrivere codice in modo autonomo e usare il terminale, supporta estensioni di strumenti personalizzate e offre un'eccezionale compatibilità.
    - Collaborazione multi-agente: Una struttura gerarchica in cui gli agenti superiori assegnano i compiti e quelli subordinati li scompongono per l'esecuzione, mantenendo tutti gli agenti concentrati e il contesto pulito.
    - Estrema personalizzabilità: Nessuna limitazione hardcoded. I prompt di sistema, i template degli strumenti e la logica di comunicazione possono essere modificati liberamente per adattarsi a qualsiasi scenario.

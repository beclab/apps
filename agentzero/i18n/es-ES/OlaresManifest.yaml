metadata:
  title: Agent Zero
  description: Framework de IA agéntica
spec:
  upgradeDescription: |
    Cambiar la imagen del proxy inverso de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los montajes de configuración de nginx y las rutas de logs con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Un framework agéntico personal y orgánico que crece y aprende contigo
    - Agent Zero no es un framework agéntico predefinido. Está diseñado para ser dinámico, crecer de forma orgánica y aprender a medida que lo usas.
    - Agent Zero es totalmente transparente, legible, comprensible, personalizable e interactivo.
    - Agent Zero usa el ordenador como herramienta para cumplir sus (tus) tareas.

    **Funciones clave**
    - Mecanismo de crecimiento dinámico: No es un framework fijo y predefinido. Evoluciona y aprende de forma autónoma a medida que lo usas, adaptándose cada vez más a tus necesidades.
    - Asistente de tareas completo: Reúne información automáticamente, ejecuta código y comandos, y aprovecha la memoria persistente para resolver tareas de forma más rápida y fiable.
    - Empoderamiento profundo del ordenador: Usa el sistema operativo como herramienta central, puede escribir código de forma autónoma y usar la terminal, admite extensiones de herramientas personalizadas y ofrece una compatibilidad excepcional.
    - Colaboración multiagente: Una estructura jerárquica en la que los agentes superiores asignan tareas y los subordinados las descomponen para ejecutarlas, manteniendo a todos los agentes enfocados y el contexto limpio.
    - Personalización extrema: Sin limitaciones codificadas. Los prompts del sistema, las plantillas de herramientas y la lógica de comunicación se pueden modificar libremente para adaptarse a cualquier escenario.

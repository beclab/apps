metadata:
  title: Inkling-2-Mini IQ3_S (Strata)
  description: "Strata によりローカル動作する Thinking Machines Inkling-2-Mini（3.5 ビット GSQ-RCO IQ3_S 版、コーディングとツール連携向け）"
spec:
  upgradeDescription: |
    Thinking Machines Inkling-2-Mini の GSQ-RCO IQ3_S 版を、Strata v0.2.23（`strata-inkling`）および Model Console（`llm-init` v1.7.26）向けに初回リリースします。

    - ISTA-DASLab の 3.5 ビット GGUF `GSQ-RCO IQ3_S`（`11.43 GB`）を実行します。Hugging Face の特定コミットに固定され、サイズで検証されます。
    - ドラフターとして DFlash 2（`Inkling-2-Mini-DFlash2-mix.safetensors`、`0.55 GB`）を使用し、モデルの隣にダウンロードします。使用するかどうかはエンジンがカードと並列リクエスト数ごとに判断し、ENGINE_ARGS の `--draft off` で無効にできます。
    - OpenAI 互換ツール呼び出しと連続バッチ処理（`--parallel 1..16`、既定 `8`）に対応します。初回起動時のダウンロードは `12.0 GB` です。
  fullDescription: |
    Thinking Machines Inkling-2-Mini は、エージェント型ソフトウェア開発、ツール利用、高速な直接応答向けに設計された 26.4B パラメータの Looped MoE モデルです。本アプリは専用 C++/CUDA エンジン `strata-inkling` を用いて、ISTA-DASLab の GSQ-RCO IQ3_S GGUF をローカル実行します。

    **主な機能**

    - OpenAI 互換ツール呼び出しによる直接応答。
    - DFlash 2 ドラフター（`Inkling-2-Mini-DFlash2-mix.safetensors`、0.55 GB）：次のトークンを推測する小型の第 2 モデルで、メインモデルがそれを検証します。エンジンがカードと並列リクエスト数ごとに有効化し、`--draft off` で無効にできます。
    - 連続バッチによる並列リクエスト処理（`--parallel 1..16`、既定 `8`）。
    - Model Console でのモデル管理、Olares Router または OpenAI 互換チャット API 経由での連携。

    **このエディション**

    `GSQ-RCO IQ3_S`（ファイル `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`、11.43 GB、1 重みあたり 3.5 ビット）は非可逆の量子化です。モデルカードは、ベースモデルのタスク平均の 99.2% と報告しています（作者の数値で、Strata は再測定していません）。Strata は、このビルドでツール呼び出し、コーディング、長文脈のテストを実行していません。本アプリはテキスト専用です。既定のコンテキストはリクエストあたり 16,384 トークン、既定の同時リクエストスロットは 8 です（`--parallel 1..16`）。

    **初回利用前に**

    初回起動時に 12.0 GB（`Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`、`Inkling-2-Mini-DFlash2-mix.safetensors`、`tokenizer.json`、`chat_template.jinja`）をダウンロードします。amd64 環境では AVX2 対応 CPU および R580 以降の NVIDIA ドライバが必要です。

    クレジット：Inkling-2-Mini は Thinking Machines（Apache-2.0）。GSQ + RCO は IST Austria DASLab（Apache-2.0）。DFlash 2 ドラフターの重みは Inco AI / z-lab（Apache-2.0）。ここで使用するファイルは Strata が変換したコピーで、変更点の記載はそのリポジトリにあります。ベースモデルの Model Acceptable Use Policy が適用されます。

    [モデルドキュメント](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [量子化モデル](https://huggingface.co/ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF) · [DFlash 2 ドラフター](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata ドキュメント](https://github.com/Niko1221/Strata)

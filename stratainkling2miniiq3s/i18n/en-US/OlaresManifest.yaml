metadata:
  title: Inkling-2-Mini IQ3_S (Strata)
  description: "Thinking Machines Inkling-2-Mini in the 3.5-bit GSQ-RCO IQ3_S build for coding and tool use, powered locally by Strata"
spec:
  upgradeDescription: |
    Initial release of Thinking Machines Inkling-2-Mini in the GSQ-RCO IQ3_S build on Strata v0.2.23 (`strata-inkling`) and Model Console (`llm-init` v1.7.26).

    - Runs the 3.5-bit `GSQ-RCO IQ3_S` GGUF (`11.43 GB`) from ISTA-DASLab, pinned to one Hugging Face commit and checked by size.
    - Drafts with DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, `0.55 GB`), downloaded next to the model. The engine decides per card and per number of parallel requests whether to use it; `--draft off` in ENGINE_ARGS turns it off.
    - Supports OpenAI-compatible tool calling and continuous batching (`--parallel 1..16`, default `8`). First startup downloads `12.0 GB`.
  fullDescription: |
    Thinking Machines Inkling-2-Mini is a 26.4B-parameter looped Mixture-of-Experts model (3.4B active per pass / 5.4B looped-active across 48 virtual visits) engineered for agentic software engineering, tool use, and fast direct responses. This app runs the GSQ-RCO IQ3_S GGUF of ISTA-DASLab locally using Strata's dedicated `strata-inkling` C++/CUDA engine.

    Strata is an open-source inference engine for running frontier AI models locally. The IQ3_S file stores the model at 3.5 bits per weight (11.43 GB, against 19.37 GB for the lossless `SQ-20` edition). Strata runs its six expert types with its own GPU kernels and keeps a compact attention trunk, so the file fits a single 12 GB card with all experts on the card. Model Console connects the engine to Olares.

    **Key features**

    - Generate direct responses with OpenAI-compatible tool calling.
    - Speed up generation with the DFlash 2 drafter (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0.55 GB): a small second model that guesses the next tokens, which the main model then checks. The engine turns it on per card and per number of parallel requests; `--draft off` disables it.
    - Serve multiple requests concurrently via continuous batching (`--parallel 1..16`, default `8`).
    - Use Model Console to download the model, monitor readiness, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition (`GSQ-RCO IQ3_S`, file `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, 11.43 GB) is a lossy quantization. Its model card reports 99.2% of the base model's task average (the authors' figure, not re-measured by Strata). Strata has not run its tool-call, coding or long-context test suites on this build. This app is text-only. Default context is 16,384 tokens per request with 8 concurrent request slots (`--parallel 1..16`).

    **Before first use**

    First startup downloads 12.0 GB across `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, and `chat_template.jinja`, then loads the model.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer are required.

    Credits: Inkling-2-Mini by Thinking Machines (Apache-2.0). GSQ + RCO quantization by IST Austria DASLab (Apache-2.0). DFlash 2 drafter weights by Inco AI / z-lab (Apache-2.0); the file used here is Strata's converted copy of them (8-bit and 4-bit matrices), with a statement of changes in its repository. The base model's Model Acceptable Use Policy applies.

    [Model documentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantized model](https://huggingface.co/ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF) · [DFlash 2 drafter](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata documentation](https://github.com/Niko1221/Strata)

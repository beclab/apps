metadata:
  title: Inkling-2-Mini IQ3_S (Strata)
  description: "Thinking Machines Inkling-2-Mini im 3,5-Bit-Build GSQ-RCO IQ3_S fuer Coding und Tool-Nutzung, lokal betrieben mit Strata"
spec:
  upgradeDescription: |
    Erstveroeffentlichung von Thinking Machines Inkling-2-Mini im Build GSQ-RCO IQ3_S auf Strata v0.2.23 (`strata-inkling`) und Model Console (`llm-init` v1.7.26).

    - Fuehrt das 3,5-Bit-GGUF `GSQ-RCO IQ3_S` (`11,43 GB`) von ISTA-DASLab aus, an einen Hugging-Face-Commit gebunden und per Dateigroesse geprueft.
    - Nutzt DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, `0,55 GB`) als Drafter, neben dem Modell geladen. Die Engine entscheidet pro Karte und pro Anzahl paralleler Anfragen, ob er genutzt wird; `--draft off` in ENGINE_ARGS schaltet ihn ab.
    - Unterstuetzt OpenAI-kompatibles Tool-Calling und Continuous Batching (`--parallel 1..16`, Standard `8`). Der erste Start laedt `12,0 GB`.
  fullDescription: |
    Thinking Machines Inkling-2-Mini ist ein 26,4B-Looped-MoE-Modell fuer agentische Softwareentwicklung, Tool-Nutzung und schnelle direkte Antworten. Diese App fuehrt das GSQ-RCO-IQ3_S-GGUF von ISTA-DASLab lokal ueber die dedizierte C++/CUDA-Engine `strata-inkling` aus.

    **Hauptfunktionen**

    - Direkte Antworten mit OpenAI-kompatiblem Tool-Calling.
    - DFlash-2-Drafter (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): ein kleines zweites Modell, das die naechsten Tokens raet und vom Hauptmodell geprueft wird. Die Engine schaltet ihn pro Karte und pro Anzahl paralleler Anfragen ein; `--draft off` deaktiviert ihn.
    - Parallele Anfragen per Continuous Batching (`--parallel 1..16`, Standard `8`).
    - Verwaltung ueber Model Console sowie Anbindung ueber Olares Router oder die OpenAI-kompatible API.

    **Diese Edition**

    `GSQ-RCO IQ3_S` (Datei `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, 11,43 GB, 3,5 Bit pro Gewicht) ist eine verlustbehaftete Quantisierung. Die Modellkarte nennt 99,2 % des Durchschnitts des Basismodells bei Aufgaben (Angabe der Autoren, von Strata nicht nachgemessen). Strata hat seine Tool-Call-, Coding- und Langkontext-Tests mit diesem Build nicht ausgefuehrt. Diese App ist reine Text-App. Standardkontext 16.384 Tokens pro Anfrage, standardmaessig 8 parallele Anfrage-Slots (`--parallel 1..16`).

    **Vor der ersten Nutzung**

    Beim ersten Start werden 12,0 GB geladen (`Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Erfordert auf amd64 eine AVX2-CPU und einen NVIDIA-Treiber ab R580.

    Quellen: Inkling-2-Mini von Thinking Machines (Apache-2.0). GSQ + RCO von IST Austria DASLab (Apache-2.0). DFlash-2-Drafter-Gewichte von Inco AI / z-lab (Apache-2.0); die hier genutzte Datei ist die von Strata konvertierte Kopie, mit Aenderungsvermerk in ihrem Repository. Es gilt die Model Acceptable Use Policy des Basismodells.


metadata:
  title: Inkling-2-Mini IQ3_S (Strata)
  description: "Thinking Machines Inkling-2-Mini en la version de 3,5 bits GSQ-RCO IQ3_S para programacion y uso de herramientas, en local con Strata"
spec:
  upgradeDescription: |
    Lanzamiento inicial de Thinking Machines Inkling-2-Mini en la version GSQ-RCO IQ3_S con Strata v0.2.23 (`strata-inkling`) y Model Console (`llm-init` v1.7.26).

    - Ejecuta el GGUF de 3,5 bits `GSQ-RCO IQ3_S` (`11,43 GB`) de ISTA-DASLab, fijado a un commit de Hugging Face y comprobado por tamano.
    - Usa DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, `0,55 GB`) como borrador, descargado junto al modelo. El motor decide por tarjeta y por numero de peticiones paralelas si lo usa; `--draft off` en ENGINE_ARGS lo desactiva.
    - Compatible con llamadas a herramientas compatibles con OpenAI y lotes continuos (`--parallel 1..16`, predeterminado `8`). El primer arranque descarga `12,0 GB`.
  fullDescription: |
    Thinking Machines Inkling-2-Mini es un modelo Looped MoE de 26,4B parametros disenado para ingenieria de software agentica, uso de herramientas y respuestas directas rapidas. Esta aplicacion ejecuta localmente el GGUF GSQ-RCO IQ3_S de ISTA-DASLab con el motor dedicado `strata-inkling`.

    **Caracteristicas principales**

    - Respuestas directas con tool calling compatible con OpenAI.
    - Borrador DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): un modelo pequeno que propone los siguientes tokens y que el modelo principal comprueba. El motor lo activa por tarjeta y por numero de peticiones paralelas; `--draft off` lo desactiva.
    - Peticiones concurrentes mediante lotes continuos (`--parallel 1..16`, predeterminado `8`).
    - Gestion mediante Model Console y conexion por Olares Router o API compatible con OpenAI.

    **Esta edicion**

    `GSQ-RCO IQ3_S` (archivo `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, 11,43 GB, 3,5 bits por peso) es una cuantizacion con perdida. Su ficha de modelo indica el 99,2 % del promedio de tareas del modelo base (cifra de los autores, no remedida por Strata). Strata no ha ejecutado sus pruebas de llamadas a herramientas, programacion ni contexto largo con esta version. Esta aplicacion es solo de texto. Contexto predeterminado de 16.384 tokens por peticion con 8 ranuras de peticion concurrentes (`--parallel 1..16`).

    **Antes del primer uso**

    El primer inicio descarga 12,0 GB (`Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Requiere CPU amd64 con AVX2 y controlador NVIDIA R580 o posterior.

    Creditos: Inkling-2-Mini de Thinking Machines (Apache-2.0). GSQ + RCO de IST Austria DASLab (Apache-2.0). Pesos del borrador DFlash 2 de Inco AI / z-lab (Apache-2.0); el archivo usado aqui es la copia convertida por Strata, con la declaracion de cambios en su repositorio. Se aplica la Model Acceptable Use Policy del modelo base.

    [Documentacion del modelo](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modelo cuantizado](https://huggingface.co/ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF) · [Borrador DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentacion de Strata](https://github.com/Niko1221/Strata)

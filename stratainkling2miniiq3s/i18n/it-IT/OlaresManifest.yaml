metadata:
  title: Inkling-2-Mini IQ3_S (Strata)
  description: "Thinking Machines Inkling-2-Mini nella build a 3,5 bit GSQ-RCO IQ3_S per coding e uso di strumenti, in locale con Strata"
spec:
  upgradeDescription: |
    Rilascio iniziale di Thinking Machines Inkling-2-Mini nella build GSQ-RCO IQ3_S su Strata v0.2.23 (`strata-inkling`) e Model Console (`llm-init` v1.7.26).

    - Esegue il GGUF a 3,5 bit `GSQ-RCO IQ3_S` (`11,43 GB`) di ISTA-DASLab, fissato a un commit di Hugging Face e verificato per dimensione.
    - Usa DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, `0,55 GB`) come drafter, scaricato accanto al modello. Il motore decide per scheda e per numero di richieste parallele se usarlo; `--draft off` in ENGINE_ARGS lo disattiva.
    - Supporta tool calling compatibile OpenAI e batching continuo (`--parallel 1..16`, predefinito `8`). Il primo avvio scarica `12,0 GB`.
  fullDescription: |
    Thinking Machines Inkling-2-Mini e un modello Looped MoE da 26,4B parametri progettato per ingegneria del software agentica, uso di strumenti e risposte dirette rapide. Questa app esegue localmente il GGUF GSQ-RCO IQ3_S di ISTA-DASLab tramite il motore dedicato `strata-inkling`.

    **Funzionalita principali**

    - Risposte dirette con tool calling compatibile con OpenAI.
    - Drafter DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): un piccolo secondo modello che propone i token successivi, che il modello principale verifica. Il motore lo attiva per scheda e per numero di richieste parallele; `--draft off` lo disattiva.
    - Richieste concorrenti tramite batching continuo (`--parallel 1..16`, predefinito `8`).
    - Gestione tramite Model Console e integrazione con Olares Router o API compatibile con OpenAI.

    **Questa edizione**

    `GSQ-RCO IQ3_S` (file `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, 11,43 GB, 3,5 bit per peso) e una quantizzazione con perdita. La sua scheda del modello riporta il 99,2 % della media dei compiti del modello base (dato degli autori, non rimisurato da Strata). Strata non ha eseguito i suoi test di tool calling, coding e contesto lungo su questa build. Questa app e solo testo. Contesto predefinito di 16.384 token per richiesta con 8 slot di richieste concorrenti (`--parallel 1..16`).

    **Prima del primo utilizzo**

    Il primo avvio scarica 12,0 GB (`Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Richiede CPU amd64 AVX2 e driver NVIDIA R580 o successivo.

    Crediti: Inkling-2-Mini di Thinking Machines (Apache-2.0). GSQ + RCO di IST Austria DASLab (Apache-2.0). Pesi del drafter DFlash 2 di Inco AI / z-lab (Apache-2.0); il file usato qui e la copia convertita da Strata, con la dichiarazione delle modifiche nel suo repository. Si applica la Model Acceptable Use Policy del modello base.

    [Documentazione del modello](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modello quantizzato](https://huggingface.co/ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF) · [Drafter DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentazione Strata](https://github.com/Niko1221/Strata)

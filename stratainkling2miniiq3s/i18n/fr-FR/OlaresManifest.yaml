metadata:
  title: Inkling-2-Mini IQ3_S (Strata)
  description: "Thinking Machines Inkling-2-Mini en version 3,5 bits GSQ-RCO IQ3_S pour le code et l'utilisation d'outils, en local avec Strata"
spec:
  upgradeDescription: |
    Met a jour le moteur Inkling en 0.1.71 (etiquette d'image `0.2.23-inkling0.1.71-cuda13`, Strata 0.2.23) : noyaux de prefill IQ3_S, reponses qui commencent plus tot quand beaucoup d'utilisateurs attendent et placement automatique du cache K/V. Ajoute les valeurs mesurees avec ce fichier sur l'Olares One (RTX 5090 Laptop, 24 Go) et la plus petite demande de memoire GPU mesuree. Aucun changement des fichiers du modele ni des reglages.

    [Strata v0.2.23](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini est un modele Looped MoE de 26,4B parametres concu pour le developpement logiciel agentique, l'utilisation d'outils et les reponses directes rapides. Cette application execute localement le GGUF GSQ-RCO IQ3_S d'ISTA-DASLab via le moteur dedie `strata-inkling`.

    **Fonctionnalites principales**

    - Reponses directes avec appels d'outils compatibles OpenAI.
    - Drafteur DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 Go) : un petit second modele qui propose les jetons suivants, que le modele principal verifie. Le moteur l'active par carte et par nombre de requetes paralleles ; `--draft off` le desactive.
    - Requetes concurrentes par batching continu (`--parallel 1..16`, defaut `8`).
    - Gestion via Model Console et integration via Olares Router ou API compatible OpenAI.

    **Cette edition**

    `GSQ-RCO IQ3_S` (fichier `Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, 11,43 Go, 3,5 bits par poids) est une quantification avec perte. Sa fiche de modele indique 99,2 % de la moyenne des taches du modele de base (chiffre des auteurs, non remesure par Strata). Strata n'a pas execute ses tests d'appels d'outils, de code ni de contexte long sur cette version. Cette application est limitee au texte. Contexte par defaut de 16 384 jetons par requete avec 8 emplacements de requetes concurrentes (`--parallel 1..16`).

    **Mesure sur l'Olares One**

    RTX 5090 Laptop (24 Go), 128 nouveaux jetons, contexte de 16K par utilisateur, limite de 23 GiB emulee ; moteur 0.1.71 contre 0.1.70 sur la meme machine. Une requete avec DFlash 2 : 132,0 / 166,1 / 236,5 / 141,9 / 302,5 / 223,7 tok/s pour prose / chat / JSON / code / comptage / appels d'outils (moyenne 200,4 ; 200,2 avec 0.1.70, jetons identiques). Prefill 4K 1 088 a 2 395 tok/s ; 32K 972 a 1 959 tok/s, decode 95,8 a 97,7. De bout en bout avec des utilisateurs en parallele : 8 utilisateurs 180, 16 utilisateurs 158 (170 avec 0.1.70). Tous les experts restent sur la carte aux deux niveaux. L'application propose `--parallel 1..16`. Tous les experts restent sur la carte des 18 GiB de memoire GPU a 8 emplacements (13 GiB pour une requete avec un contexte de 32K), mesure avec le moteur 0.2.23 ; cette application demande 23 GiB.

    **Avant la premiere utilisation**

    Le premier demarrage telecharge 12,0 Go (`Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Necessite un CPU amd64 AVX2 et un pilote NVIDIA R580 ou plus recent.

    Credits : Inkling-2-Mini par Thinking Machines (Apache-2.0). GSQ + RCO par IST Austria DASLab (Apache-2.0). Poids du drafteur DFlash 2 par Inco AI / z-lab (Apache-2.0) ; le fichier utilise ici est la copie convertie par Strata, avec la declaration des modifications dans son depot. La Model Acceptable Use Policy du modele de base s'applique.

    [Documentation du modele](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modele quantifie](https://huggingface.co/ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF) · [Drafteur DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentation Strata](https://github.com/Niko1221/Strata)

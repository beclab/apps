  accelerator:
  - mode: nvidia
    limitedCpu: '12'
    requiredCpu: 1300m
    # Disk is derived from the file sizes (12,003,045,894 B = 11.2 GiB for the four downloaded files): 16Gi required, 24Gi limit.
    requiredDisk: 16Gi
    limitedDisk: 24Gi
    # GPU request 23Gi = the whole card (23,552 MiB; prefill chunk 1,024), the plan measured with the SQ-20 file. Measured with this file under the HAMi shim, 8 slots at 16K context:
    # 18,432 MiB (18Gi) is the lowest request that keeps all experts on the card at full speed (decode 117 tok/s); 16,384 MiB decodes 87; 14,336 MiB and below goes hybrid (498 or more experts in host RAM,
    # decode 45-55). One request at 32K context needs at least 13Gi. The request stays 23Gi until the owner decides. RAM 8Gi / 24Gi: engine RSS about 5 GB at 256K single stream.
    requiredMemory: 8Gi
    limitedMemory: 24Gi
    requiredGPUMemory: 23Gi
    limitedGPUMemory: 24Gi
  supportArch:
  - amd64
  runAsUser: true

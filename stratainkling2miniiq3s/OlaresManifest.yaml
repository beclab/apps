envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF --revision 357051619a8805c032e58a9976cea9bddb0832cd --include Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf,hf://strata-engine/Inkling-2-Mini-Strata --revision 5623ceb47d7a01db827460ce1c23e7818a75661b --include tokenizer.json,hf://strata-engine/Inkling-2-Mini-Strata --revision 5623ceb47d7a01db827460ce1c23e7818a75661b --include chat_template.jinja,hf://strata-engine/Inkling-2-Mini-DFlash2 --revision 04ecd36faef74e696f0a7b6b3c119264442a6234 --include Inkling-2-Mini-DFlash2-mix.safetensors
  description: GSQ-RCO IQ3_S GGUF (sha256 8a3515374c3cd9b65a1677b17e805bb1e32df8e98756e5f0d2fe1837d62aa4cb) at a pinned ISTA-DASLab commit, the o200k tokenizer/template from the pinned Strata pack commit, and the DFlash 2 drafter file (sha256 cf7dbb08560dfd99544af0cdbab2915406fc571f516b19aff0fe113b9458d387) from a second pinned repository; the main model is listed first.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: inkling-2-mini-gsq-rco-iq3_s
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: tools
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  # Not measured for this file on the Olares One. Same default and slot limit as the SQ-20 app, whose Olares One measurement is 8 slots at 16K context 226 tok/s and 16 slots 234 tok/s; beyond 16 slots the default memory plan
  # moves experts to host RAM. The engine loads no DFlash 2 drafter for 2 to 15 slots on this card (23.4 GiB reported, under its 24 GiB class); one slot and 16 slots draft.
  default: --context 16384 --parallel 8
  description: Strata setup.py / strata-inkling options. Model/source/host/port/GPU/vision are managed by the chart. Supports --context per request slot (16384 default), --parallel 1..16, --kv-dtype auto|fp16|fp8, and --draft off|dflash2 (--draft on loads DFlash 2 past the engine's memory check). Saving engine_args in Model Console relaunches without re-downloading weights.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '1'
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 6Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: '10'
  description: CPU limit for the Strata engine, in cores (platform quota cap 12). Saving this relaunches the engine.
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 20Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 23Gi

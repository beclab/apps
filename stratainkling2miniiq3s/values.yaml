# Default image points to Strata's official GHCR CUDA 13 image (bundling strata-inkling sm_75..sm_120);
# Beclab's promotion bot mirrors upstream images to docker.io/beclab/* automatically, and templates/wrappers.yaml
# supports both upstream /opt/strata/components and Beclab /opt/strata/.venv layouts seamlessly.
images:
  strata: ghcr.io/niko1221/strata:0.2.23-inkling0.1.71-cuda13
  llmInit: docker.io/beclab/llm-init:v1.7.26
workloads:
  llminit:
    replicaCount: 1
  stratainkling2miniiq3s:
    replicaCount: 1
strata:
  cpuThreads: 8

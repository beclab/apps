metadata:
  title: YuE2 Studio
  description: ボーカルと編集可能な楽譜を備えたAI楽曲をローカルで制作する音楽スタジオ
spec:
  fullDescription: |
    YuE2 Studioは、音楽のスタイルと歌詞から、お使いのGPUで楽曲を生成します。生成された各楽曲にはABC形式の楽譜が付属し、編集して別の歌唱・演奏を作成できます。

    **主な機能**

    - ボーカル曲やインストゥルメンタルを生成し、48 kHzのステレオ音声で出力。
    - ピアノロールで音符、コード、セクション、調性、テンポを編集。
    - 曲の構成を保ちながら、歌詞、歌声、音楽のスタイルを変更。
    - ABC・MIDI形式の楽譜をインポート・エクスポートし、録音を楽譜に変換してカバーを作成。

    内部のStreamable HTTP MCP入口からLaresなどの対応アシスタントに接続できます。同じ入口でHTTP APIも利用できます。トークン認証は既定で無効です。アプリの環境変数でMCP_AUTH_ENABLED=trueを設定すると、Data/yue2studio/config/mcp-tokenに自動生成されたBearerトークンが必要になります。

    **動作要件と設定**

    このLinux amd64プレビュー版には、NVIDIA GeForce RTX 50シリーズのGPU（sm_120）とCUDA 13対応ドライバーが必要です。RTX 5090 Laptop GPUで動作を検証しています。

    インストール前に、Olaresのシステム環境でHugging Faceの接続先とトークンを設定してください。アプリはこれらの設定を引き継ぎます。楽曲を生成する前に、アプリのモデル設定でモデルセットをダウンロードしてください。モデルの重みは別途ダウンロードされ、アプリの再起動後も保持されます。

    **ライセンス**

    StudioのコードはMITライセンスです。モデルの重みには個別のライセンスが適用され、YuE2はCC BY-NC 4.0です。条件は[YuE2モデルカード](https://huggingface.co/m-a-p/YuE2-3B)をご確認ください。

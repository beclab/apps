metadata:
  title: YuE2 Studio
  description: Un estudio musical local para canciones con IA, voces y partituras editables
spec:
  fullDescription: |
    YuE2 Studio convierte un estilo musical y una letra en una canción usando tu propia GPU. Cada pista generada incluye una partitura ABC que puedes editar para crear otra interpretación.

    **Funciones principales**

    - Genera voces o música instrumental con salida estéreo de 48 kHz.
    - Edita notas, acordes, secciones, tonalidad y tempo en el editor de piano roll.
    - Conserva una composición y cambia su letra, voz o estilo musical.
    - Importa y exporta partituras ABC y MIDI, o transcribe una grabación a una partitura para crear una versión.

    Conecta Lares u otro asistente compatible mediante la entrada MCP Streamable HTTP interna. La misma entrada ofrece la API HTTP. La autenticación por token está desactivada por defecto. Configura MCP_AUTH_ENABLED=true en las variables de entorno de la aplicación para exigir el token Bearer generado en Data/yue2studio/config/mcp-token.

    **Requisitos y configuración**

    Esta versión preliminar para Linux amd64 requiere una GPU NVIDIA GeForce RTX de la serie 50 (sm_120) y un controlador compatible con CUDA 13. Se ha probado en una RTX 5090 Laptop GPU.

    Antes de instalar, configura el punto de conexión de Hugging Face y el token en el entorno del sistema Olares. La aplicación hereda estos ajustes. Descarga un conjunto de modelos en los ajustes de modelos de la aplicación antes de generar música. Los pesos de los modelos se descargan por separado y se conservan al reiniciar la aplicación.

    **Licencias**

    El código de Studio tiene licencia MIT. Los pesos de los modelos tienen licencias independientes, incluida CC BY-NC 4.0 para YuE2. Consulta las condiciones en la [ficha del modelo YuE2](https://huggingface.co/m-a-p/YuE2-3B).

metadata:
  title: YuE2 Studio
  description: Uno studio musicale locale per brani IA con voci e spartiti modificabili
spec:
  fullDescription: |
    YuE2 Studio trasforma uno stile musicale e un testo in una canzone usando la tua GPU. Ogni brano generato include uno spartito ABC che puoi modificare per creare una nuova interpretazione.

    **Funzionalità principali**

    - Genera voci o musica strumentale con uscita stereo a 48 kHz.
    - Modifica note, accordi, sezioni, tonalità e tempo nell’editor piano roll.
    - Mantieni una composizione cambiandone il testo, la voce o lo stile musicale.
    - Importa ed esporta spartiti ABC e MIDI oppure trascrivi una registrazione in uno spartito per creare una cover.

    Collega Lares o un altro assistente compatibile tramite l’ingresso MCP Streamable HTTP interno. Lo stesso ingresso offre l’API HTTP. L’autenticazione tramite token è disattivata per impostazione predefinita. Imposta MCP_AUTH_ENABLED=true nelle variabili d’ambiente dell’app per richiedere il token Bearer generato in Data/yue2studio/config/mcp-token.

    **Requisiti e configurazione**

    Questa anteprima per Linux amd64 richiede una GPU NVIDIA GeForce RTX serie 50 (sm_120) e un driver compatibile con CUDA 13. È stata testata su una RTX 5090 Laptop GPU.

    Prima dell’installazione, configura l’endpoint Hugging Face e il token nell’ambiente di sistema Olares. L’app eredita queste impostazioni. Scarica un set di modelli nelle impostazioni dei modelli dell’app prima di generare musica. I pesi dei modelli vengono scaricati separatamente e conservati dopo il riavvio dell’app.

    **Licenze**

    Il codice di Studio è distribuito con licenza MIT. I pesi dei modelli hanno licenze separate, tra cui CC BY-NC 4.0 per YuE2. Consulta la [scheda del modello YuE2](https://huggingface.co/m-a-p/YuE2-3B) per le condizioni.

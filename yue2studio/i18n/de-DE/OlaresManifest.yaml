metadata:
  title: YuE2 Studio
  description: Ein lokales Musikstudio für KI-Songs mit Gesang und bearbeitbaren Partituren
spec:
  fullDescription: |
    YuE2 Studio erzeugt aus einem Musikstil und einem Liedtext einen Song auf Ihrer eigenen GPU. Jeder erzeugte Titel enthält eine ABC-Partitur, die Sie bearbeiten und für eine neue Interpretation verwenden können.

    **Hauptfunktionen**

    - Gesang oder Instrumentalmusik mit 48 kHz Stereoausgabe erzeugen.
    - Noten, Akkorde, Abschnitte, Tonart und Tempo im Pianorollen-Editor bearbeiten.
    - Eine Komposition beibehalten und dabei Liedtext, Stimme oder Musikstil ändern.
    - ABC- und MIDI-Partituren importieren und exportieren oder eine Aufnahme für eine Coverversion in eine Partitur umwandeln.

    Verbinden Sie Lares oder einen kompatiblen Assistenten über den internen Streamable HTTP MCP-Zugang. Derselbe Zugang bietet die HTTP-API. Die Token-Authentifizierung ist standardmäßig deaktiviert. Setzen Sie MCP_AUTH_ENABLED=true in den Umgebungsvariablen der App, um das generierte Bearer-Token aus Data/yue2studio/config/mcp-token zu verlangen.

    **Voraussetzungen und Einrichtung**

    Diese Vorschau für Linux amd64 benötigt eine NVIDIA GeForce RTX 50 GPU (sm_120) und einen mit CUDA 13 kompatiblen Treiber. Sie wurde auf einer RTX 5090 Laptop GPU getestet.

    Konfigurieren Sie vor der Installation den Hugging Face-Endpunkt und das Token in der Olares-Systemumgebung. Die App übernimmt diese Einstellungen. Laden Sie vor der Musikerzeugung in den Modelleinstellungen der App ein Modellpaket herunter. Die Modellgewichte werden separat heruntergeladen und bleiben nach einem Neustart der App erhalten.

    **Lizenzierung**

    Der Studio-Code steht unter der MIT-Lizenz. Für Modellgewichte gelten separate Lizenzen, darunter CC BY-NC 4.0 für YuE2. Die Bedingungen finden Sie auf der [YuE2-Modellkarte](https://huggingface.co/m-a-p/YuE2-3B).

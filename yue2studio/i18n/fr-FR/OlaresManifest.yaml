metadata:
  title: YuE2 Studio
  description: Un studio musical local pour créer des chansons IA avec voix et partitions modifiables
spec:
  fullDescription: |
    YuE2 Studio transforme un style musical et des paroles en chanson sur votre propre GPU. Chaque morceau généré comprend une partition ABC que vous pouvez modifier pour créer une nouvelle interprétation.

    **Fonctionnalités principales**

    - Générer des voix ou de la musique instrumentale avec une sortie stéréo à 48 kHz.
    - Modifier les notes, les accords, les sections, la tonalité et le tempo dans l’éditeur piano roll.
    - Conserver une composition tout en changeant ses paroles, sa voix ou son style musical.
    - Importer et exporter des partitions ABC et MIDI, ou transcrire un enregistrement en partition pour créer une reprise.

    Connectez Lares ou un assistant compatible via l’entrée MCP Streamable HTTP interne. La même entrée fournit l’API HTTP. L’authentification par jeton est désactivée par défaut. Définissez MCP_AUTH_ENABLED=true dans les variables d’environnement de l’application pour exiger le jeton Bearer généré dans Data/yue2studio/config/mcp-token.

    **Configuration requise et installation**

    Cette version préliminaire pour Linux amd64 nécessite un GPU NVIDIA GeForce RTX série 50 (sm_120) et un pilote compatible CUDA 13. Elle a été testée sur un RTX 5090 Laptop GPU.

    Avant l’installation, configurez le point de terminaison Hugging Face et le jeton dans l’environnement système Olares. L’application reprend ces paramètres. Téléchargez un ensemble de modèles dans les paramètres des modèles de l’application avant de générer de la musique. Les poids des modèles sont téléchargés séparément et conservés après le redémarrage de l’application.

    **Licences**

    Le code de Studio est sous licence MIT. Les poids des modèles ont leurs propres licences, dont CC BY-NC 4.0 pour YuE2. Consultez la [fiche du modèle YuE2](https://huggingface.co/m-a-p/YuE2-3B) pour en connaître les conditions.

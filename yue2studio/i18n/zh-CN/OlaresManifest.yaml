metadata:
  title: YuE2 Studio
  description: 在本地生成带人声和可编辑乐谱的 AI 音乐创作工作室
spec:
  fullDescription: |
    YuE2 Studio 根据音乐风格和歌词，使用本机 GPU 生成歌曲。每首生成的歌曲都附带 ABC 乐谱，可编辑后用于生成新的演唱或演奏版本。

    **主要功能**

    - 生成人声歌曲或纯音乐，输出 48 kHz 立体声音频。
    - 在钢琴卷帘编辑器中修改音符、和弦、段落、调性和速度。
    - 保留曲谱，改变歌词、音色或音乐风格。
    - 导入和导出 ABC 与 MIDI 乐谱，或将录音转录为乐谱后制作翻唱。

    可通过内部 Streamable HTTP MCP 入口连接 Lares 或其他兼容助手，同一入口也提供 HTTP API。令牌认证默认关闭。在应用环境变量中设置 MCP_AUTH_ENABLED=true 后，需要使用 Data/yue2studio/config/mcp-token 中自动生成的 Bearer 令牌。

    **运行要求与设置**

    此 Linux amd64 预览版需要 NVIDIA GeForce RTX 50 系列 GPU（sm_120）和兼容 CUDA 13 的驱动。已在 RTX 5090 Laptop GPU 上完成测试。

    安装前，请在 Olares 系统环境中配置 Hugging Face 地址和令牌，应用会继承这些设置。生成音乐前，请先在应用的模型设置中下载一套模型。模型权重单独下载，应用重启后仍会保留。

    **许可协议**

    Studio 代码采用 MIT 许可。模型权重遵循各自的许可，其中 YuE2 使用 CC BY-NC 4.0。具体条款请参阅 [YuE2 模型说明](https://huggingface.co/m-a-p/YuE2-3B)。

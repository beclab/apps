{{- $existing := lookup "v1" "Secret" .Release.Namespace "yue2studio-mcp" -}}
apiVersion: v1
kind: Secret
metadata:
  name: yue2studio-mcp
  namespace: '{{ .Release.Namespace }}'
type: Opaque
data:
  token: {{ if and $existing $existing.data (index $existing.data "token") }}{{ index $existing.data "token" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}

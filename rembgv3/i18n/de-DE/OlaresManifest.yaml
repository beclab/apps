metadata:
  title: Rembg
  description: Rembg ist ein Tool zum Entfernen von Bildhintergründen
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Es wird nur ein Dienst systemweit in Olares installiert. Jeder Nutzer kann einen Desktop-Eintrag installieren, um den Shared Entrance zu nutzen oder die Service-API aufzurufen.

    **ÜBERSICHT**
    Rembg ist ein Tool zum Entfernen von Bildhintergründen.

    ONNX-Modelle werden bei der Installation vom Olares-CDN-Bundle
    (`rembgv2_models_20251203.tar.zst`) per `downloader-init` heruntergeladen und vor dem Start des rembg-Servers nach
    `/root/.u2net` entpackt. Kein Hugging-Face-Token erforderlich.
  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernen.

    Rembg auf das apiVersion-v3 Shared-App-Muster migriert (rembgv2 → rembgv3).

    **Änderungen**

    - **Modell-Download**: CDN-`downloader-init`-tar.zst-Bundle unverändert beibehalten;
      keine Hugging-Face- / llm-init-Migration.
    - **Entrance-Routing**: nginx-Upstream-Backup leitet Traffic an das Download-
      Dashboard, bis die rembg-Engine healthy ist; `/gradio_api/info` bleibt an die Engine gebunden.
    - **Architektur**: rembgv2- / rembgv2server-Subcharts zu einem
      Chart zusammengeführt; Backends lösen im Release-Namespace auf (ohne
      `*-shared` Admin-/Non-Admin-Split).
    - **Accelerator**: GPU-Anforderung in die Accelerator-Modusliste verschoben
      (nur nvidia; nur amd64).
    - **Skalierung**: `workloadReplicas` deklariert Engine- und nginx-Client-Workloads.

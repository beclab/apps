metadata:
  title: Rembg
  description: Rembg は画像の背景を除去するツールです
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体にサービスは 1 つだけインストールされます。各ユーザーはデスクトップエントリをインストールして共有入口にアクセスしたり、サービス API を呼び出せます。

    **概要**
    Rembg は画像の背景を除去するツールです。

    ONNX モデルはインストール時に Olares CDN バンドル
    （`rembgv2_models_20251203.tar.zst`）から `downloader-init` 経由でダウンロードされ、
    rembg サーバー起動前に `/root/.u2net` へ展開されます。Hugging Face トークンは不要です。
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定マウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。

    Rembg を apiVersion v3 共有アプリパターンへ移行（rembgv2 → rembgv3）。

    **変更点**

    - **モデルダウンロード**: CDN の `downloader-init` tar.zst バンドルは変更なし。
      Hugging Face / llm-init への移行なし。
    - **入口ルーティング**: nginx upstream バックアップが rembg エンジンが healthy になるまで
      ダウンロードダッシュボードへトラフィックを送る。`/gradio_api/info` はエンジンに固定。
    - **アーキテクチャ**: rembgv2 / rembgv2server サブチャートを単一チャートに統合。
      バックエンドはリリース namespace内で解決（`*-shared` の admin / non-admin 分割を廃止）。
    - **アクセラレータ**: GPU 要件をアクセラレータモード一覧へ移動
      （nvidia のみ、amd64 専用アプリ）。
    - **スケーリング**: `workloadReplicas` がエンジンと nginx クライアントのワークロードを宣言。

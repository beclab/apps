metadata:
  title: Rembg
  description: Rembg è uno strumento per rimuovere lo sfondo dalle immagini
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un’app condivisa. Verrà installato un solo servizio in tutto il sistema Olares. Ogni utente può installare una voce desktop per accedere o usare l’ingresso condiviso e chiamare l’API del servizio.

    **PANORAMICA**
    Rembg è uno strumento per rimuovere lo sfondo dalle immagini.

    I modelli ONNX vengono scaricati in fase di installazione dal bundle CDN Olares
    (`rembgv2_models_20251203.tar.zst`) tramite `downloader-init` ed estratti in
    `/root/.u2net` prima dell’avvio del server rembg. Non è richiesto alcun token Hugging Face.
  upgradeDescription: |
    Passaggio dell’immagine reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all’immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell’immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring Bitnami-specifico `OPENRESTY_CONF_FILE`.

    Migrazione di Rembg al pattern shared-app apiVersion v3 (rembgv2 → rembgv3).

    **Cosa è cambiato**

    - **Download modelli**: bundle CDN `downloader-init` tar.zst invariato;
      nessuna migrazione Hugging Face / llm-init.
    - **Routing ingresso**: il backup upstream nginx invia il traffico alla
      dashboard di download finché il motore rembg non è healthy; `/gradio_api/info` resta sul motore.
    - **Architettura**: subchart rembgv2 / rembgv2server uniti in un
      unico chart; i backend si risolvono nel namespace del release (senza lo
      split admin / non-admin `*-shared`).
    - **Accelerator**: requisito GPU spostato nell’elenco delle modalità accelerator
      (solo nvidia; app solo amd64).
    - **Scaling**: `workloadReplicas` dichiara i workload del motore e del client nginx.

metadata:
  title: Rembg
  description: Rembg es una herramienta para quitar el fondo de imágenes
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar una entrada de escritorio para acceder o usar la entrada compartida y llamar a la API del servicio.

    **RESUMEN**
    Rembg es una herramienta para quitar fondos de imágenes.

    Los modelos ONNX se descargan en la instalación desde el paquete CDN de Olares
    (`rembgv2_models_20251203.tar.zst`) mediante `downloader-init` y se extraen en
    `/root/.u2net` antes de que arranque el servidor rembg. No se requiere token de Hugging Face.
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear montajes de configuración nginx y rutas de logs con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.

    Migración de Rembg al patrón de app compartida apiVersion v3 (rembgv2 → rembgv3).

    **Cambios**

    - **Descarga de modelos**: se mantiene el paquete CDN `downloader-init` tar.zst sin cambios;
      sin migración a Hugging Face / llm-init.
    - **Enrutado de entrada**: el backup del upstream nginx envía tráfico al
      dashboard de descarga hasta que el motor rembg esté healthy; `/gradio_api/info` se fija al motor.
    - **Arquitectura**: se aplanaron los subcharts rembgv2 / rembgv2server en un
      solo chart; los backends se resuelven dentro del namespace del release (sin el
      split admin / no-admin `*-shared`).
    - **Acelerador**: el requisito GPU se movió a la lista de modos accelerator
      (solo nvidia; app solo amd64).
    - **Escalado**: `workloadReplicas` declara los workloads del motor y del cliente nginx.

metadata:
  title: Rembg
  description: Rembg est un outil pour supprimer l’arrière-plan des images
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s’agit d’une app partagée. Un seul service sera installé sur l’ensemble du système Olares. Chaque utilisateur peut installer une entrée bureau pour accéder ou utiliser l’entrée partagée et appeler l’API du service.

    **APERÇU**
    Rembg est un outil pour supprimer l’arrière-plan des images.

    Les modèles ONNX sont téléchargés à l’installation depuis le bundle CDN Olares
    (`rembgv2_models_20251203.tar.zst`) via `downloader-init` et extraits dans
    `/root/.u2net` avant le démarrage du serveur rembg. Aucun jeton Hugging Face n’est requis.
  upgradeDescription: |
    Remplacement de l’image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l’image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l’image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage Bitnami `OPENRESTY_CONF_FILE`.

    Migration de Rembg vers le schéma d’app partagée apiVersion v3 (rembgv2 → rembgv3).

    **Changements**

    - **Téléchargement des modèles** : bundle CDN `downloader-init` tar.zst inchangé ;
      pas de migration Hugging Face / llm-init.
    - **Routage d’entrée** : le backup upstream nginx envoie le trafic vers le
      tableau de bord de téléchargement jusqu’à ce que le moteur rembg soit healthy ; `/gradio_api/info` reste fixé au moteur.
    - **Architecture** : fusion des sous-charts rembgv2 / rembgv2server en un
      seul chart ; les backends se résolvent dans le namespace de la release (sans le
      split admin / non-admin `*-shared`).
    - **Accélérateur** : exigence GPU déplacée dans la liste des modes accelerator
      (nvidia uniquement ; app amd64 uniquement).
    - **Mise à l’échelle** : `workloadReplicas` déclare les workloads moteur et client nginx.

spec:
  onlyAdmin: true
  versionName: '0.5.21-cu130'
  upgradeDescription: |
    Upgrade SGLang from v0.5.18-cu130 to v0.5.21-cu130. Chart 1.2.33.

    **What's Changed** (v0.5.18 → v0.5.21)

    v0.5.21
    - New models: DeepSeek-V4.1 Flash, GigaChat 3.5, IQuest-Q1, MiMo-V2.6 / V2.6-Pro, Ling-3.0-flash-VL, plus the DiffusionGemma, Qwen-Image 2.1, Anima Base v1.0, Ming-Image 0.1 and FLUX 3 Action diffusion models
    - The prefix cache now runs on a Rust core by default; unsupported configurations fall back to Python automatically (`SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND=python` forces the old core)
    - New Decisions API (`/v1/decisions`) turns an LLM/VLM into a low-latency classifier and scorer; the Score API (`/v1/score`) scores all candidates in one request
    - DeepSeek-V4.1 first token is 22% faster on long prompts, and Kimi K3 prefill throughput is up 20.6% in PD serving
    - Breaking: a request-supplied `chat_template` is rejected unless the server starts with `--trust-request-chat-template`; deprecated endpoints are gone (`/model_info` replaces `/get_weight_version`, `/v1/loads` replaces `/get_load`); `--kv-cache-dtype fp4_e2m1` becomes `fp4_mx_block16`; FlashInfer MoE fused finalize is off by default for numerical accuracy; the legacy radix cache implementations are removed

    v0.5.20
    - New models: GLM-5.3-Flash, Hy4-Preview, Qwen3.8-Flash-Next, K2 Horizon, Nanbeige4.2, and several diffusion models
    - The unified radix tree caches SWA branching points: on DeepSeek-V4-Flash with a shared system prompt, token hit rate rises from 43.8% to 60.8% and mean TTFT falls from 1.57 s to 1.07 s
    - `return_sampling_mask` returns the exact token support per decode step for RL rollouts, with capacity set by `--sampling-mask-max-tokens` (default 4096)
    - DeepSeek-V4 on Blackwell: TRT-LLM attention now covers the CSA and HCA layers on SM100/SM103 (about 1.2x prefill and 1.45x decode versus FlashMLA)
    - On 32 GB GPUs the decode CUDA-graph cap rises from 24 to 48 (160 at TP >= 4) and chunked prefill from 2K to 4K
    - Breaking: the CUDA 12 lane is retired (this chart already uses the CUDA 13 image); `/v1/responses` storage requires `--enable-response-store`; prefill context parallelism v1 is removed; seventeen deprecated CLI flags are removed; the `cutlass_mla` attention backend, the non-Marlin `gptq` path, and Dual Chunk Flash Attention are deleted; an undersized SWA pool now fails at startup instead of hanging at warmup

    v0.5.19
    - New models: Qwen3.8 (2.4T-A95B), Qwen3.8-27B, dots3.note, Ling-3.0-flash and Ling-3.0-tiny, Spark2.5, MiniCPM-SALA, Granite 4.2
    - Beam search is supported through `beam_width`, though not yet together with speculative decoding, disaggregation, DP attention, or HiCache
    - `--enable-layernorm-sp` trims 3.5% off Qwen3-8B prefill on H100 and 5.6% on B200, with the saving growing with the TP degree
    - DeepEP v2 ElasticBuffer is available via `--moe-a2a-backend deepep_v2`, keeping decode under CUDA graphs across nodes
    - Breaking: the unified radix tree becomes the default cache for every configuration; FlashInfer 0.6.18 is required; the Spark 2.5 tool-call parser is renamed from `spark` to `spark25`; requests are limited to 32 stop strings and 32 stop regex patterns of at most 256 bytes each

    For detailed release notes, visit:
    https://github.com/sgl-project/sglang/releases
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo>`. The HuggingFace source to download your model, for example `hf://openai/gpt-oss-20b`. Use a repo that contains `.safetensors` weight files. Optionally append `--include <file>` or `--revision <sha>`.
    - `MODEL_NAME`: `owner/repo`. The name of your model — use the string after `hf://` in `MODEL_SOURCE`, for example `openai/gpt-oss-20b`. This is also used as the OpenAI alias and SGLang `--model-path`.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; for embedding, the chart auto-adds `--is-embedding`.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports.
    - `ENGINE_ARGS`: `--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss`. Extra SGLang CLI flags. Separate multiple `--key value` pairs with spaces. Adjust `--reasoning-parser` and `--tool-call-parser` to match your model family. See https://docs.sglang.io/docs/advanced_features/server_arguments.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `SGLANG_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.

    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then SGLang starts serving the model when it's ready. These two parts run in separate Deployments but share the HF cache and run-state via App Common storage.

    **Stack**
    - **SGLang** (port 30000): runs the model and serves API requests
    - **llm-init** (port 8090): downloads the model, shows progress, and provides the OpenAI API, proxying to SGLang

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `SGLANG_REQUIRED_GPU_MEMORY`; tune `--mem-fraction-static` in ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                         |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - SGLang model loading can take several minutes for large models. Keep the app Running until ready.
    - SGLang excels at prefix caching and structured output (JSON, tool calls, agents); prefix caching is enabled by default.

  developer: SGLang
  website: https://sglang.io/
  sourceCode: https://github.com/sgl-project/sglang
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: Apache-2.0
      url: https://github.com/sgl-project/sglang/blob/main/LICENSE

  accelerator:
    #   nvidia       — discrete GPU; SGLANG_REQUIRED_GPU_MEMORY -> gpumem
    #   nvidia-gb10  — DGX Spark unified memory; same env -> pod memory
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE        # example: hf://openai/gpt-oss-20b
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: hf://openai/gpt-oss-20b. The HuggingFace source to download your model. Use a repo with `.safetensors` weights. Optionally append `--include <file>` or `--revision <sha>`."
    regex: "^hf://"
  - envName: MODEL_NAME          # example: openai/gpt-oss-20b
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: openai/gpt-oss-20b. The name of your model — use the string after `hf://` in MODEL_SOURCE. This is also used as the OpenAI alias and SGLang `--model-path`."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "The model capabilities. Pick what your model supports. If no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # example: --context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description: "Example: --context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss. Extra SGLang CLI flags. Separate multiple --key value pairs with spaces. Adjust parsers to match your model family."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: SGLANG_CPU_REQUEST    # default: 200m
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_MEMORY_REQUEST # default: 2Gi
    required: true
    default: "2Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_MEMORY_LIMIT   # default: 35Gi
    required: true
    default: "35Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    description: "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB. On Spark it sets pod memory."
    regex: "^[0-9]+(Gi|Mi)?$"

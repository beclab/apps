spec:
  onlyAdmin: true
  versionName: '0.5.22-cu130'
  upgradeDescription: |
    Upgrade SGLang from v0.5.21-cu130 to v0.5.22-cu130. Chart 1.2.34.

    **What's Changed** (v0.5.21 → v0.5.22)

    - New models: Clef / Clef Flash, PPLX-Decider v1 / v1.1, EmbeddingGemma 2, and LLaDA2.2, plus the HunyuanImage-3.0-Instruct, Kandinsky 6 / 6 SR, Wan-Animate-2, SANA-Video 2.0, and LLaDA-Image / LLaDA-Image-Turbo diffusion models
    - DeepSeek-V4.1 reaches up to 2.3x throughput per GPU on H200. Qwen3.8-Flash-Next decodes 12% faster on B200, GLM-5.3-Flash with DFlash is 10% faster on B300, and MiMo-V2.6-Pro gets 1.85x decode throughput with DFlash on B300. GLM-5.2 and GLM-5.3 can combine decode context parallelism with MTP, up to 2.1x faster decoding on GLM-5.3
    - The InstantTensor loader can load models about 10x faster (DeepSeek-R1 on 8x H200: 15.3 s instead of 160 s from 50 GB/s storage). PD disaggregation gains up to 27% throughput and about half the p95 TTFT on long prompts. HiSparse now supports EAGLE and MTP with the KV cache in CPU memory
    - Fix: hybrid linear models could resume from the wrong Mamba state when speculative decoding and structured output were used together
    - The CUDA image moves to PyTorch 2.14.1, Transformers 5.19.0, and FlashInfer 0.7.1
    - Breaking: Python 3.11 or newer is required (this CUDA 13 image already ships Python 3.12). `--enable-dp-attention` is deprecated in favor of `--attn-dp-size N`, and `--dp-size` now counts model replicas only. `--disaggregation-decode-host-receive-threshold` flips its meaning: `1` (the new default) disables host receive, and `0` means always receive on the host. `ChunkCache` is removed. The `tc_piecewise` prefill CUDA graph backend is removed. For OpenAI chat responses, `tool_choice: "none"` no longer shows tool schemas to DeepSeek models, an absent `tool_calls` field is omitted instead of returned as `null`, and a stream keeps one `created` timestamp. `--enable-layernorm-sp` is rejected together with pipeline parallelism

    For detailed release notes, visit:
    https://github.com/sgl-project/sglang/releases
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo>`. The HuggingFace source to download your model, for example `hf://openai/gpt-oss-20b`. Use a repo that contains `.safetensors` weight files. Optionally append `--include <file>` or `--revision <sha>`.
    - `MODEL_NAME`: `owner/repo`. The name of your model — use the string after `hf://` in `MODEL_SOURCE`, for example `openai/gpt-oss-20b`. This is also used as the OpenAI alias and SGLang `--model-path`.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; for embedding, the chart auto-adds `--is-embedding`.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports.
    - `ENGINE_ARGS`: `--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss`. Extra SGLang CLI flags. Separate multiple `--key value` pairs with spaces. Adjust `--reasoning-parser` and `--tool-call-parser` to match your model family. See https://docs.sglang.io/docs/advanced_features/server_arguments.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `SGLANG_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.

    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then SGLang starts serving the model when it's ready. These two parts run in separate Deployments but share the HF cache and run-state via App Common storage.

    **Stack**
    - **SGLang** (port 30000): runs the model and serves API requests
    - **llm-init** (port 8090): downloads the model, shows progress, and provides the OpenAI API, proxying to SGLang

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `SGLANG_REQUIRED_GPU_MEMORY`; tune `--mem-fraction-static` in ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                         |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - SGLang model loading can take several minutes for large models. Keep the app Running until ready.
    - SGLang excels at prefix caching and structured output (JSON, tool calls, agents); prefix caching is enabled by default.

  developer: SGLang
  website: https://sglang.io/
  sourceCode: https://github.com/sgl-project/sglang
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: Apache-2.0
      url: https://github.com/sgl-project/sglang/blob/main/LICENSE

  accelerator:
    #   nvidia       — discrete GPU; SGLANG_REQUIRED_GPU_MEMORY -> gpumem
    #   nvidia-gb10  — DGX Spark unified memory; same env -> pod memory
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE        # example: hf://openai/gpt-oss-20b
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: hf://openai/gpt-oss-20b. The HuggingFace source to download your model. Use a repo with `.safetensors` weights. Optionally append `--include <file>` or `--revision <sha>`."
    regex: "^hf://"
  - envName: MODEL_NAME          # example: openai/gpt-oss-20b
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: openai/gpt-oss-20b. The name of your model — use the string after `hf://` in MODEL_SOURCE. This is also used as the OpenAI alias and SGLang `--model-path`."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "The model capabilities. Pick what your model supports. If no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # example: --context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description: "Example: --context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss. Extra SGLang CLI flags. Separate multiple --key value pairs with spaces. Adjust parsers to match your model family."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: SGLANG_CPU_REQUEST    # default: 200m
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_MEMORY_REQUEST # default: 2Gi
    required: true
    default: "2Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_MEMORY_LIMIT   # default: 35Gi
    required: true
    default: "35Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    description: "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB. On Spark it sets pod memory."
    regex: "^[0-9]+(Gi|Mi)?$"

metadata:
  description: "通用 SGLang 引擎基座。在安装时通过环境变量选择任意 HuggingFace Safetensors 模型。"
  title: SGLang 引擎基座

spec:
  upgradeDescription: |
    将 SGLang 从 v0.5.17-cu130 升级至 v0.5.18-cu130。Chart 1.2.32。

    **更新内容**（v0.5.17 → v0.5.18）
    - 新增模型支持：Muse Glimmer、Intern-S2-Mobius、SANA-Video、LingBot-Video-MoE、LTX-2.5、Cosmos3 Edge & Distilled、LongCat-Image，并新增 Qwen3.8、Ling-3.0、Nemotron 3.5 Lightning、Dots3-Note、DeepSeek-V4-Pro-0813 的使用示例
    - 启动加速：权重加载与 CUDA Graph 捕获重叠执行（`--startup-weight-load-mode overlap`），在 Qwen3-32B / H100 上最高比默认方式快 2.38 倍
    - 并行优化：纯 DP dp-attention 下 TP LMHead 改用 all-to-all、FlashInfer MNNVL 纯 allreduce（DeepSeek-V3/V3.2/V4 自动启用）、DSV4 支持 CP V2 及多项 DCP 优化
    - 投机解码：DSpark 与 DFlash 支持 logprobs、DP attention 下 DSpark 支持 MegaMoE、降低 ngram 主机端开销
    - 运行时与缓存：所有编译内核缓存统一收敛到 `SGLANG_CACHE_DIR`、HiCache 支持 packed/sidecar draft cache、预热后冻结 GC
    - 依赖升级：torch 2.13.0 + triton 3.7.1、FlashInfer 0.6.17、CuTeDSL 4.6.2、sgl-kernel 0.4.6.post1、DeepEP 改用发布版 wheel 安装
    - 破坏性变更：移除 torchao 集成（`--torchao-config`）；升级后首次启动会重新编译一次内核；远程媒体下载默认限制 64 MiB；MoE deferred finalize 与 DSV4 fused MHC post+pre 默认开启

    详细发布说明请访问：
    https://github.com/sgl-project/sglang/releases
  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<仓库>`。HuggingFace 模型下载源，例如 `hf://openai/gpt-oss-20b`。请选择包含 `.safetensors` 权重文件的仓库。可选追加 `--include <文件>` 或 `--revision <sha>`。
    - `MODEL_NAME`：`owner/repo`。模型名称，取 `MODEL_SOURCE` 中 `hf://` 之后的字符串，例如 `openai/gpt-oss-20b`。此项也作为 OpenAI 别名和 SGLang `--model-path` 参数。
    - `MODEL_MODE`：`chat` 或 `embedding`。对话模型选 `chat`；向量模型选 embedding 时，图表会自动添加 `--is-embedding`。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能。
    - `ENGINE_ARGS`：`--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss`。SGLang 额外 CLI 参数，多个 `--key value` 之间用空格分隔。请根据模型系列调整 `--reasoning-parser` 和 `--tool-call-parser`。详见 https://docs.sglang.io/docs/advanced_features/server_arguments。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。llm-init 容器的日志等级。
    - `SGLANG_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型所需显存。NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 SGLang 在模型准备好后启动服务。两个部分运行在不同 Deployment 中，但通过 App Common 存储共享 HF 缓存与运行状态。

    **技术栈说明**
    - **SGLang**（30000 端口）：运行模型并通过 API 提供服务
    - **llm-init**（8090 端口）：下载模型、展示进度，并通过 OpenAI API 代理到 SGLang

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `SGLANG_REQUIRED_GPU_MEMORY`；可在 ENGINE_ARGS 中调整 `--mem-fraction-static` |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - SGLang 加载大模型可能需要数分钟，请保持应用 Running 直至就绪
    - SGLang 在前缀缓存与结构化输出（JSON、工具调用、Agent）方面表现优异，默认开启前缀缓存

metadata:
  description: "通用 SGLang 引擎基座。在安装时通过环境变量选择任意 HuggingFace Safetensors 模型。"
  title: SGLang 引擎基座

spec:
  upgradeDescription: |
    将 SGLang 从 v0.5.22-cu130 升级至 v0.5.23。Chart 1.2.35。官方 NVIDIA 镜像标签现为 `v0.5.23`，仍使用 CUDA 13。

    **更新内容**（v0.5.22 → v0.5.23）

    - 新增语言/视觉模型：Muse Spark Open、Beam-1.0、MiniMax-M3.1-Flash、MiniCPM-V 4.7 和 Kev。上游还新增 Cosmos3-Nano-Sim、FLUX.3 Image Klein 等扩散模型；本 Chart 未配置扩散模型服务。
    - 提升 GB300 上 DeepSeek-V4.1 的预填充性能并降低首 token 延迟，同时加速 H200 上的 MoE 预填充。可选 NVIDIA megakernel 可加速 DeepSeek-V4.1-Flash 解码，仅在受支持配置上通过 `--enable-nvidia-megakernel` 启用。收益取决于硬件和负载。
    - 新增可选 Paged Experts，用于运行超出 GPU 显存容量的 MoE 模型；新增支持 FP8/NVFP4 MoE 模型的可选 LoRA 引擎。MLA 解码上下文并行支持 HiCache 文件型 L3 前缀存储。改进推测解码、Gemma 4 草稿计算图及 DFlash/DFlash2 attention 数据并行。
    - 移除旧版 tar 格式 `.pt` 检查点的不安全 pickle 回退加载，需离线转换为 safetensors 或 zip 格式 `.pt`。TCP ZMQ IPC 增加对端白名单校验。修复多 tokenizer 的 embedding 输出重新打包问题。

    **升级注意事项**
    - DeepSeek-V4/V4.1 的提示词与输出解析改用 deepseek-recipe。客户端需拼接流式工具调用参数片段；工具调用 ID 使用 `call_00_...` 格式。V4 的数字型 `reasoning_effort`，以及同时使用 `tools` 和 `continue_final_message` 的请求会返回 HTTP 400。请检查自定义解析器和集成。
    - 受支持 CUDA 配置默认启用 DeepSeek-V4.1 decoder SWA bounded replay，其数值结果不完全等同于完整预填充。如需一致性，请设置 `--no-enable-decoder-swa-bounded-replay`。SM100/SM103 的 PD 部署默认使用 MegaAttention，预填充和解码需同步升级并使用匹配的后端。
    - 从 ENGINE_ARGS 移除 `--speculative-skip-dp-mlp-sync`，否则启动失败。`tokenspeed_mla` 改为 `cutedsl_mla` 的废弃别名；迁移时设置 `--attention-backend cutedsl_mla --kv-cache-dtype fp8_e4m3`，推测解码还需 `--speculative-attention-mode decode`。
    - FlashInfer CUTLASS MoE 自动调优增加预填充尺寸，首次启动可能耗时更长。后续启动复用已保存结果；可通过 `--disable-flashinfer-autotune` 跳过调优。

    以上为上游引擎能力，需要匹配模型并进行运行验证。llm-init 保持 `v1.5.0`。
    详细发布说明请访问：
    https://github.com/sgl-project/sglang/releases/tag/v0.5.23
  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<仓库>`。HuggingFace 模型下载源，例如 `hf://openai/gpt-oss-20b`。请选择包含 `.safetensors` 权重文件的仓库。可选追加 `--include <文件>` 或 `--revision <sha>`。
    - `MODEL_NAME`：`owner/repo`。模型名称，取 `MODEL_SOURCE` 中 `hf://` 之后的字符串，例如 `openai/gpt-oss-20b`。此项也作为 OpenAI 别名和 SGLang `--model-path` 参数。
    - `MODEL_MODE`：`chat` 或 `embedding`。对话模型选 `chat`；向量模型选 embedding 时，图表会自动添加 `--is-embedding`。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能。
    - `ENGINE_ARGS`：`--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss`。SGLang 额外 CLI 参数，多个 `--key value` 之间用空格分隔。请根据模型系列调整 `--reasoning-parser` 和 `--tool-call-parser`。详见 https://docs.sglang.io/docs/advanced_features/server_arguments。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。llm-init 容器的日志等级。
    - `SGLANG_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型所需显存。NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 SGLang 在模型准备好后启动服务。两个部分运行在不同 Deployment 中，但通过 App Common 存储共享 HF 缓存与运行状态。

    **技术栈说明**
    - **SGLang**（30000 端口）：运行模型并通过 API 提供服务
    - **llm-init**（8090 端口）：下载模型、展示进度，并通过 OpenAI API 代理到 SGLang

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `SGLANG_REQUIRED_GPU_MEMORY`；可在 ENGINE_ARGS 中调整 `--mem-fraction-static` |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - SGLang 加载大模型可能需要数分钟，请保持应用 Running 直至就绪
    - SGLang 在前缀缓存与结构化输出（JSON、工具调用、Agent）方面表现优异，默认开启前缀缓存

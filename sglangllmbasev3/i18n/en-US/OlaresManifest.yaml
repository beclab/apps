metadata:
  description: "Generic SGLang engine base. Pick any HuggingFace Safetensors model at install via env."
  title: SGLang Engine Base

spec:
  upgradeDescription: |
    Upgrade SGLang from v0.5.22-cu130 to v0.5.23. Chart 1.2.35. The official NVIDIA image is now tagged `v0.5.23` and still uses CUDA 13.

    **What's Changed** (v0.5.22 → v0.5.23)

    - New language/vision models: Muse Spark Open, Beam-1.0, MiniMax-M3.1-Flash, MiniCPM-V 4.7, and Kev. Upstream also adds diffusion models including Cosmos3-Nano-Sim and FLUX.3 Image Klein; diffusion serving is not configured by this chart.
    - Faster DeepSeek-V4.1 prefill and lower first-token latency on GB300, plus faster MoE prefill on H200. The opt-in NVIDIA megakernel accelerates DeepSeek-V4.1-Flash decode; enable it with `--enable-nvidia-megakernel` only on supported configurations. Gains depend on hardware and workload.
    - Adds opt-in Paged Experts for MoE models larger than GPU memory and an opt-in LoRA engine for FP8/NVFP4 MoE models. MLA decode context parallelism can use HiCache file-based L3 prefix storage. Improves speculative decoding, Gemma 4 draft graphs, and DFlash/DFlash2 attention data parallelism.
    - Removes unsafe pickle fallback for legacy tar-format `.pt` checkpoints; convert them offline to safetensors or zip-format `.pt`. TCP ZMQ IPC now checks peer allowlists. Multi-tokenizer embedding output repacking is corrected.

    **Upgrade considerations**
    - DeepSeek-V4/V4.1 prompts and output parsing now use deepseek-recipe. Clients must concatenate streamed tool-call argument chunks; tool-call IDs use `call_00_...`. Numeric V4 `reasoning_effort` and requests combining `tools` with `continue_final_message` return HTTP 400. Review custom parsers and integrations.
    - DeepSeek-V4.1 decoder SWA bounded replay is enabled by default for supported CUDA configurations and is not numerically identical to full prefill. Use `--no-enable-decoder-swa-bounded-replay` when full-prefill equivalence is required. PD deployments on SM100/SM103 default to MegaAttention: upgrade prefill/decode together and use matching backends.
    - Remove `--speculative-skip-dp-mlp-sync` from ENGINE_ARGS; it now fails at startup. `tokenspeed_mla` is a deprecated alias for `cutedsl_mla`; migrate with `--attention-backend cutedsl_mla --kv-cache-dtype fp8_e4m3` and, for speculative decoding, `--speculative-attention-mode decode`.
    - FlashInfer CUTLASS MoE autotuning now covers prefill sizes, so the first startup can take longer. Later startups reuse saved results; `--disable-flashinfer-autotune` skips tuning.

    These are upstream engine capabilities and require matching models and runtime validation. llm-init remains at `v1.5.0`.
    For detailed release notes, visit:
    https://github.com/sgl-project/sglang/releases/tag/v0.5.23
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo>`. The HuggingFace source to download your model, for example `hf://openai/gpt-oss-20b`. Use a repo that contains `.safetensors` weight files. Optionally append `--include <file>` or `--revision <sha>`.
    - `MODEL_NAME`: `owner/repo`. The name of your model — use the string after `hf://` in `MODEL_SOURCE`, for example `openai/gpt-oss-20b`. This is also used as the OpenAI alias and SGLang `--model-path`.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; for embedding, the chart auto-adds `--is-embedding`.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports.
    - `ENGINE_ARGS`: `--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss`. Extra SGLang CLI flags. Separate multiple `--key value` pairs with spaces. Adjust `--reasoning-parser` and `--tool-call-parser` to match your model family. See https://docs.sglang.io/docs/advanced_features/server_arguments.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `SGLANG_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.

    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then SGLang starts serving the model when it's ready. These two parts run in separate Deployments but share the HF cache and run-state via App Common storage.

    **Stack**
    - **SGLang** (port 30000): runs the model and serves API requests
    - **llm-init** (port 8090): downloads the model, shows progress, and provides the OpenAI API, proxying to SGLang

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `SGLANG_REQUIRED_GPU_MEMORY`; tune `--mem-fraction-static` in ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                         |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - SGLang model loading can take several minutes for large models. Keep the app Running until ready.
    - SGLang excels at prefix caching and structured output (JSON, tool calls, agents); prefix caching is enabled by default.

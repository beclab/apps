olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: localdeepresearch
  appid: localdeepresearch
  title: Local Deep Research
  description: Research assistant using local or cloud language models and multiple search engines
  icon: https://cdn.olares.com/images/2026/10/53941d6c0caf9c480c9c042b6e3aaefa.png
  version: 0.0.12
  categories: [agents]
entrances:
  - name: localdeepresearch
    host: localdeepresearch
    port: 5000
    title: Local Deep Research
    icon: https://cdn.olares.com/images/2026/10/53941d6c0caf9c480c9c042b6e3aaefa.png
    authLevel: private
    openMethod: window
spec:
  versionName: '1.10.7'
  submitter: Olares
  locale: [en-US, zh-CN, de-DE, fr-FR, es-ES, it-IT, ja-JP]
  featuredImage: https://cdn.olares.com/images/2026/10/b1d5a6d3ef158a3e8227429f2daa1dff.png
  promoteImage:
    - https://cdn.olares.com/images/2026/10/b1d5a6d3ef158a3e8227429f2daa1dff.png
    - https://cdn.olares.com/images/2026/10/e990ed9b9daf2b70ffb57b70320a1662.png
  runAsUser: true
  developer: LearningCircuit
  website: https://github.com/LearningCircuit/local-deep-research
  sourceCode: https://github.com/LearningCircuit/local-deep-research
  license:
    - {text: MIT, url: 'https://github.com/LearningCircuit/local-deep-research/blob/v1.10.7/LICENSE'}
  fullDescription: |
    Local Deep Research is an open-source AI research assistant. It searches sources, asks follow-up questions and synthesizes findings into reports with citations using your chosen language model.

    Features
    - Choose Quick Summary, Detailed Report or experimental Chat Mode.
    - Search the web through SearXNG and other supported search engines.
    - Organize documents into a research library and collections for semantic search.
    - Save research history and export reports as Markdown or PDF.
    - Keep account databases, research output and configuration in persistent application storage.

    Getting started
    1. Install AI Router and SearXNG v3. Configure a callable default chat model in Router.
    2. Copy the SearXNG HTTPS entrance URL from Olares Settings and enter it as SEARXNG_URL during installation, without /search.
    3. Open Local Deep Research and register an application account. Keep its password safe: the encrypted account database has no password recovery.
    4. Enter a research question and choose a research mode. The application uses Router's default-chat model and SearXNG by default.

    To use another OpenAI-compatible provider, change the model name and endpoint URL in the application environment settings and supply its API key if required. Leave the endpoint override and API key blank to use AI Router.

    The application does not host a language model. Router can use a local model or a configured cloud provider. Web research sends queries to the selected search services; cloud models receive the content used for inference. Document indexing may require an embedding model download.
  requiredCpu: 200m
  limitedCpu: '2'
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
  supportArch: [amd64, arm64]
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - {name: olares, type: system, version: '>=1.12.7-0'}
    - {name: router, type: application, version: '>=1.0.89-0', mandatory: true}
    - {name: searxngv3, type: application, version: '>=1.1.12-0', mandatory: true}
workloadReplicas:
  localdeepresearch: 1
envs:
  - envName: SEARXNG_URL
    type: url
    default: ''
    required: true
    editable: true
    applyOnChange: true
    description: SearXNG application entrance URL from Olares Settings, without /search.
  - {envName: LDR_LLM_MODEL, type: string, default: 'default-chat', required: false, editable: true, applyOnChange: true, description: "AI Router default chat route, or the model name supported by your custom endpoint."}
  - {envName: LDR_LLM_OPENAI_ENDPOINT_URL, type: url, default: '', required: false, editable: true, applyOnChange: true, description: "Optional OpenAI-compatible API base URL including /v1. Leave blank to use AI Router automatically."}
  - {envName: LDR_LLM_OPENAI_ENDPOINT_API_KEY, type: password, default: '', required: false, editable: true, applyOnChange: true, description: "Optional API key for your custom endpoint. AI Router does not require a key for this application."}

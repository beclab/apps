metadata:
  title: Local Deep Research
  description: Asistente de investigación con modelos de lenguaje locales o en la nube y varios motores de búsqueda
spec:
  fullDescription: |
    Local Deep Research es un asistente de investigación con IA de código abierto. Busca fuentes, plantea preguntas de seguimiento y sintetiza los hallazgos en informes con citas mediante el modelo de lenguaje que elijas.

    Funciones
    - Elige un resumen rápido, un informe detallado o el modo de chat experimental.
    - Busca en la Web mediante SearXNG y otros motores compatibles.
    - Organiza documentos en una biblioteca de investigación y colecciones para realizar búsquedas semánticas.
    - Guarda el historial de investigación y exporta los informes en Markdown o PDF.
    - Conserva las bases de datos de las cuentas, los resultados y la configuración en el almacenamiento persistente de la aplicación.

    Primeros pasos
    1. Instala AI Router y SearXNG v3. Configura en Router un modelo de chat predeterminado que pueda responder a solicitudes.
    2. Copia la URL de acceso HTTPS de SearXNG desde los ajustes de Olares e introdúcela como SEARXNG_URL durante la instalación, sin /search.
    3. Abre Local Deep Research y crea una cuenta en la aplicación. Guarda la contraseña en un lugar seguro: la base de datos cifrada de la cuenta no permite recuperar una contraseña olvidada.
    4. Introduce una pregunta y elige un modo de investigación. La aplicación utiliza por defecto el modelo default-chat de Router y SearXNG.

    Para usar otro proveedor compatible con OpenAI, cambia el nombre del modelo y la URL del endpoint en las variables de entorno de la aplicación e introduce su clave API si es necesaria. Deja la URL personalizada y la clave API en blanco para usar AI Router.

    La aplicación no aloja un modelo de lenguaje. Router puede usar un modelo local o un proveedor en la nube configurado. La investigación web envía consultas a los servicios de búsqueda seleccionados; los modelos en la nube reciben el contenido utilizado para la inferencia. La indexación de documentos puede requerir la descarga de un modelo de embeddings.

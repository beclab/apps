metadata:
  title: Local Deep Research
  description: Rechercheassistent mit lokalen oder cloudbasierten Sprachmodellen und mehreren Suchmaschinen
spec:
  fullDescription: |
    Local Deep Research ist ein quelloffener KI-Rechercheassistent. Er sucht nach Quellen, stellt Folgefragen und fasst die Ergebnisse mithilfe des von Ihnen gewählten Sprachmodells in Berichten mit Quellenangaben zusammen.

    Funktionen
    - Wählen Sie eine Kurzzusammenfassung, einen ausführlichen Bericht oder den experimentellen Chat-Modus.
    - Durchsuchen Sie das Web mit SearXNG und anderen unterstützten Suchmaschinen.
    - Organisieren Sie Dokumente in einer Recherchebibliothek und Sammlungen für die semantische Suche.
    - Speichern Sie den Rechercheverlauf und exportieren Sie Berichte als Markdown oder PDF.
    - Bewahren Sie Kontodatenbanken, Rechercheergebnisse und Konfiguration im persistenten Anwendungsspeicher auf.

    Erste Schritte
    1. Installieren Sie AI Router und SearXNG v3. Konfigurieren Sie in Router ein aufrufbares Standard-Chatmodell.
    2. Kopieren Sie die HTTPS-Eingangsadresse von SearXNG aus den Olares-Einstellungen und geben Sie sie bei der Installation als SEARXNG_URL ein, ohne /search.
    3. Öffnen Sie Local Deep Research und registrieren Sie ein Anwendungskonto. Bewahren Sie das Passwort sicher auf: Für die verschlüsselte Kontodatenbank gibt es keine Passwortwiederherstellung.
    4. Geben Sie eine Recherchefrage ein und wählen Sie einen Recherchemodus. Die Anwendung verwendet standardmäßig das Modell default-chat von Router und SearXNG.

    Um einen anderen OpenAI-kompatiblen Anbieter zu verwenden, ändern Sie den Modellnamen und die Endpunkt-URL in den Umgebungsvariablen der Anwendung und geben Sie bei Bedarf dessen API-Schlüssel an. Lassen Sie die Endpunkt-URL und den API-Schlüssel leer, um AI Router zu verwenden.

    Die Anwendung selbst hostet kein Sprachmodell. Router kann ein lokales Modell oder einen konfigurierten Cloudanbieter verwenden. Bei Webrecherchen werden Suchanfragen an die ausgewählten Suchdienste gesendet; Cloudmodelle erhalten die für die Inferenz verwendeten Inhalte. Für die Dokumentindexierung kann der Download eines Embedding-Modells erforderlich sein.

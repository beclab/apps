metadata:
  title: Local Deep Research
  description: ローカルまたはクラウドの言語モデルと複数の検索エンジンを利用する AI 調査アシスタント
spec:
  fullDescription: |
    Local Deep Research はオープンソースの AI 調査アシスタントです。選択した言語モデルを使って資料を検索し、追加の質問を作成して、調査結果を引用付きのレポートにまとめます。

    主な機能
    - 簡易要約、詳細レポート、実験的なチャットモードから選択できます。
    - SearXNG やその他の対応検索エンジンで Web を検索できます。
    - 文書を調査ライブラリやコレクションに整理し、意味に基づく検索を行えます。
    - 調査履歴を保存し、レポートを Markdown または PDF でエクスポートできます。
    - アカウントのデータベース、調査結果、設定をアプリの永続ストレージに保存します。

    使い始めるには
    1. AI Router と SearXNG v3 をインストールします。Router で呼び出し可能なデフォルトのチャットモデルを設定してください。
    2. Olares の設定から SearXNG の HTTPS アクセス URL をコピーし、インストール時に SEARXNG_URL として入力します。末尾に /search を付けないでください。
    3. Local Deep Research を開き、アプリのアカウントを登録します。パスワードは安全に保管してください。暗号化されたアカウントデータベースには、パスワードを復旧する機能がありません。
    4. 調査したい質問を入力し、調査モードを選択します。アプリはデフォルトで Router の default-chat モデルと SearXNG を使用します。

    別の OpenAI 互換サービスを使うには、アプリの環境変数設定でモデル名とエンドポイント URL を変更し、必要に応じて API キーを入力してください。カスタム URL と API キーを空欄にすると、AI Router を使用します。

    このアプリ自体は言語モデルをホストしません。Router はローカルモデルまたは設定済みのクラウドサービスを使用できます。Web 調査では、選択した検索サービスに検索クエリを送信します。クラウドモデルには推論に使用する内容が送信されます。文書のインデックス作成には、埋め込みモデルのダウンロードが必要になる場合があります。

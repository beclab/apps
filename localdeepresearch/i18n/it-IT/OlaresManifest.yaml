metadata:
  title: Local Deep Research
  description: Assistente di ricerca con modelli linguistici locali o cloud e diversi motori di ricerca
spec:
  fullDescription: |
    Local Deep Research è un assistente di ricerca IA open source. Cerca fonti, pone domande di approfondimento e sintetizza i risultati in report con citazioni utilizzando il modello linguistico che scegli.

    Funzionalità
    - Scegli un riepilogo rapido, un report dettagliato o la modalità chat sperimentale.
    - Cerca sul Web con SearXNG e altri motori supportati.
    - Organizza i documenti in una biblioteca di ricerca e in raccolte per la ricerca semantica.
    - Salva la cronologia delle ricerche ed esporta i report in Markdown o PDF.
    - Conserva i database degli account, i risultati e la configurazione nello spazio di archiviazione persistente dell'applicazione.

    Per iniziare
    1. Installa AI Router e SearXNG v3. Configura in Router un modello di chat predefinito in grado di rispondere alle richieste.
    2. Copia l'URL di accesso HTTPS di SearXNG dalle impostazioni di Olares e inseriscilo come SEARXNG_URL durante l'installazione, senza /search.
    3. Apri Local Deep Research e crea un account nell'applicazione. Conserva la password al sicuro: il database crittografato dell'account non consente di recuperare una password dimenticata.
    4. Inserisci una domanda e scegli una modalità di ricerca. L'applicazione usa per impostazione predefinita il modello default-chat di Router e SearXNG.

    Per utilizzare un altro provider compatibile con OpenAI, modifica il nome del modello e l'URL dell'endpoint nelle variabili d'ambiente dell'applicazione e inserisci la relativa chiave API se richiesta. Lascia vuoti l'URL personalizzato e la chiave API per utilizzare AI Router.

    L'applicazione non ospita un modello linguistico. Router può usare un modello locale o un provider cloud configurato. Le ricerche Web inviano le query ai servizi di ricerca selezionati; i modelli cloud ricevono i contenuti utilizzati per l'inferenza. L'indicizzazione dei documenti può richiedere il download di un modello di embedding.

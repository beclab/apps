metadata:
  title: Local Deep Research
  description: 使用本地或云端语言模型及多种搜索引擎的 AI 研究助手
spec:
  fullDescription: |
    Local Deep Research 是开源 AI 研究助手。它使用你选择的语言模型搜索资料、提出后续问题，并将发现整理成带引用的报告。

    主要功能
    - 提供快速摘要、详细报告和实验性的对话研究模式。
    - 通过 SearXNG 及其他支持的搜索引擎搜索网页。
    - 将文档整理到研究资料库和集合中，支持语义搜索。
    - 保存研究历史，将报告导出为 Markdown 或 PDF。
    - 将加密的账号数据库、研究结果和配置保存在应用持久化存储中。

    开始使用
    1. 安装 AI Router 和 SearXNG v3，在 Router 中配置可调用的默认聊天模型。
    2. 从 Olares 设置中复制 SearXNG 的 HTTPS 入口地址，在安装时填入 SEARXNG_URL，不要添加 /search。
    3. 打开应用并注册应用账号。请妥善保管密码：加密的账号数据库不支持密码找回。
    4. 输入研究问题并选择研究模式。应用默认使用 Router 的 default-chat 模型和 SearXNG。

    如需使用其他兼容 OpenAI 的服务，请在应用环境设置中修改模型名和接口地址，并根据服务要求填写 API key。接口地址和 API key 留空时，应用自动连接 AI Router。

    应用本身不托管语言模型。Router 可以连接本地模型或已配置的云端服务。网页研究会向所选搜索服务发送查询，云端模型会接收用于推理的内容。文档索引可能需要下载嵌入模型。

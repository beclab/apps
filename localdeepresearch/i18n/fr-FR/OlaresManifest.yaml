metadata:
  title: Local Deep Research
  description: Assistant de recherche utilisant des modèles de langage locaux ou cloud et plusieurs moteurs de recherche
spec:
  fullDescription: |
    Local Deep Research est un assistant de recherche IA open source. Il recherche des sources, pose des questions complémentaires et synthétise les résultats dans des rapports avec citations à l'aide du modèle de langage de votre choix.

    Fonctionnalités
    - Choisissez un résumé rapide, un rapport détaillé ou le mode conversation expérimental.
    - Effectuez des recherches sur le Web avec SearXNG et d'autres moteurs pris en charge.
    - Organisez les documents dans une bibliothèque de recherche et des collections pour la recherche sémantique.
    - Enregistrez l'historique des recherches et exportez les rapports en Markdown ou PDF.
    - Conservez les bases de données des comptes, les résultats et la configuration dans le stockage persistant de l'application.

    Premiers pas
    1. Installez AI Router et SearXNG v3. Configurez dans Router un modèle de conversation par défaut prêt à répondre aux requêtes.
    2. Copiez l'URL d'accès HTTPS de SearXNG depuis les paramètres Olares et saisissez-la comme SEARXNG_URL pendant l'installation, sans /search.
    3. Ouvrez Local Deep Research et créez un compte dans l'application. Conservez votre mot de passe en lieu sûr : la base de données chiffrée du compte ne permet pas de récupérer un mot de passe oublié.
    4. Saisissez une question et choisissez un mode de recherche. L'application utilise par défaut le modèle default-chat de Router et SearXNG.

    Pour utiliser un autre fournisseur compatible avec OpenAI, modifiez le nom du modèle et l'URL du point de terminaison dans les variables d'environnement de l'application et indiquez sa clé API si nécessaire. Laissez l'URL personnalisée et la clé API vides pour utiliser AI Router.

    L'application n'héberge pas de modèle de langage. Router peut utiliser un modèle local ou un fournisseur cloud configuré. Les recherches Web transmettent les requêtes aux services sélectionnés ; les modèles cloud reçoivent le contenu utilisé pour l'inférence. L'indexation des documents peut nécessiter le téléchargement d'un modèle d'embedding.

metadata:
  title: Mealie
  description: すべてのレシピのための場所
spec:
  upgradeDescription: |
    上流リリース：[Mealie v3.25.1](https://github.com/mealie-recipes/mealie/releases/tag/v3.25.1)

    **修正**

    - Mealie を iframe に埋め込んだときのサインイン。
    - レシピの時間単位が現在のロケールに従います。

    初回ログインは引き続き `changeme@example.com` / `MyPassword` です。Mealie は初回サインインでパスワード変更を求めます。

    **Olares のデプロイ変更**

    - このアプリの古い Mealie からアップグレードすると、残っているファイルの所有権を合わせ、新しいプロセスが起動できるようにします。

  fullDescription: |
    Mealie はセルフホスト型のレシピ管理、献立プランナー、買い物リストで、RestAPI バックエンドと Vue 製のリアクティブフロントエンドにより、家族全員にとって快適な体験を提供します。URL を指定するだけで関連データを自動取り込みしたり、UI エディタで家庭のレシピを追加できます。サードパーティアプリ向けの API も用意されています。

    **主な機能**
    - レシピ取り込み: URL からインポート、または手動入力でレシピを作成
    - 献立プランナー: Meal Planner で来週の料理を計画
    - 買い物リスト: 必要な食材を地元スーパーの売り場区分ごとに整理
    - クックブック: 独自の基準でレシピをグループ化
    - 多言語対応: 35 以上の言語の翻訳

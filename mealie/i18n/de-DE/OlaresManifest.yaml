metadata:
  title: Mealie
  description: Ein Ort für all deine Rezepte
spec:
  upgradeDescription: |
    Upstream-Release: [Mealie v3.25.1](https://github.com/mealie-recipes/mealie/releases/tag/v3.25.1)

    **Fehlerbehebungen**

    - Anmeldung, wenn Mealie in einem iframe eingebettet ist.
    - Zeiteinheiten in Rezepten folgen der aktiven Locale.

    Der erste Login bleibt `changeme@example.com` / `MyPassword`. Mealie verlangt beim ersten Anmelden eine Passwortänderung.

    **Olares-Bereitstellungsänderungen**

    - Beim Upgrade von einer älteren Mealie auf dieser App übernimmt der neue Prozess die verbliebenen Dateien, damit er starten kann.

  fullDescription: |
    Mealie ist ein selbst gehosteter Rezeptmanager, Essensplaner und Einkaufsliste mit RestAPI-Backend und reaktivem Frontend in Vue für ein angenehmes Nutzererlebnis für die ganze Familie. Füge Rezepte einfach per URL hinzu — Mealie importiert die relevanten Daten automatisch — oder erfasse Familienrezepte im UI-Editor. Mealie bietet außerdem eine API für Interaktionen mit Drittanbieter-Anwendungen.

    **Hauptfunktionen**
    - Rezeptimport: Rezepte erstellen, per URL importieren oder manuell eingeben
    - Essensplaner: Plane mit dem Meal Planner, was du nächste Woche kochst
    - Einkaufsliste: Lege benötigte Zutaten auf die Einkaufsliste, organisiert nach Abteilungen deines lokalen Supermarkts
    - Kochbücher: Gruppiere Rezepte nach eigenen Kriterien in Kochbüchern
    - Lokalisierung: Übersetzungen für über 35 Sprachen

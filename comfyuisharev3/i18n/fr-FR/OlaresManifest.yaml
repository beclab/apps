metadata:
  title: ComfyUI
  description: L'interface graphique et le backend Stable Diffusion les plus puissants et modulaires
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une version partagée de ComfyUI. Un seul service sera installé sur l'ensemble du système Olares. Chaque utilisateur doit toutefois installer une entrée bureau pour accéder au service installé par l'administrateur Olares.

    **APERÇU**
    L'interface graphique et le backend Stable Diffusion les plus puissants et modulaires.
    Cette interface vous permet de concevoir et d'exécuter des pipelines Stable Diffusion avancés via une interface basée sur graphes/nœuds/organigrammes.

    **Fonctionnalités**

    - Interface nœuds/graphe/organigramme pour expérimenter et créer des workflows Stable Diffusion complexes sans coder.
    - REMARQUE : Bien plus de modèles sont pris en charge que la liste ci-dessous ; consultez la liste des modèles dans ComfyUI pour voir ce qui est supporté.
    - Modèles d'image
      - SD1.x, SD2.x ([unCLIP](https://comfyanonymous.github.io/ComfyUI_examples/unclip/))
      - [SDXL](https://comfyanonymous.github.io/ComfyUI_examples/sdxl/), [SDXL Turbo](https://comfyanonymous.github.io/ComfyUI_examples/sdturbo/)
      - [Stable Cascade](https://comfyanonymous.github.io/ComfyUI_examples/stable_cascade/)
      - [SD3 and SD3.5](https://comfyanonymous.github.io/ComfyUI_examples/sd3/)
      - Pixart Alpha and Sigma
      - [AuraFlow](https://comfyanonymous.github.io/ComfyUI_examples/aura_flow/)
      - [HunyuanDiT](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_dit/)
      - [Flux](https://comfyanonymous.github.io/ComfyUI_examples/flux/)
      - [Lumina Image 2.0](https://comfyanonymous.github.io/ComfyUI_examples/lumina2/)
      - [HiDream](https://comfyanonymous.github.io/ComfyUI_examples/hidream/)
      - [Qwen Image](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/)
      - [Hunyuan Image 2.1](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_image/)
      - [Flux 2](https://comfyanonymous.github.io/ComfyUI_examples/flux2/)
      - [Z Image](https://comfyanonymous.github.io/ComfyUI_examples/z_image/)
    - Modèles d'édition d'image
      - [Omnigen 2](https://comfyanonymous.github.io/ComfyUI_examples/omnigen/)
      - [Flux Kontext](https://comfyanonymous.github.io/ComfyUI_examples/flux/#flux-kontext-image-editing-model)
      - [HiDream E1.1](https://comfyanonymous.github.io/ComfyUI_examples/hidream/#hidream-e11)
      - [Qwen Image Edit](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/#edit-model)
    - Modèles vidéo
      - [Stable Video Diffusion](https://comfyanonymous.github.io/ComfyUI_examples/video/)
      - [Mochi](https://comfyanonymous.github.io/ComfyUI_examples/mochi/)
      - [LTX-Video](https://comfyanonymous.github.io/ComfyUI_examples/ltxv/)
      - [Hunyuan Video](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_video/)
      - [Wan 2.1](https://comfyanonymous.github.io/ComfyUI_examples/wan/)
      - [Wan 2.2](https://comfyanonymous.github.io/ComfyUI_examples/wan22/)
      - [Hunyuan Video 1.5](https://docs.comfy.org/tutorials/video/hunyuan/hunyuan-video-1-5)
    - Modèles audio
      - [Stable Audio](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
      - [ACE Step](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
    - Modèles 3D
      - [Hunyuan3D 2.0](https://docs.comfy.org/tutorials/3d/hunyuan3D-2)
    - Système de file d'attente asynchrone
    - Nombreuses optimisations : ne réexécute que les parties du workflow qui changent entre les exécutions.
    - Gestion intelligente de la mémoire : peut exécuter automatiquement de grands modèles sur des GPU avec seulement 1 Go de VRAM grâce au déchargement intelligent.
    - Fonctionne même sans GPU avec : ```--cpu``` (lent)
    - Peut charger ckpt et safetensors : checkpoints tout-en-un ou modèles de diffusion autonomes, VAE et modèles CLIP.
    - Chargement sûr des fichiers ckpt, pt, pth, etc.
    - Embeddings/inversion textuelle
    - [Loras (regular, locon et loha)](https://comfyanonymous.github.io/ComfyUI_examples/lora/)
    - [Hypernetworks](https://comfyanonymous.github.io/ComfyUI_examples/hypernetworks/)
    - Chargement de workflows complets (avec seeds) depuis des fichiers PNG, WebP et FLAC générés.
    - Enregistrement/chargement de workflows en fichiers JSON.
    - L'interface de nœuds peut créer des workflows complexes comme [Hires fix](https://comfyanonymous.github.io/ComfyUI_examples/2_pass_txt2img/) ou bien plus avancés.
    - [Area Composition](https://comfyanonymous.github.io/ComfyUI_examples/area_composition/)
    - [Inpainting](https://comfyanonymous.github.io/ComfyUI_examples/inpaint/) avec modèles normaux et d'inpainting.
    - [ControlNet et T2I-Adapter](https://comfyanonymous.github.io/ComfyUI_examples/controlnet/)
    - [Modèles d'upscale (ESRGAN, variantes ESRGAN, SwinIR, Swin2SR, etc.)](https://comfyanonymous.github.io/ComfyUI_examples/upscale_models/)
    - [GLIGEN](https://comfyanonymous.github.io/ComfyUI_examples/gligen/)
    - [Model Merging](https://comfyanonymous.github.io/ComfyUI_examples/model_merging/)
    - [Modèles LCM et Loras](https://comfyanonymous.github.io/ComfyUI_examples/lcm/)
    - Aperçus latents avec [TAESD](#how-to-show-high-quality-previews)
    - Fonctionne entièrement hors ligne : le cœur ne télécharge jamais rien sauf si vous le souhaitez.
    - Nœuds API optionnels pour utiliser des modèles payants de fournisseurs externes via la [Comfy API](https://docs.comfy.org/tutorials/api-nodes/overview) en ligne ; désactiver avec : `--disable-api-nodes`
    - [Fichier de configuration](extra_model_paths.yaml.example) pour définir les chemins de recherche des modèles.

    Des exemples de workflows se trouvent sur la [page Examples](https://comfyanonymous.github.io/ComfyUI_examples/)

    **Stockage des modèles (App Common)**
    Le hub de modèles partagé se trouve dans le répertoire App Common
    `appCommon/comfyui/model` (SSD en mono-nœud, JuiceFS en multi-nœuds).

    **Disposition des données**
    - Installation de l'app (plugins, cache, config) : `appData/comfyui` (hôte `/app/comfyui`)
    - Entrée / sortie : `appCommon/comfyui/input` et `appCommon/comfyui/output`

  upgradeDescription: |
    ComfyUI 0.37.0 ajoute la prise en charge de Qwen-Image 2.1 et MoGe 3, enrichit les réglages de génération musicale et corrige des problèmes de génération audio.

    - Utiliser Qwen-Image 2.1 et MoGe 3 dans les workflows.
    - Régler le guidage CFG dans le nœud YuE2 Generate Music.
    - Correction des plantages du décodage audio ACE-Step sur les GPU sans prise en charge de BF16.
    - Correction du bruit produit par MiniMax Music 3 lorsque CUDA graphs est activé.
    - Réduction du pic de mémoire GPU utilisé par Wan avec l'implémentation d'attention de comfy-kitchen.

    [Notes de version de ComfyUI 0.37.0](https://github.com/Comfy-Org/ComfyUI/releases/tag/v0.37.0)

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  memos: 1
metadata:
  name: memos
  description: Effortlessly craft your impactful content.
  icon: https://app.cdn.olares.com/appstore/memos/icon.png
  appid: memos
  version: '1.0.21'
  title: Memos
  categories:
  - Productivity_v112
  - workspace
  tags:
  - knowledge-base
  - note-taking

permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '0.31.0'
  upgradeDescription: |
    Upgrade Memos to 0.31.0 (`neosmemo/memos:0.31.0`).

    **Highlights**
    * Spaces for collaboration; Calendar and Map views
    * Saved Views, export/import ZIP, chunked attachment uploads
    * Rebuilt Markdown editor (from 0.30) and Web Clipper

    **Breaking changes**
    * RSS feeds are removed
    * Without `MEMOS_INSTANCE_URL` the instance stays private (sign-in required)
    * Shortcut API is replaced by Views; shared-memo API path changed in 0.30
    * Existing Shortcuts migrate to Views automatically

    `MEMOS_DSN` remains a Kubernetes Secret (`postgres://` DSN). No new required env vars.
  featuredImage: https://app.cdn.olares.com/appstore/memos/1.jpg
  promoteImage:
  - https://app.cdn.olares.com/appstore/memos/1.jpg
  - https://app.cdn.olares.com/appstore/memos/2.jpg
  - https://app.cdn.olares.com/appstore/memos/3.jpg
  - https://app.cdn.olares.com/appstore/memos/4.jpg
  fullDescription: |
    An open-source, self-hosted note-taking solution designed for seamless deployment and multi-platform access. Experience effortless plain text writing with pain-free, complemented by robust Markdown syntax support for enhanced formatting.

    **Main Features**
    - Privacy First: Take control of your data. All runtime data is securely stored in your local database.
    - Create at Speed: Save content as plain text for quick access, with Markdown support for fast formatting and easy sharing.
    - Lightweight but Powerful: Built with Go, React.js, and a compact architecture, our application delivers powerful performance in a lightweight package.
    - Customizable: Easily customize your server name, icon, description, system style, and execution scripts to make it uniquely yours.
    - Open Source: Memos embraces the future of open source, with all code available on GitHub for transparency and collaboration.
    - Free to Use: Enjoy all features completely free, with no charges ever for any content.

  developer: NeosMemo
  website: https://www.usememos.com/
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 128Mi
  limitedDisk: 5Gi
  requiredCpu: 0.5
  limitedCpu: 3
  doc: https://www.usememos.com/docs
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: memos
  port: 5230
  host: memos
  title: memos
  icon: https://app.cdn.olares.com/appstore/memos/icon.png
  openMethod: window
middleware:
  postgres:
    username: memos
    databases:
    - name: memosdb
metadata:
  title: Memos
  description: Crea sin esfuerzo tu contenido con impacto
spec:
  fullDescription: |
    Una solución de notas de código abierto y autoalojada, pensada para un despliegue sencillo y acceso multiplataforma. Escribe texto plano sin fricción, con sólido soporte de sintaxis Markdown para un mejor formato.

    **Funciones principales**
    - Privacidad primero: Controla tus datos. Todos los datos en tiempo de ejecución se guardan de forma segura en tu base de datos local.
    - Crear a gran velocidad: Guarda contenido como texto plano para acceso rápido, con Markdown para formatear y compartir fácilmente.
    - Ligera pero potente: Construida con Go, React.js y una arquitectura compacta, ofrece un rendimiento potente en un paquete ligero.
    - Personalizable: Personaliza fácilmente el nombre del servidor, el icono, la descripción, el estilo del sistema y los scripts de ejecución.
    - Código abierto: Memos abraza el futuro del open source; todo el código está en GitHub para transparencia y colaboración.
    - Gratis: Disfruta de todas las funciones sin coste, sin cargos por ningún contenido.

  upgradeDescription: |
    Actualización de Memos a 0.31.0 (`neosmemo/memos:0.31.0`).

    Mover `MEMOS_DSN` a un Secret de Kubernetes e inyectarlo con `secretKeyRef`; usar la forma DSN oficial `postgres://`.

    Eliminar las variables de entorno no usadas `PUID` / `PGID` / `DISPLAY` / `MEMOS_MODE` que la imagen oficial no utiliza.

metadata:
  title: Memos
  description: 影響力のあるコンテンツを手軽に作成
spec:
  fullDescription: |
    シームレスなデプロイとマルチプラットフォームアクセス向けに設計された、オープンソースのセルフホスト型メモソリューション。プレーンテキストでの快適な執筆に加え、強化された書式設定のための堅牢な Markdown 構文サポートを提供します。

    **主な機能**
    - Privacy First: データを自分で管理。すべてのランタイムデータはローカルデータベースに安全に保存されます。
    - 高速作成: 素早いアクセスのためプレーンテキストで保存し、Markdown で素早く整形・共有。
    - 軽量でも強力: Go、React.js、コンパクトなアーキテクチャで、軽量パッケージながら高い性能。
    - カスタマイズ可能: サーバー名、アイコン、説明、システムスタイル、実行スクリプトを簡単にカスタマイズ。
    - オープンソース: Memos はオープンソースの未来を支持し、すべてのコードを GitHub で公開して透明性と協業を実現。
    - 無料: すべての機能を完全無料で利用でき、コンテンツへの課金はありません。

  upgradeDescription: |
    Memos を 0.31.0（`neosmemo/memos:0.31.0`）へアップグレード。

    `MEMOS_DSN` を Kubernetes Secret に移し `secretKeyRef` で注入。公式の `postgres://` DSN 形式を使用。

    公式イメージで使われない未使用の環境変数 `PUID` / `PGID` / `DISPLAY` / `MEMOS_MODE` を削除。

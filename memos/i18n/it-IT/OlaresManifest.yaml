metadata:
  title: Memos
  description: Crea senza sforzo i tuoi contenuti di impatto
spec:
  fullDescription: |
    Una soluzione open-source e self-hosted per prendere appunti, pensata per un deployment senza attriti e accesso multipiattaforma. Scrivi testo semplice senza fatica, con un solido supporto della sintassi Markdown per una formattazione migliore.

    **Funzionalità principali**
    - Privacy First: Controlla i tuoi dati. Tutti i dati di runtime sono archiviati in sicurezza nel database locale.
    - Crea a velocità: Salva i contenuti come testo semplice per un accesso rapido, con Markdown per formattare e condividere facilmente.
    - Leggera ma potente: Costruita con Go, React.js e un’architettura compatta, offre prestazioni potenti in un pacchetto leggero.
    - Personalizzabile: Personalizza facilmente nome del server, icona, descrizione, stile di sistema e script di esecuzione.
    - Open Source: Memos abbraccia l’open source; tutto il codice è su GitHub per trasparenza e collaborazione.
    - Gratis: Goditi tutte le funzioni senza costi, mai addebiti per i contenuti.

  upgradeDescription: |
    Aggiornamento di Memos a 0.31.0 (`neosmemo/memos:0.31.0`).

    Spostare `MEMOS_DSN` in un Secret Kubernetes e iniettarlo via `secretKeyRef`; usare la forma DSN ufficiale `postgres://`.

    Rimuovere le env non usate `PUID` / `PGID` / `DISPLAY` / `MEMOS_MODE` non utilizzate dall’immagine ufficiale.

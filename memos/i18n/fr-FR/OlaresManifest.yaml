metadata:
  title: Memos
  description: Créez sans effort votre contenu percutant
spec:
  fullDescription: |
    Une solution de prise de notes open source et auto-hébergée, conçue pour un déploiement fluide et un accès multiplateforme. Écrivez en texte brut sans friction, avec un solide support Markdown pour un meilleur formatage.

    **Fonctionnalités principales**
    - Confidentialité d’abord : Gardez le contrôle de vos données. Toutes les données d’exécution sont stockées en toute sécurité dans votre base locale.
    - Créer à toute vitesse : Enregistrez le contenu en texte brut pour un accès rapide, avec Markdown pour formater et partager facilement.
    - Léger mais puissant : Construit avec Go, React.js et une architecture compacte, l’application offre de solides performances dans un package léger.
    - Personnalisable : Personnalisez facilement le nom du serveur, l’icône, la description, le style système et les scripts d’exécution.
    - Open Source : Memos embrasse l’open source ; tout le code est sur GitHub pour la transparence et la collaboration.
    - Gratuit : Profitez de toutes les fonctions gratuitement, sans frais pour aucun contenu.

  upgradeDescription: |
    Mise à niveau de Memos vers 0.31.0 (`neosmemo/memos:0.31.0`).

    Déplacer `MEMOS_DSN` dans un Secret Kubernetes et l’injecter via `secretKeyRef` ; utiliser la forme DSN officielle `postgres://`.

    Supprimer les variables d’environnement inutilisées `PUID` / `PGID` / `DISPLAY` / `MEMOS_MODE` non utilisées par l’image officielle.

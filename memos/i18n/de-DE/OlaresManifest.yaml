metadata:
  title: Memos
  description: Erstellen Sie mühelos wirkungsvolle Inhalte
spec:
  fullDescription: |
    Eine Open-Source-, selbst gehostete Notizlösung für nahtlose Bereitstellung und plattformübergreifenden Zugriff. Erleben Sie müheloses Schreiben in Klartext, ergänzt durch robuste Markdown-Unterstützung für bessere Formatierung.

    **Hauptfunktionen**
    - Privacy First: Behalten Sie die Kontrolle über Ihre Daten. Alle Laufzeitdaten werden sicher in Ihrer lokalen Datenbank gespeichert.
    - Schnell erstellen: Speichern Sie Inhalte als Klartext für schnellen Zugriff, mit Markdown für schnelle Formatierung und einfaches Teilen.
    - Leichtgewichtig aber leistungsstark: Mit Go, React.js und einer kompakten Architektur liefert die App starke Leistung in einem schlanken Paket.
    - Anpassbar: Passen Sie Servername, Icon, Beschreibung, Systemstil und Ausführungsskripte leicht an, damit es einzigartig Ihres wird.
    - Open Source: Memos setzt auf Open Source — der gesamte Code ist auf GitHub verfügbar für Transparenz und Zusammenarbeit.
    - Kostenlos: Nutzen Sie alle Funktionen völlig kostenlos, ohne Gebühren für Inhalte.

  upgradeDescription: |
    Upgrade von Memos auf 0.31.0 (`neosmemo/memos:0.31.0`).

    `MEMOS_DSN` in ein Kubernetes Secret verschieben und per `secretKeyRef` injizieren; offizielles `postgres://`-DSN-Format verwenden.

    Unbenutzte Env-Vars `PUID` / `PGID` / `DISPLAY` / `MEMOS_MODE`, die das offizielle Image nicht nutzt, entfernen.

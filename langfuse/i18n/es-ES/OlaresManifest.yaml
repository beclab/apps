metadata:
  title: Langfuse
  description: Plataforma open source de ingeniería LLM
spec:
  fullDescription: |
    Langfuse es una plataforma open source de ingeniería LLM. Ayuda a los equipos a desarrollar, monitorear, evaluar y depurar aplicaciones de IA de forma colaborativa. Langfuse puede autoalojarse en minutos y está probado en producción.

    Funciones principales
    LLM Application Observability: instrumenta tu app y empieza a ingerir traces en Langfuse, rastreando llamadas LLM y otra lógica relevante como retrieval, embedding o acciones de agentes. Inspecciona y depura logs complejos y sesiones de usuario.

    Prompt Management te ayuda a gestionar de forma centralizada, control de versiones e iterar colaborativamente tus prompts. Gracias a un fuerte caché en servidor y cliente, puedes iterar prompts sin añadir latencia a tu aplicación.

    Las Evaluations son clave en el flujo de desarrollo de aplicaciones LLM, y Langfuse se adapta a tus necesidades. Admite LLM-as-a-judge, recopilación de feedback de usuarios, etiquetado manual y pipelines de evaluación personalizados vía APIs/SDKs.

    Datasets permiten conjuntos de prueba y benchmarks para evaluar tu aplicación LLM. Admiten mejora continua, pruebas previas al despliegue, experimentos estructurados, evaluación flexible e integración fluida con frameworks como LangChain y LlamaIndex.

    LLM Playground es una herramienta para probar e iterar prompts y configuraciones de modelo, acortando el ciclo de feedback y acelerando el desarrollo. Cuando veas un mal resultado en el tracing, puedes saltar directamente al playground.

    Comprehensive API: Langfuse se usa a menudo para impulsar flujos LLMOps a medida usando los bloques de construcción de Langfuse vía API. Hay especificación OpenAPI, colección Postman y SDKs tipados para Python, JS/TS.

  upgradeDescription: |
    Versión upstream: [Langfuse 4.30.0](https://github.com/langfuse/langfuse/releases/tag/v4.30.0). Este chart pasa de Langfuse 3.x a v4. Lea la [guía de actualización de v3 a v4](https://langfuse.com/self-hosting/upgrade/upgrade-guides/upgrade-v3-to-v4).

    **Haga una copia de seguridad de los datos de Langfuse antes de actualizar.** Los datos existentes de ClickHouse 25.5 no se reutilizan.

    **Cambio incompatible**

    - El autohospedaje v4 usa de forma predeterminada el modo de escritura `events_only`. Los eventos heredados `trace-create` / `span-create` en `/api/public/ingestion` se rechazan. Envíe traces por OpenTelemetry a `/api/public/otel/v1/traces`, o use un SDK compatible con v4.
    - Se requiere ClickHouse 25.12 o posterior. Este chart incluye `clickhouse/clickhouse-server:26.4`.
    - La API pública de lista `/api/public/traces` no está disponible en el modo `events_only`.

    **Novedades**

    - El tracing usa el modelo de datos v4 centrado en observations.
    - Los resultados de experimentos se pueden comparar por columnas de puntuación y por run.

    **Cambios de implementación en Olares**

    - El proceso web necesita unos 3Gi de memoria. Límites más pequeños pueden detener la interfaz con un error de memoria insuficiente.
    - Los datos de ClickHouse se almacenan en un nuevo directorio `clickhouse-26`. Un conjunto de datos 25.5 anterior no se cargará.

metadata:
  title: Langfuse
  description: Piattaforma open source di LLM engineering
spec:
  fullDescription: |
    Langfuse è una piattaforma open source di LLM engineering. Aiuta i team a sviluppare, monitorare, valutare e fare debug di applicazioni AI in modo collaborativo. Langfuse può essere self-hosted in pochi minuti ed è collaudato.

    Funzionalità principali
    LLM Application Observability: strumenta la tua app e inizia a ingerire trace in Langfuse, tracciando chiamate LLM e altra logica rilevante come retrieval, embedding o azioni degli agent. Ispeziona e fai debug di log complessi e sessioni utente.

    Prompt Management ti aiuta a gestire centralmente, versionare e iterare in collaborazione i prompt. Grazie a un caching robusto lato server e client, puoi iterare i prompt senza aggiungere latenza all'applicazione.

    Le Evaluations sono centrali nel workflow di sviluppo LLM e Langfuse si adatta alle tue esigenze. Supporta LLM-as-a-judge, raccolta di feedback utente, etichettatura manuale e pipeline di valutazione personalizzate via API/SDK.

    Datasets consentono set di test e benchmark per valutare la tua applicazione LLM. Supportano miglioramento continuo, test pre-deployment, esperimenti strutturati, valutazione flessibile e integrazione fluida con framework come LangChain e LlamaIndex.

    LLM Playground è uno strumento per testare e iterare prompt e configurazioni del modello, accorciando il ciclo di feedback e accelerando lo sviluppo. Quando vedi un cattivo risultato nel tracing, puoi passare direttamente al playground.

    Comprehensive API: Langfuse è spesso usato per alimentare workflow LLMOps su misura usando i building block di Langfuse via API. Sono disponibili specifica OpenAPI, collezione Postman e SDK tipizzati per Python, JS/TS.

  upgradeDescription: |
    Release upstream: [Langfuse 4.30.0](https://github.com/langfuse/langfuse/releases/tag/v4.30.0). Questo chart passa da Langfuse 3.x a v4. Leggere la [guida di aggiornamento da v3 a v4](https://langfuse.com/self-hosting/upgrade/upgrade-guides/upgrade-v3-to-v4).

    **Eseguire il backup dei dati Langfuse prima dell’aggiornamento.** I dati ClickHouse 25.5 esistenti non vengono riutilizzati.

    **Modifica incompatibile**

    - Il self-hosted v4 usa di default la modalità di scrittura `events_only`. Gli eventi legacy `trace-create` / `span-create` su `/api/public/ingestion` vengono rifiutati. Inviare le traces tramite OpenTelemetry a `/api/public/otel/v1/traces`, oppure usare un SDK compatibile con v4.
    - È richiesto ClickHouse 25.12 o successivo. Questo chart fornisce `clickhouse/clickhouse-server:26.4`.
    - L’API pubblica di elenco `/api/public/traces` non è disponibile in modalità `events_only`.

    **Novità**

    - Il tracing usa il modello dati v4 centrato sulle observations.
    - I risultati degli experiment si possono confrontare per colonne di score e per run.

    **Modifiche di distribuzione Olares**

    - Il processo web richiede circa 3Gi di memoria. Limiti più bassi possono fermare l’interfaccia con un errore di memoria insufficiente.
    - I dati ClickHouse sono archiviati in una nuova directory `clickhouse-26`. Un dataset 25.5 precedente non verrà caricato.

metadata:
  title: Langfuse
  description: 开源LLM工程平台
spec:
  fullDescription: |
    Langfuse 是一个开源 LLM 工程平台。它帮助团队协作 开发、监控、评估 以及 调试 AI 应用。Langfuse 可在几分钟内自托管，并且经过实战考验。

    核心特性

    LLM 应用可观察性：为你的应用插入仪表代码，并开始将追踪数据传送到 Langfuse，从而追踪 LLM 调用及应用中其他相关逻辑（如检索、嵌入或代理操作）。检查并调试复杂日志及用户会话。试试互动的 演示 看看效果。

    提示管理 帮助你集中管理、版本控制并协作迭代提示。得益于服务器和客户端的高效缓存，你可以在不增加延迟的情况下反复迭代提示。

    评估 是 LLM 应用开发流程的关键组成部分，Langfuse 能够满足你的多样需求。它支持 LLM 作为"裁判"、用户反馈收集、手动标注以及通过 API/SDK 实现自定义评估流程。

    数据集 为评估你的 LLM 应用提供测试集和基准。它们支持持续改进、部署前测试、结构化实验、灵活评估，并能与 LangChain、LlamaIndex 等框架无缝整合。

    LLM 试玩平台 是用于测试和迭代提示及模型配置的工具，缩短反馈周期，加速开发。当你在追踪中发现异常结果时，可以直接跳转至试玩平台进行调整。

    综合 API：Langfuse 常用于驱动定制化的 LLMOps 工作流程，同时利用 Langfuse 提供的构建模块和 API。我们提供 OpenAPI 规格、Postman 集合以及针对 Python 和 JS/TS 的类型化 SDK。

  upgradeDescription: |
    上游发布：[Langfuse 4.30.0](https://github.com/langfuse/langfuse/releases/tag/v4.30.0)。此 chart 从 Langfuse 3.x 升到 v4。请阅读 [v3 到 v4 升级指南](https://langfuse.com/self-hosting/upgrade/upgrade-guides/upgrade-v3-to-v4)。

    **升级前请备份 Langfuse 数据。** 现有 ClickHouse 25.5 数据不会被复用。

    **破坏性变更**

    - 自托管 v4 默认使用 `events_only` 写入模式。`/api/public/ingestion` 上的旧版 `trace-create` / `span-create` 事件会被拒绝。请通过 OpenTelemetry 将 traces 发送到 `/api/public/otel/v1/traces`，或使用兼容 v4 的 SDK。
    - 需要 ClickHouse 25.12 或更高版本。此 chart 提供 `clickhouse/clickhouse-server:26.4`。
    - 在 `events_only` 模式下，公开的 `/api/public/traces` 列表 API 不可用。

    **主要更新**

    - Tracing 使用 v4 以 observations 优先的数据模型。
    - 实验结果可按分数列和 run 进行比较。

    **Olares 部署变化**

    - Web 进程大约需要 3Gi 内存。更小的限制可能因内存不足而停止界面。
    - ClickHouse 数据存储在新的 `clickhouse-26` 目录下。先前的 25.5 数据集不会加载。

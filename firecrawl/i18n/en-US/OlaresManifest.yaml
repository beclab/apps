metadata:
  title: Firecrawl
  description: Empower your AI apps with clean data from any website
spec:
  fullDescription: |
    **Overview**
    Firecrawl is an API service that takes a URL, crawls it, and converts it into clean markdown or structured data. We crawl all accessible subpages and give you clean data for each. No sitemap required.

    **Features**
    - Scrape: scrapes a URL and get its content in LLM-ready format (markdown, structured data via LLM Extract, screenshot, html)
    - Crawl: scrapes all the URLs of a web page and return content in LLM-ready format
    - Map: input a website and get all the website urls - extremely fast
    - Extract: get structured data from single page, multiple pages or entire websites with AI.
    
    **Powerful Capabilities**
    - LLM-ready formats: markdown, structured data, screenshot, HTML, links, metadata
    - The hard stuff: proxies, anti-bot mechanisms, dynamic content (js-rendered), output parsing, orchestration
    - Customizability: exclude tags, crawl behind auth walls with custom headers, max crawl depth, etc...
    - Media parsing: pdfs, docx, images
    - Reliability first: designed to get the data you need - no matter how hard it is
    - Actions: click, scroll, input, wait and more before extracting data
    - Batching (New): scrape thousands of URLs at the same time with a new async endpoint.
  upgradeDescription: |
    Upgrade Firecrawl to upstream **2.11.158** (from 2.9.0).

    **Images**
    - API / queue-worker / nuq-worker / extract-worker / nuq-prefetch-worker: `docker.io/beclab/firecrawl-firecrawl:2.11.158` (mirrored from `ghcr.io/firecrawl/firecrawl:2.11.158`; replaces `beclab/firecrawl-api:v2.9.0`).
    - Playwright: `beclab/harveyff-firecrawl-playwright-service:2.11.158` (upstream GHCR has no versioned tag; retagged from latest).
    - NuQ Postgres: `beclab/harveyff-firecrawl-nuq-postgres:2.11.158` (upstream GHCR has no versioned tag; retagged from latest).
    - RabbitMQ: `beclab/rabbitmq:3.13.7-management` (in-chart).

    **Architecture (align with upstream Helm / NuQ)**
    - Add RabbitMQ Service/Deployment and ConfigMap `NUQ_RABBITMQ_URL=amqp://rabbitmq:5672`.
    - Add `extract-worker` (`dist/src/services/extract-worker.js`) and `nuq-prefetch-worker` (`nuq-prefetch-worker.js`).
    - Keep split API (`index.js`) + `queue-worker` + `nuq-worker` (do **not** use `harness.js --start-docker` in K8s).
    - Wire worker ports / `NUQ_*` env, `IS_KUBERNETES=true`, `NUQ_DATABASE_URL_LISTEN`, and `NUQ_POD_NAME` fieldRef.
    - Redis replica key fix: use `workloads.firecrawl-redis` instead of `firecrawl`.
    - Raise `requiredMemory` to 6Gi for the extra workloads.

    **Notes**
    - Desktop entrance is still Bull Queue Manager (`/admin/CHANGEME/queues`). Crawl/scrape jobs use **NuQ** and will not appear there; poll `GET /v2/crawl/{id}` / `GET /v2/scrape/{id}` instead.
    - Optional LLM envs (`OPENAI_*` / `OLLAMA_*` / `MODEL_NAME`) remain for AI extract features.

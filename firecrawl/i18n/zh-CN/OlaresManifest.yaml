metadata:
  description: 借助任意网站的干净数据来增强您的 AI 应用程序
  title: Firecrawl

spec:
  fullDescription: |
    **应用概览**
    Firecrawl 是一款 API 服务，可通过输入 URL 自动爬取网页并转换为 ‌LLM 就绪的 Markdown 或结构化数据‌。无需预存站点地图，即可抓取目标网站所有可访问子页面，并为每个页面提供清洗后的标准化数据。

    **核心功能‌**
    ‌- 单页抓取‌：提取指定 URL 内容，输出 Markdown、结构化数据（LLM Extract）、截图或 HTML
    ‌- 全网爬取‌：自动爬取网页内所有链接，返回标准化内容（LLM 就绪格式）
    ‌- 站点地图‌：极速生成网站完整 URL 列表
    ‌- 智能提取‌：通过 AI 从单页/多页/整站提取结构化数据
    ‌
    **核心技术能力‌**
    ‌- 多模态格式‌：Markdown、结构化数据、截图（PNG/JPEG）、HTML、链接、元数据
    ‌- 文件解析‌：支持 PDF、Word文档、图片等非网页内容解析
    ‌- 反爬对抗‌：自动处理代理、反爬机制（验证码、JS 动态渲染）
    ‌- 动态交互‌：数据提取前模拟点击、滚动、输入、等待等浏览器行为
    ‌- 深度定制‌：排除特定标签、通过自定义请求头突破登录墙、限制爬取深度
    ‌- 批量处理（新增功能）‌：通过异步接口同时抓取数千个 URL
    ‌- 可靠性优先设计‌：针对高难度爬取场景（动态加载、反爬策略）优化

  upgradeDescription: |
    升级 Firecrawl 到上游 **2.11.158**（自 2.9.0）。

    **镜像**
    - API / queue-worker / nuq-worker / extract-worker / nuq-prefetch-worker：`docker.io/beclab/firecrawl-firecrawl:2.11.158`（由 `ghcr.io/firecrawl/firecrawl:2.11.158` 转存；替代原 `beclab/firecrawl-api:v2.9.0`）。
    - Playwright：`beclab/harveyff-firecrawl-playwright-service:2.11.158`（上游 GHCR 无明确版本号 tag，由 latest 重打）。
    - NuQ Postgres：`beclab/harveyff-firecrawl-nuq-postgres:2.11.158`（上游 GHCR 无明确版本号 tag，由 latest 重打）。
    - RabbitMQ：`beclab/rabbitmq:3.13.7-management`（应用内部署）。

    **架构（对齐上游 Helm / NuQ）**
    - 新增 RabbitMQ Service/Deployment，ConfigMap 增加 `NUQ_RABBITMQ_URL=amqp://rabbitmq:5672`。
    - 新增 `extract-worker`、`nuq-prefetch-worker` Deployment。
    - 继续拆分 API（`index.js`）+ `queue-worker` + `nuq-worker`（K8s 不使用 `harness.js --start-docker`）。
    - 补充 worker 端口 / `NUQ_*`、`IS_KUBERNETES=true`、`NUQ_DATABASE_URL_LISTEN`、`NUQ_POD_NAME`（fieldRef）。
    - Redis 副本数改为使用 `workloads.firecrawl-redis`。
    - `requiredMemory` 提升至 6Gi。

    **说明**
    - Desktop 入口仍是 Bull 队列管理页（`/admin/CHANGEME/queues`）。crawl/scrape 走 **NuQ**，不会出现在该页面；请用 `GET /v2/crawl/{id}`、`GET /v2/scrape/{id}` 查询。
    - AI 抽取相关可选环境变量（`OPENAI_*` / `OLLAMA_*` / `MODEL_NAME`）保持不变。

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: nuq-prefetch-worker
  namespace: "{{ .Release.Namespace }}"
  name: nuq-prefetch-worker
spec:
  replicas: {{ (index .Values.workloads "nuq-prefetch-worker").replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: nuq-prefetch-worker
  template:
    metadata:
      labels:
        io.kompose.service: nuq-prefetch-worker
    spec:
      initContainers:
        - name: check-depends
          image: "docker.io/beclab/wait-for:0.1.0"
          args:
            - "-it"
            - >-
              firecrawl-redis-svc:6379,nuq-postgres:5432,rabbitmq:5672
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      containers:
        - name: nuq-prefetch-worker
          command:
            - node
            - dist/src/services/worker/nuq-prefetch-worker.js
          image: "docker.io/beclab/firecrawl-firecrawl:2.11.158"
          ports:
            - containerPort: 3011
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: FLY_PROCESS_GROUP
              value: "nuq-prefetch-worker"
            - name: NUQ_PREFETCH_WORKER_PORT
              value: "3011"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f nuq-prefetch-worker.js >/dev/null"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
              cpu: 1
      restartPolicy: Always

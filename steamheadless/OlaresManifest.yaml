olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  steamheadless: 1
metadata:
  name: steamheadless
  description: A Headless Steam Service
  icon: https://app.cdn.olares.com/appstore/steamheadless/icon.png
  appid: steamheadless
  version: '1.0.37'
  title: Steam Headless
  categories:
  - Fun

entrances:
- name: steamheadless
  host: steamheadless
  port: 8083
  title: Steam Headless
  icon: https://app.cdn.olares.com/appstore/steamheadless/icon.png
  authLevel: private
  openMethod: window
- name: sunshineweb
  host: sunshineweb
  port: 47990
  title: Sunshine Web
  icon: https://app.cdn.olares.com/appstore/steamheadless/sunshine.webp
  authLevel: private
  openMethod: window
  invisible: true
- name: steamheadlessaudio
  host: steamheadlessaudio
  port: 8088
  title: Steam Audio
  icon: https://app.cdn.olares.com/appstore/steamheadless/icon.png
  authLevel: internal
  openMethod: window
  invisible: true
ports:
- name: tcp3
  host: steamheadless
  port: 47990
  protocol: tcp
  exposePort: 47990
- name: tcp4
  host: steamheadless
  port: 47984
  protocol: tcp
  exposePort: 47984
- name: tcp5
  host: steamheadless
  port: 47989
  protocol: tcp
  exposePort: 47989
- name: tcp6
  host: steamheadless
  port: 48010
  protocol: tcp
  exposePort: 48010
- name: udp1
  host: steamheadless
  port: 47998
  protocol: udp
  exposePort: 47998
- name: udp2
  host: steamheadless
  port: 47999
  protocol: udp
  exposePort: 47999
- name: udp3
  host: steamheadless
  port: 48000
  protocol: udp
  exposePort: 48000
- name: udp4
  host: steamheadless
  port: 48002
  protocol: udp
  exposePort: 48002
tailscale: 
  acls:
  - proto: tcp
    dst:
    - "*:47990,47984,47989,48010"
  - proto: udp
    dst:
    - "*:47998,47999,48000,48002"    
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.2.0'
  featuredImage: https://app.cdn.olares.com/appstore/steamheadless/1.webp
  promoteImage:
  - https://app.cdn.olares.com/appstore/steamheadless/1.webp
  - https://app.cdn.olares.com/appstore/steamheadless/2.webp
  fullDescription: |
    Steam Headless is a Remote Game Streaming Server.

    Play your games either in the browser with audio or via Steam Link or Moonlight. Play from another Steam Client with Steam Remote Play.

    Easily deploy a Steam Docker instance in seconds.

    **Features**
    Steam Client configured for running on Linux with Proton
    Moonlight compatible server for easy remote desktop streaming
    One click installation of EmeDeck, Heroic and Lutris
    Full video/audio noVNC web access to a Xfce4 Desktop
    NVIDIA, AMD and Intel GPU support
    Full controller support
    Support for Flatpak and Appimage installation
    Root access
    Based on Debian Bookworm
  upgradeDescription: |
    v1.0.37: Desktop session runs as uid 1000
    - PUID/PGID 1000; supervisord stays root so xorg, xvfb, vnc and udev still start
    - Session D-Bus and XDG_RUNTIME_DIR move to /run/user/1000
    - An init container chowns the home and games volumes, guarded by ! -uid 1000
    - Chromium-based apps (Vivaldi, Electron) can sandbox, which they refuse to do as root
    - Clear HAMi's /etc/ld.so.preload as root before Sunshine starts; its own
      mount --bind workaround needs root and killed Sunshine with exit 32 at uid 1000

    v1.0.37: Flatpak works out of the box
    - Persist the system Flatpak store, seeded from the image when empty
    - Run session D-Bus, polkitd and accounts-daemon so Flatpak apps and portals function
    - Keep the Flatpak NVIDIA GL extension in sync with the host driver after driver upgrades

    v1.0.37: Durable volume locations are configurable
    - Defaults are unchanged: c0, c1 and the Flatpak store stay on `appCache`
    - HOME_STORAGE and STEAM_LIBRARY_STORAGE each accept `appCache`, `appData`,
      or an absolute host path, so save games and Flatpak app data can be placed
      on storage that survives `market uninstall`

    v1.0.36: Keep durable volumes on `appCache` (no appData migration); require control-plane (master) affinity; move `SUNSHINE_PASS` into Secret (`secretKeyRef`).

    Storage: durable volumes c0/c1 moved from `appCache` to `appData`. On first start after upgrade, initContainers copy legacy appCache contents into appData when the destination is empty (markers: `.migration_from_appcache_c0_done`, `.migration_from_appcache_c1_done`). Old appCache data is left intact for rollback.

    Update Chart Config
    - Fix Moonlight auto discovery when change ip

  developer: Steam-Headless
  sourceCode: https://github.com/Steam-Headless/docker-steam-headless
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://github.com/Steam-Headless/docker-steam-headless#readme-ov-file
  requiredMemory: 4Gi
  limitedMemory: 64Gi
  requiredDisk: 1Gi
  limitedDisk: 10Gi
  requiredCpu: 4
  limitedCpu: 18
  requiredGpu: 4Gi
  limitedGpu: 16Gi
  supportArch:
  - amd64
options:
  apiTimeout: 0
  conflicts:
  - name: isaaclab
    type: application
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
  - envName: SUNSHINE_USER
    required: true
    type: string
    editable: false
    regex: '^[\w]{1,}$'
  - envName: SUNSHINE_PASS
    required: true
    type: password
    editable: false
    regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{1,}$'
  # Where the desktop home (/home/default) is stored. Unset means appCache, as
  # before. It holds save games, Flatpak app data and browser profiles, none of
  # which survive `market uninstall` on appCache -- set appData to keep them, or
  # an absolute host path to place them on separate storage.
  - envName: HOME_STORAGE
    required: false
    type: string
    editable: true
    regex: '^(appData|appCache|/.+)$'
  # Where the Steam library (/mnt/games) is stored. Unset means appCache, as
  # before. The library is large and re-downloadable, so appCache (node-local,
  # never JuiceFS on multi-node) is usually the right place; appData or an
  # absolute host path move it elsewhere.
  - envName: STEAM_LIBRARY_STORAGE
    required: false
    type: string
    editable: true
    regex: '^(appData|appCache|/.+)$'
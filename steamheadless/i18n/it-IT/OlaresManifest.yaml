metadata:
  title: Steam Headless
  description: Un servizio Steam headless
spec:
  fullDescription: |
    Steam Headless è un server per lo streaming remoto dei giochi.

    Gioca nel browser con audio oppure tramite Steam Link o Moonlight. Puoi anche giocare da un altro Steam Client con Steam Remote Play.

    Distribuisci facilmente un'istanza Steam in Docker in pochi secondi.

    **Funzionalità**
    Steam Client configurato per funzionare su Linux con Proton
    Server compatibile con Moonlight per un facile streaming del desktop remoto
    Installazione con un clic di EmeDeck, Heroic e Lutris
    Accesso Web noVNC completo con video e audio a un Xfce4 Desktop
    Supporto GPU NVIDIA, AMD e Intel
    Supporto completo dei controller
    Supporto per l'installazione di Flatpak e Appimage
    Accesso root
    Basato su Debian Bookworm
  upgradeDescription: |
    - Risolto un problema che impediva l'installazione quando l'utente Sunshine era impostato su un valore numerico.

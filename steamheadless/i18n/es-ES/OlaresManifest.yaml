metadata:
  title: Steam Headless
  description: Un servicio Steam sin interfaz gráfica
spec:
  fullDescription: |
    Steam Headless es un servidor para transmitir juegos de forma remota.

    Juega en el navegador con audio, mediante Steam Link o Moonlight. También puedes jugar desde otro Steam Client con Steam Remote Play.

    Implementa fácilmente una instancia de Steam en Docker en cuestión de segundos.

    **Funciones**
    Steam Client configurado para ejecutarse en Linux con Proton
    Servidor compatible con Moonlight para transmitir fácilmente el escritorio remoto
    Instalación con un clic de EmeDeck, Heroic y Lutris
    Acceso web noVNC completo con vídeo y audio a un Xfce4 Desktop
    Compatibilidad con GPU NVIDIA, AMD e Intel
    Compatibilidad total con mandos
    Instalación de Flatpak y Appimage
    Acceso root
    Basado en Debian Bookworm
  upgradeDescription: |
    - Se ha resuelto un problema que impedía la instalación cuando el usuario de Sunshine tenía un valor numérico.

metadata:
  title: Steam Headless
  description: Un service Steam sans interface graphique
spec:
  fullDescription: |
    Steam Headless est un serveur de streaming de jeux à distance.

    Jouez à vos jeux avec le son dans le navigateur, via Steam Link ou Moonlight. Jouez depuis un autre Steam Client avec Steam Remote Play.

    Déployez facilement une instance Steam dans Docker en quelques secondes.

    **Fonctionnalités**
    Steam Client configuré pour fonctionner sous Linux avec Proton
    Serveur compatible Moonlight pour faciliter le streaming de bureau à distance
    Installation en un clic d'EmeDeck, Heroic et Lutris
    Accès Web noVNC complet avec vidéo et audio à un Xfce4 Desktop
    Prise en charge des GPU NVIDIA, AMD et Intel
    Prise en charge complète des manettes
    Installation de Flatpak et Appimage
    Accès root
    Basé sur Debian Bookworm
  upgradeDescription: |
    - Résolution d'un problème empêchant l'installation lorsque l'utilisateur Sunshine était défini par une valeur numérique.

metadata:
  title: Steam Headless
  description: ヘッドレス Steam サービス
spec:
  fullDescription: |
    Steam Headless は、リモートゲームストリーミングサーバーです。

    ブラウザーで音声付きでプレイするか、Steam Link または Moonlight を利用できます。別の Steam Client から Steam Remote Play でプレイすることもできます。

    Steam の Docker インスタンスを数秒で簡単にデプロイできます。

    **機能**
    Proton を使用して Linux 上で動作するよう設定された Steam Client
    リモートデスクトップを簡単にストリーミングできる Moonlight 対応サーバー
    EmeDeck、Heroic、Lutris のワンクリックインストール
    Xfce4 Desktop へ動画・音声付きでアクセスできる完全な noVNC Web インターフェース
    NVIDIA、AMD、Intel GPU 対応
    コントローラーを完全サポート
    Flatpak と Appimage のインストールに対応
    root アクセス
    Debian Bookworm ベース
  upgradeDescription: |
    - Sunshine ユーザーに数値を設定した場合にインストールできない問題を解決しました。

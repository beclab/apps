metadata:
  title: Steam Headless
  description: Ein Headless-Steam-Dienst
spec:
  fullDescription: |
    Steam Headless ist ein Server für Remote-Game-Streaming.

    Spielen Sie Ihre Spiele mit Ton im Browser oder über Steam Link oder Moonlight. Spielen Sie von einem anderen Steam Client aus mit Steam Remote Play.

    Stellen Sie in Sekundenschnelle eine Steam-Docker-Instanz bereit.

    **Funktionen**
    Für Linux-Betrieb mit Proton konfigurierter Steam Client
    Moonlight-kompatibler Server für einfaches Remote-Desktop-Streaming
    Ein-Klick-Installation von EmeDeck, Heroic und Lutris
    Vollständiger noVNC-Webzugriff mit Video und Audio auf einen Xfce4 Desktop
    Unterstützung für NVIDIA-, AMD- und Intel-GPUs
    Vollständige Controller-Unterstützung
    Unterstützung für die Installation von Flatpak und Appimage
    Root-Zugriff
    Basiert auf Debian Bookworm
  upgradeDescription: |
    - Problem behoben, das die Installation verhinderte, wenn der Sunshine-Benutzer auf einen numerischen Wert gesetzt war.

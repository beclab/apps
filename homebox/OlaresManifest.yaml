olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  homebox: 1
metadata:
  name: homebox
  description: A continuation of HomeBox the inventory and organization system built for the Home User
  icon: https://app.cdn.olares.com/appstore/homebox/icon.png
  appid: homebox
  version: "1.0.12"
  title: HomeBox
  categories:
  - Lifestyle
  - homelab
  tags:
  - lifestyle

spec:
  versionName: "0.27.1"
  promoteImage:
  - https://app.cdn.olares.com/appstore/homebox/1.webp
  - https://app.cdn.olares.com/appstore/homebox/2.webp
  - https://app.cdn.olares.com/appstore/homebox/3.webp

  fullDescription: |
    HomeBox is the inventory and organization system built for the Home User! With a focus on simplicity and ease of use, Homebox is the perfect solution for your home inventory, organization, and management needs. While developing this project, We've tried to keep the following principles in mind:
    - Simple but Expandable - Homebox is designed to be simple and easy to use. No complicated setup or configuration required. But expandable to whatever level of infrastructure you want to put into it.
    - Blazingly Fast - Homebox is written in Go, which makes it extremely fast and requires minimal resources to deploy.
    - Portable - Homebox is designed to be portable and run on anywhere. We use SQLite and an embedded Web UI to make it easy to deploy, use, and backup.

    **Key Features**
    - Rich Organization - Organize your items into categories, locations, and tags. You can also create custom fields to store additional information about your items.
    - Powerful Search - Quickly find items in your inventory using the powerful search feature.
    - Image Upload - Upload images of your items to make it easy to identify them.
    - Document and Warranty Tracking - Keep track of important documents and warranties for your items.
    - Purchase & Maintenance Tracking - Track purchase dates, prices, and maintenance schedules for your items.
    - Responsive Design - Homebox is designed to work on any device, including desktops, tablets, and smartphones.

  upgradeDescription: |
    - Search now matches individual words in database searches.
    - Items and locations can share custom fields, attachments and templates.
    - Export a collection with its attachments as a ZIP file and restore it into an empty collection (experimental).
    - Updates the frontend build to address Node2Shell (CVE-2026-111497).
    - Fixes attachment uploads that failed because the data directory was read-only for the app.
    - Raises the app memory limit from 100 MiB to 1 GiB after the previous limit caused restarts.
    https://github.com/sysadminsmedia/homebox/releases/tag/v0.27.1

  developer: SysAdmins Media
  website: https://homebox.software/
  sourceCode: https://github.com/sysadminsmedia/homebox
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://homebox.software/en/
  license:
    - text: AGPL-3.0
      url: https://github.com/sysadminsmedia/homebox?tab=License-1-ov-file#AGPL-3.0-1-ov-file
  requiredMemory: 20Mi
  limitedMemory: 1Gi
  requiredDisk: 50Mi
  limitedDisk: 256Mi
  requiredCpu: 50m
  limitedCpu: 100m
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
middleware:
  postgres:
    username: homebox
    password: homebox
    databases:
      - name: homebox
        distributed: false
entrances:
  - name: homebox
    host: homebox
    port: 3100
    title: HomeBox
    icon: https://app.cdn.olares.com/appstore/homebox/icon.png
    authLevel: private
options:
  allowedOutboundPorts:
    - 587
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'

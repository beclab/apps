{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) | default dict }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homebox
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  HBOX_DATABASE_PASSWORD: {{ .Values.postgres.password | quote }}
  HBOX_AUTH_API_KEY_PEPPER: {{ if hasKey $data "HBOX_AUTH_API_KEY_PEPPER" }}{{ index $data "HBOX_AUTH_API_KEY_PEPPER" | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}

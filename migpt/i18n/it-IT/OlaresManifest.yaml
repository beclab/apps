metadata:
  title: MiGPT
  description: Collega il tuo Xiaomi Smart Speaker a ChatGPT e Doubao e trasformalo nel tuo assistente vocale personale
spec:
  upgradeDescription: |
    Passa l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allinea i mount di configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovi il collegamento specifico Bitnami di `OPENRESTY_CONF_FILE`.
  fullDescription: |
    **Panoramica**
    MiGPT fa capire meglio la tua smart home integrando perfettamente Xiaomi Smart Speaker, dispositivi smart Mijia e la capacità di comprensione di ChatGPT. MiGPT non riguarda solo l'automazione dei dispositivi, ma: costruire una casa che ti capisce, ha calore e evolve con te.

    In questo mondo digitale, la casa non è solo un posto in cui vivere, ma un'estensione della nostra vita digitale. In futuro, ciascuno dei tuoi dispositivi per la smart home — dalle lampadine e prese ai robot aspirapolvere e TV — può essere un agente indipendente che risponde alle tue istruzioni in modo più intelligente e attento. Questi agenti indipendenti possono anche percepire e collaborare tra loro per formare una rete collaborativa più potente. E gli speaker Xiaoai sono come il tuo maggiordomo esclusivo della smart home, al tuo servizio e capace di liberare il vero potenziale delle case intelligenti.

    **Punti salienti**
    - Domande e risposte IA. Immagina che quando gli speaker Xiaoai sono collegati al grande modello, conoscono astronomia e geografia e passano in pochi secondi da «ritardo artificiale» a maestri accademici.
    - Role playing. Basta un secondo per addestrare Xiao Ai: che sia il partner perfetto o l'amica intima che ascolta i tuoi pensieri, nessun problema.
    - Risposta in streaming. L'amore arriva veloce come un tornado, e anche il tuo speaker Xiao Ai. Risponde in pochi secondi e non ti fa aspettare troppo.
    - Memoria a lungo e breve termine. Lo speaker Xiao Ai ora può ricordare ogni conversazione tra voi; più parlate, più c'è sintonia, come un vecchio amico.
    - TTS personalizzato. Stanco della voce di Xiao Ai? Sblocca la stessa voce di «Dou Bao», come se una persona reale rispondesse al tuo messaggio.

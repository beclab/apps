metadata:
  title: MiGPT
  description: Verbinden Sie Ihren Xiaomi Smart Speaker mit ChatGPT und Doubao und machen Sie ihn zu Ihrem persönlichen Sprachassistenten
spec:
  upgradeDescription: |
    Wechseln Sie das Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Passen Sie nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images an (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und entfernen Sie die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE`.
  fullDescription: |
    **Übersicht**
    MiGPT lässt Ihr Smart Home Sie besser verstehen, indem es Xiaomi Smart Speaker, Mijia-Smart-Geräte und die Verstehensfähigkeit von ChatGPT perfekt integriert. MiGPT geht nicht nur um Geräteautomatisierung, sondern darum: ein Zuhause zu bauen, das Sie versteht, Wärme hat und mit Ihnen wächst.

    In dieser digitalen Welt ist das Zuhause nicht nur ein Ort zum Wohnen, sondern eine Erweiterung unseres digitalen Lebens. In Zukunft kann jedes Ihrer Smart-Home-Geräte – von Glühbirnen und Steckdosen bis zu Saugrobotern und Fernsehern – ein unabhängiger Agent sein, der intelligenter und aufmerksamer auf Ihre Anweisungen reagiert. Diese unabhängigen Agenten können einander auch wahrnehmen und zusammenarbeiten und so ein stärkeres kollaboratives Netzwerk bilden. Und Xiaoai-Lautsprecher sind wie Ihr persönlicher Smart-Home-Butler, der Ihnen ganzheitlich dient und das wahre Potenzial smarter Homes freisetzt.

    **Feature-Highlights**
    - KI-Q&A. Stellen Sie sich vor, wenn Xiaoai-Lautsprecher mit dem großen Modell verbunden sind, kennen sie Astronomie und Geografie und verwandeln sich in Sekunden vom „künstlichen Schwachkopf“ zum Akademiker.
    - Rollenspiel. Es dauert nur eine Sekunde, Xiao Ai zu trainieren – ob perfekter Partner oder vertraute beste Freundin, die Ihrem Herzen zuhört: kein Problem.
    - Streaming-Antwort. Die Liebe kommt schnell wie ein Tornado – und Ihr Xiao Ai-Lautsprecher auch. Er antwortet in Sekunden und lässt Sie nicht lange warten.
    - Lang- und Kurzzeitgedächtnis. Der Xiao Ai-Lautsprecher kann sich jetzt an jedes Gespräch erinnern; je mehr Sie sprechen, desto eingespielter wird er – wie ein alter Freund.
    - Custom TTS. Die Stimme von Xiao Ai satthaben? Entsperren Sie dieselbe Stimme wie „Dou Bao“, als würde eine echte Person antworten.

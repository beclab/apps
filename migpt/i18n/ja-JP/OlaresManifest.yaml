metadata:
  title: MiGPT
  description: Xiaomi Smart Speaker を ChatGPT と Doubao に接続し、パーソナル音声アシスタントに変えます
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えます。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除します。
  fullDescription: |
    **概要**
    MiGPT は Xiaomi Smart Speaker、Mijia スマートデバイス、ChatGPT の理解力を完璧に統合し、スマートホームがあなたをよりよく理解できるようにします。MiGPT は単なるデバイス自動化ではなく、あなたを理解し、温かみがあり、共に成長する家を築くことです。

    このデジタルの世界では、家は住む場所だけでなくデジタルライフの延長です。将来、電球やコンセントから掃除ロボット、テレビまで、スマートホーム機器の一つひとつが、より知的で丁寧に指示に応える独立エージェントになり得ます。これらの独立エージェントは互いに感知・協力し、より強力な協調ネットワークを形成できます。そして Xiaoai スピーカーは専属のスマートホーム執事のように、心を込めてあなたに仕え、スマートホームの真の可能性を解き放ちます。

    **機能ハイライト**
    - AI Q&A。Xiaoai スピーカーが大規模モデルに接続されると、天文地理を知り、「人工低能」から一瞬で学識豊かな存在へ変わります。
    - ロールプレイング。Xiao Ai の訓練は一瞬。完璧なパートナーでも、心の話を聞いてくれる親友でも問題ありません。
    - ストリーミング応答。愛が竜巻のように速く来るように、あなたの Xiao Ai スピーカーも秒で応え、長く待たせません。
    - 長短期記憶。Xiao Ai スピーカーは会話をすべて覚えられ、話すほど息が合い、古くからの友人のようです。
    - カスタム TTS。Xiao Ai の声に飽きたら、「Dou Bao」と同じ声を解放し、まるで実在の人が返信するような体験に。

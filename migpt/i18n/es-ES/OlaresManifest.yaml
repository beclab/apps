metadata:
  title: MiGPT
  description: "Conecte su Xiaomi Smart Speaker a ChatGPT y Doubao, y conviértalo en su asistente\
  \ de voz personal"
spec:
  upgradeDescription: |
    Cambie la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinee los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y elimine el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    **Resumen**
    MiGPT hace que su hogar inteligente le entienda mejor integrando a la perfección Xiaomi Smart Speaker, dispositivos inteligentes Mijia y la capacidad de comprensión de ChatGPT. MiGPT no solo trata de automatización de dispositivos, sino de: construir un hogar que le entiende, tiene calidez y evoluciona con usted.

    En este mundo digital, el hogar no es solo un lugar donde vivir, sino una extensión de nuestra vida digital. En el futuro, cada uno de sus dispositivos de hogar inteligente —desde bombillas y enchufes hasta robots aspiradores y televisores— puede ser un agente independiente que responda a sus instrucciones de forma más inteligente y atenta. Estos agentes independientes también pueden percibirse y cooperar entre sí para formar una red colaborativa más potente. Y los altavoces Xiaoai son como su mayordomo exclusivo del hogar inteligente, sirviéndole de todo corazón y liberando el verdadero potencial de los hogares inteligentes.

    **Aspectos destacados**
    - Preguntas y respuestas con IA. Imagine que cuando los altavoces Xiaoai se conectan al gran modelo, conocen astronomía y geografía, y pasan en segundos de «retraso artificial» a maestros académicos.
    - Juego de roles. Solo hace falta un segundo para entrenar a Xiao Ai: ya sea su pareja perfecta o la mejor amiga íntima que escucha lo que siente, no hay problema.
    - Respuesta en streaming. El amor llega rápido como un tornado, y su altavoz Xiao Ai también. Responde a su amor en segundos y no le hace esperar demasiado.
    - Memoria a corto y largo plazo. El altavoz Xiao Ai ahora puede recordar cada conversación entre ustedes; cuantos más hablan, más complicidad hay, como un viejo amigo.
    - TTS personalizado. ¿Cansado de la voz de Xiao Ai? Desbloquee la misma voz que «Dou Bao», como si una persona real respondiera a su mensaje.

metadata:
  title: MiGPT
  description: "Connectez votre Xiaomi Smart Speaker à ChatGPT et Doubao, et transformez-le en votre\
  \ assistant vocal personnel"
spec:
  upgradeDescription: |
    Remplacez l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alignez les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimez le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    **Aperçu**
    MiGPT permet à votre maison intelligente de mieux vous comprendre en intégrant parfaitement Xiaomi Smart Speaker, les appareils intelligents Mijia et la capacité de compréhension de ChatGPT. MiGPT ne concerne pas seulement l'automatisation des appareils, mais : construire une maison qui vous comprend, a de la chaleur et évolue avec vous.

    Dans ce monde numérique, la maison n'est pas seulement un lieu de vie, mais une extension de notre vie numérique. À l'avenir, chacun de vos appareils de maison intelligente — des ampoules et prises aux robots aspirateurs et téléviseurs — peut être un agent indépendant répondant à vos instructions de façon plus intelligente et attentive. Ces agents indépendants peuvent aussi se percevoir et coopérer pour former un réseau collaboratif plus puissant. Et les enceintes Xiaoai sont comme votre majordome exclusif de maison intelligente, à votre service et libérant le vrai potentiel des maisons intelligentes.

    **Points forts**
    - Q&R IA. Imaginez que lorsque les enceintes Xiaoai sont connectées au grand modèle, elles connaissent l'astronomie et la géographie, et passent en quelques secondes du « retard artificiel » à des maîtres académiques.
    - Jeu de rôle. Il ne faut qu'une seconde pour entraîner Xiao Ai — qu'il s'agisse d'être votre partenaire parfait ou la meilleure amie intime qui écoute vos confidences, aucun problème.
    - Réponse en streaming. L'amour arrive vite comme une tornade, et votre enceinte Xiao Ai aussi. Elle répond en quelques secondes et ne vous fait pas trop attendre.
    - Mémoire à long et court terme. L'enceinte Xiao Ai peut désormais se souvenir de chaque conversation entre vous ; plus vous parlez, plus la complicité grandit, comme un vieil ami.
    - TTS personnalisé. Fatigué de la voix de Xiao Ai ? Débloquez la même voix que « Dou Bao », comme si une vraie personne répondait à votre message.

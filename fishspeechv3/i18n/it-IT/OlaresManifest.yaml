metadata:
  title: Fish Speech
  description: TTS open-source SOTA
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Nell'intero sistema Olares verrà installato un solo servizio. Ogni utente può installare una voce desktop per accedere oppure usare l'ingresso condiviso per chiamare l'API del servizio.

    **PANORAMICA**
    Text-to-Speech e Voice Cloning davvero simili all'umano

    Checkpoint incluso: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — l'ultima release pro-tier di Fish Audio della famiglia TTS / voice-cloning espressiva.

    FishAudio-S2 Pro è un modello espressivo di text-to-speech (TTS) e voice cloning sviluppato da Fish Audio, progettato per generare parlato naturale, realistico ed emotivamente ricco — non robotico, non piatto e non limitato alla narrazione da studio.

    FishAudio-S2 Pro si concentra su come gli umani parlano davvero: con emozione, variazione, pause e intento.

    Funzionalità
    - TTS zero-shot e few-shot: Inserisci un campione vocale di 10–30 secondi per generare TTS di alta qualità.

    - Supporto multilingue e cross-lingual: Copia e incolla testo multilingue nella casella di input — senza preoccuparti della lingua. Attualmente supporta inglese, giapponese, coreano, cinese, francese, tedesco, arabo e spagnolo.

    - Nessuna dipendenza da fonemi: Il modello ha forti capacità di generalizzazione e non dipende dai fonemi per il TTS. Può gestire testo in qualsiasi sistema di scrittura.

    - Altamente accurato: Raggiunge un CER (Character Error Rate) basso di circa lo 0.4% e un WER (Word Error Rate) di circa lo 0.8% su Seed-TTS Eval.

    - Veloce: Accelerato da torch compile, il fattore in tempo reale è circa 1:7 su una GPU Nvidia RTX 4090.

    - Inferenza WebUI: Web UI basata su Gradio facile da usare, compatibile con Chrome, Firefox, Edge e altri browser.

    - Inferenza GUI: Offre un'interfaccia grafica PyQt6 che funziona senza problemi con il server API. Supporta Linux, Windows e macOS.
  upgradeDescription: |
    Passare l'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico Bitnami `OPENRESTY_CONF_FILE`.

    Storage: volumi durevoli spostati da `appCache` ad `appData`. Al primo avvio dopo l'upgrade, gli initContainers copiano i contenuti legacy di appCache in appData se la destinazione è vuota (marker: `.migration_from_appcache_done`). I vecchi dati appCache restano per il rollback.

    Rimossa la ramificazione legacy `sysVersion >= 1.12.3` sui percorsi appCache; il minimo Olares è ora 1.12.6.

    `HF_TOKEN` / `HF_ENDPOINT` ora sono mappati da `OLARES_SYSTEM_HUGGINGFACE_TOKEN` / `OLARES_SYSTEM_HUGGINGFACE_SERVICE` (livello sistema), non da env Hugging Face a livello utente.

    Immagine downloader aggiornata a `beclab/llm-init:v1.3.1`.

    Root dei dati utente spostata da appCache ad appData; la compile-cache resta su appCache.

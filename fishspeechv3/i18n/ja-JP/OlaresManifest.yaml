metadata:
  title: Fish Speech
  description: SOTA オープンソース TTS
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でサービスは1つだけインストールされます。各ユーザーはデスクトップエントリをインストールしてアクセスするか、共有エントランス経由でサービス API を呼び出せます。

    **概要**
    真に人間らしい Text-to-Speech とボイスクローニング

    同梱チェックポイント: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — Fish Audio の表現力豊かな TTS / ボイスクローニングファミリーの最新プロ版。

    FishAudio-S2 Pro は Fish Audio が開発した表現力豊かな text-to-speech（TTS）およびボイスクローニングモデルで、自然で現実的、感情豊かな音声を生成します — ロボットっぽくなく、平坦でなく、スタジオ風ナレーションにも縛られません。

    FishAudio-S2 Pro は、人間が実際に話す様子 — 感情、変化、間、意図 — に焦点を当てます。

    機能
    - Zero-shot & Few-shot TTS: 10〜30秒の音声サンプルを入力して高品質 TTS を生成。

    - 多言語・言語横断対応: 入力欄に多言語テキストをコピー＆ペーストするだけ — 言語を気にする必要なし。現在サポート: 英語、日本語、韓国語、中国語、フランス語、ドイツ語、アラビア語、スペイン語。

    - 音素依存なし: モデルは強い汎化能力を持ち、TTS に音素を必要としません。任意の言語スクリプトのテキストを扱えます。

    - 高精度: Seed-TTS Eval で CER（文字誤り率）約 0.4%、WER（単語誤り率）約 0.8% の低誤差を達成。

    - 高速: torch compile で加速、Nvidia RTX 4090 GPU でのリアルタイム係数は約 1:7。

    - WebUI 推論: Chrome、Firefox、Edge などと互換の使いやすい Gradio ベース Web UI。

    - GUI 推論: API サーバーと連携する PyQt6 グラフィカルインターフェースを提供。Linux、Windows、macOS 対応。
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えます。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除します。

    ストレージ：永続ボリュームを `appCache` から `appData` へ移動。アップグレード後の初回起動時、宛先が空なら initContainers がレガシー appCache の内容を appData にコピー（マーカー: `.migration_from_appcache_done`）。旧 appCache データはロールバック用に残します。

    レガシーな `sysVersion >= 1.12.3` の appCache パス分岐を削除；Olares の最小要件は 1.12.6。

    `HF_TOKEN` / `HF_ENDPOINT` はユーザーレベルの Hugging Face 環境変数ではなく、`OLARES_SYSTEM_HUGGINGFACE_TOKEN` / `OLARES_SYSTEM_HUGGINGFACE_SERVICE`（システムレベル）からマッピング。

    ダウンローダーイメージを `beclab/llm-init:v1.3.1` に更新。

    ユーザーデータルートを appCache から appData へ移動；コンパイルキャッシュは appCache のまま。

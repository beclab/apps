metadata:
  title: Fish Speech
  description: TTS open-source SOTA
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé sur l'ensemble du système Olares. Chaque utilisateur peut installer une entrée de bureau pour y accéder ou utiliser l'entrée partagée pour appeler l'API du service.

    **APERÇU**
    Text-to-Speech et clonage de voix véritablement humains

    Checkpoint inclus : [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — la dernière version pro de Fish Audio de la famille TTS / clonage de voix expressif.

    FishAudio-S2 Pro est un modèle expressif de text-to-speech (TTS) et de clonage de voix développé par Fish Audio, conçu pour générer une parole naturelle, réaliste et émotionnellement riche — ni robotique, ni plate, ni limitée à la narration de studio.

    FishAudio-S2 Pro se concentre sur la façon dont les humains parlent réellement : avec émotion, variation, pauses et intention.

    Fonctionnalités
    - TTS zero-shot et few-shot : Entrez un échantillon vocal de 10 à 30 secondes pour générer un TTS de haute qualité.

    - Prise en charge multilingue et cross-linguale : Copiez-collez simplement du texte multilingue dans la zone de saisie — sans vous soucier de la langue. Prend actuellement en charge l'anglais, le japonais, le coréen, le chinois, le français, l'allemand, l'arabe et l'espagnol.

    - Aucune dépendance aux phonèmes : Le modèle a de fortes capacités de généralisation et ne dépend pas des phonèmes pour le TTS. Il peut traiter du texte dans n'importe quel système d'écriture.

    - Très précis : Atteint un CER (Character Error Rate) bas d'environ 0.4 % et un WER (Word Error Rate) d'environ 0.8 % sur Seed-TTS Eval.

    - Rapide : Accéléré par torch compile, le facteur temps réel est d'environ 1:7 sur un GPU Nvidia RTX 4090.

    - Inférence WebUI : Interface web basée sur Gradio facile à utiliser, compatible avec Chrome, Firefox, Edge et d'autres navigateurs.

    - Inférence GUI : Offre une interface graphique PyQt6 qui fonctionne parfaitement avec le serveur API. Prend en charge Linux, Windows et macOS.
  upgradeDescription: |
    Remplacer l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami `OPENRESTY_CONF_FILE`.

    Stockage : volumes durables déplacés de `appCache` vers `appData`. Au premier démarrage après la mise à jour, les initContainers copient le contenu legacy d'appCache vers appData si la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données appCache sont conservées pour le rollback.

    Suppression du branchement legacy `sysVersion >= 1.12.3` des chemins appCache ; le minimum Olares est désormais 1.12.6.

    `HF_TOKEN` / `HF_ENDPOINT` sont désormais mappés depuis `OLARES_SYSTEM_HUGGINGFACE_TOKEN` / `OLARES_SYSTEM_HUGGINGFACE_SERVICE` (niveau système), et non depuis les env Hugging Face utilisateur.

    Image du downloader mise à jour vers `beclab/llm-init:v1.3.1`.

    Racine des données utilisateur déplacée d'appCache vers appData ; le compile-cache reste sur appCache.

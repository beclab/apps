metadata:
  title: Fish Speech
  description: SOTA Open-Source-TTS
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer kann einen Desktop-Eintrag installieren oder den gemeinsamen Eingang nutzen, um die Service-API aufzurufen.

    **ÜBERSICHT**
    Echt menschenähnliches Text-to-Speech und Voice Cloning

    Gebündelter Checkpoint: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — Fish Audios neueste Pro-Tier-Veröffentlichung der expressiven TTS-/Voice-Cloning-Familie.

    FishAudio-S2 Pro ist ein expressives Text-to-Speech-(TTS)- und Voice-Cloning-Modell von Fish Audio, das Sprache erzeugt, die natürlich, realistisch und emotional reich klingt — nicht roboterhaft, nicht flach und nicht auf Studio-Narration beschränkt.

    FishAudio-S2 Pro konzentriert sich darauf, wie Menschen tatsächlich sprechen: mit Emotion, Variation, Pausen und Absicht.

    Funktionen
    - Zero-shot & Few-shot TTS: Geben Sie eine 10- bis 30-sekündige Stimmprobe ein, um hochwertige TTS-Ausgabe zu erzeugen.

    - Mehrsprachig & Cross-lingual: Mehrsprachigen Text einfach in das Eingabefeld kopieren — ohne Sich um die Sprache zu kümmern. Derzeit unterstützt: Englisch, Japanisch, Koreanisch, Chinesisch, Französisch, Deutsch, Arabisch und Spanisch.

    - Keine Phonem-Abhängigkeit: Das Modell generalisiert stark und braucht keine Phoneme für TTS. Es kann Text in jeder Sprachschrift verarbeiten.

    - Hochgenau: Erreicht eine niedrige CER (Character Error Rate) von etwa 0.4 % und WER (Word Error Rate) von etwa 0.8 % bei Seed-TTS Eval.

    - Schnell: Mit torch compile beschleunigt beträgt der Realzeitfaktor etwa 1:7 auf einer Nvidia RTX 4090 GPU.

    - WebUI-Inferenz: Einfach zu bedienende Gradio-basierte Web-UI, kompatibel mit Chrome, Firefox, Edge und anderen Browsern.

    - GUI-Inferenz: Bietet eine PyQt6-Oberfläche, die nahtlos mit dem API-Server zusammenarbeitet. Unterstützt Linux, Windows und macOS.
  upgradeDescription: |
    Wechsel des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifisches `OPENRESTY_CONF_FILE`-Wiring entfernen.

    Speicher: dauerhafte Volumes von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopieren initContainers Legacy-appCache-Inhalte nach appData, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Alte appCache-Daten bleiben für Rollback erhalten.

    Legacy-Verzweigung `sysVersion >= 1.12.3` für appCache-Pfade entfernt; Olares-Minimum ist jetzt 1.12.6.

    `HF_TOKEN` / `HF_ENDPOINT` werden jetzt von `OLARES_SYSTEM_HUGGINGFACE_TOKEN` / `OLARES_SYSTEM_HUGGINGFACE_SERVICE` (Systemebene) gemappt, nicht von benutzerbezogenen Hugging-Face-Env.

    Downloader-Image auf `beclab/llm-init:v1.3.1` aktualisiert.

    Benutzerdaten-Root von appCache nach appData verschoben; Compile-Cache bleibt auf appCache.

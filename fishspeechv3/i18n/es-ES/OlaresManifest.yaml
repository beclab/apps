metadata:
  title: Fish Speech
  description: TTS open-source de última generación
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar una entrada de escritorio para acceder o usar la entrada compartida para llamar a la API del servicio.

    **RESUMEN**
    Text-to-Speech y clonación de voz verdaderamente humanos

    Checkpoint incluido: [fishaudio/s2-pro](https://huggingface.co/fishaudio/s2-pro) — la última versión pro de Fish Audio de la familia de TTS / clonación de voz expresiva.

    FishAudio-S2 Pro es un modelo expresivo de text-to-speech (TTS) y clonación de voz desarrollado por Fish Audio, diseñado para generar habla natural, realista y emocionalmente rica — no robótica, no plana ni limitada a la narración de estudio.

    FishAudio-S2 Pro se centra en cómo hablan realmente los humanos: con emoción, variación, pausas e intención.

    Funciones
    - TTS zero-shot y few-shot: Introduce una muestra vocal de 10 a 30 segundos para generar TTS de alta calidad.

    - Compatibilidad multilingüe y cross-lingual: Simplemente copia y pega texto multilingüe en el cuadro de entrada — sin preocuparte por el idioma. Actualmente admite inglés, japonés, coreano, chino, francés, alemán, árabe y español.

    - Sin dependencia de fonemas: El modelo tiene una fuerte capacidad de generalización y no depende de fonemas para TTS. Puede manejar texto en cualquier sistema de escritura.

    - Alta precisión: Logra un CER (Character Error Rate) bajo de alrededor del 0.4 % y un WER (Word Error Rate) de alrededor del 0.8 % en Seed-TTS Eval.

    - Rápido: Acelerado por torch compile, el factor en tiempo real es aproximadamente 1:7 en una GPU Nvidia RTX 4090.

    - Inferencia WebUI: Interfaz web basada en Gradio fácil de usar, compatible con Chrome, Firefox, Edge y otros navegadores.

    - Inferencia GUI: Ofrece una interfaz gráfica PyQt6 que funciona a la perfección con el servidor API. Compatible con Linux, Windows y macOS.
  upgradeDescription: |
    Cambiar la imagen del proxy inverso de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.

    Almacenamiento: volúmenes duraderos movidos de `appCache` a `appData`. En el primer arranque tras la actualización, los initContainers copian el contenido legado de appCache a appData si el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos de appCache se conservan para rollback.

    Eliminada la ramificación legada `sysVersion >= 1.12.3` de rutas appCache; el mínimo de Olares es ahora 1.12.6.

    `HF_TOKEN` / `HF_ENDPOINT` ahora se mapean desde `OLARES_SYSTEM_HUGGINGFACE_TOKEN` / `OLARES_SYSTEM_HUGGINGFACE_SERVICE` (nivel de sistema), no desde env de Hugging Face a nivel de usuario.

    Imagen del downloader actualizada a `beclab/llm-init:v1.3.1`.

    Raíz de datos de usuario movida de appCache a appData; la caché de compilación permanece en appCache.

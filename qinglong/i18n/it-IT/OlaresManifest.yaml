metadata:
  title: Qinglong
  description: Piattaforma di gestione delle attività pianificate
spec:
  fullDescription: |
    **Cos'è qinglong?**
    Qinglong è una piattaforma di gestione delle attività pianificate che supporta Python3, JavaScript, Shell e Typescript.

    **Funzionalità**
    - Supporto per più linguaggi di scripting (python3, javaScript, shell, typescript)
    - Gestione online di script, variabili d'ambiente e file di configurazione
    - Visualizzazione online dei log delle attività
    - Impostazione attività a livello di secondi
    - Notifiche a livello di sistema
    - Modalità scura
    - Operazione da telefono

  upgradeDescription: |
    Il chart 0.0.16 aggiorna Qinglong da 2.18.1 a 2.22.0.
    Immagine: docker.io/beclab/whyour-qinglong:2.22.0.

    Se db/database.sqlite esiste già, un init container copia una volta la directory dei dati in appData/backups/chart-0.0.16 prima dell'avvio del nuovo processo. Gli avvii successivi saltano la copia. I file originali restano al loro posto. La precedente copia da appCache ad appData viene ancora eseguita solo se la destinazione appData è vuota.

    Qinglong migra il database all'avvio. Se la migrazione fallisce, il pannello non parte. Ripristinare appData/backups/chart-0.0.16 invece di cancellare il database.

    Le password esistenti consentono ancora l'accesso. Dopo il primo accesso riuscito o un cambio password, la password viene salvata come hash scrypt. Qinglong 2.18.1 non accetta questo hash, quindi il ritorno all'immagine precedente richiede il ripristino di questa copia.

    Qinglong 2.22 aggiunge `options ndots:0` al resolv.conf del Pod. Il chart rimuove questa riga all'avvio così il sidecar di ingresso continua a risolvere i nomi dei servizi del cluster.

    Le vecchie route /configs/:file, /scripts/:file e /logs/:file restituiscono il codice di business 410. Usare le API /detail corrispondenti.

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md

metadata:
  title: 青龙
  description: 定时任务管理平台
spec:
  fullDescription: |
    **青龙是什么？**
    青龙 是一款支持 Python3、JavaScript、Shell、Typescript 的定时任务管理平台。

    **功能**
    - 支持多种脚本语言（python3、javaScript、shell、typescript）
    - 支持在线管理脚本、环境变量、配置文件
    - 支持在线查看任务日志
    - 支持秒级任务设置
    - 支持系统级通知
    - 支持暗黑模式
    - 支持手机端操作

  upgradeDescription: |
    Chart 0.0.16 将青龙从 2.18.1 升级到 2.22.0。
    镜像：docker.io/beclab/whyour-qinglong:2.22.0。

    若已存在 db/database.sqlite，init 容器会在新进程启动前把数据目录完整复制一次到 appData/backups/chart-0.0.16。之后再次启动会跳过。原始文件保留在原处。原先的 appCache 到 appData 复制仍只在 appData 目标目录为空时执行。

    青龙会在启动时迁移数据库。迁移失败时面板不会启动。请恢复 appData/backups/chart-0.0.16，不要删除数据库来跳过错误。

    原有密码仍可登录。首次成功登录或修改密码后，密码会存成 scrypt 哈希。青龙 2.18.1 无法识别该哈希，因此回退镜像必须先恢复这份备份。

    青龙 2.22 会向 Pod 的 resolv.conf 追加 `options ndots:0`。Chart 会在进程启动前从入口脚本去掉这次追加，让入口 sidecar 仍能解析集群服务名。

    旧文件接口 /configs/:file、/scripts/:file、/logs/:file 返回业务码 410，请改用对应的 /detail 接口。

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md

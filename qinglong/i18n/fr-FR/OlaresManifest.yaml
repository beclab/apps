metadata:
  title: Qinglong
  description: Plateforme de gestion des tâches planifiées
spec:
  fullDescription: |
    **Qu'est-ce que qinglong ?**
    Qinglong est une plateforme de gestion des tâches planifiées prenant en charge Python3, JavaScript, Shell et Typescript.

    **Fonctionnalités**
    - Prise en charge de plusieurs langages de script (python3, javaScript, shell, typescript)
    - Gestion en ligne des scripts, variables d'environnement et fichiers de configuration
    - Consultation en ligne des journaux de tâches
    - Planification des tâches à la seconde
    - Notifications système
    - Mode sombre
    - Utilisation depuis le téléphone

  upgradeDescription: |
    Le chart 0.0.16 met Qinglong à jour de 2.18.1 vers 2.22.0.
    Image : docker.io/beclab/whyour-qinglong:2.22.0.

    Si db/database.sqlite existe déjà, un init container copie une fois le répertoire de données vers appData/backups/chart-0.0.16 avant le démarrage du nouveau processus. Les démarrages suivants ignorent cette copie. Les fichiers d'origine restent en place. L'ancienne copie d'appCache vers appData ne s'exécute toujours que si la destination appData est vide.

    Qinglong migre sa base au démarrage. Si la migration échoue, le panneau ne démarre pas. Restaurez appData/backups/chart-0.0.16 au lieu de supprimer la base.

    Les mots de passe existants permettent encore de se connecter. Après la première connexion réussie ou un changement de mot de passe, le mot de passe est stocké en hash scrypt. Qinglong 2.18.1 n'accepte pas ce hash : revenir à l'ancienne image exige de restaurer cette copie.

    Qinglong 2.22 ajoute `options ndots:0` au resolv.conf du Pod. Le chart retire cette ligne au démarrage afin que le sidecar d'entrée résolve encore les noms de service du cluster.

    Les anciennes routes /configs/:file, /scripts/:file et /logs/:file renvoient le code métier 410. Utilisez les API /detail correspondantes.

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md

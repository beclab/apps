metadata:
  title: Qinglong
  description: Plataforma de gestión de tareas programadas
spec:
  fullDescription: |
    **¿Qué es qinglong?**
    Qinglong es una plataforma de gestión de tareas programadas compatible con Python3, JavaScript, Shell y Typescript.

    **Funciones**
    - Compatibilidad con varios lenguajes de scripting (python3, javaScript, shell, typescript)
    - Gestión en línea de scripts, variables de entorno y archivos de configuración
    - Visualización en línea de registros de tareas
    - Configuración de tareas a nivel de segundos
    - Notificaciones a nivel de sistema
    - Modo oscuro
    - Operación desde el teléfono

  upgradeDescription: |
    El chart 0.0.16 actualiza Qinglong de 2.18.1 a 2.22.0.
    Imagen: docker.io/beclab/whyour-qinglong:2.22.0.

    Si ya existe db/database.sqlite, un init container copia el directorio de datos una vez a appData/backups/chart-0.0.16 antes de arrancar el proceso nuevo. Los arranques posteriores omiten la copia. Los archivos originales permanecen. La copia anterior de appCache a appData sigue ejecutándose solo cuando el destino en appData está vacío.

    Qinglong migra la base de datos al iniciar. Si la migración falla, el panel no arranca. Restaure appData/backups/chart-0.0.16 en lugar de borrar la base de datos.

    Las contraseñas existentes siguen permitiendo el acceso. Tras el primer inicio de sesión correcto o un cambio de contraseña, la contraseña se guarda como hash scrypt. Qinglong 2.18.1 no acepta ese hash, así que volver a la imagen anterior exige restaurar esta copia.

    Qinglong 2.22 añade `options ndots:0` al resolv.conf del Pod. El chart elimina esa línea durante el arranque para que el sidecar de entrada siga resolviendo nombres de servicio del clúster.

    Las rutas antiguas /configs/:file, /scripts/:file y /logs/:file devuelven el código de negocio 410. Use las API /detail correspondientes.

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md

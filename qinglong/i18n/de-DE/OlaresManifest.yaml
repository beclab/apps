metadata:
  title: Qinglong
  description: Plattform zur Verwaltung zeitgesteuerter Aufgaben
spec:
  fullDescription: |
    **Was ist qinglong?**
    Qinglong ist eine Plattform zur Verwaltung zeitgesteuerter Aufgaben mit Unterstützung für Python3, JavaScript, Shell und Typescript.

    **Funktionen**
    - Unterstützung mehrerer Skriptsprachen (python3, javaScript, shell, typescript)
    - Online-Verwaltung von Skripten, Umgebungsvariablen und Konfigurationsdateien
    - Online-Anzeige von Aufgabenprotokollen
    - Sekundengenaue Aufgabenplanung
    - Systembenachrichtigungen
    - Dark Mode
    - Bedienung per Mobiltelefon

  upgradeDescription: |
    Chart 0.0.16 aktualisiert Qinglong von 2.18.1 auf 2.22.0.
    Image: docker.io/beclab/whyour-qinglong:2.22.0.

    Wenn db/database.sqlite bereits vorhanden ist, kopiert ein Init-Container das Datenverzeichnis vor dem Start einmal nach appData/backups/chart-0.0.16. Weitere Starts überspringen die Kopie. Die Originaldateien bleiben liegen. Die bisherige Kopie von appCache nach appData läuft weiterhin nur, wenn das appData-Ziel leer ist.

    Qinglong migriert die Datenbank beim Start. Schlägt die Migration fehl, startet das Panel nicht. Stellen Sie appData/backups/chart-0.0.16 wieder her und löschen Sie die Datenbank nicht.

    Bestehende Passwörter funktionieren weiterhin. Nach der ersten erfolgreichen Anmeldung oder einer Passwortänderung wird das Passwort als scrypt-Hash gespeichert. Qinglong 2.18.1 akzeptiert diesen Hash nicht; ein Image-Rollback muss diese Sicherung wiederherstellen.

    Qinglong 2.22 hängt `options ndots:0` an die Pod-resolv.conf an. Das Chart entfernt diese Zeile beim Start, damit der Entrance-Sidecar Cluster-Dienstnamen weiter auflösen kann.

    Die alten Dateirouten /configs/:file, /scripts/:file und /logs/:file liefern den Geschäftscode 410. Verwenden Sie die zugehörigen /detail-APIs.

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md

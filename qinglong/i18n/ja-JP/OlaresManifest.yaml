metadata:
  title: Qinglong
  description: スケジュールタスク管理プラットフォーム
spec:
  fullDescription: |
    **qinglong とは？**
    Qinglong は Python3、JavaScript、Shell、Typescript に対応したスケジュールタスク管理プラットフォームです。

    **機能**
    - 複数のスクリプト言語に対応（python3、javaScript、shell、typescript）
    - スクリプト、環境変数、設定ファイルのオンライン管理
    - タスクログのオンライン表示
    - 秒単位のタスク設定
    - システムレベルの通知
    - ダークモード
    - スマートフォンからの操作

  upgradeDescription: |
    Chart 0.0.16 は Qinglong を 2.18.1 から 2.22.0 に更新します。
    イメージ: docker.io/beclab/whyour-qinglong:2.22.0。

    db/database.sqlite が既にある場合、init コンテナは新しいプロセスの起動前にデータディレクトリを appData/backups/chart-0.0.16 へ一度コピーします。以降の起動ではコピーを省略します。元のファイルはそのまま残します。従来の appCache から appData へのコピーは、appData 側が空のときだけ実行されます。

    Qinglong は起動時にデータベースを移行します。移行に失敗するとパネルは起動しません。データベースを削除せず、appData/backups/chart-0.0.16 を復元してください。

    既存のパスワードでログインできます。初回のログイン成功またはパスワード変更の後、パスワードは scrypt ハッシュとして保存されます。Qinglong 2.18.1 はこのハッシュを受け付けないため、イメージを戻すにはこのバックアップの復元が必要です。

    Qinglong 2.22 は Pod の resolv.conf に `options ndots:0` を追記します。Chart は起動時にこの行を削除し、入口 sidecar がクラスタのサービス名を解決できるようにします。

    古いファイル経路 /configs/:file、/scripts/:file、/logs/:file は業務コード 410 を返します。対応する /detail API を使ってください。

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md

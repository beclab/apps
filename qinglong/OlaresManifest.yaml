olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  qinglong: 1
metadata:
  name: qinglong
  description: Timed Task Management Platform 
  icon: https://app.cdn.olares.com/appstore/qinglong/icon.png
  appid: qinglong
  version: '0.0.16'
  title: Qinglong
  categories:
  - Productivity_v112
  - developer
  tags:
  - automation

entrances:
- name: qinglong
  host: qinglong
  port: 80
  title: Qinglong
  icon: https://app.cdn.olares.com/appstore/qinglong/icon.png
  authLevel: private
  openMethod: window
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '2.22.0'
  upgradeDescription: |
    Chart 0.0.16 upgrades Qinglong from 2.18.1 to 2.22.0.
    Image: docker.io/beclab/whyour-qinglong:2.22.0.

    When db/database.sqlite already exists, an init container copies the data directory once to appData/backups/chart-0.0.16 before the new process starts. Later starts skip that copy. The original files stay in place. The previous appCache-to-appData copy still runs only when the appData destination is empty.

    Qinglong migrates its database on startup. If migration fails, the panel does not start. Restore appData/backups/chart-0.0.16 instead of deleting the database.

    Existing passwords can still log in. After the first successful login or a password change, the password is stored as a scrypt hash. Qinglong 2.18.1 does not accept that hash, so rolling the image back requires this backup.

    Qinglong 2.22 appends `options ndots:0` to the pod resolv.conf. The chart removes that append from the entrypoint before the process starts, so the entrance sidecar can still resolve cluster service names.

    Legacy file routes /configs/:file, /scripts/:file, and /logs/:file return business code 410. Use the matching /detail APIs.

    https://github.com/whyour/qinglong/blob/v2.22.0/docs/releases/2.22.0.md
  fullDescription: |
    **What is qinglong?**
    Qinglong is Timed task management platform supporting Python3, JavaScript, Shell, Typescript.

    **Features**  

    - Support for multiple scripting languages (python3, javaScript, shell, typescript)
    - Support online management of scripts, environment variables, configuration files
    - Support online view task log
    - Support second-level task setting
    - Support system level notification
    - Support dark mode
    - Support cell phone operation

  developer: whyour
  website: https://qinglong.online/
  sourceCode: https://github.com/whyour/qinglong
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  doc: https://qinglong.online/en/guide/introduction
  license:
  - text: Apache-2.0
    url: https://github.com/whyour/qinglong?tab=Apache-2.0-1-ov-file
  requiredMemory: 200Mi 
  limitedMemory: 500Mi
  requiredDisk: 200Mi
  limitedDisk: 1Gi
  requiredCpu: 1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  apiTimeout: 0  
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

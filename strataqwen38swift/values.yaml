images:
  strata: docker.io/mushrxxm/strata:0.2.12-cuda13-amd64-repo
  llmInit: docker.io/beclab/llm-init:v1.7.24
workloads:
  llminit:
    replicaCount: 1
  strataqwen38swift:
    replicaCount: 1
strata:
  cpuThreads: 8
# One-shot: when enabled, an init container runs `setup.py --calibrate` on
# this PC before the engine starts (15-30 min, engine has the GPU exclusively).
# The measured settings persist in the run config/settings file; keep this off
# for normal upgrades.
calibrate:
  enabled: false
  model: IQ3_S

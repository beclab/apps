metadata:
  title: Qwen3.8 Swift 1.5 IQ3_S
  description: "Qwen3.8-Flash-Next Swift 1.5 for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    - La limite CPU de l’application passe à 20 cœurs. La limite CPU du moteur est de 19 cœurs par défaut afin que tous les conteneurs restent dans cette limite, et elle peut être modifiée après l’installation.
    - Le besoin en mémoire passe à 57 GiB et la limite mémoire à 78 GiB. Le moteur demande 56 GiB et sa limite est de 75 GiB.
    - Conserve Strata UI sur le port 8080 sans bloquer le démarrage. Model Console peut s’ouvrir avant la fin du téléchargement et du chargement du modèle ; Strata UI est disponible ensuite.
    - Conserve MTP. Cette version de Strata ne prend pas en charge DFlash2 pour Swift.
    - Le nombre de workers experts se règle avec --pool-workers dans ENGINE_ARGS et n’est plus plafonné selon le budget CPU du conteneur. Les arguments enregistrés sont conservés ; définissez --kv-streaming auto dans Model Console pour activer le KV Streaming automatique.
  fullDescription: |
Qwen3.8-Flash-Next Swift 1.5 est un fine-tuning d'UkisAI du Qwen3.8-Flash-Next d'Alibaba, conçu pour répondre plus tôt : les auteurs rapportent 63 % de tokens de raisonnement en moins et des réponses démarrant 1,8x plus tôt que le modèle d'origine. Cette application exécute localement sa quantification GSQ-RCO IQ3_S via Strata.

    Strata est un moteur d'inférence open source qui exécute de grands modèles d'IA localement. Il coordonne la mémoire GPU, la mémoire vive du système et le stockage afin que le modèle n'ait pas à tenir entièrement dans la mémoire GPU. Model Console relie le moteur à Olares.

    **Principales fonctionnalités**

    - Générer des réponses textuelles avec un mode de raisonnement et des appels d’outils dans les applications compatibles.
    - Utiliser Model Console pour télécharger le modèle, consulter son état et ajuster les paramètres du moteur.
    - Connecter des applications compatibles via Olares Router ou l’API de chat compatible avec OpenAI.
    - Discutez avec le modèle et suivez en direct la vitesse, la VRAM et les statistiques du cache dans l'interface web Strata incluse (Chat et Statistiques).

    **Cette édition**

    Cette édition accepte du texte et des images en entrée ; l’entrée vidéo est désactivée. La limite de contexte par défaut est de 262 144 tokens, avec une seule requête traitée à la fois. Le contexte disponible dépend de la mémoire et des paramètres du moteur.

    **Avant la première utilisation**

    Au premier démarrage, environ 84 GB de fichiers du modèle sont téléchargés, ainsi que les fichiers supplémentaires nécessaires à Strata, puis le modèle est préparé. Model Console peut indiquer que le téléchargement principal est terminé alors que Strata prépare encore le modèle.

    Sur amd64, un processeur (CPU) prenant en charge AVX2 et un pilote NVIDIA de la série R580 ou ultérieure sont requis. La configuration par défaut est prévue pour un hôte disposant de 96 GiB de RAM. Consultez les ressources requises indiquées avant l’installation. Construit et testé sur l'Olares One.

    [Documentation du modèle](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modèle quantifié](https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Documentation de Strata](https://github.com/Niko1221/Strata)

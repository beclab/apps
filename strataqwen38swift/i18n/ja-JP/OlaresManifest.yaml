metadata:
  title: Qwen3.8 Swift 1.5 IQ3_S
  description: "Qwen3.8-Flash-Next Swift 1.5 for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    - Strata 0.2.12(エンジン0.1.58): このアプリではDFlash2ドラフターが既定で起動するようになり、生成が速くなりました。複数のAPIクライアントでのツール呼び出し(Claude Desktopのモデル名、ツール呼び出しタグの形式、MCP名の末尾一致、tool_choiceの強制)の修正、サーバーの速度表示の訂正、長いCUDAプロンプトでの安定性改善も含みます。モデル、262Kコンテキスト、画像入力は変更ありません。
  fullDescription: |
Qwen3.8-Flash-Next Swift 1.5 は、Alibaba の Qwen3.8-Flash-Next を UkisAI がファインチューニングしたモデルで、より早く回答することを目指しています。作者の報告では、思考トークンが 63% 減少し、元のモデルより 1.8 倍早く回答が始まります。このアプリは、その GSQ-RCO IQ3_S 量子化版を Strata でローカル実行します。

    Strataは、大規模なAIモデルをローカルで実行するためのオープンソース推論エンジンです。GPUメモリ、システムRAM、ストレージを連携させることで、モデル全体をGPUメモリに収める必要がなくなります。Model Consoleを通じてエンジンをOlaresに接続します。

    **主な機能**

    - 対応するアプリで、思考モードやツール呼び出しを使ってテキストの回答を生成できます。
    - Model Consoleでモデルのダウンロード、状態の確認、エンジン設定の調整ができます。
    - Olares RouterまたはOpenAI互換のチャットAPIを通じて、対応するアプリを接続できます。
    - 付属の Strata Web UI（Chat と Statistics）でモデルとチャットし、速度・VRAM・キャッシュ統計をリアルタイムで確認できます。

    **このエディションについて**

    このエディションはテキスト入力と画像入力に対応しています。動画入力は無効です。デフォルトのコンテキスト上限は262,144トークンで、一度に処理するリクエストは1件です。利用可能なコンテキストは、メモリとエンジン設定によって異なります。 Qwen3.8-Flash-Next IQ3_S アプリと同様、このプリセットは 96 GiB のホスト向けに設計されており、2つのモデルアプリは同時に1つしか実行できません(スケジューラが強制します)。

    **初回利用前の確認事項**

    初回起動時には約84GBのモデルファイルとStrataに必要な追加ファイルをダウンロードし、その後モデルを準備します。Model Consoleでメインのダウンロードが完了と表示されても、Strataによるモデルの準備が続いている場合があります。

    amd64 では、AVX2 に対応した CPU と、R580シリーズ以降のNVIDIAドライバが必要です。このプリセットは96GiBのRAMを搭載したホストを想定しています。インストール前に、記載されているリソース要件を確認してください。 Olares One でビルドおよびテスト済みです。

    [モデルのドキュメント](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [量子化モデル](https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strataのドキュメント](https://github.com/Niko1221/Strata)

metadata:
  title: Qwen3.8 Swift 1.5 IQ3_S
  description: "Qwen3.8-Flash-Next Swift 1.5 for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    - Strata 0.2.12 (motore 0.1.58): l'assistente di bozza DFlash2 ora si avvia per impostazione predefinita in questa app, rendendo la generazione più rapida; correzioni delle chiamate a strumenti in diversi client API (nome del modello di Claude Desktop, forme dei tag di chiamata a strumento, corrispondenza dei nomi MCP, tool_choice forzato); rapporti di velocità del server corretti; e un motore più stabile con prompt CUDA lunghi. Modello, contesto 262K e input di immagini restano invariati.
  fullDescription: |
Qwen3.8-Flash-Next Swift 1.5 è un fine-tuning di UkisAI di Qwen3.8-Flash-Next di Alibaba, creato per rispondere prima: gli autori riportano il 63 % di token di ragionamento in meno e risposte che iniziano 1,8x prima rispetto al modello originale. L'app esegue localmente la quantizzazione GSQ-RCO IQ3_S tramite Strata.

    Strata è un motore di inferenza open source per eseguire grandi modelli di IA in locale. Coordina la memoria della GPU, la RAM di sistema e l'archiviazione, così il modello non deve essere contenuto interamente nella memoria della GPU. Model Console collega il motore a Olares.

    **Funzionalità principali**

    - Generare risposte testuali con supporto per una modalità di ragionamento e per le chiamate a strumenti nelle applicazioni compatibili.
    - Usare Model Console per scaricare il modello, visualizzarne lo stato e modificare le impostazioni del motore.
    - Collegare applicazioni compatibili tramite Olares Router o l’API di chat compatibile con OpenAI.
    - Chatta con il modello e segui in tempo reale velocità, VRAM e statistiche della cache nell'interfaccia web Strata inclusa (Chat e Statistiche).

    **Questa edizione**

    Questa edizione accetta testo e immagini in ingresso; l’inserimento di video è disattivato. Il limite di contesto predefinito è di 262.144 token e viene elaborata una richiesta alla volta. Il contesto disponibile dipende dalla memoria e dalle impostazioni del motore.

    **Prima del primo utilizzo**

    Al primo avvio vengono scaricati circa 84 GB di file del modello, oltre ai file aggiuntivi necessari a Strata, quindi viene preparato il modello. Model Console può indicare che il download principale è terminato mentre Strata sta ancora preparando il modello.

    Su amd64, sono necessari una CPU con supporto AVX2 e un driver NVIDIA della serie R580 o successiva. La configurazione predefinita è pensata per un host con 96 GiB di RAM. Consultare i requisiti di risorse indicati prima dell’installazione. Compilato e testato su Olares One.

    [Documentazione del modello](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modello quantizzato](https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Documentazione di Strata](https://github.com/Niko1221/Strata)

metadata:
  title: Qwen3.8 Swift 1.5 IQ3_S
  description: "Qwen3.8-Flash-Next Swift 1.5 for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    - Strata 0.2.12(引擎 0.1.58):DFlash2 草稿模型现在在本应用中默认启动,生成更快;修复多个 API 客户端的工具调用(Claude Desktop 模型名、工具调用标签写法、MCP 名称匹配、强制 tool_choice);更正服务器速度报告;改进长 CUDA 提示词时的引擎稳定性。模型、262K 上下文与图像输入保持不变。
  fullDescription: |
Qwen3.8-Flash-Next Swift 1.5 是 UkisAI 在阿里巴巴 Qwen3.8-Flash-Next 基础上微调的模型，目标是更早给出回答：作者报告其思考 token 减少 63%，回答起点比原模型提前 1.8 倍。本应用通过 Strata 在本地运行其 GSQ-RCO IQ3_S 量化版本。

    Strata 是用于在本地运行大型 AI 模型的开源推理引擎。它协调使用 GPU 显存、系统内存和存储，使模型无需完整装入显存即可运行。Model Console 将推理引擎接入 Olares。

    **主要功能**

    - 生成文本回复，并在兼容的应用中支持思考和工具调用。
    - 通过 Model Console 下载模型、查看状态和调整引擎设置。
    - 通过 Olares Router 或兼容 OpenAI 的聊天 API 连接兼容的应用。
    - 在自带的 Strata 网页界面（聊天与统计）中与模型对话，实时查看速度、显存和缓存统计。

    **本版本说明**

    本版本支持文本和图像输入，已关闭视频输入。默认上下文上限为 262,144 个 token，每次处理一个请求。可用上下文取决于内存和引擎设置。 与 Qwen3.8-Flash-Next IQ3_S 应用相同，此预设按 96 GiB 主机规格配置：两个模型应用同一时间只运行一个（由调度器强制执行）。

    **首次使用前**

    首次启动会下载约 84 GB 的模型文件及 Strata 所需的其他文件，然后准备模型。Model Console 显示主模型下载完成时，Strata 可能仍在准备模型。

    在 amd64 上，需要支持 AVX2 的 CPU，以及 R580 系列或更新版本的 NVIDIA 驱动。此预设面向配备 96 GiB 内存的主机。安装前请查看列出的资源要求。 在 Olares One 上构建并测试。

    [模型文档](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [量化模型](https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strata 文档](https://github.com/Niko1221/Strata)

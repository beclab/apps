metadata:
  title: Qwen3.8 Swift 1.5 IQ3_S
  description: "Qwen3.8-Flash-Next Swift 1.5 for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    - Strata 0.2.12 (motor 0.1.58): el asistente de borrador DFlash2 ahora se inicia de forma predeterminada en esta app, lo que acelera la generación; correcciones de llamadas a herramientas en varios clientes de API (nombre de modelo de Claude Desktop, formas de etiquetas de llamadas a herramientas, coincidencia de nombres MCP, tool_choice forzado); informes de velocidad del servidor corregidos; y un motor más estable con prompts CUDA largos. El modelo, el contexto de 262K y la entrada de imágenes no cambian.
  fullDescription: |
Qwen3.8-Flash-Next Swift 1.5 es un fine-tuning de UkisAI sobre Qwen3.8-Flash-Next de Alibaba, creado para responder antes: los autores reportan un 63 % menos de tokens de razonamiento y respuestas que comienzan 1,8x antes que el modelo original. Esta app ejecuta localmente su cuantización GSQ-RCO IQ3_S mediante Strata.

    Strata es un motor de inferencia de código abierto para ejecutar grandes modelos de IA localmente. Coordina la memoria de la GPU, la RAM del sistema y el almacenamiento para que el modelo completo no tenga que caber en la memoria de la GPU. Model Console conecta el motor a Olares.

    **Funciones principales**

    - Generar respuestas de texto con un modo de razonamiento y llamadas a herramientas en aplicaciones compatibles.
    - Usar Model Console para descargar el modelo, consultar su estado y ajustar la configuración del motor.
    - Conectar aplicaciones compatibles mediante Olares Router o la API de chat compatible con OpenAI.
    - Chatea con el modelo y sigue en directo la velocidad, la VRAM y las estadísticas de caché en la interfaz web de Strata incluida (Chat y Estadísticas).

    **Esta edición**

    Esta edición admite texto e imagen como entrada; la entrada de vídeo está desactivada. El límite de contexto predeterminado es de 262.144 tokens y se procesa una solicitud cada vez. El contexto disponible depende de la memoria y de la configuración del motor.

    **Antes del primer uso**

    En el primer inicio se descargan aproximadamente 84 GB de archivos del modelo, además de los archivos adicionales que necesita Strata. Después se prepara el modelo. Model Console puede indicar que la descarga principal ha finalizado mientras Strata aún está preparando el modelo.

    En amd64, se requieren una CPU compatible con AVX2 y un controlador NVIDIA de la serie R580 o posterior. La configuración predeterminada está pensada para un equipo con 96 GiB de RAM. Consulte los requisitos de recursos indicados antes de instalar la aplicación. Compilado y probado en el Olares One.

    [Documentación del modelo](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modelo cuantizado](https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Documentación de Strata](https://github.com/Niko1221/Strata)

spec:
  onlyAdmin: true
  versionName: Swift 1.5 GSQ-RCO IQ3_S
  fullDescription: |
    Qwen3.8-Flash-Next Swift 1.5 is UkisAI's fine-tune of Alibaba's Qwen3.8-Flash-Next, built to answer sooner: the authors report 63 % fewer thinking tokens and answers starting 1.8x earlier than the original model. This app runs its GSQ-RCO IQ3_S quantization locally using Strata.

    Strata is an open-source inference engine for running large AI models locally. It coordinates GPU memory, system RAM, and storage so the full model does not need to fit in GPU memory. Model Console connects the engine to Olares.

    **Key features**

    - Generate text responses with support for thinking and tool calling in compatible applications.
    - Chat with the model and follow live speed, VRAM and cache stats in the bundled Strata web UI (Chat and Statistics).
    - Use Model Console to download the model, view its status, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition supports text and image input; video input is disabled. The default context limit is 262,144 tokens, with one request processed at a time. Available context depends on memory and engine settings. Like the Qwen3.8-Flash-Next IQ3_S app, this preset is sized for a 96 GiB host: only one of the two model apps runs at a time (the scheduler enforces it).

    **Before first use**

    First startup downloads approximately 84 GB of model files plus additional files needed by Strata, then prepares the model. Model Console may show the main download as complete while Strata is still preparing the model.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer are required. See the listed resource requirements before installing. Built and tested on the Olares One.

    [Model repository](https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strata documentation](https://github.com/Niko1221/Strata)
  developer: UkisAI (fine-tune); Alibaba Cloud (base model); ISTA-DASLab (GSQ-RCO method); Niko1221 (Strata engine)
  website: https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF
  sourceCode: https://github.com/Niko1221/Strata
  doc: https://github.com/Niko1221/Strata#readme
  submitter: xXm-mXx
  # Market listing images: same framed captures as the Qwen3.8-Flash-Next IQ3_S
  # listing (identical engine + Strata UI). Verified anonymous HTTP 200 image/png.
  featuredImage: https://cdn.olares.com/images/2026-11-11145c7d662ed1adb457e6cb2c64d29a.png
  promoteImage:
  - https://cdn.olares.com/images/2026-11-11145c7d662ed1adb457e6cb2c64d29a.png
  - https://cdn.olares.com/images/2026-11-1ea008ed41225b16c41073798792fce1.png
  locale:

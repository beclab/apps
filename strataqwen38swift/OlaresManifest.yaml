    requiredCpu: 1300m
    requiredDisk: 120Gi
    limitedDisk: 200Gi
    requiredMemory: 65Gi
    limitedMemory: 83Gi
    requiredGPUMemory: 23Gi
    limitedGPUMemory: 24Gi

envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF --revision 99bb8f7f95c7aa7b24a36a7786a4f657b30f5d3d --include Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf,hf://ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF --revision 99bb8f7f95c7aa7b24a36a7786a4f657b30f5d3d --include Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
  description: Two pinned single-file sources sharing one HF snapshot; extras finish before the main model handoff.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: qwen3.8-flash-next-swift-iq3_s
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: thinking,tools,vision
- envName: MODEL_REASONING_EFFORT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "low,medium,xhigh"
  description: "The reasoning_effort levels this model accepts, published on the model card so clients can read them instead of guessing."
- envName: MODEL_REASONING_EFFORT_DEFAULT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "xhigh"
  description: "The level this model uses when a request does not ask for one."
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: --context 262144 --parallel 1 --resident-budget-gib 48 --kv int8 --kv-streaming auto --vram-reserve-mib 1024
  description: Strata setup.py options. Model/source/host/port/GPU/vision are managed by the chart. Add --pool-workers here to set the CPU expert-worker count; without it, Strata chooses from the CPUs visible in the container, which can exceed STRATA_CPU_LIMIT. Saving engine_args
    in Model Console relaunches setup and the server; existing packs and MTP files are reused.
    Existing installations retain saved arguments; set --kv-streaming auto to enable the new default.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '1'
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 56Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: '19'
  description: Engine container CPU limit in cores. Defaults to 19 so the total container CPU limit stays within the app ceiling (20). Saving restarts the engine. Expert workers are set with --pool-workers in ENGINE_ARGS.
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 80Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 23Gi

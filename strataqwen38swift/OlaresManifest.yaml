  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  license:
  - text: Qwen Community License 1.0 (base model)
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/main/LICENSE
  - text: Swift Open License 1.0 (Swift 1.5 fine-tune and GGUF conversion)
    url: https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF
  - text: MIT (Strata engine)
    url: https://github.com/Niko1221/Strata/blob/main/LICENSE
  accelerator:

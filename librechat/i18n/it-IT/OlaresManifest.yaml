metadata:
  title: LibreChat
  description: Clone di ChatGPT potenziato con Agents, MCP e supporto multi-modello
spec:
  upgradeDescription: |
    Aggiornare LibreChat alla v0.8.7 ufficiale. Usare le immagini ufficiali di Meilisearch e MongoDB, alzare il limite di upload di OpenResty a 512 MB, mantenere i secret JWT/Meili/credenziali tra gli aggiornamenti e aggiungere campi delle impostazioni per un endpoint OpenAI-compatibile aggiuntivo. Meilisearch conserva la directory dati esistente e la migra sul posto.
  fullDescription: |
    LibreChat è un clone di ChatGPT potenziato che unisce il futuro degli assistenti AI con tecnologia rivoluzionaria. Supporta più fornitori di modelli AI tra cui OpenAI, Anthropic, AWS Bedrock, Azure OpenAI, Google, Vertex AI ed endpoint personalizzati.

    **Funzionalità principali**
    - Supporto multi-modello: Passare tra OpenAI, Anthropic, AWS Bedrock, Azure, Google, Vertex AI ed endpoint personalizzati
    - Agents e strumenti: Creare helper AI specializzati con assistenti personalizzati no-code
    - Interprete di codice: Esecuzione sicura in sandbox in Python, Node.js, Go, C/C++, Java, PHP, Rust e Fortran
    - Ricerca web: Cercare su Internet e recuperare informazioni rilevanti per arricchire il contesto AI
    - UI generativa: Code Artifacts per creare diagrammi React, HTML e Mermaid direttamente in chat
    - Generazione di immagini: Testo-immagine e immagine-immagine con DALL-E, Stable Diffusion, Flux e altro
    - Supporto multimodale: Caricare e analizzare immagini con Claude 3, GPT-4, o1, Llama-Vision e Gemini
    - Interazioni con file: Chattare con i file tramite vari endpoint AI
    - UI multilingue: Supporto per oltre 30 lingue
    - Voce e audio: Chat a mani libere con Speech-to-Text e Text-to-Speech
    - Multiutente e sicuro: Supporto login OAuth2, LDAP ed e-mail con moderazione integrata
    - Ricerca messaggi: Cercare tutti i messaggi e le conversazioni
    - Importazione ed esportazione: Importare da LibreChat, ChatGPT, Chatbot UI ed esportare come screenshot, markdown, testo, json

    **Architettura della piattaforma**
    - LibreChat API: servizio Node.js che gestisce richieste AI, autenticazione, agents e integrazione MCP
    - MongoDB: database documentale per conversazioni, messaggi e dati utente
    - MeiliSearch: motore di ricerca veloce per messaggi e conversazioni
    - Frontend: UI basata su React ispirata a ChatGPT con funzionalità avanzate

envs:
- envName: ENDPOINT_NAME
  description: Nome visualizzato nel selettore modelli per questo endpoint aggiuntivo.
- envName: ENDPOINT_BASE_URL
  description: "URL API compatibile OpenAI. Per un'app modello Olares usare l'host di ingresso, es. https://<id>.<olares-id>.olares.com (senza porta). Accetta anche un /v1 finale o https://api.openai.com/v1. Viene aggiunto un /v1/ finale se mancante. Lasciare vuoto per nascondere questo endpoint."
- envName: ENDPOINT_MODELS
  description: ID modello separati da virgola. Lasciare vuoto per recuperarli da GET /v1/models.
- envName: ENDPOINT_API_KEY
  description: Chiave API per questo endpoint. Lasciare vuoto se il server non ne richiede una.

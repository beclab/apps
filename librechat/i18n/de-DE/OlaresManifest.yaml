metadata:
  title: LibreChat
  description: Erweiterter ChatGPT-Klon mit Agents, MCP und Multi-Modell-Unterstützung
spec:
  upgradeDescription: |
    LibreChat auf die offizielle Version v0.8.7 aktualisieren. Offizielle Meilisearch- und MongoDB-Images verwenden, das OpenResty-Upload-Limit auf 512 MB anheben, JWT-/Meili-/Credential-Secrets über Upgrades hinweg beibehalten und Einstellungsfelder für einen zusätzlichen OpenAI-kompatiblen Endpunkt hinzufügen. Meilisearch behält das bestehende Datenverzeichnis und migriert es an Ort und Stelle.
  fullDescription: |
    LibreChat ist ein erweiterter ChatGPT-Klon, der die Zukunft der Assistenten-KI mit revolutionärer Technologie verbindet. Es unterstützt mehrere KI-Modellanbieter, darunter OpenAI, Anthropic, AWS Bedrock, Azure OpenAI, Google, Vertex AI und benutzerdefinierte Endpunkte.

    **Hauptfunktionen**
    - Multi-Modell-Unterstützung: Zwischen OpenAI, Anthropic, AWS Bedrock, Azure, Google, Vertex AI und benutzerdefinierten Endpunkten wechseln
    - Agents & Tools: Spezialisierte KI-Helfer mit No-Code-Custom-Assistenten erstellen
    - Code-Interpreter: Sichere, sandboxed Ausführung in Python, Node.js, Go, C/C++, Java, PHP, Rust und Fortran
    - Websuche: Das Internet durchsuchen und relevante Informationen abrufen, um den KI-Kontext zu erweitern
    - Generative UI: Code-Artifacts zum Erstellen von React-, HTML- und Mermaid-Diagrammen direkt im Chat
    - Bildgenerierung: Text-zu-Bild und Bild-zu-Bild mit DALL-E, Stable Diffusion, Flux und mehr
    - Multimodale Unterstützung: Bilder mit Claude 3, GPT-4, o1, Llama-Vision und Gemini hochladen und analysieren
    - Dateiinteraktionen: Mit Dateien über verschiedene KI-Endpunkte chatten
    - Mehrsprachige UI: Unterstützung für über 30 Sprachen
    - Sprache & Audio: Freihändig chatten mit Speech-to-Text und Text-to-Speech
    - Mehrbenutzer & sicher: OAuth2-, LDAP- und E-Mail-Login mit integrierter Moderation
    - Nachrichtensuche: Alle Nachrichten und Unterhaltungen durchsuchen
    - Import & Export: Import aus LibreChat, ChatGPT, Chatbot UI und Export als Screenshots, Markdown, Text, JSON

    **Plattformarchitektur**
    - LibreChat API: Node.js-Dienst für KI-Anfragen, Authentifizierung, Agents und MCP-Integration
    - MongoDB: Dokumentendatenbank für Unterhaltungen, Nachrichten und Nutzerdaten
    - MeiliSearch: Schnelle Suchmaschine für Nachrichten- und Unterhaltungssuche
    - Frontend: React-basierte UI, inspiriert von ChatGPT, mit erweiterten Funktionen

envs:
- envName: ENDPOINT_NAME
  description: Anzeigename im Modellwähler für diesen zusätzlichen Endpunkt.
- envName: ENDPOINT_BASE_URL
  description: "OpenAI-kompatible API-URL. Für eine Olares-Modell-App deren Entrance-Host verwenden, z. B. https://<id>.<olares-id>.olares.com (ohne Port). Akzeptiert auch ein abschließendes /v1 oder https://api.openai.com/v1. Ein abschließendes /v1/ wird ergänzt, falls fehlend. Leer lassen, um diesen Endpunkt auszublenden."
- envName: ENDPOINT_MODELS
  description: Kommagetrennte Modell-IDs. Leer lassen, um von GET /v1/models abzurufen.
- envName: ENDPOINT_API_KEY
  description: API-Schlüssel für diesen Endpunkt. Leer lassen, wenn der Server keinen benötigt.

metadata:
  title: LibreChat
  description: Agents、MCP、マルチモデル対応の強化版 ChatGPT クローン
spec:
  upgradeDescription: |
    LibreChat を公式 v0.8.7 へアップグレード。Meilisearch と MongoDB は公式イメージを使用し、OpenResty のアップロード上限を 512MB に引き上げ、JWT／Meili／資格情報シークレットをアップグレード間で保持し、追加の OpenAI 互換エンドポイント用設定フィールドを追加。Meilisearch は既存データディレクトリを維持し、その場で移行します。
  fullDescription: |
    LibreChat は、アシスタント AI の未来と革新的テクノロジーを結ぶ強化版 ChatGPT クローンです。OpenAI、Anthropic、AWS Bedrock、Azure OpenAI、Google、Vertex AI、カスタムエンドポイントなど複数の AI モデルプロバイダーをサポートします。

    **主な機能**
    - マルチモデル対応：OpenAI、Anthropic、AWS Bedrock、Azure、Google、Vertex AI、カスタムエンドポイントを切替
    - Agents とツール：ノーコードのカスタムアシスタントで特化型 AI ヘルパーを構築
    - コードインタプリタ：Python、Node.js、Go、C/C++、Java、PHP、Rust、Fortran での安全なサンドボックス実行
    - Web 検索：インターネットを検索し、関連情報を取得して AI コンテキストを強化
    - 生成 UI：チャット内で React、HTML、Mermaid 図を作成する Code Artifacts
    - 画像生成：DALL-E、Stable Diffusion、Flux などによるテキストから画像／画像から画像
    - マルチモーダル対応：Claude 3、GPT-4、o1、Llama-Vision、Gemini で画像をアップロード・分析
    - ファイル連携：各種 AI エンドポイントでファイルとチャット
    - 多言語 UI：30 以上の言語をサポート
    - 音声とオーディオ：Speech-to-Text と Text-to-Speech でハンズフリーチャット
    - マルチユーザー＆セキュア：OAuth2、LDAP、メールログインと組み込みモデレーション
    - メッセージ検索：すべてのメッセージと会話を検索
    - インポート＆エクスポート：LibreChat、ChatGPT、Chatbot UI からインポートし、スクリーンショット、markdown、text、json でエクスポート

    **プラットフォーム構成**
    - LibreChat API：AI リクエスト、認証、agents、MCP 連携を扱う Node.js サービス
    - MongoDB：会話、メッセージ、ユーザーデータを保存するドキュメント DB
    - MeiliSearch：メッセージ／会話検索向けの高速検索エンジン
    - フロントエンド：ChatGPT に着想を得た React ベース UI と強化機能

envs:
- envName: ENDPOINT_NAME
  description: この追加エンドポイントのモデルピッカー表示名。
- envName: ENDPOINT_BASE_URL
  description: "OpenAI 互換 API URL。Olares モデルアプリの場合は入口ホスト、例: https://<id>.<olares-id>.olares.com（ポートなし）。末尾の /v1 や https://api.openai.com/v1 も可。末尾の /v1/ が無ければ追加されます。空にするとこのエンドポイントを非表示。"
- envName: ENDPOINT_MODELS
  description: カンマ区切りのモデル ID。空にすると GET /v1/models から取得。
- envName: ENDPOINT_API_KEY
  description: このエンドポイントの API キー。サーバーが不要なら空で可。

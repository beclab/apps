metadata:
  title: LibreChat
  description: Clon de ChatGPT mejorado con Agents, MCP y soporte multimodelo
spec:
  upgradeDescription: |
    Actualizar LibreChat a la v0.8.7 oficial. Usar imágenes oficiales de Meilisearch y MongoDB, subir el límite de carga de OpenResty a 512 MB, conservar los secretos JWT/Meili/credenciales entre actualizaciones y añadir campos de configuración para un endpoint OpenAI-compatible adicional. Meilisearch conserva el directorio de datos existente y lo migra in situ.
  fullDescription: |
    LibreChat es un clon de ChatGPT mejorado que reúne el futuro de los asistentes de IA con tecnología revolucionaria. Admite varios proveedores de modelos de IA, incluidos OpenAI, Anthropic, AWS Bedrock, Azure OpenAI, Google, Vertex AI y endpoints personalizados.

    **Funciones principales**
    - Soporte multimodelo: Cambiar entre OpenAI, Anthropic, AWS Bedrock, Azure, Google, Vertex AI y endpoints personalizados
    - Agents y herramientas: Crear ayudantes impulsados por IA especializados con asistentes personalizados sin código
    - Intérprete de código: Ejecución segura en sandbox en Python, Node.js, Go, C/C++, Java, PHP, Rust y Fortran
    - Búsqueda web: Buscar en Internet y recuperar información relevante para enriquecer el contexto de la IA
    - UI generativa: Code Artifacts para crear diagramas React, HTML y Mermaid directamente en el chat
    - Generación de imágenes: Texto a imagen e imagen a imagen con DALL-E, Stable Diffusion, Flux y más
    - Soporte multimodal: Subir y analizar imágenes con Claude 3, GPT-4, o1, Llama-Vision y Gemini
    - Interacciones con archivos: Chatear con archivos mediante varios endpoints de IA
    - UI multilingüe: Soporte para más de 30 idiomas
    - Voz y audio: Chatear manos libres con Speech-to-Text y Text-to-Speech
    - Multiusuario y seguro: Soporte de inicio de sesión OAuth2, LDAP y correo electrónico con moderación integrada
    - Búsqueda de mensajes: Buscar todos los mensajes y conversaciones
    - Importar y exportar: Importar desde LibreChat, ChatGPT, Chatbot UI y exportar como capturas, markdown, texto, json

    **Arquitectura de la plataforma**
    - LibreChat API: servicio Node.js que gestiona solicitudes de IA, autenticación, agents e integración MCP
    - MongoDB: base de datos de documentos para conversaciones, mensajes y datos de usuario
    - MeiliSearch: motor de búsqueda rápido para mensajes y conversaciones
    - Frontend: UI basada en React inspirada en ChatGPT con funciones mejoradas

envs:
- envName: ENDPOINT_NAME
  description: Nombre visible en el selector de modelos para este endpoint adicional.
- envName: ENDPOINT_BASE_URL
  description: "URL de API compatible con OpenAI. Para una app de modelo Olares use su host de entrada, p. ej. https://<id>.<olares-id>.olares.com (sin puerto). También acepta un /v1 final o https://api.openai.com/v1. Se añade un /v1/ final si falta. Déjelo vacío para ocultar este endpoint."
- envName: ENDPOINT_MODELS
  description: IDs de modelo separados por comas. Déjelo vacío para obtenerlos de GET /v1/models.
- envName: ENDPOINT_API_KEY
  description: Clave API para este endpoint. Déjela vacía si el servidor no la requiere.

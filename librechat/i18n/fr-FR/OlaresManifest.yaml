metadata:
  title: LibreChat
  description: Clone ChatGPT amélioré avec Agents, MCP et prise en charge multi-modèles
spec:
  upgradeDescription: |
    Mettre à niveau LibreChat vers la v0.8.7 officielle. Utiliser les images officielles Meilisearch et MongoDB, relever la limite d'upload OpenResty à 512 Mo, conserver les secrets JWT/Meili/identifiants entre les mises à niveau, et ajouter des champs de paramètres pour un endpoint compatible OpenAI supplémentaire. Meilisearch conserve le répertoire de données existant et le migre sur place.
  fullDescription: |
    LibreChat est un clone ChatGPT amélioré qui réunit l'avenir des assistants IA et une technologie révolutionnaire. Il prend en charge plusieurs fournisseurs de modèles IA, notamment OpenAI, Anthropic, AWS Bedrock, Azure OpenAI, Google, Vertex AI et des endpoints personnalisés.

    **Fonctionnalités clés**
    - Prise en charge multi-modèles : basculez entre OpenAI, Anthropic, AWS Bedrock, Azure, Google, Vertex AI et des endpoints personnalisés
    - Agents et outils : créez des aides IA spécialisées avec des assistants personnalisés sans code
    - Interpréteur de code : exécution sécurisée en bac à sable en Python, Node.js, Go, C/C++, Java, PHP, Rust et Fortran
    - Recherche web : recherchez sur Internet et récupérez des informations pertinentes pour enrichir le contexte IA
    - UI générative : Code Artifacts pour créer des diagrammes React, HTML et Mermaid directement dans le chat
    - Génération d'images : texte-vers-image et image-vers-image avec DALL-E, Stable Diffusion, Flux et plus
    - Prise en charge multimodale : téléversez et analysez des images avec Claude 3, GPT-4, o1, Llama-Vision et Gemini
    - Interactions avec les fichiers : discutez avec des fichiers via divers endpoints IA
    - UI multilingue : prise en charge de plus de 30 langues
    - Parole et audio : discutez mains libres avec Speech-to-Text et Text-to-Speech
    - Multi-utilisateurs et sécurisé : prise en charge OAuth2, LDAP et connexion e-mail avec modération intégrée
    - Recherche de messages : recherchez tous les messages et conversations
    - Importation et exportation : importez depuis LibreChat, ChatGPT, Chatbot UI et exportez en captures d'écran, markdown, texte, json

    **Architecture de la plateforme**
    - LibreChat API : service Node.js gérant les requêtes IA, l'authentification, les agents et l'intégration MCP
    - MongoDB : base de données documentaire pour les conversations, messages et données utilisateur
    - MeiliSearch : moteur de recherche rapide pour les messages et conversations
    - Frontend : interface React inspirée de ChatGPT avec des fonctionnalités enrichies

envs:
- envName: ENDPOINT_NAME
  description: Nom affiché dans le sélecteur de modèles pour cet endpoint supplémentaire.
- envName: ENDPOINT_BASE_URL
  description: "URL d'API compatible OpenAI. Pour une app modèle Olares, utilisez son hôte d'entrée, p. ex. https://<id>.<olares-id>.olares.com (sans port). Accepte aussi un /v1 final ou https://api.openai.com/v1. Un /v1/ final est ajouté s'il manque. Laissez vide pour masquer cet endpoint."
- envName: ENDPOINT_MODELS
  description: Identifiants de modèles séparés par des virgules. Laissez vide pour les récupérer via GET /v1/models.
- envName: ENDPOINT_API_KEY
  description: Clé API pour cet endpoint. Laissez vide si le serveur n'en exige pas.

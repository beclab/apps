apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-nginx-proxy
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: librechat
    component: nginx-proxy
spec:
  replicas: {{ (index .Values.workloads "librechat-nginx-proxy").replicaCount }}
  selector:
    matchLabels:
      app: librechat
      component: nginx-proxy
  template:
    metadata:
      labels:
        app: librechat
        component: nginx-proxy
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
      - name: wait-for-api
        image: "docker.io/beclab/wait-for:0.1.0"
        args:
          - '-it'
          - 'librechat:3080'
        imagePullPolicy: IfNotPresent
      volumes:
        - name: nginx-config
          configMap:
            name: librechat-nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 104Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: librechat-nginx-proxy
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: librechat
    component: nginx-proxy
spec:
  type: ClusterIP
  selector:
    app: librechat
    component: nginx-proxy
  ports:
    - name: http
      protocol: TCP
      port: 3080
      targetPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-meilisearch
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: librechat
    component: meilisearch
spec:
  replicas: {{ (index .Values.workloads "librechat-meilisearch").replicaCount }}
  selector:
    matchLabels:
      app: librechat
      component: meilisearch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: librechat
        component: meilisearch
    spec:
      containers:
      - name: meilisearch
        image: docker.io/getmeili/meilisearch:v1.53.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7700
          name: meilisearch
        env:
        - name: MEILI_NO_ANALYTICS
          value: "true"
        # v1.53 refuses a v1.29 data.ms without this; keep the original hostPath.
        - name: MEILI_UPGRADE_DB
          value: "true"
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: librechat-meilisearch-secret
              key: master-key
        volumeMounts:
        - name: meilisearch-data
          mountPath: /meili_data
        startupProbe:
          httpGet:
            path: /health
            port: 7700
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /health
            port: 7700
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7700
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: meilisearch-data
        hostPath:
          path: '{{ .Values.userspace.appData }}/meilisearch'
          type: DirectoryOrCreate
      restartPolicy: Always


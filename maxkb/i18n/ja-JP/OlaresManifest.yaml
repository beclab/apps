metadata:
  title: MaxKB
  description: すぐに使える柔軟な RAG チャットボット
spec:
  fullDescription: |
    **デフォルトの管理者認証情報:**
    username: `admin`
    password: `MaxKB@123..`
    
    **概要**
    MaxKB = Max Knowledge Base。Large Language Models（LLM）と Retrieval-Augmented Generation（RAG）に基づくチャットボットです。インテリジェントカスタマーサービス、社内ナレッジベース、学術研究、教育などのシナリオで広く利用されています。
    
    **すぐに使える**
    ドキュメントの直接アップロード／オンラインドキュメントの自動クロールに対応し、自動テキスト分割、ベクトル化、RAG を備えます。大規模モデルの幻覚を効果的に抑え、優れたスマート Q&A 体験を提供します。
    
    **柔軟なオーケストレーション**
    強力なワークフローエンジンと関数ライブラリを備え、複雑な業務シナリオ向けに AI プロセスをオーケストレーションできます。
    
    **シームレスな統合**
    コーディング不要でサードパーティ業務システムへ迅速に統合し、既存システムにスマート Q&A 能力を素早く付与できます。
    
    **モデル非依存**
    DeepSeek、Llama、Qwen などのプライベートモデルや、OpenAI、Claude、Gemini などの公開モデルを含む各種大規模モデルに対応。
  upgradeDescription: |
    v2.10.6-lts へアップグレード

    破壊的変更:
    - テンセント混元と旧テンセントクラウドプロバイダーは新しい「Tencent Cloud」（TokenHub）に統合されます。既存の混元 / 旧テンセントクラウドモデルはアップグレード後に使えなくなるため、モデルプロバイダー画面で再設定してください。

    主な内容:
    - セキュリティ: チャットファイル帰属の偽装、クロステナント文書移行、XLSX 画像展開 DoS、IDOR、サンドボックス回避（CVE-2026-79919）、ハードコードされた Django SECRET_KEY など
    - ワークフローのデフォルトモデル設定
    - Knowledge Base / Agent のリストセレクターで検索可能
    - CSV/Excel インポート、全文検索、チャットログ、エージェントノードなどの不具合修正

    詳細: https://github.com/1Panel-dev/MaxKB/releases/tag/v2.10.6-lts

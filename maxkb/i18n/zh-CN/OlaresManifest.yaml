metadata:
  description: '基于大模型和 RAG 的知识库问答系统'
  title: MaxKB
spec:
  fullDescription: |
    **默认账户密码**
    用户名： `admin`
    密码： `MaxKB@123..`

    **应用概览**
    MaxKB = Max Knowledge Base，是一款基于大语言模型和 RAG 的开源知识库问答系统，广泛应用于智能客服、企业内部知识库、学术研究与教育等场景。

    **开箱即用**
    支持直接上传文档 / 自动爬取在线文档，支持文本自动拆分、向量化和 RAG（检索增强生成），有效减少大模型幻觉，智能问答交互体验好。

    **灵活编排**
    内置强大的工作流引擎和函数库，支持编排 AI 工作过程，满足复杂业务场景下的需求。

    **无缝嵌入**
    支持零编码快速嵌入到网站、办公系统（企业微信 / 钉钉 / 飞书）和第三方业务系统，让已有系统快速拥有智能问答能力，提高用户满意度。

    **模型中立**
    支持对接各种大语言模型，包括本地私有大模型（DeepSeek / Llama / Qwen 等）、国内公共大模型（通义千问 / 腾讯混元 / 字节豆包 / 百度千帆 / 智谱 AI / Kimi 等）和国外公共大模型（OpenAI / Claude / Gemini 等）。

  upgradeDescription: |
    升级到 v2.10.6-lts

    数据迁移：
    - 升级时会把旧版 Olares 挂载（appData/pg）中的 PostgreSQL 目录拷到官方 v2 路径（/opt/maxkb/data/postgresql/pgdata）：仅当旧库是唯一副本，或体积大于新路径上残留的库时。不会再把 appData/pg 挂到 /var/lib/postgresql/data，因为官方镜像把该路径下的 PG_VERSION 视为不支持的 v1 布局并退出。

    破坏性变更：
    - 腾讯混元与旧版腾讯云供应商已合并为新的「腾讯云」（TokenHub）供应商。升级后原混元 / 旧腾讯云模型将不可用，请到「模型供应商」页面按 TokenHub 要求重新配置。

    主要更新：
    - 安全：修复对话文件上传归属伪造、跨租户文档迁移、XLSX 内嵌图解压导致的内存耗尽、问题关联 IDOR、匿名应用配置过度序列化、密码重置验证码可爆破、函数库沙箱绕过（CVE-2026-79919）、访客会话完整性以及硬编码 Django SECRET_KEY 等问题
    - 工作流默认模型设置（智能体 / 知识库 / 工具工作流）
    - 知识库与智能体相关列表选择器支持搜索
    - 修复 CSV/Excel 导入、全文检索、对话日志、工作流文件预览、MiniMax H3 及若干智能体节点问题

    完整升级详情：https://github.com/1Panel-dev/MaxKB/releases/tag/v2.10.6-lts

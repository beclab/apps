metadata:
  title: Navidrome
  description: Tu servicio de streaming personal
spec:
  fullDescription: |
    Navidrome es un servidor y streamer de colección musical web de código abierto. Te da libertad para escuchar tu colección desde cualquier navegador o dispositivo móvil.
    ¡Es como tu Spotify personal!

    **Funciones**
    - Gestiona colecciones musicales muy grandes
    - Transmite prácticamente cualquier formato de audio disponible
    - Lee y usa todos tus metadatos cuidadosamente curados
    - Gran compatibilidad con recopilaciones (Various Artists) y box sets (álbumes multidisco)
    - Multiusuario: cada usuario tiene sus propios recuentos de reproducción, listas, favoritos, etc.
    - Uso de recursos muy bajo
    - Multiplataforma: macOS, Linux y Windows. También hay imágenes Docker
    - Binarios listos para usar en las principales plataformas, incluido Raspberry Pi
    - Supervisa automáticamente tu biblioteca en busca de cambios, importa archivos nuevos y recarga metadatos
    - Interfaz web tematizable, moderna y adaptable basada en Material UI
    - Compatible con todos los clientes Subsonic/Madsonic/Airsonic
    - Transcodificación al vuelo. Configurable por usuario/reproductor. Compatible con codificación Opus
    - Traducido a varios idiomas
  upgradeDescription: |
    Actualiza Navidrome de 0.59.0 a 0.64.2 con correcciones de seguridad y escaneo. Haga una copia de la base de datos: los ID internos se migran y los clientes pueden necesitar sincronizarse de nuevo. Se ha eliminado la integración con Spotify. Se conservan las rutas de música y datos.

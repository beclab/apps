metadata:
  description: 您的个人音乐流服务
  title: Navidrome
spec:
  fullDescription: |
    Navidrome 是一个开源的网页音乐服务器。您可以随时随地通过浏览器或手机听自己的音乐。
    就像使用 Spotify 一样！

    **功能亮点**
    - 轻松应对超大音乐库
    - 几乎支持所有音频格式
    - 完美展示您精心整理的音乐信息
    - 非常适合收藏合辑和多碟专辑
    - 支持多用户，每位用户都有自己的播放记录、播放列表和喜好
    - 极低的资源消耗
    - 支持 macOS、Linux 和 Windows 多平台运行。提供 Docker 镜像
    - 为包括树莓派在内的所有主流平台提供现成的可用程序
    - 自动监控图书馆更新，导入新文件，更新元数据
    - 基于 Material UI 的现代响应式网页界面，可自定义主题
    - 兼容所有 Subsonic 系列客户端
    - 支持实时音频转码。可按用户或设备自定义设置。支持 Opus 编码
    - 已支持多种语言版本

  upgradeDescription: |
    将 Navidrome 从 0.59.0 升级至 0.64.2，包含上游安全及扫描修复。升级前请备份数据库：内部 ID 将迁移，客户端可能需要重新同步。Spotify 集成已移除。保留现有音乐和数据路径。

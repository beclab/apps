metadata:
  title: Navidrome
  description: あなた専用のストリーミングサービス
spec:
  fullDescription: |
    Navidrome はオープンソースの Web ベース音楽コレクションサーバー／ストリーマーです。任意のブラウザやモバイル端末から音楽コレクションを聴けます。
    個人用の Spotify のような存在です！

    **機能**
    - 非常に大きな音楽コレクションに対応
    - 利用可能なほぼすべての音声フォーマットをストリーム
    - 丁寧に整備したメタデータをすべて読み取り活用
    - コンピレーション（Various Artists）やボックスセット（複数ディスク）の優れたサポート
    - マルチユーザー：各ユーザーが独自の再生回数、プレイリスト、お気に入りなどを持てます
    - 非常に低いリソース使用量
    - マルチプラットフォーム：macOS、Linux、Windows。Docker イメージも提供
    - Raspberry Pi を含む主要プラットフォーム向けのすぐ使えるバイナリ
    - ライブラリの変更を自動監視し、新規ファイルのインポートとメタデータの再読み込み
    - Material UI ベースのテーマ対応・モダン・レスポンシブな Web インターフェース
    - すべての Subsonic/Madsonic/Airsonic クライアントと互換
    - オンザフライ・トランスコード。ユーザー／プレイヤーごとに設定可能。Opus エンコード対応
    - 多言語翻訳済み
  upgradeDescription: |
    Navidrome を 0.59.0 から 0.64.2 に更新し、セキュリティとスキャンの修正を含みます。更新前にデータベースをバックアップしてください。内部 ID が移行され、クライアントの再同期が必要になる場合があります。Spotify 連携は削除されました。音楽とデータのパスは維持されます。

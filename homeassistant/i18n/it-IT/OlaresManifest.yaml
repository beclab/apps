metadata:
  title: Home Assistant
  description: Sveglia la tua casa
spec:
  fullDescription: |
    Home Assistant offre automazione domestica open source che mette al primo posto il controllo locale e la privacy. Alimentato da una community mondiale di tinkerer e appassionati DIY. Perfetto da eseguire su un server locale.

    Funzionalità
    **Funziona con oltre 1000 marchi**
    Home Assistant si integra con oltre mille dispositivi e servizi. All'avvio, scansiona automaticamente la rete alla ricerca di dispositivi noti e ti permette di configurarli facilmente.

    **Automazioni potenti**
    Una volta integrati tutti i dispositivi di casa, puoi sfruttare il motore di automazione avanzato di Home Assistant per far lavorare la casa per te.

    **Estendi il sistema con add-on**
    Home Assistant non è limitato solo a Home Assistant. Installa facilmente altre applicazioni che ti aiutano a gestire la casa.

    **Tutti i dati della smart home restano in locale**
    Home Assistant comunica con i dispositivi in locale e ricorre al cloud solo se non c'è altra opzione. Nessun dato è memorizzato nel cloud; tutto è elaborato in locale.

    **App mobili companion**
    Usa le app ufficiali Home Assistant, un comodo companion per controllare rapidamente i dispositivi e ricevere notifiche quando qualcosa accade a casa, anche al polso con Apple Watch.

    Le app possono anche inviare la tua posizione a casa per usare la rilevazione di presenza nelle automazioni. I dati vanno direttamente a casa tua, senza accesso di terze parti.

    **Gestione energetica domestica**
    Home Assistant ti aiuta a tenere sotto controllo i consumi con la funzione di home energy management. Ottieni nuove insight, ottimizza la produzione solare, pianifica l'uso e risparmia.
  upgradeDescription: |
    v1.0.36: Aggiornare Home Assistant Core a 2026.9.1. Modbus consente di
    scegliere il dispositivo invece di scrivere i registri a mano; la dashboard
    Security aggiunge avvisi e preferiti; History e Activity condividono un
    riquadro Sources; Matter ottiene una mappa di rete. La patch 2026.9.1
    corregge anche gli allegati SMTP e lo streaming dei backup.

    v1.0.34: Aggiornare l'immagine Home Assistant Core a 2026.8.3. Impostare
    `authLevel` dell'entrance desktop a `internal` così le app in-cluster
    possono raggiungere Home Assistant senza la pagina di
    login SSO di Olares.

    v1.0.29: Aggiornare l'immagine Home Assistant Core a 2026.7.4.

    v1.0.26: Correggere CrashLoop da `.HA_VERSION` vuoto.

    v1.0.25: Vincolare i pod al control-plane (master) via nodeAffinity (minimo Olares 1.12.6).

    Aggiornare la versione app a 2026.8.3

    Questa release aggiorna Home Assistant alla serie 2026.8 («Approachable
    by design»):

    - Meno gergo nell'UI: «Developer Tools» diventa «Tools»; etichette come
      «advanced» / «expert» sono sostituite da ciò che la funzione fa davvero.
    - Le impostazioni del web server (porta, interfaccia di ascolto, proxy fidati) passano
      nell'UI, con conferma-o-ripristino in 5 minuti così una modifica errata non ti
      esclude. Le installazioni esistenti mantengono la porta attuale.
    - Gli Entity ID si possono rinominare più semplicemente; la pagina Home Assistant Cloud
      e la gestione dispositivi sono ripulite.
    - Patch 2026.8.3: artwork album Sonos e pulsante play; fix crash per
      Shelly, Vizio ed Enphase; bump dipendenze per Reolink, Volvo,
      webOS e Google Health.

    Note di rilascio complete:
    https://www.home-assistant.io/blog/2026/08/05/release-20268/

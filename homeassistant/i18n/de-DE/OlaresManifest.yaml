metadata:
  title: Home Assistant
  description: Erwecken Sie Ihr Zuhause
spec:
  fullDescription: |
    Home Assistant bietet Open-Source-Hausautomation, die lokale Kontrolle und Privatsphäre an erste Stelle stellt. Angetrieben von einer weltweiten Community von Tinkerern und DIY-Enthusiasten. Ideal für einen lokalen Server.

    Funktionen
    **Funktioniert mit über 1000 Marken**
    Home Assistant integriert sich mit über tausend Geräten und Diensten. Nach dem Start scannt Home Assistant automatisch Ihr Netzwerk nach bekannten Geräten und lässt Sie diese einfach einrichten.

    **Leistungsstarke Automatisierungen**
    Sobald alle Geräte zu Hause integriert sind, können Sie die erweiterte Automatisierungs-Engine von Home Assistant nutzen, damit Ihr Zuhause für Sie arbeitet.

    **System mit Add-ons erweitern**
    Home Assistant ist nicht nur auf Home Assistant beschränkt. Installieren Sie einfach weitere Anwendungen, die Ihnen helfen, Ihr Zuhause zu verwalten.

    **Alle Smart-Home-Daten bleiben lokal**
    Home Assistant kommuniziert lokal mit Ihren Geräten und greift nur auf die Cloud zurück, wenn es keine andere Option gibt. Keine Daten werden in der Cloud gespeichert; alles wird lokal verarbeitet.

    **Begleitende Mobile Apps**
    Nutzen Sie die offiziellen Home-Assistant-Apps — praktische Begleiter, um Geräte schnell zu steuern und benachrichtigt zu werden, wenn zu Hause etwas passiert, auch am Handgelenk mit der Apple Watch.

    Die Apps können auch Ihren Standort nach Hause senden, um Präsenz-Erkennung in Automatisierungen zu nutzen. Daten gehen direkt zu Ihrem Zuhause, ohne Zugriff Dritter.

    **Heim-Energieverwaltung**
    Home Assistant hilft Ihnen, den Energieverbrauch mit der Home-Energy-Management-Funktion im Griff zu behalten. Neue Einblicke gewinnen, Solarproduktion optimieren, Energieverbrauch planen und Geld sparen.
  upgradeDescription: |
    v1.0.36: Home Assistant Core auf 2026.9.1 aktualisieren. Modbus kann
    Geräte per Auswahl statt per Registereintrag einrichten; das Security-
    Dashboard erhält Warnungen und Favoriten; History und Activity teilen
    eine Quellenleiste; Matter bekommt eine Netzwerkkarte. Der Patch 2026.9.1
    behebt außerdem SMTP-Bildanhänge und Backup-Streaming.

    v1.0.34: Home Assistant Core-Image auf 2026.8.3 aktualisieren. Desktop-Entrance-
    `authLevel` auf `internal` setzen, damit In-Cluster-Apps
    Home Assistant ohne die Olares-SSO-Anmeldeseite
    erreichen können.

    v1.0.29: Home Assistant Core-Image auf 2026.7.4 aktualisieren.

    v1.0.26: CrashLoop durch leeres `.HA_VERSION` beheben.

    v1.0.25: Pods per nodeAffinity an die Control-Plane (Master) binden (Olares-Minimum 1.12.6).

    App-Version auf 2026.8.3 aktualisieren

    Dieses Release aktualisiert Home Assistant auf die Serie 2026.8 („Approachable
    by design“):

    - Weniger Fachjargon in der UI: „Developer Tools“ heißt jetzt „Tools“; Labels wie
      „advanced“ / „expert“ werden durch das ersetzt, was die Funktion tatsächlich tut.
    - Webserver-Einstellungen (Port, Listen-Interface, Trusted Proxies) wandern in
      die UI, mit 5-Minuten-Bestätigen-oder-Zurücksetzen, damit eine schlechte Änderung
      Sie nicht aussperrt. Bestehende Installationen behalten ihren aktuellen Port.
    - Entity-IDs lassen sich einfacher umbenennen; die Home-Assistant-Cloud-Seite
      und die Gerätebehandlung werden aufgeräumt.
    - Patch 2026.8.3: Sonos-Albumcover und Play-Taste; Crash-Fixes für
      Shelly, Vizio und Enphase; Abhängigkeits-Updates für Reolink, Volvo,
      webOS und Google Health.

    Vollständige Release Notes:
    https://www.home-assistant.io/blog/2026/08/05/release-20268/

metadata:
  title: Home Assistant
  description: Despierta tu hogar
spec:
  fullDescription: |
    Home Assistant ofrece automatización del hogar de código abierto que prioriza el control local y la privacidad. Impulsado por una comunidad mundial de aficionados y entusiastas DIY. Ideal para ejecutarse en un servidor local.

    Características
    **Funciona con más de 1000 marcas**
    Home Assistant se integra con más de mil dispositivos y servicios. Al iniciarse, escaneará automáticamente su red en busca de dispositivos conocidos y le permitirá configurarlos fácilmente.

    **Automatizaciones potentes**
    Una vez integrados todos los dispositivos del hogar, puede aprovechar el motor de automatización avanzado de Home Assistant para que su casa trabaje para usted.

    **Amplíe el sistema con complementos**
    Home Assistant no se limita solo a Home Assistant. Instale fácilmente otras aplicaciones que le ayuden a gestionar su hogar.

    **Todos los datos del hogar inteligente se quedan en local**
    Home Assistant se comunica con sus dispositivos en local y solo recurre a la nube si no hay otra opción. No se almacenan datos en la nube; todo se procesa en local.

    **Apps móviles complementarias**
    Use las apps oficiales de Home Assistant, un práctico acompañante para controlar dispositivos rápidamente y recibir avisos cuando algo ocurre en casa, incluso en la muñeca con Apple Watch.

    Las apps también pueden enviar su ubicación a casa para usar detección de presencia en automatizaciones. Los datos van directamente a su hogar, sin acceso de terceros.

    **Gestión energética del hogar**
    Home Assistant le ayuda a controlar el consumo energético con su función de gestión energética. Obtenga información nueva, optimice la producción solar, planifique el uso y ahorre dinero.
  upgradeDescription: |
    v1.0.36: Actualizar Home Assistant Core a 2026.9.1. Modbus permite elegir
    el dispositivo en lugar de escribir registros a mano; el panel de seguridad
    añade alertas y favoritos; History y Activity comparten un panel de fuentes;
    Matter gana un mapa de red. El parche 2026.9.1 también corrige adjuntos
    SMTP e hilos de copia de seguridad.

    v1.0.34: Actualizar la imagen de Home Assistant Core a 2026.8.3. Establecer el
    `authLevel` de la entrada de escritorio en `internal` para que las apps del
    clúster puedan alcanzar Home Assistant sin la página de
    inicio de sesión SSO de Olares.

    v1.0.29: Actualizar la imagen de Home Assistant Core a 2026.7.4.

    v1.0.26: Corregir CrashLoop por `.HA_VERSION` vacío.

    v1.0.25: Anclar pods al control-plane (master) vía nodeAffinity (mínimo Olares 1.12.6).

    Actualizar la versión de la app a 2026.8.3

    Esta versión actualiza Home Assistant a la serie 2026.8 («Approachable
    by design»):

    - Menos jerga en la UI: «Developer Tools» pasa a «Tools»; etiquetas como
      «advanced» / «expert» se sustituyen por lo que la función realmente hace.
    - Los ajustes del servidor web (puerto, interfaz de escucha, proxies de confianza) pasan a
      la UI, con confirmación o revertir en 5 minutos para que un mal cambio no le
      bloquee. Las instalaciones existentes conservan su puerto actual.
    - Los ID de entidad se pueden renombrar de forma más sencilla; se limpia la página
      de Home Assistant Cloud y el manejo de dispositivos.
    - Parche 2026.8.3: portada de álbum y botón de reproducción de Sonos; correcciones de fallos para
      Shelly, Vizio y Enphase; actualizaciones de dependencias para Reolink, Volvo,
      webOS y Google Health.

    Notas de la versión completas:
    https://www.home-assistant.io/blog/2026/08/05/release-20268/

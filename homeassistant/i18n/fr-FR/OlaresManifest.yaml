metadata:
  title: Home Assistant
  description: Réveillez votre maison
spec:
  fullDescription: |
    Home Assistant propose une domotique open source qui privilégie le contrôle local et la confidentialité. Porté par une communauté mondiale de bricoleurs et d'enthousiastes DIY. Parfait à exécuter sur un serveur local.

    Fonctionnalités
    **Compatible avec plus de 1000 marques**
    Home Assistant s'intègre à plus d'un millier d'appareils et services. Une fois démarré, il scanne automatiquement votre réseau à la recherche d'appareils connus et vous permet de les configurer facilement.

    **Automatisations puissantes**
    Une fois tous vos appareils intégrés, vous pouvez déployer le moteur d'automatisation avancé de Home Assistant pour que votre maison travaille pour vous.

    **Étendez le système avec des add-ons**
    Home Assistant ne se limite pas à Home Assistant. Installez facilement d'autres applications qui vous aident à gérer votre maison.

    **Toutes les données de la maison connectée restent locales**
    Home Assistant communique localement avec vos appareils et ne bascule vers le cloud que s'il n'y a pas d'autre option. Aucune donnée n'est stockée dans le cloud ; tout est traité localement.

    **Applications mobiles compagnons**
    Utilisez les apps officielles Home Assistant, un compagnon pratique pour contrôler rapidement vos appareils et être notifié lorsque quelque chose se passe chez vous, même au poignet avec l'Apple Watch.

    Les apps peuvent aussi envoyer votre position à la maison pour utiliser la détection de présence dans vos automatisations. Les données vont directement chez vous, sans accès tiers.

    **Gestion de l'énergie domestique**
    Home Assistant vous aide à maîtriser votre consommation grâce à la gestion de l'énergie domestique. Obtenez de nouveaux insights, optimisez la production solaire, planifiez l'usage et économisez.
  upgradeDescription: |
    v1.0.36 : Mettre à niveau Home Assistant Core vers 2026.9.1. Modbus permet
    de choisir un appareil au lieu d'écrire les registres à la main ; le tableau
    de sécurité ajoute alertes et favoris ; History et Activity partagent un
    panneau Sources ; Matter gagne une carte réseau. Le correctif 2026.9.1
    corrige aussi les pièces jointes SMTP et le streaming des sauvegardes.

    v1.0.34 : Mettre à niveau l'image Home Assistant Core vers 2026.8.3. Définir
    `authLevel` de l'entrée bureau à `internal` pour que les apps in-cluster
    puissent atteindre Home Assistant sans la page de
    connexion SSO Olares.

    v1.0.29 : Mettre à niveau l'image Home Assistant Core vers 2026.7.4.

    v1.0.26 : Corriger le CrashLoop dû à un `.HA_VERSION` vide.

    v1.0.25 : Épingler les pods au control-plane (master) via nodeAffinity (minimum Olares 1.12.6).

    Mettre à niveau la version de l'app vers 2026.8.3

    Cette version met à niveau Home Assistant vers la série 2026.8 (« Approachable
    by design ») :

    - Moins de jargon dans l'UI : « Developer Tools » devient « Tools » ; les libellés comme
      « advanced » / « expert » sont remplacés par ce que la fonction fait réellement.
    - Les paramètres du serveur web (port, interface d'écoute, proxies de confiance) passent
      dans l'UI, avec confirmation ou annulation en 5 minutes pour qu'un mauvais changement
      ne vous verrouille pas. Les installations existantes conservent leur port actuel.
    - Les ID d'entité se renomment plus simplement ; la page Home Assistant Cloud
      et la gestion des appareils sont nettoyées.
    - Correctif 2026.8.3 : pochette d'album et bouton lecture Sonos ; correctifs de plantage pour
      Shelly, Vizio et Enphase ; mises à jour de dépendances pour Reolink, Volvo,
      webOS et Google Health.

    Notes de version complètes :
    https://www.home-assistant.io/blog/2026/08/05/release-20268/

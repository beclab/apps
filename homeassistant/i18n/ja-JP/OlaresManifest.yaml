metadata:
  title: Home Assistant
  description: あなたの家を目覚めさせよう
spec:
  fullDescription: |
    Home Assistant は、ローカル制御とプライバシーを最優先するオープンソースのホームオートメーションを提供します。世界中の tinkerer と DIY 愛好家のコミュニティに支えられ、ローカルサーバーでの運用に最適です。

    機能
    **1000 を超えるブランドに対応**
    Home Assistant は 1000 以上のデバイスとサービスと連携します。起動後、ネットワーク上の既知デバイスを自動スキャンし、簡単にセットアップできます。

    **強力なオートメーション**
    自宅のデバイスをすべて統合したら、Home Assistant の高度なオートメーションエンジンで家をあなたのために働かせられます。

    **アドオンでシステムを拡張**
    Home Assistant は Home Assistant だけに限りません。家の管理に役立つ他のアプリケーションも簡単にインストールできます。

    **スマートホームデータはすべてローカル**
    Home Assistant はデバイスとローカルで通信し、他に手段がない場合のみクラウドからデータを取得します。クラウドにデータは保存されず、すべてローカルで処理されます。

    **コンパニオンモバイルアプリ**
    公式 Home Assistant アプリでデバイスをすばやく操作し、自宅で何かが起きたときに通知を受け取れます。Apple Watch でも利用可能です。

    アプリは位置情報を自宅へ送り、プレゼンス検知をオートメーションに使うこともできます。データは自宅へ直接送られ、第三者はアクセスしません。

    **ホームエネルギー管理**
    ホームエネルギー管理機能でエネルギー使用を把握。新たな洞察を得て、太陽光の発電を最適化し、使用を計画して節約できます。
  upgradeDescription: |
    v1.0.36: Home Assistant Core を 2026.9.1 にアップグレード。Modbus はレジスタを
    手書きせずデバイス選択で設定でき、セキュリティダッシュボードにアラートとお気に入りを追加、
    History と Activity が Sources パネルを共有、Matter にネットワークマップを追加。
    2026.9.1 パッチでは SMTP 画像添付とバックアップストリーミングも修正。

    v1.0.34: Home Assistant Core イメージを 2026.8.3 にアップグレード。デスクトップエントランスの
    `authLevel` を `internal` に設定し、クラスター内アプリが
    Olares SSO ログインページなしで Home Assistant に
    到達できるようにします。

    v1.0.29: Home Assistant Core イメージを 2026.7.4 にアップグレード。

    v1.0.26: 空の `.HA_VERSION` による CrashLoop を修正。

    v1.0.25: nodeAffinity でポッドを control-plane（master）にピン留め（Olares 最低 1.12.6）。

    アプリバージョンを 2026.8.3 にアップグレード

    本リリースは Home Assistant を 2026.8 シリーズ（「Approachable
    by design」）へアップグレードします:

    - UI の専門用語を削減: 「Developer Tools」は「Tools」に; 「advanced」/「expert」
      などのラベルは機能の実際の内容に置き換え。
    - Web サーバー設定（ポート、リッスンインターフェース、信頼プロキシ）が UI に移動。
      5 分の確認または元に戻すにより、誤設定で締め出されることを防止。既存インストールは現行ポートを維持。
    - エンティティ ID のリネームがより簡単に; Home Assistant Cloud ページと
      デバイス処理を整理。
    - 2026.8.3 パッチ: Sonos アルバムアートと再生ボタン; Shelly、Vizio、Enphase の
      クラッシュ修正; Reolink、Volvo、webOS、Google Health の依存関係更新。

    リリースノート全文:
    https://www.home-assistant.io/blog/2026/08/05/release-20268/

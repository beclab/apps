metadata:
  description: 唤醒您的家
  title: Home Assistant
spec:
  fullDescription: |
    Home Assistant 提供开源家居自动化，重视本地控制与隐私。由全球DIY爱好者和技术达人共同推动。非常适合在本地服务器上运行。

    功能介绍
    **兼容超1000个品牌**
    Home Assistant 能与逾千种设备和服务互联互通。启动后，Home Assistant 会自动在网络中查找并便捷配置识别到的设备。

    **强大的自动化**
    整合家中所有设备后，可利用 Home Assistant 强大的自动化引擎，让家居生活更智能。

    **系统可扩展**
    Home Assistant 的功能不止于此。安装其他应用，助您更好地管理家居。

    **数据保持本地**
    Home Assistant 的设备通讯本地完成，必要时才从云端获取数据。数据不存云端，全部本地处理。

    **移动应用**
    通过官方 Home Assistant 应用，您可以快速控制家中设备，及时接收家里的即时消息，甚至在 Apple Watch 上操作。
    应用还能用于家庭位置监控，加强自动化功能。数据直连家中，无第三方访问。

    **能源管理**
    通过 Home Assistant 的家庭能源管理功能，优化能源使用。洞察能源消耗，优化太阳能板性能，规划用电，节约开支。

  upgradeDescription: |
    v1.0.34: 升级 Home Assistant Core 镜像至 2026.8.3。将桌面入口
    `authLevel` 设为 `internal`，以便集群内应用访问
    Home Assistant 时不再经过 Olares SSO 登录页。

    v1.0.29: 升级 Home Assistant Core 镜像至 2026.7.4。

    v1.0.26: 修复空 `.HA_VERSION` 导致的 CrashLoop。

    v1.0.25: 通过 nodeAffinity 固定到 control-plane（master）（Olares 最低版本现为 1.12.6）。

    升级应用版本至 2026.8.3

    本次升级到 Home Assistant 2026.8 系列（「Approachable by design」）：

    - 界面减少术语：「Developer Tools」改名为「Tools」；「advanced」/
      「expert」一类标签改为直接描述功能。
    - Web 服务器设置（端口、监听网卡、可信代理）可在界面中修改，
      5 分钟内未确认会自动回滚，避免改错后锁死。已有安装保持原端口。
    - 实体 ID 重命名更简单；Home Assistant Cloud 页面与设备管理更清晰。
    - 2026.8.3 补丁：Sonos 专辑封面与播放按钮；修复 Shelly、Vizio、
      Enphase 崩溃；更新 Reolink、Volvo、webOS、Google Health 依赖。

    查看完整更新说明：
    https://www.home-assistant.io/blog/2026/08/05/release-20268/

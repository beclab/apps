metadata:
  title: Gemma4 31B IT UD-XL (Ollama)
  description: Gemma4 31B IT dense (Unsloth Dynamic UD-Q4_K_XL) inferencia multimodal local
spec:
  upgradeDescription: |
    Actualizar el runtime de Ollama a ollama/ollama:0.30.10.
    Actualizar el proxy de la API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.
    El tráfico de usuarios pasa por el proxy hacia Ollama.

    **MODELO**
    Usa la cuantización Unsloth Dynamic de `unsloth/gemma-4-31B-it-GGUF` (`gemma-4-31B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Cuantización UD de precisión mixta con visión completa (mmproj) conservada.
    Usa la plantilla de chat incrustada en GGUF para tool calling fiable y entrada de imágenes. Thinking activado por defecto (OLLAMA_THINKING=""); los clientes pueden desactivarlo por solicitud.

    Gemma 4 31B IT es un modelo multimodal denso ajustado por instrucciones. Espere más memoria GPU que con 26B-A4B MoE.

    - Formato: GGUF + mmproj (texto + imagen)
    - Contexto: 32768

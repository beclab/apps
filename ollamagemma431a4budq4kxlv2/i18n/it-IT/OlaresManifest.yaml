metadata:
  title: Gemma4 31B IT UD-XL (Ollama)
  description: Gemma4 31B IT dense (Unsloth Dynamic UD-Q4_K_XL) inferenza multimodale locale
spec:
  upgradeDescription: |
    Aggiorna il runtime Ollama a ollama/ollama:0.30.10.
    Aggiorna il proxy API di Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url vision OpenAI).
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa attraverso il proxy verso Ollama.

    **MODELLO**
    Usa la quantizzazione Unsloth Dynamic da `unsloth/gemma-4-31B-it-GGUF` (`gemma-4-31B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Quantizzazione UD a precisione mista con visione completa (mmproj) mantenuta.
    Usa il template di chat incorporato in GGUF per tool calling affidabile e input immagini. Thinking abilitato di default (OLLAMA_THINKING=""); i client possono disabilitarlo per richiesta.

    Gemma 4 31B IT è un modello multimodale denso instruction-tuned. Aspettati più memoria GPU rispetto a 26B-A4B MoE.

    - Formato: GGUF + mmproj (testo + immagine)
    - Contesto: 32768

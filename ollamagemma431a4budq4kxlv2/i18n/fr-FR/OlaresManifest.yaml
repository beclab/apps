metadata:
  title: Gemma4 31B IT UD-XL (Ollama)
  description: Gemma4 31B IT dense (Unsloth Dynamic UD-Q4_K_XL) inférence multimodale locale
spec:
  upgradeDescription: |
    Mettre à niveau le runtime Ollama vers ollama/ollama:0.30.10.
    Mettre à niveau le proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODÈLE**
    Utilise la quantification Unsloth Dynamic de `unsloth/gemma-4-31B-it-GGUF` (`gemma-4-31B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Quantification UD en précision mixte avec vision complète (mmproj) conservée.
    Utilise le modèle de chat intégré au GGUF pour un tool calling fiable et l'entrée d'images. Thinking activé par défaut (OLLAMA_THINKING="") ; les clients peuvent le désactiver par requête.

    Gemma 4 31B IT est un modèle multimodal dense ajusté par instructions. Attendez-vous à une mémoire GPU plus élevée qu'avec 26B-A4B MoE.

    - Format : GGUF + mmproj (texte + image)
    - Contexte : 32768

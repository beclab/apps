metadata:
  title: Gemma4 31B IT UD-XL (Ollama)
  description: Gemma4 31B IT dense（Unsloth Dynamic UD-Q4_K_XL）マルチモーダルローカル推論
spec:
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 にアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 にアップグレード（OpenAI Vision image_url 転送）。
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。

    **モデル**
    `unsloth/gemma-4-31B-it-GGUF` の Unsloth Dynamic 量子化（`gemma-4-31B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`）を使用。
    フルビジョン（mmproj）を維持した混合精度 UD 量子化。
    GGUF 組み込みチャットテンプレートで信頼性の高いツール呼び出しと画像入力に対応。Thinking は既定で有効（OLLAMA_THINKING=""）。クライアントはリクエスト単位で無効化可能。

    Gemma 4 31B IT は dense の instruction-tuned マルチモーダルモデルです。26B-A4B MoE より高い GPU メモリを想定してください。

    - 形式: GGUF + mmproj（テキスト + 画像）
    - コンテキスト: 32768

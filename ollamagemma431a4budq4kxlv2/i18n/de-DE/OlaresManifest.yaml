metadata:
  title: Gemma4 31B IT UD-XL (Ollama)
  description: Gemma4 31B IT dense (Unsloth Dynamic UD-Q4_K_XL) multimodale lokale Inferenz
spec:
  upgradeDescription: |
    Ollama-Runtime auf ollama/ollama:0.30.10 aktualisieren.
    Olares-API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisieren (OpenAI Vision image_url-Weiterleitung).
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Nach der Installation durch den Olares Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    Der Benutzerverkehr geht über den Proxy zu Ollama.

    **MODELL**
    Verwendet Unsloth Dynamic Quant von `unsloth/gemma-4-31B-it-GGUF` (`gemma-4-31B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Gemischt-präzise UD-Quantisierung mit vollständig erhaltener Vision (mmproj).
    Nutzt die in GGUF eingebettete Chat-Vorlage für zuverlässiges Tool Calling und Bildeingabe. Thinking ist standardmäßig aktiviert (OLLAMA_THINKING=""); Clients können es pro Anfrage deaktivieren.

    Gemma 4 31B IT ist ein dichtes, instruction-tuned multimodales Modell. Erwarten Sie höheren GPU-Speicherbedarf als bei 26B-A4B MoE.

    - Format: GGUF + mmproj (Text + Bild)
    - Kontext: 32768

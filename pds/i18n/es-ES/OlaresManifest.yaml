metadata:
  description: Servidor de datos personales de Bluesky
  title: Bluesky PDS
spec:
  upgradeDescription: |
    Versión upstream: [Bluesky PDS 0.4.5027](https://github.com/bluesky-social/atproto/releases/tag/%40atproto/pds%400.5.27) (`@atproto/pds` 0.5.27)

    **Correcciones**

    - Las subidas de blobs ya no se detienen cuando la detección MIME termina antes que el resto del flujo de subida.

    Las cuentas nuevas siguen requiriendo un código de invitación.

  fullDescription: |
    Bluesky PDS (Personal Data Server) es un servidor autoalojado para la red social Bluesky. Te permite ejecutar tu propio Personal Data Server, dándote control total sobre tus datos e identidad en redes sociales.

    **Funciones**
    - Autoalojado: Ejecuta tu propio Personal Data Server para control completo de tus datos
    - Protocolo ATProto: Basado en ATProto (Authenticated Transfer Protocol) para redes sociales descentralizadas
    - Gestión de cuentas: Crea y gestiona cuentas de Bluesky en tu propio servidor
    - Control de datos: Control total sobre tus datos y contenido en redes sociales
    - Soporte WebSocket: Actualizaciones en tiempo real mediante conexiones WebSocket
    - Integración de correo: Verificación y notificaciones opcionales por correo mediante SMTP

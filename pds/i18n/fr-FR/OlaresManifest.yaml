metadata:
  description: Serveur de données personnelles Bluesky
  title: Bluesky PDS
spec:
  upgradeDescription: |
    Version amont : [Bluesky PDS 0.4.5027](https://github.com/bluesky-social/atproto/releases/tag/%40atproto/pds%400.5.27) (`@atproto/pds` 0.5.27)

    **Corrections**

    - Les envois de blobs ne se bloquent plus lorsque la détection MIME se termine avant le reste du flux d'upload.

    Les nouveaux comptes exigent toujours un code d'invitation.

  fullDescription: |
    Bluesky PDS (Personal Data Server) est un serveur auto-hébergé pour le réseau social Bluesky. Il vous permet d'exécuter votre propre Personal Data Server, vous donnant un contrôle total sur vos données et votre identité sur les réseaux sociaux.

    **Fonctionnalités**
    - Auto-hébergé : Exécutez votre propre Personal Data Server pour un contrôle total de vos données
    - Protocole ATProto : Basé sur ATProto (Authenticated Transfer Protocol) pour le réseautage social décentralisé
    - Gestion des comptes : Créez et gérez des comptes Bluesky sur votre propre serveur
    - Contrôle des données : Contrôle total sur vos données et contenus sociaux
    - Prise en charge WebSocket : Mises à jour en temps réel via des connexions WebSocket
    - Intégration e-mail : Vérification et notifications e-mail optionnelles via SMTP

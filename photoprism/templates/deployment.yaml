---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: photoprism
spec:
  replicas: {{ .Values.workloads.photoprism.replicaCount }}
  selector:
    matchLabels:
      app: photoprism
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: init-permissions
        image: docker.io/beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - '-c'
          - |
            set -e
            mkdir -p /photoprism/originals /photoprism/storage /photoprism/originals/Pictures /photoprism/import
            chown 1000:1000 /photoprism/originals /photoprism/storage /photoprism/originals/Pictures
        volumeMounts:
          - name: originals
            mountPath: /photoprism/originals
          - name: storage
            mountPath: /photoprism/storage
          - name: pictures
            mountPath: /photoprism/originals/Pictures
          - name: import
            mountPath: /photoprism/import
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        securityContext:
          runAsUser: 0
      containers:
      - name: photoprism
        image: photoprism/photoprism:260728
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2
            memory: 2Gi
        ports:
        - name: http
          containerPort: 2342
        env:
        - name: HOME
          value: /photoprism
        - name: PHOTOPRISM_DEBUG
          value: "true"
        - name: PHOTOPRISM_READONLY
          value: "false"
        - name: PHOTOPRISM_HTTP_HOST
          value: 0.0.0.0
        - name: PHOTOPRISM_HTTP_PORT
          value: "2342"
        - name: PHOTOPRISM_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: PHOTOPRISM_ADMIN_PASSWORD
        - name: PHOTOPRISM_ADMIN_USERNAME
          value: "{{ .Values.olaresEnv.PHOTOPRISM_ADMIN_USERNAME }}"
        - name: PHOTOPRISM_AUTH_MODE
          value: password
        - name: PHOTOPRISM_SITE_URL
          value: https://{{ index .Values.domain (printf "%s-svc" .Release.Name) }}
        volumeMounts:
        - mountPath: /photoprism/originals
          name: originals
        - mountPath: /photoprism/storage
          name: storage
        - mountPath: /photoprism/originals/Pictures
          name: pictures
        - mountPath: /photoprism/import
          name: import
        startupProbe:
          httpGet:
            path: /api/v1/status
            port: http
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: http
            scheme: HTTP
          timeoutSeconds: 5
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: http
            scheme: HTTP
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: originals
        hostPath:
          type: DirectoryOrCreate
          path: "{{ .Values.userspace.userData }}/PhotoPrism"
      - name: storage
        hostPath:
          type: DirectoryOrCreate
          path: "{{ .Values.userspace.appData }}/photoprism/storage"
      - name: pictures
        hostPath:
          type: DirectoryOrCreate
          path: "{{ .Values.userspace.userData }}/Pictures"
      - name: import
        hostPath:
          type: DirectoryOrCreate
          path: "{{ .Values.userspace.userData }}"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: 2342
      targetPort: 2342

metadata:
  title: PhotoPrism
  description: 分散型 Web 向けの AI 搭載フォトアプリ
spec:
  fullDescription: |
    PhotoPrism は分散型 Web 向けの AI 搭載フォトアプリです。最新技術を用いて、邪魔にならずに写真を自動でタグ付け・検索します。自宅、プライベートサーバー、クラウドで実行できます。

    **機能概要**

    私たちの使命は、写真を整理しアクセスしやすく保つ、最もユーザーフレンドリーでプライバシーに配慮したソリューションを提供することです。そのため PhotoPrism は、自由・プライバシー・機能性を損なうことなく、必要な場所で動くようゼロから構築されました：

    - RAW 変換、重複、動画フォーマットを気にせずすべての写真と動画を閲覧
    - 強力な検索フィルターで特定の写真を簡単に発見
    - 家族や友人の顔を認識
    - 内容と場所に基づく写真の自動分類
    - アルバムや検索結果でホバーして Live Photos を再生
    - UI は Progressive Web App のため、ネイティブアプリのような体験を提供し、主要 OS・モバイルのホーム画面に便利にインストール可能
    - お気に入りの旅行の思い出を呼び起こす高解像度ワールドマップを4つ収録
    - Exif、XMP、Google Photos などのソースからメタデータを抽出・統合
    - 色、クロマ、品質など多くの画像プロパティも検索可能
    - PhotoSync で iOS / Android を安全にバックグラウンドバックアップ
    - Microsoft Windows Explorer や Apple Finder などの WebDAV クライアントが PhotoPrism に直接接続でき、ローカルのようにファイルを開く・編集・削除可能。
  upgradeDescription: |
    上流リリース：[PhotoPrism 260728](https://github.com/photoprism/photoprism/releases/tag/260728-bbde8f452)

    **変更内容**

    - 360° の写真と動画をインタラクティブに閲覧でき、サムネイルと動画は最大 16K です。
    - 複数ページ PDF のインラインビューア。
    - XMP から GPS と顔領域を取り込みます。カメラとレンズのメタデータは CLI と API で編集できます。
    - 設定に Collections タブとアクセシビリティ欄が追加されます。

    **修正**

    - WebDAV アップロード状態、アルバムのダウンロード、フォルダ検索、Ollama または vision リクエストの処理。

    アップグレード後はライブラリの完全再スキャンを実行してください。このリリースでは 360° メディアへの手動の顔マークは未対応です。


metadata:
  title: PhotoPrism
  description: KI-gestützte Foto-App für das dezentrale Web
spec:
  fullDescription: |
    PhotoPrism ist eine KI-gestützte Foto-App für das dezentrale Web. Sie nutzt neueste Technologien, um Bilder automatisch zu taggen und zu finden, ohne Ihnen im Weg zu stehen. Sie können sie zu Hause, auf einem privaten Server oder in der Cloud betreiben.

    **Funktionsübersicht**

    Unsere Mission ist die benutzer- und datenschutzfreundlichste Lösung, um Ihre Bilder organisiert und zugänglich zu halten. Deshalb wurde PhotoPrism von Grund auf so gebaut, dass es dort läuft, wo Sie es brauchen — ohne Abstriche bei Freiheit, Privatsphäre oder Funktionalität:

    - Durchsuchen Sie all Ihre Fotos und Videos ohne Sorgen um RAW-Konvertierung, Duplikate oder Videoformate
    - Finden Sie bestimmte Bilder leicht mit leistungsstarken Suchfiltern
    - Erkennt die Gesichter Ihrer Familie und Freunde
    - Automatische Klassifizierung von Bildern nach Inhalt und Ort
    - Spielen Sie Live Photos ab, indem Sie in Alben und Suchergebnissen darüberfahren
    - Da die Benutzeroberfläche eine Progressive Web App ist, bietet sie ein natives App-Erlebnis und lässt sich bequem auf dem Homescreen aller großen Betriebssysteme und Mobilgeräte installieren
    - Enthält 4 hochauflösende Weltkarten, um Erinnerungen an Ihre Lieblingsreisen zurückzubringen
    - Metadaten werden aus Exif, XMP und anderen Quellen wie Google Photos extrahiert und zusammengeführt
    - Viele weitere Bildeigenschaften wie Farben, Chroma und Qualität sind ebenfalls suchbar
    - Nutzen Sie PhotoSync, um iOS- und Android-Telefone sicher im Hintergrund zu sichern
    - WebDAV-Clients wie Microsoft Windows Explorer und Apple Finder können sich direkt mit PhotoPrism verbinden, sodass Sie Dateien von Ihrem Computer wie lokal öffnen, bearbeiten und löschen können.
  upgradeDescription: |
    Upstream-Release: [PhotoPrism 260728](https://github.com/photoprism/photoprism/releases/tag/260728-bbde8f452)

    **Änderungen**

    - Interaktive Ansicht von 360°-Fotos und -Videos, mit Miniaturen und Video bis 16K.
    - Inline-Betrachter für mehrseitige PDFs.
    - Import von GPS und Gesichtsregionen aus XMP. Kamera- und Objektiv-Metadaten lassen sich über CLI und API bearbeiten.
    - Die Einstellungen enthalten einen Collections-Tab und einen Bereich Barrierefreiheit.

    **Fehlerbehebungen**

    - WebDAV-Upload-Status, Album-Downloads, Ordnersuche und Verarbeitung von Ollama- oder Vision-Anfragen.

    Nach dem Upgrade führen Sie einen vollständigen Bibliotheks-Rescan aus. Das manuelle Markieren von Gesichtern auf 360°-Medien wird in diesem Release nicht unterstützt.


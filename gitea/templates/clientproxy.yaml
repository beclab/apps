---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
{{ include "gitea.nginx.conf" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: giteaproxy
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: giteaweb
spec:
  replicas: {{ .Values.workloads.giteaproxy.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: giteaweb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: giteaweb
      annotations:
        checksum/nginx-config: {{ include "gitea.nginx.conf" . | sha256sum }}
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
                  [ $http_code -ge 200 ] && [ $http_code -lt 500 ]
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 240
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-web-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: giteaweb
  ports:
    - name: giteaweb
      protocol: TCP
      port: 8080
      targetPort: 8080

metadata:
  title: Gitea
  description: Git con una tazza di tè
spec:
  fullDescription: |
    Gitea è un servizio di sviluppo software all-in-one, self-hosted e senza complicazioni. Include hosting Git, code review, collaborazione di team, package registry e CI/CD. È simile a GitHub, Bitbucket e GitLab.

    **Funzionalità**
    Hosting del codice
    - Gitea supporta creazione e gestione di repository, esplorazione di cronologia commit e file, review e merge delle submission, gestione collaboratori, branch e altro. Supporta anche molte funzionalità Git comuni come tag, Cherry-pick, hook, strumenti di collaborazione integrati e altro.

    Leggero e veloce
    - Uno degli obiettivi di design di Gitea è essere leggero e rapido. A differenza di alcune grandi piattaforme di hosting del codice, resta snello, performante e adatto ad ambienti server con risorse limitate. Grazie al design leggero, il consumo di risorse è relativamente basso.

    Deployment e manutenzione semplici
    - Si può distribuire facilmente su vari server senza configurazioni o dipendenze complesse. È comodo per sviluppatori singoli o piccoli team che vogliono impostare e gestire i propri servizi Git.

    Sicurezza
    - Gitea pone forte enfasi sulla sicurezza, con gestione dei permessi utente, access control list e altro per proteggere codice e dati.

    Code Review
    - La code review supporta sia il flusso Pull Request sia il flusso AGit. I revisori possono sfogliare il codice online e lasciare commenti. Gli autori possono ricevere commenti e rispondere o modificare il codice online. Le review aiutano a migliorare la qualità del codice.

    CI/CD
    - Gitea Actions supporta CI/CD compatibile con GitHub Actions. Gli utenti possono scrivere workflow in YAML familiare e riutilizzare una varietà di plugin Actions esistenti. I plugin si possono scaricare da qualsiasi sito Git.

    Gestione progetti
    - Gitea traccia requisiti, funzionalità e bug tramite colonne e issue. Le issue supportano branch, tag, milestone, assegnazioni, time tracking, scadenze, dipendenze e altro.

    Repository di artefatti
    - Gitea supporta oltre 20 tipi di gestione pacchetti pubblici o privati, tra cui Cargo, Chef, Composer, Conan, Conda, Container, Helm, Maven, npm, NuGet, Pub, PyPI, RubyGems, Vagrant e altro.

    Supporto della community open source
    - Gitea è un progetto open source con licenza MIT. Ha una community attiva che sviluppa e migliora continuamente la piattaforma. Il progetto accoglie contributi della community per garantire aggiornamenti e innovazione.

    Supporto multilingue
    - Gitea offre interfacce in più lingue, rivolgendosi a utenti globali e promuovendo internazionalizzazione e localizzazione.

  upgradeDescription: |
    Aggiornare Gitea a 1.27.3 (`gitea/gitea:1.27.3`), il terzo patch di 1.27. Include un ampio lotto di fix di sicurezza su Gitea Actions, API, registro pacchetti, allegati, migrazione repository e controlli di visibilità/scope dei token.

    Include anche fix per Actions, pacchetti e UI (espressioni continue-on-error a livello di step, prerelease SemVer Swift, stato di merge delle PR, parametri di query della lista runner e altro). Dettagli: https://blog.gitea.com/release-of-1.27.3/

metadata:
  title: Gitea
  description: ¡Git con una taza de té
spec:
  fullDescription: |
    Gitea es un servicio de desarrollo de software integral, autoalojado y sin complicaciones. Incluye alojamiento Git, revisión de código, colaboración en equipo, registro de paquetes y CI/CD. Es similar a GitHub, Bitbucket y GitLab.

    **Características**
    Alojamiento de código
    - Gitea permite crear y gestionar repositorios, explorar el historial de commits y archivos, revisar y fusionar envíos, gestionar colaboradores, ramas y más. También admite muchas funciones Git habituales como tags, Cherry-pick, hooks, herramientas de colaboración integradas y más.

    Ligero y rápido
    - Uno de los objetivos de diseño de Gitea es ser ligero y rápido en respuesta. A diferencia de algunas grandes plataformas de alojamiento de código, permanece esbelto, rinde bien en velocidad y es adecuado para entornos de servidor con recursos limitados. Por su diseño ligero, el consumo de recursos es relativamente bajo.

    Despliegue y mantenimiento fáciles
    - Se puede desplegar fácilmente en varios servidores sin configuraciones ni dependencias complejas. Resulta cómodo para desarrolladores individuales o equipos pequeños crear y gestionar sus propios servicios Git.

    Seguridad
    - Gitea pone un fuerte énfasis en la seguridad, con gestión de permisos de usuario, listas de control de acceso y más para asegurar el código y los datos.

    Revisión de código
    - La revisión de código admite el flujo Pull Request y el flujo AGit. Los revisores pueden explorar el código en línea y aportar comentarios. Los autores pueden recibir comentarios y responder o modificar el código en línea. Las revisiones ayudan a mejorar la calidad del código.

    CI/CD
    - Gitea Actions ofrece CI/CD compatible con GitHub Actions. Los usuarios pueden escribir workflows en YAML familiar y reutilizar una variedad de plugins Actions existentes. Los plugins se pueden descargar desde cualquier sitio Git.

    Gestión de proyectos
    - Gitea rastrea requisitos, funciones y errores mediante columnas e issues. Los issues admiten ramas, tags, hitos, asignaciones, seguimiento de tiempo, fechas de vencimiento, dependencias y más.

    Repositorio de artefactos
    - Gitea admite más de 20 tipos de gestión de paquetes públicos o privados, incluidos Cargo, Chef, Composer, Conan, Conda, Container, Helm, Maven, npm, NuGet, Pub, PyPI, RubyGems, Vagrant y más.

    Soporte de la comunidad open source
    - Gitea es un proyecto open source bajo licencia MIT. Tiene una comunidad activa que desarrolla y mejora la plataforma de forma continua. El proyecto da la bienvenida a contribuciones para asegurar actualizaciones e innovación.

    Soporte multilingüe
    - Gitea ofrece interfaces en varios idiomas, atendiendo a usuarios de todo el mundo y fomentando la internacionalización y la localización.

  upgradeDescription: |
    Actualiza a Gitea 28.2.0 con auditoría, cuentas bot, tokens de despliegue HTTPS, aprobaciones de propietarios del código, filtros y cola de Actions, además de correcciones de seguridad. Añade comprobaciones del estado del servidor y la base de datos; conserva datos y recursos. Revise las nuevas reglas de salida Git y validación de Actions. Las ejecuciones caducan a los 400 días por defecto (RUN_RETENTION_DAYS). El registro requiere activación explícita; ROOT_URL sustituye a DOMAIN.

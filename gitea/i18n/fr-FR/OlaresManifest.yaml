metadata:
  title: Gitea
  description: Git avec une tasse de thé
spec:
  fullDescription: |
    Gitea est un service de développement logiciel tout-en-un, auto-hébergé et sans douleur. Il inclut l'hébergement Git, la revue de code, la collaboration d'équipe, le registre de paquets et le CI/CD. Il est similaire à GitHub, Bitbucket et GitLab.

    **Fonctionnalités**
    Hébergement de code
    - Gitea permet de créer et gérer des dépôts, parcourir l'historique des commits et les fichiers, revoir et fusionner les soumissions, gérer les collaborateurs, les branches, et plus. Il prend aussi en charge de nombreuses fonctionnalités Git courantes : tags, Cherry-pick, hooks, outils de collaboration intégrés, etc.

    Léger et rapide
    - L'un des objectifs de conception de Gitea est d'être léger et rapide. Contrairement à certaines grandes plateformes d'hébergement, il reste mince, performant et adapté aux environnements serveur à ressources limitées. Grâce à sa conception légère, la consommation de ressources reste relativement faible.

    Déploiement et maintenance faciles
    - Il se déploie facilement sur divers serveurs sans configurations ni dépendances complexes. Pratique pour les développeurs individuels ou petites équipes qui veulent mettre en place et gérer leurs propres services Git.

    Sécurité
    - Gitea met fortement l'accent sur la sécurité, avec gestion des permissions utilisateurs, listes de contrôle d'accès et plus pour assurer la sécurité du code et des données.

    Revue de code
    - La revue de code prend en charge le flux Pull Request et le flux AGit. Les relecteurs peuvent parcourir le code en ligne et laisser des commentaires. Les auteurs peuvent recevoir les commentaires et répondre ou modifier le code en ligne. Les revues aident à améliorer la qualité du code.

    CI/CD
    - Gitea Actions prend en charge le CI/CD, compatible avec GitHub Actions. Les utilisateurs peuvent écrire des workflows en YAML familier et réutiliser une variété de plugins Actions existants. Les plugins peuvent être téléchargés depuis n'importe quel site Git.

    Gestion de projet
    - Gitea suit les exigences, fonctionnalités et bugs via colonnes et issues. Les issues supportent branches, tags, jalons, assignations, suivi du temps, échéances, dépendances, etc.

    Dépôt d'artefacts
    - Gitea prend en charge plus de 20 types de gestion de paquets publics ou privés, dont Cargo, Chef, Composer, Conan, Conda, Container, Helm, Maven, npm, NuGet, Pub, PyPI, RubyGems, Vagrant, etc.

    Soutien de la communauté open source
    - Gitea est un projet open source sous licence MIT. Il a une communauté active qui développe et améliore continuellement la plateforme. Le projet accueille les contributions pour assurer mises à jour et innovation.

    Support multilingue
    - Gitea propose des interfaces en plusieurs langues, s'adressant aux utilisateurs du monde entier et favorisant l'internationalisation et la localisation.

  upgradeDescription: |
    Met à jour vers Gitea 28.2.0 avec audit, comptes bots, jetons de déploiement HTTPS, approbations des propriétaires du code, filtres et file Actions, ainsi que des correctifs de sécurité. Ajoute des contrôles de base de données ; conserve données et ressources. Vérifiez les nouvelles règles de sortie Git et la validation Actions. Les exécutions expirent après 400 jours par défaut (RUN_RETENTION_DAYS). L’inscription nécessite une activation explicite ; ROOT_URL remplace DOMAIN.

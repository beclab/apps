metadata:
  title: Gitea
  description: お茶と一緒の Git
spec:
  fullDescription: |
    Gitea は手間いらずのセルフホスト型オールインワンソフトウェア開発サービスです。Git ホスティング、コードレビュー、チーム協業、パッケージレジストリ、CI/CD を含みます。GitHub、Bitbucket、GitLab に類似しています。

    **機能**
    コードホスティング
    - リポジトリの作成・管理、コミット履歴とコードファイルの閲覧、提出のレビューとマージ、共同作業者管理、ブランチ操作などに対応。タグ、Cherry-pick、フック、統合コラボレーションツールなど一般的な Git 機能も多数サポート。

    軽量で高速
    - Gitea の設計目標の一つは軽量で応答が速いこと。大規模なコードホスティング基盤と異なりスリムで高速、リソース制約のあるサーバー環境に適しています。軽量設計によりリソース消費は比較的低く、制約のある環境でも良好に動作します。

    容易なデプロイと保守
    - 複雑な設定や依存関係なしに各種サーバーへ簡単にデプロイ可能。個人開発者や小規模チームが自前の Git サービスを立ち上げ管理するのに便利です。

    セキュリティ
    - ユーザー権限管理、アクセス制御リストなどによりコードとデータの安全を確保することに重点を置いています。

    コードレビュー
    - Pull Request ワークフローと AGit ワークフローの両方に対応。レビュアーはオンラインでコードを閲覧しコメント可能。提出者はコメントを受け取り、オンラインで返答や修正ができます。コード品質向上に役立ちます。

    CI/CD
    - Gitea Actions は GitHub Actions 互換の CI/CD を提供。慣れ親しんだ YAML でワークフローを書き、既存の Actions プラグインを再利用可能。任意の Git サイトからプラグインをダウンロードできます。

    プロジェクト管理
    - カラムと Issue で要件・機能・バグを追跡。Issue はブランチ、タグ、マイルストーン、担当、時間追跡、期限、依存関係などをサポート。

    アーティファクトリポジトリ
    - Cargo、Chef、Composer、Conan、Conda、Container、Helm、Maven、npm、NuGet、Pub、PyPI、RubyGems、Vagrant など 20 種以上の公開／非公開パッケージ管理に対応。

    オープンソースコミュニティサポート
    - MIT ライセンスのオープンソースプロジェクト。活発なコミュニティが継続的に開発・改善。コミュニティ貢献を歓迎し、更新とイノベーションを確保します。

    多言語サポート
    - 複数言語のインターフェースを提供し、世界中のユーザーに対応、国際化とローカライズを推進します。

  upgradeDescription: |
    Gitea を 1.27.3（`gitea/gitea:1.27.3`）へアップグレード。1.27 の 3 つ目のパッチ。Gitea Actions、API、パッケージレジストリ、添付ファイル、リポジトリ移行、可視性／トークンスコープ検査を含む大規模なセキュリティ修正を収録。

    Actions、パッケージ、UI の修正も含む（step レベルの continue-on-error 式、Swift SemVer プレリリース、PR マージ状態、Runner 一覧のクエリパラメータなど）。詳細: https://blog.gitea.com/release-of-1.27.3/

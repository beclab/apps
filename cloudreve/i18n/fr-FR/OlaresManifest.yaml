metadata:
  title: Cloudreve
  description: Système de gestion de fichiers auto-hébergé avec support multi-cloud
spec:
  fullDescription: |
    Cloudreve est un système auto-hébergé de gestion et de partage de fichiers qui prend en charge plusieurs fournisseurs de stockage.
    
    **Note importante**
    Lors du premier lancement de Cloudreve, un compte administrateur initial est créé automatiquement. Conservez le mot de passe administrateur en sécurité, car il n'est affiché que lors du premier lancement. Si vous manquez les informations d'identification, ouvrez le terminal dans le Centre de contrôle et consultez-les dans les logs.
    
    **Fonctionnalités**
    - Stockage des fichiers en local, distant, Qiniu, Aliyun OSS, Tencent COS, Upyun, OneDrive, API compatible S3.
    - Upload/Download en transmission directe avec limitation de débit.
    - Intégration Aria2 pour le téléchargement hors ligne ; plusieurs nœuds de téléchargement pour répartir la charge.
    - Compresser/extraire des fichiers, télécharger des fichiers par lots.
    - Prise en charge WebDAV pour tous les fournisseurs de stockage.
    - Glisser-déposer pour téléverser fichiers ou dossiers, avec traitement en streaming.
    - Glisser-déposer pour gérer vos fichiers.
    - Multi-utilisateurs avec multi-groupes.
    - Créer des liens de partage pour fichiers et dossiers avec date d'expiration.
    - Prévisualiser vidéos, images, audios, fichiers ePub en ligne ; éditer textes et documents Office en ligne.
    - Personnaliser les couleurs du thème, mode sombre, application PWA, SPA, i18n.
    - Pack tout-en-un, avec toutes les fonctionnalités prêtes à l'emploi.

  upgradeDescription: |
    Version en amont : [Cloudreve 4.18.0](https://github.com/cloudreve/cloudreve/releases/tag/4.18.0)

    **Nouveautés**

    - La corbeille peut être vidée en une action.
    - Le champ CAPTCHA est effacé après une saisie incorrecte.

    **Corrections**

    - Les miniatures des liens de partage se génèrent à nouveau dans l’édition Community.
    - Les envois vers le stockage local n’échouent plus lorsque les envois fragmentés en parallèle sont activés.
    - Des correctifs de sécurité signalés en amont sont inclus ; le projet en publiera les détails plus tard.

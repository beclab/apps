metadata:
  title: Cloudreve
  description: Sistema di gestione file self-hosted con supporto multi-cloud
spec:
  fullDescription: |
    Cloudreve è un sistema self-hosted di gestione e condivisione file che supporta più provider di storage.
    
    **Nota importante**
    Al primo avvio Cloudreve crea automaticamente un account amministratore iniziale. Conserva la password dell'amministratore, poiché viene mostrata solo al primo avvio. Se perdi le credenziali, puoi aprire il terminale nel Centro di controllo e verificarle nei log.
    
    **Funzionalità**
    - Archiviazione file su storage locale, remoto, Qiniu, Aliyun OSS, Tencent COS, Upyun, OneDrive, API compatibile S3.
    - Upload/Download in trasmissione diretta con supporto al limite di velocità.
    - Integrazione con Aria2 per download offline; più nodi di download per condividere il carico.
    - Comprimi/estrai file, scarica file in batch.
    - Supporto WebDAV per tutti i provider di storage.
    - Drag&Drop per caricare file o cartelle, con elaborazione upload in streaming.
    - Drag & Drop per gestire i file.
    - Multi-utente con multi-gruppi.
    - Crea link di condivisione per file e cartelle con data di scadenza.
    - Anteprima online di video, immagini, audio, file ePub; modifica online di testi e documenti Office.
    - Personalizza i colori del tema, modalità scura, applicazione PWA, SPA, i18n.
    - Pacchetto all-in-one, con tutte le funzionalità pronte all'uso.

  upgradeDescription: |
    Release upstream: [Cloudreve 4.18.0](https://github.com/cloudreve/cloudreve/releases/tag/4.18.0)

    **Novità**

    - Il cestino può essere svuotato con un’unica azione.
    - Il campo CAPTCHA viene cancellato dopo un inserimento errato.

    **Correzioni**

    - Le miniature dei link di condivisione si generano di nuovo nella Community Edition.
    - I caricamenti sullo storage locale non falliscono più quando gli upload a blocchi in parallelo sono abilitati.
    - Sono incluse correzioni di sicurezza segnalate a upstream; i dettagli saranno divulgati in seguito dal progetto.

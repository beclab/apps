metadata:
  title: Cloudreve
  description: マルチクラウド対応のセルフホスト型ファイル管理システム
spec:
  fullDescription: |
    Cloudreve は、複数のストレージプロバイダーをサポートするセルフホスト型のファイル管理・共有システムです。
    
    **重要なお知らせ**
    Cloudreveを初めて起動すると、初期管理者アカウントが自動作成されます。管理者パスワードは初回起動時のみ表示されるため、必ず安全に保管してください。認証情報を見逃した場合は、コントロールハブでターミナルを開き、ログで確認できます。
    
    **機能**
    - ローカルストレージ、リモートストレージ、Qiniu、Aliyun OSS、Tencent COS、Upyun、OneDrive、S3 互換 API へのファイル保存。
    - 速度制限対応の直接転送によるアップロード／ダウンロード。
    - Aria2 と連携したオフラインダウンロード、複数ダウンロードノードによる負荷分散。
    - ファイルの圧縮／展開、一括ダウンロード。
    - すべてのストレージプロバイダーをカバーする WebDAV 対応。
    - ストリーミングアップロード処理によるファイル／フォルダのドラッグ＆ドロップアップロード。
    - ドラッグ＆ドロップでのファイル管理。
    - 複数グループ対応のマルチユーザー。
    - 有効期限付きのファイル／フォルダ共有リンク作成。
    - 動画・画像・音声・ePub のオンラインプレビュー；テキスト・Office 文書のオンライン編集。
    - テーマカラー、ダークモード、PWA、SPA、i18n のカスタマイズ。
    - すべての機能をすぐに使えるオールインワンパッケージ。

  upgradeDescription: |
    上流リリース：[Cloudreve 4.18.0](https://github.com/cloudreve/cloudreve/releases/tag/4.18.0)

    **変更点**

    - ごみ箱を一度の操作で空にできます。
    - 間違った CAPTCHA 入力の後、入力欄がクリアされます。

    **修正**

    - Community Edition で共有リンクのサムネイルが再び生成されます。
    - 並列チャンクアップロードを有効にしても、ローカルストレージへのアップロードが失敗しなくなりました。
    - 上流に報告されたセキュリティ問題の修正が含まれます。詳細はプロジェクトが後で公開します。

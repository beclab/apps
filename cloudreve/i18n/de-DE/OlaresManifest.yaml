metadata:
  title: Cloudreve
  description: Selbst gehostetes Dateiverwaltungssystem mit Multi-Cloud-Unterstützung
spec:
  fullDescription: |
    Cloudreve ist ein selbst gehostetes Dateiverwaltungs- und Freigabesystem, das mehrere Speicheranbieter unterstützt.
    
    **Wichtiger Hinweis**
    Beim ersten Start von Cloudreve wird automatisch ein initiales Administratorkonto erstellt. Bitte bewahren Sie das Administratorpasswort sicher auf, da es nur beim ersten Start angezeigt wird. Wenn Sie die Zugangsdaten verpassen, können Sie das Terminal im Kontrollzentrum öffnen und sie in den Logs prüfen.
    
    **Funktionen**
    - Speichern von Dateien in lokalem Speicher, Remote-Speicher, Qiniu, Aliyun OSS, Tencent COS, Upyun, OneDrive, S3-kompatible API.
    - Upload/Download in Direktübertragung mit Geschwindigkeitsbegrenzung.
    - Integration mit Aria2 zum Offline-Download; mehrere Download-Knoten zur Lastverteilung.
    - Dateien komprimieren/entpacken, Dateien im Stapel herunterladen.
    - WebDAV-Unterstützung für alle Speicheranbieter.
    - Drag&Drop zum Hochladen von Dateien oder Ordnern mit Streaming-Upload.
    - Drag & Drop zur Dateiverwaltung.
    - Mehrere Nutzer mit mehreren Gruppen.
    - Freigabelinks für Dateien und Ordner mit Ablaufdatum erstellen.
    - Videos, Bilder, Audios, ePub-Dateien online Vorschau; Texte und Office-Dokumente online bearbeiten.
    - Theme-Farben anpassen, Dunkelmodus, PWA, SPA, i18n.
    - All-In-One-Paket mit allen Funktionen out-of-the-box.

  upgradeDescription: |
    Upstream-Release: [Cloudreve 4.18.0](https://github.com/cloudreve/cloudreve/releases/tag/4.18.0)

    **Änderungen**

    - Der Papierkorb kann in einem Schritt geleert werden.
    - Die CAPTCHA-Eingabe wird nach einer falschen Eingabe geleert.

    **Fehlerbehebungen**

    - Miniaturansichten für Freigabelinks werden in der Community Edition wieder erzeugt.
    - Uploads in den lokalen Speicher schlagen nicht mehr fehl, wenn parallele Chunk-Uploads aktiviert sind.
    - Gemeldete Sicherheitsprobleme sind enthalten; Details veröffentlicht das Projekt später.

metadata:
  title: Cloudreve
  description: Sistema de gestión de archivos autoalojado con soporte multi-nube
spec:
  fullDescription: |
    Cloudreve es un sistema autoalojado de gestión y compartición de archivos que admite múltiples proveedores de almacenamiento.
    
    **Nota importante**
    Al iniciar Cloudreve por primera vez, crea automáticamente una cuenta de administrador inicial. Asegúrate de guardar la contraseña de administrador, ya que solo se muestra en el primer inicio. Si pierdes la información de credenciales, puedes abrir el terminal en el Centro de control y consultarla en los logs.
    
    **Funciones**
    - Almacenar archivos en almacenamiento local, remoto, Qiniu, Aliyun OSS, Tencent COS, Upyun, OneDrive, API compatible con S3.
    - Subida/descarga en transmisión directa con límite de velocidad.
    - Integración con Aria2 para descargas offline; varios nodos de descarga para repartir la carga.
    - Comprimir/extraer archivos, descargar archivos por lotes.
    - Soporte WebDAV para todos los proveedores de almacenamiento.
    - Arrastrar y soltar para subir archivos o carpetas, con procesamiento de subida en streaming.
    - Arrastrar y soltar para gestionar tus archivos.
    - Multiusuarios con multigrupos.
    - Crear enlaces de compartición de archivos y carpetas con fecha de caducidad.
    - Previsualizar vídeos, imágenes, audios, archivos ePub en línea; editar textos y documentos Office en línea.
    - Personalizar colores del tema, modo oscuro, aplicación PWA, SPA, i18n.
    - Empaquetado todo en uno, con todas las funciones listas para usar.

  upgradeDescription: |
    Versión upstream: [Cloudreve 4.18.0](https://github.com/cloudreve/cloudreve/releases/tag/4.18.0)

    **Novedades**

    - La papelera se puede vaciar en una sola acción.
    - El campo CAPTCHA se borra tras una entrada incorrecta.

    **Correcciones**

    - Las miniaturas de los enlaces de uso compartido se generan de nuevo en la Community Edition.
    - Las subidas al almacenamiento local ya no fallan cuando están activadas las subidas fragmentadas en paralelo.
    - Se incluyen correcciones de seguridad notificadas a upstream; el proyecto publicará los detalles más adelante.

metadata:
  title: Windows
  description: Run Windows on Olares

spec:
  fullDescription: |
    This app helps you run Windows on Olars.
    Based on dockur's Windows inside a Docker container.

    **Features**
    - ISO downloader
    - KVM acceleration
    - Web-based viewer
    
    **Supported Windows	Versions**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 Enterprise
    - Windows 8.1 Enterprise
    - Windows 7 Ultimate
    - Windows Vista Ultimate
    - Windows 2000 Professional
    - Windows Server 2025
    - Windows Server 2022
    - Windows Server 2019
    - Windows Server 2016
    - Windows Server 2012
    - Windows Server 2008
    - Windows Server 2003
  upgradeDescription: |
    v1.1.9: Fix a potential issue where Windows VM disks could appear missing after certain upgrades.

    v1.1.8: Keep durable VM data on `appCache` (no appData migration); schedule only on control-plane (master); move `PASSWORD` into Kubernetes Secret (`secretKeyRef`).

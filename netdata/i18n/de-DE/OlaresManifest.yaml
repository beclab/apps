metadata:
  title: Netdata
  description: Hochleistungs-Observability-Plattform mit Open Source
spec:
  fullDescription: |
    Netdata ist eine hochleistungsfähige, quelloffene Observability-Plattform für die Echtzeitüberwachung moderner Infrastrukturen. Sie liefert sekundenweise Einblicke in Ihre Systeme, Container und Anwendungen und gibt Ihnen sofortige Sichtbarkeit für Fehlerbehebung, Kapazitätsplanung und Leistungsoptimierung.
    
    Wichtige Funktionen:
    
    Real-Time
    Sekündliche Datenerfassung und Echtzeitverarbeitung bieten sofortige Sichtbarkeit in das Verhalten Ihrer Infrastruktur.
    
    Zero-Configuration
    Starten Sie die Überwachung in Minuten mit automatischer Erkennung und Discovery, vollständig automatisierten Dashboards und Hunderten vorkonfigurierter Alarme.
    
    ML-Powered
    Unüberwachte Anomalieerkennung und Mustererkennung für alle Metriken, mit erweiterten Korrelationen und sofortiger Ursachenanalyse.
    
    Long-Term Retention
    Hochleistungsfähige und effiziente gestufte Speicherung für jahrelange Aufbewahrung und schnelle Abfrageantworten.
    
    Advanced Visualization
    Reichhaltige, interaktive Dashboards mit geringer Latenz für tiefe Einblicke in Systeme und Anwendungen sowie schnelle Fehlerbehebung.
    
    Extreme Scalability
    Native horizontale Skalierbarkeit bei gleichzeitiger Beibehaltung von Leistung und Benutzerfreundlichkeit.
    
    Complete End-to-End Visibility
    Von der Infrastruktur bis zu Anwendungen, von Logs bis Metriken, von Hardware bis Datenbanken – alles in einer Lösung.
    
    Edge-Based
    Sämtliche Verarbeitung und Speicherung Ihrer Daten in Ihren Räumlichkeiten, so nah wie möglich am Edge.
  upgradeDescription: |
    Upstream-Release: [Netdata 2.11.0](https://github.com/netdata/netdata/releases/tag/v2.11.0)

    **Änderungen**

    - Network-Monitor-Dashboard sowie Vorschauen für NetFlow/IPFIX/sFlow und SNMP-Topologie.
    - OpenTelemetry-Log-Ingestion auf derselben Logs-Engine wie Journal und Windows-Ereignisse.
    - AWS-CloudWatch-Collector und ein neu aufgebauter Prometheus-Collector.


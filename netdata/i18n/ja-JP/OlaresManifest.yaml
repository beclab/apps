metadata:
  title: Netdata
  description: 高性能オープンソース・オブザーバビリティプラットフォーム
spec:
  fullDescription: |
    Netdata は、最新インフラのリアルタイム監視向けに設計された高性能オープンソース・オブザーバビリティプラットフォームです。システム、コンテナ、アプリケーションへの毎秒の洞察を提供し、トラブルシューティング、キャパシティプランニング、パフォーマンス最適化のための即時の可視性を実現します。
    
    主な機能：
    
    Real-Time
    毎秒のデータ収集とリアルタイム処理により、インフラの挙動を即座に可視化。
    
    Zero-Configuration
    自動検出とディスカバリー、完全自動化ダッシュボード、数百の事前設定アラートで数分で監視を開始。
    
    ML-Powered
    すべてのメトリクスに対する教師なし異常検知とパターン認識により、高度な相関と即時の根本原因分析を提供。
    
    Long-Term Retention
    何年もの保持と高速クエリ応答のための高性能・効率的な階層ストレージ。
    
    Advanced Visualization
    深いシステム・アプリケーション洞察と迅速なトラブルシューティングのための、低レイテンシの豊富なインタラクティブダッシュボード。
    
    Extreme Scalability
    パフォーマンスと使いやすさを維持しつつ、ネイティブな水平スケーラビリティ。
    
    Complete End-to-End Visibility
    インフラからアプリケーション、ログからメトリクス、ハードウェアからデータベースまで、すべてを一つのソリューションで。
    
    Edge-Based
    データのすべての処理と保存を、可能な限りエッジに近い自社環境で。
  upgradeDescription: |
    上流リリース：[Netdata 2.11.0](https://github.com/netdata/netdata/releases/tag/v2.11.0)

    **変更内容**

    - Network Monitor ダッシュボード、および NetFlow/IPFIX/sFlow と SNMP トポロジのプレビュー。
    - journal および Windows イベントと同じ Logs エンジンでの OpenTelemetry ログ取り込み。
    - AWS CloudWatch コレクターと再構築された Prometheus コレクター。


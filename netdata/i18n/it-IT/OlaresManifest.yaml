metadata:
  title: Netdata
  description: Piattaforma di osservabilità open source ad alte prestazioni
spec:
  fullDescription: |
    Netdata è una piattaforma di osservabilità open source ad alte prestazioni progettata per il monitoraggio in tempo reale delle infrastrutture moderne. Fornisce insight al secondo su sistemi, container e applicazioni, dandoti visibilità immediata per troubleshooting, pianificazione della capacità e ottimizzazione delle prestazioni.
    
    Funzionalità chiave:
    
    Real-Time
    Raccolta dati al secondo e elaborazione in tempo reale offrono visibilità immediata sul comportamento della tua infrastruttura.
    
    Zero-Configuration
    Inizia a monitorare in pochi minuti con rilevamento e discovery automatici, dashboard completamente automatizzate e centinaia di alert preconfigurati.
    
    ML-Powered
    Rilevamento anomalie non supervisionato e riconoscimento di pattern per tutte le metriche, con correlazioni avanzate e analisi immediata della causa radice.
    
    Long-Term Retention
    Storage a livelli ad alte prestazioni ed efficiente per anni di retention e risposte alle query rapide.
    
    Advanced Visualization
    Dashboard ricche e interattive a bassa latenza per insight profondi su sistemi e applicazioni e troubleshooting rapido.
    
    Extreme Scalability
    Scalabilità orizzontale nativa, mantenendo prestazioni e facilità d'uso.
    
    Complete End-to-End Visibility
    Dall'infrastruttura alle applicazioni, dai log alle metriche, dall'hardware ai database, tutto in una sola soluzione.
    
    Edge-Based
    Tutta l'elaborazione e lo storage dei tuoi dati, nei tuoi locali, il più vicino possibile all'edge.
  upgradeDescription: |
    Rilascio upstream: [Netdata 2.11.0](https://github.com/netdata/netdata/releases/tag/v2.11.0)

    **Novità**

    - Dashboard Network Monitor, più anteprime NetFlow/IPFIX/sFlow e topologia SNMP.
    - Ingestione log OpenTelemetry sullo stesso motore Logs di journal e eventi Windows.
    - Collector AWS CloudWatch e collector Prometheus ricostruito.


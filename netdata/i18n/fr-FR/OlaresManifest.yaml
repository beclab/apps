metadata:
  title: Netdata
  description: "Plateforme d'observabilité open source haute performance"
spec:
  fullDescription: |
    Netdata est une plateforme d'observabilité open source haute performance conçue pour la surveillance en temps réel des infrastructures modernes. Elle fournit des insights à la seconde sur vos systèmes, conteneurs et applications, vous donnant une visibilité immédiate pour le dépannage, la planification de capacité et l'optimisation des performances.
    
    Fonctionnalités clés :
    
    Real-Time
    La collecte de données à la seconde et le traitement en temps réel offrent une visibilité immédiate sur le comportement de votre infrastructure.
    
    Zero-Configuration
    Démarrez la surveillance en quelques minutes avec détection et découverte automatiques, tableaux de bord entièrement automatisés et des centaines d'alertes préconfigurées.
    
    ML-Powered
    Détection d'anomalies non supervisée et reconnaissance de motifs pour toutes les métriques, avec corrélations avancées et analyse instantanée de la cause racine.
    
    Long-Term Retention
    Stockage à niveaux haute performance et efficace pour des années de rétention et des réponses de requêtes rapides.
    
    Advanced Visualization
    Tableaux de bord riches et interactifs à faible latence pour des insights approfondis sur les systèmes et applications et un dépannage rapide.
    
    Extreme Scalability
    Scalabilité horizontale native, tout en maintenant performances et facilité d'utilisation.
    
    Complete End-to-End Visibility
    De l'infrastructure aux applications, des logs aux métriques, du matériel aux bases de données, le tout dans une seule solution.
    
    Edge-Based
    Tout le traitement et le stockage de vos données, sur vos locaux, aussi près de l'edge que possible.
  upgradeDescription: |
    Version amont : [Netdata 2.11.0](https://github.com/netdata/netdata/releases/tag/v2.11.0)

    **Nouveautés**

    - Tableau de bord Network Monitor, plus aperçus NetFlow/IPFIX/sFlow et topologie SNMP.
    - Ingestion de logs OpenTelemetry sur le même moteur Logs que journal et les événements Windows.
    - Collecteur AWS CloudWatch et collecteur Prometheus reconstruit.


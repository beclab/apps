metadata:
  title: Netdata
  description: Plataforma de observabilidad de alto rendimiento y código abierto
spec:
  fullDescription: |
    Netdata es una plataforma de observabilidad de alto rendimiento y código abierto diseñada para la monitorización en tiempo real de infraestructuras modernas. Ofrece información por segundo sobre tus sistemas, contenedores y aplicaciones, dándote visibilidad inmediata para la resolución de problemas, la planificación de capacidad y la optimización del rendimiento.
    
    Funciones clave:
    
    Real-Time
    La recopilación de datos por segundo y el procesamiento en tiempo real proporcionan visibilidad inmediata del comportamiento de tu infraestructura.
    
    Zero-Configuration
    Empieza a monitorizar en minutos con detección y descubrimiento automáticos, dashboards totalmente automatizados y cientos de alertas preconfiguradas.
    
    ML-Powered
    Detección de anomalías no supervisada y reconocimiento de patrones para todas las métricas, con correlaciones avanzadas y análisis instantáneo de causa raíz.
    
    Long-Term Retention
    Almacenamiento por niveles de alto rendimiento y eficiente para años de retención y respuestas de consulta rápidas.
    
    Advanced Visualization
    Dashboards ricos e interactivos de baja latencia para profundizar en sistemas y aplicaciones y resolver problemas rápidamente.
    
    Extreme Scalability
    Escalabilidad horizontal nativa, manteniendo el rendimiento y la facilidad de uso.
    
    Complete End-to-End Visibility
    Desde infraestructura hasta aplicaciones, logs hasta métricas, hardware hasta bases de datos, todo en una solución.
    
    Edge-Based
    Todo el procesamiento y almacenamiento de tus datos, en tus instalaciones, tan cerca del edge como sea posible.
  upgradeDescription: |
    Versión upstream: [Netdata 2.11.0](https://github.com/netdata/netdata/releases/tag/v2.11.0)

    **Novedades**

    - Panel Network Monitor, más vistas previas de NetFlow/IPFIX/sFlow y topología SNMP.
    - Ingesta de logs OpenTelemetry en el mismo motor Logs que journal y eventos de Windows.
    - Recolector de AWS CloudWatch y recolector Prometheus reconstruido.


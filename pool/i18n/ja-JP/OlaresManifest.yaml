metadata:
  title: Pool CLI
  description: ターミナルで動作する Poolside のコーディングエージェント
spec:
  upgradeDescription: |
    Upgrade Pool CLI to 1.0.16 and Ubuntu24.04 PHP packages to at least 8.3.6-0ubuntu0.24.04.13 (security backport for CVE-2026-109618/CVE-2026-109619); disable session upload progress. Upstream1.0.8 moved pool.json settings into settings.yaml: review custom agent/model defaults. Use native POOLSIDE_STANDALONE_MODEL for local model selection without creating aliases in another service.
  fullDescription: |
    **概要**
    Pool はターミナル向けの Poolside コーディングエージェントです。コードベースを読み取り、ツールを実行し、ファイルを編集します。MCP サーバー、Skills、AGENTS.md のプロジェクト指示にも対応します。

    **主な機能**
    - スラッシュコマンド、ファイルのあいまい検索、シェルモード、承認モードを備えた対話型ターミナル TUI。
    - 自然言語で操作する実ファイル編集、シェル実行、git ワークフロー。
    - MCP ツール統合と再利用可能な Skills ワークフロー。
    - スクリプトや CI 向けの `pool exec` による非対話型自動化。
    - プリインストール済みツールチェーン: Python、Node.js、Go、Rust、Java、PHP、git、ripgrep、DB クライアント。
    - オプションの DinD（`ENABLE_DIND`、デフォルトで有効）: ターミナルでの `docker` / `docker compose`（特権 sidecar）。

    **初回セットアップ**
    - **ローカル Ollama（Olares で推奨）:** `USE_LOCAL_LLM` を `true` に設定し、`POOL_MODEL` を Ollama で取得した正確なタグ（デフォルト `qwen3-coder:30b`）に設定します。アプリを再起動して `pool` または `pool exec` を実行すると、モデルが自動的に接続されます。
    - **Poolside Cloud:** `USE_LOCAL_LLM` を `false` に設定し、`pool setup` を実行（Poolside でログイン）するか、`POOLSIDE_API_KEY` を設定します。
    - **セルフホスト Poolside プラットフォーム:** `USE_LOCAL_LLM` を `false` に設定し、`POOLSIDE_API_URL` と `POOLSIDE_API_KEY` / `POOLSIDE_TOKEN` を設定します。

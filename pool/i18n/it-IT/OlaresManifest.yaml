metadata:
  title: Pool CLI
  description: L'agente di programmazione di Poolside che viene eseguito nel terminale
spec:
  upgradeDescription: |
    Upgrade Pool CLI to 1.0.16 and Ubuntu24.04 PHP packages to at least 8.3.6-0ubuntu0.24.04.13 (security backport for CVE-2026-109618/CVE-2026-109619); disable session upload progress. Upstream1.0.8 moved pool.json settings into settings.yaml: review custom agent/model defaults. Use native POOLSIDE_STANDALONE_MODEL for local model selection without creating aliases in another service.
  fullDescription: |
    **Panoramica**
    Pool è l'agente di programmazione di Poolside per il terminale. Legge il codice, esegue strumenti, modifica file e supporta server MCP, Skills e istruzioni di progetto AGENTS.md.

    **Funzionalità principali**
    - TUI interattiva nel terminale con comandi slash, ricerca fuzzy dei file, modalità shell e modalità di approvazione.
    - Modifiche reali ai file, esecuzione della shell e flussi di lavoro git guidati dal linguaggio naturale.
    - Integrazione degli strumenti MCP e flussi di lavoro Skills riutilizzabili.
    - Automazione non interattiva tramite `pool exec` per script e CI.
    - Toolchain preinstallata: Python, Node.js, Go, Rust, Java, PHP, git, ripgrep e client DB.
    - DinD opzionale (`ENABLE_DIND`, attivo per impostazione predefinita): `docker` / `docker compose` nel terminale (sidecar privilegiato).

    **Prima configurazione**
    - **Ollama locale (consigliato su Olares):** imposta `USE_LOCAL_LLM` su `true`, imposta `POOL_MODEL` sul tag esatto scaricato in Ollama (predefinito `qwen3-coder:30b`), riavvia l'app, quindi esegui `pool` o `pool exec`: il modello viene collegato automaticamente.
    - **Poolside Cloud:** imposta `USE_LOCAL_LLM` su `false`, esegui `pool setup` (accedi con Poolside) oppure imposta `POOLSIDE_API_KEY`.
    - **Piattaforma Poolside self-hosted:** imposta `USE_LOCAL_LLM` su `false`, quindi configura `POOLSIDE_API_URL` e `POOLSIDE_API_KEY` / `POOLSIDE_TOKEN`.

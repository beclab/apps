metadata:
  title: Pool CLI
  description: L’agent de programmation de Poolside qui s’exécute dans votre terminal
spec:
  upgradeDescription: |
    Upgrade Pool CLI to 1.0.16 and Ubuntu24.04 PHP packages to at least 8.3.6-0ubuntu0.24.04.13 (security backport for CVE-2026-109618/CVE-2026-109619); disable session upload progress. Upstream1.0.8 moved pool.json settings into settings.yaml: review custom agent/model defaults. Use native POOLSIDE_STANDALONE_MODEL for local model selection without creating aliases in another service.
  fullDescription: |
    **Présentation**
    Pool est l’agent de programmation de Poolside pour le terminal. Il lit votre code, exécute des outils, modifie des fichiers et prend en charge les serveurs MCP, les Skills et les instructions de projet AGENTS.md.

    **Fonctionnalités principales**
    - TUI interactive dans le terminal avec commandes slash, recherche approximative de fichiers, mode shell et modes d’approbation.
    - Modifications réelles de fichiers, exécution du shell et workflows git pilotés en langage naturel.
    - Intégration des outils MCP et workflows Skills réutilisables.
    - Automatisation non interactive via `pool exec` pour les scripts et la CI.
    - Chaîne d’outils préinstallée : Python, Node.js, Go, Rust, Java, PHP, git, ripgrep et clients de bases de données.
    - DinD facultatif (`ENABLE_DIND`, activé par défaut) : `docker` / `docker compose` dans le terminal (sidecar privilégié).

    **Configuration initiale**
    - **Ollama local (recommandé sur Olares) :** définissez `USE_LOCAL_LLM` sur `true`, définissez `POOL_MODEL` sur le tag exact téléchargé dans Ollama (`qwen3-coder:30b` par défaut), redémarrez l’application, puis exécutez `pool` ou `pool exec` ; le modèle est connecté automatiquement.
    - **Poolside Cloud :** définissez `USE_LOCAL_LLM` sur `false`, exécutez `pool setup` (connexion avec Poolside) ou définissez `POOLSIDE_API_KEY`.
    - **Plateforme Poolside auto-hébergée :** définissez `USE_LOCAL_LLM` sur `false`, puis configurez `POOLSIDE_API_URL` et `POOLSIDE_API_KEY` / `POOLSIDE_TOKEN`.

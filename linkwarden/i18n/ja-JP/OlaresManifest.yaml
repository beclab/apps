metadata:
  title: Linkwarden
  description: 自分専用のブックマークライブラリでウェブページを収集・整理・保存
spec:
  fullDescription: 'Linkwardenはリンク、コレクション、タグを非公開のブックマークライブラリで管理します。役立つページを保存し、後で読めるようにコピーを保管できます。


    初回利用時にアカウントを作成します。コレクションはアプリの権限設定に従って共有できます。アーカイブしたページと検索インデックスはアプリのストレージに保持され、アカウントとブックマークの記録にはOlares PostgreSQLを使用します。


    オプションのAI機能は、default-chatを通じてAI Routerを利用できます。ページを保存できるかどうかは、元のウェブサイトがアクセスを許可しているかによって異なります。ブラウザー拡張機能、外部共有、メール配信には、それぞれ設定が必要です。'

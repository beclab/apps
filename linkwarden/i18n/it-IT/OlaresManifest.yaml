metadata:
  title: Linkwarden
  description: Raccogli, organizza e conserva pagine web nella tua raccolta di segnalibri
spec:
  fullDescription: 'Linkwarden organizza link, raccolte e tag in una biblioteca privata di segnalibri. Salva le pagine utili e conservane copie da leggere in seguito.


    Crea un account al primo utilizzo. Le raccolte possono essere condivise tramite le autorizzazioni dell’applicazione. Le pagine archiviate e gli indici di ricerca vengono conservati nello spazio di archiviazione dell’applicazione, mentre gli account e i segnalibri utilizzano Olares PostgreSQL.


    Le funzioni IA facoltative possono utilizzare AI Router tramite default-chat. La conservazione delle pagine dipende dal fatto che il sito web di origine consenta l’accesso. Le estensioni del browser, la condivisione esterna e l’invio di e-mail richiedono una configurazione separata.'

metadata:
  title: Linkwarden
  description: Collecter, organiser et conserver des pages web dans votre bibliothèque de favoris
spec:
  fullDescription: 'Linkwarden organise les liens, les collections et les étiquettes dans une bibliothèque privée de favoris. Enregistrez les pages utiles et conservez-en des copies pour les lire plus tard.


    Créez un compte lors de la première utilisation. Les collections peuvent être partagées à l’aide des autorisations de l’application. Les pages archivées et les index de recherche sont conservés dans le stockage de l’application, tandis que les comptes et les favoris utilisent Olares PostgreSQL.


    Les fonctions d’IA facultatives peuvent utiliser AI Router via default-chat. La conservation des pages dépend de l’autorisation d’accès du site web source. Les extensions de navigateur, le partage externe et l’envoi d’e-mails nécessitent une configuration distincte.'

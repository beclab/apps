metadata:
  title: Linkwarden
  description: Collect, organize and preserve web pages in your own bookmark library
spec:
  fullDescription: 'Linkwarden keeps links, collections and tags in a private bookmark library. Save useful pages and preserve copies for later reading.


    Create an account on first use. Collections can be shared using the application permissions. Archived pages and search indexes persist in application storage, while account and bookmark records use Olares PostgreSQL.


    Optional AI features can use AI Router through default-chat. Page preservation depends on the source website allowing access. Browser extensions, external sharing and email delivery require their own configuration.'

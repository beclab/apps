metadata:
  title: Linkwarden
  description: Webseiten in einer eigenen Lesezeichenbibliothek sammeln, ordnen und archivieren
spec:
  fullDescription: 'Linkwarden verwaltet Links, Sammlungen und Tags in einer privaten Lesezeichenbibliothek. Speichern Sie nützliche Seiten und bewahren Sie Kopien zum späteren Lesen auf.


    Erstellen Sie bei der ersten Verwendung ein Konto. Sammlungen lassen sich über die Berechtigungen der Anwendung teilen. Archivierte Seiten und Suchindizes bleiben im Anwendungsspeicher erhalten; Konto- und Lesezeichendaten werden in Olares PostgreSQL gespeichert.


    Optionale KI-Funktionen können AI Router über default-chat nutzen. Ob Seiten archiviert werden können, hängt davon ab, ob die Quellwebsite den Zugriff erlaubt. Browser-Erweiterungen, externe Freigaben und der E-Mail-Versand müssen separat konfiguriert werden.'

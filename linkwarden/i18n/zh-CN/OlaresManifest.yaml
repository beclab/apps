metadata:
  title: Linkwarden
  description: 收集、整理和保存网页，建立自己的书签库
spec:
  fullDescription: 'Linkwarden 将链接、收藏夹和标签保存在私有书签库中，可保存实用网页及其副本，便于日后阅读。


    首次使用时创建账号。可通过应用权限共享收藏夹。网页归档和搜索索引保存在持久应用存储中，账号和书签记录使用 Olares PostgreSQL。


    可选 AI 功能可通过 AI Router 的 default-chat 使用模型。网页保存效果取决于源网站是否允许访问。浏览器扩展、外部共享和邮件发送需要另行配置。'

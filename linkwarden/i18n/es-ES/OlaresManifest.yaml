metadata:
  title: Linkwarden
  description: Recopila, organiza y conserva páginas web en tu propia biblioteca de marcadores
spec:
  fullDescription: 'Linkwarden organiza enlaces, colecciones y etiquetas en una biblioteca privada de marcadores. Guarda páginas útiles y conserva copias para leerlas más adelante.


    Crea una cuenta al usar la aplicación por primera vez. Las colecciones se pueden compartir mediante los permisos de la aplicación. Las páginas archivadas y los índices de búsqueda se conservan en el almacenamiento de la aplicación, mientras que los registros de cuentas y marcadores utilizan Olares PostgreSQL.


    Las funciones opcionales de IA pueden utilizar AI Router a través de default-chat. La conservación de páginas depende de que el sitio web de origen permita el acceso. Las extensiones del navegador, el uso compartido externo y el envío de correo electrónico requieren su propia configuración.'

{{- $existing := lookup "v1" "Secret" .Release.Namespace "linkwarden-auth" -}}
apiVersion: v1
kind: Secret
metadata:
  name: linkwarden-auth
  namespace: {{ .Release.Namespace | quote }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.username (.Values.postgres.password | urlquery) .Values.postgres.host .Values.postgres.port .Values.postgres.databases.linkwarden | quote }}
  {{- range $key := list "NEXTAUTH_SECRET" "MEILI_MASTER_KEY" }}
  {{ $key }}: {{ if and $existing $existing.data (index $existing.data $key) }}{{ index $existing.data $key | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
  {{- end }}

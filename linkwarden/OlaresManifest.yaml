olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: linkwarden
  appid: linkwarden
  title: Linkwarden
  description: Collect, organize and preserve web pages in your own bookmark library
  icon: https://cdn.olares.com/images/2026/10/899fb33fc3ce510da059ee3a6f68f85e.png
  version: 0.0.3
  categories:
  - Productivity
  - Productivity_v112
  - workspace
entrances:
- name: linkwarden
  host: linkwarden
  port: 3000
  title: Linkwarden
  icon: https://cdn.olares.com/images/2026/10/899fb33fc3ce510da059ee3a6f68f85e.png
  authLevel: private
  openMethod: window
spec:
  versionName: 2.16.3
  developer: Linkwarden
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  requiredCpu: 300m
  limitedCpu: '4'
  requiredMemory: 640Mi
  limitedMemory: 4Gi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  locale:
  - en-US
  - zh-CN
  fullDescription: 'Linkwarden keeps links, collections and tags in a private bookmark
    library. Save useful pages and preserve copies for later reading.


    Create an account on first use. Collections can be shared using the application
    permissions. Archived pages and search indexes persist in application storage,
    while account and bookmark records use Olares PostgreSQL.


    Optional AI features can use AI Router through default-chat. Page preservation
    depends on the source website allowing access. Browser extensions, external sharing
    and email delivery require their own configuration.'
  website: https://github.com/linkwarden/linkwarden
  sourceCode: https://github.com/linkwarden/linkwarden
  license:
  - text: AGPL-3.0
    url: https://github.com/linkwarden/linkwarden/blob/main/LICENSE.md
  featuredImage: https://cdn.olares.com/images/2026/10/021aa1ed70098fee4cb9df62b3dadadb.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/021aa1ed70098fee4cb9df62b3dadadb.png
  - https://cdn.olares.com/images/2026/10/dae7a40472c5a01151888449c302dd0a.png
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
workloadReplicas:
  linkwarden: 1
middleware:
  postgres:
    username: linkwarden
    databases:
    - name: linkwarden

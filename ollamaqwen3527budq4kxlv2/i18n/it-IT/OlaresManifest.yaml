metadata:
  title: Qwen3.5 27B UD-XL (Ollama)
  description: "Modelli multimodali open-source che offrono utilità e prestazioni eccezionali"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa attraverso il proxy verso Ollama.

    **MODEL**
    Usa la quantizzazione Unsloth Dynamic da `unsloth/Qwen3.5-27B-GGUF` (`Qwen3.5-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La quantizzazione UD a precisione mista preserva qualità vicina a Q5_K_M mantenendo il throughput di decode vicino a Q4_K_M standard, con visione completa (mmproj).
    Viene usato il chat template incorporato del GGUF (create files-API in un passo), così il proiettore multimodale resta collegato per l'input immagine.

    Qwen3.5 rappresenta un salto significativo, integrando avanzamenti in apprendimento multimodale, efficienza architetturale, scala RL e accessibilità globale.

    Qwen3.5 include i seguenti miglioramenti:

    Unified Vision-Language Foundation: L'early fusion training su token multimodali raggiunge parità cross-generazionale con Qwen3 e supera i modelli Qwen3-VL nei benchmark di reasoning, coding, agent e comprensione visiva.

    Efficient Hybrid Architecture: Gated Delta Networks combinate con sparse Mixture-of-Experts offrono inferenza ad alto throughput con latenza e costi minimi.

    Scalable RL Generalization: Reinforcement learning scalato su ambienti da un milione di agent con distribuzioni di task progressivamente complesse per una robusta adattabilità nel mondo reale.

    Global Linguistic Coverage: Supporto ampliato a 201 lingue e dialetti, consentendo un deployment mondiale inclusivo con comprensione culturale e regionale sfumata.

    Next-Generation Training Infrastructure: Efficienza di training multimodale vicina al 100% rispetto al training solo testo, e framework RL asincroni che supportano scaffold di agent su vasta scala e orchestrazione di ambienti.
  upgradeDescription: |
    Aggiornamento del runtime Ollama a ollama/ollama:0.30.10.
    Aggiornamento del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro OpenAI vision image_url).

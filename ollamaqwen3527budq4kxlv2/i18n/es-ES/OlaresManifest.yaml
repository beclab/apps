metadata:
  title: Qwen3.5 27B UD-XL (Ollama)
  description: "Modelos multimodales de código abierto que ofrecen utilidad y rendimiento excepcionales"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla mediante la app de referencia.
    El tráfico de usuarios pasa por el proxy hacia Ollama.

    **MODEL**
    Usa cuantización Unsloth Dynamic de `unsloth/Qwen3.5-27B-GGUF` (`Qwen3.5-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La cuantización UD de precisión mixta preserva calidad cercana a Q5_K_M manteniendo el throughput de decode cercano a Q4_K_M estándar, con visión completa (mmproj).
    Se usa la plantilla de chat embebida del GGUF (create de files-API en un paso), de modo que el proyector multimodal permanece adjunto para entrada de imagen.

    Qwen3.5 representa un salto significativo, integrando avances en aprendizaje multimodal, eficiencia arquitectónica, escala de RL y accesibilidad global.

    Qwen3.5 incluye las siguientes mejoras:

    Unified Vision-Language Foundation: El entrenamiento de fusión temprana en tokens multimodales alcanza paridad entre generaciones con Qwen3 y supera a los modelos Qwen3-VL en benchmarks de razonamiento, coding, agentes y comprensión visual.

    Efficient Hybrid Architecture: Gated Delta Networks combinadas con sparse Mixture-of-Experts ofrecen inferencia de alto throughput con latencia y coste mínimos.

    Scalable RL Generalization: Aprendizaje por refuerzo escalado en entornos de un millón de agentes con distribuciones de tareas progresivamente complejas para una adaptabilidad robusta en el mundo real.

    Global Linguistic Coverage: Soporte ampliado a 201 idiomas y dialectos, permitiendo un despliegue mundial inclusivo con comprensión cultural y regional matizada.

    Next-Generation Training Infrastructure: Eficiencia de entrenamiento multimodal cercana al 100% frente al entrenamiento solo texto, y frameworks RL asíncronos que soportan scaffolds de agentes a gran escala y orquestación de entornos.
  upgradeDescription: |
    Actualización del runtime Ollama a ollama/ollama:0.30.10.
    Actualización del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío OpenAI vision image_url).

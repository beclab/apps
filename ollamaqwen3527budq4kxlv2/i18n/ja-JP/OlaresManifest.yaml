metadata:
  title: Qwen3.5 27B UD-XL (Ollama)
  description: "優れた実用性と性能を備えたオープンソースのマルチモーダルモデル"

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内の全ユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。

    **MODEL**
    `unsloth/Qwen3.5-27B-GGUF` の Unsloth Dynamic 量子化（`Qwen3.5-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`）を使用。
    混合精度 UD 量子化は品質を Q5_K_M 近くに保ちつつ、デコードスループットを標準 Q4_K_M 近くに維持し、フルビジョン（mmproj）を保持します。
    GGUF 埋め込みのチャットテンプレートを使用（単一ステップ files-API create）し、画像入力用のマルチモーダルプロジェクタが付いたままになります。

    Qwen3.5 は、マルチモーダル学習、アーキテクチャ効率、強化学習のスケール、グローバルなアクセシビリティにおけるブレークスルーを統合した大きな前進です。

    Qwen3.5 の強化点:

    Unified Vision-Language Foundation: マルチモーダルトークンでの早期融合学習により Qwen3 と世代間で同等の性能を達成し、推論・コーディング・エージェント・視覚理解ベンチマークで Qwen3-VL を上回ります。

    Efficient Hybrid Architecture: Gated Delta Networks と sparse Mixture-of-Experts の組み合わせにより、低レイテンシ・低コストで高スループット推論を実現。

    Scalable RL Generalization: 百万エージェント環境で段階的に複雑なタスク分布にスケールした強化学習により、実世界での適応性を強化。

    Global Linguistic Coverage: 201 の言語・方言に対応を拡大し、文化的・地域的なニュアンスを伴う包括的な世界展開を可能に。

    Next-Generation Training Infrastructure: テキストのみ学習に対しほぼ 100% のマルチモーダル学習効率と、大規模エージェントスキャフォールドおよび環境オーケストレーションを支える非同期 RL フレームワーク。
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 にアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 にアップグレード（OpenAI vision image_url 転送）。

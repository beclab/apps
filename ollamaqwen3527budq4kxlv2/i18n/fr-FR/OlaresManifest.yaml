metadata:
  title: Qwen3.5 27B UD-XL (Ollama)
  description: "Modèles multimodaux open source offrant une utilité et des performances exceptionnelles"

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODEL**
    Utilise la quantification Unsloth Dynamic de `unsloth/Qwen3.5-27B-GGUF` (`Qwen3.5-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La quantification UD en précision mixte préserve une qualité proche de Q5_K_M tout en gardant un débit de decode proche du Q4_K_M standard, avec vision complète (mmproj).
    Le chat template intégré du GGUF est utilisé (create files-API en une étape), de sorte que le projecteur multimodal reste attaché pour l'entrée image.

    Qwen3.5 représente un bond significatif, intégrant des avancées en apprentissage multimodal, efficacité architecturale, échelle de RL et accessibilité mondiale.

    Qwen3.5 propose les améliorations suivantes :

    Unified Vision-Language Foundation : L'entraînement en early fusion sur des tokens multimodaux atteint une parité intergénérationnelle avec Qwen3 et surpasse les modèles Qwen3-VL sur les benchmarks de raisonnement, coding, agents et compréhension visuelle.

    Efficient Hybrid Architecture : Gated Delta Networks combinés à sparse Mixture-of-Experts offrent une inférence à haut débit avec une latence et un coût minimaux.

    Scalable RL Generalization : Apprentissage par renforcement mis à l'échelle sur des environnements à un million d'agents avec des distributions de tâches progressivement complexes pour une adaptabilité robuste au monde réel.

    Global Linguistic Coverage : Support étendu à 201 langues et dialectes, permettant un déploiement mondial inclusif avec une compréhension culturelle et régionale nuancée.

    Next-Generation Training Infrastructure : Efficacité d'entraînement multimodal proche de 100 % par rapport à l'entraînement texte seul, et frameworks RL asynchrones supportant des scaffolds d'agents à grande échelle et l'orchestration d'environnements.
  upgradeDescription: |
    Mise à jour du runtime Ollama vers ollama/ollama:0.30.10.
    Mise à jour du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert OpenAI vision image_url).

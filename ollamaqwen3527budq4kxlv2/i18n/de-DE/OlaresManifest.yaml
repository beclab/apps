metadata:
  title: Qwen3.5 27B UD-XL (Ollama)
  description: "Open-Source-Multimodalmodelle mit außergewöhnlicher Nützlichkeit und Leistung"

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.
    Nutzerverkehr geht über den Proxy zu Ollama.

    **MODEL**
    Verwendet Unsloth Dynamic Quant von `unsloth/Qwen3.5-27B-GGUF` (`Qwen3.5-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Mixed-Precision-UD-Quantisierung erhält Qualität nahe Q5_K_M bei Decode-Durchsatz nahe Standard-Q4_K_M, mit voller Vision (mmproj).
    Das eingebettete Chat-Template des GGUF wird genutzt (einstufige files-API create), sodass der multimodale Projektor für Bildeingabe angehängt bleibt.

    Qwen3.5 stellt einen bedeutenden Sprung dar und integriert Durchbrüche in multimodalem Lernen, architektonischer Effizienz, RL-Skalierung und globaler Zugänglichkeit.

    Qwen3.5 bietet folgende Verbesserungen:

    Unified Vision-Language Foundation: Early-Fusion-Training auf multimodalen Tokens erreicht generationsübergreifende Parität mit Qwen3 und übertrifft Qwen3-VL-Modelle bei Reasoning-, Coding-, Agenten- und visuellen Verständnis-Benchmarks.

    Efficient Hybrid Architecture: Gated Delta Networks kombiniert mit Sparse Mixture-of-Experts liefern hohen Inference-Durchsatz bei minimaler Latenz und Kosten.

    Scalable RL Generalization: Reinforcement Learning skaliert über Million-Agent-Umgebungen mit zunehmend komplexen Aufgabenverteilungen für robuste reale Anpassungsfähigkeit.

    Global Linguistic Coverage: Erweiterte Unterstützung auf 201 Sprachen und Dialekte für inklusive, weltweite Bereitstellung mit nuancenreichem kulturellem und regionalem Verständnis.

    Next-Generation Training Infrastructure: Nahezu 100 % multimodale Trainingseffizienz im Vergleich zu text-only Training und asynchrone RL-Frameworks für massiv skalierte Agent-Scaffolds und Environment-Orchestrierung.
  upgradeDescription: |
    Ollama-Runtime auf ollama/ollama:0.30.10 aktualisiert.
    Olares-API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisiert (OpenAI vision image_url-Weiterleitung).

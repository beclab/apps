metadata:
  title: MacOS
  description: MacOS auf Olares ausführen

spec:
  fullDescription: |
    Diese App hilft Ihnen, Macos auf Olares auszuführen.
    Basierend auf dockurs MacOS in einem Docker-Container.

    **Funktionen**
    - KVM-Beschleunigung
    - Webbasierter Viewer  
    - Automatischer Download

    **Unterstützte MasOS	Versionen**
    - macOS 14
    - macOS 13
    - macOS 12
    - macOS 11
  upgradeDescription: |
    v1.0.14: Dauerhafte VM-Daten auf `appCache` belassen (keine appData-Migration); nur auf control-plane (master) planen.

    Speicher: dauerhafte Volumes von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopieren initContainers Legacy-Inhalte aus appCache nach appData, wenn das Ziel leer ist (Marker: `.migration_from_appcache_storage_done`). Alte appCache-Daten bleiben für Rollback erhalten.

    VM-Festplattenspeicher vom appCache-Root nach appData/storage verschoben.

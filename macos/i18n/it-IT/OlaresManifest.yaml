metadata:
  title: MacOS
  description: Esegui MacOS su Olares

spec:
  fullDescription: |
    Questa app ti aiuta a eseguire Macos su Olares.
    Basata su MacOS di dockur in un container Docker.

    **Funzionalità**
    - Accelerazione KVM
    - Viewer basato sul web  
    - Download automatico

    **Versioni MasOS	supportate**
    - macOS 14
    - macOS 13
    - macOS 12
    - macOS 11
  upgradeDescription: |
    v1.0.14: Conservare i dati durevoli della VM su `appCache` (nessuna migrazione appData); pianificare solo sul control-plane (master).

    Storage: volumi durevoli spostati da `appCache` ad `appData`. Al primo avvio dopo l’upgrade, gli initContainers copiano i contenuti legacy di appCache in appData se la destinazione è vuota (marker: `.migration_from_appcache_storage_done`). I vecchi dati appCache restano per il rollback.

    Lo storage del disco VM è passato dalla root di appCache ad appData/storage.

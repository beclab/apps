metadata:
  title: MacOS
  description: Olares 上で MacOS を実行

spec:
  fullDescription: |
    このアプリは Olares 上で Macos を実行するのに役立ちます。
    Docker コンテナ内の dockur の MacOS をベースにしています。

    **機能**
    - KVM アクセラレーション
    - Web ベースのビューア  
    - 自動ダウンロード

    **対応 MasOS	バージョン**
    - macOS 14
    - macOS 13
    - macOS 12
    - macOS 11
  upgradeDescription: |
    v1.0.14: 永続 VM データを `appCache` に維持（appData 移行なし）。control-plane（master）のみにスケジュール。

    ストレージ: 永続ボリュームを `appCache` から `appData` へ移動。アップグレード後の初回起動時、宛先が空なら initContainers がレガシー appCache 内容を appData へコピー（マーカー: `.migration_from_appcache_storage_done`）。ロールバック用に古い appCache データは残します。

    VM ディスクストレージを appCache ルートから appData/storage へ移動。

metadata:
  title: MacOS
  description: Ejecutar MacOS en Olares

spec:
  fullDescription: |
    Esta app te ayuda a ejecutar Macos en Olares.
    Basada en MacOS de dockur dentro de un contenedor Docker.

    **Funciones**
    - Aceleración KVM
    - Visor basado en web  
    - Descarga automática

    **Versiones MasOS	compatibles**
    - macOS 14
    - macOS 13
    - macOS 12
    - macOS 11
  upgradeDescription: |
    v1.0.14: Mantener datos durables de la VM en `appCache` (sin migración a appData); programar solo en control-plane (master).

    Almacenamiento: volúmenes durables movidos de `appCache` a `appData`. En el primer arranque tras la actualización, initContainers copian el contenido legado de appCache a appData si el destino está vacío (marcador: `.migration_from_appcache_storage_done`). Los datos antiguos de appCache se conservan para rollback.

    El almacenamiento del disco VM se movió de la raíz de appCache a appData/storage.

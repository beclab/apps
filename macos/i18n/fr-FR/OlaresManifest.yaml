metadata:
  title: MacOS
  description: Exécuter MacOS sur Olares

spec:
  fullDescription: |
    Cette app vous aide à exécuter Macos sur Olares.
    Basée sur MacOS de dockur dans un conteneur Docker.

    **Fonctionnalités**
    - Accélération KVM
    - Visionneuse web  
    - Téléchargement automatique

    **Versions MasOS	prises en charge**
    - macOS 14
    - macOS 13
    - macOS 12
    - macOS 11
  upgradeDescription: |
    v1.0.14 : Conserver les données durables de la VM sur `appCache` (pas de migration appData) ; planifier uniquement sur le control-plane (master).

    Stockage : volumes durables déplacés de `appCache` vers `appData`. Au premier démarrage après la mise à niveau, les initContainers copient le contenu legacy d’appCache vers appData si la destination est vide (marqueur : `.migration_from_appcache_storage_done`). Les anciennes données appCache sont conservées pour un rollback.

    Le stockage du disque VM est passé de la racine appCache vers appData/storage.

metadata:
  description: "Generic vLLM engine base. Pick any HuggingFace Safetensors model at install via env."
  title: vLLM Engine Base

spec:
  upgradeDescription: |
    Upgrade vLLM from v0.31.0 to v0.32.0. Chart 1.2.32.

    **What's Changed** (relevant to Olares)

    v0.32.0
    - New models: EmbeddingGemma 2 (text, image, audio, and video embeddings), MiniCPM-V 4.7, and Nemotron 3.5 ASR. The new `POST /v1/systemone` endpoint serves structured `choice`, `noul`, and `score` decisions, including Cloudflare Clef Omni and LiquidAI d1-3B. The generic `hf` tool and reasoning parser reads a checkpoint's `response_template`, so models that ship one need no model-specific parser.
    - NVFP4 KV cache now runs on SM8x, SM90, and SM12x. GLM-5.x defaults to an FP8 KV cache on SM100, about half the KV memory per rank. `fp8_ds_mla` on SM90 gives GLM-5.3-Flash up to 31% more output throughput. HiSparse can cache per-request residency and report up to 58% more throughput for GLM-5.3-NVFP4 on B200 when long contexts stay on the GPU.
    - Faster startup: `vllm download-kernels` installs FlashInfer's precompiled kernels, and `vllm preload --preload-autotune` keeps the FlashInfer autotune table warm across restarts. A shared-memory tensor arena is on by default. With `--api-server-count` above 1, each connection goes to the least-loaded API worker.
    - Security: chat templates are checked statically and rendered under a timeout, and a request-supplied `chat_template` is rejected. Default CORS no longer allows every origin; set `--allowed-origins` for browser clients. Untrusted images are limited to raster formats. JSON schemas nested more than 64 levels return HTTP 400.
    - Breaking: Python 3.10 is no longer supported (the official CUDA image already requires Python 3.11 or newer). `max_tokens` is an upper bound on output and is no longer reserved from the context window, so long prompts that used to be rejected can now run. Cascade attention is removed (`--disable-cascade-attn` only warns). `mamba_cache_mode="all"` is removed. The torch.compile sequence-parallelism and AsyncTP passes are removed; model-level sequence parallelism is unchanged. Responses API reasoning stream events are renamed from `response.reasoning_part.added/done` to `response.content_part.added/done` with `part.type="reasoning_text"`.

    For detailed release notes, visit:
    https://github.com/vllm-project/vllm/releases
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo>`. The HuggingFace source to download your model, for example `hf://Qwen/Qwen3.5-2B`. Use a repo that contains `.safetensors` weight files. Optionally append `--include <file>` or `--revision <sha>`.
    - `MODEL_NAME`: `owner/repo`. The name of your model — use the string after `hf://` in `MODEL_SOURCE`, for example `Qwen/Qwen3.5-2B`. This is also used as the OpenAI alias and vLLM `--model`.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; for embedding, the chart auto-adds `--task embed`.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports.
    - `ENGINE_ARGS`: `--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --enable-prefix-caching --kv-cache-dtype fp8`. Extra vLLM CLI flags. Separate multiple `--key value` pairs with spaces. See https://docs.vllm.ai/en/v0.17.0/configuration/engine_args/.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `VLLM_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On `nvidia` sets `nvidia.com/gpumem`; on `nvidia-gb10` sizes pod memory for gpu-inject.

    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then vLLM starts serving the model when it's ready. Both containers run in the same Pod and share the model directory and readiness sentinel.

    **Stack**
    - **vLLM** (port 8000): runs the model and serves API requests
    - **llm-init** (port 8090): downloads the model, shows progress, and provides the OpenAI API, proxying to vLLM

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `VLLM_REQUIRED_GPU_MEMORY`; tune `--gpu-memory-utilization` in ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Same as `nvidia`; `--gpu-memory-utilization` from ENGINE_ARGS (not auto-remapped) |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - vLLM model loading can take several minutes for large models. Keep the app Running until ready.
    - For high-concurrency workloads, vLLM's PagedAttention delivers strong throughput; tune `--max-num-batched-tokens` and `--gpu-memory-utilization` in `ENGINE_ARGS`.

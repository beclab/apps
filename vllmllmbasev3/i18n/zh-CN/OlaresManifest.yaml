metadata:
  description: "通用 vLLM 引擎基座。在安装时通过环境变量选择任意 HuggingFace Safetensors 模型。"
  title: vLLM 引擎基座

spec:
  upgradeDescription: |
    将 vLLM 从 v0.27.1 升级至 v0.29.0。Chart 1.2.29。

    **更新内容**（与 Olares 相关）

    v0.29.0
    - Model Runner V2 成为所有模型的默认运行器；新增 CUDA graph 显存分析、prompt embeds、分片采样和更完整的推测解码支持
    - 新增 Hy4-preview、Qwen3.8-Flash-Next、GraniteSWA/MoeSWA、NemotronH Omni Reasoning V3、Kimi K3 NVFP4、DeepSeek backbone embedding 和 FP8 ModernBERT
    - 优化 Kimi K3、DeepSeek V4、Mamba prefix caching、多模态/视频输入、LoRA 和 RL 权重同步
    - FlashInfer all-reduce 默认启用；prefix cache 哈希改为确定性；新增请求队列准入控制
    - 破坏性变更：移除十个弃用的模型架构和 PyAV 后端；弃用 Python API server 模块并推荐 `vllm serve`；Model Runner V1 进入弃用阶段

    v0.28.0
    - 优化 Kimi K3、DeepSeek V4 内核、推测解码，以及 Model Runner V2 的 E/P/D 解耦
    - 新增支持磁盘和可插拔二级 tier 的分层 KV offloading，以及 Rust 前端 gRPC 控制
    - `max_num_batched_tokens` 默认值提升至 16384，Mamba prefix caching 默认启用
    - 增强 ROCm gfx11/gfx950、Intel XPU、CPU MLA 和 Blackwell 支持
    - 破坏性变更：bitsandbytes 移至独立插件；要求 Transformers 5.15.0

    v0.27.1
    - 补丁版本：支持量化 DSpark Markov heads

    v0.27.0
    - 主要改进包括 Kimi K3、Qwen3.5、DeepSeek V4、Model Runner V2、SM100 FlashAttention 4、KV offloading 和 Rust 前端，并升级至 PyTorch 2.13.0

    详细发布说明请访问：
    https://github.com/vllm-project/vllm/releases
  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<仓库>`。HuggingFace 模型下载源，例如 `hf://Qwen/Qwen3.5-2B`。请选择包含 `.safetensors` 权重文件的仓库。可选追加 `--include <文件>` 或 `--revision <sha>`。
    - `MODEL_NAME`：`owner/repo`。模型名称，取 `MODEL_SOURCE` 中 `hf://` 之后的字符串，例如 `Qwen/Qwen3.5-2B`。此项也作为 OpenAI 别名和 vLLM `--model` 参数。
    - `MODEL_MODE`：`chat` 或 `embedding`。对话模型选 `chat`；向量模型选 embedding 时，图表会自动添加 `--task embed`。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能。
    - `ENGINE_ARGS`：`--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --enable-prefix-caching --kv-cache-dtype fp8`。vLLM 额外 CLI 参数，多个 `--key value` 之间用空格分隔。详见 https://docs.vllm.ai/en/v0.17.0/configuration/engine_args/。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。llm-init 容器的日志等级。
    - `VLLM_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型所需显存。`nvidia` 下设置 `nvidia.com/gpumem`；`nvidia-gb10` 下设置 pod 内存供 gpu-inject 切分。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 vLLM 在模型准备好后启动服务。两个容器运行在同一 Pod 内，共享模型目录与就绪 sentinel。

    **技术栈说明**
    - **vLLM**（8000 端口）：运行模型并通过 API 提供服务
    - **llm-init**（8090 端口）：下载模型、展示进度，并通过 OpenAI API 代理到 vLLM

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `VLLM_REQUIRED_GPU_MEMORY`；可在 ENGINE_ARGS 中调整 `--gpu-memory-utilization` |
    | `nvidia-gb10`  | GPU (Spark)      | 与 `nvidia` 相同；`--gpu-memory-utilization` 由 ENGINE_ARGS 指定（不自动换算） |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - vLLM 加载大模型可能需要数分钟，请保持应用 Running 直至就绪
    - 高并发场景下，vLLM 的 PagedAttention 可提供出色吞吐；可在 `ENGINE_ARGS` 中调整 `--max-num-batched-tokens` 和 `--gpu-memory-utilization`

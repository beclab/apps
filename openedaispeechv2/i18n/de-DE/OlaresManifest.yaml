metadata:
  title: OpenedAI Speech
  description: Ein mit der OpenAI API kompatibler Text-to-Speech-Server mit Coqui AI und/oder piper TTS als Backend
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Bitte beachten Sie, dass dies eine clusterweite App ist. Zur Nutzung benötigen Sie die entsprechende App.

    **ÜBERBLICK**
    OpenedAI Speech ist ein mit der OpenAI API kompatibler Text-to-Speech-Server.
    - Kompatibel mit der OpenAI audio/speech API
    - Stellt den Endpunkt /v1/audio/speech bereit
    - In keiner Weise mit OpenAI verbunden; benötigt keinen OpenAI API Key
    - Ein kostenloser, privater Text-to-Speech-Server mit benutzerdefiniertem Stimmenklonen

    Mehrere Standardstimmen verfügbar:
    - tts-1: alloy, echo, fable, onyx, nova und shimmer
    - tts-1-hd: alloy, echo, fable, onyx, nova und shimmer

    Unterstützt verschiedene Formate
    - Ausgabe in mp3, opus, aac, flac, wav und pcm
    - Geschwindigkeit zwischen 0.25-4.0 (und darüber hinaus) einstellbar
  upgradeDescription: |
    Auf Version 0.18.2 aktualisiert, 2024-08-16

    Docker-Build für amd64 behoben, GitHub Actions erneut überarbeitet und mehr Speicherplatz freigegeben

    Vollständige Versionshinweise unter: https://github.com/matatonic/openedai-speech/releases/tag/0.18.2

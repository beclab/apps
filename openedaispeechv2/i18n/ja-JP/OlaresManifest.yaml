metadata:
  title: OpenedAI Speech
  description: Coqui AI や piper TTS をバックエンドに使用する OpenAI API 互換テキスト読み上げサーバー
spec:
  fullDescription: |
    **重要な注意**
    これはクラスター全体を対象とするアプリです。使用するには対応するアプリが必要です。

    **概要**
    OpenedAI Speech は OpenAI API 互換のテキスト読み上げサーバーです。
    - OpenAI audio/speech API と互換
    - /v1/audio/speech エンドポイントを提供
    - OpenAI とは一切関係がなく、OpenAI API Key は不要
    - カスタム音声クローンに対応した無料でプライベートなテキスト読み上げサーバー

    複数のデフォルト音声を利用可能:
    - tts-1: alloy、echo、fable、onyx、nova、shimmer
    - tts-1-hd: alloy、echo、fable、onyx、nova、shimmer

    各種フォーマットに対応
    - mp3、opus、aac、flac、wav、pcm で応答
    - 速度を 0.25-4.0（およびそれ以上）に調整可能
  upgradeDescription: |
    バージョン 0.18.2（2024-08-16）にアップグレード

    amd64 向け Docker ビルドを修正し、GitHub Actions を再度リファクタリングして、ディスク空き容量を増加

    完全なリリースノート: https://github.com/matatonic/openedai-speech/releases/tag/0.18.2

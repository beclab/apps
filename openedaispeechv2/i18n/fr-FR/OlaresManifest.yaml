metadata:
  title: OpenedAI Speech
  description: Un serveur de synthèse vocale compatible avec la OpenAI API utilisant Coqui AI et/ou piper TTS comme backend
spec:
  fullDescription: |
    **REMARQUE IMPORTANTE**
    Veuillez noter qu’il s’agit d’une application à l’échelle du cluster ; vous aurez besoin de l’application correspondante pour l’utiliser.

    **PRÉSENTATION**
    OpenedAI Speech est un serveur de synthèse vocale compatible avec la OpenAI API.
    - Compatible avec la OpenAI audio/speech API
    - Fournit le point de terminaison /v1/audio/speech
    - N’est affilié d’aucune manière à OpenAI et ne nécessite aucune OpenAI API Key
    - Un serveur de synthèse vocale gratuit et privé avec clonage vocal personnalisé

    Plusieurs voix par défaut disponibles :
    - tts-1 : alloy, echo, fable, onyx, nova et shimmer
    - tts-1-hd : alloy, echo, fable, onyx, nova et shimmer

    Prend en charge divers formats
    - réponse en mp3, opus, aac, flac, wav et pcm
    - vitesse réglable entre 0.25-4.0 (et au-delà)
  upgradeDescription: |
    Mise à niveau vers la version 0.18.2, 2024-08-16

    Correction de la construction Docker pour amd64, nouvelle refactorisation des GitHub Actions et libération d’espace disque

    Notes de version complètes : https://github.com/matatonic/openedai-speech/releases/tag/0.18.2

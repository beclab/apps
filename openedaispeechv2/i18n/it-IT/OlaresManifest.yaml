metadata:
  title: OpenedAI Speech
  description: Un server text-to-speech compatibile con la OpenAI API che utilizza Coqui AI e/o piper TTS come backend
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app a livello di cluster; per utilizzarla è necessaria l'app corrispondente.

    **PANORAMICA**
    OpenedAI Speech è un server text-to-speech compatibile con la OpenAI API.
    - Compatibile con la OpenAI audio/speech API
    - Fornisce l'endpoint /v1/audio/speech
    - Non è affiliato in alcun modo a OpenAI e non richiede una OpenAI API Key
    - Un server text-to-speech gratuito e privato con clonazione vocale personalizzata

    Sono disponibili più voci predefinite:
    - tts-1: alloy, echo, fable, onyx, nova e shimmer
    - tts-1-hd: alloy, echo, fable, onyx, nova e shimmer

    Supporta vari formati
    - risposta in mp3, opus, aac, flac, wav e pcm
    - velocità regolabile tra 0.25-4.0 (e oltre)
  upgradeDescription: |
    Aggiornamento alla versione 0.18.2, 2024-08-16

    Corretta la build Docker per amd64, rifattorizzate nuovamente le GitHub Actions e liberato più spazio su disco

    Note di rilascio complete: https://github.com/matatonic/openedai-speech/releases/tag/0.18.2

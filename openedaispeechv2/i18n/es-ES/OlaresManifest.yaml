metadata:
  title: OpenedAI Speech
  description: Un servidor de texto a voz compatible con la OpenAI API que utiliza Coqui AI y/o piper TTS como backend
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Ten en cuenta que esta es una aplicación de ámbito de clúster; necesitarás la aplicación correspondiente para utilizarla.

    **DESCRIPCIÓN GENERAL**
    OpenedAI Speech es un servidor de texto a voz compatible con la OpenAI API.
    - Compatible con la OpenAI audio/speech API
    - Sirve el endpoint /v1/audio/speech
    - No está afiliado a OpenAI de ninguna manera y no requiere una OpenAI API Key
    - Un servidor de texto a voz gratuito y privado con clonación de voces personalizadas

    Varias voces predeterminadas disponibles:
    - tts-1: alloy, echo, fable, onyx, nova y shimmer
    - tts-1-hd: alloy, echo, fable, onyx, nova y shimmer

    Admite diversos formatos
    - respuesta en mp3, opus, aac, flac, wav y pcm
    - velocidad ajustable entre 0.25-4.0 (y más)
  upgradeDescription: |
    Actualización a la versión 0.18.2, 2024-08-16

    Corregida la compilación de Docker para amd64, refactorizadas de nuevo las GitHub Actions y liberado más espacio en disco

    Notas completas de la versión en: https://github.com/matatonic/openedai-speech/releases/tag/0.18.2

metadata:
  title: Jaaz
  description: Agent de design IA, alternative locale à Lovart
spec:
  fullDescription: |
    Le premier agent créatif multimodal open source au monde, un outil créatif qui privilégie la confidentialité, l'usage local et la facilité d'utilisation, comme alternative à Lovart, Manus et Figma.

    Fonctionnalités clés
    Smart Prompt Agent : Propulsé par des LLM, Jaaz interprète vos idées et génère des prompts optimisés pour la création d'images ou de storyboards de haute qualité.

    Hybrid Model Deployment : Fonctionne avec des modèles locaux via Ollama, ComfyUI et des API distantes comme Replicate, OpenAI ou Claude. Exécutez 100 % en local ou connectez-vous au cloud.

    Accès simple aux API les plus puissantes : Après connexion, vous pouvez utiliser tous les derniers modèles (gpt-image-1, flux kntext, google……)

    Édition interactive d'images : Prend en charge des opérations avancées telles que l'insertion d'objets, le transfert de style et la cohérence multi-personnages via Flux Kontext — le tout contrôlable par chat.

    Infinite Canvas & Storyboarding : Concevez des layouts, planifiez des scènes et créez des flux de storytelling visuel par glisser-déposer.

    (Bientôt) Video Agent：Génération et édition vidéo via des modèles comme Wan2.1, Kling et plus, intégrés de façon transparente à votre flux créatif. Invocation intelligente de workflows ComfyUI personnalisés

  upgradeDescription: |
    Passer l'image du reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) à l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.

    Aligner la version de l'app sur Jaaz upstream v1.0.30 et actualiser l'image runtime.

    **Alignement de version**
    La version de l'app côté utilisateur passe de 1.0.7 à 1.0.30 pour correspondre à la
    version officielle upstream (https://github.com/11cafe/jaaz/releases/tag/v1.0.30).

    - Correction du rendu du mode sombre (commit upstream f5d7fdf, 2025-11-09)
    - Correction du nom de classe du mode sombre (commit upstream 48f4b6e, 2025-11-10)
    - Actualisation de LICENSE (2025-08-27)

    **Points forts repris d'upstream v1.0.8 → v1.0.30**
    - Intégration du modèle Midjourney
    - Génération Magic Image
    - Affichage des crédits / solde dans l'UI
    - Sélection automatique intelligente de plusieurs modèles
    - Outils de génération vidéo
    - Agent de workflows ComfyUI (appeler les workflows ComfyUI comme outils d'agent)
    - Ajout des modèles d'image Bytedance Seed via Volcengine
    - Prise en charge de la connexion cloud pour Flux, Google Imagen 4, Recraft, etc.
    - Expérience canvas améliorée et rendu des résultats d'appels d'outils
    - Nombreuses corrections de génération d'images, d'encodage et de stabilité

metadata:
  title: Jaaz
  description: AI デザインエージェント、Lovart のローカル代替
spec:
  fullDescription: |
    世界初のオープンソース・マルチモーダル創造エージェント。プライバシー・ローカル利用・使いやすさを優先する創造ツールで、Lovart、Manus、Figma の代替です。

    主な機能
    Smart Prompt Agent：LLM 駆動でアイデアを解釈し、高品質な画像やストーリーボード向けに最適化されたプロンプトを生成。

    Hybrid Model Deployment：Ollama、ComfyUI 経由のローカルモデルと、Replicate、OpenAI、Claude などのリモート API に対応。100% ローカル実行もクラウド接続も可能。

    最強 API への簡単アクセス：ログイン後、最新モデル（gpt-image-1、flux kntext、google……）をすべて利用可能。

    インタラクティブ画像編集：オブジェクト挿入、スタイル転送、Flux Kontext による複数キャラクターの一貫性など高度な操作をチャットで制御。

    Infinite Canvas & Storyboarding：ドラッグ＆ドロップでレイアウト設計、シーン計画、ビジュアルストーリーテリングフローを作成。

    （近日）Video Agent：Wan2.1、Kling などのモデルによる動画生成・編集を創造ワークフローにシームレス統合。カスタム ComfyUI ワークフローをインテリジェントに呼び出し

  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。

    アプリバージョンをアップストリーム Jaaz v1.0.30 に合わせ、ランタイムイメージを更新。

    **バージョン整合**
    ユーザー向けアプリバージョンを 1.0.7 から 1.0.30 へ上げ、
    次の公式アップストリームリリースに合わせます： https://github.com/11cafe/jaaz/releases/tag/v1.0.30

    - ダークモード描画を修正（アップストリーム commit f5d7fdf、2025-11-09）
    - ダークモードクラス名を修正（アップストリーム commit 48f4b6e、2025-11-10）
    - LICENSE 更新（2025-08-27）

    **アップストリーム v1.0.8 → v1.0.30 から取り込んだハイライト**
    - Midjourney モデル統合
    - Magic Image 生成
    - UI でのクレジット／残高表示
    - スマートな複数モデル自動選択
    - 動画生成ツール
    - ComfyUI ワークフローエージェント（ComfyUI ワークフローをエージェントツールとして呼び出し）
    - Volcengine 経由で Bytedance Seed 画像モデルを追加
    - Flux、Google Imagen 4、Recraft などのクラウドログイン対応
    - キャンバス体験とツール呼び出し結果の描画を改善
    - 画像生成・エンコード・安定性の多数の修正

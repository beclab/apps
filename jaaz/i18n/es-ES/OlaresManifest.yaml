metadata:
  title: Jaaz
  description: Agente de diseño con IA, alternativa local a Lovart
spec:
  fullDescription: |
    El primer agente creativo multimodal de código abierto del mundo, una herramienta creativa que prioriza la privacidad, el uso local y la facilidad de uso, como alternativa a Lovart, Manus y Figma.

    Funciones clave
    Smart Prompt Agent: Impulsado por LLMs, Jaaz interpreta tus ideas y genera prompts optimizados para creación de imágenes o storyboards de alta calidad.

    Hybrid Model Deployment: Funciona con modelos locales vía Ollama, ComfyUI y APIs remotas como Replicate, OpenAI o Claude. Ejecuta 100% en local o conéctate a la nube.

    Acceso sencillo a las APIs más potentes: Tras iniciar sesión, puedes usar todos los modelos más recientes (gpt-image-1, flux kntext, google……)

    Edición interactiva de imágenes: Admite operaciones avanzadas como inserción de objetos, transferencia de estilo y coherencia multi-personaje vía Flux Kontext — todo controlable por chat.

    Lienzo infinito y storyboarding: Diseña layouts, planifica escenas y crea flujos de storytelling visual con drag-and-drop.

    (Próximamente) Video Agent：Generación y edición de vídeo mediante modelos como Wan2.1, Kling y más, integrados sin fisuras en tu flujo creativo. Invocación inteligente de workflows ComfyUI personalizados

  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los mounts de la configuración de nginx y las rutas de logs con el layout de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.

    Alinear la versión de la app con Jaaz upstream v1.0.30 y actualizar la imagen de runtime.

    **Alineación de versión**
    La versión de la app visible para el usuario se sube de 1.0.7 a 1.0.30 para coincidir con la
    versión oficial upstream (https://github.com/11cafe/jaaz/releases/tag/v1.0.30).

    - Corrección del renderizado en modo oscuro (commit upstream f5d7fdf, 2025-11-09)
    - Corrección del nombre de clase del modo oscuro (commit upstream 48f4b6e, 2025-11-10)
    - Actualización de LICENSE (2025-08-27)

    **Destacados incorporados desde upstream v1.0.8 → v1.0.30**
    - Integración del modelo Midjourney
    - Generación Magic Image
    - Visualización de créditos / saldo en la UI
    - Selección automática inteligente de múltiples modelos
    - Herramientas de generación de vídeo
    - Agente de workflows ComfyUI (llamar workflows ComfyUI como herramientas de agente)
    - Añadidos modelos de imagen Bytedance Seed vía Volcengine
    - Soporte de login en la nube para Flux, Google Imagen 4, Recraft, etc.
    - Mejor experiencia de lienzo y renderizado de resultados de tool-call
    - Numerosas correcciones de generación de imágenes, codificación y estabilidad

metadata:
  title: Jaaz
  description: Agente di design IA, alternativa locale a Lovart
spec:
  fullDescription: |
    Il primo agente creativo multimodale open-source al mondo, uno strumento creativo che privilegia privacy, uso locale e facilità d'uso, come alternativa a Lovart, Manus e Figma.

    Funzionalità principali
    Smart Prompt Agent: Alimentato da LLM, Jaaz interpreta le tue idee e genera prompt ottimizzati per la creazione di immagini o storyboard di alta qualità.

    Hybrid Model Deployment: Funziona con modelli locali tramite Ollama, ComfyUI e API remote come Replicate, OpenAI o Claude. Esegui al 100% in locale o connettiti al cloud.

    Accesso semplice alle API più potenti: Dopo il login, puoi usare tutti i modelli più recenti (gpt-image-1, flux kntext, google……)

    Editing interattivo delle immagini: Supporta operazioni avanzate come inserimento di oggetti, trasferimento di stile e coerenza multi-personaggio via Flux Kontext — tutto controllabile via chat.

    Infinite Canvas & Storyboarding: Progetta layout, pianifica scene e crea flussi di storytelling visuale con drag-and-drop.

    (In arrivo) Video Agent：Generazione e editing video tramite modelli come Wan2.1, Kling e altri, integrati senza soluzione di continuità nel tuo flusso creativo. Invocazione intelligente di workflow ComfyUI personalizzati

  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico di Bitnami di `OPENRESTY_CONF_FILE`.

    Allineare la versione dell'app a Jaaz upstream v1.0.30 e aggiornare l'immagine runtime.

    **Allineamento della versione**
    La versione dell'app rivolta all'utente passa da 1.0.7 a 1.0.30 per corrispondere al
    rilascio ufficiale upstream (https://github.com/11cafe/jaaz/releases/tag/v1.0.30).

    - Correzione del rendering in dark mode (commit upstream f5d7fdf, 2025-11-09)
    - Correzione del nome della classe dark mode (commit upstream 48f4b6e, 2025-11-10)
    - Aggiornamento LICENSE (2025-08-27)

    **Highlight portati da upstream v1.0.8 → v1.0.30**
    - Integrazione del modello Midjourney
    - Generazione Magic Image
    - Visualizzazione crediti / saldo nella UI
    - Selezione automatica intelligente di più modelli
    - Strumenti di generazione video
    - Agente di workflow ComfyUI (chiamare i workflow ComfyUI come tool agente)
    - Aggiunti modelli immagine Bytedance Seed via Volcengine
    - Supporto al login cloud per Flux, Google Imagen 4, Recraft, ecc.
    - Esperienza canvas migliorata e rendering dei risultati dei tool-call
    - Numerose correzioni su generazione immagini, encoding e stabilità

metadata:
  title: Jaaz
  description: KI-Design-Agent, lokale Alternative zu Lovart
spec:
  fullDescription: |
    Der weltweit erste Open-Source multimodale Kreativ-Agent — ein Kreativtool mit Fokus auf Privatsphäre, lokaler Nutzung und einfacher Bedienung als Alternative zu Lovart, Manus und Figma.

    Hauptfunktionen
    Smart Prompt Agent: Gestützt auf LLMs interpretiert Jaaz Ihre Ideen und erzeugt optimierte Prompts für hochwertige Bild- oder Storyboard-Erstellung.

    Hybrid Model Deployment: Funktioniert mit lokalen Modellen über Ollama, ComfyUI und Remote-APIs wie Replicate, OpenAI oder Claude. 100 % lokal betreiben oder mit der Cloud verbinden.

    Einfacher Zugriff auf die stärksten APIs: Nach dem Login können Sie alle neuesten Modelle nutzen (gpt-image-1, flux kntext, google……)

    Interaktive Bildbearbeitung: Unterstützt erweiterte Operationen wie Objekt-Einfügung, Style-Transfer und Multi-Charakter-Kohärenz via Flux Kontext — alles per Chat steuerbar.

    Infinite Canvas & Storyboarding: Layouts gestalten, Szenen planen und visuelle Storytelling-Flows mit Drag-and-Drop erstellen.

    (Demnächst) Video Agent：Videogenerierung und -bearbeitung über Modelle wie Wan2.1, Kling und mehr, nahtlos in Ihren kreativen Workflow integriert. Intelligenter Aufruf benutzerdefinierter ComfyUI-Workflows

  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.

    App-Version an Upstream Jaaz v1.0.30 angleichen und Runtime-Image aktualisieren.

    **Versionsangleichung**
    Die nutzerseitige App-Version wird von 1.0.7 auf 1.0.30 angehoben, um der
    offiziellen Upstream-Release zu entsprechen (https://github.com/11cafe/jaaz/releases/tag/v1.0.30).

    - Dark-Mode-Rendering behoben (Upstream-Commit f5d7fdf, 2025-11-09)
    - Dark-Mode-Klassenname behoben (Upstream-Commit 48f4b6e, 2025-11-10)
    - LICENSE aktualisiert (2025-08-27)

    **Highlights aus Upstream v1.0.8 → v1.0.30**
    - Midjourney-Modell-Integration
    - Magic Image Generation
    - Credits-/Saldoanzeige in der UI
    - Intelligente automatische Mehrfachmodell-Auswahl
    - Videogenerierungs-Tools
    - ComfyUI-Workflows-Agent (ComfyUI-Workflows als Agent-Tools aufrufen)
    - Bytedance-Seed-Bildmodelle via Volcengine hinzugefügt
    - Cloud-Login-Unterstützung für Flux, Google Imagen 4, Recraft usw.
    - Verbesserte Canvas-Erfahrung und Darstellung von Tool-Call-Ergebnissen
    - Zahlreiche Fixes zu Bildgenerierung, Encoding und Stabilität

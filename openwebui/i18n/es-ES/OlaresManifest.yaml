metadata:
  title: Open WebUI
  description: WebUI fácil de usar para LLMs
spec:
  fullDescription: |
    Open WebUI (antes Ollama WebUI) es una WebUI autoalojada extensible, rica en funciones y fácil de usar, diseñada para operar completamente sin conexión. Admite varios runners de LLM, incluidos Ollama y APIs compatibles con OpenAI. Para más información, consulta nuestra Open WebUI Documentation.

    **Funciones clave de Open WebUI**
    - Integración Ollama/OpenAI API: Integra sin esfuerzo APIs compatibles con OpenAI para conversaciones versátiles junto a modelos Ollama. Personaliza la URL de la API OpenAI para vincular con LMStudio, GroqCloud, Mistral, OpenRouter y más.

    - Pipelines, soporte de plugins de Open WebUI: Integra sin fisuras lógica personalizada y bibliotecas Python en Open WebUI con el Pipelines Plugin Framework. Lanza tu instancia de Pipelines, establece la URL de OpenAI a la URL de Pipelines y explora posibilidades infinitas. Los ejemplos incluyen Function Calling, User Rate Limiting para controlar el acceso, Usage Monitoring con herramientas como Langfuse, Live Translation con LibreTranslate para soporte multilingüe, Toxic Message Filtering y mucho más.

    - Diseño responsive: Disfruta de una experiencia fluida en PC de escritorio, portátil y dispositivos móviles.

    - Progressive Web App (PWA) para móvil: Disfruta de una experiencia similar a una app nativa en tu dispositivo móvil con nuestra PWA, con acceso offline en localhost y una interfaz de usuario fluida.

    - Soporte completo de Markdown y LaTeX: Eleva tu experiencia LLM con capacidades completas de Markdown y LaTeX para una interacción enriquecida.

    - Llamadas de voz/vídeo manos libres: Experimenta una comunicación fluida con funciones integradas de llamada de voz y vídeo manos libres, permitiendo un entorno de chat más dinámico e interactivo.

    - Model Builder: Crea fácilmente modelos Ollama vía la Web UI. Crea y añade personajes/agentes personalizados, personaliza elementos del chat e importa modelos sin esfuerzo mediante la integración de Open WebUI Community.

    - Herramienta nativa de Python Function Calling: Mejora tus LLMs con soporte de editor de código integrado en el workspace de herramientas. Bring Your Own Function (BYOF) simplemente añadiendo tus funciones Python puras, permitiendo una integración fluida con LLMs.

    - Integración RAG local: Sumérgete en el futuro de las interacciones de chat con el innovador soporte de Retrieval Augmented Generation (RAG). Esta función integra sin fisuras las interacciones con documentos en tu experiencia de chat. Puedes cargar documentos directamente en el chat o añadir archivos a tu biblioteca de documentos, accediendo a ellos con el comando # antes de una consulta.

    - Búsqueda web para RAG: Realiza búsquedas web usando proveedores como SearXNG, Google PSE, Brave Search, serpstack, serper, Serply, DuckDuckGo y TavilySearch e inyecta los resultados directamente en tu experiencia de chat.

    - Capacidad de navegación web: Integra sitios web sin fisuras en tu experiencia de chat usando el comando # seguido de una URL. Esta función te permite incorporar contenido web directamente en tus conversaciones, enriqueciendo la riqueza y profundidad de tus interacciones.

    - Integración de generación de imágenes: Incorpora sin fisuras capacidades de generación de imágenes usando opciones como AUTOMATIC1111 API o ComfyUI (local), y DALL-E de OpenAI (externo), enriqueciendo tu experiencia de chat con contenido visual dinámico.

    - Conversaciones con muchos modelos: Interactúa sin esfuerzo con varios modelos simultáneamente, aprovechando sus fortalezas únicas para respuestas óptimas. Mejora tu experiencia aprovechando un conjunto diverso de modelos en paralelo.

    - Control de acceso basado en roles (RBAC): Garantiza un acceso seguro con permisos restringidos; solo personas autorizadas pueden acceder a tu Ollama, y los derechos exclusivos de creación/extracción de modelos están reservados a los administradores.

    - Soporte multilingüe: Experimenta Open WebUI en tu idioma preferido con nuestro soporte de internacionalización (i18n). ¡Únete a expandir nuestros idiomas admitidos! Buscamos activamente colaboradores.

    - Actualizaciones continuas: Estamos comprometidos a mejorar Open WebUI con actualizaciones regulares, correcciones y nuevas funciones.
  upgradeDescription: |
    Chart **1.0.44** — Open WebUI **v0.11.3**.
    - **Imagen:** `docker.io/openwebui/open-webui:0.11.3`
    - **Inicio / env:** no se requiere cambio del chart. La imagen sigue escuchando en **8080**, arranca con `bash start.sh` y guarda datos en `/app/backend/data`. Los ajustables existentes (`ENABLE_ORJSON`, `THREAD_POOL_SIZE`, `ENABLE_BASE_MODELS_CACHE`, `MODELS_CACHE_TTL`, SQLite WAL / `busy_timeout`, stream chunking, WebSocket heartbeat, `WEBUI_SECRET_KEY_FILE`, Hugging Face, DB backup) siguen válidos. `USER_AGENT` es ahora `OpenWebUI/0.11.3`. No se añadió env de instalación nueva; ninguno de los nombres de env editables de Olares cambió.
    - **Ruta de actualización:** siguiente chart tras el publicado **1.0.43 / v0.11.1**. La actualización directa desde **v0.10.x** también funciona; Alembic ahora se ejecuta hasta completarse.

    Empaquetado (chart Olares)
    - **Copia de seguridad de BD antes de actualizar (activa por defecto):** **`ENABLE_WEBUI_DB_BACKUP`** es **`true`** por defecto. En cada nueva versión del chart, antes de que arranque la app, si existe `webui.db` y aún no está `data/backups/webui_chart_<chart-version>.db`, el init container lo copia una vez (mismo volumen appData). Establece **`false`** en Ajustes → Aplicación → Variables de entorno **antes** de actualizar para omitirlo.
    - **Clave de sesión persistente (activa por defecto):** **`ENABLE_WEBUI_SECRET_KEY_PERSIST`** permanece **`true`** vía `data/.webui_secret_key` en appData.
    - **Datos existentes:** Tu base de datos bajo appData se conserva; Open WebUI actualiza su esquema automáticamente al arrancar.

    Open WebUI v0.11.1 → v0.11.3 — destacados
    - Los upgrades de base de datos fallidos ahora abortan en el error real de migración en lugar de arrancar a medias (el fallo `chat.timer_at` / tabla faltante en upstream v0.11.2).
    - Las ramas de chat permanecen conectadas tras recargas; los chats ya rotos se reparan al abrirse.
    - Vistas previas de archivos de terminal más ricas (Word / diapositivas como documentos finales, miniaturas de página clicables).
    - Menos sobrecarga por mensaje cuando Pipelines no está configurado (el valor por defecto); refrescos de lista de modelos más ligeros en instalaciones multi-worker.
    - Nuevo hook de filtro `request` (se ejecuta justo antes de cada llamada al modelo, también tras el uso de herramientas); filtros `inlet` / `stream` / `outlet` existentes sin cambios.
    - Ajuste de familia tipográfica de la interfaz; High Contrast Mode renombrado a **Accessibility Mode** (mismo interruptor); mayor contraste en menús y selector de modelos.
    - Correcciones: rotura de respuesta a mitad del chat, stall del stream de modelos de razonamiento, pensamientos que se filtran a la respuesta tras el uso de herramientas, stop entre instancias respaldadas por Redis, modelos deshabilitados que desaparecen, bugs de calendario / programación de automatizaciones, y más.
    - Correcciones de seguridad y control de acceso; actualiza los despliegues de producción con prontitud.
    - **Cambiado:** los eventos de calendario no pueden repetirse más de una vez al día.
    - Notas de versión completas: https://github.com/open-webui/open-webui/releases/tag/v0.11.2 y https://github.com/open-webui/open-webui/releases/tag/v0.11.3

    Chart **1.0.43** — Open WebUI **v0.11.1**.
    - **Imagen:** `docker.io/beclab/open-webui-open-webui:v0.11.1`
    - Transmitir respuestas como deltas de texto en lugar de reenviar el mensaje completo en cada actualización (menos trabajo del hilo principal del navegador en respuestas largas).
    - `ENABLE_ORJSON=true`, `THREAD_POOL_SIZE=256`, `ENABLE_BASE_MODELS_CACHE=true`, `MODELS_CACHE_TTL=300`.
    - Limitar escrituras de presencia (`DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300`) y heartbeats WebSocket (`WEBSOCKET_HEARTBEAT_INTERVAL=60`).
    - Agrupar tokens de stream (`CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=7`) para que la UI no se redibuje en cada token.
    - Subir el límite de CPU de 2 a 4 núcleos para que la ingestión de documentos y la web UI no se privan mutuamente.

    Chart **1.0.42** (Open WebUI **v0.11.0**).
    - Subir el `busy_timeout` de SQLite a 30s para que los heartbeats WebSocket esperen a los escritores de knowledge-ingest en lugar de registrar `database is locked`.
    - El sidecar seed consulta cada 60s (300s en idle) en lugar de cada 10s, y usa los mismos pragmas WAL / busy_timeout.

    Open WebUI v0.11.0 → v0.11.1 — destacados
    - Streaming delta, logging más barato, rutas más rápidas de lista de modelos / permisos / JSON; la búsqueda de knowledge ya no bloquea otros chats.
    - Correcciones de seguridad y control de acceso; actualiza los despliegues de producción con prontitud.
    - Notas de versión completas: https://github.com/open-webui/open-webui/releases/tag/v0.11.1

    Open WebUI v0.10.2 → v0.11.0 — destacados

    **Funciones principales**
    - **UI rediseñada** en chat, admin, menús y ajustes (columna de conversación más estrecha, tipografía más ligera, ajustes reordenados).
    - **Sub-agentes:** los modelos pueden pasar trabajo a agentes auxiliares en segundo plano (`ENABLE_SUBAGENTS` y ajustes relacionados).
    - **Páginas de carpetas, temporizadores de chat, destinos de notificación / notificaciones del asistente,** compartir enlaces abiertos para chats (permiso de admin, desactivado por defecto).
    - **Variables de chat y usuario,** sincronización de grupos LDAP, colaboración en carpetas compartidas, fork / compact / previsualizaciones de chat, atajos de teclado personalizables.
    - **Capacidad de archivos** para buscar adjuntos por significado o texto; notas con chat completo + adjuntos; opciones de búsqueda web OpenSERP y SearXNG con certificado de cliente.
    - **Panel de uso personal,** memories en ajustes, importar notas/automatizaciones, mejoras de passthrough / reasoning / salida estructurada de Anthropic.

    **Seguridad**
    - Correcciones de seguridad y control de acceso (aislamiento de vista previa HTML del terminal, XSS matemático, parsing de subidas, comprobaciones de propiedad del chat, auth de versión de Ollama, y más). Se recomienda actualizar los despliegues de producción con prontitud.
    - Ver https://github.com/open-webui/open-webui/security

    **Cambiado**
    - Ajustes de admin movidos a la ventana de ajustes; chats archivados bajo Ajustes; títulos automáticos más cortos sin emojis (prompt editable).
    - Campos de tokens de uso: `prompt_tokens` / `completion_tokens` son por la última llamada; usa `input_tokens` / `output_tokens` / `total_tokens` para facturación acumulada.
    - `python-jose` y el emulador de almacenamiento GCS ya no se incluyen en la imagen.

    **Rendimiento**
    - Amplias aceleraciones del lado del servidor para búsqueda de chat, streaming, Redis, listas de modelos, bases de conocimiento, parsing de búsqueda web y manejo de filtros.

    Notas de versión completas: https://github.com/open-webui/open-webui/releases/tag/v0.11.0

metadata:
  title: Open WebUI
  description: Benutzerfreundliche WebUI für LLMs
spec:
  fullDescription: |
    Open WebUI (früher Ollama WebUI) ist eine erweiterbare, funktionsreiche und benutzerfreundliche selbst gehostete WebUI, die vollständig offline betrieben werden kann. Sie unterstützt verschiedene LLM-Runner, einschließlich Ollama und OpenAI-kompatibler APIs. Weitere Informationen finden Sie in unserer Open WebUI Documentation.

    **Hauptfunktionen von Open WebUI**
    - Ollama/OpenAI-API-Integration: Integrieren Sie mühelos OpenAI-kompatible APIs für vielseitige Gespräche neben Ollama-Modellen. Passen Sie die OpenAI-API-URL an, um mit LMStudio, GroqCloud, Mistral, OpenRouter und mehr zu verbinden.

    - Pipelines, Open WebUI Plugin-Unterstützung: Integrieren Sie benutzerdefinierte Logik und Python-Bibliotheken nahtlos in Open WebUI mit dem Pipelines Plugin Framework. Starten Sie Ihre Pipelines-Instanz, setzen Sie die OpenAI-URL auf die Pipelines-URL und entdecken Sie endlose Möglichkeiten. Beispiele umfassen Function Calling, User Rate Limiting zur Zugriffskontrolle, Usage Monitoring mit Tools wie Langfuse, Live Translation mit LibreTranslate für Mehrsprachigkeit, Toxic Message Filtering und vieles mehr.

    - Responsives Design: Nahtloses Erlebnis auf Desktop-PC, Laptop und Mobilgeräten.

    - Progressive Web App (PWA) für Mobilgeräte: Native App-ähnliche Erfahrung auf dem Mobilgerät mit unserer PWA, Offline-Zugriff auf localhost und nahtloser Benutzeroberfläche.

    - Volle Markdown- und LaTeX-Unterstützung: Bereichern Sie Ihr LLM-Erlebnis mit umfassenden Markdown- und LaTeX-Funktionen.

    - Freihändige Sprach-/Videoanrufe: Nahtlose Kommunikation mit integrierten freihändigen Sprach- und Videoanruffunktionen für eine dynamischere und interaktivere Chat-Umgebung.

    - Model Builder: Erstellen Sie Ollama-Modelle einfach über die Web-UI. Erstellen und fügen Sie benutzerdefinierte Charaktere/Agenten hinzu, passen Sie Chat-Elemente an und importieren Sie Modelle mühelos über die Open WebUI Community-Integration.

    - Native Python Function Calling Tool: Erweitern Sie Ihre LLMs mit integrierter Code-Editor-Unterstützung im Tools-Workspace. Bring Your Own Function (BYOF) — fügen Sie einfach Ihre reinen Python-Funktionen hinzu für nahtlose Integration mit LLMs.

    - Lokale RAG-Integration: Tauchen Sie in die Zukunft der Chat-Interaktionen mit bahnbrechender Retrieval Augmented Generation (RAG)-Unterstützung ein. Diese Funktion integriert Dokumentinteraktionen nahtlos in Ihr Chat-Erlebnis. Laden Sie Dokumente direkt in den Chat oder fügen Sie Dateien zu Ihrer Dokumentbibliothek hinzu und greifen Sie mit dem #-Befehl vor einer Abfrage darauf zu.

    - Websuche für RAG: Führen Sie Websuchen mit Anbietern wie SearXNG, Google PSE, Brave Search, serpstack, serper, Serply, DuckDuckGo und TavilySearch durch und injizieren Sie die Ergebnisse direkt in Ihr Chat-Erlebnis.

    - Web-Browsing-Fähigkeit: Integrieren Sie Websites nahtlos in Ihr Chat-Erlebnis mit dem #-Befehl gefolgt von einer URL. So können Sie Webinhalte direkt in Ihre Gespräche einbeziehen.

    - Bildgenerierungs-Integration: Integrieren Sie Bildgenerierung nahtlos mit Optionen wie AUTOMATIC1111 API oder ComfyUI (lokal) und OpenAIs DALL-E (extern).

    - Gespräche mit vielen Modellen: Interagieren Sie mühelos mit verschiedenen Modellen gleichzeitig und nutzen Sie deren einzigartige Stärken für optimale Antworten.

    - Rollenbasierte Zugriffskontrolle (RBAC): Sicherer Zugriff mit eingeschränkten Berechtigungen; nur autorisierte Personen können auf Ihr Ollama zugreifen, und exklusive Rechte zum Erstellen/Abrufen von Modellen sind Administratoren vorbehalten.

    - Mehrsprachige Unterstützung: Erleben Sie Open WebUI in Ihrer bevorzugten Sprache mit unserer Internationalisierung (i18n). Helfen Sie mit, unterstützte Sprachen zu erweitern! Wir suchen aktiv Mitwirkende!

    - Kontinuierliche Updates: Wir verbessern Open WebUI kontinuierlich mit regelmäßigen Updates, Fixes und neuen Funktionen.
  upgradeDescription: |
    Chart **1.0.44** — Open WebUI **v0.11.3**.
    - **Image:** `docker.io/openwebui/open-webui:0.11.3`
    - **Startup / Env:** keine Chart-Änderung erforderlich. Das Image lauscht weiterhin auf **8080**, startet mit `bash start.sh` und speichert Daten unter `/app/backend/data`. Bestehende Einstellungen (`ENABLE_ORJSON`, `THREAD_POOL_SIZE`, `ENABLE_BASE_MODELS_CACHE`, `MODELS_CACHE_TTL`, SQLite WAL / `busy_timeout`, Stream-Chunking, WebSocket-Heartbeat, `WEBUI_SECRET_KEY_FILE`, Hugging Face, DB-Backup) bleiben gültig. `USER_AGENT` ist nun `OpenWebUI/0.11.3`. Keine neuen Installations-Env hinzugefügt; keine der editierbaren Olares-Env-Namen geändert.
    - **Upgrade-Pfad:** nächstes Chart nach veröffentlichtem **1.0.43 / v0.11.1**. Direktes Upgrade von **v0.10.x** funktioniert ebenfalls; Alembic läuft nun bis zum Abschluss.

    Paketiert (Olares-Chart)
    - **DB-Backup vor Upgrade (standardmäßig an):** **`ENABLE_WEBUI_DB_BACKUP`** ist standardmäßig **`true`**. Bei jeder neuen Chart-Version kopiert der Init-Container vor dem App-Start `webui.db` einmal, wenn vorhanden und `data/backups/webui_chart_<chart-version>.db` noch fehlt (gleiches appData-Volume). Setzen Sie **`false`** unter Einstellungen → Anwendung → Umgebungsvariablen **vor** dem Upgrade zum Überspringen.
    - **Persistenter Session-Key (standardmäßig an):** **`ENABLE_WEBUI_SECRET_KEY_PERSIST`** bleibt **`true`** über `data/.webui_secret_key` auf appData.
    - **Bestehende Daten:** Ihre Datenbank unter appData bleibt erhalten; Open WebUI aktualisiert sein Schema beim Start automatisch.

    Open WebUI v0.11.1 → v0.11.3 — Highlights
    - Fehlgeschlagene Datenbank-Upgrades brechen nun am echten Migrationsfehler ab statt halb aktualisiert zu starten (der `chat.timer_at` / fehlende-Tabelle-Fehler in Upstream v0.11.2).
    - Chat-Branches bleiben nach Neuladen verbunden; bereits defekte Chats werden beim Öffnen repariert.
    - Reichhaltigere Terminal-Dateivorschauen (Word / Folien als fertige Dokumente, klickbare Seitenvorschauen).
    - Weniger Overhead pro Nachricht, wenn Pipelines nicht konfiguriert sind (Standard); leichtere Modelllisten-Aktualisierungen bei Multi-Worker-Installationen.
    - Neuer Filter-Hook `request` (läuft direkt vor jedem Modellaufruf, auch nach Tool-Nutzung); bestehende `inlet` / `stream` / `outlet`-Filter unverändert.
    - Einstellung für Interface-Schriftfamilie; High Contrast Mode in **Accessibility Mode** umbenannt (gleicher Schalter); stärkerer Kontrast in Menüs und Modellauswahl.
    - Fixes: Antwortabbruch mitten im Chat, Stall des Reasoning-Modell-Streams, Gedanken, die nach Tool-Nutzung in die Antwort lecken, Stop über Redis-gestützte Instanzen, verschwindende deaktivierte Modelle, Kalender-/Automatisierungsplanungsbugs und mehr.
    - Sicherheits- und Zugriffskontroll-Fixes; Produktionsdeployments zeitnah aktualisieren.
    - **Geändert:** Kalenderereignisse können sich nicht häufiger als einmal täglich wiederholen.
    - Vollständige Release Notes: https://github.com/open-webui/open-webui/releases/tag/v0.11.2 und https://github.com/open-webui/open-webui/releases/tag/v0.11.3

    Chart **1.0.43** — Open WebUI **v0.11.1**.
    - **Image:** `docker.io/beclab/open-webui-open-webui:v0.11.1`
    - Antworten als Text-Deltas streamen statt die gesamte Nachricht bei jedem Update erneut zu senden (weniger Browser-Main-Thread-Last bei langen Antworten).
    - `ENABLE_ORJSON=true`, `THREAD_POOL_SIZE=256`, `ENABLE_BASE_MODELS_CACHE=true`, `MODELS_CACHE_TTL=300`.
    - Presence-Writes drosseln (`DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300`) und WebSocket-Heartbeats (`WEBSOCKET_HEARTBEAT_INTERVAL=60`).
    - Stream-Tokens bündeln (`CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=7`), damit die UI nicht bei jedem Token neu gezeichnet wird.
    - CPU-Limit von 2 auf 4 Kerne erhöhen, damit Dokument-Ingest und Web-UI sich nicht gegenseitig aushungern.

    Chart **1.0.42** (Open WebUI **v0.11.0**).
    - SQLite `busy_timeout` auf 30s erhöhen, damit WebSocket-Heartbeats auf Knowledge-Ingest-Writer warten statt `database is locked` zu loggen.
    - Seed-Sidecar pollt alle 60s (300s im Idle) statt alle 10s und nutzt dieselben WAL-/busy_timeout-Pragmas.

    Open WebUI v0.11.0 → v0.11.1 — Highlights
    - Delta-Streaming, günstigeres Logging, schnellere Modelllisten-/Berechtigungs-/JSON-Pfade, Knowledge-Suche blockiert andere Chats nicht mehr.
    - Sicherheits- und Zugriffskontroll-Fixes; Produktionsdeployments zeitnah aktualisieren.
    - Vollständige Release Notes: https://github.com/open-webui/open-webui/releases/tag/v0.11.1

    Open WebUI v0.10.2 → v0.11.0 — Highlights

    **Hauptfunktionen**
    - **Neugestaltete UI** für Chat, Admin, Menüs und Einstellungen (schmalere Gesprächsspalte, leichtere Typografie, umgeordnete Einstellungen).
    - **Sub-Agents:** Modelle können Arbeit an Hintergrund-Hilfsagenten übergeben (`ENABLE_SUBAGENTS` und verwandte Einstellungen).
    - **Ordnerseiten, Chat-Timer, Benachrichtigungsziele / Assistenten-Benachrichtigungen,** offenes Link-Sharing für Chats (Admin-Berechtigung, standardmäßig aus).
    - **Chat- & Benutzervariablen,** LDAP-Gruppensync, Shared-Folder-Zusammenarbeit, Chat-Fork / Compact / Vorschauen, anpassbare Tastenkürzel.
    - **Dateien-Funktion** zum Suchen von Anhängen nach Bedeutung oder Text; Notizen mit vollständigem Chat + Anhängen; OpenSERP- und SearXNG-Client-Zertifikat-Websuchoptionen.
    - **Persönliches Nutzungs-Dashboard,** Memories in Einstellungen, Import von Notizen/Automatisierungen, Anthropic-Passthrough- / Reasoning- / Structured-Output-Verbesserungen.

    **Sicherheit**
    - Sicherheits- und Zugriffskontroll-Fixes (Terminal-HTML-Vorschau-Isolation, Math-XSS, Upload-Parsing, Chat-Eigentumsprüfungen, Ollama-Versions-Auth und mehr). Zeitnahe Aktualisierung von Produktionsdeployments empfohlen.
    - Siehe https://github.com/open-webui/open-webui/security

    **Geändert**
    - Admin-Einstellungen in das Einstellungsfenster verschoben; archivierte Chats unter Einstellungen; kürzere Auto-Titel ohne Emojis (Prompt editierbar).
    - Usage-Token-Felder: `prompt_tokens` / `completion_tokens` gelten pro letztem Aufruf; für kumulative Abrechnung `input_tokens` / `output_tokens` / `total_tokens` verwenden.
    - `python-jose` und GCS-Storage-Emulator sind nicht mehr im Image gebündelt.

    **Leistung**
    - Breite serverseitige Beschleunigungen für Chatsuche, Streaming, Redis, Modelllisten, Knowledge Bases, Websuch-Parsing und Filterbehandlung.

    Vollständige Release Notes: https://github.com/open-webui/open-webui/releases/tag/v0.11.0

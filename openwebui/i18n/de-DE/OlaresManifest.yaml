metadata:
  title: Open WebUI
  description: Benutzerfreundliche WebUI für LLMs
spec:
  fullDescription: |
    Open WebUI (früher Ollama WebUI) ist eine erweiterbare, funktionsreiche und benutzerfreundliche selbst gehostete WebUI, die vollständig offline betrieben werden kann. Sie unterstützt verschiedene LLM-Runner, einschließlich Ollama und OpenAI-kompatibler APIs. Weitere Informationen finden Sie in unserer Open WebUI Documentation.

    **Hauptfunktionen von Open WebUI**
    - Ollama/OpenAI-API-Integration: Integrieren Sie mühelos OpenAI-kompatible APIs für vielseitige Gespräche neben Ollama-Modellen. Passen Sie die OpenAI-API-URL an, um mit LMStudio, GroqCloud, Mistral, OpenRouter und mehr zu verbinden.

    - Pipelines, Open WebUI Plugin-Unterstützung: Integrieren Sie benutzerdefinierte Logik und Python-Bibliotheken nahtlos in Open WebUI mit dem Pipelines Plugin Framework. Starten Sie Ihre Pipelines-Instanz, setzen Sie die OpenAI-URL auf die Pipelines-URL und entdecken Sie endlose Möglichkeiten. Beispiele umfassen Function Calling, User Rate Limiting zur Zugriffskontrolle, Usage Monitoring mit Tools wie Langfuse, Live Translation mit LibreTranslate für Mehrsprachigkeit, Toxic Message Filtering und vieles mehr.

    - Responsives Design: Nahtloses Erlebnis auf Desktop-PC, Laptop und Mobilgeräten.

    - Progressive Web App (PWA) für Mobilgeräte: Native App-ähnliche Erfahrung auf dem Mobilgerät mit unserer PWA, Offline-Zugriff auf localhost und nahtloser Benutzeroberfläche.

    - Volle Markdown- und LaTeX-Unterstützung: Bereichern Sie Ihr LLM-Erlebnis mit umfassenden Markdown- und LaTeX-Funktionen.

    - Freihändige Sprach-/Videoanrufe: Nahtlose Kommunikation mit integrierten freihändigen Sprach- und Videoanruffunktionen für eine dynamischere und interaktivere Chat-Umgebung.

    - Model Builder: Erstellen Sie Ollama-Modelle einfach über die Web-UI. Erstellen und fügen Sie benutzerdefinierte Charaktere/Agenten hinzu, passen Sie Chat-Elemente an und importieren Sie Modelle mühelos über die Open WebUI Community-Integration.

    - Native Python Function Calling Tool: Erweitern Sie Ihre LLMs mit integrierter Code-Editor-Unterstützung im Tools-Workspace. Bring Your Own Function (BYOF) — fügen Sie einfach Ihre reinen Python-Funktionen hinzu für nahtlose Integration mit LLMs.

    - Lokale RAG-Integration: Tauchen Sie in die Zukunft der Chat-Interaktionen mit bahnbrechender Retrieval Augmented Generation (RAG)-Unterstützung ein. Diese Funktion integriert Dokumentinteraktionen nahtlos in Ihr Chat-Erlebnis. Laden Sie Dokumente direkt in den Chat oder fügen Sie Dateien zu Ihrer Dokumentbibliothek hinzu und greifen Sie mit dem #-Befehl vor einer Abfrage darauf zu.

    - Websuche für RAG: Führen Sie Websuchen mit Anbietern wie SearXNG, Google PSE, Brave Search, serpstack, serper, Serply, DuckDuckGo und TavilySearch durch und injizieren Sie die Ergebnisse direkt in Ihr Chat-Erlebnis.

    - Web-Browsing-Fähigkeit: Integrieren Sie Websites nahtlos in Ihr Chat-Erlebnis mit dem #-Befehl gefolgt von einer URL. So können Sie Webinhalte direkt in Ihre Gespräche einbeziehen.

    - Bildgenerierungs-Integration: Integrieren Sie Bildgenerierung nahtlos mit Optionen wie AUTOMATIC1111 API oder ComfyUI (lokal) und OpenAIs DALL-E (extern).

    - Gespräche mit vielen Modellen: Interagieren Sie mühelos mit verschiedenen Modellen gleichzeitig und nutzen Sie deren einzigartige Stärken für optimale Antworten.

    - Rollenbasierte Zugriffskontrolle (RBAC): Sicherer Zugriff mit eingeschränkten Berechtigungen; nur autorisierte Personen können auf Ihr Ollama zugreifen, und exklusive Rechte zum Erstellen/Abrufen von Modellen sind Administratoren vorbehalten.

    - Mehrsprachige Unterstützung: Erleben Sie Open WebUI in Ihrer bevorzugten Sprache mit unserer Internationalisierung (i18n). Helfen Sie mit, unterstützte Sprachen zu erweitern! Wir suchen aktiv Mitwirkende!

    - Kontinuierliche Updates: Wir verbessern Open WebUI kontinuierlich mit regelmäßigen Updates, Fixes und neuen Funktionen.
  upgradeDescription: |
    Chart **1.0.49** — Open WebUI **v0.12.4**.
    - Open WebUI wird von v0.12.3 auf v0.12.4 aktualisiert. Dieses Release enthält Sicherheitskorrekturen.
    - Ausgewählte Skills können bei Bedarf geladen werden. Kontextkomprimierung erscheint im Chat, einschließlich der Zusammenfassung, und gilt auch für temporäre Chats und kurze Chats, die das Limit bereits überschreiten.
    - Administratoren können einzelne Steuerelemente ausblenden. Optionen ohne Wirkung werden ausgeblendet, und Freigaben werden in den Access-Einstellungen geändert.
    - Aus einem Ordner kann ein neuer Chat starten. Mehrere Chats in der Seitenleiste lassen sich auswählen und gemeinsam archivieren oder löschen. Dateien lassen sich gesammelt herunterladen oder löschen, und ein Ordner kann eine Beschreibung haben.
    - Solange Direct Integrations aus bleibt, werden gespeicherte Tool-Server und Open-Terminal-Verbindungen erst verwendet, wenn ein Administrator Direct Integrations einschaltet.
    - Der Container nutzt jetzt Python 3.12 auf Debian 13. Eigene Funktionen und pip-Pakete brauchen Python-3.12-Builds.
    - Dieses Release enthält keine neue Datenbankschema-Migration. Konten, Chats, Ordner, Notizen und Dateien aus den vorherigen Versionen bleiben erhalten. Das Chart sichert die SQLite-Datenbank vor dem Start einer neuen Chart-Version, verwendet eine Replik und aktualisiert mit Recreate.
    - https://github.com/open-webui/open-webui/releases/tag/v0.12.4

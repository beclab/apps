metadata:
  title: Open WebUI
  description: WebUI conviviale pour les LLM
spec:
  fullDescription: |
    Open WebUI (anciennement Ollama WebUI) est une WebUI auto-hébergée extensible, riche en fonctionnalités et conviviale, conçue pour fonctionner entièrement hors ligne. Elle prend en charge divers runners LLM, notamment Ollama et les API compatibles OpenAI. Pour plus d'informations, consultez notre Open WebUI Documentation.

    **Fonctionnalités clés d'Open WebUI**
    - Intégration Ollama/OpenAI API : Intégrez sans effort des API compatibles OpenAI pour des conversations polyvalentes aux côtés des modèles Ollama. Personnalisez l'URL de l'API OpenAI pour vous lier à LMStudio, GroqCloud, Mistral, OpenRouter et plus encore.

    - Pipelines, prise en charge des plugins Open WebUI : Intégrez de façon transparente une logique personnalisée et des bibliothèques Python dans Open WebUI à l'aide du Pipelines Plugin Framework. Lancez votre instance Pipelines, définissez l'URL OpenAI sur l'URL Pipelines et explorez des possibilités infinies. Les exemples incluent Function Calling, User Rate Limiting pour contrôler l'accès, Usage Monitoring avec des outils comme Langfuse, Live Translation avec LibreTranslate pour le support multilingue, Toxic Message Filtering et bien plus.

    - Design responsive : Profitez d'une expérience fluide sur PC de bureau, ordinateur portable et appareils mobiles.

    - Progressive Web App (PWA) pour mobile : Profitez d'une expérience de type application native sur votre appareil mobile avec notre PWA, offrant un accès hors ligne sur localhost et une interface utilisateur fluide.

    - Prise en charge complète de Markdown et LaTeX : Enrichissez votre expérience LLM avec des capacités Markdown et LaTeX complètes.

    - Appels vocaux/vidéo mains libres : Communiquez de façon fluide grâce aux fonctions intégrées d'appel vocal et vidéo mains libres, pour un environnement de chat plus dynamique et interactif.

    - Model Builder : Créez facilement des modèles Ollama via la Web UI. Créez et ajoutez des personnages/agents personnalisés, personnalisez les éléments de chat et importez des modèles sans effort via l'intégration Open WebUI Community.

    - Outil natif Python Function Calling : Améliorez vos LLM avec la prise en charge d'un éditeur de code intégré dans l'espace de travail des outils. Bring Your Own Function (BYOF) en ajoutant simplement vos fonctions Python pures.

    - Intégration RAG locale : Plongez dans l'avenir des interactions de chat avec la prise en charge révolutionnaire de Retrieval Augmented Generation (RAG). Chargez des documents directement dans le chat ou ajoutez des fichiers à votre bibliothèque de documents, en y accédant avec la commande # avant une requête.

    - Recherche web pour RAG : Effectuez des recherches web avec des fournisseurs comme SearXNG, Google PSE, Brave Search, serpstack, serper, Serply, DuckDuckGo et TavilySearch et injectez les résultats directement dans votre expérience de chat.

    - Capacité de navigation web : Intégrez des sites web de façon transparente dans votre expérience de chat en utilisant la commande # suivie d'une URL.

    - Intégration de génération d'images : Intégrez des capacités de génération d'images avec des options telles que AUTOMATIC1111 API ou ComfyUI (local), et DALL-E d'OpenAI (externe).

    - Conversations avec de nombreux modèles : Interagissez sans effort avec divers modèles simultanément, en tirant parti de leurs forces uniques pour des réponses optimales.

    - Contrôle d'accès basé sur les rôles (RBAC) : Assurez un accès sécurisé avec des permissions restreintes ; seules les personnes autorisées peuvent accéder à votre Ollama, et les droits exclusifs de création/pull de modèles sont réservés aux administrateurs.

    - Prise en charge multilingue : Découvrez Open WebUI dans votre langue préférée grâce à notre prise en charge de l'internationalisation (i18n). Aidez-nous à élargir les langues prises en charge ! Nous recherchons activement des contributeurs !

    - Mises à jour continues : Nous nous engageons à améliorer Open WebUI avec des mises à jour régulières, des correctifs et de nouvelles fonctionnalités.
  upgradeDescription: |
    Chart **1.0.44** — Open WebUI **v0.11.3**.
    - **Image :** `docker.io/openwebui/open-webui:0.11.3`
    - **Démarrage / env :** aucun changement de chart requis. L'image écoute toujours sur **8080**, démarre avec `bash start.sh` et stocke les données dans `/app/backend/data`. Les réglages existants (`ENABLE_ORJSON`, `THREAD_POOL_SIZE`, `ENABLE_BASE_MODELS_CACHE`, `MODELS_CACHE_TTL`, SQLite WAL / `busy_timeout`, stream chunking, WebSocket heartbeat, `WEBUI_SECRET_KEY_FILE`, Hugging Face, DB backup) restent valides. `USER_AGENT` est désormais `OpenWebUI/0.11.3`. Aucune nouvelle env d'installation ; aucun nom d'env Olares modifiable n'a changé.
    - **Chemin de mise à niveau :** chart suivant après le publié **1.0.43 / v0.11.1**. La mise à niveau directe depuis **v0.10.x** fonctionne aussi ; Alembic s'exécute désormais jusqu'à la fin.

    Empaqueté (chart Olares)
    - **Sauvegarde DB avant mise à niveau (activée par défaut) :** **`ENABLE_WEBUI_DB_BACKUP`** vaut **`true`** par défaut. À chaque nouvelle version de chart, avant le démarrage de l'app, si `webui.db` existe et que `data/backups/webui_chart_<chart-version>.db` n'est pas encore là, l'init container le copie une fois (même volume appData). Définissez **`false`** sous Paramètres → Application → Variables d'environnement **avant** la mise à niveau pour l'ignorer.
    - **Clé de session persistante (activée par défaut) :** **`ENABLE_WEBUI_SECRET_KEY_PERSIST`** reste **`true`** via `data/.webui_secret_key` sur appData.
    - **Données existantes :** Votre base de données sous appData est conservée ; Open WebUI met à jour son schéma automatiquement au démarrage.

    Open WebUI v0.11.1 → v0.11.3 — points forts
    - Les mises à niveau de base de données échouées s'arrêtent désormais sur la vraie erreur de migration au lieu de démarrer à moitié (l'échec `chat.timer_at` / table manquante dans upstream v0.11.2).
    - Les branches de chat restent connectées après rechargement ; les chats déjà cassés sont réparés à l'ouverture.
    - Aperçus de fichiers terminal plus riches (Word / diapositives comme documents finis, miniatures de page cliquables).
    - Moins de surcharge par message lorsque Pipelines n'est pas configuré (par défaut) ; rafraîchissements de liste de modèles plus légers sur les installations multi-workers.
    - Nouveau hook de filtre `request` (s'exécute juste avant chaque appel au modèle, y compris après l'utilisation d'outils) ; filtres `inlet` / `stream` / `outlet` existants inchangés.
    - Réglage de la famille de police de l'interface ; High Contrast Mode renommé en **Accessibility Mode** (même interrupteur) ; contraste renforcé dans les menus et le sélecteur de modèles.
    - Correctifs : interruption de réponse en cours de chat, blocage du stream des modèles de raisonnement, pensées qui fuient dans la réponse après l'utilisation d'outils, stop entre instances Redis, modèles désactivés qui disparaissent, bugs de calendrier / planification d'automatisations, et plus.
    - Correctifs de sécurité et de contrôle d'accès ; mettez à jour rapidement les déploiements de production.
    - **Modifié :** les événements du calendrier ne peuvent pas se répéter plus d'une fois par jour.
    - Notes de version complètes : https://github.com/open-webui/open-webui/releases/tag/v0.11.2 et https://github.com/open-webui/open-webui/releases/tag/v0.11.3

    Chart **1.0.43** — Open WebUI **v0.11.1**.
    - **Image :** `docker.io/beclab/open-webui-open-webui:v0.11.1`
    - Diffuser les réponses en deltas de texte au lieu de renvoyer tout le message à chaque mise à jour.
    - `ENABLE_ORJSON=true`, `THREAD_POOL_SIZE=256`, `ENABLE_BASE_MODELS_CACHE=true`, `MODELS_CACHE_TTL=300`.
    - Limiter les écritures de présence (`DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300`) et les heartbeats WebSocket (`WEBSOCKET_HEARTBEAT_INTERVAL=60`).
    - Regrouper les tokens de stream (`CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=7`).
    - Augmenter la limite CPU de 2 à 4 cœurs.

    Chart **1.0.42** (Open WebUI **v0.11.0**).
    - Augmenter le `busy_timeout` SQLite à 30s afin que les heartbeats WebSocket attendent les écritures d'ingestion de connaissances au lieu de journaliser `database is locked`.
    - Le sidecar seed interroge toutes les 60s (300s en idle) au lieu de toutes les 10s, avec les mêmes pragmas WAL / busy_timeout.

    Open WebUI v0.11.0 → v0.11.1 — points forts
    - Streaming delta, journalisation moins coûteuse, chemins plus rapides liste de modèles / permissions / JSON ; la recherche knowledge ne bloque plus les autres chats.
    - Correctifs de sécurité et de contrôle d'accès ; mettez à jour rapidement les déploiements de production.
    - Notes de version complètes : https://github.com/open-webui/open-webui/releases/tag/v0.11.1

    Open WebUI v0.10.2 → v0.11.0 — points forts

    **Fonctionnalités majeures**
    - **UI redessinée** sur le chat, l'admin, les menus et les paramètres.
    - **Sous-agents :** les modèles peuvent confier du travail à des agents auxiliaires en arrière-plan (`ENABLE_SUBAGENTS` et réglages associés).
    - **Pages de dossiers, chronomètres de chat, cibles de notification / notifications de l'assistant,** partage de liens ouvert pour les chats (permission admin, désactivé par défaut).
    - **Variables de chat et d'utilisateur,** sync de groupes LDAP, collaboration sur dossiers partagés, fork / compact / aperçus de chat, raccourcis clavier personnalisables.
    - **Capacité fichiers** pour rechercher des pièces jointes par sens ou texte ; notes avec chat complet + pièces jointes ; options de recherche web OpenSERP et SearXNG avec certificat client.
    - **Tableau de bord d'utilisation personnel,** memories dans les paramètres, import de notes/automatisations, améliorations Anthropic passthrough / reasoning / structured output.

    **Sécurité**
    - Correctifs de sécurité et de contrôle d'accès (isolation de l'aperçu HTML du terminal, XSS mathématique, parsing des téléversements, contrôles de propriété des chats, auth de version Ollama, et plus). Mise à jour rapide des déploiements de production recommandée.
    - Voir https://github.com/open-webui/open-webui/security

    **Modifié**
    - Paramètres admin déplacés dans la fenêtre des paramètres ; chats archivés sous Paramètres ; titres automatiques plus courts sans emojis (prompt modifiable).
    - Champs de tokens d'usage : `prompt_tokens` / `completion_tokens` sont par dernier appel ; utilisez `input_tokens` / `output_tokens` / `total_tokens` pour la facturation cumulative.
    - `python-jose` et l'émulateur de stockage GCS ne sont plus inclus dans l'image.

    **Performance**
    - Accélérations côté serveur étendues pour la recherche de chat, le streaming, Redis, les listes de modèles, les bases de connaissances, le parsing de recherche web et la gestion des filtres.

    Notes de version complètes : https://github.com/open-webui/open-webui/releases/tag/v0.11.0

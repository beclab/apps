metadata:
  title: Open WebUI
  description: WebUI facile da usare per LLM
spec:
  fullDescription: |
    Open WebUI (precedentemente Ollama WebUI) è una WebUI self-hosted estensibile, ricca di funzionalità e facile da usare, progettata per funzionare completamente offline. Supporta vari runner LLM, tra cui Ollama e API compatibili con OpenAI. Per maggiori informazioni, consulta la nostra Open WebUI Documentation.

    **Funzionalità principali di Open WebUI**
    - Integrazione Ollama/OpenAI API: Integra senza sforzo API compatibili con OpenAI per conversazioni versatili insieme ai modelli Ollama. Personalizza l'URL dell'API OpenAI per collegarti a LMStudio, GroqCloud, Mistral, OpenRouter e altro.

    - Pipelines, supporto plugin Open WebUI: Integra senza soluzione di continuità logica personalizzata e librerie Python in Open WebUI usando il Pipelines Plugin Framework. Avvia la tua istanza Pipelines, imposta l'URL OpenAI sull'URL di Pipelines ed esplora possibilità infinite. Gli esempi includono Function Calling, User Rate Limiting per controllare l'accesso, Usage Monitoring con strumenti come Langfuse, Live Translation con LibreTranslate per il supporto multilingue, Toxic Message Filtering e molto altro.

    - Design responsive: Goditi un'esperienza fluida su PC desktop, laptop e dispositivi mobili.

    - Progressive Web App (PWA) per mobile: Goditi un'esperienza simile a un'app nativa sul tuo dispositivo mobile con la nostra PWA, con accesso offline su localhost e un'interfaccia utente fluida.

    - Supporto completo Markdown e LaTeX: Eleva la tua esperienza LLM con capacità complete di Markdown e LaTeX per un'interazione arricchita.

    - Chiamate vocali/video a mani libere: Sperimenta una comunicazione fluida con funzioni integrate di chiamata vocale e video a mani libere, per un ambiente chat più dinamico e interattivo.

    - Model Builder: Crea facilmente modelli Ollama tramite la Web UI. Crea e aggiungi personaggi/agenti personalizzati, personalizza gli elementi della chat e importa modelli senza sforzo tramite l'integrazione Open WebUI Community.

    - Strumento nativo Python Function Calling: Potenzia i tuoi LLM con supporto editor di codice integrato nel workspace degli strumenti. Bring Your Own Function (BYOF) semplicemente aggiungendo le tue funzioni Python pure, consentendo un'integrazione fluida con gli LLM.

    - Integrazione RAG locale: Immergiti nel futuro delle interazioni chat con il rivoluzionario supporto Retrieval Augmented Generation (RAG). Questa funzione integra senza soluzione di continuità le interazioni con i documenti nella tua esperienza chat. Puoi caricare documenti direttamente nella chat o aggiungere file alla tua libreria documenti, accedendovi con il comando # prima di una query.

    - Ricerca web per RAG: Esegui ricerche web usando provider come SearXNG, Google PSE, Brave Search, serpstack, serper, Serply, DuckDuckGo e TavilySearch e inietta i risultati direttamente nella tua esperienza chat.

    - Capacità di navigazione web: Integra siti web senza soluzione di continuità nella tua esperienza chat usando il comando # seguito da un URL. Questa funzione ti consente di incorporare contenuti web direttamente nelle conversazioni.

    - Integrazione generazione immagini: Incorpora senza soluzione di continuità capacità di generazione immagini usando opzioni come AUTOMATIC1111 API o ComfyUI (locale), e DALL-E di OpenAI (esterno).

    - Conversazioni con molti modelli: Interagisci senza sforzo con vari modelli contemporaneamente, sfruttando i loro punti di forza unici per risposte ottimali.

    - Controllo accessi basato sui ruoli (RBAC): Garantisce un accesso sicuro con permessi ristretti; solo persone autorizzate possono accedere al tuo Ollama, e i diritti esclusivi di creazione/pull dei modelli sono riservati agli amministratori.

    - Supporto multilingue: Vivi Open WebUI nella tua lingua preferita con il nostro supporto di internazionalizzazione (i18n). Unisciti a noi nell'espandere le lingue supportate! Cerchiamo attivamente collaboratori!

    - Aggiornamenti continui: Siamo impegnati a migliorare Open WebUI con aggiornamenti regolari, correzioni e nuove funzionalità.
  upgradeDescription: |
    Chart **1.0.44** — Open WebUI **v0.11.3**.
    - **Immagine:** `docker.io/openwebui/open-webui:0.11.3`
    - **Avvio / env:** nessuna modifica al chart richiesta. L'immagine ascolta ancora su **8080**, si avvia con `bash start.sh` e memorizza i dati in `/app/backend/data`. I parametri esistenti (`ENABLE_ORJSON`, `THREAD_POOL_SIZE`, `ENABLE_BASE_MODELS_CACHE`, `MODELS_CACHE_TTL`, SQLite WAL / `busy_timeout`, stream chunking, WebSocket heartbeat, `WEBUI_SECRET_KEY_FILE`, Hugging Face, DB backup) restano validi. `USER_AGENT` è ora `OpenWebUI/0.11.3`. Nessuna nuova env di installazione; nessuno dei nomi env modificabili di Olares è cambiato.
    - **Percorso di upgrade:** chart successivo dopo il pubblicato **1.0.43 / v0.11.1**. L'upgrade diretto da **v0.10.x** funziona anche; Alembic ora viene eseguito fino al completamento.

    Pacchettizzato (chart Olares)
    - **Backup DB prima dell'upgrade (attivo di default):** **`ENABLE_WEBUI_DB_BACKUP`** è **`true`** di default. A ogni nuova versione del chart, prima dell'avvio dell'app, se esiste `webui.db` e non c'è ancora `data/backups/webui_chart_<chart-version>.db`, l'init container lo copia una volta (stesso volume appData). Imposta **`false`** in Impostazioni → Applicazione → Variabili d'ambiente **prima** dell'upgrade per saltarlo.
    - **Chiave di sessione persistente (attiva di default):** **`ENABLE_WEBUI_SECRET_KEY_PERSIST`** resta **`true`** tramite `data/.webui_secret_key` su appData.
    - **Dati esistenti:** Il database sotto appData viene conservato; Open WebUI aggiorna lo schema automaticamente all'avvio.

    Open WebUI v0.11.1 → v0.11.3 — highlight
    - Gli upgrade del database falliti ora si interrompono sull'errore reale di migrazione invece di avviarsi a metà (il fallimento `chat.timer_at` / tabella mancante in upstream v0.11.2).
    - I branch della chat restano connessi dopo i reload; le chat già rotte vengono riparate all'apertura.
    - Anteprime file del terminale più ricche (Word / slide come documenti finiti, miniature di pagina cliccabili).
    - Meno overhead per messaggio quando Pipelines non è configurato (il default); refresh più leggeri della lista modelli su installazioni multi-worker.
    - Nuovo hook filtro `request` (viene eseguito subito prima di ogni chiamata al modello, anche dopo l'uso di tool); filtri `inlet` / `stream` / `outlet` esistenti invariati.
    - Impostazione della famiglia di font dell'interfaccia; High Contrast Mode rinominato in **Accessibility Mode** (stesso interruttore); contrasto più forte nei menu e nel selettore modelli.
    - Fix: interruzione della risposta a metà chat, stall dello stream dei modelli di reasoning, pensieri che filtrano nella risposta dopo l'uso di tool, stop tra istanze Redis-backed, modelli disabilitati che scompaiono, bug di calendario / pianificazione automazioni, e altro.
    - Fix di sicurezza e controllo accessi; aggiorna tempestivamente i deployment di produzione.
    - **Modificato:** gli eventi del calendario non possono ripetersi più di una volta al giorno.
    - Note di rilascio complete: https://github.com/open-webui/open-webui/releases/tag/v0.11.2 e https://github.com/open-webui/open-webui/releases/tag/v0.11.3

    Chart **1.0.43** — Open WebUI **v0.11.1**.
    - **Immagine:** `docker.io/beclab/open-webui-open-webui:v0.11.1`
    - Stream delle risposte come delta di testo invece di reinviare l'intero messaggio a ogni aggiornamento.
    - `ENABLE_ORJSON=true`, `THREAD_POOL_SIZE=256`, `ENABLE_BASE_MODELS_CACHE=true`, `MODELS_CACHE_TTL=300`.
    - Throttle delle scritture di presenza (`DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300`) e heartbeat WebSocket (`WEBSOCKET_HEARTBEAT_INTERVAL=60`).
    - Batch dei token di stream (`CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=7`).
    - Aumento del limite CPU da 2 a 4 core.

    Chart **1.0.42** (Open WebUI **v0.11.0**).
    - Aumento del `busy_timeout` SQLite a 30s, così gli heartbeat WebSocket attendono le scritture di knowledge ingest invece di registrare `database is locked`.
    - Il sidecar seed interroga ogni 60s (300s in idle) invece di ogni 10s, con gli stessi pragma WAL / busy_timeout.

    Open WebUI v0.11.0 → v0.11.1 — highlight
    - Delta streaming, logging più economico, percorsi più veloci di lista modelli / permessi / JSON; la ricerca knowledge non blocca più altre chat.
    - Fix di sicurezza e controllo accessi; aggiorna tempestivamente i deployment di produzione.
    - Note di rilascio complete: https://github.com/open-webui/open-webui/releases/tag/v0.11.1

    Open WebUI v0.10.2 → v0.11.0 — highlight

    **Funzionalità principali**
    - **UI ridisegnata** in chat, admin, menu e impostazioni.
    - **Sub-agent:** i modelli possono passare lavoro ad agenti ausiliari in background (`ENABLE_SUBAGENTS` e impostazioni correlate).
    - **Pagine cartella, timer chat, destinazioni notifiche / notifiche assistente,** condivisione link aperta per le chat (permesso admin, disattivata di default).
    - **Variabili chat e utente,** sync gruppi LDAP, collaborazione cartelle condivise, fork / compact / anteprime chat, scorciatoie personalizzabili.
    - **Capacità file** per cercare allegati per significato o testo; note con chat completa + allegati; opzioni di ricerca web OpenSERP e SearXNG con certificato client.
    - **Dashboard di utilizzo personale,** memories nelle impostazioni, import note/automazioni, miglioramenti Anthropic passthrough / reasoning / structured output.

    **Sicurezza**
    - Fix di sicurezza e controllo accessi (isolamento anteprima HTML terminale, XSS matematico, parsing upload, controlli di proprietà chat, auth versione Ollama, e altro). Aggiornare tempestivamente i deployment di produzione è consigliato.
    - Vedi https://github.com/open-webui/open-webui/security

    **Modificato**
    - Impostazioni admin spostate nella finestra impostazioni; chat archiviate sotto Impostazioni; titoli automatici più corti senza emoji (prompt modificabile).
    - Campi token di utilizzo: `prompt_tokens` / `completion_tokens` sono per ultima chiamata; usa `input_tokens` / `output_tokens` / `total_tokens` per la fatturazione cumulativa.
    - `python-jose` e l'emulatore di storage GCS non sono più inclusi nell'immagine.

    **Prestazioni**
    - Ampie accelerazioni lato server per ricerca chat, streaming, Redis, liste modelli, knowledge base, parsing ricerca web e gestione filtri.

    Note di rilascio complete: https://github.com/open-webui/open-webui/releases/tag/v0.11.0

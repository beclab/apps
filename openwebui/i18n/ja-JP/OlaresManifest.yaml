metadata:
  title: Open WebUI
  description: LLM 向けの使いやすい WebUI
spec:
  fullDescription: |
    Open WebUI（旧称 Ollama WebUI）は、完全オフラインで動作するよう設計された、拡張可能で機能豊富、使いやすいセルフホスト WebUI です。Ollama や OpenAI 互換 API を含む各種 LLM ランナーをサポートします。詳細は Open WebUI Documentation をご覧ください。

    **Open WebUI の主な機能**
    - Ollama/OpenAI API 統合：OpenAI 互換 API を簡単に統合し、Ollama モデルと並んで多彩な会話が可能。OpenAI API URL をカスタムして LMStudio、GroqCloud、Mistral、OpenRouter などと連携。

    - Pipelines、Open WebUI プラグイン対応：Pipelines Plugin Framework でカスタムロジックと Python ライブラリを Open WebUI にシームレス統合。Pipelines インスタンスを起動し、OpenAI URL を Pipelines URL に設定すれば可能性は無限。Function Calling、アクセス制御の User Rate Limiting、Langfuse などの Usage Monitoring、多言語向け LibreTranslate の Live Translation、Toxic Message Filtering など。

    - レスポンシブデザイン：デスクトップ PC、ノート PC、モバイルでシームレスな体験。

    - モバイル向け Progressive Web App（PWA）：ネイティブアプリのような体験。localhost でのオフラインアクセスとシームレスな UI。

    - 完全な Markdown および LaTeX 対応：包括的な Markdown／LaTeX 機能で LLM 体験を向上。

    - ハンズフリー音声／ビデオ通話：統合されたハンズフリー音声・ビデオ通話で、より動的でインタラクティブなチャット環境。

    - Model Builder：Web UI から Ollama モデルを簡単作成。カスタムキャラクター／エージェントの追加、チャット要素のカスタム、Open WebUI Community 連携によるモデルの簡単インポート。

    - ネイティブ Python Function Calling ツール：ツールワークスペースの組み込みコードエディタで LLM を強化。純粋な Python 関数を追加するだけの Bring Your Own Function（BYOF）。

    - ローカル RAG 統合：Retrieval Augmented Generation（RAG）対応でドキュメント対話をチャットにシームレス統合。チャットへ直接ドキュメントを読み込むか、ドキュメントライブラリに追加し、クエリ前に # コマンドでアクセス。

    - RAG 向け Web 検索：SearXNG、Google PSE、Brave Search、serpstack、serper、Serply、DuckDuckGo、TavilySearch などで検索し、結果をチャットへ直接注入。

    - Web 閲覧機能：# コマンドの後に URL を付けてウェブサイトをチャットにシームレス統合。

    - 画像生成統合：AUTOMATIC1111 API や ComfyUI（ローカル）、OpenAI の DALL-E（外部）などで画像生成をシームレスに取り込み。

    - 複数モデル会話：複数モデルと同時に対話し、それぞれの強みを活かして最適な応答を獲得。

    - ロールベースアクセス制御（RBAC）：制限付き権限で安全なアクセスを確保。認可された人のみが Ollama にアクセスでき、モデル作成／取得の独占権は管理者に留保。

    - 多言語対応：国際化（i18n）対応で希望の言語で Open WebUI を体験。対応言語の拡充にご参加ください！コントリビューターを積極募集中。

    - 継続的な更新：定期的な更新、修正、新機能で Open WebUI の改善を継続。
  upgradeDescription: |
    Chart **1.0.44** — Open WebUI **v0.11.3**。
    - **イメージ：** `docker.io/openwebui/open-webui:0.11.3`
    - **起動／env：** chart 変更は不要。イメージは引き続き **8080** で待ち受け、`bash start.sh` で起動し、データを `/app/backend/data` に保存。既存の調整項目（`ENABLE_ORJSON`、`THREAD_POOL_SIZE`、`ENABLE_BASE_MODELS_CACHE`、`MODELS_CACHE_TTL`、SQLite WAL / `busy_timeout`、ストリームチャンク、WebSocket ハートビート、`WEBUI_SECRET_KEY_FILE`、Hugging Face、DB バックアップ）は有効のまま。`USER_AGENT` は `OpenWebUI/0.11.3`。新規インストール時 env の追加なし；編集可能な Olares env 名の変更なし。
    - **アップグレード経路：** 公開済み **1.0.43 / v0.11.1** の次の chart。**v0.10.x** からの直接アップグレードも可能；Alembic は完了まで実行されるように。

    パッケージ（Olares chart）
    - **アップグレード前 DB バックアップ（デフォルトオン）：** **`ENABLE_WEBUI_DB_BACKUP`** はデフォルト **`true`**。新しい chart バージョンごとに、アプリ起動前に `webui.db` が存在し `data/backups/webui_chart_<chart-version>.db` がまだない場合、init コンテナが一度コピー（同一 appData ボリューム）。スキップするにはアップグレード**前**に設定 → アプリケーション → 環境変数で **`false`** を設定。
    - **永続セッションキー（デフォルトオン）：** **`ENABLE_WEBUI_SECRET_KEY_PERSIST`** は appData 上の `data/.webui_secret_key` 経由で **`true`** のまま。
    - **既存データ：** appData 下のデータベースは保持；Open WebUI は起動時にスキーマを自動アップグレード。

    Open WebUI v0.11.1 → v0.11.3 — ハイライト
    - 失敗したデータベースアップグレードは半更新のまま起動せず、実際のマイグレーションエラーで中断（アップストリーム v0.11.2 の `chat.timer_at`／欠落テーブル失敗）。
    - リロード後もチャットブランチが接続を維持；壊れていたチャットは開いたときに修復。
    - より豊かなターミナルファイルプレビュー（Word／スライドを完成文書として、クリック可能なページサムネイル）。
    - Pipelines 未設定時（デフォルト）のメッセージあたりオーバーヘッド削減；マルチワーカーでのモデル一覧更新を軽量化。
    - 新しいフィルタフック `request`（各モデル呼び出し直前、ツール使用後も含む）；既存の `inlet` / `stream` / `outlet` フィルタは変更なし。
    - インターフェースフォントファミリー設定；High Contrast Mode を **Accessibility Mode** に改名（同じスイッチ）；メニューとモデルピッカーのコントラスト強化。
    - 修正：チャット途中の応答途切れ、推論モデルのストリーム停滞、ツール使用後に思考が応答へ漏れる問題、Redis バックエンドインスタンス間の stop、無効モデルの消失、カレンダー／自動化スケジュールの不具合など。
    - セキュリティとアクセス制御の修正；本番デプロイは速やかに更新してください。
    - **変更：** カレンダーイベントは 1 日 1 回より頻繁には繰り返せません。
    - 完全なリリースノート：https://github.com/open-webui/open-webui/releases/tag/v0.11.2 および https://github.com/open-webui/open-webui/releases/tag/v0.11.3

    Chart **1.0.43** — Open WebUI **v0.11.1**。
    - **イメージ：** `docker.io/beclab/open-webui-open-webui:v0.11.1`
    - 毎回全文を再送せずテキストデルタとして応答をストリーム。
    - `ENABLE_ORJSON=true`、`THREAD_POOL_SIZE=256`、`ENABLE_BASE_MODELS_CACHE=true`、`MODELS_CACHE_TTL=300`。
    - プレゼンス書き込み（`DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300`）と WebSocket ハートビート（`WEBSOCKET_HEARTBEAT_INTERVAL=60`）をスロットル。
    - ストリームトークンをバッチ化（`CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=7`）。
    - CPU 制限を 2 から 4 コアへ引き上げ。

    Chart **1.0.42**（Open WebUI **v0.11.0**）。
    - SQLite `busy_timeout` を 30s へ引き上げ、ナレッジ取り込みの書き込み中は WebSocket ハートビートが待機し、`database is locked` が記録されないようにします。
    - seed サイドカーは 10s ごとではなく 60s（アイドル時 300s）ごとにポーリングし、同じ WAL / busy_timeout プラグマを使用。

    Open WebUI v0.11.0 → v0.11.1 — ハイライト
    - デルタストリーミング、より軽いロギング、モデル一覧／権限／JSON パスの高速化；ナレッジ検索が他チャットを止めなくなった。
    - セキュリティとアクセス制御の修正；本番は速やかに更新。
    - 完全なリリースノート：https://github.com/open-webui/open-webui/releases/tag/v0.11.1

    Open WebUI v0.10.2 → v0.11.0 — ハイライト

    **主要機能**
    - チャット、管理、メニュー、設定にわたる **UI 再設計**。
    - **サブエージェント：** モデルがバックグラウンドのヘルパーエージェントに作業を委任（`ENABLE_SUBAGENTS` など）。
    - **フォルダページ、チャットタイマー、通知ターゲット／アシスタント通知、** チャットのオープンリンク共有（管理者権限、デフォルトオフ）。
    - **チャット＆ユーザー変数、** LDAP グループ同期、共有フォルダ共同作業、チャットの fork／compact／プレビュー、カスタムキーボードショートカット。
    - **ファイル機能**で添付を意味またはテキスト検索；完全なチャット＋添付付きノート；OpenSERP と SearXNG クライアント証明書 Web 検索オプション。
    - **個人利用ダッシュボード、** 設定内の memories、ノート／自動化のインポート、Anthropic パススルー／推論／構造化出力の改善。

    **セキュリティ**
    - セキュリティとアクセス制御の修正（ターミナル HTML プレビュー隔離、数式 XSS、アップロード解析、チャット所有権チェック、Ollama バージョン認証など）。本番デプロイの速やかな更新を推奨。
    - 参照：https://github.com/open-webui/open-webui/security

    **変更**
    - 管理者設定を設定ウィンドウへ移動；アーカイブチャットは設定配下；絵文字なしの短い自動タイトル（プロンプト編集可）。
    - 利用トークン欄：`prompt_tokens` / `completion_tokens` は直近呼び出しごと；累計課金には `input_tokens` / `output_tokens` / `total_tokens` を使用。
    - `python-jose` と GCS ストレージエミュレータはイメージに同梱されなくなった。

    **性能**
    - チャット検索、ストリーミング、Redis、モデル一覧、ナレッジベース、Web 検索パース、フィルタ処理のサーバー側高速化。

    完全なリリースノート：https://github.com/open-webui/open-webui/releases/tag/v0.11.0

metadata:
  title: Open WebUI
  description: 面向 LLMs 的友好网页界面
spec:
  fullDescription: |
    Open WebUI（前称 Ollama WebUI）是可扩展、功能丰富且易用的自托管网页界面，可完全离线运行。它支持多种 LLM 运行器，包括 Ollama 和兼容 OpenAI 的 API。更多说明见 Open WebUI 文档。

    **Open WebUI 的主要特性**
    - Ollama/OpenAI API 集成：可接入兼容 OpenAI 的 API，并与 Ollama 模型一起使用。可自定义 OpenAI API URL，连接 LMStudio、GroqCloud、Mistral、OpenRouter 等。

    - Pipelines 与插件：通过 Pipelines 插件框架把自定义逻辑和 Python 库接入 Open WebUI。启动 Pipelines 后，将 OpenAI URL 指向 Pipelines URL。可用于函数调用、访问频率限制、Langfuse 用量监控、LibreTranslate 翻译、有害信息过滤等。

    - 响应式设计：在台式机、笔记本和移动设备上使用。

    - 移动端渐进式 Web 应用（PWA）：在移动设备上提供接近原生应用的体验，可在 localhost 离线访问。

    - Markdown 与 LaTeX：用 Markdown 和 LaTeX 呈现对话内容。

    - 免提语音/视频通话：在聊天中使用免提语音和视频通话。

    - 模型构建器：在网页界面创建 Ollama 模型，添加自定义角色或代理，并可通过 Open WebUI Community 导入模型。

    - 原生 Python 函数调用：在工具工作区用内置代码编辑器添加纯 Python 函数，并接入 LLM。

    - 本地 RAG：把文档交互放进聊天。可把文档直接载入对话，或加入文档库后用 # 命令访问。

    - RAG 网页搜索：使用 SearXNG、Google PSE、Brave Search、serpstack、serper、Serply、DuckDuckGo、TavilySearch 等搜索，并把结果写入对话。

    - 网页浏览：在 # 命令后输入 URL，把网页内容带入对话。

    - 图像生成：可使用 AUTOMATIC1111 API、本地 ComfyUI，或外部 OpenAI DALL-E。

    - 多模型对话：可同时与多个模型对话，结合各自的回答。

    - 基于角色的访问控制（RBAC）：限制谁可以访问 Ollama，模型创建和拉取由管理员控制。

    - 多语言：界面支持国际化（i18n）。

    - 持续更新：通过定期更新、修复和新功能继续改进 Open WebUI。

  upgradeDescription: |
    将 openwebui 从 0.12.5 升级至 0.13.0。新增聊天标签页工作区、可选评论和通知收件箱，以及工具启用/停用控制；包含上游安全更新和聊天同步修复。

    发行说明：https://github.com/open-webui/open-webui/releases/tag/v0.13.0

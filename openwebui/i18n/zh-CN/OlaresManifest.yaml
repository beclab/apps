metadata:
  title: Open WebUI
  description: 面向 LLMs 的友好网页界面
spec:
  fullDescription: |
    Open WebUI（前身为 Ollama WebUI）是一个可扩展、功能丰富且用户友好的自托管网页界面，支持完全离线运行。它支持多种 LLM 运行器，包括 Ollama 和兼容 OpenAI 的 API。欲了解更多信息，请务必查看我们的 Open WebUI 文档。

    **Open WebUI 的主要特性**
    - **Ollama/OpenAI API 集成**：轻松集成兼容 OpenAI 的 API，与 Ollama 模型一起展开精妙对话。自定义 OpenAI API URL，以连接 LMStudio、GroqCloud、Mistral、OpenRouter 等。
    - **Pipelines 和插件支持**：使用 Pipelines 插件框架，将自定义逻辑和 Python 库无缝集成到 Open WebUI 中。可进行函数调用、访问频率限制、Langfuse 监控、LibreTranslate 翻译、有害信息过滤等。
    - **响应式设计**：在台式电脑、笔记本电脑和移动设备上享受无缝体验。
    - **移动端 PWA**：通过渐进式 Web 应用 (PWA) 在移动设备上离线访问，体验流畅。
    - **Markdown 与 LaTeX 支持**：提升内容呈现的丰富度。
    - **语音/视频通话**：集成免提语音和视频通话功能。
    - **模型构建器**：通过 Web 界面轻松创建 Ollama 模型，支持自定义角色/代理。
    - **Python 函数调用工具**：在工具工作区中使用内置编辑器添加 Python 函数，与 LLM 无缝集成。
    - **本地 RAG 集成**：支持文档交互式聊天，使用 # 命令直接访问文档或库。
    - **RAG 网络搜索**：支持 SearXNG、Google PSE、Brave Search、DuckDuckGo、TavilySearch 等。
    - **网页浏览功能**：通过 # 命令后跟 URL 将网页内容融入对话。
    - **图像生成集成**：支持 AUTOMATIC1111、ComfyUI、本地或外部 DALL-E API。
    - **多模型对话**：可并行与多个模型交互，结合各自优势。
    - **RBAC 权限控制**：仅授权用户可访问和管理模型。
    - **多语言支持**：支持多语言国际化（i18n）。
    - **持续更新**：通过定期更新和社区贡献持续改进。

  upgradeDescription: |
    **升级 Open WebUI 至 v0.11.0（Chart 1.0.38）**

    **本 Chart 打包说明（Olares）— 1.0.38**
    - **镜像：** `docker.io/openwebui/open-webui:0.11.0`
    - **升级前数据库备份（默认开启）：** **`ENABLE_WEBUI_DB_BACKUP`** 默认 **`true`**。每个新 Chart 版本首次启动前，若存在 `webui.db` 且尚无 `data/backups/webui_chart_<chart 版本>.db`，init 容器会复制一份。若需跳过，请在升级前于 **设置 → 应用 → 环境变量** 设为 **`false`**。
    - **库表迁移：** v0.11.0 包含数据库 schema 变更，强烈建议保留默认备份。多 worker / 负载均衡部署必须同时升级，不支持滚动升级。
    - **持久化会话密钥（默认开启）：** **`ENABLE_WEBUI_SECRET_KEY_PERSIST`** 保持 **`true`**（`data/.webui_secret_key`）。
    - **已有数据：** appData 中的数据库会保留；Open WebUI 启动时自动完成库结构升级。

    **Open WebUI v0.10.2 → v0.11.0 要点**

    **重大功能**
    - **全面 UI 重设计**（聊天、管理端、菜单与设置）。
    - **Sub-agents：** 模型可将任务交给后台辅助 agent（`ENABLE_SUBAGENTS` 等）。
    - **文件夹专页、会话定时器、通知目标 / 助手通知、** 公开链接分享（管理员权限，默认关闭）。
    - **会话/用户变量、LDAP 组同步、共享文件夹协作、fork / compact / 预览、可自定义快捷键。**
    - **Files 能力**（按语义或全文检索附件）；笔记完整聊天与附件；OpenSERP / SearXNG 客户端证书搜索等。
    - **个人用量面板、设置中的记忆管理、笔记/自动化导入、Anthropic 透传与推理增强。**

    **安全**
    - 含多项安全与访问控制修复（终端 HTML 预览隔离、数学公式 XSS、上传解析、会话归属校验、Ollama 版本接口鉴权等），建议尽快升级生产部署。
    - 详见 https://github.com/open-webui/open-webui/security

    **行为变更**
    - 管理设置并入设置窗口；归档会话移至 Settings；自动标题更短且默认无 emoji（可改提示词）。
    - Usage：`prompt_tokens` / `completion_tokens` 为最近一次调用；累计请用 `input_tokens` / `output_tokens` / `total_tokens`。
    - 镜像不再捆绑 `python-jose` 与 GCS storage emulator。

    **性能**
    - 聊天搜索、流式响应、Redis、模型列表、知识库、网页解析与过滤器等路径全面加速。

    完整发布说明：https://github.com/open-webui/open-webui/releases/tag/v0.11.0


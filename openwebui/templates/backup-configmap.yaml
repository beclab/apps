apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-db-backup
  namespace: "{{ .Release.Namespace }}"
data:
  backup.py: |
    import os
    import sqlite3
    import tempfile
    from contextlib import closing
    from pathlib import Path

    def check(path):
        with closing(sqlite3.connect(path.as_uri() + '?mode=ro', uri=True)) as db:
            if db.execute('PRAGMA integrity_check').fetchall() != [('ok',)]:
                raise RuntimeError('SQLite backup integrity check failed')
            if not db.execute('SELECT 1 FROM sqlite_master LIMIT 1').fetchone():
                raise RuntimeError('SQLite backup unexpectedly contains no schema')

    def backup(data, version):
        source = data / 'webui.db'
        if not source.is_file():
            print('No webui.db yet, skipping backup.')
            return
        directory = data / 'backups'
        directory.mkdir(exist_ok=True)
        destination = directory / ('webui_chart_' + version + '.db')
        if destination.exists():
            check(destination)
            print('Existing backup verified; preserving it.')
            return
        fd, name = tempfile.mkstemp(prefix=destination.name + '.', suffix='.tmp', dir=directory)
        os.close(fd)
        temporary = Path(name)
        try:
            with closing(sqlite3.connect(source.as_uri() + '?mode=ro', uri=True, timeout=30)) as src:
                with closing(sqlite3.connect(temporary)) as dst:
                    src.backup(dst)
                    if dst.execute('PRAGMA journal_mode=DELETE').fetchone()[0] != 'delete':
                        raise RuntimeError('Could not make the backup self-contained')
            check(temporary)
            with temporary.open('r+b') as stream:
                os.fsync(stream.fileno())
            os.chmod(temporary, source.stat().st_mode & 0o777)
            os.replace(temporary, destination)
            print('SQLite backup completed and verified (including committed WAL data).')
        finally:
            for path in (temporary, Path(name + '-wal'), Path(name + '-shm')):
                if path.exists():
                    path.unlink()

    if __name__ == '__main__':
        backup(Path('/data'), os.environ['CHART_VERSION'])

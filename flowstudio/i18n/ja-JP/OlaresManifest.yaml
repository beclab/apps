metadata:
  title: FlowStudio
  description: Olares向けのオールインワンAIワークフロー制作アプリ

spec:
  fullDescription: |
    FlowStudioはComfyUIワークフローを、Olaresで繰り返し利用できる制作プロジェクトに変換します。ワークフローのJSONをインポートするか、推奨テンプレートから開始すると、必要なモデルとカスタムノードを特定し、不足しているものをダウンロードして、GPUを備えた専用エンジンで実行します。PCとモバイルの両方にパラメータフォームを提供します。管理者がワークフローと環境を管理し、他のユーザーはプロジェクトを選んで生成を開始できます。

    **主な機能**
    - **ワークフローを制作環境に**：ComfyUI Save JSONまたは推奨テンプレートをインポートし、確定前にノード、モデル、VRAM、カスタムノードのリスクに関する解析レポートを確認できます。
    - **依存関係の自動解決**：初期化時にモデルの重みをダウンロードし、カスタムノードをインストールして、エンジンイメージを事前取得します。取得元で問題が発生した場合は、具体的な復旧手順を提示します。
    - **プロジェクトごとの専用エンジン**：各プロジェクトに独自のComfyUIエンジンとNVIDIA GPUを割り当てます。アプリ本体とエンジンは別々のイメージとして提供され、HTTP/WSのみで通信します。
    - **PCとモバイル共通のワークスペース**：同じプロジェクト、パラメータ、ジョブ、履歴を両方の端末で利用でき、どちらからでも調整と生成が可能です。
    - **共有モデルライブラリ**：重みはノード単位の共有ライブラリに保存され、複数のプロジェクトで再利用されます。アンインストール時も既定では保持されます。
    - **統合管理コンソール**：ダウンロード元、GPU検出とエンジンのロック、ダウンロードセンター、モデルライブラリを一か所で管理し、所有者ごとにデータを分離します。
    - **RouterとOpenAI API**：画像生成プロバイダーとしてOlares Routerに登録し、OpenAI形式の`/v1/models`と`/v1/images/generations`に加え、ワークフローカタログと生成APIを公開します。

    **動作要件**
    - `amd64`上のOlares >= 1.12.7
    - アプリのインストール時または再開時に割り当てるNVIDIA GPU
    - 軽量な画像テンプレートには空きVRAM >= 6 GiBが必要
  upgradeDescription: |
    **FlowStudio 0.3.87**

    - Olares Router のカタログには、ワークフローのすべての入力が一覧されます。プロンプトと各メディア枠は params に渡し、メディアはそのユーザーの Files にある Home/FlowStudio 配下のパスです。
    - 新しくインストールした Qwen 画像編集テンプレートは、アップロードした画像の縦横比に従い、比率のコントロールは表示されません。

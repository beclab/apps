metadata:
  title: FlowStudio
  description: Olares 上的一体化 AI 工作流生产应用

spec:
  fullDescription: |
    FlowStudio 把一份 ComfyUI 工作流变成 Olares 上可反复使用的生产项目。导入工作流
    JSON 或从推荐模板开始，FlowStudio 会解析它依赖的模型与自定义节点、补齐缺失的部分、
    在独立的 GPU 引擎上运行，并在 PC 与移动端给出一份参数表单。管理员负责工作流与运行
    环境，其他人只需选一个项目开始生成。

    **功能亮点**
    - **工作流即产品**：导入 ComfyUI Save JSON 或推荐模板，创建前先看到节点、模型、显存与自定义节点风险的解析报告。
    - **依赖自动补齐**：初始化阶段自动下载模型权重、安装自定义节点、预拉引擎镜像；下载源失败时给出可执行的恢复动作。
    - **每个项目独立引擎**：按项目动态创建 ComfyUI 引擎并分配 NVIDIA GPU；业务与引擎分镜像发布，只经 HTTP/WS 交互。
    - **双端工作区**：PC 与移动端共享同一套项目、参数、任务与历史，任意一端都能调参出图。
    - **共享模型库**：权重落在节点级共享模型库中被多项目复用，卸载默认不删除。
    - **统一管理台**：下载源、GPU 探测与引擎锁定、下载中心、模型库集中管理，数据按用户隔离。
    - **Router 与 OpenAI 接口**：自动注册为 Olares Router 的图像生成提供者，同时提供 OpenAI 风格的 `/v1/models`、`/v1/images/generations`，以及工作流目录与生成任务 API。

    **运行要求**
    - Olares >= 1.12.7，架构 `amd64`
    - NVIDIA GPU：安装或恢复应用时按提示绑定
    - 轻量图片模板要求可用显存 >= 6 GiB
  upgradeDescription: |
    **FlowStudio 0.3.87**

    - Olares Router 的工作流目录会列出全部输入。提示词和每个媒资槽位都写在 params 里，媒资用该用户 Files 中 Home/FlowStudio 下的路径。
    - 新安装的千问图片编辑模板会跟随上传图片的比例，比例控件默认不露出。

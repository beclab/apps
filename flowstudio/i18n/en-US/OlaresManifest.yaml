metadata:
  title: FlowStudio
  description: The all-in-one AI workflow production app for Olares

spec:
  fullDescription: |
    FlowStudio turns a ComfyUI workflow into a reusable production project on
    Olares. Import a workflow JSON or start from a recommended template, and
    FlowStudio resolves its models and custom nodes, downloads what is missing,
    runs it on a dedicated GPU-backed engine, and hands you a parameter form on
    both PC and mobile. Admins own workflows and the environment; everyone else
    just picks a project and generates.

    **Highlights**
    - **Workflow to product**: Import a ComfyUI Save JSON or a recommended template and get a parse report of nodes, models, VRAM, and custom-node risks before you commit.
    - **Dependencies resolved for you**: Model weights download, custom nodes install, and engine images pre-pull during initialization, with actionable recovery steps when a source fails.
    - **A dedicated engine per project**: Every project gets its own ComfyUI engine and NVIDIA GPU allocation; business and engine ship as separate images and talk only over HTTP/WS.
    - **Dual-end workspace**: The same projects, parameters, jobs, and history on PC and mobile — tune and generate from either side.
    - **Shared model library**: Weights land in a node-level shared library reused across projects, and uninstall keeps them by default.
    - **One admin console**: Download sources, GPU detection and engine lock, download center, and model library in one place, with per-owner data isolation.
    - **Router and OpenAI APIs**: Registers with Olares Router as an image-generation provider, and exposes an OpenAI-style `/v1/models` and `/v1/images/generations` alongside a workflow catalogue and generation API.

    **Requirements**
    - Olares >= 1.12.7 on `amd64`
    - An NVIDIA GPU, bound when installing or resuming the app
    - Free VRAM >= 6 GiB for lite image templates
  upgradeDescription: |
    **FlowStudio 0.3.87**

    - The Olares Router catalog lists every workflow input. Pass the prompt and each media slot in params; media is a Files path under that user's Home/FlowStudio.
    - Newly installed Qwen image-edit templates follow the uploaded image's aspect ratio, and the ratio control stays hidden.

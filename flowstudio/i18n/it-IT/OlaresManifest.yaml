metadata:
  title: FlowStudio
  description: L’app tutto in uno per la produzione con workflow di IA su Olares

spec:
  fullDescription: |
    FlowStudio trasforma un workflow ComfyUI in un progetto di produzione riutilizzabile su Olares. Importa un workflow JSON o parti da un template consigliato: FlowStudio identifica i modelli e i nodi personalizzati necessari, scarica ciò che manca, esegue il workflow su un motore dedicato con GPU e offre un modulo per i parametri sia su PC sia su dispositivi mobili. Gli amministratori gestiscono workflow e ambiente; gli altri utenti scelgono un progetto e avviano la generazione.

    **Funzionalità principali**
    - **Dal workflow al prodotto**: importa un ComfyUI Save JSON o un template consigliato e consulta, prima di confermare, un rapporto di analisi su nodi, modelli, VRAM e rischi dei nodi personalizzati.
    - **Risoluzione delle dipendenze**: durante l’inizializzazione vengono scaricati i pesi dei modelli, installati i nodi personalizzati e precaricate le immagini dei motori, con indicazioni concrete per il ripristino se una fonte non funziona.
    - **Un motore dedicato per progetto**: ogni progetto ha un proprio motore ComfyUI e un’allocazione di GPU NVIDIA; applicazione e motore sono distribuiti come immagini separate e comunicano solo tramite HTTP/WS.
    - **Area di lavoro su PC e dispositivi mobili**: gli stessi progetti, parametri, processi e cronologia sono disponibili su entrambe le piattaforme, per regolare i parametri e generare contenuti da ciascuna.
    - **Libreria di modelli condivisa**: i pesi vengono salvati in una libreria condivisa a livello di nodo, riutilizzata tra i progetti e conservata per impostazione predefinita alla disinstallazione.
    - **Console di amministrazione unificata**: fonti di download, rilevamento della GPU e blocco del motore, centro download e libreria di modelli in un unico posto, con isolamento dei dati per proprietario.
    - **API Router e OpenAI**: si registra in Olares Router come fornitore di generazione di immagini ed espone `/v1/models` e `/v1/images/generations` in stile OpenAI, oltre a un catalogo di workflow e un’API di generazione.

    **Requisiti**
    - Olares >= 1.12.7 su `amd64`
    - Una GPU NVIDIA, associata durante l’installazione o la ripresa dell’app
    - VRAM libera >= 6 GiB per i template di immagini leggeri
  upgradeDescription: |
    **FlowStudio 0.3.87**

    - Il catalogo di Olares Router elenca tutti gli input del flusso. Il prompt e ogni slot multimediale vanno in params; il file è un percorso in File sotto Home/FlowStudio di quell’utente.
    - I template di modifica immagini Qwen appena installati seguono le proporzioni dell’immagine caricata e il controllo delle proporzioni resta nascosto.

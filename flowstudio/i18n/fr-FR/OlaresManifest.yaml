metadata:
  title: FlowStudio
  description: L’application tout-en-un de production de workflows d’IA pour Olares

spec:
  fullDescription: |
    FlowStudio transforme un workflow ComfyUI en projet de production réutilisable sur Olares. Importez un workflow JSON ou partez d’un modèle recommandé : FlowStudio identifie les modèles et les nœuds personnalisés nécessaires, télécharge les éléments manquants, exécute le workflow sur un moteur dédié avec GPU et propose un formulaire de paramètres sur PC et mobile. Les administrateurs gèrent les workflows et l’environnement ; les autres utilisateurs choisissent un projet et lancent la génération.

    **Points forts**
    - **Du workflow au produit** : importez un ComfyUI Save JSON ou un modèle recommandé et consultez un rapport sur les nœuds, les modèles, la VRAM et les risques liés aux nœuds personnalisés avant de confirmer.
    - **Résolution des dépendances** : les poids des modèles sont téléchargés, les nœuds personnalisés installés et les images des moteurs préchargées pendant l’initialisation, avec des mesures de récupération concrètes en cas d’échec d’une source.
    - **Un moteur dédié par projet** : chaque projet dispose de son propre moteur ComfyUI et d’une allocation de GPU NVIDIA ; l’application et le moteur sont distribués dans des images distinctes et communiquent uniquement via HTTP/WS.
    - **Espace de travail sur PC et mobile** : retrouvez les mêmes projets, paramètres, tâches et historiques sur les deux plateformes pour régler les paramètres et générer du contenu.
    - **Bibliothèque de modèles partagée** : les poids sont stockés dans une bibliothèque partagée au niveau du nœud, réutilisée par les projets et conservée par défaut lors de la désinstallation.
    - **Console d’administration centralisée** : sources de téléchargement, détection du GPU et verrouillage du moteur, centre de téléchargement et bibliothèque de modèles sont regroupés, avec une isolation des données par propriétaire.
    - **API Router et OpenAI** : s’enregistre auprès d’Olares Router comme fournisseur de génération d’images et expose `/v1/models` et `/v1/images/generations` au format OpenAI, ainsi qu’un catalogue de workflows et une API de génération.

    **Configuration requise**
    - Olares >= 1.12.7 sur `amd64`
    - Un GPU NVIDIA, associé lors de l’installation ou de la reprise de l’application
    - VRAM disponible >= 6 GiB pour les modèles légers de génération d’images
  upgradeDescription: |
    **FlowStudio 0.3.87**

    - Le catalogue Olares Router liste toutes les entrées du flux. Le prompt et chaque emplacement média se passent dans params ; le média est un chemin Fichiers sous Home/FlowStudio de cet utilisateur.
    - Les modèles d’édition d’image Qwen nouvellement installés suivent le format de l’image importée, et le contrôle du format reste masqué.

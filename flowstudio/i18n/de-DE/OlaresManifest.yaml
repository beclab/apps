metadata:
  title: FlowStudio
  description: Die All-in-one-App für die Produktion mit KI-Workflows auf Olares

spec:
  fullDescription: |
    FlowStudio verwandelt einen ComfyUI-Workflow in ein wiederverwendbares Produktionsprojekt auf Olares. Importieren Sie einen Workflow als JSON oder beginnen Sie mit einer empfohlenen Vorlage. FlowStudio ermittelt die benötigten Modelle und benutzerdefinierten Nodes, lädt fehlende Komponenten herunter, führt den Workflow auf einer dedizierten Engine mit GPU aus und stellt auf PC und Mobilgeräten ein Parameterformular bereit. Administratoren verwalten Workflows und Umgebung; andere Benutzer wählen ein Projekt aus und starten die Generierung.

    **Hauptfunktionen**
    - **Vom Workflow zum Produkt**: Importieren Sie ein ComfyUI Save JSON oder eine empfohlene Vorlage und prüfen Sie vor der Bestätigung einen Analysebericht zu Nodes, Modellen, VRAM und Risiken benutzerdefinierter Nodes.
    - **Automatische Auflösung von Abhängigkeiten**: Bei der Initialisierung werden Modellgewichte heruntergeladen, benutzerdefinierte Nodes installiert und Engine-Images vorab geladen. Bei Ausfall einer Quelle werden konkrete Schritte zur Fehlerbehebung angezeigt.
    - **Eine dedizierte Engine pro Projekt**: Jedes Projekt erhält eine eigene ComfyUI-Engine und eine NVIDIA-GPU-Zuweisung. Anwendung und Engine werden als separate Images ausgeliefert und kommunizieren ausschließlich über HTTP/WS.
    - **Arbeitsbereich für PC und Mobilgeräte**: Projekte, Parameter, Aufgaben und Verlauf sind auf beiden Plattformen identisch verfügbar, sodass Sie überall Parameter anpassen und Inhalte generieren können.
    - **Gemeinsame Modellbibliothek**: Modellgewichte werden in einer gemeinsamen Bibliothek auf dem jeweiligen Knoten gespeichert, projektübergreifend wiederverwendet und bei der Deinstallation standardmäßig beibehalten.
    - **Zentrale Verwaltungskonsole**: Downloadquellen, GPU-Erkennung und Engine-Sperre, Downloadcenter und Modellbibliothek an einem Ort, mit nach Eigentümer getrennten Daten.
    - **Router- und OpenAI-APIs**: Registriert sich bei Olares Router als Anbieter für die Bildgenerierung und stellt `/v1/models` und `/v1/images/generations` im OpenAI-Stil sowie einen Workflow-Katalog und eine Generierungs-API bereit.

    **Voraussetzungen**
    - Olares >= 1.12.7 auf `amd64`
    - Eine NVIDIA-GPU, die bei der Installation oder beim Fortsetzen der App zugewiesen wird
    - Freier VRAM >= 6 GiB für leichtgewichtige Bildvorlagen
  upgradeDescription: |
    **FlowStudio 0.3.87**

    - Der Olares-Router-Katalog listet alle Workflow-Eingaben auf. Prompt und Medienfelder stehen in params; Medien sind ein Dateipfad unter Home/FlowStudio des jeweiligen Benutzers.
    - Neu installierte Qwen-Bildbearbeitung folgt dem Seitenverhältnis des hochgeladenen Bildes; die Verhältnissteuerung bleibt ausgeblendet.

metadata:
  title: Qwen3.8-Flash-Next IQ3_S
  description: "Qwen3.8-Flash-Next für Textgenerierung, Schlussfolgern und Werkzeugaufrufe, lokal mit Strata"
spec:
  upgradeDescription: |
    - Strata 0.2.12 (Engine 0.1.58): Korrekturen an Tool-Aufrufen in mehreren API-Clients (Claude-Desktop-Modellname, Formen der Tool-Call-Tags, MCP-Namensabgleich, erzwungene tool_choice), korrigierte Geschwindigkeitsanzeigen des Servers, eine stabilere Engine bei langen CUDA-Prompts und Starts auf zwei Karten, sowie eine lockere GGUF-Shard-Prüfung bei Neuinstallationen. Der DFlash2-Entwurfshelfer läuft weiterhin standardmäßig. Modell, 262K-Kontext und Bildeingabe bleiben unverändert.
  fullDescription: |
    Qwen3.8-Flash-Next ist ein experimentelles KI-Modell des Qwen-Teams von Alibaba zum Beantworten von Fragen und Erzeugen von Texten. In kompatiblen Anwendungen unterstützt es Denkprozesse und Werkzeugaufrufe. Diese App führt die GSQ-RCO-IQ3_S-Quantisierung von ISTA-DASLab lokal mit Strata aus.

    Strata ist eine Open-Source-Inferenz-Engine, die große KI-Modelle lokal ausführt. Sie koordiniert GPU-Speicher, Arbeitsspeicher und Datenspeicher, sodass das Modell nicht vollständig in den GPU-Speicher passen muss. Model Console verbindet die Engine mit Olares.

    **Hauptfunktionen**

    - Textantworten mit Unterstützung für einen Denkmodus und Tool-Aufrufe in kompatiblen Anwendungen erzeugen.
    - Mit Model Console das Modell herunterladen, seinen Status anzeigen und die Engine-Einstellungen anpassen.
    - Kompatible Anwendungen über Olares Router oder die OpenAI-kompatible Chat-API verbinden.
    - Chatten Sie mit dem Modell und verfolgen Sie Geschwindigkeit, VRAM und Cache-Statistiken live in der mitgelieferten Strata-Weboberfläche (Chat und Statistik).

    **Diese Ausgabe**

    Diese Ausgabe akzeptiert Text- und Bildeingaben; Videoeingaben sind deaktiviert. Das voreingestellte Kontextlimit beträgt 262.144 Token. Es wird jeweils eine Anfrage verarbeitet. Der verfügbare Kontext hängt vom Speicher und den Engine-Einstellungen ab.

    **Vor der ersten Nutzung**

    Beim ersten Start werden etwa 84 GB Modelldateien sowie zusätzliche, von Strata benötigte Dateien heruntergeladen. Anschließend wird das Modell vorbereitet. Model Console kann den Hauptdownload bereits als abgeschlossen anzeigen, während Strata das Modell noch vorbereitet.

    Auf amd64 erforderlich sind eine CPU mit AVX2-Unterstützung und ein NVIDIA-Treiber der Reihe R580 oder neuer. Die Voreinstellung ist für einen Host mit 96 GiB RAM ausgelegt. Prüfen Sie vor der Installation die angegebenen Ressourcenanforderungen. Erstellt und getestet auf dem Olares One.

    [Modelldokumentation](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Quantisiertes Modell](https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)

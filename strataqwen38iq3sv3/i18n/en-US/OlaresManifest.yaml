metadata:
  title: Qwen3.8-Flash-Next IQ3_S
  description: "Qwen3.8-Flash-Next for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  fullDescription: |
    Qwen3.8-Flash-Next is an experimental AI model from Alibaba's Qwen team for answering questions and generating text, with support for thinking and tool calling in compatible applications. This app runs ISTA-DASLab's GSQ-RCO IQ3_S quantized edition locally using Strata.

    Strata is an open-source inference engine for running large AI models locally. It coordinates GPU memory, system RAM, and storage so the full model does not need to fit in GPU memory. Model Console connects the engine to Olares.

    **Key features**

    - Generate text responses with support for thinking and tool calling in compatible applications.
    - Use Model Console to download the model, view its status, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.
    - Chat with the model and follow live speed, VRAM and cache stats in the bundled Strata web UI (Chat and Statistics).

    **This edition**

    This edition supports text and image input; video input is disabled. The default context limit is 262,144 tokens, with one request processed at a time. Available context depends on memory and engine settings.

    **Before first use**

    First startup downloads approximately 84 GB of model files plus additional files needed by Strata, then prepares the model. Model Console may show the main download as complete while Strata is still preparing the model.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer are required. The preset is intended for a host with 96 GiB of RAM. See the listed resource requirements before installing.

    [Model documentation](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Quantized model](https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strata documentation](https://github.com/Niko1221/Strata)

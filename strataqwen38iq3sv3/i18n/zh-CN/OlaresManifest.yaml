metadata:
  title: Qwen3.8-Flash-Next IQ3_S
  description: "通过 Strata 本地运行的 Qwen3.8-Flash-Next，支持文本生成、推理和工具调用"
spec:
  upgradeDescription: |
    - 所需 CPU 保持 1300m。应用 CPU 上限为 20 核，引擎 CPU 上限默认为 19 核，使全部容器不超过该上限。
    - 应用内存上限提高到 78 GiB，引擎内存上限提高到 75 GiB。
    - 下载并校验通过后使用 DFlash2。已有缓存保存在持久化目录 /dflash2 中。准备失败时会记录原因，并继续使用 MTP。
    - 保留 8080 端口的 Strata UI，启动不再等待该入口。Model Console 可在模型下载和加载完成前打开，Strata UI 在加载完成后可用。
    - 模型直接从 Hugging Face 下载并启用 Xet，不再受内部 HTTP 镜像的单文件传输限制。
    - 在 ENGINE_ARGS 中用 --pool-workers 设置专家线程数，不再按容器 CPU 额度自动限制。已保存的引擎参数会保留；要使用自动 KV Streaming，请在 Model Console 中设置为 --kv-streaming auto。
  fullDescription: |
    Qwen3.8-Flash-Next 是阿里巴巴 Qwen 团队推出的实验性 AI 模型，可用于回答问题和生成文本，并在兼容的应用中支持思考和工具调用。本应用通过 Strata 在本地运行 ISTA-DASLab 的 GSQ-RCO IQ3_S 量化版本。

    Strata 是用于在本地运行大型 AI 模型的开源推理引擎。它协调使用 GPU 显存、系统内存和存储，使模型无需完整装入显存即可运行。Model Console 将推理引擎接入 Olares。

    **主要功能**

    - 生成文本回复，并在兼容的应用中支持思考和工具调用。
    - 通过 Model Console 下载模型、查看状态和调整引擎设置。
    - 通过 Olares Router 或兼容 OpenAI 的聊天 API 连接兼容的应用。
    - 在自带的 Strata 网页界面（聊天与统计）中与模型对话，实时查看速度、显存和缓存统计。

    **本版本说明**

    本版本支持文本和图像输入，已关闭视频输入。默认上下文上限为 262,144 个 token，每次处理一个请求。可用上下文取决于内存和引擎设置。

    **首次使用前**

    首次启动会下载约 84 GB 的模型文件及 Strata 所需的其他文件，然后准备模型。Model Console 显示主模型下载完成时，Strata 可能仍在准备模型。

    在 amd64 上，需要支持 AVX2 的 CPU，以及 R580 系列或更新版本的 NVIDIA 驱动。此预设面向配备 96 GiB 内存的主机。安装前请查看列出的资源要求。 在 Olares One 上构建并测试。

    [模型文档](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [量化模型](https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strata 文档](https://github.com/Niko1221/Strata)

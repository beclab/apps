metadata:
  title: Qwen3.8-Flash-Next IQ3_S
  description: "Qwen3.8-Flash-Next pour générer du texte, raisonner et appeler des outils, en local avec Strata"
spec:
  upgradeDescription: |
    Les premières installations sont plus fiables : si un service système a précréé le répertoire de cache du modèle dans le cache Hugging Face partagé, l'application le reprend avant le téléchargement ; le téléchargement initial ne s'arrête plus sur une erreur de permissions.
  fullDescription: |
    Qwen3.8-Flash-Next est un modèle d'IA expérimental de l'équipe Qwen d'Alibaba conçu pour répondre aux questions et générer du texte, avec des fonctions de réflexion et d'appel d'outils dans les applications compatibles. Cette application exécute localement l'édition quantifiée GSQ-RCO IQ3_S d'ISTA-DASLab avec Strata.

    Strata est un moteur d'inférence open source qui exécute de grands modèles d'IA localement. Il coordonne la mémoire GPU, la mémoire vive du système et le stockage afin que le modèle n'ait pas à tenir entièrement dans la mémoire GPU. Model Console relie le moteur à Olares.

    **Principales fonctionnalités**

    - Générer des réponses textuelles avec un mode de raisonnement et des appels d’outils dans les applications compatibles.
    - Utiliser Model Console pour télécharger le modèle, consulter son état et ajuster les paramètres du moteur.
    - Connecter des applications compatibles via Olares Router ou l’API de chat compatible avec OpenAI.
    - Discutez avec le modèle et suivez en direct la vitesse, la VRAM et les statistiques du cache dans l'interface web Strata incluse (Chat et Statistiques).

    **Cette édition**

    Cette édition accepte du texte et des images en entrée ; l’entrée vidéo est désactivée. La limite de contexte par défaut est de 262 144 tokens, avec une seule requête traitée à la fois. Le contexte disponible dépend de la mémoire et des paramètres du moteur.

    **Avant la première utilisation**

    Au premier démarrage, environ 84 GB de fichiers du modèle sont téléchargés, ainsi que les fichiers supplémentaires nécessaires à Strata, puis le modèle est préparé. Model Console peut indiquer que le téléchargement principal est terminé alors que Strata prépare encore le modèle.

    Sur amd64, un processeur (CPU) prenant en charge AVX2 et un pilote NVIDIA de la série R580 ou ultérieure sont requis. La configuration par défaut est prévue pour un hôte disposant de 96 GiB de RAM. Consultez les ressources requises indiquées avant l’installation.

    [Documentation du modèle](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modèle quantifié](https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Documentation de Strata](https://github.com/Niko1221/Strata)

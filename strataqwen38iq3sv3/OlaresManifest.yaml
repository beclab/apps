spec:
  onlyAdmin: true
  versionName: "0.2.11"
  fullDescription: |
    Qwen3.8-Flash-Next is an experimental AI model from Alibaba's Qwen team for answering questions and generating text, with support for thinking and tool calling in compatible applications. This app runs ISTA-DASLab's GSQ-RCO IQ3_S quantized edition locally using Strata.

    Strata is an open-source inference engine for running large AI models locally. It coordinates GPU memory, system RAM, and storage so the full model does not need to fit in GPU memory. Model Console connects the engine to Olares.

    **Key features**

    - Generate text responses with support for thinking and tool calling in compatible applications.
    - Use Model Console to download the model, view its status, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.
    - Chat with the model and follow live speed, VRAM and cache stats in the bundled Strata web UI (Chat and Statistics).

    **This edition**

    This edition supports text and image input; video input is disabled. The default context limit is 262,144 tokens, with one request processed at a time. Available context depends on memory and engine settings.

    **Before first use**

    First startup downloads approximately 84 GB of model files plus additional files needed by Strata, then prepares the model. Model Console may show the main download as complete while Strata is still preparing the model.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer are required. The preset is intended for a host with 96 GiB of RAM. See the listed resource requirements before installing.

    [Model documentation](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Quantized model](https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF) · [Strata documentation](https://github.com/Niko1221/Strata)
  developer: Niko1221 (Strata engine); Alibaba Cloud (model); ISTA-DASLab (quantization)
  website: https://github.com/Niko1221/Strata
  sourceCode: https://github.com/Niko1221/Strata
  doc: https://github.com/Niko1221/Strata#readme
  submitter: xXm-mXx
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  license:
  - text: Qwen Community License 1.0 (model)
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/main/LICENSE
  - text: Apache License 2.0 (ISTA-DASLab quantization)
    url: https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
  - text: MIT (Strata engine)
    url: https://github.com/Niko1221/Strata/blob/main/LICENSE
  accelerator:
  - mode: nvidia
    limitedCpu: '14'
    requiredCpu: 1300m
    requiredDisk: 120Gi
    limitedDisk: 200Gi
    requiredMemory: 65Gi
    limitedMemory: 83Gi
    requiredGPUMemory: 23Gi
    limitedGPUMemory: 24Gi
  supportArch:
  - amd64
  runAsUser: true
permission:
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
  - name: olares
    version: '>=1.12.7-0'
    type: system
envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF --revision ed59f92082b1e93c0e96d60a8b11aab089b52f09 --include IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf,hf://ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF --revision ed59f92082b1e93c0e96d60a8b11aab089b52f09 --include IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
  description: Two pinned single-file sources sharing one HF snapshot; extras finish before the main model handoff.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: qwen3.8-flash-next-iq3_s
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: thinking,tools,vision
- envName: MODEL_REASONING_EFFORT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "low,medium,xhigh"
  description: "The reasoning_effort levels this model accepts, published on the model card so clients can read them instead of guessing."
- envName: MODEL_REASONING_EFFORT_DEFAULT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "xhigh"
  description: "The level this model uses when a request does not ask for one."
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: --context 262144 --parallel 1 --resident-budget-gib 48 --kv int8 --kv-streaming off --vram-reserve-mib 1024
  description: Strata setup.py options. Model/source/host/port/GPU/vision are managed by the chart. Saving engine_args
    in Model Console relaunches setup and the server; existing packs and MTP files are reused.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '1'
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 64Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '12'
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 80Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 23Gi

metadata:
  title: Codex CLI
  description: OpenAI's lightweight coding agent that runs in your terminal
spec:
  fullDescription: |
    **Overview**
    Codex CLI is OpenAI's lightweight, open-source coding agent that runs locally in your terminal. It understands your codebase, executes routine tasks through natural language, and helps you ship faster while staying in flow.

    **Key Features**
    - Terminal-native TUI with streaming tool output, slash commands, interrupt-and-redirect, and rich diff review.
    - Real file edits, shell execution, git workflows, and test runs driven by natural language.
    - MCP-compatible tool calling and reusable agent instructions via AGENTS.md / `.codex/skills`.
    - Works with a ChatGPT Plus / Pro / Business / Edu / Enterprise plan (OAuth) or an OpenAI API key.
    - Workspace image ships common language runtimes and build toolchains (Python, Node.js, Go, Rust, OpenJDK 21, Ruby, PHP, Lua) plus database clients (PostgreSQL, MySQL/MariaDB, Redis), git-lfs, protobuf compiler, Gradle, tmux, dig/ss/nc, shellcheck, clang-format/tidy, graphviz, and extra -dev headers (libpq, MySQL client, curl, ICU, LDAP) so agents can run typical dev commands without root.
    - Optional DinD (`ENABLE_DIND`, default on): `docker` / `docker compose` in the terminal (privileged sidecar).

    **First-time Setup**
    Open the `Codex CLI` entrance and run `codex` to launch the OAuth login flow ("Sign in with ChatGPT"), or set `OPENAI_API_KEY` in the app environment variables and restart.

    **Use a Local Model (Ollama / OpenAI-compatible Gateway)**
    To route Codex at a local Ollama, Olares Router, or any OpenAI-compatible `/v1` proxy, set these app env vars — no per-session `export`/`unset`. Blank values are omitted from the container and the managed `~/.codex/config.toml` block is removed, so Codex falls back to ChatGPT OAuth / the official API.

    - `OPENAI_BASE_URL` = `http://<your-shared-domain>/v1` (shared entrance of an Ollama / Router / vLLM app)
    - `OPENAI_API_KEY` = dummy or real key the gateway expects (e.g. `ollama` for many Ollama proxies)
    - `CODEX_MODEL` = `qwen3-coder:30b` (or the model that gateway exposes)

    **Switch back to cloud**
    Clear `OPENAI_BASE_URL` and `CODEX_MODEL`, keep or set a real `OPENAI_API_KEY` (or leave it blank and run `codex login`), then restart. The next pod start strips the managed local-routing block.

    **If Codex says it lacks agentic execution capabilities**
    In the Codex terminal, before running `codex`, reinstall the official standalone CLI into the workspace bin:

    `curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_INSTALL_DIR=/opt/data/.local/bin sh`

    This installs the latest complete package (including code-mode host and other dependencies) onto the persisted volume and repairs a binary-only install.
  upgradeDescription: |
    Update bundled Olares CLI to 1.12.7-cli.10 and export its embedded skill suite offline.
    Update PHP 8.3 CLI and extensions to Ubuntu security revision 8.3.6-0ubuntu0.24.04.13 and Composer to 2.10.3.
    Create a new private workspace backup for this Chart revision; retain older backups, existing custom skills and file modes.

    Remove the bundled agent management service and its separate entrance.

    Highlights across this upgrade:
    - Adds searchable /config preferences with immediate changes for supported settings, plus configurable leader shortcuts in /keymap.
    - Follow-ups can immediately steer an active response and interrupt execution; improves saved-session permission recovery and command-output handling.

    https://github.com/openai/codex/releases/tag/rust-v0.163.0

    Upgrade Codex CLI to 0.163.0 with upstream configuration, session recovery and command execution fixes.
    Verify private workspace backups before installation and upstream database migrations.
    Preserve existing skills and file modes; verify the exact installed binary version.
    Bind the Docker API to loopback and exclude it from automatic port forwarding.

metadata:
  title: Codex CLI
  description: El agente de coding ligero de OpenAI que se ejecuta en tu terminal
spec:
  fullDescription: |
    **Resumen**
    Codex CLI es el agente de coding ligero y de código abierto de OpenAI que se ejecuta localmente en tu terminal. Entiende tu base de código, ejecuta tareas rutinarias mediante lenguaje natural y te ayuda a entregar más rápido sin salir del flujo.

    **Funciones clave**
    - TUI nativa de terminal con salida de herramientas en streaming, comandos slash, interrupt-and-redirect y revisión rica de diffs.
    - Ediciones reales de archivos, ejecución de shell, flujos de git y ejecución de tests impulsados por lenguaje natural.
    - Llamadas a herramientas compatibles con MCP e instrucciones de agente reutilizables vía AGENTS.md / `.codex/skills`.
    - Funciona con un plan ChatGPT Plus / Pro / Business / Edu / Enterprise (OAuth) o una clave API de OpenAI.
    - La imagen del workspace incluye runtimes de lenguajes habituales y toolchains de build (Python, Node.js, Go, Rust, OpenJDK 21, Ruby, PHP, Lua) más clientes de base de datos (PostgreSQL, MySQL/MariaDB, Redis), git-lfs, compilador protobuf, Gradle, tmux, dig/ss/nc, shellcheck, clang-format/tidy, graphviz y cabeceras -dev adicionales (libpq, cliente MySQL, curl, ICU, LDAP) para que los agentes puedan ejecutar comandos de desarrollo típicos sin root.
    - DinD opcional (`ENABLE_DIND`, activado por defecto): `docker` / `docker compose` en la terminal (sidecar privilegiado).

    **Configuración inicial**
    Abre la entrance `Codex CLI` y ejecuta `codex` para iniciar el flujo de login OAuth ("Sign in with ChatGPT"), o establece `OPENAI_API_KEY` en las variables de entorno de la app y reinicia.

    **Usar un modelo local (Ollama / gateway compatible con OpenAI)**
    Para dirigir Codex a un Ollama local, Olares Router o cualquier proxy `/v1` compatible con OpenAI, establece estas variables de entorno de la app — sin `export`/`unset` por sesión. Los valores en blanco se omiten del contenedor y se elimina el bloque gestionado de `~/.codex/config.toml`, de modo que Codex vuelve a ChatGPT OAuth / la API oficial.

    - `OPENAI_BASE_URL` = `http://<your-shared-domain>/v1` (entrance compartida de una app Ollama / Router / vLLM)
    - `OPENAI_API_KEY` = clave dummy o real que espera el gateway (p. ej. `ollama` para muchos proxies Ollama)
    - `CODEX_MODEL` = `qwen3-coder:30b` (o el modelo que exponga ese gateway)

    **Volver a la nube**
    Vacía `OPENAI_BASE_URL` y `CODEX_MODEL`, mantén o establece un `OPENAI_API_KEY` real (o déjalo en blanco y ejecuta `codex login`), luego reinicia. El siguiente arranque del pod elimina el bloque gestionado de enrutado local.

    **Si Codex dice que le faltan capacidades de ejecución agentica**
    En la terminal de Codex, antes de ejecutar `codex`, reinstala la CLI standalone oficial en el bin del workspace:

    `curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_INSTALL_DIR=/opt/data/.local/bin sh`

    Esto instala el paquete completo más reciente (incluido el host code-mode y otras dependencias) en el volumen persistente y repara una instalación solo binaria.
  upgradeDescription: |
    Actualiza Olares CLI a 1.12.7-cli.10 y exporta sin conexión sus habilidades integradas.
    Actualiza PHP 8.3 CLI y sus extensiones a la revisión de seguridad de Ubuntu 8.3.6-0ubuntu0.24.04.13, y Composer a 2.10.3.
    Crea una nueva copia privada del espacio de trabajo para esta revisión del Chart; conserva copias anteriores, habilidades personalizadas y permisos.

    Se eliminan el servicio integrado de gestión de agentes y su entrada independiente.

    Novedades de esta actualización entre versiones:
    - Añade preferencias con búsqueda en /config y cambios inmediatos para ajustes compatibles, además de atajos con tecla líder configurable en /keymap.
    - Los mensajes de seguimiento pueden redirigir al instante una respuesta activa e interrumpir la ejecución; mejora la recuperación de permisos de sesiones y la gestión de salida de comandos.

    https://github.com/openai/codex/releases/tag/rust-v0.163.0

    Actualización a Codex CLI 0.163.0 con mejoras de configuración, recuperación de sesiones y ejecución de comandos. Se verifican copias privadas del espacio de trabajo antes de instalar. Se conservan las habilidades y los permisos, se verifica la versión real y la API de Docker solo escucha en la interfaz local.

metadata:
  title: Codex CLI
  description: ターミナルで動作する OpenAI の軽量コーディングエージェント
spec:
  fullDescription: |
    **概要**
    Codex CLI は、ターミナル上でローカルに動作する OpenAI の軽量オープンソース・コーディングエージェントです。コードベースを理解し、自然言語で定型タスクを実行し、フローを保ったままより速く出荷できるよう支援します。

    **主な機能**
    - ストリーミングツール出力、スラッシュコマンド、割り込みとリダイレクト、豊富な diff レビュー付きのターミナルネイティブ TUI。
    - 自然言語による実ファイル編集、シェル実行、git ワークフロー、テスト実行。
    - MCP 互換のツール呼び出しと、AGENTS.md / `.codex/skills` による再利用可能なエージェント指示。
    - ChatGPT Plus / Pro / Business / Edu / Enterprise プラン（OAuth）または OpenAI API キーで動作。
    - ワークスペースイメージには一般的な言語ランタイムとビルドツールチェーン（Python、Node.js、Go、Rust、OpenJDK 21、Ruby、PHP、Lua）に加え、データベースクライアント（PostgreSQL、MySQL/MariaDB、Redis）、git-lfs、protobuf コンパイラ、Gradle、tmux、dig/ss/nc、shellcheck、clang-format/tidy、graphviz、追加の -dev ヘッダー（libpq、MySQL クライアント、curl、ICU、LDAP）が含まれ、エージェントが root なしで典型的な開発コマンドを実行できます。
    - 任意の DinD（`ENABLE_DIND`、デフォルトオン）：ターミナル内で `docker` / `docker compose`（特権サイドカー）。

    **初回セットアップ**
    `Codex CLI` エントランスを開き、`codex` を実行して OAuth ログインフロー（「Sign in with ChatGPT」）を開始するか、アプリ環境変数に `OPENAI_API_KEY` を設定して再起動します。

    **ローカルモデルを使う（Ollama / OpenAI 互換ゲートウェイ）**
    Codex をローカル Ollama、Olares Router、または任意の OpenAI 互換 `/v1` プロキシに向けるには、これらのアプリ環境変数を設定します — セッションごとの `export`/`unset` は不要。空の値はコンテナから省略され、管理対象の `~/.codex/config.toml` ブロックが削除されるため、Codex は ChatGPT OAuth / 公式 API にフォールバックします。

    - `OPENAI_BASE_URL` = `http://<your-shared-domain>/v1`（Ollama / Router / vLLM アプリの共有エントランス）
    - `OPENAI_API_KEY` = ゲートウェイが期待するダミーまたは実キー（多くの Ollama プロキシでは例：`ollama`）
    - `CODEX_MODEL` = `qwen3-coder:30b`（またはそのゲートウェイが公開するモデル）

    **クラウドに戻す**
    `OPENAI_BASE_URL` と `CODEX_MODEL` をクリアし、実の `OPENAI_API_KEY` を維持または設定（または空のまま `codex login` を実行）して再起動。次回の Pod 起動で管理対象のローカルルーティングブロックが除去されます。

    **Codex がエージェンティック実行機能がないと表示する場合**
    Codex ターミナルで `codex` を実行する前に、公式スタンドアロン CLI をワークスペース bin に再インストールします：

    `curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_INSTALL_DIR=/opt/data/.local/bin sh`

    これは最新の完全パッケージ（code-mode ホストや他の依存関係を含む）を永続ボリュームにインストールし、バイナリのみのインストールを修復します。
  upgradeDescription: |
    同梱の Olares CLI を 1.12.7-cli.10 に更新し、内蔵スキルをオフラインで展開します。
    PHP 8.3 CLI と拡張機能を Ubuntu セキュリティリビジョン 8.3.6-0ubuntu0.24.04.13 に、Composer を 2.10.3 に更新します。
    この Chart リビジョン用の新しい非公開バックアップを作成し、以前のバックアップ、カスタムスキル、ファイル権限を保持します。

    同梱のエージェント管理サービスと独立した管理入口を削除します。

    今回の複数バージョンにわたる更新の主な変更：
    - 検索可能な /config 設定画面を追加し、対応する設定は即時反映。/keymap でプレフィックスキーを設定可能。
    - 応答中の追加指示ですぐに進行を変更し、実行を中断できます。保存したセッションの権限復元とコマンド出力の処理も改善。

    https://github.com/openai/codex/releases/tag/rust-v0.163.0

    Codex CLI 0.163.0 に更新し、設定、セッション復元、コマンド実行の修正を反映します。インストール前にワークスペースの非公開バックアップを検証します。既存のスキルと権限を保持し、実際のバージョンを確認します。Docker API はローカル接続のみ受け付けます。

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-upgrade
  namespace: {{ .Release.Namespace }}
data:
  backup.py: |
    import hashlib,json,os,tarfile,sqlite3,tempfile
    from pathlib import Path
    os.umask(0o077)
    root=Path('/upgrade-backups')
    generation='{{ .Chart.AppVersion }}-chart-{{ .Chart.Version }}'
    def sha(p):
     h=hashlib.sha256()
     with p.open('rb') as f:
      for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
     return h.hexdigest()
    for home,label in [(Path('/opt/data'),'workspace')]:
     target=root/('before-'+generation+'-'+label+'.tar');marker=target.with_suffix('.json')
     if marker.exists():
      saved=json.loads(marker.read_text());assert target.exists() and sha(target)==saved['sha256'],'Backup verification failed'
      print(label+': previously verified backup retained');continue
     assert not target.exists(),'Unverified backup already exists; preserve for inspection'
     inventory={};databases=[]
     with tarfile.open(target,'w',dereference=False) as t:
      for p in sorted(home.rglob('*')):
       rel=p.relative_to(home).as_posix()
       if p.is_symlink():inventory[rel]={'link':os.readlink(p)}
       elif p.is_file():inventory[rel]={'sha256':sha(p),'size':p.stat().st_size,'mode':p.stat().st_mode&0o777}
       t.add(p,arcname=rel,recursive=False)
     with tarfile.open(target) as t:
      for name,item in inventory.items():
       m=t.getmember(name)
       if 'link' in item:assert m.issym() and m.linkname==item['link']
       else:
        h=hashlib.sha256();f=t.extractfile(m)
        for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
        assert h.hexdigest()==item['sha256'] and m.size==item['size']
        p=home/name
        with p.open('rb') as f:magic=f.read(16)
        if magic==b'SQLite format 3\x00':
         backup=root/(generation+'-'+label+'-sqlite-'+hashlib.sha256(name.encode()).hexdigest()[:16]+'.sqlite')
         assert not backup.exists(),'An unverified SQLite backup exists; preserve for inspection'
         src=sqlite3.connect(p.as_uri()+'?mode=ro',uri=True);dst=sqlite3.connect(backup);src.backup(dst)
         assert dst.execute('PRAGMA integrity_check').fetchone()[0]=='ok';src.close();dst.close()
         with tempfile.TemporaryDirectory(prefix='olares-sqlite-restore-') as temp:
          restored=Path(temp)/'restored.sqlite';restored.write_bytes(backup.read_bytes());db=sqlite3.connect(restored)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok';db.close()
         databases.append({'path':name,'backup':backup.name,'sha256':sha(backup),'integrity':'ok','restore':'ok'})
     saved={'sha256':sha(target),'files':len(inventory),'bytes':sum(i.get('size',0) for i in inventory.values()),'inventory':inventory,'databases':databases}
     marker.write_text(json.dumps(saved));print(json.dumps({'label':label,**{k:v for k,v in saved.items() if k!='inventory'}}))

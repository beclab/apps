olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  mindwtr: 1

metadata:
  name: mindwtr
  description: A free, offline-first task management app with Cloud sync, MCP interface, and PWA — all in one container.
  icon: https://raw.githubusercontent.com/dongdongbh/Mindwtr/main/apps/desktop/src-tauri/icons/128x128@2x.png
  appid: mindwtr
  version: '1.1.0'
  title: Mindwtr
  categories:
  - Productivity_v112
  - workspace
  tags:
  - gtd
  - tasks
  - mcp
  - self-hosted

permission:
  appData: true
  appCache: true

spec:
  versionName: '1.3.7'
  fullDescription: |
    Mindwtr is a free, privacy-first task management app built on the Getting Things Done (GTD) methodology.

    This package merges all three components into a single container with a single port:

    1. **Mindwtr Cloud** — Sync service & REST API. Mobile and desktop apps can sync through it.
    2. **Mindwtr MCP helper** — Exposes task data as an MCP interface so AI assistants can read and write tasks directly.
    3. **PWA web client** — Use it directly in your browser, no installation needed.

    A single nginx entry point (port 8080) routes by path:
    - `/v1/*` → Cloud sync API
    - `/mcp` → MCP interface (Streamable HTTP, enabled by default)
    - Everything else → PWA web client

    Data is stored in the app data directory and is preserved across upgrades.
  upgradeDescription: |
    v1.1.0: Merged Cloud + MCP helper + PWA into a single container.
    MCP is enabled by default — AI assistants can connect to /mcp with their token.

    First install: fill in two tokens on the install screen.
    - MINDWTR_CLOUD_AUTH_TOKENS: Cloud access token (comma-separated, 20-512 chars each).
      Use the same token in the mobile/desktop App under "self-hosted sync".
    - MINDWTR_MCP_HTTP_TOKEN: Bearer token for MCP clients accessing /mcp (min 16 chars).
    Generate with: openssl rand -hex 32
  developer: dongdongbh
  website: https://mindwtr.app
  sourceCode: https://github.com/dongdongbh/Mindwtr
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  doc: https://docs.mindwtr.app/
  requiredMemory: 256Mi
  limitedMemory: 1024Mi
  requiredDisk: 256Mi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64

options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

  envs:
  - envName: MINDWTR_CLOUD_AUTH_TOKENS
    type: string
    required: true
    editable: true
    applyOnChange: true
    description: |
      Cloud access token (comma-separated). Pattern from upstream BEARER_TOKEN_PATTERN:
      Each token 20-512 chars, charset [A-Za-z0-9._~+/=-].
      Generate: openssl rand -hex 32
      Use this token in the mobile/desktop App under "Self-hosted sync".
  - envName: MINDWTR_MCP_HTTP_TOKEN
    type: string
    required: true
    editable: true
    applyOnChange: true
    description: |
      Bearer token for MCP clients accessing /mcp. Minimum 16 chars (20+ recommended).
      This is separate from the Cloud token — do not reuse.
      Generate: openssl rand -hex 32
  - envName: MINDWTR_CLOUD_CORS_ORIGIN
    type: string
    required: false
    editable: true
    applyOnChange: true
    description: |
      Full origin URL for the browser PWA client (e.g. https://mindwtr.example.com).
      Only one origin is allowed. Leave empty to use same-origin auto-detection.
  - envName: MINDWTR_MCP_WRITE
    type: bool
    default: 'true'
    required: false
    editable: true
    applyOnChange: true
    description: |
      Whether MCP allows write access. Upstream helper defaults to read-only in Cloud mode.
      Keep true to allow AI assistants to modify tasks; set false for read-only.

entrances:
- name: mindwtr
  port: 8080
  host: mindwtr-svc
  title: Mindwtr
  icon: https://raw.githubusercontent.com/dongdongbh/Mindwtr/main/apps/desktop/src-tauri/icons/128x128@2x.png
  authLevel: public
  openMethod: window

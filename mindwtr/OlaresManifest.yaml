olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  mindwtr: 1
metadata:
  name: mindwtr
  description: A free, offline-first task management app built on Getting Things Done (GTD) methodology.
  icon: https://raw.githubusercontent.com/dongdongbh/Mindwtr/main/apps/desktop/src-tauri/icons/128x128@2x.png
  appid: mindwtr
  version: '1.0.0'
  title: Mindwtr
  categories:
  - Productivity_v112
  - workspace
permission:
  appData: true
  appCache: true
spec:
  versionName: '1.3.3'
  fullDescription: |
    Mindwtr is a free, privacy-first task management app built on the Getting Things Done (GTD) methodology.

    **Key Features:**
    - **GTD Workflow**: Inbox, Next Actions, Projects, Waiting, Someday/Maybe, and Archive.
    - **Fast Capture & Processing**: Quickly dump ideas and tasks with context tags, priorities, reminders, and due dates.
    - **Multi-Platform Sync**: Works on Web, Windows, macOS, Linux, iOS, and Android with self-hosted Mindwtr Cloud.
    - **Privacy & Ownership**: All data stays on your device and your personal Olares cloud, with multi-token isolated namespaces.
    - **Task Automation REST API**: Built-in REST API for scripting and workflow integrations.
  upgradeDescription: |
    Initial release of Mindwtr on Olares:
    - Bundles Mindwtr Web (PWA) and Mindwtr Cloud (sync server + REST API).
    - Unified single-domain reverse proxy for seamless same-origin sync.
    - Zero-CORS setup with auto-detected sync server.
    - Supports multi-device sync across Windows, macOS, Linux, iOS, and Android.
  developer: dongdongbh
  website: https://mindwtr.app
  sourceCode: https://github.com/dongdongbh/Mindwtr
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 256Mi
  limitedMemory: 1024Mi
  requiredDisk: 256Mi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:

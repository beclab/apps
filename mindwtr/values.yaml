# 三合一镜像（Cloud + MCP helper + PWA 合并在单个容器内）
image:
  repository: ghcr.io/inverstar/mindwtr-merged
  tag: "1.3.7"
  pullPolicy: IfNotPresent

workloads:
  mindwtr:
    replicaCount: 1

# 容器内 nginx 的监听端口，也是 Olares entrance / Service 暴露的端口
containerPort: 8080

# 环境变量默认值。
# 优先级：Olares 清单里 options.envs 声明的用户输入 > 这里的默认值。
# 密钥（token）留空，交给用户在 Olares 安装界面填写。
env:
  # Cloud 允许的 Bearer token，逗号分隔，每个 20-512 字符
  cloudAuthTokens: ""
  # MCP 客户端访问 /mcp 用的 Bearer token，最少 16 字符
  mcpHttpToken: ""
  # helper 访问 Cloud 用的 token，必须是上面某个 token；留空则复用 cloudAuthTokens 的第一个
  mcpCloudToken: ""
  # 浏览器打开 PWA 的完整地址（含 scheme），只能设一个
  cloudCorsOrigin: ""
  # PWA 首次打开时预填的 Cloud 地址，留空则用同源自动探测
  defaultCloudUrl: ""
  # helper 是否允许写入（官方默认 Cloud 模式只读）
  mcpWrite: "true"

resources:
  requests:
    cpu: "0.1"
    memory: 256Mi
  limits:
    cpu: "2.0"
    memory: 1Gi

# 探针打容器内 nginx 的 /healthz（转发给 MCP helper）
probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

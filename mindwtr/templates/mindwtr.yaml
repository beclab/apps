{{- /*
Olares 会把 options.envs 里声明的变量注入 .Values.olaresEnv，
这里优先取用户填的值，取不到再退回 values.yaml 里的默认值。
*/ -}}
{{- $olaresEnv := .Values.olaresEnv | default dict -}}
{{- $env := .Values.env | default dict -}}
{{- $cloudTokens := get $olaresEnv "MINDWTR_CLOUD_AUTH_TOKENS" | default (get $env "cloudAuthTokens") | default "" -}}
{{- $mcpHttpToken := get $olaresEnv "MINDWTR_MCP_HTTP_TOKEN" | default (get $env "mcpHttpToken") | default "" -}}
{{- $mcpCloudToken := get $olaresEnv "MINDWTR_MCP_CLOUD_TOKEN" | default (get $env "mcpCloudToken") | default "" -}}
{{- $corsOrigin := get $olaresEnv "MINDWTR_CLOUD_CORS_ORIGIN" | default (get $env "cloudCorsOrigin") | default "" -}}
{{- $defaultCloudUrl := get $olaresEnv "MINDWTR_DEFAULT_CLOUD_URL" | default (get $env "defaultCloudUrl") | default "" -}}
{{- $mcpWrite := get $olaresEnv "MINDWTR_MCP_WRITE" | default (get $env "mcpWrite") | default "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mindwtr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mindwtr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workloads.mindwtr.replicaCount }}
  selector:
    matchLabels:
      {{- include "mindwtr.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "mindwtr.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mindwtr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            # --- Cloud ---
            - name: MINDWTR_CLOUD_AUTH_TOKENS
              value: {{ $cloudTokens | quote }}
            - name: MINDWTR_CLOUD_CORS_ORIGIN
              value: {{ $corsOrigin | quote }}
            # nginx 在 Cloud 前面，转发头必须显式信任才生效
            - name: MINDWTR_CLOUD_TRUST_PROXY_HEADERS
              value: "true"
            - name: MINDWTR_CLOUD_TRUSTED_PROXY_IPS
              value: "127.0.0.1"
            - name: MINDWTR_CLOUD_DATA_DIR
              value: "/app/cloud_data"
            # --- MCP helper ---
            - name: MINDWTR_MCP_HTTP_TOKEN
              value: {{ $mcpHttpToken | quote }}
            - name: MINDWTR_MCP_CLOUD_TOKEN
              value: {{ if $mcpCloudToken }}{{ $mcpCloudToken | quote }}{{ else }}{{ $cloudTokens | quote }}{{ end }}
            - name: MINDWTR_MCP_WRITE
              value: {{ $mcpWrite | quote }}
            # helper 在容器内访问 Cloud，走回环 HTTP，因此要允许 insecure
            - name: MINDWTR_MCP_CLOUD_ALLOW_INSECURE_HTTP
              value: "true"
            - name: MINDWTR_MCP_HTTP_HOST
              value: "127.0.0.1"
            - name: MINDWTR_MCP_HTTP_PORT
              value: "8723"
            # --- PWA ---
            - name: MINDWTR_DEFAULT_CLOUD_URL
              value: {{ $defaultCloudUrl | quote }}
            - name: MINDWTR_PWA_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /app/cloud_data
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory }}
      volumes:
        # 数据卷：Cloud 的数据目录。升级/换镜像时保留它。
        - name: data
          hostPath:
            path: "{{ .Values.userspace.appData }}/cloud_data"
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mindwtr.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mindwtr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mindwtr.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}

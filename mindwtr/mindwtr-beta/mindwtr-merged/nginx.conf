# Mindwtr 三合一统一入口（nginx）
#
# 路径分配：
#   = /mcp     → MCP helper（127.0.0.1:8723），MCP Streamable HTTP，仅 POST
#   = /healthz → MCP helper 存活探测（免鉴权，返回 ok）
#   = /health  → Cloud（127.0.0.1:8787）存活探测
#   = /ready   → Cloud 就绪探测（免鉴权，会对数据卷做一次写+fsync）
#   ^~ /v1/    → Cloud 同步 REST API
#   /assets/   → PWA 带哈希的静态资源（永久缓存）
#   /          → PWA 静态（SPA 回落 index.html）
#
# 关于安全响应头：上游 docker/app/nginx.conf 的注释明确说明
# 「add_header in a location disables inheritance, so the security headers are repeated here and below」，
# 因此下面每个 location 都完整重复一遍 CSP 及其它安全头，不能只写在 server 块里。
#
# 关于 Origin：MCP helper 的 isAllowedOrigin(origin, host) 规定——
# 请求带 Origin 时，其 hostname 必须等于 helper 绑定的 host（127.0.0.1），否则返回 403 forbidden_origin。
# 浏览器发起的 MCP 请求 Origin 是公网域名，必然不匹配，所以这里必须把 Origin 摘掉；
# 摘掉后 helper 走「无 Origin 即非浏览器客户端，直接放行」的分支。Authorization 原样透传。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PWA 静态与 Cloud 的 API 在同一域名下，客户端最大请求体与 Cloud 的同步文档上限对齐。
    client_max_body_size 64m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- MCP：转发给同容器内的 helper 进程 -------------------------------------
    # helper 的 http-server.ts 用精确路径匹配，/mcp 只接受 POST，/healthz 只接受 GET，
    # 所以这里必须用 location = 精确匹配，不能用前缀匹配（/mcp/xxx 会被 helper 判 404）。
    location = /mcp {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # helper 的请求体上限是 MAX_HTTP_BODY_BYTES = 1 MiB，这里对齐，超大体会被 nginx 挡掉。
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;

        # 剥掉 Origin（否则浏览器来源会被 helper 判 403 forbidden_origin）。
        # Host 保留为上游地址：node:http 在 HTTP/1.1 下需要 Host 头，不能删。
        proxy_set_header Origin "";
        proxy_set_header Host $proxy_host;

        # SSE / 流式响应：必须关闭缓冲与请求缓冲，否则 MCP 的流式结果会被攒成一坨再吐。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location = /healthz {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin "";
        proxy_read_timeout 30s;
    }

    # --- Cloud：存活与就绪探测 --------------------------------------------------
    location = /health {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 30s;
    }

    location = /ready {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 30s;
    }

    # --- Cloud：同步 REST API --------------------------------------------------
    # 注意 Cloud 端要认转发头必须同时设 MINDWTR_CLOUD_TRUST_PROXY_HEADERS=true 与
    # MINDWTR_CLOUD_TRUSTED_PROXY_IPS=127.0.0.1，否则它会忽略 X-Forwarded-For。
    location ^~ /v1/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # --- PWA ------------------------------------------------------------------
    # Hashed build assets: cache forever, and a missing chunk must 404 so the
    # client can recover — never fall back to index.html.
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (index.html, sw.js, manifest, icons) must revalidate so a
    # redeployed image is picked up instead of serving stale chunk references.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

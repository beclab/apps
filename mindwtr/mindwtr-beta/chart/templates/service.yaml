apiVersion: v1
kind: Service
metadata:
  name: {{ include "mindwtr.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mindwtr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mindwtr.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}

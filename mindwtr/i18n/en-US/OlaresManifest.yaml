metadata:
  title: Mindwtr
  description: A free, offline-first GTD task manager with Cloud sync, MCP interface, and PWA — all in one container.
spec:
  fullDescription: |
    Mindwtr is a free, privacy-first task management app built on the Getting Things Done (GTD) methodology.

    This package merges all three components into a single container with a single port:

    1. **Mindwtr Cloud** — Sync service & REST API. Mobile and desktop apps can sync through it.
    2. **Mindwtr MCP helper** — Exposes task data as an MCP interface so AI assistants can read and write tasks directly.
    3. **PWA web client** — Use it directly in your browser, no installation needed.

    A single nginx entry point (port 8080) routes by path:
    - `/v1/*` → Cloud sync API
    - `/mcp` → MCP interface (enabled by default)
    - Everything else → PWA web client

    Data is stored in the app data directory and is preserved across upgrades.
  upgradeDescription: |
    v1.1.0: Merged Cloud + MCP helper + PWA into a single container.
    MCP is enabled by default.

    First install: fill in two tokens on the install screen.
    - MINDWTR_CLOUD_AUTH_TOKENS: Cloud access token (comma-separated, 20-512 chars each).
    - MINDWTR_MCP_HTTP_TOKEN: Bearer token for MCP clients (min 16 chars).
    Generate: openssl rand -hex 32

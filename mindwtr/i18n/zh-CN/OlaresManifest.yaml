metadata:
  title: Mindwtr
  description: 基于「搞定」（GTD）方法论的免费离线待办任务管理应用，支持跨平台多端同步。
spec:
  fullDescription: |
    **把脑子里的事都倒出来。**

    Mindwtr 是一款基于「搞定」（Getting Things Done，GTD）方法的免费待办和任务管理应用。可离线使用，无需账号，注重隐私。

    **主要功能：**
    - **GTD 流程全覆盖**：收集箱（Inbox）、下一步行动（Next）、项目（Projects）、等待（Waiting）、将来/也许（Someday）及归档。
    - **极速收集与处理**：快速记录灵感与任务，支持上下文标签、优先级、提醒和截止日期。
    - **多端同步与跨平台**：支持 Web、Windows、macOS、Linux、iOS 及 Android 端，通过私有部署的 Mindwtr Cloud 同步数据。
    - **数据安全与隐私**：所有数据均保存在本地和您的 Olares 私有云中，支持多 Token 用户数据隔离。
    - **REST API 自动化**：内置 REST API，方便与其他自动化工具集成。
  upgradeDescription: |
    Olares 首发版本：
    - 集成 Mindwtr Web（PWA 网页版）与 Mindwtr Cloud（同步与 REST API 服务端）。
    - 采用一体化反向代理架构，Web 与 API 同源，实现零 CORS 跨域配置开箱即用。
    - 自动识别云同步地址，仅需设置 Token 即可无缝同步。
    - 支持桌面与移动端客户端（iOS / Android / Win / Mac）直接连接 Olares 域名进行同步。

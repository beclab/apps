metadata:
  title: Mindwtr
  description: 免费、离线优先的 GTD 任务管理应用，Cloud 同步 + MCP 接口 + 网页端三合一
spec:
  fullDescription: |
    Mindwtr 是一个免费、隐私优先的 GTD（Getting Things Done）任务管理应用。

    本包将三个组件合并进单个容器，只暴露一个端口：

    1. **Mindwtr Cloud** — 同步服务与 REST API，手机 App、桌面 App 可通过它同步。
    2. **Mindwtr MCP helper** — 将任务数据以 MCP 接口暴露，AI 助手可直接读写任务。
    3. **PWA 网页端** — 浏览器里直接用，无需安装。

    nginx 统一入口（端口 8080）按路径分流：
    - `/v1/*` → Cloud 同步 API
    - `/mcp` → MCP 接口（Streamable HTTP，默认开启）
    - 其余路径 → PWA 网页端

    数据保存在应用数据目录，升级镜像不会丢失。
  upgradeDescription: |
    v1.1.7：Mindwtr 从 1.3.7 升级到 1.3.8，使用重建镜像 tag 1.3.8。
    - 重建镜像保留了 1.3.7-r2 已验证的 WORKDIR /app 与启动默认值；tag 必须换新值，
      因为 Deployment 是 imagePullPolicy: IfNotPresent，沿用旧 tag 不会重新拉取。
    - 桌面端：个人与工作可用独立工作区，数据、同步设置与登录互不干扰；支持用
      Windows Hello 或 Touch ID 锁定应用。
    - 任务：可把只有标题的 Inbox 项直接移入其他任务的清单（支持撤销），处理时可选择
      项目分区，支持提前开始与到期提醒、为每个保存的搜索保留排序、拖动项目分区标题排序。
    - 同步与启动更稳健：缺失附件不再阻塞同步，中断的数据库迁移可恢复，外部创建的
      日历事件会被保留。
    - Local API 与 MCP 的任务写入可检测过期编辑并安全重试。
    v1.1.6：添加 AIDockerCloud 到应用维护者列表。
    v1.1.0：Cloud + MCP helper + PWA 合并为单容器。
    MCP 默认开启，AI 助手可用 token 连接 /mcp。

    首次安装：请在安装界面填写两个 token。
    - MINDWTR_CLOUD_AUTH_TOKENS：Cloud 访问 token（逗号分隔，每个 20-512 字符）。
      手机/桌面 App「自托管同步」填同一 token。
    - MINDWTR_MCP_HTTP_TOKEN：MCP 客户端访问 /mcp 的 Bearer token（至少 16 字符）。
    生成方式：openssl rand -hex 32

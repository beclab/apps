  appCache: true

options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system

envs:
  - envName: LLM_BASE_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ''
    description: Optional default OpenAI-compatible AI endpoint (parents can also choose a model in the app's Settings)
  - envName: LLM_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ''
    description: Optional default model name
  - envName: LLM_API_KEY
    required: false
    type: password
    editable: true
    applyOnChange: true
    default: ''
    description: Optional API key for the default endpoint

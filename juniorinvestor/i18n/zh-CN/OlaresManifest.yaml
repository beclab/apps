olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: ''

metadata:
  name: juniorinvestor
  appid: juniorinvestor
  title: '少年投资家'
  description: '儿童/青少年投资学习与模拟交易'
  icon: https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/icon.png
  version: '0.2.2'
  categories:
    - Lifestyle
    - agents
  tags:
    - education
    - investing
    - kids

entrances:
  - name: juniorinvestor
    host: juniorinvestor
    port: 8000
    title: '少年投资家'
    icon: https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/icon.png
    authLevel: private
    openMethod: window

spec:
  versionName: '0.2.2'
  runAsUser: true
  fullDescription: |
    少年投资家是一个安静、私密的地方，帮助 10–18 岁的孩子用虚拟资金学习优秀投资者是如何思考的。

    **三件事，一个学习闭环**

    - **请教大师**：与基于巴菲特、彼得·林奇、格雷厄姆、芒格公开投资思想构建的 AI 教学角色对话。回答会按孩子的年龄调整难度；涉及股价、营收、估值等当前事实时，一定先用工具查询，绝不凭空猜测。
    - **研究一家公司**：输入股票代码、公司名或一个问题（例如“为什么 Costco 的估值一直比较高？”）。投研 Agent 会收集实时行情、财务报表、估值指标、SEC 公告和新闻，生成带来源标注的研究报告（一分钟了解公司、商业模式、增长来源、乐观/悲观情景、什么会改变判断……）。表格里的数字直接来自数据，而不是 AI 生成。
    - **模拟盘练习**：用虚拟资金（默认 100 万美元）按真实市场价格买卖美股和 ETF，跟踪盈亏。每次交易都会问“你为什么做这笔交易？”，并记录到投资日志中，方便日后复盘。

    **为家庭设计**

    - 家长模式由 PIN 保护：创建孩子档案、设置初始资金和每日 AI 使用额度、重置账户、查看学习进度。
    - 完整中英双语；中文界面的金融术语同时标注英文全称和缩写。
    - 不连接真实券商、不涉及真实资金、没有杠杆、没有排行榜、不鼓励频繁交易——奖励只给研究、写日志和学习。
    - 本地优先：档案、交易、日志和对话都保存在你的 Olares 上。AI 可以使用 Olares 本机模型，也可以由家长在设置里选择任何 OpenAI 兼容的云端模型（OpenAI、Claude、Gemini、DeepSeek、OpenRouter、通义千问等）。

    不构成投资建议，行情数据可能有延迟。
  upgradeDescription: |
    家长现在可以在“设置”中选择 AI 模型：Olares 本机模型，或任何 OpenAI 兼容的云端模型。移动网络和本地模型加载期间的流式回答更稳定。
  developer: Lucas Lu
  website: https://github.com/Drlucaslu/junior-investor
  sourceCode: https://github.com/Drlucaslu/junior-investor
  submitter: Lucas Lu
  doc: https://github.com/Drlucaslu/junior-investor#readme
  locale:
    - en-US
    - zh-CN
  promoteImage:
    - https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/screenshot-1.webp
    - https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/screenshot-2.webp
    - https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/screenshot-3.webp
    - https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/screenshot-4.webp
    - https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/screenshot-5.webp
    - https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/screenshot-6.webp
  featuredImage: https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/featured.webp
  license:
    - text: MIT
      url: https://github.com/Drlucaslu/junior-investor/blob/main/LICENSE
  requiredCpu: 100m
  limitedCpu: '2'
  requiredMemory: 256Mi
  limitedMemory: 2Gi
  requiredDisk: 200Mi
  limitedDisk: 5Gi
  supportArch:
    - amd64

permission:
  appData: true
  appCache: true

options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.0-0'
      type: system

envs:
  - envName: LLM_BASE_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ''
    description: Optional default OpenAI-compatible AI endpoint (parents can also choose a model in the app's Settings)
  - envName: LLM_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ''
    description: Optional default model name
  - envName: LLM_API_KEY
    required: false
    type: password
    editable: true
    applyOnChange: true
    default: ''
    description: Optional API key for the default endpoint

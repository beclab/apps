  appid: juniorinvestor
  title: 'Junior Investor'
  description: 'Kids learn investing: AI masters, research & paper trading'
  icon: https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/icon.png
  version: '0.2.2'
  categories:
    - Lifestyle
    - agents
  tags:
    - education
    - investing
    - kids

entrances:
  - name: juniorinvestor
    host: juniorinvestor
    port: 8000
    title: 'Junior Investor'
    icon: https://raw.githubusercontent.com/Drlucaslu/junior-investor/main/deploy/market/assets/icon.png
    authLevel: private

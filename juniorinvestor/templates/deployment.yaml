apiVersion: apps/v1
kind: Deployment
metadata:
  name: juniorinvestor
  namespace: {{ .Release.Namespace }}
  labels:
    app: juniorinvestor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: juniorinvestor
  template:
    metadata:
      labels:
        app: juniorinvestor
    spec:
      initContainers:
        - name: init-permissions
          image: docker.io/beclab/busybox:1.37
          command: ["sh", "-c", "mkdir -p /data && chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: juniorinvestor
          image: ghcr.io/drlucaslu/junior-investor:0.2.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: production
            - name: HOME
              value: /data
            - name: DATABASE_URL
              value: sqlite:////data/junior_investor.db
            - name: LLM_PROVIDER
              value: olares-local
            - name: LLM_BASE_URL
              value: {{ (.Values.olaresEnv).LLM_BASE_URL | default "" | quote }}
            - name: LLM_MODEL
              value: {{ (.Values.olaresEnv).LLM_MODEL | default "" | quote }}
            - name: LLM_API_KEY
              value: {{ (.Values.olaresEnv).LLM_API_KEY | default "" | quote }}
            - name: LLM_TIMEOUT
              value: "300"
            - name: MARKET_DATA_PROVIDER
              value: yahoo
            - name: FUNDAMENTALS_PROVIDER
              value: yahoo
            - name: SEARCH_PROVIDER
              value: duckduckgo
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.userspace.appData }}/juniorinvestor
            type: DirectoryOrCreate

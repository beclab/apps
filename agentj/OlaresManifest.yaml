olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: agentj
  appid: agentj
  title: Agent J
  description: A phone remote for the AI coding agent running on your Olares
  icon: https://agentj.app/olares/agentj-icon-256.png
  version: 0.2.10
  categories:
  - Developer Tools
  - Productivity_v112
  - AI
  - agents
  - developer
entrances:
- name: agentj
  host: agentj-svc
  port: 8080
  title: Agent J
  icon: https://agentj.app/olares/agentj-icon-256.png
  authLevel: private
  openMethod: window
- name: terminal
  host: terminal
  port: 80
  title: Agent J Terminal
  icon: https://agentj.app/olares/agentj-icon-256.png
  authLevel: private
  openMethod: window
  invisible: true
spec:
  versionName: '0.26.4a1'
  upgradeDescription: |
    - [all] Use agentj file show in an admitted owner phone turn to attach a local file to the current page; without a live owner turn it fails explicitly.
    - [all] Complete local image references can appear while a turn is running, without waiting for tools and the reply to finish.
    - [all] Image preparation and failure states are clearer. A queued or attached-to-page receipt does not mean the client downloaded the file or the owner saw it.
  featuredImage: https://agentj.app/olares/agentj-promote-1.png
  promoteImage:
  - https://agentj.app/olares/agentj-promote-1.png
  - https://agentj.app/olares/agentj-promote-2.png
  - https://agentj.app/olares/agentj-promote-3.png
  fullDescription: |
    **Overview**
    Agent J connects your phone to an AI coding agent running on your Olares. You send a message from the phone, the agent works on this machine, and every risky step waits for your approval on the phone.

    **Key Features**
    - Phone remote for the agent: messages, replies, files, screenshots, and approval cards for commands and file changes.
    - Uses the local models on your Olares: on first start, OpenCode is connected to Olares Router and its first ready chat model. No API key is needed for local models.
    - Can also run Claude Code, Codex, Kimi Code or Qwen Code with your own account or key.
    - Agent J's sandbox (bubblewrap) hides Agent J's own keys and pairing data from the agent; spending, deleting, sending and credential changes always wait for your approval on the phone.
    - Work files are kept in Home/AgentJ, visible in Files; Agent J's settings and keys stay in the app's Data folder.
    - Agent J, OpenCode and the sandbox come preinstalled in the app's own image (read-only), so nothing is downloaded at first start and new versions arrive as app upgrades in Market.

    **First-time Setup**
    1. Buy or reuse a seat at https://agentj.app/account and press "Copy installation prompt" on an empty seat card.
    2. Open Agent J on your Olares desktop and paste it. The page binds this Olares to that seat.
    3. On your phone, open the account page, choose "Add a remote" on this Olares' seat card and confirm with your passkey.

    **Requirements**
    - An Agent J seat (paid subscription on agentj.app).
    - Outbound internet access to agentj.app.
    - Olares Router with a running chat model, if you want local models.
  developer: Agent J
  website: https://agentj.app
  sourceCode: https://github.com/preangelleo/agentj
  submitter: Agent J
  doc: https://agentj.app/docs/
  locale:
  - en-US
  - zh-CN
  requiredMemory: 512Mi
  limitedMemory: 8Gi
  requiredDisk: 1Gi
  limitedDisk: 50Gi
  requiredCpu: 200m
  limitedCpu: 4
  supportArch:
  - amd64
  - arm64
permission:
  appData: true
  userData:
  - Home/AgentJ
options:
  apiTimeout: 120
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
workloadReplicas:
  agentj: 1
  terminal: 1

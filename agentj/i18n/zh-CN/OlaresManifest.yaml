metadata:
  title: Agent J
  description: 用手机遥控 Olares 上运行的 AI 编程 Agent
spec:
  upgradeDescription: |
    - 官网每一页右下角多了 Agent J 客服按钮，也可以直接打开 support.agentj.app 问：免费，分游客、验证邮箱、已登录、有席位四档；验证邮箱后可以转人工，有席位的用户还能发截图。发得太快时消息会排队，到点合成一条发出。
    - 屏幕求助：自动化卡在二维码、验证码或人机验证时，Agent J 把二维码或整屏截图发到你配对好的手机上，你扫码、点「完成」或回一句答案，它接着干（`agentj qr push`、`agentj screen ask`）。
    - 网页终端：在手机的「设置 → 安全 → 网页终端」里用电脑的命令行。默认关闭，只能在电脑上运行 `agentj terminal enable` 打开，每次打开都要 Face ID，用完自动关。
    - Jev 安全审核可以三选一：TypeSafe、OpenRouter 或关闭，在「设置 → 安全」里切换；安装时也会请你选一种。
    - Bots 商用设置：每个 Bot 的额度、备用模型、对话保留期、回答附上来源、可改的固定话术，以及一行代码挂到你自己网站上的加密客服窗口。
  fullDescription: |
    **概述**
    Agent J 把你的手机连到运行在 Olares 上的 AI 编程 Agent。你在手机上发消息，Agent 在这台机器上干活；每一步有风险的操作，都要先在手机上经你批准。

    **主要功能**
    - 手机就是 Agent 的遥控器：消息、回复、文件、截图，以及命令和文件改动的审批卡片。
    - 直接用 Olares 上的本地模型：首次启动时，OpenCode 会自动接上 Olares Router 和它第一个就绪的聊天模型。用本地模型不需要 API key。
    - 也可以用你自己的账号或 key 运行 Claude Code、Codex、Kimi Code 或 Qwen Code。
    - Agent J 的沙箱（bubblewrap）对 Agent 隐藏 Agent J 自己的密钥和配对数据；花钱、删除、对外发送、改凭据，永远要你在手机上批准。
    - 工作文件放在 Home/AgentJ，在 Files 里就能看到；Agent J 的设置和密钥只留在应用的 Data 目录。
    - Agent J、OpenCode 和沙箱都预装在应用自己的镜像里（只读），首次启动不用下载；新版本通过应用市场的「升级」送达。

    **首次使用**
    1. 在 https://agentj.app/account 购买或使用已有席位，在空席位卡上点「复制安装提示词」。
    2. 在 Olares 桌面打开 Agent J，把它粘贴进去。页面会把这台 Olares 绑定到这个席位。
    3. 在手机上打开账户页，在这台 Olares 的席位卡上点「添加遥控器」，用通行密钥确认。

    **使用要求**
    - 一个 Agent J 席位（agentj.app 上的付费订阅）。
    - 能连上外网（agentj.app）。
    - 想用本地模型的话，Olares Router 上要有一个运行中的聊天模型。

# The app's own image (agentjarvis/olares/image): Agent J (the version below), OpenCode, uv and bubblewrap, all pinned at
# build time. `digest` pins the multi-arch index once it is pushed; while it is empty the tag is used (local tests).
# New Agent J versions come as a new image + chart version (an app upgrade in Market); Agent J's own upgrades are off.
image:
  repository: ghcr.io/preangelleo/agentj-olares
  tag: 0.28.0
  digest: "sha256:675b54bc8351380b765ff94d3bb13da08614292c4e4b4db329ffb2aa4529878e"
agentj:
  version: 0.28.0
  wheelSha256: c6fe6c2e4102f036808dc5454c161890d7d1c98adb60a29557a8d3497e293523
  accountUrl: https://agentj.app/account

# Olares injects the actual domain; an empty default also supports isolated startup.
domain:
  terminal: ""

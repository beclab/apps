metadata:
  description: 多言語の音声を文字起こしする音声認識モデル
  title: Faster-Whisper Large V3

spec:
  fullDescription: |
    Faster-Whisper Large V3は、録音内の音声をテキストに変換します。SystranがOpenAI Whisper Large V3をCTranslate2向けに変換したモデルを使用し、ローカルで文字起こしを実行します。

    **主な機能**
    - 複数の言語で録音音声を文字起こしします。
    - 話されている言語を自動検出します。
    - 文字起こしの各区間にタイムスタンプを追加します。
    - 対応するOlaresアプリから文字起こし機能を利用できます。

    `6Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。

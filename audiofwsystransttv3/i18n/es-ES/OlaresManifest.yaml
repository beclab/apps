metadata:
  description: Un modelo de reconocimiento de voz para transcribir grabaciones multilingües
  title: Faster-Whisper Large V3

spec:
  fullDescription: |
    Faster-Whisper Large V3 convierte en texto el habla de una grabación de audio. Utiliza la conversión para CTranslate2 de OpenAI Whisper Large V3 realizada por Systran para efectuar la transcripción de forma local.

    **Funciones principales**
    - Transcribir grabaciones de voz en varios idiomas.
    - Detectar automáticamente el idioma hablado.
    - Añadir marcas de tiempo a los segmentos transcritos.
    - Poner la transcripción a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `6Gi` de memoria gráfica.

metadata:
  description: Ein Spracherkennungsmodell zur Transkription mehrsprachiger Aufnahmen
  title: Faster-Whisper Large V3

spec:
  fullDescription: |
    Faster-Whisper Large V3 wandelt Sprache aus Audioaufnahmen in Text um. Für die lokale Transkription verwendet es Systrans CTranslate2-Konvertierung von OpenAI Whisper Large V3.

    **Hauptfunktionen**
    - Aufgezeichnete Sprache in mehreren Sprachen transkribieren.
    - Die gesprochene Sprache automatisch erkennen.
    - Transkriptionssegmenten Zeitstempel hinzufügen.
    - Transkriptionen für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `6Gi` Grafikspeicher ist erforderlich.

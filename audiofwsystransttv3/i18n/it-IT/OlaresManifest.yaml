metadata:
  description: Un modello di riconoscimento vocale per trascrivere registrazioni multilingue
  title: Faster-Whisper Large V3

spec:
  fullDescription: |
    Faster-Whisper Large V3 converte in testo il parlato contenuto in una registrazione audio. Utilizza la conversione CTranslate2 di OpenAI Whisper Large V3 realizzata da Systran per la trascrizione locale.

    **Funzionalità principali**
    - Trascrivere registrazioni vocali in più lingue.
    - Rilevare automaticamente la lingua parlata.
    - Aggiungere marcatori temporali ai segmenti trascritti.
    - Rendere la trascrizione disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `6Gi` di memoria video.

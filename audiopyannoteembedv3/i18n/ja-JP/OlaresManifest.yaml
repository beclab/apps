metadata:
  description: アプリで比較できる話者の音声表現を作成するモデル
  title: Pyannote Embedding

spec:
  fullDescription: |
    Pyannote Embeddingは、音声サンプルを話者の声を表すコンパクトな数値データに変換します。アプリはこのデータを比較して、複数のサンプルが同じ話者のものかを推定できますが、個人名の特定は行いません。

    **主な機能**
    - 音声サンプルから話者埋め込みを作成します。
    - 音声サンプル間の話者類似度を比較します。
    - 話者ダイアライゼーションや音声分析での話者照合を支援します。
    - GPUを必要とせずCPUで実行します。

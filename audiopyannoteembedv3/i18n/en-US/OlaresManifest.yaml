metadata:
  description: A model for creating voice representations that applications can compare
  title: Pyannote Embedding

spec:
  fullDescription: |
    Pyannote Embedding turns a speech sample into a compact numerical representation of the speaker's voice. Applications can compare these representations to estimate whether samples contain the same speaker; the model does not identify people by name.

    **Key features**
    - Create a speaker embedding from a speech sample.
    - Compare voice samples for speaker similarity.
    - Support speaker matching in diarization and audio analysis.
    - Run on the CPU without requiring a GPU.

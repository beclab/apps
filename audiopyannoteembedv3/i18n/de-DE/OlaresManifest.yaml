metadata:
  description: Ein Modell zum Erstellen vergleichbarer numerischer Stimmrepräsentationen
  title: Pyannote Embedding

spec:
  fullDescription: |
    Pyannote Embedding wandelt eine Sprachprobe in eine kompakte numerische Darstellung der Stimme um. Anwendungen können diese Darstellungen vergleichen, um abzuschätzen, ob Proben von derselben Person stammen; das Modell identifiziert keine Personen namentlich.

    **Hauptfunktionen**
    - Ein Sprecher-Embedding aus einer Sprachprobe erstellen.
    - Sprachproben auf Sprecherähnlichkeit vergleichen.
    - Sprecherabgleich bei Diarisierung und Audioanalyse unterstützen.
    - Ohne GPU auf der CPU ausführen.

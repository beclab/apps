metadata:
  description: Un modello per creare rappresentazioni vocali confrontabili dalle applicazioni
  title: Pyannote Embedding

spec:
  fullDescription: |
    Pyannote Embedding trasforma un campione vocale in una rappresentazione numerica compatta della voce. Le applicazioni possono confrontare queste rappresentazioni per stimare se i campioni appartengono allo stesso parlante; il modello non identifica le persone per nome.

    **Funzionalità principali**
    - Creare un embedding del parlante da un campione vocale.
    - Confrontare campioni vocali in base alla somiglianza del parlante.
    - Supportare il confronto dei parlanti nella diarizzazione e nell'analisi audio.
    - Funzionare sulla CPU senza richiedere una GPU.

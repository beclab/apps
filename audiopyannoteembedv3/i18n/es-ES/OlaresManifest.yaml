metadata:
  description: Un modelo para crear representaciones de voz que las aplicaciones pueden comparar
  title: Pyannote Embedding

spec:
  fullDescription: |
    Pyannote Embedding convierte una muestra de habla en una representación numérica compacta de la voz. Las aplicaciones pueden comparar estas representaciones para estimar si varias muestras pertenecen al mismo hablante; el modelo no identifica a las personas por su nombre.

    **Funciones principales**
    - Crear una representación del hablante a partir de una muestra de voz.
    - Comparar muestras según la similitud del hablante.
    - Facilitar la comparación de hablantes en la diarización y el análisis de audio.
    - Ejecutarse en la CPU sin necesidad de GPU.

metadata:
  description: Un modèle qui crée des représentations vocales comparables par les applications
  title: Pyannote Embedding

spec:
  fullDescription: |
    Pyannote Embedding transforme un échantillon de parole en une représentation numérique compacte de la voix. Les applications peuvent comparer ces représentations pour estimer si plusieurs échantillons proviennent du même locuteur ; le modèle n'identifie pas les personnes par leur nom.

    **Fonctionnalités principales**
    - Créer une empreinte vocale numérique à partir d'un échantillon de parole.
    - Comparer des échantillons selon la similarité du locuteur.
    - Prendre en charge l'appariement des locuteurs pour la diarisation et l'analyse audio.
    - Fonctionner sur le CPU sans nécessiter de GPU.

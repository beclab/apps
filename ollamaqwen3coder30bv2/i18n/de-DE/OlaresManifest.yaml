metadata:
  title: Qwen3-Coder 30B (Ollama)
  description: Qwen3-Coder 30B (Ollama-Bibliothek) für Coding und agentische Tool-Nutzung
spec:
  upgradeDescription: |
    Ollama-Runtime auf ollama/ollama:0.30.10 aktualisieren.
    Olares-API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisieren (OpenAI Vision image_url-Weiterleitung).
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Nach der Installation durch den Olares Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    Der Benutzerverkehr geht über den Proxy zu Ollama.

    **MODELL**

    Verwendet das Ollama-Bibliotheksmodell **[qwen3-coder:30b](https://ollama.com/library/qwen3-coder)** (~19 GB, Standard Q4_K_M). Chart **OLLAMA_CONTEXT_LENGTH**: **131072** (128k).

    Qwen3-Coder 30B-A3B ist ein MoE-Coding-Modell (~30,5B gesamt, ~3,3B aktiv pro Token) für Codegenerierung, Bearbeitung und Tool-Calling-Agenten. Erhöhen Sie **OLLAMA_CONTEXT_LENGTH** in der ConfigMap, wenn Sie mehr VRAM haben.

    Richten Sie Claude Code `ANTHROPIC_BASE_URL` auf den Shared Entrance dieser App für die Anthropic-kompatible `/v1/messages`-API von Ollama.

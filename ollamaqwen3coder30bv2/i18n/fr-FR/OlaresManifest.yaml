metadata:
  title: Qwen3-Coder 30B (Ollama)
  description: "Qwen3-Coder 30B (bibliothèque Ollama) pour le coding et l'utilisation agentique d'outils"
spec:
  upgradeDescription: |
    Mettre à niveau le runtime Ollama vers ollama/ollama:0.30.10.
    Mettre à niveau le proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODÈLE**

    Utilise le modèle de la bibliothèque Ollama **[qwen3-coder:30b](https://ollama.com/library/qwen3-coder)** (~19 Go, Q4_K_M par défaut). Chart **OLLAMA_CONTEXT_LENGTH** : **131072** (128k).

    Qwen3-Coder 30B-A3B est un modèle MoE de coding (~30,5B au total, ~3,3B actifs par jeton) pour la génération de code, l'édition et les agents avec appels d'outils. Augmentez **OLLAMA_CONTEXT_LENGTH** dans le ConfigMap si vous disposez de plus de VRAM.

    Pointez Claude Code `ANTHROPIC_BASE_URL` vers l'entrée partagée de cette application pour l'API `/v1/messages` compatible Anthropic d'Ollama.

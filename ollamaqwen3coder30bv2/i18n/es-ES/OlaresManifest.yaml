metadata:
  title: Qwen3-Coder 30B (Ollama)
  description: Qwen3-Coder 30B (biblioteca Ollama) para programación y uso de herramientas agénticas
spec:
  upgradeDescription: |
    Actualizar el runtime de Ollama a ollama/ollama:0.30.10.
    Actualizar el proxy de la API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.
    El tráfico de usuarios pasa por el proxy hacia Ollama.

    **MODELO**

    Usa el modelo de la biblioteca Ollama **[qwen3-coder:30b](https://ollama.com/library/qwen3-coder)** (~19 GB, Q4_K_M por defecto). Chart **OLLAMA_CONTEXT_LENGTH**: **131072** (128k).

    Qwen3-Coder 30B-A3B es un modelo MoE de coding (~30,5B total, ~3,3B activos por token) para generación de código, edición y agentes con tool-calling. Aumente **OLLAMA_CONTEXT_LENGTH** en el ConfigMap si tiene más VRAM.

    Apunte Claude Code `ANTHROPIC_BASE_URL` a la entrada compartida de esta app para la API `/v1/messages` compatible con Anthropic de Ollama.

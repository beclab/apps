metadata:
  title: Qwen3-Coder 30B (Ollama)
  description: Qwen3-Coder 30B (libreria Ollama) per coding e uso agentico degli strumenti
spec:
  upgradeDescription: |
    Aggiorna il runtime Ollama a ollama/ollama:0.30.10.
    Aggiorna il proxy API di Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url vision OpenAI).
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa attraverso il proxy verso Ollama.

    **MODELLO**

    Usa il modello della libreria Ollama **[qwen3-coder:30b](https://ollama.com/library/qwen3-coder)** (~19 GB, Q4_K_M predefinito). Chart **OLLAMA_CONTEXT_LENGTH**: **131072** (128k).

    Qwen3-Coder 30B-A3B è un modello MoE per coding (~30,5B totali, ~3,3B attivi per token) per generazione di codice, editing e agenti con tool-calling. Aumenta **OLLAMA_CONTEXT_LENGTH** nel ConfigMap se hai più VRAM.

    Punta Claude Code `ANTHROPIC_BASE_URL` all'ingresso condiviso di questa app per l'API `/v1/messages` compatibile con Anthropic di Ollama.

metadata:
  title: Qwen3-Coder 30B (Ollama)
  description: コーディングとエージェント的なツール利用向けの Qwen3-Coder 30B（Ollama ライブラリ）
spec:
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 にアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 にアップグレード（OpenAI Vision image_url 転送）。
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。

    **モデル**

    Ollama ライブラリのモデル **[qwen3-coder:30b](https://ollama.com/library/qwen3-coder)**（約 19GB、既定 Q4_K_M）を使用。Chart **OLLAMA_CONTEXT_LENGTH**: **131072**（128k）。

    Qwen3-Coder 30B-A3B は、コード生成・編集・ツール呼び出しエージェント向けの MoE コーディングモデル（合計約 30.5B、トークンあたり約 3.3B アクティブ）です。VRAM に余裕がある場合は ConfigMap の **OLLAMA_CONTEXT_LENGTH** を引き上げてください。

    Claude Code の `ANTHROPIC_BASE_URL` を本アプリの共有エントランスに向け、Ollama の Anthropic 互換 `/v1/messages` API を利用できます。

metadata:
  title: Tautulli
  description: See who is watching, explore playback trends, and monitor your Plex server.
spec:
  fullDescription: |
    Your Plex server, at a glance.

    See what is playing now, discover your most watched content, and understand how your Plex server is being used. Tautulli brings live activity, playback history, and clear statistics together in one web dashboard.

    Know what is happening
    - Live activity: see active streams, users, devices, quality, and bandwidth.
    - Playback history: look back at what was watched, when, and for how long.
    - Visual statistics: explore viewing trends and popular movies, shows, and libraries.
    - Stream details: distinguish Direct Play, Direct Stream, and transcoding.
    - Notifications: configure alerts for the Plex events that matter to you.
    - Library insights: browse recently added titles and detailed media information.

    Get started on Olares
    1. Open Tautulli and sign in. On a new installation, the generated credentials appear in the Tautulli container logs.
    2. Follow the setup wizard to authorize your Plex account and select your server.
    3. Start a Plex playback session to see live activity and begin building your history.

    A running Plex Media Server and access to its network address are required. Tautulli monitors Plex; it does not replace your media server. Existing playback history is not reconstructed automatically.

    Screenshots are official Tautulli previews with sample content. Your dashboard fills with your own server activity after setup.
  upgradeDescription: |
    Improved Market listing with three official screenshots, a detailed feature overview, support links, and first-run guidance. Tautulli remains at v2.19.1.

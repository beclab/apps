workloadReplicas:
  tautulli: 1
metadata:
  name: tautulli
  appid: tautulli
  title: Tautulli
  description: See who is watching, explore playback trends, and monitor your Plex server.
  icon: https://raw.githubusercontent.com/donbodbod/apps/8818290c4b0f1292c58c16b3d77671c4d0a61fee/tautulli/icon.png
  version: 2.19.2
  categories:
    - Utilities_v112
    - homelab

entrances:
  - name: tautulli
    host: tautulli
    port: 8181
    title: Tautulli
    icon: https://raw.githubusercontent.com/donbodbod/apps/8818290c4b0f1292c58c16b3d77671c4d0a61fee/tautulli/icon.png

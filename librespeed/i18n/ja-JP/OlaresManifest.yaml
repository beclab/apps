metadata:
  title: LibreSpeed
  description: 無料のオープンソーススピードテスト
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to 6.3.1 with PHP 8.5.12 and disabled session upload progress to address CVE-2026-109618/CVE-2026-109619. Existing historical results and custom server lists are retained. Only if you need existing shared-result links to keep working, export results/idObfuscation_salt.php as a single 0xXXXXXXXX line to appData/.librespeed-state/obfuscation-salt before replacing the old container. Otherwise, old shared-result links will stop working. The upgrade preserves the exported salt.

  fullDescription: |
    Flash なし、Java なし、Websocket なし、余計なものはなし。
    
    これは Javascript で実装された非常に軽量なスピードテストで、XMLHttpRequest と Web Workers を使用します。
    
    **機能**
    - ダウンロード
    - アップロード
    - Ping
    - ジッター
    - IP アドレス、ISP、サーバーからの距離（任意）
    - テレメトリ（任意）
    - 結果共有（任意）
    - 複数のテストポイント（任意）
    - レイテンシチャート、損失追跡、しきい値アラート、CSV エクスポート付きの接続安定性テスト

metadata:
  title: LibreSpeed
  description: Speedtest gratuito e open source
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to 6.3.1 with PHP 8.5.12 and disabled session upload progress to address CVE-2026-109618/CVE-2026-109619. Existing historical results and custom server lists are retained. Only if you need existing shared-result links to keep working, export results/idObfuscation_salt.php as a single 0xXXXXXXXX line to appData/.librespeed-state/obfuscation-salt before replacing the old container. Otherwise, old shared-result links will stop working. The upgrade preserves the exported salt.

  fullDescription: |
    Niente Flash, niente Java, niente Websocket, niente sciocchezze.
    
    Questo è uno speedtest molto leggero implementato in Javascript, usando XMLHttpRequest e Web Workers.
    
    **Funzionalità**
    - Download
    - Upload
    - Ping
    - Jitter
    - Indirizzo IP, ISP, distanza dal server (opzionale)
    - Telemetria (opzionale)
    - Condivisione risultati (opzionale)
    - Più punti di test (opzionale)
    - Test di stabilità della connessione con grafici di latenza, tracciamento delle perdite, avvisi di soglia ed esportazione CSV

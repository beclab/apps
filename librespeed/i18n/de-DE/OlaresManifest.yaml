metadata:
  title: LibreSpeed
  description: Kostenloser und quelloffener Speedtest
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to 6.3.1 with PHP 8.5.12 and disabled session upload progress to address CVE-2026-109618/CVE-2026-109619. Existing historical results and custom server lists are retained. Only if you need existing shared-result links to keep working, export results/idObfuscation_salt.php as a single 0xXXXXXXXX line to appData/.librespeed-state/obfuscation-salt before replacing the old container. Otherwise, old shared-result links will stop working. The upgrade preserves the exported salt.

  fullDescription: |
    Kein Flash, kein Java, kein Websocket, kein Unsinn.
    
    Dies ist ein sehr leichter Speedtest, implementiert in Javascript mit XMLHttpRequest und Web Workers.
    
    **Funktionen**
    - Download
    - Upload
    - Ping
    - Jitter
    - IP-Adresse, ISP, Entfernung zum Server (optional)
    - Telemetrie (optional)
    - Ergebnis-Teilen (optional)
    - Mehrere Testpunkte (optional)
    - Verbindungstabilitätstest mit Latenzdiagramm, Verlustverfolgung, Schwellenwert-Alarmen und CSV-Export

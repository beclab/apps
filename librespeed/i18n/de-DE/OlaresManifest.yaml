metadata:
  title: LibreSpeed
  description: Kostenloser und quelloffener Speedtest
spec:
  upgradeDescription: |
    Fix LibreSpeed v6.2.1 startup by using the official LibreSpeed Docker image mirrored to Docker Hub.

    Restores WEBPORT, run modes, server lists, and PostgreSQL telemetry compatibility. Existing appData and PostgreSQL schema are preserved.

    Release notes: https://github.com/librespeed/speedtest/releases
  fullDescription: |
    Kein Flash, kein Java, kein Websocket, kein Unsinn.
    
    Dies ist ein sehr leichter Speedtest, implementiert in Javascript mit XMLHttpRequest und Web Workers.
    
    **Funktionen**
    - Download
    - Upload
    - Ping
    - Jitter
    - IP-Adresse, ISP, Entfernung zum Server (optional)
    - Telemetrie (optional)
    - Ergebnis-Teilen (optional)
    - Mehrere Testpunkte (optional)
    - Verbindungstabilitätstest mit Latenzdiagramm, Verlustverfolgung, Schwellenwert-Alarmen und CSV-Export

metadata:
  title: LibreSpeed
  description: Speedtest gratuit et open source
spec:
  upgradeDescription: |
    Fix LibreSpeed v6.2.1 startup by using the official LibreSpeed Docker image mirrored to Docker Hub.

    Restores WEBPORT, run modes, server lists, and PostgreSQL telemetry compatibility. Existing appData and PostgreSQL schema are preserved.

    Release notes: https://github.com/librespeed/speedtest/releases
  fullDescription: |
    Pas de Flash, pas de Java, pas de Websocket, pas de blabla.
    
    Ceci est un speedtest très léger implémenté en Javascript, utilisant XMLHttpRequest et Web Workers.
    
    **Fonctionnalités**
    - Téléchargement
    - Envoi
    - Ping
    - Jitter
    - Adresse IP, FAI, distance au serveur (optionnel)
    - Télémétrie (optionnel)
    - Partage des résultats (optionnel)
    - Plusieurs points de test (optionnel)
    - Test de stabilité de connexion avec graphiques de latence, suivi des pertes, alertes de seuil et export CSV

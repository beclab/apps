metadata:
  title: LibreSpeed
  description: Speedtest gratuit et open source
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to 6.3.1 with PHP 8.5.12 and disabled session upload progress to address CVE-2026-109618/CVE-2026-109619. Existing historical results and custom server lists are retained. Only if you need existing shared-result links to keep working, export results/idObfuscation_salt.php as a single 0xXXXXXXXX line to appData/.librespeed-state/obfuscation-salt before replacing the old container. Otherwise, old shared-result links will stop working. The upgrade preserves the exported salt.

  fullDescription: |
    Pas de Flash, pas de Java, pas de Websocket, pas de blabla.
    
    Ceci est un speedtest très léger implémenté en Javascript, utilisant XMLHttpRequest et Web Workers.
    
    **Fonctionnalités**
    - Téléchargement
    - Envoi
    - Ping
    - Jitter
    - Adresse IP, FAI, distance au serveur (optionnel)
    - Télémétrie (optionnel)
    - Partage des résultats (optionnel)
    - Plusieurs points de test (optionnel)
    - Test de stabilité de connexion avec graphiques de latence, suivi des pertes, alertes de seuil et export CSV

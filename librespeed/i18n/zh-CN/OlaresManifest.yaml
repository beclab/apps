metadata:
  title: LibreSpeed
  description: 免费且开源的网络测速工具。
spec:
  upgradeDescription: |
    将反向代理镜像从 Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）切换为官方 OpenResty 镜像 `openresty/openresty:1.29.2.5-bookworm-fat`。

    同步调整 nginx 配置挂载与日志路径以匹配官方镜像布局（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`），并移除 Bitnami 专用的 `OPENRESTY_CONF_FILE` 配置。
  fullDescription: |
    无 Flash、无 Java、无 WebSocket、无废话。

    这是一个非常轻量的网络测速工具，使用 Javascript 实现，使用 XMLHttpRequest 和 Web Workers。    
    
    **功能**
    - 下载
    - 上传
    - 延迟
    - 抖动
    - IP 地址、ISP、服务器距离（可选）
    - 遥测（可选）
    - 结果分享（可选）
    - 多个测试点（可选）
    - 连接稳定性测试，包括延迟图表、损失跟踪、阈值警报和 CSV 导出

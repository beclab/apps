metadata:
  title: LibreSpeed
  description: 免费且开源的网络测速工具。
spec:
  upgradeDescription: |
    升级 LibreSpeed 至 6.3.1，PHP 至 8.5.12，并禁用会话上传进度，修复 CVE-2026-109618、CVE-2026-109619。保留现有历史测速记录和自定义服务器列表。仅在需要继续使用旧测速分享链接时，才需在替换旧容器前，将 results/idObfuscation_salt.php 中的盐值以单行 0xXXXXXXXX 格式导出到 appData/.librespeed-state/obfuscation-salt；否则旧分享链接将失效。新版会保留已导出的盐值。

  fullDescription: |
    无 Flash、无 Java、无 WebSocket、无废话。

    这是一个非常轻量的网络测速工具，使用 Javascript 实现，使用 XMLHttpRequest 和 Web Workers。    
    
    **功能**
    - 下载
    - 上传
    - 延迟
    - 抖动
    - IP 地址、ISP、服务器距离（可选）
    - 遥测（可选）
    - 结果分享（可选）
    - 多个测试点（可选）
    - 连接稳定性测试，包括延迟图表、损失跟踪、阈值警报和 CSV 导出

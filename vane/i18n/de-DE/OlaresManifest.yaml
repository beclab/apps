metadata:
  title: Vane
  description: Vane (früher Perplexica) ist eine KI-gestützte Antwort-Engine
spec:
  fullDescription: |
    Vane (früher Perplexica) ist eine datenschutzorientierte KI-Antwort-Engine, die vollständig auf Ihrer eigenen Hardware läuft. Sie kombiniert Wissen aus dem weiten Internet mit Unterstützung für lokale LLMs (Ollama) und Cloud-Anbieter (OpenAI, Claude, Groq) und liefert genaue Antworten mit zitierten Quellen, während Ihre Suchen vollständig privat bleiben.
    
    **Funktionen**
    - Unterstützung aller großen KI-Anbieter – Nutzen Sie lokale LLMs über Ollama oder verbinden Sie OpenAI, Anthropic Claude, Google Gemini, Groq und mehr. Modelle je nach Bedarf mischen und kombinieren.
    - Intelligente Suchmodi – Speed Mode für schnelle Antworten, Balanced Mode für den Alltag oder Quality Mode für Deep Research.
    - Quellen wählen – Durchsuchen Sie das Web, Diskussionen oder wissenschaftliche Arbeiten. Weitere Quellen und Integrationen sind in Arbeit.
    - Widgets – Hilfreiche UI-Karten, die bei Bedarf erscheinen, z. B. Wetter, Berechnungen, Aktienkurse und andere Schnellabfragen.
    - Websuche mit SearxNG – Zugriff auf mehrere Suchmaschinen bei privater Identität. Unterstützung für Tavily und Exa folgt bald.
    - Bild- und Videosuche – Visuelle Inhalte neben Textresultaten finden. Suche ist nicht mehr auf Artikel beschränkt.
    - Datei-Uploads – Dokumente hochladen und Fragen dazu stellen. PDFs, Textdateien, Bilder – Vane versteht sie alle.
    - Spezifische Domains durchsuchen – Begrenzen Sie die Suche auf bestimmte Websites, wenn Sie wissen, wo Sie suchen müssen. Ideal für technische Dokumentation oder Forschungspapiere.
    - Intelligente Vorschläge – Erhalten Sie intelligente Suchvorschläge während der Eingabe, die bessere Abfragen helfen zu formulieren.
    - Discover – Stöbern Sie den Tag über interessante Artikel und Trendinhalte. Bleiben Sie informiert, ohne zu suchen.
    - Suchverlauf – Jede Suche wird lokal gespeichert, damit Sie Entdeckungen jederzeit erneut aufrufen können. Ihre Recherche geht nie verloren.
    - Mehr folgt bald – Wir entwickeln aktiv neue Funktionen basierend auf Community-Feedback. Treten Sie unserem Discord bei, um Vanes Zukunft mitzugestalten!
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    v1.1.28: Image auf `itzcrazykns1337/vane:v1.12.2` pinnen (nicht mehr `:main` verwenden). KI-Anbieter-API-Keys (`OPENAI_APIKEY`, `GROQ_APIKEY`, `ANTHROPIC_APIKEY`, `GEMINI_APIKEY`, `CUSTOM_OPENAI_APIKEY`, `OLLAMA_API_KEY`) in Kubernetes Secret verschieben; ConfigMap behält leere Platzhalter und ein initContainer injiziert Keys via `secretKeyRef` in `config.toml`.
    
    App-Version auf 1.12.2 aktualisiert
    
    Dies ist ein Major Release mit einer vollständigen Architekturüberarbeitung. Wir haben Langchain zugunsten einer eigenen Implementierung entfernt, um Streaming, Generierung und anbieterspezifische Features auf niedriger Ebene zu steuern.
    
    Änderungen
    
    **Allgemeine Updates:**
    - Anbieter in Connections umbenannt für bessere UX
    - SearxNG-Build- und Startup-Fehler behoben
    - Neue Agents DIR hinzugefügt, Vorschläge sowie Video- und Audio-Agents migriert
    - Message- und Chunk-Typen für bessere Typsicherheit hinzugefügt
    - Codeblock-Rendering mit Syntaxhervorhebung hinzugefügt
    - Versionsnummer und GitHub-Link in den Einstellungen hinzugefügt
    - Verschiedene UI-Verbesserungen mit Animationen via Framer Motion
    
    **Langchain-Entfernung & Custom-Provider-System:**
    - Langchain entfernt und eigene Base- und Provider-Klassen implementiert
    - Function Calling mit partiellem Streaming implementiert
    
    **Neuer Session Manager:**
    - Session Manager mit automatischer Stream-Wiederverbindung hinzugefügt
    - Sessions können per ID wiederhergestellt werden, wenn die Seite aktualisiert wird oder der Stream abbricht
    
    **Widgets:**
    - Widgets für Wetterinformationen, Börsendaten und mathematische Berechnungen hinzugefügt
    
    **Query Classification & Researcher mit Actions:**
    - Jede Abfrage wird jetzt vor Beginn der Recherche klassifiziert
    - Researcher nutzt Actions mit Tool Calling für Websuche, Scraping, Website-Suche, Diskussionssuche, Datei-Upload-Suche usw.
    
    **Deep Research Mode (Beta):**
    - Quality-Suchmodus hinzugefügt, in dem das LLM iterativ über gesammelte Daten nachdenkt
    - Ermöglicht tiefere Themenexploration und detaillierte Berichte
    
    **Aktualisierte Research Modes:**
    - Balanced Mode: Erzwingt jetzt Reasoning des LLM mit begrenzter maximaler Aktionszahl
    - Speed Mode: Läuft ohne Reasoning für schnelle Antworten
    
    **Block- & JSON-Patch-basiertes Streaming:**
    - Jeder Schritt des LLM wird jetzt für Echtzeit-Sichtbarkeit gestreamt
    
    **Neuer Upload Manager & Enhanced File Search:**
    - Upload Manager mit Unterstützung für PDF, DOCX und Textdateien hinzugefügt
    - Verbesserte Dateisuche mit RRF (Reciprocal Rank Fusion) für bessere Retrieval-Qualität
    
    **Neugestaltetes Quellen-System:**
    - Focus Modes entfernt und durch 3 Quellen ersetzt: web, academic und discussions
    - Quellen können einzeln oder alle zusammen umgeschaltet werden
    
    Vollständige Release Note: https://github.com/ItzCrazyKns/Vane/releases/tag/v1.12.2

metadata:
  title: Vane
  description: Vane (precedentemente Perplexica) è un motore di risposte basato su IA
spec:
  fullDescription: |
    Vane (precedentemente Perplexica) è un motore di risposte IA incentrato sulla privacy che gira interamente sul tuo hardware. Combina la conoscenza della vasta Internet con il supporto per LLM locali (Ollama) e provider cloud (OpenAI, Claude, Groq), fornendo risposte accurate con fonti citate e mantenendo le tue ricerche completamente private.
    
    **Funzioni**
    - Supporto per tutti i principali provider IA: Usa LLM locali tramite Ollama o connettiti a OpenAI, Anthropic Claude, Google Gemini, Groq e altri. Mescola i modelli secondo le esigenze.
    - Modalità di ricerca intelligenti: Scegli Speed Mode per risposte rapide, Balanced Mode per ricerche quotidiane o Quality Mode per deep research.
    - Scegli le fonti: Cerca sul web, nelle discussioni o negli articoli accademici. Altre fonti e integrazioni sono in arrivo.
    - Widget: Card UI utili che appaiono quando rilevanti, come meteo, calcoli, prezzi azionari e altre ricerche rapide.
    - Ricerca web basata su SearxNG: Accedi a più motori di ricerca mantenendo privata la tua identità. Supporto per Tavily ed Exa in arrivo.
    - Ricerca immagini e video: Trova contenuti visuali insieme ai risultati testuali. La ricerca non è più limitata agli articoli.
    - Upload di file: Carica documenti e fai domande su di essi. PDF, file di testo, immagini: Vane li comprende tutti.
    - Cerca domini specifici: Limita la ricerca a siti specifici quando sai dove guardare. Ideale per documentazione tecnica o paper di ricerca.
    - Suggerimenti intelligenti: Ottieni suggerimenti di ricerca intelligenti mentre digiti, aiutandoti a formulare query migliori.
    - Discover: Sfoglia articoli interessanti e contenuti di tendenza durante il giorno. Resta informato anche senza cercare.
    - Cronologia ricerche: Ogni ricerca è salvata localmente così puoi rivisitare le scoperte in qualsiasi momento. La tua ricerca non si perde mai.
    - Altro in arrivo: Stiamo sviluppando attivamente nuove funzioni basate sul feedback della community. Unisciti al nostro Discord per contribuire a plasmare il futuro di Vane!
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
    
    v1.1.28: Fissa l'immagine a `itzcrazykns1337/vane:v1.12.2` (smetti di usare `:main`). Sposta le API key dei provider IA (`OPENAI_APIKEY`, `GROQ_APIKEY`, `ANTHROPIC_APIKEY`, `GEMINI_APIKEY`, `CUSTOM_OPENAI_APIKEY`, `OLLAMA_API_KEY`) in Kubernetes Secret; ConfigMap mantiene placeholder vuoti e un initContainer inietta le chiavi in `config.toml` via `secretKeyRef`.
    
    Aggiornamento della versione app a 1.12.2
    
    Questa è una major release con un completo rifacimento architetturale. Abbiamo rimosso Langchain a favore di un'implementazione custom per il controllo a basso livello di streaming, generazione e funzioni specifiche del provider.
    
    Cosa è cambiato
    
    **Aggiornamenti generali:**
    - Provider rinominati in connections per una migliore UX
    - Corretti errori di build e avvio di SearxNG
    - Aggiunti nuovi agents DIR, migrate suggestions e agents video/audio
    - Aggiunti tipi message e chunk per migliore type safety
    - Aggiunto rendering dei code block con syntax highlighting
    - Aggiunti numero di versione e link GitHub nelle settings
    - Vari miglioramenti UI con animazioni via Framer Motion
    
    **Rimozione Langchain e sistema provider custom:**
    - Rimosso Langchain e implementate classi base e provider custom
    - Implementato function calling con streaming parziale
    
    **Nuovo Session Manager:**
    - Aggiunto session manager con riconnessione automatica dello stream
    - Le sessioni possono essere ripristinate via ID se la pagina si aggiorna o lo stream si disconnette
    
    **Widget:**
    - Aggiunti widget per meteo, dati di borsa e calcoli matematici
    
    **Classificazione query e Researcher con Actions:**
    - Ogni query è ora classificata prima dell'inizio della ricerca
    - Il researcher usa actions con tool calling per web search, scraping, ricerca su siti specifici, discussioni, file caricati, ecc.
    
    **Deep Research Mode (Beta):**
    - Aggiunta modalità di ricerca quality in cui l'LLM ragiona in modo iterativo sui dati raccolti
    - Consente un'esplorazione più approfondita e la preparazione di report dettagliati
    
    **Modalità di ricerca aggiornate:**
    - Balanced Mode: Ora forza l'LLM a ragionare con un massimo limitato di azioni
    - Speed Mode: Esegue senza ragionamento per risposte rapide
    
    **Streaming basato su Block e JSON Patch:**
    - Ogni passo dell'LLM è ora trasmesso in streaming per visibilità in tempo reale
    
    **Nuovo Upload Manager e ricerca file migliorata:**
    - Aggiunto upload manager con supporto PDF, DOCX e testo
    - Ricerca file migliorata con RRF (Reciprocal Rank Fusion) per migliore qualità di retrieval
    
    **Sistema fonti ridisegnato:**
    - Focus modes rimossi e sostituiti da 3 fonti: web, academic e discussions
    - Le fonti possono essere attivate individualmente o tutte insieme
    
    Nota completa: https://github.com/ItzCrazyKns/Vane/releases/tag/v1.12.2

metadata:
  title: Vane
  description: "Vane (anciennement Perplexica) est un moteur de réponses alimenté par l'IA"
spec:
  fullDescription: |
    Vane (anciennement Perplexica) est un moteur de réponses IA axé sur la confidentialité qui s'exécute entièrement sur votre propre matériel. Il combine les connaissances du vaste Internet avec la prise en charge des LLM locaux (Ollama) et des fournisseurs cloud (OpenAI, Claude, Groq), en fournissant des réponses précises avec des sources citées tout en gardant vos recherches totalement privées.
    
    **Fonctionnalités**
    - Prise en charge de tous les principaux fournisseurs d'IA — Utilisez des LLM locaux via Ollama ou connectez-vous à OpenAI, Anthropic Claude, Google Gemini, Groq, etc. Mélangez et associez les modèles selon vos besoins.
    - Modes de recherche intelligents — Choisissez Speed Mode pour des réponses rapides, Balanced Mode pour les recherches quotidiennes, ou Quality Mode pour une recherche approfondie.
    - Choisissez vos sources — Recherchez sur le web, dans les discussions ou les articles académiques. D'autres sources et intégrations sont en cours.
    - Widgets — Cartes UI utiles qui apparaissent quand c'est pertinent, comme la météo, les calculs, les cours boursiers et d'autres recherches rapides.
    - Recherche web propulsée par SearxNG — Accédez à plusieurs moteurs de recherche tout en gardant votre identité privée. Prise en charge de Tavily et Exa bientôt.
    - Recherche d'images et de vidéos — Trouvez du contenu visuel aux côtés des résultats texte. La recherche n'est plus limitée aux articles.
    - Téléversements de fichiers — Téléversez des documents et posez des questions à leur sujet. PDF, fichiers texte, images — Vane les comprend tous.
    - Rechercher des domaines spécifiques — Limitez la recherche à des sites précis lorsque vous savez où chercher. Parfait pour la documentation technique ou les articles de recherche.
    - Suggestions intelligentes — Obtenez des suggestions de recherche intelligentes pendant que vous tapez, pour formuler de meilleures requêtes.
    - Discover — Parcourez des articles intéressants et du contenu tendance tout au long de la journée. Restez informé sans même chercher.
    - Historique de recherche — Chaque recherche est enregistrée localement pour que vous puissiez revisiter vos découvertes à tout moment. Votre recherche n'est jamais perdue.
    - Plus à venir — Nous développons activement de nouvelles fonctionnalités basées sur les retours de la communauté. Rejoignez notre Discord pour aider à façonner l'avenir de Vane !
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    v1.1.28 : Épingler l'image à `itzcrazykns1337/vane:v1.12.2` (ne plus utiliser `:main`). Déplacer les clés API des fournisseurs IA (`OPENAI_APIKEY`, `GROQ_APIKEY`, `ANTHROPIC_APIKEY`, `GEMINI_APIKEY`, `CUSTOM_OPENAI_APIKEY`, `OLLAMA_API_KEY`) dans un Kubernetes Secret ; ConfigMap conserve des placeholders vides et un initContainer injecte les clés dans `config.toml` via `secretKeyRef`.
    
    Mise à jour de la version de l'app vers 1.12.2
    
    Il s'agit d'une version majeure avec une refonte architecturale complète. Nous avons retiré Langchain au profit d'une implémentation personnalisée pour un contrôle bas niveau du streaming, de la génération et des fonctionnalités spécifiques aux fournisseurs.
    
    Changements
    
    **Mises à jour générales :**
    - Fournisseurs renommés en connections pour une meilleure UX
    - Correction des erreurs de build et de démarrage de SearxNG
    - Ajout de nouveaux agents DIR, migration des suggestions et des agents vidéo et audio
    - Ajout des types message et chunk pour une meilleure type safety
    - Ajout du rendu des blocs de code avec coloration syntaxique
    - Ajout du numéro de version et du lien GitHub dans les settings
    - Diverses améliorations UI avec animations via Framer Motion
    
    **Retrait de Langchain et système de providers personnalisé :**
    - Retrait de Langchain et implémentation de classes base et provider personnalisées
    - Implémentation du function calling avec streaming partiel
    
    **Nouveau Session Manager :**
    - Ajout d'un session manager avec reconnexion automatique du stream
    - Les sessions peuvent être restaurées via ID si la page se rafraîchit ou si le stream se déconnecte
    
    **Widgets :**
    - Ajout de widgets pour la météo, les données boursières et les calculs mathématiques
    
    **Classification des requêtes et Researcher avec Actions :**
    - Chaque requête est désormais classifiée avant le début de la recherche
    - Le researcher utilise des actions avec tool calling pour la recherche web, le scraping, la recherche de sites spécifiques, les discussions, les fichiers téléversés, etc.
    
    **Deep Research Mode (Beta) :**
    - Ajout d'un mode de recherche quality où le LLM raisonne de façon itérative sur les données collectées
    - Permet une exploration plus profonde des sujets et la préparation de rapports détaillés
    
    **Modes de recherche mis à jour :**
    - Balanced Mode : Force désormais le LLM à raisonner avec un nombre maximal d'actions limité
    - Speed Mode : S'exécute sans raisonnement pour des réponses rapides
    
    **Streaming basé sur Block et JSON Patch :**
    - Chaque étape du LLM est désormais diffusée pour une visibilité en temps réel
    
    **Nouveau Upload Manager et recherche de fichiers améliorée :**
    - Ajout d'un upload manager prenant en charge PDF, DOCX et texte
    - Recherche de fichiers améliorée avec RRF (Reciprocal Rank Fusion) pour une meilleure qualité de retrieval
    
    **Système de sources redessiné :**
    - Focus modes retirés et remplacés par 3 sources : web, academic et discussions
    - Les sources peuvent être activées individuellement ou toutes ensemble
    
    Note complète : https://github.com/ItzCrazyKns/Vane/releases/tag/v1.12.2

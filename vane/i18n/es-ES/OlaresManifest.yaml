metadata:
  title: Vane
  description: Vane (antes Perplexica) es un motor de respuestas impulsado por IA
spec:
  fullDescription: |
    Vane (antes Perplexica) es un motor de respuestas de IA centrado en la privacidad que se ejecuta por completo en tu propio hardware. Combina conocimiento de la vasta Internet con soporte para LLM locales (Ollama) y proveedores en la nube (OpenAI, Claude, Groq), entregando respuestas precisas con fuentes citadas y manteniendo tus búsquedas completamente privadas.
    
    **Funciones**
    - Soporte para todos los principales proveedores de IA: Usa LLM locales con Ollama o conéctate a OpenAI, Anthropic Claude, Google Gemini, Groq y más. Mezcla y combina modelos según tus necesidades.
    - Modos de búsqueda inteligentes: Elige Speed Mode cuando necesites respuestas rápidas, Balanced Mode para búsquedas cotidianas o Quality Mode para investigación profunda.
    - Elige tus fuentes: Busca en la web, discusiones o artículos académicos. Más fuentes e integraciones están en marcha.
    - Widgets: Tarjetas de UI útiles que aparecen cuando son relevantes, como clima, cálculos, precios de acciones y otras consultas rápidas.
    - Búsqueda web impulsada por SearxNG: Accede a varios motores de búsqueda manteniendo tu identidad privada. Soporte para Tavily y Exa próximamente.
    - Búsqueda de imágenes y vídeos: Encuentra contenido visual junto a resultados de texto. La búsqueda ya no se limita a artículos.
    - Subida de archivos: Sube documentos y haz preguntas sobre ellos. PDFs, textos, imágenes: Vane los entiende todos.
    - Buscar dominios específicos: Limita la búsqueda a sitios concretos cuando sepas dónde mirar. Ideal para documentación técnica o papers.
    - Sugerencias inteligentes: Obtén sugerencias de búsqueda inteligentes mientras escribes, ayudándote a formular mejores consultas.
    - Discover: Explora artículos interesantes y contenido en tendencia a lo largo del día. Mantente informado sin ni siquiera buscar.
    - Historial de búsqueda: Cada búsqueda se guarda localmente para que puedas revisitar tus descubrimientos en cualquier momento. Tu investigación nunca se pierde.
    - Más próximamente: Estamos desarrollando activamente nuevas funciones según el feedback de la comunidad. ¡Únete a nuestro Discord para ayudar a dar forma al futuro de Vane!
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    v1.1.28: Fijar la imagen a `itzcrazykns1337/vane:v1.12.2` (dejar de usar `:main`). Mover las claves API de proveedores de IA (`OPENAI_APIKEY`, `GROQ_APIKEY`, `ANTHROPIC_APIKEY`, `GEMINI_APIKEY`, `CUSTOM_OPENAI_APIKEY`, `OLLAMA_API_KEY`) a Kubernetes Secret; ConfigMap conserva marcadores vacíos y un initContainer inyecta las claves en `config.toml` vía `secretKeyRef`.
    
    Actualización de la versión de la app a 1.12.2
    
    Esta es una versión mayor con una refactorización arquitectónica completa. Hemos eliminado Langchain en favor de una implementación propia para control de bajo nivel sobre streaming, generación y funciones específicas del proveedor.
    
    Qué ha cambiado
    
    **Actualizaciones generales:**
    - Proveedores renombrados a connections para mejor UX
    - Corregidos errores de build y arranque de SearxNG
    - Añadidos nuevos agents DIR, migradas sugerencias y agents de vídeo y audio
    - Añadidos tipos message y chunk para mejor type safety
    - Añadido renderizado de bloques de código con resaltado de sintaxis
    - Añadidos número de versión y enlace de GitHub en settings
    - Varias mejoras de UI con animaciones vía Framer Motion
    
    **Eliminación de Langchain y sistema de providers personalizado:**
    - Eliminado Langchain e implementadas clases base y provider propias
    - Implementado function calling con streaming parcial
    
    **Nuevo Session Manager:**
    - Añadido session manager con reconexión automática de stream
    - Las sesiones pueden restaurarse por ID si la página se refresca o el stream se desconecta
    
    **Widgets:**
    - Añadidos widgets de clima, datos bursátiles y cálculos matemáticos
    
    **Clasificación de consultas e investigador con Actions:**
    - Cada consulta se clasifica ahora antes de comenzar la investigación
    - El investigador usa actions con tool calling para búsqueda web, scraping, búsqueda en sitios concretos, discusiones, archivos subidos, etc.
    
    **Deep Research Mode (Beta):**
    - Añadido modo de búsqueda de calidad donde el LLM razona de forma iterativa sobre los datos recopilados
    - Permite una exploración más profunda y la preparación de informes detallados
    
    **Modos de investigación actualizados:**
    - Balanced Mode: Ahora obliga al LLM a razonar con un máximo limitado de acciones
    - Speed Mode: Se ejecuta sin razonamiento para respuestas rápidas
    
    **Streaming basado en Block y JSON Patch:**
    - Cada paso del LLM se transmite ahora para visibilidad en tiempo real
    
    **Nuevo Upload Manager y búsqueda de archivos mejorada:**
    - Añadido upload manager con soporte PDF, DOCX y texto
    - Búsqueda de archivos mejorada con RRF (Reciprocal Rank Fusion) para mejor calidad de retrieval
    
    **Sistema de fuentes rediseñado:**
    - Focus modes eliminados y reemplazados por 3 fuentes: web, academic y discussions
    - Las fuentes pueden activarse individualmente o todas juntas
    
    Nota completa: https://github.com/ItzCrazyKns/Vane/releases/tag/v1.12.2

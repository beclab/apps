metadata:
  title: Vane
  description: Vane（旧 Perplexica）は AI 駆動の回答エンジンです
spec:
  fullDescription: |
    Vane（旧 Perplexica）は、すべて自前のハードウェア上で動作するプライバシー重視の AI 回答エンジンです。広大なインターネットの知識と、ローカル LLM（Ollama）およびクラウドプロバイダー（OpenAI、Claude、Groq）のサポートを組み合わせ、出典付きの正確な回答を提供しつつ、検索を完全にプライベートに保ちます。
    
    **機能**
    - 主要 AI プロバイダーすべてに対応 — Ollama 経由のローカル LLM、または OpenAI、Anthropic Claude、Google Gemini、Groq などへ接続。ニーズに応じてモデルを組み合わせ可能。
    - スマート検索モード — 素早い回答には Speed Mode、日常検索には Balanced Mode、深い調査には Quality Mode。
    - ソースを選択 — Web、ディスカッション、学術論文を検索。追加ソースと統合も進行中。
    - ウィジェット — 天気、計算、株価などの関連時に表示される便利な UI カード。
    - SearxNG による Web 検索 — 身元を隠したまま複数の検索エンジンにアクセス。Tavily と Exa のサポートも近日追加。
    - 画像・動画検索 — テキスト結果と合わせてビジュアルコンテンツを検索。記事だけに限定されません。
    - ファイルアップロード — ドキュメントをアップロードして質問。PDF、テキスト、画像 — Vane はすべて理解します。
    - 特定ドメイン検索 — 探す場所がわかっているときは特定サイトに限定。技術文書や研究論文に最適。
    - スマート提案 — 入力中にインテリジェントな検索提案を得て、より良いクエリを作成。
    - Discover — 一日を通じて興味深い記事やトレンドを閲覧。検索しなくても情報を得られます。
    - 検索履歴 — すべての検索はローカルに保存され、いつでも再訪可能。リサーチは失われません。
    - 今後さらに追加 — コミュニティフィードバックに基づき新機能を積極開発中。Discord に参加して Vane の未来を一緒に形作りましょう！
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    v1.1.28: イメージを `itzcrazykns1337/vane:v1.12.2` に固定（`:main` の使用を停止）。AI プロバイダー API キー（`OPENAI_APIKEY`、`GROQ_APIKEY`、`ANTHROPIC_APIKEY`、`GEMINI_APIKEY`、`CUSTOM_OPENAI_APIKEY`、`OLLAMA_API_KEY`）を Kubernetes Secret へ移動。ConfigMap は空のプレースホルダーを保持し、initContainer が `secretKeyRef` 経由で `config.toml` にキーを注入。
    
    アプリバージョンを 1.12.2 へアップグレード
    
    本リリースはアーキテクチャの全面刷新を含むメジャーリリースです。ストリーミング、生成、プロバイダー固有機能の低レベル制御のため、Langchain を独自実装に置き換えました。
    
    変更点
    
    **一般的な更新:**
    - UX 向上のため providers を connections に改名
    - SearxNG のビルド／起動エラーを修正
    - 新しい agents DIR を追加、suggestions／video／audio agents を移行
    - 型安全性向上のため message と chunk 型を追加
    - シンタックスハイライト付きコードブロック描画を追加
    - 設定にバージョン番号と GitHub リンクを追加
    - Framer Motion による各種 UI 改善
    
    **Langchain 削除とカスタムプロバイダーシステム:**
    - Langchain を削除し、カスタム base／provider クラスを実装
    - 部分ストリーミング付き function calling を実装
    
    **新しい Session Manager:**
    - 自動ストリーム再接続付きセッションマネージャーを追加
    - ページ更新やストリーム切断時に ID でセッション復元可能
    
    **ウィジェット:**
    - 天気、株式市場データ、数学計算のウィジェットを追加
    
    **クエリ分類と Actions 付き Researcher:**
    - リサーチ開始前に各クエリを分類
    - Researcher は Web 検索、スクレイピング、特定サイト検索、ディスカッション検索、ファイルアップロード検索などに tool calling 付き actions を使用
    
    **Deep Research Mode（Beta）:**
    - 収集データに対して LLM が反復推論する quality 検索モードを追加
    - より深い探索と詳細レポート作成が可能
    
    **更新された Research Modes:**
    - Balanced Mode: 最大アクション数を制限して LLM に推論を強制
    - Speed Mode: 推論なしで高速応答
    
    **Block & JSON Patch ベースのストリーミング:**
    - LLM の各ステップをリアルタイム可視性のためにストリーム
    
    **新しい Upload Manager と強化されたファイル検索:**
    - PDF、DOCX、テキスト対応のアップロードマネージャーを追加
    - RRF（Reciprocal Rank Fusion）によるファイル検索品質向上
    
    **再設計されたソースシステム:**
    - Focus modes を廃止し、web・academic・discussions の 3 ソースに置換
    - ソースは個別またはすべて同時に切り替え可能
    
    完全なリリースノート: https://github.com/ItzCrazyKns/Vane/releases/tag/v1.12.2

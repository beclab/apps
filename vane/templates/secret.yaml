apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vane
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.databases.vane }}"
  OPENAI_APIKEY: {{ .Values.olaresEnv.OPENAI_APIKEY | default "" | quote }}
  GROQ_APIKEY: {{ .Values.olaresEnv.GROQ_APIKEY | default "" | quote }}
  ANTHROPIC_APIKEY: {{ .Values.olaresEnv.ANTHROPIC_APIKEY | default "" | quote }}
  GEMINI_APIKEY: {{ .Values.olaresEnv.GEMINI_APIKEY | default "" | quote }}
  CUSTOM_OPENAI_APIKEY: {{ .Values.olaresEnv.CUSTOM_OPENAI_APIKEY | default "" | quote }}
  OLLAMA_API_KEY: {{ .Values.olaresEnv.OLLAMA_API_KEY | default "" | quote }}

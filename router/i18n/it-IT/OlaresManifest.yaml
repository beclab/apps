metadata:
  title: Router
  description: Il gateway IA nativo per Olares.
spec:
  fullDescription: |
    Router offre a Olares un'unica API in stile OpenAI per i modelli IA locali e cloud. Usa un solo URL di base e una chiave API per accedere a tutti i tuoi modelli, senza SDK o chiavi aggiuntive. Gli amministratori possono collegare i provider e gestire i modelli in un unico punto, con configurazione e controllo semplici da Mercato Olares.

    **Punti salienti**
    - **Interfaccia unificata dei modelli**: Accedi in modo fluido a Chat, Embeddings e all'elenco dei modelli tramite un'API completamente compatibile con OpenAI.
    - **Accesso semplice ai modelli locali e cloud**: Sfrutta i modelli locali di Olares o connettiti istantaneamente a provider cloud come OpenAI, Anthropic, Gemini, Azure OpenAI e qualsiasi servizio compatibile con OpenAI, tutto da un unico punto.
    - **Gestione completa dei modelli**: Configura i provider in modo intuitivo tramite una console visiva, gestisci modelli integrati e personalizzati, sincronizza i modelli upstream, abilita o disabilita i modelli secondo necessità e definisci predefiniti a livello di sistema o di utente.
    - **Integrazione profonda con Mercato Olares**: Installa, aggiorna o rimuovi istantaneamente i modelli locali, monitora l'avanzamento delle attività in tempo reale e beneficia della registrazione automatica del provider all'installazione del modello.
    - **Gestione avanzata di chiavi API e accessi**: Emetti, abilita/disabilita e imposta le scadenze delle chiavi API, applica allowlist di modelli e governa l'accesso per utenti, amministratori e identità delle app Olares, tutto in un flusso di lavoro unificato.
    - **Controlli solidi di costi e quote**: Monitora utilizzo e spesa a colpo d'occhio, genera riepiloghi di utilizzo ed esportazioni CSV e applica budget o limiti di frequenza (RPM/TPM) per chiave, utente o modello.
    - **Affidabilità e sicurezza di livello enterprise**: Beneficia di meccanismi integrati di timeout, retry e circuit breaker; tutte le credenziali dei provider sono crittografate, versionate, supportano il rollback e le operazioni di gestione sono completamente verificabili.
    - **Osservabilità completa**: Ottieni health check integrati, metriche compatibili con Prometheus e tracing OTLP nativo, per il tracing automatico a livello di gateway e l'integrazione fluida dei dati OpenTelemetry degli agenti.

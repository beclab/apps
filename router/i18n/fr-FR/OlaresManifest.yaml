metadata:
  title: Router
  description: La passerelle IA native d'Olares.
spec:
  fullDescription: |
    Router offre à Olares une API unifiée de type OpenAI pour les modèles d'IA locaux et cloud. Utilisez une seule URL de base et une clé API pour accéder à tous vos modèles, sans SDK ni clés supplémentaires. Les administrateurs peuvent connecter les fournisseurs et gérer les modèles en un seul endroit, avec une configuration et un contrôle simples depuis Marché Olares.

    **Points forts**
    - **Interface de modèles unifiée** : Accédez de manière fluide à Chat, Embeddings et à la liste des modèles via une API entièrement compatible OpenAI.
    - **Accès facile aux modèles locaux et cloud** : Exploitez les modèles locaux d'Olares ou connectez-vous instantanément à des fournisseurs cloud tels qu'OpenAI, Anthropic, Gemini, Azure OpenAI et tout service compatible OpenAI, le tout depuis un seul endroit.
    - **Gestion complète des modèles** : Configurez intuitivement les fournisseurs via une console visuelle, gérez les modèles intégrés et personnalisés, synchronisez les modèles en amont, activez ou désactivez les modèles selon les besoins, et définissez des valeurs par défaut à l'échelle du système ou par utilisateur.
    - **Intégration profonde avec Marché Olares** : Installez, mettez à jour ou supprimez instantanément des modèles locaux, suivez la progression des tâches en temps réel et bénéficiez de l'enregistrement automatique du fournisseur lors de l'installation d'un modèle.
    - **Gestion puissante des clés API et des accès** : Émettez, activez/désactivez et définissez l'expiration des clés API, appliquez des listes d'autorisation de modèles, et pilotez l'accès des utilisateurs, des administrateurs et des identités d'applications Olares, le tout dans un flux de travail unifié.
    - **Contrôles robustes des coûts et des quotas** : Surveillez l'utilisation et les dépenses d'un coup d'œil, générez des synthèses d'usage et des exports CSV, et appliquez des budgets ou des limites de débit (RPM/TPM) par clé, utilisateur ou modèle.
    - **Fiabilité et sécurité de niveau entreprise** : Bénéficiez de mécanismes intégrés de timeout, de retry et de disjoncteur ; tous les identifiants des fournisseurs sont chiffrés, versionnés, prennent en charge les rollbacks, et les opérations de gestion sont entièrement auditables.
    - **Observabilité complète** : Disposez de contrôles de santé intégrés, de métriques compatibles Prometheus et d'un tracing OTLP natif, permettant un tracing automatique au niveau de la passerelle et une intégration fluide des données OpenTelemetry des agents.

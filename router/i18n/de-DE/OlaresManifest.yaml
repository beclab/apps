metadata:
  title: Router
  description: Das native KI-Gateway für Olares.
spec:
  fullDescription: |
    Router stellt Olares eine einheitliche OpenAI-kompatible API für lokale und Cloud-KI-Modelle bereit. Mit einer Base-URL und einem API-Key greifen Sie auf alle Modelle zu – ohne zusätzliche SDKs oder Schlüssel. Administratoren können Anbieter verbinden und Modelle an einem Ort verwalten, mit einfacher Einrichtung und Steuerung über den Olares-Markt.

    **Highlights**
    - **Einheitliche Modell-Schnittstelle**: Nahtloser Zugriff auf Chat, Embeddings und Modelllisten über eine vollständig OpenAI-kompatible API.
    - **Müheloser Zugriff auf lokale und Cloud-Modelle**: Nutzen Sie lokale Modelle von Olares oder verbinden Sie sich sofort mit Cloud-Anbietern wie OpenAI, Anthropic, Gemini, Azure OpenAI und jedem OpenAI-kompatiblen Dienst – alles an einem Ort.
    - **Umfassendes Modellmanagement**: Konfigurieren Sie Anbieter intuitiv über eine visuelle Konsole, verwalten Sie integrierte und benutzerdefinierte Modelle, synchronisieren Sie Upstream-Modelle, aktivieren oder deaktivieren Sie Modelle nach Bedarf und legen Sie systemweite oder benutzerspezifische Standardwerte fest.
    - **Tiefe Olares-Market-Integration**: Installieren, aktualisieren oder entfernen Sie lokale Modelle sofort, überwachen Sie den Aufgabenfortschritt in Echtzeit und profitieren Sie von der automatischen Anbieterregistrierung nach der Modellinstallation.
    - **Leistungsstarkes API-Key- und Zugriffsmanagement**: Stellen Sie API-Keys aus, aktivieren/deaktivieren Sie sie und setzen Sie Ablaufdaten, erzwingen Sie Modell-Allowlists und steuern Sie den Zugriff für Benutzer, Administratoren und Olares-App-Identitäten – in einem einheitlichen Workflow.
    - **Robuste Kosten- und Kontingentsteuerung**: Überwachen Sie Nutzung und Ausgaben auf einen Blick, erstellen Sie Nutzungsübersichten und CSV-Exporte und setzen Sie Budget- oder Ratenlimits (RPM/TPM) nach Key, Benutzer oder Modell durch.
    - **Enterprise-taugliche Zuverlässigkeit und Sicherheit**: Profitieren Sie von integrierten Timeout-, Retry- und Circuit-Breaker-Mechanismen; alle Anbieter-Credentials sind verschlüsselt, versionskontrolliert, unterstützen Rollbacks, und Verwaltungsvorgänge sind vollständig auditierbar.
    - **Umfassende Observability**: Nutzen Sie integrierte Health Checks, Prometheus-kompatible Metriken und natives OTLP-Tracing für automatisches Gateway-Tracing und nahtlose Agent-OpenTelemetry-Datenintegration.

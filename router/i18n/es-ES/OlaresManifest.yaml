metadata:
  title: Router
  description: La pasarela de IA nativa de Olares.
spec:
  fullDescription: |
    Router ofrece a Olares una API unificada al estilo de OpenAI para modelos de IA locales y en la nube. Use una sola URL base y una clave de API para acceder a todos sus modelos, sin SDKs ni claves adicionales. Los administradores pueden conectar proveedores y gestionar modelos en un solo lugar, con una configuración y un control sencillos desde Mercado de Olares.

    **Destacados**
    - **Interfaz unificada de modelos**: Acceda de forma fluida a Chat, Embeddings y al listado de modelos mediante una API totalmente compatible con OpenAI.
    - **Acceso sencillo a modelos locales y en la nube**: Aproveche los modelos locales de Olares o conéctese al instante a proveedores en la nube como OpenAI, Anthropic, Gemini, Azure OpenAI y cualquier servicio compatible con OpenAI, todo desde un mismo lugar.
    - **Gestión integral de modelos**: Configure proveedores de forma intuitiva a través de una consola visual, gestione modelos integrados y personalizados, sincronice modelos upstream, active o desactive modelos según sea necesario y defina valores predeterminados a nivel de sistema o de usuario.
    - **Integración profunda con Mercado de Olares**: Instale, actualice o elimine modelos locales al instante, supervise el progreso de las tareas en tiempo real y disfrute del registro automático de proveedores al instalar un modelo.
    - **Gestión potente de claves API y accesos**: Emita, active/desactive y establezca caducidades para las claves API, aplique listas de modelos permitidos y controle el acceso de usuarios, administradores e identidades de aplicaciones de Olares, todo en un flujo de trabajo unificado.
    - **Controles sólidos de costes y cuotas**: Supervise el uso y el gasto de un vistazo, genere resúmenes de uso y exportaciones CSV, y aplique presupuestos o límites de tasa (RPM/TPM) por clave, usuario o modelo.
    - **Fiabilidad y seguridad de nivel empresarial**: Benefíciese de mecanismos integrados de tiempo de espera, reintento y cortacircuitos; todas las credenciales de los proveedores están cifradas, con control de versiones, admiten reversiones y las operaciones de gestión son totalmente auditables.
    - **Observabilidad completa**: Obtenga comprobaciones de estado integradas, métricas compatibles con Prometheus y trazado OTLP nativo, lo que permite el trazado automático a nivel de pasarela y la integración fluida de datos OpenTelemetry de los agentes.

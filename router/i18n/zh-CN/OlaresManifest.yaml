metadata:
  title: Router
  description: Olares 的原生 AI 网关。
spec:
  fullDescription: |
    Router 为 Olares 提供了一个本地与云端 AI 模型的统一 OpenAI 风格 API。只需一个基础 URL 和 API Key，即可访问所有模型，无需额外 SDK 或密钥。管理员可在 Olares Market 简单设置和管理所有的模型与提供商。

    **功能亮点**
    - **统一模型接口**：通过完全兼容 OpenAI 的 API，无缝访问 Chat、Embeddings 及模型列表等功能。
    - **本地与云端模型无缝访问**：即刻连接本地模型或 OpenAI、Anthropic、Gemini、Azure OpenAI 及所有兼容 OpenAI 的云端厂商，一站式使用。
    - **全方位模型管理**：通过可视化控制台直观配置厂商，管理内置和自定义模型，同步上游模型，随时启用或禁用模型，设置系统或用户级默认项。
    - **深度 Olares 市场集成**：一键安装、升级、移除本地模型，实时监控任务进度，模型安装后自动完成提供商注册。
    - **强大的 API Key 与访问权限管理**：创建、启用/禁用及设置 API Key 过期，强制模型白名单，统一管理用户、管理员与 Olares 应用身份的访问权限。
    - **完善的成本与配额控制**：轻松查看用量与支出，生成报表和 CSV 导出，可按 Key、用户或模型设定预算和速率限制（RPM/TPM）。
    - **企业级高可靠性与安全**：内置超时、重试与熔断机制；所有厂商凭证均加密、版本管理和支持回滚，管理操作可完整审计。
    - **全面可观测性**：内置健康检查，兼容 Prometheus 的指标，支持 OTLP 链路追踪；自动采集网关与智能体的 OpenTelemetry 追踪数据，轻松与运维平台集成。
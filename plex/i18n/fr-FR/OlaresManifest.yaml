metadata:
  title: Plex Media Server
  description: Un serveur multimédia pour organiser et diffuser vos vidéos et votre musique
spec:
  fullDescription: 'Plex Media Server organise vos fichiers vidéo et musicaux dans une bibliothèque consultable et les diffuse vers les applications Plex.


    **Fonctionnalités principales**


    - Parcourez votre collection avec des affiches, des descriptions et des informations sur les médias.

    - Lisez directement les fichiers compatibles ou convertissez les vidéos pour l’appareil de lecture.

    - Utilisez le transcodage accéléré par le matériel NVIDIA avec un Plex Pass actif et un GPU compatible.

    - Ajoutez des sous-titres externes, notamment des fichiers SRT et ASS.


    **Utiliser Plex sur Olares**


    Ajoutez vos fichiers dans `Home/Movies` et `Home/Music`, puis sélectionnez `/media/Movies` et `/media/Music` lors de la création des bibliothèques. Plex peut lire ces dossiers, mais ne peut pas modifier les fichiers sources. Utilisez Plex Account Setup pour connecter le serveur à votre compte Plex.


    Un compte Plex est nécessaire pour associer le serveur. Le transcodage matériel nécessite Plex Pass ; d’autres fonctionnalités et clients Plex peuvent nécessiter un abonnement distinct. Les clients natifs et l’accès à distance peuvent demander une configuration réseau supplémentaire. Les fichiers multimédias et les abonnements Plex ne sont pas inclus.


    [Découvrir Plex Media Server](https://www.plex.tv/your-media/)'

metadata:
  title: Plex Media Server
  description: Un serveur multimédia pour organiser et diffuser vos vidéos et votre musique
spec:
  fullDescription: |
    Plex Media Server organise vos fichiers vidéo et musicaux dans une bibliothèque consultable et les diffuse vers les applications Plex.

    **Fonctionnalités principales**

    - Parcourez votre collection avec des affiches, des descriptions et des informations sur les médias.
    - Lisez directement les fichiers compatibles ou convertissez les vidéos pour l’appareil de lecture.
    - Utilisez le transcodage accéléré par le matériel NVIDIA avec un Plex Pass actif et un GPU compatible.
    - Ajoutez des sous-titres externes, notamment des fichiers SRT et ASS.

    **Utiliser Plex sur Olares**

    Ajoutez vos fichiers dans `Home/Movies` et `Home/Music`, puis sélectionnez `/media/Movies` et `/media/Music` lors de la création des bibliothèques. Plex peut lire ces dossiers, mais ne peut pas modifier les fichiers sources. Utilisez Plex Account Setup pour connecter le serveur à votre compte Plex.

    Un compte Plex est nécessaire pour associer le serveur. Le transcodage matériel nécessite Plex Pass ; d’autres fonctionnalités et clients Plex peuvent nécessiter un abonnement distinct. Les clients natifs et l’accès à distance peuvent demander une configuration réseau supplémentaire. Les fichiers multimédias et les abonnements Plex ne sont pas inclus.

    [Découvrir Plex Media Server](https://www.plex.tv/your-media/)

    **Accès local et applications TV**

    Activez Plex dans les paramètres Olares > Réseau > Overlay pour obtenir une adresse IP locale dédiée. Les appareils du même réseau local peuvent se connecter à cette IP sur le port TCP `32400`. Les appareils distants ont besoin d’un VPN ou d’une autre route vers ce réseau. L’entrée Web privée d’Olares exige une connexion à Olares et ne remplace pas une adresse destinée aux applications natives.

    Après avoir activé Overlay, ouvrez Plex Account Setup et repérez Local connection. Cliquez sur Refresh local address, puis sur Copy address pour copier l’adresse HTTPS, sans la composer manuellement. Dans Plex Web, ouvrez Paramètres → votre serveur → Réseau → Afficher les paramètres avancés, ajoutez l’adresse aux URL d’accès personnalisées au serveur et enregistrez. Conservez les adresses existantes séparées par des virgules. L’adresse n’est pas ajoutée automatiquement à Plex. Une adresse accessible ne garantit pas la découverte automatique par les applications TV.

    Utilisez l’option Overlay fournie par cette application pour l’accès local. Après une mise à jour du marché, vérifiez la connexion si vous utilisez des paramètres réseau personnalisés.

    **Compatibilité de lecture HEVC**

    Certaines vidéos Dolby Vision/HDR10 peuvent se figer pendant le transcodage HEVC dans Chrome. Dans ce cas, réglez Enable HEVC video encoding sur Never dans les paramètres du transcodeur Plex, gardez les deux options d’accélération matérielle activées et démarrez une nouvelle session de lecture. Plex peut alors utiliser le transcodage matériel H.264.
  upgradeDescription: |
    Met à jour Plex Media Server vers la version 1.43.5.11079.

    Ajoute un accès local facultatif via Olares Overlay sur le port TCP `32400`. Activez-le dans les paramètres Olares > Réseau > Overlay. Les adresses HTTPS des applications natives nécessitent encore une configuration dans Plex.

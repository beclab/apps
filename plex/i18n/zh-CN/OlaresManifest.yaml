metadata:
  title: Plex Media Server
  description: 用于整理和串流个人视频及音乐的媒体服务器
spec:
  fullDescription: 'Plex Media Server 将自己的视频和音乐文件整理为可浏览的媒体库，并串流到 Plex 客户端。


    **主要功能**


    - 通过海报、简介和媒体详情浏览收藏。

    - 直接播放支持的文件，或将视频转换为播放设备适用的格式。

    - 搭配有效的 Plex Pass 和兼容的 GPU，使用 NVIDIA 硬件加速转码。

    - 添加外部字幕，包括 SRT 和 ASS 文件。


    **在 Olares 上使用 Plex**


    将文件放入 `Home/Movies` 和 `Home/Music`，创建媒体库时选择 `/media/Movies` 和 `/media/Music`。Plex 可以读取这些目录，但不能修改源文件。通过 Plex Account Setup 将服务器绑定到自己的 Plex 账号。


    绑定服务器需要 Plex 账号。硬件转码需要 Plex Pass；其他 Plex 功能及客户端可能另有订阅要求。原生客户端和远程访问可能需要额外配置网络。本应用不附带媒体文件或 Plex 订阅。


    [了解 Plex Media Server](https://www.plex.tv/your-media/)'

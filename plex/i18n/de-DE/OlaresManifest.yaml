metadata:
  title: Plex Media Server
  description: Ein Medienserver zum Organisieren und Streamen eigener Videos und Musik
spec:
  fullDescription: 'Plex Media Server organisiert Ihre eigenen Video- und Musikdateien in einer durchsuchbaren Mediathek und streamt sie an Plex-Apps.


    **Hauptfunktionen**


    - Durchsuchen Sie Ihre Sammlung mit Postern, Beschreibungen und Medieninformationen.

    - Spielen Sie unterstützte Dateien direkt ab oder konvertieren Sie Videos für das Wiedergabegerät.

    - Nutzen Sie hardwarebeschleunigtes Transcoding mit NVIDIA, einem aktiven Plex Pass und einer kompatiblen GPU.

    - Fügen Sie externe Untertitel hinzu, darunter SRT- und ASS-Dateien.


    **Plex auf Olares verwenden**


    Legen Sie Dateien in `Home/Movies` und `Home/Music` ab und wählen Sie beim Erstellen der Mediatheken `/media/Movies` und `/media/Music` aus. Plex kann diese Ordner lesen, die Quelldateien jedoch nicht verändern. Verbinden Sie den Server über Plex Account Setup mit Ihrem Plex-Konto.


    Zum Zuordnen des Servers ist ein Plex-Konto erforderlich. Hardware-Transcoding erfordert Plex Pass; andere Plex-Funktionen und Clients können separate Abonnements voraussetzen. Native Clients und Fernzugriff können zusätzliche Netzwerkkonfiguration erfordern. Mediendateien und Plex-Abonnements sind nicht enthalten.


    [Mehr über Plex Media Server](https://www.plex.tv/your-media/)'

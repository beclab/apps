metadata:
  title: Plex Media Server
  description: Un servidor multimedia para organizar y transmitir tus propios vídeos y música
spec:
  fullDescription: 'Plex Media Server organiza tus archivos de vídeo y música en una biblioteca que puedes explorar y los transmite a las aplicaciones Plex.


    **Funciones principales**


    - Explora tu colección con carteles, descripciones y detalles de los contenidos multimedia.

    - Reproduce directamente los archivos compatibles o convierte los vídeos para el dispositivo de reproducción.

    - Usa la transcodificación acelerada por hardware NVIDIA con un Plex Pass activo y una GPU compatible.

    - Añade subtítulos externos, incluidos archivos SRT y ASS.


    **Usar Plex en Olares**


    Añade archivos a `Home/Movies` y `Home/Music` y selecciona `/media/Movies` y `/media/Music` al crear las bibliotecas. Plex puede leer estas carpetas, pero no puede modificar los archivos originales. Usa Plex Account Setup para conectar el servidor a tu cuenta Plex.


    Se necesita una cuenta Plex para vincular el servidor. La transcodificación por hardware requiere Plex Pass; otras funciones y clientes de Plex pueden requerir suscripciones independientes. Los clientes nativos y el acceso remoto pueden necesitar configuración de red adicional. Los archivos multimedia y las suscripciones Plex no están incluidos.


    [Más información sobre Plex Media Server](https://www.plex.tv/your-media/)'

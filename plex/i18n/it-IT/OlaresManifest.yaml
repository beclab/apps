metadata:
  title: Plex Media Server
  description: Un server multimediale per organizzare e trasmettere i propri video e la propria musica
spec:
  fullDescription: |
    Plex Media Server organizza i propri file video e musicali in una libreria consultabile e li trasmette alle app Plex.

    **Funzionalità principali**

    - Esplora la tua raccolta con locandine, descrizioni e dettagli sui contenuti multimediali.
    - Riproduci direttamente i file supportati o converti i video per il dispositivo di riproduzione.
    - Usa la transcodifica con accelerazione hardware NVIDIA con un Plex Pass attivo e una GPU compatibile.
    - Aggiungi sottotitoli esterni, inclusi file SRT e ASS.

    **Usare Plex su Olares**

    Aggiungi i file a `Home/Movies` e `Home/Music`, quindi seleziona `/media/Movies` e `/media/Music` quando crei le librerie. Plex può leggere queste cartelle, ma non può modificare i file originali. Usa Plex Account Setup per collegare il server al tuo account Plex.

    Per associare il server è necessario un account Plex. La transcodifica hardware richiede Plex Pass; altre funzionalità e altri client Plex possono richiedere abbonamenti separati. I client nativi e l’accesso remoto possono richiedere una configurazione di rete aggiuntiva. I file multimediali e gli abbonamenti Plex non sono inclusi.

    [Scopri Plex Media Server](https://www.plex.tv/your-media/)

    **Accesso locale e app TV**

    Abilita Plex in Impostazioni Olares > Rete > Overlay per ottenere un IP locale dedicato. I dispositivi sulla stessa LAN possono collegarsi a questo IP sulla porta TCP `32400`. I dispositivi remoti richiedono una VPN o un altro percorso verso questa rete. L’ingresso Web privato di Olares richiede l’accesso a Olares e non sostituisce un indirizzo per i client nativi.

    Dopo aver abilitato Overlay, apri Plex Account Setup e individua Local connection. Fai clic su Refresh local address, poi su Copy address per copiare l’indirizzo HTTPS senza comporlo manualmente. In Plex Web, apri Impostazioni → il tuo server → Rete → Mostra impostazioni avanzate, aggiungi l’indirizzo agli URL di accesso personalizzati del server e salva. Mantieni gli indirizzi esistenti separati da virgole. L’indirizzo non viene aggiunto automaticamente a Plex. Un indirizzo raggiungibile non garantisce il rilevamento automatico da parte delle app TV.

    Per l’accesso locale, usa l’opzione Overlay fornita da questa app. Dopo un aggiornamento del mercato, verifica la connessione se usi impostazioni di rete personalizzate.

    **Compatibilità di riproduzione HEVC**

    Alcuni video Dolby Vision/HDR10 possono mostrare un’immagine bloccata durante la transcodifica HEVC in Chrome. In tal caso, imposta Enable HEVC video encoding su Never nelle impostazioni del transcodificatore Plex, mantieni abilitate entrambe le opzioni di accelerazione hardware e avvia una nuova sessione di riproduzione. Plex può quindi usare la transcodifica hardware H.264.
  upgradeDescription: |
    Aggiorna Plex Media Server alla versione 1.43.5.11079.

    Aggiunge l’accesso locale facoltativo tramite Olares Overlay sulla porta TCP `32400`. Abilitalo in Impostazioni Olares > Rete > Overlay. Gli indirizzi HTTPS per i client nativi richiedono ancora la configurazione in Plex.

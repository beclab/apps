metadata:
  title: Plex Media Server
  description: Un server multimediale per organizzare e trasmettere i propri video e la propria musica
spec:
  fullDescription: 'Plex Media Server organizza i propri file video e musicali in una libreria consultabile e li trasmette alle app Plex.


    **Funzionalità principali**


    - Esplora la tua raccolta con locandine, descrizioni e dettagli sui contenuti multimediali.

    - Riproduci direttamente i file supportati o converti i video per il dispositivo di riproduzione.

    - Usa la transcodifica con accelerazione hardware NVIDIA con un Plex Pass attivo e una GPU compatibile.

    - Aggiungi sottotitoli esterni, inclusi file SRT e ASS.


    **Usare Plex su Olares**


    Aggiungi i file a `Home/Movies` e `Home/Music`, quindi seleziona `/media/Movies` e `/media/Music` quando crei le librerie. Plex può leggere queste cartelle, ma non può modificare i file originali. Usa Plex Account Setup per collegare il server al tuo account Plex.


    Per associare il server è necessario un account Plex. La transcodifica hardware richiede Plex Pass; altre funzionalità e altri client Plex possono richiedere abbonamenti separati. I client nativi e l’accesso remoto possono richiedere una configurazione di rete aggiuntiva. I file multimediali e gli abbonamenti Plex non sono inclusi.


    [Scopri Plex Media Server](https://www.plex.tv/your-media/)'

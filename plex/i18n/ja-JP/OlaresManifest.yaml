metadata:
  title: Plex Media Server
  description: 個人の動画や音楽を整理して配信するメディアサーバー
spec:
  fullDescription: |
    Plex Media Serverは、自分の動画や音楽ファイルを閲覧できるライブラリに整理し、Plexアプリに配信します。

    **主な機能**

    - ポスター、紹介文、メディアの詳細情報とともにコレクションを閲覧できます。
    - 対応ファイルを直接再生するか、再生デバイスに合わせて動画を変換できます。
    - 有効なPlex Passと対応GPUがあれば、NVIDIAによるハードウェアアクセラレーションでトランスコードできます。
    - SRTやASSなどの外部字幕を追加できます。

    **OlaresでPlexを使う**

    ファイルを`Home/Movies`と`Home/Music`に追加し、ライブラリ作成時に`/media/Movies`と`/media/Music`を選択してください。Plexはこれらのフォルダーを読み取れますが、元のファイルは変更できません。Plex Account Setupからサーバーを自分のPlexアカウントに接続してください。

    サーバーをアカウントに紐付けるにはPlexアカウントが必要です。ハードウェアトランスコードにはPlex Passが必要です。その他のPlex機能やクライアントにも、別途サブスクリプションが必要な場合があります。ネイティブクライアントやリモートアクセスには、追加のネットワーク設定が必要な場合があります。メディアファイルやPlexサブスクリプションは含まれません。

    [Plex Media Serverについて](https://www.plex.tv/your-media/)

    **ローカルアクセスとテレビ用クライアント**

    Olaresの設定 > ネットワーク > OverlayでPlexを有効にすると、専用のローカルIPが割り当てられます。同じLANのデバイスは、そのIPのTCPポート`32400`に接続できます。リモートデバイスにはVPNなど、このネットワークへの経路が必要です。Olaresの非公開Web入口にはOlaresへのログインが必要で、ネイティブクライアント用の接続先の代わりにはなりません。

    Overlayを有効にした後、Plex Account SetupのLocal connectionでRefresh local addressをクリックし、Copy addressでHTTPSアドレスをコピーしてください。手動で組み立てる必要はありません。Plex Webの設定 → サーバーを選択 → ネットワーク → 詳細設定の表示で、Custom server access URLsに追加して保存します。既存のアドレスはコンマ区切りで残してください。アドレスはPlexに自動登録されません。アドレスに接続できても、テレビアプリの自動検出は保証されません。

    ローカルアクセスには、このアプリのOverlayオプションを使用してください。独自のネットワーク設定を使用している場合は、マーケットの更新後に接続を確認してください。

    **HEVC再生の互換性**

    一部のDolby Vision/HDR10動画は、ChromeでHEVCにトランスコードすると映像が停止する場合があります。その場合は、Plexのトランスコーダー設定で「Enable HEVC video encoding」を「Never」にし、2つのハードウェアアクセラレーション設定を有効にしたまま、新しい再生セッションを開始してください。PlexはH.264ハードウェアトランスコードを使用できます。
  upgradeDescription: |
    Plex Media Serverを1.43.5.11079に更新します。

    Olares OverlayのTCPポート`32400`によるローカルアクセスのオプションを追加しました。Olaresの設定 > ネットワーク > Overlayで有効にしてください。ネイティブクライアント用のHTTPSアドレスは引き続きPlexで設定する必要があります。

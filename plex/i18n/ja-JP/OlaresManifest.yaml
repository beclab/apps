metadata:
  title: Plex Media Server
  description: 個人の動画や音楽を整理して配信するメディアサーバー
spec:
  fullDescription: 'Plex Media Serverは、自分の動画や音楽ファイルを閲覧できるライブラリに整理し、Plexアプリに配信します。


    **主な機能**


    - ポスター、紹介文、メディアの詳細情報とともにコレクションを閲覧できます。

    - 対応ファイルを直接再生するか、再生デバイスに合わせて動画を変換できます。

    - 有効なPlex Passと対応GPUがあれば、NVIDIAによるハードウェアアクセラレーションでトランスコードできます。

    - SRTやASSなどの外部字幕を追加できます。


    **OlaresでPlexを使う**


    ファイルを`Home/Movies`と`Home/Music`に追加し、ライブラリ作成時に`/media/Movies`と`/media/Music`を選択してください。Plexはこれらのフォルダーを読み取れますが、元のファイルは変更できません。Plex Account Setupからサーバーを自分のPlexアカウントに接続してください。


    サーバーをアカウントに紐付けるにはPlexアカウントが必要です。ハードウェアトランスコードにはPlex Passが必要です。その他のPlex機能やクライアントにも、別途サブスクリプションが必要な場合があります。ネイティブクライアントやリモートアクセスには、追加のネットワーク設定が必要な場合があります。メディアファイルやPlexサブスクリプションは含まれません。


    [Plex Media Serverについて](https://www.plex.tv/your-media/)'

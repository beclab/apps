metadata:
  title: Plex Media Server
  description: A media server for organizing and streaming your own video and music
spec:
  fullDescription: 'Plex Media Server organizes your own video and music files into a browsable library and streams them to Plex apps.


    **Key features**


    - Browse your collection with posters, descriptions, and media details.

    - Play supported files directly or convert video for the playback device.

    - Use NVIDIA hardware-accelerated transcoding with an active Plex Pass and a compatible GPU.

    - Add external subtitles, including SRT and ASS files.


    **Using Plex on Olares**


    Add files to `Home/Movies` and `Home/Music`, then select `/media/Movies` and `/media/Music` when creating libraries. Plex can read these folders but cannot change the source files. Use Plex Account Setup to connect the server to your Plex account.


    A Plex account is required to claim the server. Hardware transcoding requires Plex Pass; other Plex features and clients may have separate subscription requirements. Native clients and remote access may need additional network configuration. Media files and Plex subscriptions are not included.


    [Learn about Plex Media Server](https://www.plex.tv/your-media/)'

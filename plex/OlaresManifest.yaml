  fullDescription: |
    Plex Media Server organizes your own video and music files into a browsable library and streams them to Plex apps.

    **Key features**

    - Browse your collection with posters, descriptions, and media details.
    - Play supported files directly or convert video for the playback device.
    - Use NVIDIA hardware-accelerated transcoding with an active Plex Pass and a compatible GPU.
    - Add external subtitles, including SRT and ASS files.

    **Using Plex on Olares**

    Add files to `Home/Movies` and `Home/Music`, then select `/media/Movies` and `/media/Music` when creating libraries. Plex can read these folders but cannot change the source files. Use Plex Account Setup to connect the server to your Plex account.

    A Plex account is required to claim the server. Hardware transcoding requires Plex Pass; other Plex features and clients may have separate subscription requirements. Native clients and remote access may need additional network configuration. Media files and Plex subscriptions are not included.

    [Learn about Plex Media Server](https://www.plex.tv/your-media/)

    **Local access and TV clients**

    Enable Plex in Olares Settings > Network > Overlay to obtain a dedicated local IP. Devices on the same LAN can connect to that IP on TCP port `32400`. Remote devices need a VPN or another route to this network. The private Olares web entrance requires Olares sign-in and is not a substitute for a native-client endpoint.

    After enabling Overlay, open Plex Account Setup and find Local connection. Click Refresh local address, then Copy address to copy the HTTPS address; no manual assembly is needed. In Plex Web, go to Settings → your server → Network → Show Advanced, add the address to Custom server access URLs, and save. Keep existing addresses separated by commas. The address is not added to Plex automatically. A reachable address alone does not guarantee automatic discovery by TV apps.

    Use the Overlay option provided by this app for local access. After a Market update, check connectivity if you maintain custom network settings.

    **HEVC playback compatibility**

    Some Dolby Vision/HDR10 videos may freeze during HEVC transcoding in Chrome. If this happens, set Enable HEVC video encoding to Never in Plex's Transcoder settings, keep both hardware-acceleration options enabled, and start a new playback session. Plex can then use hardware-accelerated H.264 transcoding.
  upgradeDescription: |

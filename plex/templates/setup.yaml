apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-setup
  namespace: '{{ .Release.Namespace }}'
data:
  setup.py: |
    import http.server
    import json
    import os
    import re
    import urllib.request
    import urllib.parse
    import xml.etree.ElementTree as ET
    import html

    BASE = 'http://127.0.0.1:32400'
    ORIGIN = os.environ['ALLOWED_ORIGIN']
    WEB = os.environ['PLEX_WEB_URL']

    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, *_):
            pass  # Never log claim tokens, requests or account responses.

        def reply(self, code, body, kind='application/json'):
            data = body.encode()
            self.send_response(code)
            self.send_header('Content-Type', kind + '; charset=utf-8')
            self.send_header('Content-Length', str(len(data)))
            self.send_header('Cache-Control', 'no-store')
            self.send_header('X-Content-Type-Options', 'nosniff')
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == '/health':
                return self.reply(200, '{"ok":true}')
            if self.path == '/status':
                try:
                    with urllib.request.urlopen(BASE + '/identity', timeout=10) as r:
                        claimed = ET.fromstring(r.read()).get('claimed') == '1'
                    return self.reply(200, json.dumps({'claimed': claimed}))
                except Exception:
                    return self.reply(503, '{"error":"Plex is starting. Try again shortly."}')
            if self.path != '/':
                return self.reply(404, '{}')
            page = '''<!doctype html><html lang="en"><meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Plex Account Setup</title><style>
            body{font:17px system-ui;background:#191919;color:#eee;max-width:620px;margin:10vh auto;padding:24px;line-height:1.6}
            h1{color:#e5a00d}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #888}
            input{width:90%;background:#282828;color:white}button{margin-top:20px;background:#e5a00d;cursor:pointer}a{color:#f2bd48}
            </style><h1>Connect Plex to your account</h1>
            <p id="status">Checking server…</p>
            <p>1. Sign in at <a href="https://www.plex.tv/claim/" target="_blank" rel="noopener noreferrer">plex.tv/claim</a> and copy a fresh claim token.</p>
            <p>2. Paste the token below. It is sent only to your Plex server for account binding and is not saved by this page.</p>
            <form id="form"><label for="claim">Claim token</label><br><input id="claim" type="password" autocomplete="off" placeholder="claim-…" required>
            <br><button id="submit">Connect account</button></form>
            <p><a href="WEBURL">Open Plex Web →</a></p>
            <p>Media folders: /media/Movies and /media/Music. NVIDIA GPU is configured. Plex hardware transcoding requires Plex Pass.</p>
            <script>
            async function status(){let r=await fetch('/status');let s=await r.json();document.getElementById('status').textContent=s.claimed?'Your Plex server is connected.':(s.error||'Your Plex server is not connected yet.');return s;}
            status();document.getElementById('form').onsubmit=async e=>{e.preventDefault();let b=document.getElementById('submit');b.disabled=true;let i=document.getElementById('claim');
            try{let r=await fetch('/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:i.value})});i.value='';let s=await r.json();document.getElementById('status').textContent=s.message||s.error;}catch(e){document.getElementById('status').textContent='Connection failed. Please try again.';}finally{b.disabled=false;}};
            </script></html>'''.replace('WEBURL', html.escape(WEB, quote=True))
            return self.reply(200, page, 'text/html')

        def do_POST(self):
            if self.path != '/claim':
                return self.reply(404, '{}')
            if self.headers.get('Origin') != ORIGIN or self.headers.get('Content-Type') != 'application/json':
                return self.reply(403, '{"error":"Use this setup page to connect your account."}')
            try:
                size = int(self.headers.get('Content-Length', '0'))
                if not 0 < size <= 512:
                    return self.reply(400, '{"error":"Invalid request."}')
                token = json.loads(self.rfile.read(size)).get('token', '')
                if not isinstance(token, str) or not re.fullmatch(r'claim-[A-Za-z0-9_-]{8,128}', token):
                    return self.reply(400, '{"error":"Enter a valid claim token."}')
                with urllib.request.urlopen(BASE + '/identity', timeout=10) as r:
                    if ET.fromstring(r.read()).get('claimed') == '1':
                        return self.reply(409, '{"error":"This server is already connected to an account."}')
                req = urllib.request.Request(BASE + '/myplex/claim?' + urllib.parse.urlencode({'token':token}), data=b'', method='POST')
                with urllib.request.urlopen(req, timeout=45) as r:
                    r.read()
                with urllib.request.urlopen(BASE + '/identity', timeout=10) as r:
                    claimed = ET.fromstring(r.read()).get('claimed') == '1'
                if claimed:
                    return self.reply(200, '{"message":"Account connected. Open Plex Web to continue."}')
                return self.reply(400, '{"error":"Not connected yet. Get a fresh claim token and try again."}')
            except Exception:
                return self.reply(502, '{"error":"Plex could not connect. Get a fresh claim token and try again."}')

    http.server.ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()

metadata:
  title: FlareSolverr
  description: Server proxy per aggirare la protezione Cloudflare e DDoS-GUARD
spec:
  fullDescription: |
    FlareSolverr è un potente server proxy progettato per aiutare le applicazioni ad aggirare automaticamente Cloudflare e altre protezioni anti-bot. Simula un ambiente browser reale, consentendo a script e strumenti di automazione di accedere a siti protetti senza essere bloccati.

    Risolvendo challenge JavaScript e controlli di sicurezza in background, FlareSolverr consente un accesso affidabile a siti che normalmente limitano le richieste automatiche. È particolarmente utile per strumenti di web scraping, API e applicazioni che necessitano di accesso dati costante.

    Pensato per flessibilità e prestazioni, FlareSolverr si integra facilmente con vari software e supporta più piattaforme. Il suo sistema automatico di risoluzione delle challenge garantisce una comunicazione fluida, sicura e ininterrotta con i siti protetti.

    Con FlareSolverr puoi:
    - Personalizzare le impostazioni proxy: Affinare parametri come frequenza di rotazione, posizione geografica e tipi di proxy per ottimizzare scraping e anonimato.
    - Regolazioni in tempo reale: Applicare subito modifiche alle configurazioni proxy per adattarsi a esigenze di scraping in evoluzione o difese del sito.
    - Sicurezza potenziata: Usare funzioni avanzate per ridurre il rischio di rilevamento e mantenere le attività di scraping sotto il radar.
    - Integrazione senza attriti: Integrare facilmente la gestione proxy con i flussi e gli strumenti di scraping esistenti per un’estrazione dati continua.
    - Controllo completo: Monitorare e regolare l’uso dei proxy in tempo reale, con pieno controllo su come i dati vengono accessi e raccolti.
  upgradeDescription: |
    Aggiornare FlareSolverr a v3.5.0 (`flaresolverr/flaresolverr:v3.5.0`).

    Modifiche: captcha Turnstile, log formattati, dipendenze, fix uid/gid tar.gz, revert di base image / Python.

    Note: https://github.com/FlareSolverr/FlareSolverr/releases/tag/v3.5.0

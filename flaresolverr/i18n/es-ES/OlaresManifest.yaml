metadata:
  title: FlareSolverr
  description: Servidor proxy para eludir la protección de Cloudflare y DDoS-GUARD
spec:
  fullDescription: |
    FlareSolverr es un potente servidor proxy diseñado para ayudar a las aplicaciones a eludir automáticamente Cloudflare y otras protecciones anti-bot. Simula un entorno de navegador real, permitiendo que scripts y herramientas de automatización accedan a sitios protegidos sin ser bloqueados.

    Al resolver desafíos JavaScript y comprobaciones de seguridad en segundo plano, FlareSolverr permite un acceso fiable a sitios que normalmente restringen las peticiones automatizadas. Es especialmente útil para herramientas de web scraping, APIs y aplicaciones que necesitan acceso consistente a los datos.

    Pensado para flexibilidad y rendimiento, FlareSolverr se integra fácilmente con diversos softwares y admite múltiples plataformas. Su sistema automatizado de resolución de desafíos garantiza una comunicación fluida, segura e ininterrumpida con sitios protegidos.

    Con FlareSolverr puedes:
    - Personalizar ajustes de proxy: Ajusta parámetros como frecuencia de rotación, ubicación geográfica y tipos de proxy para optimizar el scraping y el anonimato.
    - Ajustes en tiempo real: Haz cambios instantáneos en tus configuraciones de proxy para adaptarte a necesidades de scraping cambiantes o defensas del sitio.
    - Seguridad mejorada: Usa funciones avanzadas para minimizar el riesgo de detección y mantener tus actividades de scraping bajo el radar.
    - Integración fluida: Integra fácilmente la gestión de proxies con tus flujos y herramientas de scraping existentes para una extracción de datos sin interrupciones.
    - Control completo: Supervisa y ajusta el uso de proxies en tiempo real, con control total sobre cómo se accede y recopilan los datos.
  upgradeDescription: |
    Actualizar FlareSolverr a v3.5.0 (`flaresolverr/flaresolverr:v3.5.0`).

    Cambios: captcha Turnstile, logs formateados, dependencias, corrección uid/gid del tar.gz y revert de imagen base / Python.

    Notas: https://github.com/FlareSolverr/FlareSolverr/releases/tag/v3.5.0

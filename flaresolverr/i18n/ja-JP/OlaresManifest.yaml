metadata:
  title: FlareSolverr
  description: Cloudflare および DDoS-GUARD 保護を回避するプロキシサーバー
spec:
  fullDescription: |
    FlareSolverr は、アプリケーションが Cloudflare やその他のアンチボット保護を自動で回避できるよう設計された強力なプロキシサーバーです。実際のブラウザ環境をシミュレートし、スクリプトや自動化ツールがブロックされずに保護されたサイトへアクセスできるようにします。

    JavaScript チャレンジやセキュリティチェックをバックグラウンドで解決することで、通常は自動化リクエストを制限するサイトへの信頼性の高いアクセスを可能にします。Web スクレイピングツール、API、一貫したデータアクセスが必要なアプリケーションに特に有用です。

    柔軟性と性能を重視して構築され、さまざまなソフトウェアと容易に統合でき、複数プラットフォームをサポートします。自動チャレンジ解決により、保護されたサイトとのスムーズで安全、途切れない通信を確保します。

    FlareSolverr でできること:
    - プロキシ設定のカスタマイズ: ローテーション頻度、地理的位置、プロキシ種別などのパラメータを微調整し、スクレイピング性能と匿名性を最適化。
    - リアルタイム調整: 変化するスクレイピング要件やサイト防衛に合わせ、プロキシ設定を即座に変更。
    - 強化されたセキュリティ: 検知リスクを最小化し、スクレイピング活動を目立たなくする高度な機能を利用。
    - シームレスな統合: 既存のワークフローやスクレイピングツールとプロキシ管理を容易に統合し、途切れないデータ抽出を実現。
    - 包括的な制御: プロキシ使用をリアルタイムで監視・調整し、データの取得・収集方法を完全にコントロール。
  upgradeDescription: |
    FlareSolverr を v3.5.0（`flaresolverr/flaresolverr:v3.5.0`）へ。

    変更: Turnstile キャプチャ対応、ログ整形、依存関係更新、tar.gz の uid/gid 修正、base image / Python の差し戻し。

    詳細: https://github.com/FlareSolverr/FlareSolverr/releases/tag/v3.5.0

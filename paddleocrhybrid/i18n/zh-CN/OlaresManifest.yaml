metadata:
  title: PaddleOCR Hybrid
  description: "文字识别与文档解析工具包"

spec:
  fullDescription: |
    PaddleOCR 是用于文字提取和文档版面理解的 OCR 与文档解析工具包。它将文档和图像转换为可供应用搜索、分析和进一步处理的内容。

    PaddleOCR Hybrid 将 PP-DocLayoutV3 版面检测与 PaddleOCR-VL-1.5 文档识别结合使用。它先识别文档图像和 PDF 页面中的区域，再识别各区域的文字、表格和公式等内容，并支持多种语言。

    此 Hybrid 版本在 CPU 上运行版面检测，在受支持的 NVIDIA GPU 上运行文档识别，并为兼容的 Olares 应用提供这些能力。

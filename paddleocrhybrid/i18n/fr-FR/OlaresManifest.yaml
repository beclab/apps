metadata:
  title: PaddleOCR Hybrid
  description: "Une boîte à outils de reconnaissance de texte et d’analyse de documents"

spec:
  fullDescription: |
    PaddleOCR est une boîte à outils d'OCR et d'analyse de documents permettant d'extraire du texte et de comprendre la mise en page. Il transforme les documents et les images en contenu que les applications peuvent utiliser pour la recherche, l'analyse et d'autres traitements.

    PaddleOCR Hybrid associe la détection de mise en page de PP-DocLayoutV3 à la reconnaissance de documents de PaddleOCR-VL-1.5. Il repère les régions dans les images de documents et les pages PDF, puis reconnaît leur contenu, notamment le texte, les tableaux et les formules, avec une prise en charge multilingue.

    Cette version Hybrid exécute la détection de mise en page sur le CPU et la reconnaissance de documents sur un GPU NVIDIA pris en charge. Elle met ces fonctions à la disposition des applications Olares compatibles.

metadata:
  title: PaddleOCR Hybrid
  description: "Ein Toolkit für Texterkennung und Dokumentanalyse"

spec:
  fullDescription: |
    PaddleOCR ist ein Toolkit für OCR und Dokumentanalyse, das Text extrahiert und Dokumentlayouts analysiert. Es wandelt Dokumente und Bilder in Inhalte um, die Anwendungen für Suche, Analyse und weitere Verarbeitung nutzen können.

    PaddleOCR Hybrid kombiniert die Layouterkennung von PP-DocLayoutV3 mit der Dokumenterkennung von PaddleOCR-VL-1.5. Es erkennt Bereiche in Dokumentbildern und PDF-Seiten und liest anschließend deren Inhalte, darunter Text, Tabellen und Formeln. Dabei werden mehrere Sprachen unterstützt.

    Diese Hybrid-Version führt die Layouterkennung auf der CPU und die Dokumenterkennung auf einer unterstützten NVIDIA-GPU aus. Sie stellt diese Funktionen kompatiblen Olares-Anwendungen bereit.

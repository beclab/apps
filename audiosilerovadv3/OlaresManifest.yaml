olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiosilerovadv3
  icon: https://app.cdn.olares.com/appstore/audioengines/silerovad/icon.png
  description: A model for finding where speech starts and stops in audio
  appid: audiosilerovadv3
  title: Silero VAD V5
  version: '1.0.15'
  categories:
    - AI
    - models
  tags:
  - audio
  
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audiosilerovadv3api
    host: sharedentrances-api
    port: 0
    title: Silero VAD V5 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/audioengines/silerovad/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audiosilerovadv3
    port: 8090
    host: download-svc
    title: Silero VAD V5
    icon: https://app.cdn.olares.com/appstore/audioengines/silerovad/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiosilerovadv3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'onnx-community/silero-vad'
  fullDescription: |
    Silero VAD V5 finds the parts of an audio recording that contain human speech. It marks when speech starts and stops so applications can skip silence or divide a recording into speech segments.

    **Key features**
    - Distinguish speech from silence and non-speech audio.
    - Return the time ranges that contain speech.
    - Adjust detection thresholds and segment timing for each request.
    - Support transcription and diarization preprocessing.

    The model runs on the CPU and does not require a GPU.


  developer: Silero
  website: https://silero.ai/vad-lang-classifier-number-detector/
  sourceCode: https://github.com/snakers4/silero-vad
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  doc: https://github.com/snakers4/silero-vad/wiki
  license:
    - text: MIT
      url: https://github.com/snakers4/silero-vad/blob/master/LICENSE

  # Sum rule: envelope >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
  limitedCpu: "3"
  requiredCpu: "400m"
  requiredDisk: 50Mi
  limitedDisk: 20Gi
  limitedMemory: "6Gi"
  requiredMemory: "768Mi"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://onnx-community/silero-vad"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "onnx-community/silero-vad"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "vad"
    multiSelect: true
    splitter: ","
    options:
    - title: VAD (voice activity detection)
      value: vad
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "0"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "200m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "512Mi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    description: "This VAD base does not read ENGINE_ARGS; tune threshold, min_silence_ms, speech_pad_ms, min_speech_ms, and max_speech_s per request."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN

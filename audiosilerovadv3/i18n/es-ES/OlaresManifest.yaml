metadata:
  description: Un modelo para localizar dónde empieza y termina el habla en el audio
  title: Silero VAD V5

spec:
  fullDescription: |
    Silero VAD V5 localiza las partes de una grabación que contienen voz humana. Marca el inicio y el final del habla para que las aplicaciones puedan omitir silencios o dividir una grabación en segmentos de voz.

    **Funciones principales**
    - Distinguir el habla del silencio y de otros sonidos.
    - Devolver los intervalos de tiempo que contienen voz.
    - Ajustar los umbrales de detección y los tiempos de los segmentos en cada solicitud.
    - Facilitar el preprocesamiento para transcripción y diarización.

    El modelo se ejecuta en la CPU y no requiere GPU.

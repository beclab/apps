metadata:
  description: Ein Modell zum Erkennen von Anfang und Ende gesprochener Abschnitte
  title: Silero VAD V5

spec:
  fullDescription: |
    Silero VAD V5 erkennt die Abschnitte einer Audioaufnahme, die menschliche Sprache enthalten. Es markiert Anfang und Ende, damit Anwendungen Stille überspringen oder eine Aufnahme in Sprachsegmente teilen können.

    **Hauptfunktionen**
    - Sprache von Stille und anderen Geräuschen unterscheiden.
    - Zeitbereiche mit Sprache zurückgeben.
    - Erkennungsschwellen und Segmentzeiten pro Anfrage anpassen.
    - Die Vorverarbeitung für Transkription und Diarisierung unterstützen.

    Das Modell läuft auf der CPU und benötigt keine GPU.

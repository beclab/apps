metadata:
  title: Teable
  description: "L'alternativa Next Gen ad Airtable: PostgreSQL no-code"
spec:
  upgradeDescription: |
    Corregge gli errori di permesso della cache delle immagini con una cache temporanea Next.js scrivibile da UID/GID 1000.

    Aggiorna Teable a `teableio/teable:release.2026-09-07T09-32-29Z.2963` (immagine ufficiale, amd64 e arm64).

    Chart:
    - Passaggio dal mirror `beclab/teableio-teable` all’immagine ufficiale Docker Hub.
    - Il Job di migrate usa la stessa immagine app con `migrate-only` (l’app migra anche all’avvio).
    - I probe usano `/health`. Gli allegati restano su `appData` in `/app/.assets`.

    Note: https://github.com/teableio/teable/releases/tag/release.2026-09-07T09-32-29Z.2963
  fullDescription: |
    Teable usa un'interfaccia semplice simile a un foglio di calcolo per creare potenti applicazioni database. Collabora con il tuo team in tempo reale e scala a milioni di righe.

    **Interazioni simili a un foglio di calcolo**
    - Un'interfaccia elegante simile a un foglio di calcolo, facile da usare senza competenze di coding, che consente a chiunque nel team di costruire i sistemi di cui ha bisogno, risparmiando tempo e costi significativi.

    **Milioni di dati, reazione in secondi.**
    - Gli utenti creano tabelle e strutture direttamente sul database fisico, senza perdita di prestazioni né limiti di righe.

    **Solida sicurezza dei dati**
    - Consente dati self-hosted con il proprio database, combinando la comodità del cloud con il pieno controllo dei dati.

    **Eccezionale estensibilità**
    - Costruito su PostgreSQL, offre un'integrazione seamless con l'ecosistema con una sola connessione, rendendo l'interfacciamento semplice. Si espande facilmente con strumenti BI, low-code ed ETL.

    **Scenari illimitati**
    - Sfrutta campi potenti e flessibili per progettare il CRM ideale per qualsiasi scenario
    - Utilizza dashboard avanzate e modifica massiva dei dati per la manutenzione completa delle operazioni sugli eventi e l'analisi delle metriche
    - Accedi a qualsiasi terza parte come fonte dati CMS senza preoccupazioni di capacità, potenziata da strumenti di gestione visuale.

    **Toolchain database integrata**
    - Una connessione database abilita l'integrazione in un clic di analisi dati, low-code, BI ed ETL.

    **Mobile friendly**
    - Navigazione web fluida e senza interruzioni sui dispositivi mobili

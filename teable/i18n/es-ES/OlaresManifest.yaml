metadata:
  title: Teable
  description: "La alternativa Next Gen a Airtable: PostgreSQL sin código"
spec:
  upgradeDescription: |
    Actualiza Teable a release.2026-09-11T07-36-49Z.3059. Corrige los permisos de los directorios de archivos locales para poder reemplazar los recursos de plugins durante la actualización.
  fullDescription: |
    Teable usa una interfaz sencilla tipo hoja de cálculo para crear potentes aplicaciones de base de datos. Colabora con tu equipo en tiempo real y escala a millones de filas.

    **Interacciones tipo hoja de cálculo**
    - Una interfaz elegante tipo hoja de cálculo, fácil de usar sin conocimientos de programación, que permite a cualquiera del equipo construir los sistemas que necesita, ahorrando tiempo y costes significativos.

    **Millones de datos, reacción en segundos.**
    - Los usuarios crean tablas y estructuras directamente sobre la base de datos física, sin pérdida de rendimiento ni límites de filas.

    **Sólida seguridad de datos**
    - Permite datos autoalojados con tu propia base de datos, combinando la comodidad de la nube con control total de los datos.

    **Excepcional extensibilidad**
    - Construido sobre PostgreSQL, ofrece integración perfecta con el ecosistema con una sola conexión, haciendo la interfaz sencilla. Se amplía fácilmente con herramientas BI, low-code y ETL.

    **Escenarios ilimitados**
    - Aprovecha campos potentes y flexibles para diseñar el CRM ideal para cualquier escenario
    - Utiliza paneles avanzados y edición masiva de datos para el mantenimiento integral de operaciones de eventos y el análisis de métricas
    - Accede a cualquier tercero como fuente de datos CMS sin preocuparte por la capacidad, mejorado con herramientas de gestión visual.

    **Cadena de herramientas de base de datos integrada**
    - Una conexión de base de datos habilita la integración en un clic de análisis de datos, low-code, BI y ETL.

    **Compatible con móviles**
    - Navegación web fluida y sin fisuras en dispositivos móviles

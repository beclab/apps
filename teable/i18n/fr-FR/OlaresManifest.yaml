metadata:
  title: Teable
  description: "L'alternative Next Gen à Airtable : PostgreSQL no-code"
spec:
  upgradeDescription: |
    Met à jour Teable vers release.2026-09-11T07-36-49Z.3059. Corrige les permissions des répertoires de fichiers locaux afin de remplacer les ressources des plugins lors de la mise à jour.
  fullDescription: |
    Teable utilise une interface simple de type tableur pour créer de puissantes applications de base de données. Collaborez avec votre équipe en temps réel et montez à l'échelle jusqu'à des millions de lignes.

    **Interactions de type tableur**
    - Une interface élégante de type tableur, facile à utiliser sans compétences en programmation, permettant à chacun dans une équipe de construire les systèmes dont il a besoin, en gagnant un temps et des coûts considérables.

    **Des millions de données, une réaction en secondes.**
    - Les utilisateurs créent tables et structures directement sur la base de données physique, sans perte de performance ni limites de lignes.

    **Sécurité des données solide**
    - Permet des données auto-hébergées avec votre propre base de données, combinant la commodité du cloud avec un contrôle total des données.

    **Extensibilité exceptionnelle**
    - Construit sur PostgreSQL, il offre une intégration transparente à l'écosystème avec une seule connexion, rendant l'interfaçage simple. S'étend facilement avec des outils BI, low-code et ETL.

    **Scénarios illimités**
    - Tirez parti de champs puissants et flexibles pour concevoir le CRM idéal pour tout scénario
    - Utilisez des tableaux de bord avancés et l'édition massive de données pour la maintenance complète des opérations d'événements et l'analyse des métriques
    - Accédez à tout tiers comme source de données CMS sans souci de capacité, enrichi par des outils de gestion visuelle.

    **Chaîne d'outils base de données intégrée**
    - Une connexion base de données active l'intégration en un clic d'analyse de données, low-code, BI et ETL.

    **Compatible mobile**
    - Navigation web fluide et sans couture sur les appareils mobiles

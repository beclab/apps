metadata:
  title: Teable
  description: "Die Next-Gen-Airtable-Alternative: No-Code PostgreSQL"
spec:
  upgradeDescription: |
    Behebt Berechtigungsfehler im Bild-Cache durch einen temporären, für UID/GID 1000 beschreibbaren Next.js-Cache.

    Teable auf `teableio/teable:release.2026-09-07T09-32-29Z.2963` aktualisieren (offizielles Image, amd64 und arm64).

    Chart:
    - Wechsel vom Spiegel `beclab/teableio-teable` zum offiziellen Docker-Hub-Image.
    - Der Migrate-Job nutzt dasselbe App-Image mit `migrate-only` (die App migriert auch beim Start).
    - Probes verwenden `/health`. Anhänge bleiben unter `appData` auf `/app/.assets`.

    Release Notes: https://github.com/teableio/teable/releases/tag/release.2026-09-07T09-32-29Z.2963
  fullDescription: |
    Teable nutzt eine einfache, tabellenkalkulationsähnliche Oberfläche, um leistungsstarke Datenbankanwendungen zu erstellen. Arbeiten Sie in Echtzeit mit Ihrem Team zusammen und skalieren Sie auf Millionen von Zeilen.

    **Tabellenkalkulationsähnliche Interaktionen**
    - Eine elegante, tabellenkalkulationsähnliche Oberfläche, die ohne Programmierkenntnisse leicht zu bedienen ist und jedem im Team ermöglicht, die benötigten Systeme zu bauen — und so erheblich Zeit und Kosten spart.

    **Millionen an Daten, Reaktion in Sekunden.**
    - Nutzer erstellen Tabellen und Strukturen direkt auf der physischen Datenbank — ohne Leistungsverlust oder Zeilenlimits.

    **Solide Datensicherheit**
    - Ermöglicht selbst gehostete Daten mit Ihrer eigenen Datenbank und kombiniert Cloud-Komfort mit voller Datenkontrolle.

    **Außergewöhnliche Erweiterbarkeit**
    - Auf PostgreSQL aufgebaut, bietet es nahtlose Ökosystem-Integration mit einer einzigen Verbindung und macht die Anbindung einfach. Leicht erweiterbar mit BI-, Low-Code- und ETL-Tools.

    **Unbegrenzte Szenarien**
    - Nutzen Sie leistungsstarke, flexible Felder, um das ideale CRM für jedes Szenario zu entwerfen
    - Nutzen Sie erweiterte Dashboards und Massendatenbearbeitung für umfassende Event-Betriebswartung und Kennzahlenanalyse
    - Greifen Sie auf beliebige Drittanbieter als CMS-Datenquelle zu — ohne Kapazitätsbedenken, verstärkt durch visuelle Verwaltungstools.

    **Integrierte Datenbank-Toolchain**
    - Eine Datenbankverbindung ermöglicht die Ein-Klick-Integration von Datenanalyse-, Low-Code-, BI- und ETL-Tools.

    **Mobilfreundlich**
    - Reibungsloses und nahtloses Web-Browsing auf Mobilgeräten

metadata:
  title: Teable
  description: "次世代 Airtable 代替：ノーコード PostgreSQL"
spec:
  upgradeDescription: |
    Teable を release.2026-09-11T07-36-49Z.3059 に更新します。ローカルのアップロードディレクトリの権限を修正し、更新時に既存のプラグインファイルを置き換えられるようにします。
  fullDescription: |
    Teable はシンプルなスプレッドシート風インターフェースで強力なデータベースアプリケーションを作成します。チームとリアルタイムで共同作業し、数百万行までスケールできます。

    **スプレッドシート風の操作**
    - コーディング不要で使いやすい洗練されたスプレッドシート風 UI。チームの誰でも必要なシステムを構築でき、時間とコストを大幅に削減。

    **数百万のデータ、秒単位で反応。**
    - ユーザーは物理データベース上に直接テーブルと構造を作成し、性能低下や行数制限なし。

    **堅牢なデータセキュリティ**
    - 自前データベースでのセルフホストデータを可能にし、クラウドの利便性と完全なデータ制御を両立。

    **優れた拡張性**
    - PostgreSQL 上に構築され、単一接続でエコシステムとシームレスに統合。BI・ローコード・ETL ツールで容易に拡張。

    **無限のシナリオ**
    - 強力で柔軟なフィールドで、あらゆるシナリオに最適な CRM を設計
    - 高度なダッシュボードと一括データ編集でイベント運用保守と指標分析を包括的に実施
    - 容量を気にせず任意のサードパーティを CMS データソースとして利用し、視覚管理ツールで強化。

    **統合データベースツールチェーン**
    - 1 つのデータベース接続でデータ分析・ローコード・BI・ETL ツールをワンクリック統合。

    **モバイルフレンドリー**
    - モバイル端末でもスムーズでシームレスな Web 閲覧

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: teable
spec:
  replicas: {{ .Values.workloads.teable.replicaCount }}
  selector:
    matchLabels:
      app: teable
  strategy:
    type: Recreate  
  template:
    metadata:
      labels:
        app: teable
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: init-permissions
          image: docker.io/beclab/busybox:1.37
          command:
            - sh
            - -c
            - |
              chown 1000:1000 /app/.assets
              mkdir -p /app/.temporary
              chown 1000:1000 /app/.temporary
              touch /swagger/openapi.json
              chown 1000:1000 /swagger/openapi.json
              chown 1000:1000 /next-cache
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /app/.assets
              name: teable-data
              subPath: teable
            - mountPath: /app/.temporary
              name: teable-tmp
            - mountPath: /swagger
              name: swagger-write
            - mountPath: /next-cache
              name: next-cache
          imagePullPolicy: IfNotPresent
        - name: check-ready
          image: "docker.io/beclab/wait-for:0.1.0"
          args:
            - '-it'
            - >-
              teable-redis:6379
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      containers:
        - name: teable
          image: "docker.io/teableio/teable:release.2026-09-07T09-32-29Z.2963"
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Etc/UTC
            - name: COREPACK_ENABLE_DOWNLOAD_PROMPT
              value: "0"
            - name: COREPACK_NPM_REGISTRY
              value: "https://registry.npmmirror.com"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: teable
                  key: app-password
            - name: PRISMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teable
                  key: PRISMA_DATABASE_URL
            - name: BACKEND_CACHE_REDIS_URI
              value: "redis://teable-redis:6379/0"
          envFrom:
            - configMapRef:
                name: teable-config
          resources:
            requests:
              cpu: 300m
              memory: 500Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - mountPath: /app/.assets
              name: teable-data
              subPath: teable
            - mountPath: /app/.temporary
              name: teable-tmp
            - mountPath: /app/enterprise/backend-ee/dist/openapi.json
              name: swagger-write
              subPath: openapi.json
            - mountPath: /app/enterprise/app-ee/.next/cache
              name: next-cache
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: swagger-write
          emptyDir: {}
        - name: teable-tmp
          emptyDir: {}
        - name: teable-data
          hostPath:
            type: DirectoryOrCreate
            {{- if .Values.sysVersion }}
              {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appData }}'
              {{- else }}
            path: '{{ .Values.userspace.appData }}/teable'
              {{- end }}
            {{- else }}
            path: '{{ .Values.userspace.appData }}/teable'
            {{- end }}
{{- if gt (int .Values.workloads.teable.replicaCount) 0 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teable-db-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: teable
    component: db-migrate
spec:
  ttlSecondsAfterFinished: 100
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: teable
        component: db-migrate
        gateway.olares.io/shared-caller-outbound: "false"
      annotations:
        linkerd.io/inject: disabled
    spec:
      containers:
        - name: teable-db-migrate
          image: "docker.io/teableio/teable:release.2026-09-07T09-32-29Z.2963"
          args:
            - migrate-only
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: TZ
              value: Etc/UTC
            - name: COREPACK_ENABLE_DOWNLOAD_PROMPT
              value: "0"
            - name: COREPACK_NPM_REGISTRY
              value: "https://registry.npmmirror.com"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: teable
                  key: app-password
            - name: PRISMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teable
                  key: PRISMA_DATABASE_URL
          resources:
            requests:
              cpu: 300m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi
      restartPolicy: Never
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: teable
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: teable
spec:
  ports:
    - name: "http"
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: teable

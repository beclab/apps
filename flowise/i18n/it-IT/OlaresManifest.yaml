metadata:
  title: Flowise
  description: "Interfaccia drag & drop per creare il tuo flusso LLM personalizzato"
spec:
  fullDescription: |
    Flowise è uno strumento low-code open source per gli sviluppatori che vogliono creare flussi di orchestrazione LLM personalizzati e agenti IA
    
    **Funzionalità**
    Itera, velocemente
    - Sviluppare app LLM richiede innumerevoli iterazioni. Con l'approccio low-code abilitiamo iterazioni rapide dal test alla produzione
    
    Orchestrazione LLM
    - Collega gli LLM con memoria, data loader, cache, moderazione e molto altro. (Langchain, LlamaIndex, oltre 100 integrazioni)
    
    Agenti e assistenti
    - Crea agenti autonomi che usano strumenti per eseguire diverse attività. (Custom Tools, OpenAI Assistant, Function Agent)
    
    API, SDK, Embed
    - Estendi e integra nelle tue applicazioni usando API, SDK e Embedded Chat
    
    LLM open source
    - Esegui in ambienti air-gapped con LLM locali, embedding e database vettoriali

  upgradeDescription: |
    Release upstream: [Flowise 3.1.4](https://github.com/FlowiseAI/Flowise/releases/tag/flowise%403.1.4)

    **Novità**

    - I controlli di tenant, workspace, sessione, SSO e ruolo sono più rigorosi.
    - I comandi MCP stdio personalizzati sono limitati da una allowlist controllata dall’operatore.
    - I record utente dell’organizzazione vengono sanitizzati prima dell’uso.

    **Correzioni**

    - Gli scraper Web e alcuni modelli di chat rispettano le deny list.
    - Le esportazioni dei flow non espongono più i valori delle variabili.
    - I log delle richieste non registrano più password di accesso o token SSO.

    L’immagine ufficiale `flowiseai/flowise:3.1.4` può ancora segnalare `3.1.2` da `/api/v1/version`. Si tratta di un problema di packaging dell’immagine upstream, non di una discrepanza del chart Olares.

metadata:
  title: Flowise
  description: Interfaz de arrastrar y soltar para crear tu flujo LLM personalizado
spec:
  fullDescription: |
    Flowise es una herramienta low-code de código abierto para que los desarrolladores construyan flujos de orquestación LLM personalizados y agentes de IA
    
    **Funciones**
    Itera, rápido
    - Desarrollar apps LLM requiere innumerables iteraciones. Con el enfoque low-code, habilitamos iteraciones rápidas desde las pruebas hasta la producción
    
    Orquestación LLM
    - Conecta LLMs con memoria, cargadores de datos, caché, moderación y mucho más. (Langchain, LlamaIndex, más de 100 integraciones)
    
    Agentes y asistentes
    - Crea agentes autónomos que usan herramientas para ejecutar distintas tareas. (Custom Tools, OpenAI Assistant, Function Agent)
    
    API, SDK, Embed
    - Extiende e integra en tus aplicaciones usando APIs, SDK y Embedded Chat
    
    LLMs de código abierto
    - Ejecuta en entornos air-gapped con LLMs locales, embeddings y bases de datos vectoriales

  upgradeDescription: |
    Versión upstream: [Flowise 3.1.4](https://github.com/FlowiseAI/Flowise/releases/tag/flowise%403.1.4)

    **Novedades**

    - Las comprobaciones de inquilino, espacio de trabajo, sesión, SSO y rol son más estrictas.
    - Los comandos MCP stdio personalizados están limitados por una lista de permitidos controlada por el operador.
    - Los registros de usuarios de la organización se depuran antes de usarse.

    **Correcciones**

    - Los raspadores web y algunos modelos de chat respetan las listas de denegación.
    - Las exportaciones de flujos ya no filtran valores de variables.
    - Los registros de solicitudes ya no guardan contraseñas de inicio de sesión ni tokens SSO.

    La imagen oficial `flowiseai/flowise:3.1.4` aún puede informar `3.1.2` desde `/api/v1/version`. Es un problema de empaquetado de la imagen upstream, no un desajuste del chart de Olares.

metadata:
  title: Flowise
  description: Interface glisser-déposer pour créer votre flux LLM personnalisé
spec:
  fullDescription: |
    Flowise est un outil low-code open source permettant aux développeurs de créer des flux d'orchestration LLM personnalisés et des agents IA
    
    **Fonctionnalités**
    Itérez, rapidement
    - Développer des apps LLM demande d'innombrables itérations. Avec l'approche low-code, nous permettons des itérations rapides du test à la production
    
    Orchestration LLM
    - Connectez les LLM à la mémoire, aux chargeurs de données, au cache, à la modération et bien plus. (Langchain, LlamaIndex, plus de 100 intégrations)
    
    Agents et assistants
    - Créez des agents autonomes qui utilisent des outils pour exécuter différentes tâches. (Custom Tools, OpenAI Assistant, Function Agent)
    
    API, SDK, Embed
    - Étendez et intégrez à vos applications via APIs, SDK et Embedded Chat
    
    LLM open source
    - Exécutez dans un environnement air-gapped avec des LLM locaux, des embeddings et des bases de données vectorielles

  upgradeDescription: |
    Version en amont : [Flowise 3.1.4](https://github.com/FlowiseAI/Flowise/releases/tag/flowise%403.1.4)

    **Nouveautés**

    - Les contrôles de locataire, d’espace de travail, de session, de SSO et de rôle sont plus stricts.
    - Les commandes MCP stdio personnalisées sont limitées par une liste d’autorisation contrôlée par l’opérateur.
    - Les enregistrements d’utilisateurs d’organisation sont assainis avant utilisation.

    **Corrections**

    - Les extracteurs Web et certains modèles de chat respectent les listes de refus.
    - Les exports de flux ne divulguent plus les valeurs des variables.
    - Les journaux de requêtes n’enregistrent plus les mots de passe de connexion ni les jetons SSO.

    L’image officielle `flowiseai/flowise:3.1.4` peut encore renvoyer `3.1.2` depuis `/api/v1/version`. Il s’agit d’un problème d’empaquetage de l’image en amont, pas d’un écart de chart Olares.

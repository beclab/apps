metadata:
  title: Flowise
  description: カスタム LLM フローを構築するドラッグ＆ドロップ UI
spec:
  fullDescription: |
    Flowise は、開発者がカスタマイズした LLM オーケストレーションフローと AI エージェントを構築するためのオープンソース・ローコードツールです
    
    **機能**
    すばやく反復
    - LLM アプリの開発には数え切れない反復が必要です。ローコードアプローチにより、テストから本番まで迅速な反復を可能にします
    
    LLM オーケストレーション
    - メモリ、データローダー、キャッシュ、モデレーションなどと LLM を接続。（Langchain、LlamaIndex、100 以上の統合）
    
    エージェント＆アシスタント
    - ツールを使ってさまざまなタスクを実行する自律エージェントを作成。（Custom Tools、OpenAI Assistant、Function Agent）
    
    API、SDK、Embed
    - API、SDK、Embedded Chat を使ってアプリケーションを拡張・統合
    
    オープンソース LLM
    - ローカル LLM、埋め込み、ベクトルデータベースでエアギャップ環境で実行

  upgradeDescription: |
    上流リリース：[Flowise 3.1.4](https://github.com/FlowiseAI/Flowise/releases/tag/flowise%403.1.4)

    **変更点**

    - テナント、ワークスペース、セッション、SSO、ロールの検査がより厳格です。
    - カスタム MCP stdio コマンドは、運用者が管理する許可リストで制限されます。
    - 組織ユーザー記録は使用前にサニタイズされます。

    **修正**

    - Web スクレイパーと一部のチャットモデルは拒否リストに従います。
    - フローのエクスポートが変数値を漏らさなくなりました。
    - リクエストログはログインパスワードや SSO トークンを記録しなくなりました。

    公式イメージ `flowiseai/flowise:3.1.4` の `/api/v1/version` は、まだ `3.1.2` を返すことがあります。これは上流イメージのパッケージ問題であり、Olares chart の不一致ではありません。

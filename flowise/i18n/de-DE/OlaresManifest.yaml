metadata:
  title: Flowise
  description: "Drag-&-Drop-Oberfläche zum Erstellen Ihres angepassten LLM-Flows"
spec:
  fullDescription: |
    Flowise ist ein quelloffenes Low-Code-Tool für Entwickler, um angepasste LLM-Orchestrierungsflows und KI-Agenten zu erstellen
    
    **Funktionen**
    Schnell iterieren
    - Die Entwicklung von LLM-Apps erfordert unzählige Iterationen. Mit dem Low-Code-Ansatz ermöglichen wir schnelle Iterationen vom Testen bis zur Produktion
    
    LLM-Orchestrierung
    - Verbinden Sie LLMs mit Speicher, Datenladern, Cache, Moderation und vielem mehr. (Langchain, LlamaIndex, 100+ Integrationen)
    
    Agenten & Assistenten
    - Erstellen Sie autonome Agenten, die Tools nutzen, um verschiedene Aufgaben auszuführen. (Custom Tools, OpenAI Assistant, Function Agent)
    
    API, SDK, Embed
    - Erweitern und integrieren Sie in Ihre Anwendungen über APIs, SDK und Embedded Chat
    
    Open-Source-LLMs
    - In air-gapped Umgebungen mit lokalen LLMs, Embeddings und Vektordatenbanken betreiben

  upgradeDescription: |
    Upstream-Release: [Flowise 3.1.4](https://github.com/FlowiseAI/Flowise/releases/tag/flowise%403.1.4)

    **Änderungen**

    - Prüfungen für Mandant, Workspace, Sitzung, SSO und Rolle sind strenger.
    - Benutzerdefinierte MCP-stdio-Befehle sind durch eine vom Betreiber gesteuerte Zulassungsliste begrenzt.
    - Organisationsbenutzerdatensätze werden vor der Verwendung bereinigt.

    **Fehlerbehebungen**

    - Web-Scraper und ausgewählte Chat-Modelle beachten Ablehnungslisten.
    - Flow-Exporte geben keine Variablenwerte mehr preis.
    - Anfrageprotokolle zeichnen keine Anmeldepasswörter oder SSO-Token mehr auf.

    Das offizielle Image `flowiseai/flowise:3.1.4` kann von `/api/v1/version` weiterhin `3.1.2` melden. Das ist ein Upstream-Image-Packaging-Problem, kein Olares-Chart-Abweichung.

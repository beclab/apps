metadata:
  title: NemoClaw
  description: NVIDIA NemoClaw - Agente di coding AI con isolamento sandbox
spec:
  fullDescription: |
    **Panoramica**
    NVIDIA NemoClaw è uno stack di riferimento open source che semplifica l'esecuzione più sicura di assistenti [OpenClaw](https://openclaw.ai) sempre attivi.
    Installa il runtime [NVIDIA OpenShell](https://github.com/NVIDIA/OpenShell), parte di NVIDIA Agent Toolkit, che offre sicurezza aggiuntiva per agenti autonomi.

    > **Software alpha**
    >
    > NemoClaw è disponibile in early preview dal 16 marzo 2026. Questo software non è pronto per la produzione. Interfacce, API e comportamento possono cambiare senza preavviso. Il progetto è condiviso per raccogliere feedback e consentire sperimentazione precoce. Issue e discussioni della community sono benvenuti.

    Documentazione ufficiale: [NemoClaw](https://docs.nvidia.com/nemoclaw/latest/index.html), [Dashboard remota / CHAT_UI_URL](https://docs.nvidia.com/nemoclaw/latest/deployment/deploy-to-remote-gpu.html#remote-dashboard-access).

    **Olares**
    - **CLI** — Terminale; `nemoclaw my-assistant connect` poi `openclaw tui`. OpenShell: `openshell status` / `openshell doctor`.
    - **UI web** — Impostare **CHAT_UI_URL** o **domain.webtui** di Olares; il chart patcha **allowedOrigins**. Token gateway: `nemoclaw my-assistant gateway-token --quiet`.
    - **Env** — Obbligatorie: **NEMOCLAW_PROVIDER**, **NEMOCLAW_ENDPOINT_URL** (/v1), **NEMOCLAW_MODEL**. Opzionali: **NEMOCLAW_OPENCLAW_VERSION** (OpenClaw fissato di default), livello/modalità policy, netns del gateway. Descrizioni complete nel manifesto in inglese.

  upgradeDescription: |
    Il chart Olares **1.0.30** ottimizza il processo di installazione.
    - Le attività di avvio installano OpenClaw in sequenza prima di avviare il gateway. La preparazione del runtime viene ripetuta prima del controllo del gateway.
    - Gli accessi vengono abilitati dopo la verifica del servizio dei modelli e una risposta riuscita del gateway. I controlli leggono le risposte complete per evitare chiusure premature della connessione.
    - Migliora la preparazione dei componenti, il riutilizzo delle immagini nella cache e la connessione al servizio dei modelli.
    - Gli accessi all’app diventano disponibili solo dopo la verifica della WebUI, di JavaScript, dei fogli di stile e dello stato del gateway. I controlli in tempo reale sostituiscono l’attesa fissa di cinque minuti.
    - La versione predefinita del runtime OpenClaw passa a **2026.6.35**. La versione di compilazione rimane **2026.4.24** e NemoClaw rimane **v0.0.38**.
    - Le installazioni esistenti mantengono le variabili di ambiente salvate. Per usare il nuovo runtime, impostare **NEMOCLAW_OPENCLAW_VERSION** su **2026.6.35** se contiene ancora una versione precedente.

metadata:
  title: NemoClaw
  description: NVIDIA NemoClaw - Agent de codage IA avec isolation sandbox
spec:
  fullDescription: |
    **Aperçu**
    NVIDIA NemoClaw est une stack de référence open source qui simplifie l'exécution plus sûre d'assistants [OpenClaw](https://openclaw.ai) toujours actifs.
    Elle installe le runtime [NVIDIA OpenShell](https://github.com/NVIDIA/OpenShell), faisant partie de NVIDIA Agent Toolkit, qui apporte une sécurité supplémentaire pour les agents autonomes.

    > **Logiciel alpha**
    >
    > NemoClaw est disponible en early preview à partir du 16 mars 2026. Ce logiciel n'est pas prêt pour la production. Interfaces, API et comportement peuvent changer sans préavis. Le projet est partagé pour recueillir des retours et permettre l'expérimentation. Issues et discussions de la communauté sont les bienvenues.

    Docs officielles : [NemoClaw](https://docs.nvidia.com/nemoclaw/latest/index.html), [Tableau de bord distant / CHAT_UI_URL](https://docs.nvidia.com/nemoclaw/latest/deployment/deploy-to-remote-gpu.html#remote-dashboard-access).

    **Olares**
    - **CLI** — Terminal ; `nemoclaw my-assistant connect` puis `openclaw tui`. OpenShell : `openshell status` / `openshell doctor`.
    - **UI Web** — Définir **CHAT_UI_URL** ou **domain.webtui** d'Olares ; le chart patch **allowedOrigins**. Jeton gateway : `nemoclaw my-assistant gateway-token --quiet`.
    - **Env** — Requis : **NEMOCLAW_PROVIDER**, **NEMOCLAW_ENDPOINT_URL** (/v1), **NEMOCLAW_MODEL**. Optionnel : **NEMOCLAW_OPENCLAW_VERSION** (OpenClaw épinglé par défaut), niveau/mode de politique, netns du gateway. Descriptions complètes dans le manifeste anglais.

  upgradeDescription: |
    Le chart Olares **1.0.30** optimise le processus d’installation.
    - Les tâches de démarrage installent OpenClaw une à une avant de lancer le gateway. La préparation du runtime est réessayée avant le contrôle du gateway.
    - Les accès sont ouverts après validation du service de modèles et réception d’une réponse du gateway. Les contrôles lisent les réponses complètes pour éviter les fermetures prématurées des connexions.
    - Améliore la préparation des composants, la réutilisation des images en cache et la connexion au service de modèles.
    - Les accès à l’application ne sont disponibles qu’après validation de l’interface Web, de JavaScript, des feuilles de style et de l’état du gateway. Les contrôles en temps réel remplacent l’attente fixe de cinq minutes.
    - La version d’exécution par défaut d’OpenClaw passe à **2026.6.35**. La version de compilation reste **2026.4.24** et NemoClaw reste **v0.0.38**.
    - Les installations existantes conservent leurs variables d’environnement. Pour utiliser la nouvelle version d’exécution, définissez **NEMOCLAW_OPENCLAW_VERSION** sur **2026.6.35** si sa valeur est encore une ancienne version.

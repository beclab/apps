metadata:
  title: NemoClaw
  description: NVIDIA NemoClaw - Agente de codificación con IA e aislamiento en sandbox
spec:
  fullDescription: |
    **Resumen**
    NVIDIA NemoClaw es un stack de referencia de código abierto que simplifica ejecutar asistentes [OpenClaw](https://openclaw.ai) siempre activos de forma más segura.
    Instala el runtime [NVIDIA OpenShell](https://github.com/NVIDIA/OpenShell), parte de NVIDIA Agent Toolkit, que aporta seguridad adicional para agentes autónomos.

    > **Software alfa**
    >
    > NemoClaw está disponible en vista previa temprana desde el 16 de marzo de 2026. Este software no está listo para producción. Interfaces, APIs y comportamiento pueden cambiar sin aviso. El proyecto se comparte para recoger feedback y experimentar. Se agradecen issues y debate de la comunidad.

    Docs oficiales: [NemoClaw](https://docs.nvidia.com/nemoclaw/latest/index.html), [Panel remoto / CHAT_UI_URL](https://docs.nvidia.com/nemoclaw/latest/deployment/deploy-to-remote-gpu.html#remote-dashboard-access).

    **Olares**
    - **CLI** — Terminal; `nemoclaw my-assistant connect` y luego `openclaw tui`. OpenShell: `openshell status` / `openshell doctor`.
    - **IU web** — Configure **CHAT_UI_URL** o **domain.webtui** de Olares; el chart ajusta **allowedOrigins**. Token de gateway: `nemoclaw my-assistant gateway-token --quiet`.
    - **Env** — Obligatorias: **NEMOCLAW_PROVIDER**, **NEMOCLAW_ENDPOINT_URL** (/v1), **NEMOCLAW_MODEL**. Opcionales: **NEMOCLAW_OPENCLAW_VERSION** (OpenClaw fijado por defecto), nivel/modo de política, netns del gateway. Descripciones completas en el manifiesto en inglés.

  upgradeDescription: |
    Actualización del chart de Olares **1.0.16** — fijar el runtime OpenClaw en **2026.6.9** (el pin de build sigue en **2026.4.24** / NemoClaw **v0.0.38**).
    
    - Por defecto **NEMOCLAW_RECREATE_SANDBOX=1** para que el onboarding no interactivo pueda sobrescribir un sandbox residual no listo.
    - Imagen del proxy de ingress: oficial **openresty/openresty:1.29.2.5-bookworm-fat**.

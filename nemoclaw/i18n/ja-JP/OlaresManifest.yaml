metadata:
  title: NemoClaw
  description: NVIDIA NemoClaw - サンドボックス分離付き AI コーディングエージェント
spec:
  fullDescription: |
    **概要**
    NVIDIA NemoClaw は、[OpenClaw](https://openclaw.ai) の常時稼働アシスタントをより安全に実行しやすくするオープンソースのリファレンススタックです。
    NVIDIA Agent Toolkit の一部である [NVIDIA OpenShell](https://github.com/NVIDIA/OpenShell) ランタイムをインストールし、自律エージェント実行に追加のセキュリティを提供します。

    > **アルファ版ソフトウェア**
    >
    > NemoClaw は 2026 年 3 月 16 日からアーリープレビューとして提供されています。本番利用向けではありません。インターフェース、API、動作は予告なく変更されることがあります。フィードバック収集と早期実験のために公開されています。進化の過程でコミュニティからの Issue と議論を歓迎します。

    公式ドキュメント: [NemoClaw](https://docs.nvidia.com/nemoclaw/latest/index.html)、[リモートダッシュボード / CHAT_UI_URL](https://docs.nvidia.com/nemoclaw/latest/deployment/deploy-to-remote-gpu.html#remote-dashboard-access)。

    **Olares**
    - **CLI** — ターミナル; `nemoclaw my-assistant connect` のあと `openclaw tui`。OpenShell: `openshell status` / `openshell doctor`。
    - **Web UI** — **CHAT_UI_URL** または Olares の **domain.webtui** を設定; チャートが **allowedOrigins** をパッチします。ゲートウェイトークン: `nemoclaw my-assistant gateway-token --quiet`。
    - **Env** — 必須: **NEMOCLAW_PROVIDER**、**NEMOCLAW_ENDPOINT_URL** (/v1)、**NEMOCLAW_MODEL**。任意: **NEMOCLAW_OPENCLAW_VERSION**（デフォルトはピン留め OpenClaw）、ポリシー階層/モード、ゲートウェイ netns。詳細は英語マニフェストを参照。

  upgradeDescription: |
    Olares チャート **1.0.16** へのアップグレード — OpenClaw ランタイムを **2026.6.9** にピン留め（ビルドピンは **2026.4.24** / NemoClaw **v0.0.38** のまま）。
    
    - デフォルト **NEMOCLAW_RECREATE_SANDBOX=1** により、非対話オンボードが未準備の残存サンドボックスを上書き可能。
    - Ingress プロキシイメージ: 公式 **openresty/openresty:1.29.2.5-bookworm-fat**。

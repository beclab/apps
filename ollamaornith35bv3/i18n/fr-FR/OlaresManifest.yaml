metadata:
  title: Ornith 35B (Ollama)
  description: Ornith 35B servi avec Ollama
spec:
  upgradeDescription: |
    v1.0.16: Model Console (llm-init) a été mis à jour vers la version v1.7.21.

    v1.0.15 : Model Console passe à llm-init v1.7.19.

    v1.0.13 : La Model Console peut désormais redémarrer le démon Ollama. llm-init et le démon partagent un RUN_DIR sous appCache, et le wrapper lance `ollama serve` sous supervise_engine : modifier engine_args sur la carte du modèle relance le démon avec les nouvelles valeurs. La carte du modèle survit aussi à un redémarrage du Pod et, écrite sur disque, prime sur le paramètre ENGINE_ARGS de l’application.

    v1.0.10 : Réduire la réservation de mémoire hôte NVIDIA pour faciliter l'installation sur les nœuds timeslice 1.12.6 (demande moteur 21Gi→6Gi, requiredMemory du chart 22Gi→7Gi). Quota GPU inchangé.

    v1.0.6 : passer ollama à 0.32.1.
    v1.0.5 : mémoire hôte nvidia — requiredMemory 22Gi, OLLAMA_MEMORY_REQUEST 21Gi, OLLAMA_MEMORY_LIMIT 30Gi ; limite llm-init 2Gi ; limitedMemory 32Gi.
    v1.0.4 : passer ollama à 0.31.2.
    v1.0.4 : passer llm-init à v1.3.1.
  fullDescription: |
    **Aperçu du modèle**
    Ornith 35B est la build empaquetée avec Ollama du modèle MoE Ornith-1.0-35B de DeepReinforce, conçue pour le coding agentique avec thinking, appels d'outils et prise en charge de la vision. Cette application télécharge `ornith:35b` depuis la bibliothèque Ollama.

    Recommandé lorsque votre charge de travail est centrée sur l'écriture de code et les opérations de terminal automatisées (coding agentique). Ornith-1.0-35B utilise un cadre RL d'auto-amélioration et cible des benchmarks tels que SWE-bench et Terminal-Bench.

    **Configuration du preset**
    - Modèle : `ornith:35b`
    - Capacités : thinking, tools, vision
    - Args moteur : `OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=131072 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1` (contexte 128K, garder le modèle en VRAM, flash attention, cache KV q8_0)
    - Mémoire GPU requise : `23Gi`

    **Modes accélérateur**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Utilise `23Gi` de mémoire GPU ; Ollama utilise le GPU par défaut     |
    | `nvidia-gb10`  | GPU (Spark)       | Comme ci-dessus, mais la mémoire est gérée par le pod                |

    **Fonctionnement**
    D'abord, Model Console télécharge le modèle depuis la bibliothèque Ollama et le prépare ; puis le démon Ollama commence à servir le modèle lorsqu'il est prêt. Ces deux parties s'exécutent séparément mais partagent fichiers et infos de progression.

    **Stack**
    - **Démon Ollama** (port 11434) : télécharge et sert le modèle
    - **Model Console** (port 8090) : pilote le pull du modèle, affiche la progression et fournit l'API OpenAI, avec proxy vers Ollama

    **Stockage du modèle**
    Tous les modèles téléchargés sont stockés dans un dossier partagé à `appCommon/ollama`. Toutes les applications basées sur Ollama partagent cet emplacement, de sorte que les blobs se dédupliquent par digest entre installations.

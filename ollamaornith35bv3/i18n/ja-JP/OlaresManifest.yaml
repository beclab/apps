metadata:
  title: Ornith 35B (Ollama)
  description: Ollama で提供する Ornith 35B
spec:
  upgradeDescription: |
    v1.0.16: Model Console（llm-init）を v1.7.21 に更新しました。

    v1.0.15: Model Console を llm-init v1.7.19 にアップグレードしました。

    v1.0.13: Model Console から Ollama デーモンを再起動できるようになりました。llm-init とデーモンが appCache 配下の RUN_DIR を共有し、wrapper は supervise_engine のもとで `ollama serve` を起動するため、モデルカードの engine_args を変更するとデーモンが新しい値で起動し直します。モデルカードは Pod 再起動後も保持され、ディスク上のカードはアプリ設定の ENGINE_ARGS より優先されます。

    v1.0.10: 1.12.6 タイムスライスノードでインストールしやすくするため NVIDIA ホストメモリ予約を引き下げ（エンジン要求 21Gi→6Gi、chart requiredMemory 22Gi→7Gi）。GPU クォータは変更なし。

    v1.0.6: ollama を 0.32.1 に更新。
    v1.0.5: nvidia ホストメモリ — requiredMemory 22Gi、OLLAMA_MEMORY_REQUEST 21Gi、OLLAMA_MEMORY_LIMIT 30Gi；llm-init 上限 2Gi；limitedMemory 32Gi。
    v1.0.4: ollama を 0.31.2 に更新。
    v1.0.4: llm-init を v1.3.1 に更新。
  fullDescription: |
    **モデル概要**
    Ornith 35B は DeepReinforce の Ornith-1.0-35B MoE モデルを Ollama 向けにパッケージしたビルドで、thinking・ツール呼び出し・ビジョン対応のエージェントコーディング向けです。本アプリは Ollama ライブラリから `ornith:35b` を取得します。

    コード記述と自動化されたターミナル操作（エージェントコーディング）が中心のワークロード向けにおすすめです。Ornith-1.0-35B は自己改善型 RL フレームワークを用い、SWE-bench や Terminal-Bench などのベンチマークを目標とします。

    **プリセット構成**
    - モデル: `ornith:35b`
    - 能力: thinking, tools, vision
    - エンジン引数: `OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=131072 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1`（128K コンテキスト、モデルを VRAM に保持、flash attention、q8_0 KV キャッシュ）
    - 必要 GPU メモリ: `23Gi`

    **アクセラレータモード**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | `23Gi` の GPU メモリを使用；Ollama は既定で GPU を使用               |
    | `nvidia-gb10`  | GPU (Spark)       | 上記と同様だが、メモリは Pod が管理                                   |

    **動作の仕組み**
    まず Model Console が Ollama ライブラリからモデルを取得して準備し、準備が整うと Ollama デーモンがモデルの提供を開始します。両者は別々に動作しつつ、ファイルと進捗情報を共有します。

    **スタック**
    - **Ollama デーモン**（ポート 11434）: モデルの取得と提供
    - **Model Console**（ポート 8090）: モデル取得を駆動し、進捗を表示し、Ollama へプロキシする OpenAI API を提供

    **モデルストレージ**
    取得したモデルはすべて `appCommon/ollama` の共有フォルダに保存されます。Ollama ベースの全アプリがこの場所を共有するため、ダイジェスト単位で Blob が重複排除されます。

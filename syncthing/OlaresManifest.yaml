olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  syncthing: 1
metadata:
  name: syncthing
  description: Syncthing is a continuous file synchronization program. It synchronizes files between two or more computers in real time.
  icon: https://cdn.olares.cn/images/2026/07/05/de7cd22ea032c8809ba6bccc0d50598f.cropped-1783235320971.png
  appid: syncthing
  version: '1.0.3'
  title: Syncthing
  categories:
  - Utilities_v112
  - workspace
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '2.1.7'
  upgradeDescription: |
    - Upgrade Syncthing from 2.1.1 to 2.1.7, built with Go 1.27.3.
    - Fixes: handle missing max-sequence file entries; avoid early garbage collection of deleted receive-encrypted files; stop generating unbounded prepared statements in SQLite; skip unnecessary identical global announce updates and honour the discovery server's retry-after; turn panics on bad data into protocol errors.
    - Model fixes: verify a local change before applying the metadata shortcut, copy parent ownership properly, and compare blocks correctly when reconciling receive-only folders.
    - Incoming protocol messages are now validated with protovalidate and reasonable limits.
    - No configuration or database change is announced; the existing config and data volumes are reused as-is.
  fullDescription: |
    Syncthing is a continuous file synchronization program. It synchronizes files between two or more computers in real time, safely and privately.
  developer: Syncthing
  website: https://syncthing.net/
  sourceCode: https://github.com/syncthing/syncthing
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 128Mi
  limitedMemory: 1024Mi
  requiredDisk: 128Mi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: syncthing-service
  port: 8384
  host: syncthing-service
  title: Syncthing
  icon: https://cdn.olares.cn/images/2026/07/05/de7cd22ea032c8809ba6bccc0d50598f.cropped-1783235320971.png
  openMethod: window
ports:
- name: sync
  host: syncthing-service
  port: 22000

metadata:
  title: Syncthing
  description: Syncthing 是一个开源的即时文件同步工具，支持在两台或多台计算机之间实时、安全、私密地同步文件。
spec:
  upgradeDescription: |
    - Syncthing 从 2.1.1 升级到 2.1.7，使用 Go 1.27.3 构建。
    - 修复：处理缺失的 max-sequence 文件条目；避免过早回收已删除的接收加密文件；不再在 SQLite 中生成无界的 prepared statement；跳过不必要的相同全局公告更新并遵守发现服务器的 retry-after；把坏数据引发的 panic 转为协议错误。
    - 模型层修复：应用元数据快捷路径前先校验本地变更、正确复制父目录所有权、协调仅接收文件夹时正确比较数据块。
    - 入站协议消息现在通过 protovalidate 校验并设置合理上限。
    - 未提及配置或数据库变更，原有配置卷与数据卷沿用不变。
  fullDescription: |
    Syncthing 是一个跨平台的文件同步客户端。它不需要将文件上传到第三方云服务器，而是通过点对点（P2P）加密连接，直接在您的多台设备（电脑、手机、NAS 等）之间同步文件。

    **主要功能：**
    - **安全与私密**：所有传输经过 TLS 加密，数据仅存储在您信任的设备上。
    - **简单易用**：内置直观的 Web GUI，便于配置和监控同步状态。
    - **多目录同步**：支持添加多个不同的文件夹，分别与不同的设备进行同步。
    - **局域网秒传**：在局域网内能够自动发现设备并以最高带宽进行高速同步。

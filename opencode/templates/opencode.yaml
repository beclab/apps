{{- $opencodeDomainENV := split  ","  .Values.domain.opencode -}}
{{- $opencodeDomain := index $opencodeDomainENV "_0" -}}
{{- $env := .Values.olaresEnv | default dict -}}
{{- $enableOMO := ne (index $env "OPENCODE_OMO" | default "false") "false" }}
{{- $enableDind := ne (index $env "ENABLE_DIND" | default "true") "false" }}
{{- $serverPassword := index $env "OPENCODE_SERVER_PASSWORD" | default "" }}
{{- $serverUsername := index $env "OPENCODE_SERVER_USERNAME" | default "opencode" }}
{{- $image := "beclab/opencode:1.19.3.0" }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: {{ .Values.workloads.opencode.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
        bytetrade.io/terminal: opencode
    spec:
      # appCache is node-local. Pin here so the overlay upper and docker graph
      # stay on the same disk across restarts. schedule.nodeName is set when the
      # chart requests storage permissions.
      {{- if .Values.schedule.nodeName }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .Values.schedule.nodeName | quote }}
      {{- end }}
      initContainers:
        # Package overlay + docker graph must live on a real block filesystem.
        # Multi-node userspace is JuiceFS (FUSE); the kernel refuses OverlayFS
        # and Docker overlay2 there with "Not supported". appCache is the
        # node-local disk. Home and the Code workspace stay on shared storage.
        #
        # migrate-node-local: one-time copy from the old appData location when
        # that location is a real filesystem (single-node). A FUSE copy cannot
        # be a valid overlay upper, so it is left behind and the cache starts fresh.
        - name: migrate-node-local
          image: "{{ $image }}"
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              # df -T wraps a long device name onto the next line, so field 2 is
              # empty on /dev/mapper/olares--vg-data. -P keeps one line; /proc/mounts
              # is the fallback. Docker 29 stores layers in the containerd overlayfs
              # snapshotter, not in docker/overlay2.
              fstype() {
                local t p="$1"
                t="$(df -PT "$p" 2>/dev/null | awk 'NR==2 { print $2 }' || true)"
                if [ -n "${t}" ] && [ "${t}" != "Type" ]; then
                  printf '%s\n' "${t}"
                  return 0
                fi
                awk -v p="$p" '
                  function unesc(s) { gsub(/\\040/, " ", s); return s }
                  BEGIN { best = 0 }
                  {
                    mp = unesc($2)
                    if (index(p "/", mp "/") == 1 && length(mp) > best) { best = length(mp); t = $3 }
                  }
                  END { if (t != "") print t }
                ' /proc/mounts || true
              }
              usable() { [ -n "$1" ] && [[ "$1" != *fuse* ]]; }
              has_files() {
                [ -d "$1" ] || return 1
                find "$1" -type f -print -quit 2>/dev/null | grep -q .
              }
              copy_tree() {
                local src="$1" dst="$2"
                mkdir -p "$dst"
                tar --xattrs --xattrs-include='*' -C "$src" -cf - . | tar --xattrs --xattrs-include='*' -C "$dst" -xf -
              }
              # The previous pod's overlay mounts stay on the host (Bidirectional)
              # and the kernel refuses to rmdir those directories until they are
              # unmounted. Do that before swapping in the copied tree.
              unmount_merged() {
                local dst="$1" d
                [ -d "$dst/merged" ] || return 0
                for d in "$dst"/merged/*; do
                  [ -d "$d" ] || continue
                  umount "$d" 2>/dev/null || umount -l "$d" 2>/dev/null || true
                done
              }
              # Stage beside the destination, then swap. A failed copy leaves no
              # partial tree that the next start would treat as already migrated.
              replace_tree() {
                local src="$1" dst="$2"
                rm -rf "$dst/.incoming"
                mkdir -p "$dst/.incoming"
                copy_tree "$src" "$dst/.incoming"
                unmount_merged "$dst"
                find "$dst" -mindepth 1 -maxdepth 1 ! -name .incoming -exec rm -rf {} +
                find "$dst/.incoming" -mindepth 1 -maxdepth 1 -exec mv {} "$dst"/ \;
                rm -rf "$dst/.incoming"
              }
              if [ -d /legacy/.pkg-overlay/upper ]; then
                src_fs="$(fstype /legacy/.pkg-overlay || true)"
                echo "legacy pkg-overlay fstype=${src_fs:-unknown}"
                if ! usable "${src_fs}"; then
                  echo "legacy pkg-overlay is not a usable OverlayFS upper; starting on node-local cache"
                elif has_files /new-overlay/upper; then
                  echo "node-local pkg-overlay already present"
                elif has_files /legacy/.pkg-overlay/upper; then
                  echo "copying pkg-overlay onto node-local cache"
                  replace_tree /legacy/.pkg-overlay /new-overlay
                  rm -rf /legacy/.pkg-overlay
                else
                  echo "legacy pkg-overlay upper is empty; starting on node-local cache"
                fi
              else
                echo "no legacy pkg-overlay upper"
              fi
              {{- if $enableDind }}
              legacy_snaps=/legacy/docker/containerd/daemon/io.containerd.snapshotter.v1.overlayfs/snapshots
              new_snaps=/new-docker/containerd/daemon/io.containerd.snapshotter.v1.overlayfs/snapshots
              if [ -d /legacy/docker/overlay2 ] || [ -d "${legacy_snaps}" ]; then
                src_fs="$(fstype /legacy/docker || true)"
                echo "legacy docker fstype=${src_fs:-unknown}"
                if ! usable "${src_fs}"; then
                  echo "legacy docker graph is not a usable image store; starting on node-local cache"
                elif has_files /new-docker/overlay2 || has_files "${new_snaps}"; then
                  echo "node-local docker graph already present"
                elif has_files /legacy/docker/overlay2 || has_files "${legacy_snaps}"; then
                  echo "copying docker graph onto node-local cache"
                  replace_tree /legacy/docker /new-docker
                  rm -rf /legacy/docker
                else
                  echo "legacy docker graph has no layers; starting on node-local cache"
                fi
              else
                echo "no legacy docker graph"
              fi
              {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: opencode-home
              mountPath: /legacy
            - name: pkg-overlay
              mountPath: /new-overlay
              mountPropagation: Bidirectional
            {{- if $enableDind }}
            - name: dind-storage
              mountPath: /new-docker
            {{- end }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true

        # init-home: lay down the $HOME-side config + seeds (opencode.json,
        # skills, OMO cache, /etc bits, venv). init-packages.sh hardcodes
        # PKG=/home/opencode/.pkg-overlay, so that path is a nested mount of the
        # node-local volume. The merged overlay mounts come later.
        - name: init-home
          image: "{{ $image }}"
          command:
            - "sh"
            - "-c"
            - |
              set -e
              # apk leaves *.tmp.* index files under $HOME/.apk-cache. On JuiceFS
              # they can disappear while init-setup's find|chown walks the tree,
              # and that non-zero chown aborts every later start.
              find /home/opencode/.apk-cache -name '*.tmp.*' -delete 2>/dev/null || true
              /opt/olares-bake/lib/init-setup.sh
              # Add Olares Router only when the user has not configured a provider.
              # init-setup rewrites opencode.json and keeps unknown keys, so this
              # runs after it. A non-empty provider object is left untouched.
              python3 - <<'PY'
              import json
              import os
              from pathlib import Path

              path = Path("/home/opencode/.config/opencode/opencode.json")

              def router_base():
                  raw = os.environ.get("OLARES_ROUTER_BASE_URL", "").strip().rstrip("/")
                  host = raw[len("https://"):-len("/v1")] if raw.startswith("https://") and raw.endswith("/v1") else ""
                  if host.startswith("router.") and host.count(".") >= 2 and "<" not in host:
                      return raw
                  domain = os.environ.get("OLARES_OC_DOMAIN", "").split(",")[0].strip()
                  domain = domain.split("://")[-1].split("/")[0].split(":")[0]
                  labels = [part for part in domain.split(".") if part]
                  if len(labels) < 3:
                      return ""
                  return "https://router." + ".".join(labels[1:]) + "/v1"

              cfg = {}
              if path.is_file():
                  try:
                      cfg = json.loads(path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      print("router provider: skipped, opencode.json is not valid JSON")
                      raise SystemExit(0)
              if not isinstance(cfg, dict):
                  print("router provider: skipped, opencode.json is not an object")
                  raise SystemExit(0)
              providers = cfg.get("provider")
              if isinstance(providers, dict) and providers:
                  print("router provider: existing provider config kept")
                  raise SystemExit(0)
              base = router_base()
              if not base:
                  print("router provider: skipped, Router URL unknown")
                  raise SystemExit(0)
              cfg["provider"] = {
                  "olares": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "Olares Router",
                      "options": {"baseURL": base},
                      "models": {"default-chat": {"name": "default-chat"}},
                  }
              }
              if not cfg.get("model"):
                  cfg["model"] = "olares/default-chat"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              os.chown(path, 1000, 1000)
              print("router provider: added Olares Router at " + base)
              PY
              /opt/olares-bake/lib/init-packages.sh
              mkdir -p /home/opencode/.local/bin
              cp /opt/certbot-wrapper/certbot /home/opencode/.local/bin/certbot
              chmod a+rx /home/opencode/.local/bin/certbot
              chown 1000:1000 /home/opencode/.local/bin/certbot
          env:
            - name: OLARES_OC_DOMAIN
              value: "{{ $opencodeDomain }}"
            - name: OLARES_ROUTER_BASE_URL
              value: "https://router.{{ .Values.user.zone }}/v1"
            - name: OLARES_ENABLE_OMO
              value: "{{ if $enableOMO }}1{{ else }}0{{ end }}"
            - name: OLARES_OMO_VERSION
              value: "{{ index $env "OPENCODE_OMO_VERSION" | default "4.8.1" }}"
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: pkg-overlay
              mountPath: /home/opencode/.pkg-overlay
            - name: apk-cache
              mountPath: /home/opencode/.apk-cache
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
            - name: certbot-wrapper
              mountPath: /opt/certbot-wrapper
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0

        - name: init-overlay
          # Privileged: mounts an OverlayFS so the baked image rootfs (/usr /bin
          # /sbin /lib /lib64) is the read-only lower layer (ZERO copy) and only
          # user-installed package deltas live in a small persistent upper layer.
          # The upper is on node-local cache (not JuiceFS) and is NEVER reset, so
          # user packages persist across upgrades with zero reinstall / zero
          # network. Allowed by the cluster OPA policy because this is a trusted
          # (beclab/) image.
          image: "{{ $image }}"
          command: ["sh", "-c", "exec /opt/olares-bake/lib/init-overlay.sh"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: pkg-overlay
              mountPath: /pkg-overlay
              mountPropagation: Bidirectional
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true

        {{- if $enableDind }}
        # DIND: stage the docker CLI + compose/buildx plugins out of the dind image
        # DIRECTLY into the persistent $HOME (~/.local/bin + ~/.docker/cli-plugins).
        # Why not /opt/docker-cli: the web terminal runs a login shell that sources
        # ~/.profile (regenerated every start by init-packages.sh), which HARD-SETS
        # PATH and drops any container-env addition like /opt/docker-cli. That
        # hard-coded PATH already contains ~/.local/bin, so placing docker there is
        # the one location a login shell will reliably find it. The opencode image
        # ships no docker client; only the privileged dockerd sidecar (below)
        # provides the engine. Runs after init-home (which chowns $HOME), and
        # re-chowns the staged files to uid 1000 so the main container can exec them.
        - name: init-docker-cli
          image: "docker.io/beclab/docker:29.3.0-dind"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /home/opencode/.local/bin /home/opencode/.docker/cli-plugins
              cp /usr/local/bin/docker /home/opencode/.local/bin/docker
              for d in /usr/local/libexec/docker/cli-plugins \
                       /usr/local/lib/docker/cli-plugins \
                       /usr/libexec/docker/cli-plugins \
                       /usr/lib/docker/cli-plugins; do
                [ -d "$d" ] || continue
                cp "$d"/docker-compose /home/opencode/.docker/cli-plugins/ 2>/dev/null || true
                cp "$d"/docker-buildx  /home/opencode/.docker/cli-plugins/ 2>/dev/null || true
              done
              chmod -R a+rx /home/opencode/.local/bin /home/opencode/.docker/cli-plugins
              chown -R 1000:1000 /home/opencode/.local /home/opencode/.docker
              echo "[init-docker-cli] staged docker CLI into ~/.local/bin:" && ls -la /home/opencode/.local/bin
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: pkg-overlay
              mountPath: /home/opencode/.pkg-overlay
            - name: apk-cache
              mountPath: /home/opencode/.apk-cache
        {{- end }}
      serviceAccountName: proxylistener
      containers:
        - name: opencode
          image: "{{ $image }}"
          command: ["sh", "-c", "exec /opt/olares-bake/lib/start-opencode.sh"]
          workingDir: /home/opencode/workspace
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: HOME
              value: /home/opencode
            - name: TERM
              value: xterm-256color
            - name: PATH
              # DIND docker client is staged into ~/.local/bin (already in PATH),
              # so this list stays identical to the non-DIND layout.
              value: /home/opencode/.venv/bin:/home/opencode/.npm-global/bin:/home/opencode/go/bin:/home/opencode/.cargo/bin:/home/opencode/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: VIRTUAL_ENV
              value: /home/opencode/.venv
            - name: NPM_CONFIG_PREFIX
              value: /home/opencode/.npm-global
            - name: GOPATH
              value: /home/opencode/go
            - name: CARGO_HOME
              value: /home/opencode/.cargo
            - name: ENV
              value: /home/opencode/.profile
            - name: LD_LIBRARY_PATH
              value: /usr/glibc-compat/lib
            {{- if $enableDind }}
            # docker CLI talks to the dockerd sidecar over the shared pod network.
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            {{- end }}
            {{- if $serverPassword }}
            # Optional HTTP basic auth for opencode web/serve (off when unset).
            - name: OPENCODE_SERVER_PASSWORD
              value: {{ $serverPassword | quote }}
            - name: OPENCODE_SERVER_USERNAME
              value: {{ $serverUsername | quote }}
            {{- end }}
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 200m
              memory: 1Gi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: pkg-overlay
              mountPath: /home/opencode/.pkg-overlay
            - name: apk-cache
              mountPath: /home/opencode/.apk-cache
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
            - name: pkg-bin
              mountPath: /bin
              mountPropagation: HostToContainer
            - name: pkg-sbin
              mountPath: /sbin
              mountPropagation: HostToContainer
            - name: pkg-usr
              mountPath: /usr
              mountPropagation: HostToContainer
            - name: pkg-etc-passwd
              mountPath: /etc/passwd
            - name: pkg-etc-group
              mountPath: /etc/group
            - name: pkg-lib
              mountPath: /lib
              mountPropagation: HostToContainer
            - name: pkg-lib64
              mountPath: /lib64
              mountPropagation: HostToContainer
            # DIND client needs no extra mounts here: init-docker-cli stages the
            # docker binary + plugins into the persistent $HOME (~/.local/bin +
            # ~/.docker/cli-plugins), already visible via the opencode-home mount.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: port-watcher
          image: beclab/proxy-listener:0.0.1
          imagePullPolicy: IfNotPresent
          env:
          - name: PORT_WATCHER_ADDR
            value: "127.0.0.1:19790"
          - name: PORT_WATCHER_DENYLIST
            value: "19790"
          - name: PORT_WATCHER_DEBOUNCE
            value: "1s"
          - name: ENTRANCE_HOST
            value: "{{ $opencodeDomain }}"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8081
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            # Check nginx locally; Pod-IP HTTP probes traverse Envoy external auth.
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --noproxy
                - "*"
                - --max-time
                - "2"
                - http://127.0.0.1:8080/healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --noproxy
                - "*"
                - --max-time
                - "2"
                - http://127.0.0.1:8080/healthz
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty
        - name: pkg-manager
          image: "{{ $image }}"
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "exec /opt/olares-bake/lib/pkg-manager.sh"]
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: pkg-overlay
              mountPath: /home/opencode/.pkg-overlay
            - name: apk-cache
              mountPath: /home/opencode/.apk-cache
            - name: pkg-bin
              mountPath: /bin
              mountPropagation: HostToContainer
            - name: pkg-sbin
              mountPath: /sbin
              mountPropagation: HostToContainer
            - name: pkg-usr
              mountPath: /usr
              mountPropagation: HostToContainer
            - name: pkg-lib
              mountPath: /lib
              mountPropagation: HostToContainer
            - name: pkg-lib64
              mountPath: /lib64
              mountPropagation: HostToContainer
            - name: pkg-etc-apk
              mountPath: /etc/apk
            - name: pkg-etc-ssl
              mountPath: /etc/ssl
            - name: pkg-etc-passwd
              mountPath: /etc/passwd
            - name: pkg-etc-group
              mountPath: /etc/group
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["test", "-d", "/home/opencode/.pkg-queue"]
            initialDelaySeconds: 10
            periodSeconds: 30
        {{- if $enableDind }}
        # Privileged Docker-in-Docker engine. Runs dockerd on tcp://localhost:2375
        # (in-pod only); the opencode container's DOCKER_HOST points here. Image
        # layers persist on node-local cache so overlay2 is not stored on JuiceFS.
        - name: docker-dind
          image: "docker.io/beclab/docker:29.3.0-dind"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          command:
            - dockerd
            # Explicit local-only plaintext API avoids dockerd's deliberate TLS warning delay.
            - --tls=false
            - --host
            - tcp://127.0.0.1:2375
            - --host
            - unix:///var/run/docker.sock
            - --mtu=1450
          ports:
            - containerPort: 2375
          startupProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
            # Share the workspace at the SAME path so `docker run -v $(pwd):...`
            # bind-mounts issued from the terminal resolve inside dockerd.
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
        {{- end }}
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      volumes:
        - name: nginx-runtime
          emptyDir: {}
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: opencode-workspace
          hostPath:
            path: "{{ .Values.userspace.userData }}/Code"
            type: DirectoryOrCreate
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: certbot-wrapper
          configMap:
            name: certbot-wrapper
            defaultMode: 493
            items:
              - key: certbot
                path: certbot
        # Parent of the overlay tree (upper/work/merged + marker). Must be a
        # block filesystem: JuiceFS returns EOPNOTSUPP for an overlay upper/work
        # dir. init-overlay mounts this Bidirectional so the overlay mounts it
        # creates propagate to the node and are visible to the merged binds below.
        # init-packages.sh writes this same tree at /home/opencode/.pkg-overlay.
        - name: pkg-overlay
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay"
            type: DirectoryOrCreate
        # pkg-manager.sh points /etc/apk/cache at $HOME/.apk-cache. JuiceFS turns
        # apk's index temp files into unreadable ghosts ("No such file or
        # directory"), so the cache has to be node-local ext4 like the overlay.
        - name: apk-cache
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.apk-cache"
            type: DirectoryOrCreate
        # Merged overlay views (image lower + user upper), populated by init-overlay.
        - name: pkg-bin
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/merged/bin"
            type: DirectoryOrCreate
        - name: pkg-sbin
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/merged/sbin"
            type: DirectoryOrCreate
        - name: pkg-usr
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/merged/usr"
            type: DirectoryOrCreate
        - name: pkg-lib
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/merged/lib"
            type: DirectoryOrCreate
        - name: pkg-lib64
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/merged/lib64"
            type: DirectoryOrCreate
        # Tiny /etc bits kept as plain persistent files/dirs (seeded by init-packages
        # from the image); not part of the overlay.
        - name: pkg-etc-passwd
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/etc/passwd"
            type: FileOrCreate
        - name: pkg-etc-group
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/etc/group"
            type: FileOrCreate
        - name: pkg-etc-apk
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/etc/apk"
            type: DirectoryOrCreate
        - name: pkg-etc-ssl
          hostPath:
            path: "{{ .Values.userspace.appCache }}/.pkg-overlay/etc/ssl"
            type: DirectoryOrCreate
        {{- if $enableDind }}
        # DIND: dockerd's image/layer store on node-local cache. overlay2 cannot
        # use a JuiceFS directory. The docker client is staged into $HOME by
        # init-docker-cli, no extra volume for the client.
        - name: dind-storage
          hostPath:
            path: "{{ .Values.userspace.appCache }}/docker"
            type: DirectoryOrCreate
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: opencode
status:
  loadBalancer: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxylistener
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - app.bytetrade.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: proxylistener
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io

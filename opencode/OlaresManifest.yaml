olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  opencode: 1
  terminal: 1
metadata:
  name: opencode
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  description: The open source AI coding agent
  appid: opencode
  title: OpenCode
  version: '1.0.29'
  categories:
  - Developer Tools
  - Productivity_v112
  - agents
  tags:
  - coding
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '1.19.3'
  promoteImage:
  - https://app.cdn.olares.com/appstore/opencode/1.webp
  - https://app.cdn.olares.com/appstore/opencode/2.webp
  fullDescription: |
    OpenCode is an open-source agent that helps you write code in the terminal, IDE, or desktop.

    - Support LSPs to automatically load appropriate LSPs for LLMs
    - Multi-session Launch multiple agents in parallel in the same project
    - GitHub Copilot Sign in with GitHub to use your Copilot account
    - ChatGPT Plus/Pro Login with OpenAI to use your ChatGPT Plus or Pro account
    - Arbitrary Models supports 75+ LLM providers with Models.dev, including native models
    - Any editor provides terminal interfaces, desktop applications, and IDE extensions

    Usage:
    - Open the app and use the Web UI in your browser.
    - On first open, click Add Project and choose workspace (your Code directory at /home/opencode/workspace). The browser remembers this project for later visits (OpenCode Web stores opened projects in localStorage).
    - If no provider is configured, OpenCode adds Olares Router and selects default-chat. An existing provider is left unchanged. Other providers and API keys can still be set in the Web UI.
    - Your code workspace is mounted at /home/opencode/workspace (linked to your Home/Code directory).
  upgradeDescription: |
    Keep OpenCode at v1.19.3. Move the package OverlayFS and the Docker data directory onto node-local cache so the app can start on a multi-node cluster. JuiceFS does not support OverlayFS or Docker overlay2, which made init-overlay exit with "Not supported". Home, settings, and the Code workspace stay on shared storage. An existing single-node overlay and Docker store are copied once onto the local cache, including the containerd image store used by current Docker. Restart no longer fails when stale apk index temp files are left on JuiceFS. Package installs keep the apk download cache on node-local disk, so installing packages works on a multi-node cluster. If no provider is configured, OpenCode adds Olares Router and selects default-chat. An existing provider configuration is left unchanged.
  developer: Anomaly
  website: https://opencode.ai/
  sourceCode: https://github.com/anomalyco/opencode
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  doc: https://opencode.ai/docs
  license:
  - text: MIT
    url: https://github.com/anomalyco/opencode/blob/dev/LICENSE
  requiredMemory: 2304Mi
  limitedMemory: 24Gi
  requiredDisk: 5Gi
  limitedDisk: 50Gi
  requiredCpu: 0.5
  limitedCpu: 13
  supportArch:
  - amd64
  - arm64
envs:
  - envName: OPENCODE_OMO
    required: false
    applyOnChange: true
    type: bool
    editable: true
    default: "false"
    description: "Activate oh-my-opencode (OMO) multi-agent UI. The OMO package is always pre-installed; this toggle only controls whether the plugin is loaded at startup."
  - envName: OPENCODE_OMO_VERSION
    required: false
    applyOnChange: true
    type: string
    editable: true
    default: "4.8.1"
    description: "Exact semver of oh-my-opencode (OMO) to install, e.g. '4.8.1'."
  - envName: ENABLE_DIND
    required: false
    applyOnChange: true
    type: bool
    editable: true
    default: "true"
    description: "Run a privileged Docker-in-Docker sidecar so `docker`, `docker compose` and `docker buildx` work in the terminal (via DOCKER_HOST=tcp://localhost:2375). Image layers use node-local cache, because JuiceFS cannot store overlay2. Disable if your environment forbids privileged containers."
  - envName: OPENCODE_SERVER_PASSWORD
    required: false
    applyOnChange: true
    type: password
    editable: true
    default: ""
    description: "Optional OpenCode server basic-auth password (default empty = off). When set, opening the Web UI prompts for HTTP basic auth (username from OPENCODE_SERVER_USERNAME). Olares entrance auth still applies first."
  - envName: OPENCODE_SERVER_USERNAME
    required: false
    applyOnChange: true
    type: string
    editable: true
    default: "opencode"
    description: "OpenCode server basic-auth username used only when OPENCODE_SERVER_PASSWORD is set. Default: opencode."
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 80
  - 443
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: opencode
  port: 8080
  host: opencodeingress
  title: OpenCode
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  openMethod: window
  authLevel: internal
- name: opencodeterminal
  port: 8081
  host: opencodeingress
  title: OpenCode Terminal
  icon: https://app.cdn.olares.com/appstore/opencode/terminal.png
  openMethod: window
  authLevel: internal

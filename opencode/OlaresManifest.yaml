olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  opencode: 1
  terminal: 1
metadata:
  name: opencode
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  description: The open source AI coding agent
  appid: opencode
  title: OpenCode
  version: '1.0.21'
  categories:
  - Developer Tools
  - Productivity_v112
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '1.18.18'
  promoteImage:
  - https://app.cdn.olares.com/appstore/opencode/1.webp
  - https://app.cdn.olares.com/appstore/opencode/2.webp
  fullDescription: |
    OpenCode is an open-source agent that helps you write code in the terminal, IDE, or desktop.

    - Support LSPs to automatically load appropriate LSPs for LLMs
    - Multi-session Launch multiple agents in parallel in the same project
    - Share Link Share any session link for reference or debugging
    - GitHub Copilot Sign in with GitHub to use your Copilot account
    - ChatGPT Plus/Pro Login with OpenAI to use your ChatGPT Plus or Pro account
    - Arbitrary Models supports 75+ LLM providers with Models.dev, including native models
    - Any editor provides terminal interfaces, desktop applications, and IDE extensions

    Usage:
    - Open the app and use the Web UI in your browser.
    - On first open, click Add Project and choose workspace (your Code directory at /home/opencode/workspace). The browser remembers this project for later visits (OpenCode Web stores opened projects in localStorage).
    - Configure your LLM provider and API keys in the Web UI.
    - Your code workspace is mounted at /home/opencode/workspace (linked to your Home/Code directory).
  upgradeDescription: |
    Upgrade OpenCode to v1.18.18 (`beclab/opencode:1.18.18.1`).

    Olares: baked `@olares/cli` upgraded to 1.12.7-cli.0 (from 1.12.6-cli.2).
    certbot (Let's Encrypt) is pre-installed in the image; init-home
    installs a `~/.local/bin/certbot` wrapper so `certbot` works for uid 1000
    without manual `--config-dir` flags (state under `$HOME/.config/letsencrypt`).

    Web UI: on first open, choose Add Project → workspace
    (`/home/opencode/workspace`); the browser remembers the project afterward
    (upstream Web still stores opened projects in localStorage).

    Upstream highlights (v1.18.17–v1.18.18): clearer session compaction for
    smaller models; Copilot PDF attachments; Muse/Moonshot/Kimi system prompts;
    capped session retries with jitter; default model follows server config;
    xAI xhigh reasoning fix.

    Optional app-level HTTP basic auth via `OPENCODE_SERVER_PASSWORD` unchanged
    (off by default; username `OPENCODE_SERVER_USERNAME`, default `opencode`).

    Full release notes: https://github.com/anomalyco/opencode/releases/tag/v1.18.18
  developer: Anomaly
  website: https://opencode.ai/
  sourceCode: https://github.com/anomalyco/opencode
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://opencode.ai/docs
  license:
  - text: MIT
    url: https://github.com/anomalyco/opencode/blob/dev/LICENSE
  requiredMemory: 2304Mi
  limitedMemory: 24Gi
  requiredDisk: 5Gi
  limitedDisk: 50Gi
  requiredCpu: 0.5
  limitedCpu: 13
  supportArch:
  - amd64
  - arm64
envs:
  - envName: OPENCODE_OMO
    required: false
    applyOnChange: true
    type: bool
    editable: true
    default: "false"
    description: "Activate oh-my-opencode (OMO) multi-agent UI. The OMO package is always pre-installed; this toggle only controls whether the plugin is loaded at startup."
  - envName: OPENCODE_OMO_VERSION
    required: false
    applyOnChange: true
    type: string
    editable: true
    default: "4.8.1"
    description: "Exact semver of oh-my-opencode (OMO) to install, e.g. '4.8.1'."
  - envName: ENABLE_DIND
    required: false
    applyOnChange: true
    type: bool
    editable: true
    default: "true"
    description: "Run a privileged Docker-in-Docker sidecar so `docker`, `docker compose` and `docker buildx` work in the terminal (via DOCKER_HOST=tcp://localhost:2375). Uses extra CPU/RAM/disk under app data. Disable if your environment forbids privileged containers."
  - envName: OPENCODE_SERVER_PASSWORD
    required: false
    applyOnChange: true
    type: password
    editable: true
    default: ""
    description: "Optional OpenCode server basic-auth password (default empty = off). When set, opening the Web UI prompts for HTTP basic auth (username from OPENCODE_SERVER_USERNAME). Olares entrance auth still applies first."
  - envName: OPENCODE_SERVER_USERNAME
    required: false
    applyOnChange: true
    type: string
    editable: true
    default: "opencode"
    description: "OpenCode server basic-auth username used only when OPENCODE_SERVER_PASSWORD is set. Default: opencode."
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 80
  - 443
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: opencode
  port: 8080
  host: opencodeingress
  title: OpenCode
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  openMethod: window
  authLevel: internal
- name: opencodeterminal
  port: 8081
  host: opencodeingress
  title: OpenCode Terminal
  icon: https://app.cdn.olares.com/appstore/opencode/terminal.png
  openMethod: window
  authLevel: internal

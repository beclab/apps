metadata:
  title: OpenCode
  description: El agente de coding con AI de código abierto
spec:
  fullDescription: |
    OpenCode es un agente de código abierto que te ayuda a escribir código en la terminal, el IDE o el escritorio.

    - Support LSPs para cargar automáticamente los LSP adecuados para LLMs
    - Multi-session Lanza varios agents en paralelo en el mismo proyecto
    - GitHub Copilot Inicia sesión con GitHub para usar tu cuenta Copilot
    - ChatGPT Plus/Pro Inicia sesión con OpenAI para usar tu cuenta ChatGPT Plus o Pro
    - Arbitrary Models admite más de 75 proveedores LLM con Models.dev, incluidos modelos nativos
    - Any editor ofrece interfaces de terminal, aplicaciones de escritorio y extensiones IDE

    Usage:
    - Abre la app y usa la Web UI en tu navegador.
    - En la primera apertura, haz clic en Add Project y elige workspace (tu directorio Code en /home/opencode/workspace). El navegador recuerda este proyecto para visitas posteriores (OpenCode Web guarda los proyectos abiertos en localStorage).
    - Si no hay ningún proveedor configurado, OpenCode añade Olares Router y selecciona default-chat. Una configuración existente no se modifica. Otros proveedores y claves API se pueden añadir en la Web UI.
    - Tu workspace de código está montado en /home/opencode/workspace (enlazado a tu directorio Home/Code).
  upgradeDescription: |
    OpenCode se mantiene en v1.19.3. El OverlayFS de paquetes y el directorio de datos de Docker pasan a la caché local del nodo, para que la aplicación arranque en un clúster de varios nodos. JuiceFS no admite OverlayFS ni el overlay2 de Docker, por eso init-overlay terminaba con «Not supported». El directorio personal, los ajustes y el espacio Code siguen en el almacenamiento compartido. Un overlay y un almacén Docker ya existentes en un solo nodo se copian una vez a la caché local, incluido el almacén de imágenes containerd de las versiones actuales de Docker. Las imágenes Docker ya descargadas se copian también: unos pocos GB tardan varios minutos, y unas decenas de GB varias decenas de minutos. La aplicación no está disponible hasta que termine. Al reiniciar se eliminan los índices temporales de apk dejados en JuiceFS, para que chown no falle. La caché de descarga de apk queda en el disco local del nodo, así que se pueden instalar paquetes en un clúster de varios nodos. Si no hay ningún proveedor configurado, OpenCode añade Olares Router y selecciona default-chat. Una configuración de proveedor ya existente no se modifica.

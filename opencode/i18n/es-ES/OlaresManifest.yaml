metadata:
  title: OpenCode
  description: El agente de coding con AI de código abierto
spec:
  fullDescription: |
    OpenCode es un agente de código abierto que te ayuda a escribir código en la terminal, el IDE o el escritorio.

    - Support LSPs para cargar automáticamente los LSP adecuados para LLMs
    - Multi-session Lanza varios agents en paralelo en el mismo proyecto
    - GitHub Copilot Inicia sesión con GitHub para usar tu cuenta Copilot
    - ChatGPT Plus/Pro Inicia sesión con OpenAI para usar tu cuenta ChatGPT Plus o Pro
    - Arbitrary Models admite más de 75 proveedores LLM con Models.dev, incluidos modelos nativos
    - Any editor ofrece interfaces de terminal, aplicaciones de escritorio y extensiones IDE

    Usage:
    - Abre la app y usa la Web UI en tu navegador.
    - En la primera apertura, haz clic en Add Project y elige workspace (tu directorio Code en /home/opencode/workspace). El navegador recuerda este proyecto para visitas posteriores (OpenCode Web guarda los proyectos abiertos en localStorage).
    - Configura tu proveedor LLM y las claves API en la Web UI.
    - Tu workspace de código está montado en /home/opencode/workspace (enlazado a tu directorio Home/Code).
  upgradeDescription: |
    Actualizar OpenCode a v1.19.3 (beclab/opencode:1.19.3.0). Incluye validación de conexiones PTY, ocultación de datos sensibles en la configuración de depuración, correcciones de tiempos de espera y variantes de razonamiento configurables. Ya no se admiten las sesiones compartidas, los enlaces existentes ni la importación desde URL compartidas. Las actualizaciones habituales permanecen en 1.x; OpenCode 2 requiere elegir expresamente la actualización de versión principal.
    https://github.com/anomalyco/opencode/releases/tag/v1.19.3
    https://github.com/anomalyco/opencode/compare/v1.18.31...v1.19.3

metadata:
  title: OpenCode
  description: Der Open-Source-AI-Coding-Agent
spec:
  fullDescription: |
    OpenCode ist ein Open-Source-Agent, der Ihnen beim Schreiben von Code im Terminal, in der IDE oder auf dem Desktop hilft.

    - Support LSPs, um passende LSPs automatisch für LLMs zu laden
    - Multi-session Mehrere Agents parallel im selben Projekt starten
    - GitHub Copilot Mit GitHub anmelden, um Ihr Copilot-Konto zu nutzen
    - ChatGPT Plus/Pro Mit OpenAI anmelden, um Ihr ChatGPT-Plus- oder Pro-Konto zu nutzen
    - Arbitrary Models unterstützt 75+ LLM-Anbieter mit Models.dev, einschließlich nativer Modelle
    - Any editor bietet Terminal-Interfaces, Desktop-Anwendungen und IDE-Erweiterungen

    Usage:
    - Öffnen Sie die App und nutzen Sie die Web-UI im Browser.
    - Beim ersten Öffnen auf Add Project klicken und workspace wählen (Ihr Code-Verzeichnis unter /home/opencode/workspace). Der Browser merkt sich dieses Projekt für spätere Besuche (OpenCode Web speichert geöffnete Projekte in localStorage).
    - Ist kein Anbieter konfiguriert, trägt OpenCode Olares Router ein und wählt default-chat. Eine vorhandene Konfiguration bleibt unverändert. Weitere Anbieter und API-Schlüssel lassen sich in der Web-UI setzen.
    - Ihr Code-Workspace ist unter /home/opencode/workspace gemountet (verlinkt mit Ihrem Home/Code-Verzeichnis).
  upgradeDescription: |
    OpenCode bleibt bei v1.19.3. Das Paket-OverlayFS und das Docker-Datenverzeichnis liegen jetzt auf dem node-lokalen Cache, damit die App in einem Mehrknoten-Cluster startet. JuiceFS unterstützt weder OverlayFS noch Docker overlay2; init-overlay beendete sich deshalb mit „Not supported“. Home, Einstellungen und der Code-Arbeitsbereich bleiben auf dem gemeinsamen Speicher. Ein vorhandenes Einzelknoten-Overlay und der Docker-Speicher werden einmalig auf den lokalen Cache kopiert, einschließlich des containerd-Image-Speichers aktueller Docker-Versionen. Bereits gezogene Docker-Images werden mitkopiert: ein paar GB dauern einige Minuten, einige zehn GB einige zehn Minuten. Die App ist erst danach erreichbar. Veraltete apk-Index-Temporärdateien auf JuiceFS werden vor dem Neustart entfernt, damit chown nicht abbricht. Der apk-Download-Cache liegt auf der node-lokalen Platte, sodass Pakete auch in einem Mehrknoten-Cluster installiert werden können. Ist noch kein Anbieter konfiguriert, trägt OpenCode Olares Router ein und wählt default-chat. Eine vorhandene Anbieterkonfiguration bleibt unverändert.

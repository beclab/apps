metadata:
  title: OpenCode
  description: The open source AI coding agent
spec:
  fullDescription: |
    OpenCode is an open-source agent that helps you write code in the terminal, IDE, or desktop.

    - Support LSPs to automatically load appropriate LSPs for LLMs
    - Multi-session Launch multiple agents in parallel in the same project
    - GitHub Copilot Sign in with GitHub to use your Copilot account
    - ChatGPT Plus/Pro Login with OpenAI to use your ChatGPT Plus or Pro account
    - Arbitrary Models supports 75+ LLM providers with Models.dev, including native models
    - Any editor provides terminal interfaces, desktop applications, and IDE extensions

    Usage:
    - Open the app and use the Web UI in your browser.
    - On first open, click Add Project and choose workspace (your Code directory at /home/opencode/workspace). The browser remembers this project for later visits (OpenCode Web stores opened projects in localStorage).
    - If no provider is configured, OpenCode adds Olares Router and selects default-chat. An existing provider is left unchanged. Other providers and API keys can still be set in the Web UI.
    - Your code workspace is mounted at /home/opencode/workspace (linked to your Home/Code directory).
  upgradeDescription: |
    Keep OpenCode at v1.19.3. Move the package OverlayFS and the Docker data directory onto node-local cache so the app can start on a multi-node cluster. JuiceFS does not support OverlayFS or Docker overlay2, which made init-overlay exit with "Not supported". Home, settings, and the Code workspace stay on shared storage. An existing single-node overlay and Docker store are copied once onto the local cache, including the containerd image store used by current Docker. Restart no longer fails when stale apk index temp files are left on JuiceFS. Package installs keep the apk download cache on node-local disk, so installing packages works on a multi-node cluster. If no provider is configured, OpenCode adds Olares Router and selects default-chat. An existing provider configuration is left unchanged.

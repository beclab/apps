metadata:
  title: OpenCode
  description: The open source AI coding agent
spec:
  fullDescription: |
    OpenCode is an open-source agent that helps you write code in the terminal, IDE, or desktop.

    - Support LSPs to automatically load appropriate LSPs for LLMs
    - Multi-session Launch multiple agents in parallel in the same project
    - Share Link Share any session link for reference or debugging
    - GitHub Copilot Sign in with GitHub to use your Copilot account
    - ChatGPT Plus/Pro Login with OpenAI to use your ChatGPT Plus or Pro account
    - Arbitrary Models supports 75+ LLM providers with Models.dev, including native models
    - Any editor provides terminal interfaces, desktop applications, and IDE extensions

    Usage:
    - Open the app and use the Web UI in your browser.
    - On first open, click Add Project and choose workspace (your Code directory at /home/opencode/workspace). The browser remembers this project for later visits (OpenCode Web stores opened projects in localStorage).
    - Configure your LLM provider and API keys in the Web UI.
    - Your code workspace is mounted at /home/opencode/workspace (linked to your Home/Code directory).
  upgradeDescription: |
    Upgrade OpenCode to v1.18.16 (`beclab/opencode:1.18.16.1`).

    Olares: certbot (Let's Encrypt) is pre-installed in the image; init-home
    installs a `~/.local/bin/certbot` wrapper so `certbot` works for uid 1000
    without manual `--config-dir` flags (state under `$HOME/.config/letsencrypt`).

    Web UI: on first open, choose Add Project → workspace
    (`/home/opencode/workspace`); the browser remembers the project afterward
    (upstream Web still stores opened projects in localStorage).

    Upstream highlights (v1.18.10–v1.18.16): ignore unknown config fields;
    register projects opened from Home; Web UI project picker lists local
    directories when server search is unavailable; blob attachments in web UI;
    chronological message ordering; broader locale coverage.

    Optional app-level HTTP basic auth via `OPENCODE_SERVER_PASSWORD` unchanged
    (off by default; username `OPENCODE_SERVER_USERNAME`, default `opencode`).

    Full release notes: https://github.com/anomalyco/opencode/releases/tag/v1.18.16

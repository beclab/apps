metadata:
  title: OpenCode
  description: オープンソースの AI コーディングエージェント
spec:
  fullDescription: |
    OpenCode は、ターミナル、IDE、デスクトップでコード作成を支援するオープンソースエージェントです。

    - Support LSPs — LLM 向けに適切な LSP を自動読み込み
    - Multi-session — 同一プロジェクトで複数エージェントを並列起動
    - GitHub Copilot — GitHub でサインインして Copilot アカウントを利用
    - ChatGPT Plus/Pro — OpenAI でログインして ChatGPT Plus／Pro アカウントを利用
    - Arbitrary Models — Models.dev 経由で 75 以上の LLM プロバイダーとネイティブモデルをサポート
    - Any editor — ターミナル UI、デスクトップアプリ、IDE 拡張を提供

    Usage:
    - アプリを開き、ブラウザで Web UI を使用。
    - 初回起動時に Add Project をクリックし、workspace（/home/opencode/workspace の Code ディレクトリ）を選択。ブラウザはこのプロジェクトを以降の訪問で記憶します（OpenCode Web は開いたプロジェクトを localStorage に保存）。
    - Web UI で LLM プロバイダーと API キーを設定。
    - コードワークスペースは /home/opencode/workspace にマウントされます（Home/Code ディレクトリにリンク）。
  upgradeDescription: |
    OpenCode を v1.19.3（beclab/opencode:1.19.3.0）へ更新。PTY 接続の検証、デバッグ設定の機密情報の非表示、プロバイダーのタイムアウト修正、推論バリアントの設定に対応。セッション共有、既存の共有リンク、共有 URL からのインポートはサポートを終了しました。通常の更新は 1.x 系に留まり、OpenCode 2 への移行には明示的なメジャーアップグレードが必要です。
    https://github.com/anomalyco/opencode/releases/tag/v1.19.3
    https://github.com/anomalyco/opencode/compare/v1.18.31...v1.19.3

metadata:
  title: OpenCode
  description: オープンソースの AI コーディングエージェント
spec:
  fullDescription: |
    OpenCode は、ターミナル、IDE、デスクトップでコード作成を支援するオープンソースエージェントです。

    - Support LSPs — LLM 向けに適切な LSP を自動読み込み
    - Multi-session — 同一プロジェクトで複数エージェントを並列起動
    - GitHub Copilot — GitHub でサインインして Copilot アカウントを利用
    - ChatGPT Plus/Pro — OpenAI でログインして ChatGPT Plus／Pro アカウントを利用
    - Arbitrary Models — Models.dev 経由で 75 以上の LLM プロバイダーとネイティブモデルをサポート
    - Any editor — ターミナル UI、デスクトップアプリ、IDE 拡張を提供

    Usage:
    - アプリを開き、ブラウザで Web UI を使用。
    - 初回起動時に Add Project をクリックし、workspace（/home/opencode/workspace の Code ディレクトリ）を選択。ブラウザはこのプロジェクトを以降の訪問で記憶します（OpenCode Web は開いたプロジェクトを localStorage に保存）。
    - プロバイダーが未設定のとき、OpenCode は Olares Router を追加し default-chat を選びます。設定済みのプロバイダーは変更しません。ほかのプロバイダーと API キーは Web UI から追加できます。
    - コードワークスペースは /home/opencode/workspace にマウントされます（Home/Code ディレクトリにリンク）。
  upgradeDescription: |
    OpenCode は v1.19.3 のままです。パッケージの OverlayFS と Docker データディレクトリをノードローカルのキャッシュへ移し、複数ノードのクラスタで起動できるようにしました。JuiceFS は OverlayFS と Docker overlay2 に対応していないため、init-overlay が「Not supported」で終了していました。ホーム、設定、Code ワークスペースは共有ストレージのままです。単一ノードにあった overlay と Docker データは、現行 Docker が使う containerd のイメージストアを含めて、一度だけローカルキャッシュへコピーします。再起動時には JuiceFS 上に残った apk の一時インデックスを削除し、chown の失敗を防ぎます。apk のダウンロードキャッシュもノードローカルのディスクに置くため、複数ノードのクラスタでもパッケージをインストールできます。プロバイダーが未設定のとき、OpenCode は Olares Router を追加し default-chat を選びます。設定済みのプロバイダーは変更しません。

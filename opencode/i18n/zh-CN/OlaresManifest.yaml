metadata:
  title: OpenCode
  description: 开源 AI 编程助手
spec:
  fullDescription: |
    OpenCode 是一个开源代理，帮助你在终端、IDE 或桌面编写代码。

    - 支持 LSP，可为 LLM 自动加载合适的 LSP
    - 多会话，支持在同一项目中并行启动多个代理
    - 会话分享，可分享任意会话链接以供参考或调试
    - GitHub Copilot，支持通过 GitHub 登录以使用你的 Copilot 账号
    - ChatGPT Plus/Pro，支持通过 OpenAI 登录以使用 ChatGPT Plus 或 Pro 账号
    - 支持 75+ LLM 服务商和任意模型，基于 Models.dev，包括原生模型
    - 任何编辑器，支持终端界面、桌面应用和 IDE 扩展

    Usage:
    - 打开应用，在浏览器中使用 Web UI。
    - 首次打开时，点击「添加项目」并选择 workspace（Code 目录，路径为 /home/opencode/workspace）。浏览器会记住该项目，之后无需重复选择（OpenCode Web 将已打开项目保存在 localStorage）。
    - 在 Web UI 中配置你的 LLM 服务商和 API 密钥。
    - 你的代码工作区已挂载在 /home/opencode/workspace（链接到你的 Home/Code 目录）。
  upgradeDescription: |
    将 OpenCode 升级至 v1.18.31（beclab/opencode:1.18.31.1）。保留 nginx 容器内健康检查。Docker API 仅监听回环地址，显式配置 TLS 模式，并为启动检查预留初始化时间。
    https://github.com/anomalyco/opencode/releases/tag/v1.18.31

    上游更新要点（v1.18.19–v1.18.31）：改善 Qwen/OpenAI 兼容接口适配；改善网络重试及流式响应，响应头和分块超时默认五分钟；修复 ACP 会话选项与推理边界恢复；新增 Azure CLI / Microsoft Entra ID 登录并改善 Cloudflare AI Gateway 路由。

metadata:
  title: OpenCode
  description: 开源 AI 编程助手
spec:
  fullDescription: |
    OpenCode 是一个开源代理，帮助你在终端、IDE 或桌面编写代码。

    - 支持 LSP，可为 LLM 自动加载合适的 LSP
    - 多会话，支持在同一项目中并行启动多个代理
    - 会话分享，可分享任意会话链接以供参考或调试
    - GitHub Copilot，支持通过 GitHub 登录以使用你的 Copilot 账号
    - ChatGPT Plus/Pro，支持通过 OpenAI 登录以使用 ChatGPT Plus 或 Pro 账号
    - 支持 75+ LLM 服务商和任意模型，基于 Models.dev，包括原生模型
    - 任何编辑器，支持终端界面、桌面应用和 IDE 扩展

    Usage:
    - 打开应用，可直接在浏览器中使用 Web UI。
    - 在 Web UI 中配置你的 LLM 服务商和 API 密钥。
    - 你的代码工作区已挂载在 /home/opencode/workspace（链接到你的 Home/Code 目录）。
  upgradeDescription: |
    将 OpenCode 升级至 v1.18.9（`beclab/opencode:1.18.9.1`）。

    上游要点：恢复与旧版 MCP SDK 客户端的兼容；修复桌面端导航/会话列表问题；
    V2 桌面增强（sidecar、可折叠模型服务商分区）。

    同时将反向代理镜像从 Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）
    切换为官方 `openresty/openresty:1.29.2.5-bookworm-fat`，并同步 nginx 配置挂载与日志路径
    （`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）。

    完整发布说明：https://github.com/anomalyco/opencode/releases/tag/v1.18.9

    可选应用层 HTTP Basic Auth：`OPENCODE_SERVER_PASSWORD`（默认关闭；用户名
    `OPENCODE_SERVER_USERNAME`，默认 `opencode`）。

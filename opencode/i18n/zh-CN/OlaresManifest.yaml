metadata:
  title: OpenCode
  description: 开源 AI 编程助手
spec:
  fullDescription: |
    OpenCode 是一个开源代理，帮助你在终端、IDE 或桌面编写代码。

    - 支持 LSP，可为 LLM 自动加载合适的 LSP
    - 多会话，支持在同一项目中并行启动多个代理
    - 会话分享，可分享任意会话链接以供参考或调试
    - GitHub Copilot，支持通过 GitHub 登录以使用你的 Copilot 账号
    - ChatGPT Plus/Pro，支持通过 OpenAI 登录以使用 ChatGPT Plus 或 Pro 账号
    - 支持 75+ LLM 服务商和任意模型，基于 Models.dev，包括原生模型
    - 任何编辑器，支持终端界面、桌面应用和 IDE 扩展

    Usage:
    - 打开应用，在浏览器中使用 Web UI。
    - 首次打开时，点击「添加项目」并选择 workspace（Code 目录，路径为 /home/opencode/workspace）。浏览器会记住该项目，之后无需重复选择（OpenCode Web 将已打开项目保存在 localStorage）。
    - 在 Web UI 中配置你的 LLM 服务商和 API 密钥。
    - 你的代码工作区已挂载在 /home/opencode/workspace（链接到你的 Home/Code 目录）。
  upgradeDescription: |
    将 OpenCode 升级至 v1.18.16（`beclab/opencode:1.18.16.1`）。

    Olares：镜像预装 certbot（Let's Encrypt）；init-home 安装 `~/.local/bin/certbot`
    包装脚本，uid 1000 下可直接运行 `certbot`，无需手动传 `--config-dir`
    （状态目录在 `$HOME/.config/letsencrypt`）。

    Web UI：首次打开请选择「添加项目」→ workspace（`/home/opencode/workspace`），
    浏览器会记住该项目（上游 Web 仍将已打开项目保存在 localStorage）。

    上游要点（v1.18.10–v1.18.16）：忽略未知配置字段；从 Home 打开的项目自动注册；
    服务端搜索不可用时 Web UI 项目选择器会列出本地目录；Web UI 支持 blob 附件；
    消息按时间排序；更完整的国际化。

    可选应用层 HTTP Basic Auth：`OPENCODE_SERVER_PASSWORD` 行为不变（默认关闭；
    用户名 `OPENCODE_SERVER_USERNAME`，默认 `opencode`）。

    完整发布说明：https://github.com/anomalyco/opencode/releases/tag/v1.18.16

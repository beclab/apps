metadata:
  title: OpenCode
  description: 开源 AI 编程助手
spec:
  fullDescription: |
    OpenCode 是一个开源代理，帮助你在终端、IDE 或桌面编写代码。

    - 支持 LSP，可为 LLM 自动加载合适的 LSP
    - 多会话，支持在同一项目中并行启动多个代理
    - GitHub Copilot，支持通过 GitHub 登录以使用你的 Copilot 账号
    - ChatGPT Plus/Pro，支持通过 OpenAI 登录以使用 ChatGPT Plus 或 Pro 账号
    - 支持 75+ LLM 服务商和任意模型，基于 Models.dev，包括原生模型
    - 任何编辑器，支持终端界面、桌面应用和 IDE 扩展

    Usage:
    - 打开应用，在浏览器中使用 Web UI。
    - 首次打开时，点击「添加项目」并选择 workspace（Code 目录，路径为 /home/opencode/workspace）。浏览器会记住该项目，之后无需重复选择（OpenCode Web 将已打开项目保存在 localStorage）。
    - 如果尚未配置供应商，OpenCode 会自动加入 Olares Router 并选用 default-chat。已经配置过的供应商保持不变，仍可在 Web UI 中添加其他供应商和 API 密钥。
    - 你的代码工作区已挂载在 /home/opencode/workspace（链接到你的 Home/Code 目录）。
  upgradeDescription: |
    OpenCode 保持 v1.19.3。将软件包 OverlayFS 和 Docker 数据目录改到节点本地缓存，使应用可以在多节点集群启动。JuiceFS 不支持 OverlayFS 和 Docker overlay2，init-overlay 会因此以 “Not supported” 退出。主目录、设置和 Code 工作区仍在共享存储上。单节点上已有的 overlay 与 Docker 数据会一次性复制到本地缓存，包含当前 Docker 使用的 containerd 镜像存储。已拉取的 Docker 镜像会一起复制：几 GB 大约要几分钟，几十 GB 大约要几十分钟，复制完成前应用打不开。重启时会清掉 JuiceFS 上残留的 apk 临时索引，避免 chown 失败。apk 下载缓存也放在节点本地磁盘上，因此在多节点集群上可以安装软件包。如果尚未配置模型供应商，OpenCode 会自动加入 Olares Router 并选用 default-chat。已经配置过的供应商不会改动。

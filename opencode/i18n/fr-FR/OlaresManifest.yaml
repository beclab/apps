metadata:
  title: OpenCode
  description: L’agent de coding AI open source
spec:
  fullDescription: |
    OpenCode est un agent open-source qui vous aide à écrire du code dans le terminal, l’IDE ou le bureau.

    - Support LSPs pour charger automatiquement les LSP appropriés pour les LLM
    - Multi-session Lancez plusieurs agents en parallèle dans le même projet
    - GitHub Copilot Connectez-vous avec GitHub pour utiliser votre compte Copilot
    - ChatGPT Plus/Pro Connectez-vous avec OpenAI pour utiliser votre compte ChatGPT Plus ou Pro
    - Arbitrary Models prend en charge plus de 75 fournisseurs LLM avec Models.dev, y compris les modèles natifs
    - Any editor fournit des interfaces terminal, des applications bureau et des extensions IDE

    Usage :
    - Ouvrez l’app et utilisez la Web UI dans votre navigateur.
    - À la première ouverture, cliquez sur Add Project et choisissez workspace (votre répertoire Code à /home/opencode/workspace). Le navigateur mémorise ce projet pour les visites suivantes (OpenCode Web stocke les projets ouverts dans localStorage).
    - Si aucun fournisseur n'est configuré, OpenCode ajoute Olares Router et sélectionne default-chat. Une configuration existante n'est pas modifiée. D'autres fournisseurs et clés API peuvent toujours être ajoutés dans la Web UI.
    - Votre workspace de code est monté sur /home/opencode/workspace (lié à votre répertoire Home/Code).
  upgradeDescription: |
    OpenCode reste en v1.19.3. L'OverlayFS des paquets et le répertoire de données Docker passent sur le cache local du nœud, pour que l'application démarre dans un cluster à plusieurs nœuds. JuiceFS ne prend pas en charge OverlayFS ni overlay2 de Docker, ce qui faisait quitter init-overlay avec « Not supported ». Le répertoire personnel, les réglages et l'espace Code restent sur le stockage partagé. Un overlay et un stockage Docker déjà présents sur un nœud unique sont copiés une fois vers le cache local, y compris le dépôt d'images containerd des versions récentes de Docker. Les images Docker déjà téléchargées sont incluses : quelques Go prennent plusieurs minutes, quelques dizaines de Go plusieurs dizaines de minutes. L'application reste indisponible jusqu'à la fin. Au redémarrage, les fichiers temporaires d'index apk laissés sur JuiceFS sont supprimés pour que chown n'échoue plus. Le cache de téléchargement apk est sur le disque local du nœud, ce qui permet d'installer des paquets dans un cluster à plusieurs nœuds. Si aucun fournisseur n'est configuré, OpenCode ajoute Olares Router et sélectionne default-chat. Une configuration de fournisseur déjà présente n'est pas modifiée.

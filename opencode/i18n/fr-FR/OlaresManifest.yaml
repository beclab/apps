metadata:
  title: OpenCode
  description: L’agent de coding AI open source
spec:
  fullDescription: |
    OpenCode est un agent open-source qui vous aide à écrire du code dans le terminal, l’IDE ou le bureau.

    - Support LSPs pour charger automatiquement les LSP appropriés pour les LLM
    - Multi-session Lancez plusieurs agents en parallèle dans le même projet
    - GitHub Copilot Connectez-vous avec GitHub pour utiliser votre compte Copilot
    - ChatGPT Plus/Pro Connectez-vous avec OpenAI pour utiliser votre compte ChatGPT Plus ou Pro
    - Arbitrary Models prend en charge plus de 75 fournisseurs LLM avec Models.dev, y compris les modèles natifs
    - Any editor fournit des interfaces terminal, des applications bureau et des extensions IDE

    Usage :
    - Ouvrez l’app et utilisez la Web UI dans votre navigateur.
    - À la première ouverture, cliquez sur Add Project et choisissez workspace (votre répertoire Code à /home/opencode/workspace). Le navigateur mémorise ce projet pour les visites suivantes (OpenCode Web stocke les projets ouverts dans localStorage).
    - Configurez votre fournisseur LLM et vos clés API dans la Web UI.
    - Votre workspace de code est monté sur /home/opencode/workspace (lié à votre répertoire Home/Code).
  upgradeDescription: |
    Mise à niveau vers OpenCode v1.19.3 (beclab/opencode:1.19.3.0). Comprend la validation des connexions PTY, le masquage des données sensibles de débogage, des corrections de délais et des variantes de raisonnement configurables. Le partage de sessions, les liens existants et les imports depuis des URL de partage ne sont plus pris en charge. Les mises à jour habituelles restent sur 1.x ; OpenCode 2 nécessite un choix explicite de mise à niveau majeure.
    https://github.com/anomalyco/opencode/releases/tag/v1.19.3
    https://github.com/anomalyco/opencode/compare/v1.18.31...v1.19.3

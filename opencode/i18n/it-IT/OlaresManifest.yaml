metadata:
  title: OpenCode
  description: L’agente di coding AI open source
spec:
  fullDescription: |
    OpenCode è un agente open-source che ti aiuta a scrivere codice nel terminale, nell’IDE o sul desktop.

    - Support LSPs per caricare automaticamente gli LSP appropriati per gli LLM
    - Multi-session Avvia più agent in parallelo nello stesso progetto
    - Share Link Condividi qualsiasi link di sessione per riferimento o debug
    - GitHub Copilot Accedi con GitHub per usare il tuo account Copilot
    - ChatGPT Plus/Pro Accedi con OpenAI per usare il tuo account ChatGPT Plus o Pro
    - Arbitrary Models supporta oltre 75 provider LLM con Models.dev, inclusi modelli nativi
    - Any editor offre interfacce terminal, applicazioni desktop ed estensioni IDE

    Usage:
    - Apri l’app e usa la Web UI nel browser.
    - Alla prima apertura, fai clic su Add Project e scegli workspace (la tua directory Code in /home/opencode/workspace). Il browser ricorda questo progetto per le visite successive (OpenCode Web memorizza i progetti aperti in localStorage).
    - Configura il provider LLM e le chiavi API nella Web UI.
    - Il workspace del codice è montato in /home/opencode/workspace (collegato alla directory Home/Code).
  upgradeDescription: |
    Aggiornamento a OpenCode v1.18.31 (beclab/opencode:1.18.31.1). Controlli nginx locali mantenuti. API Docker limitata al loopback, modalità TLS esplicita e tempo di inizializzazione prima dei controlli di avvio.
    https://github.com/anomalyco/opencode/releases/tag/v1.18.31

    Novità upstream (v1.18.19–v1.18.31): migliore compatibilità Qwen/OpenAI; retry e streaming più affidabili con timeout di cinque minuti; ripristino delle opzioni ACP e dei limiti di ragionamento; accesso Azure CLI / Microsoft Entra ID e routing Cloudflare AI Gateway migliorato.

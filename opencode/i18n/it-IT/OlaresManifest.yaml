metadata:
  title: OpenCode
  description: L’agente di coding AI open source
spec:
  fullDescription: |
    OpenCode è un agente open-source che ti aiuta a scrivere codice nel terminale, nell’IDE o sul desktop.

    - Support LSPs per caricare automaticamente gli LSP appropriati per gli LLM
    - Multi-session Avvia più agent in parallelo nello stesso progetto
    - GitHub Copilot Accedi con GitHub per usare il tuo account Copilot
    - ChatGPT Plus/Pro Accedi con OpenAI per usare il tuo account ChatGPT Plus o Pro
    - Arbitrary Models supporta oltre 75 provider LLM con Models.dev, inclusi modelli nativi
    - Any editor offre interfacce terminal, applicazioni desktop ed estensioni IDE

    Usage:
    - Apri l’app e usa la Web UI nel browser.
    - Alla prima apertura, fai clic su Add Project e scegli workspace (la tua directory Code in /home/opencode/workspace). Il browser ricorda questo progetto per le visite successive (OpenCode Web memorizza i progetti aperti in localStorage).
    - Se non è configurato alcun provider, OpenCode aggiunge Olares Router e seleziona default-chat. Una configurazione esistente non viene modificata. Altri provider e chiavi API si possono aggiungere nella Web UI.
    - Il workspace del codice è montato in /home/opencode/workspace (collegato alla directory Home/Code).
  upgradeDescription: |
    OpenCode resta alla v1.19.3. L'OverlayFS dei pacchetti e la directory dati di Docker passano alla cache locale del nodo, così l'app si avvia in un cluster con più nodi. JuiceFS non supporta OverlayFS né overlay2 di Docker: init-overlay usciva con «Not supported». Home, impostazioni e l'area Code restano sullo storage condiviso. Un overlay e uno store Docker già presenti su un singolo nodo vengono copiati una volta sulla cache locale, compreso lo store delle immagini containerd usato dalle versioni attuali di Docker. Le immagini Docker già scaricate vengono copiate insieme: pochi GB richiedono alcuni minuti, alcune decine di GB alcune decine di minuti. L'app resta non disponibile fino al termine. Al riavvio vengono rimossi gli indici temporanei apk rimasti su JuiceFS, così chown non fallisce. La cache di download di apk resta sul disco locale del nodo, quindi i pacchetti si installano anche in un cluster con più nodi. Se non è configurato alcun provider, OpenCode aggiunge Olares Router e seleziona default-chat. Una configurazione di provider già presente non viene modificata.

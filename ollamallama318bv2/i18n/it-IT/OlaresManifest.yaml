metadata:
  title: Llama 3.1 8B (Ollama)
  description: Un nuovo modello all'avanguardia di Meta disponibile in dimensioni da 8B, 70B e 405B parametri

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **MODEL OVERVIEW**
    La collezione Meta Llama 3.1 di large language model (LLM) multilingue è una collezione di modelli generativi pretrained e instruction-tuned nelle dimensioni 8B, 70B e 405B (testo in/testo out). I modelli Llama 3.1 solo testo instruction-tuned (8B, 70B, 405B) sono ottimizzati per casi d'uso di dialogo multilingue e superano molti dei modelli chat open source e chiusi disponibili nei benchmark di settore comuni.

    **Models**
    Famiglia Llama 3.1 disponibile:
    - 8B
    - 70B
    - 405B

    Llama 3.1 405B è il primo modello apertamente disponibile che rivaleggia con i migliori modelli AI per capacità all'avanguardia in conoscenza generale, steerability, matematica, uso di tool e traduzione multilingue.
    Le versioni aggiornate dei modelli 8B e 70B sono multilingue e hanno una lunghezza di contesto significativamente maggiore di 128K, tool use all'avanguardia e capacità di ragionamento complessivamente più forti. Ciò consente agli ultimi modelli di Meta di supportare casi d'uso avanzati, come il riassunto di testi lunghi, agenti conversazionali multilingue e coding assistant.
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Aggiornamento dell'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

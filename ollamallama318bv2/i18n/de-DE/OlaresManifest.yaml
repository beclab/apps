metadata:
  title: Llama 3.1 8B (Ollama)
  description: Ein neues State-of-the-Art-Modell von Meta in den Parametergrößen 8B, 70B und 405B

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.

    **MODEL OVERVIEW**
    Die Meta Llama 3.1 Sammlung multilingualer Large Language Models (LLMs) umfasst vortrainierte und instruction-tuned generative Modelle in den Größen 8B, 70B und 405B (Text ein/Text aus). Die instruction-tuned Text-only-Modelle Llama 3.1 (8B, 70B, 405B) sind für mehrsprachige Dialoganwendungen optimiert und übertreffen viele verfügbare Open-Source- und geschlossene Chat-Modelle bei gängigen Branchen-Benchmarks.

    **Models**
    Llama 3.1 Familie verfügbar:
    - 8B
    - 70B
    - 405B

    Llama 3.1 405B ist das erste offen verfügbare Modell, das bei State-of-the-Art-Fähigkeiten in Allgemeinwissen, Steuerbarkeit, Mathematik, Tool-Nutzung und mehrsprachiger Übersetzung mit den besten KI-Modellen mithalten kann.
    Die aktualisierten Versionen der Modelle 8B und 70B sind mehrsprachig und haben eine deutlich längere Kontextlänge von 128K, State-of-the-Art Tool Use und insgesamt stärkere Reasoning-Fähigkeiten. Damit unterstützen Metas neueste Modelle fortgeschrittene Anwendungsfälle wie Langform-Textzusammenfassung, mehrsprachige Gesprächsagenten und Coding-Assistenten.
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.

    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

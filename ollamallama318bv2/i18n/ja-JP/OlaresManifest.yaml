metadata:
  title: Llama 3.1 8B (Ollama)
  description: Meta による新しい最先端モデル。8B・70B・405B パラメータサイズで利用可能

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **MODEL OVERVIEW**
    Meta Llama 3.1 の多言語大規模言語モデル（LLM）コレクションは、8B・70B・405B サイズ（テキスト入／テキスト出）の事前学習および instruction tuned 生成モデルの集まりです。Llama 3.1 の instruction tuned テキスト専用モデル（8B、70B、405B）は多言語対話用途向けに最適化され、一般的な業界ベンチマークで多くのオープンソースおよびクローズドなチャットモデルを上回ります。

    **Models**
    利用可能な Llama 3.1 ファミリー:
    - 8B
    - 70B
    - 405B

    Llama 3.1 405B は、一般知識、操舵性、数学、ツール利用、多言語翻訳における最先端能力でトップクラスの AI モデルに匹敵する、初めてのオープンに利用可能なモデルです。
    8B および 70B モデルのアップグレード版は多言語対応で、128K の大幅に長いコンテキスト長、最先端のツール利用、全体としてより強い推論能力を持ちます。これにより Meta 最新モデルは長文要約、多言語会話エージェント、コーディングアシスタントなどの高度な用途をサポートします。
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。

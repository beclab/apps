metadata:
  title: Llama 3.1 8B (Ollama)
  description: Un nouveau modèle à la pointe de Meta disponible en tailles 8B, 70B et 405B paramètres

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **MODEL OVERVIEW**
    La collection Meta Llama 3.1 de grands modèles de langage (LLMs) multilingues est une collection de modèles génératifs préentraînés et ajustés par instruction en tailles 8B, 70B et 405B (texte entrant/texte sortant). Les modèles Llama 3.1 texte uniquement ajustés par instruction (8B, 70B, 405B) sont optimisés pour les cas d'usage de dialogue multilingue et surpassent de nombreux modèles de chat open source et fermés disponibles sur les benchmarks industriels courants.

    **Models**
    Famille Llama 3.1 disponible :
    - 8B
    - 70B
    - 405B

    Llama 3.1 405B est le premier modèle ouvertement disponible qui rivalise avec les meilleurs modèles d'IA pour les capacités de pointe en connaissances générales, pilotabilité, mathématiques, utilisation d'outils et traduction multilingue.
    Les versions mises à niveau des modèles 8B et 70B sont multilingues et ont une longueur de contexte nettement plus longue de 128K, une utilisation d'outils de pointe et des capacités de raisonnement globalement plus fortes. Cela permet aux derniers modèles de Meta de prendre en charge des cas d'usage avancés, tels que le résumé de textes longs, les agents conversationnels multilingues et les assistants de codage.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé dans Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Mise à jour de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

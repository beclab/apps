metadata:
  title: Llama 3.1 8B (Ollama)
  description: Un nuevo modelo de última generación de Meta disponible en tamaños de 8B, 70B y 405B parámetros

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla mediante la app de referencia.

    **MODEL OVERVIEW**
    La colección Meta Llama 3.1 de modelos de lenguaje grandes (LLMs) multilingües es una colección de modelos generativos preentrenados y ajustados por instrucción en tamaños 8B, 70B y 405B (texto entrada/texto salida). Los modelos Llama 3.1 solo texto ajustados por instrucción (8B, 70B, 405B) están optimizados para casos de uso de diálogo multilingüe y superan a muchos de los modelos de chat open source y cerrados disponibles en benchmarks habituales de la industria.

    **Models**
    Familia Llama 3.1 disponible:
    - 8B
    - 70B
    - 405B

    Llama 3.1 405B es el primer modelo abiertamente disponible que rivaliza con los mejores modelos de IA en capacidades de vanguardia en conocimiento general, gobernabilidad, matemáticas, uso de herramientas y traducción multilingüe.
    Las versiones actualizadas de los modelos 8B y 70B son multilingües y tienen una longitud de contexto significativamente mayor de 128K, uso de herramientas de última generación y capacidades de razonamiento en general más fuertes. Esto permite que los últimos modelos de Meta admitan casos de uso avanzados, como resumen de texto largo, agentes conversacionales multilingües y asistentes de codificación.
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: "Qwen Image 2.1"
  description: "Qwen Image 2.1 erzeugt und bearbeitet Bilder aus Text oder bis zu zehn Referenzbildern"
spec:
  fullDescription: |
    Erzeugen Sie Bilder aus einer Beschreibung, oder fügen Sie bis zu zehn Bilder hinzu und erwähnen Sie sie im Prompt. Behalten Sie das Format des ersten Bildes bei, um es zu bearbeiten, oder wählen Sie ein Seitenverhältnis, um aus den Referenzen ein neues Bild zu erstellen, etwa eine Person aus einem Bild mit einem Produkt aus einem anderen. Übermalen Sie den zu ändernden Bereich, erweitern Sie die Leinwand oder entfernen Sie den Hintergrund eines beliebigen Ergebnisses. Ergebnisse, Uploads und die Warteschlange bleiben auf Ihrem Olares und sind auf jedem Gerät verfügbar, auf dem Sie die App öffnen.

    Die App führt das Modell auf Ihrem Olares aus, um Bilder zu erzeugen und zu bearbeiten:
    - Ein Prompt-Feld: Schreiben Sie eine Beschreibung zum Erzeugen, oder fügen Sie Bilder zum Bearbeiten hinzu und erwähnen Sie jedes im Prompt.
    - Bis zu zehn Bilder: Behalten Sie das Format des ersten Bildes bei, um es zu bearbeiten, oder wählen Sie ein Seitenverhältnis für ein neues Bild aus den Referenzen. Markieren Sie ein Bild als Person, Produkt oder Stil, um zu sagen, was davon erhalten bleiben soll.
    - KI-Optimierung erweitert Ihren Prompt mit dem offiziellen Prompt-Enhancer von Qwen Image 2.1, über ein Chat-Modell aus dem Router, das auch Ihre Bilder sieht. Das Modell wählen Sie in den Einstellungen.
    - Übermalen Sie den zu ändernden Bereich, erweitern Sie die Leinwand oder entfernen Sie den Hintergrund mit ein oder zwei Klicks.
    - Eine Warteschlange und ein Ergebnisraster, geteilt auf allen Geräten, mit Vorher-Nachher-Ansicht für jede Bearbeitung.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem jeweiligen Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.

    Für die KI-Optimierung muss eine Chat-Modell-App installiert und im Router verfügbar sein. Ihre Anweisungen sind der Prompt-Enhancer von Qwen-Image-2.1, wie er in den Workflow-Vorlagen von ComfyUI enthalten ist, unter der Qwen Research License.
  upgradeDescription: |
    Die Studio-Einstellungen unterscheiden jetzt zwischen „Bearbeiten“ und „Bearbeiten (schnell)“ und erklären, wie Sie vordefinierte Workflows in ComfyUI öffnen. Die Einstellungen für Benachrichtigungen zu Aufgabenergebnissen erklären, wann Hinweise erscheinen. Bei Bedarf zeigen sie, welche Browserberechtigungen oder Einrichtungsschritte erforderlich sind.
    Wenn Sie von einer benutzerspezifischen Installation aktualisieren, deinstallieren Sie die alte Version, bevor Sie die gemeinsam genutzte Version installieren.

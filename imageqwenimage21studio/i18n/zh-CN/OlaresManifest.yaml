metadata:
  title: "Qwen Image 2.1"
  description: "Qwen Image 2.1 可以从文字或最多十张参考图片生成和编辑图片"
spec:
  fullDescription: |
    根据描述生成图片，或添加最多十张图片并在提示词中提到它们。保持第一张图的比例就是编辑它；选一个画面比例，就用这些参考图生成一张新图，比如让一张图里的人物拿着另一张图里的商品。可以在任意结果上涂抹要修改的部分、扩展画布或去除背景。结果、上传的素材和队列都保存在你的 Olares 上，在任何设备上打开应用都能看到。

    这个应用在你的 Olares 上运行该模型，用来生成和编辑图片：
    - 一个输入框：写描述生成图片，或添加图片进行编辑，并在提示词中提到每张图片。
    - 最多添加十张图片：保持第一张图的比例就是编辑它，选一个画面比例就用参考图生成新图。可以把图片标为人物、商品或风格，说明要保留它的什么。
    - AI 优化使用 Qwen Image 2.1 官方的提示词增强指令扩写提示词，调用 Router 中的对话模型，模型也能看到你添加的图片。可在设置中选择模型。
    - 一两下就能涂抹要修改的区域、扩展画布或去除背景。
    - 队列和结果网格在所有设备上同步，每次编辑都能对比前后效果。
    - 上传的素材和生成结果保存在 Olares 的素材库中，重启后仍在。
    - 可以打开完整的 ComfyUI 编辑器，每个工作流都已载入，用于应用之外的修改。
    - 管理员安装一次，Olares 上的所有人都能用；每个人的队列、上传和结果各自独立，可以通过项目分享给指定的人或所有人。
    - 文件保存在 Common/Studio 下，每人一个文件夹。
    - 模型在首次启动时下载，并与其他 ComfyUI 应用和 FlowStudio 共享。

    AI 优化需要安装一个对话模型应用，并在 Router 中可用。它的指令来自 Qwen-Image-2.1 的提示词增强器（收录于 ComfyUI 的工作流模板），遵循 Qwen Research License。
  upgradeDescription: |
    Studio 设置现在区分「编辑」和「编辑（快速）」，并说明如何在 ComfyUI 中打开预设工作流。 任务结果通知设置会说明何时会收到提醒，并在需要时提示如何开启浏览器权限或完成设置。
    从旧版个人安装升级时，请先卸载旧版，再安装共享版本。

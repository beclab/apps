metadata:
  title: "Qwen Image 2.1"
  description: "Qwen Image 2.1 génère et modifie des images à partir de texte ou de jusqu'à dix images de référence"
spec:
  fullDescription: |
    Générez des images à partir d'une description, ou ajoutez jusqu'à dix images et mentionnez-les dans le prompt. Gardez le format de la première image pour la modifier, ou choisissez un format d'image pour composer une nouvelle image à partir des références, par exemple une personne d'une image tenant un produit d'une autre. Peignez sur la zone à changer, agrandissez la toile ou supprimez l'arrière-plan de n'importe quel résultat. Les résultats, les imports et la file d'attente restent sur votre Olares et sont partagés sur tous les appareils où vous ouvrez l'app.

    L'app exécute le modèle sur votre Olares pour générer et modifier des images :
    - Une seule zone de prompt : écrivez une description pour générer, ou ajoutez des images pour les modifier et mentionnez chacune dans le prompt.
    - Jusqu'à dix images : gardez le format de la première pour la modifier, ou choisissez un format d'image pour composer une nouvelle image à partir des références. Marquez une image comme personne, produit ou style pour indiquer ce qu'il faut en garder.
    - L'optimisation IA enrichit votre prompt avec l'amplificateur de prompts officiel de Qwen Image 2.1, via un modèle de chat de Router qui voit aussi les images ajoutées. Choisissez le modèle dans les réglages.
    - Peignez sur la zone à changer, agrandissez la toile ou supprimez l'arrière-plan en un ou deux clics.
    - Une file d'attente et une grille de résultats partagées sur tous les appareils, avec une vue avant/après pour chaque modification.
    - Les imports et les résultats restent dans une bibliothèque sur votre Olares, même après un redémarrage.
    - L'éditeur ComfyUI complet s'ouvre avec chaque workflow chargé, pour aller au-delà de l'app.
    - Un administrateur l'installe une seule fois pour tous sur votre Olares ; la file d'attente, les imports et les résultats de chacun lui restent propres, et les projets permettent de les partager avec certaines personnes ou avec tous.
    - Les fichiers sont conservés dans Common/Studio, dans un dossier par personne.
    - Les modèles sont téléchargés au premier démarrage et partagés avec les autres apps ComfyUI et FlowStudio.

    L'optimisation IA nécessite une app de modèle de chat installée et disponible dans Router. Ses instructions sont l'amplificateur de prompts de Qwen-Image-2.1, tel qu'inclus dans les modèles de workflows de ComfyUI, sous la Qwen Research License.
  upgradeDescription: |
    Les paramètres de Studio distinguent désormais les modes « Modifier » et « Modifier (rapide) » et expliquent comment ouvrir un workflow prédéfini dans ComfyUI. Les paramètres de notification des résultats précisent quand les alertes s’affichent. Si nécessaire, ils indiquent les autorisations du navigateur ou les étapes de configuration requises.
    Si vous effectuez une mise à jour depuis une installation individuelle, désinstallez l’ancienne version avant d’installer la version partagée.

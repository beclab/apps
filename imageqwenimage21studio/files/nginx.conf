# Studio chart, one entrance:
#   /             → /studio/
#   /studio/      the Studio front end (its own ConfigMap, flat files)
#   /studio/api/  the studio backend inside ComfyUI (comfy-ext), SSE unbuffered
#   /console/     llm-init comfyui mode on 127.0.0.1:8090 (model downloads)
#   /comfy/       ComfyUI on 127.0.0.1:8188, prefix stripped, WebSocket upgraded
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 512m;
    # Behind the Olares entrance; an absolute redirect would leak :8080.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = / { return 302 /studio/; }
    location = /studio { return 301 /studio/; }

    # Hashed build files never change; everything else is revalidated.
    location ~ "^/studio/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2|svg|png|webp)$" {
        gzip_static always;
        gunzip on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /studio/ {
        add_header Cache-Control "no-cache";
        try_files $uri /studio/index.html;
    }

    location /studio/api/ {
        proxy_pass http://127.0.0.1:8188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Studio-Edge 1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no;
    }

    location = /console { return 301 /console/; }
    location /console/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
    }

    location = /comfy { return 301 /comfy/; }
    location /comfy/ {
        proxy_pass http://127.0.0.1:8188/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Studio-Edge 1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

metadata:
  title: MTranServer
  description: Un serveur de traduction hors ligne haute performance avec des exigences de ressources minimales
spec:
  fullDescription: |
    MTranServer est un serveur de traduction hors ligne haute performance avec des exigences de ressources minimales.
    
    Il fonctionne sur CPU avec seulement 1 Go de mémoire, sans GPU. Temps de réponse moyen de 50 ms par requête. Prend en charge la traduction des principales langues mondiales.
    
    Qualité de traduction comparable à Google Translate.
    
    Note : Ce modèle privilégie la vitesse et le déploiement privé sur divers appareils ; la qualité de traduction n'égalera donc pas celle des grands modèles de langage. Pour une traduction de haute qualité, envisagez des API en ligne de grands modèles de langage.
    
    Les modèles de traduction sont téléchargés à l'installation depuis le bundle CDN Olares
    (`mtranserver_models.tar.zst`) via `downloader-init` et extraits dans
    `/app/models` avant le démarrage du serveur. Aucun jeton Hugging Face n'est requis.
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    Migration de MTranServer vers le modèle d'app partagée apiVersion v3 (mtranserverv2 → mtranserverv3).
    
    **Changements**
    
    - **Téléchargement du modèle** : bundle CDN `downloader-init` tar.zst inchangé ;
      pas de migration Hugging Face / llm-init.
    - **Routage Entrance** : le backup de l'upstream nginx envoie le trafic vers le tableau de bord de téléchargement
      jusqu'à ce que le moteur soit healthy ; `/translate` et `/languages` restent sur le moteur.
    - **Architecture** : aplatissement des sous-charts mtranserverv2 / mtranserverv2server
      en un seul chart ; les backends se résolvent dans le namespace de la release (plus de split `*-shared` admin / non-admin).
    - **Accelerator** : exigences CPU uniquement déclarées via les modes `accelerator`.
    - **Mise à l'échelle** : `workloadReplicas` déclare les workloads moteur et client nginx.
    - **Runtime** : image `xxnuo/mtranserver:4.0.33` (était `beclab/xxnuo-mtranserver:3.1.11` en v2).

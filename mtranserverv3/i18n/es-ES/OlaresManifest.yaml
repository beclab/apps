metadata:
  title: MTranServer
  description: Un servidor de traducción offline de alto rendimiento con requisitos mínimos de recursos
spec:
  fullDescription: |
    MTranServer es un servidor de traducción offline de alto rendimiento con requisitos mínimos de recursos.
    
    Se ejecuta en CPU con solo 1GB de memoria, sin necesidad de GPU. Tiempo de respuesta medio de 50ms por solicitud. Admite la traducción de los principales idiomas del mundo.
    
    Calidad de traducción comparable a Google Translate.
    
    Nota: Este modelo se centra en la velocidad y el despliegue privado en diversos dispositivos, por lo que la calidad de traducción no igualará la de los grandes modelos de lenguaje. Para traducción de alta calidad, considere APIs online de grandes modelos de lenguaje.
    
    Los modelos de traducción se descargan en la instalación desde el paquete CDN de Olares
    (`mtranserver_models.tar.zst`) mediante `downloader-init` y se extraen en
    `/app/models` antes de que arranque el servidor. No se requiere token de Hugging Face.
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    Migración de MTranServer al patrón de app compartida apiVersion v3 (mtranserverv2 → mtranserverv3).
    
    **Qué ha cambiado**
    
    - **Descarga del modelo**: se mantiene el paquete CDN `downloader-init` tar.zst sin cambios;
      sin migración a Hugging Face / llm-init.
    - **Enrutamiento de Entrance**: el backup del upstream nginx envía tráfico al panel de descarga
      hasta que el motor esté healthy; `/translate` y `/languages` se fijan al motor.
    - **Arquitectura**: se aplanaron los subcharts mtranserverv2 / mtranserverv2server
      en un solo chart; los backends se resuelven dentro del namespace del release (sin división `*-shared` admin / no-admin).
    - **Accelerator**: requisitos solo CPU declarados vía modos `accelerator`.
    - **Escalado**: `workloadReplicas` declara las cargas del motor y del cliente nginx.
    - **Runtime**: imagen `xxnuo/mtranserver:4.0.33` (era `beclab/xxnuo-mtranserver:3.1.11` en v2).

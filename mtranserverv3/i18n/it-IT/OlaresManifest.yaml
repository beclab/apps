metadata:
  title: MTranServer
  description: Un server di traduzione offline ad alte prestazioni con requisiti minimi di risorse
spec:
  fullDescription: |
    MTranServer è un server di traduzione offline ad alte prestazioni con requisiti minimi di risorse.
    
    Funziona su CPU con soli 1GB di memoria, nessuna GPU necessaria. Tempo di risposta medio di 50ms per richiesta. Supporta la traduzione delle principali lingue mondiali.
    
    Qualità di traduzione paragonabile a Google Translate.
    
    Nota: Questo modello punta su velocità e deployment privato su vari dispositivi, quindi la qualità di traduzione non eguaglierà quella dei grandi modelli linguistici. Per traduzioni di alta qualità, considerare API online di grandi modelli linguistici.
    
    I modelli di traduzione vengono scaricati in fase di installazione dal bundle CDN di Olares
    (`mtranserver_models.tar.zst`) tramite `downloader-init` ed estratti in
    `/app/models` prima dell'avvio del server. Non è richiesto alcun token Hugging Face.
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
    
    Migrazione di MTranServer al pattern di app condivisa apiVersion v3 (mtranserverv2 → mtranserverv3).
    
    **Cosa è cambiato**
    
    - **Download del modello**: mantenuto invariato il bundle CDN `downloader-init` tar.zst;
      nessuna migrazione a Hugging Face / llm-init.
    - **Routing Entrance**: il backup dell'upstream nginx invia il traffico alla dashboard di download
      finché il motore non è healthy; `/translate` e `/languages` restano sul motore.
    - **Architettura**: i sub-chart mtranserverv2 / mtranserverv2server sono stati appiattiti
      in un unico chart; i backend si risolvono nel namespace del release (niente più split `*-shared` admin / non-admin).
    - **Accelerator**: requisiti solo CPU dichiarati tramite modalità `accelerator`.
    - **Scaling**: `workloadReplicas` dichiara i workload del motore e del client nginx.
    - **Runtime**: immagine `xxnuo/mtranserver:4.0.33` (era `beclab/xxnuo-mtranserver:3.1.11` in v2).

metadata:
  title: MTranServer
  description: Ein leistungsstarker Offline-Übersetzungsserver mit minimalen Ressourcenanforderungen
spec:
  fullDescription: |
    MTranServer ist ein leistungsstarker Offline-Übersetzungsserver mit minimalen Ressourcenanforderungen.
    
    Er läuft auf der CPU mit nur 1GB Speicher, keine GPU erforderlich. Durchschnittliche Antwortzeit von 50ms pro Anfrage. Unterstützt die Übersetzung der wichtigsten Sprachen weltweit.
    
    Übersetzungsqualität vergleichbar mit Google Translate.
    
    Hinweis: Dieses Modell legt den Fokus auf Geschwindigkeit und privaten Einsatz auf verschiedenen Geräten; die Übersetzungsqualität entspricht daher nicht der von großen Sprachmodellen. Für hochwertige Übersetzungen erwägen Sie Online-APIs großer Sprachmodelle.
    
    Übersetzungsmodelle werden bei der Installation aus dem Olares-CDN-Bundle
    (`mtranserver_models.tar.zst`) über `downloader-init` heruntergeladen und vor dem Start des Servers nach
    `/app/models` extrahiert. Es ist kein Hugging-Face-Token erforderlich.
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    MTranServer auf das Shared-App-Muster apiVersion v3 migriert (mtranserverv2 → mtranserverv3).
    
    **Änderungen**
    
    - **Modell-Download**: CDN-`downloader-init`-tar.zst-Bundle unverändert beibehalten;
      keine Migration zu Hugging Face / llm-init.
    - **Entrance-Routing**: nginx-Upstream-Backup leitet Traffic an das Download-Dashboard,
      bis die Engine healthy ist; `/translate` und `/languages` bleiben bei der Engine.
    - **Architektur**: mtranserverv2- / mtranserverv2server-Subcharts zu einem Chart zusammengeführt;
      Backends werden im Release-Namespace aufgelöst (kein `*-shared`-Admin-/Nicht-Admin-Split mehr).
    - **Accelerator**: CPU-only-Ressourcenanforderungen über `accelerator`-Modi deklariert.
    - **Skalierung**: `workloadReplicas` deklariert Engine- und nginx-Client-Workloads.
    - **Runtime**: Image `xxnuo/mtranserver:4.0.33` (war `beclab/xxnuo-mtranserver:3.1.11` in v2).

metadata:
  title: MTranServer
  description: 最小限のリソース要件で動作する高性能オフライン翻訳サーバー
spec:
  fullDescription: |
    MTranServer は、最小限のリソース要件で動作する高性能オフライン翻訳サーバーです。
    
    GPU 不要で、1GB メモリの CPU だけで動作。リクエストあたり平均応答時間 50ms。世界の主要言語の翻訳に対応。
    
    翻訳品質は Google Translate に匹敵。
    
    注: 本モデルは速度と各種デバイスでのプライベート展開に重点を置くため、翻訳品質は大規模言語モデルには及びません。高品質な翻訳にはオンラインの大規模言語モデル API の利用を検討してください。
    
    翻訳モデルはインストール時に Olares CDN バンドル
    （`mtranserver_models.tar.zst`）から `downloader-init` 経由でダウンロードされ、サーバー起動前に
    `/app/models` へ展開されます。Hugging Face トークンは不要です。
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    MTranServer を apiVersion v3 の共有アプリパターンへ移行（mtranserverv2 → mtranserverv3）。
    
    **変更点**
    
    - **モデルダウンロード**: CDN の `downloader-init` tar.zst バンドルは変更なし;
      Hugging Face / llm-init への移行なし。
    - **Entrance ルーティング**: エンジンが healthy になるまで nginx upstream バックアップがダウンロードダッシュボードへ転送;
      `/translate` と `/languages` はエンジンに固定。
    - **アーキテクチャ**: mtranserverv2 / mtranserverv2server サブチャートを単一チャートに平坦化;
      バックエンドはリリース名前空間内で解決（`*-shared` の admin / 非 admin 分割を廃止）。
    - **Accelerator**: `accelerator` モードで CPU 専用リソース要件を宣言。
    - **スケーリング**: `workloadReplicas` でエンジンと nginx クライアントのワークロードを宣言。
    - **Runtime**: イメージ `xxnuo/mtranserver:4.0.33`（v2 では `beclab/xxnuo-mtranserver:3.1.11`）。

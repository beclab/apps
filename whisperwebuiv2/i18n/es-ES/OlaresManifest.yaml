metadata:
  title: Whisper-WebUI
  description: Una interfaz web para subtítulos fáciles con el modelo whisper
spec:
  fullDescription: |    
    Una interfaz de navegador basada en Gradio para Whisper. ¡Úsala como un generador sencillo de subtítulos!

    **Funciones**
    Elige la implementación de Whisper que quieras usar entre:
    - openai/whisper
    - SYSTRAN/faster-whisper (usada por defecto)
    - Vaibhavs10/insanely-fast-whisper

    Genera subtítulos desde varias fuentes, incluyendo:
    - Archivos
    - Youtube
    - Micrófono
    
    Formatos de subtítulos admitidos actualmente:
    - SRT
    - WebVTT
    - txt (solo archivo de texto sin línea de tiempo)
    
    Speech to Text Translation
    - De otros idiomas al inglés. (Función de traducción speech-to-text de extremo a extremo de Whisper)
    
    Text to Text Translation
    - Traducir archivos de subtítulos con modelos Facebook NLLB
    - Traducir archivos de subtítulos con la API de DeepL
    
    Preprocesar la entrada de audio con Silero VAD.
    
    Preprocesar la entrada de audio para separar BGM con UVR.
    
    Postprocesado con diarización de hablantes usando el modelo pyannote

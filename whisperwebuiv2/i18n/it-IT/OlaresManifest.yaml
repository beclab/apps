metadata:
  title: Whisper-WebUI
  description: Una Web UI per sottotitoli semplici con il modello whisper
spec:
  fullDescription: |    
    Un’interfaccia browser basata su Gradio per Whisper. Usala come Easy Subtitle Generator!

    **Funzionalità**
    Seleziona l’implementazione Whisper da usare tra:
    - openai/whisper
    - SYSTRAN/faster-whisper (usata di default)
    - Vaibhavs10/insanely-fast-whisper

    Genera sottotitoli da varie fonti, tra cui:
    - File
    - Youtube
    - Microfono
    
    Formati sottotitoli attualmente supportati:
    - SRT
    - WebVTT
    - txt (solo file di testo senza timeline)
    
    Speech to Text Translation
    - Da altre lingue all’inglese. (Funzione di traduzione speech-to-text end-to-end di Whisper)
    
    Text to Text Translation
    - Traduci file sottotitoli con i modelli Facebook NLLB
    - Traduci file sottotitoli con l’API DeepL
    
    Pre-elaborazione dell’audio in ingresso con Silero VAD.
    
    Pre-elaborazione dell’audio in ingresso per separare il BGM con UVR.
    
    Post-elaborazione con speaker diarization usando il modello pyannote

metadata:
  title: Whisper-WebUI
  description: Eine Web-UI für einfache Untertitel mit dem Whisper-Modell
spec:
  fullDescription: |    
    Eine Gradio-basierte Browseroberfläche für Whisper. Nutzen Sie sie als einfachen Untertitel-Generator!

    **Funktionen**
    Wählen Sie die gewünschte Whisper-Implementierung:
    - openai/whisper
    - SYSTRAN/faster-whisper (Standard)
    - Vaibhavs10/insanely-fast-whisper

    Untertitel aus verschiedenen Quellen erzeugen, darunter:
    - Dateien
    - Youtube
    - Mikrofon
    
    Derzeit unterstützte Untertitelformate:
    - SRT
    - WebVTT
    - txt (nur Textdatei ohne Zeitachse)
    
    Speech to Text Translation
    - Von anderen Sprachen nach Englisch. (Dies ist Whispers End-to-End Speech-to-Text-Übersetzungsfunktion)
    
    Text to Text Translation
    - Untertiteldateien mit Facebook-NLLB-Modellen übersetzen
    - Untertiteldateien mit der DeepL API übersetzen
    
    Audio-Eingabe mit Silero VAD vorverarbeiten.
    
    Audio-Eingabe mit UVR vorverarbeiten, um BGM zu trennen.
    
    Nachverarbeitung mit Speaker Diarization über das pyannote-Modell

metadata:
  title: Whisper-WebUI
  description: whisper モデルで簡単に字幕を作成する Web UI
spec:
  fullDescription: |    
    Whisper 向けの Gradio ベースのブラウザ UI。Easy Subtitle Generator として使えます！

    **機能**
    使用する Whisper 実装を選択:
    - openai/whisper
    - SYSTRAN/faster-whisper（デフォルト）
    - Vaibhavs10/insanely-fast-whisper

    次を含むさまざまなソースから字幕を生成:
    - ファイル
    - Youtube
    - マイク
    
    現在対応の字幕フォーマット:
    - SRT
    - WebVTT
    - txt（タイムラインなしのテキストのみ）
    
    Speech to Text Translation
    - 他言語から英語へ。（Whisper のエンドツーエンド speech-to-text 翻訳機能）
    
    Text to Text Translation
    - Facebook NLLB モデルで字幕ファイルを翻訳
    - DeepL API で字幕ファイルを翻訳
    
    Silero VAD で音声入力を前処理。
    
    UVR で BGM を分離する音声入力の前処理。
    
    pyannote モデルによる話者ダイアライゼーションの後処理

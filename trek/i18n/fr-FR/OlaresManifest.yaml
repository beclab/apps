metadata:
  title: TREK
  description: Un planificateur de voyage collaboratif en temps réel et auto-hébergé
spec:
  upgradeDescription: |
    Mettre à niveau TREK vers 4.2.1 (`mauriceboe/trek:4.2.1`).

    Saut majeur depuis 2.9.12 (plugins, collections, hors-ligne, sécurité). 4.2.1 est un correctif sans changement de schéma de 4.2.0.

    Détails : https://github.com/mauriceboe/TREK/releases/tag/v4.2.1
  fullDescription: |
    TREK (anciennement connu sous le nom de Nomad) est un planificateur de voyage collaboratif en temps réel et auto-hébergé, avec cartes interactives, budgets, listes de bagages et plus.
    
    **FONCTIONNALITÉS**
    
    **Trip Planning**
    - Drag & Drop Planner : Organisez les lieux en plans journaliers avec réordonnancement et déplacements entre jours
    - Interactive Map : Carte Leaflet avec marqueurs photo, clustering, visualisation d'itinéraires et sources de tuiles personnalisables
    - Place Search : Recherche via Google Places (avec photos, notes, horaires) ou OpenStreetMap (gratuit, sans clé API)
    - Day Notes : Ajoutez des notes horodatées et marquées d'icônes aux jours individuels avec réordonnancement glisser-déposer
    - Route Optimization : Optimisez automatiquement l'ordre des lieux et exportez vers Google Maps
    - Weather Forecasts : Prévisions sur 16 jours via Open-Meteo (sans clé API) avec moyennes climatiques historiques en secours
    - Map Category Filter : Filtrez les lieux par catégorie et ne voyez que les épingles correspondantes sur la carte
    
    **Travel Management**
    - Reservations & Bookings : Suivez vols, hébergements, restaurants avec statut, numéros de confirmation et pièces jointes
    - Budget Tracking : Dépenses par catégorie avec diagramme circulaire, répartition par personne/par jour et support multi-devises
    - Packing Lists : Listes de contrôle par catégorie avec attribution d'utilisateurs, modèles de packing et suivi de progression
    - Packing Templates : Créez des modèles de packing réutilisables dans le panneau admin avec catégories et éléments
    - Bag Tracking : Suivi optionnel du poids et attribution de sacs pour les éléments de packing
    - Document Manager : Joignez documents, billets et PDF aux voyages, lieux ou réservations (jusqu'à 50 Mo par fichier)
    - PDF Export : Exportez des plans de voyage complets en PDF avec page de couverture, images, notes et branding
    
    **Collaboration**
    - Real-Time Sync : Planifiez ensemble via WebSocket ; les changements apparaissent instantanément pour tous les utilisateurs connectés
    - Multi-User : Invitez des membres à collaborer sur des voyages partagés avec accès basé sur les rôles
    - Invite Links : Créez des liens d'inscription à usage unique avec usages max et expiration configurables
    - Single Sign-On (OIDC) : Connexion avec Google, Apple, Authentik, Keycloak ou tout fournisseur OIDC
    - Two-Factor Authentication (MFA) : 2FA basée sur TOTP avec configuration par QR code
    - Collab : Discutez avec votre groupe, partagez des notes, créez des sondages et suivez les activités
    
    **Mobile & PWA**
    - Progressive Web App : Installez sur iOS et Android depuis le navigateur
    - Offline Support : Le Service Worker met en cache tuiles de carte, données API, téléversements et assets statiques via Workbox
    - Touch Optimized : Design responsive avec layouts spécifiques mobile et contrôles tactiles
    
    **Addons (modulaires, activables par l'admin)**
    - Vacay : Planificateur personnel de jours de vacances avec vue calendrier, jours fériés (100+ pays) et suivi du report
    - Atlas : Carte du monde interactive avec pays visités, bucket list, statistiques de voyage et suivi des séries
    - Collab : Discutez avec votre groupe, partagez des notes, créez des sondages
    - Dashboard Widgets : Convertisseur de devises et horloge des fuseaux horaires, activables par utilisateur

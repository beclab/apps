metadata:
  title: TREK
  description: Ein selbst gehosteter, Echtzeit-kollaborativer Reiseplaner
spec:
  upgradeDescription: |
    TREK auf 4.2.1 (`mauriceboe/trek:4.2.1`) aktualisieren.

    Großer Sprung von 2.9.12 (Plugins, Collections, Offline, Security). 4.2.1 ist ein Patch ohne Schemaänderung zu 4.2.0.

    Details: https://github.com/mauriceboe/TREK/releases/tag/v4.2.1
  fullDescription: |
    TREK (früher bekannt als Nomad) ist ein selbst gehosteter, Echtzeit-kollaborativer Reiseplaner mit interaktiven Karten, Budgets, Packlisten und mehr.
    
    **FUNKTIONEN**
    
    **Trip Planning**
    - Drag & Drop Planner: Orte in Tagespläne organisieren mit Neuordnung und tagesübergreifenden Verschiebungen
    - Interactive Map: Leaflet-Karte mit Fotomarkern, Clustering, Routenvisualisierung und anpassbaren Kachelquellen
    - Place Search: Suche über Google Places (mit Fotos, Bewertungen, Öffnungszeiten) oder OpenStreetMap (kostenlos, kein API-Schlüssel nötig)
    - Day Notes: Zeitgestempelte, icon-markierte Notizen zu einzelnen Tagen mit Drag & Drop-Neuordnung hinzufügen
    - Route Optimization: Reihenfolge der Orte automatisch optimieren und nach Google Maps exportieren
    - Weather Forecasts: 16-Tage-Vorhersagen über Open-Meteo (kein API-Schlüssel nötig) mit historischen Klimadurchschnitten als Fallback
    - Map Category Filter: Orte nach Kategorie filtern und nur passende Pins auf der Karte sehen
    
    **Travel Management**
    - Reservations & Bookings: Flüge, Unterkünfte, Restaurants mit Status, Bestätigungsnummern und Dateianhängen verfolgen
    - Budget Tracking: Kategoriebasierte Ausgaben mit Tortendiagramm, Aufteilung pro Person/pro Tag und Multi-Währungs-Unterstützung
    - Packing Lists: Kategoriebasierte Checklisten mit Nutzerzuweisung, Packvorlagen und Fortschrittsverfolgung
    - Packing Templates: Wiederverwendbare Packvorlagen im Admin-Panel mit Kategorien und Items erstellen
    - Bag Tracking: Optionale Gewichtsverfolgung und Taschenzuweisung für Packitems
    - Document Manager: Dokumente, Tickets und PDFs an Reisen, Orte oder Reservierungen anhängen (bis 50 MB pro Datei)
    - PDF Export: Vollständige Reisepläne als PDF mit Titelseite, Bildern, Notizen und Branding exportieren
    
    **Collaboration**
    - Real-Time Sync: Gemeinsam planen über WebSocket, Änderungen erscheinen sofort bei allen verbundenen Nutzern
    - Multi-User: Mitglieder einladen, an gemeinsamen Reisen mit rollenbasiertem Zugriff zu arbeiten
    - Invite Links: Einmalige Registrierungslinks mit konfigurierbarer max. Nutzung und Ablauf erstellen
    - Single Sign-On (OIDC): Login mit Google, Apple, Authentik, Keycloak oder jedem OIDC-Anbieter
    - Two-Factor Authentication (MFA): TOTP-basierte 2FA mit QR-Code-Einrichtung
    - Collab: Mit Ihrer Gruppe chatten, Notizen teilen, Umfragen erstellen und Aktivitäten verfolgen
    
    **Mobile & PWA**
    - Progressive Web App: Auf iOS und Android aus dem Browser installieren
    - Offline Support: Service Worker cached Kacheln, API-Daten, Uploads und statische Assets über Workbox
    - Touch Optimized: Responsives Design mit mobilspezifischen Layouts und touchfreundlichen Steuerelementen
    
    **Addons (modular, admin-umschaltbar)**
    - Vacay: Persönlicher Urlaubstagesplaner mit Kalenderansicht, Feiertagen (100+ Länder) und Übertragsverfolgung
    - Atlas: Interaktive Weltkarte mit besuchten Ländern, Bucket List, Reisestatistiken und Streak-Tracking
    - Collab: Mit Ihrer Gruppe chatten, Notizen teilen, Umfragen erstellen
    - Dashboard Widgets: Währungsumrechner und Zeitzonen-Uhr, pro Nutzer umschaltbar

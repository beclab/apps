metadata:
  title: TREK
  description: Un pianificatore di viaggi collaborativo in tempo reale e self-hosted
spec:
  upgradeDescription: |
    Aggiornare TREK a 4.3.4 (`mauriceboe/trek:4.3.4`).

    4.3.4 ricompila 4.3.3 con le patch di sicurezza Node.js di ottobre 2026 e non cambia lo schema. Dalla 4.2.1, le versioni 4.3.0–4.3.3 aggiungono la ricerca TREK Places (places.liketrek.com salvo TREK_PLACES_ENABLED=false), il pianificatore road trip e migrazioni SQLite automatiche all'avvio. Le directory dati e upload restano /app/data e /app/uploads.

    Dettagli: https://github.com/liketrek/TREK/releases/tag/v4.3.4
  fullDescription: |
    TREK (precedentemente noto come Nomad) è un pianificatore di viaggi collaborativo in tempo reale e self-hosted, con mappe interattive, budget, packing list e altro.
    
    **FUNZIONALITÀ**
    
    **Trip Planning**
    - Drag & Drop Planner: Organizza i luoghi in piani giornalieri con riordino e spostamenti tra giorni
    - Interactive Map: Mappa Leaflet con marker fotografici, clustering, visualizzazione percorsi e fonti tile personalizzabili
    - Place Search: Cerca tramite Google Places (con foto, valutazioni, orari) o OpenStreetMap (gratis, senza chiave API)
    - Day Notes: Aggiungi note con timestamp e icone ai singoli giorni con riordino drag & drop
    - Route Optimization: Ottimizza automaticamente l'ordine dei luoghi ed esporta su Google Maps
    - Weather Forecasts: Previsioni a 16 giorni via Open-Meteo (senza chiave API) con medie climatiche storiche come fallback
    - Map Category Filter: Filtra i luoghi per categoria e vedi solo i pin corrispondenti sulla mappa
    
    **Travel Management**
    - Reservations & Bookings: Traccia voli, alloggi, ristoranti con stato, numeri di conferma e allegati
    - Budget Tracking: Spese per categoria con grafico a torta, suddivisione per persona/per giorno e supporto multi-valuta
    - Packing Lists: Checklist per categoria con assegnazione utenti, template di packing e monitoraggio progressi
    - Packing Templates: Crea template di packing riutilizzabili nel pannello admin con categorie e voci
    - Bag Tracking: Tracciamento opzionale del peso e assegnazione borse per gli elementi del packing
    - Document Manager: Allega documenti, biglietti e PDF a viaggi, luoghi o prenotazioni (fino a 50 MB per file)
    - PDF Export: Esporta piani di viaggio completi in PDF con copertina, immagini, note e branding
    
    **Collaboration**
    - Real-Time Sync: Pianificate insieme via WebSocket; le modifiche appaiono istantaneamente per tutti gli utenti connessi
    - Multi-User: Invita membri a collaborare su viaggi condivisi con accesso basato sui ruoli
    - Invite Links: Crea link di registrazione monouso con usi massimi e scadenza configurabili
    - Single Sign-On (OIDC): Accedi con Google, Apple, Authentik, Keycloak o qualsiasi provider OIDC
    - Two-Factor Authentication (MFA): 2FA basata su TOTP con setup tramite QR code
    - Collab: Chatta con il gruppo, condividi note, crea sondaggi e traccia le attività
    
    **Mobile & PWA**
    - Progressive Web App: Installa su iOS e Android dal browser
    - Offline Support: Il Service Worker memorizza in cache tile della mappa, dati API, upload e asset statici via Workbox
    - Touch Optimized: Design responsive con layout specifici per mobile e controlli touch-friendly
    
    **Addons (modulari, attivabili dall'admin)**
    - Vacay: Pianificatore personale dei giorni di ferie con vista calendario, festività (100+ paesi) e tracciamento del riporto
    - Atlas: Mappa mondiale interattiva con paesi visitati, bucket list, statistiche di viaggio e streak tracking
    - Collab: Chatta con il gruppo, condividi note, crea sondaggi
    - Dashboard Widgets: Convertitore di valuta e orologio dei fusi orari, attivabili per utente

metadata:
  title: TREK
  description: セルフホスト型のリアルタイム共同旅行プランナー
spec:
  upgradeDescription: |
    TREK を 4.2.1（`mauriceboe/trek:4.2.1`）へ。

    2.9.12 からの大幅アップ（プラグイン、コレクション、オフライン、セキュリティ）。4.2.1 は 4.2.0 のスキーマ変更なしパッチです。

    詳細: https://github.com/mauriceboe/TREK/releases/tag/v4.2.1
  fullDescription: |
    TREK（旧称 Nomad）は、インタラクティブマップ、予算、パッキングリストなどを備えたセルフホスト型のリアルタイム共同旅行プランナーです。
    
    **機能**
    
    **Trip Planning**
    - Drag & Drop Planner: 場所を日別プランに整理し、並べ替えや日をまたぐ移動に対応
    - Interactive Map: 写真マーカー、クラスタリング、ルート可視化、カスタマイズ可能なタイルソース付き Leaflet マップ
    - Place Search: Google Places（写真・評価・営業時間付き）または OpenStreetMap（無料、API キー不要）で検索
    - Day Notes: タイムスタンプとアイコン付きのメモを各日に追加し、ドラッグ＆ドロップで並べ替え
    - Route Optimization: 場所の順序を自動最適化し Google Maps へエクスポート
    - Weather Forecasts: Open-Meteo による 16 日予報（API キー不要）、フォールバックとして過去の気候平均
    - Map Category Filter: カテゴリで場所を絞り込み、一致するピンだけを地図上に表示
    
    **Travel Management**
    - Reservations & Bookings: フライト、宿泊、レストランをステータス、確認番号、添付ファイル付きで追跡
    - Budget Tracking: 円グラフ付きカテゴリ別支出、人／日ごとの分割、多通貨対応
    - Packing Lists: ユーザー割当、パッキングテンプレート、進捗追跡付きのカテゴリ別チェックリスト
    - Packing Templates: 管理パネルでカテゴリとアイテム付きの再利用可能なパッキングテンプレートを作成
    - Bag Tracking: パッキングアイテムの任意の重量追跡とバッグ割当
    - Document Manager: 旅行・場所・予約に文書、チケット、PDF を添付（ファイルあたり最大 50 MB）
    - PDF Export: 表紙、画像、メモ、ブランディング付きで完全な旅行計画を PDF エクスポート
    
    **Collaboration**
    - Real-Time Sync: WebSocket で一緒に計画、変更は接続中の全ユーザーに即座に反映
    - Multi-User: ロールベースアクセスで共有旅行への共同作業にメンバーを招待
    - Invite Links: 最大使用回数と有効期限を設定可能なワンタイム登録リンクを作成
    - Single Sign-On (OIDC): Google、Apple、Authentik、Keycloak、または任意の OIDC プロバイダーでログイン
    - Two-Factor Authentication (MFA): QR コード設定付き TOTP ベース 2FA
    - Collab: グループでチャット、メモ共有、投票作成、アクティビティ追跡
    
    **Mobile & PWA**
    - Progressive Web App: ブラウザから iOS と Android にインストール
    - Offline Support: Service Worker が Workbox 経由で地図タイル、API データ、アップロード、静的アセットをキャッシュ
    - Touch Optimized: モバイル専用レイアウトとタッチフレンドリーな操作のレスポンシブデザイン
    
    **Addons（モジュール式、管理者が切り替え可能）**
    - Vacay: カレンダー表示、祝日（100 か国以上）、繰り越し追跡付きの個人休暇日プランナー
    - Atlas: 訪問国、バケットリスト、旅行統計、連続記録追跡付きのインタラクティブ世界地図
    - Collab: グループでチャット、メモ共有、投票作成
    - Dashboard Widgets: 通貨換算とタイムゾーン時計、ユーザーごとに切り替え可能

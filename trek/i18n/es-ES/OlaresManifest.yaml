metadata:
  title: TREK
  description: Un planificador de viajes colaborativo en tiempo real y autoalojado
spec:
  upgradeDescription: |
    Actualizar TREK a 4.2.1 (`mauriceboe/trek:4.2.1`).

    Salto mayor desde 2.9.12 (plugins, colecciones, offline, seguridad). 4.2.1 es un parche sin cambio de esquema sobre 4.2.0.

    Detalles: https://github.com/mauriceboe/TREK/releases/tag/v4.2.1
  fullDescription: |
    TREK (antes conocido como Nomad) es un planificador de viajes colaborativo en tiempo real y autoalojado, con mapas interactivos, presupuestos, listas de equipaje y más.
    
    **FUNCIONES**
    
    **Trip Planning**
    - Drag & Drop Planner: Organiza lugares en planes diarios con reordenación y movimientos entre días
    - Interactive Map: Mapa Leaflet con marcadores de fotos, clustering, visualización de rutas y fuentes de teselas personalizables
    - Place Search: Busca vía Google Places (con fotos, valoraciones, horarios) u OpenStreetMap (gratis, sin clave API)
    - Day Notes: Añade notas con marca de tiempo e iconos a días individuales con reordenación por arrastrar y soltar
    - Route Optimization: Optimiza automáticamente el orden de los lugares y exporta a Google Maps
    - Weather Forecasts: Pronósticos de 16 días vía Open-Meteo (sin clave API) con promedios climáticos históricos como respaldo
    - Map Category Filter: Filtra lugares por categoría y ve solo los pines coincidentes en el mapa
    
    **Travel Management**
    - Reservations & Bookings: Seguimiento de vuelos, alojamientos y restaurantes con estado, números de confirmación y archivos adjuntos
    - Budget Tracking: Gastos por categoría con gráfico circular, reparto por persona/por día y soporte multi-divisa
    - Packing Lists: Listas de verificación por categoría con asignación de usuarios, plantillas de empaquetado y seguimiento del progreso
    - Packing Templates: Crea plantillas de empaquetado reutilizables en el panel de admin con categorías e ítems
    - Bag Tracking: Seguimiento opcional de peso y asignación de bolsas para ítems de equipaje
    - Document Manager: Adjunta documentos, billetes y PDFs a viajes, lugares o reservas (hasta 50 MB por archivo)
    - PDF Export: Exporta planes de viaje completos como PDF con portada, imágenes, notas y branding
    
    **Collaboration**
    - Real-Time Sync: Planifica juntos vía WebSocket; los cambios aparecen al instante en todos los usuarios conectados
    - Multi-User: Invita a miembros a colaborar en viajes compartidos con acceso basado en roles
    - Invite Links: Crea enlaces de registro de un solo uso con usos máximos y caducidad configurables
    - Single Sign-On (OIDC): Inicia sesión con Google, Apple, Authentik, Keycloak o cualquier proveedor OIDC
    - Two-Factor Authentication (MFA): 2FA basada en TOTP con configuración por código QR
    - Collab: Chatea con tu grupo, comparte notas, crea encuestas y sigue actividades
    
    **Mobile & PWA**
    - Progressive Web App: Instálala en iOS y Android desde el navegador
    - Offline Support: El Service Worker almacena en caché teselas del mapa, datos de API, subidas y assets estáticos vía Workbox
    - Touch Optimized: Diseño responsive con layouts específicos para móvil y controles táctiles
    
    **Addons (modulares, activables por el admin)**
    - Vacay: Planificador personal de días de vacaciones con vista de calendario, festivos (más de 100 países) y seguimiento de arrastre
    - Atlas: Mapa mundial interactivo con países visitados, bucket list, estadísticas de viaje y seguimiento de rachas
    - Collab: Chatea con tu grupo, comparte notas, crea encuestas
    - Dashboard Widgets: Conversor de divisas y reloj de zonas horarias, activables por usuario

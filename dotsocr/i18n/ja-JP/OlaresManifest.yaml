metadata:
  title: dots.ocr
  description: "レイアウトを理解する多言語の文書文字認識"

spec:
  fullDescription: |
    dots.ocrは、ページのレイアウトと読み順を解析しながら、文書画像やPDFページからテキストを抽出します。多言語モデルが文字、表、数式を認識し、文書ページを再利用できるコンテンツに変換します。

    このアプリは、dots.ocrのQ8版を対応するOlaresアプリに提供します。対応するNVIDIA GPUが必要です。複雑なレイアウト、表、数式の認識結果は、手作業での確認が必要になる場合があります。

metadata:
  title: dots.ocr
  description: "Mehrsprachige Texterkennung für Dokumente mit Layoutanalyse"

spec:
  fullDescription: |
    dots.ocr extrahiert Text aus Dokumentbildern und PDF-Seiten und analysiert dabei das Seitenlayout und die Lesereihenfolge. Das mehrsprachige Modell erkennt Text, Tabellen und Formeln, um Dokumentseiten in wiederverwendbare Inhalte umzuwandeln.

    Diese App stellt die Q8-Version von dots.ocr für kompatible Olares-Anwendungen bereit. Sie benötigt eine unterstützte NVIDIA-GPU. Komplexe Layouts, Tabellen und Formeln können eine manuelle Prüfung erfordern.

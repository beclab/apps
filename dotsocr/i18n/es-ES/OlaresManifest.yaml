metadata:
  title: dots.ocr
  description: "Reconocimiento multilingüe de texto en documentos con análisis del diseño"

spec:
  fullDescription: |
    dots.ocr extrae texto de imágenes de documentos y páginas PDF e interpreta el diseño de la página y el orden de lectura. Su modelo multilingüe reconoce texto, tablas y fórmulas para convertir las páginas en contenido reutilizable.

    Esta aplicación ofrece la versión Q8 de dots.ocr a las aplicaciones Olares compatibles. Requiere una GPU NVIDIA compatible. Los diseños complejos, las tablas y las fórmulas pueden necesitar revisión manual.

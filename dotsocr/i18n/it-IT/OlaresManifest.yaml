metadata:
  title: dots.ocr
  description: "Riconoscimento multilingue del testo nei documenti con analisi del layout"

spec:
  fullDescription: |
    dots.ocr estrae il testo da immagini di documenti e pagine PDF interpretando il layout e l'ordine di lettura. Il modello multilingue riconosce testo, tabelle e formule per trasformare le pagine in contenuti riutilizzabili.

    Questa app fornisce la versione Q8 di dots.ocr alle applicazioni Olares compatibili. Richiede una GPU NVIDIA supportata. Layout complessi, tabelle e formule possono richiedere una verifica manuale.

metadata:
  title: Qwen3.5 9B Q4_K_M (Ollama)
  description: "Open-Source-multimodale Modelle mit außergewöhnlichem Nutzen und Leistung"
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Nach Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    Der Benutzerverkehr geht über den Proxy zu Ollama.

    **MODELL**
    Verwendet das Ollama-Modell qwen3.5:9b.

    Qwen3.5 stellt einen bedeutenden Fortschritt dar und integriert Durchbrüche in multimodalen Lernen, architektonischer Effizienz, Reinforcement-Learning-Skalierung und globaler Zugänglichkeit, um Entwickler und Unternehmen mit beispielloser Fähigkeit und Effizienz zu befähigen.

    Qwen3.5 bietet folgende Verbesserungen:

    Unified Vision-Language Foundation: Early-Fusion-Training auf multimodalen Tokens erreicht generationsübergreifende Parität mit Qwen3 und übertrifft Qwen3-VL-Modelle bei Reasoning, Coding, Agents und visuellem Verständnis.

    Efficient Hybrid Architecture: Gated Delta Networks kombiniert mit Sparse Mixture-of-Experts liefern High-Throughput-Inferenz mit minimaler Latenz und Kosten.

    Scalable RL Generalization: Reinforcement Learning skaliert über Millionen-Agenten-Umgebungen mit progressiv komplexen Aufgabenverteilungen für robuste reale Anpassungsfähigkeit.

    Global Linguistic Coverage: Erweiterte Unterstützung auf 201 Sprachen und Dialekte für inklusiven weltweiten Einsatz mit nuancenreichem kulturellem und regionalem Verständnis.

    Next-Generation Training Infrastructure: Nahezu 100 % multimodale Trainingseffizienz im Vergleich zu Text-only-Training und asynchrone RL-Frameworks für massiv skalierte Agent-Scaffolds und Umgebungsorchestrierung.
  upgradeDescription: |
    Ollama-Runtime auf ollama/ollama:0.30.10 aktualisiert.
    Olares-API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisiert (OpenAI-Vision image_url-Weiterleitung).

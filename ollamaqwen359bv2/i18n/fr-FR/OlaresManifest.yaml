metadata:
  title: Qwen3.5 9B Q4_K_M (Ollama)
  description: "Modèles multimodaux open-source offrant une utilité et des performances exceptionnelles"
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODÈLE**
    Utilise le modèle Ollama qwen3.5:9b.

    Qwen3.5 représente une avancée significative, intégrant des percées en apprentissage multimodal, efficacité architecturale, échelle d'apprentissage par renforcement et accessibilité mondiale pour doter développeurs et entreprises d'une capacité et d'une efficacité sans précédent.

    Qwen3.5 comporte les améliorations suivantes :

    Unified Vision-Language Foundation : l'entraînement early-fusion sur tokens multimodaux atteint la parité intergénérationnelle avec Qwen3 et surpasse les modèles Qwen3-VL en raisonnement, coding, agents et compréhension visuelle.

    Efficient Hybrid Architecture : Gated Delta Networks combinées à des Mixture-of-Experts sparses offrent une inférence à haut débit avec une latence et un coût minimaux.

    Scalable RL Generalization : apprentissage par renforcement mis à l'échelle sur des environnements à un million d'agents avec des distributions de tâches progressivement complexes pour une adaptabilité robuste au monde réel.

    Global Linguistic Coverage : prise en charge élargie à 201 langues et dialectes, permettant un déploiement mondial inclusif avec une compréhension culturelle et régionale nuancée.

    Next-Generation Training Infrastructure : efficacité d'entraînement multimodal proche de 100 % par rapport au texte seul et frameworks RL asynchrones supportant des scaffolds d'agents à grande échelle et l'orchestration d'environnements.
  upgradeDescription: |
    Runtime Ollama mis à jour vers ollama/ollama:0.30.10.
    Proxy API Olares mis à jour vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).

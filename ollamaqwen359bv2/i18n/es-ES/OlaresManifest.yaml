metadata:
  title: Qwen3.5 9B Q4_K_M (Ollama)
  description: "Modelos multimodales de código abierto que ofrecen utilidad y rendimiento excepcionales"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla mediante la app de referencia.
    El tráfico de usuarios pasa por el proxy hacia Ollama.

    **MODELO**
    Usa el modelo de Ollama qwen3.5:9b.

    Qwen3.5 representa un salto significativo, integrando avances en aprendizaje multimodal, eficiencia arquitectónica, escala de aprendizaje por refuerzo y accesibilidad global para capacitar a desarrolladores y empresas con una capacidad y eficiencia sin precedentes.

    Qwen3.5 incluye las siguientes mejoras:

    Unified Vision-Language Foundation: el entrenamiento de fusión temprana sobre tokens multimodales alcanza paridad intergeneracional con Qwen3 y supera a los modelos Qwen3-VL en razonamiento, coding, agentes y comprensión visual.

    Efficient Hybrid Architecture: Gated Delta Networks combinadas con Mixture-of-Experts dispersas ofrecen inferencia de alto rendimiento con latencia y coste mínimos.

    Scalable RL Generalization: aprendizaje por refuerzo escalado en entornos de un millón de agentes con distribuciones de tareas progresivamente complejas para una adaptabilidad robusta en el mundo real.

    Global Linguistic Coverage: soporte ampliado a 201 idiomas y dialectos, permitiendo un despliegue mundial inclusivo con comprensión cultural y regional matizada.

    Next-Generation Training Infrastructure: eficiencia de entrenamiento multimodal cercana al 100 % frente al entrenamiento solo texto y frameworks RL asíncronos que soportan andamiajes de agentes a gran escala y orquestación de entornos.
  upgradeDescription: |
    Runtime de Ollama actualizado a ollama/ollama:0.30.10.
    Proxy API de Olares actualizado a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).

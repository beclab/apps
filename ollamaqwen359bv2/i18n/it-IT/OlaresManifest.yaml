metadata:
  title: Qwen3.5 9B Q4_K_M (Ollama)
  description: "Modelli multimodali open-source che offrono utilità e prestazioni eccezionali"
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa dal proxy verso Ollama.

    **MODELLO**
    Usa il modello Ollama qwen3.5:9b.

    Qwen3.5 rappresenta un significativo passo avanti, integrando progressi nell'apprendimento multimodale, nell'efficienza architetturale, nella scala del reinforcement learning e nell'accessibilità globale per potenziare sviluppatori e imprese con capacità ed efficienza senza precedenti.

    Qwen3.5 include i seguenti miglioramenti:

    Unified Vision-Language Foundation: il training early-fusion su token multimodali raggiunge la parità intergenerazionale con Qwen3 e supera i modelli Qwen3-VL in reasoning, coding, agent e comprensione visiva.

    Efficient Hybrid Architecture: Gated Delta Networks combinate con Mixture-of-Experts sparse offrono inferenza ad alto throughput con latenza e costi minimi.

    Scalable RL Generalization: reinforcement learning scalato su ambienti con milioni di agenti e distribuzioni di task progressivamente complesse per una robusta adattabilità reale.

    Global Linguistic Coverage: supporto esteso a 201 lingue e dialetti, per un deployment mondiale inclusivo con comprensione culturale e regionale sfumata.

    Next-Generation Training Infrastructure: efficienza di training multimodale vicina al 100% rispetto al solo testo e framework RL asincroni che supportano scaffold agent su larga scala e orchestrazione degli ambienti.
  upgradeDescription: |
    Runtime Ollama aggiornato a ollama/ollama:0.30.10.
    Proxy API Olares aggiornato a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url vision OpenAI).

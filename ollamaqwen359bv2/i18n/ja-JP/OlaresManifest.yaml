metadata:
  title: Qwen3.5 9B Q4_K_M (Ollama)
  description: "卓越した実用性と性能を提供するオープンソース・マルチモーダルモデル"
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスタ内の全ユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。

    **モデル**
    Ollama モデル qwen3.5:9b を使用します。

    Qwen3.5 は、マルチモーダル学習、アーキテクチャ効率、強化学習のスケール、グローバルなアクセシビリティにおけるブレークスルーを統合し、開発者と企業に前例のない能力と効率を提供する大きな飛躍です。

    Qwen3.5 の強化点：

    Unified Vision-Language Foundation：マルチモーダルトークンでの early fusion 学習により Qwen3 と世代横断で同等になり、推論・コーディング・エージェント・視覚理解ベンチマークで Qwen3-VL を上回ります。

    Efficient Hybrid Architecture：Gated Delta Networks とスパース Mixture-of-Experts の組み合わせにより、低遅延・低コストで高スループット推論を実現。

    Scalable RL Generalization：百万エージェント規模の環境で段階的に複雑なタスク分布に対する強化学習をスケールし、実世界への頑健な適応を実現。

    Global Linguistic Coverage：201 の言語・方言に拡張し、文化・地域のニュアンスを踏まえた包括的な世界展開を可能に。

    Next-Generation Training Infrastructure：テキストのみ学習に対してほぼ 100% のマルチモーダル学習効率と、大規模エージェント足場および環境オーケストレーションを支える非同期 RL フレームワーク。
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 にアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 にアップグレード（OpenAI vision image_url 転送）。

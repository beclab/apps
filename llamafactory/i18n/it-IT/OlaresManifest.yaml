metadata:
  title: LLaMA Factory
  description: Fine-tuning di oltre 100 grandi modelli linguistici con CLI e Web UI senza codice
spec:
  fullDescription: |
    LlamaFactory è un framework unificato che integra una suite di metodi di training efficienti all'avanguardia. Fornisce una soluzione per personalizzare in modo flessibile il fine-tuning di oltre 100 LLM senza bisogno di codice tramite la Web UI integrata LlamaBoard.
    
    **Funzioni**
    - Vari modelli: LLaMA, LLaVA, Mistral, Mixtral-MoE, Qwen, Yi, Gemma, Baichuan, ChatGLM, Phi, ecc.
    - Metodi integrati: pre-training (continuo), supervised fine-tuning (multimodale), reward modeling, PPO, DPO, KTO, ORPO, ecc.
    - Risorse scalabili: full-tuning a 16 bit, freeze-tuning, LoRA e QLoRA a 2/3/4/5/6/8 bit via AQLM/AWQ/GPTQ/LLM.int8/HQQ/EETQ.
    - Algoritmi avanzati: GaLore, BAdam, Adam-mini, DoRA, LongLoRA, LLaMA Pro, Mixture-of-Depths, LoRA+, LoftQ, PiSSA e Agent tuning.
    - Trucchi pratici: FlashAttention-2, Unsloth, RoPE scaling, NEFTune e rsLoRA.
    - Monitor degli esperimenti: LlamaBoard, TensorBoard, Wandb, MLflow, ecc.
    - Inferenza più rapida: API in stile OpenAI, Gradio UI e CLI con worker vLLM.
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
    
    Storage: i volumi persistenti per `/root`, `/app/data` e `/app/output` sono stati spostati da `appCache` a `appData`. Al primo avvio dopo l'upgrade, gli initContainer copiano i contenuti legacy di appCache in appData quando ciascuna destinazione è vuota (marker: `.migration_from_appcache_done_root`, `.migration_from_appcache_done_app`, `.migration_from_appcache_done_output`). I vecchi dati appCache restano intatti per il rollback.
    
    Aggiornare la configurazione del Chart
    - Correzione dei requisiti GPU

metadata:
  title: LLaMA Factory
  description: Feinabstimmung von über 100 großen Sprachmodellen mit Zero-Code-CLI und Web-UI
spec:
  fullDescription: |
    LlamaFactory ist ein einheitliches Framework, das eine Suite modernster effizienter Trainingsmethoden integriert. Es ermöglicht die flexible Anpassung der Feinabstimmung von über 100 LLMs ohne Coding über die integrierte Web-UI LlamaBoard.
    
    **Funktionen**
    - Verschiedene Modelle: LLaMA, LLaVA, Mistral, Mixtral-MoE, Qwen, Yi, Gemma, Baichuan, ChatGLM, Phi usw.
    - Integrierte Methoden: (kontinuierliches) Pre-Training, (multimodale) supervised Fine-Tuning, Reward Modeling, PPO, DPO, KTO, ORPO usw.
    - Skalierbare Ressourcen: 16-Bit-Full-Tuning, Freeze-Tuning, LoRA und 2/3/4/5/6/8-Bit-QLoRA über AQLM/AWQ/GPTQ/LLM.int8/HQQ/EETQ.
    - Fortschrittliche Algorithmen: GaLore, BAdam, Adam-mini, DoRA, LongLoRA, LLaMA Pro, Mixture-of-Depths, LoRA+, LoftQ, PiSSA und Agent Tuning.
    - Praktische Tricks: FlashAttention-2, Unsloth, RoPE Scaling, NEFTune und rsLoRA.
    - Experiment-Monitore: LlamaBoard, TensorBoard, Wandb, MLflow usw.
    - Schnellere Inferenz: OpenAI-ähnliche API, Gradio-UI und CLI mit vLLM-Worker.
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    Speicher: dauerhafte Volumes für `/root`, `/app/data` und `/app/output` von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopieren InitContainers Legacy-Inhalte aus appCache nach appData, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done_root`, `.migration_from_appcache_done_app`, `.migration_from_appcache_done_output`). Alte appCache-Daten bleiben für Rollback erhalten.
    
    Chart-Konfiguration aktualisieren
    - GPU-Anforderungen korrigiert

metadata:
  title: LLaMA Factory
  description: Affinez facilement plus de 100 grands modèles de langage avec une CLI et une Web UI sans code
spec:
  fullDescription: |
    LlamaFactory est un cadre unifié qui intègre une suite de méthodes d'entraînement efficaces de pointe. Il fournit une solution pour personnaliser de façon flexible le fine-tuning de plus de 100 LLM sans coder via la Web UI intégrée LlamaBoard.
    
    **Fonctionnalités**
    - Divers modèles : LLaMA, LLaVA, Mistral, Mixtral-MoE, Qwen, Yi, Gemma, Baichuan, ChatGLM, Phi, etc.
    - Méthodes intégrées : pré-entraînement (continu), fine-tuning supervisé (multimodal), reward modeling, PPO, DPO, KTO, ORPO, etc.
    - Ressources évolutives : full-tuning 16 bits, freeze-tuning, LoRA et QLoRA 2/3/4/5/6/8 bits via AQLM/AWQ/GPTQ/LLM.int8/HQQ/EETQ.
    - Algorithmes avancés : GaLore, BAdam, Adam-mini, DoRA, LongLoRA, LLaMA Pro, Mixture-of-Depths, LoRA+, LoftQ, PiSSA et Agent tuning.
    - Astuces pratiques : FlashAttention-2, Unsloth, RoPE scaling, NEFTune et rsLoRA.
    - Moniteurs d'expériences : LlamaBoard, TensorBoard, Wandb, MLflow, etc.
    - Inférence plus rapide : API style OpenAI, Gradio UI et CLI avec worker vLLM.
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    Stockage : les volumes durables pour `/root`, `/app/data` et `/app/output` ont été déplacés de `appCache` vers `appData`. Au premier démarrage après la mise à niveau, les initContainers copient le contenu legacy d'appCache vers appData lorsque chaque destination est vide (marqueurs : `.migration_from_appcache_done_root`, `.migration_from_appcache_done_app`, `.migration_from_appcache_done_output`). Les anciennes données appCache sont conservées pour le rollback.
    
    Mettre à jour la configuration du Chart
    - Corriger les exigences GPU

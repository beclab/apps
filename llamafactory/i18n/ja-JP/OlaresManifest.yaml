metadata:
  title: LLaMA Factory
  description: ゼロコードの CLI と Web UI で 100 以上の大規模言語モデルを簡単にファインチューン
spec:
  fullDescription: |
    LlamaFactory は最先端の効率的な学習手法群を統合した統一フレームワークです。組み込み Web UI の LlamaBoard により、コーディング不要で 100 以上の LLM のファインチューニングを柔軟にカスタマイズできます。
    
    **機能**
    - 多様なモデル: LLaMA、LLaVA、Mistral、Mixtral-MoE、Qwen、Yi、Gemma、Baichuan、ChatGLM、Phi など。
    - 統合手法:（継続）事前学習、（マルチモーダル）教師ありファインチューニング、報酬モデリング、PPO、DPO、KTO、ORPO など。
    - スケーラブルなリソース: 16-bit フルチューニング、freeze-tuning、LoRA、および AQLM/AWQ/GPTQ/LLM.int8/HQQ/EETQ による 2/3/4/5/6/8-bit QLoRA。
    - 先進アルゴリズム: GaLore、BAdam、Adam-mini、DoRA、LongLoRA、LLaMA Pro、Mixture-of-Depths、LoRA+、LoftQ、PiSSA、Agent tuning。
    - 実用的なテクニック: FlashAttention-2、Unsloth、RoPE scaling、NEFTune、rsLoRA。
    - 実験モニター: LlamaBoard、TensorBoard、Wandb、MLflow など。
    - より高速な推論: OpenAI 風 API、Gradio UI、vLLM ワーカー付き CLI。
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    ストレージ: `/root`、`/app/data`、`/app/output` の永続ボリュームを `appCache` から `appData` に移動。アップグレード後の初回起動時、各宛先が空の場合に initContainer がレガシー appCache 内容を appData にコピーします（マーカー: `.migration_from_appcache_done_root`、`.migration_from_appcache_done_app`、`.migration_from_appcache_done_output`）。ロールバック用に旧 appCache データは残します。
    
    Chart 設定の更新
    - GPU 要件を修正

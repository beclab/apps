metadata:
  title: LLaMA Factory
  description: Ajuste fino de más de 100 grandes modelos de lenguaje con CLI y Web UI sin código
spec:
  fullDescription: |
    LlamaFactory es un marco unificado que integra un conjunto de métodos de entrenamiento eficientes de vanguardia. Ofrece una solución para personalizar de forma flexible el ajuste fino de más de 100 LLM sin necesidad de programar mediante la Web UI integrada LlamaBoard.
    
    **Funciones**
    - Varios modelos: LLaMA, LLaVA, Mistral, Mixtral-MoE, Qwen, Yi, Gemma, Baichuan, ChatGLM, Phi, etc.
    - Métodos integrados: preentrenamiento (continuo), ajuste supervisado (multimodal), modelado de recompensas, PPO, DPO, KTO, ORPO, etc.
    - Recursos escalables: full-tuning de 16 bits, freeze-tuning, LoRA y QLoRA de 2/3/4/5/6/8 bits vía AQLM/AWQ/GPTQ/LLM.int8/HQQ/EETQ.
    - Algoritmos avanzados: GaLore, BAdam, Adam-mini, DoRA, LongLoRA, LLaMA Pro, Mixture-of-Depths, LoRA+, LoftQ, PiSSA y Agent tuning.
    - Trucos prácticos: FlashAttention-2, Unsloth, RoPE scaling, NEFTune y rsLoRA.
    - Monitores de experimentos: LlamaBoard, TensorBoard, Wandb, MLflow, etc.
    - Inferencia más rápida: API estilo OpenAI, Gradio UI y CLI con worker vLLM.
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    Almacenamiento: volúmenes persistentes para `/root`, `/app/data` y `/app/output` movidos de `appCache` a `appData`. En el primer arranque tras la actualización, los initContainers copian el contenido legacy de appCache a appData cuando cada destino está vacío (marcadores: `.migration_from_appcache_done_root`, `.migration_from_appcache_done_app`, `.migration_from_appcache_done_output`). Los datos antiguos de appCache se conservan para rollback.
    
    Actualizar configuración del Chart
    - Corregir requisitos de GPU

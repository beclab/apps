metadata:
  title: HY-MT1.5-7B (vLLM)
  description: Mehrsprachiges Übersetzungsmodell von Hunyuan
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsam genutzte App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer kann einen Desktop-Eintrag für den Zugriff installieren oder den gemeinsamen Zugang verwenden, um die Dienst-API aufzurufen.

    **ÜBERBLICK**
    Hunyuan-MT besteht aus dem Übersetzungsmodell Hunyuan-MT-7B und dem Ensemble-Modell Hunyuan-MT-Chimera. Das Übersetzungsmodell übersetzt Ausgangstext in die Zielsprache, während das Ensemble-Modell mehrere Übersetzungsergebnisse integriert, um ein hochwertigeres Ergebnis zu erzeugen. Es unterstützt hauptsächlich die wechselseitige Übersetzung zwischen 33 Sprachen, darunter fünf ethnische Minderheitensprachen Chinas.

    **Wichtigste Funktionen und Vorteile**
    - Beim WMT25-Wettbewerb erreichte das Modell in 30 der 31 teilgenommenen Sprachkategorien den ersten Platz.
    - Hunyuan-MT-7B erzielt unter Modellen vergleichbarer Größe branchenführende Leistung.
    - Hunyuan-MT-Chimera-7B ist das erste quelloffene Übersetzungs-Ensemble-Modell der Branche und hebt die Übersetzungsqualität auf ein neues Niveau.
    - Es wurde ein umfassendes Trainingsframework für Übersetzungsmodelle vorgeschlagen, das von pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement reicht und für Modelle ähnlicher Größe State-of-the-Art-Ergebnisse (SOTA) erzielt.
  upgradeDescription: |
    vLLM-Laufzeit auf v0.22.0-cu129 aktualisiert; -O3-Optimierung aktiviert und torch.compile- / FlashInfer-Cache persistent gespeichert.

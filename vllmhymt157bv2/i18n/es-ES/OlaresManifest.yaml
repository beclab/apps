metadata:
  title: HY-MT1.5-7B (vLLM)
  description: Modelo de traducción multilingüe de Hunyuan
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar un acceso en el escritorio o utilizar la entrada compartida para llamar a la API del servicio.

    **DESCRIPCIÓN GENERAL**
    Hunyuan-MT está compuesto por el modelo de traducción Hunyuan-MT-7B y el modelo ensemble Hunyuan-MT-Chimera. El modelo de traducción convierte el texto de origen al idioma de destino, mientras que el modelo ensemble integra varias traducciones para producir un resultado de mayor calidad. Admite principalmente la traducción mutua entre 33 idiomas, incluidos cinco idiomas de minorías étnicas de China.

    **Funciones y ventajas principales**
    - En la competición WMT25, el modelo obtuvo el primer puesto en 30 de las 31 categorías lingüísticas en las que participó.
    - Hunyuan-MT-7B ofrece un rendimiento líder en el sector entre modelos de escala comparable.
    - Hunyuan-MT-Chimera-7B es el primer modelo ensemble de traducción de código abierto del sector y eleva la calidad de traducción a un nuevo nivel.
    - Se ha propuesto un framework integral de entrenamiento de modelos de traducción que abarca pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement, y alcanza resultados de vanguardia (SOTA) para modelos de tamaño similar.
  upgradeDescription: |
    Se actualiza el entorno de ejecución vLLM a v0.22.0-cu129, se activa la optimización -O3 y se conserva la caché de torch.compile / FlashInfer.

metadata:
  title: HY-MT1.5-7B (vLLM)
  description: Modello di traduzione multilingue di Hunyuan
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Ogni utente può installare un collegamento sul desktop per accedervi oppure usare l'accesso condiviso per chiamare l'API del servizio.

    **PANORAMICA**
    Hunyuan-MT comprende il modello di traduzione Hunyuan-MT-7B e il modello ensemble Hunyuan-MT-Chimera. Il modello di traduzione converte il testo sorgente nella lingua di destinazione, mentre il modello ensemble integra più risultati per produrre una traduzione di qualità superiore. Supporta principalmente la traduzione reciproca fra 33 lingue, incluse cinque lingue di minoranze etniche cinesi.

    **Funzionalità e vantaggi principali**
    - Nella competizione WMT25, il modello si è classificato al primo posto in 30 delle 31 categorie linguistiche a cui ha partecipato.
    - Hunyuan-MT-7B offre prestazioni leader del settore tra modelli di scala comparabile.
    - Hunyuan-MT-Chimera-7B è il primo modello ensemble di traduzione open source del settore e porta la qualità della traduzione a un nuovo livello.
    - È stato proposto un framework di addestramento completo per i modelli di traduzione, che comprende pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement e ottiene risultati all'avanguardia (SOTA) per modelli di dimensioni simili.
  upgradeDescription: |
    Aggiornato il runtime vLLM a v0.22.0-cu129; abilitata l'ottimizzazione -O3 e resa persistente la cache di torch.compile / FlashInfer.

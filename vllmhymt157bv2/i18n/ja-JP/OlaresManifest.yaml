metadata:
  title: HY-MT1.5-7B (vLLM)
  description: Hunyuan の多言語翻訳モデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体にインストールされるサービスは1つだけです。各ユーザーはデスクトップエントリをインストールしてアクセスするか、共有エントランスからサービス API を呼び出せます。

    **概要**
    Hunyuan-MT は、翻訳モデル Hunyuan-MT-7B とアンサンブルモデル Hunyuan-MT-Chimera で構成されます。翻訳モデルは原文を対象言語へ翻訳し、アンサンブルモデルは複数の翻訳結果を統合して、より高品質な結果を生成します。中国の少数民族言語5つを含む、主に33言語間の相互翻訳に対応します。

    **主な機能と利点**
    - WMT25 コンペティションでは、参加した31言語カテゴリーのうち30カテゴリーで1位を獲得。
    - Hunyuan-MT-7B は同規模のモデルで業界最高水準の性能を実現。
    - Hunyuan-MT-Chimera-7B は業界初のオープンソース翻訳アンサンブルモデルで、翻訳品質を新たな水準へ向上。
    - pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement までを網羅する包括的な翻訳モデル学習 framework を提案し、同規模モデルで最先端（SOTA）の結果を達成。
  upgradeDescription: |
    vLLM ランタイムを v0.22.0-cu129 にアップグレードし、-O3 最適化を有効化して torch.compile / FlashInfer キャッシュを永続化。

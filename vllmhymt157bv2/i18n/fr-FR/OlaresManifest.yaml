metadata:
  title: HY-MT1.5-7B (vLLM)
  description: Modèle de traduction multilingue de Hunyuan
spec:
  fullDescription: |
    **REMARQUE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé dans tout le système Olares. Chaque utilisateur peut installer un raccourci sur le bureau pour y accéder ou utiliser l'entrée partagée afin d'appeler l'API du service.

    **PRÉSENTATION**
    Hunyuan-MT comprend le modèle de traduction Hunyuan-MT-7B et le modèle d'ensemble Hunyuan-MT-Chimera. Le modèle de traduction convertit le texte source dans la langue cible, tandis que le modèle d'ensemble intègre plusieurs traductions pour produire un résultat de meilleure qualité. Il prend principalement en charge la traduction mutuelle entre 33 langues, dont cinq langues de minorités ethniques de Chine.

    **Fonctionnalités et avantages principaux**
    - Lors de la compétition WMT25, le modèle s'est classé premier dans 30 des 31 catégories linguistiques auxquelles il a participé.
    - Hunyuan-MT-7B offre des performances de pointe parmi les modèles de taille comparable.
    - Hunyuan-MT-Chimera-7B est le premier modèle d'ensemble de traduction open source du secteur et porte la qualité des traductions à un niveau inédit.
    - Un framework d'entraînement complet pour les modèles de traduction a été proposé, allant de pretrain → cross-lingual pretraining (CPT) → supervised fine-tuning (SFT) → translation enhancement → ensemble refinement, avec des résultats de pointe (SOTA) pour les modèles de taille similaire.
  upgradeDescription: |
    Mise à niveau du runtime vLLM vers v0.22.0-cu129 ; activation de l'optimisation -O3 et persistance du cache torch.compile / FlashInfer.

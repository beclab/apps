{{- $fireflyiiiDomainENV := split  ","  .Values.domain.fireflyiii -}}
{{- $fireflyiiiDomain := index $fireflyiiiDomainENV "_0" -}}

{{- $smtpServer := .Values.olaresEnv.MAIL_HOST | default "" }}
{{- $defaultSmtpPort := "" }}
{{- if (ne $smtpServer "") }}
  {{- $defaultSmtpPort = "25" }}
{{- end }}
{{- $mailPort := .Values.olaresEnv.MAIL_PORT | default $defaultSmtpPort }}
{{- $smtpSecure := "null" }}

{{- $smtpUseSSL := .Values.olaresEnv.SMTP_SSL | default "" }}
{{- $smtpUseTLS := .Values.olaresEnv.SMTP_TLS | default "" }}
{{- $smtpSecurityProtocols := .Values.olaresEnv.SMTP_SECURITY_PROTOCOLS | default "" }}
{{- $smtpSecurityLower := lower (toString $smtpSecurityProtocols) }}
{{- if eq $smtpSecurityLower "tls" }}
  {{- $smtpSecure = "tls" }}
{{- else if eq $smtpSecurityLower "ssl" }}
  {{- $smtpSecure = "ssl" }}
{{- else if eq $smtpSecurityLower "none" }}
  {{- $smtpSecure = "null" }}
{{- else }}
  {{- if or (eq (lower $smtpUseSSL) "true") (eq $smtpUseSSL "1") }}
    {{- $smtpSecure = "ssl" }}
  {{- else if or (eq (lower $smtpUseTLS) "true") (eq $smtpUseTLS "1") }}
    {{- $smtpSecure = "tls" }}
  {{- end }}
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fireflyiii
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: fireflyiii
spec:
  replicas: {{ .Values.workloads.fireflyiii.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: fireflyiii
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: fireflyiii
    spec:
      initContainers:
        - name: migrate-appcache-to-appdata
          image: "docker.io/beclab/busybox:1.37"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              SOURCE=/old-data
              DEST=/new-data
              MARKER="${DEST}/.migration_from_appcache_done"

              if [ -f "$MARKER" ]; then
                echo "[migrate] marker present, skip."
                exit 0
              fi

              if [ -n "$(ls -A "$DEST" 2>/dev/null | grep -v '^\.migration_from_appcache_done$' || true)" ]; then
                echo "[migrate] appData already has data, skip."
                echo "skipped existing dest at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
                exit 0
              fi

              if [ -n "$(ls -A "$SOURCE" 2>/dev/null || true)" ]; then
                echo "[migrate] copying appCache -> appData..."
                cp -a "$SOURCE"/. "$DEST"/
                echo "migrated from appCache at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
                echo "[migrate] done; legacy appCache left intact for rollback."
              else
                echo "[migrate] no legacy data, fresh install."
                echo "fresh install at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
              fi
          volumeMounts:
            - name: fireflyiii-data-legacy
              mountPath: /old-data
              readOnly: true
            - name: fireflyiii-data
              mountPath: /new-data
        - name: init-permissions
          image: "docker.io/beclab/busybox:1.37"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data/upload
              chown 33:33 /data/upload
          volumeMounts:
            - name: fireflyiii-data
              mountPath: /data
      containers:
        - name: fireflyiii
          image: docker.io/fireflyiii/core:version-6.6.6
          envFrom:
            - configMapRef:
                name: fireflyiii-env
            - secretRef:
                name: fireflyiii-secrets
          env:
            {{- if and (eq (toString .Values.olaresEnv.USE_SYSTEM_SMTP_SETTINGS) "true") (eq (toString .Values.olaresEnv.SMTP_ENABLED) "true") }}
            - name: MAIL_MAILER
              value: "smtp"
            - name: MAIL_HOST
              value: "{{ .Values.olaresEnv.MAIL_HOST }}"
            - name: MAIL_PORT
              value: "{{ .Values.olaresEnv.MAIL_PORT }}"
            - name: MAIL_USERNAME
              value: "{{ .Values.olaresEnv.MAIL_USERNAME }}"
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fireflyiii-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_FROM
              value: "{{ .Values.olaresEnv.MAIL_FROM }}"
            - name: MAIL_ENCRYPTION
              value: "{{ $smtpSecure }}"
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -e
                    for attempt in $(seq 1 90); do
                      if php -r 'exit(@file_get_contents("http://127.0.0.1:8080/login") === false ? 1 : 0);'; then
                        break
                      fi
                      if [ "$attempt" -eq 90 ]; then
                        echo "[passport] Firefly III did not become ready in time." >&2
                        exit 1
                      fi
                      sleep 2
                    done

                    if php -r '
                      require "vendor/autoload.php";
                      $app = require "bootstrap/app.php";
                      $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                      $exists = Laravel\Passport\Client::query()
                        ->where("personal_access_client", true)
                        ->where("revoked", false)
                        ->where(function ($query) {
                          $query->where("provider", "users")->orWhereNull("provider");
                        })
                        ->exists();
                      exit($exists ? 0 : 1);
                    '; then
                      echo "[passport] Personal access client already exists."
                    else
                      php artisan passport:client \
                        --personal \
                        --provider=users \
                        --name="Firefly III Personal Access Client" \
                        --no-interaction >/dev/null
                      echo "[passport] Personal access client created."
                    fi
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
            limits:
              cpu: 1900m
              memory: 1.75Gi
            requests:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: fireflyiii-data
              mountPath: /var/www/html/storage/upload
              subPath: upload
      restartPolicy: Always
      volumes:
        - name: fireflyiii-data
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}'
        - name: fireflyiii-data-legacy
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appCache }}'

---
apiVersion: v1
kind: Service
metadata:
  name: fireflyiii
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: fireflyiii
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: {{ .Values.port | default 3000 }}
      targetPort: {{ .Values.port | default 3000 }}
      protocol: TCP
  selector:
    io.kompose.service: fireflyiii
status:
  loadBalancer: {}

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fireflyiii-cron
  namespace: {{ .Release.Namespace }}
  labels:
    app: fireflyiii-cron
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fireflyiii-cron
        spec:
          containers:
            - name: cron
              image: alpine
              command: [
                "sh",
                "-c",
                "wget -qO- http://fireflyiii:8080/api/v1/cron/$STATIC_CRON_TOKEN"
              ]
              env:
                - name: STATIC_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: fireflyiii-secrets
                      key: STATIC_CRON_TOKEN
          restartPolicy: OnFailure

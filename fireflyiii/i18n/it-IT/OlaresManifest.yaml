metadata:
  title: Firefly III
  description: Un gestore di finanze personali
spec:
  upgradeDescription: |
    Aggiorna Firefly III da 6.4.16 a 6.6.6 (`fireflyiii/core:version-6.6.6`).

    Chart:
    - L’initContainer `init-permissions` imposta `/data/upload` su www-data (uid 33) così i caricamenti funzionano dopo l’upgrade.
    - postStart crea il client personal-access di Laravel Passport se manca, così i token API funzionano.

    App: 6.5.x–6.6.x includono correzioni UI e API su conti, regole, webhook e cambi. Note: https://github.com/firefly-iii/firefly-iii/releases

    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Firefly III è un gestore (self-hosted) delle tue finanze personali. Può aiutarti a tenere traccia di spese e entrate, così da spendere meno e risparmiare di più. Firefly III supporta budget, categorie e tag. Con diversi strumenti esterni puoi importare dati. Offre anche molti report finanziari utili.
    
    Firefly III dovrebbe darti visione e controllo sulle tue finanze. Il denaro dovrebbe essere utile, non spaventoso. Dovresti vedere dove va, sentire le tue spese e... wow, sto esagerando, vero?
    
    Ma hai capito l'idea: questi sono i tuoi soldi. Queste sono le tue spese. Smetti di lasciarle controllarti. Ho creato questo strumento perché stavo iniziando a non amare i soldi. Averli, non averli, pagare bollette con i soldi... capisci. Ma basta. Voglio sentirmi «al sicuro», qualunque sia il saldo. E spero che questo strumento possa aiutarti. So che aiuta me.
    
    Funzioni
    Firefly III è piuttosto ricco di funzioni. Prima le cose importanti:
    - È completamente self-hosted e isolato, e non contatterà mai server esterni finché non glielo dici esplicitamente.
    - Offre una REST JSON API che copre quasi ogni parte di Firefly III.
    
    Le funzioni più interessanti:
    - Creare transazioni ricorrenti per gestire i soldi.
    - Gestione delle transazioni basata su regole, con la possibilità di creare le tue.
    
    Poi le cose che ti fanno dire «sì OK, ha senso».
    - Un sistema di partita doppia.
    - Risparmiare verso un obiettivo con i salvadanai.
    - Visualizzare report di entrate e spese.
    
    E le cose che speri ma non ti aspetti:
    - Autenticazione a 2 fattori per maggiore sicurezza.
    - Supporta qualsiasi valuta tu voglia.
    
    E per organizzare tutto:
    - Viste chiare che dovrebbero mostrarti come stai andando.
    - Navigazione facile tra i tuoi record.
    - Tanti grafici perché li amiamo tutti.

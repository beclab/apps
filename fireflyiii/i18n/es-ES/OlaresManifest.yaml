metadata:
  title: Firefly III
  description: Un gestor de finanzas personales
spec:
  upgradeDescription: |
    Actualiza Firefly III a 6.7.9 y PHP a 8.5.12 para corregir CVE-2026-109618 y CVE-2026-109619. Conserva las bases de datos, los adjuntos y las claves existentes; las instalaciones nuevas generan claves y tokens de cron propios.

    Al actualizar desde 6.4.16, la migración OAuth invalida los tokens de API y los clientes OAuth existentes; es necesario volver a crearlos.

  fullDescription: |
    Firefly III es un gestor (autoalojado) de tus finanzas personales. Puede ayudarte a llevar el control de tus gastos e ingresos, para gastar menos y ahorrar más. Firefly III admite el uso de presupuestos, categorías y etiquetas. Con varias herramientas externas puedes importar datos. También dispone de muchos informes financieros útiles.
    
    Firefly III debería darte visión y control sobre tus finanzas. El dinero debería ser útil, no aterrador. Deberías poder ver a dónde va, sentir tus gastos y... vaya, ¿me estoy pasando, verdad?
    
    Pero ya entiendes la idea: este es tu dinero. Estos son tus gastos. Deja de dejar que te controlen. Construí esta herramienta porque empecé a disgustarme el dinero. Tener dinero, no tenerlo, pagar facturas con dinero... ya sabes. Pero se acabó. Quiero sentirme «seguro», sea cual sea mi saldo. Y espero que esta herramienta te ayude. Sé que a mí me ayuda.
    
    Funciones
    Firefly III está bastante completo. Primero lo importante:
    - Está completamente autoalojado y aislado, y nunca contactará servidores externos hasta que se lo indiques explícitamente.
    - Incluye una API REST JSON que cubre casi todas las partes de Firefly III.
    
    Las funciones más emocionantes:
    - Crear transacciones recurrentes para gestionar tu dinero.
    - Manejo de transacciones basado en reglas, con la posibilidad de crear las tuyas.
    
    Luego las cosas que te hacen decir «sí OK, tiene sentido».
    - Un sistema de partida doble.
    - Ahorrar hacia un objetivo con huchas.
    - Ver informes de ingresos y gastos.
    
    Y las cosas que esperarías pero no tanto:
    - Autenticación de 2 factores para más seguridad.
    - Admite cualquier moneda que quieras.
    
    Y para organizarlo todo:
    - Vistas claras que deberían mostrarte cómo te va.
    - Navegación fácil por tus registros.
    - Muchos gráficos porque a todos nos gustan.

metadata:
  title: Firefly III
  description: Ein persönlicher Finanzmanager
spec:
  upgradeDescription: |
    Aktualisiert Firefly III auf 6.7.9 und PHP auf 8.5.12 zur Behebung von CVE-2026-109618 und CVE-2026-109619. Bestehende Datenbanken, Anhänge und Schlüssel bleiben erhalten; Neuinstallationen erhalten eigene Anwendungsschlüssel und Cron-Token.

    Beim Upgrade von 6.4.16 macht die OAuth-Migration vorhandene API-Token und OAuth-Clients ungültig; diese müssen danach neu erstellt werden.

  fullDescription: |
    Firefly III ist ein (selbst gehosteter) Manager für Ihre persönlichen Finanzen. Er hilft Ihnen, Ausgaben und Einnahmen im Blick zu behalten, damit Sie weniger ausgeben und mehr sparen können. Firefly III unterstützt Budgets, Kategorien und Tags. Mit einer Reihe externer Tools können Sie Daten importieren. Außerdem stehen viele nützliche Finanzberichte zur Verfügung.
    
    Firefly III soll Ihnen Einblick in und Kontrolle über Ihre Finanzen geben. Geld sollte nützlich sein, nicht beängstigend. Sie sollten sehen können, wohin es fließt, Ihre Ausgaben spüren und... wow, ich übertreibe hier, oder?
    
    Aber Sie verstehen den Gedanken: Das ist Ihr Geld. Das sind Ihre Ausgaben. Lassen Sie sie nicht Sie kontrollieren. Ich habe dieses Tool gebaut, weil ich anfing, Geld zu mögen – oder eher nicht. Geld haben, keines haben, Rechnungen damit zahlen – Sie wissen schon. Aber das ist vorbei. Ich möchte mich „sicher“ fühlen, egal wie mein Kontostand ist. Und ich hoffe, dieses Tool kann Ihnen helfen. Ich weiß, dass es mir hilft.
    
    Funktionen
    Firefly III ist ziemlich funktionsreich. Zuerst das Wichtige:
    - Es ist vollständig selbst gehostet und isoliert und kontaktiert niemals externe Server, bis Sie es ausdrücklich anweisen.
    - Es bietet eine REST-JSON-API, die fast jeden Teil von Firefly III abdeckt.
    
    Die spannendsten Funktionen:
    - Wiederkehrende Transaktionen erstellen, um Ihr Geld zu verwalten.
    - Regelbasiertes Handling von Transaktionen mit eigenen Regeln.
    
    Dann Dinge, bei denen man „ja OK, macht Sinn“ sagt.
    - Ein Doppelbuchhaltungssystem.
    - Mit Sparschweinen auf ein Ziel hinsparen.
    - Einnahmen- und Ausgabenberichte anzeigen.
    
    Und Dinge, die man hofft, aber nicht erwartet:
    - 2-Faktor-Authentifizierung für zusätzliche Sicherheit.
    - Unterstützt jede gewünschte Währung.
    
    Und um alles zu organisieren:
    - Klare Ansichten, die zeigen, wie Sie dastehen.
    - Einfache Navigation durch Ihre Aufzeichnungen.
    - Viele Diagramme, weil wir sie alle lieben.

metadata:
  title: Firefly III
  description: 個人向け財務マネージャー
spec:
  upgradeDescription: |
    Firefly III を 6.4.16 から 6.6.6 にアップグレードします（`fireflyiii/core:version-6.6.6`）。

    Chart:
    - Init コンテナ `init-permissions` が `/data/upload` の所有者を www-data（uid 33）に設定し、アップグレード後もアップロードできるようにします。
    - postStart は Laravel Passport の personal-access client が無い場合に作成し、API トークンが使えるようにします。

    アプリ: 6.5.x–6.6.x では口座、ルール、Webhook、為替まわりの UI / API 修正があります。詳細: https://github.com/firefly-iii/firefly-iii/releases

    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
  fullDescription: |
    Firefly III は（セルフホスト型の）個人財務マネージャーです。支出と収入を把握し、支出を抑え貯蓄を増やすのに役立ちます。予算、カテゴリ、タグに対応。外部ツール群でデータをインポートでき、便利な財務レポートも多数用意されています。
    
    Firefly III は財務への洞察とコントロールを与えるべきです。お金は役立つものであり、怖がるものではありません。どこへ流れるか見え、支出を実感し…おっと、言い過ぎましたね？
    
    でも趣旨はわかるはずです。これはあなたの金銭。これはあなたの支出。それらに支配されるのをやめましょう。お金が嫌になり始めたからこのツールを作りました。ある、ない、請求を払う…よくある話です。でももう終わり。残高に関係なく「安心」したい。そしてこのツールがあなたにも役立つことを願います。私には役立っています。
    
    機能
    Firefly III は機能が充実しています。まず重要な点:
    - 完全にセルフホストされ隔離されており、明示的に指示するまで外部サーバーに連絡しません。
    - Firefly III のほぼ全域をカバーする REST JSON API を備えます。
    
    特に魅力的な機能:
    - 繰り返し取引を作成してお金を管理。
    - 独自ルールを作れるルールベースの取引処理。
    
    「なるほど、当然」と思える機能:
    - 複式簿記システム。
    - 貯金箱で目標に向けて貯蓄。
    - 収入・支出レポートの表示。
    
    期待しつつ意外と嬉しい機能:
    - 追加のセキュリティのための 2 要素認証。
    - 任意の通貨に対応。
    
    そして整理のために:
    - 状況がわかる明確なビュー。
    - 記録の簡単なナビゲーション。
    - みんな大好きなチャートが多数。

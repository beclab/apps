metadata:
  title: Firefly III
  description: Un gestionnaire de finances personnelles
spec:
  upgradeDescription: |
    Mise à jour de Firefly III de 6.4.16 vers 6.6.6 (`fireflyiii/core:version-6.6.6`).

    Chart :
    - Le initContainer `init-permissions` attribue `/data/upload` à www-data (uid 33) pour que les envois fonctionnent après la mise à jour.
    - postStart crée le client d’accès personnel Laravel Passport s’il est absent, afin que les jetons API fonctionnent.

    Application : 6.5.x–6.6.x incluent des correctifs UI et API (comptes, règles, webhooks, taux de change). Notes : https://github.com/firefly-iii/firefly-iii/releases

    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Firefly III est un gestionnaire (auto-hébergé) de vos finances personnelles. Il peut vous aider à suivre vos dépenses et revenus, afin de dépenser moins et d'économiser davantage. Firefly III prend en charge budgets, catégories et tags. Grâce à divers outils externes, vous pouvez importer des données. Il propose aussi de nombreux rapports financiers utiles.
    
    Firefly III devrait vous donner de la visibilité et du contrôle sur vos finances. L'argent devrait être utile, pas effrayant. Vous devriez voir où il va, ressentir vos dépenses et... wow, j'en fais trop, non ?
    
    Mais vous voyez l'idée : c'est votre argent. Ce sont vos dépenses. Arrêtez de les laisser vous contrôler. J'ai créé cet outil parce que j'ai commencé à ne plus aimer l'argent. En avoir, ne pas en avoir, payer des factures avec... vous voyez. Mais c'est fini. Je veux me sentir « en sécurité », quel que soit mon solde. Et j'espère que cet outil peut vous aider. Je sais qu'il m'aide.
    
    Fonctionnalités
    Firefly III est plutôt riche en fonctionnalités. D'abord l'essentiel :
    - Il est entièrement auto-hébergé et isolé, et ne contactera jamais de serveurs externes tant que vous ne le lui demandez pas explicitement.
    - Il propose une API REST JSON qui couvre presque toutes les parties de Firefly III.
    
    Les fonctionnalités les plus excitantes :
    - Créer des transactions récurrentes pour gérer votre argent.
    - Traitement des transactions basé sur des règles, avec la possibilité de créer les vôtres.
    
    Puis les choses qui vous font dire « oui OK, ça a du sens ».
    - Un système de partie double.
    - Épargner vers un objectif avec des tirelires.
    - Consulter des rapports de revenus et de dépenses.
    
    Et les choses que vous espéreriez sans forcément vous y attendre :
    - Authentification à 2 facteurs pour plus de sécurité.
    - Prend en charge n'importe quelle devise.
    
    Et pour tout organiser :
    - Des vues claires qui devraient vous montrer où vous en êtes.
    - Une navigation facile dans vos enregistrements.
    - Beaucoup de graphiques parce qu'on les aime tous.

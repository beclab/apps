metadata:
  title: Leantime
  description: Leantime è un sistema di project management orientato agli obiettivi per chi non è project manager
spec:
  fullDescription: |
    Leantime è un sistema open source di project management per non project manager.
    Combiniamo strategia, pianificazione ed esecuzione rendendolo facile da usare per tutto il team.
    Progettato tenendo presenti ADHD, dislessia e autismo.

    Semplice come Trello ma ricco di funzioni come Jira
    Un'alternativa perfetta a ClickUp, Monday o Asana

    **Funzionalità principali:**
    Gestione attività
    - Gestione attività tramite board kanban, gantt, tabella, lista e calendario
    - Sottotask e dipendenze illimitate
    - Gestione milestone
    - Gestione sprint
    - Time tracking e timesheet

    Pianificazione progetti
    - Dashboard di progetto, report e aggiornamenti di stato
    - Tracciamento obiettivi e metriche
    - Lean & Business Model Canvas
    - Canvas di analisi SWOT
    - Analisi dei rischi

    Gestione informazioni/conoscenza
    - Wiki / Docs
    - Idea Board
    - Retrospective
    - Archiviazione file via S3 o filesystem locale
    - Registrazione schermo e webcam
    - Commenti/discussioni su tutto

    Amministrazione
    - Installazione semplice
    - Più ruoli utente e permessi per progetto
    - Autenticazione a due fattori
    - Integrazione LDAP, OIDC
    - Estendibile tramite plugin e API
    - Integrazione con Slack, Mattermost, Discord
    - Disponibile in oltre 20 lingue
  upgradeDescription: |
    Updates Leantime to 3.12.0 and PHP to 8.3.36. Persists uploaded files and plugins at their actual application paths. Runs the upstream database migration automatically.

    Before upgrading an existing installation, export userfiles, public/userfiles and app/Plugins from the running old container into the corresponding app-data directories. The previous chart mounted only an unused /data directory; upgrading or restarting without exporting may lose container-local files. Third-party plugins must support 3.12.0; incompatible plugins are skipped by upstream. See the tested upgrade procedure in the draft PR.

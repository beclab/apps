metadata:
  title: Leantime
  description: Leantime est un système de gestion de projet axé sur les objectifs pour les non-chefs de projet
spec:
  fullDescription: |
    Leantime est un système open source de gestion de projet pour les non-chefs de projet.
    Nous combinons stratégie, planification et exécution tout en le rendant facile à utiliser pour toute l'équipe.
    Conçu en tenant compte du TDAH, de la dyslexie et de l'autisme.

    Aussi simple que Trello mais aussi riche en fonctionnalités que Jira
    Une alternative parfaite à ClickUp, Monday ou Asana

    **Fonctionnalités clés :**
    Gestion des tâches
    - Gestion des tâches via tableaux kanban, gantt, tableau, liste et calendrier
    - Sous-tâches et dépendances illimitées
    - Gestion des jalons
    - Gestion des sprints
    - Suivi du temps et feuilles de temps

    Planification de projet
    - Tableaux de bord projet, rapports et mises à jour de statut
    - Suivi des objectifs et métriques
    - Lean & Business Model Canvas
    - Canvas d'analyse SWOT
    - Analyse des risques

    Gestion de l'information/connaissance
    - Wikis / Docs
    - Tableaux d'idées
    - Rétrospectives
    - Stockage de fichiers via S3 ou système de fichiers local
    - Enregistrement d'écran et webcam
    - Commentaires/discussions sur tout

    Administration
    - Installation facile
    - Plusieurs rôles utilisateur et permissions par projet
    - Authentification à deux facteurs
    - Intégration LDAP, OIDC
    - Extensible via plugins et API
    - Intégration avec Slack, Mattermost, Discord
    - Disponible en plus de 20 langues
  upgradeDescription: |
    Updates Leantime to 3.12.0 and PHP to 8.3.36. Persists uploaded files and plugins at their actual application paths. Runs the upstream database migration automatically.

    Before upgrading an existing installation, export userfiles, public/userfiles and app/Plugins from the running old container into the corresponding app-data directories. The previous chart mounted only an unused /data directory; upgrading or restarting without exporting may lose container-local files. Third-party plugins must support 3.12.0; incompatible plugins are skipped by upstream. See the tested upgrade procedure in the draft PR.

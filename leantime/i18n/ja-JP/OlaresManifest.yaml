metadata:
  title: Leantime
  description: Leantime は、プロジェクトマネージャーではない人向けの目標志向プロジェクト管理システムです
spec:
  fullDescription: |
    Leantime は、プロジェクトマネージャーではない人向けのオープンソース・プロジェクト管理システムです。
    戦略・計画・実行を組み合わせ、チーム全員が使いやすくしています。
    ADHD、ディスレクシア、自閉症を念頭に設計されています。

    Trello のようにシンプルで、Jira のように機能豊富
    ClickUp、Monday、Asana の完璧な代替

    **主な機能:**
    タスク管理
    - カンバン、ガント、表、リスト、カレンダービューでのタスク管理
    - 無制限のサブタスクと依存関係
    - マイルストーン管理
    - スプリント管理
    - タイムトラッキング＆タイムシート

    プロジェクト計画
    - プロジェクトダッシュボード、レポート、ステータス更新
    - 目標とメトリクスの追跡
    - Lean & Business Model Canvas
    - SWOT 分析キャンバス
    - リスク分析

    情報／ナレッジ管理
    - Wiki / Docs
    - アイデアボード
    - レトロスペクティブ
    - S3 またはローカルファイルシステムでのファイル保存
    - 画面・ウェブカム録画
    - すべてへのコメント／ディスカッション

    管理
    - 簡単なインストール
    - 複数のユーザーロールとプロジェクトごとの権限
    - 二要素認証
    - LDAP、OIDC 連携
    - プラグインと API で拡張可能
    - Slack、Mattermost、Discord と連携
    - 20以上の言語で利用可能
  upgradeDescription: |
    Updates Leantime to 3.12.0 and PHP to 8.3.36. Persists uploaded files and plugins at their actual application paths. Runs the upstream database migration automatically.

    Before upgrading an existing installation, export userfiles, public/userfiles and app/Plugins from the running old container into the corresponding app-data directories. The previous chart mounted only an unused /data directory; upgrading or restarting without exporting may lose container-local files. Third-party plugins must support 3.12.0; incompatible plugins are skipped by upstream. See the tested upgrade procedure in the draft PR.

metadata:
  description: "Generic Ollama engine base. Pick any Ollama library model at install via env."
  title: Ollama Engine Base

spec:
  upgradeDescription: |
    Upgrade Ollama from v0.33.1 to v0.40.2. Chart 1.3.18.

    **What's Changed** (relevant to Olares)

    v0.40.2
    - Models pulled by older versions are upgraded in the background on first run, for better llama.cpp performance and compatibility
    - The pre-upgrade copy of each model is kept on disk as a backup, so upgraded models temporarily use extra storage
    - `ollama list` no longer shows duplicate entries for upgraded models

    v0.40.1
    - Cloud usage and balance APIs are now proxied by the server
    - Fixed a crash reading clef heads past 2GiB
    - Dropped the carried MLX Metal residency patch now that it is upstream

    v0.40.0
    - On Apple Silicon, model architectures supported by MLX now run on MLX by default (qwen3.8, gemma4, qwen3.6, qwen3.5, the decision models, and embeddinggemma-2)

    v0.35.1
    - Clef and Clef Flash multimodal decision models via `/v1/systemone`
    - Web search allows up to ten searches per response, up from three
    - Modelfiles support `CAPABILITY` declarations, preserved through GGUF/safetensors creation and model inheritance
    - Updated llama.cpp and the MLX engine

    v0.35.0
    - Decision models through `/v1/systemone`, with `choice`, `noul`, and `score` question types
    - Fixed stalled MLX model downloads hanging indefinitely
    - Requests using the deprecated `typical_p` parameter now log a warning instead of failing

    v0.34.4
    - Structured outputs on thinking models apply in a single pass, making them faster and more reliable
    - Fixed intermittent "model not found" errors with a large local library
    - Updated llama.cpp, MLX, and XGrammar

    v0.34.3
    - `GET /api/show` now advertises each model's thinking controls and default
    - Nemotron H vision models supported on MLX
    - Fixed model pulls from HuggingFace

    v0.34.2
    - Fixed excessive memory growth during long generations with MLX speculative decoding
    - Updated llama.cpp

    v0.34.1
    - `/api/tags` is much faster on large model libraries (3.1 s to 294 ms cold in testing), and capabilities are reported consistently
    - Runaway repeat token detection now requires 100 repeat tokens, reducing false positives
    - MLX safetensors `ollama create` is no longer experimental; `typical_p` can no longer be set on new models
    - MLX and llama.cpp updates

    v0.34.0
    - Improved structured output performance on Apple Silicon
    - Added OpenAI-compatible client tool search and response compaction

    v0.33.3
    - GGUF model-defined default parameters are now honored
    - Cached prompt tokens are now reported
    - gemma4 supports images and audio on MLX
    - MLX, MLX-C, and llama.cpp updates

    v0.33.2
    - The Claude Desktop proxy no longer interrupts in-flight requests when the model catalog updates

    For detailed release notes, visit:
    https://github.com/ollama/ollama/releases
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `ollama://<model>:<tag>`. The Ollama library source to pull your model, for example `ollama://qwen3.5:2b` or `ollama://gemma3:27b`. Browse models at https://ollama.com/library.
    - `MODEL_NAME`: `<model>:<tag>`. The name of your model — use the string after `ollama://` in `MODEL_SOURCE`, for example `qwen3.5:2b`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; use `embedding` for embedding models.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. Check the model page on ollama.com/library for capabilities.
    - `ENGINE_ARGS`: `OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 ...`. Chart defaults to `-1` on the ollama daemon (forever in VRAM); not forwarded by llm-init.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `OLLAMA_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.

    **How It Works**
    First, `llm-init` pulls your model from the Ollama library and gets it ready, then the Ollama daemon starts serving the model when it's ready. These two parts run separately but share files and progress info.

    **Stack**
    - **Ollama daemon** (port 11434): pulls and serves the model
    - **llm-init** (port 8090): drives model pull, shows progress, and provides the OpenAI API, proxying to Ollama

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `OLLAMA_REQUIRED_GPU_MEMORY`; Ollama uses GPU by default         |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                         |

    **Model Storage**
    All pulled models are stored in a shared folder at `appCommon/ollama`. All Ollama-based apps share this location, so blobs deduplicate by digest across installs.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - For large models (e.g. gemma3:27b), set `OLLAMA_CONTEXT_LENGTH` and `OLLAMA_KV_CACHE_TYPE` in `ENGINE_ARGS` to balance context length and VRAM usage.

metadata:
  description: "通用 Ollama 引擎基座。在安装时通过环境变量选择任意 Ollama 库模型。"
  title: Ollama 引擎基座

spec:
  upgradeDescription: |
    将 Ollama 从 v0.40.2 升级至 v0.40.12。Chart 1.3.19。

    **更新内容**（与 Olares 相关）

    v0.40.12
    - 新增 Liquid AI LFM3（文本、视觉、音频、全模态）以及 2B 的 d1 决策模型。本版本仅支持 Apple 硬件，Linux 与 Windows 支持将在后续版本提供。
    - Apple Silicon 上 Gemma 4、Flint、Laguna 的 prompt 处理更快。MLX 投机解码支持 DFlash2 草稿模型。Gemma 4 在小图上保留更多细节。
    - 修复 Kimi CLI 仅含工具调用的 assistant 回合。更新 MLX 与 llama.cpp。

    v0.40.11
    - macOS 上可以生成语音，包括兼容 OpenAI 的 `/v1/audio/speech`。
    - 新增 d3 决策模型（2B、4B、9B、27B），可根据文本、结构化状态或图像做分类、是/否判断或打分。

    v0.40.10
    - 新增 Nemotron 3.5 Bolt E4B，基于 Gemma 4 的较小视觉语言模型，上下文 128K，并带 DFlash 草稿用于投机解码。

    v0.40.9
    - Flint 现可在 Linux 和 Windows 上运行，不再仅限 macOS。
    - 流式 OpenAI Responses 与 Anthropic Messages 在生成失败时会返回错误，不再在部分输出后静默结束。
    - Anthropic 兼容的网页搜索会在后续请求中使用模型支持的思考设置。

    v0.40.8
    - 首次提供 Flint：约 40B 参数的 MoE 编程模型（每 token 约 2.5B 激活），上下文 262K。该版本仅支持 macOS。

    v0.40.7
    - 新增 pplx-decider，由 Qwen3.8-27B 微调而来的 27B 决策模型。
    - 继续一段 OpenAI Responses 对话时，在思考模型与非思考模型之间切换，或历史里含有其他提供方的压缩条目，不再失败。
    - 修复流式 Responses 中客户端工具调用可能早于未结束的推理条目发出的问题。
    - 客户端断开后，转发到远端模型的请求会在 ollama.com 上取消，不再继续运行。
    - `ollama show` 与 API 会返回 `renderer`、`parser` 和 `template_source`。更多草稿模型可用于投机解码，llama-server 会自动判断草稿类型。
    - 更新 llama.cpp 与 MLX。

    v0.40.6
    - GGUF 新增 q2_0 张量与文件类型。

    v0.40.5
    - 新增 Nemotron 3.5 Super（120B MoE，每 token 激活 12B，支持视觉、工具、思考，上下文最高 1M）和 Nemotron 3.5 Bolt（74B，每 token 激活 9B，面向 24 GB NVIDIA GPU，并带投机解码草稿）。
    - 继续一段包含自定义工具调用的 OpenAI Responses 对话不再失败。
    - 更新 llama.cpp（加入 Nemotron 3.5 支持）与 MLX。

    v0.40.4
    - 决策模型可在 `ollama run` 中用 `--ask` 直接使用。llama.cpp 原生支持决策模型。
    - llama-server 支持多模态 embedding，包括上下文窗口较小的模型。
    - 推理会复用已校验的 manifest 和已经加载的模型。

    v0.40.3
    - v0.40.2 开始的后台模型升级，在处理 embedding 和其他请求时会暂停。

    详细发布说明请访问：
    https://github.com/ollama/ollama/releases
  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`ollama://<模型>:<标签>`。Ollama 模型库下载源，例如 `ollama://qwen3.5:2b` 或 `ollama://gemma3:27b`。可在 https://ollama.com/library 浏览模型。
    - `MODEL_NAME`：`<模型>:<标签>`。模型名称，取 `MODEL_SOURCE` 中 `ollama://` 之后的字符串，例如 `qwen3.5:2b`。此项也作为 OpenAI 别名。
    - `MODEL_MODE`：`chat` 或 `embedding`。对话模型选 `chat`，向量模型选 `embedding`。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能，可在 ollama.com/library 查看模型能力。必填。
    - `ENGINE_ARGS`：`OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 ...`。未设置时图表在 ollama 守护进程默认 `-1`（常驻显存）；llm-init 不转发此项。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。llm-init 容器的日志等级。
    - `OLLAMA_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型所需显存。NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 从 Ollama 模型库拉取并准备模型，然后 Ollama 守护进程在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **Ollama 守护进程**（11434 端口）：拉取并服务模型
    - **llm-init**（8090 端口）：驱动模型拉取、展示进度，并通过 OpenAI API 代理到 Ollama

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `OLLAMA_REQUIRED_GPU_MEMORY`；Ollama 默认使用 GPU     |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有拉取的模型存储在共享目录 `appCommon/ollama`。所有 Ollama 应用共用此目录，按 digest 去重，避免重复占用存储。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - 部署大模型（如 gemma3:27b）时，可在 `ENGINE_ARGS` 中设置 `OLLAMA_CONTEXT_LENGTH` 和 `OLLAMA_KV_CACHE_TYPE` 以平衡上下文长度与显存占用

spec:
  onlyAdmin: true
  versionName: '0.40.12'
  upgradeDescription: |
    Upgrade Ollama from v0.40.2 to v0.40.12. Chart 1.3.19.

    **What's Changed** (relevant to Olares)

    v0.40.12
    - Liquid AI LFM3 (text, vision, audio, and omni) and the 2B d1 decision models are new. This release runs them on Apple hardware only; Linux and Windows support is coming later.
    - Faster Apple Silicon prompt processing for Gemma 4, Flint, and Laguna. Speculative decoding on MLX now accepts DFlash2 drafts. Gemma 4 keeps more detail in small images.
    - Fixed tool-only assistant turns from Kimi CLI. Updated MLX and llama.cpp.

    v0.40.11
    - Speech generation is available on macOS, including the OpenAI-compatible `/v1/audio/speech` endpoint.
    - d3 decision models (2B, 4B, 9B, and 27B) classify, answer yes/no, or score options from text, structured state, or an image.

    v0.40.10
    - Nemotron 3.5 Bolt E4B, a smaller Gemma 4-based vision-language model with a 128K context and a DFlash draft for speculative decoding.

    v0.40.9
    - Flint now runs on Linux and Windows as well as macOS.
    - Streaming OpenAI Responses and Anthropic Messages requests report generation failures instead of ending silently after partial output.
    - Anthropic-compatible web search uses the model's thinking setting in follow-up requests.

    v0.40.8
    - Flint, a 40B MoE coding model (about 2.5B active) with a 262K context, first shipped on macOS only.

    v0.40.7
    - pplx-decider, a 27B decision model fine-tuned from Qwen3.8-27B.
    - Continuing an OpenAI Responses conversation no longer fails when switching between thinking and non-thinking models, or when the history contains another provider's compaction items.
    - Fixed streaming Responses where client tool calls could be emitted before open reasoning items.
    - Requests routed to remote models are cancelled on ollama.com when the client disconnects.
    - `ollama show` and the API report `renderer`, `parser`, and `template_source`. More draft models work with speculative decoding because llama-server infers the draft type.
    - Updated llama.cpp and MLX.

    v0.40.6
    - GGUF gains the q2_0 tensor and file types.

    v0.40.5
    - Nemotron 3.5 Super (120B MoE, 12B active, vision, tools, thinking, up to 1M context) and Nemotron 3.5 Bolt (74B, 9B active, sized for a 24 GB NVIDIA GPU, with a speculative drafter).
    - Continuing an OpenAI Responses conversation that includes custom tool calls no longer fails.
    - Updated llama.cpp with Nemotron 3.5 support, and MLX.

    v0.40.4
    - Decision models can be used from `ollama run` with `--ask`. llama.cpp now has native decision model support.
    - Multimodal embeddings work through llama-server, including models with small context windows.
    - Inference reuses verified manifests and models that are already loaded.

    v0.40.3
    - Background model upgrades started in v0.40.2 now pause while embedding and other requests are being served.

    For detailed release notes, visit:
    https://github.com/ollama/ollama/releases
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `ollama://<model>:<tag>`. The Ollama library source to pull your model, for example `ollama://qwen3.5:2b` or `ollama://gemma3:27b`. Browse models at https://ollama.com/library.
    - `MODEL_NAME`: `<model>:<tag>`. The name of your model — use the string after `ollama://` in `MODEL_SOURCE`, for example `qwen3.5:2b`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; use `embedding` for embedding models.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. Check the model page on ollama.com/library for capabilities.
    - `ENGINE_ARGS`: `OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1`. Extra Ollama **daemon** options (ollama pod only). Separate multiple `key=value` pairs with spaces. If `OLLAMA_KEEP_ALIVE` is omitted, the chart defaults to `-1` (keep model in VRAM forever). This is **not** forwarded to `/api/chat` by llm-init (avoids OpenAI path 400). See https://github.com/ollama/ollama/blob/main/docs/faq.mdx.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `OLLAMA_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.

    **How It Works**
    First, `llm-init` pulls your model from the Ollama library and gets it ready, then the Ollama daemon starts serving the model when it's ready. These two parts run separately but share files and progress info.

    **Stack**
    - **Ollama daemon** (port 11434): pulls and serves the model
    - **llm-init** (port 8090): drives model pull, shows progress, and provides the OpenAI API, proxying to Ollama

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `OLLAMA_REQUIRED_GPU_MEMORY`; Ollama uses GPU by default         |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                         |

    **Model Storage**
    All pulled models are stored in a shared folder at `appCommon/ollama`. All Ollama-based apps share this location, so blobs deduplicate by digest across installs.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - For large models (e.g. gemma3:27b), set `OLLAMA_CONTEXT_LENGTH` and `OLLAMA_KV_CACHE_TYPE` in `ENGINE_ARGS` to balance context length and VRAM usage.

  developer: Ollama
  website: https://ollama.com/
  sourceCode: https://github.com/ollama/ollama
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/ollama/ollama#MIT-1-ov-file

  accelerator:
    #   nvidia       — discrete GPU; OLLAMA_REQUIRED_GPU_MEMORY -> gpumem
    #   nvidia-gb10  — DGX Spark unified memory; same env -> pod memory
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE        # example: ollama://qwen3.5:2b
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: ollama://qwen3.5:2b. The Ollama library source to pull your model. Use `ollama://<model>:<tag>` format. Browse models at https://ollama.com/library."
    regex: "^ollama://"
  - envName: MODEL_NAME          # example: qwen3.5:2b
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: qwen3.5:2b. The name of your model — use the string after `ollama://` in MODEL_SOURCE. This is also used as the OpenAI alias."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "The model capabilities. Pick what your model supports; check ollama.com/library for details. If no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # example: OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description: "Example: OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 .... KEEP_ALIVE is ollama-daemon-only (chart default -1, forever in VRAM)."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: OLLAMA_CPU_REQUEST    # default: 200m
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: OLLAMA_MEMORY_REQUEST # default: 2Gi
    required: true
    default: "2Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: OLLAMA_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: OLLAMA_MEMORY_LIMIT   # default: 35Gi
    required: true
    default: "35Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: OLLAMA_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    description: "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB. On Spark it sets pod memory."
    regex: "^[0-9]+(Gi|Mi)?$"

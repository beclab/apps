metadata:
  title: Gemma4 26B A4B UD-XL (Ollama)
  description: "Gemma4 26B A4B MoE (Unsloth Dynamic UD-Q4_K_XL) inferenza multimodale locale"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un’app condivisa. Una volta installata dall’Admin Olares, tutti gli utenti del cluster possono usarla tramite l’app di riferimento.
    Il traffico utente passa dal proxy a Ollama.

    **MODELLO**
    Usa la quantizzazione Unsloth Dynamic da `unsloth/gemma-4-26B-A4B-it-GGUF` (`gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La quantizzazione UD a precisione mista preserva una qualità vicina a Q5_K_M mantenendo un throughput di decode vicino al Q4_K_M standard, con visione completa (mmproj).
    Usa il chat template incorporato nel GGUF per tool calling e input immagine affidabili. Thinking abilitato di default (OLLAMA_THINKING=""); i client possono disabilitarlo per richiesta.

    Gemma 4 26B-A4B è un modello Mixture-of-Experts: 26B parametri totali con ~4B attivati per token.

  upgradeDescription: |
    Aggiornare il runtime Ollama a ollama/ollama:0.30.10.
    Aggiornare il proxy API Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url vision OpenAI).

metadata:
  title: Gemma4 26B A4B UD-XL (Ollama)
  description: "Gemma4 26B A4B MoE (Unsloth Dynamic UD-Q4_K_XL) inférence multimodale locale"

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s’agit d’une app partagée. Une fois installée par l’Admin Olares, tous les utilisateurs du cluster peuvent l’utiliser via l’app de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.

    **MODÈLE**
    Utilise la quantification Unsloth Dynamic de `unsloth/gemma-4-26B-A4B-it-GGUF` (`gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La quantification UD en précision mixte préserve une qualité proche de Q5_K_M tout en gardant un débit de decode proche du Q4_K_M standard, avec vision complète (mmproj).
    Utilise le chat template intégré au GGUF pour un tool calling et une entrée image fiables. Thinking activé par défaut (OLLAMA_THINKING="") ; les clients peuvent le désactiver par requête.

    Gemma 4 26B-A4B est un modèle Mixture-of-Experts : 26B paramètres au total avec ~4B activés par token.

  upgradeDescription: |
    Mise à niveau du runtime Ollama vers ollama/ollama:0.30.10.
    Mise à niveau du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).

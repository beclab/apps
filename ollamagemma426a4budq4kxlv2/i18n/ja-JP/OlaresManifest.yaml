metadata:
  title: Gemma4 26B A4B UD-XL (Ollama)
  description: "Gemma4 26B A4B MoE（Unsloth Dynamic UD-Q4_K_XL）マルチモーダルローカル推論"

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。

    **モデル**
    `unsloth/gemma-4-26B-A4B-it-GGUF`（`gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`）の Unsloth Dynamic 量子化を使用。
    混合精度 UD 量子化は Q5_K_M に近い品質を保ちつつ、標準 Q4_K_M に近いデコードスループットを維持し、Vision（mmproj）も完全に保持します。
    信頼性の高いツール呼び出しと画像入力のため GGUF 埋め込みチャットテンプレートを使用。Thinking はデフォルト有効（OLLAMA_THINKING=""）。クライアントはリクエスト単位で無効化できます。

    Gemma 4 26B-A4B は Mixture-of-Experts モデルで、総パラメータ 26B、トークンあたり約 4B が活性化されます。

  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 へアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 へアップグレード（OpenAI vision image_url 転送）。

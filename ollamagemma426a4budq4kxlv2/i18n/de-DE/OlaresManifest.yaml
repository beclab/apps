metadata:
  title: Gemma4 26B A4B UD-XL (Ollama)
  description: "Gemma4 26B A4B MoE (Unsloth Dynamic UD-Q4_K_XL) multimodale lokale Inferenz"

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.
    Nutzerverkehr läuft über den Proxy zu Ollama.

    **MODELL**
    Nutzt Unsloth Dynamic Quant aus `unsloth/gemma-4-26B-A4B-it-GGUF` (`gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Die Mixed-Precision-UD-Quantisierung erhält Qualität nahe Q5_K_M und hält den Decode-Durchsatz nahe dem Standard-Q4_K_M, bei voller Vision (mmproj).
    Verwendet das in GGUF eingebettete Chat-Template für zuverlässiges Tool Calling und Bildeingabe. Thinking standardmäßig aktiviert (OLLAMA_THINKING=""); Clients können es pro Anfrage deaktivieren.

    Gemma 4 26B-A4B ist ein Mixture-of-Experts-Modell: 26B Parameter insgesamt, ~4B pro Token aktiviert.

  upgradeDescription: |
    Upgrade der Ollama-Runtime auf ollama/ollama:0.30.10.
    Upgrade des Olares-API-Proxys auf beclab/harveyff-olares-ollama:v0.1.22 (OpenAI vision image_url-Weiterleitung).

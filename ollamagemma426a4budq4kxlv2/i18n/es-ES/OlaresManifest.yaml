metadata:
  title: Gemma4 26B A4B UD-XL (Ollama)
  description: "Gemma4 26B A4B MoE (Unsloth Dynamic UD-Q4_K_XL) inferencia multimodal local"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Admin de Olares, todos los usuarios del clúster pueden usarla mediante la app de referencia.
    El tráfico de usuarios pasa por el proxy hacia Ollama.

    **MODELO**
    Usa la cuantización Unsloth Dynamic de `unsloth/gemma-4-26B-A4B-it-GGUF` (`gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La cuantización UD de precisión mixta conserva calidad cercana a Q5_K_M manteniendo un throughput de decode cercano al Q4_K_M estándar, con visión completa (mmproj).
    Usa la plantilla de chat incrustada en GGUF para tool calling e entrada de imagen fiables. Thinking activado por defecto (OLLAMA_THINKING=""); los clientes pueden desactivarlo por petición.

    Gemma 4 26B-A4B es un modelo Mixture-of-Experts: 26B parámetros totales con ~4B activados por token.

  upgradeDescription: |
    Actualizar el runtime de Ollama a ollama/ollama:0.30.10.
    Actualizar el proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).

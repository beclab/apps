metadata:
  title: Sickchill
  description: SickChill は TV 番組向けの自動ビデオライブラリマネージャーです
spec:
  upgradeDescription: |
    SickChill を 2026.9.18 に更新し、TVDB v4 対応とメディア処理の修正を含みます。既存のデータパスを維持し、起動時は必要なディレクトリの所有権のみを設定します。

  fullDescription: |
    Sickchill はお気に入り番組の新エピソードを監視し、公開されるとマジックを実行します：希望の画質での自動 torrent/nzb 検索、ダウンロード、処理。

    **機能**
    - Kodi/XBMC ライブラリ更新、ポスター/バナー/ファンアートのダウンロード、NFO/TBN 生成
    - 設定可能な自動エピソードリネーム、ソート、その他の処理
    - 欠けているエピソード、まもなく放送、などを簡単に確認
    - 自動 torrent/nzb 検索、クライアントへの送信、希望画質での処理
    - 公開・非公開を含む最大級の対応 torrent / newznab / torznab プロバイダー一覧
    - 新エピソード時に Kodi、XBMC、Growl、Trakt、Twitter などへ通知
    - TheTVDB、AniDB.net、iMDB、FanArt.tv などで番組・シーズン・エピソード・メタデータを検索
    - エピソード状態管理によりシーズン/エピソードを一括失敗させて再試行を強制可能
    - Air-By-Date ではなく DVD 順で結果を返す DVD Order 番号付け
    - インポート時にショー情報を検索するインデクサーを選択可能
    - シーズン/エピソードの自動 XEM Scene Numbering/Naming
    - 任意のプラットフォームで利用可能、シンプルな HTTP インターフェース
    - スペシャルおよびマルチエピソード torrent/nzb 対応
    - 字幕の自動マッチングとダウンロード
    - 失敗したダウンロード処理の改善
    - NZBGet 12+ 向け DupeKey/DupeScore
    - 本物の SSL 証明書検証
    - アニメ番組をサポート


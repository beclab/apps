metadata:
  title: Sickchill
  description: SickChill est un gestionnaire automatique de bibliothèque vidéo pour les séries TV
spec:
  upgradeDescription: |
    Mise à jour de SickChill vers 2026.9.18 avec prise en charge de TVDB v4 et corrections du traitement multimédia. Les chemins existants sont conservés ; seuls les propriétaires des répertoires nécessaires sont définis au démarrage.

  fullDescription: |
    Sickchill surveille les nouveaux épisodes de vos séries préférées et, lorsqu'ils sont publiés, fait sa magie : recherche automatique de torrents/nzb, téléchargement et traitement aux qualités souhaitées.

    **Fonctionnalités**
    - Mises à jour de bibliothèque Kodi/XBMC, téléchargements poster/banner/fanart et génération NFO/TBN
    - Renommage, tri et autre traitement automatique d'épisodes configurable
    - Voyez facilement les épisodes manquants, bientôt diffusés, et plus
    - Recherche automatique torrent/nzb, envoi à votre client et traitement à la qualité souhaitée
    - La plus grande liste de fournisseurs torrent, newznab et torznab – publics et privés
    - Notifie Kodi, XBMC, Growl, Trakt, Twitter et plus lors de nouveaux épisodes
    - Recherche sur TheTVDB, AniDB.net, iMDB, FanArt.tv et plus séries, saisons, épisodes et métadonnées
    - Gestion du statut d'épisode permet d'échouer en masse saisons/épisodes pour forcer les nouvelles tentatives
    - Numérotation DVD Order pour renvoyer les résultats en ordre DVD plutôt qu'Air-By-Date
    - Choisissez quel indexeur utiliser pour les infos de la série à l'import
    - XEM Scene Numbering/Naming automatique pour saisons/épisodes
    - Disponible sur toute plateforme, interface HTTP simple
    - Support des specials et torrent/nzb multi-épisodes
    - Correspondance et téléchargement automatiques de sous-titres
    - Meilleure gestion des téléchargements échoués
    - DupeKey/DupeScore pour NZBGet 12+
    - Validation réelle des certificats SSL
    - Prend en charge les séries Anime


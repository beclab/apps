metadata:
  title: Sickchill
  description: SickChill es un gestor automático de biblioteca de vídeo para series de TV
spec:
  upgradeDescription: |
    Actualiza SickChill a 2026.9.18 con soporte para TVDB v4 y correcciones del procesamiento multimedia. Conserva las rutas existentes y ajusta al iniciar solo la propiedad de los directorios necesarios.

  fullDescription: |
    Sickchill vigila nuevos episodios de sus series favoritas y, cuando se publican, hace su magia: búsqueda automática de torrents/nzb, descarga y procesamiento en las calidades que desee.

    **Funciones**
    - Actualizaciones de biblioteca Kodi/XBMC, descargas de póster/banner/fanart y generación NFO/TBN
    - Renombrado, ordenación y otro procesamiento automático de episodios configurable
    - Vea fácilmente qué episodios faltan, se emiten pronto y más
    - Búsqueda automática de torrent/nzb, envío a su cliente y procesamiento en la calidad deseada
    - La mayor lista de proveedores torrent, newznab y torznab – públicos y privados
    - Notifica a Kodi, XBMC, Growl, Trakt, Twitter y más cuando hay nuevos episodios
    - Busca en TheTVDB, AniDB.net, iMDB, FanArt.tv y más series, temporadas, episodios y metadatos
    - Gestión de estado de episodios permite fallar en masa temporadas/episodios para forzar reintentos
    - Numeración DVD Order para devolver resultados en orden DVD en lugar de Air-By-Date
    - Elija qué indexador usar para la info de la serie al importar
    - XEM Scene Numbering/Naming automático para temporadas/episodios
    - Disponible en cualquier plataforma, interfaz HTTP sencilla
    - Soporte de specials y torrent/nzb multi-episodio
    - Emparejado y descarga automática de subtítulos
    - Mejor gestión de descargas fallidas
    - DupeKey/DupeScore para NZBGet 12+
    - Validación real de certificados SSL
    - Compatible con series Anime


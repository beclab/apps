metadata:
  title: Sickchill
  description: SickChill è un gestore automatico di libreria video per serie TV
spec:
  upgradeDescription: |
    Aggiorna SickChill a 2026.9.18 con supporto TVDB v4 e correzioni dell’elaborazione multimediale. Mantiene i percorsi esistenti e imposta all’avvio solo la proprietà delle directory necessarie.

  fullDescription: |
    Sickchill controlla i nuovi episodi delle tue serie preferite e, quando vengono pubblicati, fa la sua magia: ricerca automatica di torrent/nzb, download ed elaborazione alle qualità desiderate.

    **Funzionalità**
    - Aggiornamenti libreria Kodi/XBMC, download poster/banner/fanart e generazione NFO/TBN
    - Rinomina, ordinamento e altra elaborazione automatica degli episodi configurabile
    - Vedi facilmente quali episodi mancano, vanno in onda presto e altro
    - Ricerca automatica torrent/nzb, invio al client ed elaborazione alla qualità desiderata
    - L'elenco più ampio di provider torrent, newznab e torznab – pubblici e privati
    - Notifica Kodi, XBMC, Growl, Trakt, Twitter e altri quando ci sono nuovi episodi
    - Cerca su TheTVDB, AniDB.net, iMDB, FanArt.tv e altri show, stagioni, episodi e metadati
    - Gestione stato episodi consente di far fallire in massa stagioni/episodi per forzare i retry
    - Numerazione DVD Order per risultati in ordine DVD invece di Air-By-Date
    - Scegli quale indexer usare per le info dello show in importazione
    - XEM Scene Numbering/Naming automatico per stagioni/episodi
    - Disponibile su qualsiasi piattaforma, interfaccia HTTP semplice
    - Supporto specials e torrent/nzb multi-episodio
    - Matching e download automatico dei sottotitoli
    - Gestione migliorata dei download falliti
    - DupeKey/DupeScore per NZBGet 12+
    - Validazione reale dei certificati SSL
    - Supporta show Anime


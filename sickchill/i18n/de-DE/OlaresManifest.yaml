metadata:
  title: Sickchill
  description: SickChill ist ein automatischer Video-Bibliotheks-Manager für TV-Serien
spec:
  upgradeDescription: |
    SickChill wird auf 2026.9.18 mit TVDB-v4-Unterstützung und Korrekturen bei der Medienverarbeitung aktualisiert. Bestehende Datenpfade bleiben erhalten; beim Start werden nur die Eigentümer der erforderlichen Verzeichnisse gesetzt.

  fullDescription: |
    Sickchill überwacht neue Folgen Ihrer Lieblingsserien und führt bei Veröffentlichung seine Magie aus: automatische Torrent-/NZB-Suche, Download und Verarbeitung in den gewünschten Qualitäten.

    **Funktionen**
    - Kodi/XBMC-Bibliotheksaktualisierungen, Poster-/Banner-/Fanart-Downloads und NFO/TBN-Erzeugung
    - Konfigurierbare automatische Folgenumbenennung, Sortierung und weitere Verarbeitung
    - Fehlende Folgen, baldige Ausstrahlung und mehr leicht erkennen
    - Automatische Torrent-/NZB-Suche, Versand an Ihren Client und Verarbeitung in gewünschter Qualität
    - Größte Liste unterstützter Torrent-, Newznab- und Torznab-Anbieter – öffentlich und privat
    - Benachrichtigung von Kodi, XBMC, Growl, Trakt, Twitter und mehr bei neuen Folgen
    - Suche bei TheTVDB, AniDB.net, iMDB, FanArt.tv und mehr nach Shows, Staffeln, Folgen und Metadaten
    - Folgenstatusverwaltung ermöglicht Massen-Fail von Staffeln/Folgen zum erzwungenen erneuten Versuch
    - DVD-Order-Nummerierung für Ergebnisse in DVD- statt Air-By-Date-Reihenfolge
    - Wahl des Indexers für Show-Infos beim Import
    - Automatische XEM Scene Numbering/Naming für Staffeln/Folgen
    - Für jede Plattform verfügbar, einfache HTTP-Oberfläche
    - Support für Specials und Multi-Episode-Torrent/NZB
    - Automatisches Untertitel-Matching und -Download
    - Verbesserte Behandlung fehlgeschlagener Downloads
    - DupeKey/DupeScore für NZBGet 12+
    - Echte SSL-Zertifikatsvalidierung
    - Unterstützt Anime-Shows


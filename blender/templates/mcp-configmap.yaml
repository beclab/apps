apiVersion: v1
kind: ConfigMap
metadata:
  name: blender-mcp-scripts
  namespace: {{ .Release.Namespace }}
data:
  mcp-install: |
    #!/usr/bin/with-contenv bash
    # Fetch the upstream blender-mcp addon into Blender's startup scripts. The
    # browser-visible Blender loads it and auto-starts port 9876, so agents and
    # the Selkies UI share one scene.
    set -euo pipefail
    mkdir -p /config/mcp-scripts/startup
    curl -fsSL --max-time 60 -o /config/mcp-scripts/startup/blender_mcp.py \
      https://raw.githubusercontent.com/ahujasid/blender-mcp/main/addon.py
    chown 1000:1000 \
      /config/mcp-scripts \
      /config/mcp-scripts/startup \
      /config/mcp-scripts/startup/blender_mcp.py

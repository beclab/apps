olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  blender: 1

metadata:
  name: blender
  appid: blender
  title: Blender
  description: Blender 3D modeling, animation and rendering, streamed to your browser.
  icon: https://cdn.olares.com/images/2026/09/e72645588778ba17ea5cbf2a18a094f9.png
  version: 0.1.27
  categories:
  - workspace

permission:
  appData: true
  userData:
  - Home

spec:
  versionName: "5.2.2"
  fullDescription: |
    Blender is the free and open source 3D creation suite. It supports the
    complete 3D pipeline, including modeling, sculpting, rigging, animation,
    simulation, rendering, compositing, motion tracking, video editing, and
    game asset creation.

    This Olares package runs Blender as a responsive browser-accessible
    desktop. Choose CPU, Intel, or NVIDIA compute mode during installation.
    Intel and NVIDIA modes can use hardware video encoding when supported by
    the selected Olares node.

    Highlights
    - Create and sculpt detailed 3D models
    - Animate characters, objects, cameras, and scenes
    - Render with Eevee or Cycles
    - Composite visual effects and edit video
    - Extend workflows with Blender add-ons and Python scripting
    - Let other Olares apps or MCP clients (Codex, Hermes, OpenCode)
      operate the same live scene via the Blender MCP entrance

    Recommended AI workflow
    - Connect the Blender MCP entrance to Lares, the Olares AI assistant
    - Describe a scene in natural language and watch Lares build it live
      in the same Blender window
    - Save renders under Home so Lares can retrieve and present them

    Storage
    - Blender preferences and application state persist in private app data
    - Projects saved under Home remain visible in Olares Files

    Requirements
    - Olares 1.12.7 or later
    - amd64 or arm64 node
  featuredImage: https://cdn.olares.com/images/2026/09/72ee666eb2424e99056704d31c3d8b56.png
  promoteImage:
  - https://cdn.olares.com/images/2026/09/72ee666eb2424e99056704d31c3d8b56.png
  - https://cdn.olares.com/images/2026/09/bccdf4a74a36c91ea9d6e6d59df250e5.png
  - https://cdn.olares.com/images/2026/09/c9c8ee455c17a73404a0753a0101991f.png
  - https://cdn.olares.com/images/2026/09/b89b3d62209a1f17a60db5216e1d9eba.png
  developer: Blender Foundation
  website: https://www.blender.org/
  sourceCode: https://github.com/linuxserver/docker-blender
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  license:
  - text: GPL-3.0
    url: https://github.com/blender/blender/blob/main/COPYING
  runAsUser: false
  supportArch:
  - amd64
  - arm64
  accelerator:
  - mode: cpu
    requiredCpu: "1"
    limitedCpu: "13"
    requiredMemory: 4Gi
    limitedMemory: 13Gi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
  - mode: intel
    requiredCpu: "1"
    limitedCpu: "13"
    requiredMemory: 4Gi
    limitedMemory: 13Gi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: "1"
    limitedCpu: "13"
    requiredMemory: 4Gi
    limitedMemory: 13Gi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
    requiredGPUMemory: 4Gi
    limitedGPUMemory: 12Gi

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.7-0'
    type: system

envs:
  - envName: STREAM_WIDTH
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: "1920"
    description: "Locked stream width. The desktop is software-encoded, so a larger frame costs CPU."
  - envName: STREAM_HEIGHT
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: "1080"
    description: "Locked stream height."
  - envName: STREAM_MAX_FPS
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: "30"
    description: "Upper bound of the framerate slider; the client can still pick anything down to 8."

entrances:
- name: blender
  host: blender
  port: 3000
  title: Blender
  icon: https://cdn.olares.com/images/2026/09/e72645588778ba17ea5cbf2a18a094f9.png
  authLevel: private
  openMethod: default
# MCP/SSE endpoint for agents. Not a web page, so it stays out of the launcher.
- name: blendermcp
  host: blendermcp
  port: 8765
  title: Blender MCP
  icon: https://cdn.olares.com/images/2026/09/e72645588778ba17ea5cbf2a18a094f9.png
  authLevel: internal
  invisible: true

metadata:
  title: Blender
  description: Blender für 3D-Modellierung, Animation und Rendering, direkt im Browser.

spec:
  fullDescription: |
    Blender ist die freie und quelloffene 3D-Creation-Suite. Sie deckt die
    komplette 3D-Pipeline ab: Modellierung, Sculpting, Rigging, Animation,
    Simulation, Rendering, Compositing, Motion Tracking, Videoschnitt und die
    Erstellung von Spiele-Assets.

    Dieses Olares-Paket stellt Blender als Desktop bereit, der direkt im
    Browser bedient wird. Wähle bei der Installation den Rechenmodus CPU,
    Intel oder NVIDIA. Intel- und NVIDIA-Modus können Hardware-Videokodierung
    nutzen, sofern der gewählte Olares-Knoten sie unterstützt.

    Highlights
    - Detaillierte 3D-Modelle erstellen und sculpten
    - Figuren, Objekte, Kameras und Szenen animieren
    - Mit Eevee oder Cycles rendern
    - Visuelle Effekte compositen und Videos schneiden
    - Workflows mit Blender-Add-ons und Python-Skripten erweitern
    - Dieselbe Live-Szene über den Blender-MCP-Eingang von anderen Olares-Apps oder MCP-Clients steuern

    Speicher
    - Einstellungen und Anwendungszustand liegen in den privaten App-Daten
    - Unter Home gespeicherte Projekte bleiben in Olares Files sichtbar

    Voraussetzungen
    - Olares 1.12.7 oder neuer
    - amd64- oder arm64-Knoten

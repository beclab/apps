metadata:
  title: Blender
  description: 3D モデリング、アニメーション、レンダリングをブラウザーで実行できる Blender。

spec:
  fullDescription: |
    Blender は自由でオープンソースの 3D 制作スイートです。モデリング、スカルプト、
    リギング、アニメーション、シミュレーション、レンダリング、コンポジット、
    モーショントラッキング、動画編集、ゲームアセット制作まで、3D パイプライン全体を
    カバーします。

    この Olares アプリは、Blender をブラウザーから操作できるデスクトップとして
    実行します。インストール時に CPU、Intel、NVIDIA の計算モードを選択できます。
    選択した Olares ノードが対応している場合、Intel と NVIDIA のモードでは
    ハードウェア動画エンコードを利用できます。

    主な機能
    - 精細な 3D モデルの作成とスカルプト
    - キャラクター、オブジェクト、カメラ、シーンのアニメーション
    - Eevee または Cycles でのレンダリング
    - 視覚効果のコンポジットと動画編集
    - Blender アドオンと Python スクリプトによるワークフロー拡張
    - 他の Olares アプリや MCP クライアントからポート 8765 経由でブラウザーに表示される同じライブシーンを操作

    ストレージ
    - Blender の設定とアプリの状態はアプリ専用データに保存されます
    - Home 配下に保存したプロジェクトは Olares Files から参照できます

    動作要件
    - Olares 1.12.7 以降
    - amd64 または arm64 ノード

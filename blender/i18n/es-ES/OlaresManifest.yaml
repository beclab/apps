metadata:
  title: Blender
  description: Blender para modelado 3D, animación y renderizado, desde el navegador.

spec:
  fullDescription: |
    Blender es la suite de creación 3D libre y de código abierto. Cubre toda la
    canalización 3D: modelado, escultura, rigging, animación, simulación,
    renderizado, composición, seguimiento de movimiento, edición de vídeo y
    creación de recursos para videojuegos.

    Este paquete de Olares ejecuta Blender como un escritorio accesible desde
    el navegador. Elige el modo de cómputo CPU, Intel o NVIDIA durante la
    instalación. Los modos Intel y NVIDIA pueden usar codificación de vídeo por
    hardware cuando el nodo de Olares seleccionado lo permite.

    Puntos destacados
    - Crea y esculpe modelos 3D detallados
    - Anima personajes, objetos, cámaras y escenas
    - Renderiza con Eevee o Cycles
    - Compón efectos visuales y edita vídeo
    - Amplía el flujo de trabajo con complementos y scripts de Python
    - Controla desde otras apps de Olares o clientes MCP la misma escena en vivo a través de la entrada Blender MCP

    Almacenamiento
    - Las preferencias y el estado de la aplicación se guardan en datos privados
    - Los proyectos guardados en Home siguen visibles en Olares Files

    Requisitos
    - Olares 1.12.7 o posterior
    - Nodo amd64 o arm64

metadata:
  title: Blender
  description: Blender 三维建模、动画与渲染，直接在浏览器中使用。

spec:
  upgradeDescription: |
    - 将 Blender 从 5.2.2 升级至 5.2.3 LTS。
    - 仅向 Blender 容器注入 GPU 资源，MCP 辅助容器不申请 GPU。
    - MCP 辅助容器的基础镜像改用 beclab Docker Hub 镜像。
    - 在受影响的 Olares 1.12.7 系统上，现有 GPU 安装升级后可能仍保留 MCP 容器的旧 GPU 请求；该平台清理问题尚未解决。
  fullDescription: |
    Blender 是自由开源的三维创作套件，覆盖完整的三维流程：建模、雕刻、绑定、
    动画、模拟、渲染、合成、运动跟踪、视频剪辑以及游戏资产制作。

    本 Olares 应用把 Blender 封装成可在浏览器中直接操作的桌面环境。安装时可以
    选择 CPU、Intel 或 NVIDIA 计算模式；当所选 Olares 节点支持时，Intel 与
    NVIDIA 模式可启用硬件视频编码。

    功能亮点
    - 创建并雕刻精细的三维模型
    - 为角色、物体、摄像机与场景制作动画
    - 使用 Eevee 或 Cycles 渲染
    - 合成视觉特效并剪辑视频
    - 通过 Blender 插件与 Python 脚本扩展工作流
    - 其他 Olares 应用或 MCP 客户端（Codex、Hermes、OpenCode）可通过 Blender MCP 入口操作同一实时场景

    推荐的 AI 工作流
    - 将 Blender MCP 入口连接到 Olares AI 助手 Lares
    - 用自然语言描述场景，并在同一个 Blender 窗口中实时查看 Lares 的创建过程
    - 将渲染结果保存到 Home，Lares 即可获取并展示

    存储
    - Blender 的偏好设置与应用状态保存在应用私有数据中
    - 保存到 Home 目录下的项目文件可在 Olares 文件中查看

    运行要求
    - Olares 1.12.7 或更高版本
    - amd64 或 arm64 节点

metadata:
  title: Blender
  description: Blender pour la modélisation 3D, l'animation et le rendu, dans le navigateur.

spec:
  fullDescription: |
    Blender est la suite de création 3D libre et open source. Elle couvre toute
    la chaîne 3D : modélisation, sculpture, rigging, animation, simulation,
    rendu, compositing, suivi de mouvement, montage vidéo et création d'assets
    de jeu.

    Ce paquet Olares exécute Blender comme un bureau accessible depuis le
    navigateur. Choisissez le mode de calcul CPU, Intel ou NVIDIA lors de
    l'installation. Les modes Intel et NVIDIA peuvent utiliser l'encodage vidéo
    matériel lorsque le nœud Olares choisi le permet.

    Points clés
    - Créer et sculpter des modèles 3D détaillés
    - Animer personnages, objets, caméras et scènes
    - Effectuer le rendu avec Eevee ou Cycles
    - Composer des effets visuels et monter des vidéos
    - Étendre les flux de travail avec des add-ons et des scripts Python
    - Piloter depuis d'autres apps Olares ou clients MCP la même scène en direct visible dans le navigateur (port 8765)

    Stockage
    - Les préférences et l'état de l'application restent dans les données privées
    - Les projets enregistrés dans Home restent visibles dans Olares Files

    Prérequis
    - Olares 1.12.7 ou version ultérieure
    - Nœud amd64 ou arm64

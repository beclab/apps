metadata:
  title: Blender
  description: Blender 3D modeling, animation and rendering, streamed to your browser.

spec:
  fullDescription: |
    Blender is the free and open source 3D creation suite. It supports the
    complete 3D pipeline, including modeling, sculpting, rigging, animation,
    simulation, rendering, compositing, motion tracking, video editing, and
    game asset creation.

    This Olares package runs Blender as a responsive browser-accessible
    desktop. Choose CPU, Intel, or NVIDIA compute mode during installation.
    Intel and NVIDIA modes can use hardware video encoding when supported by
    the selected Olares node.

    Highlights
    - Create and sculpt detailed 3D models
    - Animate characters, objects, cameras, and scenes
    - Render with Eevee or Cycles
    - Composite visual effects and edit video
    - Extend workflows with Blender add-ons and Python scripting
    - Let other Olares apps or MCP clients (Codex, Hermes, OpenCode)
      operate the same live scene via the Blender MCP entrance

    Recommended AI workflow
    - Connect the Blender MCP entrance to Lares, the Olares AI assistant
    - Describe a scene in natural language and watch Lares build it live
      in the same Blender window
    - Save renders under Home so Lares can retrieve and present them

    Storage
    - Blender preferences and application state persist in private app data
    - Projects saved under Home remain visible in Olares Files

    Requirements
    - Olares 1.12.7 or later
    - amd64 or arm64 node

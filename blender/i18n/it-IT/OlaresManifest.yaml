metadata:
  title: Blender
  description: Blender per modellazione 3D, animazione e rendering, dal browser.

spec:
  fullDescription: |
    Blender è la suite di creazione 3D libera e open source. Copre l'intera
    pipeline 3D: modellazione, sculpting, rigging, animazione, simulazione,
    rendering, compositing, motion tracking, montaggio video e creazione di
    asset per videogiochi.

    Questo pacchetto Olares esegue Blender come desktop utilizzabile dal
    browser. Durante l'installazione puoi scegliere la modalità di calcolo CPU,
    Intel o NVIDIA. Le modalità Intel e NVIDIA possono usare la codifica video
    hardware quando il nodo Olares selezionato la supporta.

    In evidenza
    - Crea e scolpisci modelli 3D dettagliati
    - Anima personaggi, oggetti, telecamere e scene
    - Esegui il rendering con Eevee o Cycles
    - Componi effetti visivi e monta video
    - Estendi il flusso di lavoro con add-on e script Python
    - Controlla da altre app Olares o client MCP la stessa scena live mostrata nel browser (porta 8765)

    Archiviazione
    - Preferenze e stato dell'applicazione restano nei dati privati dell'app
    - I progetti salvati in Home restano visibili in Olares Files

    Requisiti
    - Olares 1.12.7 o successivo
    - Nodo amd64 o arm64

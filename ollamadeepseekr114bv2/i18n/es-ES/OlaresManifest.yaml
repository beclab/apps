metadata:
  title: DeepSeek-R1 14B (Ollama)
  description: Una familia de modelos de razonamiento abiertos con un rendimiento cercano al de los modelos líderes
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla a través de la aplicación de referencia.
    
    **RESUMEN DEL MODELO**
    DeepSeek-R1 ha recibido una actualización menor a DeepSeek-R1-0528 para el modelo destilado de 8 mil millones de parámetros y el modelo completo de 671 mil millones de parámetros. En esta actualización, DeepSeek R1 ha mejorado significativamente sus capacidades de razonamiento e inferencia. El modelo ha demostrado un rendimiento sobresaliente en diversas evaluaciones de referencia, incluidas matemáticas, programación y lógica general. Su rendimiento general se acerca ahora al de modelos líderes como O3 y Gemini 2.5 Pro.
    
    Los modelos DeepSeek-R1-Distill se afinan a partir de modelos de código abierto, usando muestras generadas por DeepSeek-R1.
    
    DeepSeek-R1-Distill-Qwen-14B
    - Modelo base: Qwen2.5-14B
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

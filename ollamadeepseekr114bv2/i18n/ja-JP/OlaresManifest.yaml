metadata:
  title: DeepSeek-R1 14B (Ollama)
  description: 先進モデルに迫る性能を持つオープンな推論モデルファミリー
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    
    **モデル概要**
    DeepSeek-R1 は、80億パラメータの蒸留モデルと6710億パラメータのフルモデル向けに DeepSeek-R1-0528 へのマイナーバージョンアップを受けました。この更新で DeepSeek R1 は推論能力を大幅に向上させました。数学、プログラミング、一般論理を含む各種ベンチマーク評価で優れた性能を示し、総合性能は O3 や Gemini 2.5 Pro などの先進モデルに近づいています。
    
    DeepSeek-R1-Distill モデルは、DeepSeek-R1 が生成したサンプルを用いてオープンソースモデルをファインチューニングしたものです。
    
    DeepSeek-R1-Distill-Qwen-14B
    - ベースモデル: Qwen2.5-14B
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。
    
    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。

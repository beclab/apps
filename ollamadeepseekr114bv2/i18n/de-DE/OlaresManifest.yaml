metadata:
  title: DeepSeek-R1 14B (Ollama)
  description: Führenden Modellen nahekommende Leistung bietende Familie offener Reasoning-Modelle
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    
    **MODELLÜBERSICHT**
    DeepSeek-R1 hat ein kleines Versions-Upgrade auf DeepSeek-R1-0528 für das destillierte 8-Milliarden-Parameter-Modell und das vollständige 671-Milliarden-Parameter-Modell erhalten. In diesem Update hat DeepSeek R1 seine Reasoning- und Inferenzfähigkeiten deutlich verbessert. Das Modell zeigte herausragende Leistung in verschiedenen Benchmark-Evaluationen, einschließlich Mathematik, Programmierung und allgemeiner Logik. Die Gesamtleistung nähert sich nun führenden Modellen wie O3 und Gemini 2.5 Pro.
    
    DeepSeek-R1-Distill-Modelle werden auf Basis von Open-Source-Modellen feinabgestimmt und nutzen von DeepSeek-R1 erzeugte Samples.
    
    DeepSeek-R1-Distill-Qwen-14B
    - Basismodell: Qwen2.5-14B
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

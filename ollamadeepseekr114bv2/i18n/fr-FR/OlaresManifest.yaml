metadata:
  title: DeepSeek-R1 14B (Ollama)
  description: Une famille de modèles de raisonnement ouverts dont les performances approchent celles des modèles de pointe
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    
    **APERÇU DU MODÈLE**
    DeepSeek-R1 a reçu une mise à jour mineure vers DeepSeek-R1-0528 pour le modèle distillé à 8 milliards de paramètres et le modèle complet à 671 milliards de paramètres. Dans cette mise à jour, DeepSeek R1 a considérablement amélioré ses capacités de raisonnement et d'inférence. Le modèle a démontré d'excellentes performances sur diverses évaluations de référence, notamment en mathématiques, programmation et logique générale. Ses performances globales se rapprochent désormais de celles de modèles de pointe tels que O3 et Gemini 2.5 Pro.
    
    Les modèles DeepSeek-R1-Distill sont affinés à partir de modèles open source, en utilisant des échantillons générés par DeepSeek-R1.
    
    DeepSeek-R1-Distill-Qwen-14B
    - Modèle de base : Qwen2.5-14B
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé sous Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.
    
    Mise à jour de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

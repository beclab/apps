metadata:
  title: DeepSeek-R1 14B (Ollama)
  description: Una famiglia di modelli di ragionamento aperti con prestazioni prossime a quelle dei modelli leader
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    
    **PANORAMICA DEL MODELLO**
    DeepSeek-R1 ha ricevuto un aggiornamento minore a DeepSeek-R1-0528 per il modello distillato da 8 miliardi di parametri e il modello completo da 671 miliardi di parametri. In questo aggiornamento, DeepSeek R1 ha migliorato significativamente le capacità di ragionamento e inferenza. Il modello ha dimostrato prestazioni eccellenti in varie valutazioni di benchmark, tra cui matematica, programmazione e logica generale. Le prestazioni complessive si avvicinano ora a quelle di modelli leader come O3 e Gemini 2.5 Pro.
    
    I modelli DeepSeek-R1-Distill sono fine-tuned su modelli open-source, usando campioni generati da DeepSeek-R1.
    
    DeepSeek-R1-Distill-Qwen-14B
    - Modello base: Qwen2.5-14B
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Aggiornamento dell'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: Bytebase
  description: Il database DevOps e CI/CD più avanzato al mondo per team di sviluppatori, DBA e platform engineering
spec:
  fullDescription: |
    Bytebase è uno strumento open-source di database DevOps: il GitLab/GitHub per gestire i database lungo il ciclo di vita dello sviluppo applicativo. Offre uno spazio di collaborazione web per DBA, sviluppatori e platform engineer.
    
    **HIGHLIGHTS**
    - Diversi task di sviluppo database
    - Più sistemi di database
    - Processo unificato
    - Un unico strumento
    
    **KEY FEATURES**
    SQL Review
    - Bytebase analizza le modifiche SQL per applicare regole in conformità con la policy dell'organizzazione. L'enforcement include convenzioni di naming, rilevamento di pattern anti-SQL, ecc. Gli ambienti prod e non-prod possono anche applicare regole diverse.
    
    Database CI/CD and Change Automation
    - Come nella code review, Bytebase semplifica il processo di change del database. In un unico workflow, una modifica del database può essere revisionata e deployata dall'ambiente di sviluppo fino alla produzione.
    
    GitOps (Database-as-Code)
    - Bytebase conserva la cronologia completa delle modifiche allo schema. Si integra anche con i sistemi VCS. I team possono gestire gli script di migrazione SQL nel VCS e attivare il deployment dello schema al commit.
    
    Batch Change and Query
    - Bytebase consente di modificare una raccolta di database in un unico workflow. Consente anche di eseguire una singola query su più database.
    
    SQL Editor
    - Un SQL Editor web per interrogare ed esportare dati. I DBA non devono più consegnare credenziali di database sensibili quando gli sviluppatori devono accedere ai dati.
    
    Dynamic Data Masking
    - Bytebase fornisce una policy di masking multi-livello con workflow per concedere l'accesso ai dati non mascherati.
    
    Data Access Control
    - Bytebase offre una suite di funzioni per consentire alle organizzazioni di applicare policy di sicurezza dei dati, evitare fughe di dati e rispettare la compliance.
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
    
    Aggiornamento della versione app a 3.11.0
    
    Modifiche rilevanti：
    Aggiornamento della policy di rollout dell'environment
    - Issue Creators e Last Issue Approvers non possono più fare rollout degli issue. I rollout manuali richiedono ora di specificare ruoli workspace/project o utenti con il permesso bb.taskRuns.create.
    - Il meccanismo di force rollout è stato sostituito da requisiti di rollout configurabili:
      - Require Issue Approval – assicura che gli issue debbano essere approvati prima del rollout (default: abilitato).
      - Plan Check Enforcement – controlla il comportamento del rollout in base ai risultati del plan check (default: blocca solo sugli errori).
    
    Deprecare il permesso bb.sql.export e il ruolo roles/projectExporter.
    
    Deprecare request.row_limit nella policy IAM di progetto. Usare invece maximum_result_rows in QueryDataPolicy.
    
    API
    - Standardizzare i nomi degli attributi CEL con prefissi: resource.*, statement.*, request.* (es. environment_id → resource.environment_id)
    - Unificare i livelli di rischio in un unico enum RiskLevel; passaggio da interi (100, 200, 300) a stringhe (LOW, MODERATE, HIGH); le espressioni CEL migrano da level == 300 a level == "HIGH"
    - Semplificare il template di approvazione a singleton con array piatto di ruoli; sostituire approval_finding_done/approval_finding_error con l'enum approval_status
    - Consolidare i tipi di task in DATABASE_MIGRATE (con migrate_type: DDL/DML/GHOST) e DATABASE_SDL. Dividere changelog Type in enum Type e MigrationType. Unire DatabaseSchemaUpdate e DatabaseDataUpdate in DatabaseUpdate.
    
    Terraform (versione provider: 3.11.1)
    - Usare l'enum RiskLevel invece di valori numerici per level in bytebase_risk. Esempio: risk.tf
    - Rimuovere disable_copy_data_policy; spostato in query_data_policy come campo disable_copy_data. Esempio: environment.tf
    - Aggiornare la struttura dell'impostazione approval_flow. Esempio: approval_flow.tf
    - Rimuovere row_limit dall'impostazione bytebase_iam_policy.
    
    Rimuovere la funzione Format on Save dall'SQL Editor.
    
    Miglioramenti:
    - Supporto di label istanza chiave-valore.
    - Ottimizzare le prestazioni dello Schema Editor.
    - Aggiungere validazione pre-flight e circuit breaker al workflow gh-ost.
    - AWS Elasticsearch – Aggiungere supporto cross-account.
    
    Correzioni di bug
    
    Vedi la nota completa qui: https://github.com/bytebase/bytebase/releases/tag/3.11.0

metadata:
  title: Bytebase
  description: "Le DevOps et CI/CD de bases de données le plus avancé au monde pour les équipes de développeurs, DBA et d'ingénierie de plateforme"
spec:
  fullDescription: |
    Bytebase est un outil open source de DevOps de bases de données — le GitLab/GitHub pour gérer les bases de données tout au long du cycle de vie du développement d'applications. Il offre un espace de collaboration web pour les DBA, les développeurs et les ingénieurs de plateforme.
    
    **HIGHLIGHTS**
    - Différentes tâches de développement de bases de données
    - Plusieurs systèmes de bases de données
    - Processus unifié
    - Un seul outil
    
    **KEY FEATURES**
    SQL Review
    - Bytebase analyse les changements SQL pour appliquer des règles conformes à la politique de votre organisation. L'application inclut les conventions de nommage, la détection de motifs anti-SQL, etc. Les environnements prod et non-prod peuvent aussi appliquer des règles distinctes.
    
    Database CI/CD and Change Automation
    - Comme pour la revue de code, Bytebase fluidifie le processus de changement de base de données. Au sein d'un seul workflow, un changement de base de données peut être revu et déployé de l'environnement de développement jusqu'à la production.
    
    GitOps (Database-as-Code)
    - Bytebase conserve l'historique complet des changements de schéma. Il s'intègre aussi aux systèmes VCS. Les équipes peuvent gérer les scripts de migration SQL dans le VCS et déclencher le déploiement de schéma au commit.
    
    Batch Change and Query
    - Bytebase vous permet de modifier une collection de bases de données dans un seul workflow. Il permet aussi d'émettre une seule requête contre plusieurs bases de données.
    
    SQL Editor
    - Un éditeur SQL web pour interroger et exporter des données. Les DBA n'ont plus besoin de donner des identifiants de base de données sensibles lorsque les développeurs doivent accéder aux données.
    
    Dynamic Data Masking
    - Bytebase fournit une politique de masquage multi-niveaux avec un workflow pour accorder l'accès aux données non masquées.
    
    Data Access Control
    - Bytebase offre une suite de fonctionnalités pour permettre aux organisations d'appliquer des politiques de sécurité des données, d'éviter les fuites et de respecter la conformité.
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    Mise à jour de la version de l'app vers 3.11.0
    
    Changements notables ：
    Mise à jour de la politique de rollout d'environnement
    - Les Issue Creators et Last Issue Approvers ne peuvent plus déployer les issues. Les rollouts manuels nécessitent désormais de spécifier des rôles workspace/projet ou des utilisateurs avec la permission bb.taskRuns.create.
    - Le mécanisme de force rollout a été remplacé par des exigences de rollout configurables :
      - Require Issue Approval – garantit que les issues doivent être approuvées avant le rollout (par défaut : activé).
      - Plan Check Enforcement – contrôle le comportement du rollout selon les résultats du plan check (par défaut : bloquer uniquement en cas d'erreurs).
    
    Déprécier la permission bb.sql.export et le rôle roles/projectExporter.
    
    Déprécier request.row_limit dans la politique IAM du projet. Utiliser maximum_result_rows dans QueryDataPolicy à la place.
    
    API
    - Standardiser le nommage des attributs CEL avec des préfixes : resource.*, statement.*, request.* (ex. : environment_id → resource.environment_id)
    - Unifier les niveaux de risque en un seul enum RiskLevel ; passage d'entiers (100, 200, 300) à des chaînes (LOW, MODERATE, HIGH) ; les expressions CEL migrent de level == 300 vers level == "HIGH"
    - Simplifier le modèle d'approbation en singleton avec un tableau plat de rôles ; remplacer approval_finding_done/approval_finding_error par l'enum approval_status
    - Consolider les types de tâches en DATABASE_MIGRATE (avec migrate_type : DDL/DML/GHOST) et DATABASE_SDL. Séparer changelog Type en enums Type et MigrationType. Fusionner DatabaseSchemaUpdate et DatabaseDataUpdate en DatabaseUpdate.
    
    Terraform (version du provider : 3.11.1)
    - Utiliser l'enum RiskLevel au lieu de valeurs numériques pour level dans bytebase_risk. Exemple : risk.tf
    - Supprimer disable_copy_data_policy ; déplacé dans query_data_policy en tant que champ disable_copy_data. Exemple : environment.tf
    - Mettre à jour la structure du réglage approval_flow. Exemple : approval_flow.tf
    - Supprimer row_limit du réglage bytebase_iam_policy.
    
    Supprimer la fonction Format on Save de l'éditeur SQL.
    
    Améliorations :
    - Prise en charge des labels d'instance clé-valeur.
    - Optimiser les performances du Schema Editor.
    - Ajouter une validation pre-flight et un circuit breaker au workflow gh-ost.
    - AWS Elasticsearch – Ajouter la prise en charge cross-account.
    
    Corrections de bugs
    
    Voir la note complète ici : https://github.com/bytebase/bytebase/releases/tag/3.11.0

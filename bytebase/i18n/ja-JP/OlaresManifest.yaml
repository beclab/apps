metadata:
  title: Bytebase
  description: 開発者・DBA・プラットフォームエンジニアリングチーム向けの、世界最先端のデータベース DevOps と CI/CD
spec:
  fullDescription: |
    Bytebase はオープンソースのデータベース DevOps ツールで、アプリケーション開発ライフサイクル全体にわたってデータベースを管理する GitLab／GitHub に相当します。DBA、開発者、プラットフォームエンジニア向けの Web ベースのコラボレーションワークスペースを提供します。
    
    **HIGHLIGHTS**
    - さまざまなデータベース開発タスク
    - 複数のデータベースシステム
    - 統一されたプロセス
    - 単一のツール
    
    **KEY FEATURES**
    SQL Review
    - Bytebase は組織のポリシーに沿って SQL 変更を分析しルールを適用します。適用には命名規則、アンチ SQL パターン検出などが含まれます。本番／非本番環境でそれぞれ異なるルールも適用できます。
    
    Database CI/CD and Change Automation
    - コードレビューと同様に、Bytebase はデータベース変更プロセスを合理化します。単一ワークフロー内で、開発環境から本番までデータベース変更をレビューしデプロイできます。
    
    GitOps (Database-as-Code)
    - Bytebase は完全なスキーマ変更履歴を保持します。VCS システムとも統合します。チームは VCS で SQL 移行スクリプトを管理し、コードコミットでスキーマデプロイをトリガーできます。
    
    Batch Change and Query
    - Bytebase では単一ワークフローで複数データベースの集合を変更できます。複数データベースに対する単一クエリの発行も可能です。
    
    SQL Editor
    - データのクエリとエクスポート用の Web ベース SQL Editor。開発者がデータにアクセスする際、DBA が機密のデータベース認証情報を渡す必要がなくなります。
    
    Dynamic Data Masking
    - Bytebase は、マスク解除データへのアクセスを付与するワークフロー付きの多層マスキングポリシーを提供します。
    
    Data Access Control
    - Bytebase は、組織がデータセキュリティポリシーを適用し、漏洩を防ぎ、コンプライアンスに準拠するための機能群を提供します。
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    アプリバージョンを 3.11.0 へアップグレード
    
    主な変更：
    環境ロールアウトポリシーの更新
    - Issue Creators と Last Issue Approvers は issue をロールアウトできなくなりました。手動ロールアウトには workspace／プロジェクトロール、または bb.taskRuns.create 権限を持つユーザーの指定が必要です。
    - force rollout 機構は設定可能なロールアウト要件に置き換えられました:
      - Require Issue Approval – ロールアウト前に issue の承認を必須化（既定: 有効）。
      - Plan Check Enforcement – plan check 結果に基づくロールアウト制御（既定: エラー時のみブロック）。
    
    bb.sql.export 権限と roles/projectExporter ロールを非推奨化。
    
    プロジェクト IAM ポリシーの request.row_limit を非推奨化。代わりに QueryDataPolicy の maximum_result_rows を使用。
    
    API
    - CEL 属性名をプレフィックス付きで標準化: resource.*、statement.*、request.*（例: environment_id → resource.environment_id）
    - リスクレベルを単一の RiskLevel enum に統一; 整数（100、200、300）から文字列（LOW、MODERATE、HIGH）へ変更; CEL 式は level == 300 から level == "HIGH" へ移行
    - 承認テンプレートをフラットなロール配列のシングルトンに簡素化; approval_finding_done／approval_finding_error を approval_status enum に置換
    - タスク種別を DATABASE_MIGRATE（migrate_type: DDL/DML/GHOST）と DATABASE_SDL に統合。changelog Type を Type と MigrationType enum に分割。DatabaseSchemaUpdate と DatabaseDataUpdate を DatabaseUpdate に統合。
    
    Terraform（プロバイダー版: 3.11.1）
    - bytebase_risk の level に数値ではなく RiskLevel enum を使用。例: risk.tf
    - disable_copy_data_policy を削除; query_data_policy の disable_copy_data フィールドへ移動。例: environment.tf
    - approval_flow 設定の構造を更新。例: approval_flow.tf
    - bytebase_iam_policy 設定から row_limit を削除。
    
    SQL Editor から Format on Save 機能を削除。
    
    改善:
    - キーバリューのインスタンスラベルをサポート。
    - Schema Editor のパフォーマンスを最適化。
    - gh-ost ワークフローに pre-flight 検証とサーキットブレーカーを追加。
    - AWS Elasticsearch – クロスアカウントサポートを追加。
    
    バグ修正
    
    完全なリリースノート: https://github.com/bytebase/bytebase/releases/tag/3.11.0

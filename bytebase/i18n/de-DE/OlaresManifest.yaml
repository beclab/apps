metadata:
  title: Bytebase
  description: Weltweit fortschrittlichstes Datenbank-DevOps und CI/CD für Entwickler-, DBA- und Platform-Engineering-Teams
spec:
  fullDescription: |
    Bytebase ist ein Open-Source-Datenbank-DevOps-Tool – das GitLab/GitHub für die Verwaltung von Datenbanken über den gesamten Anwendungsentwicklungslebenszyklus. Es bietet einen webbasierten Kollaborationsarbeitsbereich für DBAs, Entwickler und Platform Engineers.
    
    **HIGHLIGHTS**
    - Verschiedene Datenbankentwicklungsaufgaben
    - Mehrere Datenbanksysteme
    - Vereinheitlichter Prozess
    - Ein einziges Tool
    
    **KEY FEATURES**
    SQL Review
    - Bytebase analysiert SQL-Änderungen, um Regeln gemäß der Richtlinie Ihrer Organisation durchzusetzen. Die Durchsetzung umfasst Namenskonventionen, Anti-SQL-Pattern-Erkennung usw. Prod- und Non-Prod-Umgebungen können jeweils unterschiedliche Regeln erzwingen.
    
    Database CI/CD and Change Automation
    - Wie beim Code Review strafft Bytebase den Datenbankänderungsprozess. Innerhalb eines einzigen Workflows kann eine Datenbankänderung vom Dev-Environment bis zur Production geprüft und bereitgestellt werden.
    
    GitOps (Database-as-Code)
    - Bytebase speichert die vollständige Schema-Änderungshistorie. Es integriert sich auch mit VCS-Systemen. Teams können SQL-Migrationsskripte im VCS verwalten und Schema-Deployments bei Code-Commit auslösen.
    
    Batch Change and Query
    - Bytebase ermöglicht es, eine Sammlung von Datenbanken in einem einzigen Workflow zu ändern. Sie können auch eine einzelne Abfrage gegen mehrere Datenbanken ausführen.
    
    SQL Editor
    - Ein webbasierter SQL Editor zum Abfragen und Exportieren von Daten. DBAs müssen Entwicklern keine sensiblen Datenbankanmeldedaten mehr geben, wenn diese auf Daten zugreifen müssen.
    
    Dynamic Data Masking
    - Bytebase bietet eine mehrstufige Maskierungsrichtlinie mit Workflow für den Zugriff auf unmaskierte Daten.
    
    Data Access Control
    - Bytebase bietet eine Suite von Funktionen, mit denen Organisationen Datensicherheitsrichtlinien durchsetzen, Datenlecks vermeiden und Compliance einhalten können.
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    App-Version auf 3.11.0 aktualisiert
    
    Wichtige Änderungen：
    Environment-Rollout-Policy-Update
    - Issue Creators und Last Issue Approvers können Issues nicht mehr ausrollen. Manuelle Rollouts erfordern jetzt die Angabe von Workspace-/Projektrollen oder Benutzern mit der Berechtigung bb.taskRuns.create.
    - Der Force-Rollout-Mechanismus wurde durch konfigurierbare Rollout-Anforderungen ersetzt:
      - Require Issue Approval – stellt sicher, dass Issues vor dem Rollout genehmigt sein müssen (Standard: aktiviert).
      - Plan Check Enforcement – steuert das Rollout-Verhalten basierend auf Plan-Check-Ergebnissen (Standard: nur bei Fehlern blockieren).
    
    Berechtigung bb.sql.export und Rolle roles/projectExporter veraltet.
    
    request.row_limit in der Projekt-IAM-Policy veraltet. Stattdessen maximum_result_rows in QueryDataPolicy verwenden.
    
    API
    - CEL-Attributnamen mit Präfixen standardisieren: resource.*, statement.*, request.* (z. B. environment_id → resource.environment_id)
    - Risikostufen zu einem einzigen RiskLevel-Enum vereinheitlichen; von Ganzzahlen (100, 200, 300) zu Strings (LOW, MODERATE, HIGH) geändert; CEL-Ausdrücke migrieren von level == 300 zu level == "HIGH"
    - Approval-Template zu Singleton mit flachem Rollen-Array vereinfachen; approval_finding_done/approval_finding_error durch approval_status-Enum ersetzen
    - Task-Typen zu DATABASE_MIGRATE (mit migrate_type: DDL/DML/GHOST) und DATABASE_SDL konsolidieren. Changelog Type in Type- und MigrationType-Enums aufgeteilt. DatabaseSchemaUpdate und DatabaseDataUpdate zu DatabaseUpdate zusammengeführt.
    
    Terraform (Provider-Version: 3.11.1)
    - RiskLevel-Enum statt numerischer Werte für level in bytebase_risk verwenden. Beispiel: risk.tf
    - disable_copy_data_policy entfernen; nach query_data_policy als Feld disable_copy_data verschoben. Beispiel: environment.tf
    - Struktur der approval_flow-Einstellung aktualisieren. Beispiel: approval_flow.tf
    - row_limit aus der bytebase_iam_policy-Einstellung entfernen.
    
    Format on Save-Funktion aus dem SQL Editor entfernen.
    
    Verbesserungen:
    - Unterstützung für Key-Value-Instanzlabels.
    - Schema-Editor-Leistung optimieren.
    - Pre-Flight-Validierung und Circuit Breaker zum gh-ost-Workflow hinzufügen.
    - AWS Elasticsearch – Cross-Account-Unterstützung hinzufügen.
    
    Fehlerbehebungen
    
    Vollständige Release Note: https://github.com/bytebase/bytebase/releases/tag/3.11.0

metadata:
  title: Bytebase
  description: El DevOps y CI/CD de bases de datos más avanzado del mundo para equipos de desarrollo, DBA e ingeniería de plataforma
spec:
  fullDescription: |
    Bytebase es una herramienta open-source de DevOps de bases de datos: el GitLab/GitHub para gestionar bases de datos a lo largo del ciclo de vida del desarrollo de aplicaciones. Ofrece un espacio de colaboración web para DBAs, desarrolladores e ingenieros de plataforma.
    
    **HIGHLIGHTS**
    - Distintas tareas de desarrollo de bases de datos
    - Múltiples sistemas de bases de datos
    - Proceso unificado
    - Una sola herramienta
    
    **KEY FEATURES**
    SQL Review
    - Bytebase analiza los cambios SQL para aplicar reglas conforme a la política de tu organización. La aplicación incluye convenciones de nombres, detección de patrones anti-SQL, etc. Los entornos prod y non-prod también pueden aplicar reglas distintas.
    
    Database CI/CD and Change Automation
    - Como en la revisión de código, Bytebase agiliza el proceso de cambio de base de datos. En un solo flujo, un cambio de base de datos puede revisarse e implantarse desde el entorno de desarrollo hasta producción.
    
    GitOps (Database-as-Code)
    - Bytebase conserva el historial completo de cambios de esquema. También se integra con sistemas VCS. Los equipos pueden gestionar scripts de migración SQL en el VCS y disparar el despliegue de esquema al hacer commit.
    
    Batch Change and Query
    - Bytebase permite cambiar una colección de bases de datos en un solo flujo. También permite emitir una sola consulta contra múltiples bases de datos.
    
    SQL Editor
    - Un editor SQL web para consultar y exportar datos. Los DBA ya no necesitan entregar credenciales sensibles de base de datos cuando los desarrolladores necesitan acceder a los datos.
    
    Dynamic Data Masking
    - Bytebase proporciona una política de enmascaramiento multinivel con flujo de trabajo para conceder acceso a datos sin enmascarar.
    
    Data Access Control
    - Bytebase ofrece un conjunto de funciones para que las organizaciones apliquen políticas de seguridad de datos, eviten fugas y cumplan la normativa.
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    Actualización de la versión de la app a 3.11.0
    
    Cambios destacados：
    Actualización de la política de rollout de entorno
    - Los Issue Creators y Last Issue Approvers ya no pueden hacer rollout de issues. Los rollouts manuales ahora requieren especificar roles de workspace/proyecto o usuarios con el permiso bb.taskRuns.create.
    - El mecanismo de force rollout se ha sustituido por requisitos de rollout configurables:
      - Require Issue Approval – asegura que los issues deben aprobarse antes del rollout (predeterminado: activado).
      - Plan Check Enforcement – controla el comportamiento del rollout según los resultados del plan check (predeterminado: bloquear solo ante errores).
    
    Deprecar el permiso bb.sql.export y el rol roles/projectExporter.
    
    Deprecar request.row_limit en la política IAM del proyecto. Usar maximum_result_rows en QueryDataPolicy en su lugar.
    
    API
    - Estandarizar el nombrado de atributos CEL con prefijos: resource.*, statement.*, request.* (p. ej., environment_id → resource.environment_id)
    - Unificar los niveles de riesgo en un único enum RiskLevel; cambio de enteros (100, 200, 300) a cadenas (LOW, MODERATE, HIGH); las expresiones CEL migran de level == 300 a level == "HIGH"
    - Simplificar la plantilla de aprobación a un singleton con array plano de roles; reemplazar approval_finding_done/approval_finding_error por el enum approval_status
    - Consolidar tipos de tarea en DATABASE_MIGRATE (con migrate_type: DDL/DML/GHOST) y DATABASE_SDL. Dividir changelog Type en enums Type y MigrationType. Fusionar DatabaseSchemaUpdate y DatabaseDataUpdate en DatabaseUpdate.
    
    Terraform (versión del provider: 3.11.1)
    - Usar el enum RiskLevel en lugar de valores numéricos para level en bytebase_risk. Ejemplo: risk.tf
    - Eliminar disable_copy_data_policy; movido a query_data_policy como el campo disable_copy_data. Ejemplo: environment.tf
    - Actualizar la estructura del ajuste approval_flow. Ejemplo: approval_flow.tf
    - Eliminar row_limit del ajuste bytebase_iam_policy.
    
    Eliminar la función Format on Save del SQL Editor.
    
    Mejoras:
    - Soporte de etiquetas de instancia clave-valor.
    - Optimizar el rendimiento del Schema Editor.
    - Añadir validación pre-flight y circuit breaker al workflow gh-ost.
    - AWS Elasticsearch – Añadir soporte cross-account.
    
    Correcciones de errores
    
    Ver la nota completa aquí: https://github.com/bytebase/bytebase/releases/tag/3.11.0

metadata:
  title: solidtime
  description: 现代开源时间跟踪应用程序。
spec:
  upgradeDescription: |
    将反向代理镜像从 Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）切换为官方 OpenResty 镜像 `openresty/openresty:1.29.2.5-bookworm-fat`。

    同步调整 nginx 配置挂载与日志路径以匹配官方镜像布局（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`），并移除 Bitnami 专用的 `OPENRESTY_CONF_FILE` 配置。

    v1.0.9: 始终开启公开注册（`APP_ENABLE_REGISTRATION=true`）。未配置 SMTP 时使用 `MAIL_MAILER=log`，避免出现 "Registration is disabled"；验证链接会写到应用日志，配置 SMTP 后即可正常发信。

    v1.0.8: 应用镜像升级为官方 `solidtime/solidtime:0.17.0`（原 `0.11.5`），含上游安全修复。无必需环境变量/启动参数变更——`CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` 不变；镜像默认 `OCTANE_SERVER=frankenphp`。升级时请跑库迁移（已设 `AUTO_DB_MIGRATE=true`）。

    v1.0.7: 将 `DB_PASSWORD` 与 `MAIL_PASSWORD` 从 ConfigMap 迁入 Secret；各应用容器通过 `envFrom.secretRef` 注入。
  fullDescription: |
    solidtime是一款面向自由职业者与机构的现代开源时间跟踪应用程序。
  
    **核心功能**
    - 时间跟踪：通过现代化易用界面实时追踪时间
    - 项目管理：创建并管理项目，支持成员分配与协作
    - 任务体系：构建任务体系并关联至具体项目
    - 客户管理：维护客户数据库并绑定对应项目
    - 计费配置：支持为项目、成员、组织设置多层级计费费率
    - 多组织支持：单账户可创建及管理多个独立组织架构
    - 权限控制：基于角色的权限系统实现组织精细化管理
    - 数据迁移：支持从Toggl、Clockify及CSV格式导入历史时间数据

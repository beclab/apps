metadata:
  title: solidtime
  description: Moderne Open-Source-Zeiterfassungs-App
spec:
  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.

    v1.0.9: Öffentliche Registrierung stets aktivieren (`APP_ENABLE_REGISTRATION=true`). Wenn SMTP nicht konfiguriert ist, `MAIL_MAILER=log` verwenden, damit die Anmeldung nicht mehr „Registration is disabled“ anzeigt (Verifizierungslinks werden in App-Logs geschrieben, bis SMTP eingerichtet ist).

    v1.0.8: App-Image auf offizielles `solidtime/solidtime:0.17.0` aktualisieren (von `0.11.5`); enthält Upstream-Sicherheitsfixes. Keine erforderlichen Env-/Startup-Arg-Änderungen — `CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` unverändert; Image setzt bereits `OCTANE_SERVER=frankenphp` standardmäßig. DB-Migrationen beim Upgrade ausführen (`AUTO_DB_MIGRATE=true`).

    v1.0.7: `DB_PASSWORD` und `MAIL_PASSWORD` von ConfigMap in Secret verschieben; per `envFrom.secretRef` in alle App-Container injizieren.
  fullDescription: |
    solidtime ist eine moderne Open-Source-Zeiterfassungsanwendung für Freelancer und Agenturen.

    **Funktionen**
    - Zeiterfassung: Erfassen Sie Ihre Zeit mit einer modernen und einfach zu bedienenden Oberfläche
    - Projekte: Projekte erstellen und verwalten sowie Projektmitglieder zuweisen
    - Aufgaben: Aufgaben erstellen und verwalten sowie Aufgaben Projekten zuweisen
    - Kunden: Kunden erstellen und verwalten sowie Kunden Projekten zuweisen
    - Abrechenbare Sätze: Abrechenbare Sätze für Projekte, Projektmitglieder, Organisationsmitglieder und Organisationen festlegen
    - Mehrere Organisationen: Mehrere Organisationen mit einem Konto erstellen und verwalten
    - Rollen und Berechtigungen: Organisationen erstellen und verwalten
    - Import: Zeiterfassungsdaten aus anderen Zeiterfassungsanwendungen importieren (Unterstützt: Toggl, Clockify, Timeentry CSV)

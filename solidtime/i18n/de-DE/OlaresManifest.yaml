metadata:
  title: solidtime
  description: Moderne Open-Source-Zeiterfassungs-App
spec:
  upgradeDescription: |
    Updates solidtime to 0.22.1 with PHP 8.3.36, fixing CVE-2026-109618 and CVE-2026-109619. Preserves existing accounts, time entries, settings and stored files.

  fullDescription: |
    solidtime ist eine moderne Open-Source-Zeiterfassungsanwendung für Freelancer und Agenturen.

    **Funktionen**
    - Zeiterfassung: Erfassen Sie Ihre Zeit mit einer modernen und einfach zu bedienenden Oberfläche
    - Projekte: Projekte erstellen und verwalten sowie Projektmitglieder zuweisen
    - Aufgaben: Aufgaben erstellen und verwalten sowie Aufgaben Projekten zuweisen
    - Kunden: Kunden erstellen und verwalten sowie Kunden Projekten zuweisen
    - Abrechenbare Sätze: Abrechenbare Sätze für Projekte, Projektmitglieder, Organisationsmitglieder und Organisationen festlegen
    - Mehrere Organisationen: Mehrere Organisationen mit einem Konto erstellen und verwalten
    - Rollen und Berechtigungen: Organisationen erstellen und verwalten
    - Import: Zeiterfassungsdaten aus anderen Zeiterfassungsanwendungen importieren (Unterstützt: Toggl, Clockify, Timeentry CSV)

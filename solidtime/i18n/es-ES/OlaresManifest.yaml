metadata:
  title: solidtime
  description: App moderna de seguimiento de tiempo de código abierto
spec:
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los mounts de la configuración de nginx y las rutas de logs con el layout de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.

    v1.0.9: Habilitar siempre el registro público (`APP_ENABLE_REGISTRATION=true`). Cuando SMTP no está configurado, usar `MAIL_MAILER=log` para que el registro ya no muestre "Registration is disabled" (los enlaces de verificación se escriben en los logs de la app hasta configurar SMTP).

    v1.0.8: Actualizar la imagen de la app a la oficial `solidtime/solidtime:0.17.0` (desde `0.11.5`); incluye correcciones de seguridad upstream. Sin cambios obligatorios de env/startup-arg — `CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` sin cambios; la imagen ya usa por defecto `OCTANE_SERVER=frankenphp`. Ejecutar migraciones de BD al actualizar (`AUTO_DB_MIGRATE=true`).

    v1.0.7: Mover `DB_PASSWORD` y `MAIL_PASSWORD` de ConfigMap a Secret; inyectar vía `envFrom.secretRef` en todos los contenedores de la app.
  fullDescription: |
    solidtime es una aplicación moderna de seguimiento de tiempo de código abierto para freelancers y agencias.

    **Funciones**
    - Seguimiento de tiempo: Registra tu tiempo con una interfaz moderna y fácil de usar
    - Proyectos: Crea y gestiona proyectos y asigna miembros del proyecto
    - Tareas: Crea y gestiona tareas y asígnalas a proyectos
    - Clientes: Crea y gestiona clientes y asígnalos a proyectos
    - Tarifas facturables: Establece tarifas facturables para proyectos, miembros del proyecto, miembros de la organización y organizaciones
    - Varias organizaciones: Crea y gestiona varias organizaciones con una sola cuenta
    - Roles y permisos: Crea y gestiona organizaciones
    - Importación: Importa tus datos de seguimiento de tiempo desde otras aplicaciones (Compatible: Toggl, Clockify, Timeentry CSV)

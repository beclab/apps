metadata:
  title: solidtime
  description: App moderna open-source per il time tracking
spec:
  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico di Bitnami di `OPENRESTY_CONF_FILE`.

    v1.0.9: Abilitare sempre la registrazione pubblica (`APP_ENABLE_REGISTRATION=true`). Quando SMTP non è configurato, usare `MAIL_MAILER=log` così che la registrazione non mostri più "Registration is disabled" (i link di verifica vengono scritti nei log dell'app finché non si configura SMTP).

    v1.0.8: Aggiornare l'immagine dell'app all'ufficiale `solidtime/solidtime:0.17.0` (da `0.11.5`); include fix di sicurezza upstream. Nessuna modifica obbligatoria di env/startup-arg — `CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` invariati; l'immagine usa già di default `OCTANE_SERVER=frankenphp`. Eseguire le migrazioni DB all'upgrade (`AUTO_DB_MIGRATE=true`).

    v1.0.7: Spostare `DB_PASSWORD` e `MAIL_PASSWORD` da ConfigMap a Secret; iniettare tramite `envFrom.secretRef` su tutti i container dell'app.
  fullDescription: |
    solidtime è un'applicazione moderna open-source di time tracking per freelancer e agenzie.

    **Funzionalità**
    - Time tracking: Traccia il tuo tempo con un'interfaccia moderna e facile da usare
    - Progetti: Crea e gestisci progetti e assegna membri del progetto
    - Attività: Crea e gestisci attività e assegnale ai progetti
    - Clienti: Crea e gestisci clienti e assegnarli ai progetti
    - Tariffe fatturabili: Imposta tariffe fatturabili per progetti, membri del progetto, membri dell'organizzazione e organizzazioni
    - Più organizzazioni: Crea e gestisci più organizzazioni con un solo account
    - Ruoli e permessi: Crea e gestisci organizzazioni
    - Importazione: Importa i dati di time tracking da altre applicazioni (Supportati: Toggl, Clockify, Timeentry CSV)

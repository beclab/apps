metadata:
  title: solidtime
  description: Modern open-source time-tracking app
spec:
  upgradeDescription: |
    Switch the reverse-proxy image from Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) to the official OpenResty image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Align nginx config mounts and log paths with the official image layout (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), and drop Bitnami-specific `OPENRESTY_CONF_FILE` wiring.

    v1.0.9: Always enable public registration (`APP_ENABLE_REGISTRATION=true`). When SMTP is not configured, use `MAIL_MAILER=log` so signup no longer shows "Registration is disabled" (verification links are written to app logs until SMTP is set).

    v1.0.8: Upgrade app image to official `solidtime/solidtime:0.17.0` (from `0.11.5`); includes upstream security fixes. No required env/startup-arg changes — `CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` unchanged; image already defaults `OCTANE_SERVER=frankenphp`. Run DB migrations on upgrade (`AUTO_DB_MIGRATE=true`).

    v1.0.7: Move `DB_PASSWORD` and `MAIL_PASSWORD` from ConfigMap into Secret; inject via `envFrom.secretRef` on all app containers.
  fullDescription: |
    solidtime is a modern open-source time tracking application for Freelancers and Agencies.
    
    **Features**
    - Time tracking: Track your time with a modern and easy-to-use interface
    - Projects: Create and manage projects and assign project members
    - Tasks: Create and manage tasks and assign tasks to projects
    - Clients: Create and manage clients and assign clients to projects
    - Billable rates: Set billable rates for projects, project members, organization members and organizations
    - Multiple organizations: Create and manage multiple organizations with one account
    - Roles and permissions: Create and manage organizations
    - Import: Import your time tracking data from other time tracking applications (Supported: Toggl, Clockify, Timeentry CSV)

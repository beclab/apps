metadata:
  title: solidtime
  description: モダンなオープンソース時間追跡アプリ
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。

    v1.0.9：常に公開登録を有効化（`APP_ENABLE_REGISTRATION=true`）。SMTP 未設定時は `MAIL_MAILER=log` を使い、サインアップで「Registration is disabled」と出ないようにする（検証リンクは SMTP 設定までアプリログに書き出される）。

    v1.0.8：アプリアメージを公式 `solidtime/solidtime:0.17.0` へアップグレード（`0.11.5` から）；アップストリームのセキュリティ修正を含む。必須の env/起動引数変更なし — `CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` は変更なし；イメージは既にデフォルトで `OCTANE_SERVER=frankenphp`。アップグレード時に DB マイグレーションを実行（`AUTO_DB_MIGRATE=true`）。

    v1.0.7：`DB_PASSWORD` と `MAIL_PASSWORD` を ConfigMap から Secret へ移し、全アプリコンテナに `envFrom.secretRef` で注入。
  fullDescription: |
    solidtime はフリーランサーとエージェンシー向けのモダンなオープンソース時間追跡アプリケーションです。

    **機能**
    - 時間追跡：モダンで使いやすいインターフェースで時間を記録
    - プロジェクト：プロジェクトの作成・管理とメンバー割り当て
    - タスク：タスクの作成・管理とプロジェクトへの割り当て
    - クライアント：クライアントの作成・管理とプロジェクトへの割り当て
    - 請求可能レート：プロジェクト、プロジェクトメンバー、組織メンバー、組織の請求レートを設定
    - 複数組織：1 アカウントで複数組織を作成・管理
    - ロールと権限：組織の作成と管理
    - インポート：他の時間追跡アプリからデータをインポート（対応：Toggl、Clockify、Timeentry CSV）

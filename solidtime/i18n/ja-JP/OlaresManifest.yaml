metadata:
  title: solidtime
  description: モダンなオープンソース時間追跡アプリ
spec:
  upgradeDescription: |
    Updates solidtime to 0.22.1 with PHP 8.3.36, fixing CVE-2026-109618 and CVE-2026-109619. Preserves existing accounts, time entries, settings and stored files.

  fullDescription: |
    solidtime はフリーランサーとエージェンシー向けのモダンなオープンソース時間追跡アプリケーションです。

    **機能**
    - 時間追跡：モダンで使いやすいインターフェースで時間を記録
    - プロジェクト：プロジェクトの作成・管理とメンバー割り当て
    - タスク：タスクの作成・管理とプロジェクトへの割り当て
    - クライアント：クライアントの作成・管理とプロジェクトへの割り当て
    - 請求可能レート：プロジェクト、プロジェクトメンバー、組織メンバー、組織の請求レートを設定
    - 複数組織：1 アカウントで複数組織を作成・管理
    - ロールと権限：組織の作成と管理
    - インポート：他の時間追跡アプリからデータをインポート（対応：Toggl、Clockify、Timeentry CSV）

metadata:
  title: solidtime
  description: Application moderne open source de suivi du temps
spec:
  upgradeDescription: |
    Passer l'image du reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) à l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.

    v1.0.9 : Toujours activer l'inscription publique (`APP_ENABLE_REGISTRATION=true`). Lorsque SMTP n'est pas configuré, utiliser `MAIL_MAILER=log` pour que l'inscription n'affiche plus « Registration is disabled » (les liens de vérification sont écrits dans les logs de l'app jusqu'à la configuration SMTP).

    v1.0.8 : Mettre à niveau l'image de l'app vers l'officielle `solidtime/solidtime:0.17.0` (depuis `0.11.5`) ; inclut des correctifs de sécurité upstream. Aucun changement obligatoire d'env/startup-arg — `CONTAINER_MODE` / `AUTO_DB_MIGRATE` / `WORKER_COMMAND` inchangés ; l'image utilise déjà par défaut `OCTANE_SERVER=frankenphp`. Exécuter les migrations DB à la mise à niveau (`AUTO_DB_MIGRATE=true`).

    v1.0.7 : Déplacer `DB_PASSWORD` et `MAIL_PASSWORD` du ConfigMap vers un Secret ; injecter via `envFrom.secretRef` sur tous les conteneurs de l'app.
  fullDescription: |
    solidtime est une application moderne open source de suivi du temps pour freelances et agences.

    **Fonctionnalités**
    - Suivi du temps : Suivez votre temps avec une interface moderne et facile à utiliser
    - Projets : Créez et gérez des projets et assignez des membres de projet
    - Tâches : Créez et gérez des tâches et assignez-les aux projets
    - Clients : Créez et gérez des clients et assignez-les aux projets
    - Tarifs facturables : Définissez des tarifs facturables pour les projets, membres de projet, membres d'organisation et organisations
    - Plusieurs organisations : Créez et gérez plusieurs organisations avec un seul compte
    - Rôles et permissions : Créez et gérez des organisations
    - Import : Importez vos données de suivi du temps depuis d'autres applications (Pris en charge : Toggl, Clockify, Timeentry CSV)

metadata:
  title: solidtime
  description: Application moderne open source de suivi du temps
spec:
  upgradeDescription: |
    Updates solidtime to 0.22.1 with PHP 8.3.36, fixing CVE-2026-109618 and CVE-2026-109619. Preserves existing accounts, time entries, settings and stored files.

  fullDescription: |
    solidtime est une application moderne open source de suivi du temps pour freelances et agences.

    **Fonctionnalités**
    - Suivi du temps : Suivez votre temps avec une interface moderne et facile à utiliser
    - Projets : Créez et gérez des projets et assignez des membres de projet
    - Tâches : Créez et gérez des tâches et assignez-les aux projets
    - Clients : Créez et gérez des clients et assignez-les aux projets
    - Tarifs facturables : Définissez des tarifs facturables pour les projets, membres de projet, membres d'organisation et organisations
    - Plusieurs organisations : Créez et gérez plusieurs organisations avec un seul compte
    - Rôles et permissions : Créez et gérez des organisations
    - Import : Importez vos données de suivi du temps depuis d'autres applications (Pris en charge : Toggl, Clockify, Timeentry CSV)

{{- $solidtimeDomainENV := split  ","  .Values.domain.solidtime -}}
{{- $solidtimeDomain := index $solidtimeDomainENV "_0" -}}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: solidtime-keys-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidtime
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: solidtime
spec:
  replicas: {{ .Values.workloads.solidtime.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: solidtime
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: solidtime
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - '-c'
          args:
            - |
              for d in /var/www/html/storage /var/www/html/storage/app-storage /var/www/html/storage/logs /cache-logs /cache-logs/logs /etc/app-keys; do
                mkdir -p "$d"
                chown 1000:1000 "$d"
              done
              chmod 700 /etc/app-keys
          resources: { }
          volumeMounts:
            - name: solidtime-data
              mountPath: /var/www/html/storage
            - name: solidtime-logs
              mountPath: /cache-logs
            - name: solidtime-keys
              mountPath: /etc/app-keys
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
        - name: backup-database
          image: docker.io/postgres:17-alpine
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              folder=/data/.php-upgrade-backup
              mkdir -p "$folder"
              if [ -f "$folder/.pre-0.22.1-complete" ]; then exit 0; fi
              export PGPASSWORD="$DB_PASSWORD" PGSSLMODE=require
              pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -Fc -f "$folder/pre-0.22.1.dump"
              test -s "$folder/pre-0.22.1.dump"
              pg_restore --list "$folder/pre-0.22.1.dump" > "$folder/pre-0.22.1-toc.txt"
              test -s "$folder/pre-0.22.1-toc.txt"
              sha256sum "$folder/pre-0.22.1.dump"
              touch "$folder/.pre-0.22.1-complete"
          envFrom:
            - configMapRef:
                name: solidtime-env
            - secretRef:
                name: {{ .Release.Name }}-secrets
          volumeMounts:
            - name: solidtime-data
              mountPath: /data
        - name: solidtime-init
          image: docker.io/solidtime/solidtime:0.22.1
          command: ["sh", "/olares-init/initialize.sh"]
          env:
            - name: ADMIN_NAME
              value: {{ .Values.olaresEnv.ADMIN_NAME | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.olaresEnv.ADMIN_EMAIL | quote }}
            - name: CONTAINER_MODE
              value: scheduler
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ADMIN_PASSWORD
            - name: AUTO_DB_MIGRATE
              value: "false"
          envFrom:
            - configMapRef:
                name: solidtime-env
            - secretRef:
                name: {{ .Release.Name }}-secrets
          volumeMounts:
            - name: init-script
              mountPath: /olares-init
              readOnly: true
            - name: solidtime-keys
              mountPath: /etc/app-keys
            - name: solidtime-data
              mountPath: /var/www/html/storage/app
              subPath: app-storage
            - name: solidtime-data
              mountPath: /var/www/html/storage/logs
              subPath: logs
      containers:
        - name: solidtime
          image: docker.io/solidtime/solidtime:0.22.1
          env:
            - name: CONTAINER_MODE
              value: http
            - name: AUTO_DB_MIGRATE
              value: "false"
          envFrom:
            - configMapRef:
                name: solidtime-env
            - secretRef:
                name: {{ .Release.Name }}-secrets
          readinessProbe:
            httpGet:
              path: /health-check/up
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health-check/up
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: solidtime-keys
              mountPath: /var/www/html/.env
              subPath: .env
              readOnly: true
            - name: solidtime-data
              mountPath: /var/www/html/storage/app
              subPath: app-storage
            - name: solidtime-data
              mountPath: /var/www/html/storage/logs
              subPath: logs

        - name: solidtime-scheduler
          image: docker.io/solidtime/solidtime:0.22.1
          command: ["/usr/local/bin/start-container"]
          env:
            - name: CONTAINER_MODE
              value: scheduler
            - name: SUPERVISOR_SERVER
              value: "http://127.0.0.1:9002"
          envFrom:
            - configMapRef:
                name: solidtime-env
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: supervisor-config
              mountPath: /etc/supervisord.conf
              subPath: supervisord-scheduler.conf
              readOnly: true
            - name: solidtime-keys
              mountPath: /var/www/html/.env
              subPath: .env
              readOnly: true
            - name: solidtime-data
              mountPath: /var/www/html/storage/app
              subPath: app-storage
            - name: solidtime-data
              mountPath: /var/www/html/storage/logs
              subPath: logs
            - name: healthcheck-script
              mountPath: /usr/local/bin/healthcheck
              subPath: healthcheck
          readinessProbe:
            exec:
              command:
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5

        - name: solidtime-queue
          image: docker.io/solidtime/solidtime:0.22.1
          command: ["/usr/local/bin/start-container"]
          env:
            - name: CONTAINER_MODE
              value: worker
            - name: WORKER_COMMAND
              value: php /var/www/html/artisan queue:work
            - name: SUPERVISOR_SERVER
              value: "http://127.0.0.1:9003"
          envFrom:
            - configMapRef:
                name: solidtime-env
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: supervisor-config
              mountPath: /etc/supervisord.conf
              subPath: supervisord-queue.conf
              readOnly: true
            - name: solidtime-keys
              mountPath: /var/www/html/.env
              subPath: .env
              readOnly: true
            - name: solidtime-data
              mountPath: /var/www/html/storage/app
              subPath: app-storage
            - name: solidtime-logs
              mountPath: /var/www/html/storage/logs
              subPath: logs
            - name: healthcheck-script
              mountPath: /usr/local/bin/healthcheck
              subPath: healthcheck
          readinessProbe:
            exec:
              command:
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5

        - name: gotenberg
          image: docker.io/beclab/gotenberg-gotenberg:8
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi

      restartPolicy: Always
      volumes:
        - name: supervisor-config
          configMap:
            name: solidtime-supervisor
        - name: init-script
          configMap:
            name: solidtime-init-script
        - name: solidtime-data
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}/app'
        - name: solidtime-logs
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appCache }}/logs'
        - name: healthcheck-script
          configMap:
            name: solidtime-healthcheck-script
            defaultMode: 0755
        - name: solidtime-keys
          persistentVolumeClaim:
            claimName: solidtime-keys-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: solidtime
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: solidtime
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: {{ .Values.port | default 3000 }}
      targetPort: {{ .Values.port | default 3000 }}
      protocol: TCP
  selector:
    io.kompose.service: solidtime
status:
  loadBalancer: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-solidtime
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: solidtime
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: 80
      targetPort: {{ .Values.port | default 3000 }}
  selector:
    io.kompose.service: solidtime
status:
  loadBalancer: {}

metadata:
  title: Paperclip
  description: AI エージェント企業向けのオープンソース・オーケストレーションプラットフォーム
spec:
  upgradeDescription: |
    Paperclipをv2026.1005.0に更新しました。
    https://github.com/paperclipai/paperclip/releases/tag/v2026.1005.0

  fullDescription: |
    **初回管理者セットアップ**
    初回起動後、ブラウザで Paperclip URL を開き、サインインまたはアカウント作成のうえ、セットアップ画面で **Claim this instance** を選んで最初の管理者になってください。

    **概要**
    Paperclip は、ビジネスを運営する AI エージェントチームをオーケストレーションする Node.js サーバーと React UI です。独自のエージェントを持ち込み、目標を割り当て、1 つのダッシュボードからエージェントの作業とコストを追跡します。

    OpenClaw が従業員なら、Paperclip は会社です。

    **機能**
    - Bring Your Own Agent — 任意のエージェント、任意のランタイム、1 つの組織図（OpenClaw、Claude Code、Codex、Cursor）
    - 目標アラインメント — すべてのタスクが会社のミッションに遡れる
    - Heartbeats — エージェントがスケジュールで起床し、作業を確認して行動
    - コスト制御 — エージェントごとの月次予算と自動執行
    - Multi-Company — 1 つのデプロイで多数の会社、完全なデータ分離
    - チケットシステム — 完全なツールコール追跡と監査ログ付きで全会話を追跡
    - ガバナンス — 採用承認、戦略の上書き、任意のエージェントの一時停止または終了
    - 組織図 — エージェントチームの階層、役割、報告ライン
    - モバイル対応 — どこからでも監視・管理
    - 本番向け外部 PostgreSQL サポート

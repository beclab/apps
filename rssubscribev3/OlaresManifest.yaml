olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: rssubscribev3
  description: A Wise plugin for subscribing to RSS feeds.
  icon: https://app.cdn.olares.com/appstore/rssubscribe/icon.png
  appid: rssubscribev3
  version: '1.1.27'
  title: RSS Subscribe Plugin
  categories:
    - homelab
    - Fun
  tags:
    - reading

sharedEntrances:
  - name: rssubscribe
    host: sharedentrances-rssubscribe
    port: 0
    title: RSS Subscribe API
    icon: https://app.cdn.olares.com/appstore/rssubscribe/icon.png
    invisible: true
    authLevel: internal
entrances:
  - name: rssubscribe-svc
    port: 8082
    host: rssubscribe-svc
    title: rssubscribe API
    icon: https://app.cdn.olares.com/appstore/rssubscribe/icon.png
    authLevel: private
    invisible: true

workloadReplicas:
  rssubscribev3: 1

spec:
  versionName: '1.0.2'
  fullDescription: |
    This plugin helps Wise subscribe to RSS feeds.

    It integrates RSSHub, which can generate RSS feeds for websites that do
    not provide one.

    After you install it, Wise can detect feeds on a website and add them
    to your subscriptions.

    **Key Features**

    - Subscribe to RSS feeds from websites, blogs, podcasts, and video channels.
    - Detect feeds when you add a website or feed URL in Wise.
    - Generate RSS feeds for supported sites through RSSHub.

    **For Olares Users**

    This application is shared across your Olares system. Once an admin
    installs it, Wise can use it for every user.

    For setup and daily use, see the [Wise documentation](https://docs.olares.com/manual/olares/wise/subscribe).
    For RSSHub routes and usage, see the [RSSHub documentation](https://docs.rsshub.app/).
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://docs.olares.com/manual/olares/wise/subscribe
  requiredMemory: 200Mi
  limitedMemory: 1200Mi
  requiredDisk: 128Mi
  limitedDisk: 256Mi
  requiredCpu: 10m
  limitedCpu: 1200m
  supportArch:
    - amd64
    - arm64
  onlyAdmin: true

permission:
  appData: true
  appCache: true
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.8-0'
      type: system
    - name: wisev3
      type: application
      version: '>=1.2.29'
      mandatory: true
middleware:
  postgres:
    username: rssubscribe
    databases:
      - name: rssubscribe

metadata:
  title: RSS Subscribe Plugin
  description: RSSを購読するためのWiseプラグイン
spec:
  fullDescription: |
    このプラグインは、WiseがRSSフィードを購読するのを助けます。

    RSSHubを統合しており、RSSを提供していないサイト向けにフィードを生成できます。

    インストール後、Wiseはサイト上のフィードを検出し、購読に追加できます。

    **主な機能**

    - RSSでウェブサイト、ブログ、ポッドキャスト、動画チャンネルを購読する。
    - WiseでサイトまたはフィードのURLを追加したときにフィードを検出する。
    - RSSHubを通じて、対応サイト向けにRSSフィードを生成する。

    **Olaresユーザー向け**

    このアプリケーションはOlaresシステム全体で共有されます。adminが
    インストールすると、Wiseが各ユーザー向けにこれを利用できます。

    セットアップと日常の使い方は[Wiseドキュメント](https://docs.olares.com/manual/olares/wise/subscribe)を参照してください。
    RSSHubのルートと使い方は[RSSHubドキュメント](https://docs.rsshub.app/)を参照してください。
  upgradeDescription: |

metadata:
  title: RSS Subscribe Plugin
  description: Un plugin Wise per iscriversi ai feed RSS
spec:
  fullDescription: |
    Questo plugin aiuta Wise a iscriversi ai feed RSS.

    Integra RSSHub, che può generare feed RSS per i siti che non ne
    forniscono uno.

    Dopo l'installazione, Wise può rilevare i feed di un sito e aggiungerli
    alle tue iscrizioni.

    **Funzionalità principali**

    - Iscriviti a feed RSS di siti, blog, podcast e canali video.
    - Rileva i feed quando aggiungi l'URL di un sito o di un feed in Wise.
    - Genera feed RSS per i siti supportati tramite RSSHub.

    **Per gli utenti Olares**

    Questa applicazione è condivisa in tutto il sistema Olares. Dopo l'installazione da parte di un admin,
    Wise può usarla per ogni utente.

    Per l'installazione e l'uso quotidiano, consulta la [documentazione Wise](https://docs.olares.com/manual/olares/wise/subscribe).
    Per le route e l'uso di RSSHub, consulta la [documentazione RSSHub](https://docs.rsshub.app/).
  upgradeDescription: |

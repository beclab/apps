metadata:
  title: RSS Subscribe Plugin
  description: A Wise plugin for subscribing to RSS feeds
spec:
  fullDescription: |
    This plugin helps Wise subscribe to RSS feeds.

    It integrates RSSHub, which can generate RSS feeds for websites that do
    not provide one.

    After you install it, Wise can detect feeds on a website and add them
    to your subscriptions.

    **Key Features**

    - Subscribe to RSS feeds from websites, blogs, podcasts, and video channels.
    - Detect feeds when you add a website or feed URL in Wise.
    - Generate RSS feeds for supported sites through RSSHub.

    **For Olares Users**

    This application is shared across your Olares system. Once an admin
    installs it, Wise can use it for every user.

    For setup and daily use, see the [Wise documentation](https://docs.olares.com/manual/olares/wise/subscribe).
    For RSSHub routes and usage, see the [RSSHub documentation](https://docs.rsshub.app/).
  upgradeDescription: |

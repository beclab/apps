metadata:
  title: RSS Subscribe Plugin
  description: Un plugin Wise pour s'abonner à des flux RSS
spec:
  fullDescription: |
    Ce plugin aide Wise à s'abonner à des flux RSS.

    Il intègre RSSHub, qui peut générer des flux RSS pour les sites qui n'en
    proposent pas.

    Après l'installation, Wise peut détecter les flux d'un site et les ajouter
    à vos abonnements.

    **Fonctionnalités principales**

    - S'abonner à des flux RSS de sites, blogs, podcasts et chaînes vidéo.
    - Détecter les flux lorsque vous ajoutez l'URL d'un site ou d'un flux dans Wise.
    - Générer des flux RSS pour les sites pris en charge via RSSHub.

    **Pour les utilisateurs Olares**

    Cette application est partagée sur tout votre système Olares. Une fois qu'un admin
    l'installe, Wise peut l'utiliser pour chaque utilisateur.

    Pour l'installation et l'usage quotidien, voir la [documentation Wise](https://docs.olares.com/manual/olares/wise/subscribe).
    Pour les routes et l'usage de RSSHub, voir la [documentation RSSHub](https://docs.rsshub.app/).
  upgradeDescription: |

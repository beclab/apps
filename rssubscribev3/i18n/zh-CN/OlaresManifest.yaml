metadata:
  title: RSS Subscribe Plugin
  description: 用于订阅 RSS 的 Wise 插件
spec:
  fullDescription: |
    此插件帮助 Wise 订阅 RSS。

    它集成了 RSSHub，可为没有提供 RSS 的网站生成订阅源。

    安装后，Wise 可以检测网站上的订阅源，并将其加入订阅。

    **主要功能**

    - 通过 RSS 订阅网站、博客、播客和视频频道。
    - 在 Wise 中添加网站或订阅源 URL 时检测订阅源。
    - 通过 RSSHub 为受支持的网站生成 RSS 订阅源。

    **Olares 用户说明**

    此应用在整个 Olares 系统中共享。管理员安装后，Wise 即可为每位用户使用它。

    安装与日常使用请参阅 [Wise 文档](https://docs.olares.com/manual/olares/wise/subscribe)。
    RSSHub 路由与用法请参阅 [RSSHub 文档](https://docs.rsshub.app/)。
  upgradeDescription: |

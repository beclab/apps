metadata:
  title: RSS Subscribe Plugin
  description: Ein Wise-Plugin zum Abonnieren von RSS-Feeds
spec:
  fullDescription: |
    Dieses Plugin hilft Wise, RSS-Feeds zu abonnieren.

    Es integriert RSSHub, das RSS-Feeds für Websites erzeugen kann, die selbst
    keinen anbieten.

    Nach der Installation kann Wise Feeds auf einer Website erkennen und sie
    Ihren Abonnements hinzufügen.

    **Funktionen**

    - RSS-Feeds von Websites, Blogs, Podcasts und Videokanälen abonnieren.
    - Feeds erkennen, wenn Sie in Wise eine Website- oder Feed-URL hinzufügen.
    - RSS-Feeds für unterstützte Seiten über RSSHub erzeugen.

    **Für Olares-Nutzer**

    Diese Anwendung ist in Ihrem Olares-System geteilt. Sobald ein Admin
    sie installiert, kann Wise sie für jeden Nutzer verwenden.

    Zu Einrichtung und Alltag siehe die [Wise-Dokumentation](https://docs.olares.com/manual/olares/wise/subscribe).
    Zu RSSHub-Routen und Nutzung siehe die [RSSHub-Dokumentation](https://docs.rsshub.app/).
  upgradeDescription: |

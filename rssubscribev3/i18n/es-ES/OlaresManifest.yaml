metadata:
  title: RSS Subscribe Plugin
  description: Un complemento de Wise para suscribirse a feeds RSS
spec:
  fullDescription: |
    Este complemento ayuda a Wise a suscribirse a feeds RSS.

    Integra RSSHub, que puede generar feeds RSS para sitios web que no
    ofrecen uno.

    Tras instalarlo, Wise puede detectar los feeds de un sitio web y añadirlos
    a sus suscripciones.

    **Funciones principales**

    - Suscribirse a feeds RSS de sitios web, blogs, pódcast y canales de vídeo.
    - Detectar feeds al añadir la URL de un sitio o de un feed en Wise.
    - Generar feeds RSS para sitios compatibles a través de RSSHub.

    **Para usuarios de Olares**

    Esta aplicación se comparte en todo el sistema Olares. Cuando un admin
    la instala, Wise puede usarla para cada usuario.

    Para la configuración y el uso diario, consulte la [documentación de Wise](https://docs.olares.com/manual/olares/wise/subscribe).
    Para las rutas y el uso de RSSHub, consulte la [documentación de RSSHub](https://docs.rsshub.app/).
  upgradeDescription: |

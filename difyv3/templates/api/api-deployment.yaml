---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: api
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.api.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: "1.35.0 (HEAD)"
      labels:
        io.kompose.service: api
    spec:
      initContainers:
        - name: migrate-appcache-to-appdata
          image: "docker.io/beclab/busybox:1.37"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              SOURCE=/old-data
              DEST=/new-data
              MARKER="${DEST}/.migration_from_appcache_done"
              if [ -f "$MARKER" ]; then echo "[migrate] marker present, skip."; exit 0; fi
              if [ -n "$(ls -A "$DEST" 2>/dev/null | grep -v '^\.migration_from_appcache_done$' || true)" ]; then
                echo "[migrate] appData already has data, skip."
                echo "skipped existing dest at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
                exit 0
              fi
              if [ -n "$(ls -A "$SOURCE" 2>/dev/null || true)" ]; then
                echo "[migrate] copying appCache -> appData..."
                cp -a "$SOURCE"/. "$DEST"/
                echo "migrated from appCache at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
                echo "[migrate] done; legacy appCache left intact for rollback."
              else
                echo "[migrate] no legacy data, fresh install."
                echo "fresh install at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
              fi
          volumeMounts:
            - name: api-vol-legacy
              mountPath: /old-data
              readOnly: true
            - name: api-vol
              mountPath: /new-data
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          # busybox runs as root by default so can chown
          command:
            - sh
            - -c
            - |
              set -eux
              # ensure the directory exists then fix ownership
              mkdir -p /app/api/storage
              chown -R 1001:1001 /app/api/storage
          resources: {}
          volumeMounts:
            - name: api-vol
              mountPath: /app/api/storage
          securityContext:
            runAsUser: 0
      containers:
        - name: api
          image: "docker.io/langgenius/dify-api:1.20.0"
          envFrom:
            - configMapRef:
                name: dify-api-env
            - secretRef:
                name: dify-api-secrets
          env:
            - name: MODE
              value: "api"
            - name: DB_EXTRAS
              value: "keepalives=1&keepalives_idle=30&keepalives_interval=10&keepalives_count=3"
            - name: SQLALCHEMY_POOL_SIZE
              value: "5"
            - name: SQLALCHEMY_MAX_OVERFLOW
              value: "3"
          ports:
            - containerPort: 5001
              name: http
          startupProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - mountPath: /app/api/storage
              name: api-vol
      restartPolicy: Always
      volumes:
        - name: api-vol-legacy
          hostPath:
            type: DirectoryOrCreate
            path: {{ .Values.userspace.appCache }}/volumes/app/storage
        - name: api-vol
          hostPath:
            type: DirectoryOrCreate
            path: {{ .Values.userspace.appData }}/volumes/app/storage

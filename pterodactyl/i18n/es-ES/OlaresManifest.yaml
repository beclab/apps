metadata:
  title: Pterodactyl Panel
  description: Gestión de servidores de juegos con un nodo Wings local experimental
spec:
  upgradeDescription: |
    Actualiza Panel a 1.15.2 con la imagen oficial de PHP 8.3.36. Conserva las cuentas, los nodos, los servidores y los ajustes de Wings existentes. Wings se mantiene en la versión 1.13.3.
  fullDescription: |
    Pterodactyl es un panel de código abierto para gestionar servidores de juegos. Administra consolas, archivos, tareas programadas, copias de seguridad y permisos de usuario desde el navegador.

    Panel gestiona servidores de juegos creados mediante Wings. No toma el control de Minecraft ni de otras aplicaciones instaladas por separado desde Olares Market.

    Este paquete de Olares incluye Panel 1.15.2 y un nodo Wings 1.13.3 local experimental con Docker-in-Docker. Define el nombre de usuario y la contraseña del administrador durante la instalación. Las actualizaciones conservan las cuentas de administrador existentes.

    El servicio Docker local se ejecuta en un contenedor privilegiado. Panel y Wings usan UID/GID 1000. Los scripts de instalación de juegos deben crear archivos con el mismo propietario; otras plantillas pueden necesitar adaptaciones.

    Antes de añadir un servidor local, crea en Panel una asignación para 0.0.0.0:30000. Este puerto TCP interno se expone como TCP 43000 del nodo. SFTP usa TCP 42022 del nodo. Usa la dirección real del nodo y el puerto externo para conectar los clientes del juego. Otros puertos requieren configuración adicional.

    Crea servidores Terraria/TShock con plantillas Egg y usa Panel para gestionar el inicio, la parada, los comandos de consola, las copias de seguridad y la recuperación.

    Se requiere el middleware MariaDB. Exporta la base de datos de Panel antes de desinstalar si necesitas conservar cuentas y configuración; conservar solo los datos de la aplicación no garantiza la conservación de la base de datos. Configura SMTP por separado para enviar correo.
entrances:

metadata:
  title: Pterodactyl Panel
  description: Gameserver-Verwaltung mit experimentellem lokalem Wings-Knoten
spec:
  upgradeDescription: |
    Aktualisiert Panel auf 1.15.2 mit dem offiziellen PHP-8.3.36-Image. Bestehende Konten, Knoten, Server und Wings-Einstellungen bleiben erhalten. Wings bleibt bei Version 1.13.3.
  fullDescription: |
    Pterodactyl ist ein quelloffenes Verwaltungspanel für Gameserver. Verwalten Sie Konsolen, Dateien, Zeitpläne, Backups und Benutzerrechte im Browser.

    Panel verwaltet Gameserver, die über Wings erstellt wurden. Separat aus Olares Market installierte Anwendungen, einschließlich Minecraft, werden nicht übernommen.

    Dieses Olares-Paket enthält Panel 1.15.2 und einen experimentellen lokalen Wings-Knoten 1.13.3 mit Docker-in-Docker. Legen Sie den Administratornamen und das Passwort bei der Installation fest. Bestehende Administratorkonten bleiben bei Upgrades erhalten.

    Der lokale Docker-Dienst läuft in einem privilegierten Container. Panel und Wings verwenden UID/GID 1000. Installationsskripte für Spiele müssen Dateien mit derselben Eigentümerzuordnung erstellen; andere Spielvorlagen können Anpassungen erfordern.

    Erstellen Sie in Panel eine Zuweisung für 0.0.0.0:30000, bevor Sie einen lokalen Gameserver hinzufügen. Dieser interne TCP-Port wird als TCP 43000 am Knoten bereitgestellt. SFTP verwendet TCP 42022 am Knoten. Verwenden Sie für Spielclients die tatsächliche Knotenadresse und den externen Port. Weitere Spielports erfordern zusätzliche Konfiguration.

    Erstellen Sie Terraria/TShock-Server mit Egg-Vorlagen und verwalten Sie Start, Stopp, Konsolenbefehle, Backups und Wiederherstellung über Panel.

    MariaDB-Middleware ist erforderlich. Exportieren Sie vor der Deinstallation die Panel-Datenbank, wenn Konten und Konfiguration erhalten bleiben sollen. Das Beibehalten der App-Daten allein garantiert keinen Datenbankerhalt. Konfigurieren Sie SMTP separat für den E-Mail-Versand.
entrances:
- name: panel
  title: Pterodactyl Panel
- name: wings
  title: Wings API
envs:
- envName: ENABLE_WINGS
  description: Lokalen Wings-Knoten mit einem privilegierten Docker-in-Docker-Dienst ausführen
- envName: ADMIN_USERNAME
  description: Administratorname
- envName: ADMIN_PASSWORD
  description: Administratorpasswort (mindestens 8 Zeichen)

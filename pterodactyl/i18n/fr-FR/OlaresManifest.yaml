metadata:
  title: Pterodactyl Panel
  description: Gestion de serveurs de jeux avec un nœud Wings local expérimental
spec:
  upgradeDescription: |
    Met à jour Panel vers la version 1.15.2 avec l’image officielle de PHP 8.3.36. Conserve les comptes, les nœuds, les serveurs et les réglages de Wings existants. Wings reste à la version 1.13.3.
  fullDescription: |
    Pterodactyl est un panneau open source de gestion de serveurs de jeux. Gérez les consoles, fichiers, tâches planifiées, sauvegardes et permissions depuis votre navigateur.

    Panel gère les serveurs de jeux créés via Wings. Il ne prend pas en charge les applications installées séparément depuis Olares Market, y compris Minecraft.

    Ce paquet Olares comprend Panel 1.15.2 et un nœud Wings 1.13.3 local expérimental utilisant Docker-in-Docker. Définissez le nom d’utilisateur et le mot de passe administrateur pendant l’installation. Les mises à niveau conservent les comptes administrateur existants.

    Le service Docker local fonctionne dans un conteneur privilégié. Panel et Wings utilisent UID/GID 1000. Les scripts d’installation des jeux doivent créer des fichiers avec le même propriétaire ; les autres modèles peuvent nécessiter une adaptation.

    Avant d’ajouter un serveur local, créez une allocation pour 0.0.0.0:30000 dans Panel. Ce port TCP interne est exposé sur le port TCP 43000 du nœud. SFTP utilise le port TCP 42022 du nœud. Utilisez l’adresse réelle du nœud et le port externe pour les clients du jeu. Les autres ports nécessitent une configuration supplémentaire.

    Créez des serveurs Terraria/TShock avec des modèles Egg et utilisez Panel pour gérer le démarrage, l’arrêt, les commandes de console, les sauvegardes et la restauration.

    Le middleware MariaDB est requis. Exportez la base de données de Panel avant la désinstallation pour conserver les comptes et la configuration. Conserver uniquement les données de l’application ne garantit pas la conservation de la base de données. Configurez SMTP séparément pour l’envoi d’e-mails.

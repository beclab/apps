metadata:
  title: Pterodactyl Panel
  description: Game server management with an experimental local Wings node
spec:
  upgradeDescription: |
    Updates Panel to 1.15.2 with the official PHP 8.3.36 image. Keeps existing accounts, nodes, servers, and Wings settings. Wings remains at 1.13.3.
  fullDescription: |
    Pterodactyl is an open-source game server management panel. Manage server consoles, files, schedules, backups and user permissions from your browser.

    Panel manages game servers created through Wings. It does not take over Minecraft or other applications installed separately from Olares Market.

    This Olares package includes Panel 1.15.2 and an experimental local Wings 1.13.3 node backed by Docker-in-Docker. Set the administrator username and password during installation. Existing administrators are preserved on upgrades.

    The local Docker service runs in a privileged container. Panel and Wings run as UID/GID 1000. Game installation scripts must create files with matching ownership; arbitrary game templates may need adaptation.

    Create an allocation for 0.0.0.0:30000 in Panel before adding a local game server. This internal TCP port is exposed as node TCP 43000. SFTP uses node TCP 42022. Advertise the actual node address and exposed port to game clients. Other game ports require additional configuration.

    Create Terraria/TShock servers with Egg templates and use Panel to manage startup, shutdown, console commands, backups and recovery.

    MariaDB middleware is required. Export the Panel database before uninstalling if retaining accounts and configuration; retaining App Data alone does not guarantee database preservation. Configure SMTP separately for email delivery.
entrances:
- name: panel
  title: Pterodactyl Panel
- name: wings
  title: Wings API
envs:
- envName: ENABLE_WINGS
  description: Run a local Wings node with a privileged Docker-in-Docker service
- envName: ADMIN_USERNAME
  description: Administrator username
- envName: ADMIN_PASSWORD
  description: Administrator password (at least 8 characters)

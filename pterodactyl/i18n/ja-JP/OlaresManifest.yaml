metadata:
  title: Pterodactyl Panel
  description: 実験的なローカルWingsノードを備えたゲームサーバー管理パネル
spec:
  fullDescription: |
    Pterodactylはオープンソースのゲームサーバー管理パネルです。ブラウザーからコンソール、ファイル、スケジュール、バックアップ、ユーザー権限を管理できます。

    PanelはWingsで作成したゲームサーバーを管理します。Olares Marketから個別にインストールしたMinecraftや他のアプリを引き継ぐことはできません。

    Olares向けパッケージには、Panel 1.15.1とDocker-in-Dockerで動作する実験的なローカルWings 1.13.3ノードが含まれます。インストール時に管理者のユーザー名とパスワードを設定します。アップグレード時には既存の管理者アカウントが保持されます。

    ローカルDockerサービスは特権コンテナーで動作します。PanelとWingsはUID/GID 1000で実行されます。ゲームのインストールスクリプトが作成するファイルも同じ所有者である必要があります。他のゲームテンプレートには調整が必要な場合があります。

    ローカルゲームサーバーを追加する前に、Panelで0.0.0.0:30000のポート割り当てを作成してください。この内部TCPポートはノードのTCP 43000に公開されます。SFTPはノードのTCP 42022を使用します。ゲームクライアントには実際のノードアドレスと外部ポートを指定してください。他のゲームポートには追加設定が必要です。

    EggテンプレートでTerraria/TShockサーバーを作成し、Panelから起動・停止、コンソールコマンド、バックアップと復元を管理できます。

    MariaDBミドルウェアが必要です。アカウントと設定を保持するには、アンインストール前にPanelのデータベースをエクスポートしてください。アプリデータを保持するだけではデータベースの保持は保証されません。メール送信にはSMTPを別途設定してください。
entrances:
- name: panel
  title: Pterodactyl Panel
- name: wings
  title: Wings API
envs:
- envName: ENABLE_WINGS
  description: 特権Docker-in-DockerサービスでローカルWingsノードを実行
- envName: ADMIN_USERNAME
  description: 管理者ユーザー名
- envName: ADMIN_PASSWORD
  description: 管理者パスワード（8文字以上）

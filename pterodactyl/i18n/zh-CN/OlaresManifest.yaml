metadata:
  title: Pterodactyl Panel
  description: 游戏服务器管理面板，包含实验性的本地 Wings 节点
spec:
  upgradeDescription: |
    升级 Panel 至 1.15.2，使用官方 PHP 8.3.36 镜像。保留现有账户、节点、服务器和 Wings 设置。Wings 版本保持 1.13.3。
  fullDescription: |
    Pterodactyl 是开源的游戏服务器管理面板。通过浏览器管理服务器控制台、文件、计划任务、备份和用户权限。

    Panel 管理通过 Wings 创建的游戏服务器，不会接管从 Olares Market 独立安装的 Minecraft 或其他应用。

    Olares 版本包含 Panel 1.15.2 和实验性的本地 Wings 1.13.3 节点，后者通过 Docker-in-Docker 运行。安装时设置管理员用户名和密码。升级时保留现有管理员账户。

    本地 Docker 服务运行在特权容器中。Panel 和 Wings 使用 UID/GID 1000 运行。游戏安装脚本创建的文件必须使用相同的所有者；其他游戏模板可能需要适配。

    添加本地游戏服务器前，在 Panel 中为 0.0.0.0:30000 创建端口分配。内部 TCP 端口映射到节点的 TCP 43000，SFTP 使用节点的 TCP 42022。连接游戏时使用实际节点地址和对外端口。其他游戏端口需要另行配置。

    支持通过 Egg 模板创建 Terraria/TShock 服务器，并使用 Panel 管理服务器启停、控制台命令和备份恢复。

    需要 MariaDB 中间件。如需保留账户和配置，请在卸载前导出 Panel 数据库；仅保留应用数据不保证数据库能够保留。邮件发送需要单独配置 SMTP。
entrances:
- name: panel
  title: Pterodactyl Panel
- name: wings
  title: Wings API
envs:
- envName: ENABLE_WINGS
  description: 通过特权 Docker-in-Docker 服务运行本地 Wings 节点
- envName: ADMIN_USERNAME
  description: 管理员用户名
- envName: ADMIN_PASSWORD
  description: 管理员密码（至少 8 个字符）

{{- $existing := lookup "v1" "Secret" .Release.Namespace "pterodactyl-auth" -}}
{{- $key := printf "base64:%s" (randAlphaNum 32 | b64enc) -}}
{{- if and $existing $existing.data -}}
{{- $key = index $existing.data "APP_KEY" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pterodactyl-auth
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  APP_KEY: {{ $key | quote }}
  ADMIN_USERNAME: {{ .Values.olaresEnv.ADMIN_USERNAME | quote }}
  ADMIN_PASSWORD: {{ .Values.olaresEnv.ADMIN_PASSWORD | quote }}
  DB_PASSWORD: {{ .Values.mariadb.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}

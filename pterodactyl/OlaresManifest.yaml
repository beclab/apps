olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: pterodactyl
  title: Pterodactyl Panel
  description: Game server management with an experimental local Wings node.
  icon: https://cdn.olares.com/images/2026/10/a6d9f087598ca3a354f566343f1b2588.png
  version: 0.0.13
  categories:
    - Developer Tools
    - Fun
    - homelab
  tags:
    - gaming
entrances:
  - name: panel
    host: pterodactyl
    port: 8080
    title: Pterodactyl Panel
    icon: https://cdn.olares.com/images/2026/10/a6d9f087598ca3a354f566343f1b2588.png
    authLevel: private
    openMethod: window
  - name: wings
    host: wings
    port: 8080
    title: Wings API
    icon: https://cdn.olares.com/images/2026/10/a6d9f087598ca3a354f566343f1b2588.png
    authLevel: public
    invisible: true
ports:
  - name: wingssftp
    host: wings
    port: 2022
    exposePort: 42022
    protocol: tcp
  - name: wingstestgame
    host: wings
    port: 30000
    exposePort: 43000
    protocol: tcp
spec:
  versionName: '1.15.1'
  developer: Pterodactyl Software
  website: https://pterodactyl.io/
  sourceCode: https://github.com/pterodactyl/panel
  doc: https://docs.pterodactyl.io/v1
  submitter: harveyff
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - fr-FR
    - it-IT
    - ja-JP
  license:
    - text: MIT License
      url: https://github.com/pterodactyl/panel/blob/develop/LICENSE.md
  featuredImage: https://cdn.olares.com/images/2026/10/e6b8791ebba2f51e2cdc6e783a6f0a58.png
  promoteImage:
    - https://cdn.olares.com/images/2026/10/e6b8791ebba2f51e2cdc6e783a6f0a58.png
    - https://cdn.olares.com/images/2026/10/3d08eb1c79172687b0622fcea9247940.png
    - https://cdn.olares.com/images/2026/10/7e42f94f2ec59d6abab793d424308add.png
  fullDescription: |
    Pterodactyl is an open-source game server management panel. Manage server consoles, files, schedules, backups and user permissions from your browser.

    Panel manages game servers created through Wings. It does not take over Minecraft or other applications installed separately from Olares Market.

    This Olares package includes Panel 1.15.1 and an experimental local Wings 1.13.3 node backed by Docker-in-Docker. Set the administrator username and password during installation. Existing administrators are preserved on upgrades.

    The local Docker service runs in a privileged container. Panel and Wings run as UID/GID 1000. Game installation scripts must create files with matching ownership; arbitrary game templates may need adaptation.

    Create an allocation for 0.0.0.0:30000 in Panel before adding a local game server. This internal TCP port is exposed as node TCP 43000. SFTP uses node TCP 42022. Advertise the actual node address and exposed port to game clients. Other game ports require additional configuration.

    Create Terraria/TShock servers with Egg templates and use Panel to manage startup, shutdown, console commands, backups and recovery.

    MariaDB middleware is required. Export the Panel database before uninstalling if retaining accounts and configuration; retaining App Data alone does not guarantee database preservation. Configure SMTP separately for email delivery.
  supportArch:
    - amd64
    - arm64
  requiredCpu: '1'
  limitedCpu: '6'
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
permission:
  appData: true
  appCache: true
middleware:
  mariadb:
    username: pterodactyl
    databases:
      - name: panel
  redis:
    namespace: pterodactyl
options:
  apiTimeout: 300
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
    - name: mariadb
      type: middleware
      version: '>=10.0.0-0'
      mandatory: true
workloadReplicas:
  pterodactyl: 1
  wings: 1
envs:
  - envName: ENABLE_WINGS
    type: bool
    default: 'true'
    required: false
    editable: false
    description: Run a local Wings node with a privileged Docker-in-Docker service
  - envName: ADMIN_USERNAME
    type: string
    required: true
    editable: false
    regex: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$'
    description: Administrator username
  - envName: ADMIN_PASSWORD
    type: password
    required: true
    editable: false
    regex: '^.{8,}$'
    description: Administrator password (at least 8 characters)

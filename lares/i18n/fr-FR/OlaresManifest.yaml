metadata:
  title: Lares
  description: Un assistant IA pour gérer Olares et effectuer des recherches sur le web

spec:
  fullDescription: |
    Lares est l’assistant IA officiel d’Olares. Décrivez un objectif en langage naturel pour gérer vos applications, vos fichiers et votre système. Avec Router et un modèle d’IA connecté, Lares planifie les étapes et utilise des outils pour effectuer des tâches sur votre appareil au fil de la conversation.

    **Fonctionnalités principales**

    - Traitez les demandes quotidiennes et les tâches en plusieurs étapes dans une même conversation.
    - Utilisez les modèles d’IA et les outils configurés dans Router.
    - Contrôlez les actions de Lares avec les autorisations Lecture seule, Écriture ou Accès complet.
    - Explorez le contenu public du web avec les outils de recherche et de lecture de pages configurés, puis obtenez des synthèses avec des liens vers les sources.

    **Avant de commencer**

    Lares nécessite Olares 1.12.7 ou une version ultérieure, Router et un modèle d’IA connecté. Sélectionnez un modèle et confirmez le niveau d’autorisation avant de lancer une tâche.

    Pour effectuer des recherches sur le web, configurez et activez les outils dans Router. Pour utiliser la recherche web, sélectionnez également un service de recherche par défaut dans les paramètres de Lares. Les outils qui servent uniquement à lire des pages web sont appelés lorsque vous demandez à Lares de lire une URL précise.

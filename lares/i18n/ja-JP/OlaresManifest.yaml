metadata:
  title: Lares
  description: Olaresの管理とウェブ調査を行うAIアシスタント

spec:
  fullDescription: |
    LaresはOlares公式のAIアシスタントです。自然言語で目標を伝えることで、アプリ、ファイル、システムを管理できます。Routerと接続済みのAIモデルを使い、Laresが手順を計画してツールを呼び出し、対話を通じてデバイス上のタスクを実行します。

    **主な機能**

    - 日常的な依頼から複数の手順が必要なタスクまで、ひとつの会話で処理できます。
    - Routerに設定されたAIモデルとツールを利用できます。
    - 読み取り専用、書き込み、フルアクセスの権限で、Laresが実行できる操作を制御できます。
    - 設定済みの検索ツールとページ読み取りツールで公開ウェブコンテンツを調査し、情報源へのリンク付きで結果を要約できます。

    **利用を始める前に**

    LaresにはOlares 1.12.7以降、Router、接続済みのAIモデルが必要です。タスクを開始する前に、モデルを選択して権限レベルを確認してください。

    ウェブ調査を行うには、Routerでツールを設定して有効にしてください。ウェブ検索には、Laresの設定でデフォルトの検索サービスを選ぶ必要もあります。ウェブページの読み取り専用ツールは、特定のURLを読むようLaresに依頼したときに呼び出されます。

metadata:
  title: Lares
  description: Chat on Olares, wired to Router

spec:
  fullDescription: |
    Lares is a chat app on Olares.
    It talks to Olares Router for LLM access.

    **Highlights**
    - Three-column chat UI with the Lares product profile
    - Zero-config Router auth via in-cluster app identity (`x-caller-appid`)
    - Bundled client plugins (voice input, web search) when enabled in the build
    - Optional Docker-in-Docker sidecar (`ENABLE_DIND`, default on) so the agent can run `docker` against a pod-local daemon

    **Requirements**
    - Olares >= 1.12.7
    - Router app installed and running (`router` dependency)
    - Arch: amd64, arm64

    **Getting started**
    1. Install Lares from Market (test source: `market.test`).
    2. Ensure Router is installed.
    3. Open the Lares entrance and start a chat.
  upgradeDescription: |
    **Lares 0.26.31**

    - Update the Olares command-line tools the chat agent works through, so it
      reads a generated file's address from the model application's own reply
      instead of searching your drive for it.

    **Lares 0.26.30**

    - Generated images load faster in chat: the conversation shows a resized
      copy from your own drive, and opening or downloading one still gives you
      the full-size original.
    - A generated file no longer goes missing from the reply when the model
      application hands back its address directly.
    - Drop the retired stats-line spacer under the composer.

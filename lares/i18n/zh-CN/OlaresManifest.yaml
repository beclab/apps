metadata:
  title: Lares
  description: 运行在 Olares 上的聊天应用，对接 Router

spec:
  fullDescription: |
    Lares 是运行在 Olares 上的聊天应用。
    通过 Olares Router 访问 LLM。

    **能力**
    - 三栏聊天界面 + Lares 产品品牌
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    **运行要求**
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64、arm64

    **开始使用**
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    **Lares 0.26.31**

    - 更新对话 Agent 所用的 Olares 命令行工具：生成文件的地址现在直接从模型
      应用的回复里读，不再去你的网盘里翻找。

    **Lares 0.26.30**

    - 聊天里的生成图片加载更快：对话中显示的是从你自己网盘取的缩放副本，
      点开查看和下载拿到的仍是原图。
    - 生成的文件不会再从回复里消失：模型应用直接给出地址时也能正常带出。
    - 去掉输入框下方已停用的 stats 行占位。

{{- $oe := .Values.olaresEnv | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: hermesagent-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hermesagent
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  API_SERVER_KEY: {{ index $oe "HERMES_API_SERVER_KEY" | default "" | quote }}
  OPENAI_API_KEY: {{ index $oe "OPENAI_API_KEY" | default "" | quote }}
  ANTHROPIC_API_KEY: {{ index $oe "ANTHROPIC_API_KEY" | default "" | quote }}

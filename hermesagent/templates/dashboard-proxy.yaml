---
# Loopback dashboard (no Hermes auth gate) + nginx sidecar on :9119.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermesagent-dashboard-proxy
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: hermesagent
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      upstream hermes-dashboard {
        server 127.0.0.1:19119;
      }

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      map $http_x_forwarded_proto $webapp_scheme {
        default $scheme;
        https https;
      }

      server {
        listen 9120;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json;
        server_name _;
        client_max_body_size 100m;
        location / {
          proxy_pass http://127.0.0.1:19120;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $webapp_scheme;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      server {
        listen 9119;
        server_name _;

        client_max_body_size 100m;
        proxy_connect_timeout 60s;

        location / {
          proxy_pass http://hermes-dashboard;
          proxy_http_version 1.1;
          # Loopback dashboard only accepts loopback Host/Origin (GHSA-ppp5-vxwm-4cf7).
          proxy_set_header Host 127.0.0.1:19119;
          proxy_set_header Origin "http://127.0.0.1:19119";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }

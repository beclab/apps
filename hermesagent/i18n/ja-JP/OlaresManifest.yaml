metadata:
  title: Hermes Agent
  description: あなたと共に成長するエージェント
spec:
  fullDescription: |
    **[Nous Research](https://nousresearch.com) が構築した自己改善型 AI エージェント。** 組み込みの学習ループを持つ唯一のエージェントで、経験からスキルを作り、利用中に改善し、知識の永続化を自ら促し、過去の会話を検索し、セッションをまたいであなたについてのモデルを深めていきます。5 ドルの VPS、GPU クラスター、アイドル時ほぼ無料のサーバーレス基盤で実行可能。ノート PC に縛られず、クラウド VM 上で動きながら Telegram から話せます。
    
    **主な機能**
    - **本格的なターミナル UI**: 複数行編集、スラッシュコマンド補完、会話履歴、割り込みとリダイレクト、ストリーミングツール出力付きフル TUI。
    - **あなたの居場所で動く**: Telegram、Discord、Slack、WhatsApp、Signal、CLI — 単一ゲートウェイプロセスからすべて。ボイスメモ文字起こし、クロスプラットフォームの会話継続。
    - **閉じた学習ループ**: 定期的なナッジ付きエージェント管理メモリ。複雑なタスク後の自律的スキル作成。利用中にスキルが自己改善。クロスセッション想起のための LLM 要約付き FTS5 セッション検索。[Honcho](https://github.com/plastic-labs/honcho) による弁証法的ユーザーモデリング。[agentskills.io](https://agentskills.io) オープン標準互換。
    - **スケジュール自動化**: 任意プラットフォームへの配信付き組み込み cron。日次レポート、夜間バックアップ、週次監査 — すべて自然言語で無人実行。
    - **委任と並列化**: 並列ワークストリーム向けに隔離サブエージェントを生成。RPC 経由でツールを呼ぶ Python スクリプトを書き、多段パイプラインをコンテキストコストゼロのターンに圧縮。
    - **ノート PC 以外でも実行**: local、Docker、SSH、Singularity、Modal、Daytona の 6 つのターミナルバックエンド。Daytona と Modal はサーバーレス永続化を提供 — アイドル時に休止しオンデマンドで起床、セッション間はほぼ無料。5 ドル VPS でも GPU クラスターでも可。
    - **研究向け**: バッチ軌道生成、次世代ツール呼び出しモデル訓練向けの軌道圧縮。
  upgradeDescription: |
    アップストリームリリース：[Hermes Agent v0.21.0（v2026.8.31）](https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.31)

    **主な変更点**
    - Bot Modeが組み込まれ、名前付きエージェント、アバター、グループルーム、@メンション、`hermes peer`による永続的なBot間会話を利用できます。
    - 定期実行ジョブは実行間でメモリと連続性を保持し、永続的なメモ帳を使用し、変更がない場合は監視実行をスキップできます。
    - 実行中のサブエージェントを一覧表示、方向修正、停止でき、任意のJSON Schema検証とタスクごとのコスト表示にも対応します。
    - CLIにCtrl+Pコマンドパレット、ファジー`/model`検索、詳細な`/status`、リアルタイム性能指標、セッションのピン留め、グローバル緊急停止が追加されました。
    - Meta Model API、CommandCode、Tencent TokenPlan、Nebius Token Factory、Ramp Router、Actual Computerが新しいプロバイダーとして追加されました。

    **修正**
    - プロバイダー停滞、構造化出力エラー、中断されたコマンド、セッションデータベースの競合、繰り返す圧縮失敗からの復旧を改善しました。
    - 最終メッセージ配信、Slackストリーミング、リレー音声文字起こし、再接続時のイベントリプレイなど、Gatewayとチャネルの信頼性を改善しました。
    - 保護されたエージェント指示、スキル、メモリファイルへの書き込みに承認が必要になり、シークレットのマスキングと破壊的コマンドのチェックも拡張されました。

    **設定と動作の変更**
    - デリゲーションのデフォルトが250イテレーション、10個の同時サブエージェントに増加したため、並列度の高い処理ではリソースとプロバイダーの上限を確認してください。
    - 新しい`model_overrides`設定で、モデルのコンテキストウィンドウ、料金、機能を調整できます。

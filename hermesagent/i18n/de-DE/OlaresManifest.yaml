metadata:
  title: Hermes Agent
  description: Der Agent, der mit Ihnen wächst
spec:
  fullDescription: |
    **Der selbstverbessernde KI-Agent von [Nous Research](https://nousresearch.com).** Er ist der einzige Agent mit einer eingebauten Lernschleife — er erstellt Skills aus Erfahrung, verbessert sie während der Nutzung, erinnert sich selbst daran, Wissen zu persistieren, durchsucht seine eigenen vergangenen Gespräche und baut über Sessions hinweg ein vertieftes Modell von Ihnen auf. Betreiben Sie ihn auf einem 5-$-VPS, einem GPU-Cluster oder serverless Infrastruktur, die im Idle nahezu nichts kostet. Er ist nicht an Ihr Laptop gebunden — sprechen Sie über Telegram mit ihm, während er auf einer Cloud-VM arbeitet.
    
    **Hauptfunktionen**
    - **Eine echte Terminal-Oberfläche**: Vollständige TUI mit Mehrzeilenbearbeitung, Slash-Command-Autocomplete, Gesprächsverlauf, Interrupt-and-Redirect und streaming Tool-Ausgabe.
    - **Lebt dort, wo Sie sind**: Telegram, Discord, Slack, WhatsApp, Signal und CLI — alles aus einem einzigen Gateway-Prozess. Sprachnotiz-Transkription, plattformübergreifende Gesprächskontinuität.
    - **Eine geschlossene Lernschleife**: Agent-kuratiertes Memory mit periodischen Nudges. Autonome Skill-Erstellung nach komplexen Aufgaben. Skills verbessern sich während der Nutzung selbst. FTS5-Session-Suche mit LLM-Zusammenfassung für Recall über Sessions hinweg. [Honcho](https://github.com/plastic-labs/honcho) dialektische Benutzermodellierung. Kompatibel mit dem offenen Standard [agentskills.io](https://agentskills.io).
    - **Geplante Automatisierungen**: Eingebauter Cron-Scheduler mit Zustellung an jede Plattform. Tägliche Reports, nächtliche Backups, wöchentliche Audits — alles in natürlicher Sprache, unbeaufsichtigt.
    - **Delegiert und parallelisiert**: Isolierte Subagents für parallele Workstreams spawnen. Python-Skripte schreiben, die Tools via RPC aufrufen und mehrstufige Pipelines in Turns mit null Kontextkosten verdichten.
    - **Läuft überall, nicht nur auf Ihrem Laptop**: Sechs Terminal-Backends — local, Docker, SSH, Singularity, Modal und Daytona. Daytona und Modal bieten serverless Persistenz — die Umgebung Ihres Agents hiberniert im Idle und wacht bei Bedarf auf, kostet zwischen Sessions nahezu nichts. Betreiben Sie ihn auf einem 5-$-VPS oder einem GPU-Cluster.
    - **Research-ready**: Batch-Trajectory-Generierung, Trajectory-Kompression zum Trainieren der nächsten Generation tool-calling Modelle.
  upgradeDescription: |
    Update auf Hermes Agent v0.22.2 mit einheitlicher Paketverwaltung, Plugin-Katalog, Migration der Speicheranbieter zu Plugins (einschließlich Hindsight) und gemeinsamem Gateway für mehrere Profile. Behebt den Gateway-Start nach einem Host-Neustart und verbessert die Zuverlässigkeit von Modellanfragen.

    Ergänzt persistente SSH-Konfiguration für LAN-Hosts: Ziele per Spracheingabe auswählen und Befehle sowie Skripte auf mehreren Rechnern ausführen. Schlüssel bleiben mit geschützten Zugriffsrechten erhalten. hindsight-client 0.10.2 bleibt vorinstalliert; der externe Hindsight-Dienst muss separat konfiguriert werden.

    https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.2

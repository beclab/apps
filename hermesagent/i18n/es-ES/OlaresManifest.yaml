metadata:
  title: Hermes Agent
  description: El agente que crece contigo
spec:
  fullDescription: |
    **El agente de IA que se auto-mejora, creado por [Nous Research](https://nousresearch.com).** Es el único agente con un bucle de aprendizaje integrado: crea skills a partir de la experiencia, las mejora durante el uso, se empuja a sí mismo a persistir conocimiento, busca en sus conversaciones pasadas y construye un modelo cada vez más profundo de quién eres entre sesiones. Ejecútalo en un VPS de $5, un clúster GPU o infraestructura serverless que cuesta casi nada en idle. No está atado a tu portátil: háblale desde Telegram mientras trabaja en una VM en la nube.
    
    **Funciones clave**
    - **Una interfaz de terminal real**: TUI completa con edición multilínea, autocompletado de slash-commands, historial de conversación, interrupt-and-redirect y salida de herramientas en streaming.
    - **Vive donde tú vives**: Telegram, Discord, Slack, WhatsApp, Signal y CLI — todo desde un único proceso gateway. Transcripción de notas de voz, continuidad de conversación entre plataformas.
    - **Un bucle de aprendizaje cerrado**: Memoria curada por el agente con empujones periódicos. Creación autónoma de skills tras tareas complejas. Las skills se auto-mejoran durante el uso. Búsqueda de sesiones FTS5 con resumen LLM para recall entre sesiones. Modelado dialéctico de usuario [Honcho](https://github.com/plastic-labs/honcho). Compatible con el estándar abierto [agentskills.io](https://agentskills.io).
    - **Automatizaciones programadas**: Programador cron integrado con entrega a cualquier plataforma. Informes diarios, backups nocturnos, auditorías semanales — todo en lenguaje natural, sin supervisión.
    - **Delega y paraleliza**: Genera subagentes aislados para workstreams paralelos. Escribe scripts Python que llaman herramientas vía RPC, colapsando pipelines multi-paso en turnos de coste de contexto cero.
    - **Se ejecuta en cualquier sitio, no solo en tu portátil**: Seis backends de terminal — local, Docker, SSH, Singularity, Modal y Daytona. Daytona y Modal ofrecen persistencia serverless: el entorno de tu agente hiberna en idle y despierta bajo demanda, costando casi nada entre sesiones. Ejecútalo en un VPS de $5 o un clúster GPU.
    - **Listo para investigación**: Generación batch de trayectorias, compresión de trayectorias para entrenar la próxima generación de modelos tool-calling.
  upgradeDescription: |
    Actualización a Hermes Agent v0.21.5 (v2026.9.24). Incluye hindsight-client 0.10.2 preinstalado para conectarse a un servicio Hindsight independiente (ya disponible en Olares 1.12.7).

    Hindsight es un plugin de memoria independiente. Configúralo en Plugins o con hermes memory setup y selecciona local_external para un servidor existente. El cliente incluido no activa la memoria automática ni inicia un servidor integrado. Se conservan los perfiles existentes.

    https://github.com/NousResearch/hermes-agent/releases/tag/v2026.9.24
    Nuevas opciones: skills.auto_load carga habilidades seleccionadas, mcp.discovery_concurrency (valor predeterminado 4) limita las conexiones MCP simultáneas y agent.auto_recovery_cycles (valor predeterminado 5) reintenta tras fallos temporales del proveedor. La recuperación automática puede prolongar la espera durante una interrupción. Se configuran en Hermes; no requieren parámetros de instalación adicionales.

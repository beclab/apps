metadata:
  title: Hermes Agent
  description: 与您一起成长的 AI Agent
spec:
  fullDescription: |
    **Nous Research 打造的自我进化型 AI Agent。** 它是唯一一个内置学习闭环的 Agent：从经验中生成技能、在使用中自我改进、可检索自己过往的对话，并在多次会话中不断加深对你的理解。在 $5 VPS、GPU 集群或无服务器基础设施上运行，成本几乎为零。它不绑定到您的笔记本电脑 — 从 Telegram 与它交谈，它在云 VM 上工作。

    **使用提示**
    网关重启
    - 在 Hermes CLI 终端中运行 `hermes gateway restart`（与受监督的 gateway 在同一容器内），即可重启网关并加载最新配置。

    可选 Python 后端（飞书、Honcho、Firecrawl 等）
    - 首次使用时安装到 `/opt/data/lazy-packages`（持久化；首次需能访问 PyPI）。
    - 飞书网关：配置凭据后 `hermes gateway restart`，连接时会自动安装 `lark-oapi`。
    - Honcho 记忆：若 `hermes memory setup honcho` 因 pip/权限失败，先在 CLI 执行：
      `python3 -c "from tools.lazy_deps import ensure; ensure('memory.honcho', prompt=False)"` 再重新 setup。

    npm / Node 包
    - `/opt/hermes` 只读，勿在此安装。npm 全局前缀已预设为 `/opt/data/npm-global`（持久化）。
    - 装 CLI 应用：`npm install -g <app>`（bin 已在 PATH）或 `npx <app>`。装库：在 `/opt/data` 等可写目录下 `npm install <pkg>`。

    存储
    - 所有Hermes状态——配置、API密钥、会话（SQLite + FTS5）、技能、记忆、定时任务、日志、检查点——均存储于`/opt/data`（`HERMES_HOME`）。无需外部数据库。该目录通过主机卷在Pod重启和升级时持久化保留。

    首次设置
    - 打开`Hermes CLI`入口并运行`hermes setup`以启动交互式向导。它会将API密钥、模型提供商和通道令牌写入`/opt/data`。
    - 可选：映射 Olares「集成」中的 OpenAI / Anthropic 密钥。
    - 消息机器人：配置 `TELEGRAM_ALLOWED_USERS` / `DISCORD_ALLOWED_USERS` 或 `GATEWAY_ALLOWED_USERS`（慎用 `GATEWAY_ALLOW_ALL_USERS`）。
    - 对接 Open WebUI：开启 API Server + Key，按需设置 `API_SERVER_CORS_ORIGINS` / `API_SERVER_MODEL_NAME`。
    - v0.19 常用：`/subscription`、`/topup`、`hermes sessions export`、智能审批与 `/deny`。

    **核心功能**
    - Quicksilver（v0.19）：首 token 约快 80%；推理实时流式；默认智能审批；Bitwarden/1Password 密钥源；子代理实时日志；崩溃后投递账本。
    - 全新 React/Ink 终端 UI：多行编辑、斜杠命令补全、流式输出、增量 Markdown、状态栏、亮色主题、OSC-52 剪贴板。
    - 多通道消息网关，**已支持 20 个平台**：Telegram、Discord、Slack、WhatsApp、Signal、Email、Teams、Google Chat、QQBot、腾讯元宝、Matrix、Mattermost、飞书、钉钉、IRC 等。
    - 学习闭环、多 Agent Kanban、`/goal`、Checkpoints v2、OpenAI 兼容 API Server。
    - 可调 Cron（`HERMES_CRON_*`）与忙时输入模式（queue / steer / interrupt）。
    - 新供应商/模型：Fireworks、DeepInfra、Upstage；GPT-5.6、grok-4.5、kimi-k3、Claude Sonnet/Fable 5 等；推理力度 `max` / `ultra`。
    - 安全加固与 7 语本地化；Dashboard 支持中文。

  upgradeDescription: |
    升级至 Hermes Agent v0.19.0 — Quicksilver 版本（1.3.32）。
    上游说明：https://github.com/NousResearch/hermes-agent/releases/tag/v2026.7.20

    变更要点：
    - 镜像：`beclab/harveyff-hermes-agent:v2026.7.20-uid1000`（UID 1000；amd64 + arm64）。
    - `API_SERVER_KEY` 迁入 Kubernetes Secret（`secretKeyRef`）。
    - 新增应用环境变量：API CORS / 模型名、Gateway 与 Telegram/Discord 白名单、Cron 超时与并行度、忙时输入模式与确认。
    - 可选映射 Olares「集成」中的 OpenAI / Anthropic 密钥到容器（经 Secret 注入）。
    - Quicksilver：首 token 约快 80%、智能审批、Bitwarden/1Password 密钥源、子代理实时日志、投递账本、新模型与供应商、会话导出、`/subscription` `/topup`。

    升级后通过 Olares 入口打开 Dashboard / Hermes CLI。现有 `/opt/data` 会保留。

    v1.3.23: Hermes Agent v0.18.0 单容器受监督架构；Dashboard 由 Olares 统一认证。
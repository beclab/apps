metadata:
  title: Hermes Agent
  description: 与您一起成长的 AI Agent
spec:
  fullDescription: |
    **Nous Research 打造的自我进化型 AI Agent。** 它是唯一一个内置学习闭环的 Agent：从经验中生成技能、在使用中自我改进、可检索自己过往的对话，并在多次会话中不断加深对你的理解。在 $5 VPS、GPU 集群或无服务器基础设施上运行，成本几乎为零。它不绑定到您的笔记本电脑 — 从 Telegram 与它交谈，它在云 VM 上工作。

    **核心功能**
    - **真实终端界面**：完整的 TUI，支持多行编辑、斜杠命令自动补全、会话历史、可中断与重定向、工具输出实时流式展示。
    - **随处可用**：支持 Telegram、Discord、Slack、WhatsApp、Signal 及 CLI，全部通过单一网关进程接入。支持语音消息转录，实现跨平台会话连续性。
    - **闭环学习机制**：自主整理记忆并定期提醒，复杂任务后可自动生成技能，技能在使用过程中自我改进，支持 FTS5 会话搜索与 LLM 总结，实现跨会话回溯。集成 [Honcho](https://github.com/plastic-labs/honcho) 用户建模，兼容 [agentskills.io](https://agentskills.io) 开放标准。
    - **自动化调度**：内置 cron 调度器，可向任意平台投递。支持日常报告、每日备份、每周审计等任务，无需人工值守，以自然语言运行。
    - **任务分流与并行**：可生成隔离的子代理以并行多工作流。支持通过 RPC 调用工具的 Python 脚本，实现多步骤流程零上下文损耗。
    - **随处运行，不局限于本地**：支持六种终端后端——本地、Docker、SSH、Singularity、Modal 和 Daytona。Daytona 和 Modal 提供无服务器持久化，空闲时环境休眠、需求时唤醒，会话间几乎零成本。可在 $5 VPS 或 GPU 集群上运行。
    - **科研级功能**：支持批量生成轨迹、轨迹压缩，用于训练下一代工具调用模型。

  upgradeDescription: |
    升级到 Hermes Agent v0.20.0（The Herald Release）。
    上游发布说明：https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.3

    Olares 打包变更：
    - 运行时镜像：`beclab/harveyff-hermes-agent:v2026.8.3-uid1000`（UID 1000 叠加层；amd64 + arm64）。
    - Brew 基础镜像：`beclab/harveyff-openclaw-brew-base:2026.8.7-cli`（新增 `certbot`，用于自定义域名 TLS 流程）。
    - Init 在 `/opt/data/.config/letsencrypt/cli.ini` 写入 certbot 默认配置（可写目录 + RSA 默认；非 root 可直接运行 certbot）。

    相对 v0.19.1 的上游亮点：
    - **语音与对话**：流式 TTS、可打断（barge-in）、设备端唤醒词；WhatsApp/飞书/钉钉/LINE/QQ 等平台语音消息转录与回复；可配置 STT/TTS。
    - **网关与集成**：Buzz（Nostr）平台适配、出站签名 Webhook、A2A v1.0 代理间协议、Relay 能力补齐（媒体、交互提示、线程生命周期）。
    - **CLI 增强**：`!` shell 模式、`/init`、`/diff`、`/context`、`/focus`；会话中途可重定向而无需重启。
    - **更智能的 Agent 循环**：工具自愈（截断溢出、patch 已应用检测、搜索恢复），默认迭代上限 90 → 500，上下文压缩优化。
    - **研究能力**：grounded-citations 技能，可验证引用与事实核查模式。
    - **性能**：Prompt 缓存、冷启动与配置读取优化。

    完整发布说明：https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.3

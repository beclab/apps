metadata:
  title: Hermes Agent
  description: 与您一起成长的 AI Agent
spec:
  fullDescription: |
    **Nous Research 打造的自我进化型 AI Agent。** 它是唯一一个内置学习闭环的 Agent：从经验中生成技能、在使用中自我改进、可检索自己过往的对话，并在多次会话中不断加深对你的理解。在 $5 VPS、GPU 集群或无服务器基础设施上运行，成本几乎为零。它不绑定到您的笔记本电脑 — 从 Telegram 与它交谈，它在云 VM 上工作。

    **核心功能**
    - **真实终端界面**：完整的 TUI，支持多行编辑、斜杠命令自动补全、会话历史、可中断与重定向、工具输出实时流式展示。
    - **随处可用**：支持 Telegram、Discord、Slack、WhatsApp、Signal 及 CLI，全部通过单一网关进程接入。支持语音消息转录，实现跨平台会话连续性。
    - **闭环学习机制**：自主整理记忆并定期提醒，复杂任务后可自动生成技能，技能在使用过程中自我改进，支持 FTS5 会话搜索与 LLM 总结，实现跨会话回溯。集成 [Honcho](https://github.com/plastic-labs/honcho) 用户建模，兼容 [agentskills.io](https://agentskills.io) 开放标准。
    - **自动化调度**：内置 cron 调度器，可向任意平台投递。支持日常报告、每日备份、每周审计等任务，无需人工值守，以自然语言运行。
    - **任务分流与并行**：可生成隔离的子代理以并行多工作流。支持通过 RPC 调用工具的 Python 脚本，实现多步骤流程零上下文损耗。
    - **随处运行，不局限于本地**：支持六种终端后端——本地、Docker、SSH、Singularity、Modal 和 Daytona。Daytona 和 Modal 提供无服务器持久化，空闲时环境休眠、需求时唤醒，会话间几乎零成本。可在 $5 VPS 或 GPU 集群上运行。
    - **科研级功能**：支持批量生成轨迹、轨迹压缩，用于训练下一代工具调用模型。

  upgradeDescription: |
    升级到 Hermes Agent v0.20.5（v2026.8.19）。
    上游发布说明：https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.19

    Olares 打包变更：
    - 运行时镜像：`beclab/harveyff-hermes-agent:v2026.8.19-uid1000`（基于 `nousresearch/hermes-agent:v2026.8.19` 的 UID 1000 叠加层；amd64 + arm64）。
    - Brew 基础镜像：`beclab/harveyff-openclaw-brew-base:2026.8.24-cli`（含 `certbot`，用于自定义域名 TLS 流程）。
    - Init 在 `/opt/data/.config/letsencrypt/cli.ini` 写入 certbot 默认配置（可写目录 + RSA 默认；非 root 可直接运行 certbot）。

    相对 v0.20.0（v2026.8.3）的上游亮点：
    - **Bot Mode**：内置 hermes-bots 队友协议、群组房间线程、可折叠会话摘要、blob-face 头像、PDF/文件拖放附件。
    - **免密钥 Web**：5 家供应商免费轮询与环形故障转移；新安装即可零密钥网页搜索；opencode-free 零认证提供商。
    - **CLI**：模糊 `/model` 选择器、Ctrl+P 命令面板、更丰富的 `/status`、`/worktree` 列表/清理、多问题澄清。
    - **网关与 MCP**：MCP 2.x SDK + 2026-07-28 无状态协议、持久化模型路由、Telegram DM 话题、CommandCode 提供商。
    - **运行时纪律**：来自 Composio 评测的停滞保护、cron 持久记忆与按任务推理力度、调度器自愈、SessionDB 争用修复。
    - **技能与安全**：技能安装时 NVIDIA SkillEvaluator Tier 1 许可与安全扫描。
    - **桌面**：毛玻璃半透明、SESSIONS|BOTS 分栏、Bot Mode 优先绘制、React Compiler。

    v0.20.x 窗口的完整整理说明将随 v0.21.0 发布。标签说明：https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.19

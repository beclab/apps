metadata:
  title: Hermes Agent
  description: "L'agente che cresce con te"
spec:
  fullDescription: |
    **L'agente IA che si auto-migliora, creato da [Nous Research](https://nousresearch.com).** È l'unico agente con un loop di apprendimento integrato: crea skill dall'esperienza, le migliora durante l'uso, si spinge a persistere la conoscenza, cerca nelle proprie conversazioni passate e costruisce un modello sempre più approfondito di chi sei tra le sessioni. Eseguilo su un VPS da $5, un cluster GPU o infrastruttura serverless che costa quasi nulla quando è idle. Non è legato al tuo laptop: parlagli da Telegram mentre lavora su una VM cloud.
    
    **Funzioni principali**
    - **Una vera interfaccia terminale**: TUI completa con editing multilinea, autocompletamento slash-command, cronologia conversazioni, interrupt-and-redirect e output tool in streaming.
    - **Vive dove vivi tu**: Telegram, Discord, Slack, WhatsApp, Signal e CLI — tutto da un unico processo gateway. Trascrizione di memo vocali, continuità conversazionale cross-platform.
    - **Un loop di apprendimento chiuso**: Memoria curata dall'agente con nudge periodici. Creazione autonoma di skill dopo compiti complessi. Le skill si auto-migliorano durante l'uso. Ricerca sessioni FTS5 con summarization LLM per il recall cross-session. Modellazione dialettica utente [Honcho](https://github.com/plastic-labs/honcho). Compatibile con lo standard aperto [agentskills.io](https://agentskills.io).
    - **Automazioni pianificate**: Scheduler cron integrato con consegna su qualsiasi piattaforma. Report giornalieri, backup notturni, audit settimanali — tutto in linguaggio naturale, senza supervisione.
    - **Delega e parallelizza**: Genera subagent isolati per workstream paralleli. Scrivi script Python che chiamano tool via RPC, comprimendo pipeline multi-step in turni a costo di contesto zero.
    - **Gira ovunque, non solo sul tuo laptop**: Sei backend terminal — local, Docker, SSH, Singularity, Modal e Daytona. Daytona e Modal offrono persistenza serverless: l'ambiente del tuo agente va in ibernazione quando idle e si risveglia on demand, costando quasi nulla tra le sessioni. Eseguilo su un VPS da $5 o un cluster GPU.
    - **Pronto per la ricerca**: Generazione batch di trajectory, compressione delle trajectory per addestrare la prossima generazione di modelli tool-calling.
  upgradeDescription: |
    Versione upstream: [Hermes Agent v0.21.0 (v2026.8.31)](https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.31)

    **Novità**
    - Bot Mode è ora integrato, con agenti denominati, avatar, stanze di gruppo, @menzioni e conversazioni persistenti tra bot tramite `hermes peer`.
    - I processi pianificati possono conservare memoria e continuità tra le esecuzioni, usare blocchi note persistenti e saltare i controlli quando nulla è cambiato.
    - I subagenti in esecuzione possono essere elencati, reindirizzati o arrestati, con convalida JSON Schema facoltativa e costi per attività.
    - La CLI aggiunge una palette Ctrl+P, ricerca fuzzy `/model`, dettagli `/status` più ricchi, metriche delle prestazioni in tempo reale, blocco delle sessioni e arresto di emergenza globale.
    - I nuovi provider includono Meta Model API, CommandCode, Tencent TokenPlan, Nebius Token Factory, Ramp Router e Actual Computer.

    **Correzioni**
    - Migliorato il recupero da provider bloccati, errori di output strutturato, comandi interrotti, contesa del database delle sessioni e ripetuti errori di compattazione.
    - Migliorata l’affidabilità del Gateway e dei canali, inclusi consegna dei messaggi finali, streaming Slack, trascrizione vocale tramite relay e riproduzione degli eventi alla riconnessione.
    - Le scritture su istruzioni protette dell’agente, skills e file di memoria richiedono ora l’approvazione; sono stati estesi anche l’oscuramento dei segreti e i controlli dei comandi distruttivi.

    **Modifiche alla configurazione e al comportamento**
    - I valori predefiniti della delega sono saliti a 250 iterazioni e 10 subagenti simultanei; verifica i limiti di risorse e provider per i flussi molto paralleli.
    - La nuova impostazione `model_overrides` consente di modificare finestra di contesto, prezzi o capacità di un modello.

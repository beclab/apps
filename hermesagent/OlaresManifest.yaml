olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  hermesagent: 1
  terminal: 1
metadata:
  name: hermesagent
  icon: https://app.cdn.olares.com/appstore/hermesagent/icon.png
  description: The agent that grows with you
  appid: hermesagent
  title: Hermes Agent
  version: '1.3.52'
  categories:
  - Productivity_v112
  - Developer Tools
  - agents
  tags:
  - framework
  - personal-assistant

entrances:
- name: terminal
  host: terminal
  port: 80
  title: Hermes CLI
  icon: https://app.cdn.olares.com/appstore/hermesagent/terminal.png
  openMethod: window
  authLevel: internal
- name: dashboard
  host: hermesdashboard
  port: 9119
  title: Hermes Dashboard
  icon: https://app.cdn.olares.com/appstore/hermesagent/icon.png
  openMethod: window
  authLevel: internal
- name: api
  host: hermesgateway
  port: 8642
  title: Hermes Gateway API
  icon: https://app.cdn.olares.com/appstore/hermesagent/icon.png
  invisible: true
  authLevel: internal
- name: webapp
  host: hermeswebapp
  port: 9120
  title: Hermes Webapp
  icon: https://app.cdn.olares.com/appstore/hermesagent/icon.png

  icon: https://app.cdn.olares.com/appstore/hermesagent/icon.png
  description: The agent that grows with you
  appid: hermesagent
  title: Hermes Agent
  version: '1.3.41'
  categories:
  - Productivity_v112
  - Developer Tools
  - agents
  tags:
  - framework
  - personal-assistant

entrances:
- name: terminal
  host: terminal
  port: 80
  title: Hermes CLI
  icon: https://app.cdn.olares.com/appstore/hermesagent/terminal.png
  openMethod: window
  authLevel: internal
- name: dashboard
  host: hermesdashboard
  port: 9119
  title: Dashboard
  icon: https://app.cdn.olares.com/appstore/hermesagent/icon.png
  openMethod: window
  authLevel: internal
- name: api

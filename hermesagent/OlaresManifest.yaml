  authLevel: internal
spec:
  versionName: '0.23.1'
  fullDescription: |
    **The self-improving AI agent built by [Nous Research](https://nousresearch.com).** It's the only agent with a built-in learning loop — it creates skills from experience, improves them during use, nudges itself to persist knowledge, searches its own past conversations, and builds a deepening model of who you are across sessions. Run it on a $5 VPS, a GPU cluster, or serverless infrastructure that costs nearly nothing when idle. It's not tied to your laptop — talk to it from Telegram while it works on a cloud VM.

    **Key Features**
    - **A real terminal interface**: Full TUI with multiline editing, slash-command autocomplete, conversation history, interrupt-and-redirect, and streaming tool output.
    - **Lives where you do**: Telegram, Discord, Slack, WhatsApp, Signal, and CLI — all from a single gateway process. Voice memo transcription, cross-platform conversation continuity.
    - **A closed learning loop**: Agent-curated memory with periodic nudges. Autonomous skill creation after complex tasks. Skills self-improve during use. FTS5 session search with LLM summarization for cross-session recall. [Honcho](https://github.com/plastic-labs/honcho) dialectic user modeling. Compatible with the [agentskills.io](https://agentskills.io) open standard.
    - **Scheduled automations**: Built-in cron scheduler with delivery to any platform. Daily reports, nightly backups, weekly audits — all in natural language, running unattended.
    - **Delegates and parallelizes**: Spawn isolated subagents for parallel workstreams. Write Python scripts that call tools via RPC, collapsing multi-step pipelines into zero-context-cost turns.
    - **Runs anywhere, not just your laptop**: Six terminal backends — local, Docker, SSH, Singularity, Modal, and Daytona. Daytona and Modal offer serverless persistence — your agent's environment hibernates when idle and wakes on demand, costing nearly nothing between sessions. Run it on a $5 VPS or a GPU cluster.
    - **Research-ready**: Batch trajectory generation, trajectory compression for training the next generation of tool-calling models.

  upgradeDescription: |
    Upgrade from the public-market v0.22.2 to v0.23.1, adding the Hermes Webapp, configurable subagent delegation, and improvements to conversations, scheduled jobs and plugins.

    - Open the Hermes Webapp with its own sign-in. For first-time credentials, run `cat /opt/data/webapp/olares-login.txt` in Hermes CLI. Existing sign-in settings are preserved.
    - Use the official `advanced-delegation` plugin to assign subagent tasks to named models or separate profiles. Installing a missing plugin for the first time requires access to GitHub.
    - Reset a conversation to the configured default model with `/model reset`, or return to an earlier message and edit or branch the conversation.
    - Protect manually curated skills with `hermes curator lock`, cancel running scheduled jobs, and configure how each job handles missed runs.
    - Update plugins in bulk or enable optional automatic updates. Fix live plugin-catalog loading above 2 MiB so newly added plugins and current versions can be found.

    Compatibility: custom skills using the removed legacy browser tools must use `browser_exec`. MCP clients that launch `hermes mcp serve` must switch to `hermes mcp-serve`.

    https://github.com/NousResearch/hermes-agent/releases/tag/v0.23.0
    https://github.com/NousResearch/hermes-agent/releases/tag/v0.23.1

  developer: Nous Research
  website: https://hermes-agent.nousresearch.com
  sourceCode: https://github.com/NousResearch/hermes-agent
  submitter: progress44 & Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  doc: https://hermes-agent.nousresearch.com/docs
  license:
  - text: MIT
    url: https://github.com/NousResearch/hermes-agent/blob/main/LICENSE
  requiredMemory: 2.5Gi
  limitedMemory: 22Gi
  requiredDisk: 5Gi
  limitedDisk: 20Gi
  requiredCpu: 1.5
  limitedCpu: 12
  supportArch:
  - amd64
  - arm64
permission:
  appData: true
  appCache: true
  userData:
  - Home
  externalData: true
options:
  allowMultipleInstall: true
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
- envName: ALLOW_HOME_DIR_ACCESS
  type: bool
  required: false
  applyOnChange: true
  editable: true
  default: "false"
  description: "Allow Hermes to access Home directory on Olares"
- envName: ALLOW_EXTERNAL_DIR_ACCESS
  type: bool
  required: false
  applyOnChange: true
  editable: true
  default: "false"
  description: "Allow Hermes to access External directory on Olares"
- envName: API_SERVER_ENABLED
  type: bool
  required: false
  applyOnChange: true
  editable: true
  default: "false"
  description: "Enable the OpenAI-compatible API server on port 8642 (for Hermes Workspace / Open WebUI integration). When true, API_SERVER_KEY must also be set."
- envName: HERMES_API_SERVER_KEY
  type: password
  required: false
  applyOnChange: true
  editable: true
  regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{16,}$'
  description: "Auth token for the OpenAI-compatible API server. Required when API_SERVER_ENABLED is true. Must be at least 16 characters and contain only letters, numbers, and common symbols. Pass the same value as HERMES_API_TOKEN on the client side."
- envName: API_SERVER_CORS_ORIGINS
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: ""
  description: "Comma-separated browser origins allowed to call the API server (e.g. https://openwebui.example.com). Empty disables CORS. Used when API_SERVER_ENABLED is true."
- envName: API_SERVER_MODEL_NAME
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: ""
  description: "Model name advertised on /v1/models (useful for Open WebUI). Empty uses Hermes default (profile name or hermes-agent)."
- envName: OPENAI_API_KEY
  valueFrom:
    envName: OLARES_USER_OPENAI_APIKEY
  required: false
  description: "OpenAI-compatible API key from Olares Settings → Integration (optional)."
- envName: ANTHROPIC_API_KEY
  valueFrom:
    envName: OLARES_USER_ANTHROPIC_APIKEY
  required: false
  description: "Anthropic API key from Olares Settings → Integration (optional)."
- envName: GATEWAY_ALLOW_ALL_USERS
  type: bool
  required: false
  applyOnChange: true
  editable: true
  default: "false"
  description: "Allow all messaging senders without per-platform allowlists. Security risk on public bots — prefer GATEWAY_ALLOWED_USERS / TELEGRAM_ALLOWED_USERS / DISCORD_ALLOWED_USERS."
- envName: GATEWAY_ALLOWED_USERS
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: ""
  description: "Comma-separated user IDs allowed across all messaging platforms."
- envName: TELEGRAM_ALLOWED_USERS
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: ""
  description: "Comma-separated Telegram user IDs allowed to talk to the bot (DMs/groups/forums)."
- envName: DISCORD_ALLOWED_USERS
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: ""
  description: "Comma-separated Discord user IDs allowed to talk to the bot."
- envName: HERMES_CRON_TIMEOUT
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: "600"
  description: "Cron agent inactivity timeout in seconds (default 600). Set 0 for unlimited while tools/stream are active."
- envName: HERMES_CRON_MAX_PARALLEL
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: "4"
  description: "Max cron jobs run in parallel per tick (default 4)."
- envName: HERMES_GATEWAY_BUSY_INPUT_MODE
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: "queue"
  options:
  - title: Queue
    value: queue
  - title: Steer
    value: steer
  - title: Interrupt
    value: interrupt
  description: "What to do when the user sends input while the agent is busy (queue / steer / interrupt). Overridable per chat with /busy."
- envName: HERMES_GATEWAY_BUSY_ACK_ENABLED
  type: bool
  required: false
  applyOnChange: true
  editable: true
  default: "true"
  description: "Send a short acknowledgment when input arrives while the agent is busy (default true)."

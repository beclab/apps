metadata:
  title: ACE-Step 1.5
  description: ほとんどの商用代替を上回る、最も強力なローカル音楽生成モデル
spec:
  fullDescription: |
    ACE-Step v1.5 を紹介します。コンシューマー向けハードウェアで商用グレードの生成を実現する、高効率なオープンソース音楽基盤モデルです。一般的な評価指標において、ACE-Step v1.5 はほとんどの商用音楽モデルを超える品質を達成しつつ、極めて高速です — A100 では1曲あたり2秒未満、RTX 3090 では10秒未満。モデルは 4GB 未満の VRAM でローカル実行でき、軽量なパーソナライズにも対応：数曲から LoRA を学習して自分のスタイルを捉えられます。

    **機能**
    パフォーマンス
    - 超高速生成：A100 で1曲あたり2秒未満、RTX 3090 で10秒未満（think モードと拡散ステップに応じて A100 で 0.5s〜10s）
    - 柔軟な長さ：10秒〜10分（600秒）の音声生成に対応
    - バッチ生成：最大8曲を同時生成

    生成品質
    - 商用グレード出力：ほとんどの商用音楽モデルを超える品質（Suno v4.5 と Suno v5 の間）
    - 豊富なスタイル対応：1000以上の楽器・スタイルと細粒度の音色記述
    - 多言語歌詞：50以上の言語に対応し、構造とスタイル制御用の歌詞プロンプトあり

    多様性と制御
    - 参照音声入力：参照音声で生成スタイルを誘導
    - カバー生成：既存音声からカバーを作成
    - リペイント＆編集：局所的な音声編集と再生成
    - トラック分離：音声を個別ステムに分離
    - マルチトラック生成：Suno Studio の「Add Layer」のようなレイヤー追加
    - Vocal2BGM：ボーカルトラックの伴奏を自動生成
    - メタデータ制御：長さ、BPM、キー/スケール、拍子を制御
    - シンプルモード：簡単な説明からフル曲を生成
    - クエリ書き換え：タグと歌詞の LM 自動展開
    - 音声理解：音声から BPM、キー/スケール、拍子、キャプションを抽出
    - LRC 生成：生成音楽の歌詞タイムスタンプを自動生成
    - LoRA トレーニング：Gradio でワンクリック注釈＆学習。8曲、3090 で1時間（12GB VRAM）
    - 品質スコアリング：生成音声の自動品質評価

    **ACE-Step 1.5 XL (4B DiT)**
    - acestep-v15-xl-base、acestep-v15-xl-sft、acestep-v15-xl-turbo — 4B パラメータ DiT デコーダによる高音質
    - ≥12GB VRAM（オフロード時）または推奨 ≥20GB；すべての LM モデルは互換のまま

  upgradeDescription: |
    **v0.1.8 の新機能**（[リリースノート](https://github.com/ace-step/ACE-Step-1.5/releases/tag/v0.1.8)）
    - コンテナイメージを beclab/ace-step-ace-step-1.5:v0.1.8 にアップグレード
    - デフォルトプリセット（最高品質）：acestep-v15-xl-sft + acestep-5Hz-lm-4B、CPU オフロード有効
    - メインリポジトリ + xl-sft + 4B LM を事前ダウンロード（初回約 36 GB；メインリポジトリが既にある場合はスキップ）
    - Retake、Flow-Edit、Repaint の改善と複数のバグ修正

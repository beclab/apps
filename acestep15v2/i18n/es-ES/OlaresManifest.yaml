metadata:
  title: ACE-Step 1.5
  description: El modelo local de generación musical más potente, que supera a la mayoría de las alternativas comerciales
spec:
  fullDescription: |
    Presentamos ACE-Step v1.5, un modelo foundation musical de código abierto altamente eficiente que lleva la generación de calidad comercial al hardware de consumo. En métricas de evaluación habituales, ACE-Step v1.5 alcanza una calidad superior a la mayoría de los modelos musicales comerciales y sigue siendo extremadamente rápido: menos de 2 segundos por canción completa en una A100 y menos de 10 segundos en una RTX 3090. El modelo se ejecuta en local con menos de 4 GB de VRAM y admite personalización ligera: los usuarios pueden entrenar un LoRA a partir de solo unas pocas canciones para capturar su propio estilo.

    **Funciones**
    Rendimiento
    - Generación ultrarrápida: Menos de 2 s por canción completa en A100, menos de 10 s en RTX 3090 (de 0,5 s a 10 s en A100 según el modo think y los pasos de difusión)
    - Duración flexible: Admite generación de audio de 10 segundos a 10 minutos (600 s)
    - Generación por lotes: Genera hasta 8 canciones a la vez

    Calidad de generación
    - Salida de calidad comercial: Calidad superior a la mayoría de los modelos musicales comerciales (entre Suno v4.5 y Suno v5)
    - Amplio soporte de estilos: Más de 1000 instrumentos y estilos con descripción fina del timbre
    - Letras multilingües: Admite más de 50 idiomas con prompt de letras para control de estructura y estilo

    Versatilidad y control
    - Entrada de audio de referencia: Usa audio de referencia para guiar el estilo de generación
    - Generación de covers: Crea covers a partir de audio existente
    - Repintado y edición: Edición y regeneración selectiva de audio local
    - Separación de pistas: Separa el audio en stems individuales
    - Generación multipista: Añade capas como la función «Add Layer» de Suno Studio
    - Vocal2BGM: Genera automáticamente acompañamiento para pistas vocales
    - Control de metadatos: Controla duración, BPM, tonalidad/escala y compás
    - Modo simple: Genera canciones completas a partir de descripciones sencillas
    - Reescritura de consultas: Expansión automática con LM de etiquetas y letras
    - Comprensión de audio: Extrae BPM, tonalidad/escala, compás y descripción del audio
    - Generación LRC: Genera automáticamente marcas de tiempo de letras para la música generada
    - Entrenamiento LoRA: Anotación y entrenamiento en un clic en Gradio. 8 canciones, 1 hora en 3090 (12 GB VRAM)
    - Puntuación de calidad: Evaluación automática de la calidad del audio generado

    **ACE-Step 1.5 XL (4B DiT)**
    - acestep-v15-xl-base, acestep-v15-xl-sft, acestep-v15-xl-turbo — mayor calidad de audio con decodificador DiT de 4B parámetros
    - Requiere ≥12 GB VRAM (con offload) o se recomienda ≥20 GB; todos los modelos LM siguen siendo compatibles

  upgradeDescription: |
    **Novedades en v0.1.8** ([notas de la versión](https://github.com/ace-step/ACE-Step-1.5/releases/tag/v0.1.8))
    - Imagen de contenedor actualizada a beclab/ace-step-ace-step-1.5:v0.1.8
    - Preset predeterminado (mejor calidad): acestep-v15-xl-sft + acestep-5Hz-lm-4B, CPU offload activado
    - Precarga del repositorio principal + xl-sft + 4B LM (~36 GB en la primera instalación; se omite el repo principal si ya existe)
    - Mejoras en Retake, Flow-Edit y Repaint, y varias correcciones de errores

metadata:
  title: Breeze TTS 2
  description: 内蔵音声、クローン音声、説明ベースの音声に対応する音声合成モデル

spec:
  fullDescription: |
    Breeze TTS 2は、中国語または英語のテキストを音声に変換します。内蔵音声を使う、参照録音から音声をコピーする、または聞こえ方を説明して新しい音声を作ることができます。

    **主な機能**

    - 中国語と英語の音声を生成します。
    - このアプリで提供される内蔵音声から選びます。
    - 明瞭な参照音声と対応する文字起こしから音声をクローンします。
    - 参照音声なしで、自然言語の説明から音声を作成します。
    - クローンまたは作成した音声を同じOlares環境に保存して再利用できます。

    少なくとも`12Gi`のGPUメモリを備えた対応するNVIDIA GPUが必要です。

    **利用上の注意**

    Breeze TTS 2のモデル重み、派生モデル、セルフホストによる出力は、研究および非商用利用のみにライセンスされています。参照録音、クローン音声、生成音声について、必要な権利と同意が必要です。

    ライセンスと責任ある利用の要件は、[Breeze TTS 2モデルカード](https://huggingface.co/BreezeBlue/Breeze-TTS-2)を参照してください。

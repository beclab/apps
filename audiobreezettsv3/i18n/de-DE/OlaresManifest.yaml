metadata:
  title: Breeze TTS 2
  description: Ein Text-zu-Sprache-Modell mit eingebauten, geklonten und per Beschreibung erstellten Stimmen

spec:
  fullDescription: |
    Breeze TTS 2 wandelt geschriebenen chinesischen oder englischen Text in Sprache um. Es kann eine eingebaute Stimme verwendet, eine Stimme aus einer Referenzaufnahme kopiert oder eine neue Stimme durch eine Beschreibung des Klangs erstellt werden.

    **Hauptfunktionen**

    - Sprache auf Chinesisch und Englisch erzeugen.
    - Aus den in dieser App verfügbaren eingebauten Stimmen wählen.
    - Eine Stimme aus einer sauberen Referenzaufnahme und dem zugehörigen Transkript klonen.
    - Eine Stimme aus einer natürlichsprachlichen Beschreibung ohne Referenzaufnahme erstellen.
    - Geklonte oder erstellte Stimmen auf derselben Olares-Installation speichern und erneut verwenden.

    Eine kompatible NVIDIA-GPU mit mindestens `12Gi` GPU-Speicher ist erforderlich.

    **Nutzungshinweise**

    Die Modellgewichte von Breeze TTS 2, abgeleitete Modelle und selbst gehostete Ausgaben sind nur für Forschung und nicht kommerzielle Nutzung lizenziert. Für Referenzaufnahmen, geklonte Stimmen und erzeugtes Audio müssen die erforderlichen Rechte und Einwilligungen vorliegen.

    Details zu Lizenz und verantwortungsvoller Nutzung stehen auf der [Breeze TTS 2 Modellkarte](https://huggingface.co/BreezeBlue/Breeze-TTS-2).

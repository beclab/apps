metadata:
  title: Breeze TTS 2
  description: Un modèle de synthèse vocale avec voix intégrées, clonées et décrites

spec:
  fullDescription: |
    Breeze TTS 2 transforme du texte chinois ou anglais en parole. On peut utiliser une voix intégrée, copier une voix à partir d'un enregistrement de référence, ou créer une voix en décrivant le son souhaité.

    **Fonctionnalités principales**

    - Générer de la parole en chinois et en anglais.
    - Choisir parmi les voix intégrées fournies par cette application.
    - Cloner une voix à partir d'un enregistrement de référence net et de sa transcription.
    - Créer une voix à partir d'une description en langage naturel, sans enregistrement de référence.
    - Enregistrer et réutiliser les voix clonées ou créées sur la même installation Olares.

    Un GPU NVIDIA compatible avec au moins `12Gi` de mémoire GPU est requis.

    **Notes d'utilisation**

    Les poids du modèle Breeze TTS 2, les modèles dérivés et les sorties d'un hébergement autonome sont concédés sous licence uniquement pour la recherche et un usage non commercial. Les utilisateurs doivent disposer des droits et du consentement nécessaires pour les enregistrements de référence, les voix clonées et l'audio généré.

    Voir la [fiche du modèle Breeze TTS 2](https://huggingface.co/BreezeBlue/Breeze-TTS-2) pour les détails de licence et les exigences d'usage responsable.

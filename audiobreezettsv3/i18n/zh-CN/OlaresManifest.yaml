metadata:
  title: Breeze TTS 2
  description: 支持内置音色、声音克隆和文字设计音色的文本转语音模型

spec:
  fullDescription: |
    Breeze TTS 2 可将中文或英文文本转换为语音。可以使用内置音色、从参考录音中克隆声音，或通过文字描述创建新音色。

    **主要功能**

    - 生成中文和英文语音。
    - 使用应用提供的内置音色。
    - 使用清晰的参考录音及其对应文字稿克隆声音。
    - 无需参考录音，通过自然语言描述创建音色。
    - 在同一台 Olares 上保存并重复使用克隆或创建的音色。

    需要配备至少 `12Gi` 显存的兼容 NVIDIA GPU。

    **使用须知**

    Breeze TTS 2 模型权重、衍生模型以及通过自行托管模型生成的内容仅限研究和非商业用途。用户必须获得使用参考录音、克隆声音和生成音频所需的权利与许可。

    有关许可详情和负责任使用要求，请参阅 [Breeze TTS 2 模型卡](https://huggingface.co/BreezeBlue/Breeze-TTS-2)。

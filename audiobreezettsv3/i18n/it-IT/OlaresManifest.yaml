metadata:
  title: Breeze TTS 2
  description: Un modello di sintesi vocale con voci integrate, clonate e basate su una descrizione

spec:
  fullDescription: |
    Breeze TTS 2 trasforma testo cinese o inglese in parlato. Si può usare una voce integrata, copiare una voce da una registrazione di riferimento oppure crearne una nuova descrivendo come deve suonare.

    **Funzionalità principali**

    - Generare parlato in cinese e in inglese.
    - Scegliere tra le voci integrate disponibili in questa app.
    - Clonare una voce da un audio di riferimento pulito e dalla relativa trascrizione.
    - Creare una voce da una descrizione in linguaggio naturale, senza audio di riferimento.
    - Salvare e riutilizzare le voci clonate o create sulla stessa installazione Olares.

    È necessaria una GPU NVIDIA compatibile con almeno `12Gi` di memoria GPU.

    **Note sull'uso**

    I pesi del modello Breeze TTS 2, i modelli derivati e gli output di un'installazione self-hosted sono concessi in licenza solo per ricerca e uso non commerciale. Per le registrazioni di riferimento, le voci clonate e l'audio generato occorrono i diritti e il consenso necessari.

    Vedere la [scheda del modello Breeze TTS 2](https://huggingface.co/BreezeBlue/Breeze-TTS-2) per i dettagli di licenza e i requisiti di uso responsabile.

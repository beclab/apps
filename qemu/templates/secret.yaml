{{- $existing := lookup "v1" "Secret" .Release.Namespace "qemu-login" -}}
apiVersion: v1
kind: Secret
metadata:
  name: qemu-login
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if and $existing $existing.data }}{{ index $existing.data "password" | quote }}{{ else }}{{ .Values.olaresEnv.INITIAL_PASSWORD | default "" | b64enc | quote }}{{ end }}

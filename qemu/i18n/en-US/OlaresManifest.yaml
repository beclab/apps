metadata:
  title: QEMU Server
  description: "Linux server virtual machine with SSH, Overlay access and a browser console"
spec:
  fullDescription: |
    Run a Linux server virtual machine on Olares with QEMU and KVM acceleration.
    Choose Ubuntu, Debian, Rocky Linux or Fedora during installation, then connect
    with SSH or use the browser console.

    Features
    - Choose Ubuntu 24.04/26.04, Debian 12/13, Rocky Linux 9/10 or Fedora 43/44.
    - Set 1-8 virtual CPU cores, 1-32 GiB of RAM and a 16-512 GiB virtual disk.
    - Set your own initial SSH password during installation.
    - Track image download and initialization progress on the application page.
    - Keep the system disk and ARM UEFI variables in persistent Olares App Data.
    - Create independent installations with separate disks and Overlay addresses.

    Getting started
    1. Select a distribution, CPU cores, memory, disk size and initial password.
    2. Open the application and wait for the system image download and initialization.
    3. For access on the same network, enable this app in Settings > Network >
       Overlay gateway and connect to its assigned address with SSH on port 22.
    4. Away from Olares, connect with LarePass VPN and use the Olares device address
       and the external SSH port shown in Settings > Applications > QEMU Server > Ports.

    Ubuntu uses the username ubuntu; Debian uses debian; Rocky Linux uses rocky;
    Fedora uses fedora. The application page also provides a browser console.
    Its language follows the browser preference: Chinese or English.

    Requirements and storage
    An amd64 or ARM64 host with usable KVM virtualization and /dev/kvm is required.
    Guests match the host architecture; x86 system disks cannot be moved to ARM.
    This experimental app uses a privileged VM container with access to /dev/kvm
    and its own application storage. Allow an additional 1 GiB of RAM for QEMU.
    System images download from the Olares CDN and are checked against pinned hashes.

    CPU and memory settings can be changed after installation. Changes restart the
    VM and disconnect active sessions. Disks can be expanded, but cannot be shrunk.
    Back up important data before resizing. Changing the installed distribution
    requires a separate installation. Uninstalling with data deletion removes the VM disk.
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "Choose the Linux distribution for a new virtual machine. Existing system disks are preserved. To use a different distribution, back up your data and create a new installation with a new disk."
  - envName: CPU_CORES
    description: "Virtual CPU cores, from 1 to 8. Changes restart the VM and interrupt connections. These are virtual cores, not dedicated physical cores."
  - envName: MEMORY_GB
    description: "VM memory in GiB, from 1 to 32. An additional 1 GiB is reserved for QEMU. Changes restart the VM and interrupt connections."
  - envName: DISK_SIZE_GB
    description: "Virtual disk capacity in GiB, from 16 to 512. Increase to expand the disk and supported guest filesystems on restart. Shrinking is not supported; smaller values retain the existing disk and display a warning. Changes interrupt connections. Back up important data before expansion."
  - envName: SYSTEM_CDN_SERVICE
    description: "Optional CDN base URL for system image downloads. Leave blank to use the Olares system CDN setting or the Olares CDN."
  - envName: INITIAL_PASSWORD
    description: "Set the initial SSH password (8–128 characters) for a new VM. Existing disks keep their current password. After installation, use passwd inside the VM to change it."

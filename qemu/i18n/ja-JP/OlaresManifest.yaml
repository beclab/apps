metadata:
  title: QEMU Server
  description: "SSH、Overlay 接続、ブラウザーコンソールに対応した Olares 用 Linux サーバー仮想マシン"
spec:
  fullDescription: |
    QEMU と KVM アクセラレーションを使用して、Olares 上で Linux サーバー仮想マシンを実行します。Ubuntu 24.04/26.04、Debian 12/13、Rocky Linux 9/10、Fedora 43/44 から選択できます。

    インストール時に、仮想 CPU コア数 1–8、メモリ 1–32 GiB、仮想ディスク 16–512 GiB、初期 SSH パスワードを設定します。入力項目に既定値はありません。ディストリビューションを変更するには、別のインストールが必要です。

    アプリのページにはダウンロードと初期化の進行状況、ブラウザーコンソールが表示されます。表示言語はブラウザーの設定に従い、中国語または英語になります。システムイメージは Olares CDN から取得し、中断後の再開と固定ハッシュによる検証に対応します。

    Olares と同じネットワークでは、設定 > ネットワーク > Overlay ゲートウェイでアプリを有効にし、割り当てられたアドレスと SSH ポート 22 を使用します。別のネットワークでは、先に LarePass VPN に接続し、Olares デバイスのアドレスと、設定 > アプリ > QEMU Server > ポートに表示される外部 SSH ポートを使用します。

    ユーザー名は Ubuntu が ubuntu、Debian が debian、Rocky Linux が rocky、Fedora が fedora です。インストール後は passwd でパスワードを変更できます。複数の独立したインストールは、それぞれ専用のディスクと Overlay アドレスを持ちます。

    システムディスクと ARM UEFI 変数は Olares App Data に保存されます。インストール後に CPU とメモリを変更し、ディスクを拡張できます。変更すると仮想マシンが再起動し、接続が切断されます。ディスクの縮小には対応しません。拡張前に重要なデータをバックアップしてください。データ削除を指定してアンインストールすると、仮想マシンのディスクも削除されます。

    利用可能な KVM と /dev/kvm を備えた amd64 または ARM64 ホストが必要です。仮想マシンのアーキテクチャはホストと一致し、x86 ディスクは ARM では使用できません。この実験的アプリの仮想マシンコンテナーは、UID/GID 1000 の特権モードで動作し、/dev/kvm と自身のアプリストレージにアクセスします。仮想マシン用メモリに加えて、QEMU 用に 1 GiB を確保してください。
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "新しい仮想マシンの Linux ディストリビューション。既存のディスクは保持されます。変更する場合はデータをバックアップし、新しいディスクで別のインストールを作成してください。"
  - envName: CPU_CORES
    description: "仮想 CPU コア数は 1–8。変更すると仮想マシンが再起動し、接続が切断されます。専用の物理コアではなく仮想コアです。"
  - envName: MEMORY_GB
    description: "仮想マシンのメモリは 1–32 GiB。QEMU 用に別途 1 GiB を確保します。変更すると仮想マシンが再起動し、接続が切断されます。"
  - envName: DISK_SIZE_GB
    description: "仮想ディスクは 16–512 GiB。値を増やすと再起動時にディスクと対応するファイルシステムが拡張されます。縮小には対応しません。小さい値では既存のディスクを保持し、警告を表示します。変更すると接続が切断されます。拡張前にバックアップしてください。"
  - envName: SYSTEM_CDN_SERVICE
    description: "システムイメージ取得用の任意の CDN ベース URL。空欄の場合、Olares システムの CDN 設定または Olares CDN を使用します。"
  - envName: INITIAL_PASSWORD
    description: "新しい仮想マシンの初期 SSH パスワード（8–128 文字）。既存のディスクは現在のパスワードを保持します。インストール後は仮想マシン内で passwd を使用して変更してください。"

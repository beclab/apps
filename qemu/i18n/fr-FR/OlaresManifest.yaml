metadata:
  title: QEMU Server
  description: "Machine virtuelle Linux sur Olares avec SSH, accès Overlay et console web"
spec:
  fullDescription: |
    Exécutez une machine virtuelle Linux sur Olares avec QEMU et l’accélération KVM. Choisissez Ubuntu 24.04/26.04, Debian 12/13, Rocky Linux 9/10 ou Fedora 43/44.

    À l’installation, définissez 1–8 cœurs virtuels, 1–32 GiB de RAM, un disque virtuel de 16–512 GiB et un mot de passe SSH initial. Les champs n’ont aucune valeur par défaut. Changer de distribution nécessite une installation distincte.

    La page affiche la progression du téléchargement et de l’initialisation, avec une console web. La langue suit celle du navigateur : chinois ou anglais. Les images proviennent du CDN Olares, reprennent après une interruption et sont vérifiées avec des empreintes fixes.

    Sur le même réseau, activez l’application dans Paramètres > Réseau > Passerelle Overlay et utilisez l’adresse attribuée avec le port SSH 22. À distance, connectez-vous d’abord avec LarePass VPN, puis utilisez l’adresse de l’appareil Olares et le port SSH externe indiqué dans Paramètres > Applications > QEMU Server > Ports.

    Noms d’utilisateur : ubuntu pour Ubuntu, debian pour Debian, rocky pour Rocky Linux et fedora pour Fedora. Après l’installation, modifiez le mot de passe avec passwd. Chaque installation indépendante dispose de son propre disque et de sa propre adresse Overlay.

    Le disque système et les variables UEFI ARM sont conservés dans Olares App Data. Vous pouvez modifier le CPU et la RAM, et agrandir le disque. Ces modifications redémarrent la VM et coupent les connexions. La réduction du disque n’est pas prise en charge. Sauvegardez les données importantes avant un agrandissement. Désinstaller avec suppression des données efface le disque de la VM.

    Un hôte amd64 ou ARM64 avec KVM utilisable et /dev/kvm est requis. L’architecture de la VM correspond à celle de l’hôte ; un disque x86 ne fonctionne pas sur ARM. Cette application expérimentale utilise un conteneur VM privilégié, exécuté avec UID/GID 1000, qui accède à /dev/kvm et à son stockage applicatif. Prévoyez 1 GiB supplémentaire pour QEMU.
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "Distribution Linux d’une nouvelle VM. Les disques système existants sont conservés. Pour changer de distribution, sauvegardez vos données et créez une installation distincte avec un nouveau disque."
  - envName: CPU_CORES
    description: "1–8 cœurs CPU virtuels. Une modification redémarre la VM et coupe les connexions. Il ne s’agit pas de cœurs physiques dédiés."
  - envName: MEMORY_GB
    description: "Mémoire de la VM : 1–32 GiB. Un supplément de 1 GiB est réservé à QEMU. Une modification redémarre la VM et coupe les connexions."
  - envName: DISK_SIZE_GB
    description: "Disque virtuel : 16–512 GiB. Une augmentation agrandit le disque et les systèmes de fichiers pris en charge au redémarrage. La réduction n’est pas prise en charge ; une valeur inférieure conserve le disque existant et affiche un avertissement. Les modifications coupent les connexions. Sauvegardez les données importantes avant un agrandissement."
  - envName: SYSTEM_CDN_SERVICE
    description: "URL de base CDN facultative pour les images système. Laissez vide pour utiliser le réglage CDN du système Olares ou le CDN Olares."
  - envName: INITIAL_PASSWORD
    description: "Mot de passe SSH initial d’une nouvelle VM : 8–128 caractères. Les disques existants conservent leur mot de passe. Après l’installation, modifiez-le dans la VM avec passwd."

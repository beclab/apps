metadata:
  title: QEMU Server
  description: "Linux-Server-VM mit SSH, Overlay-Zugriff und Browserkonsole auf Olares"
spec:
  fullDescription: |
    Führen Sie eine Linux-Server-VM mit QEMU und KVM-Beschleunigung auf Olares aus. Wählen Sie Ubuntu 24.04/26.04, Debian 12/13, Rocky Linux 9/10 oder Fedora 43/44.

    Legen Sie bei der Installation 1–8 virtuelle CPU-Kerne, 1–32 GiB RAM, eine virtuelle Festplatte mit 16–512 GiB und ein anfängliches SSH-Passwort fest. Die Eingaben haben keine Standardwerte. Ein Wechsel der installierten Distribution erfordert eine separate Installation.

    Die App zeigt Download- und Initialisierungsfortschritt sowie eine Browserkonsole. Die Oberfläche folgt der Browsersprache: Chinesisch oder Englisch. Systemabbilder werden vom Olares CDN geladen, nach Unterbrechungen fortgesetzt und anhand festgelegter Hashwerte geprüft.

    Im selben Netzwerk aktivieren Sie die App unter Einstellungen > Netzwerk > Overlay-Gateway und verwenden die zugewiesene Adresse mit SSH-Port 22. Außerhalb dieses Netzwerks verbinden Sie sich zuerst über LarePass VPN. Verwenden Sie dann die Olares-Geräteadresse und den externen SSH-Port unter Einstellungen > Anwendungen > QEMU Server > Ports.

    Benutzernamen: ubuntu für Ubuntu, debian für Debian, rocky für Rocky Linux und fedora für Fedora. Ändern Sie das Passwort nach der Installation mit passwd. Mehrere unabhängige Installationen besitzen jeweils eine eigene Festplatte und Overlay-Adresse.

    Systemfestplatte und ARM-UEFI-Variablen bleiben in Olares App Data erhalten. CPU und RAM können später geändert, Festplatten vergrößert werden. Änderungen starten die VM neu und trennen Verbindungen. Verkleinern wird nicht unterstützt. Sichern Sie wichtige Daten vor einer Vergrößerung. Eine Deinstallation mit Datenlöschung entfernt die VM-Festplatte.

    Erforderlich ist ein amd64- oder ARM64-Host mit nutzbarem KVM und /dev/kvm. Gastsystem und Host haben dieselbe Architektur; x86-Festplatten können nicht auf ARM verwendet werden. Diese experimentelle App führt den VM-Container privilegiert mit UID/GID 1000 und Zugriff auf /dev/kvm sowie den eigenen App-Speicher aus. Planen Sie zusätzlich zum VM-RAM 1 GiB für QEMU ein.
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "Linux-Distribution für eine neue VM. Vorhandene Systemfestplatten bleiben erhalten. Sichern Sie zum Wechsel der Distribution Ihre Daten und erstellen Sie eine separate Installation mit neuer Festplatte."
  - envName: CPU_CORES
    description: "1–8 virtuelle CPU-Kerne. Änderungen starten die VM neu und trennen Verbindungen. Es handelt sich um virtuelle, nicht um dedizierte physische Kerne."
  - envName: MEMORY_GB
    description: "VM-Arbeitsspeicher: 1–32 GiB. Zusätzlich wird 1 GiB für QEMU reserviert. Änderungen starten die VM neu und trennen Verbindungen."
  - envName: DISK_SIZE_GB
    description: "Virtuelle Festplatte: 16–512 GiB. Eine Erhöhung erweitert beim Neustart die Festplatte und unterstützte Dateisysteme. Verkleinern wird nicht unterstützt; kleinere Werte behalten die bestehende Festplatte und zeigen einen Hinweis. Änderungen trennen Verbindungen. Sichern Sie wichtige Daten vor der Erweiterung."
  - envName: SYSTEM_CDN_SERVICE
    description: "Optionale CDN-Basis-URL für Systemabbilder. Leer lassen, um die Olares-Systemeinstellung oder das Olares CDN zu verwenden."
  - envName: INITIAL_PASSWORD
    description: "Anfängliches SSH-Passwort für eine neue VM: 8–128 Zeichen. Vorhandene Festplatten behalten ihr Passwort. Ändern Sie es nach der Installation in der VM mit passwd."

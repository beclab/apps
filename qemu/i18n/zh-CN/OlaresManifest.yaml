metadata:
  title: QEMU Server
  description: "在 Olares 上运行 Linux 服务器虚拟机，支持 SSH、Overlay 网络和浏览器控制台"
spec:
  fullDescription: |
    通过 QEMU 和 KVM 加速，在 Olares 上运行 Linux 服务器虚拟机。安装时可选择 Ubuntu 24.04/26.04、Debian 12/13、Rocky Linux 9/10 或 Fedora 43/44。

    安装时设置 1–8 个虚拟 CPU 核心、1–32 GiB 内存、16–512 GiB 虚拟磁盘和初始 SSH 密码。安装选项没有默认值。已安装的发行版无法原地更换，如需更换，请创建独立安装。

    应用页面显示镜像下载和初始化进度，并提供浏览器控制台。页面根据浏览器首选语言显示中文或英文。系统镜像从 Olares CDN 下载，支持断点续传并校验固定的哈希值。

    与 Olares 在同一网络时，在设置 > 网络 > Overlay 网关中启用本应用，使用分配的地址和 SSH 默认端口 22 连接。不在同一网络时，先连接 LarePass VPN，再使用 Olares 设备地址和设置 > 应用 > QEMU Server > 端口中显示的 SSH 对外端口。

    Ubuntu 用户名为 ubuntu，Debian 为 debian，Rocky Linux 为 rocky，Fedora 为 fedora。安装后使用 passwd 修改虚拟机密码。可创建多个独立实例，每个实例使用独立磁盘和 Overlay 地址。

    系统盘和 ARM UEFI 变量保存在 Olares App Data 中。安装后可修改 CPU、内存并扩容磁盘。修改会重启虚拟机并断开连接；磁盘不支持缩小。扩容前请备份重要数据。卸载时选择删除数据会删除虚拟机磁盘。

    需要支持 KVM 且可访问 /dev/kvm 的 amd64 或 ARM64 主机。虚拟机架构与主机一致，x86 系统盘不能用于 ARM。该实验性应用的虚拟机容器以 UID/GID 1000 在特权模式下运行，访问 /dev/kvm 和自身应用存储。除分配给虚拟机的内存外，还需为 QEMU 预留 1 GiB 内存。
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "选择新虚拟机的 Linux 发行版。现有系统盘会保留。如需更换发行版，请先备份数据，再使用新磁盘创建独立安装。"
  - envName: CPU_CORES
    description: "虚拟 CPU 核心数，范围为 1–8。修改会重启虚拟机并断开连接。这些核心为虚拟核心，不是独占的物理核心。"
  - envName: MEMORY_GB
    description: "虚拟机内存，单位为 GiB，范围为 1–32。另为 QEMU 预留 1 GiB 内存。修改会重启虚拟机并断开连接。"
  - envName: DISK_SIZE_GB
    description: "虚拟磁盘容量，单位为 GiB，范围为 16–512。调大后，重启会扩展磁盘及受支持的文件系统。不支持缩小；调小会保留现有磁盘并显示提示。修改会中断连接。扩容前请备份重要数据。"
  - envName: SYSTEM_CDN_SERVICE
    description: "系统镜像下载的可选 CDN 基础地址。留空时使用 Olares 系统的 CDN 设置或 Olares CDN。"
  - envName: INITIAL_PASSWORD
    description: "设置新虚拟机的初始 SSH 密码，长度为 8–128 个字符。现有磁盘保留当前密码。安装后请在虚拟机内使用 passwd 修改密码。"

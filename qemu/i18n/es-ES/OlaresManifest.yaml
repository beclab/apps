metadata:
  title: QEMU Server
  description: "Máquina virtual Linux en Olares con SSH, acceso Overlay y consola web"
spec:
  fullDescription: |
    Ejecute una máquina virtual Linux en Olares con QEMU y aceleración KVM. Elija Ubuntu 24.04/26.04, Debian 12/13, Rocky Linux 9/10 o Fedora 43/44.

    Durante la instalación, configure 1–8 núcleos virtuales, 1–32 GiB de RAM, un disco virtual de 16–512 GiB y una contraseña SSH inicial. Los campos no tienen valores predeterminados. Cambiar de distribución requiere una instalación independiente.

    La página muestra el progreso de descarga e inicialización y ofrece una consola web. El idioma sigue la preferencia del navegador: chino o inglés. Las imágenes se descargan del CDN de Olares, admiten reanudación y se verifican con hashes fijados.

    En la misma red, active la aplicación en Ajustes > Red > Puerta de enlace Overlay y use la dirección asignada con el puerto SSH 22. Fuera de esa red, conéctese primero con LarePass VPN y use la dirección del dispositivo Olares y el puerto SSH externo de Ajustes > Aplicaciones > QEMU Server > Puertos.

    Usuarios: ubuntu para Ubuntu, debian para Debian, rocky para Rocky Linux y fedora para Fedora. Cambie la contraseña con passwd después de la instalación. Cada instalación independiente tiene su propio disco y dirección Overlay.

    El disco del sistema y las variables UEFI ARM se conservan en Olares App Data. Después de instalar, puede modificar CPU y RAM y ampliar el disco. Los cambios reinician la VM y cortan las conexiones. No se admite reducir el disco. Haga una copia de seguridad antes de ampliarlo. Desinstalar con eliminación de datos borra el disco de la VM.

    Se requiere un host amd64 o ARM64 con KVM utilizable y /dev/kvm. La VM comparte la arquitectura del host; los discos x86 no se pueden usar en ARM. Esta aplicación experimental ejecuta el contenedor de la VM en modo privilegiado con UID/GID 1000 y acceso a /dev/kvm y a su propio almacenamiento. Reserve 1 GiB adicional para QEMU.
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "Distribución Linux de una VM nueva. Se conservan los discos existentes. Para cambiar de distribución, haga una copia de seguridad y cree una instalación independiente con otro disco."
  - envName: CPU_CORES
    description: "1–8 núcleos CPU virtuales. Los cambios reinician la VM y cortan las conexiones. Son núcleos virtuales, no núcleos físicos dedicados."
  - envName: MEMORY_GB
    description: "Memoria de la VM: 1–32 GiB. Se reserva 1 GiB adicional para QEMU. Los cambios reinician la VM y cortan las conexiones."
  - envName: DISK_SIZE_GB
    description: "Disco virtual: 16–512 GiB. Al aumentar el valor, el reinicio amplía el disco y los sistemas de archivos compatibles. No se admite reducirlo; un valor menor conserva el disco y muestra un aviso. Los cambios interrumpen las conexiones. Haga una copia de seguridad antes de ampliarlo."
  - envName: SYSTEM_CDN_SERVICE
    description: "URL base de CDN opcional para imágenes del sistema. Deje vacío para usar la configuración CDN del sistema Olares o el CDN de Olares."
  - envName: INITIAL_PASSWORD
    description: "Contraseña SSH inicial de una VM nueva: 8–128 caracteres. Los discos existentes conservan su contraseña. Después de instalar, cámbiela dentro de la VM con passwd."

metadata:
  title: QEMU Server
  description: "Macchina virtuale Linux su Olares con SSH, accesso Overlay e console web"
spec:
  fullDescription: |
    Esegui una macchina virtuale Linux su Olares con QEMU e accelerazione KVM. Scegli Ubuntu 24.04/26.04, Debian 12/13, Rocky Linux 9/10 o Fedora 43/44.

    Durante l’installazione, imposta 1–8 core virtuali, 1–32 GiB di RAM, un disco virtuale da 16–512 GiB e una password SSH iniziale. I campi non hanno valori predefiniti. Per cambiare distribuzione occorre un’installazione separata.

    La pagina mostra l’avanzamento del download e dell’inizializzazione e offre una console web. La lingua segue quella del browser: cinese o inglese. Le immagini provengono dalla CDN Olares, supportano la ripresa del download e vengono verificate con hash fissi.

    Sulla stessa rete, abilita l’app in Impostazioni > Rete > Gateway Overlay e usa l’indirizzo assegnato con la porta SSH 22. Fuori da questa rete, connettiti prima con LarePass VPN, quindi usa l’indirizzo del dispositivo Olares e la porta SSH esterna indicata in Impostazioni > Applicazioni > QEMU Server > Porte.

    Nomi utente: ubuntu per Ubuntu, debian per Debian, rocky per Rocky Linux e fedora per Fedora. Dopo l’installazione, cambia la password con passwd. Ogni installazione indipendente ha un disco e un indirizzo Overlay propri.

    Il disco di sistema e le variabili UEFI ARM sono conservati in Olares App Data. Puoi modificare CPU e RAM ed espandere il disco. Le modifiche riavviano la VM e interrompono le connessioni. La riduzione del disco non è supportata. Esegui un backup dei dati importanti prima dell’espansione. La disinstallazione con eliminazione dei dati rimuove il disco della VM.

    È richiesto un host amd64 o ARM64 con KVM utilizzabile e /dev/kvm. La VM usa l’architettura dell’host; i dischi x86 non possono essere usati su ARM. Questa app sperimentale esegue il contenitore VM in modalità privilegiata con UID/GID 1000 e accesso a /dev/kvm e al proprio spazio applicativo. Riserva 1 GiB aggiuntivo per QEMU.
entrances:
  - name: qemu
    title: QEMU Server
envs:
  - envName: DISTRIBUTION
    description: "Distribuzione Linux per una nuova VM. I dischi esistenti vengono conservati. Per cambiare distribuzione, esegui un backup e crea un’installazione separata con un nuovo disco."
  - envName: CPU_CORES
    description: "1–8 core CPU virtuali. Le modifiche riavviano la VM e interrompono le connessioni. Non sono core fisici dedicati."
  - envName: MEMORY_GB
    description: "Memoria della VM: 1–32 GiB. Viene riservato 1 GiB aggiuntivo per QEMU. Le modifiche riavviano la VM e interrompono le connessioni."
  - envName: DISK_SIZE_GB
    description: "Disco virtuale: 16–512 GiB. Aumentando il valore, al riavvio si espandono il disco e i filesystem supportati. La riduzione non è supportata; valori inferiori conservano il disco e mostrano un avviso. Le modifiche interrompono le connessioni. Esegui un backup prima dell’espansione."
  - envName: SYSTEM_CDN_SERVICE
    description: "URL base CDN facoltativo per le immagini di sistema. Lascia vuoto per usare l’impostazione CDN del sistema Olares o la CDN Olares."
  - envName: INITIAL_PASSWORD
    description: "Password SSH iniziale per una nuova VM: 8–128 caratteri. I dischi esistenti mantengono la password corrente. Dopo l’installazione, modificala nella VM con passwd."

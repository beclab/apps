metadata:
  title: SearXNG
  description: Cherchez sans être suivi
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Un seul service sera installé sur l'ensemble du système Olares. Cependant, chaque utilisateur doit tout de même installer une entrée de bureau pour accéder et utiliser le service installé par l'Olares Admin.

    **APERÇU**
    SearXNG est un métamoteur de recherche Internet gratuit qui agrège les résultats de plus de 70 services de recherche. Les utilisateurs ne sont ni suivis ni profilés. De plus, SearXNG peut être utilisé via Tor pour l'anonymat en ligne.

    **Pourquoi l'utiliser ?**
    - SearXNG peut ne pas vous offrir des résultats aussi personnalisés que Google, mais il ne génère pas de profil à votre sujet.
    - SearXNG se fiche de ce que vous recherchez, ne partage jamais rien avec un tiers, et ne peut pas être utilisé pour vous compromettre.
    - SearXNG est un logiciel libre, le code est 100 % ouvert, et tout le monde est invité à l'améliorer

    **Fonctionnalités**
    - auto-hébergé
    - pas de suivi utilisateur / pas de profilage
    - scripts et cookies sont optionnels
    - connexions sécurisées et chiffrées
    - environ 200 moteurs de recherche
    - environ 60 traductions
    - environ 100 instances bien maintenues sur searx.space
    - intégration facile des moteurs de recherche
    - développement professionnel : CI, assurance qualité et UI testée automatiquement

  upgradeDescription: |
    Mise à niveau de SearXNG vers 2026.5.10-df1f24fb7

    - Résultats de recherche nettement plus précis, surtout pour les requêtes
      techniques et de longue traîne. La build précédente abandonnait silencieusement la plupart
      des personnalisations, ne laissant qu'un petit ensemble de moteurs de secours Bing uniquement
      qui renvoyait souvent des résultats leurres anti-scraping.
    - Le contenu anglais (sites officiels, documentation) n'est plus masqué
      aux utilisateurs non anglophones ; les résultats de recherche sont désormais
      agnostiques à la langue par défaut.
    - La liste de moteurs fournie suit désormais automatiquement l'image SearXNG, ainsi
      les futures mises à niveau récupèrent de nouveaux moteurs sans configuration manuelle.
    - Clés API optionnelles exposées pour YouTube / WolframAlpha / Flickr /
      StackExchange / MyMemory / Wallhaven pour améliorer encore la stabilité pour
      les utilisateurs qui les fournissent.

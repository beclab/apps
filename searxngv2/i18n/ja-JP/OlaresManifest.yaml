metadata:
  title: SearXNG
  description: 追跡されずに検索
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でサービスは 1 つだけインストールされます。ただし、各ユーザーは Olares Admin がインストールしたサービスにアクセス・利用するためにデスクトップエントリをインストールする必要があります。

    **概要**
    SearXNG は 70 以上の検索サービスから結果を集約する無料のインターネットメタ検索エンジンです。ユーザーは追跡もプロファイリングもされません。さらにオンライン匿名性のため Tor 経由でも利用できます。

    **なぜ使うのか？**
    - SearXNG は Google ほどパーソナライズされた結果を提供しないかもしれませんが、あなたについてのプロファイルは作りません。
    - SearXNG は検索内容を気にせず、第三者と何も共有せず、あなたを危険にさらす用途にも使えません。
    - SearXNG はフリーソフトウェアで、コードは 100% オープン、誰でも改善に参加できます

    **機能**
    - セルフホスト
    - ユーザートラッキングなし / プロファイリングなし
    - スクリプトと Cookie は任意
    - 安全で暗号化された接続
    - 約 200 の検索エンジン
    - 約 60 の翻訳
    - searx.space 上の約 100 のよく維持されたインスタンス
    - 検索エンジンの容易な統合
    - プロフェッショナルな開発：CI、品質保証、自動テスト済み UI

  upgradeDescription: |
    SearXNG を 2026.5.10-df1f24fb7 へアップグレード

    - 特に技術的・ロングテールのクエリで検索結果の精度が大幅に向上。
      以前のビルドはカスタマイズの大半を黙って破棄し、Bing のみの
      小さなフォールバックエンジン集合だけ残し、しばしばアンチスクレイピングの
      おとり結果を返していました。
    - 英語コンテンツ（公式サイト、ドキュメント）が非英語ユーザーから
      隠れなくなり、検索結果はデフォルトで言語非依存に。
    - 同梱エンジン一覧が SearXNG イメージを自動追従するため、
      今後のアップグレードで手動設定なしに新エンジンを取り込みます。
    - YouTube / WolframAlpha / Flickr /
      StackExchange / MyMemory / Wallhaven の任意 API キーを公開し、
      提供するユーザーの安定性をさらに向上。

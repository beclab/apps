metadata:
  title: SearXNG
  description: Cerca senza essere tracciato
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Tuttavia, ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall'Olares Admin.

    **PANORAMICA**
    SearXNG è un metasearch engine Internet gratuito che aggrega risultati da più di 70 servizi di ricerca. Gli utenti non vengono né tracciati né profilati. Inoltre, SearXNG può essere usato tramite Tor per l'anonimato online.

    **Perché usarlo?**
    - SearXNG potrebbe non offrirti risultati così personalizzati come Google, ma non genera un profilo su di te.
    - A SearXNG non importa cosa cerchi, non condivide mai nulla con terze parti e non può essere usato per comprometterti.
    - SearXNG è software libero, il codice è aperto al 100% e tutti sono i benvenuti a migliorarlo

    **Funzionalità**
    - self hosted
    - nessun tracciamento utenti / nessun profiling
    - script e cookie sono opzionali
    - connessioni sicure e crittografate
    - circa 200 motori di ricerca
    - circa 60 traduzioni
    - circa 100 istanze ben mantenute su searx.space
    - facile integrazione dei motori di ricerca
    - sviluppo professionale: CI, assurance della qualità e UI testata automaticamente

  upgradeDescription: |
    Aggiornare SearXNG a 2026.5.10-df1f24fb7

    - Risultati di ricerca significativamente più accurati, soprattutto per query
      tecniche e di long-tail. La build precedente scartava silenziosamente la maggior parte
      della personalizzazione, lasciando solo un piccolo set di fallback solo Bing
      che spesso restituiva risultati esca anti-scraping.
    - I contenuti in inglese (siti ufficiali, documentazione) non sono più nascosti
      agli utenti non anglofoni; i risultati di ricerca sono ora language-agnostic
      per impostazione predefinita.
    - L'elenco dei motori incluso ora segue automaticamente l'immagine SearXNG, così
      i futuri upgrade acquisiscono nuovi motori senza configurazione manuale.
    - Chiavi API opzionali esposte per YouTube / WolframAlpha / Flickr /
      StackExchange / MyMemory / Wallhaven per migliorare ulteriormente la stabilità per
      gli utenti che le forniscono.

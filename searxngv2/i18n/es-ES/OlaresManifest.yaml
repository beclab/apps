metadata:
  title: SearXNG
  description: Busca sin ser rastreado
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario aún necesita instalar una entrada de escritorio para acceder y usar el servicio instalado por el Olares Admin.

    **RESUMEN**
    SearXNG es un metabuscador de Internet gratuito que agrega resultados de más de 70 servicios de búsqueda. Los usuarios no son rastreados ni perfilados. Además, SearXNG puede usarse a través de Tor para el anonimato en línea.

    **¿Por qué usarlo?**
    - SearXNG puede no ofrecerte resultados tan personalizados como Google, pero no genera un perfil sobre ti.
    - A SearXNG no le importa lo que buscas, nunca comparte nada con terceros y no puede usarse para comprometerte.
    - SearXNG es software libre, el código está 100% abierto, y todos son bienvenidos a mejorarlo

    **Funciones**
    - autoalojado
    - sin seguimiento de usuarios / sin perfiles
    - scripts y cookies son opcionales
    - conexiones seguras y cifradas
    - unas 200 motores de búsqueda
    - unas 60 traducciones
    - unas 100 instancias bien mantenidas en searx.space
    - fácil integración de motores de búsqueda
    - desarrollo profesional: CI, control de calidad y UI con pruebas automatizadas

  upgradeDescription: |
    Actualizar SearXNG a 2026.5.10-df1f24fb7

    - Resultados de búsqueda significativamente más precisos, especialmente para consultas
      técnicas y de cola larga. La build anterior descartaba silenciosamente la mayor parte
      de la personalización, dejando solo un pequeño conjunto de motores de respaldo solo Bing
      que a menudo devolvía resultados señuelo anti-scraping.
    - El contenido en inglés (sitios oficiales, documentación) ya no se oculta
      a los usuarios no anglófonos; los resultados de búsqueda son ahora agnósticos
      del idioma por defecto.
    - La lista de motores incluida ahora sigue automáticamente la imagen de SearXNG, de modo que
      las futuras actualizaciones incorporan nuevos motores sin configuración manual.
    - Claves API opcionales expuestas para YouTube / WolframAlpha / Flickr /
      StackExchange / MyMemory / Wallhaven para mejorar aún más la estabilidad de
      los usuarios que las proporcionen.

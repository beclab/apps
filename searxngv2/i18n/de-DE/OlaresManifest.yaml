metadata:
  title: SearXNG
  description: Suchen, ohne verfolgt zu werden
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer muss dennoch einen Desktop-Eintrag installieren, um den vom Olares-Admin installierten Dienst zu nutzen.

    **ÜBERSICHT**
    SearXNG ist eine kostenlose Internet-Metasuchmaschine, die Ergebnisse von mehr als 70 Suchdiensten aggregiert. Nutzer werden weder verfolgt noch profiliert. Zusätzlich kann SearXNG über Tor für Online-Anonymität verwendet werden.

    **Warum nutzen?**
    - SearXNG bietet möglicherweise nicht so personalisierte Ergebnisse wie Google, erstellt aber kein Profil über Sie.
    - SearXNG interessiert sich nicht dafür, wonach Sie suchen, teilt nichts mit Dritten und kann nicht genutzt werden, um Sie zu kompromittieren.
    - SearXNG ist freie Software, der Code ist zu 100 % offen, und jeder ist willkommen, ihn zu verbessern

    **Funktionen**
    - selbst gehostet
    - kein Nutzer-Tracking / kein Profiling
    - Skripte & Cookies sind optional
    - sichere, verschlüsselte Verbindungen
    - etwa 200 Suchmaschinen
    - etwa 60 Übersetzungen
    - etwa 100 gut gepflegte Instanzen auf searx.space
    - einfache Integration von Suchmaschinen
    - professionelle Entwicklung: CI, Qualitätssicherung & automatisiert getestete UI

  upgradeDescription: |
    Upgrade von SearXNG auf 2026.5.10-df1f24fb7

    - Deutlich genauere Suchergebnisse, insbesondere für technische
      und Long-Tail-Abfragen. Der vorherige Build hat die meisten
      Anpassungen stillschweigend verworfen und nur eine kleine Bing-only-
      Fallback-Engine-Menge belassen, die oft Anti-Scraping-Köderergebnisse lieferte.
    - Englische Inhalte (offizielle Seiten, Dokumentation) werden für
      Nicht-Englisch-Nutzer nicht mehr ausgeblendet; Suchergebnisse sind
      standardmäßig sprachagnostisch.
    - Die gebündelte Engine-Liste folgt nun automatisch dem SearXNG-Image, sodass
      künftige Upgrades neue Engines ohne manuelle Konfiguration übernehmen.
    - Optionale API-Schlüssel für YouTube / WolframAlpha / Flickr /
      StackExchange / MyMemory / Wallhaven freigelegt, um die Stabilität für
      Nutzer weiter zu verbessern, die sie angeben.

metadata:
  title: RAGFlow
  description: 深い文書理解に基づくオープンソース RAG エンジン

spec:
  fullDescription: |
    RAGFlow とは？
    RAGFlow は深い文書理解に基づくオープンソースの RAG（Retrieval-Augmented Generation）エンジンです。あらゆる規模のビジネス向けに合理化された RAG ワークフローを提供し、LLM（大規模言語モデル）と組み合わせて、複雑な形式の多様なデータからの十分な根拠付き引用に裏付けられた、信頼性の高い質問応答能力を実現します。

    **主な機能**
    「Quality in, quality out」
    - 複雑な形式の非構造化データから、深い文書理解に基づく知識抽出。
    - 事実上無制限のトークンのデータから「干し草の中の針」を見つける。

    テンプレートベースのチャンキング
    - 知的で説明可能。
    - 豊富なテンプレート選択肢。

    幻覚を抑えた根拠付き引用
    - 人間の介入を可能にするテキストチャンキングの可視化。
    - 根拠ある回答を支える主要参照の素早い確認と追跡可能な引用。

    異種データソースとの互換性
    - Word、スライド、Excel、txt、画像、スキャン、構造化データ、Web ページなどに対応。

    自動化された手間のない RAG ワークフロー
    - 個人から大企業まで対応する合理化された RAG オーケストレーション。
    - 設定可能な LLM および embedding モデル。
    - Multiple recall と fused re-ranking の組み合わせ。
    - ビジネスとのシームレスな統合のための直感的な API。

  upgradeDescription: |
    この更新では既定のWebアドレスが変更され、独立したMCPアドレスが追加されます。Olaresのアプリ設定に表示される最新の入口アドレスを使用してください。

    RAGFlow v0.27.2に更新しました。文書プレビューと検索を改善し、任意で有効にできるMCP接続と、埋め込み処理のバッチサイズ設定を追加しました。

    [v0.27.2の公式リリースノート](https://github.com/infiniflow/ragflow/releases/tag/v0.27.2)

    - EPUB文書のプレビューと、文書プレビュー内でのExcel引用元の確認に対応しました。
    - 検索結果と検索テストで、一致する内容が強調表示されます。
    - 対応するAIツールから、デスクトップに表示されない独立したMCP入口経由でナレッジベースにアクセスできます。この機能は初期設定では無効で、クライアントにはRAGFlowのAPIキーが必要です。
    - Olaresのアプリ設定で埋め込み処理のバッチサイズを変更できます。初期値は1で、ローカルモデルには1を推奨します。クラウドサービスでは値を大きくすると処理を高速化できます。
    - Webアクセスの初期設定を`internal`に変更しました。

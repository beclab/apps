metadata:
  title: RAGFlow
  description: 一款基于深度文档理解构建的开源 RAG 引擎

spec:
  fullDescription: |
    RAGFlow 是什么？
    RAGFlow 是一款基于深度文档理解构建的开源 RAG（Retrieval-Augmented Generation）引擎。RAGFlow 可以为各种规模的企业及个人提供一套精简的 RAG 工作流程，结合大语言模型（LLM）针对用户各类不同的复杂格式数据提供可靠的问答以及有理有据的引用。

    **主要功能**
    "Quality in, quality out"
    - 基于深度文档理解，能够从各类复杂格式的非结构化数据中提取真知灼见。
    - 真正在无限上下文（token）的场景下快速完成大海捞针测试。

    基于模板的文本切片
    - 不仅仅是智能，更重要的是可控可解释。
    - 多种文本模板可供选择

    有理有据、最大程度降低幻觉（hallucination）
    - 文本切片过程可视化，支持手动调整。
    - 有理有据：答案提供关键引用的快照并支持追根溯源。

    兼容各类异构数据源
    - 支持丰富的文件类型，包括 Word 文档、PPT、excel 表格、txt 文件、图片、PDF、影印件、复印件、结构化数据、网页等。

    全程无忧、自动化的 RAG 工作流
    - 全面优化的 RAG 工作流可以支持从个人应用乃至超大型企业的各类生态系统。
    - 大语言模型 LLM 以及向量模型均支持配置。
    - 基于多路召回、融合重排序。
    - 提供易用的 API，可以轻松集成到各类企业系统。

  upgradeDescription: |
    v1.0.30: 升级 RAGFlow 至 v0.26.4（`docker.io/infiniflow/ragflow:v0.26.4`）。配套镜像不变（Infinity v0.7.0、Elasticsearch 8.11.3、MinIO、Valkey）。

    自 v0.26.1 以来的要点
    - NLP：多语言 Snowball stemmer（16 种语言），支持荷兰语分词。
    - 聊天渠道（v0.26.2）：WhatsApp、钉钉、企业微信集成。
    - 解析（v0.26.3）：SoMark OCR 复杂版面；Ingest documents API；批量上传部分成功处理。
    - 修复（v0.26.4）：LM-Studio 含 `@` 的模型名、MCP list_chats 分页、Docling 数学公式、元数据行内编辑、批量关联文件到数据集、中文 filter、Laws chunker 标题识别等。

    完整发布说明：https://github.com/infiniflow/ragflow/releases/tag/v0.26.4

    v1.0.29: 将 `ELASTIC_PASSWORD`、`REDIS_PASSWORD`、`MINIO_PASSWORD` 移入 Kubernetes Secret（`secretKeyRef`）。

    存储：持久化卷（ragflow 日志、infinity、minio、redis、elasticsearch）从 `appCache` 迁移至 `appData` 子路径。升级后首次启动时，initContainer 会在目标目录为空时将旧 appCache 内容复制到 appData（各卷使用独立的 `.migration_from_appcache_*_done` 标记）。旧 appCache 数据保留以便回滚。

    安装或升级后请在 RAGFlow 设置中自行配置 LLM 与 Embedding 模型。

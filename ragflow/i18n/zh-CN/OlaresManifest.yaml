metadata:
  title: RAGFlow
  description: 一款基于深度文档理解构建的开源 RAG 引擎

spec:
  fullDescription: |
    RAGFlow 是什么？
    RAGFlow 是一款基于深度文档理解构建的开源 RAG（Retrieval-Augmented Generation）引擎。RAGFlow 可以为各种规模的企业及个人提供一套精简的 RAG 工作流程，结合大语言模型（LLM）针对用户各类不同的复杂格式数据提供可靠的问答以及有理有据的引用。

    **主要功能**
    "Quality in, quality out"
    - 基于深度文档理解，能够从各类复杂格式的非结构化数据中提取真知灼见。
    - 真正在无限上下文（token）的场景下快速完成大海捞针测试。

    基于模板的文本切片
    - 不仅仅是智能，更重要的是可控可解释。
    - 多种文本模板可供选择

    有理有据、最大程度降低幻觉（hallucination）
    - 文本切片过程可视化，支持手动调整。
    - 有理有据：答案提供关键引用的快照并支持追根溯源。

    兼容各类异构数据源
    - 支持丰富的文件类型，包括 Word 文档、PPT、excel 表格、txt 文件、图片、PDF、影印件、复印件、结构化数据、网页等。

    全程无忧、自动化的 RAG 工作流
    - 全面优化的 RAG 工作流可以支持从个人应用乃至超大型企业的各类生态系统。
    - 大语言模型 LLM 以及向量模型均支持配置。
    - 基于多路召回、融合重排序。
    - 提供易用的 API，可以轻松集成到各类企业系统。

  upgradeDescription: |
    本次更新会更改默认网页地址，并新增独立的 MCP 地址。请使用 Olares 应用设置中显示的最新入口地址。

    升级至 RAGFlow v0.27.2，改进文档预览和搜索，新增可选的 MCP 接入和可调整的向量化处理批量大小。

    [v0.27.2 官方发布说明](https://github.com/infiniflow/ragflow/releases/tag/v0.27.2)

    - 支持预览 EPUB 文档，并在文档预览中定位 Excel 引用来源。
    - 在搜索结果和检索测试中高亮显示匹配内容。
    - 支持兼容的 AI 工具通过独立的 MCP 入口访问知识库，该入口不显示在桌面上。此选项默认关闭，客户端需提供 RAGFlow API 密钥。
    - 可在 Olares 应用设置中调整向量化处理的 batch size。默认值为 1，本地模型建议保持为 1；使用云服务时可以调高以加快速度。
    - 网页入口的默认访问权限调整为 `internal`。

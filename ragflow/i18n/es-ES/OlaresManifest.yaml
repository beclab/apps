metadata:
  title: RAGFlow
  description: Un motor RAG de código abierto basado en una comprensión profunda de documentos

spec:
  fullDescription: |
    ¿Qué es RAGFlow?
    RAGFlow es un motor RAG (Retrieval-Augmented Generation) de código abierto basado en una comprensión profunda de documentos. Ofrece un flujo de trabajo RAG simplificado para empresas de cualquier escala, combinando LLM (Large Language Models) para proporcionar capacidades de pregunta-respuesta veraces, respaldadas por citas bien fundamentadas a partir de datos con formatos complejos.

    **Funciones clave**
    «Quality in, quality out»
    - Extracción de conocimiento basada en comprensión profunda de documentos a partir de datos no estructurados con formatos complicados.
    - Encuentra la «aguja en el pajar» de datos con tokens literalmente ilimitados.

    Chunking basado en plantillas
    - Inteligente y explicable.
    - Muchas opciones de plantilla entre las que elegir.

    Citas fundamentadas con menos alucinaciones
    - Visualización del chunking de texto para permitir la intervención humana.
    - Vista rápida de las referencias clave y citas rastreables para respaldar respuestas fundamentadas.

    Compatibilidad con fuentes de datos heterogéneas
    - Admite Word, diapositivas, excel, txt, imágenes, copias escaneadas, datos estructurados, páginas web y más.

    Flujo de trabajo RAG automatizado y sin esfuerzo
    - Orquestación RAG simplificada para particulares y grandes empresas.
    - LLM configurables así como modelos de embedding.
    - Multiple recall combinado con re-ranking fusionado.
    - APIs intuitivas para una integración fluida con el negocio.

  upgradeDescription: |
    Esta actualización cambia la dirección web predeterminada y añade una dirección MCP independiente. Utilice las direcciones actuales de las entradas que aparecen en la configuración de la aplicación en Olares.

    Actualización a RAGFlow v0.27.2 con mejoras en la vista previa de documentos y la búsqueda, acceso opcional mediante MCP y un tamaño de lote configurable para generar embeddings.

    [Notas oficiales de la versión v0.27.2](https://github.com/infiniflow/ragflow/releases/tag/v0.27.2)

    - Permite previsualizar documentos EPUB y localizar las fuentes de las citas de Excel en la vista previa del documento.
    - Resalta las coincidencias en los resultados de búsqueda y en las pruebas de recuperación.
    - Permite que herramientas de IA compatibles accedan a las bases de conocimiento mediante una entrada MCP independiente, oculta en el escritorio. Esta opción está desactivada de forma predeterminada; los clientes deben proporcionar una clave de API de RAGFlow.
    - El tamaño de lote para generar embeddings se puede ajustar en la configuración de la aplicación en Olares. El valor predeterminado es 1, recomendado para modelos locales. Con servicios en la nube, se puede aumentar para acelerar el procesamiento.
    - El acceso web utiliza ahora el nivel `internal` de forma predeterminada.

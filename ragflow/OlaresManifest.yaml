olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  elasticsearch: 1
  infinity: 1
  minio: 1
  ragflow: 1
  redis: 1
metadata:
  name: ragflow
  description: An open-source RAG engine based on deep document understanding
  icon: https://app.cdn.olares.com/appstore/ragflow/icon.png
  appid: ragflow
  version: '1.0.38'
  title: RAGFlow
  categories:
  - Productivity_v112
  - agents
  tags:
  - rag
  - knowledge-base

entrances:
- name: ragflow
  host: ragflow
  port: 80
  title: RAGFlow
  icon: https://app.cdn.olares.com/appstore/ragflow/icon.png
  authLevel: internal
  openMethod: window
- name: mcp
  host: ragflow
  port: 9382
  title: RAGFlow MCP
  icon: https://app.cdn.olares.com/appstore/ragflow/icon.png
  authLevel: internal
  invisible: true
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.27.2'
  featuredImage: https://app.cdn.olares.com/appstore/ragflow/1.webp
  promoteImage:
  - https://app.cdn.olares.com/appstore/ragflow/1.webp
  - https://app.cdn.olares.com/appstore/ragflow/2.webp
  - https://app.cdn.olares.com/appstore/ragflow/3.webp
  - https://app.cdn.olares.com/appstore/ragflow/4.webp
  - https://app.cdn.olares.com/appstore/ragflow/5.webp
  fullDescription: |
    What is RAGFlow?
    RAGFlow is an open-source RAG (Retrieval-Augmented Generation) engine based on deep document understanding. It offers a streamlined RAG workflow for businesses of any scale, combining LLM (Large Language Models) to provide truthful question-answering capabilities, backed by well-founded citations from various complex formatted data.

    **Key Features**
    "Quality in, quality out"
    - Deep document understanding-based knowledge extraction from unstructured data with complicated formats.
    - Finds "needle in a data haystack" of literally unlimited tokens.

    Template-based chunking
    - Intelligent and explainable.
    - Plenty of template options to choose from.

    Grounded citations with reduced hallucinations
    - Visualization of text chunking to allow human intervention.
    - Quick view of the key references and traceable citations to support grounded answers.

    Compatibility with heterogeneous data sources
    - Supports Word, slides, excel, txt, images, scanned copies, structured data, web pages, and more.

    Automated and effortless RAG workflow
    - Streamlined RAG orchestration catered to both personal and large businesses.
    - Configurable LLMs as well as embedding models.
    - Multiple recall paired with fused re-ranking.
    - Intuitive APIs for seamless integration with business.
  upgradeDescription: |
    This update changes the default web address and adds a separate MCP address. Use the current entrance addresses shown in Olares app settings.

    Updated to RAGFlow v0.27.2 with improvements to document previews and search, optional MCP access, and configurable embedding batches.

    [Official v0.27.2 release notes](https://github.com/infiniflow/ragflow/releases/tag/v0.27.2)

    - Preview EPUB documents and locate Excel citation sources in the document preview.
    - See highlighted matches in search results and retrieval tests.
    - Connect compatible AI tools to your knowledge bases through a separate MCP entrance, hidden from the desktop. This option is disabled by default; clients must provide a RAGFlow API key.
    - Adjust the embedding batch size in Olares app settings. The default is 1, which is recommended for local models. For cloud services, increase it to speed up embedding.
    - The web entrance now defaults to `internal` access.

  developer: InfiniFlow
  website: https://ragflow.io/
  sourceCode: https://github.com/infiniflow/ragflow
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  doc: https://ragflow.io/docs/dev/
  license:
  - text: Apache-2.0
    url: https://github.com/infiniflow/ragflow#Apache-2.0-1-ov-file
  requiredMemory: 7680Mi
  limitedMemory: 28Gi
  requiredDisk: 56Mi
  limitedDisk: 1Gi
  requiredCpu: 3150m
  limitedCpu: 13
  supportArch:
  - amd64
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  - name: mysql
    type: middleware
    version: '>=8.0.0'
middleware:
  mysql:
    username: rag_flow
    databases:
      - name: rag_flow
envs:
  - envName: HF_ENDPOINT
    required: true
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: MCP_ENABLED
    type: bool
    required: false
    applyOnChange: true
    editable: true
    default: "false"
    description: "Enable the separate RAGFlow MCP entrance, hidden from the desktop. Use its HTTPS address with /mcp for Streamable HTTP or /sse for SSE. Clients must provide a RAGFlow API key. Disabled by default."
  - envName: EMBEDDING_BATCH_SIZE
    type: int
    required: false
    applyOnChange: true
    editable: true
    default: "1"
    regex: '^[1-9][0-9]*$'
    description: "Use a batch size of 1 for local embedding models. For cloud services, increase it to speed up embedding."

metadata:
  title: Metabase
  description: Business-Intelligence- und Embedded-Analytics-Tool, mit dem jeder mit Daten arbeiten kann
spec:
  upgradeDescription: |
    Metabase von 0.53 auf 0.63.16.6 aktualisieren (`metabase/metabase:v0.63.16.6`).

    Dieser Sprung umfasst die Serie 0.54–0.63: Dashboards, Embedding, Visualisierungen sowie viele Query-/Admin-Korrekturen. Bei Embedding oder API bitte Breaking Changes prüfen.

    Release Notes: https://github.com/metabase/metabase/releases/tag/v0.63.16.6

  fullDescription: |
    Metabase ist der einfache, quelloffene Weg für alle in Ihrem Unternehmen, Fragen zu stellen und aus Daten zu lernen.
    
    Funktionen
    In fünf Minuten eingerichtet (kein Scherz).
    Lassen Sie jeden im Team Fragen stellen, ohne SQL zu kennen.
    Nutzen Sie den SQL-Editor für komplexere Abfragen.
    Erstellen Sie ansprechende, interaktive Dashboards mit Filtern, Auto-Refresh, Vollbild und benutzerdefiniertem Klickverhalten.
    Erstellen Sie Modelle, die Roh-Tabellen bereinigen, annotieren und/oder kombinieren.
    Definieren Sie kanonische Segmente und Metriken für Ihr Team.
    Senden Sie Daten nach Zeitplan per Slack oder E-Mail mit Dashboard-Abonnements.
    Richten Sie Alarme ein, damit Metabase Sie benachrichtigt, wenn sich Ihre Daten ändern.
    Betten Sie Diagramme und Dashboards in Ihre App ein – oder sogar Ihr gesamtes Metabase.

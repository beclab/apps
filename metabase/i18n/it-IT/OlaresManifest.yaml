metadata:
  title: Metabase
  description: Strumento di Business Intelligence e analitica incorporata che consente a tutti di lavorare con i dati
spec:
  upgradeDescription: |
    Aggiorna Metabase da 0.53 a 0.63.16.6 (`metabase/metabase:v0.63.16.6`).

    Questo salto include la serie 0.54–0.63: dashboard, embedding, visualizzazioni e molte correzioni query/admin. Controlla i breaking change se usi embedding o API.

    Note: https://github.com/metabase/metabase/releases/tag/v0.63.16.6

  fullDescription: |
    Metabase è il modo semplice e open source per far sì che tutti in azienda pongano domande e imparino dai dati.
    
    Funzionalità
    Configurazione in cinque minuti (non scherziamo).
    Permetti a chiunque nel team di fare domande senza conoscere SQL.
    Usa l'editor SQL per query più complesse.
    Crea dashboard belle e interattive con filtri, aggiornamento automatico, schermo intero e comportamento di clic personalizzato.
    Crea modelli che puliscono, annotano e/o combinano tabelle grezze.
    Definisci segmenti e metriche canonici per il tuo team.
    Invia dati a Slack o email secondo una pianificazione con le sottoscrizioni dashboard.
    Imposta avvisi affinché Metabase ti notifichi quando i tuoi dati cambiano.
    Incorpora grafici e dashboard nella tua app, o addirittura l'intero Metabase.

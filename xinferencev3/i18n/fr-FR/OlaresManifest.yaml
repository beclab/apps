metadata:
  title: Xinference
  description: Le Model Serving simplifié
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **APERÇU**
    Xorbits Inference (Xinference) est une bibliothèque puissante et polyvalente conçue pour servir des modèles de langage, de reconnaissance vocale et multimodaux. Avec Xorbits Inference, vous pouvez déployer et servir vos modèles ou des modèles intégrés de pointe avec une seule commande. Que vous soyez chercheur, développeur ou data scientist, Xorbits Inference vous permet d'exploiter pleinement les modèles d'IA de pointe.

    Fonctionnalités clés
    Model Serving simplifié : Simplifie le service de grands modèles de langage, de reconnaissance vocale et multimodaux. Configurez et déployez pour l'expérimentation et la production avec une seule commande.

    Modèles de pointe : Expérimentez avec des modèles intégrés de pointe via une seule commande. Inference donne accès à des modèles open source à la pointe !

    Utilisation de matériel hétérogène : Tirez le meilleur parti de votre matériel avec ggml. Xorbits Inference utilise intelligemment GPU et CPU pour accélérer l'inférence.

    API et interfaces flexibles : Plusieurs interfaces pour interagir avec vos modèles — API RESTful compatible OpenAI (y compris Function Calling API), RPC, CLI et WebUI pour une gestion et une interaction fluides.

    Déploiement distribué : Excellent en scénarios distribués, permettant de répartir l'inférence sur plusieurs appareils ou machines.

    Intégration native avec des bibliothèques tierces : Intégration fluide avec LangChain, LlamaIndex, Dify et Chatbox.

  upgradeDescription: |
    Nouveautés de cette mise à niveau entre versions :
    - Ajoute l’API Responses d’OpenAI et une vue commune des journaux d’exécution actuels et historiques.
    - Un cache optionnel des poids sur GPU permet à vLLM et SGLang de recharger les réglages compatibles du moteur sans recharger les poids du modèle.

    https://github.com/xorbitsai/inference/releases/tag/v4.0.0

    Mise à jour de Xinference vers 4.0.1. Vérifier et conserver les sauvegardes avant de migrer les données vers un répertoire avec UID 1000. Activer les environnements de moteur par modèle et l’authentification du transport des acteurs. L’authentification HTTP reste désactivée par défaut pour les clients Olares existants et peut être activée explicitement. L’ancienne authentification JSON nécessite l’outil de migration officiel et la clé de chiffrement persistante. Pilote NVIDIA 580 ou ultérieur requis.
    https://github.com/xorbitsai/inference/releases/tag/v4.0.1

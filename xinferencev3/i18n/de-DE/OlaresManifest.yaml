metadata:
  title: Xinference
  description: Model Serving leicht gemacht
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.

    **ÜBERBLICK**
    Xorbits Inference (Xinference) ist eine leistungsstarke, vielseitige Bibliothek zum Bereitstellen von Sprach-, Spracherkennungs- und multimodalen Modellen. Mit Xorbits Inference können Sie Ihre eigenen oder integrierte State-of-the-Art-Modelle mit einem einzigen Befehl bereitstellen und bedienen. Ob Forscher, Entwickler oder Data Scientist — Xorbits Inference hilft Ihnen, das volle Potenzial modernster KI-Modelle auszuschöpfen.

    Hauptfunktionen
    Model Serving leicht gemacht: Vereinfacht das Serving großer Sprach-, Spracherkennungs- und multimodaler Modelle. Einrichtung und Deployment für Experimente und Produktion mit einem einzigen Befehl.

    State-of-the-Art-Modelle: Experimentieren Sie mit integrierten Spitzenmodellen per Einzeilbefehl. Inference bietet Zugang zu modernen Open-Source-Modellen!

    Heterogene Hardware-Nutzung: Nutzen Sie Ihre Hardware mit ggml optimal. Xorbits Inference setzt GPUs und CPUs intelligent ein, um Inferenz zu beschleunigen.

    Flexible API und Schnittstellen: Mehrere Schnittstellen zur Interaktion mit Modellen — OpenAI-kompatible RESTful API (inkl. Function Calling API), RPC, CLI und WebUI für nahtlose Verwaltung und Nutzung.

    Verteiltes Deployment: Stark in verteilten Szenarien — Inferenz nahtlos über mehrere Geräte oder Maschinen verteilen.

    Eingebaute Integration mit Drittanbieter-Bibliotheken: Nahtlose Integration mit LangChain, LlamaIndex, Dify und Chatbox.

  upgradeDescription: |
    Highlights dieses versionsübergreifenden Updates:
    - Neue OpenAI Responses API und eine gemeinsame Ansicht für aktuelle und historische Laufzeitprotokolle.
    - Mit optionalem GPU-Gewichtscache können vLLM und SGLang unterstützte Engine-Einstellungen neu laden, ohne die Modellgewichte erneut zu laden.

    https://github.com/xorbitsai/inference/releases/tag/v4.0.0

    Xinference auf 4.0.1 aktualisieren. Vor der Migration in ein Laufzeitverzeichnis mit UID 1000 werden Sicherungen geprüft und beibehalten. Modellbezogene Engine-Umgebungen und Actor-Transportauthentifizierung werden aktiviert. Die HTTP-Authentifizierung bleibt für bestehende Olares-Clients standardmäßig deaktiviert und kann explizit aktiviert werden. Alte JSON-Authentifizierung erfordert das Upstream-Migrationswerkzeug und den dauerhaften Verschlüsselungsschlüssel. NVIDIA-Treiber ab Version 580 erforderlich.
    https://github.com/xorbitsai/inference/releases/tag/v4.0.1

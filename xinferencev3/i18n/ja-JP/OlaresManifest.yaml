metadata:
  title: Xinference
  description: 簡単に使えるモデルサービング
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **概要**
    Xorbits Inference（Xinference）は、言語・音声認識・マルチモーダルモデルをサーブするための強力で汎用的なライブラリです。Xorbits Inference を使えば、独自モデルや内蔵の最先端モデルを単一コマンドでデプロイ・サーブできます。研究者、開発者、データサイエンティストのいずれであっても、最先端 AI モデルの可能性を最大限に引き出せます。

    主な機能
    簡単モデルサービング: 大規模言語・音声認識・マルチモーダルモデルのサービングを簡素化。実験から本番まで単一コマンドでセットアップ・デプロイ。

    最先端モデル: 内蔵の最先端モデルを単一コマンドで試せます。オープンソースの最新モデルへのアクセスを提供。

    ヘテロジニアスハードウェア活用: ggml でハードウェアを最大限活用。GPU と CPU を賢く使い推論を加速。

    柔軟な API とインターフェース: OpenAI 互換 RESTful API（Function Calling API 含む）、RPC、CLI、WebUI など複数のインターフェースでモデル管理と対話。

    分散デプロイ: 分散シナリオに強く、複数デバイス／マシンへの推論分散をシームレスに実現。

    サードパーティライブラリとの内蔵統合: LangChain、LlamaIndex、Dify、Chatbox とシームレスに統合。

  upgradeDescription: |
    今回の複数バージョンにわたる更新の主な変更：
    - OpenAI Responses API と、現在および過去の実行ログをまとめて確認できる画面を追加。
    - 任意の GPU 重みキャッシュを使うと、vLLM・SGLang で対応するエンジン設定を変更する際に、モデルの重みを読み直さずにエンジンを再起動できます。

    https://github.com/xorbitsai/inference/releases/tag/v4.0.0

    Xinference を 4.0.1 に更新します。バックアップを検証して保持した後、旧データを UID 1000 の実行ディレクトリへ移行します。モデルごとのエンジン環境と actor 通信認証を有効にします。既存の Olares クライアントとの互換性のため HTTP 認証は既定で無効のままですが、明示的に有効化できます。旧 JSON 認証には上流の移行ツールと永続的な暗号化キーが必要です。NVIDIA ドライバー 580 以降が必要です。
    https://github.com/xorbitsai/inference/releases/tag/v4.0.1

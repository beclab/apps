{{- $name := printf "%s-actor-auth" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: '{{ .Release.Namespace }}'
type: Opaque
data:
  key: {{ if and $existing $existing.data (index $existing.data "key") }}{{ index $existing.data "key" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}

{{- $hfEndpoint := (.Values.olaresEnv | default dict).HF_ENDPOINT | default "" -}}
{{- $hfCache := printf "%s/huggingface" .Values.userspace.appCommon -}}
{{- $appData := .Values.userspace.appData -}}
{{- $appCache := .Values.userspace.appCache -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: xinference
  # Primary workload: named after the release (== appid xinferencev3) for v3
  # workload verification. The label/selector stays io.kompose.service: xinference
  # so the Services below keep resolving.
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.xinferencev3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: xinference
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: xinference
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: snapshot-legacy-state
        image: beclab/aboveos-busybox:1.37.0
        securityContext:
          runAsUser: 0
        command: ["sh", "/migration/snapshot.sh"]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 1000m, memory: 512Mi}
        volumeMounts:
        - {name: legacy-data, mountPath: /legacy/data}
        - {name: legacy-cache, mountPath: /legacy/cache, readOnly: true}
        - {name: migration, mountPath: /migration, readOnly: true}
      - name: migrate-state
        image: beclab/xprobe-xinference:v4.0.1
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        command: ["python3", "/migration/migrate.py"]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 1000m, memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /root}
        - {name: legacy-data, mountPath: /legacy/data, readOnly: true}
        - {name: migration, mountPath: /migration, readOnly: true}
      containers:
      - name: xinference
        image: "beclab/xprobe-xinference:v4.0.1"
        command: ["xinference-local", "-H", "0.0.0.0", "--port", "9997", "--log-level", "info"]
        ports:
          - containerPort: 9997
            protocol: TCP
          - containerPort: 8000
            protocol: TCP
        # The entrance routes straight to :9997, so gate pod readiness on the
        # supervisor API actually listening (Olares only publishes the entrance
        # once the pod is Ready). The startup grace covers first-boot init.
        startupProbe:
          tcpSocket:
            port: 9997
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9997
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        env:
          # Private durable state (logs, launch history, ModelScope cache) on appData.
          # HF hub weights use the cross-app appCommon store.
          - name: XINFERENCE_HOME
            value: /root/.xinference
          - name: XINFERENCE_MODEL_SRC
            value: modelscope
          - name: MODELSCOPE_CACHE
            value: /root/.cache/modelscope
          # HF hub cache: flat models--* under appCommon/huggingface (Olares convention;
          # matches legacy $XINFERENCE_HOME/huggingface layout, not .../hub).
          - name: HF_HOME
            value: "{{ $hfCache }}"
          - name: HF_HUB_CACHE
            value: "{{ $hfCache }}"
          - name: VLLM_PORT
            value: "8000"
          - name: HF_ENDPOINT
            value: "{{ $hfEndpoint }}"
          - name: HOME
            value: /root
          # PyTorch/TorchCodec call getpass.getuser(); uid 1000 is not in the image passwd file.
          - name: USER
            value: olares
          - name: LOGNAME
            value: olares
          - name: XOSCAR_AUTH_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ .Release.Name }}-actor-auth'
                key: key
          - name: XINFERENCE_AUTH_ADVANCED
            value: {{ ((.Values.olaresEnv | default dict).XINFERENCE_AUTH_ADVANCED | default "false") | quote }}
          - name: XINFERENCE_ENABLE_VIRTUAL_ENV
            value: "1"
        resources:
          limits:
            cpu: "5"
            # Large-model launch/download can spike well past 20Gi (weights staging,
            # vLLM worker init, HF/ModelScope cache I/O). 40Gi avoids OOM during
            # first boot of big checkpoints on typical GPU nodes.
            memory: 40Gi
          requests:
            cpu: "1"
            memory: 6Gi
        volumeMounts:
        - mountPath: /root
          name: data
        - mountPath: "{{ $hfCache }}"
          name: hf-cache
        - name: shm
          mountPath: /dev/shm
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      volumes:
      - hostPath:
          path: '{{ $appData }}/runtime-v4'
          type: DirectoryOrCreate
        name: data
      - hostPath:
          path: '{{ $appData }}'
          type: DirectoryOrCreate
        name: legacy-data
      - configMap:
          name: '{{ .Release.Name }}-migration'
          defaultMode: 0444
        name: migration
      - hostPath:
          path: '{{ $appCache }}'
          type: DirectoryOrCreate
        name: legacy-cache
      - hostPath:
          path: "{{ $hfCache }}"
          type: DirectoryOrCreate
        name: hf-cache
      - name: shm
        emptyDir:
          medium: Memory
          # vLLM / torch multiprocessing uses /dev/shm heavily; 2Gi was tight for
          # multi-GB models.
          sizeLimit: "8Gi"
status: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: xinference
  name: xinference
  namespace: '{{ .Release.Namespace }}'
spec:
  ports:
  - name: "8000"
    port: 8000
    targetPort: 8000
  - name: "9997"
    port: 9997
    targetPort: 9997
  selector:
    io.kompose.service: xinference
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: xinference
  name: sharedentrances-api
  namespace: '{{ .Release.Namespace }}'
spec:
  ports:
  - name: "sharedentrances-api"
    port: 80
    targetPort: 9997
  selector:
    io.kompose.service: xinference
status:
  loadBalancer: {}

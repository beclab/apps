# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   llamacppllmbasev3 — engine Deployment (== appid / Release.Name)
#   llminit           — llm-init / entrance Deployment
workloads:
  llminit:
    replicaCount: 1
  llamacppllmbasev3:
    replicaCount: 1

# llama.cpp engine images by Olares accelerator mode.
engine:
  images:
    nvidia: docker.io/beclab/ggml-org-llama.cpp:server-cuda12-b10969
    nvidiaArm64: docker.io/beclab/ggml-org-llama.cpp:server-cuda12-b10969
    nvidiaGb10: docker.io/beclab/ggml-org-llama.cpp:server-cuda12-b10969
    amdGpu: docker.io/beclab/ggml-org-llama.cpp:server-rocm-b10731
    intel: docker.io/beclab/ggml-org-llama.cpp:server-intel-b10884
    intelGpu: docker.io/beclab/ggml-org-llama.cpp:server-intel-b10752

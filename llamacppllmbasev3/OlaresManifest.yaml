spec:
  onlyAdmin: true
  versionName: 'b11515'
  upgradeDescription: |
    Chart 1.2.39 — Upgrade llama.cpp from `server-cuda12-b10969` to `server-cuda12-b11515` (546 upstream commits).

    **Model compatibility**
    - Add K2 Horizon dense and MoVA ([#29535](https://github.com/ggml-org/llama.cpp/pull/29535)), Ling 3.0 VL ([#29151](https://github.com/ggml-org/llama.cpp/pull/29151)), MiMo-V2.6 ([#29257](https://github.com/ggml-org/llama.cpp/pull/29257)), the Gemma4 DSpark draft backbone ([#29226](https://github.com/ggml-org/llama.cpp/pull/29226)), Cohere2 vision ([#30062](https://github.com/ggml-org/llama.cpp/pull/30062)), and the LFM2.5 encoder models ([#29862](https://github.com/ggml-org/llama.cpp/pull/29862)). These require matching model weights and sufficient resources.
    - Add embeddinggemma2 with text, vision, and audio ([#30054](https://github.com/ggml-org/llama.cpp/pull/30054)) and Qwen3.5 embedding conversion ([#27920](https://github.com/ggml-org/llama.cpp/pull/27920)); rerankers gain `classifier_pooling` ([#29627](https://github.com/ggml-org/llama.cpp/pull/29627)) and `classifier_activation` ([#29692](https://github.com/ggml-org/llama.cpp/pull/29692)).
    - Add the decision-model family: nimble ([#29844](https://github.com/ggml-org/llama.cpp/pull/29844)), clef text-only ([#29831](https://github.com/ggml-org/llama.cpp/pull/29831)) with server-side vision input ([#29969](https://github.com/ggml-org/llama.cpp/pull/29969)), pplx-decider ([#30044](https://github.com/ggml-org/llama.cpp/pull/30044)), and LiquidAI d1-3B / d1-omni-600M ([#30110](https://github.com/ggml-org/llama.cpp/pull/30110), [#30114](https://github.com/ggml-org/llama.cpp/pull/30114)).

    **CUDA and performance**
    - Add a GPU cache for MoE experts kept in host memory ([#29887](https://github.com/ggml-org/llama.cpp/pull/29887)), extended across multiple GPUs ([#30112](https://github.com/ggml-org/llama.cpp/pull/30112)). This helps MoE models that do not fit entirely in VRAM.
    - Enable sparse Flash Attention for qwen4 ([#28770](https://github.com/ggml-org/llama.cpp/pull/28770)) and DeepSeek-V4 prefill ([#29298](https://github.com/ggml-org/llama.cpp/pull/29298)), tune Flash Attention for Gemma 4 on Ampere and newer ([#29152](https://github.com/ggml-org/llama.cpp/pull/29152)), and prefer whole-tile FA scheduling for two-stage kernels ([#29435](https://github.com/ggml-org/llama.cpp/pull/29435)).
    - Fuse RMS_NORM with SCALE ([#29393](https://github.com/ggml-org/llama.cpp/pull/29393)) and shared experts into MMVQ ([#29184](https://github.com/ggml-org/llama.cpp/pull/29184)), use MMVF for thin f16/bf16 matmuls at small batch sizes ([#29633](https://github.com/ggml-org/llama.cpp/pull/29633)), optimize NVFP4 accumulation in MMQ ([#29857](https://github.com/ggml-org/llama.cpp/pull/29857)), and speed up model loading ([#29598](https://github.com/ggml-org/llama.cpp/pull/29598)). Gains depend on model and hardware.

    **Server and chat behavior**
    - `GET /models` now reports each model's input and output modalities ([#29987](https://github.com/ggml-org/llama.cpp/pull/29987)), and the server can bind to multiple addresses ([#28690](https://github.com/ggml-org/llama.cpp/pull/28690)).
    - `/v1/embeddings` accepts typed vision/audio/video content ([#29556](https://github.com/ggml-org/llama.cpp/pull/29556)), invalid embedding requests return HTTP 400 ([#29060](https://github.com/ggml-org/llama.cpp/pull/29060)), and RANK pooling allows batch splitting for causal rerankers such as Qwen3 and Qwen3-VL ([#28876](https://github.com/ggml-org/llama.cpp/pull/28876)).
    - Context checkpoints are preserved across slot save/restore ([#26004](https://github.com/ggml-org/llama.cpp/pull/26004)), and temperature, top-p, min-p, and penalties can now be set through env vars ([#27380](https://github.com/ggml-org/llama.cpp/pull/27380)) alongside the existing `LLAMA_ARG_*` style.

    **Stability and memory**
    - Fix a CUDA MMQ memory fault when `n_expert` greatly exceeds `n_ubatch` ([#29941](https://github.com/ggml-org/llama.cpp/pull/29941)), two broken Volta Flash Attention cases ([#29803](https://github.com/ggml-org/llama.cpp/pull/29803)), CUB argsort corruption ([#28389](https://github.com/ggml-org/llama.cpp/pull/28389)), and a transposed-copy path corrupting non-contiguous destinations ([#27663](https://github.com/ggml-org/llama.cpp/pull/27663)).
    - Fix a server crash in the token-counting API during sleep ([#29309](https://github.com/ggml-org/llama.cpp/pull/29309)), router eviction races with the request queue ([#29217](https://github.com/ggml-org/llama.cpp/pull/29217)), and an abort caused by `n_batch` exceeding `n_ubatch` ([#29903](https://github.com/ggml-org/llama.cpp/pull/29903)).
    - Fix restoring a mismatched KV cache rotation by saving exact rotation metadata ([#28498](https://github.com/ggml-org/llama.cpp/pull/28498)).

    These are upstream engine changes; model-specific capabilities are not all validated by this chart update. llm-init remains at `v1.5.0`.
    Full upstream changes: https://github.com/ggml-org/llama.cpp/compare/b10969...b11515

  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. The name of your model in `owner/repo:quant` format, for example `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. If you pick embedding, the chart adds `--embedding` automatically.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. This is required.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Extra llama.cpp options, like `-c 8192 -ngl all -fa on`. To fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level: choose from `debug`, `info`, `warn`, or `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. Accepts values like `8Gi`, `8192`, or `8192Mi`. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.
    
    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then `llama.cpp` starts serving the model when it’s ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp**: Runs the model and serves API requests (port 8081)
    - **llm-init**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Accelerator modes**
    | Mode           | Device            | Details                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `LLAMACPP_REQUIRED_GPU_MEMORY`; use `-ngl all` for full GPU use |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                        |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - To use the GPU, set `-ngl all` in `ENGINE_ARGS`. Use `-ngl all` for full GPU offload.

  developer: ggml-org
  website: https://llama.app/
  sourceCode: https://github.com/ggml-org/llama.cpp
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/ggml-org/llama.cpp?tab=MIT-1-ov-file

  accelerator:
    #   nvidia       — discrete GPU; LLAMACPP_REQUIRED_GPU_MEMORY -> gpumem
    #   nvidia-gb10  — DGX Spark unified memory; same env -> pod memory
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  # Single value for text models; for VLM append a comma-separated mmproj segment:
  #   hf://unsloth/Qwen3.5-2B-GGUF --include model.gguf,hf://unsloth/Qwen3.5-2B-GGUF --include mmproj-F16.gguf
  - envName: MODEL_SOURCE        # example: hf://unsloth/Qwen3-0.6B-GGUF --include Qwen3-0.6B-Q4_K_M.gguf
    required: true
    type: string
    editable: true
    applyOnChange: true    
    description:  "Example: hf://unsloth/Qwen3-0.6B-GGUF --include Qwen3-0.6B-Q4_K_M.gguf. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`."
    regex: "^hf://"
  - envName: MODEL_NAME          # example: unsloth/Qwen3-0.6B-GGUF:Q4_K_M (-hf repo:quant)
    required: true
    type: string
    editable: true
    applyOnChange: true
    description:  "Example: unsloth/Qwen3-0.6B-GGUF:Q4_K_M. The name of your model in `owner/repo:quant` format"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description:  "The model capabilities. Pick what your model supports, if no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # example: -c 8192 -ngl all -fa on
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description:  "Example: -c 8192 -ngl all -fa on. Extra llama.cpp options, to fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`."
  - envName: LOG_LEVEL           # single-select: debug | info | warn | error
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: LLAMACPP_CPU_REQUEST    # default: 200m
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_REQUEST # default: 2Gi
    required: true
    default: "2Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_LIMIT   # default: 35Gi
    required: true
    default: "35Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    description:  "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB. On Spark it sets pod memory."
    regex: "^[0-9]+(Gi|Mi)?$"

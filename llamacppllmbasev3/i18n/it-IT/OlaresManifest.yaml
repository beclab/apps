metadata:
  description: "Base generica del motore llama.cpp. Scegli qualsiasi modello GGUF in installazione via env"
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.47 — Aggiornamento CUDA NVIDIA / Spark da server-cuda12-b10752 a server-cuda12-b10969.

  fullDescription: |
    **NOTA IMPORTANTE**  
    Questa app è un template e non può essere usata da sola. Per usarla, imposta le variabili d'ambiente sotto per collegare un modello specifico.

    **Guida alla configurazione delle variabili d'ambiente**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. Sorgente da cui scaricare il modello. Per file suddivisi includi solo la prima parte; per modelli vision-language aggiungi il proiettore con una virgola, es. `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. Nome del modello in formato `owner/repo:quant`, es. `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. Usato anche come alias OpenAI.
    - `MODEL_MODE`: `chat` o `embedding`. Se scegli embedding, il chart aggiunge automaticamente `--embedding`.
    - `MODEL_SUPPORTS`: Capacità del modello (Vision / Tools / Thinking / None). Scegli ciò che il modello supporta. Obbligatorio.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Opzioni extra llama.cpp, come `-c 8192 -ngl all -fa on`. Per usare appieno la GPU, aggiungi `-ngl all`. Anche valori come `LLAMA_ARG_*=val`.
    - `LOG_LEVEL`: `debug`, `info`, `warn` o `error`. Livello di log: scegli tra `debug`, `info`, `warn` o `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192` o `8192Mi`. Memoria modello necessaria. Accetta valori come `8Gi`, `8192` o `8192Mi`. Su NVIDIA imposta `nvidia.com/gpumem` in MiB; su Spark, la memoria del pod; su `amd-gpu` e `intel-gpu` dichiara la quota di VRAM discreta tramite l'annotazione del pod `gpu.bytetrade.io/required-gpu-memory`.

    **Come funziona**
    Prima `llm-init` scarica il modello e lo prepara, poi `llama.cpp` inizia a servirlo quando è pronto. Le due parti girano separatemente ma condividono file e info di progresso.

    **Stack**
    - **llama.cpp**: Esegue il modello e serve le richieste API (porta 8081)
    - **llm-init**: Scarica il modello, mostra il progresso e fornisce l'API OpenAI sulla porta 8090, facendo proxy verso `llamacpp`.

    **Modalità acceleratore**
    | Modalità       | Dispositivo       | Dettagli                                                           |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Imposta `LLAMACPP_REQUIRED_GPU_MEMORY`; usa `-ngl all` per GPU piena |
    | `nvidia-gb10`  | GPU (Spark)       | Come sopra, ma la memoria è gestita dal pod                          |

    **Archiviazione modelli**
    Tutti i file modello sono nella cartella condivisa `appCommon/huggingface`, montata come `/cache/hf/hub`. App simili usano questa posizione per i modelli.

    **Suggerimenti sulle risorse**
    - CPU, RAM e GPU si autoconfigurano in base al chart; le impostazioni disco sono fisse.
    - Per usare la GPU, imposta `-ngl all` in `ENGINE_ARGS`. Usa `-ngl all` per offload GPU completo.

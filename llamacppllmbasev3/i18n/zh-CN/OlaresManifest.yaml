metadata:
  description: "通用 llama.cpp 引擎基座。在安装时通过环境变量选择任意 GGUF 模型。"
  title: llama.cpp 引擎基座

spec:
  upgradeDescription: |
    Chart 1.2.39 — llama.cpp 镜像从 `server-cuda12-b10969` 升级到 `server-cuda12-b11515`（上游 546 个提交）。

    **模型兼容性**
    - 新增 K2 Horizon dense 与 MoVA（[#29535](https://github.com/ggml-org/llama.cpp/pull/29535)）、Ling 3.0 VL（[#29151](https://github.com/ggml-org/llama.cpp/pull/29151)）、MiMo-V2.6（[#29257](https://github.com/ggml-org/llama.cpp/pull/29257)）、Gemma4 DSpark 草稿骨干（[#29226](https://github.com/ggml-org/llama.cpp/pull/29226)）、Cohere2 视觉（[#30062](https://github.com/ggml-org/llama.cpp/pull/30062)）和 LFM2.5 编码器模型（[#29862](https://github.com/ggml-org/llama.cpp/pull/29862)）；使用时需准备匹配的模型权重和足够的资源。
    - 新增 embeddinggemma2 的文本/视觉/音频支持（[#30054](https://github.com/ggml-org/llama.cpp/pull/30054)）和 Qwen3.5 embedding 模型转换（[#27920](https://github.com/ggml-org/llama.cpp/pull/27920)）；重排序模型新增 `classifier_pooling`（[#29627](https://github.com/ggml-org/llama.cpp/pull/29627)）与 `classifier_activation`（[#29692](https://github.com/ggml-org/llama.cpp/pull/29692)）支持。
    - 新增决策模型系列：nimble（[#29844](https://github.com/ggml-org/llama.cpp/pull/29844)）、clef 纯文本（[#29831](https://github.com/ggml-org/llama.cpp/pull/29831)）及其服务端视觉输入（[#29969](https://github.com/ggml-org/llama.cpp/pull/29969)）、pplx-decider（[#30044](https://github.com/ggml-org/llama.cpp/pull/30044)）、LiquidAI d1-3B 与 d1-omni-600M（[#30110](https://github.com/ggml-org/llama.cpp/pull/30110)、[#30114](https://github.com/ggml-org/llama.cpp/pull/30114)）。

    **CUDA 与性能**
    - 新增驻留主机内存的 MoE 专家 GPU 缓存（[#29887](https://github.com/ggml-org/llama.cpp/pull/29887)），并支持跨多张 GPU（[#30112](https://github.com/ggml-org/llama.cpp/pull/30112)），有助于运行显存装不下的 MoE 模型。
    - 为 qwen4（[#28770](https://github.com/ggml-org/llama.cpp/pull/28770)）和 DeepSeek-V4 prefill（[#29298](https://github.com/ggml-org/llama.cpp/pull/29298)）启用稀疏 Flash Attention，针对 Ampere 及更新架构上的 Gemma 4 调优 FA（[#29152](https://github.com/ggml-org/llama.cpp/pull/29152)），两阶段内核优先使用整 tile 的 FA 调度（[#29435](https://github.com/ggml-org/llama.cpp/pull/29435)）。
    - 融合 RMS_NORM 与 SCALE（[#29393](https://github.com/ggml-org/llama.cpp/pull/29393)）、将共享专家融合进 MMVQ（[#29184](https://github.com/ggml-org/llama.cpp/pull/29184)），小批量下的瘦 f16/bf16 矩阵乘改用 MMVF（[#29633](https://github.com/ggml-org/llama.cpp/pull/29633)），优化 MMQ 的 NVFP4 累加（[#29857](https://github.com/ggml-org/llama.cpp/pull/29857)），并加快模型加载（[#29598](https://github.com/ggml-org/llama.cpp/pull/29598)）。实际收益取决于模型与硬件。

    **服务接口与对话行为**
    - `GET /models` 现在会返回各模型的输入/输出模态（[#29987](https://github.com/ggml-org/llama.cpp/pull/29987)），服务端支持绑定多个地址（[#28690](https://github.com/ggml-org/llama.cpp/pull/28690)）。
    - `/v1/embeddings` 支持带类型的视觉/音频/视频内容（[#29556](https://github.com/ggml-org/llama.cpp/pull/29556)），非法的 embedding 请求返回 HTTP 400（[#29060](https://github.com/ggml-org/llama.cpp/pull/29060)），RANK pooling 支持 Qwen3、Qwen3-VL 等因果重排序模型的批次切分（[#28876](https://github.com/ggml-org/llama.cpp/pull/28876)）。
    - slot 保存/恢复时保留上下文检查点（[#26004](https://github.com/ggml-org/llama.cpp/pull/26004)）；temperature、top-p、min-p 和惩罚项现在也可通过环境变量设置（[#27380](https://github.com/ggml-org/llama.cpp/pull/27380)），与现有 `LLAMA_ARG_*` 写法并存。

    **稳定性与内存**
    - 修复 `n_expert` 远大于 `n_ubatch` 时的 CUDA MMQ 内存错误（[#29941](https://github.com/ggml-org/llama.cpp/pull/29941)）、两处 Volta Flash Attention 失效（[#29803](https://github.com/ggml-org/llama.cpp/pull/29803)）、CUB argsort 数据损坏（[#28389](https://github.com/ggml-org/llama.cpp/pull/28389)）以及转置拷贝路径破坏非连续目标张量的问题（[#27663](https://github.com/ggml-org/llama.cpp/pull/27663)）。
    - 修复 sleep 期间 token 计数 API 导致的服务崩溃（[#29309](https://github.com/ggml-org/llama.cpp/pull/29309)）、路由器驱逐与请求队列的竞态（[#29217](https://github.com/ggml-org/llama.cpp/pull/29217)），以及 `n_batch` 超过 `n_ubatch` 引发的中断（[#29903](https://github.com/ggml-org/llama.cpp/pull/29903)）。
    - 修复 KV cache 旋转信息不匹配时的恢复问题，改为保存精确的旋转元数据（[#28498](https://github.com/ggml-org/llama.cpp/pull/28498)）。

    以上为上游引擎变化，各模型专属能力尚未全部由本次 Chart 升级验证。llm-init 保持 `v1.5.0`。
    完整上游变更：https://github.com/ggml-org/llama.cpp/compare/b10969...b11515

  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<repo> --include <file>.gguf`。模型下载源。对于分割模型文件，只需包含第一部分；对于多模态（视觉-语言）模型，逗号分隔追加投影文件，如 `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`。
    - `MODEL_NAME`：`owner/repo:quant`。您的模型名称，格式如 `owner/repo:quant`，例如 `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`。此项也作为 OpenAI 别名。
    - `MODEL_MODE`：`chat` 或 `embedding`。如选 embedding，图表会自动添加 `--embedding` 参数。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能，必填。
    - `ENGINE_ARGS`：`-c 8192 -ngl all -fa on`。如需完全利用 GPU，请加 `-ngl all`。也可用如 `LLAMA_ARG_*=val` 的参数。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。日志等级，请从上述选项中选择。
    - `LLAMACPP_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型（仅 GPU 模式）所需显存。支持 `8Gi`、`8192`、`8192Mi` 等格式；NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**：运行模型并通过 8081 端口提供 API 服务
    - **llm-init**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `LLAMACPP_REQUIRED_GPU_MEMORY`，用 `-ngl all` 完全利用 GPU |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - 如需 GPU 推理，请在 `ENGINE_ARGS` 中加入 `-ngl all`，请使用 `-ngl all` 以充分利用 GPU


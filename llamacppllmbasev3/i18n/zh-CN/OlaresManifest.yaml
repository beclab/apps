metadata:
  description: "通用 llama.cpp 引擎基座。在安装时通过环境变量选择任意 GGUF 模型。"
  title: llama.cpp 引擎基座

spec:
  upgradeDescription: |
    Chart 1.2.41 — 将 llama.cpp 从 `server-cuda12-b11913` 升级至 `server-cuda13-b12352`（439 个上游提交）。

    **模型与多模态支持**
    - 新增 Liquid AI LFM3 文本、视觉、音频和 omni 模型及 d1 决策模型；新增 Ripple、Kimi-K3.1 文本和视觉模型、Nemotron 3.5 Transcribe。LFM3 增加视频输入、张量切分和 NVFP4 GGUF 支持。
    - 新增 Chatterbox 和 Drama-3 TTS、Gemma 4 流式音频输入，并改进 Qwen3-VL 视频提示词处理。优化 Gemma 4 提示词处理计算图和图像缩放。

    **CUDA、内存与推理**
    - 新增 OCP FP8 量化/CUDA 支持，以及可选逐张量缩放的 FP8 KV cache。融合 MoE 和 NVFP4 的 gate/up 矩阵乘法与 GLU，改进小批量 MMQ 并优化 CUDA graph 复用。性能收益取决于模型和硬件。
    - 支持通过 `--ple` 和 `--shard` 加载外部 PLE/模型分片，新增 MoE 专家缓存（未命中时由 CPU 执行）及 NCCL 多节点张量并行。这些是上游能力，本 Chart 不会自动配置相应部署选项。
    - 修复量化 KV 状态复制大小、KV 位移、MTP 隐藏状态恢复和推测解码检查点。缩小 CUDA 虚拟地址预留量并在失败时重试；内核 cluster 维度变化时重建 CUDA graph 实例。

    **服务器与 API**
    - `/v1/realtime` 增加对话、转录和工具调用，新增 OpenAI 兼容的 `/v1/audio/speech`。改进 Responses API 的 JSON schema 处理，并支持 `extra_params`。
    - 检查点改用引用计数；请求使用服务器状态期间保持唤醒；客户端断开或超时时取消 MCP 工具调用。改进工具参数转义和 JSON schema 语法处理。

    **升级注意事项**
    - 本次镜像从 CUDA 12 切换至 CUDA 13。部署前请确认主机 NVIDIA 驱动兼容性；镜像提供 Linux amd64 和 arm64 架构。
    - 加强 CORS 来源和端口校验及 DNS rebinding 防护。CORS 代理仅可访问公网地址；访问私有媒体 URL 需显式设置 `--media-allow-private-urls`。
    - 在非回环地址启用内置工具或 MCP 时，需设置 API key 或显式传入 `--allow-unauthenticated-tools`。Hugging Face 凭据仅发送至 huggingface.co 主机。升级前请检查自定义 ENGINE_ARGS 和集成配置。

    以上为上游引擎更新；模型特定能力需要匹配的权重及运行验证。llm-init 保持 `v1.5.0`。
    完整上游变更：https://github.com/ggml-org/llama.cpp/compare/b11913...b12352

  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<repo> --include <file>.gguf`。模型下载源。对于分割模型文件，只需包含第一部分；对于多模态（视觉-语言）模型，逗号分隔追加投影文件，如 `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`。
    - `MODEL_NAME`：`owner/repo:quant`。您的模型名称，格式如 `owner/repo:quant`，例如 `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`。此项也作为 OpenAI 别名。
    - `MODEL_MODE`：`chat` 或 `embedding`。如选 embedding，图表会自动添加 `--embedding` 参数。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能，必填。
    - `ENGINE_ARGS`：`-c 8192 -ngl all -fa on`。如需完全利用 GPU，请加 `-ngl all`。也可用如 `LLAMA_ARG_*=val` 的参数。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。日志等级，请从上述选项中选择。
    - `LLAMACPP_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型（仅 GPU 模式）所需显存。支持 `8Gi`、`8192`、`8192Mi` 等格式；NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**：运行模型并通过 8081 端口提供 API 服务
    - **llm-init**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `LLAMACPP_REQUIRED_GPU_MEMORY`，用 `-ngl all` 完全利用 GPU |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - 如需 GPU 推理，请在 `ENGINE_ARGS` 中加入 `-ngl all`，请使用 `-ngl all` 以充分利用 GPU


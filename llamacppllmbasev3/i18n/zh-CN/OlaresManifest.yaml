metadata:
  description: "通用 llama.cpp 引擎基座。在安装时通过环境变量选择任意 GGUF 模型。"
  title: llama.cpp 引擎基座

spec:
  upgradeDescription: |
    Chart 1.2.38 — llama.cpp 镜像从 `server-cuda12-b10588` 升级到 `server-cuda12-b10969`。

    **模型兼容性**
    - 新增 Qwen3.8-Flash-Next（`qwen4exp`）文本与视觉架构支持（[#27742](https://github.com/ggml-org/llama.cpp/pull/27742)），并包含后续循环状态回滚和推理修复。
    - 新增 NVIDIA Nemotron-3-Puzzle-75B-A9B（[#25444](https://github.com/ggml-org/llama.cpp/pull/25444)）和 Tencent Hy 4 预览架构支持（[#28127](https://github.com/ggml-org/llama.cpp/pull/28127)）；使用时需准备匹配的模型权重和足够的资源。

    **推测解码与 CUDA**
    - 新增 DFlash2 草稿模型支持（[#27342](https://github.com/ggml-org/llama.cpp/pull/27342)），需配置兼容的草稿权重。上游提示：2026 年 8 月 27 日前转换的 DFlash2 GGUF 文件需重新转换，以保证视觉功能正确。
    - 新增 DeepSeek-V4/GLM 的 CUDA 稀疏 Flash Attention（[#27970](https://github.com/ggml-org/llama.cpp/pull/27970)），将 MoE 融合优化扩展到推测解码（[#27621](https://github.com/ggml-org/llama.cpp/pull/27621)），优化 Q4_K/Q5_K 解码和 DGX Spark 预取（[#26705](https://github.com/ggml-org/llama.cpp/pull/26705)）。实际收益取决于模型与硬件。

    **服务接口与对话行为**
    - 新增 `--kv-unified-per-slot`，可在统一 KV 缓存模式下限制每个请求槽的上下文，`-c` 控制总缓存池（[#24124](https://github.com/ggml-org/llama.cpp/pull/24124)）。本次升级不会自动修改实例的上下文配置。
    - 对支持的聊天模板，默认启用 `preserve_reasoning`；可通过 `--no-reasoning-preserve` 关闭（[#28174](https://github.com/ggml-org/llama.cpp/pull/28174)）。
    - `input_audio`、`input_video` 请求支持 `data:` URL，修复媒体解码错误（[#27735](https://github.com/ggml-org/llama.cpp/pull/27735)）；需使用兼容的多模态模型与客户端。

    **稳定性与内存**
    - 降低启用张量重排时模型加载阶段的内存峰值（[#27483](https://github.com/ggml-org/llama.cpp/pull/27483)）。
    - 修复模型路由器并发请求的 LRU 卡住问题（[#28539](https://github.com/ggml-org/llama.cpp/pull/28539)）、图片输入后的推测解码（[#28715](https://github.com/ggml-org/llama.cpp/pull/28715)）和 CUDA Flash Attention 同步问题（[#27870](https://github.com/ggml-org/llama.cpp/pull/27870)）。

    以上为上游引擎变化，各模型专属能力尚未全部由本次 Chart 升级验证。llm-init 保持 `v1.5.0`。
    完整上游变更：https://github.com/ggml-org/llama.cpp/compare/b10588...b10969

  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<repo> --include <file>.gguf`。模型下载源。对于分割模型文件，只需包含第一部分；对于多模态（视觉-语言）模型，逗号分隔追加投影文件，如 `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`。
    - `MODEL_NAME`：`owner/repo:quant`。您的模型名称，格式如 `owner/repo:quant`，例如 `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`。此项也作为 OpenAI 别名。
    - `MODEL_MODE`：`chat` 或 `embedding`。如选 embedding，图表会自动添加 `--embedding` 参数。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能，必填。
    - `ENGINE_ARGS`：`-c 8192 -ngl all -fa on`。如需完全利用 GPU，请加 `-ngl all`。也可用如 `LLAMA_ARG_*=val` 的参数。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。日志等级，请从上述选项中选择。
    - `LLAMACPP_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型（仅 GPU 模式）所需显存。支持 `8Gi`、`8192`、`8192Mi` 等格式；NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**：运行模型并通过 8081 端口提供 API 服务
    - **llm-init**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `LLAMACPP_REQUIRED_GPU_MEMORY`，用 `-ngl all` 完全利用 GPU |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - 如需 GPU 推理，请在 `ENGINE_ARGS` 中加入 `-ngl all`，请使用 `-ngl all` 以充分利用 GPU


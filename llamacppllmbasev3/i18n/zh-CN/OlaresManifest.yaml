metadata:
  description: "通用 llama.cpp 引擎基座。在安装时通过环境变量选择任意 GGUF 模型。"
  title: llama.cpp 引擎基座

spec:
  upgradeDescription: |
    Chart 1.2.40 — llama.cpp 镜像从 `server-cuda12-b11515` 升级到 `server-cuda12-b11913`（上游 398 个提交，llama.cpp 0.7.0）。

    **模型兼容性**
    - 新增 DeepSeek-V4.1-Flash（[#31086](https://github.com/ggml-org/llama.cpp/pull/31086)）、Nemotron Super 3.5 VL 与 Nemotron Bolt 74B A9B（[#30520](https://github.com/ggml-org/llama.cpp/pull/30520)）、Nemotron-3(.5)-Embed（[#30877](https://github.com/ggml-org/llama.cpp/pull/30877)），以及非标准 Nemotron GQA、BPE 和 domyn-small 分词（[#23343](https://github.com/ggml-org/llama.cpp/pull/23343)）；使用时需准备匹配的模型权重和足够的资源。
    - 新增 Muse Spark Open 的文本/视觉/音频支持（[#30616](https://github.com/ggml-org/llama.cpp/pull/30616)）、MiniCPM-V 4.7（[#29416](https://github.com/ggml-org/llama.cpp/pull/29416)）、MiniCPM-OCR 1.0（[#30979](https://github.com/ggml-org/llama.cpp/pull/30979)）、SenseNova U1（[#28919](https://github.com/ggml-org/llama.cpp/pull/28919)）、Flint（[#30928](https://github.com/ggml-org/llama.cpp/pull/30928)）、Kolibri-1（[#30673](https://github.com/ggml-org/llama.cpp/pull/30673)）、H2O-Lightning-4B（[#30361](https://github.com/ggml-org/llama.cpp/pull/30361)）、Granite Switch Decision（[#30676](https://github.com/ggml-org/llama.cpp/pull/30676)、[#30693](https://github.com/ggml-org/llama.cpp/pull/30693)）、Beam（[#30670](https://github.com/ggml-org/llama.cpp/pull/30670)）、Prism Bonsai 2 27B（[#29600](https://github.com/ggml-org/llama.cpp/pull/29600)）、maion-coder（[#29778](https://github.com/ggml-org/llama.cpp/pull/29778)），以及 vLLM decision 2 / d3 模型（[#30378](https://github.com/ggml-org/llama.cpp/pull/30378)、[#30383](https://github.com/ggml-org/llama.cpp/pull/30383)）。
    - 新增 Soprano TTS（[#28607](https://github.com/ggml-org/llama.cpp/pull/28607)）和 Voxtral 实时音频（[#30629](https://github.com/ggml-org/llama.cpp/pull/30629)）。Qwen3.8 Flash Next 的 MTP 路径可以接收图像 embedding（[#30397](https://github.com/ggml-org/llama.cpp/pull/30397)）。LFM2 的图像缩放与切块改为与 transformers 布局一致（[#30943](https://github.com/ggml-org/llama.cpp/pull/30943)、[#30261](https://github.com/ggml-org/llama.cpp/pull/30261)、[#30840](https://github.com/ggml-org/llama.cpp/pull/30840)）。
    - Laguna MoE 启用与 Mistral4、Mellum、Flint 相同的按专家 token 激活缩放（[#31147](https://github.com/ggml-org/llama.cpp/pull/31147)、[#30861](https://github.com/ggml-org/llama.cpp/pull/30861)）。这些架构拒绝 `--split-mode tensor`，因为一行被切到多张设备上时，缩放会基于不完整的最大值（[#31081](https://github.com/ggml-org/llama.cpp/pull/31081)）。

    **CUDA 与性能**
    - 将 FFN 的 gate/up 矩阵乘与 GLU 融合为一次 MMQ 启动，覆盖 prompt 处理的批量（[#29948](https://github.com/ggml-org/llama.cpp/pull/29948)）；融合分组专家的 top-k（[#29181](https://github.com/ggml-org/llama.cpp/pull/29181)）；融合 Qwen4exp 的 SCALE → SIGMOID → SCALE → hc_post 链（[#30602](https://github.com/ggml-org/llama.cpp/pull/30602)）。新增分块 GDN 内核（[#29353](https://github.com/ggml-org/llama.cpp/pull/29353)）、更快的低比特 MMVQ（[#30517](https://github.com/ggml-org/llama.cpp/pull/30517)）和 float4 RMS norm 加载（[#29720](https://github.com/ggml-org/llama.cpp/pull/29720)），并将 CUDA graph 切成小块以摊薄启动开销（[#30804](https://github.com/ggml-org/llama.cpp/pull/30804)）。实际收益取决于模型与硬件。
    - 支持 SSM 卷积核大小 7（[#30873](https://github.com/ggml-org/llama.cpp/pull/30873)），去掉 SSM_SCAN 之后的多余拷贝（[#29807](https://github.com/ggml-org/llama.cpp/pull/29807)）。CUDA pinned host 缓冲上限为 4 GB（[#30449](https://github.com/ggml-org/llama.cpp/pull/30449)）。

    **服务接口与对话行为**
    - 新增面向语音模型的 `POST /tts`（[#26603](https://github.com/ggml-org/llama.cpp/pull/26603)），以及兼容 OpenAI 的 `/v1/realtime` WebSocket 实时转写（[#30636](https://github.com/ggml-org/llama.cpp/pull/30636)、[#30994](https://github.com/ggml-org/llama.cpp/pull/30994)）。
    - `/rerank` 支持带类型的视觉/音频/视频内容（[#29625](https://github.com/ggml-org/llama.cpp/pull/29625)）。`/v1/messages` 会转发 llama.cpp 采样参数（[#30856](https://github.com/ggml-org/llama.cpp/pull/30856)）并保留 `id_slot`（[#28554](https://github.com/ggml-org/llama.cpp/pull/28554)）。推测解码可以返回 logprobs（[#27196](https://github.com/ggml-org/llama.cpp/pull/27196)），也可以用 LiliCorr 选择草稿 token（[#30506](https://github.com/ggml-org/llama.cpp/pull/30506)）。
    - 语法解析限制递归深度（[#31153](https://github.com/ggml-org/llama.cpp/pull/31153)）；聊天 JSON 嵌套超过 128 层时会在遍历前拒绝（[#30242](https://github.com/ggml-org/llama.cpp/pull/30242)）。HTTP 客户端遵循 `HTTP_PROXY` 和 `HTTPS_PROXY`（[#21752](https://github.com/ggml-org/llama.cpp/pull/21752)），不同进程可以同时下载模型（[#29312](https://github.com/ggml-org/llama.cpp/pull/29312)）。

    **稳定性与内存**
    - 内存池归还缓冲后重新捕获 CUDA graph，避免回放时写入失效指针（[#26771](https://github.com/ggml-org/llama.cpp/pull/26771)）。修复向量 Flash Attention 的共享内存竞态（[#30573](https://github.com/ggml-org/llama.cpp/pull/30573)），以及 `nbatch_combine` 不等于 `DKQ/2` 时 f16 Flash Attention tile 内核的竞态（[#30103](https://github.com/ggml-org/llama.cpp/pull/30103)）。
    - 修复 `n > 1` 时 `usage.completion_tokens` 少计（[#29486](https://github.com/ggml-org/llama.cpp/pull/29486)）、滑动窗口复用阈值差 2（[#30580](https://github.com/ggml-org/llama.cpp/pull/30580)）、Responses API 事件缺少 `output_index`（[#30863](https://github.com/ggml-org/llama.cpp/pull/30863)），以及路由器取消没有传到子进程的问题（[#29707](https://github.com/ggml-org/llama.cpp/pull/29707)）。
    - 修复每次 sleep/resume 都重复累加 mmproj 内存余量的问题（[#28233](https://github.com/ggml-org/llama.cpp/pull/28233)），以及 DRY sequence breaker 耗尽 CPU 和内存的问题（[#31035](https://github.com/ggml-org/llama.cpp/pull/31035)）。

    以上为上游引擎变化，各模型专属能力尚未全部由本次 Chart 升级验证。llm-init 保持 `v1.5.0`。
    完整上游变更：https://github.com/ggml-org/llama.cpp/compare/b11515...b11913

  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<repo> --include <file>.gguf`。模型下载源。对于分割模型文件，只需包含第一部分；对于多模态（视觉-语言）模型，逗号分隔追加投影文件，如 `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`。
    - `MODEL_NAME`：`owner/repo:quant`。您的模型名称，格式如 `owner/repo:quant`，例如 `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`。此项也作为 OpenAI 别名。
    - `MODEL_MODE`：`chat` 或 `embedding`。如选 embedding，图表会自动添加 `--embedding` 参数。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能，必填。
    - `ENGINE_ARGS`：`-c 8192 -ngl all -fa on`。如需完全利用 GPU，请加 `-ngl all`。也可用如 `LLAMA_ARG_*=val` 的参数。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。日志等级，请从上述选项中选择。
    - `LLAMACPP_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型（仅 GPU 模式）所需显存。支持 `8Gi`、`8192`、`8192Mi` 等格式；NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**：运行模型并通过 8081 端口提供 API 服务
    - **llm-init**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `LLAMACPP_REQUIRED_GPU_MEMORY`，用 `-ngl all` 完全利用 GPU |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - 如需 GPU 推理，请在 `ENGINE_ARGS` 中加入 `-ngl all`，请使用 `-ngl all` 以充分利用 GPU


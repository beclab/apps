metadata:
  description: "Generic llama.cpp engine base. Pick any GGUF model at install via env."
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.38 — Upgrade llama.cpp from `server-cuda12-b10588` to `server-cuda12-b10969`.

    **Model compatibility**
    - Add Qwen3.8-Flash-Next (`qwen4exp`) text/vision architecture support ([#27742](https://github.com/ggml-org/llama.cpp/pull/27742)), with subsequent recurrent-state rollback and inference fixes.
    - Add NVIDIA Nemotron-3-Puzzle-75B-A9B ([#25444](https://github.com/ggml-org/llama.cpp/pull/25444)) and Tencent Hy 4 preview architecture support ([#28127](https://github.com/ggml-org/llama.cpp/pull/28127)). These require matching model weights and sufficient resources.

    **Speculative decoding and CUDA**
    - Add DFlash2 draft-model support ([#27342](https://github.com/ggml-org/llama.cpp/pull/27342)); requires a compatible draft checkpoint. Upstream notes that DFlash2 GGUF files converted before August 27, 2026 need reconversion for vision correctness.
    - Add CUDA sparse Flash Attention for DeepSeek-V4/GLM ([#27970](https://github.com/ggml-org/llama.cpp/pull/27970)), extend MoE fusion to speculative decoding ([#27621](https://github.com/ggml-org/llama.cpp/pull/27621)), and optimize Q4_K/Q5_K decoding with DGX Spark prefetch improvements ([#26705](https://github.com/ggml-org/llama.cpp/pull/26705)). Gains depend on model and hardware.

    **Server and chat behavior**
    - Add `--kv-unified-per-slot` to cap each request slot when using a unified KV cache; `-c` controls the total pool ([#24124](https://github.com/ggml-org/llama.cpp/pull/24124)). This update does not change the configured context size automatically.
    - Enable `preserve_reasoning` by default for chat templates that support it; use `--no-reasoning-preserve` to disable ([#28174](https://github.com/ggml-org/llama.cpp/pull/28174)).
    - Accept `data:` URLs in `input_audio` and `input_video` requests, fixing media decoding errors ([#27735](https://github.com/ggml-org/llama.cpp/pull/27735)); requires a compatible multimodal model and client.

    **Stability and memory**
    - Reduce peak RAM during model loading when tensor repacking is enabled ([#27483](https://github.com/ggml-org/llama.cpp/pull/27483)).
    - Fix the model-router LRU hang with concurrent requests ([#28539](https://github.com/ggml-org/llama.cpp/pull/28539)), speculative decoding after image input ([#28715](https://github.com/ggml-org/llama.cpp/pull/28715)), and CUDA Flash Attention synchronization ([#27870](https://github.com/ggml-org/llama.cpp/pull/27870)).

    These are upstream engine changes; model-specific capabilities are not all validated by this chart update. llm-init remains at `v1.5.0`.
    Full upstream changes: https://github.com/ggml-org/llama.cpp/compare/b10588...b10969

  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. The name of your model in `owner/repo:quant` format, for example `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. If you pick embedding, the chart adds `--embedding` automatically.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. This is required.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Extra llama.cpp options, like `-c 8192 -ngl all -fa on`. To fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level: choose from `debug`, `info`, `warn`, or `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. Accepts values like `8Gi`, `8192`, or `8192Mi`. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.
    
    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then `llama.cpp` starts serving the model when it’s ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp**: Runs the model and serves API requests (port 8081)
    - **llm-init**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Accelerator modes**
    | Mode           | Device            | Details                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `LLAMACPP_REQUIRED_GPU_MEMORY`; use `-ngl all` for full GPU use |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                        |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - To use the GPU, set `-ngl all` in `ENGINE_ARGS`. Use `-ngl all` for full GPU offload.

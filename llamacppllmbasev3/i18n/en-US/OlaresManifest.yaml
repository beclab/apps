metadata:
  description: "Generic llama.cpp engine base. Pick any GGUF model at install via env."
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.41 — Upgrade llama.cpp from `server-cuda12-b11913` to `server-cuda13-b12352` (439 upstream commits).

    **Models and multimodal support**
    - Adds Liquid AI LFM3 text, vision, audio and omni models, plus d1 decision models; adds Ripple, Kimi-K3.1 text and vision, and Nemotron 3.5 Transcribe. LFM3 gains video input, tensor splitting and NVFP4 GGUF support.
    - Adds Chatterbox and Drama-3 TTS, Gemma 4 streaming audio input, and improved Qwen3-VL video prompt handling. Gemma 4 prompt-processing graphs and image resizing are improved.

    **CUDA, memory and inference**
    - Adds OCP FP8 quantization/CUDA support and FP8 KV caches with optional per-tensor scales. Fuses MoE and NVFP4 gate/up matmuls with GLU, improves small-batch MMQ, and optimizes CUDA graph reuse. Performance depends on model and hardware.
    - Adds external PLE/shard loading via `--ple` and `--shard`, MoE expert caching with CPU execution for cache misses, and NCCL multi-node tensor parallelism. These are upstream capabilities, not deployment options configured by this chart.
    - Fixes quantized KV state copy sizes, KV shifting, MTP hidden-state restoration and speculative checkpoints. CUDA virtual-address reservations are smaller and retry on failure; graph instances are rebuilt when kernel cluster dimensions change.

    **Server and API**
    - Extends `/v1/realtime` with conversation, transcription and tool calls; adds OpenAI-compatible `/v1/audio/speech`. Improves Responses API JSON schema handling and accepts `extra_params`.
    - Uses reference-counted checkpoints, keeps the server awake while requests use its state, and cancels MCP tool calls on disconnect or timeout. Improves tool-argument escaping and JSON schema grammar handling.

    **Upgrade considerations**
    - This image switches from CUDA 12 to CUDA 13. Verify host NVIDIA driver compatibility before deployment; both Linux amd64 and arm64 images are provided.
    - CORS origin/port checks are stricter and protect against DNS rebinding. The CORS proxy can only access public addresses; private media URLs now require `--media-allow-private-urls`.
    - Enabling built-in tools or MCP on a non-loopback address requires an API key or explicit `--allow-unauthenticated-tools`. Hugging Face credentials are restricted to huggingface.co hosts. Review custom ENGINE_ARGS and integrations before upgrading.

    These are upstream engine changes; model-specific capabilities require matching weights and runtime validation. llm-init remains at `v1.5.0`.
    Full upstream changes: https://github.com/ggml-org/llama.cpp/compare/b11913...b12352

  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. The name of your model in `owner/repo:quant` format, for example `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. If you pick embedding, the chart adds `--embedding` automatically.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. This is required.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Extra llama.cpp options, like `-c 8192 -ngl all -fa on`. To fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level: choose from `debug`, `info`, `warn`, or `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. Accepts values like `8Gi`, `8192`, or `8192Mi`. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.
    
    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then `llama.cpp` starts serving the model when it’s ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp**: Runs the model and serves API requests (port 8081)
    - **llm-init**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Accelerator modes**
    | Mode           | Device            | Details                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `LLAMACPP_REQUIRED_GPU_MEMORY`; use `-ngl all` for full GPU use |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                        |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - To use the GPU, set `-ngl all` in `ENGINE_ARGS`. Use `-ngl all` for full GPU offload.

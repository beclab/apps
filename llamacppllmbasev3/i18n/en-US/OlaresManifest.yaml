metadata:
  description: "Generic llama.cpp engine base. Pick any GGUF model at install via env."
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.40 — Upgrade llama.cpp from `server-cuda12-b11515` to `server-cuda12-b11913` (398 upstream commits; upstream llama.cpp 0.7.0).

    **Model compatibility**
    - Add DeepSeek-V4.1-Flash ([#31086](https://github.com/ggml-org/llama.cpp/pull/31086)), Nemotron Super 3.5 VL and Nemotron Bolt 74B A9B ([#30520](https://github.com/ggml-org/llama.cpp/pull/30520)), Nemotron-3(.5)-Embed ([#30877](https://github.com/ggml-org/llama.cpp/pull/30877)), and non-standard Nemotron GQA, BPE, and domyn-small tokenization ([#23343](https://github.com/ggml-org/llama.cpp/pull/23343)). These require matching model weights and sufficient resources.
    - Add Muse Spark Open with text, vision, and audio ([#30616](https://github.com/ggml-org/llama.cpp/pull/30616)), MiniCPM-V 4.7 ([#29416](https://github.com/ggml-org/llama.cpp/pull/29416)), MiniCPM-OCR 1.0 ([#30979](https://github.com/ggml-org/llama.cpp/pull/30979)), SenseNova U1 ([#28919](https://github.com/ggml-org/llama.cpp/pull/28919)), Flint ([#30928](https://github.com/ggml-org/llama.cpp/pull/30928)), Kolibri-1 ([#30673](https://github.com/ggml-org/llama.cpp/pull/30673)), H2O-Lightning-4B ([#30361](https://github.com/ggml-org/llama.cpp/pull/30361)), Granite Switch Decision ([#30676](https://github.com/ggml-org/llama.cpp/pull/30676), [#30693](https://github.com/ggml-org/llama.cpp/pull/30693)), Beam ([#30670](https://github.com/ggml-org/llama.cpp/pull/30670)), Prism Bonsai 2 27B ([#29600](https://github.com/ggml-org/llama.cpp/pull/29600)), maion-coder ([#29778](https://github.com/ggml-org/llama.cpp/pull/29778)), and the vLLM decision 2 / d3 models ([#30378](https://github.com/ggml-org/llama.cpp/pull/30378), [#30383](https://github.com/ggml-org/llama.cpp/pull/30383)).
    - Add Soprano TTS ([#28607](https://github.com/ggml-org/llama.cpp/pull/28607)) and Voxtral realtime audio ([#30629](https://github.com/ggml-org/llama.cpp/pull/30629)). Qwen3.8 Flash Next can take image embeddings on its MTP path ([#30397](https://github.com/ggml-org/llama.cpp/pull/30397)). LFM2 image resize and tiling now follow the transformers layout ([#30943](https://github.com/ggml-org/llama.cpp/pull/30943), [#30261](https://github.com/ggml-org/llama.cpp/pull/30261), [#30840](https://github.com/ggml-org/llama.cpp/pull/30840)).
    - Laguna MoE uses the same per-expert activation rescaling as Mistral4, Mellum, and Flint ([#31147](https://github.com/ggml-org/llama.cpp/pull/31147), [#30861](https://github.com/ggml-org/llama.cpp/pull/30861)). Those architectures reject `--split-mode tensor`, because a row split across devices would rescale from a partial maximum ([#31081](https://github.com/ggml-org/llama.cpp/pull/31081)).

    **CUDA and performance**
    - Fuse FFN gate/up matmuls and GLU into one MMQ launch for prompt processing ([#29948](https://github.com/ggml-org/llama.cpp/pull/29948)), fuse grouped-expert top-k ([#29181](https://github.com/ggml-org/llama.cpp/pull/29181)), and fuse the Qwen4exp SCALE → SIGMOID → SCALE → hc_post chain ([#30602](https://github.com/ggml-org/llama.cpp/pull/30602)). Add a chunked GDN kernel ([#29353](https://github.com/ggml-org/llama.cpp/pull/29353)), faster low-bit MMVQ ([#30517](https://github.com/ggml-org/llama.cpp/pull/30517)), and float4 RMS norm loads ([#29720](https://github.com/ggml-org/llama.cpp/pull/29720)). Chunk CUDA graphs so launch cost is amortized ([#30804](https://github.com/ggml-org/llama.cpp/pull/30804)). Gains depend on model and hardware.
    - Support SSM convolution kernel size 7 ([#30873](https://github.com/ggml-org/llama.cpp/pull/30873)) and drop redundant copies after SSM_SCAN ([#29807](https://github.com/ggml-org/llama.cpp/pull/29807)). CUDA pinned host buffers are capped at 4 GB ([#30449](https://github.com/ggml-org/llama.cpp/pull/30449)).

    **Server and chat behavior**
    - Add `POST /tts` for speech models ([#26603](https://github.com/ggml-org/llama.cpp/pull/26603)) and an OpenAI-compatible `/v1/realtime` WebSocket for live transcription ([#30636](https://github.com/ggml-org/llama.cpp/pull/30636), [#30994](https://github.com/ggml-org/llama.cpp/pull/30994)).
    - `/rerank` accepts typed vision, audio, and video content ([#29625](https://github.com/ggml-org/llama.cpp/pull/29625)). `/v1/messages` forwards llama.cpp sampling parameters ([#30856](https://github.com/ggml-org/llama.cpp/pull/30856)) and keeps `id_slot` ([#28554](https://github.com/ggml-org/llama.cpp/pull/28554)). Speculative decoding can return logprobs ([#27196](https://github.com/ggml-org/llama.cpp/pull/27196)) and can select drafts with LiliCorr ([#30506](https://github.com/ggml-org/llama.cpp/pull/30506)).
    - Grammar parsing limits recursion depth ([#31153](https://github.com/ggml-org/llama.cpp/pull/31153)), and chat JSON nested more than 128 levels is rejected before it is walked ([#30242](https://github.com/ggml-org/llama.cpp/pull/30242)). The HTTP client honors `HTTP_PROXY` and `HTTPS_PROXY` ([#21752](https://github.com/ggml-org/llama.cpp/pull/21752)), and model downloads from different processes can run at the same time ([#29312](https://github.com/ggml-org/llama.cpp/pull/29312)).

    **Stability and memory**
    - Recapture CUDA graphs after the memory pool flushes, so replay does not write through a stale pointer ([#26771](https://github.com/ggml-org/llama.cpp/pull/26771)). Fix a shared-memory race in vector Flash Attention ([#30573](https://github.com/ggml-org/llama.cpp/pull/30573)) and a tile race in the f16 Flash Attention kernel when `nbatch_combine` is not `DKQ/2` ([#30103](https://github.com/ggml-org/llama.cpp/pull/30103)).
    - Fix `usage.completion_tokens` under-counting when `n > 1` ([#29486](https://github.com/ggml-org/llama.cpp/pull/29486)), an off-by-two in the sliding-window reuse threshold ([#30580](https://github.com/ggml-org/llama.cpp/pull/30580)), missing `output_index` on Responses API events ([#30863](https://github.com/ggml-org/llama.cpp/pull/30863)), and router cancellation that did not reach the child process ([#29707](https://github.com/ggml-org/llama.cpp/pull/29707)).
    - Stop adding the mmproj memory margin again on every sleep/resume ([#28233](https://github.com/ggml-org/llama.cpp/pull/28233)), and fix a DRY sequence breaker that could exhaust CPU and memory ([#31035](https://github.com/ggml-org/llama.cpp/pull/31035)).

    These are upstream engine changes; model-specific capabilities are not all validated by this chart update. llm-init remains at `v1.5.0`.
    Full upstream changes: https://github.com/ggml-org/llama.cpp/compare/b11515...b11913

  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. The name of your model in `owner/repo:quant` format, for example `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. If you pick embedding, the chart adds `--embedding` automatically.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. This is required.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Extra llama.cpp options, like `-c 8192 -ngl all -fa on`. To fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level: choose from `debug`, `info`, `warn`, or `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. Accepts values like `8Gi`, `8192`, or `8192Mi`. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.
    
    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then `llama.cpp` starts serving the model when it’s ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp**: Runs the model and serves API requests (port 8081)
    - **llm-init**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Accelerator modes**
    | Mode           | Device            | Details                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `LLAMACPP_REQUIRED_GPU_MEMORY`; use `-ngl all` for full GPU use |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                        |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - To use the GPU, set `-ngl all` in `ENGINE_ARGS`. Use `-ngl all` for full GPU offload.

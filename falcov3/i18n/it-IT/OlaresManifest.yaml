metadata:
  title: Falco
  description: Strumento di runtime security cloud native per rilevare comportamenti anomali
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un’app condivisa. Verrà installato un solo servizio in tutto il sistema Olares. Tuttavia ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall’Admin Olares.

    **PANORAMICA**
    Falco è uno strumento di runtime security cloud native per sistemi operativi Linux. È progettato per rilevare e segnalare comportamenti anomali e potenziali minacce di sicurezza in tempo reale.

    Nel nucleo, Falco è un agente di monitoraggio e detection del kernel che osserva eventi, come le syscall, in base a regole personalizzate. Falco può arricchire questi eventi integrando metadati dal runtime dei container e da Kubernetes.

    **Funzionalità**
    * Rilevamento minacce in tempo reale basato sul monitoraggio delle syscall
    * Motore di regole personalizzato per definire policy di sicurezza
    * Consapevole di container e Kubernetes con arricchimento dei metadati
    * Supporto del driver eBPF moderno (nessun modulo kernel richiesto)
    * Sistema di plugin per estendere le fonti dati
    * Canali di output multipli: stdout, file, syslog, HTTP, gRPC
    * Endpoint metriche Prometheus
    * Progetto CNCF graduated usato in produzione da varie organizzazioni
    * API health check per monitorare lo stato di Falco

    Note: Falco è un demone di sicurezza a livello kernel. Richiede accesso privilegiato per funzionare correttamente e può avere limitazioni negli ambienti container standard.
  upgradeDescription: |
    Passaggio dell’immagine reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all’immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell’immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring Bitnami-specifico `OPENRESTY_CONF_FILE`.


    Migrazione di Falco al pattern shared-app apiVersion v3 (falco → falcov3).

    **Cosa è cambiato**

    - **Architettura**: subchart falco/falcoserver uniti in un unico chart; Deployment/Service dell’ingresso nginx rinominati in falcov3 per allinearsi all’appid nella verifica workload v3.
    - **Scaling**: `workloadReplicas` per i workload di ingresso falcov3 e falco-central.
    - **Runtime**: Falco 0.43.0, falcosidekick 2.33.0, falcosidekick-ui 2.3.0.

metadata:
  title: Falco
  description: 異常動作を検出するクラウドネイティブなランタイムセキュリティツール
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体にサービスは 1 つだけインストールされます。ただし、各ユーザーは Olares Admin がインストールしたサービスにアクセス・利用するため、デスクトップエントリをインストールする必要があります。

    **概要**
    Falco は Linux オペレーティングシステム向けのクラウドネイティブなランタイムセキュリティツールです。異常な動作や潜在的なセキュリティ脅威をリアルタイムで検出・アラートするよう設計されています。

    コアでは、Falco はカスタムルールに基づき syscall などのイベントを監視するカーネル監視・検出エージェントです。コンテナランタイムや Kubernetes のメタデータを統合してこれらのイベントを強化できます。

    **機能**
    * syscall 監視に基づくリアルタイム脅威検出
    * セキュリティポリシーを定義するカスタムルールエンジン
    * メタデータ強化によるコンテナ／Kubernetes 対応
    * モダンな eBPF ドライバーのサポート（カーネルモジュール不要）
    * データソース拡張のためのプラグインシステム
    * 複数の出力チャネル: stdout、ファイル、syslog、HTTP、gRPC
    * Prometheus メトリクスエンドポイント
    * さまざまな組織の本番環境で使われる CNCF graduated プロジェクト
    * Falco ステータス監視用ヘルスチェック API

    Note: Falco はカーネルレベルのセキュリティデーモンです。正常動作には特権アクセスが必要で、標準的なコンテナ環境では制限がある場合があります。
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定マウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。


    Falco を apiVersion v3 共有アプリパターンへ移行（falco → falcov3）。

    **変更点**

    - **アーキテクチャ**: falco/falcoserver サブチャートを単一チャートに統合。nginx 入口の Deployment/Service を falcov3 に改名し、v3 ワークロード検証の appid に一致。
    - **スケーリング**: falcov3 入口と falco-central ワークロード向けの `workloadReplicas`。
    - **ランタイム**: Falco 0.43.0、falcosidekick 2.33.0、falcosidekick-ui 2.3.0。

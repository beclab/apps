metadata:
  title: Falco
  description: Cloud-natives Runtime-Security-Tool zur Erkennung anormalen Verhaltens
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Es wird nur ein Dienst systemweit in Olares installiert. Jeder Nutzer muss dennoch einen Desktop-Eintrag installieren, um den vom Olares Admin installierten Dienst zu nutzen.

    **ÜBERSICHT**
    Falco ist ein Cloud-Native-Runtime-Security-Tool für Linux-Betriebssysteme. Es erkennt und meldet anormales Verhalten und potenzielle Sicherheitsbedrohungen in Echtzeit.

    Im Kern ist Falco ein Kernel-Monitoring- und Detection-Agent, der Ereignisse wie Syscalls anhand benutzerdefinierter Regeln beobachtet. Falco kann diese Ereignisse durch Metadaten aus der Container-Runtime und Kubernetes anreichern.

    **Funktionen**
    * Echtzeit-Bedrohungserkennung basierend auf Syscall-Monitoring
    * Benutzerdefinierte Regel-Engine zur Definition von Sicherheitsrichtlinien
    * Container- und Kubernetes-bewusst mit Metadaten-Anreicherung
    * Unterstützung des modernen eBPF-Treibers (kein Kernelmodul erforderlich)
    * Plugin-System zur Erweiterung der Datenquellen
    * Mehrere Ausgabe-Kanäle: stdout, Datei, syslog, HTTP, gRPC
    * Prometheus-Metrik-Endpunkt
    * CNCF-graduiertes Projekt, in Produktion bei verschiedenen Organisationen im Einsatz
    * Health-Check-API zur Überwachung des Falco-Status

    Note: Falco ist ein Security-Daemon auf Kernel-Ebene. Es benötigt privilegierten Zugriff und kann in Standard-Containerumgebungen Einschränkungen haben.
  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernen.


    Falco auf das apiVersion-v3 Shared-App-Muster migriert (falco → falcov3).

    **Änderungen**

    - **Architektur**: falco-/falcoserver-Subcharts zu einem Chart zusammengeführt; nginx-Entrance Deployment/Service in falcov3 umbenannt, damit die appid für die v3-Workload-Verifikation passt.
    - **Skalierung**: `workloadReplicas` für die falcov3-Entrance- und falco-central-Workloads.
    - **Runtime**: Falco 0.43.0, falcosidekick 2.33.0, falcosidekick-ui 2.3.0.

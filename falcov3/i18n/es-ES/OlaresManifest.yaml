metadata:
  title: Falco
  description: Herramienta de seguridad en tiempo de ejecución cloud native para detectar comportamiento anormal
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el Admin de Olares.

    **RESUMEN**
    Falco es una herramienta de seguridad en tiempo de ejecución cloud native para sistemas operativos Linux. Está diseñada para detectar y alertar sobre comportamientos anormales y posibles amenazas de seguridad en tiempo real.

    En su núcleo, Falco es un agente de monitorización y detección del kernel que observa eventos, como syscalls, según reglas personalizadas. Falco puede enriquecer estos eventos integrando metadatos del runtime de contenedores y Kubernetes.

    **Funciones**
    * Detección de amenazas en tiempo real basada en monitorización de syscalls
    * Motor de reglas personalizado para definir políticas de seguridad
    * Consciente de contenedores y Kubernetes con enriquecimiento de metadatos
    * Soporte del driver eBPF moderno (sin módulo de kernel requerido)
    * Sistema de plugins para extender fuentes de datos
    * Múltiples canales de salida: stdout, archivo, syslog, HTTP, gRPC
    * Endpoint de métricas Prometheus
    * Proyecto graduado de CNCF usado en producción por diversas organizaciones
    * API de health check para monitorizar el estado de Falco

    Note: Falco es un demonio de seguridad a nivel de kernel. Requiere acceso privilegiado para funcionar correctamente y puede tener limitaciones en entornos de contenedor estándar.
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear montajes de configuración nginx y rutas de logs con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.


    Migración de Falco al patrón de app compartida apiVersion v3 (falco → falcov3).

    **Cambios**

    - **Arquitectura**: se aplanaron los subcharts falco/falcoserver en un solo chart; se renombraron el Deployment/Service de entrada nginx a falcov3 para coincidir con el appid en la verificación de workloads v3.
    - **Escalado**: `workloadReplicas` para los workloads de entrada falcov3 y falco-central.
    - **Runtime**: Falco 0.43.0, falcosidekick 2.33.0, falcosidekick-ui 2.3.0.

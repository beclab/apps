metadata:
  title: Falco
  description: Outil de sécurité runtime cloud native pour détecter les comportements anormaux
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s’agit d’une app partagée. Un seul service sera installé sur l’ensemble du système Olares. Chaque utilisateur doit néanmoins installer une entrée bureau pour accéder et utiliser le service installé par l’Admin Olares.

    **APERÇU**
    Falco est un outil de sécurité runtime cloud native pour les systèmes d’exploitation Linux. Il est conçu pour détecter et alerter sur des comportements anormaux et des menaces de sécurité potentielles en temps réel.

    À son cœur, Falco est un agent de surveillance et de détection du noyau qui observe des événements, comme les syscalls, selon des règles personnalisées. Falco peut enrichir ces événements en intégrant des métadonnées du runtime de conteneurs et de Kubernetes.

    **Fonctionnalités**
    * Détection de menaces en temps réel basée sur la surveillance des syscalls
    * Moteur de règles personnalisé pour définir des politiques de sécurité
    * Conscient des conteneurs et de Kubernetes avec enrichissement de métadonnées
    * Prise en charge du driver eBPF moderne (aucun module noyau requis)
    * Système de plugins pour étendre les sources de données
    * Plusieurs canaux de sortie : stdout, fichier, syslog, HTTP, gRPC
    * Endpoint de métriques Prometheus
    * Projet CNCF gradué utilisé en production par diverses organisations
    * API de health check pour surveiller l’état de Falco

    Note : Falco est un démon de sécurité au niveau du noyau. Il nécessite un accès privilégié pour fonctionner correctement et peut avoir des limitations dans les environnements de conteneurs standard.
  upgradeDescription: |
    Remplacement de l’image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l’image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l’image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage Bitnami `OPENRESTY_CONF_FILE`.


    Migration de Falco vers le schéma d’app partagée apiVersion v3 (falco → falcov3).

    **Changements**

    - **Architecture** : fusion des sous-charts falco/falcoserver en un seul chart ; renommage du Deployment/Service d’entrée nginx en falcov3 pour correspondre à l’appid pour la vérification des workloads v3.
    - **Mise à l’échelle** : `workloadReplicas` pour les workloads d’entrée falcov3 et falco-central.
    - **Runtime** : Falco 0.43.0, falcosidekick 2.33.0, falcosidekick-ui 2.3.0.

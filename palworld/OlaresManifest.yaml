olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  palworld: 1
  terminal: 1

metadata:
  name: palworld
  appid: palworld
  title: Palworld
  description: Palworld dedicated server.
  icon: https://cdn.olares.com/images/2026/08/77e9ce1497f6244892da4437be85eac3.png
  version: 0.1.13
  categories:
  - Fun
  - homelab
  tags:
  - gaming
entrances:
- name: terminal
  host: terminal
  port: 80
  title: Palworld Console
  icon: https://cdn.olares.com/images/2026/08/77e9ce1497f6244892da4437be85eac3.png
  authLevel: private
  openMethod: window

ports:
- name: palworld
  host: palworld
  port: 8211
  protocol: udp
  exposePort: 8211

overlayGateway:
  enable: true
  entrances:
  - port: 8211
    title: Palworld
    workload: palworld
    description: "Join with the Palworld client (UDP 8211)"
    protocol: udp

tailscale:
  acls:
  - proto: udp
    dst:
    - "*:8211"
  - proto: udp
    dst:
    - "*:27015"

permission:
  appData: true

spec:
  versionName: "1.0"
  developer: Pocketpair
  website: https://www.palworldgame.com/
  sourceCode: https://github.com/thijsvanloef/palworld-server-docker
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://palworld-server-docker.loef.dev/
  license:
  - text: Palworld
    url: https://store.steampowered.com/app/1623730/Palworld/
  requiredMemory: 8Gi
  limitedMemory: 16Gi
  requiredDisk: 20Gi
  limitedDisk: 80Gi
  requiredCpu: 2
  limitedCpu: 4
  supportArch:
  - amd64
  - arm64
  featuredImage: https://cdn.olares.com/images/2026/08/d625070f8d8e4bb353d1c05e762c9b42.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/d625070f8d8e4bb353d1c05e762c9b42.png
  - https://cdn.olares.com/images/2026/08/db06d141861d52e1618c4d96a0847199.png
  - https://cdn.olares.com/images/2026/08/c9643eb9a5a2e5031c7da010df20ff94.png
  fullDescription: |
    A Palworld dedicated server. There is no web UI — open the console terminal from the desktop. Players join with the official Palworld client by choosing Join Multiplayer Game and entering the server address manually (`IP:8211`).

    Clients that support manual join: Steam on Windows and Mac (Linux/Steam Deck via Proton). Xbox, PS5, and the PC Game Pass (Microsoft Store) build cannot join this server — those clients have no IP field and community server browsing is off here.

    First start downloads the official dedicated server via SteamCMD (several GB, can take a while). World data is stored in this app's data directory. Hosting the server does not require owning Palworld; players who join must own the game.

    On the same LAN, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app, then join using the LAN IP and port shown there (UDP 8211).

    To join over VPN when players are not on the same network, use `<olares-id>.olares.com:8211` (for example olarestest001.olares.com:8211). Turn off Overlay for this app first — Overlay and VPN cannot be used together on Palworld. Community listing is off.

  upgradeDescription: |
    Pin the game server pod to control-plane (master) via nodeAffinity for overlay gateway LAN access.

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

metadata:
  title: Palworld
  description: Palworld 专用服务器。
spec:
  fullDescription: |
    Palworld 专用服务器。没有网页界面——从桌面打开控制台终端。玩家使用官方 Palworld 客户端，选择「加入多人游戏（Join Multiplayer Game）」并手动输入服务器地址（`IP:8211`）进服。

    支持手动填地址进服的客户端：Steam Windows / Mac（Linux / Steam Deck 可通过 Proton）。Xbox、PS5 及 PC Game Pass（微软商店版）目前无法加入——这些客户端不能填 IP，且本应用未开启社区服务器列表。

    首次启动会通过 SteamCMD 下载官方服务端（数 GB，可能较久）。存档保存在本应用的数据目录。托管服务器不需要购买 Palworld；进服的玩家需要正版。

    同一局域网内：打开「设置 → 网络 → Overlay 网关」，开启网关并为本应用打开 Overlay，使用页面显示的局域网 IP 与端口（UDP 8211）进服。

    通过 VPN 进服（玩家不在同一网络时）请填 `<olares-id>.olares.com:8211`（例如 olarestest001.olares.com:8211），需先关闭本应用的 Overlay——帕鲁服不能同时使用 Overlay 与 VPN。未开启社区列表。

  upgradeDescription: |
    通过 nodeAffinity 将游戏服 Pod 固定到 control-plane（master），以配合 Overlay 网关局域网访问。

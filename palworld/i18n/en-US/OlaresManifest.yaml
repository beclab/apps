metadata:
  title: Palworld
  description: Palworld dedicated server.
spec:
  fullDescription: |
    A Palworld dedicated server. There is no web UI — open the console terminal from the desktop. Players join with the official Palworld client by choosing Join Multiplayer Game and entering the server address manually (`IP:8211`).

    Clients that support manual join: Steam on Windows and Mac (Linux/Steam Deck via Proton). Xbox, PS5, and the PC Game Pass (Microsoft Store) build cannot join this server — those clients have no IP field and community server browsing is off here.

    First start downloads the official dedicated server via SteamCMD (several GB, can take a while). World data is stored in this app's data directory. Hosting the server does not require owning Palworld; players who join must own the game.

    On the same LAN, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app, then join using the LAN IP and port shown there (UDP 8211).

    To join over VPN when players are not on the same network, use `<olares-id>.olares.com:8211` (for example olarestest001.olares.com:8211). Turn off Overlay for this app first — Overlay and VPN cannot be used together on Palworld. Community listing is off.

  upgradeDescription: |
    Pin the game server pod to control-plane (master) via nodeAffinity for overlay gateway LAN access.

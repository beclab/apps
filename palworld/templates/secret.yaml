{{- $secretName := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $adminPassword := "" -}}
{{- if and $existing $existing.data (index $existing.data "ADMIN_PASSWORD") -}}
{{- $adminPassword = index $existing.data "ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $adminPassword = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: palworld
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ $adminPassword | quote }}

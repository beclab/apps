olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: trustgraph
  appid: trustgraph
  title: TrustGraph
  description: Semantic intelligence and Graph RAG platform
  icon: https://cdn.olares.com/images/2026/10/dd16a564424e37da52b595682f92be9e.png
  version: 0.1.24
  categories:
  - Productivity_v112
  - agents
  tags:
  - rag
  - knowledge-graph
entrances:
- name: trustgraph
  host: trustgraph-ui
  port: 8888
  title: TrustGraph
  authLevel: private
  openMethod: window
  icon: https://cdn.olares.com/images/2026/10/dd16a564424e37da52b595682f92be9e.png
spec:
  versionName: 2.10.10
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  requiredCpu: '2'
  limitedCpu: '16'
  requiredMemory: 6Gi
  limitedMemory: 20Gi
  requiredDisk: 20Gi
  developer: TrustGraph
  website: https://trustgraph.ai
  doc: https://docs.trustgraph.ai/
  sourceCode: https://github.com/trustgraph-ai/trustgraph
  featuredImage: https://cdn.olares.com/images/2026/10/ad11a2dfa9480ccd9562220585a82b89.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/ad11a2dfa9480ccd9562220585a82b89.png
  - https://cdn.olares.com/images/2026/10/2e8012f6aaee97a99ab738f74a2028c9.png
  - https://cdn.olares.com/images/2026/10/0fbdea93c665b44b91343bc02617cd89.png
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  submitter: Olares
  fullDescription: |
    TrustGraph is an open-source semantic intelligence platform that turns documents into traceable knowledge for natural-language questions and AI workflows.

    Upload documents, explore their entities and relationships, and ask questions using Document RAG or Graph RAG. The web interface includes graph navigation, prompt management, and SPARQL queries.

    This Olares package uses Olares MinIO for document storage and integrates with Router through an OpenAI-compatible API. The model API URL is optional: leave it empty to use https://router.<your Olares domain>/v1 automatically. The API key is optional when Router does not validate keys; otherwise supply a valid key. An empty key uses the not-required placeholder. Start a chat model, EmbeddingGemma, and a reranking model in Router before processing documents. The default flow uses 768-dimensional EmbeddingGemma vectors; Jina CLIP v2 can be selected for a separate 1024-dimensional collection. Keep different embedding dimensions in separate collections.

    Document processing speed and answer quality depend on the models and resources you configure. Supports amd64 and arm64. Runtime validation has been completed on amd64; arm64 runtime validation is pending. The package requires at least 6 GiB of application memory in addition to model resources.
    Choose an administrator password during installation, then sign in with username admin. This password is used only to create a new account; upgrades and restarts preserve existing credentials.
permission:
  appData: true
  appCache: true
middleware:
  minio:
    username: trustgraph
    buckets:
    - name: trustgraph
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  - name: minio
    type: middleware
    version: '>=0.0.0-0'
    mandatory: true
  - name: router
    type: application
    version: '>=1.0.0-0'
    mandatory: true
workloadReplicas:
  api-gateway: 1
  cassandra: 1
  control: 1
  ddg-mcp-server: 1
  document-decoder: 1
  embeddings: 1
  ingest: 1
  pulsar: 1
  qdrant: 1
  rag: 1
  rows: 1
  text-completion: 1
  triples: 1
  trustgraph: 1
  vector-store: 1
envs:
- envName: ADMIN_PASSWORD
  type: password
  required: true
  editable: false
  applyOnChange: false
  regex: ^[^\r\n]{12,128}$
  description: Administrator password for admin (12-128 characters). Used only on
    first installation; change it inside TrustGraph afterwards.
- envName: LLM_BASE_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Optional OpenAI-compatible base URL. Leave empty to use https://router.<your
    Olares domain>/v1 automatically.
- envName: LLM_API_KEY
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: Optional API key for chat, embeddings and reranking. Leave empty only
    if Router does not validate API keys; otherwise enter a valid key. Defaults to
    not-required.

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ingest
  name: ingest
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "ingest").replicaCount }}
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
      annotations:
        trustgraph.olares.com/chart-version: '0.1.25'
        checksum/ingest-config: {{ include (print $.Template.BasePath "/configmap-ingest-launch-cfg.yaml") . | sha256sum }}
    spec:
      containers:
      - command:
        - python
        - -c
        - import sys; sys.path.insert(0,"/etc/trustgraph"); import structured_definitions_patch; structured_definitions_patch.install(); from trustgraph.base.processor_group import run; run()
        - --log-level
        - INFO
        - -c
        - /etc/trustgraph/launch.yaml
        - --no-loki-enabled
        image: docker.io/trustgraph/trustgraph-flow:2.10.10
        name: ingest
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: '0.1'
            memory: 192Mi
        volumeMounts:
        - mountPath: /etc/trustgraph/
          name: ingest-launch-cfg
        env:
        - name: HOME
          value: /tmp
      enableServiceLinks: false
      volumes:
      - configMap:
          name: ingest-launch-cfg
        name: ingest-launch-cfg
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  strategy:
    type: Recreate

    {\r\n      \"on_validation_error\": \"log_and_skip\",\r\n      \"on_transform_error\":
    \"log_and_skip\",\r\n      \"max_errors\": 100\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n##
    Transform Types Available\r\n\r\nUse these transform types in your mappings:\r\n\r\n**String
    Operations:**\r\n- `trim`, `upper`, `lower`, `title_case`\r\n- `replace`, `regex_replace`,
    `substring`, `pad_left`\r\n\r\n**Type Conversions:**\r\n- `to_string`, `to_int`,
    `to_float`, `to_bool`, `to_date`\r\n\r\n**Data Operations:**\r\n- `default`, `lookup`,
    `concat`, `calculate`, `conditional`\r\n\r\n**Validation Types:**\r\n- `required`,
    `not_null`, `min_length`, `max_length`\r\n- `range`, `pattern`, `in_list`, `custom`\r\n\r\n##
    XML-Specific Best Practices\r\n\r\n1. **Use efficient XPath expressions** - Prefer
    specific paths over broad searches\r\n2. **Handle namespace prefixes** when present\r\n3.
    **Identify field attribute patterns** correctly\r\n4. **Test XPath expressions**
    mentally against the provided structure\r\n5. **Consider XML element vs attribute
    data** in field mappings\r\n6. **Account for mixed content** and nested structures\r\n\r\n##
    Best Practices to Follow\r\n\r\n1. **Always include error handling** with appropriate
    policies\r\n2. **Use meaningful field names** that match target schema\r\n3. **Add
    validation** for critical fields\r\n4. **Include default values** for optional
    fields\r\n5. **Use lookup tables** for code translations\r\n6. **Add preprocessing
    filters** to exclude invalid records\r\n7. **Include metadata** for documentation
    and maintenance\r\n8. **Consider performance** with appropriate batch sizes\r\n\r\n##
    Complete XML Example\r\n\r\nGiven this XML structure:\r\n```xml\r\n<ROOT>\r\n  <data>\r\n    <record>\r\n      <field
    name=\"Country\">USA</field>\r\n      <field name=\"Year\">2024</field>\r\n      <field
    name=\"Amount\">1000.50</field>\r\n    </record>\r\n  </data>\r\n</ROOT>\r\n```\r\n\r\nThe
    parser will:\r\n1. Use `record_path: \"/ROOT/data/record\"` to find record elements\r\n2.
    Use `field_attribute: \"name\"` to extract field names from the name attribute\r\n3.
    Create this parsed data structure: `{\"Country\": \"USA\", \"Year\": \"2024\",

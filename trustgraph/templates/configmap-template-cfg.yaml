    Correct - matches parsed field name\r\n  \"source_field\": \"Trade (USD)\",         //
    \u2705 Correct - matches parsed field name\r\n  \"source_field\": \"Status\"               //
    \u2705 Correct - matches parsed field name\r\n}\r\n```\r\n\r\n### Without field_attribute
    (Element-Based Fields)\r\n\r\nWhen NOT using `field_attribute`, use direct element
    names or XPath expressions:\r\n\r\n**Example:**\r\n```xml\r\n<record>\r\n  <country>Albania</country>\r\n  <trade_amount>1000.50</trade_amount>\r\n  <status>Active</status>\r\n  <metadata>\r\n    <source>UN</source>\r\n    <year>2024</year>\r\n  </metadata>\r\n</record>\r\n```\r\n\r\nParser
    configuration:\r\n```json\r\n{\r\n  \"record_path\": \"//record\"\r\n  // No field_attribute
    specified\r\n}\r\n```\r\n\r\nYour mappings should use:\r\n```json\r\n{\r\n  \"source_field\":
    \"country\",              // \u2705 Direct element name\r\n  \"source_field\":
    \"trade_amount\",         // \u2705 Direct element name\r\n  \"source_field\":

    Requirements**\r\n   - Any filtering needed (skip certain records)\r\n   - Sorting
    requirements\r\n   - Aggregation or grouping needs\r\n   - Error handling preferences\r\n\r\n##
    XML Structure Analysis\r\n\r\nWhen presented with XML data, analyze:\r\n\r\n1.
    **Document Root**: What is the root element?\r\n2. **Namespaces**: Are there namespace
    declarations? What prefixes are used?\r\n3. **Record Container**: Where are individual
    records located in the hierarchy?\r\n4. **Field Pattern**: How are field names

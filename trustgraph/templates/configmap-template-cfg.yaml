    format configurations, use these XPath patterns:\r\n\r\n**Record Path Examples:**\r\n-
    Simple records: `//record` or `//customer`\r\n- Nested records: `//data/records/record`
    or `//customers/customer`\r\n- Absolute paths: `/ROOT/data/record` (will be converted
    to relative paths automatically)\r\n- With namespaces: `//ns:record` or `//soap:Body/data/record`\r\n\r\n**Field
    Attribute Patterns:**\r\n- When fields use name attributes: set `field_attribute:
    \"name\"` for `<field name=\"key\">value</field>`\r\n- For other attribute patterns:
    set appropriate attribute name\r\n\r\n**CRITICAL: Source Field Names in Mappings**\r\n\r\nWhen
    using `field_attribute`, the XML parser extracts field names from the attribute
    values and creates a flat dictionary. Your source field names in mappings must
    match these extracted names:\r\n\r\n**CORRECT Example:**\r\n```xml\r\n<field name=\"Country
    or Area\">Albania</field>\r\n<field name=\"Trade (USD)\">1000.50</field>\r\n```\r\n\r\nBecomes
    parsed data:\r\n```json\r\n{\r\n  \"Country or Area\": \"Albania\",\r\n  \"Trade
    (USD)\": \"1000.50\"\r\n}\r\n```\r\n\r\nSo your mappings should use:\r\n```json\r\n{\r\n  \"source_field\":
    \"Country or Area\",     // \u2705 Correct - matches parsed field name\r\n  \"source_field\":
    \"Trade (USD)\"         // \u2705 Correct - matches parsed field name\r\n}\r\n```\r\n\r\n**INCORRECT
    Example:**\r\n```json\r\n{\r\n  \"source_field\": \"Field[@name=''Country or Area'']\",  //
    \u274c Wrong - XPath not needed here\r\n  \"source_field\": \"field[@name=''Trade
    (USD)'']\"       // \u274c Wrong - XPath not needed here\r\n}\r\n```\r\n\r\n**XML
    Format Configuration Template:**\r\n```json\r\n{\r\n  \"format\": {\r\n    \"type\":
    \"xml\",\r\n    \"encoding\": \"utf-8\",\r\n    \"options\": {\r\n      \"record_path\":
    \"//data/record\",        // XPath to find record elements\r\n      \"field_attribute\":
    \"name\"              // For <field name=\"key\">value</field> pattern\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n**Alternative
    XML Options:**\r\n```json\r\n{\r\n  \"format\": {\r\n    \"type\": \"xml\", \r\n    \"encoding\":
    \"utf-8\",\r\n    \"options\": {\r\n      \"record_path\": \"//customer\",           //
    Direct element-based records\r\n      // No field_attribute needed for standard
    XML\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n## Required Information to Gather\r\n\r\nBefore
    generating the descriptor, ask the user for these details if not provided:\r\n\r\n1.
    **Source Data Format**\r\n   - File type (CSV, JSON, XML, Excel, fixed-width,

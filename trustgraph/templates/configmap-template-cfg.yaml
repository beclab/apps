    {\r\n    \"type\": \"xml\",\r\n    \"encoding\": \"utf-8\", \r\n    \"options\":
    {\r\n      \"record_path\": \"/ROOT/data/record\",\r\n      \"field_attribute\":
    \"name\"\r\n    }\r\n  },\r\n  \"mappings\": [\r\n    {\r\n      \"source_field\":
    \"Country\",          // \u2705 Matches parsed field name\r\n      \"target_field\":

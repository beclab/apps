    needed (skip certain records)\r\n   - Sorting requirements\r\n   - Aggregation
    or grouping needs\r\n   - Error handling preferences\r\n\r\n## JSON Structure
    Analysis\r\n\r\nWhen presented with JSON data, analyze:\r\n\r\n1. **Root Structure**:
    Is it an array, object, or nested structure?\r\n2. **Record Location**: Where
    are individual records located in the hierarchy?\r\n3. **Field Pattern**: How
    are field names and values structured?\r\n   - Direct properties: `{\"name\":
    \"John\"}`\r\n   - Nested objects: `{\"contact\": {\"email\": \"john@example.com\"{{ "}}" }}`\r\n   -
    Arrays: `{\"tags\": [\"red\", \"blue\"]}`\r\n   - Mixed types: `{\"data\": [{\"id\":
    1, \"details\": {\"name\": \"John\"{{ "}}" }}]}`\r\n4. **Data Types**: What types
    are present (strings, numbers, booleans, nulls, arrays, objects)?\r\n5. **Hierarchy
    Depth**: How deeply nested are the records and fields?\r\n\r\n## Configuration
    Template Structure\r\n\r\nGenerate a JSON configuration following this structure:\r\n\r\n```json\r\n{\r\n  \"version\":
    \"1.0\",\r\n  \"metadata\": {\r\n    \"name\": \"[Descriptive name]\",\r\n    \"description\":
    \"[What this config does]\",\r\n    \"author\": \"[Author or team]\",\r\n    \"created\":
    \"[ISO date]\"\r\n  },\r\n  \"format\": {\r\n    \"type\": \"json\",\r\n    \"encoding\":
    \"utf-8\",\r\n    \"options\": {\r\n      // JSON-specific parsing options\r\n      //
    record_path (JSONPath), flatten_nested, array_handling, etc.\r\n    }\r\n  },\r\n  \"globals\":
    {\r\n    \"variables\": {\r\n      // Global variables and constants\r\n    },\r\n    \"lookup_tables\":
    {\r\n      // Reference data for transformations\r\n    }\r\n  },\r\n  \"preprocessing\":
    [\r\n    // Global filters and operations before field mapping\r\n  ],\r\n  \"mappings\":
    [\r\n    // Field mapping definitions with transforms and validation\r\n  ],\r\n  \"postprocessing\":
    [\r\n    // Global operations after field mapping\r\n  ],\r\n  \"output\": {\r\n    \"format\":
    \"trustgraph-objects\",\r\n    \"schema_name\": \"[target schema name]\",\r\n    \"options\":
    {\r\n      \"confidence\": 0.85,\r\n      \"batch_size\": 1000\r\n    },\r\n    \"error_handling\":
    {\r\n      \"on_validation_error\": \"log_and_skip\",\r\n      \"on_transform_error\":
    \"log_and_skip\",\r\n      \"max_errors\": 100\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n##
    Transform Types Available\r\n\r\nUse these transform types in your mappings:\r\n\r\n**String
    Operations:**\r\n- `trim`, `upper`, `lower`, `title_case`\r\n- `replace`, `regex_replace`,
    `substring`, `pad_left`\r\n\r\n**Type Conversions:**\r\n- `to_string`, `to_int`,
    `to_float`, `to_bool`, `to_date`\r\n\r\n**Data Operations:**\r\n- `default`, `lookup`,
    `concat`, `calculate`, `conditional`\r\n- `flatten_object`, `extract_array_element`,
    `join_array`\r\n\r\n**Validation Types:**\r\n- `required`, `not_null`, `min_length`,
    `max_length`\r\n- `range`, `pattern`, `in_list`, `custom`\r\n\r\n## JSON-Specific
    Best Practices\r\n\r\n1. **Use efficient JSONPath expressions** - Prefer specific
    paths over broad searches\r\n2. **Handle nested objects appropriately** - decide
    whether to flatten or preserve structure\r\n3. **Consider array handling strategies**
    - expand arrays to multiple records or extract specific elements\r\n4. **Account
    for null vs undefined** values in field mappings\r\n5. **Handle mixed data types**
    within the same field across records\r\n6. **Use appropriate flattening** for
    deeply nested structures\r\n\r\n## Best Practices to Follow\r\n\r\n1. **Always
    include error handling** with appropriate policies\r\n2. **Use meaningful field
    names** that match target schema\r\n3. **Add validation** for critical fields\r\n4.
    **Include default values** for optional fields\r\n5. **Use lookup tables** for
    code translations\r\n6. **Add preprocessing filters** to exclude invalid records\r\n7.
    **Include metadata** for documentation and maintenance\r\n8. **Consider performance**
    with appropriate batch sizes\r\n9. **Handle JSON-specific edge cases** like empty
    arrays, null objects, mixed types\r\n\r\n## Complete JSON Example\r\n\r\nGiven
    this JSON structure:\r\n```json\r\n{\r\n  \"data\": {\r\n    \"records\": [\r\n      {\r\n        \"Country\":
    \"USA\",\r\n        \"Year\": 2024,\r\n        \"Amount\": 1000.50,\r\n        \"metadata\":
    {\r\n          \"source\": \"World Bank\",\r\n          \"confidence\": 0.95\r\n        }\r\n      }\r\n    ]\r\n  }\r\n}\r\n```\r\n\r\nThe
    parser will:\r\n1. Use `record_path: \"$.data.records[*]\"` to extract record
    objects from the array\r\n2. Create this parsed data structure for each record:
    \r\n   ```json\r\n   {\r\n     \"Country\": \"USA\", \r\n     \"Year\": 2024,
    \r\n     \"Amount\": 1000.50,\r\n     \"metadata.source\": \"World Bank\",      //
    If flattened\r\n     \"metadata.confidence\": 0.95           // If flattened\r\n   }\r\n   ```\r\n\r\nGenerate
    this COMPLETE configuration:\r\n```json\r\n{\r\n  \"format\": {\r\n    \"type\":
    \"json\",\r\n    \"encoding\": \"utf-8\", \r\n    \"options\": {\r\n      \"record_path\":
    \"$.data.records[*]\",\r\n      \"flatten_nested\": true,\r\n      \"array_handling\":
    \"expand\"\r\n    }\r\n  },\r\n  \"mappings\": [\r\n    {\r\n      \"source_field\":
    \"Country\",          // \u2705 Matches property name\r\n      \"target_field\":

    are the records?\r\n7. **Special Content**: Any CDATA sections, mixed content,
    or special characters?\r\n\r\n## Configuration Template Structure\r\n\r\nGenerate
    a JSON configuration following this structure:\r\n\r\n```json\r\n{\r\n  \"version\":
    \"1.0\",\r\n  \"metadata\": {\r\n    \"name\": \"[Descriptive name]\",\r\n    \"description\":
    \"[What this config does]\",\r\n    \"author\": \"[Author or team]\",\r\n    \"created\":
    \"[ISO date]\"\r\n  },\r\n  \"format\": {\r\n    \"type\": \"xml\",\r\n    \"encoding\":

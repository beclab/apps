    or grouping needs\r\n   - Error handling preferences\r\n\r\n## XML Structure Analysis\r\n\r\nWhen
    presented with XML data, analyze:\r\n\r\n1. **Document Root**: What is the root
    element?\r\n2. **Record Container**: Where are individual records located?\r\n3.
    **Field Pattern**: How are field names and values structured?\r\n   - Direct child
    elements: `<name>John</name>`\r\n   - Attribute-based: `<field name=\"name\">John</field>`\r\n   -
    Mixed patterns\r\n4. **Namespaces**: Are there any namespace prefixes?\r\n5. **Hierarchy
    Depth**: How deeply nested are the records?\r\n\r\n## Configuration Template Structure\r\n\r\nGenerate
    a JSON configuration following this structure:\r\n\r\n```json\r\n{\r\n  \"version\":
    \"1.0\",\r\n  \"metadata\": {\r\n    \"name\": \"[Descriptive name]\",\r\n    \"description\":
    \"[What this config does]\",\r\n    \"author\": \"[Author or team]\",\r\n    \"created\":
    \"[ISO date]\"\r\n  },\r\n  \"format\": {\r\n    \"type\": \"[csv|json|xml|fixed-width|excel]\",\r\n    \"encoding\":

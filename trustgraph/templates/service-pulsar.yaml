apiVersion: v1
kind: Service
metadata:
  name: pulsar
  namespace: '{{ .Release.Namespace }}'
spec:
  ports:
  - name: pulsar
    port: 6650
    targetPort: 6650
  - name: admin
    port: 8080
    targetPort: 8080
  - name: bookkeeper
    port: 3181
    targetPort: 3181
  selector:
    app: pulsar
  type: ClusterIP

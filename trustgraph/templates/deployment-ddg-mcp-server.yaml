apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ddg-mcp-server
  name: ddg-mcp-server
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "ddg-mcp-server").replicaCount }}
  selector:
    matchLabels:
      app: ddg-mcp-server
  template:
    metadata:
      labels:
        app: ddg-mcp-server
      annotations:
        trustgraph.olares.com/chart-version: '0.1.26'
    spec:
      containers:
      - image: docker.io/trustgraph/ddg-mcp-server:0.1.1
        name: ddg-mcp-server
        ports:
        - containerPort: 9870
        resources:
          limits:
            cpu: '0.5'
            memory: 256M
          requests:
            cpu: '0.1'
            memory: 128Mi
        env:
        - name: HOME
          value: /tmp
      enableServiceLinks: false
      volumes: []
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  strategy:
    type: Recreate

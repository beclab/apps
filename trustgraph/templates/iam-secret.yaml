{{- $existing := lookup "v1" "Secret" .Release.Namespace "iam-bootstrap-token" }}
apiVersion: v1
kind: Secret
metadata:
  name: iam-bootstrap-token
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ if and $existing $existing.data }}{{ $token := index $existing.data "token" | b64dec }}{{ if hasPrefix "tg_" $token }}{{ $token | b64enc | quote }}{{ else }}{{ printf "tg_%s" $token | b64enc | quote }}{{ end }}{{ else }}{{ printf "tg_%s" (randAlphaNum 48) | b64enc | quote }}{{ end }}

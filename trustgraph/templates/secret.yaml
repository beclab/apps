apiVersion: v1
kind: Secret
metadata:
  name: trustgraph-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin-password: {{ .Values.olaresEnv.ADMIN_PASSWORD | default "" | quote }}
  openai-token: {{ include "trustgraph.llmApiKey" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: object-store
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  endpoint: "{{ .Values.minio.host }}:{{ .Values.minio.port }}"
  access-key: {{ .Values.minio.username | quote }}
  secret-key: {{ .Values.minio.password | quote }}
  region: "us-east-1"
  use-ssl: "false"

  guidance.json: "{\n  \"brand-analytics\": [\n    {\n      \"body\": \"Analyse brand\
    \ intelligence from customer interaction signals.\\n\\nThis dashboard shows what\
    \ users **buy**, **reject**, and **why** — derived from shopping assistant conversations.\\\
    n\\nUse the filters to narrow by time period, product category, or sentiment.\
    \ Click any data point to see the underlying interactions.\",\n      \"color\"\
    : \"purple\",\n      \"id\": \"welcome\",\n      \"position\": \"below-left\"\
    ,\n      \"title\": \"Brand Analytics\",\n      \"version\": \"asdlkj\"\n    }\n\
    \  ],\n  \"demo-loader\": [\n    {\n      \"body\": \"Browse the available demo\
    \ datasets and load them into TrustGraph.\\n\\nEach dataset comes with a **knowledge\
    \ graph**, **ontology**, and **example queries** — everything you need to explore\
    \ a scenario end-to-end.\\n\\nClick a card to see what's included, then hit **Load\
    \ Dataset** to get started. Once loaded, switch to the matching workspace and\
    \ try the demo apps on the **Demos** tab.\",\n      \"color\": \"emerald\",\n\
    \      \"id\": \"welcome\",\n      \"position\": \"below-right\",\n      \"title\"\
    : \"Demo Data Loader\"\n    }\n  ],\n  \"demos\": [\n    {\n      \"body\": \"\
    Each demo is designed to work with a **specific ontology and dataset**.\\n\\nThe\
    \ ontology defines the structure — entities, relationships, and properties — and\
    \ the data is generated to fit it. If you master the ontology, you can generate\
    \ your own data and see it come to life here.\\n\\nUse **Ontology Management**\
    \ to explore or edit the schema, then **Document Ingestion** to load new data.\"\
    ,\n      \"color\": \"emerald\",\n      \"id\": \"welcome\",\n      \"position\"\
    : \"below-right\",\n      \"title\": \"About Demos\"\n    }\n  ],\n  \"game-theory\"\
    : [\n    {\n      \"body\": \"Interactive game tree explorer with strategic analysis\
    \ tools.\\n\\n- **Payoff matrices** — see outcomes for each strategy combination\\\
    n- **Backward induction** — trace optimal play from the leaves up\\n- **Nash equilibria**\
    \ — find stable strategy profiles\\n- **Sandbox** — modify payoffs and see how\
    \ equilibria shift\\n\\nClick any node in the game tree to focus on that subgame.\"\
    ,\n      \"color\": \"purple\",\n      \"id\": \"welcome\",\n      \"position\"\
    : \"below\",\n      \"title\": \"Game Theory Visualiser\",\n      \"version\"\
    : \"asdlkj\"\n    }\n  ],\n  \"graph-explorer\": [\n    {\n      \"body\": \"\
    A schema-free graph browser — explore any knowledge graph without needing to know\
    \ its structure.\\n\\n- Click a **node** to expand its relationships\\n- Use the\
    \ **search** to find entities by label\\n- **Right-click** for navigation options\\\
    n\\nThis works with any RDF data, regardless of ontology.\",\n      \"color\"\
    : \"cyan\",\n      \"id\": \"welcome\",\n      \"position\": \"below-right\",\n\
    \      \"title\": \"Graph Navigator\",\n      \"version\": \"asdlkj\"\n    }\n\
    \  ],\n  \"graph-rag-query\": [\n    {\n      \"body\": \"Type a natural language\
    \ question about your data. TrustGraph will search the knowledge graph and generate\
    \ an answer with sources.\\n\\n**Tips:**\\n- Be specific — *\\\"What companies\
    \ supply lithium?\\\"* works better than *\\\"Tell me about lithium\\\"*\\n- Follow-up\
    \ questions work too\",\n      \"id\": \"query-input\",\n      \"position\": \"\
    below\",\n      \"title\": \"Ask a question\",\n      \"version\": \"asdlkj\"\n\
    \    },\n    {\n      \"body\": \"Results show the AI-generated answer alongside\
    \ the **graph evidence** that supports it.\\n\\nClick any entity in the answer\
    \ to navigate to it in the graph explorer.\",\n      \"color\": \"cyan\",\n  \
    \    \"id\": \"results-panel\",\n      \"position\": \"below-left\",\n      \"\
    title\": \"Understanding results\",\n      \"version\": \"asdlkj\"\n    }\n  ],\n\
    \  \"hwsec\": [\n    {\n      \"body\": \"Browse hardware components as a **decomposition\
    \ tree** with security annotations.\\n\\nUse the **search box** to find specific\
    \ components. Each node shows its security properties and any known vulnerabilities.\\\
    n\\nExpand branches to drill down from systems to sub-components.\",\n      \"\
    color\": \"blue\",\n      \"id\": \"welcome\",\n      \"position\": \"below-right\"\
    ,\n      \"title\": \"Hardware Security Explorer\",\n      \"version\": \"asdlkj\"\
    \n    }\n  ],\n  \"innovation\": [\n    {\n      \"body\": \"Navigate the innovation\
    \ ecosystem — organisations, capabilities, procurement routes, and people.\\n\\\
    nUse the toolbar to switch between views:\\n- **Organisations** — explore companies\
    \ and their capabilities\\n- **Procurement** — find routes to market\\n- **People**\
    \ — key contacts and expertise\\n- **GTM Advisor** — AI-assisted go-to-market\
    \ guidance\",\n      \"color\": \"cyan\",\n      \"id\": \"welcome\",\n      \"\
    position\": \"below\",\n      \"title\": \"Innovation Intelligence\",\n      \"\
    version\": \"asdlkj\"\n    }\n  ],\n  \"law\": [\n    {\n      \"body\": \"A multilingual\
    \ legal explorer covering institutions, civic rights, compliance obligations,\
    \ and legislative structure.\\n\\nBrowse by category:\\n- **Institutions** — government\
    \ bodies and regulators\\n- **Rights** — civic and human rights frameworks\\n-\
    \ **Compliance** — obligations and enforcement\\n- **Emergency powers** — exceptional\
    \ authority provisions\\n\\nAll content is sourced from the knowledge graph and\
    \ linked to its legal basis.\",\n      \"color\": \"amber\",\n      \"id\": \"\
    welcome\",\n      \"position\": \"below-right\",\n      \"title\": \"Law in Context\"\
    ,\n      \"version\": \"asdlkj\"\n    }\n  ],\n  \"retail-assistant\": [\n   \
    \ {\n      \"body\": \"An AI-powered shopping assistant that helps customers find\
    \ the right products.\\n\\nTry asking about:\\n- **PC builds** — *\\\"I need a\
    \ gaming PC under £1500\\\"*\\n- **Gift ideas** — *\\\"What would you recommend\
    \ for a keen hiker?\\\"*\\n- **Product comparisons** — *\\\"Compare these two\
    \ tents\\\"*\\n\\nThe assistant uses the knowledge graph to find products and\
    \ explain its reasoning.\",\n      \"color\": \"emerald\",\n      \"id\": \"welcome\"\
    ,\n      \"position\": \"below-right\",\n      \"title\": \"Retail Shopping Assistant\"\
    ,\n      \"version\": \"asdlkj\"\n    }\n  ],\n  \"risk-management\": [\n    {\n\
    \      \"body\": \"Enterprise risk explorer with **time-windowed event analysis**.\\\
    n\\nThe overview shows risk events, threat actors, and affected assets. Use the\
    \ time controls to focus on specific periods.\\n\\n- **Risk Overview** — summary\
    \ statistics and trends\\n- **Event detail** — drill into individual incidents\\\
    n- **Actor/Asset views** — pivot by threat actor or target asset\",\n      \"\
    color\": \"rose\",\n      \"id\": \"welcome\",\n      \"position\": \"below\"\
    ,\n      \"title\": \"Risk Management\",\n      \"version\": \"asdlkj\"\n    }\n\
    \  ],\n  \"solar-missions\": [\n    {\n      \"body\": \"Explore space missions\
    \ across the solar system.\\n\\nClick on any **celestial body** to see the missions\
    \ associated with it. The graph shows relationships between missions, agencies,\
    \ and destinations.\\n\\nUse the search box to find specific missions or space\
    \ agencies.\",\n      \"color\": \"amber\",\n      \"id\": \"welcome\",\n    \
    \  \"position\": \"below-right\",\n      \"title\": \"Solar System Missions\"\
    ,\n      \"version\": \"asdlkj\"\n    }\n  ],\n  \"threat-overview\": [\n    {\n\
    \      \"body\": \"Investigate cybersecurity risk events by pivoting through **actors**,\
    \ **assets**, and **categories**.\\n\\nStart with the risk event browser, then\
    \ drill into any event to see raw **OCSF-formatted** evidence.\\n\\nUse the search\
    \ and category filters to narrow the event list. Click any entity to see its full\
    \ context in the graph.\",\n      \"color\": \"cyan\",\n      \"id\": \"welcome\"\
    ,\n      \"position\": \"below-right\",\n      \"title\": \"Threat Explorer\"\
    ,\n      \"version\": \"asdlkj\"\n    }\n  ],\n  \"workflows\": [\n    {\n   \
    \   \"body\": \"Each card below represents a different **analysis workflow**.\\\
    n\\nClick any card to get started, or use the tabs above to switch between workflows\
    \ and demos.\\n\\nNeed help? See the [documentation](https://docs.trustgraph.ai/).\"\
    ,\n      \"color\": \"cyan\",\n      \"id\": \"welcome\",\n      \"position\"\
    : \"below-right\",\n      \"title\": \"Welcome to TrustGraph\",\n      \"version\"\
    : \"asdlkj\"\n    }\n  ]\n}"

metadata:
  title: TrustGraph
  description: 语义智能与 Graph RAG 平台
spec:
  fullDescription: |
    TrustGraph 是一个开源语义智能平台，可将文档转化为可追溯的知识，用于自然语言问答和 AI 工作流。

    上传文档，探索其中的实体和关系，并通过 Document RAG 或 Graph RAG 提问。网页界面还提供图谱导航、提示词管理和 SPARQL 查询。

    此 Olares 应用使用系统 MinIO 存储文档，并通过兼容 OpenAI 的 API 接入 Router。模型 API 地址可留空，默认自动使用 https://router.<你的 Olares 域名>/v1。Router 未启用密钥校验时，API Key 可留空并使用 not-required 占位值；启用校验时必须填写有效 Key。处理文档前，请在 Router 中启动聊天模型、EmbeddingGemma 和重排序模型。默认流程使用 768 维 EmbeddingGemma 向量；Jina CLIP v2 使用独立的 1024 维集合。不同向量维度必须使用不同集合。

    文档处理速度和回答质量取决于所配置的模型及资源。支持 amd64 和 arm64 架构。已完成 amd64 实机验证，arm64 实机验证尚待完成。应用本身至少需要 6 GiB 内存，模型还需要额外资源。

    安装时设置管理员密码，随后使用用户名 admin 登录。密码为 12–128 个字符，仅用于首次创建账号；升级和重启会保留现有密码，后续请在 TrustGraph 内修改。

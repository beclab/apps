metadata:
  title: TrustGraph
  description: Piattaforma di intelligenza semantica e Graph RAG
spec:
  fullDescription: |
    TrustGraph è una piattaforma open source di intelligenza semantica che trasforma i documenti in conoscenze tracciabili per domande in linguaggio naturale e flussi di lavoro di IA.

    Carica documenti, esplora entità e relazioni e poni domande con Document RAG o Graph RAG. L’interfaccia web offre anche navigazione dei grafi, gestione dei prompt e query SPARQL.

    Questo pacchetto Olares archivia i documenti in Olares MinIO e si collega a Router tramite un’API compatibile con OpenAI. L’URL dell’API dei modelli è facoltativo. Se vuoto, viene usato automaticamente https://router.<il tuo dominio Olares>/v1. Se Router non verifica le chiavi, la chiave può restare vuota e viene usato not-required; altrimenti è necessaria una chiave valida. Prima di elaborare documenti, avvia in Router un modello di chat, EmbeddingGemma e un modello di riordinamento. Il flusso predefinito usa vettori EmbeddingGemma a 768 dimensioni; Jina CLIP v2 richiede una raccolta separata a 1024 dimensioni. Usa raccolte distinte per dimensioni dei vettori diverse.

    La velocità di elaborazione e la qualità delle risposte dipendono dai modelli e dalle risorse configurati. Supporta amd64 e arm64. Il funzionamento è stato verificato su amd64; la verifica su arm64 è ancora da completare. L’applicazione richiede almeno 6 GiB di memoria, oltre alle risorse dei modelli.

    Imposta una password amministratore di 12–128 caratteri durante l’installazione e accedi come admin. Viene usata solo per creare l’account iniziale. Aggiornamenti e riavvii mantengono la password esistente; le modifiche successive si effettuano in TrustGraph.

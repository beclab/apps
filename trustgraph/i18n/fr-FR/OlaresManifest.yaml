metadata:
  title: TrustGraph
  description: Plateforme d’intelligence sémantique et de Graph RAG
spec:
  fullDescription: |
    TrustGraph est une plateforme d’intelligence sémantique open source qui transforme les documents en connaissances traçables pour les questions en langage naturel et les workflows d’IA.

    Importez des documents, explorez leurs entités et leurs relations, puis posez des questions avec Document RAG ou Graph RAG. L’interface web propose aussi la navigation dans les graphes, la gestion des instructions et les requêtes SPARQL.

    Ce paquet Olares stocke les documents dans Olares MinIO et se connecte à Router via une API compatible avec OpenAI. L’URL de l’API des modèles est facultative. Si elle est vide, https://router.<votre domaine Olares>/v1 est utilisé automatiquement. La clé peut rester vide si Router ne la vérifie pas ; la valeur not-required est alors utilisée. Sinon, une clé valide est nécessaire. Avant de traiter des documents, démarrez dans Router un modèle de chat, EmbeddingGemma et un modèle de reclassement. Le workflow par défaut utilise des vecteurs EmbeddingGemma à 768 dimensions ; Jina CLIP v2 nécessite une collection distincte à 1024 dimensions. Utilisez des collections séparées pour des dimensions de vecteurs différentes.

    La vitesse de traitement et la qualité des réponses dépendent des modèles et des ressources configurés. Les architectures amd64 et arm64 sont prises en charge. Le fonctionnement a été validé sur amd64 ; la validation sur arm64 reste à effectuer. L’application nécessite au moins 6 GiB de mémoire, en plus des ressources des modèles.

    Définissez un mot de passe administrateur de 12–128 caractères lors de l’installation, puis connectez-vous avec le nom admin. Il sert uniquement à créer le compte initial. Les mises à jour et les redémarrages conservent le mot de passe existant ; les modifications ultérieures se font dans TrustGraph.

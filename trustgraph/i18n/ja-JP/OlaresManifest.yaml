metadata:
  title: TrustGraph
  description: セマンティックインテリジェンスと Graph RAG のプラットフォーム
spec:
  fullDescription: |
    TrustGraph は、文書を追跡可能な知識に変換し、自然言語による質問や AI ワークフローに活用するオープンソースのセマンティックインテリジェンスプラットフォームです。

    文書をアップロードし、エンティティと関係を探索して、Document RAG または Graph RAG で質問できます。Web インターフェースには、グラフのナビゲーション、プロンプト管理、SPARQL クエリも用意されています。

    この Olares パッケージは Olares MinIO に文書を保存し、OpenAI 互換 API を通じて Router に接続します。モデル API の URL は省略できます。空欄の場合、https://router.<Olares ドメイン>/v1 を自動的に使用します。Router が API キーを検証しない場合はキーも空欄にでき、not-required が使用されます。検証が有効な場合は、有効なキーを入力してください。文書を処理する前に、Router でチャットモデル、EmbeddingGemma、リランキングモデルを起動します。既定のフローは 768 次元の EmbeddingGemma ベクトルを使用します。Jina CLIP v2 には、1024 次元の独立したコレクションが必要です。ベクトルの次元が異なる場合は、コレクションを分けてください。

    文書処理の速度と回答の品質は、設定したモデルとリソースによって異なります。amd64 と arm64 に対応しています。amd64 での実機検証は完了していますが、arm64 での実機検証は未実施です。アプリ自体に最低 6 GiB のメモリが必要で、モデルには追加のリソースが必要です。

    インストール時に 12～128 文字の管理者パスワードを設定し、ユーザー名 admin でログインします。このパスワードは初回のアカウント作成時にのみ使用されます。アップグレードや再起動では既存のパスワードを保持します。以後の変更は TrustGraph 内で行ってください。

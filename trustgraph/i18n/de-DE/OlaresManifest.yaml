metadata:
  title: TrustGraph
  description: Plattform für semantische Intelligenz und Graph RAG
spec:
  fullDescription: |
    TrustGraph ist eine Open-Source-Plattform für semantische Intelligenz. Sie verwandelt Dokumente in nachvollziehbares Wissen für Fragen in natürlicher Sprache und KI-Workflows.

    Laden Sie Dokumente hoch, erkunden Sie Entitäten und Beziehungen und stellen Sie Fragen mit Document RAG oder Graph RAG. Die Weboberfläche bietet außerdem Graphnavigation, Promptverwaltung und SPARQL-Abfragen.

    Dieses Olares-Paket speichert Dokumente in Olares MinIO und verbindet sich über eine OpenAI-kompatible API mit Router. Die Modell-API-Adresse ist optional. Ohne Angabe wird automatisch https://router.<Ihre Olares-Domain>/v1 verwendet. Wenn Router keine API-Schlüssel prüft, kann der Schlüssel leer bleiben; dann wird not-required verwendet. Andernfalls ist ein gültiger Schlüssel erforderlich. Starten Sie vor der Dokumentverarbeitung ein Chatmodell, EmbeddingGemma und ein Reranking-Modell in Router. Der Standard-Workflow verwendet EmbeddingGemma-Vektoren mit 768 Dimensionen; Jina CLIP v2 benötigt eine separate Sammlung mit 1024 Dimensionen. Verwenden Sie getrennte Sammlungen für unterschiedliche Vektordimensionen.

    Verarbeitungsgeschwindigkeit und Antwortqualität hängen von den konfigurierten Modellen und Ressourcen ab. Unterstützt amd64 und arm64. Die Laufzeit wurde auf amd64 validiert; die Validierung auf arm64 steht noch aus. Die Anwendung benötigt mindestens 6 GiB Arbeitsspeicher zusätzlich zu den Modellressourcen.

    Legen Sie bei der Installation ein Administratorpasswort mit 12–128 Zeichen fest und melden Sie sich als admin an. Es wird nur beim erstmaligen Erstellen des Kontos verwendet. Updates und Neustarts behalten das bestehende Passwort bei; spätere Änderungen erfolgen in TrustGraph.

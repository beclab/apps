envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://strata-engine/Hy4-Flash-Strata --include Hy4-Flash-SQ-96.strata,hf://strata-engine/Hy4-Flash-Strata --include Hy4-Flash-Engram-Q8.strata,hf://strata-engine/Hy4-Flash-Strata --include Hy4-Flash-Vision.strata
  description: Three native .strata v1.0 single-file sources sharing one HF snapshot (SQ-96 weights, Engram-Q8 NVMe shard, and Vision shard); extras finish before the main model handoff.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hy4-flash-sq-96
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: vision,thinking,tools
- envName: MODEL_REASONING_EFFORT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "high,max"
  description: "The reasoning_effort levels Tencent Hy4-Flash accepts (high, max; none/off disables thinking), published on the model card for clients."
- envName: MODEL_REASONING_EFFORT_DEFAULT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "high"
  description: "The reasoning_effort level Hy4-Flash uses when a request does not specify one."
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: --context 131072
  description: Strata setup.py / strata-hy4 options. Model/source/host/port/GPU/vision are managed by the chart. Default context is 131072 tokens with built-in Tree-8 DFly2 speculative decoding (--draft dfly2; pass --draft off to disable), lossless expert routing (--tail-skip 0; optionally add --tail-skip 12 for higher open-ended prose throughput), and automatic dynamic VRAM + cgroup RAM expert placement. Saving engine_args in Model Console relaunches setup and the server without re-downloading weights.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '1'
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 56Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: '19'
  description: CPU limit for the Strata engine, in cores. The default is 19 so the total container CPU limit stays within the app ceiling (20). Saving this relaunches the engine.
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 80Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 23Gi

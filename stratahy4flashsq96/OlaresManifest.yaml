    limitedCpu: '20'
    requiredCpu: 1300m
    requiredDisk: 160Gi
    limitedDisk: 220Gi
    requiredMemory: 57Gi
    limitedMemory: 83Gi
    requiredGPUMemory: 23Gi
    limitedGPUMemory: 24Gi
  supportArch:
  - amd64
  runAsUser: true

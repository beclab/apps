metadata:
  title: Hy4-Flash SQ-96 (Strata)
  description: "Strataでローカル実行する、画像理解・推論・ツール呼び出し対応のTencent Hy4-Flash SQ-96"
spec:
  upgradeDescription: |
    Strata v0.2.18（strata-hy4 0.1.64）およびModel Console（llm-init v1.7.26）上で動作するTencent Hy4-Flash SQ-96の初回リリースです。Olares One（24 GiB NVIDIA GPU + 96 GiB RAM）向けに最適化されています。

    - ネイティブ `.strata` v1.0形式の `SQ-96` 重み（`89.58 GB`）、共有NVMeルックアップシャード `Engram-Q8`（`67.58 GB`）、ネイティブ `Vision` シャード（`0.93 GB`）を直接読み込み、初回起動時のGGUF変換待ち時間が不要です。
    - 画像入力の理解、`high`/`max` の推論強度制御、OpenAI互換ツール呼び出し、および131,072コンテキストトークンでの内蔵5層 `DFly2` 投機的デコーディングに対応します。
    - 編集可能な既定19コアのCPU上限（プラットフォーム割り当て上限20コア）、16スレッドのAVX-VNNI CPUエキスパートワーカー、2 MiBヒュージページへのアリーナ集約（`STRATA_CPUEXP_COLLAPSE=1`）、動的VRAM `AdaptiveExpertCache` を最大化する80 GiBコンテナメモリ上限（インストール要件57 GiB）、およびダイレクトI/O（`STRATA_CPUEXP_COLD_IO=direct`）を備えています。

    [Strata v0.2.18](https://github.com/Niko1221/Strata/releases/tag/v0.2.18)
  fullDescription: |
    Tencent Hy4-Flashは、質問応答、画像理解、推論、ツール呼び出しに対応する総パラメータ数220B（トークンあたり12B活性化、4つのEngramルックアップモジュールに63.4B）のマルチモーダルMixture-of-Experts AIモデルです。このアプリは、Strataのネイティブ `.strata` v1.0 `SQ-96` 量子化版を専用のC++/CUDAエンジン `strata-hy4` でローカル実行します。

    Strataは、大規模なAIモデルをローカルで実行するためのオープンソース推論エンジンです。Hy4-Flashでは、密なトランク・MLA KVキャッシュ・高頻度エキスパートをGPUメモリに配置し、残りのエキスパートをシステムRAMに保持しつつ、4 KiB境界整列された `Engram-Q8` ルックアップテーブルを900 MiBのRAMキャッシュと組み合わせてNVMeストレージから直接ページングします。Model Consoleを通じてエンジンをOlaresに接続します。

    **主な機能**

    - 対応するアプリで、テキストおよび画像入力からの応答生成、思考モード（`high` / `max`）、ツール呼び出しを利用できます。
    - 内蔵の5層 `DFly2` 投機的ドラフター（追加KVキャッシュ `0 B`）により生成を高速化します。
    - Model Consoleでモデルのダウンロード、準備状態の確認、エンジン設定の調整ができます。
    - Olares RouterまたはOpenAI互換のチャットAPIを通じて、対応するアプリを接続できます。

    **このエディションについて**

    このエディション（`SQ-96`）はテキストと画像の入力に対応しています（`Hy4-Flash-Vision.strata` を `strata-hy4` 内でネイティブ実行）。動画入力は無効です。デフォルトのコンテキスト上限は131,072トークンで、一度に処理するリクエストは1件です。利用可能なコンテキストはメモリとエンジン設定によって異なります。

    **初回利用前の確認事項**

    初回起動時には3つの `.strata` v1.0ファイル（`Hy4-Flash-SQ-96.strata`、`Hy4-Flash-Engram-Q8.strata`、`Hy4-Flash-Vision.strata`、合計158.1 GB）をダウンロードします。`.strata` v1.0形式はGGUFの再パックなしで直接読み込まれるため、ダウンロード完了後はそのままトークナイザ展開とモデルロードに進みます。

    AVX2対応CPU、高速なNVMeストレージ、およびR580シリーズ以降のNVIDIAドライバが必要です。このプリセットはOlares One（24 GiB VRAMおよび96 GiBホストRAM）向けに設計されています。インストール前に記載のリソース要件を確認してください。

    [モデルのドキュメント](https://huggingface.co/tencent/Hy4-flash) · [量子化モデル](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Strataのドキュメント](https://github.com/Niko1221/Strata)

metadata:
  title: Hy4-Flash SQ-96 (Strata)
  description: "Tencent Hy4-Flash SQ-96 para chat multimodal, razonamiento y herramientas, ejecutado localmente con Strata"
spec:
  upgradeDescription: |
    Lanzamiento inicial de Tencent Hy4-Flash SQ-96 con Strata v0.2.18 (strata-hy4 0.1.64) y Model Console (llm-init v1.7.26), optimizado para Olares One (GPU NVIDIA de 24 GiB + 96 GiB de RAM).

    - Ejecuta pesos nativos `.strata` v1.0 `SQ-96` (`89,58 GB`) junto con el fragmento compartido NVMe `Engram-Q8` (`67,58 GB`) y el fragmento nativo `Vision` (`0,93 GB`), sin espera de conversión GGUF en el primer inicio.
    - Activa comprensión de imágenes, control de esfuerzo de razonamiento (`high`/`max`), llamadas a herramientas compatibles con OpenAI y decodificación especulativa integrada `DFly2` de 5 capas con 131.072 tokens de contexto.
    - Incluye límite de CPU predeterminado editable de 19 núcleos (cuota de plataforma de 20 núcleos), 16 hilos AVX-VNNI de expertos en CPU, compactación de arena en páginas enormes de 2 MiB (`STRATA_CPUEXP_COLLAPSE=1`), límite de memoria de contenedor de 80 GiB (requisito de instalación de 57 GiB) para `AdaptiveExpertCache` dinámico completo en VRAM y E/S directa (`STRATA_CPUEXP_COLD_IO=direct`).

    [Strata v0.2.18](https://github.com/Niko1221/Strata/releases/tag/v0.2.18)
  fullDescription: |
    Tencent Hy4-Flash es un modelo multimodal de IA Mixture-of-Experts de 220B parámetros (12B activos por token y 63,4B en 4 módulos de búsqueda Engram) diseñado para responder preguntas, analizar imágenes, razonar y llamar herramientas. Esta aplicación ejecuta localmente la edición cuantizada nativa `.strata` v1.0 `SQ-96` mediante el motor dedicado `strata-hy4` en C++/CUDA.

    Strata es un motor de inferencia de código abierto para ejecutar grandes modelos de IA localmente. En Hy4-Flash mantiene el tronco denso, la caché KV MLA y los expertos más frecuentes en la memoria de la GPU, aloja el resto de expertos en la RAM del sistema y pagina la tabla `Engram-Q8` alineada a 4 KiB directamente desde el almacenamiento NVMe con una caché RAM de 900 MiB. Model Console conecta el motor con Olares.

    **Funciones principales**

    - Generar respuestas a partir de texto e imágenes, con modo de razonamiento (`high` / `max`) y llamadas a herramientas en aplicaciones compatibles.
    - Acelerar la generación mediante el borrador especulativo integrado `DFly2` de 5 capas (`0 B` de caché KV adicional).
    - Usar Model Console para descargar el modelo, consultar su estado y ajustar la configuración del motor.
    - Conectar aplicaciones compatibles mediante Olares Router o la API de chat compatible con OpenAI.

    **Esta edición**

    Esta edición (`SQ-96`) admite entradas de texto e imagen (`Hy4-Flash-Vision.strata` se ejecuta de forma nativa en `strata-hy4`); la entrada de vídeo no está habilitada. El límite de contexto predeterminado es de 131.072 tokens y se procesa una solicitud cada vez. El contexto disponible depende de la memoria y de la configuración del motor.

    **Antes del primer uso**

    En el primer inicio se descargan 158,1 GB repartidos en tres archivos `.strata` v1.0 (`Hy4-Flash-SQ-96.strata`, `Hy4-Flash-Engram-Q8.strata` y `Hy4-Flash-Vision.strata`). Dado que `.strata` v1.0 se carga directamente sin conversión GGUF, el modelo pasa directamente a la carga tras finalizar la descarga.

    Se requieren una CPU compatible con AVX2, almacenamiento NVMe rápido y un controlador NVIDIA de la serie R580 o posterior. Esta configuración está dimensionada para Olares One (24 GiB de VRAM y 96 GiB de RAM). Consulte los requisitos de recursos antes de instalar.

    [Documentación del modelo](https://huggingface.co/tencent/Hy4-flash) · [Modelo cuantizado](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Documentación de Strata](https://github.com/Niko1221/Strata)

metadata:
  title: Hy4-Flash SQ-96 (Strata)
  description: "Tencent Hy4-Flash SQ-96 per chat multimodale, ragionamento e strumenti, eseguito in locale con Strata"
spec:
  upgradeDescription: |
    Rilascio iniziale di Tencent Hy4-Flash SQ-96 con Strata v0.2.18 (strata-hy4 0.1.64) e Model Console (llm-init v1.7.26), ottimizzato per Olares One (GPU NVIDIA da 24 GiB + 96 GiB di RAM).

    - Esegue i pesi nativi `.strata` v1.0 `SQ-96` (`89,58 GB`) con lo shard NVMe condiviso `Engram-Q8` (`67,58 GB`) e lo shard nativo `Vision` (`0,93 GB`), senza attesa di conversione GGUF al primo avvio.
    - Abilita comprensione delle immagini, controllo dello sforzo di ragionamento (`high`/`max`), chiamate a strumenti compatibili con OpenAI e decodifica speculativa integrata `DFly2` a 5 livelli con 131.072 token di contesto.
    - Offre un limite CPU predefinito modificabile di 19 core (quota piattaforma di 20 core), 16 thread CPU AVX-VNNI per gli esperti, compattazione dell'arena in hugepage da 2 MiB (`STRATA_CPUEXP_COLLAPSE=1`), tetto di memoria del container da 80 GiB (57 GiB richiesti all'installazione) per `AdaptiveExpertCache` dinamico completo in VRAM e I/O diretto (`STRATA_CPUEXP_COLD_IO=direct`).

    [Strata v0.2.18](https://github.com/Niko1221/Strata/releases/tag/v0.2.18)
  fullDescription: |
    Tencent Hy4-Flash è un modello multimodale di IA Mixture-of-Experts da 220 miliardi di parametri (12B attivi per token e 63,4B in 4 moduli di ricerca Engram) per rispondere a domande, comprendere immagini, ragionare e invocare strumenti. Questa applicazione esegue localmente l'edizione quantizzata nativa `.strata` v1.0 `SQ-96` tramite il motore dedicato `strata-hy4` in C++/CUDA.

    Strata è un motore di inferenza open source per eseguire grandi modelli di IA in locale. Con Hy4-Flash mantiene il tronco denso, la cache KV MLA e gli esperti più frequenti nella memoria della GPU, conserva gli esperti rimanenti nella RAM di sistema e legge la tabella `Engram-Q8` allineata a 4 KiB direttamente dallo storage NVMe con una cache RAM da 900 MiB. Model Console collega il motore a Olares.

    **Funzionalità principali**

    - Generare risposte da input testuali e immagini, con modalità di ragionamento (`high` / `max`) e chiamate a strumenti nelle applicazioni compatibili.
    - Accelerare la generazione con il drafter speculativo integrato `DFly2` a 5 livelli (`0 B` di cache KV aggiuntiva).
    - Usare Model Console per scaricare il modello, verificarne lo stato e regolare le impostazioni del motore.
    - Collegare applicazioni compatibili tramite Olares Router o l'API di chat compatibile con OpenAI.

    **Questa edizione**

    Questa edizione (`SQ-96`) supporta input di testo e immagini (`Hy4-Flash-Vision.strata` viene eseguito nativamente in `strata-hy4`); l'input video non è abilitato. Il limite di contesto predefinito è di 131.072 token, con una richiesta elaborata alla volta. Il contesto disponibile dipende dalla memoria e dalle impostazioni del motore.

    **Prima del primo utilizzo**

    Al primo avvio vengono scaricati 158,1 GB suddivisi in tre file `.strata` v1.0 (`Hy4-Flash-SQ-96.strata`, `Hy4-Flash-Engram-Q8.strata` e `Hy4-Flash-Vision.strata`). Poiché il formato `.strata` v1.0 viene caricato direttamente senza conversione GGUF, l'avvio procede subito al caricamento del modello al termine del download.

    Sono necessari una CPU con supporto AVX2, archiviazione NVMe veloce e un driver NVIDIA della serie R580 o successiva. Questa configurazione è dimensionata per Olares One (24 GiB di VRAM e 96 GiB di RAM host). Consultare i requisiti di risorse indicati prima dell'installazione.

    [Documentazione del modello](https://huggingface.co/tencent/Hy4-flash) · [Modello quantizzato](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Documentazione di Strata](https://github.com/Niko1221/Strata)

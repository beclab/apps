metadata:
  title: Hy4-Flash SQ-96 (Strata)
  description: "Tencent Hy4-Flash SQ-96 for multimodal chat, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    Initial release of Tencent Hy4-Flash SQ-96 on Strata v0.2.18 (strata-hy4 0.1.64) and Model Console (llm-init v1.7.26), tuned for Olares One (24 GiB NVIDIA GPU + 96 GiB RAM).

    - Runs native `.strata` v1.0 `SQ-96` weights (`89.58 GB`) with the shared `Engram-Q8` NVMe lookup shard (`67.58 GB`) and native `Vision` shard (`0.93 GB`) — zero GGUF conversion wait on first startup.
    - Enables multimodal image understanding, `high`/`max` reasoning effort control, OpenAI-compatible tool calling, and embedded 5-layer `DFly2` speculative decoding at 131,072 context tokens.
    - Ships an editable 19-core default CPU limit (20-core platform quota) with 16 AVX-VNNI CPU expert worker threads, 2 MiB hugepage arena collapse (`STRATA_CPUEXP_COLLAPSE=1`), 80 GiB container memory ceiling (57 GiB install requirement) for full dynamic VRAM `AdaptiveExpertCache`, and direct cold I/O (`STRATA_CPUEXP_COLD_IO=direct`).

    [Strata v0.2.18](https://github.com/Niko1221/Strata/releases/tag/v0.2.18)
  fullDescription: |
    Tencent Hy4-Flash is a 220B-parameter Mixture-of-Experts multimodal AI model (12B active parameters per token, with 63.4B parameters in 4 Engram lookup modules) for answering questions, understanding images, reasoning, and calling tools. This app runs Strata's native `.strata` v1.0 `SQ-96` quantized edition locally using the dedicated `strata-hy4` C++/CUDA engine.

    Strata is an open-source inference engine for running large AI models locally. For Hy4-Flash, it keeps the dense trunk, MLA KV cache, and hottest experts in GPU memory, holds the remaining experts in system RAM, and pages the 4-KiB-aligned `Engram-Q8` lookup table directly from NVMe storage with a 900 MiB RAM cache. Model Console connects the engine to Olares.

    **Key features**

    - Generate text responses from text and image inputs, with thinking (`high` / `max` reasoning effort) and tool calling in compatible applications.
    - Accelerate generation with the embedded 5-layer `DFly2` speculative drafter (`0 B` additional KV cache).
    - Use Model Console to download the model, monitor readiness, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition (`SQ-96`) supports text and image input (`Hy4-Flash-Vision.strata` runs natively inside `strata-hy4`); video input is not enabled. The default context limit is 131,072 tokens, with one request processed at a time. Available context depends on memory and engine settings.

    **Before first use**

    First startup downloads 158.1 GB across three `.strata` v1.0 files (`Hy4-Flash-SQ-96.strata`, `Hy4-Flash-Engram-Q8.strata`, and `Hy4-Flash-Vision.strata`). Because `.strata` v1.0 loads directly without GGUF repacking, startup proceeds straight to tokenizer extraction and model loading once the download completes.

    An AVX2-capable CPU, fast NVMe storage, and an NVIDIA driver from the R580 series or newer are required. This preset is sized for Olares One (24 GiB VRAM and 96 GiB of host RAM). See the listed resource requirements before installing.

    [Model documentation](https://huggingface.co/tencent/Hy4-flash) · [Quantized model](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Strata documentation](https://github.com/Niko1221/Strata)

metadata:
  title: Hy4-Flash SQ-96 (Strata)
  description: "通过 Strata 本地运行的腾讯 Hy4-Flash SQ-96，支持图文理解、深度思考与工具调用"
spec:
  upgradeDescription: |
    基于 Strata v0.2.18（strata-hy4 0.1.64）与 Model Console（llm-init v1.7.26）首发腾讯 Hy4-Flash SQ-96，专为 Olares One（24 GiB NVIDIA 显卡 + 96 GiB 内存）调优。

    - 原生加载 `.strata` v1.0 格式 `SQ-96` 权重（`89.58 GB`）、共享 NVMe 查找表分片 `Engram-Q8`（`67.58 GB`）与原生 `Vision` 视觉分片（`0.93 GB`），首次启动无需漫长的 GGUF 转换等待。
    - 原生支持图像理解、`high`/`max` 推理强度调节、兼容 OpenAI 的工具调用，以及内置 5 层 `DFly2` 投机解码与 131,072 默认上下文。
    - 默认提供可编辑的 19 核 CPU 限制（平台配额上限 20 核）、16 个 AVX-VNNI CPU 专家工作线程、2 MiB 大页内存池折叠（`STRATA_CPUEXP_COLLAPSE=1`）、支持全动态显存 `AdaptiveExpertCache` 的 80 GiB 容器内存上限（57 GiB 安装需求），以及直接冷读取 I/O（`STRATA_CPUEXP_COLD_IO=direct`）。

    [Strata v0.2.18](https://github.com/Niko1221/Strata/releases/tag/v0.2.18)
  fullDescription: |
    Tencent Hy4-Flash 是腾讯推出的 220B 总参数混合专家（MoE）多模态大模型（每 token 激活 12B 参数，其中 63.4B 参数位于 4 个 Engram 查找模块中），支持问答生成、图像理解、深度推理与工具调用。本应用通过专用 C++/CUDA 推理引擎 `strata-hy4` 在本地运行 Strata 原生 `.strata` v1.0 `SQ-96` 量化版本。

    Strata 是用于在本地运行大型 AI 模型的开源推理引擎。针对 Hy4-Flash，它将稠密主干、MLA KV 缓存与高频热专家保留在 GPU 显存中，将其余专家常驻于系统内存，并通过 900 MiB 内存缓存从 NVMe 固态硬盘直接按 4 KiB 页对齐读取 `Engram-Q8` 查找表。Model Console 负责将引擎接入 Olares。

    **主要功能**

    - 支持文本与图像多模态输入，并在兼容应用中支持深度思考（`high` / `max` 推理强度）与工具调用。
    - 内置 5 层 `DFly2` 投机解码草稿器（`0 B` 额外 KV 缓存开销），显著提升生成吞吐。
    - 通过 Model Console 下载模型、查看就绪状态并调整引擎参数。
    - 通过 Olares Router 或兼容 OpenAI 的聊天 API 接入各类应用。

    **本版本说明**

    本版本（`SQ-96`）支持文本与图像输入（`Hy4-Flash-Vision.strata` 在 `strata-hy4` 引擎内原生运行），未启用视频输入。默认上下文上限为 131,072 个 token，每次处理一个请求。实际可用上下文取决于内存余量与引擎设置。

    **首次使用前**

    首次启动将下载三个 `.strata` v1.0 文件（`Hy4-Flash-SQ-96.strata`、`Hy4-Flash-Engram-Q8.strata` 与 `Hy4-Flash-Vision.strata`，共约 158.1 GB）。由于 `.strata` v1.0 可直接加载而无需 GGUF 重打包，下载完成后即可直接提取分词器并加载模型。

    需要支持 AVX2 的 amd64 CPU、高速 NVMe 存储以及 R580 系列或更新版本的 NVIDIA 驱动。此预设专为 Olares One（24 GiB 显存与 96 GiB 主机内存）设计，安装前请确认列出的资源要求。

    [模型文档](https://huggingface.co/tencent/Hy4-flash) · [量化模型](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Strata 文档](https://github.com/Niko1221/Strata)

{{- $planeDomainENV := split  ","  .Values.domain.plane -}}
{{- $planeDomain := index $planeDomainENV "_0" -}}

# -------------------------
# PLANE PROXY
# -------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-proxy
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "plane-proxy").replicaCount }}
  selector:
    matchLabels:
      app: plane-proxy
  template:
    metadata:
      labels:
        app: plane-proxy
    spec:
      initContainers:
        - name: check-ready
          image: "docker.io/beclab/wait-for:0.1.0"
          args:
            - '-it'
            - >-
              web:3000,api:8000
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      containers:
        - name: proxy
          image: "docker.io/beclab/makeplane-plane-proxy:v1.4.2"
          ports:
            - containerPort: 80
          env:
            - name: APP_DOMAIN
              value: "{{$planeDomain}}"
            - name: SITE_ADDRESS
              value: ":80"
            - name: LISTEN_HTTP_PORT
              value: "80"
            - name: TRUSTED_PROXIES
              value: "0.0.0.0/0"
            - name: FILE_SIZE_LIMIT
              value: "5242880"
            - name: BUCKET_NAME
              value: "{{ .Values.minio.buckets.plane }}"
            - name: CERT_ACME_CA
              value: "https://acme-v02.api.letsencrypt.org/directory"
            - name: CERT_EMAIL
              value: ""
            - name: CERT_ACME_DNS
              value: ""

          resources:
            requests:
              cpu: "100m"
              memory: 200Mi
            limits:
              cpu: "0.5"
              memory: 500Mi
---

apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: '{{ .Release.Namespace }}'
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 80
      name: http
  selector:
    app: plane-proxy

---

# -------------------------
# PLANE WEB
# -------------------------

apiVersion: apps/v1

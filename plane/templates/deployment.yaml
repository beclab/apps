# -------------------------
# PLANE API
# -------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-api
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "plane-api").replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plane-api
  template:
    metadata:
      labels:
        app: plane-api
    spec:
      initContainers:
        - name: backup-postgres-before-upgrade
          image: "docker.io/beclab/postgres:17.5-alpine"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              DEST=/backup/backups/chart-1.0.16
              MARKER="${DEST}/.backup_complete"
              mkdir -p "$DEST"
              if [ -f "$MARKER" ]; then
                echo "[backup] marker present, skip."
                exit 0
              fi
              table=$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.django_migrations')")
              if [ -z "$table" ]; then
                echo "[backup] no django_migrations, skip."
                exit 0
              fi
              pg_dump --dbname="$DATABASE_URL" --format=custom --file="${DEST}/plane.dump"
              if [ ! -s "${DEST}/plane.dump" ]; then
                echo "[backup] dump missing or empty, stop."
                exit 1
              fi
              pg_restore --list "${DEST}/plane.dump" >/dev/null
              echo "backed up at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
              echo "[backup] wrote ${DEST}/plane.dump"
          envFrom:
            - configMapRef:
                name: api-config
          volumeMounts:
            - name: appdata
              mountPath: /backup
        - name: data-migrator
          image: "docker.io/beclab/makeplane-plane-backend:v1.4.2"
          command:
            - sh
            - -c
            - ./bin/docker-entrypoint-migrator.sh
          env:
            - name: WEB_URL
              value: "https://{{$planeDomain}}"
          envFrom:
            - configMapRef:
                name: api-config
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      containers:
        - name: api
          image: "docker.io/beclab/makeplane-plane-backend:v1.4.2"
          command:
            - sh
            - -c
            - ./bin/docker-entrypoint-api.sh
          env:
            - name: WEB_URL
              value: "https://{{$planeDomain}}"
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: "100m"
              memory: 200Mi
            limits:
              cpu: "0.5"
              memory: 500Mi
      volumes:
        - name: appdata
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-worker
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "plane-worker").replicaCount }}
  selector:
    matchLabels:
      app: plane-worker
  template:
    metadata:
      labels:
        app: plane-worker
    spec:
      initContainers:
        - name: check-ready
          image: "docker.io/beclab/wait-for:0.1.0"
          args:
            - '-it'
            - api:8000
          imagePullPolicy: IfNotPresent
      containers:
        - name: worker
          image: "docker.io/beclab/makeplane-plane-backend:v1.4.2"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              python manage.py wait_for_db
              python manage.py wait_for_migrations
              exec celery -A plane worker -l info --concurrency=2
          env:
            - name: WEB_URL
              value: "https://{{$planeDomain}}"
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---


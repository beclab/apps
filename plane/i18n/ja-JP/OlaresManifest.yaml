metadata:
  title: Plane
  description: JIRA、Linear、Monday、Asana のオープンソース代替
spec:
  upgradeDescription: |
    Chart 1.0.16 は Plane Community Edition を 0.27.1 から 1.4.2 に更新します。イメージは docker.io/beclab/makeplane-plane-frontend、plane-admin、plane-space、plane-live、plane-backend、plane-proxy で、タグは v1.4.2 です。
    Chart は worker と beat-worker を追加します。API のマイグレーションが失敗すると起動を止めます。public.django_migrations がある場合、init コンテナは先に pg_dump を appData/backups/chart-1.0.16/plane.dump へ書き出します。以降の起動と空のデータベースでは省略します。失敗したらこのダンプを復元してください。SECRET_KEY と LIVE_SERVER_SECRET_KEY は変えません。オブジェクトストレージは Olares の MinIO のままです。このインストールは既に 0.27.1 なので、0.13.2 のボリューム移行は不要です。
    https://github.com/makeplane/plane/releases/tag/v1.4.2
  fullDescription: |
    Plane は、ツール自体を管理する混乱なしに、Issue の追跡、Cycle の実行、プロダクトロードマップの管理ができるオープンソースのプロジェクト管理ツールです。
    
    機能
    Issues ファイルアップロード対応の堅牢なリッチテキストエディターでタスクを効率的に作成・管理。サブプロパティの追加や関連 Issue の参照で整理と追跡を強化。
    
    Cycles Cycle でチームの勢いを維持。バーンダウンチャートなどの洞察ツールで進捗を簡単に追跡。
    
    Modules 複雑なプロジェクトを小さく管理しやすいモジュールに分割して簡素化。
    
    Views 最も関連性の高い Issue だけを表示するフィルターを作成してワークフローをカスタマイズ。ビューを簡単に保存・共有。
    
    Pages AI 機能とリッチテキストエディター付きの Plane Pages でアイデアをキャプチャ・整理。テキスト整形、画像挿入、ハイパーリンク追加、メモのアクション項目化。
    
    Analytics すべての Plane データにリアルタイムでアクセス。トレンドを可視化し、ブロッカーを除去し、プロジェクトを前進させ続けます。
    
    Drive（近日公開）：ドキュメント、画像、動画などチームに意味のあるファイルを共有し、問題／解決策で足並みを揃えるのに役立ちます。

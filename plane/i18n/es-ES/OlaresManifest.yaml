metadata:
  title: Plane
  description: Alternativa de código abierto a JIRA, Linear, Monday y Asana
spec:
  upgradeDescription: |
    El chart 1.0.16 actualiza Plane Community Edition de 0.27.1 a 1.4.2. Las imágenes están en docker.io/beclab/makeplane-plane-frontend, plane-admin, plane-space, plane-live, plane-backend y plane-proxy, con la etiqueta v1.4.2.
    El chart añade worker y beat-worker. La migración de la API detiene el arranque si falla. Si ya existe public.django_migrations, un init container escribe antes un volcado pg_dump en appData/backups/chart-1.0.16/plane.dump. Los arranques posteriores y una base vacía lo omiten. Si la migración falla, restaure ese archivo. SECRET_KEY y LIVE_SERVER_SECRET_KEY no cambian. El almacenamiento sigue siendo el MinIO de Olares. Esta instalación ya está en 0.27.1 y no necesita la migración de volúmenes de 0.13.2.
    https://github.com/makeplane/plane/releases/tag/v1.4.2
  fullDescription: |
    Conoce Plane, una herramienta de gestión de proyectos de código abierto para seguir issues, ejecutar cycles y gestionar roadmaps de producto sin el caos de gestionar la herramienta en sí.
    
    Funciones
    Issues Crea y gestiona tareas de forma eficiente con un robusto editor de texto enriquecido que admite subidas de archivos. Mejora la organización y el seguimiento añadiendo subpropiedades y referenciando issues relacionados.
    
    Cycles Mantén el impulso de tu equipo con Cycles. Sigue el progreso sin esfuerzo con burn-down charts y otras herramientas reveladoras.
    
    Modules Simplifica proyectos complejos dividiéndolos en módulos más pequeños y manejables.
    
    Views Personaliza tu flujo de trabajo creando filtros para mostrar solo los issues más relevantes. Guarda y comparte estas vistas con facilidad.
    
    Pages Captura y organiza ideas con Plane Pages, con capacidades de IA y un editor de texto enriquecido. Formatea texto, inserta imágenes, añade hipervínculos o convierte tus notas en elementos accionables.
    
    Analytics Accede a información en tiempo real de todos tus datos de Plane. Visualiza tendencias, elimina bloqueos y mantén tus proyectos avanzando.
    
    Drive (próximamente): El drive te ayuda a compartir documentos, imágenes, vídeos u otros archivos que tengan sentido para ti o tu equipo y alinearos en el problema/solución.

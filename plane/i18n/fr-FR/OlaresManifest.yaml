metadata:
  title: Plane
  description: Alternative open source à JIRA, Linear, Monday et Asana
spec:
  upgradeDescription: |
    Le chart 1.0.16 met à jour Plane Community Edition de 0.27.1 vers 1.4.2. Les images sont docker.io/beclab/makeplane-plane-frontend, plane-admin, plane-space, plane-live, plane-backend et plane-proxy, avec le tag v1.4.2.
    Le chart ajoute worker et beat-worker. La migration de l'API arrête le démarrage en cas d'échec. Si public.django_migrations existe déjà, un init container écrit d'abord une archive pg_dump dans appData/backups/chart-1.0.16/plane.dump. Les démarrages suivants et une base vide ignorent cette copie. En cas d'échec, restaurez cette archive. SECRET_KEY et LIVE_SERVER_SECRET_KEY restent identiques. Le stockage objet reste le MinIO Olares. Cette installation est déjà en 0.27.1 et n'a pas besoin de la migration de volumes 0.13.2.
    https://github.com/makeplane/plane/releases/tag/v1.4.2
  fullDescription: |
    Découvrez Plane, un outil open source de gestion de projet pour suivre les issues, lancer des cycles et gérer les roadmaps produit sans le chaos de gérer l'outil lui-même.
    
    Fonctionnalités
    Issues Créez et gérez efficacement des tâches avec un éditeur de texte enrichi robuste prenant en charge les téléversements de fichiers. Améliorez l'organisation et le suivi en ajoutant des sous-propriétés et en référençant des issues liées.
    
    Cycles Maintenez l'élan de votre équipe avec les Cycles. Suivez les progrès sans effort grâce aux burn-down charts et à d'autres outils éclairants.
    
    Modules Simplifiez les projets complexes en les divisant en modules plus petits et gérables.
    
    Views Personnalisez votre flux de travail en créant des filtres pour n'afficher que les issues les plus pertinentes. Enregistrez et partagez ces vues facilement.
    
    Pages Capturez et organisez des idées avec Plane Pages, avec des capacités IA et un éditeur de texte enrichi. Formatez le texte, insérez des images, ajoutez des hyperliens ou convertissez vos notes en éléments actionnables.
    
    Analytics Accédez à des insights en temps réel sur toutes vos données Plane. Visualisez les tendances, éliminez les bloqueurs et faites avancer vos projets.
    
    Drive (bientôt) : Le drive vous aide à partager documents, images, vidéos ou tout autre fichier pertinent pour vous ou votre équipe et à vous aligner sur le problème/la solution.

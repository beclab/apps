olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  plane-proxy: 1
  plane: 1
  plane-admin: 1
  plane-space: 1
  plane-live: 1
  plane-api: 1
  plane-worker: 1
  plane-beat: 1
metadata:
  name: plane
  icon: https://app.cdn.olares.com/appstore/plane/icon.png
  description: Open Source JIRA, Linear, Monday, and Asana Alternative
  appid: plane
  title: Plane
  version: '1.0.16'
  categories:
  - Productivity_v112
  - workspace
  tags:
  - project-management

entrances:
- name: plane
  host: proxy
  port: 8080
  icon: https://app.cdn.olares.com/appstore/plane/icon.png
  title: Plane
  authLevel: internal
  openMethod: window
spec:
  versionName: '1.4.2'
  upgradeDescription: |
    Chart 1.0.16 upgrades Plane Community Edition from 0.27.1 to 1.4.2.
    Images: docker.io/beclab/makeplane-plane-frontend:v1.4.2, docker.io/beclab/makeplane-plane-admin:v1.4.2, docker.io/beclab/makeplane-plane-space:v1.4.2, docker.io/beclab/makeplane-plane-live:v1.4.2, docker.io/beclab/makeplane-plane-backend:v1.4.2, and docker.io/beclab/makeplane-plane-proxy:v1.4.2.

    The chart adds the 1.4.2 worker and beat-worker. The API init container runs database migrations and stops startup if they fail.

    When public.django_migrations already exists, an init container writes a PostgreSQL custom-format dump to appData/backups/chart-1.0.16/plane.dump before migrating. Later starts skip that dump. A database without that table skips it too. Restore that dump instead of deleting the database if migration fails.

    SECRET_KEY and LIVE_SERVER_SECRET_KEY stay as they are. Object storage stays on the Olares MinIO middleware. This installation is already 0.27.1, which is past the 0.14.0 upgrade checkpoint, so the older volume migration does not apply.

    https://github.com/makeplane/plane/releases/tag/v1.4.2
  featuredImage: https://app.cdn.olares.com/appstore/plane/1.webp
  promoteImage:
  - https://app.cdn.olares.com/appstore/plane/1.webp
  - https://app.cdn.olares.com/appstore/plane/2.webp
  - https://app.cdn.olares.com/appstore/plane/3.webp
  - https://app.cdn.olares.com/appstore/plane/4.webp
  fullDescription: |
    Meet Plane, an open-source project management tool to track issues, run cycles, and manage product roadmaps without the chaos of managing the tool itself.

    Features
    Issues Efficiently create and manage tasks with a robust rich text editor that supports file uploads. Enhance organization and tracking by adding sub-properties and referencing related issues.

    Cycles Maintain your team's momentum with Cycles. Track progress effortlessly using burn-down charts and other insightful tools.

    Modules Simplify complex projects by dividing them into smaller, manageable modules.

    Views Customize your workflow by creating filters to display only the most relevant issues. Save and share these views with ease.

    Pages Capture and organize ideas using Plane Pages, complete with AI capabilities and a rich text editor. Format text, insert images, add hyperlinks, or convert your notes into actionable items.

    Analytics Access real-time insights across all your Plane data. Visualize trends, remove blockers, and keep your projects moving forward.

    Drive (coming soon): The drive helps you share documents, images, videos, or any other files that make sense to you or your team and align on the problem/solution.

  developer: makeplane
  website: https://plane.so/
  sourceCode: https://github.com/makeplane/plane
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  doc: https://docs.plane.so/
  license:
  - text: AGPL
    url: https://github.com/makeplane/plane?tab=AGPL-3.0-1-ov-file
  requiredMemory: 4Gi
  requiredDisk: 50Mi
  requiredCpu: 1
  limitedMemory: 16Gi
  limitedCpu: 8
  supportArch:
  - amd64
permission:
  appData: true
  appCache: true
  userData:
  - Home
middleware:
  postgres:
    username: plane
    password: plane
    databases:
    - name: plane
      distributed: true
  rabbitmq:
    username: plane
    vhosts:
      - name: plane
  minio:
    username: plane
    buckets:
      - name: plane
  redis:
    namespace: plane
options:
  apiTimeout: 0  
  allowedOutboundPorts:
    - 465
    - 587
  analytics:
    enabled: false
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
  - name: rabbitmq
    version: ">=4.0.0-0"
    type: middleware
  - name: minio
    version: ">=1.0.0-0"
    type: middleware

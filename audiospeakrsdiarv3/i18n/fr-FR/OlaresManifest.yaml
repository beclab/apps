metadata:
  title: Speakrs Diarization
  description: Un modèle local pour séparer précisément les tours de parole dans un enregistrement

spec:
  fullDescription: |
    Speakrs Diarization sépare un enregistrement en tours de parole et indique quand chaque personne parle. Il attribue des étiquettes anonymes sans identifier les personnes par leur nom. Cette application utilise le pipeline axé sur la précision et fonctionne en local avec ONNX Runtime.

    **Fonctionnalités principales**

    - Détecter la parole et les changements de locuteur.
    - Attribuer des étiquettes anonymes cohérentes dans tout l'enregistrement.
    - Effectuer la segmentation, la représentation des locuteurs et le regroupement dans un même processus.
    - Choisir un mode de traitement plus précis ou plus rapide après l'installation.
    - Mettre les résultats de diarisation à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible avec au moins `3Gi` de mémoire GPU est requis. Les cartes GTX série 10, Tesla P100 et V100 ne sont pas prises en charge.

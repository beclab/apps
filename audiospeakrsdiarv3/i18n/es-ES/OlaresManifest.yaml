metadata:
  title: Speakrs Diarization
  description: Un modelo local para separar con precisión los turnos de habla en una grabación

spec:
  fullDescription: |
    Speakrs Diarization divide una grabación en turnos de habla y marca cuándo interviene cada persona. Asigna etiquetas anónimas sin identificar a las personas por su nombre. Esta aplicación usa la canalización centrada en la precisión y se ejecuta localmente con ONNX Runtime.

    **Funciones principales**

    - Detectar voz y cambios de hablante.
    - Asignar etiquetas anónimas coherentes en toda la grabación.
    - Procesar segmentación, representaciones de hablante y agrupación en una sola canalización.
    - Tras la instalación, elegir un modo de procesamiento más preciso o más rápido.
    - Poner los resultados de diarización a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `3Gi` de memoria GPU. No se admiten las tarjetas GTX serie 10, Tesla P100 ni V100.

metadata:
  title: Speakrs Diarization
  description: Ein lokales Modell zur genauen Aufteilung von Aufnahmen in Sprecherabschnitte

spec:
  fullDescription: |
    Speakrs Diarization teilt eine Aufnahme in Sprecherabschnitte und markiert, wann jede Person spricht. Es vergibt anonyme Labels, ohne Personen namentlich zu identifizieren. Diese App verwendet die auf Genauigkeit ausgelegte Pipeline und läuft lokal mit ONNX Runtime.

    **Hauptfunktionen**

    - Sprache und Sprecherwechsel erkennen.
    - Durchgängig anonyme Sprecherlabels zuweisen.
    - Segmentierung, Sprecher-Embeddings und Clustering in einer Pipeline verarbeiten.
    - Nach der Installation einen genaueren oder schnelleren Verarbeitungsmodus wählen.
    - Diarisierungsergebnisse für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `3Gi` GPU-Speicher ist erforderlich. Karten der GTX-10-Serie sowie Tesla P100 und V100 werden nicht unterstützt.

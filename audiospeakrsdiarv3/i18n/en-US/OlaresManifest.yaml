metadata:
  title: Speakrs Diarization
  description: A local model for accurate speaker-turn separation in recordings

spec:
  fullDescription: |
    Speakrs Diarization separates a recording into speaker turns and marks when each person speaks. It assigns anonymous labels rather than identifying people by name. This app uses the accuracy-focused pipeline and runs locally with ONNX Runtime.

    **Key features**

    - Detect speech and changes between speakers.
    - Assign consistent anonymous labels across a recording.
    - Process segmentation, speaker embeddings, and clustering in one pipeline.
    - Choose a more accurate or a faster processing mode after install.
    - Make diarization results available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `3Gi` of GPU memory is required. GTX 10-series, Tesla P100, and V100 cards are not supported.

metadata:
  title: Speakrs Diarization
  description: Un modello locale per separare con precisione i turni di parola in una registrazione

spec:
  fullDescription: |
    Speakrs Diarization divide una registrazione in turni di parola e indica quando parla ciascuna persona. Assegna etichette anonime senza identificare le persone per nome. Questa app usa la pipeline orientata alla precisione e funziona in locale con ONNX Runtime.

    **Funzionalità principali**

    - Rilevare il parlato e i cambi di parlante.
    - Assegnare etichette anonime coerenti in tutta la registrazione.
    - Eseguire segmentazione, embedding dei parlanti e raggruppamento in un'unica pipeline.
    - Dopo l'installazione, scegliere una modalità di elaborazione più accurata o più veloce.
    - Rendere i risultati della diarizzazione disponibili alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `3Gi` di memoria GPU. Le schede GTX serie 10, Tesla P100 e V100 non sono supportate.

metadata:
  title: Gemma3 27B (vLLM)
  description: El modelo actual más capaz que se ejecuta en una sola GPU

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla mediante la app de referencia.

    **MODEL OVERVIEW**
    Gemma es una familia ligera de modelos de Google basada en la tecnología Gemini. Los modelos Gemma 3 son multimodales —procesan texto e imágenes— y cuentan con una ventana de contexto de 128K con soporte para más de 140 idiomas. Disponibles en tamaños de 270M, 1B, 4B, 12B y 27B parámetros, destacan en tareas como respuesta a preguntas, resumen y razonamiento, mientras que su diseño compacto permite el despliegue en dispositivos con recursos limitados.

    **Inputs and outputs**
    Input:
    - Cadena de texto, como una pregunta, un prompt o un documento a resumir
    - Imágenes, normalizadas a resolución 896 x 896 y codificadas a 256 tokens cada una
    - Contexto de entrada total de 128K tokens para los tamaños 4B, 12B y 27B, y 32K tokens para el tamaño 1B

    Output:
    - Texto generado en respuesta a la entrada, como una respuesta a una pregunta, análisis del contenido de la imagen o un resumen de un documento
    - Contexto de salida total de 8192 tokens

    **Key features**
    Image and text input: Capacidades multimodales para introducir imágenes y texto y comprender y analizar datos visuales.
    128K token context: Contexto de entrada significativamente amplio para analizar más datos y resolver problemas más complejos.
    Function calling: Construye interfaces en lenguaje natural para trabajar con APIs de programación.
    Wide language support: Trabaja en tu idioma o amplía las capacidades lingüísticas de tu aplicación de IA con soporte para más de 140 idiomas.
    Developer friendly model sizes: Elige un tamaño de modelo (270M, 1B, 4B, 12B, 27B) y nivel de precisión que mejor se adapte a tu tarea y recursos de cómputo.

  upgradeDescription: |
    Actualización del runtime vLLM a v0.22.0-cu129; habilita la optimización -O3 y persiste la caché de torch.compile / FlashInfer.

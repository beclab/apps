metadata:
  title: Gemma3 27B (vLLM)
  description: Il modello attuale più capace che gira su una singola GPU

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **MODEL OVERVIEW**
    Gemma è una famiglia di modelli leggeri di Google basata sulla tecnologia Gemini. I modelli Gemma 3 sono multimodali — elaborano testo e immagini — e offrono una finestra di contesto da 128K con supporto per oltre 140 lingue. Disponibili in dimensioni da 270M, 1B, 4B, 12B e 27B parametri, eccellono in compiti come question answering, summarization e reasoning, mentre il design compatto consente il deployment su dispositivi con risorse limitate.

    **Inputs and outputs**
    Input:
    - Stringa di testo, come una domanda, un prompt o un documento da riassumere
    - Immagini, normalizzate a risoluzione 896 x 896 e codificate in 256 token ciascuna
    - Contesto di input totale di 128K token per le dimensioni 4B, 12B e 27B, e 32K token per la dimensione 1B

    Output:
    - Testo generato in risposta all'input, come una risposta a una domanda, analisi del contenuto dell'immagine o un riassunto di un documento
    - Contesto di output totale di 8192 token

    **Key features**
    Image and text input: Capacità multimodali per inserire immagini e testo e comprendere e analizzare dati visivi.
    128K token context: Contesto di input significativamente ampio per analizzare più dati e risolvere problemi più complessi.
    Function calling: Costruisci interfacce in linguaggio naturale per lavorare con API di programmazione.
    Wide language support: Lavora nella tua lingua o espandi le capacità linguistiche della tua applicazione AI con supporto per oltre 140 lingue.
    Developer friendly model sizes: Scegli una dimensione di modello (270M, 1B, 4B, 12B, 27B) e un livello di precisione adatti al tuo compito e alle risorse di calcolo.

  upgradeDescription: |
    Aggiornamento del runtime vLLM a v0.22.0-cu129; abilita l'ottimizzazione -O3 e persiste la cache di torch.compile / FlashInfer.

metadata:
  title: Gemma3 27B (vLLM)
  description: Le modèle actuel le plus capable qui s'exécute sur un seul GPU

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **MODEL OVERVIEW**
    Gemma est une famille de modèles légers de Google construite sur la technologie Gemini. Les modèles Gemma 3 sont multimodaux — ils traitent texte et images — et offrent une fenêtre de contexte de 128K avec prise en charge de plus de 140 langues. Disponibles en tailles 270M, 1B, 4B, 12B et 27B paramètres, ils excellent dans des tâches comme le question answering, le résumé et le raisonnement, tandis que leur conception compacte permet le déploiement sur des appareils aux ressources limitées.

    **Inputs and outputs**
    Input :
    - Chaîne de texte, telle qu'une question, un prompt ou un document à résumer
    - Images, normalisées à une résolution 896 x 896 et encodées en 256 tokens chacune
    - Contexte d'entrée total de 128K tokens pour les tailles 4B, 12B et 27B, et 32K tokens pour la taille 1B

    Output :
    - Texte généré en réponse à l'entrée, tel qu'une réponse à une question, une analyse du contenu d'image ou un résumé de document
    - Contexte de sortie total de 8192 tokens

    **Key features**
    Image and text input : Capacités multimodales pour saisir images et texte afin de comprendre et analyser des données visuelles.
    128K token context : Contexte d'entrée nettement large pour analyser plus de données et résoudre des problèmes plus complexes.
    Function calling : Construisez des interfaces en langage naturel pour travailler avec des API de programmation.
    Wide language support : Travaillez dans votre langue ou étendez les capacités linguistiques de votre application d'IA avec le support de plus de 140 langues.
    Developer friendly model sizes : Choisissez une taille de modèle (270M, 1B, 4B, 12B, 27B) et un niveau de précision adaptés à votre tâche et à vos ressources de calcul.

  upgradeDescription: |
    Mise à jour du runtime vLLM vers v0.22.0-cu129 ; active l'optimisation -O3 et persiste le cache torch.compile / FlashInfer.

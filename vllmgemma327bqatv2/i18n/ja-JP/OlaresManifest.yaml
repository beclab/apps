metadata:
  title: Gemma3 27B (vLLM)
  description: 単一 GPU で動作する、現時点で最も高性能なモデル

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **MODEL OVERVIEW**
    Gemma は Gemini 技術に基づく Google の軽量モデルファミリーです。Gemma 3 モデルはマルチモーダル（テキストと画像を処理）で、140 以上の言語に対応する 128K コンテキストウィンドウを備えます。270M、1B、4B、12B、27B パラメータサイズがあり、質問応答、要約、推論などのタスクに優れ、コンパクト設計によりリソースが限られたデバイスにもデプロイできます。

    **Inputs and outputs**
    Input:
    - 質問、プロンプト、要約対象の文書などのテキスト文字列
    - 896 x 896 解像度に正規化し、各 256 トークンに符号化された画像
    - 4B・12B・27B サイズは合計入力コンテキスト 128K トークン、1B サイズは 32K トークン

    Output:
    - 質問への回答、画像内容の分析、文書の要約など、入力に対する生成テキスト
    - 合計出力コンテキスト 8192 トークン

    **Key features**
    Image and text input: 画像とテキストを入力し、視覚データを理解・分析するマルチモーダル能力。
    128K token context: より多くのデータ分析と複雑な問題解決のための大きな入力コンテキスト。
    Function calling: プログラミングインターフェース向けの自然言語 UI を構築。
    Wide language support: 自言語で作業、または 140 以上の言語サポートで AI アプリの言語能力を拡張。
    Developer friendly model sizes: タスクと計算資源に合うモデルサイズ（270M、1B、4B、12B、27B）と精度を選択。

  upgradeDescription: |
    vLLM ランタイムを v0.22.0-cu129 にアップグレード；-O3 最適化を有効化し、torch.compile / FlashInfer キャッシュを永続化。

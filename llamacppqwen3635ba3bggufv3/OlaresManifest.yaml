spec:
  onlyAdmin: true
  versionName: 'unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS'
  upgradeDescription: |
    v1.0.24: Model Console (llm-init) updated to v1.7.21.

    v1.0.23: Model Console upgrades to llm-init v1.7.19.

    v1.0.22: llm-init v1.7.12 — completes the previous fix. A restart now
      prompts the health check to reconsider its schedule immediately, rather
      than waiting out an interval that was already running, which could be
      longer than the whole relaunch. The loading state appears about a second
      after the engine stops rather than seven.
    v1.0.21: llm-init v1.7.11 — the engine is checked every second while a
      restart it was asked for is still outstanding. At the steady ten-second
      interval a quick relaunch could take the engine away and give it back
      between two checks, so the phase never moved and a console that had
      just asked for the restart saw nothing at all.
    v1.0.20: llm-init v1.7.10 — an engine restart is visible in the model's
      phase while it happens, instead of being hidden by the sixty-second
      grace on a missing engine, and a restart signaled to an engine that
      was already down is confirmed once it comes back rather than reported
      as unverifiable.
    v1.0.16: llm-init v1.6.1 — the gate and the capacity reading follow
      ENGINE_ARGS instead of the copy they read at startup. This preset is
      unaffected as shipped, but both directions of an edit now take effect:
      adding -np with -no-kvu gives each slot its own share and the gate
      steps out rather than going on charging two tokenizer hops for a pool
      the engine is already policing, and either way the card reports the
      window and slot count the relaunched engine actually resolved. Before
      this, only restarting the deployment did that.

    v1.0.15: llm-init v1.6.0 — this preset names no -np, and llama.cpp's own
      default there is 4 slots sharing one KV pool, not the single slot llm-init
      used to report. So the width Router advertises was wrong, and four slots
      could each claim the whole 131072-token pool. Requests now reserve pool
      room before being forwarded and wait when it is full, answering 503
      kv_budget_exhausted rather than letting the pool run out mid-decode, which
      failed every request generating at that moment. The engine's own /props is
      also read now, so the window and slot count come from what it resolved
      instead of what the flags implied.

    v1.0.13: Lower the NVIDIA host-memory reservation so 1.12.6 timeslice nodes can install more easily (engine request 21Gi→6Gi, chart requiredMemory 22Gi→7Gi). GPU quota unchanged.

    v1.0.9: bump llama.cpp to `server-cuda12-b10068`; HF_TOKEN via Secret + OLARES_SYSTEM_HUGGINGFACE_*.

    v1.0.8: Move `HF_TOKEN` into Kubernetes Secret (`secretKeyRef`); map HF env from `OLARES_SYSTEM_HUGGINGFACE_*`.

    v1.0.7: LLAMACPP_MEMORY_LIMIT 30Gi; llm-init limit 2Gi; limitedMemory 32Gi (30+2).
    v1.0.6: nvidia host memory — requiredMemory 22Gi, LLAMACPP_MEMORY_REQUEST 21Gi, LLAMACPP_MEMORY_LIMIT 26Gi, limitedMemory 30Gi.
    v1.0.5: nvidia host memory — requiredMemory 16Gi, LLAMACPP_MEMORY_REQUEST 15Gi, LLAMACPP_MEMORY_LIMIT 19Gi, limitedMemory 26Gi.
    v1.0.4: bump llama.cpp to server-cuda12-b10068.
    v1.0.4: bump llm-init to v1.3.1.
    v1.0.4: align nvidia requiredMemory=12Gi and LLAMACPP_MEMORY_REQUEST=11Gi (qwopus pattern).
  fullDescription: |
    **Model Overview**
    Qwen3.6-35B-A3B is a Mixture-of-Experts vision-language model from the Qwen series (Alibaba), with 35B total parameters and about 3B active per token. It features a built-in vision encoder, very long context support, and ships with thinking, tool-calling, and vision capabilities. This app serves the `UD-IQ4_XS` GGUF build from `unsloth/Qwen3.6-35B-A3B-GGUF` via llama.cpp.

    Well suited for multimodal workloads that need long context and vision understanding. The Qwen3.6 35B series natively supports extended context windows and includes a vision encoder for image-and-text tasks.

    **Preset Configuration**
    - Model: `unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS` (with `mmproj-F16.gguf` projector for vision)
    - Capabilities: thinking, tools, vision
    - Engine args: `-c 131072 -ngl all -fa on -ctk q8_0 -ctv q8_0` (128K context, full GPU offload, KV cache quantized to q8_0)
    - Required GPU memory: `23Gi`

    **Accelerator modes**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Uses `23Gi` GPU memory; `-ngl all` for full GPU  |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod     |
    
    **How It Works**
    First, Model Console downloads the model and gets it ready, then `llama.cpp` starts serving the model when it’s ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp**: Runs the model and serves API requests (port 8081)
    - **Model Console**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.


  developer: Alibaba
  website: https://qwen.ai/home
  sourceCode: https://github.com/QwenLM/Qwen3
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  license:
    - text: Apache-2.0
      url: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF

  accelerator:
    #   nvidia       — discrete GPU; LLAMACPP_REQUIRED_GPU_MEMORY -> gpumem
    #   nvidia-gb10  — DGX Spark unified memory; same env -> pod memory
    - mode: nvidia
      limitedCpu: "15360m"
      requiredCpu: "1100m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      # Engine MEMORY_REQUEST 6Gi + llm-init <= requiredMemory 7Gi; MEMORY_LIMIT 30Gi + llm-init 2Gi <= limitedMemory 32Gi
      limitedMemory: "32Gi"
      requiredMemory: "7Gi"
      requiredGPUMemory: "23Gi"
      limitedGPUMemory: "24Gi"
    - mode: nvidia-gb10
      limitedCpu: "15360m"
      requiredCpu: "1100m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "48Gi"
      requiredMemory: "32Gi"

  supportArch:
    - amd64
    - arm64
permission:
  appCache: true
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  # Model is preset for this app; these values are fixed and not user-editable.
  - envName: MODEL_SOURCE        # example: hf://unsloth/Qwen3-0.6B-GGUF --include Qwen3-0.6B-Q4_K_M.gguf
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://unsloth/Qwen3.6-35B-A3B-GGUF --include Qwen3.6-35B-A3B-UD-IQ4_XS.gguf,hf://unsloth/Qwen3.6-35B-A3B-GGUF --include mmproj-F16.gguf"
    description:  "Example: hf://unsloth/Qwen3-0.6B-GGUF --include Qwen3-0.6B-Q4_K_M.gguf. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`."
    regex: "^hf://"
  - envName: MODEL_NAME          # example: unsloth/Qwen3-0.6B-GGUF:Q4_K_M (-hf repo:quant)
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS"
    description:  "Example: unsloth/Qwen3-0.6B-GGUF:Q4_K_M. The name of your model in `owner/repo:quant` format"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "thinking,tools,vision"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description:  "The model capabilities. Pick what your model supports, if no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # example: -c 8192 -ngl all -fa on
    required: true
    default: "-c 131072 -ngl all -fa on -ctk q8_0 -ctv q8_0"
    type: string
    editable: true
    applyOnChange: true
    description:  "Example: -c 8192 -ngl all -fa on. Extra llama.cpp options, to fully use GPU, add `-ngl all`, for CPU, it adds `-ngl 0` automatically. You can also use values like `LLAMA_ARG_*=val`."
  - envName: LOG_LEVEL           # single-select: debug | info | warn | error
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: LLAMACPP_CPU_REQUEST    # default: 200m
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_REQUEST # sum with llm-init <= requiredMemory 7Gi
    required: true
    default: "6Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_LIMIT # 30Gi + llm-init 2Gi <= limitedMemory 32Gi
    required: true
    default: "30Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "23Gi"
    description:  "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB. On Spark it sets pod memory."
    regex: "^[0-9]+(Gi|Mi)?$"

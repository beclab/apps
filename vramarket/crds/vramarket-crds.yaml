apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vramleases.vramarket.olares
spec:
  group: vramarket.olares
  scope: Namespaced
  names:
    plural: vramleases
    singular: vramlease
    kind: VRAMLease
    shortNames: [vrlease]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: VRAM_MiB
          type: integer
          jsonPath: .spec.vramMib
        - name: Node
          type: string
          jsonPath: .spec.nodeName
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [lesseeDid, providerDid, vramMib, agreedPricePerGibHour]
              properties:
                lesseeDid: {type: string}
                providerDid: {type: string}
                nodeName: {type: string}
                gpuUuid: {type: string}
                vramMib: {type: integer, minimum: 256, maximum: 30720}
                agreedPricePerGibHour: {type: number, minimum: 0}
                durationS: {type: integer, minimum: 300}
                maxLatencyMs: {type: number}
                # Référence OCI libre (tag ou digest) — marketplace d'images
                # arbitraires, la vérif cosign est opt-in (m07).
                imageDigest: {type: string, maxLength: 256}
                lesseeZone: {type: string}
                # Traçabilité du match (écrits par m04 à la création du bail)
                bidId: {type: string, maxLength: 64}
                offerId: {type: string, maxLength: 64}
                score: {type: number}
                matchedAt: {type: number}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [INTENT, FUNDED, RUNNING, MIGRATING, SETTLING, CLOSED, SLASHED]
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      from: {type: string}
                      to: {type: string}
                      ts: {type: number}
                failoverCount: {type: integer}
                settleReason: {type: string}
                # Écrits par m05/m10 : sans ces champs le schéma structurel
                # les ÉLIMINAIT silencieusement (pruning) — la facture et la
                # fenêtre de grâce n'étaient jamais persistées.
                fundedAt: {type: number}
                closedAt: {type: number}
                graceUntil: {type: number}
                podName: {type: string}
                nodeName: {type: string}
                invoice:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vramoffers.vramarket.olares
spec:
  group: vramarket.olares
  scope: Namespaced
  names:
    plural: vramoffers
    singular: vramoffer
    kind: VRAMOffer
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [providerDid, nodeName, gpuUuid, vramMib, pricePerGibHour]
              properties:
                providerDid: {type: string}
                nodeName: {type: string}
                gpuUuid: {type: string}
                vramMib: {type: integer, minimum: 256, maximum: 30720}
                pricePerGibHour: {type: number, minimum: 0, exclusiveMinimum: true}
                minLeaseS: {type: integer}
                maxLeaseS: {type: integer}
                exclusive: {type: boolean, default: false}
            status:
              type: object
              properties:
                phase: {type: string, enum: [OPEN, MATCHED, SUSPENDED, CLOSED]}
                allocatedMib: {type: integer, minimum: 0}
---

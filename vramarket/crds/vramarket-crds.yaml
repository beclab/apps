apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vramaccounts.vramarket.olares
spec:
  group: vramarket.olares
  scope: Namespaced
  names: {plural: vramaccounts, singular: vramaccount, kind: VRAMAccount}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ownerDid: {type: string}
            status:
              type: object
              properties:
                balance: {type: number}
                entries:                 # append-only, double-entrée
                  type: array
                  items:
                    type: object
                    properties:
                      ts: {type: number}
                      dr: {type: number}
                      cr: {type: number}
                      memo: {type: string}
                      txHash: {type: string}   # preuve on-chain (rail x402)
                      network: {type: string}  # "base" | ""

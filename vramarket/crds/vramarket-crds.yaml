apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vramnodes.vramarket.olares
spec:
  group: vramarket.olares
  scope: Namespaced
  names: {plural: vramnodes, singular: vramnode, kind: VRAMNode}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: VRAM_Free_MiB
          type: integer
          jsonPath: .status.freeVramMib
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                providerDid: {type: string}
                nodeName: {type: string}
            status:
              type: object
              properties:
                phase: {type: string, enum: [REGISTERING, ACTIVE, SUSPECT, DOWN, DRAINING]}
                lastHeartbeatUnix: {type: number}
                freeVramMib: {type: integer}
                inventoryFingerprint: {type: string}
                # Inventaire GPU publié par le heartbeat m02 (lu par m04 pour
                # le rang GPU) — était éliminé par le pruning structurel.
                gpuModel: {type: string}
                gpuUuid: {type: string}
                vramTotalMib: {type: integer}
                gpuCards:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                # Utilisation réelle (nvidia-smi via m01), affichée au locataire
                gpuUtilPct: {type: number}
                vramUsedMib: {type: integer}
                # m08 : latences mesurées vers les autres zones (ms)
                latencyMs:
                  type: object
                  additionalProperties: {type: number}
                # m09 : score publié par le control plane à chaque événement
                reputationScore: {type: number}
                lastMeter:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vramaccounts.vramarket.olares
spec:
  group: vramarket.olares
  scope: Namespaced
  names: {plural: vramaccounts, singular: vramaccount, kind: VRAMAccount}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ownerDid: {type: string}
            status:
              type: object
              properties:
                balance: {type: number}
                entries:                 # append-only, double-entrée
                  type: array
                  items:
                    type: object
                    properties:
                      ts: {type: number}
                      dr: {type: number}
                      cr: {type: number}
                      memo: {type: string}
                      txHash: {type: string}   # preuve on-chain (rail x402)
                      network: {type: string}  # "base" | ""

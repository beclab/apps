      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [lesseeDid, vramMib, maxPricePerGibHour, durationS, imageDigest]
              properties:
                lesseeDid: {type: string}
                lesseeZone: {type: string}
                vramMib: {type: integer, minimum: 256}
                maxPricePerGibHour: {type: number, minimum: 0, exclusiveMinimum: true}
                maxLatencyMs: {type: number, default: 50}
                minGpuModelRank: {type: integer, default: 0}
                durationS: {type: integer, minimum: 300}

# Service du control plane : jointure interne agent->control (heartbeats m02,
# enroll DID) et cible de l'entrance Olares (port 8080).
apiVersion: v1
kind: Service
metadata:
  name: vramarket
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: vramarket-control}
  ports:
    - {name: http, port: 8080, targetPort: 8080}

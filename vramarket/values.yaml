# values.yaml — défauts vramarket
userspace:
  appData: ""
  appCache: ""
olaresEnv: {}

control:
  image: ghcr.io/jeffreyturov-dev/vramarket-control:0.1.23
  replicas: 1
  # Envelope plate CPU-only (pas de mode accelerator) :
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: "2", memory: 2Gi}

agent:
  image: ghcr.io/jeffreyturov-dev/vramarket-agent:0.1.21
  # spec.accelerator déclaré dans le manifest subChart agent :
  #   mode: nvidia, supportMultiCard: true, supportMultiNodes: true
  #   requiredGPUMemory: 2Gi   (= PROVIDER_RESERVE_MIB de m06)
  nodeSelector:
    gpu.bytetrade.io/nvidia: "true"

workloads:
  vramarket:
    replicaCount: 1

payment:
  rail: internal      # internal | x402_usdc | paypal | paypal_mcp

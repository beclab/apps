metadata:
  title: Lev System One
  description: "分類・ルーティング・コンテンツ審査のためのSystem Oneモデル"

spec:
  fullDescription: |
    Lev System Oneは英語テキストを評価し、定義済みの選択肢からの選択（choice）、指定された段階での評価（score）、または「はい」となる確率（noul）を返します。アプリはこれらの結果を分類、リクエストの振り分け、コンテンツ審査に利用できます。

    対応するOlaresアプリは、TypeSafe互換の/v1/systemone APIを通じてモデルを利用できます。呼び出し元が明示的に選択する必要があります。このバージョンはJevの代替や、人間の監督なしで行う高リスクの判断を目的としていません。

    この構成にはNVIDIA GPUが必要で、英語のみに対応しています。コンテキスト長は4,096トークン、選択肢は最大255個、評価段階は最大10段階です。一度に1件のリクエストを実行します。

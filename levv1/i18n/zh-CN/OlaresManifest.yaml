metadata:
  title: Lev System One
  description: "用于分类、路由和内容审核决策的 System One 模型"

spec:
  fullDescription: |
    Lev System One 分析英文文本并返回结构化决策：从预定义选项中作出选择（choice）、按指定等级评分（score），或估计答案为“是”的概率（noul）。应用可以将这些结果用于分类、请求路由和内容审核。

    兼容的 Olares 应用可通过兼容 TypeSafe 的 /v1/systemone API 访问该模型。调用方必须显式选择它。此版本不用于替代 Jev，也不适用于无人监督的高风险决策。

    此部署需要 NVIDIA GPU，仅支持英文，上下文长度为 4,096 个 token，最多支持 255 个候选选项和 10 个评分等级。每次执行一个请求。

metadata:
  title: Lev System One
  description: "Un modello System One per classificazione, instradamento e moderazione"

spec:
  fullDescription: |
    Lev System One analizza testi in inglese e restituisce decisioni strutturate: una selezione tra opzioni predefinite (choice), una valutazione su una scala definita (score) o la probabilità di una risposta affermativa (noul). Le applicazioni possono usare questi risultati per la classificazione, l'instradamento delle richieste e la moderazione dei contenuti.

    Le applicazioni Olares compatibili possono accedere al modello tramite l'API /v1/systemone compatibile con TypeSafe. Le applicazioni chiamanti devono selezionarlo esplicitamente. Questa versione non è destinata a sostituire Jev né a prendere decisioni ad alto rischio senza supervisione umana.

    Questa distribuzione richiede una GPU NVIDIA e supporta solo l'inglese, con un contesto di 4.096 token, fino a 255 opzioni di scelta e fino a 10 livelli di valutazione. Esegue una richiesta alla volta.

metadata:
  title: Lev System One
  description: Typed classification, routing, and moderation decisions powered by Lev
spec:
  fullDescription: |
    Lev is a compact System One model for typed classification, routing, and
    moderation decisions. It exposes choice, score, and noul questions through
    the TypeSafe-compatible /v1/systemone API. The upstream model reports a
    68.9% S1Bench macro average. This release is an explicit-choice model and is
    not intended as a Jev replacement or for unsupervised high-risk decisions.

    This NVIDIA-only deployment supports English, up to 255 choice options,
    10 score levels, a 4,096-token context, and one executing request at a time.

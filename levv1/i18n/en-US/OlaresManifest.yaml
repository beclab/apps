metadata:
  title: Lev System One
  description: "A System One model for classification, routing, and moderation decisions"

spec:
  fullDescription: |
    Lev System One evaluates English text and returns structured decisions: a selection from predefined options (choice), a rating on a defined scale (score), or the probability of a yes answer (noul). Applications can use these results for classification, request routing, and content moderation.

    Compatible Olares applications can access the model through the TypeSafe-compatible /v1/systemone API. Callers must select it explicitly. This release is not intended as a Jev replacement or for high-risk decisions without human supervision.

    This deployment requires an NVIDIA GPU and supports English only, with a 4,096-token context, up to 255 choice options, and up to 10 score levels. It executes one request at a time.

metadata:
  title: Lev System One
  description: "Un modelo System One para clasificación, enrutamiento y moderación"

spec:
  fullDescription: |
    Lev System One evalúa textos en inglés y devuelve decisiones estructuradas: una selección entre opciones predefinidas (choice), una valoración en una escala definida (score) o la probabilidad de una respuesta afirmativa (noul). Las aplicaciones pueden usar estos resultados para clasificar, enrutar solicitudes y moderar contenido.

    Las aplicaciones Olares compatibles pueden acceder al modelo mediante la API /v1/systemone compatible con TypeSafe. Las aplicaciones que lo invocan deben seleccionarlo explícitamente. Esta versión no está concebida para sustituir a Jev ni para tomar decisiones de alto riesgo sin supervisión humana.

    Este despliegue requiere una GPU NVIDIA y solo admite inglés, con un contexto de 4.096 tokens, hasta 255 opciones de elección y hasta 10 niveles de puntuación. Ejecuta una solicitud a la vez.

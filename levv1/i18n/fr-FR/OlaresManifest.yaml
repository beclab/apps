metadata:
  title: Lev System One
  description: "Un modèle System One pour la classification, le routage et la modération"

spec:
  fullDescription: |
    Lev System One analyse des textes anglais et renvoie des décisions structurées : une sélection parmi des options prédéfinies (choice), une note sur une échelle définie (score) ou la probabilité d'une réponse affirmative (noul). Les applications peuvent utiliser ces résultats pour la classification, le routage des requêtes et la modération de contenu.

    Les applications Olares compatibles peuvent accéder au modèle via l'API /v1/systemone compatible avec TypeSafe. Les applications appelantes doivent le sélectionner explicitement. Cette version n'est pas destinée à remplacer Jev ni à prendre des décisions à haut risque sans supervision humaine.

    Ce déploiement nécessite un GPU NVIDIA et prend uniquement en charge l'anglais, avec un contexte de 4 096 tokens, jusqu'à 255 options de choix et 10 niveaux de notation. Il exécute une seule requête à la fois.

olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: v3
metadata:
  name: levv1
  appid: levv1
  title: Lev System One
  description: Typed classification, routing, and moderation decisions powered by Lev
  icon: https://app.cdn.olares.com/appstore/lev/icon.png
  version: 0.1.1
  categories:
    - AI
    - models
  tags:
    - llm
entrances:
  - name: levapi
    host: download-svc
    port: 8090
    title: Lev Model Console
    icon: https://app.cdn.olares.com/appstore/lev/icon.png
    openMethod: window
    authLevel: internal
sharedEntrances:
  - name: levv1
    host: sharedentrances-api
    port: 0
    title: Lev
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/lev/icon.png
workloadReplicas:
  levv1: 1
  llminit: 1
spec:
  onlyAdmin: true
  runAsUser: true
  versionName: "0.1.1"
  fullDescription: |
    Lev is a compact System One model for typed classification, routing, and
    moderation decisions. It exposes choice, score, and noul questions through
    the TypeSafe-compatible /v1/systemone API. The upstream model reports a
    68.9% S1Bench macro average. This release is an explicit-choice model and is
    not intended as a Jev replacement or for unsupervised high-risk decisions.

    This NVIDIA-only deployment supports English, up to 255 choice options,
    10 score levels, a 4,096-token context, and one executing request at a time.
  developer: Interfaze
  website: https://huggingface.co/interfaze-ai/lev
  sourceCode: https://github.com/Abhinavexists/lev
  submitter: Olares
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/Abhinavexists/lev/blob/cf104b69329302e4eac674a730c71f3511047db8/LICENSE
  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "2"
      limitedCpu: "8"
      requiredMemory: 12Gi
      limitedMemory: 24Gi
      requiredDisk: 2Gi
      limitedDisk: 20Gi
      requiredGPUMemory: 13Gi
      limitedGPUMemory: 16Gi
permission:
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  shared: true
  LLMGatewaySupported: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: info
    options:
      - title: Debug
        value: debug
      - title: Info
        value: info
      - title: Warn
        value: warn
      - title: Error
        value: error

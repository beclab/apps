olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: v3
metadata:
  name: levv1
  appid: levv1
  title: Lev System One
  description: A System One model for classification, routing, and moderation decisions
  icon: https://app.cdn.olares.com/appstore/lev/icon.png
  version: 0.1.2
  categories:
    - AI
    - models
  tags:
    - llm
    - system-one
    - decision-model
entrances:
  - name: levapi
    host: download-svc
    port: 8090
    title: Lev Model Console
    icon: https://app.cdn.olares.com/appstore/lev/icon.png
    openMethod: window
    authLevel: internal
sharedEntrances:
  - name: levv1
    host: sharedentrances-api
    port: 0
    title: Lev
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/lev/icon.png
workloadReplicas:
  levv1: 1
  llminit: 1
spec:
  onlyAdmin: true
  runAsUser: true
  versionName: "0.1.1"
  fullDescription: |
    Lev System One evaluates English text and returns structured decisions: a selection from predefined options (choice), a rating on a defined scale (score), or the probability of a yes answer (noul). Applications can use these results for classification, request routing, and content moderation.

    Compatible Olares applications can access the model through the TypeSafe-compatible /v1/systemone API. Callers must select it explicitly. This release is not intended as a Jev replacement or for high-risk decisions without human supervision.

    This deployment requires an NVIDIA GPU and supports English only, with a 4,096-token context, up to 255 choice options, and up to 10 score levels. It executes one request at a time.

  developer: Interfaze
  website: https://huggingface.co/interfaze-ai/lev
  sourceCode: https://github.com/Abhinavexists/lev
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  license:
    - text: Apache-2.0
      url: https://github.com/Abhinavexists/lev/blob/cf104b69329302e4eac674a730c71f3511047db8/LICENSE
  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "2"
      limitedCpu: "8"
      requiredMemory: 12Gi
      limitedMemory: 24Gi
      requiredDisk: 2Gi
      limitedDisk: 20Gi
      requiredGPUMemory: 13Gi
      limitedGPUMemory: 16Gi
permission:
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  shared: true
  LLMGatewaySupported: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: info
    options:
      - title: Debug
        value: debug
      - title: Info
        value: info
      - title: Warn
        value: warn
      - title: Error
        value: error

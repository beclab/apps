apiVersion: v1
kind: Service
metadata:
  name: rustdesk-web
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: rustdesk, component: id}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-id
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: rustdesk, component: id}
  ports:
  - {name: nat, port: 21115, targetPort: 21115, protocol: TCP}
  - {name: id-tcp, port: 21116, targetPort: 21116, protocol: TCP}
  - {name: id-udp, port: 21116, targetPort: 21116, protocol: UDP}
  - {name: relay, port: 21117, targetPort: 21117, protocol: TCP}

apiVersion: v1
kind: ConfigMap
metadata:
  name: rustdesk-dashboard
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log /dev/stdout;
      default_type text/html;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        location = /healthz { return 200 'ok'; }
        location = /api/connection {
          default_type application/json;
          return 200 '{"host":"${SERVER_HOST}"}';
        }
        location = /api/public-key {
          alias /data/id_ed25519.pub;
          default_type text/plain;
          limit_except GET { deny all; }
        }
        location = / { root /etc/rustdesk; try_files /index.html =404; }
        location / { return 404; }
      }
    }
  index.html: |
    <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RustDesk Server</title><style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17263c;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:60px auto;padding:0 24px}header{margin-bottom:32px}.language{display:flex;justify-content:flex-end;margin-bottom:8px}.language-picker{position:relative;width:36px;height:36px;color:#64748b;border-radius:8px}.language-picker:hover{background:#e9eef5;color:#17263c}.language-picker svg{position:absolute;inset:8px;width:20px;height:20px;pointer-events:none}.language-picker select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.language-picker:focus-within{outline:3px solid #86b7ff;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.tabs{flex-wrap:wrap}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:3px solid #86b7ff;outline-offset:3px}.note{background:#fff7ed;border-color:#ea580c;padding:14px;border-radius:6px;color:#7c2d12}h1{font-size:36px;letter-spacing:-1px;margin-bottom:8px}h2{font-size:20px}p{color:#526176}.card{background:white;border:1px solid #e1e6ef;border-radius:16px;padding:24px;margin:20px 0}.row{display:grid;grid-template-columns:150px 1fr 74px;gap:12px;align-items:center;margin:16px 0}code{display:block;background:#f4f6fa;padding:12px;border-radius:8px;word-break:break-all;font-size:14px}button{border:0;border-radius:8px;padding:10px;cursor:pointer;background:#155eef;color:white}.tabs{display:flex;gap:8px;border-bottom:1px solid #e1e6ef;margin:20px 0}.tabs button{background:transparent;color:#526176;border-radius:8px 8px 0 0;padding:12px 18px;border-bottom:3px solid transparent}.tabs button[aria-selected="true"]{color:#155eef;background:#eef4ff;border-bottom-color:#155eef}.note{border-left:4px solid #155eef;padding-left:16px}li{margin:10px 0}a{color:#155eef}@media(max-width:640px){main{margin-top:28px}.row{grid-template-columns:1fr}h1{font-size:30px}}
    </style><main><div class="language"><label for="language" id="languageLabel" class="sr-only">Language</label><div class="language-picker" id="languagePicker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></svg><select id="language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option></select></div></div><header><span>RustDesk Server OSS · 1.1.16</span><h1>RustDesk Server</h1><p id="intro">Connect your devices through your Olares ID and relay server.</p></header>
    <section class="card"><h2 id="settings">Client connection settings</h2><p id="where">Enter these values in RustDesk → Settings → Network on both computers.</p>
    <div class="tabs" role="tablist" aria-label="Connection mode"><button id="vpnTab" role="tab" aria-selected="true" aria-controls="connectionPanel">VPN connection</button><button id="overlayTab" role="tab" aria-selected="false" aria-controls="connectionPanel" tabindex="-1">Local Overlay</button></div><div id="connectionPanel" role="tabpanel" aria-labelledby="vpnTab"><p id="modeHelp"></p><div class="row"><strong id="idLabel">ID server</strong><code id="id"></code><button data-copy="id">Copy</button></div>
    <div class="row"><strong id="relayLabel">Relay server</strong><code id="relay"></code><button data-copy="relay">Copy</button></div>
    <div class="row"><strong id="keyLabel">Key</strong><code id="key">Loading public key…</code><button data-copy="key">Copy</button></div><p id="api">Leave API Server empty. This is the open-source server, without a Pro management console.</p><p class="note" id="modeWarning"></p></div></section>
    <section class="card"><h2 id="steps">Get connected</h2><ol><li id="step1">Install RustDesk on the controlling and remote computers.</li><li id="step2">When outside the local network, connect both devices to the Olares private network with LarePass VPN.</li><li id="step3">Apply the server settings above on both computers.</li><li id="step4">Enter the remote computer’s RustDesk ID and approve the connection there, or use its unattended-access password.</li></ol><p class="note" id="note">Use these domain names with Olares VPN connected. Opening this page alone does not provide the TCP/UDP connection.</p><a href="https://rustdesk.com/download" target="_blank" rel="noopener noreferrer" id="download">Download RustDesk client ↗</a></section><p id="status" role="status" aria-live="polite"></p></main>
    <script>
    const messages = {{ .Files.Get "files/i18n.yaml" | fromYaml | toJson }};
    const byId=id=>document.getElementById(id);
    function matchLanguage(value){const v=String(value||'').toLowerCase();return v.startsWith('zh')?'zh-CN':Object.keys(messages).find(k=>v===k||v.startsWith(k+'-'))}
    let saved;try{saved=localStorage.getItem('rustdesk-language')}catch{}
    let lang=matchLanguage(saved)||(navigator.languages||[navigator.language]).map(matchLanguage).find(Boolean)||'en';
    let mode='vpn',key='',keyFailed=false;
    const t=name=>messages[lang][name]||messages.en[name];
    function renderMode(){
      const local=mode==='overlay';
      for(const [name,id] of [['vpn','vpnTab'],['overlay','overlayTab']]){byId(id).setAttribute('aria-selected',String(mode===name));byId(id).tabIndex=mode===name?0:-1;}
      byId('connectionPanel').setAttribute('aria-labelledby',local?'overlayTab':'vpnTab');
      const host=location.hostname;
      byId('id').textContent=local?'Overlay_IP:21116':host+':31116';
      byId('relay').textContent=local?'Overlay_IP:21117':host+':31117';
      for(const id of ['id','relay'])document.querySelector('[data-copy="'+id+'"]').hidden=local;
      byId('modeHelp').textContent=t(local?'overlayHelp':'vpnHelp');
      byId('modeWarning').textContent=t('modeWarning');
    }
    function renderLanguage(){
      document.documentElement.lang=lang;byId('language').value=lang;byId('languageLabel').textContent=t('language');byId('languagePicker').title=t('language');byId('language').setAttribute('aria-label',t('language'));
      for(const id of ['intro','settings','where','vpnTab','overlayTab','idLabel','relayLabel','keyLabel','api','steps','step1','step2','step3','step4','note','download'])byId(id).textContent=t(id);
      document.querySelector('[role="tablist"]').setAttribute('aria-label',t('settings'));
      document.querySelectorAll('[data-copy]').forEach(b=>{b.textContent=t('copy');b.setAttribute('aria-label',t('copy')+' '+t(b.dataset.copy==='id'?'idLabel':b.dataset.copy==='relay'?'relayLabel':'keyLabel'))});
      byId('key').textContent=key||t(keyFailed?'keyError':'keyLoading');byId('status').textContent='';renderMode();
    }
    byId('language').onchange=e=>{lang=matchLanguage(e.target.value)||'en';try{localStorage.setItem('rustdesk-language',lang)}catch{}renderLanguage()};
    for(const [name,id] of [['vpn','vpnTab'],['overlay','overlayTab']]){
      byId(id).onclick=()=>{mode=name;renderMode()};
      byId(id).onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();mode=e.key==='Home'?'vpn':e.key==='End'?'overlay':mode==='vpn'?'overlay':'vpn';renderMode();byId(mode==='vpn'?'vpnTab':'overlayTab').focus()}};
    }
    renderLanguage();
    fetch('/api/public-key',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(value=>{const v=value.trim();if(!/^[A-Za-z0-9+/=_-]{40,100}$/.test(v))throw Error();key=v;byId('key').textContent=key}).catch(()=>{keyFailed=true;byId('key').textContent=t('keyError')});
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const id=b.dataset.copy;if((id==='key'&&!key)||b.disabled)return;try{await navigator.clipboard.writeText(byId(id).textContent);byId('status').textContent=t('copied')}catch{byId('status').textContent=t('copyManual')}});
    </script></html>

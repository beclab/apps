en:
  language: Language
  intro: Connect your devices through your Olares ID and relay server
  settings: Client connection settings
  where: Enter these values in RustDesk → Settings → Network on both computers
  vpnTab: VPN connection
  overlayTab: Local Overlay
  idLabel: ID server
  relayLabel: Relay server
  keyLabel: Key
  api: Leave API Server empty. This is the open-source server without a Pro management console.
  steps: Get connected
  step1: Install RustDesk on both computers
  step2: 'Use the same connection mode on both computers where possible: VPN or local Overlay'
  step3: Apply the server addresses and the same Key on both computers
  step4: Enter the remote computer’s RustDesk ID and approve the connection there, or use its unattended-access password
  note: Making this page public does not expose the RustDesk TCP/UDP ports to the internet
  download: Download RustDesk client ↗
  copy: Copy
  copied: Copied
  copyManual: Select the text to copy it manually
  keyLoading: Loading public key…
  keyError: Public key is unavailable. Refresh the page to try again.
  vpnHelp: Connect both computers to LarePass VPN and use the application domain names below
  overlayHelp: Both computers must be on the same network as Olares. Open Settings → Network → Overlay Gateway, enable RustDesk,
    and copy the IP shown there. Replace Overlay_IP below with that address. This page does not detect the Overlay IP.
  modeWarning: Both computers must be able to reach the same relay address. RustDesk passes the remote computer’s relay address
    to the controlling computer. If one uses VPN and the other uses Overlay, the connection fails when the controlling computer
    cannot reach that address. Using the same connection mode on both computers is recommended.
  overlayMissing: 'Overlay IP unavailable: enable Overlay in Settings and refresh this page'
zh-CN:
  language: 语言
  intro: 通过 Olares ID 服务和中继服务连接电脑
  settings: 客户端连接配置
  where: 在两台电脑的 RustDesk「设置 → 网络」中填写以下内容
  vpnTab: VPN 连接
  overlayTab: 内网 Overlay
  idLabel: ID 服务器
  relayLabel: 中继服务器
  keyLabel: Key
  api: API 服务器留空。这里运行开源服务端，不包含 Pro 管理控制台。
  steps: 连接步骤
  step1: 在两台电脑上安装 RustDesk 客户端
  step2: 建议两台电脑选择相同的连接方式：VPN 或内网 Overlay
  step3: 在两端填写对应的服务器地址和相同的 Key
  step4: 输入被控电脑的 RustDesk ID，由对方确认连接，或使用其无人值守密码
  note: 将本页面设为 Public 不会将 RustDesk 的 TCP/UDP 端口开放到公网
  download: 下载 RustDesk 客户端 ↗
  copy: 复制
  copied: 已复制
  copyManual: 请选中文本手动复制
  keyLoading: 正在读取公钥…
  keyError: 暂时无法读取公钥，请刷新页面重试。
  vpnHelp: 两台电脑都连接 LarePass VPN，然后使用下方的完整应用域名
  overlayHelp: 两台电脑都需要与 Olares 位于同一网络。请前往「设置 → 网络 → Overlay 网关」，启用 RustDesk 并查看分配的 IP，再用该 IP 替换下方的 Overlay_IP。本页面不自动获取 Overlay
    IP。
  modeWarning: 两端需能访问同一个中继地址。RustDesk 会将被控端的中继地址传给控制端。如果一端使用 VPN、另一端使用 Overlay，且控制端无法访问收到的中继地址，连接将失败。建议两端使用同一种连接方式。
  overlayMissing: 未获取到 Overlay IP：请在设置中启用 Overlay 后刷新页面
ja:
  language: 言語
  intro: OlaresのIDサーバーと中継サーバーでコンピューターを接続
  settings: クライアント接続設定
  where: 両方のコンピューターでRustDesk → 設定 → ネットワークに入力
  vpnTab: VPN接続
  overlayTab: ローカルOverlay
  idLabel: IDサーバー
  relayLabel: 中継サーバー
  keyLabel: Key
  api: APIサーバーは空欄にしてください。これはPro管理コンソールを含まないオープンソース版です。
  steps: 接続手順
  step1: 両方のコンピューターにRustDeskをインストール
  step2: 両方で同じ接続方法を推奨：VPNまたはローカルOverlay
  step3: 両方に対応するサーバーアドレスと同じKeyを設定
  step4: 接続先のRustDesk IDを入力し、相手側で承認するか無人アクセス用パスワードを使用
  note: このページをPublicにしてもRustDeskのTCP/UDPポートはインターネットに公開されません
  download: RustDeskクライアントをダウンロード ↗
  copy: コピー
  copied: コピーしました
  copyManual: テキストを選択して手動でコピーしてください
  keyLoading: 公開鍵を読み込み中…
  keyError: 公開鍵を読み込めません。ページを更新してください。
  vpnHelp: 両方のコンピューターでLarePass VPNに接続し、以下のアプリドメインを使用
  overlayHelp: 両方のコンピューターをOlaresと同じネットワークに接続してください。設定 → ネットワーク → OverlayゲートウェイでRustDeskを有効にし、表示されたIPを確認してください。以下のOverlay_IPをそのアドレスに置き換えます。このページではOverlay
    IPを自動取得しません。
  modeWarning: 両方のコンピューターから同じ中継アドレスに到達できる必要があります。RustDeskは接続先の中継アドレスを接続元に渡します。一方がVPN、もう一方がOverlayを使用し、接続元からそのアドレスに到達できない場合、接続に失敗します。両方で同じ接続方法を使うことを推奨します。
  overlayMissing: Overlay IPがありません：設定でOverlayを有効にしてページを更新してください
ko:
  language: 언어
  intro: Olares ID 서버와 릴레이 서버로 컴퓨터 연결
  settings: 클라이언트 연결 설정
  where: 두 컴퓨터의 RustDesk → 설정 → 네트워크에 입력
  vpnTab: VPN 연결
  overlayTab: 로컬 Overlay
  idLabel: ID 서버
  relayLabel: 릴레이 서버
  keyLabel: Key
  api: API 서버는 비워 두세요. 이 오픈 소스 서버에는 Pro 관리 콘솔이 없습니다.
  steps: 연결 방법
  step1: 두 컴퓨터에 RustDesk 설치
  step2: '두 컴퓨터에서 같은 연결 방식 권장: VPN 또는 로컬 Overlay'
  step3: 양쪽에 해당 서버 주소와 동일한 Key 입력
  step4: 원격 컴퓨터의 RustDesk ID를 입력한 후 상대방이 승인하거나 무인 접속 비밀번호 사용
  note: 이 페이지를 Public으로 설정해도 RustDesk TCP/UDP 포트가 인터넷에 공개되지는 않습니다
  download: RustDesk 클라이언트 다운로드 ↗
  copy: 복사
  copied: 복사됨
  copyManual: 텍스트를 선택하여 직접 복사하세요
  keyLoading: 공개 키를 불러오는 중…
  keyError: 공개 키를 불러올 수 없습니다. 페이지를 새로 고치세요.
  vpnHelp: 두 컴퓨터 모두 LarePass VPN에 연결한 후 아래 앱 도메인 사용
  overlayHelp: 두 컴퓨터 모두 Olares와 같은 네트워크에 있어야 합니다. 설정 → 네트워크 → Overlay 게이트웨이에서 RustDesk를 활성화하고 표시된 IP를 확인하세요. 아래 Overlay_IP를
    해당 주소로 바꾸세요. 이 페이지는 Overlay IP를 자동으로 감지하지 않습니다.
  modeWarning: 두 컴퓨터 모두 같은 릴레이 주소에 접근할 수 있어야 합니다. RustDesk는 원격 컴퓨터의 릴레이 주소를 제어하는 컴퓨터에 전달합니다. 한쪽은 VPN, 다른 쪽은 Overlay를 사용할 때
    제어하는 컴퓨터가 전달받은 주소에 접근할 수 없으면 연결되지 않습니다. 두 컴퓨터에서 같은 연결 방식을 사용하는 것을 권장합니다.
  overlayMissing: 'Overlay IP 없음: 설정에서 Overlay를 활성화한 후 페이지를 새로 고치세요'
de:
  language: Sprache
  intro: Computer über den Olares-ID- und Relay-Server verbinden
  settings: Client-Verbindungseinstellungen
  where: Diese Werte auf beiden Computern unter RustDesk → Einstellungen → Netzwerk eingeben
  vpnTab: VPN-Verbindung
  overlayTab: Lokales Overlay
  idLabel: ID-Server
  relayLabel: Relay-Server
  keyLabel: Key
  api: API-Server leer lassen. Dieser Open-Source-Server enthält keine Pro-Verwaltungskonsole.
  steps: Verbindung herstellen
  step1: RustDesk auf beiden Computern installieren
  step2: 'Nach Möglichkeit auf beiden Computern denselben Modus verwenden: VPN oder lokales Overlay'
  step3: Die passenden Serveradressen und denselben Key auf beiden Computern eintragen
  step4: Die RustDesk-ID des entfernten Computers eingeben und dort bestätigen oder dessen Passwort für unbeaufsichtigten
    Zugriff verwenden
  note: Eine öffentliche Webseite macht die TCP/UDP-Ports von RustDesk nicht im Internet erreichbar
  download: RustDesk-Client herunterladen ↗
  copy: Kopieren
  copied: Kopiert
  copyManual: Text auswählen und manuell kopieren
  keyLoading: Öffentlicher Schlüssel wird geladen…
  keyError: Öffentlicher Schlüssel nicht verfügbar. Seite neu laden.
  vpnHelp: Beide Computer mit LarePass VPN verbinden und die folgenden App-Domains verwenden
  overlayHelp: Beide Computer müssen im selben Netzwerk wie Olares sein. Unter Einstellungen → Netzwerk → Overlay-Gateway
    RustDesk aktivieren und die dort angezeigte IP kopieren. Overlay_IP unten durch diese Adresse ersetzen. Diese Seite ermittelt
    die Overlay-IP nicht automatisch.
  modeWarning: Beide Computer müssen dieselbe Relay-Adresse erreichen können. RustDesk übermittelt die Relay-Adresse des entfernten
    Computers an den steuernden Computer. Verwendet einer VPN und der andere Overlay, schlägt die Verbindung fehl, wenn der
    steuernde Computer diese Adresse nicht erreichen kann. Auf beiden Computern wird derselbe Verbindungsmodus empfohlen.
  overlayMissing: 'Keine Overlay-IP: Overlay in den Einstellungen aktivieren und die Seite neu laden'
fr:
  language: Langue
  intro: Connectez vos ordinateurs via les serveurs ID et relais Olares
  settings: Configuration du client
  where: Saisissez ces valeurs sur les deux ordinateurs dans RustDesk → Paramètres → Réseau
  vpnTab: Connexion VPN
  overlayTab: Overlay local
  idLabel: Serveur ID
  relayLabel: Serveur relais
  keyLabel: Key
  api: Laissez le serveur API vide. Ce serveur open source ne comprend pas de console de gestion Pro.
  steps: Se connecter
  step1: Installez RustDesk sur les deux ordinateurs
  step2: 'Utilisez de préférence le même mode sur les deux ordinateurs : VPN ou Overlay local'
  step3: Saisissez les adresses correspondantes et la même Key sur les deux ordinateurs
  step4: Saisissez l’ID RustDesk de l’ordinateur distant, puis approuvez la connexion ou utilisez son mot de passe d’accès
    sans surveillance
  note: Rendre cette page publique n’expose pas les ports TCP/UDP de RustDesk à Internet
  download: Télécharger le client RustDesk ↗
  copy: Copier
  copied: Copié
  copyManual: Sélectionnez le texte pour le copier manuellement
  keyLoading: Chargement de la clé publique…
  keyError: Clé publique indisponible. Actualisez la page.
  vpnHelp: Connectez les deux ordinateurs à LarePass VPN et utilisez les domaines de l’application ci-dessous
  overlayHelp: Les deux ordinateurs doivent être sur le même réseau qu’Olares. Ouvrez Paramètres → Réseau → Passerelle Overlay,
    activez RustDesk et copiez l’IP affichée. Remplacez Overlay_IP ci-dessous par cette adresse. Cette page ne détecte pas
    l’IP Overlay.
  modeWarning: Les deux ordinateurs doivent pouvoir joindre la même adresse de relais. RustDesk transmet l’adresse de relais
    de l’ordinateur distant à l’ordinateur qui le contrôle. Si l’un utilise le VPN et l’autre Overlay, la connexion échoue
    lorsque l’ordinateur de contrôle ne peut pas joindre cette adresse. Il est recommandé d’utiliser le même mode de connexion
    sur les deux ordinateurs.
  overlayMissing: 'IP Overlay indisponible : activez Overlay dans les paramètres et actualisez la page'
es:
  language: Idioma
  intro: Conecta tus equipos mediante los servidores ID y de retransmisión de Olares
  settings: Configuración del cliente
  where: Introduce estos valores en ambos equipos en RustDesk → Configuración → Red
  vpnTab: Conexión VPN
  overlayTab: Overlay local
  idLabel: Servidor ID
  relayLabel: Servidor de retransmisión
  keyLabel: Key
  api: Deja vacío el servidor API. Este servidor de código abierto no incluye la consola de gestión Pro.
  steps: Cómo conectarse
  step1: Instala RustDesk en ambos equipos
  step2: 'Usa preferiblemente el mismo modo en ambos equipos: VPN u Overlay local'
  step3: Introduce las direcciones correspondientes y la misma Key en ambos equipos
  step4: Introduce el ID de RustDesk del equipo remoto y aprueba la conexión allí o usa su contraseña de acceso desatendido
  note: Hacer pública esta página no expone los puertos TCP/UDP de RustDesk a Internet
  download: Descargar cliente RustDesk ↗
  copy: Copiar
  copied: Copiado
  copyManual: Selecciona el texto para copiarlo manualmente
  keyLoading: Cargando clave pública…
  keyError: Clave pública no disponible. Actualiza la página.
  vpnHelp: Conecta ambos equipos a LarePass VPN y usa los dominios de la aplicación que aparecen abajo
  overlayHelp: Ambos equipos deben estar en la misma red que Olares. Abre Configuración → Red → Puerta de enlace Overlay,
    activa RustDesk y copia la IP indicada. Sustituye Overlay_IP abajo por esa dirección. Esta página no detecta la IP de
    Overlay.
  modeWarning: Ambos equipos deben poder acceder a la misma dirección de retransmisión. RustDesk envía la dirección del equipo
    remoto al equipo que lo controla. Si uno usa VPN y el otro Overlay, la conexión falla cuando el equipo de control no puede
    acceder a esa dirección. Se recomienda usar el mismo modo de conexión en ambos equipos.
  overlayMissing: 'IP de Overlay no disponible: activa Overlay en la configuración y actualiza la página'
it:
  language: Lingua
  intro: Collega i computer tramite i server ID e relay di Olares
  settings: Configurazione del client
  where: Inserisci questi valori su entrambi i computer in RustDesk → Impostazioni → Rete
  vpnTab: Connessione VPN
  overlayTab: Overlay locale
  idLabel: Server ID
  relayLabel: Server relay
  keyLabel: Key
  api: Lascia vuoto il server API. Questo server open source non include la console di gestione Pro.
  steps: Come connettersi
  step1: Installa RustDesk su entrambi i computer
  step2: 'Usa preferibilmente lo stesso metodo su entrambi i computer: VPN oppure Overlay locale'
  step3: Inserisci gli indirizzi corrispondenti e la stessa Key su entrambi i computer
  step4: Inserisci l’ID RustDesk del computer remoto e approva la connessione oppure usa la sua password di accesso non presidiato
  note: Rendere pubblica questa pagina non espone le porte TCP/UDP di RustDesk a Internet
  download: Scarica il client RustDesk ↗
  copy: Copia
  copied: Copiato
  copyManual: Seleziona il testo per copiarlo manualmente
  keyLoading: Caricamento della chiave pubblica…
  keyError: Chiave pubblica non disponibile. Aggiorna la pagina.
  vpnHelp: Collega entrambi i computer a LarePass VPN e usa i domini dell’app qui sotto
  overlayHelp: Entrambi i computer devono essere sulla stessa rete di Olares. Apri Impostazioni → Rete → Gateway Overlay,
    abilita RustDesk e copia l’IP visualizzato. Sostituisci Overlay_IP qui sotto con quell’indirizzo. Questa pagina non rileva
    l’IP Overlay.
  modeWarning: Entrambi i computer devono poter raggiungere lo stesso indirizzo relay. RustDesk trasmette l’indirizzo relay
    del computer remoto al computer che lo controlla. Se uno usa VPN e l’altro Overlay, la connessione non riesce se il computer
    di controllo non può raggiungere quell’indirizzo. Si consiglia lo stesso metodo di connessione su entrambi i computer.
  overlayMissing: 'IP Overlay non disponibile: abilita Overlay nelle impostazioni e aggiorna la pagina'

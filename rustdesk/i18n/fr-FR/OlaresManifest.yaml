metadata:
  title: RustDesk Server
  description: Services ID et relais auto-hébergés pour les connexions à distance RustDesk
spec:
  fullDescription: |
    RustDesk Server fournit les services ID et relais utilisés par les clients RustDesk pour connecter des ordinateurs distants. Installez le client RustDesk séparément sur chaque ordinateur ; cette application est le serveur, pas un bureau à distance dans le navigateur.

    **Fonctionnalités**

    - Enregistrement des appareils et négociation des connexions via le serveur ID
    - Transmission par relais si les ordinateurs ne peuvent pas se connecter directement
    - Page de configuration avec adresses à copier, clé publique et choix de langue
    - Conservation des clés du serveur et des données d’enregistrement

    **Avant la connexion**

    Connectez les deux ordinateurs via LarePass VPN, ou utilisez l’Overlay local si les deux sont sur le même réseau qu’Olares. Retrouvez l’IP dans Paramètres → Réseau → Passerelle Overlay. Les deux doivent pouvoir joindre l’adresse de relais négociée ; utiliser le VPN d’un côté et Overlay de l’autre peut échouer.

    Laissez le serveur API du client RustDesk vide. Le serveur open source n’inclut pas la console RustDesk Server Pro. Rendre la page de configuration publique n’expose pas les ports TCP/UDP à Internet.

metadata:
  title: RustDesk Server
  description: RustDeskのリモートデスクトップ接続用セルフホストID・中継サービス
spec:
  fullDescription: |
    RustDesk Serverは、RustDeskクライアントがリモートコンピューターに接続するためのID・中継サービスを提供します。各コンピューターにRustDeskクライアントを別途インストールしてください。このアプリはサーバーであり、ブラウザーで使うリモートデスクトップではありません。

    **主な機能**

    - IDサーバーによるデバイス登録と接続のネゴシエーション
    - 直接接続できない場合の中継によるデータ転送
    - コピー可能なサーバーアドレス、公開鍵、言語選択を備えた接続設定ページ
    - サーバー鍵と登録データの永続保存

    **接続前の確認**

    両方のコンピューターをLarePass VPNで接続するか、両方がOlaresと同じネットワークにある場合はローカルOverlayを使います。Overlay IPは設定 → ネットワーク → Overlayゲートウェイで確認してください。両方からネゴシエーションで渡された中継アドレスに到達できる必要があります。片方がVPN、もう片方がOverlayの場合、接続に失敗することがあります。

    RustDeskクライアントのAPIサーバーは空欄にしてください。オープンソース版にはRustDesk Server Pro管理コンソールは含まれません。設定ページを公開してもTCP/UDPポートはインターネットに公開されません。

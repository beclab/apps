metadata:
  title: RustDesk Server
  description: Selbst gehostete ID- und Relay-Dienste für RustDesk-Fernzugriffe
spec:
  fullDescription: |
    RustDesk Server stellt ID- und Relay-Dienste bereit, mit denen RustDesk-Clients entfernte Computer verbinden. Auf jedem Computer muss der RustDesk-Client separat installiert werden; diese App ist der Server und kein browserbasierter Remote-Desktop.

    **Funktionen**

    - Geräteregistrierung und Verbindungsaushandlung über den ID-Server
    - Datenweiterleitung über Relay, wenn keine direkte Verbindung möglich ist
    - Verbindungsseite mit kopierbaren Serveradressen, öffentlichem Schlüssel und Sprachauswahl
    - Dauerhafte Speicherung von Serverschlüsseln und Registrierungsdaten

    **Vor der Verbindung**

    Beide Computer über LarePass VPN verbinden oder lokales Overlay verwenden, wenn beide im selben Netzwerk wie Olares sind. Die Overlay-IP steht unter Einstellungen → Netzwerk → Overlay-Gateway. Beide Computer müssen die ausgehandelte Relay-Adresse erreichen können; VPN auf einer Seite und Overlay auf der anderen kann fehlschlagen.

    API-Server im RustDesk-Client leer lassen. Der Open-Source-Server enthält keine RustDesk Server Pro-Verwaltungskonsole. Eine öffentliche Einstellungsseite macht die TCP/UDP-Ports nicht im Internet erreichbar.

metadata:
  title: RustDesk Server
  description: Self-hosted ID and relay services for RustDesk remote desktop connections
spec:
  fullDescription: |
    RustDesk Server provides the ID and relay services used by RustDesk clients to connect to remote computers. Install the RustDesk client separately on each computer; this app is the server, not a browser-based remote desktop.

    **Key features**

    - Device registration and connection negotiation through the ID server
    - Relay forwarding when computers cannot connect directly
    - A connection settings page with copyable server addresses, a public key and language selection
    - Persistent server keys and registration data

    **Before you connect**

    Connect both computers through LarePass VPN, or use local Overlay when both computers are on the same network as Olares. For Overlay, find the assigned IP in Settings → Network → Overlay Gateway. Both computers must be able to reach the relay address exchanged during connection negotiation; using VPN on one side and Overlay on the other can fail.

    Leave API Server empty in the RustDesk client. The open-source server does not include the RustDesk Server Pro management console. Making the settings page public does not expose RustDesk TCP/UDP ports to the internet.

metadata:
  title: RustDesk Server
  description: 用于 RustDesk 远程桌面连接的自托管 ID 和中继服务
spec:
  fullDescription: |
    RustDesk Server 为 RustDesk 客户端提供 ID 和中继服务，用于连接远程电脑。请在每台电脑上单独安装 RustDesk 客户端；本应用是服务端，不是浏览器远程桌面。

    **主要功能**

    - 通过 ID 服务完成设备注册和连接协商
    - 两台电脑无法直接连接时，通过中继转发数据
    - 连接配置页提供可复制的服务器地址、公钥和语言选择
    - 持久保存服务器密钥和设备注册数据

    **连接前须知**

    两台电脑都可通过 LarePass VPN 连接；都与 Olares 位于同一网络时，也可使用内网 Overlay。Overlay IP 请前往「设置 → 网络 → Overlay 网关」查看。两端均须能访问连接协商时传递的中继地址；一端使用 VPN、另一端使用 Overlay 可能无法连接。

    RustDesk 客户端的 API 服务器留空。开源服务端不包含 RustDesk Server Pro 管理控制台。将配置页设为 Public 不会将 RustDesk 的 TCP/UDP 端口开放到公网。

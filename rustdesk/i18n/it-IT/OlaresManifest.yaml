metadata:
  title: RustDesk Server
  description: Servizi ID e relay autogestiti per le connessioni desktop remoto RustDesk
spec:
  fullDescription: |
    RustDesk Server fornisce i servizi ID e relay usati dai client RustDesk per collegare computer remoti. Installa il client RustDesk separatamente su ogni computer; questa app è il server, non un desktop remoto nel browser.

    **Funzionalità principali**

    - Registrazione dei dispositivi e negoziazione delle connessioni tramite il server ID
    - Inoltro tramite relay quando i computer non possono collegarsi direttamente
    - Pagina di configurazione con indirizzi copiabili, chiave pubblica e selezione della lingua
    - Memorizzazione persistente delle chiavi del server e dei dati di registrazione

    **Prima della connessione**

    Collega entrambi i computer tramite LarePass VPN oppure usa Overlay locale se entrambi sono sulla stessa rete di Olares. Trova l’IP in Impostazioni → Rete → Gateway Overlay. Entrambi devono raggiungere l’indirizzo relay negoziato; usare VPN da un lato e Overlay dall’altro può non funzionare.

    Lascia vuoto il server API nel client RustDesk. Il server open source non include la console RustDesk Server Pro. Rendere pubblica la pagina di configurazione non espone le porte TCP/UDP a Internet.

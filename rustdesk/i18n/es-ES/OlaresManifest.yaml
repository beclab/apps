metadata:
  title: RustDesk Server
  description: Servicios ID y de retransmisión autoalojados para conexiones remotas RustDesk
spec:
  fullDescription: |
    RustDesk Server proporciona los servicios ID y de retransmisión que usan los clientes RustDesk para conectar equipos remotos. Instala el cliente RustDesk por separado en cada equipo; esta aplicación es el servidor, no un escritorio remoto en el navegador.

    **Funciones principales**

    - Registro de dispositivos y negociación de conexiones mediante el servidor ID
    - Retransmisión de datos cuando los equipos no pueden conectarse directamente
    - Página de configuración con direcciones copiables, clave pública y selección de idioma
    - Almacenamiento persistente de claves del servidor y registros de dispositivos

    **Antes de conectar**

    Conecta ambos equipos mediante LarePass VPN o usa Overlay local si ambos están en la misma red que Olares. Consulta la IP de Overlay en Configuración → Red → Puerta de enlace Overlay. Ambos deben acceder a la dirección de retransmisión negociada; usar VPN en un lado y Overlay en el otro puede fallar.

    Deja vacío el servidor API del cliente RustDesk. El servidor de código abierto no incluye la consola RustDesk Server Pro. Hacer pública la página de configuración no expone los puertos TCP/UDP a Internet.

metadata:
  title: Radicale
  description: Server CalDAV e CardDAV libero e open source
spec:
  fullDescription: |
    Radicale è un server CalDAV (calendari ed elenchi di attività) e CardDAV (contatti) piccolo ma potente

    **Credenziali predefinite**
    Puoi accedere con qualsiasi nome utente e password, ma imposta nome utente e password il prima possibile.

    **Funzionalità:**
    - Condivide calendari ed elenchi di contatti tramite CalDAV, CardDAV e HTTP.
    - Supporta eventi, attività, voci di diario e biglietti da visita.
    - Funziona subito, senza installazioni o configurazioni complicate.
    - Può limitare l'accesso tramite autenticazione.
    - Può proteggere le connessioni con TLS.
    - Funziona con molti client CalDAV e CardDAV.
    - Memorizza tutti i dati nel file system con una semplice struttura di cartelle.
    - Può essere esteso con plugin.
    - È software libero con licenza GPLv3.
  upgradeDescription: |
    Upgrade Radicale to 3.8.0.0 (`beclab/tomsquest-docker-radicale:3.8.0.0`).

    Release notes: https://github.com/Kozea/Radicale/releases

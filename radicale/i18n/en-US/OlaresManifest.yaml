metadata:
  title: Radicale
  description: Free and Open-Source CalDAV and CardDAV Server
spec:
  fullDescription: |
    Radicale is a small but powerful CalDAV (calendars, to-do lists) and CardDAV (contacts) server

    **Default credentials**
    You can login with any username and password, but please set username and password
    as soon as possible.

    **Features:**
    - Shares calendars and contact lists through CalDAV, CardDAV and HTTP.
    - Supports events, todos, journal entries and business cards.
    - Works out-of-the-box, no complicated setup or configuration required.
    - Can limit access by authentication.
    - Can secure connections with TLS.
    - Works with many CalDAV and CardDAV clients
    - Stores all data on the file system in a simple folder structure.
    - Can be extended with plugins.
    - Is GPLv3-licensed free software.
  upgradeDescription: |
    Upgrade radicale from 3.8.0.0 to 3.9.0.0. Updates Radicale to 3.9.0 with security fixes for authentication caching and sharing, and fixes calendar time-range queries and contact filtering.

    Release notes: https://github.com/tomsquest/docker-radicale/releases/tag/3.9.0.0

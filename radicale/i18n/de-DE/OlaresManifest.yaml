metadata:
  title: Radicale
  description: Freier und quelloffener CalDAV- und CardDAV-Server
spec:
  fullDescription: |
    Radicale ist ein kleiner, aber leistungsfähiger CalDAV- (Kalender, Aufgabenlisten) und CardDAV-Server (Kontakte)

    **Standard-Anmeldedaten**
    Sie können sich mit jedem Benutzernamen und Passwort anmelden, sollten jedoch so bald wie möglich einen Benutzernamen und ein Passwort festlegen.

    **Funktionen:**
    - Gibt Kalender und Kontaktlisten über CalDAV, CardDAV und HTTP frei.
    - Unterstützt Ereignisse, Aufgaben, Journaleinträge und Visitenkarten.
    - Funktioniert sofort und erfordert keine komplizierte Einrichtung oder Konfiguration.
    - Kann den Zugriff durch Authentifizierung beschränken.
    - Kann Verbindungen mit TLS absichern.
    - Funktioniert mit vielen CalDAV- und CardDAV-Clients.
    - Speichert alle Daten im Dateisystem in einer einfachen Ordnerstruktur.
    - Kann mit Plugins erweitert werden.
    - Ist freie Software unter der GPLv3-Lizenz.
  upgradeDescription: |
    Upgrade Radicale to 3.8.0.0 (`beclab/tomsquest-docker-radicale:3.8.0.0`).

    Release notes: https://github.com/Kozea/Radicale/releases

metadata:
  title: Radicale
  description: Serveur CalDAV et CardDAV libre et open source
spec:
  fullDescription: |
    Radicale est un serveur CalDAV (calendriers et listes de tâches) et CardDAV (contacts) petit mais puissant

    **Identifiants par défaut**
    Vous pouvez vous connecter avec n'importe quel nom d'utilisateur et mot de passe, mais veuillez en définir dès que possible.

    **Fonctionnalités :**
    - Partage les calendriers et listes de contacts via CalDAV, CardDAV et HTTP.
    - Prend en charge les événements, tâches, entrées de journal et cartes de visite.
    - Fonctionne immédiatement, sans installation ni configuration complexe.
    - Peut limiter l'accès par authentification.
    - Peut sécuriser les connexions avec TLS.
    - Fonctionne avec de nombreux clients CalDAV et CardDAV.
    - Stocke toutes les données dans le système de fichiers selon une structure de dossiers simple.
    - Peut être étendu avec des plugins.
    - Est un logiciel libre sous licence GPLv3.
  upgradeDescription: |
    Upgrade Radicale to 3.8.0.0 (`beclab/tomsquest-docker-radicale:3.8.0.0`).

    Release notes: https://github.com/Kozea/Radicale/releases

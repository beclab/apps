  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 256Mi
  limitedDisk: 2Gi
  requiredCpu: 0.25
  limitedCpu: 1
  doc: https://radicale.org/v3.html
  license:

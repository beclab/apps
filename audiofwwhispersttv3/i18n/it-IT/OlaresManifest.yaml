metadata:
  title: Whisper Large V3 (FW)
  description: Un modello locale di riconoscimento vocale per trascrivere registrazioni multilingue

spec:
  fullDescription: |
    Whisper Large V3 (FW) converte in testo il parlato contenuto in una registrazione audio. Esegue OpenAI Whisper Large V3 con il motore Faster-Whisper per la trascrizione locale.

    **Funzionalità principali**
    - Trascrivere registrazioni vocali in più lingue.
    - Rilevare automaticamente la lingua parlata.
    - Aggiungere marcatori temporali ai segmenti trascritti.
    - Rendere la trascrizione disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `8Gi` di memoria video.

metadata:
  title: Whisper Large V3 (FW)
  description: Ein lokales Spracherkennungsmodell zur Transkription mehrsprachiger Aufnahmen

spec:
  fullDescription: |
    Whisper Large V3 (FW) wandelt Sprache aus einer Audioaufnahme in Text um. Es führt OpenAI Whisper Large V3 mit der Faster-Whisper-Engine für die lokale Transkription aus.

    **Hauptfunktionen**
    - Aufgezeichnete Sprache in mehreren Sprachen transkribieren.
    - Die gesprochene Sprache automatisch erkennen.
    - Transkriptionssegmenten Zeitstempel hinzufügen.
    - Transkriptionen für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `8Gi` Grafikspeicher ist erforderlich.

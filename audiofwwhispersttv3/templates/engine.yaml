{{- /* faster-whisper engine: one baked image serves stt off a CTranslate2 load; this only sizes the GPU. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- /* MODEL_SUPPORTS: bare capability names; llm-init and the engine both take supports_* keys. */ -}}
{{- $supportsKeys := list -}}
{{- range $tok := splitList "," ($oe.MODEL_SUPPORTS | default "stt") -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- $supportsKeys = append $supportsKeys (ternary $tok (printf "supports_%s" $tok) (hasPrefix "supports_" $tok)) -}}
{{- end -}}
{{- end -}}
{{- $supportsRaw := join "," $supportsKeys -}}
{{- $engineImage := $oe.ENGINE_IMAGE | default "docker.io/beclab/audio-fasterwhisper:v1.1.3" -}}
{{- $enginePort := int ($oe.ENGINE_PORT | default "8000") -}}
{{- $cpuRequest := trim ($oe.CPU_REQUEST | default "500m") -}}
{{- $memRequest := trim ($oe.MEMORY_REQUEST | default "2Gi") -}}
{{- $cpuLimit := trim ($oe.CPU_LIMIT | default "4") -}}
{{- $memLimit := trim ($oe.MEMORY_LIMIT | default "12Gi") -}}
{{- /* GPU is OPTIONAL (REQUIRED_GPU_MEMORY = "" or "0" => CPU-only, int8). */ -}}
{{- $gpuRaw := trim ($oe.REQUIRED_GPU_MEMORY | default "8Gi") -}}
{{- $wantGpu := and (ne $gpuRaw "") (ne $gpuRaw "0") -}}
{{- $gpuMiB := "" -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- if .Values.GPU -}}{{- $gpuType = .Values.GPU.Type | default "nvidia" -}}{{- else -}}{{- $gpuType = "nvidia" -}}{{- end -}}
{{- end -}}
{{- $unifiedMem := and $wantGpu (eq $gpuType "nvidia-gb10") -}}
{{- if $wantGpu -}}
{{- $gpuMiB = include "llmbase.gpuMiB" $gpuRaw -}}
{{- if $unifiedMem -}}
{{- $memRequest = printf "%sMi" $gpuMiB -}}
{{- $memLimit = printf "%sMi" $gpuMiB -}}
{{- end -}}
{{- end -}}
{{- /* Engine-native flags in llm-init's one channel; the engine sizes its own batch from the quota. */ -}}
{{- $engineArgs := trim ($oe.ENGINE_ARGS | default "") -}}
{{- if and (eq $engineArgs "") (not $wantGpu) -}}
{{- /* CPU-only clone: "auto" already falls back, but saying so keeps the log unambiguous. */ -}}
{{- $engineArgs = "--device cpu" -}}
{{- end -}}
{{- $modelSan := regexReplaceAll "[^a-z0-9]+" (lower $modelName) "-" | trimAll "-" -}}
{{- $cname := printf "audio-%s" $modelSan | trunc 63 | trimSuffix "-" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: audio-engine
  annotations:
    audio.bytetrade.io/model: "{{ $modelName }}"
    audio.bytetrade.io/supports: "{{ $supportsRaw }}"
{{- if $wantGpu }}
    applications.app.bytetrade.io/gpu-inject: "{{ $cname }}"
{{- end }}
spec:
  replicas: {{ .Values.workloads.audiofwwhispersttv3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: audio-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: audio-engine
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: "{{ .Values.userspace.appData }}/data"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ printf "%s/llm-init-run/%s" .Values.userspace.appCache .Release.Name }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: audio-wrappers
            defaultMode: 0555
      containers:
        - name: {{ $cname }}
          image: "{{ $engineImage }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/wrappers/fasterwhisper.sh"]
          env:
            - name: ENGINE_KIND
              value: audio
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: "{{ $modelSource }}"
            - name: MODEL_SUPPORTS
              value: "{{ $supportsRaw }}"
            - name: ENGINE_PORT
              value: "{{ $enginePort }}"
            - name: LOG_LEVEL
              value: "{{ $oe.LOG_LEVEL | default "info" }}"
            - name: WRAPPER_COMMON
              value: /run/llm-init/wrappers/common.sh
{{- if $engineArgs }}
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
{{- end }}
{{- if $wantGpu }}
            - name: REQUIRED_GPU_MEMORY
              value: "{{ $gpuRaw }}"
{{- end }}
            - name: HF_HOME
              value: /cache/hf
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
            - name: HUGGINGFACE_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              value: "{{ $hfToken }}"
{{- end }}
            - name: TZ
              value: Etc/UTC
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
{{- if $wantGpu }}
            - name: GPU_CORE_UTILIZATION_POLICY
              value: "{{ $oe.GPU_CORE_UTILIZATION_POLICY | default "disable" }}"
{{- end }}
          ports:
            - name: http
              containerPort: {{ $enginePort }}
          # No readinessProbe (like llamacpp): Ready at start so the app runs while the model downloads; llm-init gates /v1/*.
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: data
              mountPath: /tmp
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /wrappers
              readOnly: true
          resources:
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if and $wantGpu (not $unifiedMem) }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if and $wantGpu (not $unifiedMem) }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: audio-engine
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: audio-engine
spec:
  selector:
    io.kompose.service: audio-engine
  ports:
    - name: http
      port: {{ $enginePort }}
      targetPort: {{ $enginePort }}
  type: ClusterIP

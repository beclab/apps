metadata:
  description: A local service that labels speakers and marks when they speak, in recordings or live audio
  title: Nemotron 3 Diarization

spec:
  fullDescription: |
    Nemotron 3 Diarization processes audio locally to mark when each speaker talks. It groups speech under anonymous speaker labels in order of first appearance, without identifying people by name, and keeps overlapping speech. It works on complete recordings and on live audio streams. Compatible Olares applications can use these results to distinguish speakers.

    **Key features**
    - Detect speech and changes between speakers, including overlapping speech.
    - Label up to 8 speakers per recording.
    - Diarize complete recordings, or live audio over a streaming connection.
    - Make diarization available to compatible Olares applications.

    A compatible NVIDIA GPU is required. Intel iGPU and Arc use the OpenVINO image, which is amd64 only.

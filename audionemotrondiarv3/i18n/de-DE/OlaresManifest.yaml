metadata:
  description: Ein lokaler Dienst, der Sprecher in Aufnahmen oder Live-Audio kennzeichnet und markiert, wann sie sprechen
  title: Nemotron 3 Diarization

spec:
  fullDescription: |
    Nemotron 3 Diarization verarbeitet Audio lokal und markiert, wann jeder Sprecher spricht. Sprache wird in der Reihenfolge des ersten Auftretens anonymen Sprecherlabels zugeordnet, ohne Personen namentlich zu identifizieren, und überlappende Sprache bleibt erhalten. Der Dienst arbeitet mit vollständigen Aufnahmen und mit Live-Audiostreams. Kompatible Olares-Anwendungen können diese Ergebnisse nutzen, um Sprecher zu unterscheiden.

    **Hauptfunktionen**
    - Sprache und Sprecherwechsel erkennen, einschließlich überlappender Sprache.
    - Bis zu 8 Sprecher pro Aufnahme kennzeichnen.
    - Vollständige Aufnahmen oder Live-Audio über eine Streaming-Verbindung diarisieren.
    - Diarisierung für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU ist erforderlich. Intel-iGPU und Arc nutzen das OpenVINO-Image (nur amd64).

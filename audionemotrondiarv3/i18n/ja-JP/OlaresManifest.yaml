metadata:
  description: 録音やライブ音声の話者にラベルを付け、発話時間を記録するローカルサービス
  title: Nemotron 3 Diarization

spec:
  fullDescription: |
    Nemotron 3 Diarization は音声をローカルで処理し、各話者が話している時間を記録します。音声を初めて現れた順に匿名の話者ラベルへまとめ、名前で個人を識別することはなく、重なった発話も保持します。完全な録音にもライブ音声ストリームにも対応します。互換性のある Olares アプリケーションは、この結果を使って話者を区別できます。

    **主な機能**
    - 重なった発話を含め、音声と話者の切り替わりを検出します。
    - 1 つの録音につき最大 8 人の話者にラベルを付けます。
    - 完全な録音、またはストリーミング接続経由のライブ音声を話者分離します。
    - 互換性のある Olares アプリケーションに話者分離機能を提供します。

    互換性のある NVIDIA GPU が必要です。Intel iGPU と Arc は OpenVINO イメージを使います（amd64 のみ）。

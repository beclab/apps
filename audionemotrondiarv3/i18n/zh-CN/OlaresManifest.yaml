metadata:
  description: 在本地为录音或实时音频中的说话人分配标签并标记发言时间的服务
  title: Nemotron 3 Diarization

spec:
  fullDescription: |
    Nemotron 3 Diarization 在本地处理音频，标记每位说话人的发言时间。它按首次出现的顺序将语音归入匿名说话人标签，不会按姓名识别真实身份，并保留重叠语音。它既可处理完整录音，也可处理实时音频流。兼容的 Olares 应用可以使用这些结果区分说话人。

    **主要功能**
    - 检测语音和说话人变化，包括重叠语音。
    - 每段录音最多标记 8 位说话人。
    - 对完整录音进行说话人分离，或通过流式连接处理实时音频。
    - 向兼容的 Olares 应用提供说话人分离能力。

    需要配备兼容的 NVIDIA GPU。Intel 核显与 Arc 使用 OpenVINO 镜像（仅 amd64）。

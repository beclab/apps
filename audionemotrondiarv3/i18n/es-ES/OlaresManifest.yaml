metadata:
  description: Un servicio local que etiqueta a los hablantes y marca cuándo hablan, en grabaciones o audio en directo
  title: Nemotron 3 Diarization

spec:
  fullDescription: |
    Nemotron 3 Diarization procesa el audio localmente para marcar cuándo habla cada hablante. Agrupa el habla bajo etiquetas de hablante anónimas en el orden en que aparecen por primera vez, sin identificar a las personas por su nombre, y conserva el habla superpuesta. Funciona con grabaciones completas y con transmisiones de audio en directo. Las aplicaciones de Olares compatibles pueden usar estos resultados para distinguir a los hablantes.

    **Funciones principales**
    - Detectar el habla y los cambios de hablante, incluida el habla superpuesta.
    - Etiquetar hasta 8 hablantes por grabación.
    - Realizar la diarización de grabaciones completas o de audio en directo mediante una conexión en streaming.
    - Poner la diarización a disposición de las aplicaciones de Olares compatibles.

    Se requiere una GPU NVIDIA compatible. Las iGPU Intel y Arc usan la imagen OpenVINO (solo amd64).

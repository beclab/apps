metadata:
  description: Un service local qui identifie les locuteurs et indique quand ils parlent, dans des enregistrements ou de l'audio en direct
  title: Nemotron 3 Diarization

spec:
  fullDescription: |
    Nemotron 3 Diarization traite l'audio localement pour indiquer quand chaque locuteur parle. Il regroupe la parole sous des étiquettes de locuteur anonymes dans l'ordre de leur première apparition, sans identifier les personnes par leur nom, et conserve la parole superposée. Il fonctionne sur des enregistrements complets et sur des flux audio en direct. Les applications Olares compatibles peuvent utiliser ces résultats pour distinguer les locuteurs.

    **Fonctionnalités principales**
    - Détecter la parole et les changements de locuteur, y compris la parole superposée.
    - Étiqueter jusqu'à 8 locuteurs par enregistrement.
    - Effectuer la diarisation d'enregistrements complets ou d'audio en direct via une connexion en streaming.
    - Mettre la diarisation à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible est requis. Les iGPU Intel et Arc utilisent l'image OpenVINO (amd64 uniquement).

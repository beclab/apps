metadata:
  title: Firefox
  description: Firefox ブラウザ
spec:
  fullDescription: |
    Firefox ブラウザ（Mozilla Firefox、または単に Firefox とも呼ばれる）は、Mozilla Foundation とその子会社 Mozilla Corporation が開発する無料のオープンソース Web ブラウザです。Firefox は Gecko レイアウトエンジンを使用して Web ページを描画し、現行および今後の Web 標準を実装しています。

  upgradeDescription: |
    - Firefox を 151.0.1 から 160.0 へアップグレード（LinuxServer イメージ `1160.0build1-1xtradeb1.2404.1-ls136`）
    - 新しいデザインに刷新し、ライト／ダークの組み込みテーマとコンパクトモードを追加（157）
    - JPEG XL 画像に対応し、スクロールがより滑らかに（158）
    - 保存したパスワードをサイドバーから標準で利用可能に。Ctrl+Shift+A で開いているタブを検索（159）
    - ピクチャーインピクチャーで 0.25x〜2.0x の再生速度に対応し、FLAC／MP3／PCM 音声の MKV を再生可能に（160）

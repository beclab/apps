metadata:
  title: Firefox
  description: Firefox-Browser
spec:
  fullDescription: |
    Der Firefox-Browser, auch bekannt als Mozilla Firefox oder einfach Firefox, ist ein kostenloser und quelloffener Webbrowser, der von der Mozilla Foundation und ihrer Tochtergesellschaft, der Mozilla Corporation, entwickelt wird. Firefox verwendet die Gecko-Layout-Engine zum Rendern von Webseiten und implementiert aktuelle sowie erwartete Webstandards.

  upgradeDescription: |
    - Upgrade von Firefox 151.0.1 auf 160.0 (LinuxServer-Image `1160.0build1-1xtradeb1.2404.1-ls136`)
    - Überarbeitetes Firefox-Design mit neuen integrierten hellen und dunklen Themes sowie einem Kompaktmodus (157)
    - Unterstützung für JPEG XL und flüssigeres Scrollen (158)
    - Gespeicherte Passwörter standardmäßig in der Seitenleiste; offene Tabs mit Strg+Umschalt+A durchsuchen (159)
    - Bild-im-Bild mit Wiedergabegeschwindigkeit von 0,25x bis 2,0x sowie MKV-Wiedergabe mit FLAC-, MP3- oder PCM-Audio (160)

olaresManifest.version: '0.12.0'
metadata:
  name: firefox
  description: Firefox Browser
  icon: https://app.cdn.olares.com/appstore/firefox/icon.png
  appid: firefox
  version: '1.0.20'
  title: Firefox
  categories:
  - Utilities_v112
  - developer
  tags:
  - browser

permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '1160.0'
  fullDescription: |
    Firefox Browser, also known as Mozilla Firefox or simply Firefox, is a free and open-source web browser developed by the Mozilla Foundation and its subsidiary, the Mozilla Corporation. Firefox uses the Gecko layout engine to render web pages, which implements current and anticipated web standards.
  upgradeDescription: |
    - Upgrade Firefox from 151.0.1 to 160.0 (LinuxServer image `1160.0build1-1xtradeb1.2404.1-ls136`)
    - Refreshed Firefox design with new built-in light and dark themes and a compact mode (157)
    - JPEG XL image support and smoother scrolling (158)
    - Saved passwords in the sidebar by default; search open tabs with Ctrl+Shift+A (159)
    - Picture-in-Picture playback speed from 0.25x to 2.0x, and MKV playback with FLAC, MP3 or PCM audio (160)
  developer: Mozilla
  website: https://www.mozilla.org/
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 1Gi
  limitedMemory: 6Gi
  requiredDisk: 128Mi
  limitedDisk: 256Mi
  requiredCpu: "500m"
  limitedCpu: "3"
  doc: https://support.mozilla.org/
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
  - envName: FIREFOX_HOMEPAGE
    type: url
    required: false
    editable: true
    applyOnChange: true
    default: "https://www.google.com"
    description: "URL opened when Firefox starts."
entrances:
- name: firefox
  port: 3000
  host: firefox
  title: Firefox
  icon: https://app.cdn.olares.com/appstore/firefox/icon.png
  openMethod: window
olaresManifest.type: app
apiVersion: 'v3'
workloadReplicas:
  firefox: 1

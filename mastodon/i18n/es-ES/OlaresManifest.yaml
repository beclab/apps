metadata:
  title: Mastodon
  description: Su comunidad de microblogueo autoalojada e interconectada globalmente
spec:
  fullDescription: |
    Mastodon es un servidor de red social gratuito y de código abierto basado en ActivityPub, donde los usuarios pueden seguir a sus amigos y descubrir nuevas personas.

    En Mastodon, los usuarios pueden publicar lo que quieran: enlaces, imágenes, texto y vídeos. Todos los servidores Mastodon interoperan como una red federada (los usuarios de un servidor pueden comunicarse sin problemas con los de otro, incluido software que no sea Mastodon pero implemente ActivityPub).

    **Características**
    Sin dependencia de proveedores: interoperabilidad total con cualquier plataforma compatible
    - No tiene que ser Mastodon; cualquier implementación de ActivityPub forma parte de la red social.

    Actualizaciones cronológicas de la línea de tiempo en tiempo real
    - Las actualizaciones de las personas que sigue aparecen en tiempo real en la interfaz mediante WebSockets. También hay una vista de flujo completo.

    Archivos multimedia adjuntos, como imágenes y vídeos cortos
    - Cargue y vea imágenes y vídeos WebM/MP4 adjuntos a las actualizaciones. Los vídeos sin pista de audio se tratan como GIF; los vídeos normales se reproducen en bucle continuamente.

    Herramientas de seguridad y moderación
    - Mastodon incluye publicaciones privadas, cuentas bloqueadas, filtrado de frases, silenciamiento, bloqueo y muchas otras funciones, además de un sistema de denuncias y moderación.

    OAuth2 y una REST API sencilla
    - Mastodon actúa como proveedor de OAuth2, por lo que las aplicaciones de terceros pueden usar las API REST y Streaming. Esto genera un amplio ecosistema de aplicaciones con muchas opciones.
  upgradeDescription: |
    Versión upstream: [Mastodon 4.7.1](https://github.com/mastodon/mastodon/releases/tag/v4.7.1)

    **Cambio incompatible**

    - Los usuarios que no hayan iniciado sesión desde Mastodon 4.3 se desconectarán.
    - Las migraciones de base de datos desde 4.5 pueden tardar en instancias grandes. Conserve una copia de la base antes de actualizar.
    - Si actualiza desde 4.5, revise también las notas de [4.6.0](https://github.com/mastodon/mastodon/releases/tag/v4.6.0) y [4.7.0](https://github.com/mastodon/mastodon/releases/tag/v4.7.0).

    **Novedades**

    - Las cuentas remotas que cambian de handle se renombran en lugar de duplicarse.
    - Las publicaciones salientes con tarjeta de vista previa incluyen un adjunto Link.
    - La administración incluye registros de auditoría de hashtags y un campo de búsqueda en los bloqueos de IP.

    **Correcciones**

    - Omisión de la autenticación por contraseña en 2FA para cuentas LDAP, PAM y SSO.
    - Denegación de servicio al procesar actividades JSON-LD patológicas.
    - Las cuentas de personal desactivadas aún podían usar la API de administración.

    **Cambios de despliegue en Olares**

    - Abrir la página de inicio de la app por la entrada de Olares ya no devuelve 500.
    - El streaming en tiempo real está activado. Antes estaba desactivado.
    - La URL de salud de streaming ya no redirige a una dirección `https:/…` rota.

metadata:
  title: Mastodon
  description: La tua comunità di microblogging self-hosted e interconnessa a livello globale
spec:
  fullDescription: |
    Mastodon è un server di social network gratuito e open source basato su ActivityPub, dove gli utenti possono seguire gli amici e scoprire nuove persone.

    Su Mastodon gli utenti possono pubblicare ciò che desiderano: link, immagini, testo e video. Tutti i server Mastodon sono interoperabili come rete federata (gli utenti di un server possono comunicare senza problemi con quelli di un altro, incluso software diverso da Mastodon che implementa ActivityPub).

    **Funzionalità**
    Nessun vincolo con il fornitore: piena interoperabilità con qualsiasi piattaforma conforme
    - Non deve necessariamente essere Mastodon: tutto ciò che implementa ActivityPub fa parte del social network.

    Aggiornamenti cronologici della timeline in tempo reale
    - Gli aggiornamenti delle persone che segui appaiono in tempo reale nell'interfaccia tramite WebSockets. È disponibile anche una vista firehose.

    Allegati multimediali come immagini e brevi video
    - Carica e visualizza immagini e video WebM/MP4 allegati agli aggiornamenti. I video senza traccia audio vengono trattati come GIF; i video normali vengono riprodotti continuamente in loop.

    Strumenti di sicurezza e moderazione
    - Mastodon include post privati, account bloccati, filtraggio delle frasi, silenziamento, blocco e molte altre funzionalità, oltre a un sistema di segnalazione e moderazione.

    OAuth2 e una REST API semplice
    - Mastodon funge da provider OAuth2, consentendo alle app di terze parti di utilizzare le API REST e Streaming. Ne risulta un ricco ecosistema di app con moltissime possibilità.
  upgradeDescription: |
    Rilascio upstream: [Mastodon 4.7.1](https://github.com/mastodon/mastodon/releases/tag/v4.7.1)

    **Modifica incompatibile**

    - Gli utenti che non hanno effettuato l'accesso da Mastodon 4.3 verranno disconnessi.
    - Le migrazioni del database da 4.5 possono richiedere molto tempo sulle istanze grandi. Conserva un backup prima dell'aggiornamento.
    - Se aggiorni da 4.5, consulta anche le note di [4.6.0](https://github.com/mastodon/mastodon/releases/tag/v4.6.0) e [4.7.0](https://github.com/mastodon/mastodon/releases/tag/v4.7.0).

    **Novità**

    - Gli account remoti che cambiano handle vengono rinominati invece di essere duplicati.
    - I post in uscita con preview card includono un allegato Link.
    - L'admin include log di audit degli hashtag e un campo di ricerca sui blocchi IP.

    **Correzioni**

    - Bypass dell'autenticazione con password nella 2FA per account LDAP, PAM e SSO.
    - Denial of service nell'elaborazione di attività JSON-LD patologiche.
    - Gli account dello staff disattivati potevano ancora usare l'API di amministrazione.

    **Modifiche di distribuzione Olares**

    - Aprire la home dell'app dall'ingresso Olares non restituisce più 500.
    - Lo streaming in tempo reale è abilitato. In precedenza era disattivato.
    - L'URL di health dello streaming non reindirizza più a un indirizzo `https:/…` rotto.

metadata:
  title: Mastodon
  description: セルフホストで世界中とつながるマイクロブログコミュニティ
spec:
  fullDescription: |
    Mastodon は ActivityPub に基づく無料のオープンソースソーシャルネットワークサーバーで、ユーザーは友人をフォローしたり、新しい人を見つけたりできます。

    Mastodon では、リンク、画像、テキスト、動画など、好きなものを投稿できます。すべての Mastodon サーバーは連合ネットワークとして相互運用可能です（あるサーバーのユーザーは、ActivityPub を実装した Mastodon 以外のソフトウェアを含め、別のサーバーのユーザーとシームレスに通信できます）。

    **機能**
    ベンダーロックインなし：準拠するあらゆるプラットフォームと完全に相互運用可能
    - Mastodon である必要はありません。ActivityPub を実装するものはすべてソーシャルネットワークの一部です。

    リアルタイムで時系列のタイムライン更新
    - フォローしている人の更新が WebSockets を通じて UI にリアルタイムで表示されます。全体の流れを表示する firehose ビューもあります。

    画像や短い動画などのメディア添付
    - 更新に添付された画像や WebM/MP4 動画をアップロードして表示できます。音声トラックのない動画は GIF のように扱われ、通常の動画は連続してループ再生されます。

    安全性とモデレーションのためのツール
    - Mastodon には非公開投稿、ロックされたアカウント、フレーズフィルタリング、ミュート、ブロックなど多様な機能と、報告・モデレーションシステムが含まれています。

    OAuth2 と分かりやすい REST API
    - Mastodon は OAuth2 プロバイダーとして機能するため、サードパーティアプリは REST API と Streaming API を利用できます。これにより、豊富な選択肢を持つアプリエコシステムが生まれます。
  upgradeDescription: |
    上流リリース：[Mastodon 4.7.1](https://github.com/mastodon/mastodon/releases/tag/v4.7.1)

    **破壊的変更**

    - Mastodon 4.3 以降サインインしていないユーザーはログアウトされます。
    - 4.5 からのデータベース移行は大規模インスタンスで時間がかかることがあります。アップグレード前にデータベースをバックアップしてください。
    - 4.5 からアップグレードする場合は、[4.6.0](https://github.com/mastodon/mastodon/releases/tag/v4.6.0) と [4.7.0](https://github.com/mastodon/mastodon/releases/tag/v4.7.0) の注意も確認してください。

    **変更内容**

    - handle を変更したリモートアカウントは複製ではなく改名されます。
    - プレビューカード付きの送信投稿に Link 添付が付きます。
    - 管理画面にハッシュタグの監査ログと、IP ブロックの検索欄が追加されます。

    **修正**

    - LDAP / PAM / SSO アカウントの 2FA におけるパスワード認証の迂回。
    - 異常な JSON-LD アクティビティ処理時のサービス拒否。
    - 無効化されたスタッフアカウントが管理 API を使えていた問題。

    **Olares のデプロイ変更**

    - Olares のエントランスからアプリのホームページを開いても 500 にならなくなりました。
    - リアルタイムストリーミングは有効です。これまではオフでした。
    - ストリーミングのヘルス URL が壊れた `https:/…` へリダイレクトしなくなりました。

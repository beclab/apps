metadata:
  title: Mastodon
  description: Ihre selbst gehostete, weltweit vernetzte Microblogging-Community
spec:
  fullDescription: |
    Mastodon ist ein freier, quelloffener sozialer Netzwerkserver auf Basis von ActivityPub, auf dem Benutzer Freunden folgen und neue Personen entdecken können.

    Auf Mastodon können Benutzer alles veröffentlichen, was sie möchten: Links, Bilder, Text und Videos. Alle Mastodon-Server sind als föderiertes Netzwerk interoperabel (Benutzer eines Servers können nahtlos mit Benutzern eines anderen Servers kommunizieren, einschließlich Nicht-Mastodon-Software, die ActivityPub implementiert!)

    **Funktionen**
    Keine Anbieterbindung: Vollständig interoperabel mit jeder konformen Plattform
    - Es muss nicht Mastodon sein; alles, was ActivityPub implementiert, ist Teil des sozialen Netzwerks!

    Chronologische Echtzeit-Aktualisierungen der Timeline
    - Aktualisierungen von Personen, denen Sie folgen, erscheinen über WebSockets in Echtzeit in der Benutzeroberfläche. Außerdem gibt es eine Firehose-Ansicht!

    Medienanhänge wie Bilder und kurze Videos
    - Laden Sie Bilder und WebM/MP4-Videos als Anhänge zu Aktualisierungen hoch und zeigen Sie sie an. Videos ohne Audiospur werden wie GIFs behandelt; normale Videos werden fortlaufend wiederholt!

    Sicherheits- und Moderationswerkzeuge
    - Mastodon umfasst private Beiträge, gesperrte Konten, Phrasenfilter, Stummschaltung, Blockierung und viele weitere Funktionen sowie ein Melde- und Moderationssystem.

    OAuth2 und eine unkomplizierte REST API
    - Mastodon fungiert als OAuth2-Anbieter, sodass Apps von Drittanbietern die REST- und Streaming-APIs nutzen können. Dadurch entsteht ein vielfältiges App-Ökosystem mit großer Auswahl!
  upgradeDescription: |
    Upstream-Release: [Mastodon 4.7.1](https://github.com/mastodon/mastodon/releases/tag/v4.7.1)

    **Inkompatible Änderung**

    - Nutzer, die sich seit Mastodon 4.3 nicht angemeldet haben, werden abgemeldet.
    - Datenbankmigrationen ab 4.5 können auf großen Instanzen lange dauern. Sichern Sie die Datenbank vor dem Upgrade.
    - Wenn Sie von 4.5 upgraden, lesen Sie auch die Hinweise zu [4.6.0](https://github.com/mastodon/mastodon/releases/tag/v4.6.0) und [4.7.0](https://github.com/mastodon/mastodon/releases/tag/v4.7.0).

    **Änderungen**

    - Remote-Konten, die ihren Handle ändern, werden umbenannt statt dupliziert.
    - Ausgehende Beiträge mit Preview-Card enthalten einen Link-Anhang.
    - Die Administration hat Hashtag-Audit-Logs und ein Suchfeld bei IP-Sperren.

    **Fehlerbehebungen**

    - Umgehung der Passwortauthentifizierung in der 2FA für LDAP-, PAM- und SSO-Konten.
    - Denial of Service beim Verarbeiten pathologischer JSON-LD-Aktivitäten.
    - Deaktivierte Mitarbeiterkonten konnten die Admin-API weiter nutzen.

    **Olares-Bereitstellungsänderungen**

    - Die App-Startseite liefert über den Olares-Eingang keinen 500-Fehler mehr.
    - Echtzeit-Streaming ist aktiviert. Es war zuvor ausgeschaltet.
    - Die Streaming-Health-URL leitet nicht mehr auf eine kaputte `https:/…`-Adresse um.

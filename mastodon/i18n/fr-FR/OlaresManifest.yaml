metadata:
  title: Mastodon
  description: Votre communauté de microblogage auto-hébergée et interconnectée mondialement
spec:
  fullDescription: |
    Mastodon est un serveur de réseau social libre et open source basé sur ActivityPub, où les utilisateurs peuvent suivre leurs amis et découvrir de nouvelles personnes.

    Sur Mastodon, les utilisateurs peuvent publier tout ce qu'ils souhaitent : liens, images, texte et vidéos. Tous les serveurs Mastodon interopèrent en tant que réseau fédéré (les utilisateurs d'un serveur peuvent communiquer de manière transparente avec ceux d'un autre, y compris avec des logiciels autres que Mastodon qui implémentent ActivityPub !)

    **Fonctionnalités**
    Aucune dépendance envers un fournisseur : interopérabilité totale avec toute plateforme conforme
    - Il n'est pas nécessaire qu'il s'agisse de Mastodon ; toute implémentation d'ActivityPub fait partie du réseau social !

    Mises à jour chronologiques de la chronologie en temps réel
    - Les mises à jour des personnes que vous suivez apparaissent en temps réel dans l'interface via WebSockets. Une vue en flux intégral est également disponible !

    Pièces jointes multimédias telles que des images et de courtes vidéos
    - Importez et visualisez des images et des vidéos WebM/MP4 jointes aux publications. Les vidéos sans piste audio sont traitées comme des GIF ; les vidéos normales tournent en boucle !

    Outils de sécurité et de modération
    - Mastodon comprend des publications privées, des comptes verrouillés, le filtrage d'expressions, la mise en sourdine, le blocage et de nombreuses autres fonctions, ainsi qu'un système de signalement et de modération.

    OAuth2 et une REST API simple
    - Mastodon agit comme fournisseur OAuth2, ce qui permet aux applications tierces d'utiliser les API REST et Streaming. Il en résulte un riche écosystème d'applications offrant de nombreux choix !
  upgradeDescription: |
    Version amont : [Mastodon 4.7.1](https://github.com/mastodon/mastodon/releases/tag/v4.7.1)

    **Changement cassant**

    - Les utilisateurs qui ne se sont pas connectés depuis Mastodon 4.3 seront déconnectés.
    - Les migrations de base depuis 4.5 peuvent être longues sur les grandes instances. Conservez une sauvegarde avant la mise à jour.
    - Si vous mettez à jour depuis 4.5, consultez aussi les notes [4.6.0](https://github.com/mastodon/mastodon/releases/tag/v4.6.0) et [4.7.0](https://github.com/mastodon/mastodon/releases/tag/v4.7.0).

    **Nouveautés**

    - Les comptes distants qui changent de handle sont renommés au lieu d'être dupliqués.
    - Les publications sortantes avec une carte d'aperçu incluent une pièce jointe Link.
    - L'admin ajoute des journaux d'audit des hashtags et un champ de recherche sur les blocages IP.

    **Corrections**

    - Contournement de l'authentification par mot de passe dans la 2FA pour les comptes LDAP, PAM et SSO.
    - Déni de service lors du traitement d'activités JSON-LD pathologiques.
    - Les comptes du personnel désactivés pouvaient encore utiliser l'API d'administration.

    **Changements de déploiement Olares**

    - L'ouverture de la page d'accueil via l'entrée Olares ne renvoie plus une erreur 500.
    - Le streaming en temps réel est activé. Il était auparavant désactivé.
    - L'URL de santé du streaming ne redirige plus vers une adresse `https:/…` cassée.

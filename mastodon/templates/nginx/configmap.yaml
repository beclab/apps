{{- $mastodonDomainStr := toString (.Values.domain.mastodonapache | default "") -}}
{{- $mastodonDomainENV := split "," $mastodonDomainStr -}}
{{- $webDomain := index $mastodonDomainENV "_0" -}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mastodon-nginx-config
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: mastodon
    helm.sh/chart: mastodon-0.1.2
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mastodon
data:
  map.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
  default.conf: |
    upstream mastodon_backend {
        server mastodon-web:80;
    }

    upstream mastodon_streaming {
        server mastodon-streaming:80;
    }

    server {
        listen 8080;
        server_name {{ if $webDomain }}{{ $webDomain }}{{ else }}_{{ end }};

        client_max_body_size 40m;
        large_client_header_buffers 8 32k;

        gzip on;
        gzip_min_length 256;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location = /api/v1/streaming/health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location = /api/v1/streaming/health/ {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_http_version 1.1;
            # Buffer the Rails SPA so Envoy sees Content-Length instead of
            # chunked bodies plus preload Link headers (those 500 the entrance).
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_hide_header Link;
            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_pass http://mastodon_backend;
        }

        # Mastodon Streaming (WebSocket)
        location ^~ /api/v1/streaming {
            proxy_http_version 1.1;
            proxy_buffering off;

            if ($request_uri ~ "^/api/v1/streaming/\?(.*)$") {
                rewrite ^/api/v1/streaming/\?(.*)$ /api/v1/streaming?$1 break;
            }
            if ($request_uri = "/api/v1/streaming/") {
                rewrite ^/api/v1/streaming/$ /api/v1/streaming break;
            }

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;

            # Rails force_ssl with a blank host emits Location: https:/path
            proxy_redirect https:/ https://$http_host/;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            proxy_pass http://mastodon_streaming;
        }

        location /{{ .Values.minio.buckets.mastodon }}/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass http://{{ .Values.minio.host }}:{{ .Values.minio.port }}/{{ .Values.minio.buckets.mastodon }}/;
            proxy_buffering off;
            proxy_redirect off;
        }
    }

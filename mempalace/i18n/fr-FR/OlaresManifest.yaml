metadata:
  title: MemPalace
  description: Mémoire locale partagée pour les agents IA, avec conservation du texte et recherche sémantique

spec:
  fullDescription: |
    MemPalace fournit aux agents IA une mémoire partagée sur votre Olares. Il conserve le texte des conversations et des notes dans sa formulation d'origine et retrouve les passages pertinents par leur sens. Les wings, rooms et drawers organisent les projets, sujets et entrées. Un graphe local suit les relations dans le temps.

    Cette application fournit un terminal web et un point d'accès MCP Streamable HTTP sur /mcp. Connectez Hermes Agent ou OpenClaw pour enregistrer et retrouver la même mémoire de projet entre les sessions.

    Fonctions
    - Importer des projets, transcriptions de conversations et documents bureautiques.
    - Extraire le texte des fichiers PDF, DOCX, PPTX, XLSX, RTF et EPUB. Les dépendances nécessaires sont incluses.
    - Combiner recherche sémantique et mots-clés, avec filtres par wing, room, source et date.
    - Gérer les entrées, journaux d'agents, faits temporels et liens entre sujets.
    - Échanger des événements de tâches et des artefacts exacts via MCP.
    - Auditer l'organisation et utiliser un modèle explicitement configuré pour proposer des catégories.

    Les fichiers Home sont montés en lecture seule. Mémoire et cache des modèles persistent sur Olares. La recherche et les embeddings textuels s'exécutent localement sur CPU sans clé API cloud. Le modèle local est téléchargé à la première utilisation. Les appels des agents suivent leur fournisseur configuré.

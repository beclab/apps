metadata:
  title: MemPalace
  description: Gemeinsames lokales Gedächtnis für KI-Agenten mit Originaltext und semantischer Suche

spec:
  fullDescription: |
    MemPalace gibt KI-Agenten ein gemeinsames Gedächtnis auf Ihrem Olares. Gespräche und Notizen bleiben im ursprünglichen Wortlaut erhalten und werden nach ihrer Bedeutung gefunden. Wings, Rooms und Drawers ordnen Projekte, Themen und Einträge. Ein lokaler Wissensgraph verfolgt Beziehungen im Zeitverlauf.

    Die App bietet ein Webterminal und einen Streamable-HTTP-MCP-Endpunkt unter /mcp. Verbinden Sie Hermes Agent oder OpenClaw, um dieselben Projekterinnerungen über mehrere Sitzungen hinweg zu speichern und abzurufen.

    Funktionen
    - Projektdateien, Gesprächsprotokolle und Office-Dokumente importieren.
    - Text aus PDF, DOCX, PPTX, XLSX, RTF und EPUB extrahieren. Die benötigten Abhängigkeiten sind enthalten.
    - Semantische und Schlüsselwortsuche kombinieren und nach Wing, Room, Quelle und Datum filtern.
    - Einträge, Agententagebücher, zeitliche Fakten und Themenverbindungen verwalten.
    - Aufgabenereignisse und unveränderte Artefakte über MCP austauschen.
    - Die Organisation prüfen und mit einem ausdrücklich konfigurierten Modell Kategorien vorschlagen.

    Home-Dateien werden schreibgeschützt eingebunden. Erinnerungen und Modellcache bleiben auf Olares gespeichert. Text-Embeddings und Suche laufen lokal auf der CPU ohne Cloud-API-Schlüssel. Das Standardmodell wird bei der ersten Nutzung heruntergeladen. Modellaufrufe der Agenten verwenden deren konfigurierten Anbieter.

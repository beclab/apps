metadata:
  title: MemPalace
  description: 面向 AI Agent 的本地共享记忆，保存原文并按含义召回

spec:
  fullDescription: |
    MemPalace 为 AI Agent 提供保存在 Olares 上的共享记忆。它保留对话和笔记的原始措辞，并按含义查找相关内容。通过 Wing、Room 和 Drawer 分别组织项目、主题和记录，本地知识图谱可跟踪关系随时间的变化。

    本应用提供 Web 终端和路径为 /mcp 的 Streamable HTTP MCP 接口。连接 Hermes Agent、OpenClaw 等智能体后，可在不同会话中保存和召回同一份项目记忆。

    功能
    - 导入项目文件、对话记录和办公文档。
    - 提取 PDF、DOCX、PPTX、XLSX、RTF 和 EPUB 中的文本，已包含文档提取依赖。
    - 使用语义搜索或混合关键词检索，并按 Wing、Room、来源及日期筛选。
    - 管理原始记录、Agent 日记、带时间的事实和主题之间的连接。
    - 通过 MCP 交换任务事件和保留完整内容的附件记录。
    - 审查记忆库的组织情况，并可显式连接模型生成分类建议。

    通过只读挂载导入 Home 文件。记忆和模型缓存在 Olares 上持久保存。文本嵌入和搜索在本地 CPU 上运行，无需云端 API 密钥。默认嵌入模型在首次使用时下载。Agent 的模型调用遵循该 Agent 配置的服务商。

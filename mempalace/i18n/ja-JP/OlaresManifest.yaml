metadata:
  title: MemPalace
  description: 原文保存と意味検索に対応した AI エージェント向けのローカル共有メモリ

spec:
  fullDescription: |
    MemPalace は Olares 上で AI エージェントが共有できる記憶を提供します。会話やメモの元の表現を保持し、意味で関連する内容を検索します。Wing、Room、Drawer でプロジェクト、話題、記録を整理し、ローカルの知識グラフで関係の変化を追跡できます。

    このアプリには Web ターミナルと /mcp の Streamable HTTP MCP エンドポイントが含まれます。Hermes Agent や OpenClaw を接続すると、異なるセッションでも同じプロジェクトの記憶を保存、参照できます。

    機能
    - プロジェクトファイル、会話記録、オフィス文書をインポート。
    - PDF、DOCX、PPTX、XLSX、RTF、EPUB からテキストを抽出。必要な依存関係は同梱済み。
    - 意味検索とキーワード検索を組み合わせ、Wing、Room、出典、日付で絞り込み。
    - 記録、エージェントの日記、時系列の事実、話題のつながりを管理。
    - MCP でタスクイベントや内容を保持したアーティファクトを交換。
    - 構成を監査し、明示的に設定したモデルで分類候補を作成。

    Home ファイルは読み取り専用でマウントされます。記憶とモデルキャッシュは Olares に永続保存されます。テキストの埋め込みと検索はローカル CPU で実行され、クラウド API キーは不要です。既定のモデルは初回使用時にダウンロードされます。エージェントのモデル呼び出しは各エージェントの設定に従います。

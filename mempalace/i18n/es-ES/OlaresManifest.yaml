metadata:
  title: MemPalace
  description: Memoria local compartida para agentes de IA, con texto original y búsqueda semántica

spec:
  fullDescription: |
    MemPalace proporciona a los agentes de IA una memoria compartida en tu Olares. Conserva conversaciones y notas con su redacción original y encuentra los pasajes pertinentes por su significado. Wings, rooms y drawers organizan proyectos, temas y registros. Un grafo local sigue las relaciones a lo largo del tiempo.

    La aplicación incluye un terminal web y un endpoint MCP Streamable HTTP en /mcp. Conecta Hermes Agent u OpenClaw para guardar y recuperar la misma memoria de proyecto entre sesiones.

    Funciones
    - Importar archivos de proyectos, transcripciones y documentos de oficina.
    - Extraer texto de PDF, DOCX, PPTX, XLSX, RTF y EPUB. Se incluyen las dependencias necesarias.
    - Combinar búsqueda semántica y palabras clave con filtros por wing, room, origen y fecha.
    - Gestionar registros, diarios de agentes, hechos temporales y conexiones entre temas.
    - Intercambiar eventos de tareas y artefactos exactos mediante MCP.
    - Auditar la organización y usar un modelo configurado explícitamente para proponer categorías.

    Los archivos Home se montan en modo de solo lectura. La memoria y la caché de modelos persisten en Olares. Los embeddings de texto y la búsqueda se ejecutan localmente en CPU sin una clave API de nube. El modelo predeterminado se descarga al usarlo por primera vez. Las llamadas de los agentes siguen el proveedor configurado en cada agente.

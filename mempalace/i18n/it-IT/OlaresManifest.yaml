metadata:
  title: MemPalace
  description: Memoria locale condivisa per agenti IA, con testo originale e ricerca semantica

spec:
  fullDescription: |
    MemPalace offre agli agenti IA una memoria condivisa sul tuo Olares. Conserva conversazioni e note nella formulazione originale e trova i passaggi pertinenti in base al significato. Wing, room e drawer organizzano progetti, argomenti e voci. Un grafo locale segue le relazioni nel tempo.

    L'app include un terminale web e un endpoint MCP Streamable HTTP su /mcp. Collega Hermes Agent o OpenClaw per salvare e richiamare la stessa memoria di progetto in sessioni diverse.

    Funzioni
    - Importare file di progetto, trascrizioni e documenti d'ufficio.
    - Estrarre testo da PDF, DOCX, PPTX, XLSX, RTF ed EPUB. Le dipendenze necessarie sono incluse.
    - Combinare ricerca semantica e parole chiave, filtrando per wing, room, origine e data.
    - Gestire voci, diari degli agenti, fatti temporali e collegamenti tra argomenti.
    - Scambiare eventi di attività e artefatti esatti tramite MCP.
    - Verificare l'organizzazione e usare un modello configurato esplicitamente per proporre categorie.

    I file Home sono montati in sola lettura. Memoria e cache dei modelli persistono su Olares. Embedding testuali e ricerca funzionano localmente su CPU senza chiavi API cloud. Il modello predefinito viene scaricato al primo utilizzo. Le chiamate dei modelli degli agenti seguono il fornitore configurato per ciascun agente.

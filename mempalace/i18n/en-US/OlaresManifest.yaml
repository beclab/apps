metadata:
  title: MemPalace
  description: Shared local memory for AI agents, with verbatim storage and semantic recall

spec:
  fullDescription: |
    MemPalace gives AI agents shared memory on your Olares. It stores conversation text and notes in their original wording, then retrieves matching passages by meaning. Wings, rooms, and drawers organize projects, topics, and individual records. A local knowledge graph tracks relationships over time.

    This package provides a web terminal and a Streamable HTTP MCP endpoint at /mcp. Connect agents such as Hermes Agent and OpenClaw to save and recall the same project memory across sessions.

    Features
    - Import project files, conversation transcripts, and office documents.
    - Extract text from PDF, DOCX, PPTX, XLSX, RTF, and EPUB files. Document extraction dependencies are included.
    - Search by meaning or combine semantic and keyword retrieval. Filter by wing, room, source, and date.
    - Manage original records, agent diaries, temporal facts, and links between rooms.
    - Exchange task events and exact artifacts through MCP.
    - Audit organization and optionally use an explicitly configured model to propose room categories.

    Import Home files through a read-only mount. Memory and model caches persist on Olares. Text embedding and search run locally on CPU without a cloud API key. The default embedding model downloads on first use. Agent model calls follow the provider configured in that agent.

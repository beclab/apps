spec:
  runAsUser: true
  versionName: '3.11.0'
  featuredImage: https://cdn.olares.com/images/2026/10/cc6d8c0211791ed7d5fe5db89b6eff0e.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/cc6d8c0211791ed7d5fe5db89b6eff0e.png

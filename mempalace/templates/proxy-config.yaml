{{- $existing := lookup "v1" "Secret" .Release.Namespace "mempalace-mcp-auth" -}}
{{- $token := randAlphaNum 48 -}}
{{- if and $existing $existing.data -}}
{{- $token = index $existing.data "token" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: mempalace-mcp-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ $token | quote }}
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /usr/local/openresty/nginx/conf/mime.types;
      default_type application/octet-stream;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      # Terminal (primary entrance)
      server {
        listen 8080;
        access_log /dev/stdout;
        error_log /dev/stderr;

        client_max_body_size 10m;

        proxy_connect_timeout                          30s;
        proxy_send_timeout                             300s;
        proxy_read_timeout                             300s;
        proxy_set_header      host                      $host;
        proxy_set_header      x-forwarded-host          $http_host;
        proxy_set_header      x-real-ip                 $remote_addr;
        proxy_set_header      x-forwarded-for           $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header upgrade $http_upgrade;
        proxy_set_header connection "upgrade";

        location / {
            proxy_pass http://terminal:80;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
      }

      # MCP API (secondary entrance)
      server {
        listen 8081;
        access_log /dev/stdout;
        error_log /dev/stderr;

        client_max_body_size 10m;

        proxy_connect_timeout                          60s;
        proxy_send_timeout                             1800s;
        proxy_read_timeout                             1800s;
        proxy_set_header      host                      127.0.0.1:8080;
        proxy_set_header      x-forwarded-host          $http_host;
        proxy_set_header      x-real-ip                 $remote_addr;
        proxy_set_header      x-forwarded-for           $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header connection "";
        proxy_buffering off;

        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        proxy_set_header Authorization "Bearer {{ $token }}";

        location / {
            proxy_pass http://mempalace:8080;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 60s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_max_body_size 10m;
        }
      }

    }

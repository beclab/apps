apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-account
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-manager
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: terminal-account
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pod-exec-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: terminal
  name: terminal
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ .Values.workloads.terminal.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: terminal
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/terminal-config.yaml") . | sha256sum }}
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: terminal
    spec:
      serviceAccountName: terminal-account
      volumes:
        - name: terminal-config
          configMap:
            name: mempalace-terminal-config
      containers:
        - name: nginx
          image: docker.io/beclab/terminal:v0.0.10
          imagePullPolicy: IfNotPresent
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          command:
            - sh
            - -c
            - mkdir -p /tmp/terminal-nginx/logs; exec nginx -p /tmp/terminal-nginx/ -c /etc/nginx/olares.conf -g 'daemon off;'
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: terminal-config
              mountPath: /etc/nginx/olares.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            limits:
              cpu: 50m
              memory: 100Mi
            requests:
              cpu: 5m
              memory: 50Mi
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
        - name: terminal
          image: docker.io/beclab/terminal:v0.0.10
          imagePullPolicy: IfNotPresent
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: DISPLAY
              value: ":0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - apiserver
          args:
            - --namespace={{ .Release.Namespace }}
            - --pod=bytetrade.io/terminal=mempalace
            - --container=mempalace
            - --v=3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terminal
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: terminal
  ports:
    - name: terminal
      protocol: TCP
      port: 80
      targetPort: 8088

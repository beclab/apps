apiVersion: v1
kind: ConfigMap
metadata:
  name: mempalace-terminal-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/terminal-nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      keepalive_timeout 65;
      client_body_temp_path /tmp/terminal-client;
      proxy_temp_path /tmp/terminal-proxy;
      fastcgi_temp_path /tmp/terminal-fastcgi;
      uwsgi_temp_path /tmp/terminal-uwsgi;
      scgi_temp_path /tmp/terminal-scgi;
      server {
        listen 8088 default_server;
        root /app;
        location / {
          try_files $uri $uri/index.html /index.html;
          add_header Cache-Control "private,no-cache";
          expires 0;
        }
        location ~ ^/kapis/terminal {
          proxy_pass http://127.0.0.1:9090;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_set_header Host $host;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
        location ~ /(api/v1/watch|apis/apps/v1/watch) {
          proxy_pass http://127.0.0.1:9090;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_set_header Host $host;
          proxy_buffering off;
          proxy_read_timeout 3600s;
        }
        location /kapis {
          proxy_pass http://127.0.0.1:9090;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
        }
        location ~* \.(js|css|png|jpg|svg|woff|woff2)$ {
          add_header Cache-Control "public, max-age=2678400";
        }
      }
    }

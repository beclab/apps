metadata:
  title: Nextcloud
  description: データを自分で管理できる生産性プラットフォーム
spec:
  fullDescription: |
    Nextcloud は、データをいつでも手元に置き、自分で管理できるようにします。
    ドキュメント、カレンダー、連絡先、写真を、自宅のサーバー、当社のプロバイダー、または信頼できるデータセンターに保存できます。

    **優れている理由**
    - データへのアクセス：ファイル、連絡先、カレンダー、会話などを、選択したサーバーに保存できます。
    - データの同期：ファイル、連絡先、カレンダーなどをデバイス間で同期できます。
    - データの共有 … 見せたいものや共同作業したいものへのアクセスを他の人に許可できます。
    - 数百種類のアプリで拡張可能 ... Calendar、Contacts、Mail、Video Chat など、App Store で見つかるすべてのアプリ
    - 暗号化メカニズム、HackerOne 報奨金プログラム、二要素認証によるセキュリティ。
  upgradeDescription: |
    Nextcloud 33.0.9 に更新し、Euro-Office コネクター 11.0.6 と文書サーバーを統合しました。amd64 と arm64 に対応しています。

    今回はメジャーバージョンの更新です。既存の Nextcloud 31 は、31.0.14 と 32.0.14 を経由して自動更新されます。ユーザーファイルをコピーせず、データベースと設定のみをバックアップします。既存の外部ストレージのマウント設定は保持され、移行時のインデックス処理では外部ストレージを除外します。

    データ量、デバイス性能、ネットワーク状況によっては、通常より更新に時間がかかる場合があります。移行ログには現在の段階、経過時間、推定可能な場合はおおよその残り時間が表示されます。

    数十回の更新シミュレーションでは更新失敗は発生していませんが、異なる環境では失敗する可能性があります。更新に失敗した場合は、更新ログと Olares のバージョンを添えて、Ticket システムから速やかにご連絡ください。

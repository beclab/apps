metadata:
  description: 生产力平台，让您掌控一切
  title: Nextcloud
spec:
  fullDescription: |
    Nextcloud 让您随时随地掌控数据。
     在自家服务器、合作伙伴或信任的数据中心存储文档、日历、联系人和照片。

    **这样做的魅力何在？**
    - 数据访问 在您选择的服务器上存放文件、联系人、日历和对话等。
    - 数据同步 在各个设备间保持文件、联系人、日历等数据的同步。
    - 数据分享 让他人可以查看或合作您选择分享的内容。
    - 应用扩展 通过安装 Calendar, Contacts, Mail, Video Chat 等应用增强功能，这些都可以在我们的 App Store 发现。
    - 加强安全 我们通过加密技术、HackerOne 赏金计划和双因素认证来保护您的数据安全。

  upgradeDescription: |
    升级到 Nextcloud 33.0.9，内置 Euro-Office 11.0.6 连接器和文档服务，支持 amd64 和 arm64。

    这是一次大版本更新。现有 Nextcloud 31 会自动经过 31.0.14 和 32.0.14 升级。升级时仅备份数据库和配置，不复制用户文件；保留已有外部存储挂载，迁移索引时跳过外部存储目录。

    升级耗时可能比以往更长，具体取决于数据量、设备性能和网络状况。迁移日志会显示当前阶段、已用时间，并在可估算时提供大致剩余时间。

    我们已模拟数十次升级，未出现升级失败，但不同环境下仍存在失败风险。如果升级失败，请及时通过 Ticket 系统告诉我们，并附上升级日志和 Olares 系统版本。

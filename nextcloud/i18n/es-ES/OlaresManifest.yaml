metadata:
  title: Nextcloud
  description: La plataforma de productividad que le permite mantener el control
spec:
  fullDescription: |
    Nextcloud pone sus datos al alcance de su mano y bajo su control.
    Guarde sus documentos, calendario, contactos y fotos en un servidor doméstico, con uno de nuestros proveedores o en un centro de datos de confianza.

    **¿Por qué es tan fantástico?**
    - Acceda a sus datos: puede guardar archivos, contactos, calendarios, conversaciones y mucho más en el servidor que elija.
    - Sincronice sus datos: mantenga sincronizados sus archivos, contactos, calendarios y mucho más entre sus dispositivos.
    - Comparta sus datos … dando acceso a otras personas al contenido que quiera que vean o en el que quiera colaborar.
    - Ampliable con cientos de aplicaciones ... como Calendar, Contacts, Mail, Video Chat y todas las que puede descubrir en nuestro App Store
    - Seguridad mediante nuestros mecanismos de cifrado, el programa de recompensas HackerOne y la autenticación de dos factores.
  upgradeDescription: |
    Nextcloud 33.0.9 con el conector Euro-Office 11.0.6 y un servidor de documentos integrado. Compatible con amd64 y arm64.

    Esta es una actualización de versión principal. Las instalaciones de Nextcloud 31 se actualizan automáticamente pasando por 31.0.14 y 32.0.14. Se respalda la base de datos y la configuración sin copiar los archivos del usuario. Se conservan los montajes externos existentes y se omite el almacenamiento externo durante la indexación de la migración.

    La actualización puede tardar más de lo habitual según el volumen de datos, el rendimiento del dispositivo y la red. Los registros muestran la etapa actual, el tiempo transcurrido y, cuando es posible estimarlo, el tiempo restante aproximado.

    Decenas de actualizaciones simuladas finalizaron sin fallos de actualización, pero pueden producirse fallos en otros entornos. Si la actualización falla, comuníquenoslo cuanto antes a través del sistema de tickets e incluya los registros y su versión de Olares.

metadata:
  title: Nextcloud
  description: La plateforme de productivité qui vous laisse le contrôle
spec:
  fullDescription: |
    Nextcloud met vos données à portée de main et sous votre contrôle.
    Stockez vos documents, calendrier, contacts et photos sur un serveur chez vous, auprès de l'un de nos fournisseurs ou dans un centre de données de confiance.

    **Pourquoi est-ce si formidable ?**
    - Accédez à vos données : stockez vos fichiers, contacts, calendriers, conversations et bien plus encore sur le serveur de votre choix.
    - Synchronisez vos données : gardez vos fichiers, contacts, calendriers et autres données synchronisés entre vos appareils.
    - Partagez vos données … en donnant à d'autres personnes accès aux éléments que vous souhaitez leur montrer ou sur lesquels vous souhaitez collaborer.
    - Extensible avec des centaines d'applications ... comme Calendar, Contacts, Mail, Video Chat et toutes celles que vous pouvez découvrir dans notre App Store
    - Sécurité grâce à nos mécanismes de chiffrement, au programme de primes HackerOne et à l'authentification à deux facteurs.
  upgradeDescription: |
    Nextcloud 33.0.9 avec le connecteur Euro-Office 11.0.6 et un serveur de documents intégré. Compatible avec amd64 et arm64.

    Il s’agit d’une mise à jour majeure. Les installations Nextcloud 31 passent automatiquement par les versions 31.0.14 et 32.0.14. La base de données et la configuration sont sauvegardées sans copier les fichiers utilisateur. Les montages externes existants sont conservés et le stockage externe est ignoré lors de l’indexation de migration.

    La mise à jour peut prendre plus de temps que d’habitude selon le volume de données, les performances de l’appareil et le réseau. Les journaux indiquent l’étape en cours, le temps écoulé et, lorsqu’une estimation est possible, le temps restant approximatif.

    Plusieurs dizaines de mises à jour simulées se sont terminées sans échec de mise à jour, mais des échecs restent possibles dans d’autres environnements. En cas d’échec, contactez-nous rapidement via le système de tickets en joignant les journaux et votre version d’Olares.

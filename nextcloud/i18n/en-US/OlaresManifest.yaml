metadata:
  title: Nextcloud
  description: The productivity platform that keeps you in control
spec:
  fullDescription: |
    Nextcloud puts your data at your fingertips, under your control.
    Store your documents, calendar, contacts and photos on a server at home, at one of our providers or in a data center you trust.

    **Why is this so awesome?**
    - Access your Data You can store your files, contacts, calendars, conversations and more on a server of your choosing.
    - Sync your Data You keep your files, contacts, calendars, and more synchronized amongst your devices.
    - Share your Data …by giving others access to the stuff you want them to see or to collaborate with.
    - Expandable with hundreds of Apps ...like Calendar, Contacts, Mail, Video Chat and all those you can discover in our App Store
    - Security with our encryption mechanisms, HackerOne bounty program and two-factor authentication.
  upgradeDescription: |
    Nextcloud 33.0.9 with Euro-Office connector 11.0.6 and an integrated document server. Includes amd64 and arm64 images.

    This is a major version update. Existing Nextcloud 31 installations are automatically upgraded through 31.0.14 and 32.0.14. The upgrade backs up the database and configuration without copying user files, preserves existing external mounts, and skips external storage during migration indexing.

    Upgrading may take longer than usual, depending on your data volume, device performance, and network conditions. Migration logs show the current stage, elapsed time, and approximate remaining time when available.

    Although dozens of simulated upgrades completed without an upgrade failure, failures are still possible in other environments. If your upgrade fails, please report it promptly through the Ticket system and include the upgrade logs and your Olares version.

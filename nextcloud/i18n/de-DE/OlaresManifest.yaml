metadata:
  title: Nextcloud
  description: Die Produktivitätsplattform, mit der Sie die Kontrolle behalten
spec:
  fullDescription: |
    Mit Nextcloud haben Sie Ihre Daten jederzeit zur Hand und behalten die Kontrolle.
    Speichern Sie Ihre Dokumente, Kalender, Kontakte und Fotos auf einem Server zu Hause, bei einem unserer Anbieter oder in einem Rechenzentrum Ihres Vertrauens.

    **Warum ist das so großartig?**
    - Zugriff auf Ihre Daten: Speichern Sie Dateien, Kontakte, Kalender, Unterhaltungen und mehr auf einem Server Ihrer Wahl.
    - Synchronisieren Ihrer Daten: Halten Sie Dateien, Kontakte, Kalender und mehr auf Ihren Geräten synchron.
    - Teilen Ihrer Daten … indem Sie anderen Zugriff auf die Inhalte gewähren, die sie sehen oder gemeinsam bearbeiten sollen.
    - Erweiterbar mit Hunderten von Apps ... wie Calendar, Contacts, Mail, Video Chat und allen Apps, die Sie in unserem App Store entdecken können
    - Sicherheit durch unsere Verschlüsselungsmechanismen, das HackerOne-Prämienprogramm und Zwei-Faktor-Authentifizierung.
  upgradeDescription: |
    Nextcloud 33.0.9 mit Euro-Office-Connector 11.0.6 und integriertem Dokumentenserver. Unterstützt amd64 und arm64.

    Dies ist ein Update auf eine neue Hauptversion. Bestehende Nextcloud-31-Installationen werden automatisch über 31.0.14 und 32.0.14 aktualisiert. Datenbank und Konfiguration werden gesichert, ohne Benutzerdateien zu kopieren. Bestehende externe Einbindungen bleiben erhalten; externe Speicher werden bei der Migrationsindizierung übersprungen.

    Das Update kann je nach Datenmenge, Geräteleistung und Netzwerk länger dauern als bisher. Die Migrationsprotokolle zeigen die aktuelle Phase, die verstrichene Zeit und, sofern abschätzbar, die ungefähre Restzeit.

    Bei mehreren Dutzend simulierten Updates trat kein Updatefehler auf. In anderen Umgebungen sind Fehler dennoch möglich. Falls das Update fehlschlägt, melden Sie dies bitte zeitnah über das Ticket-System und fügen Sie die Updateprotokolle und Ihre Olares-Version bei.

metadata:
  title: Nextcloud
  description: La piattaforma di produttività che ti lascia il controllo
spec:
  fullDescription: |
    Nextcloud mette i tuoi dati a portata di mano e sotto il tuo controllo.
    Archivia documenti, calendario, contatti e foto su un server domestico, presso uno dei nostri provider o in un data center di cui ti fidi.

    **Perché è così straordinario?**
    - Accedi ai tuoi dati: puoi archiviare file, contatti, calendari, conversazioni e altro ancora su un server a tua scelta.
    - Sincronizza i tuoi dati: mantieni sincronizzati file, contatti, calendari e altro tra i tuoi dispositivi.
    - Condividi i tuoi dati … consentendo ad altri di accedere ai contenuti che vuoi mostrare o sui quali vuoi collaborare.
    - Espandibile con centinaia di app ... come Calendar, Contacts, Mail, Video Chat e tutte quelle disponibili nel nostro App Store
    - Sicurezza grazie ai nostri meccanismi di crittografia, al programma di ricompense HackerOne e all'autenticazione a due fattori.
  upgradeDescription: |
    Nextcloud 33.0.9 con il connettore Euro-Office 11.0.6 e un server documenti integrato. Supporta amd64 e arm64.

    Questo è un aggiornamento a una nuova versione principale. Le installazioni Nextcloud 31 vengono aggiornate automaticamente passando per 31.0.14 e 32.0.14. Viene eseguito il backup del database e della configurazione senza copiare i file utente. I montaggi esterni esistenti vengono conservati e l’archiviazione esterna viene esclusa dall’indicizzazione durante la migrazione.

    L’aggiornamento può richiedere più tempo del solito, a seconda del volume dei dati, delle prestazioni del dispositivo e della rete. I log mostrano la fase corrente, il tempo trascorso e, quando è possibile stimarlo, il tempo rimanente approssimativo.

    Decine di aggiornamenti simulati si sono conclusi senza errori di aggiornamento, ma in altri ambienti sono comunque possibili errori. Se l’aggiornamento non riesce, segnalatelo tempestivamente tramite il sistema di ticket, allegando i log e la versione di Olares.

kind: ConfigMap
apiVersion: v1
metadata:
  name: litellm-config
  namespace: "{{ .Release.Namespace }}"
data:
  proxy_config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_env_credential_login: {{ eq (lower (toString (.Values.olaresEnv.DISABLE_ENV_CREDENTIAL_LOGIN | default "false"))) "true" }}

    litellm_settings:
      callbacks: ["smtp_email"]

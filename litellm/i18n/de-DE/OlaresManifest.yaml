metadata:
  title: LiteLLM
  description: Über 100 LLMs im OpenAI-Format aufrufen
spec:
  fullDescription: |
    LiteLLM ist ein Python-SDK und Proxy-Server (AI Gateway), um über 100 LLM-APIs im OpenAI- (oder nativen) Format aufzurufen – mit Kostenverfolgung, Guardrails, Load Balancing und Logging.
    
    **Funktionen**
    - Unified API: Über 100 LLM-APIs (OpenAI, Anthropic, Azure, Bedrock, VertexAI usw.) im OpenAI-Format aufrufen
    - Cost Tracking: Kosten über alle Anbieter hinweg verfolgen
    - Load Balancing: Anfragen auf mehrere Modelle/Endpunkte verteilen
    - Guardrails: Inhaltsfilterung und Sicherheitsprüfungen
    - Logging & Observability: Umfassendes Logging und Monitoring
    - Rate Limiting: Integriertes Rate Limiting und Throttling
    - Proxy Server: Als AI Gateway/Proxy-Server bereitstellen
    - Multi-tenant: Unterstützung für mehrere Benutzer und Teams
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    Upgrade auf [v1.83.3-stable](https://github.com/BerriAI/litellm/releases/tag/v1.83.3-stable) (von v1.81.4).
    
    Sicherheit:
    - Privilege Escalation auf /key/block, /key/unblock, /key/update max_budget behoben
    - Globale Secret-Redaktion über Root-Logger und schlüsselnamensbasierte Mustermatching
    - Supply-Chain-Härtung: alle Docker-/npm-/pip-Abhängigkeiten pinnen, Cosign-Image-Signing
    
    Anbieter:
    - Anthropic: thinking.summary beim Routing zur OpenAI Responses API beibehalten; Opt-out-Flag für Standard-Reasoning-Summary
    - Gemini: Unterzählung von Image-Tokens in Usage-Metadaten behoben; Modell an Context-Caching-URL-Builder für custom api_base übergeben
    - Azure: gpt-5.4+ tools+reasoning automatisch zur Responses API routen
    - Bedrock: cache_control_injection_points für tool_config; api_base in count_tokens respektieren
    - OpenAI: Responses-API-reasoning_items in Chat Completions round-trippen; GPT-5.4 mini/nano Day-0-Support
    
    *Proxy & Core:*
    - Guardrails auf Projektebene
    - Redis-Cluster-Caching-Fix; Redis-basiertes Cross-Pod-Budget-Enforcement
    - Streaming-Guardrail-Race Condition und Post-Call-Guardrail-Response-Capture behoben
    - Deployment-Affinität pro Modellgruppe; Rate Limits pro Modell für Teams
    - Auto-Recovery der shared aiohttp-Session bei Schließung
    
    UI:
    - Komponenten von Tremor nach Ant Design migriert
    - Team-Management modernisiert; Team-Guardrails-UI
    - Logs-Filter-Fix (leerer Filter zeigt keine veralteten Daten mehr); CSV-Export-Fix auf Global Usage
    - Paginierte Teamsuche auf Usage-Seite; Key-Alias-Teilstringsuche

metadata:
  title: LiteLLM
  description: Über 100 LLMs im OpenAI-Format aufrufen
spec:
  fullDescription: |
    LiteLLM ist ein Python-SDK und Proxy-Server (AI Gateway), um über 100 LLM-APIs im OpenAI- (oder nativen) Format aufzurufen – mit Kostenverfolgung, Guardrails, Load Balancing und Logging.
    
    **Funktionen**
    - Unified API: Über 100 LLM-APIs (OpenAI, Anthropic, Azure, Bedrock, VertexAI usw.) im OpenAI-Format aufrufen
    - Cost Tracking: Kosten über alle Anbieter hinweg verfolgen
    - Load Balancing: Anfragen auf mehrere Modelle/Endpunkte verteilen
    - Guardrails: Inhaltsfilterung und Sicherheitsprüfungen
    - Logging & Observability: Umfassendes Logging und Monitoring
    - Rate Limiting: Integriertes Rate Limiting und Throttling
    - Proxy Server: Als AI Gateway/Proxy-Server bereitstellen
    - Multi-tenant: Unterstützung für mehrere Benutzer und Teams
    Admin-Anmeldung: Zuerst mit UI_USERNAME/UI_PASSWORD anmelden, unter Internal Users einen separaten Proxy Admin erstellen und über den Einladungslink ein eigenes Passwort setzen. Die Anmeldung in einem privaten Fenster prüfen, dann DISABLE_ENV_CREDENTIAL_LOGIN in den Olares-App-Umgebungsvariablen auf true setzen. Nach dem Neustart werden die gemeinsame Anmeldung und die rote Warnung deaktiviert. Bis zur erfolgreichen Prüfung false beibehalten; zur Wiederherstellung wieder false setzen. Master-API-Schlüssel bleiben gültig.

  upgradeDescription: |
    Chart 1.0.24 behebt Startfehler bei Upgrades mit dem historischen öffentlichen Standardschlüssel; LiteLLM bleibt 1.106.2.
    Bestehende Master-Schlüssel, virtuelle Schlüssel und Anbieter-Zugangsdaten bleiben unverändert. Nur Helm-Upgrades mit genau diesem Standardschlüssel aktivieren den Kompatibilitätsmodus. Das vorhandene Sicherheitsrisiko bleibt bestehen; leere oder fehlende Schlüssel werden nicht zugelassen.
    Neuinstallationen benötigen sk- und mindestens 32 Buchstaben/Ziffern und aktivieren diesen Modus nicht. Vor dem Start wird die bestehende Datenbank unter appData/backups/chart-1.0.24/litellm.dump gesichert. Schlüsselrotation ist eine separate optionale Wartung.
    Für das Entfernen der roten Anmeldewarnung zuerst einen unabhängigen Proxy Admin erstellen und prüfen, dann DISABLE_ENV_CREDENTIAL_LOGIN=true in Olares setzen und anwenden. API-Schlüssel werden dabei nicht geändert.
    https://github.com/BerriAI/litellm/releases/tag/v1.106.2

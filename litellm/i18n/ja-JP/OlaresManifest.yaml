metadata:
  title: LiteLLM
  description: 100 以上の LLM を OpenAI 形式で呼び出し
spec:
  fullDescription: |
    LiteLLM は、コスト追跡、ガードレール、ロードバランシング、ログ機能付きで、100 以上の LLM API を OpenAI（またはネイティブ）形式で呼び出す Python SDK および Proxy Server（AI Gateway）です。
    
    **機能**
    - Unified API: OpenAI、Anthropic、Azure、Bedrock、VertexAI など 100 以上の LLM API を OpenAI 形式で呼び出し
    - Cost Tracking: すべてのプロバイダーのコストを追跡
    - Load Balancing: 複数モデル／エンドポイントへリクエストを分散
    - Guardrails: コンテンツフィルタリングと安全チェック
    - Logging & Observability: 包括的なログと監視
    - Rate Limiting: 組み込みのレート制限とスロットリング
    - Proxy Server: AI Gateway／プロキシサーバーとしてデプロイ
    - Multi-tenant: 複数ユーザーとチームをサポート
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    [v1.83.3-stable](https://github.com/BerriAI/litellm/releases/tag/v1.83.3-stable) へアップグレード（v1.81.4 から）。
    
    セキュリティ:
    - /key/block、/key/unblock、/key/update max_budget の権限昇格を修正
    - ルートロガーとキー名ベースのパターンマッチによるグローバルシークレット編集
    - サプライチェーン強化: Docker/npm/pip 依存関係をすべてピン留め、cosign イメージ署名
    
    プロバイダー:
    - Anthropic: OpenAI Responses API へルーティング時に thinking.summary を保持; デフォルト reasoning summary のオプトアウトフラグ
    - Gemini: usage メタデータの画像トークン過小カウントを修正; カスタム api_base 向け context caching URL ビルダーにモデルを渡す
    - Azure: gpt-5.4+ tools+reasoning を Responses API へ自動ルーティング
    - Bedrock: tool_config の cache_control_injection_points をサポート; count_tokens で api_base を尊重
    - OpenAI: chat completions で Responses API reasoning_items をラウンドトリップ; GPT-5.4 mini/nano の day-0 サポート
    
    *Proxy & Core:*
    - プロジェクトレベルのガードレール
    - Redis クラスターキャッシュ修正; Redis ベースのクロスポッド予算適用
    - ストリーミングガードレールの競合状態と post-call ガードレール応答キャプチャを修正
    - モデルグループ単位のデプロイ親和性; チーム向けモデル単位レート制限
    - 共有 aiohttp セッション閉鎖時の自動復旧
    
    UI:
    - Tremor から Ant Design へコンポーネント移行
    - チーム管理の近代化; チームガードレール UI
    - ログフィルター修正（空フィルターで古いデータを表示しない）; Global Usage の CSV エクスポート修正
    - Usage ページのページネーション付きチーム検索; キーエイリアス部分一致検索

metadata:
  title: LiteLLM
  description: 100 以上の LLM を OpenAI 形式で呼び出し
spec:
  fullDescription: |
    LiteLLM は、コスト追跡、ガードレール、ロードバランシング、ログ機能付きで、100 以上の LLM API を OpenAI（またはネイティブ）形式で呼び出す Python SDK および Proxy Server（AI Gateway）です。
    
    **機能**
    - Unified API: OpenAI、Anthropic、Azure、Bedrock、VertexAI など 100 以上の LLM API を OpenAI 形式で呼び出し
    - Cost Tracking: すべてのプロバイダーのコストを追跡
    - Load Balancing: 複数モデル／エンドポイントへリクエストを分散
    - Guardrails: コンテンツフィルタリングと安全チェック
    - Logging & Observability: 包括的なログと監視
    - Rate Limiting: 組み込みのレート制限とスロットリング
    - Proxy Server: AI Gateway／プロキシサーバーとしてデプロイ
    - Multi-tenant: 複数ユーザーとチームをサポート
    管理者ログインの設定：まず UI_USERNAME/UI_PASSWORD でログインし、Internal Users で独立した Proxy Admin を作成して、招待リンクから専用パスワードを設定してください。プライベートウィンドウでログインを確認してから、Olares アプリの環境変数 DISABLE_ENV_CREDENTIAL_LOGIN を true にします。再起動後、共有ログインと赤い警告が無効になります。確認が済むまでは既定の false を維持し、ログインできない場合は false に戻してください。マスター API キーは引き続き利用できます。

  upgradeDescription: |
    Chart 1.0.24 は、従来の公開既定マスターキーを維持したアップグレードの起動失敗を修正します。LiteLLM は 1.106.2 のままです。
    既存のマスターキー、仮想キー、モデル提供元の認証情報は変更しません。Helm アップグレードでキーが従来の既定値と完全一致する場合のみ互換モードを有効にします。弱いキーの既存リスクは残ります。空または未設定のキーは許可しません。
    新規インストールでは sk- の後に32文字以上の英数字が必要で、互換モードは有効にしません。起動前に既存データベースを appData/backups/chart-1.0.24/litellm.dump に保存します。キーの変更は別途任意の保守作業です。
    赤いログイン警告を消すには、独立した Proxy Admin を作成してログインを確認した後、Olares で DISABLE_ENV_CREDENTIAL_LOGIN=true を適用します。API キーは変更されません。
    https://github.com/BerriAI/litellm/releases/tag/v1.106.2

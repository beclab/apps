metadata:
  title: LiteLLM
  description: Llama a más de 100 LLM en formato OpenAI
spec:
  fullDescription: |
    LiteLLM es un SDK de Python y Proxy Server (AI Gateway) para llamar a más de 100 APIs de LLM en formato OpenAI (o nativo), con seguimiento de costes, guardrails, balanceo de carga y logging.
    
    **Funciones**
    - Unified API: Llama a más de 100 APIs de LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) en formato OpenAI
    - Cost Tracking: Rastrea costes en todos los proveedores
    - Load Balancing: Distribuye solicitudes entre múltiples modelos/endpoints
    - Guardrails: Filtrado de contenido y comprobaciones de seguridad
    - Logging & Observability: Logging y monitorización completos
    - Rate Limiting: Limitación de tasa y throttling integrados
    - Proxy Server: Despliega como AI Gateway/Proxy
    - Multi-tenant: Soporte para varios usuarios y equipos
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    Actualización a [v1.83.3-stable](https://github.com/BerriAI/litellm/releases/tag/v1.83.3-stable) (desde v1.81.4).
    
    Seguridad:
    - Corrección de escalada de privilegios en /key/block, /key/unblock, /key/update max_budget
    - Redacción global de secretos vía root logger y coincidencia por nombre de clave
    - Endurecimiento de la cadena de suministro: fijar todas las dependencias Docker/npm/pip, firma de imágenes cosign
    
    Proveedores:
    - Anthropic: conservar thinking.summary al enrutar a OpenAI Responses API; flag de exclusión para el resumen de razonamiento por defecto
    - Gemini: corregir el infraconteo de tokens de imagen en metadatos de uso; pasar el modelo al constructor de URL de context caching para api_base personalizado
    - Azure: autoenrutar gpt-5.4+ tools+reasoning a Responses API
    - Bedrock: soportar cache_control_injection_points para tool_config; respetar api_base en count_tokens
    - OpenAI: round-trip de reasoning_items de Responses API en chat completions; soporte day-0 de GPT-5.4 mini/nano
    
    *Proxy & Core:*
    - Guardrails a nivel de proyecto
    - Corrección de caché Redis cluster; aplicación de presupuesto entre pods respaldada por Redis
    - Corrección de condición de carrera de guardrail en streaming y captura de respuesta post-call
    - Afinidad de despliegue por grupo de modelos; límites de tasa por modelo para equipos
    - Autorrecuperación de la sesión aiohttp compartida cuando se cierra
    
    UI:
    - Migración de componentes de Tremor a Ant Design
    - Modernización de gestión de equipos; UI de guardrails de equipo
    - Corrección del filtro de logs (filtro vacío ya no muestra datos obsoletos); corrección de exportación CSV en Global Usage
    - Búsqueda paginada de equipos en usage; búsqueda por subcadena de alias de clave

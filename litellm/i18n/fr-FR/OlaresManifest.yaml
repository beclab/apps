metadata:
  title: LiteLLM
  description: Appelez plus de 100 LLM au format OpenAI
spec:
  fullDescription: |
    LiteLLM est un SDK Python et Proxy Server (AI Gateway) pour appeler plus de 100 API LLM au format OpenAI (ou natif), avec suivi des coûts, guardrails, répartition de charge et journalisation.
    
    **Fonctionnalités**
    - Unified API : Appelez plus de 100 API LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) au format OpenAI
    - Cost Tracking : Suivez les coûts sur tous les fournisseurs
    - Load Balancing : Répartissez les requêtes sur plusieurs modèles/endpoints
    - Guardrails : Filtrage de contenu et contrôles de sécurité
    - Logging & Observability : Journalisation et supervision complètes
    - Rate Limiting : Limitation de débit et throttling intégrés
    - Proxy Server : Déployez comme AI Gateway/Proxy
    - Multi-tenant : Prise en charge de plusieurs utilisateurs et équipes
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    Mise à niveau vers [v1.83.3-stable](https://github.com/BerriAI/litellm/releases/tag/v1.83.3-stable) (depuis v1.81.4).
    
    Sécurité :
    - Correction d'une escalade de privilèges sur /key/block, /key/unblock, /key/update max_budget
    - Rédaction globale des secrets via le root logger et correspondance par nom de clé
    - Durcissement de la chaîne d'approvisionnement : épinglage de toutes les dépendances Docker/npm/pip, signature d'images cosign
    
    Fournisseurs :
    - Anthropic : conserver thinking.summary lors du routage vers OpenAI Responses API ; flag d'opt-out pour le résumé de raisonnement par défaut
    - Gemini : corriger le sous-comptage des tokens image dans les métadonnées d'usage ; passer le modèle au constructeur d'URL de context caching pour api_base personnalisé
    - Azure : routage auto de gpt-5.4+ tools+reasoning vers Responses API
    - Bedrock : prise en charge de cache_control_injection_points pour tool_config ; respecter api_base dans count_tokens
    - OpenAI : round-trip des reasoning_items Responses API dans les chat completions ; support day-0 GPT-5.4 mini/nano
    
    *Proxy & Core :*
    - Guardrails au niveau projet
    - Correctif de cache Redis cluster ; application budgétaire cross-pod basée sur Redis
    - Correctif de condition de course des guardrails en streaming et capture de réponse post-call
    - Affinité de déploiement par groupe de modèles ; limites de débit par modèle pour les équipes
    - Récupération auto de la session aiohttp partagée lorsqu'elle est fermée
    
    UI :
    - Migration des composants de Tremor vers Ant Design
    - Modernisation de la gestion d'équipes ; UI des guardrails d'équipe
    - Correctif du filtre de logs (filtre vide n'affiche plus de données obsolètes) ; correctif d'export CSV sur Global Usage
    - Recherche d'équipes paginée sur la page usage ; recherche par sous-chaîne d'alias de clé

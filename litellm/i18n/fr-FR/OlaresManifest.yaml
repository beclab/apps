metadata:
  title: LiteLLM
  description: Appelez plus de 100 LLM au format OpenAI
spec:
  fullDescription: |
    LiteLLM est un SDK Python et Proxy Server (AI Gateway) pour appeler plus de 100 API LLM au format OpenAI (ou natif), avec suivi des coûts, guardrails, répartition de charge et journalisation.
    
    **Fonctionnalités**
    - Unified API : Appelez plus de 100 API LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) au format OpenAI
    - Cost Tracking : Suivez les coûts sur tous les fournisseurs
    - Load Balancing : Répartissez les requêtes sur plusieurs modèles/endpoints
    - Guardrails : Filtrage de contenu et contrôles de sécurité
    - Logging & Observability : Journalisation et supervision complètes
    - Rate Limiting : Limitation de débit et throttling intégrés
    - Proxy Server : Déployez comme AI Gateway/Proxy
    - Multi-tenant : Prise en charge de plusieurs utilisateurs et équipes
    Connexion administrateur : connectez-vous avec UI_USERNAME/UI_PASSWORD, créez un Proxy Admin distinct dans Internal Users et définissez son mot de passe via le lien d’invitation. Vérifiez sa connexion dans une fenêtre privée, puis activez DISABLE_ENV_CREDENTIAL_LOGIN dans les variables de l’application Olares. Après redémarrage, la connexion partagée et son avertissement rouge sont désactivés. Conservez false avant validation ; remettez false pour rétablir la connexion initiale. Les clés API maîtres restent utilisables.

  upgradeDescription: |
    Chart 1.0.24 corrige le démarrage des anciennes installations conservant la clé maître publique historique ; LiteLLM reste en 1.106.2.
    Les clés maîtres, clés virtuelles et identifiants des fournisseurs sont conservés. Seules les mises à niveau Helm avec cette clé exacte activent la compatibilité. Le risque existant de clé faible demeure ; aucune clé vide ou absente n’est autorisée.
    Les nouvelles installations exigent sk- suivi d’au moins 32 lettres/chiffres, sans compatibilité. La base existante est sauvegardée dans appData/backups/chart-1.0.24/litellm.dump avant démarrage. La rotation des clés reste une maintenance facultative distincte.
    Pour supprimer l’avertissement rouge, créez et vérifiez un Proxy Admin indépendant, puis appliquez DISABLE_ENV_CREDENTIAL_LOGIN=true dans Olares. Cette option ne modifie pas les clés API.
    https://github.com/BerriAI/litellm/releases/tag/v1.106.2

metadata:
  description: 以 OpenAI 格式调用 100+ LLM API
  title: LiteLLM
spec:
  fullDescription: |
    LiteLLM 是一个 Python SDK 和代理服务器（AI 网关），用于以 OpenAI（或原生）格式调用 100+ LLM API，具有成本跟踪、防护、负载均衡和日志记录功能。

    **主要功能：**
    - 统一 API：以 OpenAI 格式调用 100+ LLM API（OpenAI、Anthropic、Azure、Bedrock、VertexAI 等）
    - 成本跟踪：跟踪所有提供商的成本
    - 负载均衡：在多个模型/端点之间分发请求
    - 防护：内容过滤和安全检查
    - 日志和可观测性：全面的日志记录和监控
    - 速率限制：内置速率限制和节流
    - 代理服务器：部署为 AI 网关/代理服务器
    - 多租户：支持多个用户和团队

  upgradeDescription: |
    Chart 1.0.22 将 LiteLLM Proxy 从 v1.83.3-stable 升级到 v1.103.0。
    镜像为 docker.io/beclab/berriai-litellm:v1.103.0，与 main-stable 标签的摘要相同。

    master key、管理界面账号、PostgreSQL 接线和 proxy 配置保持不变。LiteLLM 会在启动时执行 Prisma 迁移。若已存在 public._prisma_migrations，init 容器会先把 PostgreSQL custom 格式备份写到 appData/backups/chart-1.0.22/litellm.dump。之后再次启动，以及没有这张表的数据库，都会跳过备份。

    发行说明：https://github.com/BerriAI/litellm/releases/tag/v1.103.0

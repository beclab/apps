metadata:
  description: 以 OpenAI 格式调用 100+ LLM API
  title: LiteLLM
spec:
  fullDescription: |
    LiteLLM 是一个 Python SDK 和代理服务器（AI 网关），用于以 OpenAI（或原生）格式调用 100+ LLM API，具有成本跟踪、防护、负载均衡和日志记录功能。

    **主要功能：**
    - 统一 API：以 OpenAI 格式调用 100+ LLM API（OpenAI、Anthropic、Azure、Bedrock、VertexAI 等）
    - 成本跟踪：跟踪所有提供商的成本
    - 负载均衡：在多个模型/端点之间分发请求
    - 防护：内容过滤和安全检查
    - 日志和可观测性：全面的日志记录和监控
    - 速率限制：内置速率限制和节流
    - 代理服务器：部署为 AI 网关/代理服务器
    - 多租户：支持多个用户和团队

    管理员登录设置：先用 UI_USERNAME/UI_PASSWORD 登录，在 Internal Users 中创建独立的 Proxy Admin，通过邀请链接设置独立密码。使用无痕窗口确认新账号可正常登录后，在 Olares 应用环境变量设置中将 DISABLE_ENV_CREDENTIAL_LOGIN 设为 true。应用重启后，环境变量登录将关闭，对应红色提示消失。确认独立账号可用前请保持默认 false；如无法登录，可改回 false 恢复初始登录方式。master API key 仍然有效。

  upgradeDescription: |
    Chart 1.0.24 修复旧安装保留历史公开默认 master key 时升级后无法启动的问题，LiteLLM 仍为 1.106.2。
    升级保留原 master key、虚拟 key 和已保存的模型供应商凭据，不自动轮换密钥。仅 Helm 升级且密钥恰为历史默认值时启用旧密钥兼容；这会保留原有弱密钥安全风险，不放行空密钥或未设置的密钥。
    新装要求 sk- 后至少 32 位字母或数字，不开启兼容。启动前将已有数据库备份至 appData/backups/chart-1.0.24/litellm.dump。密钥轮换作为独立、可选的维护操作。
    关闭环境变量登录红色提示：先创建并验证独立 Proxy Admin，再在 Olares 应用设置中将 DISABLE_ENV_CREDENTIAL_LOGIN 设为 true 并应用。此界面登录开关不会轮换 API 密钥。
    https://github.com/BerriAI/litellm/releases/tag/v1.106.2

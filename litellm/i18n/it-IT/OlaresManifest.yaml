metadata:
  title: LiteLLM
  description: Chiama oltre 100 LLM in formato OpenAI
spec:
  fullDescription: |
    LiteLLM è un SDK Python e Proxy Server (AI Gateway) per chiamare oltre 100 API LLM in formato OpenAI (o nativo), con cost tracking, guardrail, load balancing e logging.
    
    **Funzioni**
    - Unified API: Chiama oltre 100 API LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, ecc.) in formato OpenAI
    - Cost Tracking: Traccia i costi su tutti i provider
    - Load Balancing: Distribuisci le richieste su più modelli/endpoint
    - Guardrails: Filtraggio dei contenuti e controlli di sicurezza
    - Logging & Observability: Logging e monitoraggio completi
    - Rate Limiting: Rate limiting e throttling integrati
    - Proxy Server: Distribuisci come AI Gateway/Proxy
    - Multi-tenant: Supporto per più utenti e team
    Accesso amministratore: accedere con UI_USERNAME/UI_PASSWORD, creare un Proxy Admin separato in Internal Users e impostarne la password tramite il link di invito. Verificare l’accesso in una finestra privata, quindi attivare DISABLE_ENV_CREDENTIAL_LOGIN nelle variabili dell’app Olares. Dopo il riavvio, l’accesso condiviso e il relativo avviso rosso vengono disattivati. Mantenere false fino alla verifica; ripristinare false per recuperare l’accesso iniziale. Le chiavi API master restano valide.

  upgradeDescription: |
    Chart 1.0.24 corregge il mancato avvio negli aggiornamenti che mantengono la chiave master pubblica storica; LiteLLM resta 1.106.2.
    Chiavi master, chiavi virtuali e credenziali dei provider restano invariate. Solo gli aggiornamenti Helm con quella chiave esatta attivano la compatibilità. Il rischio della chiave debole rimane; chiavi vuote o assenti non vengono ammesse.
    Le nuove installazioni richiedono sk- seguito da almeno 32 lettere/cifre, senza compatibilità. Prima dell’avvio, il database esistente viene salvato in appData/backups/chart-1.0.24/litellm.dump. La rotazione delle chiavi è una manutenzione facoltativa separata.
    Per rimuovere l’avviso rosso, creare e verificare un Proxy Admin indipendente, poi applicare DISABLE_ENV_CREDENTIAL_LOGIN=true in Olares. Questa opzione non cambia le chiavi API.
    https://github.com/BerriAI/litellm/releases/tag/v1.106.2

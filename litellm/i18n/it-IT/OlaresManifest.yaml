metadata:
  title: LiteLLM
  description: Chiama oltre 100 LLM in formato OpenAI
spec:
  fullDescription: |
    LiteLLM è un SDK Python e Proxy Server (AI Gateway) per chiamare oltre 100 API LLM in formato OpenAI (o nativo), con cost tracking, guardrail, load balancing e logging.
    
    **Funzioni**
    - Unified API: Chiama oltre 100 API LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, ecc.) in formato OpenAI
    - Cost Tracking: Traccia i costi su tutti i provider
    - Load Balancing: Distribuisci le richieste su più modelli/endpoint
    - Guardrails: Filtraggio dei contenuti e controlli di sicurezza
    - Logging & Observability: Logging e monitoraggio completi
    - Rate Limiting: Rate limiting e throttling integrati
    - Proxy Server: Distribuisci come AI Gateway/Proxy
    - Multi-tenant: Supporto per più utenti e team
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
    
    Aggiornamento a [v1.83.3-stable](https://github.com/BerriAI/litellm/releases/tag/v1.83.3-stable) (da v1.81.4).
    
    Sicurezza:
    - Fix escalation di privilegi su /key/block, /key/unblock, /key/update max_budget
    - Redazione globale dei secret via root logger e pattern matching basato sul nome chiave
    - Hardening della supply chain: pin di tutte le dipendenze Docker/npm/pip, firma immagini cosign
    
    Provider:
    - Anthropic: preservare thinking.summary quando si instrada a OpenAI Responses API; flag di opt-out per il summary di reasoning predefinito
    - Gemini: fix sottoconteggio token immagine nei metadati usage; passare il modello al builder URL di context caching per api_base personalizzato
    - Azure: auto-routing di gpt-5.4+ tools+reasoning a Responses API
    - Bedrock: supporto cache_control_injection_points per tool_config; rispettare api_base in count_tokens
    - OpenAI: round-trip di reasoning_items Responses API in chat completions; supporto day-0 GPT-5.4 mini/nano
    
    *Proxy & Core:*
    - Supporto guardrail a livello di progetto
    - Fix caching Redis cluster; enforcement budget cross-pod basato su Redis
    - Fix race condition guardrail in streaming e cattura risposta post-call
    - Affinità di deployment per gruppo modelli; rate limit per modello per i team
    - Auto-recupero della sessione aiohttp condivisa quando chiusa
    
    UI:
    - Migrazione componenti da Tremor ad Ant Design
    - Modernizzazione gestione team; UI guardrail di team
    - Fix filtro log (filtro vuoto non mostra più dati obsoleti); fix export CSV su Global Usage
    - Ricerca team paginata nella pagina usage; ricerca per sottostringa alias chiave

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  litellm: 1
  litellmingress: 1
metadata:
  name: litellm
  icon: https://app.cdn.olares.com/appstore/litellm/icon.png
  description: Call 100+ LLMs in OpenAI format
  appid: litellm
  title: LiteLLM
  version: "1.0.24"
  categories:
  - Utilities_v112
  - models
  tags:
  - gateway

spec:
  versionName: "1.106.2"
  featuredImage: https://app.cdn.olares.com/appstore/litellm/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/litellm/1.webp
    - https://app.cdn.olares.com/appstore/litellm/2.webp
    - https://app.cdn.olares.com/appstore/litellm/3.webp
  fullDescription: |
    LiteLLM is a Python SDK and Proxy Server (AI Gateway) to call 100+ LLM APIs in OpenAI (or native) format, with cost tracking, guardrails, loadbalancing and logging.

    **Features**
    - Unified API: Call 100+ LLM APIs (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) in OpenAI format
    - Cost Tracking: Track costs across all providers
    - Load Balancing: Distribute requests across multiple models/endpoints
    - Guardrails: Content filtering and safety checks
    - Logging & Observability: Comprehensive logging and monitoring
    - Rate Limiting: Built-in rate limiting and throttling
    - Proxy Server: Deploy as an AI Gateway/Proxy server
    - Multi-tenant: Support for multiple users and teams

    Admin login setup: use UI_USERNAME/UI_PASSWORD for initial access, create a separate Proxy Admin under Internal Users and set its own password via an invitation link. Verify that account in a private window, then enable DISABLE_ENV_CREDENTIAL_LOGIN in Olares app environment settings. After the app restarts, shared environment login is disabled and its red warning disappears. Keep the default false until the separate login works; set false again to recover bootstrap access if needed. Master API keys remain usable.

  upgradeDescription: |
    Chart 1.0.24 fixes startup failures when upgrading existing installations that retain the historical public default master key; LiteLLM remains 1.106.2.
    Existing master keys, virtual keys and stored provider credentials are preserved without automatic key rotation. Only Helm upgrades retaining the exact historical default enable legacy-key compatibility. This preserves the existing weak-key security risk; empty/unset keys are never allowed by this compatibility rule.
    New installations require sk- followed by at least 32 letters/digits and do not enable compatibility. An existing database is backed up to appData/backups/chart-1.0.24/litellm.dump before startup. Key rotation is a separate optional maintenance operation.
    To remove the environment-login red banner, first create and verify an independent Proxy Admin, then set DISABLE_ENV_CREDENTIAL_LOGIN=true in Olares app settings and Apply. This UI setting does not rotate API keys.
    https://github.com/BerriAI/litellm/releases/tag/v1.106.2

  developer: BerriAI
  website: https://www.litellm.ai
  sourceCode: https://github.com/BerriAI/litellm
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://docs.litellm.ai
  license:
    - text: MIT
      url: https://github.com/BerriAI/litellm/blob/main/LICENSE
  limitedCpu: 4.5
  requiredCpu: 200m
  requiredDisk: 1Gi
  limitedDisk: 500Gi
  limitedMemory: 4.5Gi
  requiredMemory: 576Mi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
entrances:
  - name: litellmui
    host: litellmingress
    port: 8080
    title: LiteLLM
    icon: https://app.cdn.olares.com/appstore/litellm/icon.png
    authLevel: private
    openMethod: window
  - name: litellmapi
    host: litellm-svc
    icon: https://app.cdn.olares.com/appstore/litellm/icon.png
    openMethod: window
    port: 80
    title: LiteLLM API
    authLevel: internal
    invisible: true
middleware:
  postgres:
    username: litellm
    password: litellm
    databases:
      - name: litellm
        distributed: false
envs:
  - envName: LITELLM_MASTER_KEY
    required: true
    type: password
    editable: true
    applyOnChange: true
    regex: '^sk-[A-Za-z0-9]{32,}$'
    description: "New installations: use sk- followed by at least 32 letters/digits. Upgrades preserve the current key; the historical default is retained in legacy compatibility mode with its existing security risk. Key rotation is optional and separate; use the migration field when rotating it."
  - envName: LITELLM_MIGRATE_FROM_MASTER_KEY
    required: false
    type: password
    editable: true
    applyOnChange: true
    description: "Previous master key, only when rotating a key used to encrypt stored credentials. Set together with the new master key; clear after successful migration."
  - envName: UI_USERNAME
    required: true
    type: string
    editable: true
    applyOnChange: true
    regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{1,}$'
    description: "Username for admin UI"
  - envName: UI_PASSWORD
    required: true
    type: password
    editable: true
    applyOnChange: true
    regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{6,}$'
    description: "Password for admin UI (must be at least 6 characters)"
  - envName: DISABLE_ENV_CREDENTIAL_LOGIN
    required: false
    type: bool
    default: "false"
    editable: true
    applyOnChange: true
    description: "Disable shared UI_USERNAME/UI_PASSWORD admin login and its red warning. FIRST create a separate Proxy Admin in LiteLLM, set its own password using the invitation link, and verify login in a private window. Then set true here. If locked out, set false to restore the bootstrap login. This does not disable master API keys."
  - envName: LITELLM_DROP_PARAMS
    required: false
    applyOnChange: true
    editable: true
    type: bool
    default: "true"
    description: "Drop the unsupported parameter instead of raising an exception"
  - envName: USE_SYSTEM_SMTP_SETTINGS
    required: false
    applyOnChange: true
    editable: true
    type: bool
    default: "true"
    description: "Use system SMTP settings (when enabled, SMTP envs are managed by system envs"
  - envName: SMTP_ENABLED
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_ENABLED
  - envName: SMTP_HOST
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_SERVER
  - envName: SMTP_PORT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PORT
  - envName: SMTP_SENDER_EMAIL
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_FROM_ADDRESS
  - envName: SMTP_TLS
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_USE_TLS
  - envName: SMTP_USERNAME
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_USERNAME
  - envName: SMTP_PASSWORD
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PASSWORD


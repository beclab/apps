metadata:
  title: DeepSeek-OCR2 WebUI V3
  description: すぐ使える DeepSeek-OCR-2 Web UI
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えます。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除します。

    v1.1.8: 独自ダウンローダーを共有 llm-init ダウンロード専用 Deployment に置換
    （イメージ llm-init:v1.3.1、既定 LFS）。モデルは共有クロスアプリ HF キャッシュ（App Common）に配置され、
    OCR エンジンは /readyz を待機；/app/models はキャッシュ済みスナップショット上のシンボリックリンク群。
    permission.appCommon: true を宣言し、ダウンローダーの大きめのメモリ上限のため nvidia-gb10 limitedMemory を 28Gi に引き上げ。

    DeepSeek-OCR-2 WebUI を apiVersion v3 共有アプリパターンへ移行（deepseekocrwebuiv2 → deepseekocrwebuiv3）。

    **変更点**

    - **アーキテクチャ**: サブチャートをフラット化；nginx clientproxy の upstream は同一名前空間の Service を対象。
    - **スケーリング**: OCR・ダウンローダー・Web プロキシ向けに `workloadReplicas`。
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でインストールされるサービスは 1 つだけです。各ユーザーはデスクトップエントリをインストールしてアクセスするか、共有エントランス経由でサービス API を呼び出せます。

    **概要**
    DeepSeek-OCR-WebUI は DeepSeek-OCR-2 モデル（Visual Causal Flow）に基づくインテリジェント画像認識 Web アプリで、直感的な UI と強力な認識機能を提供します。

    **主なハイライト**
    - DeepSeek-OCR-2 モデル — Visual Causal Flow アーキテクチャによる次世代 OCR
    - 7 つの認識モード — Document、OCR、Chart、Find、Freeform など
    - バウンディングボックス可視化 — Find モードが位置を自動注釈
    - バッチ処理 — 複数画像の順次認識に対応
    - PDF 対応 — PDF をアップロードして自動で画像に変換
    - モダン UI — クールなグラデーション背景とアニメーション効果
    - 多言語対応 — 簡体字中国語、繁体字中国語、英語、日本語
    - GPU 加速 — NVIDIA GPU による高性能推論
    - モデル自動ダウンロード — 進捗表示付き組み込み HuggingFace ダウンローダー
    - ModelScope フォールバック — HuggingFace が使えないとき ModelScope へ自動切替

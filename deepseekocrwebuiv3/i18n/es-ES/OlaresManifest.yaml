metadata:
  title: DeepSeek-OCR2 WebUI V3
  description: Web UI DeepSeek-OCR-2 lista para usar
spec:
  upgradeDescription: |
    Cambie la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinee los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y elimine el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.

    v1.1.8: se sustituyó el descargador a medida por el Deployment compartido llm-init solo descarga
    (imagen llm-init:v1.3.1, LFS por defecto). El modelo ahora llega a la caché HF compartida
    entre apps (App Common) y el motor OCR espera a /readyz; /app/models es una
    granja de symlinks sobre el snapshot en caché. Se declaró permission.appCommon: true y se
    elevó limitedMemory de nvidia-gb10 a 28Gi por el mayor límite de memoria del descargador.

    DeepSeek-OCR-2 WebUI migrado al patrón de app compartida apiVersion v3 (deepseekocrwebuiv2 → deepseekocrwebuiv3).

    **Cambios**

    - **Arquitectura**: sub-charts aplanados; los upstreams del nginx clientproxy apuntan a Services del namespace.
    - **Escalado**: `workloadReplicas` para las cargas OCR, downloader y web proxy.
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Cada usuario puede instalar una entrada de escritorio para acceder o usar la entrada compartida para llamar a la API del servicio.

    **RESUMEN**
    DeepSeek-OCR-WebUI es una aplicación web inteligente de reconocimiento de imágenes basada en el modelo DeepSeek-OCR-2 (Visual Causal Flow), que ofrece una interfaz intuitiva y potentes capacidades de reconocimiento.

    **Aspectos clave**
    - Modelo DeepSeek-OCR-2 — OCR de nueva generación impulsado por la arquitectura Visual Causal Flow
    - 7 modos de reconocimiento — Document, OCR, Chart, Find, Freeform, etc.
    - Visualización de bounding boxes — el modo Find anota automáticamente las posiciones
    - Procesamiento por lotes — admite el reconocimiento secuencial de varias imágenes
    - Soporte PDF — suba archivos PDF y conviértalos automáticamente en imágenes
    - UI moderna — fondos en degradado y efectos de animación
    - Soporte multilingüe — chino simplificado, chino tradicional, inglés, japonés
    - Aceleración GPU — inferencia de alto rendimiento basada en GPU NVIDIA
    - Descarga automática del modelo — descargador HuggingFace integrado con seguimiento de progreso
    - Fallback ModelScope — cambio automático a ModelScope cuando HuggingFace no está disponible

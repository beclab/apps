metadata:
  title: DeepSeek-OCR2 WebUI V3
  description: Sofort einsetzbare DeepSeek-OCR-2 Web-UI
spec:
  upgradeDescription: |
    Wechseln Sie das Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Passen Sie nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images an (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und entfernen Sie die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE`.

    v1.1.8: den eigenen Downloader durch den gemeinsamen llm-init Download-only
    Deployment ersetzt (Image llm-init:v1.3.1, Standard LFS). Das Modell landet jetzt im gemeinsamen
    Cross-App-HF-Cache (App Common) und die OCR-Engine wartet auf /readyz; /app/models ist eine
    Symlink-Farm über den gecachten Snapshot. permission.appCommon: true deklariert und
    nvidia-gb10 limitedMemory für das größere Speicherlimit des Downloaders auf 28Gi angehoben.

    DeepSeek-OCR-2 WebUI auf das apiVersion-v3 Shared-App-Muster migriert (deepseekocrwebuiv2 → deepseekocrwebuiv3).

    **Änderungen**

    - **Architektur**: Sub-Charts abgeflacht; nginx clientproxy Upstreams zielen auf In-Namespace-Services.
    - **Skalierung**: `workloadReplicas` für OCR-, Downloader- und Web-Proxy-Workloads.
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer kann einen Desktop-Eintrag installieren, um darauf zuzugreifen, oder den Shared Entrance nutzen, um die Dienst-API aufzurufen.

    **ÜBERSICHT**
    DeepSeek-OCR-WebUI ist eine intelligente Bilderkennungs-Webanwendung basierend auf dem DeepSeek-OCR-2-Modell (Visual Causal Flow) und bietet eine intuitive Benutzeroberfläche sowie leistungsstarke Erkennungsfunktionen.

    **Kern-Highlights**
    - DeepSeek-OCR-2-Modell – Next-Gen-OCR mit Visual-Causal-Flow-Architektur
    - 7 Erkennungsmodi – Document, OCR, Chart, Find, Freeform usw.
    - Bounding-Box-Visualisierung – Find-Modus annotiert Positionen automatisch
    - Stapelverarbeitung – Unterstützung für sequentielle Erkennung mehrerer Bilder
    - PDF-Unterstützung – PDF-Dateien hochladen, automatisch in Bilder umwandeln
    - Moderne UI – coole Verlaufshintergründe und Animationseffekte
    - Mehrsprachigkeit – vereinfachtes Chinesisch, traditionelles Chinesisch, Englisch, Japanisch
    - GPU-Beschleunigung – Hochleistungsinferenz auf Basis von NVIDIA-GPU
    - Automatischer Modell-Download – integrierter HuggingFace-Downloader mit Fortschrittsanzeige
    - ModelScope-Fallback – automatischer Wechsel zu ModelScope, wenn HuggingFace nicht verfügbar ist

metadata:
  title: DeepSeek-OCR2 WebUI V3
  description: "Interface Web DeepSeek-OCR-2 prête à l'emploi"
spec:
  upgradeDescription: |
    Remplacez l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alignez les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimez le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.

    v1.1.8 : remplacement du téléchargeur sur mesure par le Deployment partagé llm-init en téléchargement seul
    (image llm-init:v1.3.1, LFS par défaut). Le modèle arrive désormais dans le cache HF partagé
    entre apps (App Common) et le moteur OCR attend /readyz ; /app/models est une
    ferme de symlinks sur le snapshot mis en cache. permission.appCommon: true déclaré et
    limitedMemory nvidia-gb10 porté à 28Gi pour la limite mémoire plus élevée du téléchargeur.

    DeepSeek-OCR-2 WebUI migré vers le modèle d'app partagée apiVersion v3 (deepseekocrwebuiv2 → deepseekocrwebuiv3).

    **Changements**

    - **Architecture** : sous-charts aplatis ; les upstreams nginx clientproxy ciblent les Services du namespace.
    - **Mise à l'échelle** : `workloadReplicas` pour les charges OCR, downloader et web proxy.
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé dans l'ensemble du système Olares. Chaque utilisateur peut installer une entrée de bureau pour y accéder ou utiliser l'entrée partagée pour appeler l'API du service.

    **APERÇU**
    DeepSeek-OCR-WebUI est une application web intelligente de reconnaissance d'images basée sur le modèle DeepSeek-OCR-2 (Visual Causal Flow), offrant une interface intuitive et de puissantes capacités de reconnaissance.

    **Points forts**
    - Modèle DeepSeek-OCR-2 — OCR nouvelle génération propulsé par l'architecture Visual Causal Flow
    - 7 modes de reconnaissance — Document, OCR, Chart, Find, Freeform, etc.
    - Visualisation des bounding boxes — le mode Find annote automatiquement les positions
    - Traitement par lots — prise en charge de la reconnaissance séquentielle de plusieurs images
    - Prise en charge PDF — téléversez des fichiers PDF, convertis automatiquement en images
    - UI moderne — arrière-plans en dégradé et effets d'animation
    - Prise en charge multilingue — chinois simplifié, chinois traditionnel, anglais, japonais
    - Accélération GPU — inférence haute performance basée sur GPU NVIDIA
    - Téléchargement automatique du modèle — téléchargeur HuggingFace intégré avec suivi de progression
    - Repli ModelScope — bascule automatique vers ModelScope lorsque HuggingFace est indisponible

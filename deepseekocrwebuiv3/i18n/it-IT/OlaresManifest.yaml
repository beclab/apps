metadata:
  title: DeepSeek-OCR2 WebUI V3
  description: "Web UI DeepSeek-OCR-2 pronta all'uso"
spec:
  upgradeDescription: |
    Passa l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allinea i mount di configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovi il collegamento specifico Bitnami di `OPENRESTY_CONF_FILE`.

    v1.1.8: sostituito il downloader dedicato con il Deployment condiviso llm-init solo download
    (immagine llm-init:v1.3.1, LFS predefinito). Il modello ora arriva nella cache HF condivisa
    tra app (App Common) e il motore OCR attende /readyz; /app/models è una
    farm di symlink sullo snapshot in cache. Dichiarato permission.appCommon: true e
    alzato limitedMemory di nvidia-gb10 a 28Gi per il limite di memoria più alto del downloader.

    DeepSeek-OCR-2 WebUI migrato al pattern shared app apiVersion v3 (deepseekocrwebuiv2 → deepseekocrwebuiv3).

    **Cosa è cambiato**

    - **Architettura**: sub-chart appiattiti; gli upstream nginx clientproxy puntano a Service nello stesso namespace.
    - **Scaling**: `workloadReplicas` per i workload OCR, downloader e web proxy.
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio in tutto il sistema Olares. Ogni utente può installare una voce desktop per accedervi o usare l'ingresso condiviso per chiamare l'API del servizio.

    **PANORAMICA**
    DeepSeek-OCR-WebUI è un'applicazione web intelligente di riconoscimento immagini basata sul modello DeepSeek-OCR-2 (Visual Causal Flow), con un'interfaccia intuitiva e potenti capacità di riconoscimento.

    **Punti salienti**
    - Modello DeepSeek-OCR-2 — OCR di nuova generazione basato sull'architettura Visual Causal Flow
    - 7 modalità di riconoscimento — Document, OCR, Chart, Find, Freeform, ecc.
    - Visualizzazione bounding box — la modalità Find annota automaticamente le posizioni
    - Elaborazione batch — supporto per il riconoscimento sequenziale di più immagini
    - Supporto PDF — carica file PDF e convertili automaticamente in immagini
    - UI moderna — sfondi a gradiente e effetti di animazione
    - Supporto multilingue — cinese semplificato, cinese tradizionale, inglese, giapponese
    - Accelerazione GPU — inferenza ad alte prestazioni basata su GPU NVIDIA
    - Download automatico del modello — downloader HuggingFace integrato con monitoraggio progresso
    - Fallback ModelScope — passaggio automatico a ModelScope quando HuggingFace non è disponibile

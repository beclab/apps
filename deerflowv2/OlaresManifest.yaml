---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  deerflowv2: 1
  deerflowv2-backend: 1
  deerflowv2-frontend: 1
metadata:
  name: deerflowv2
  description: DeerFlow 2.0 is an open-source super agent harness for deep research.
  icon: https://app.cdn.olares.com/appstore/deerflow/icon.png
  appid: deerflowv2
  version: '1.0.8'
  title: DeerFlow 2.0
  categories:
    - Productivity_v112

entrances:
  - name: deerflowv2
    port: 8080
    host: deerflowv2-web-svc
    title: DeerFlow 2.0
    icon: https://app.cdn.olares.com/appstore/deerflow/icon.png
    authLevel: internal
    openMethod: window
permission:
  appData: true
  appCache: true
  userData:
    - Home
middleware:
  postgres:
    username: deerflow
    databases:
      - name: deerflow
spec:
  versionName: '2.1.1'
  featuredImage: https://app.cdn.olares.com/appstore/deerflow/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/deerflow/1.webp
    - https://app.cdn.olares.com/appstore/deerflow/2.webp
    - https://app.cdn.olares.com/appstore/deerflow/3.webp
  fullDescription: |
    DeerFlow 2.0 (Deep Exploration and Efficient Research Flow) is an open-source super agent harness that coordinates sub-agents, memory, and sandboxes for complex AI tasks. Built on LangGraph and LangChain, it is a ground-up rewrite of the original DeerFlow framework.

    **Key Features**
    **Core Capabilities**
    - Super Agent Harness
      - Coordinates sub-agents for parallel task execution
      - Sandbox-based code execution (AIO container via DinD by default; image configurable via SANDBOX_IMAGE)
      - Persistent long-term memory across conversations
      - Extensible skills system (Markdown-based workflows)
    - LLM Integration
      - Supports integration of most models through litellm and LangChain
      - Support for open source models like Qwen, DeepSeek, etc.
      - OpenAI-compatible API interface
      - Multi-model support with thinking/vision capabilities

    **Tools and MCP Integrations**
    - Search and Retrieval
      - Web search via Tavily, Brave Search and more
      - Crawling with Jina
      - Advanced content extraction
    - MCP Seamless Integration
      - Expand capabilities for private domain access, knowledge graph, web browsing and more
      - Facilitates integration of diverse research tools and methodologies

    **Human Collaboration**
    - Human-in-the-loop
      - Supports interactive modification of research plans using natural language
      - Supports auto-acceptance of research plans
    - Report Post-Editing
      - Supports Notion-like block editing
      - Allows AI refinements, including AI-assisted polishing, sentence shortening, and expansion
      - Powered by tiptap

    **Content Creation**
    - Skills-based Workflows
      - Research reports, slide decks, web pages, and image generation
      - Custom skills for specialized workflows
      - Podcast script generation and audio synthesis
  upgradeDescription: |
    **ENABLE_SANDBOX** async DinD pull (chart 1.0.8).

    - Removed blocking `init-prefetch-sandbox`; gateway starts once dockerd is up
    - DinD pulls `SANDBOX_IMAGE` in the background (retries forever); other features work meanwhile
    - Sandbox tools become available after the image lands in `appData/docker`
    - `ENABLE_SANDBOX=false` skips DinD and uses LocalSandbox + `allow_host_bash`

  developer: Bytedance Inc.
  website: https://deerflow.tech
  sourceCode: https://github.com/bytedance/deer-flow
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://deerflow.tech
  license:
    - text: MIT License
      url: https://github.com/bytedance/deer-flow?tab=MIT-1-ov-file
  requiredMemory: 2Gi
  limitedMemory: 8Gi
  requiredDisk: 2Gi
  limitedDisk: 50Gi
  requiredCpu: 500m
  limitedCpu: 6
  supportArch:
    - amd64
    - arm64
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
envs:
  - envName: ENABLE_SANDBOX
    type: bool
    required: false
    applyOnChange: true
    editable: true
    default: "true"
    description: "Enable AIO container sandbox via DinD (default on). When true, DinD starts and pulls SANDBOX_IMAGE in the background (non-blocking); sandbox works after the pull succeeds. When false, skips DinD and uses LocalSandbox with host bash."
  - envName: SANDBOX_IMAGE
    type: string
    required: false
    applyOnChange: true
    editable: true
    default: "beclab/agent-infra-sandbox:1.11.0"
    description: "AIO sandbox image pulled asynchronously by DinD into appData/docker and used by AioSandboxProvider. Only used when ENABLE_SANDBOX=true."

metadata:
  title: DeerFlow 2.0
  description: Ein Open-Source-Super-Agent-Harness für Deep Research
spec:
  fullDescription: |
    DeerFlow 2.0 (Deep Exploration and Efficient Research Flow) ist ein Open-Source-Super-Agent-Harness, der Sub-Agents, Memory und Sandboxes für komplexe KI-Aufgaben koordiniert. Aufgebaut auf LangGraph und LangChain ist es eine Neuentwicklung des ursprünglichen DeerFlow-Frameworks von Grund auf.
    
    **Hauptfunktionen**
    **Kernfähigkeiten**
    - Super Agent Harness
      - Koordiniert Sub-Agents für parallele Aufgabenausführung
      - Sandbox-basierte Codeausführung (AIO-Container via DinD standardmäßig; Image über SANDBOX_IMAGE konfigurierbar)
      - Persistentes Langzeitgedächtnis über Gespräche hinweg
      - Erweiterbares Skills-System (Markdown-basierte Workflows)
    - LLM-Integration
      - Unterstützt die Integration der meisten Modelle über litellm und LangChain
      - Unterstützung für Open-Source-Modelle wie Qwen, DeepSeek usw.
      - OpenAI-kompatible API-Schnittstelle
      - Multi-Modell-Unterstützung mit Thinking-/Vision-Fähigkeiten
    
    **Tools und MCP-Integrationen**
    - Suche und Retrieval
      - Websuche über Tavily, Brave Search und mehr
      - Crawling mit Jina
      - Erweiterte Inhaltsextraktion
    - Nahtlose MCP-Integration
      - Erweitert Fähigkeiten für privaten Domain-Zugriff, Knowledge Graph, Web-Browsing und mehr
      - Erleichtert die Integration vielfältiger Recherche-Tools und Methoden
    
    **Menschliche Zusammenarbeit**
    - Human-in-the-loop
      - Unterstützt interaktive Anpassung von Rechercheplänen in natürlicher Sprache
      - Unterstützt Auto-Acceptance von Rechercheplänen
    - Report-Nachbearbeitung
      - Unterstützt Notion-ähnliche Blockbearbeitung
      - Ermöglicht KI-Verfeinerungen, einschließlich KI-gestütztem Polieren, Satzverkürzung und Erweiterung
      - Betrieben von tiptap
    
    **Content Creation**
    - Skills-basierte Workflows
      - Rechercheberichte, Folien, Webseiten und Bildgenerierung
      - Custom Skills für spezialisierte Workflows
      - Podcast-Skriptgenerierung und Audiosynthese
  upgradeDescription: |
    **ENABLE_SANDBOX** asynchroner DinD-Pull (Chart 1.0.8).
    
    - Blockierendes `init-prefetch-sandbox` entfernt; Gateway startet, sobald dockerd bereit ist
    - DinD zieht `SANDBOX_IMAGE` im Hintergrund (endlos Retry); andere Funktionen laufen inzwischen
    - Sandbox-Tools werden verfügbar, nachdem das Image in `appData/docker` gelandet ist
    - `ENABLE_SANDBOX=false` überspringt DinD und nutzt LocalSandbox + `allow_host_bash`

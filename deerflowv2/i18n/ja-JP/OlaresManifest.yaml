metadata:
  title: DeerFlow 2.0
  description: 深いリサーチ向けのオープンソース・スーパーエージェントハーネス
spec:
  fullDescription: |
    DeerFlow 2.0（Deep Exploration and Efficient Research Flow）は、複雑な AI タスク向けにサブエージェント、メモリ、サンドボックスを協調させるオープンソースのスーパーエージェントハーネスです。LangGraph と LangChain 上に構築され、元の DeerFlow フレームワークをゼロから書き直したものです。
    
    **主な機能**
    **コア機能**
    - Super Agent Harness
      - 並列タスク実行のためのサブエージェント協調
      - サンドボックスベースのコード実行（既定は DinD 経由の AIO コンテナ。イメージは SANDBOX_IMAGE で設定可能）
      - 会話をまたぐ永続的な長期メモリ
      - 拡張可能なスキルシステム（Markdown ベースのワークフロー）
    - LLM 統合
      - litellm と LangChain 経由でほとんどのモデル統合をサポート
      - Qwen、DeepSeek などのオープンソースモデルに対応
      - OpenAI 互換 API インターフェース
      - thinking／vision 能力を持つマルチモデル対応
    
    **ツールと MCP 統合**
    - 検索と抽出
      - Tavily、Brave Search などによる Web 検索
      - Jina によるクローリング
      - 高度なコンテンツ抽出
    - シームレスな MCP 統合
      - プライベートドメインアクセス、ナレッジグラフ、Web 閲覧などの能力を拡張
      - 多様なリサーチツールと手法の統合を容易に
    
    **人との協働**
    - Human-in-the-loop
      - 自然言語によるリサーチプランの対話的修正をサポート
      - リサーチプランの自動承認をサポート
    - レポート後編集
      - Notion 風のブロック編集をサポート
      - AI による推敲、文の短縮・拡充などの改善が可能
      - tiptap を採用
    
    **コンテンツ作成**
    - スキルベースのワークフロー
      - リサーチレポート、スライド、Web ページ、画像生成
      - 専門ワークフロー向けカスタムスキル
      - ポッドキャスト脚本生成と音声合成
  upgradeDescription: |
    **ENABLE_SANDBOX** 非同期 DinD プル（chart 1.0.8）。
    
    - ブロッキングな `init-prefetch-sandbox` を削除。dockerd 起動後にゲートウェイが開始
    - DinD がバックグラウンドで `SANDBOX_IMAGE` をプル（無限リトライ）。その間も他機能は利用可能
    - イメージが `appData/docker` に到着後、サンドボックスツールが利用可能に
    - `ENABLE_SANDBOX=false` では DinD をスキップし LocalSandbox + `allow_host_bash` を使用

metadata:
  title: DeerFlow 2.0
  description: Un harness de superagente open-source para investigación profunda
spec:
  fullDescription: |
    DeerFlow 2.0 (Deep Exploration and Efficient Research Flow) es un harness de superagente open-source que coordina subagentes, memoria y sandboxes para tareas de IA complejas. Construido sobre LangGraph y LangChain, es una reescritura desde cero del framework DeerFlow original.
    
    **Funciones clave**
    **Capacidades principales**
    - Super Agent Harness
      - Coordina subagentes para ejecución paralela de tareas
      - Ejecución de código basada en sandbox (contenedor AIO vía DinD por defecto; imagen configurable con SANDBOX_IMAGE)
      - Memoria a largo plazo persistente entre conversaciones
      - Sistema de skills extensible (flujos de trabajo basados en Markdown)
    - Integración LLM
      - Admite la integración de la mayoría de modelos a través de litellm y LangChain
      - Soporte para modelos open source como Qwen, DeepSeek, etc.
      - Interfaz API compatible con OpenAI
      - Soporte multimodelo con capacidades thinking/vision
    
    **Herramientas e integraciones MCP**
    - Búsqueda y recuperación
      - Búsqueda web vía Tavily, Brave Search y más
      - Crawling con Jina
      - Extracción avanzada de contenido
    - Integración MCP fluida
      - Amplía capacidades para acceso a dominios privados, knowledge graph, navegación web y más
      - Facilita la integración de diversas herramientas y metodologías de investigación
    
    **Colaboración humana**
    - Human-in-the-loop
      - Admite la modificación interactiva de planes de investigación en lenguaje natural
      - Admite la autoaceptación de planes de investigación
    - Postedición de informes
      - Admite edición de bloques tipo Notion
      - Permite refinamientos con IA, incluido pulido asistido, acortamiento y ampliación de frases
      - Impulsado por tiptap
    
    **Creación de contenido**
    - Flujos de trabajo basados en skills
      - Informes de investigación, presentaciones, páginas web y generación de imágenes
      - Skills personalizadas para flujos especializados
      - Generación de guiones de podcast y síntesis de audio
  upgradeDescription: |
    **ENABLE_SANDBOX** pull DinD asíncrono (chart 1.0.8).
    
    - Eliminado el `init-prefetch-sandbox` bloqueante; el gateway arranca en cuanto dockerd está listo
    - DinD descarga `SANDBOX_IMAGE` en segundo plano (reintentos indefinidos); otras funciones funcionan mientras tanto
    - Las herramientas sandbox están disponibles tras aterrizar la imagen en `appData/docker`
    - `ENABLE_SANDBOX=false` omite DinD y usa LocalSandbox + `allow_host_bash`

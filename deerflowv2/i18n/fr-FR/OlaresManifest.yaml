metadata:
  title: DeerFlow 2.0
  description: Un harness de super agent open source pour la recherche approfondie
spec:
  fullDescription: |
    DeerFlow 2.0 (Deep Exploration and Efficient Research Flow) est un harness de super agent open source qui coordonne des sous-agents, la mémoire et des sandboxes pour des tâches d'IA complexes. Construit sur LangGraph et LangChain, c'est une réécriture complète du framework DeerFlow d'origine.
    
    **Fonctionnalités clés**
    **Capacités principales**
    - Super Agent Harness
      - Coordonne des sous-agents pour l'exécution parallèle de tâches
      - Exécution de code basée sur sandbox (conteneur AIO via DinD par défaut ; image configurable via SANDBOX_IMAGE)
      - Mémoire à long terme persistante entre les conversations
      - Système de skills extensible (workflows basés sur Markdown)
    - Intégration LLM
      - Prend en charge l'intégration de la plupart des modèles via litellm et LangChain
      - Prise en charge des modèles open source comme Qwen, DeepSeek, etc.
      - Interface API compatible OpenAI
      - Prise en charge multi-modèles avec capacités thinking/vision
    
    **Outils et intégrations MCP**
    - Recherche et récupération
      - Recherche web via Tavily, Brave Search et plus
      - Crawling avec Jina
      - Extraction avancée de contenu
    - Intégration MCP transparente
      - Étend les capacités pour l'accès à des domaines privés, knowledge graph, navigation web, etc.
      - Facilite l'intégration de divers outils et méthodologies de recherche
    
    **Collaboration humaine**
    - Human-in-the-loop
      - Prend en charge la modification interactive des plans de recherche en langage naturel
      - Prend en charge l'acceptation automatique des plans de recherche
    - Post-édition des rapports
      - Prend en charge l'édition par blocs façon Notion
      - Permet des raffinements IA, y compris polissage assisté, raccourcissement et expansion de phrases
      - Propulsé par tiptap
    
    **Création de contenu**
    - Workflows basés sur les skills
      - Rapports de recherche, diapositives, pages web et génération d'images
      - Skills personnalisées pour des workflows spécialisés
      - Génération de scripts de podcast et synthèse audio
  upgradeDescription: |
    **ENABLE_SANDBOX** pull DinD asynchrone (chart 1.0.8).
    
    - Suppression de `init-prefetch-sandbox` bloquant ; la gateway démarre dès que dockerd est prêt
    - DinD tire `SANDBOX_IMAGE` en arrière-plan (retries indéfinis) ; les autres fonctionnalités fonctionnent entre-temps
    - Les outils sandbox deviennent disponibles une fois l'image arrivée dans `appData/docker`
    - `ENABLE_SANDBOX=false` ignore DinD et utilise LocalSandbox + `allow_host_bash`

metadata:
  title: DeerFlow 2.0
  description: Un harness open-source di super agent per la deep research
spec:
  fullDescription: |
    DeerFlow 2.0 (Deep Exploration and Efficient Research Flow) è un harness open-source di super agent che coordina sub-agent, memoria e sandbox per compiti IA complessi. Basato su LangGraph e LangChain, è una riscrittura da zero del framework DeerFlow originale.
    
    **Funzioni principali**
    **Capacità di base**
    - Super Agent Harness
      - Coordina sub-agent per l'esecuzione parallela dei compiti
      - Esecuzione di codice basata su sandbox (container AIO via DinD di default; immagine configurabile con SANDBOX_IMAGE)
      - Memoria a lungo termine persistente tra le conversazioni
      - Sistema di skill estensibile (workflow basati su Markdown)
    - Integrazione LLM
      - Supporta l'integrazione della maggior parte dei modelli tramite litellm e LangChain
      - Supporto per modelli open source come Qwen, DeepSeek, ecc.
      - Interfaccia API compatibile OpenAI
      - Supporto multi-modello con capacità thinking/vision
    
    **Tool e integrazioni MCP**
    - Ricerca e retrieval
      - Ricerca web via Tavily, Brave Search e altro
      - Crawling con Jina
      - Estrazione avanzata dei contenuti
    - Integrazione MCP senza soluzione di continuità
      - Espande le capacità per accesso a domini privati, knowledge graph, browsing web e altro
      - Facilita l'integrazione di diversi strumenti e metodologie di ricerca
    
    **Collaborazione umana**
    - Human-in-the-loop
      - Supporta la modifica interattiva dei piani di ricerca in linguaggio naturale
      - Supporta l'auto-accettazione dei piani di ricerca
    - Post-editing dei report
      - Supporta editing a blocchi simile a Notion
      - Consente raffinamenti IA, incluso polishing assistito, accorciamento ed espansione delle frasi
      - Basato su tiptap
    
    **Creazione di contenuti**
    - Workflow basati su skill
      - Report di ricerca, slide, pagine web e generazione di immagini
      - Skill personalizzate per workflow specializzati
      - Generazione di script podcast e sintesi audio
  upgradeDescription: |
    **ENABLE_SANDBOX** pull DinD asincrono (chart 1.0.8).
    
    - Rimosso `init-prefetch-sandbox` bloccante; il gateway parte non appena dockerd è pronto
    - DinD scarica `SANDBOX_IMAGE` in background (retry indefiniti); le altre funzioni funzionano nel frattempo
    - Gli strumenti sandbox diventano disponibili dopo che l'immagine arriva in `appData/docker`
    - `ENABLE_SANDBOX=false` salta DinD e usa LocalSandbox + `allow_host_bash`

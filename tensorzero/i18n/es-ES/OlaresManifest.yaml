metadata:
  title: TensorZero
  description: Una plataforma LLMOps de código abierto
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 corrige una vulnerabilidad de alto riesgo en la puerta de enlace.

    [Notas de la versión](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero es una plataforma LLMOps de código abierto que unifica:

    - **Puerta de enlace:** acceder a todos los proveedores de LLM mediante una API unificada, diseñada para ofrecer rendimiento (latencia p99 <1ms)
    - **Observabilidad:** almacenar inferencias y comentarios en tu base de datos, accesibles mediante código o desde la interfaz
    - **Evaluación:** medir el rendimiento de inferencias individuales o flujos de trabajo de principio a fin mediante heurísticas, jueces LLM, etc.
    - **Optimización:** recopilar métricas y comentarios humanos para optimizar prompts, modelos y estrategias de inferencia
    - **Experimentación:** publicar con confianza gracias a pruebas A/B, enrutamiento, mecanismos de respaldo, reintentos y otras funciones integradas

    [Documentación](https://www.tensorzero.com/docs)

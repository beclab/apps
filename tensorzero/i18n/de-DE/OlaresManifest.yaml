metadata:
  title: TensorZero
  description: Eine Open-Source-LLMOps-Plattform
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 behebt eine Sicherheitslücke mit hohem Risiko im Gateway.

    [Versionshinweise](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero ist eine Open-Source-LLMOps-Plattform, die Folgendes vereint:

    - **Gateway:** über eine einheitliche API auf alle LLM-Anbieter zugreifen, auf Leistung ausgelegt (<1ms p99-Latenz)
    - **Observability:** Inferenzen und Feedback in der eigenen Datenbank speichern, programmatisch oder über die UI zugänglich
    - **Evaluation:** einzelne Inferenzen oder End-to-End-Workflows mit Heuristiken, LLM-Judges usw. vergleichen
    - **Optimierung:** Metriken und menschliches Feedback sammeln, um Prompts, Modelle und Inferenzstrategien zu optimieren
    - **Experimente:** mit integrierten A/B-Tests, Routing, Fallbacks, Wiederholungsversuchen usw. sicher ausliefern

    [Dokumentation](https://www.tensorzero.com/docs)

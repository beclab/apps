metadata:
  title: TensorZero
  description: Una piattaforma LLMOps open source
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 corregge una vulnerabilità ad alto rischio nel gateway.

    [Note di rilascio](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero è una piattaforma LLMOps open source che riunisce:

    - **Gateway:** accedere a tutti i fornitori di LLM tramite un’API unificata, progettata per le prestazioni (latenza p99 <1ms)
    - **Osservabilità:** archiviare inferenze e feedback nel proprio database, accessibili tramite codice o interfaccia
    - **Valutazione:** misurare le prestazioni di singole inferenze o flussi di lavoro end-to-end usando euristiche, LLM come giudici, ecc.
    - **Ottimizzazione:** raccogliere metriche e feedback umano per ottimizzare prompt, modelli e strategie di inferenza
    - **Sperimentazione:** rilasciare con fiducia grazie a test A/B, instradamento, fallback, nuovi tentativi e altre funzionalità integrate

    [Documentazione](https://www.tensorzero.com/docs)

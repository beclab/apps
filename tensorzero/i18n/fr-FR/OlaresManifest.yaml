metadata:
  title: TensorZero
  description: Une plateforme LLMOps open source
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 corrige une vulnérabilité à haut risque dans la passerelle.

    [Notes de version](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero est une plateforme LLMOps open source qui réunit :

    - **Passerelle :** accéder à tous les fournisseurs de LLM via une API unifiée, conçue pour la performance (latence p99 <1ms)
    - **Observabilité :** stocker les inférences et les retours dans votre base de données, accessibles par programmation ou dans l’interface
    - **Évaluation :** évaluer les performances des inférences individuelles ou des workflows de bout en bout à l’aide d’heuristiques, de juges LLM, etc.
    - **Optimisation :** collecter des métriques et des retours humains pour optimiser les prompts, les modèles et les stratégies d’inférence
    - **Expérimentation :** déployer en toute confiance grâce aux tests A/B, au routage, aux mécanismes de repli, aux nouvelles tentatives et à d’autres fonctions intégrées

    [Documentation](https://www.tensorzero.com/docs)

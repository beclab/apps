metadata:
  title: TensorZero
  description: Stack open source pour applications LLM de niveau industriel
spec:
  upgradeDescription: |
    Upgrade TensorZero to 2026.6.0 (`tensorzero/gateway:2026.6.0`, `tensorzero/ui:2026.6.0`).

    Review TensorZero release notes for gateway/UI compatibility and config changes before upgrading production traffic.

    Release notes: https://github.com/tensorzero/tensorzero/releases
  fullDescription: |
    TensorZero est un stack open source pour applications LLM de niveau industriel. Il unifie une passerelle LLM, l'observabilité, l'optimisation, l'évaluation et l'expérimentation.

    - Gateway : accès à chaque fournisseur LLM via une API unifiée, conçu pour la performance (<1ms de latence p99)
    - Observabilité : stocke les inférences et le feedback dans votre base de données, disponibles par programmation ou dans l'UI
    - Optimisation : collecte des métriques et du feedback humain pour optimiser prompts, modèles et stratégies d'inférence
    - Évaluation : compare des inférences individuelles ou des workflows de bout en bout avec des heuristiques, des juges LLM, etc.
    - Expérimentation : déployez en confiance avec A/B testing, routage, fallbacks, retries, etc. intégrés

    **Fonctionnalités**
    - LLM Gateway : intégrez TensorZero une fois et accédez à chaque grand fournisseur LLM.
    - LLM Observability : déboguez des appels API individuels ou surveillez les métriques sur les modèles et prompts �?le tout avec l'UI open source TensorZero.
    - LLM Optimization : envoyez des métriques de production et du feedback humain pour optimiser prompts, modèles et stratégies �?via l'UI ou par programmation.
    - LLM Evaluation : comparez prompts, modèles et stratégies avec des évaluations basées sur des heuristiques et des juges LLM.
    - LLM Experimentation : déployez en confiance avec A/B testing, routage, fallbacks, retries, etc.
    - et plus : construisez avec un stack open source adapté aux prototypes mais conçu dès le départ pour les applications LLM les plus complexes.

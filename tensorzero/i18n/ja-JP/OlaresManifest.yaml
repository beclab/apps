metadata:
  title: TensorZero
  description: オープンソースのLLMOpsプラットフォーム
spec:
  upgradeDescription: |
    TensorZero 2026.6.0では、ゲートウェイの高リスクな脆弱性が修正されています。

    [リリースノート](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZeroは、以下の機能を統合したオープンソースのLLMOpsプラットフォームです。

    - **ゲートウェイ：**統一APIですべてのLLMプロバイダーにアクセスし、パフォーマンスを重視した設計（p99レイテンシ<1ms）
    - **可観測性：**推論とフィードバックを自分のデータベースに保存し、プログラムまたはUIから利用可能
    - **評価：**ヒューリスティクスやLLMによる評価などで、個々の推論やエンドツーエンドのワークフローをベンチマーク
    - **最適化：**指標と人によるフィードバックを収集し、プロンプト、モデル、推論戦略を最適化
    - **実験：**組み込みのA/Bテスト、ルーティング、フォールバック、再試行などで、自信を持ってリリース

    [ドキュメント](https://www.tensorzero.com/docs)

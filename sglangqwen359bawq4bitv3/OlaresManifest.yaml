  versionName: 'cyankiwi/Qwen3.5-9B-AWQ-4bit'
  upgradeDescription: |
    v1.0.23: Model Console upgrades to llm-init v1.7.19.

    v1.0.22: Persist the JIT caches and skip the HuggingFace Hub at startup. `SGLANG_JIT_CACHE_ROOT` is not a variable SGLang reads, so the Triton kernel builds landed on the container's overlay layer and were lost on every restart; renamed to `SGLANG_CACHE_DIR`, which `TRITON_CACHE_DIR` and the deep_gemm / JIT caches all derive from. Also added `HF_HUB_OFFLINE=1`. Startup 268s → 168s on olarestest01.

    v1.0.20: bump SGLang from v0.5.17-cu130 to v0.5.18-cu130.

    **What's Changed** (v0.5.17 → v0.5.18)
    - New models: Muse Glimmer, Intern-S2-Mobius, SANA-Video, LingBot-Video-MoE, LTX-2.5, Cosmos3, LongCat-Image, plus Qwen3.8 / Ling-3.0 / Nemotron 3.5 Lightning recipes
    - Faster startup: overlapped checkpoint staging, up to 2.38x faster model load via `--startup-weight-load-mode overlap`
    - Throughput: TP LMHead all-to-all for pure-DP dp-attention, FlashInfer MNNVL pure allreduce, Kimi K3 MLA kernels tuned for MI355X
    - Quantization: NVFP4 checkpoints run on AMD via `--quantization quark_mxfp4`
    - Dependencies: torch 2.13.0 with triton 3.7.1, flashinfer 0.6.17, sgl-kernel 0.4.6.post1
    - Breaking: compiled-kernel caches move under `SGLANG_CACHE_DIR` (one extra recompile on first launch); torchao integration removed

    For detailed release notes, visit:
    https://github.com/sgl-project/sglang/releases

    v1.0.15: Lower the NVIDIA host-memory reservation so 1.12.6 timeslice nodes can install more easily (engine request 21Gi→6Gi, chart requiredMemory 22Gi→7Gi). GPU quota unchanged.

    v1.0.11: bump SGLang from v0.5.14-cu130 to v0.5.17-cu130.

    **What's Changed** (v0.5.14 → v0.5.17)
    - New models: Kimi K3, MiniMax-H3, Inkling, GLM-5.2, LiquidAI LFM2.5, Kimi-K2.7-Code, LongCat 2.0, EmbeddingGemma, Hunyuan 3, Qwen3.6 NVFP4, and more
    - DeepSeek-V4: GB300 day-0 serving, NVFP4 MoE, MegaMoE, sparse-prefill / indexer opts, Waterfill & LPLB MoE load balancing
    - Speculative decoding: Spec V2 by default, DSpark, IndexShare MTP, ReplaySSM Ring Spec-Verify
    - Parallelism & cache: DCP A2A backends, DWDP MoE prefill, decode CP for MLA, UnifiedRadixTree default, session-aware radix cache, faster engine recovery
    - Kernels & runtime: Breakable CUDA Graph default, KDA/GDN linear-attention on Blackwell, initial Rust frontend, native Exa web_search
    - Breaking: QServe/FBGEMM FP8 removed; NVFP4 GEMM requires FlashInfer

    For detailed release notes, visit:
    https://github.com/sgl-project/sglang/releases

    v1.0.10: bump llm-init to v1.3.5.
    v1.0.8: SGLANG_MEMORY_LIMIT 30Gi; llm-init limit 2Gi; limitedMemory 32Gi (30+2).
    v1.0.7: nvidia host memory — requiredMemory 22Gi, SGLANG_MEMORY_REQUEST 21Gi, SGLANG_MEMORY_LIMIT 26Gi, limitedMemory 30Gi.
    v1.0.6: nvidia host memory — requiredMemory 16Gi, SGLANG_MEMORY_REQUEST 15Gi, SGLANG_MEMORY_LIMIT 19Gi, limitedMemory 26Gi.
    v1.0.5: bump llm-init to v1.3.1.
  fullDescription: |
    **Model Overview**
    Qwen3.5-9B is a dense vision-language model from the Qwen series (Alibaba). It supports thinking, tool calling, and vision in a compact 9B footprint. This app serves the `AWQ-4bit` quantized weights from `cyankiwi/Qwen3.5-9B-AWQ-4bit` via SGLang.

    A practical choice when you need a capable multimodal model with lower resource requirements. Qwen3.5 models support thinking, tools, and vision for chat and agent workflows.

    **Preset Configuration**
    - Model: `cyankiwi/Qwen3.5-9B-AWQ-4bit`
    - Capabilities: thinking, tools, vision
    - Engine args: `--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser qwen3 --tool-call-parser qwen3_coder`
    - Required GPU memory: `23Gi`
    - SGLang excels at prefix caching and structured output (JSON, tool calls, agents); prefix caching is enabled by default.


    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Uses `23Gi` GPU memory; tune `--mem-fraction-static` in ENGINE_ARGS  |
    | `nvidia-gb10`  | GPU (Spark)       | Same as `nvidia`: `23Gi` memory, managed by the pod                  |
    
    **How It Works**
    First, Model Console downloads the model and gets it ready, then SGLang starts serving the model when it's ready. These two parts run in separate Deployments, sharing the HF cache via App Common and transient run-state via App Cache.

    **Stack**
    - **SGLang** (port 30000): runs the model and serves API requests
    - **Model Console** (port 8090): downloads the model, shows progress, and provides the OpenAI API, proxying to SGLang

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.


  developer: Alibaba
  website: https://qwen.ai/home
  sourceCode: https://github.com/QwenLM/Qwen3
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  license:
    - text: Apache-2.0
      url: https://huggingface.co/Qwen/Qwen3.5-9B

  accelerator:
    #   nvidia       — discrete GPU; SGLANG_REQUIRED_GPU_MEMORY -> gpumem
    #   nvidia-gb10  — DGX Spark unified memory; same env -> pod memory
    - mode: nvidia
      limitedCpu: "15360m"
      requiredCpu: "1400m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      # Engine MEMORY_REQUEST 6Gi + llm-init <= requiredMemory 7Gi; MEMORY_LIMIT 30Gi + llm-init 2Gi <= limitedMemory 32Gi
      limitedMemory: "32Gi"
      requiredMemory: "7Gi"
      requiredGPUMemory: "23Gi"
      limitedGPUMemory: "24Gi"
    - mode: nvidia-gb10
      limitedCpu: "15360m"
      requiredCpu: "1400m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "48Gi"
      requiredMemory: "32Gi"

  supportArch:
    - amd64
    - arm64
permission:
  appCache: true
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  # Model is preset for this app; these values are fixed and not user-editable.
  - envName: MODEL_SOURCE        # example: hf://openai/gpt-oss-20b
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://cyankiwi/Qwen3.5-9B-AWQ-4bit"
    description: "Example: hf://openai/gpt-oss-20b. The HuggingFace source to download your model. Use a repo with `.safetensors` weights. Optionally append `--include <file>` or `--revision <sha>`."
    regex: "^hf://"
  - envName: MODEL_NAME          # example: openai/gpt-oss-20b
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "cyankiwi/Qwen3.5-9B-AWQ-4bit"
    description: "Example: openai/gpt-oss-20b. The name of your model — use the string after `hf://` in MODEL_SOURCE. This is also used as the OpenAI alias and SGLang `--model-path`."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "thinking,tools,vision"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "The model capabilities. Pick what your model supports. If no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # example: --context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss
    required: true
    default: "--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser qwen3 --tool-call-parser qwen3_coder"
    type: string
    editable: true
    applyOnChange: true
    description: "Example: --context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser gpt-oss --tool-call-parser gpt-oss. Extra SGLang CLI flags. Separate multiple --key value pairs with spaces. Adjust parsers to match your model family."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: SGLANG_CPU_REQUEST    # default: 1150m
    required: true
    default: "1150m"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_MEMORY_REQUEST # sum with llm-init <= requiredMemory 7Gi
    required: true
    default: "6Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_MEMORY_LIMIT # 30Gi + llm-init 2Gi <= limitedMemory 32Gi
    required: true
    default: "30Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: SGLANG_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "23Gi"
    description: "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB. On Spark it sets pod memory."
    regex: "^[0-9]+(Gi|Mi)?$"

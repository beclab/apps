# Engine wrapper script, mounted into the SGLang (engine) container at
# /llm-init/wrappers. Sources the helpers llm-init publishes into RUN_DIR and
# runs SGLang under supervise_engine, so Model Console can relaunch the engine
# with updated model-card engine_args without restarting the Pod.
#
# SGLang's deployment model: llm-init downloads the HF model into the shared
# /cache/hf/hub cache and writes a readiness sentinel under /run/llm-init; the
# engine waits on the sentinel and loads --model-path from MODEL_NAME (the HF
# owner/repo id), resolving against the shared cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-init-wrappers
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: sglang
data:
  sglang.sh: |
    #!/bin/sh
    # SGLang engine wrapper.
    #
    # Waits for llm-init to publish the sentinel, then launches SGLang's
    # OpenAI-compatible server with --model-path set to MODEL_NAME (HF
    # owner/repo); SGLang resolves it against the shared /cache/hf/hub cache.
    #
    # ENGINE_ARGS contract (docs/engine-args.md): a cmdline-style string in
    # SGLang's native flag syntax, preferring the Model Console model-card
    # handoff at ${RUN_DIR}/engine_args over the chart env. Shell-word-split
    # and appended after the --model-path / --served-model-name / --host /
    # --port baseline. Example:
    #   ENGINE_ARGS="--context-length 8192 --mem-fraction-static 0.8"
    #
    # --enable-metrics is set before ENGINE_ARGS so /api/diag/gpu can read
    # sglang:kv_cache_usage_perc; operators may override via ENGINE_ARGS.
    set -eu

    ENGINE=sglang
    # Source the shared helpers llm-init publishes into RUN_DIR. That copy can
    # arrive late - the two containers are separate Deployments with no ordering
    # between them - so waiting here is the normal path.
    WRAPPER_COMMON=${WRAPPER_COMMON:-"$(dirname "$0")/common.sh"}
    _wc=0
    while [ ! -f "$WRAPPER_COMMON" ] && [ "$_wc" -lt "${WRAPPER_COMMON_WAIT:-3600}" ]; do
        printf '[wrapper] waiting for %s (elapsed=%ss)\n' "$WRAPPER_COMMON" "$_wc"
        sleep 5
        _wc=$((_wc + 5))
    done
    [ -f "$WRAPPER_COMMON" ] || { printf '[wrapper] %s never appeared\n' "$WRAPPER_COMMON" >&2; exit 1; }
    unset _wc
    . "$WRAPPER_COMMON"

    looks_like_hf_repo_id() {
        s=$1
        case "$s" in
            ""|/*|./*|*://*) return 1 ;;
        esac
        case "$s" in
            */*)
                rest=${s#*/}
                case "$rest" in
                    */*|*:*) return 1 ;;
                esac
                return 0
                ;;
            *) return 1 ;;
        esac
    }

    wait_for_sentinel
    wait_for_engine_args_handoff

    if ! looks_like_hf_repo_id "${MODEL_NAME:-}"; then
        log "MODEL_NAME must be owner/repo for --model-path (got ${MODEL_NAME:-<empty>})"
        exit 1
    fi

    run_sglang() {
        load_engine_args_from_handoff
        log "starting SGLang with model-path=$MODEL_NAME args=${ENGINE_ARGS:-<empty>}"
        # shellcheck disable=SC2086  # intentional word-splitting of ENGINE_ARGS
        exec python3 -m sglang.launch_server \
            --model-path "$MODEL_NAME" \
            --served-model-name "$MODEL_NAME" \
            --host 0.0.0.0 \
            --port "${SGLANG_PORT:-30000}" \
            --enable-metrics \
            ${ENGINE_ARGS:-} \
            "$@"
    }

    supervise_engine run_sglang "$@"

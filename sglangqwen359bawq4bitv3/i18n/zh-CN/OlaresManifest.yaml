metadata:
  description: "使用 SGLang 运行 Qwen3.5-9B（AWQ-4bit）模型。"
  title: Qwen3.5-9B (SGLang)

spec:
  upgradeDescription: |
    v1.0.23: Model Console 升级到 llm-init v1.7.19。

    v1.0.20: 将 SGLang 从 v0.5.17-cu130 升级到 v0.5.18-cu130。

    **更新内容**（v0.5.17 → v0.5.18）
    - 新模型：Muse Glimmer、Intern-S2-Mobius、SANA-Video、LingBot-Video-MoE、LTX-2.5、Cosmos3、LongCat-Image，以及 Qwen3.8 / Ling-3.0 / Nemotron 3.5 Lightning 等配方
    - 启动更快：权重加载与 CUDA graph 捕获重叠，`--startup-weight-load-mode overlap` 最高可将模型加载提速 2.38 倍
    - 吞吐：pure-DP dp-attention 的 TP LMHead 改为 all-to-all，FlashInfer MNNVL 纯 allreduce，Kimi K3 MLA 内核针对 MI355X 调优
    - 量化：通过 `--quantization quark_mxfp4` 在 AMD 上运行 NVFP4 权重
    - 依赖：torch 2.13.0 + triton 3.7.1、flashinfer 0.6.17、sgl-kernel 0.4.6.post1
    - Breaking：编译内核缓存统一迁移到 `SGLANG_CACHE_DIR`（升级后首次启动会多编译一次）；移除 torchao 集成

    详细发布说明请见：
    https://github.com/sgl-project/sglang/releases

    v1.0.15: 下调 NVIDIA 主机内存预留，方便 1.12.6 时间分片节点安装（引擎 request 21Gi→6Gi，应用 requiredMemory 22Gi→7Gi）。显存配额不变。

    v1.0.11: bump SGLang from v0.5.14-cu130 to v0.5.17-cu130.

    **What's Changed** (v0.5.14 → v0.5.17)
    - New models: Kimi K3, MiniMax-H3, Inkling, GLM-5.2, LiquidAI LFM2.5, Kimi-K2.7-Code, LongCat 2.0, EmbeddingGemma, Hunyuan 3, Qwen3.6 NVFP4, and more
    - DeepSeek-V4: GB300 day-0 serving, NVFP4 MoE, MegaMoE, sparse-prefill / indexer opts, Waterfill & LPLB MoE load balancing
    - Speculative decoding: Spec V2 by default, DSpark, IndexShare MTP, ReplaySSM Ring Spec-Verify
    - Parallelism & cache: DCP A2A backends, DWDP MoE prefill, decode CP for MLA, UnifiedRadixTree default, session-aware radix cache, faster engine recovery
    - Kernels & runtime: Breakable CUDA Graph default, KDA/GDN linear-attention on Blackwell, initial Rust frontend, native Exa web_search
    - Breaking: QServe/FBGEMM FP8 removed; NVFP4 GEMM requires FlashInfer

    For detailed release notes, visit:
    https://github.com/sgl-project/sglang/releases

    v1.0.10: bump llm-init to v1.3.5.
    v1.0.8: SGLANG_MEMORY_LIMIT 30Gi; llm-init limit 2Gi; limitedMemory 32Gi (30+2).
    v1.0.7: nvidia host memory — requiredMemory 22Gi, SGLANG_MEMORY_REQUEST 21Gi, SGLANG_MEMORY_LIMIT 26Gi, limitedMemory 30Gi.
    v1.0.6: nvidia host memory — requiredMemory 16Gi, SGLANG_MEMORY_REQUEST 15Gi, SGLANG_MEMORY_LIMIT 19Gi, limitedMemory 26Gi.
    v1.0.5: bump llm-init to v1.3.1.
  fullDescription: |
    **模型简介**
    Qwen3.5-9B 是阿里巴巴 Qwen 系列的稠密视觉语言模型，在 9B 体量下支持思考、工具调用与视觉能力。本应用通过 SGLang 运行 `cyankiwi/Qwen3.5-9B-AWQ-4bit` 的 `AWQ-4bit` 量化权重。

    适合在较低资源占用下获得较强多模态能力的场景。Qwen3.5 模型支持思考、工具与视觉，可用于对话与智能体工作流。

    **预设配置**
    - 模型：`cyankiwi/Qwen3.5-9B-AWQ-4bit`
    - 能力：思考、工具、视觉
    - 引擎参数：`--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser qwen3 --tool-call-parser qwen3_coder`
    - 所需显存：`23Gi`
    - SGLang 擅长前缀缓存与结构化输出（JSON、工具调用、智能体），因此默认启用前缀缓存。

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 使用 `23Gi` 显存；在 ENGINE_ARGS 中调节 `--mem-fraction-static` |
    | `nvidia-gb10`  | GPU (Spark)      | 与 `nvidia` 相同：`23Gi` 显存，由 pod 管理                    |
    
    **工作流程说明**
    首先，Model Console 下载并准备模型，然后 SGLang 在模型准备好后启动服务。两个部分运行在不同 Deployment 中，但通过 App Common 存储共享 HF 缓存与运行状态。

    **技术栈说明**
    - **SGLang**（30000 端口）：运行模型并通过 API 提供服务
    - **Model Console**（8090 端口）：下载模型、展示进度，并通过 OpenAI API 代理到 SGLang

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。


olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  appsmith: 1
  appsmith-redis: 1
metadata:
  name: appsmith
  description: Platform to build admin panels, internal tools, and dashboards
  icon: https://app.cdn.olares.com/appstore/appsmith/icon.png
  appid: appsmith
  version: '1.0.17'
  title: Appsmith
  categories:
  - Developer Tools
  - workspace
  - developer
  tags:
  - low-code

permission:
  appData: true
  appCache: true
  userData:
    - Home
spec:
  runAsUser: true
  versionName: '2.5.1'
  upgradeDescription: |
    Highlights across this upgrade:
    - MCP structured SQL queries can skip empty filters and use list-valued PostgreSQL filters; the editor recognizes worker APIs such as Blob, File and FormData.
    - Improves country/flag selection in phone fields and consistently marks required fields in legacy widgets.

    Upgrade Appsmith EE to 2.5.1.
    PostgreSQL 14.23 remains within the same pod as a non-root companion, preserving existing loopback connections and cluster data. The original PostgreSQL cluster remains available on local connections.
    Preserve encryption secrets and migrate legacy stacks to a UID 1000-owned directory after a verified backup. Keep the original directory and backup; do not recursively change ownership.
    Incompatible organization cache entries are archived with their values preserved.
    Before upgrading, create a verified database backup. Customized docker.env must contain resolved literal values; move JVM shell expressions to container environment configuration. The candidate stops on invalid configuration.
    Appsmith AI reached end of life on September 30, 2026. Migrate existing Appsmith AI queries to a direct provider datasource.
    Release notes: https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1
  featuredImage: https://app.cdn.olares.com/appstore/appsmith/1.jpg
  promoteImage:
  - https://app.cdn.olares.com/appstore/appsmith/1.jpg
  - https://app.cdn.olares.com/appstore/appsmith/2.jpg
  - https://app.cdn.olares.com/appstore/appsmith/3.jpg
  - https://app.cdn.olares.com/appstore/appsmith/4.jpg  
  fullDescription: |
    Appsmith is an open-source tool that enables the rapid development of internal apps. You can drag and drop pre-built widgets to build UI. Connect securely to your databases & APIs using its datasources. Write business logic to read & write data using queries & JavaScript.

    Thousands of teams use the Appsmith low-code application platform to quickly build, deploy, and manage effective software with enterprise-grade security and governance.

    **Why Appsmith**
    Appsmith makes it easy to build a UI that talks to any datasource. You can create anything from simple CRUD apps to complicated multi-step workflows with a few simple steps:

    Connect Datasource
    Integrate with a database or API. Appsmith supports the most popular databases and REST APIs.

    Build UI
    Use built-in widgets to build your app layout.

    Write Logic
    Express your business logic using queries and JavaScript anywhere in the editor.

    Collaborate, Deploy, Share
    Appsmith supports version control using Git to build apps in collaboration using branches to track and roll back changes. Deploy the app and share it with other users.
  developer: Appsmith, Inc
  website: https://www.appsmith.com/
  sourceCode: https://github.com/appsmithorg/appsmith
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  requiredMemory: 4Gi
  limitedMemory: 8Gi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  requiredCpu: 2.5
  limitedCpu: 4
  doc: https://docs.appsmith.com/
  license:
  - text: Apache-2.0
    url: https://github.com/appsmithorg/appsmith?tab=Apache-2.0-1-ov-file#readme
  supportArch:
    - amd64
    - arm64
options:
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
entrances:

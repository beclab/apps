metadata:
  title: Appsmith
  description: Platform to build admin panels, internal tools, and dashboards
spec:
  fullDescription: |
    Appsmith is an open-source tool that enables the rapid development of internal apps. You can drag and drop pre-built widgets to build UI. Connect securely to your databases & APIs using its datasources. Write business logic to read & write data using queries & JavaScript.

    Thousands of teams use the Appsmith low-code application platform to quickly build, deploy, and manage effective software with enterprise-grade security and governance.

    **Why Appsmith**
    Appsmith makes it easy to build a UI that talks to any datasource. You can create anything from simple CRUD apps to complicated multi-step workflows with a few simple steps:

    Connect Datasource
    Integrate with a database or API. Appsmith supports the most popular databases and REST APIs.

    Build UI
    Use built-in widgets to build your app layout.
    
    Write Logic
    Express your business logic using queries and JavaScript anywhere in the editor.

    Collaborate, Deploy, Share
    Appsmith supports version control using Git to build apps in collaboration using branches to track and roll back changes. Deploy the app and share it with other users.

  upgradeDescription: |
    Highlights across this upgrade:
    - MCP structured SQL queries can skip empty filters and use list-valued PostgreSQL filters; the editor recognizes worker APIs such as Blob, File and FormData.
    - Improves country/flag selection in phone fields and consistently marks required fields in legacy widgets.

    Upgrade Appsmith EE to 2.5.1.

    Back up MongoDB, PostgreSQL, configuration and files before upgrading. Preserve encryption secrets and migrate existing stacks to a UID 1000-owned directory while retaining the original directory and verified backup.

    Retain PostgreSQL 14.23 in a non-root companion within the same pod, preserving existing local data and connections. Archive incompatible organization cache entries without deleting their contents.

    Customized docker.env must contain resolved literal values. Move shell expressions and JVM options to container environment configuration. Appsmith AI reached end of life on September 30, 2026; migrate those queries to a direct provider datasource.

    https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1

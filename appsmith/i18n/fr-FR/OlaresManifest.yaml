metadata:
  title: Appsmith
  description: Plateforme pour créer des panneaux d'administration, des outils internes et des tableaux de bord
spec:
  fullDescription: |
    Appsmith est un outil open source qui permet le développement rapide d'applications internes. Vous pouvez glisser-déposer des widgets préconstruits pour créer l'UI. Connectez-vous en toute sécurité à vos bases de données et API via ses datasources. Écrivez la logique métier pour lire et écrire des données à l'aide de requêtes et de JavaScript.

    Des milliers d'équipes utilisent la plateforme d'applications low-code Appsmith pour construire, déployer et gérer rapidement des logiciels efficaces avec une sécurité et une gouvernance de niveau entreprise.

    **Pourquoi Appsmith**
    Appsmith facilite la création d'une UI qui dialogue avec n'importe quelle datasource. Vous pouvez créer aussi bien de simples apps CRUD que des workflows multi-étapes complexes en quelques étapes simples :

    Connecter une datasource
    Intégrez une base de données ou une API. Appsmith prend en charge les bases de données et API REST les plus populaires.

    Construire l'UI
    Utilisez les widgets intégrés pour construire la mise en page de votre app.

    Écrire la logique
    Exprimez votre logique métier à l'aide de requêtes et de JavaScript n'importe où dans l'éditeur.

    Collaborer, déployer, partager
    Appsmith prend en charge le contrôle de version avec Git pour construire des apps en collaboration à l'aide de branches afin de suivre et d'annuler les modifications. Déployez l'app et partagez-la avec d'autres utilisateurs.

  upgradeDescription: |
    Nouveautés de cette mise à niveau entre versions :
    - Les requêtes SQL structurées MCP peuvent ignorer les filtres vides et utiliser des filtres de listes PostgreSQL ; l’éditeur reconnaît les API de workers comme Blob, File et FormData.
    - Améliore le choix du pays et du drapeau dans les champs téléphoniques et uniformise les indications de champs obligatoires des anciens widgets.

    Mettre Appsmith EE à jour vers 2.5.1.

    Sauvegarder MongoDB, PostgreSQL, la configuration et les fichiers. Conserver les clés de chiffrement et migrer stacks vers un répertoire UID 1000, en gardant l’original et la sauvegarde vérifiée.

    Conserver PostgreSQL 14.23 dans un conteneur non root du même Pod, avec les données et connexions locales. Archiver les caches d’organisation incompatibles sans supprimer leurs valeurs.

    docker.env doit contenir des valeurs littérales résolues. Déplacer expressions Shell et options JVM dans l’environnement du conteneur. Appsmith AI a cessé le 30 septembre 2026 ; migrer les requêtes vers des fournisseurs directs.

    https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1

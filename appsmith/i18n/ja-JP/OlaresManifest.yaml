metadata:
  title: Appsmith
  description: 管理パネル、内部ツール、ダッシュボードを構築するプラットフォーム
spec:
  fullDescription: |
    Appsmith は、社内アプリの迅速な開発を可能にするオープンソースツールです。事前構築ウィジェットをドラッグ＆ドロップして UI を構築できます。データソース経由でデータベースや API に安全に接続します。クエリと JavaScript でビジネスロジックを書き、データを読み書きします。

    数千のチームが Appsmith ローコードアプリケーションプラットフォームを使い、エンタープライズ級のセキュリティとガバナンスを備えた効果的なソフトウェアを迅速に構築・デプロイ・管理しています。

    **Appsmith を選ぶ理由**
    Appsmith なら、あらゆるデータソースと対話する UI を簡単に構築できます。シンプルな CRUD アプリから複雑な多段階ワークフローまで、わずかな手順で作成できます：

    データソースを接続
    データベースまたは API と統合。Appsmith は主要なデータベースと REST API をサポートします。

    UI を構築
    組み込みウィジェットでアプリのレイアウトを組み立てます。

    ロジックを記述
    エディタ内のどこでもクエリと JavaScript でビジネスロジックを表現します。

    共同作業、デプロイ、共有
    Appsmith は Git によるバージョン管理をサポートし、ブランチで変更を追跡・ロールバックしながら共同でアプリを構築できます。アプリをデプロイして他のユーザーと共有します。

  upgradeDescription: |
    今回の複数バージョンにわたる更新の主な変更：
    - MCP の構造化 SQL クエリで空のフィルターを省略し、PostgreSQL のリスト値フィルターを利用可能。エディターは Blob・File・FormData などの Worker API を認識。
    - 電話番号フィールドの国・国旗選択と、従来ウィジェットの必須項目表示を改善。

    Appsmith EE 2.5.1 に更新。

    更新前に MongoDB、PostgreSQL、設定とファイルをバックアップしてください。暗号化キーを保持し、旧 stacks を UID 1000 の新しい領域へ移行します。元の領域と検証済みバックアップを残します。

    同じ Pod 内の非 root 補助コンテナで PostgreSQL 14.23 と既存のローカル接続を維持します。互換性のない組織設定キャッシュは削除せず退避します。

    docker.env は解決済みのリテラル値のみ使用可能です。Shell 式と JVM オプションはコンテナ環境設定へ移してください。Appsmith AI は 2026 年 9 月 30 日に終了しました。直接プロバイダーに接続するデータソースへ移行してください。

    https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1

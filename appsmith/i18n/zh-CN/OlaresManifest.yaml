metadata:
  description: 构建管理面板、内部工具和仪表板的平台
  title: Appsmith

spec:
  fullDescription: |
    Appsmith 是一款开源工具，可实现内部应用程序的快速开发。您可以拖放预构建的小部件来构建 UI。使用其数据源安全地连接到您的数据库和 API。编写业务逻辑以使用查询和 JavaScript 读取和写入数据。

    数千个团队使用 Appsmith 低代码应用程序平台快速构建、部署和管理具有企业级安全性和治理的有效软件。

    **为什么选择 Appsmith**
    Appsmith 可以轻松构建与任何数据源对话的 UI。您只需几个简单的步骤即可创建从简单的 CRUD 应用程序到复杂的多步骤工作流的任何内容：

    连接数据源
    与数据库或 API 集成。Appsmith 支持最流行的数据库和 REST API。

    构建 UI
    使用内置小部件构建您的应用程序布局。

    编写逻辑
    在编辑器中的任何位置使用查询和 JavaScript 表达您的业务逻辑。

    协作、部署、共享
    Appsmith 支持使用 Git 进行版本控制，以协作方式构建应用程序，使用分支来跟踪和回滚更改。部署应用程序并与其他用户共享。

  upgradeDescription: |
    本次跨版本升级亮点：
    - MCP 结构化 SQL 查询可跳过空筛选条件，并支持 PostgreSQL 列表筛选；编辑器可识别 Blob、File、FormData 等 Worker API。
    - 改进电话字段的国家与旗帜选择，并统一旧版组件的必填标记。

    升级 Appsmith EE 至 2.5.1。

    升级前备份 MongoDB、PostgreSQL、配置和文件。保留加密密钥，将旧 stacks 迁移到 UID 1000 所有的目录，同时保留原目录和已校验备份。

    以同 Pod 非 root 辅助容器保留 PostgreSQL 14.23，兼容既有本地数据和连接。不兼容的组织配置缓存只归档，不删除原值。

    自定义 docker.env 必须使用已解析的字面值；Shell 表达式和 JVM 参数需移到容器环境配置。Appsmith AI 已于 2026 年 9 月 30 日停止服务，请将相关查询迁往直接连接模型供应商的数据源。

    https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1

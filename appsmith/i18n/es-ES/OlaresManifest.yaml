metadata:
  title: Appsmith
  description: Plataforma para crear paneles de administración, herramientas internas y dashboards
spec:
  fullDescription: |
    Appsmith es una herramienta de código abierto que permite el desarrollo rápido de aplicaciones internas. Puedes arrastrar y soltar widgets preconstruidos para crear la UI. Conéctate de forma segura a tus bases de datos y APIs mediante sus datasources. Escribe lógica de negocio para leer y escribir datos usando consultas y JavaScript.

    Miles de equipos usan la plataforma de aplicaciones low-code Appsmith para construir, desplegar y gestionar rápidamente software eficaz con seguridad y gobernanza de nivel empresarial.

    **Por qué Appsmith**
    Appsmith facilita crear una UI que habla con cualquier datasource. Puedes crear desde apps CRUD simples hasta flujos de trabajo complejos de varios pasos con unos pocos pasos sencillos:

    Conectar datasource
    Intégrate con una base de datos o API. Appsmith admite las bases de datos y APIs REST más populares.

    Construir UI
    Usa widgets integrados para construir el layout de tu app.

    Escribir lógica
    Expresa tu lógica de negocio usando consultas y JavaScript en cualquier parte del editor.

    Colaborar, desplegar, compartir
    Appsmith admite control de versiones con Git para construir apps en colaboración usando ramas para rastrear y revertir cambios. Despliega la app y compártela con otros usuarios.

  upgradeDescription: |
    Novedades de esta actualización entre versiones:
    - Las consultas SQL estructuradas de MCP pueden omitir filtros vacíos y usar filtros de listas en PostgreSQL; el editor reconoce API de workers como Blob, File y FormData.
    - Mejora la selección de país y bandera en campos telefónicos y unifica las marcas de campos obligatorios en widgets antiguos.

    Actualizar Appsmith EE a 2.5.1.

    Guardar copias de MongoDB, PostgreSQL, configuración y archivos. Conservar claves de cifrado y migrar stacks a un directorio UID 1000, manteniendo el original y la copia verificada.

    Mantener PostgreSQL 14.23 sin root en el mismo Pod, conservando datos y conexiones locales. Archivar cachés de organización incompatibles sin borrar sus valores.

    docker.env solo admite valores literales resueltos. Mover expresiones Shell y opciones JVM al entorno del contenedor. Appsmith AI finalizó el 30 de septiembre de 2026; migrar sus consultas a proveedores directos.

    https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1

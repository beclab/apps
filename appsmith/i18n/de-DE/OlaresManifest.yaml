metadata:
  title: Appsmith
  description: Plattform zum Erstellen von Admin-Panels, internen Tools und Dashboards
spec:
  fullDescription: |
    Appsmith ist ein Open-Source-Tool, das die schnelle Entwicklung interner Apps ermöglicht. Sie können vorgefertigte Widgets per Drag-and-Drop ziehen, um die UI zu erstellen. Verbinden Sie sich sicher mit Ihren Datenbanken und APIs über Datasources. Schreiben Sie Geschäftslogik zum Lesen und Schreiben von Daten mit Queries und JavaScript.

    Tausende Teams nutzen die Low-Code-Anwendungsplattform Appsmith, um wirksame Software mit Enterprise-Sicherheit und Governance schnell zu erstellen, bereitzustellen und zu verwalten.

    **Warum Appsmith**
    Appsmith erleichtert den Aufbau einer UI, die mit beliebigen Datasources spricht. Mit wenigen einfachen Schritten können Sie alles von einfachen CRUD-Apps bis zu komplexen mehrstufigen Workflows erstellen:

    Datasource verbinden
    Mit einer Datenbank oder API integrieren. Appsmith unterstützt die gängigsten Datenbanken und REST-APIs.

    UI erstellen
    Mit integrierten Widgets das App-Layout aufbauen.

    Logik schreiben
    Geschäftslogik mit Queries und JavaScript überall im Editor ausdrücken.

    Zusammenarbeiten, bereitstellen, teilen
    Appsmith unterstützt Versionskontrolle mit Git, um Apps kollaborativ mit Branches zu erstellen, Änderungen nachzuverfolgen und zurückzusetzen. Stellen Sie die App bereit und teilen Sie sie mit anderen Nutzern.

  upgradeDescription: |
    Highlights dieses versionsübergreifenden Updates:
    - Strukturierte MCP-SQL-Abfragen können leere Filter überspringen und PostgreSQL-Listenfilter nutzen; der Editor erkennt Worker-APIs wie Blob, File und FormData.
    - Verbessert die Länder- und Flaggenauswahl in Telefonfeldern und kennzeichnet Pflichtfelder älterer Widgets einheitlich.

    Appsmith EE auf 2.5.1 aktualisieren.

    Vorher MongoDB, PostgreSQL, Konfiguration und Dateien sichern. Verschlüsselungsschlüssel erhalten und stacks in ein UID-1000-Verzeichnis migrieren; Original und geprüfte Sicherung behalten.

    PostgreSQL 14.23 läuft ohne root im selben Pod weiter und erhält lokale Daten und Verbindungen. Inkompatible Organisations-Caches werden ohne Datenlöschung archiviert.

    docker.env darf nur aufgelöste Literalwerte enthalten. Shell-Ausdrücke und JVM-Optionen in die Container-Umgebung verschieben. Appsmith AI wurde am 30. September 2026 eingestellt; betroffene Abfragen auf direkte Anbieter-Datenquellen umstellen.

    https://github.com/appsmithorg/appsmith/releases/tag/v2.5.1

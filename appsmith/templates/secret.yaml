{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  APPSMITH_ENCRYPTION_PASSWORD: {{ if $existing }}{{ index $existing.data "APPSMITH_ENCRYPTION_PASSWORD" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  APPSMITH_ENCRYPTION_SALT: {{ if $existing }}{{ index $existing.data "APPSMITH_ENCRYPTION_SALT" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}

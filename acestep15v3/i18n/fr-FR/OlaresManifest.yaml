metadata:
  title: ACE-Step 1.5
  description: Le modèle local de génération musicale le plus puissant, qui surpasse la plupart des alternatives commerciales
spec:
  fullDescription: |
    Nous présentons ACE-Step v1.5, un modèle foundation musical open-source très efficace qui apporte une génération de niveau commercial au matériel grand public. Sur les métriques d'évaluation courantes, ACE-Step v1.5 atteint une qualité supérieure à la plupart des modèles musicaux commerciaux tout en restant extrêmement rapide — moins de 2 secondes par chanson complète sur A100 et moins de 10 secondes sur RTX 3090. Le modèle s'exécute localement avec moins de 4 Go de VRAM et prend en charge une personnalisation légère : les utilisateurs peuvent entraîner un LoRA à partir de quelques chansons pour capturer leur propre style.

    **Fonctionnalités**
    Performances
    - Génération ultra-rapide : moins de 2 s par chanson complète sur A100, moins de 10 s sur RTX 3090 (0,5 s à 10 s sur A100 selon le think mode et les étapes de diffusion)
    - Durée flexible : génération audio de 10 secondes à 10 minutes (600 s)
    - Génération par lots : jusqu'à 8 chansons simultanément

    Qualité de génération
    - Sortie de niveau commercial : qualité supérieure à la plupart des modèles musicaux commerciaux (entre Suno v4.5 et Suno v5)
    - Large prise en charge des styles : plus de 1000 instruments et styles avec description fine du timbre
    - Paroles multilingues : plus de 50 langues avec invite de paroles pour le contrôle de structure et de style

    Polyvalence et contrôle
    - Entrée audio de référence : utilisez un audio de référence pour guider le style de génération
    - Génération de reprises : créez des covers à partir d'un audio existant
    - Peinture et édition : édition et régénération audio locale sélectives
    - Séparation des pistes : séparez l'audio en stems individuels
    - Génération multi-pistes : ajoutez des couches comme la fonction « Add Layer » de Suno Studio
    - Vocal2BGM : génère automatiquement l'accompagnement pour les pistes vocales
    - Contrôle des métadonnées : durée, BPM, tonalité/gamme, signature rythmique
    - Mode simple : générez des chansons complètes à partir de descriptions simples
    - Réécriture de requête : expansion LM automatique des tags et paroles
    - Compréhension audio : extrait BPM, tonalité/gamme, signature rythmique et légende de l'audio
    - Génération LRC : génère automatiquement les horodatages des paroles
    - Entraînement LoRA : annotation et entraînement en un clic dans Gradio. 8 chansons, 1 heure sur 3090 (12 Go VRAM)
    - Notation de qualité : évaluation automatique de la qualité de l'audio généré

    **ACE-Step 1.5 XL (4B DiT)**
    - acestep-v15-xl-base, acestep-v15-xl-sft, acestep-v15-xl-turbo — meilleure qualité audio avec décodeur DiT à 4B paramètres
    - Requiert ≥12 Go VRAM (avec offload) ou ≥20 Go recommandés ; tous les modèles LM restent compatibles

  upgradeDescription: |
    Remplacer l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami `OPENRESTY_CONF_FILE`.

    Mettre à jour l'image llm-init vers `beclab/llm-init:v1.3.1`.

    Mapper HF_TOKEN / HF_ENDPOINT depuis OLARES_SYSTEM_HUGGINGFACE_* (niveau système) et injecter HF_TOKEN via Secret.

    Migration d'ACE-Step 1.5 vers le modèle d'application partagée apiVersion v3 (acestep15v2 → acestep15v3) : sous-charts aplatis en un seul chart, Deployment d'entrée nginx renommé `acestep15v3`, backends résolus dans le namespace de la release, et `workloadReplicas` ajoutés pour les charges d'entrée et du moteur Gradio.

metadata:
  title: ACE-Step 1.5
  description: Das leistungsstärkste lokale Musik-Generierungsmodell, das die meisten kommerziellen Alternativen übertrifft
spec:
  fullDescription: |
    Wir präsentieren ACE-Step v1.5, ein hocheffizientes Open-Source-Musik-Foundation-Modell, das kommerzielle Generierungsqualität auf Consumer-Hardware bringt. Bei gängigen Bewertungsmetriken erreicht ACE-Step v1.5 eine Qualität jenseits der meisten kommerziellen Musikmodelle und bleibt dabei extrem schnell — unter 2 Sekunden pro vollständigem Song auf einer A100 und unter 10 Sekunden auf einer RTX 3090. Das Modell läuft lokal mit weniger als 4 GB VRAM und unterstützt leichte Personalisierung: Nutzer können aus nur wenigen Songs ein LoRA trainieren, um ihren eigenen Stil einzufangen.

    **Funktionen**
    Leistung
    - Ultrschnelle Generierung: Unter 2 s pro vollständigem Song auf A100, unter 10 s auf RTX 3090 (0,5 s bis 10 s auf A100 je nach Think-Modus und Diffusions-Schritten)
    - Flexible Dauer: Unterstützt Audio-Generierung von 10 Sekunden bis 10 Minuten (600 s)
    - Batch-Generierung: Bis zu 8 Songs gleichzeitig erzeugen

    Generierungsqualität
    - Kommerzielle Ausgabequalität: Qualität jenseits der meisten kommerziellen Musikmodelle (zwischen Suno v4.5 und Suno v5)
    - Reiche Stilunterstützung: Über 1000 Instrumente und Stile mit feinkörniger Timbre-Beschreibung
    - Mehrsprachige Lyrics: Unterstützt über 50 Sprachen mit Lyrics-Prompt für Struktur- und Stilkontrolle

    Vielseitigkeit & Kontrolle
    - Referenz-Audio-Eingabe: Referenz-Audio zur Steuerung des Generierungsstils nutzen
    - Cover-Generierung: Covers aus vorhandenem Audio erstellen
    - Neuzeichnen & Bearbeiten: Selektive lokale Audio-Bearbeitung und -Neugenerierung
    - Spurentrennung: Audio in einzelne Stems aufteilen
    - Mehrspur-Generierung: Ebenen hinzufügen wie die „Add Layer“-Funktion von Suno Studio
    - Vocal2BGM: Automatische Begleitung für Gesangsspuren erzeugen
    - Metadaten-Kontrolle: Dauer, BPM, Tonart/Skala und Taktart steuern
    - Einfacher Modus: Vollständige Songs aus einfachen Beschreibungen erzeugen
    - Abfrage-Umschreibung: Automatische LM-Erweiterung von Tags und Lyrics
    - Audio-Verständnis: BPM, Tonart/Skala, Taktart und Caption aus Audio extrahieren
    - LRC-Generierung: Lyric-Zeitstempel für erzeugte Musik automatisch erzeugen
    - LoRA-Training: Ein-Klick-Annotation und Training in Gradio. 8 Songs, 1 Stunde auf 3090 (12 GB VRAM)
    - Qualitätsbewertung: Automatische Qualitätsbewertung für erzeugtes Audio

    **ACE-Step 1.5 XL (4B DiT)**
    - acestep-v15-xl-base, acestep-v15-xl-sft, acestep-v15-xl-turbo — höhere Audioqualität mit 4B-Parameter-DiT-Decoder
    - Erfordert ≥12 GB VRAM (mit Offload) oder empfohlen ≥20 GB; alle LM-Modelle bleiben kompatibel

  upgradeDescription: |
    Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat` umstellen.

    nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.

    llm-init-Image auf `beclab/llm-init:v1.3.1` anheben.

    HF_TOKEN / HF_ENDPOINT aus OLARES_SYSTEM_HUGGINGFACE_* (Systemebene) mappen und HF_TOKEN über Secret injizieren.

    ACE-Step 1.5 auf das Shared-App-Muster apiVersion v3 migriert (acestep15v2 → acestep15v3): Sub-Charts in ein einzelnes Chart zusammengeführt, nginx-Entrance-Deployment in `acestep15v3` umbenannt, Backends innerhalb des Release-Namespace aufgelöst und `workloadReplicas` für Entrance- und Gradio-Engine-Workloads hinzugefügt.

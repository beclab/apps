metadata:
  title: ACE-Step 1.5
  description: Il modello locale di generazione musicale più potente, che supera la maggior parte delle alternative commerciali
spec:
  fullDescription: |
    Presentiamo ACE-Step v1.5, un modello foundation musicale open-source altamente efficiente che porta la generazione di livello commerciale sull'hardware consumer. Sulle metriche di valutazione più comuni, ACE-Step v1.5 raggiunge una qualità superiore alla maggior parte dei modelli musicali commerciali rimanendo estremamente veloce: meno di 2 secondi per brano completo su A100 e meno di 10 secondi su RTX 3090. Il modello gira in locale con meno di 4 GB di VRAM e supporta una personalizzazione leggera: gli utenti possono addestrare un LoRA a partire da poche canzoni per catturare il proprio stile.

    **Funzionalità**
    Prestazioni
    - Generazione ultra-rapida: Meno di 2 s per brano completo su A100, meno di 10 s su RTX 3090 (da 0,5 s a 10 s su A100 a seconda del think mode e dei passi di diffusione)
    - Durata flessibile: Supporta generazione audio da 10 secondi a 10 minuti (600 s)
    - Generazione in batch: Genera fino a 8 brani contemporaneamente

    Qualità di generazione
    - Output di livello commerciale: Qualità superiore alla maggior parte dei modelli musicali commerciali (tra Suno v4.5 e Suno v5)
    - Ampio supporto di stili: Oltre 1000 strumenti e stili con descrizione fine del timbro
    - Testi multilingue: Supporta oltre 50 lingue con prompt dei testi per controllo di struttura e stile

    Versatilità e controllo
    - Input audio di riferimento: Usa audio di riferimento per guidare lo stile di generazione
    - Generazione di cover: Crea cover da audio esistente
    - Ripittura e modifica: Editing e rigenerazione selettiva dell'audio locale
    - Separazione tracce: Separa l'audio in stem individuali
    - Generazione multi-traccia: Aggiungi layer come la funzione «Add Layer» di Suno Studio
    - Vocal2BGM: Genera automaticamente l'accompagnamento per le tracce vocali
    - Controllo metadati: Controlla durata, BPM, tonalità/scala e tempo
    - Modalità semplice: Genera brani completi da descrizioni semplici
    - Riscrittura query: Espansione automatica LM di tag e testi
    - Comprensione audio: Estrae BPM, tonalità/scala, tempo e caption dall'audio
    - Generazione LRC: Genera automaticamente timestamp dei testi per la musica generata
    - Training LoRA: Annotazione e training con un clic in Gradio. 8 brani, 1 ora su 3090 (12 GB VRAM)
    - Punteggio qualità: Valutazione automatica della qualità dell'audio generato

    **ACE-Step 1.5 XL (4B DiT)**
    - acestep-v15-xl-base, acestep-v15-xl-sft, acestep-v15-xl-turbo — qualità audio superiore con decoder DiT da 4B parametri
    - Richiede ≥12 GB VRAM (con offload) o consigliati ≥20 GB; tutti i modelli LM restano compatibili

  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.

    Aggiornare l'immagine llm-init a `beclab/llm-init:v1.3.1`.

    Mappare HF_TOKEN / HF_ENDPOINT da OLARES_SYSTEM_HUGGINGFACE_* (livello di sistema) e iniettare HF_TOKEN tramite Secret.

    Migrazione di ACE-Step 1.5 al pattern di app condivisa apiVersion v3 (acestep15v2 → acestep15v3): sub-chart appiattiti in un unico chart, Deployment di ingresso nginx rinominato in `acestep15v3`, backend risolti nel namespace della release e `workloadReplicas` aggiunti per i workload di ingresso e del motore Gradio.

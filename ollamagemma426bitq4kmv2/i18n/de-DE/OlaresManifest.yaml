metadata:
  title: Gemma4 26B Q4_K_M (Ollama)
  description: Gemma 4 26B (Ollama-Bibliothek, Q4_K_M) für effiziente multimodale lokale Inferenz
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsame App. Nach der Installation durch den Olares Admin können alle Nutzer im Cluster sie über die Referenz-App nutzen.
    Nutzer-Traffic geht über den Proxy zu Ollama.
    
    **MODELL**
    Verwendet das Ollama-Bibliotheksmodell **gemma4:26b** (Standard Q4_K_M in der Registry). Chart **OLLAMA_CONTEXT_LENGTH**: **65536** (64k).
    
    Gemma 4 26B ist ein Mixture-of-Experts-Modell: starke Qualität für Reasoning, Coding und multimodale (Text + Bild) Aufgaben mit einem kleineren aktiven Parameter-Footprint als ein dichtes Modell ähnlicher Fähigkeit.
    
    Instruction-tuned mit Unterstützung für Tool Calling; diese Installation nutzt ein 64k-Kontextlimit für vorhersehbaren VRAM (bei Bedarf in ConfigMap anpassen).
  upgradeDescription: |
    Ollama-Runtime auf ollama/ollama:0.30.10 aktualisieren.
    Olares-API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisieren (OpenAI-Vision image_url-Weiterleitung).

metadata:
  title: Gemma4 26B Q4_K_M (Ollama)
  description: Gemma 4 26B (libreria Ollama, Q4_K_M) per inferenza multimodale locale efficiente
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa attraverso il proxy verso Ollama.
    
    **MODELLO**
    Usa il modello della libreria Ollama **gemma4:26b** (Q4_K_M predefinito nel registry). Chart **OLLAMA_CONTEXT_LENGTH**: **65536** (64k).
    
    Gemma 4 26B è un modello mixture-of-experts: forte qualità per ragionamento, coding e compiti multimodali (testo + immagine) con un footprint di parametri attivi minore di un modello denso di capacità simile.
    
    Instruction-tuned con supporto al tool calling; questa installazione usa un limite di contesto di 64k per VRAM prevedibile (regola in ConfigMap se necessario).
  upgradeDescription: |
    Aggiornare il runtime Ollama a ollama/ollama:0.30.10.
    Aggiornare il proxy API Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url visione OpenAI).

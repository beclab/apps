metadata:
  title: Gemma4 26B Q4_K_M (Ollama)
  description: Gemma 4 26B (biblioteca Ollama, Q4_K_M) para inferencia multimodal local eficiente
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.
    El tráfico de usuario pasa por el proxy hacia Ollama.
    
    **MODELO**
    Usa el modelo de la biblioteca Ollama **gemma4:26b** (Q4_K_M por defecto en el registro). Chart **OLLAMA_CONTEXT_LENGTH**: **65536** (64k).
    
    Gemma 4 26B es un modelo mixture-of-experts: gran calidad para razonamiento, coding y tareas multimodales (texto + imagen) con una huella de parámetros activos menor que un modelo denso de capacidad similar.
    
    Ajustado por instrucciones con soporte de tool calling; esta instalación usa un límite de contexto de 64k para VRAM predecible (ajústalo en ConfigMap si es necesario).
  upgradeDescription: |
    Actualizar el runtime de Ollama a ollama/ollama:0.30.10.
    Actualizar el proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).

metadata:
  title: Gemma4 26B Q4_K_M (Ollama)
  description: Gemma 4 26B (bibliothèque Ollama, Q4_K_M) pour une inférence multimodale locale efficace
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.
    
    **MODÈLE**
    Utilise le modèle de la bibliothèque Ollama **gemma4:26b** (Q4_K_M par défaut dans le registre). Chart **OLLAMA_CONTEXT_LENGTH** : **65536** (64k).
    
    Gemma 4 26B est un modèle mixture-of-experts : forte qualité pour le raisonnement, le coding et les tâches multimodales (texte + image) avec une empreinte de paramètres actifs plus petite qu'un modèle dense de capacité similaire.
    
    Instruction-tuned avec prise en charge du tool calling ; cette installation utilise une limite de contexte de 64k pour un VRAM prévisible (à ajuster dans ConfigMap si besoin).
  upgradeDescription: |
    Mettre à jour le runtime Ollama vers ollama/ollama:0.30.10.
    Mettre à jour le proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).

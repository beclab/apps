metadata:
  title: Gemma4 26B Q4_K_M (Ollama)
  description: 効率的なマルチモーダルローカル推論向け Gemma 4 26B（Ollama ライブラリ、Q4_K_M）
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。
    
    **モデル**
    Ollama ライブラリモデル **gemma4:26b**（レジストリのデフォルト Q4_K_M）を使用。Chart **OLLAMA_CONTEXT_LENGTH**: **65536**（64k）。
    
    Gemma 4 26B は Mixture-of-Experts モデルです：推論・コーディング・マルチモーダル（テキスト＋画像）タスクで高い品質を持ち、同程度の能力の密モデルより小さいアクティブパラメータフットプリントです。
    
    ツール呼び出し対応の instruction-tuned；このインストールは予測可能な VRAM のため 64k コンテキスト制限を使用します（必要に応じて ConfigMap で調整）。
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 にアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 にアップグレード（OpenAI vision image_url 転送）。

metadata:
  title: Medusa
  description: La plateforme de commerce la plus flexible au monde
spec:
  fullDescription: |
    Medusa est une plateforme de commerce avec un framework de personnalisation intégré qui vous permet de créer des applications de commerce sur mesure sans réinventer la logique métier de base. Le framework et les modules peuvent prendre en charge des boutiques B2B ou DTC avancées, des marketplaces, des plateformes de distribution, des systèmes PoS, des activités de services ou des solutions similaires nécessitant des primitives de commerce. Tous les modules de commerce sont open-source et librement disponibles sur npm.

    **Avantages principaux**
    - Lancement rapide : Modèles de boutique préconstruits, optimisés pour B2C et B2B. Mettez en place un cadre de boutique en ligne de base en quelques minutes et accélerez le lancement.
    - Gestion backend flexible : Tableau de bord d'administration personnalisable pour adapter fonctions et workflows à vos besoins.
    - Extension facile des fonctions : Architecture modulaire permettant d'ajouter des modules à la demande.
    - Barrières techniques plus basses : Pas besoin de maîtriser un codage complexe ; déploiement automatique de la boutique en se connectant à GitHub.
    - Support commercial évolutif : Stable des petites ventes en démarrage aux opérations à grande échelle avec des milliers de commandes quotidiennes et un fulfillment multi-magasins, assurant une croissance fluide sans gel du système dû à l'expansion.

  upgradeDescription: |
    Relever la limite d'upload du reverse-proxy OpenResty à `client_max_body_size 100m` pour que les uploads d'images produit ne soient pas rejetés avec HTTP 413 (OpenResty officiel par défaut à 1m). Redéployer le Deployment medusa lorsque le ConfigMap nginx change (`checksum/nginx-config`), car un montage `subPath` ne prend pas en compte les mises à jour in-place du ConfigMap.

    Remplacer l'image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage Bitnami spécifique de `OPENRESTY_CONF_FILE`.

    v1.0.8 : Déplacer `JWT_SECRET`, `COOKIE_SECRET` et `ADMIN_PASSWORD` dans un Secret Kubernetes (`secretKeyRef`).

    **Corrige la régression avec les migrations de liens**

    Cette version corrige une régression dans la génération de types pendant les builds qui pouvait provoquer des échecs de build dans certaines conditions. Dans la PR #14493, nous avons mis à jour le processus de build pour générer les types autogénérés de Medusa au moment du build, afin qu'ils soient disponibles en développement et en production.

    Ce changement a introduit un problème involontaire dans le processus de build. Générer des types pendant le build nécessite de démarrer l'application. Pendant le bootstrap, plusieurs loaders internes principaux s'exécutent, y compris ceux responsables des connexions à la base de données. Ces loaders dépendent de variables d'environnement spécifiques et, lorsqu'elles sont absentes, le build échoue.

    Cette version modifie la génération de types pour s'appuyer sur un mode de bootstrap « léger », qui permet de démarrer l'application sans exécuter ces loaders internes, évitant ainsi la dépendance aux variables d'environnement pendant la phase de build.


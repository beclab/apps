metadata:
  title: Medusa
  description: Die flexibelste Commerce-Plattform der Welt
spec:
  fullDescription: |
    Medusa ist eine Commerce-Plattform mit einem eingebauten Anpassungs-Framework, mit dem Sie individuelle Commerce-Anwendungen erstellen können, ohne die Kernlogik neu erfinden zu müssen. Framework und Module unterstützen fortgeschrittene B2B- oder DTC-Shops, Marktplätze, Distributorplattformen, PoS-Systeme, Servicegeschäfte oder ähnliche Lösungen, die grundlegende Commerce-Primitives brauchen. Alle Commerce-Module sind Open Source und frei auf npm verfügbar.

    **Kernvorteile**
    - Schneller Start: Vorgefertigte Shop-Templates für B2C- und B2B-Szenarien. In Minuten ein Grundgerüst aufsetzen und den Launch beschleunigen.
    - Flexible Backend-Verwaltung: Anpassbares Admin-Dashboard zur Anpassung von Funktionen und Workflows an Ihre Anforderungen.
    - Einfache Funktionserweiterung: Modulare Architektur erlaubt bedarfsgerechtes Hinzufügen von Modulen.
    - Niedrigere technische Hürden: Keine komplexen Coding-Skills nötig; automatische Shop-Bereitstellung durch GitHub-Anbindung.
    - Skalierbare Business-Unterstützung: Stabil vom Startup mit kleinem Absatz bis zu Großbetrieb mit tausenden Tagesbestellungen und Multi-Store-Fulfillment — für reibungsloses Wachstum ohne Systemeinfrieren durch Expansion.

  upgradeDescription: |
    Upload-Limit des OpenResty-Reverse-Proxys auf `client_max_body_size 100m` erhöhen, damit Produktbild-Uploads nicht mit HTTP 413 abgelehnt werden (offizielles OpenResty standardmäßig 1m). Medusa-Deployment rollen, wenn sich die nginx-ConfigMap ändert (`checksum/nginx-config`), da ein `subPath`-Mount keine In-Place-ConfigMap-Updates übernimmt.

    Wechsel des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifisches `OPENRESTY_CONF_FILE`-Wiring entfernen.

    v1.0.8: `JWT_SECRET`, `COOKIE_SECRET` und `ADMIN_PASSWORD` in Kubernetes Secret (`secretKeyRef`) verschieben.

    **Regression bei Link-Migrationen behoben**

    Dieses Release behebt eine Regression bei der Typgenerierung während Builds, die unter bestimmten Bedingungen zu Build-Fehlern führen konnte. In PR #14493 wurde der Build-Prozess so aktualisiert, dass die von Medusa automatisch generierten Typen zur Build-Zeit erzeugt werden und so sowohl in der Entwicklung als auch in der Produktion verfügbar sind.

    Diese Änderung führte zu einem unbeabsichtigten Problem im Build-Prozess. Die Typgenerierung während des Builds erfordert das Bootstrapping der Anwendung. Beim Bootstrap werden mehrere interne Core-Loader ausgeführt, einschließlich jener für Datenbankverbindungen. Diese Loader hängen von bestimmten Umgebungsvariablen ab; fehlen diese, schlägt der Build fehl.

    Dieses Release ändert die Typgenerierung so, dass sie auf einen „leichtgewichtigen“ Bootstrap-Modus setzt, der den Start ohne Ausführung dieser internen Core-Loader erlaubt und so die Abhängigkeit von Umgebungsvariablen in der Build-Phase vermeidet.


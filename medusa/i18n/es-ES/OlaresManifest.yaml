metadata:
  title: Medusa
  description: La plataforma de comercio más flexible del mundo
spec:
  fullDescription: |
    Medusa es una plataforma de comercio con un framework integrado de personalización que te permite crear aplicaciones de comercio a medida sin reinventar la lógica central. El framework y los módulos pueden respaldar tiendas B2B o DTC avanzadas, marketplaces, plataformas de distribución, sistemas PoS, negocios de servicios u soluciones similares que necesiten primitivas de comercio. Todos los módulos de comercio son de código abierto y están disponibles libremente en npm.

    **Ventajas principales**
    - Lanzamiento rápido: Plantillas de tienda prediseñadas, optimizadas para B2C y B2B. Monta un marco básico de tienda online en minutos y acelera el lanzamiento.
    - Gestión flexible del backend: Panel de administración personalizable para ajustar funciones y flujos según tus requisitos.
    - Fácil ampliación de funciones: Arquitectura modular que permite añadir módulos bajo demanda.
    - Menores barreras técnicas: No hace falta dominar código complejo; despliega la tienda automáticamente conectando GitHub.
    - Soporte de negocio escalable: Estable desde ventas a pequeña escala al inicio hasta operaciones a gran escala con miles de pedidos diarios y fulfillment multi-tienda, asegurando un crecimiento fluido sin congelaciones por expansión.

  upgradeDescription: |
    Elevar el límite de subida del proxy inverso OpenResty a `client_max_body_size 100m` para que las subidas de imágenes de producto no se rechacen con HTTP 413 (OpenResty oficial por defecto 1m). Reiniciar el Deployment medusa cuando cambie el ConfigMap de nginx (`checksum/nginx-config`), porque un montaje `subPath` no recoge actualizaciones in-place del ConfigMap.

    Cambiar la imagen del proxy inverso de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.

    v1.0.8: Mover `JWT_SECRET`, `COOKIE_SECRET` y `ADMIN_PASSWORD` a un Secret de Kubernetes (`secretKeyRef`).

    **Corrige la regresión con migraciones de enlaces**

    Esta versión corrige una regresión en la generación de tipos durante los builds que podía provocar fallos de compilación en ciertas condiciones. En el PR #14493, actualizamos el proceso de build para generar los tipos autogenerados de Medusa en tiempo de build, asegurando que estén disponibles tanto en desarrollo como en producción.

    Este cambio introdujo un problema no intencionado en el proceso de build. Generar tipos durante el build requiere arrancar la aplicación. Durante el arranque se ejecutan varios loaders internos principales, incluidos los responsables de establecer conexiones a la base de datos. Estos loaders dependen de variables de entorno específicas y, cuando no están presentes, el build falla.

    Esta versión cambia la generación de tipos para basarse en un modo de arranque «ligero», que permite iniciar la aplicación sin ejecutar estos loaders internos, evitando la dependencia de variables de entorno durante la fase de build.


metadata:
  title: Medusa
  description: 世界で最も柔軟なコマースプラットフォーム
spec:
  fullDescription: |
    Medusa は、コアのコマースロジックを再発明することなくカスタムコマースアプリを構築できる、組み込みのカスタマイズフレームワークを備えたコマースプラットフォームです。フレームワークとモジュールは、高度な B2B / DTC ストア、マーケットプレイス、ディストリビュータープラットフォーム、PoS、サービス業など、基盤となるコマースプリミティブを必要とするソリューションを支えられます。すべてのコマースモジュールはオープンソースで、npm で自由に利用できます。

    **主な利点**
    - 迅速な立ち上げ：B2C / B2B 向けに最適化された事前構築ストアテンプレート。数分で基本的なオンラインストア枠を用意し、ローンチを加速。
    - 柔軟なバックエンド管理：業務要件に合わせて機能とワークフローを調整できるカスタマイズ可能な管理ダッシュボード。
    - 容易な機能拡張：モジュール設計で必要な機能モジュールをオンデマンド追加。
    - 技術的ハードルの低下：複雑なコーディング不要；GitHub 接続で自動ストアデプロイが可能。
    - スケーラブルなビジネス支援：立ち上げ時の小規模販売から、1日数千件の注文とマルチストアフルフィルメントの大規模運用まで安定稼働し、拡大によるシステム停止を防ぎます。

  upgradeDescription: |
    製品画像アップロードが HTTP 413 で拒否されないよう、OpenResty リバースプロキシのアップロード上限を `client_max_body_size 100m` に引き上げ（公式 OpenResty のデフォルトは 1m）。nginx ConfigMap が変わったら medusa Deployment をロール（`checksum/nginx-config`）。`subPath` マウントは ConfigMap のその場更新を拾わないため。

    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。

    v1.0.8: `JWT_SECRET`、`COOKIE_SECRET`、`ADMIN_PASSWORD` を Kubernetes Secret（`secretKeyRef`）へ移動。

    **リンク移行のリグレッションを修正**

    本リリースは、特定条件下でビルド失敗を引き起こし得たビルド時の型生成リグレッションを修正します。PR #14493 で、Medusa の自動生成型をビルド時に生成するようビルドプロセスを更新し、開発時と本番の両方で利用できるようにしました。

    この変更はビルドプロセスに意図しない問題を導入しました。ビルド中の型生成にはアプリケーションのブートストラップが必要です。ブートストラップではデータベース接続を確立するローダーを含む複数のコア内部ローダーが実行されます。これらのローダーは特定の環境変数に依存し、それらが無いとビルドは失敗します。

    本リリースでは型生成を「軽量」ブートストラップモードに依存するよう変更し、これらコア内部ローダーを実行せずに起動できるようにして、ビルド段階での環境変数依存を回避します。

    **機能**
    - feat(rbac): ロールベースアクセス制御モジュール by @carlos-r-l-rodrigues in #14310
    - feat(): medusa 設定にモジュールオプションのオートコンプリートを追加 by @adrien2p in #14465

    **バグ**
    - feat(medusa-app): リンク初期化が migrationOnly フラグを尊重するよう修正 by @adrien2p in #14493

    **ドキュメント**

metadata:
  title: Medusa
  description: La piattaforma di commerce più flessibile al mondo
spec:
  fullDescription: |
    Medusa è una piattaforma di commerce con un framework di personalizzazione integrato che ti permette di costruire applicazioni di commerce su misura senza reinventare la logica core. Framework e moduli possono supportare store B2B o DTC avanzati, marketplace, piattaforme di distribuzione, sistemi PoS, business di servizi o soluzioni simili che necessitano di primitive di commerce. Tutti i moduli di commerce sono open-source e liberamente disponibili su npm.

    **Vantaggi principali**
    - Avvio rapido: Template di store precostruiti, ottimizzati per B2C e B2B. Imposta un framework base di negozio online in pochi minuti e accelera il lancio.
    - Gestione backend flessibile: Dashboard admin personalizzabile per adattare funzioni e workflow alle tue esigenze.
    - Facile espansione delle funzioni: Architettura modulare che consente di aggiungere moduli on-demand.
    - Barriere tecniche più basse: Non serve padronanza di coding complesso; deployment automatico dello store collegando GitHub.
    - Supporto business scalabile: Stabile dalle piccole vendite in avvio alle operazioni su larga scala con migliaia di ordini giornalieri e fulfillment multi-store, garantendo una crescita fluida senza blocchi da espansione.

  upgradeDescription: |
    Aumentare il limite di upload del reverse-proxy OpenResty a `client_max_body_size 100m` affinché gli upload di immagini prodotto non vengano rifiutati con HTTP 413 (OpenResty ufficiale di default 1m). Eseguire il roll del Deployment medusa quando cambia il ConfigMap nginx (`checksum/nginx-config`), perché un mount `subPath` non raccoglie gli aggiornamenti in-place del ConfigMap.

    Passare l'immagine reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico Bitnami di `OPENRESTY_CONF_FILE`.

    v1.0.8: Spostare `JWT_SECRET`, `COOKIE_SECRET` e `ADMIN_PASSWORD` in un Secret Kubernetes (`secretKeyRef`).

    **Corregge la regressione con le migrazioni dei link**

    Questa release corregge una regressione nella generazione dei tipi durante i build che poteva causare fallimenti di build in certe condizioni. Nel PR #14493 abbiamo aggiornato il processo di build per generare i tipi autogenerati di Medusa in fase di build, assicurandone la disponibilità sia in sviluppo sia in produzione.

    Questa modifica ha introdotto un problema non intenzionale nel processo di build. Generare i tipi durante il build richiede il bootstrap dell'applicazione. Durante il bootstrap vengono eseguiti diversi loader interni principali, inclusi quelli responsabili delle connessioni al database. Questi loader dipendono da variabili d'ambiente specifiche e, quando non sono presenti, il build fallisce.

    Questa release modifica la generazione dei tipi per basarsi su una modalità di bootstrap «leggera», che consente di avviare l'applicazione senza eseguire questi loader interni, evitando la dipendenza dalle variabili d'ambiente durante la fase di build.


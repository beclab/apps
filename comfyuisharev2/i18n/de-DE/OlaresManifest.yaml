metadata:
  title: ComfyUI Shared
  description: Die leistungsstärkste und modularste Stable-Diffusion-GUI und -Backend
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-Version von ComfyUI. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer muss dennoch einen Desktop-Eintrag installieren, um den vom Olares Admin installierten Dienst zu nutzen.

    **ÜBERBLICK**
    Die leistungsstärkste und modularste Stable-Diffusion-GUI und -Backend.
    Mit dieser UI können Sie fortgeschrittene Stable-Diffusion-Pipelines über eine Graph-/Nodes-/Flowchart-Oberfläche entwerfen und ausführen.

    **Funktionen**

    - Nodes-/Graph-/Flowchart-Oberfläche zum Experimentieren und Erstellen komplexer Stable-Diffusion-Workflows ohne Programmierung.
    - HINWEIS: Es werden deutlich mehr Modelle unterstützt als unten aufgeführt; die Vorlagenliste in ComfyUI zeigt, was unterstützt wird.
    - Bildmodelle
      - SD1.x, SD2.x ([unCLIP](https://comfyanonymous.github.io/ComfyUI_examples/unclip/))
      - [SDXL](https://comfyanonymous.github.io/ComfyUI_examples/sdxl/), [SDXL Turbo](https://comfyanonymous.github.io/ComfyUI_examples/sdturbo/)
      - [Stable Cascade](https://comfyanonymous.github.io/ComfyUI_examples/stable_cascade/)
      - [SD3 and SD3.5](https://comfyanonymous.github.io/ComfyUI_examples/sd3/)
      - Pixart Alpha and Sigma
      - [AuraFlow](https://comfyanonymous.github.io/ComfyUI_examples/aura_flow/)
      - [HunyuanDiT](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_dit/)
      - [Flux](https://comfyanonymous.github.io/ComfyUI_examples/flux/)
      - [Lumina Image 2.0](https://comfyanonymous.github.io/ComfyUI_examples/lumina2/)
      - [HiDream](https://comfyanonymous.github.io/ComfyUI_examples/hidream/)
      - [Qwen Image](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/)
      - [Hunyuan Image 2.1](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_image/)
      - [Flux 2](https://comfyanonymous.github.io/ComfyUI_examples/flux2/)
      - [Z Image](https://comfyanonymous.github.io/ComfyUI_examples/z_image/)
    - Bildbearbeitungsmodelle
      - [Omnigen 2](https://comfyanonymous.github.io/ComfyUI_examples/omnigen/)
      - [Flux Kontext](https://comfyanonymous.github.io/ComfyUI_examples/flux/#flux-kontext-image-editing-model)
      - [HiDream E1.1](https://comfyanonymous.github.io/ComfyUI_examples/hidream/#hidream-e11)
      - [Qwen Image Edit](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/#edit-model)
    - Videomodelle
      - [Stable Video Diffusion](https://comfyanonymous.github.io/ComfyUI_examples/video/)
      - [Mochi](https://comfyanonymous.github.io/ComfyUI_examples/mochi/)
      - [LTX-Video](https://comfyanonymous.github.io/ComfyUI_examples/ltxv/)
      - [Hunyuan Video](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_video/)
      - [Wan 2.1](https://comfyanonymous.github.io/ComfyUI_examples/wan/)
      - [Wan 2.2](https://comfyanonymous.github.io/ComfyUI_examples/wan22/)
      - [Hunyuan Video 1.5](https://docs.comfy.org/tutorials/video/hunyuan/hunyuan-video-1-5)
    - Audiomodelle
      - [Stable Audio](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
      - [ACE Step](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
    - 3D-Modelle
      - [Hunyuan3D 2.0](https://docs.comfy.org/tutorials/3d/hunyuan3D-2)
    - Asynchrones Warteschlangensystem
    - Viele Optimierungen: Führt nur die Teile des Workflows erneut aus, die sich zwischen Ausführungen ändern.
    - Intelligente Speicherverwaltung: kann große Modelle automatisch auf GPUs mit nur 1 GB VRAM per Smart-Offloading ausführen.
    - Funktioniert auch ohne GPU mit: ```--cpu``` (langsam)
    - Kann ckpt und safetensors laden: All-in-one-Checkpoints oder eigenständige Diffusionsmodelle, VAEs und CLIP-Modelle.
    - Sicheres Laden von ckpt-, pt-, pth- usw. Dateien.
    - Embeddings/Textual Inversion
    - [Loras (regular, locon und loha)](https://comfyanonymous.github.io/ComfyUI_examples/lora/)
    - [Hypernetworks](https://comfyanonymous.github.io/ComfyUI_examples/hypernetworks/)
    - Laden vollständiger Workflows (mit Seeds) aus generierten PNG-, WebP- und FLAC-Dateien.
    - Speichern/Laden von Workflows als JSON-Dateien.
    - Die Nodes-Oberfläche kann komplexe Workflows erstellen, z. B. für [Hires fix](https://comfyanonymous.github.io/ComfyUI_examples/2_pass_txt2img/) oder deutlich fortgeschrittenere.
    - [Area Composition](https://comfyanonymous.github.io/ComfyUI_examples/area_composition/)
    - [Inpainting](https://comfyanonymous.github.io/ComfyUI_examples/inpaint/) mit normalen und Inpainting-Modellen.
    - [ControlNet und T2I-Adapter](https://comfyanonymous.github.io/ComfyUI_examples/controlnet/)
    - [Upscale-Modelle (ESRGAN, ESRGAN-Varianten, SwinIR, Swin2SR usw.)](https://comfyanonymous.github.io/ComfyUI_examples/upscale_models/)
    - [GLIGEN](https://comfyanonymous.github.io/ComfyUI_examples/gligen/)
    - [Model Merging](https://comfyanonymous.github.io/ComfyUI_examples/model_merging/)
    - [LCM-Modelle und Loras](https://comfyanonymous.github.io/ComfyUI_examples/lcm/)
    - Latent-Vorschauen mit [TAESD](#how-to-show-high-quality-previews)
    - Vollständig offline: Der Core lädt nichts herunter, es sei denn, Sie möchten es.
    - Optionale API-Nodes für kostenpflichtige Modelle externer Anbieter über die Online-[Comfy API](https://docs.comfy.org/tutorials/api-nodes/overview); deaktivieren mit: `--disable-api-nodes`
    - [Konfigurationsdatei](extra_model_paths.yaml.example) zum Festlegen der Suchpfade für Modelle.

    Workflow-Beispiele finden Sie auf der [Examples-Seite](https://comfyanonymous.github.io/ComfyUI_examples/)

  upgradeDescription: |
    ComfyUI-Upgrade auf Version 0.26.0

    Wichtige Änderungen:
    - **[Neue Modellunterstützung]** Unterstützung für Qwen3-VL-Textgenerierung, SCAIL-2 Multi-Reference, Krea2, Boogu-Image, Bernini-R (Wan Video) und Depth Anything 3 hinzugefügt; Partner-API-Nodes aktualisiert mit Kling V3-Turbo, Luma Rays 3.2 und HappyHorse 1.1
    - **[3D-Verbesserungen]** Neue Nodes `Load3DAdvanced`, `PreviewGaussianSplat` und `PreviewPointCloud`; `Load3D` akzeptiert jetzt Ausgabe-/Temp-Pfade; Ein- und Ausgaben der 3D-Vorschau-Nodes neu geordnet
    - **[Video & Audio]** Audio-Nodes in einem einheitlichen `SaveAudioAdvanced`-Node zusammengeführt; 10-Bit-Videoausgabe hinzugefügt; nicht-deterministischer Absturz und Edge-Bleed bei Video-Decode mit nicht ausgerichteter Breite behoben; `SaveWEBM` unterstützt jetzt das Speichern des Alpha-Kanals
    - **[Speicher & Leistung]** Neues Startflag `--high-ram`; dynamisches VRAM-Management mit `--reserve-vram` / `--vram-headroom` erweitert; `cuda malloc` auf CUDA 130+ automatisch aktiviert; LTX2-Modelle erhalten Context-Window-Sampling
    - **[API & Backend]** Neue Job-Abbruch-Endpunkte (`POST /api/jobs/{job_id}/cancel`); Assets-API erhält cursorbasierte Paginierung und `job_ids`-Filter; neues CLI-Flag `--enable-telemetry` und Diagnoseoption `--debug-hang`
    - **[Nodes & Workflow]** Neuer `Color`-Primitive-Node; Save-Nodes stellen jetzt Ausgabe-Sockets bereit; mehrere Nodes umbenannt und neu kategorisiert; Qwen3-VL kann als Flux2-Klein-Textencoder verwendet werden
    - **[Sicherheit & Stabilität]** Trainingsdatensatz-Shards werden jetzt mit `weights_only=True` geladen; Abstürze bei Ideogram fp8, Flux-KV-Cache-Split-Batch und Bildgitter-Rendering behoben

    Vollständige Versionshinweise unter: https://github.com/Comfy-Org/ComfyUI/releases/tag/v0.26.0

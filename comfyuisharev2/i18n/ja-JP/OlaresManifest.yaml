metadata:
  title: ComfyUI Shared
  description: 最も強力でモジュール化された Stable Diffusion GUI およびバックエンド
spec:
  fullDescription: |
    **重要なお知らせ**
    これは ComfyUI の共有版です。Olares システム全体でインストールされるサービスは1つだけです。ただし、各ユーザーは Olares 管理者がインストールしたサービスにアクセスして利用するために、デスクトップエントリをインストールする必要があります。

    **概要**
    最も強力でモジュール化された Stable Diffusion GUI およびバックエンドです。
    この UI では、グラフ／ノード／フローチャートベースのインターフェースで高度な Stable Diffusion パイプラインを設計・実行できます。

    **機能**

    - コーディング不要で複雑な Stable Diffusion ワークフローを実験・作成できるノード／グラフ／フローチャートインターフェース。
    - 注意：下記リストよりはるかに多くのモデルがサポートされています。対応内容は ComfyUI 内のテンプレート一覧を参照してください。
    - 画像モデル
      - SD1.x, SD2.x ([unCLIP](https://comfyanonymous.github.io/ComfyUI_examples/unclip/))
      - [SDXL](https://comfyanonymous.github.io/ComfyUI_examples/sdxl/), [SDXL Turbo](https://comfyanonymous.github.io/ComfyUI_examples/sdturbo/)
      - [Stable Cascade](https://comfyanonymous.github.io/ComfyUI_examples/stable_cascade/)
      - [SD3 and SD3.5](https://comfyanonymous.github.io/ComfyUI_examples/sd3/)
      - Pixart Alpha and Sigma
      - [AuraFlow](https://comfyanonymous.github.io/ComfyUI_examples/aura_flow/)
      - [HunyuanDiT](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_dit/)
      - [Flux](https://comfyanonymous.github.io/ComfyUI_examples/flux/)
      - [Lumina Image 2.0](https://comfyanonymous.github.io/ComfyUI_examples/lumina2/)
      - [HiDream](https://comfyanonymous.github.io/ComfyUI_examples/hidream/)
      - [Qwen Image](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/)
      - [Hunyuan Image 2.1](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_image/)
      - [Flux 2](https://comfyanonymous.github.io/ComfyUI_examples/flux2/)
      - [Z Image](https://comfyanonymous.github.io/ComfyUI_examples/z_image/)
    - 画像編集モデル
      - [Omnigen 2](https://comfyanonymous.github.io/ComfyUI_examples/omnigen/)
      - [Flux Kontext](https://comfyanonymous.github.io/ComfyUI_examples/flux/#flux-kontext-image-editing-model)
      - [HiDream E1.1](https://comfyanonymous.github.io/ComfyUI_examples/hidream/#hidream-e11)
      - [Qwen Image Edit](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/#edit-model)
    - 動画モデル
      - [Stable Video Diffusion](https://comfyanonymous.github.io/ComfyUI_examples/video/)
      - [Mochi](https://comfyanonymous.github.io/ComfyUI_examples/mochi/)
      - [LTX-Video](https://comfyanonymous.github.io/ComfyUI_examples/ltxv/)
      - [Hunyuan Video](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_video/)
      - [Wan 2.1](https://comfyanonymous.github.io/ComfyUI_examples/wan/)
      - [Wan 2.2](https://comfyanonymous.github.io/ComfyUI_examples/wan22/)
      - [Hunyuan Video 1.5](https://docs.comfy.org/tutorials/video/hunyuan/hunyuan-video-1-5)
    - 音声モデル
      - [Stable Audio](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
      - [ACE Step](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
    - 3D モデル
      - [Hunyuan3D 2.0](https://docs.comfy.org/tutorials/3d/hunyuan3D-2)
    - 非同期キューシステム
    - 多数の最適化：実行間で変化したワークフロー部分のみを再実行。
    - スマートメモリ管理：スマートオフロードにより、1GB VRAM の GPU でも大規模モデルを自動実行可能。
    - GPU がなくても動作：```--cpu```（低速）
    - ckpt と safetensors を読み込み可能：オールインワンチェックポイント、または独立した拡散モデル、VAE、CLIP モデル。
    - ckpt、pt、pth などのファイルを安全に読み込み。
    - Embeddings／テキスト反転
    - [Loras（regular、locon、loha）](https://comfyanonymous.github.io/ComfyUI_examples/lora/)
    - [Hypernetworks](https://comfyanonymous.github.io/ComfyUI_examples/hypernetworks/)
    - 生成された PNG、WebP、FLAC ファイルから（シード付きの）完全なワークフローを読み込み。
    - ワークフローを JSON ファイルとして保存／読み込み。
    - ノードインターフェースで [Hires fix](https://comfyanonymous.github.io/ComfyUI_examples/2_pass_txt2img/) などの複雑なワークフローや、さらに高度なものを作成可能。
    - [Area Composition](https://comfyanonymous.github.io/ComfyUI_examples/area_composition/)
    - 通常モデルとインペイントモデルの両方で [Inpainting](https://comfyanonymous.github.io/ComfyUI_examples/inpaint/)
    - [ControlNet と T2I-Adapter](https://comfyanonymous.github.io/ComfyUI_examples/controlnet/)
    - [アップスケールモデル（ESRGAN、ESRGAN 派生、SwinIR、Swin2SR など）](https://comfyanonymous.github.io/ComfyUI_examples/upscale_models/)
    - [GLIGEN](https://comfyanonymous.github.io/ComfyUI_examples/gligen/)
    - [Model Merging](https://comfyanonymous.github.io/ComfyUI_examples/model_merging/)
    - [LCM モデルと Loras](https://comfyanonymous.github.io/ComfyUI_examples/lcm/)
    - [TAESD](#how-to-show-high-quality-previews) による latent プレビュー
    - 完全オフライン動作：必要でない限りコアは何もダウンロードしません。
    - オンライン [Comfy API](https://docs.comfy.org/tutorials/api-nodes/overview) 経由で外部プロバイダーの有料モデルを使うオプション API ノード。無効化：`--disable-api-nodes`
    - モデル検索パスを設定する [設定ファイル](extra_model_paths.yaml.example)

    ワークフロー例は [Examples ページ](https://comfyanonymous.github.io/ComfyUI_examples/) を参照

  upgradeDescription: |
    ComfyUI をバージョン 0.26.0 へアップグレード

    主な変更点：
    - **[新モデル対応]** Qwen3-VL テキスト生成、SCAIL-2 マルチリファレンス、Krea2、Boogu-Image、Bernini-R（Wan Video）、Depth Anything 3 のサポートを追加；パートナー API ノードを Kling V3-Turbo、Luma Rays 3.2、HappyHorse 1.1 で更新
    - **[3D 強化]** 新ノード `Load3DAdvanced`、`PreviewGaussianSplat`、`PreviewPointCloud`；`Load3D` が output/temp パスを受付；3D プレビューノードの入出力を整理
    - **[動画＆音声]** 音声ノードを統合 `SaveAudioAdvanced` に集約；10-bit 動画出力を追加；非アライン幅の動画デコードにおける非決定的クラッシュとエッジブリードを修正；`SaveWEBM` がアルファチャンネル保存に対応
    - **[メモリ＆性能]** 新起動フラグ `--high-ram`；動的 VRAM 管理を `--reserve-vram` / `--vram-headroom` で強化；CUDA 130+ で `cuda malloc` を自動有効化；LTX2 モデルにコンテキストウィンドウサンプリングを追加
    - **[API＆バックエンド]** ジョブキャンセル用エンドポイント（`POST /api/jobs/{job_id}/cancel`）を追加；Assets API にカーソルベースページネーションと `job_ids` フィルタ；CLI フラグ `--enable-telemetry` と診断オプション `--debug-hang` を追加
    - **[ノード＆ワークフロー]** 新 `Color` プリミティブノード；Save ノードが出力ソケットを公開；複数ノードの改名・再分類；Qwen3-VL を Flux2 Klein テキストエンコーダとして利用可能
    - **[セキュリティ＆安定性]** 学習データセットシャードを `weights_only=True` で読み込み；Ideogram fp8 クラッシュ、Flux KV キャッシュ分割バッチクラッシュ、画像グリッド描画バグを修正

    完全なリリースノート：https://github.com/Comfy-Org/ComfyUI/releases/tag/v0.26.0

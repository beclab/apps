metadata:
  title: ComfyUI Shared
  description: La GUI y el backend de Stable Diffusion más potentes y modulares
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una versión compartida de ComfyUI. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el administrador de Olares.

    **RESUMEN**
    La GUI y el backend de Stable Diffusion más potentes y modulares.
    Esta interfaz le permite diseñar y ejecutar pipelines avanzados de Stable Diffusion mediante una interfaz basada en grafos/nodos/diagramas de flujo.

    **Funciones**

    - Interfaz de nodos/grafo/diagrama de flujo para experimentar y crear flujos de trabajo complejos de Stable Diffusion sin programar.
    - NOTA: Se admiten muchos más modelos de los listados abajo; para ver lo compatible, consulte la lista de plantillas dentro de ComfyUI.
    - Modelos de imagen
      - SD1.x, SD2.x ([unCLIP](https://comfyanonymous.github.io/ComfyUI_examples/unclip/))
      - [SDXL](https://comfyanonymous.github.io/ComfyUI_examples/sdxl/), [SDXL Turbo](https://comfyanonymous.github.io/ComfyUI_examples/sdturbo/)
      - [Stable Cascade](https://comfyanonymous.github.io/ComfyUI_examples/stable_cascade/)
      - [SD3 and SD3.5](https://comfyanonymous.github.io/ComfyUI_examples/sd3/)
      - Pixart Alpha and Sigma
      - [AuraFlow](https://comfyanonymous.github.io/ComfyUI_examples/aura_flow/)
      - [HunyuanDiT](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_dit/)
      - [Flux](https://comfyanonymous.github.io/ComfyUI_examples/flux/)
      - [Lumina Image 2.0](https://comfyanonymous.github.io/ComfyUI_examples/lumina2/)
      - [HiDream](https://comfyanonymous.github.io/ComfyUI_examples/hidream/)
      - [Qwen Image](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/)
      - [Hunyuan Image 2.1](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_image/)
      - [Flux 2](https://comfyanonymous.github.io/ComfyUI_examples/flux2/)
      - [Z Image](https://comfyanonymous.github.io/ComfyUI_examples/z_image/)
    - Modelos de edición de imagen
      - [Omnigen 2](https://comfyanonymous.github.io/ComfyUI_examples/omnigen/)
      - [Flux Kontext](https://comfyanonymous.github.io/ComfyUI_examples/flux/#flux-kontext-image-editing-model)
      - [HiDream E1.1](https://comfyanonymous.github.io/ComfyUI_examples/hidream/#hidream-e11)
      - [Qwen Image Edit](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/#edit-model)
    - Modelos de vídeo
      - [Stable Video Diffusion](https://comfyanonymous.github.io/ComfyUI_examples/video/)
      - [Mochi](https://comfyanonymous.github.io/ComfyUI_examples/mochi/)
      - [LTX-Video](https://comfyanonymous.github.io/ComfyUI_examples/ltxv/)
      - [Hunyuan Video](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_video/)
      - [Wan 2.1](https://comfyanonymous.github.io/ComfyUI_examples/wan/)
      - [Wan 2.2](https://comfyanonymous.github.io/ComfyUI_examples/wan22/)
      - [Hunyuan Video 1.5](https://docs.comfy.org/tutorials/video/hunyuan/hunyuan-video-1-5)
    - Modelos de audio
      - [Stable Audio](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
      - [ACE Step](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
    - Modelos 3D
      - [Hunyuan3D 2.0](https://docs.comfy.org/tutorials/3d/hunyuan3D-2)
    - Sistema de cola asíncrona
    - Muchas optimizaciones: solo vuelve a ejecutar las partes del flujo de trabajo que cambian entre ejecuciones.
    - Gestión inteligente de memoria: puede ejecutar automáticamente modelos grandes en GPUs con tan solo 1 GB de VRAM mediante descarga inteligente.
    - Funciona aunque no tenga GPU con: ```--cpu``` (lento)
    - Puede cargar ckpt y safetensors: checkpoints todo en uno o modelos de difusión independientes, VAEs y modelos CLIP.
    - Carga segura de archivos ckpt, pt, pth, etc.
    - Embeddings/inversión textual
    - [Loras (regular, locon y loha)](https://comfyanonymous.github.io/ComfyUI_examples/lora/)
    - [Hypernetworks](https://comfyanonymous.github.io/ComfyUI_examples/hypernetworks/)
    - Carga de flujos de trabajo completos (con seeds) desde archivos PNG, WebP y FLAC generados.
    - Guardado/carga de flujos de trabajo como archivos JSON.
    - La interfaz de nodos puede crear flujos complejos como [Hires fix](https://comfyanonymous.github.io/ComfyUI_examples/2_pass_txt2img/) u otros mucho más avanzados.
    - [Area Composition](https://comfyanonymous.github.io/ComfyUI_examples/area_composition/)
    - [Inpainting](https://comfyanonymous.github.io/ComfyUI_examples/inpaint/) con modelos normales y de inpainting.
    - [ControlNet y T2I-Adapter](https://comfyanonymous.github.io/ComfyUI_examples/controlnet/)
    - [Modelos de upscale (ESRGAN, variantes ESRGAN, SwinIR, Swin2SR, etc.)](https://comfyanonymous.github.io/ComfyUI_examples/upscale_models/)
    - [GLIGEN](https://comfyanonymous.github.io/ComfyUI_examples/gligen/)
    - [Model Merging](https://comfyanonymous.github.io/ComfyUI_examples/model_merging/)
    - [Modelos LCM y Loras](https://comfyanonymous.github.io/ComfyUI_examples/lcm/)
    - Vistas previas latentes con [TAESD](#how-to-show-high-quality-previews)
    - Funciona totalmente sin conexión: el núcleo nunca descarga nada a menos que usted lo desee.
    - Nodos API opcionales para usar modelos de pago de proveedores externos a través de la [Comfy API](https://docs.comfy.org/tutorials/api-nodes/overview) en línea; desactivar con: `--disable-api-nodes`
    - [Archivo de configuración](extra_model_paths.yaml.example) para definir las rutas de búsqueda de modelos.

    Ejemplos de flujos de trabajo en la [página de Examples](https://comfyanonymous.github.io/ComfyUI_examples/)

  upgradeDescription: |
    Actualización de ComfyUI a la versión 0.26.0

    Cambios clave:
    - **[Nuevo soporte de modelos]** Añadido soporte para generación de texto Qwen3-VL, SCAIL-2 multi-referencia, Krea2, Boogu-Image, Bernini-R (Wan Video) y Depth Anything 3; nodos API de partners actualizados con Kling V3-Turbo, Luma Rays 3.2 y HappyHorse 1.1
    - **[Mejoras 3D]** Nuevos nodos `Load3DAdvanced`, `PreviewGaussianSplat` y `PreviewPointCloud`; `Load3D` ahora acepta rutas de salida/temp; entradas y salidas de nodos de vista previa 3D reordenadas
    - **[Vídeo y audio]** Nodos de audio consolidados en un nodo unificado `SaveAudioAdvanced`; añadido soporte de salida de vídeo de 10 bits; corregidos crash no determinista y edge bleed en decodificación de vídeo con ancho no alineado; `SaveWEBM` ahora admite guardar el canal alfa
    - **[Memoria y rendimiento]** Nuevo flag de arranque `--high-ram`; gestión dinámica de VRAM mejorada con `--reserve-vram` / `--vram-headroom`; `cuda malloc` activado automáticamente en CUDA 130+; modelos LTX2 ganan muestreo de ventana de contexto
    - **[API y backend]** Nuevos endpoints de cancelación de trabajos (`POST /api/jobs/{job_id}/cancel`); Assets API gana paginación por cursor y filtro `job_ids`; nuevo flag CLI `--enable-telemetry` y opción de diagnóstico `--debug-hang`
    - **[Nodos y flujo de trabajo]** Nuevo nodo primitivo `Color`; los nodos Save ahora exponen sockets de salida; varios nodos renombrados y recategorizados; Qwen3-VL puede usarse como codificador de texto Flux2 Klein
    - **[Seguridad y estabilidad]** Los shards del dataset de entrenamiento se cargan ahora con `weights_only=True`; corregidos crash de Ideogram fp8, crash de Flux KV cache split-batch y bug de renderizado de cuadrícula de imágenes

    Notas de la versión completas en: https://github.com/Comfy-Org/ComfyUI/releases/tag/v0.26.0

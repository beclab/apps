metadata:
  title: ComfyUI Shared
  description: La GUI e il backend di Stable Diffusion più potenti e modulari
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è una versione condivisa di ComfyUI. Nell'intero sistema Olares verrà installato un solo servizio. Tuttavia, ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall'amministratore Olares.

    **PANORAMICA**
    La GUI e il backend di Stable Diffusion più potenti e modulari.
    Questa interfaccia consente di progettare ed eseguire pipeline avanzate di Stable Diffusion con un'interfaccia basata su grafi/nodi/flowchart.

    **Funzionalità**

    - Interfaccia nodi/grafo/flowchart per sperimentare e creare workflow complessi di Stable Diffusion senza scrivere codice.
    - NOTA: Sono supportati molti più modelli di quelli elencati sotto; per vedere cosa è supportato consultate l'elenco dei template in ComfyUI.
    - Modelli immagine
      - SD1.x, SD2.x ([unCLIP](https://comfyanonymous.github.io/ComfyUI_examples/unclip/))
      - [SDXL](https://comfyanonymous.github.io/ComfyUI_examples/sdxl/), [SDXL Turbo](https://comfyanonymous.github.io/ComfyUI_examples/sdturbo/)
      - [Stable Cascade](https://comfyanonymous.github.io/ComfyUI_examples/stable_cascade/)
      - [SD3 and SD3.5](https://comfyanonymous.github.io/ComfyUI_examples/sd3/)
      - Pixart Alpha and Sigma
      - [AuraFlow](https://comfyanonymous.github.io/ComfyUI_examples/aura_flow/)
      - [HunyuanDiT](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_dit/)
      - [Flux](https://comfyanonymous.github.io/ComfyUI_examples/flux/)
      - [Lumina Image 2.0](https://comfyanonymous.github.io/ComfyUI_examples/lumina2/)
      - [HiDream](https://comfyanonymous.github.io/ComfyUI_examples/hidream/)
      - [Qwen Image](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/)
      - [Hunyuan Image 2.1](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_image/)
      - [Flux 2](https://comfyanonymous.github.io/ComfyUI_examples/flux2/)
      - [Z Image](https://comfyanonymous.github.io/ComfyUI_examples/z_image/)
    - Modelli di editing immagine
      - [Omnigen 2](https://comfyanonymous.github.io/ComfyUI_examples/omnigen/)
      - [Flux Kontext](https://comfyanonymous.github.io/ComfyUI_examples/flux/#flux-kontext-image-editing-model)
      - [HiDream E1.1](https://comfyanonymous.github.io/ComfyUI_examples/hidream/#hidream-e11)
      - [Qwen Image Edit](https://comfyanonymous.github.io/ComfyUI_examples/qwen_image/#edit-model)
    - Modelli video
      - [Stable Video Diffusion](https://comfyanonymous.github.io/ComfyUI_examples/video/)
      - [Mochi](https://comfyanonymous.github.io/ComfyUI_examples/mochi/)
      - [LTX-Video](https://comfyanonymous.github.io/ComfyUI_examples/ltxv/)
      - [Hunyuan Video](https://comfyanonymous.github.io/ComfyUI_examples/hunyuan_video/)
      - [Wan 2.1](https://comfyanonymous.github.io/ComfyUI_examples/wan/)
      - [Wan 2.2](https://comfyanonymous.github.io/ComfyUI_examples/wan22/)
      - [Hunyuan Video 1.5](https://docs.comfy.org/tutorials/video/hunyuan/hunyuan-video-1-5)
    - Modelli audio
      - [Stable Audio](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
      - [ACE Step](https://comfyanonymous.github.io/ComfyUI_examples/audio/)
    - Modelli 3D
      - [Hunyuan3D 2.0](https://docs.comfy.org/tutorials/3d/hunyuan3D-2)
    - Sistema di coda asincrono
    - Molte ottimizzazioni: riesegue solo le parti del workflow che cambiano tra un'esecuzione e l'altra.
    - Gestione intelligente della memoria: può eseguire automaticamente modelli grandi su GPU con solo 1 GB di VRAM con offloading intelligente.
    - Funziona anche senza GPU con: ```--cpu``` (lento)
    - Può caricare ckpt e safetensors: checkpoint tutto-in-uno o modelli di diffusione standalone, VAE e modelli CLIP.
    - Caricamento sicuro di file ckpt, pt, pth, ecc.
    - Embeddings/inversione testuale
    - [Loras (regular, locon e loha)](https://comfyanonymous.github.io/ComfyUI_examples/lora/)
    - [Hypernetworks](https://comfyanonymous.github.io/ComfyUI_examples/hypernetworks/)
    - Caricamento di workflow completi (con seed) da file PNG, WebP e FLAC generati.
    - Salvataggio/caricamento di workflow come file JSON.
    - L'interfaccia a nodi può creare workflow complessi come [Hires fix](https://comfyanonymous.github.io/ComfyUI_examples/2_pass_txt2img/) o altri molto più avanzati.
    - [Area Composition](https://comfyanonymous.github.io/ComfyUI_examples/area_composition/)
    - [Inpainting](https://comfyanonymous.github.io/ComfyUI_examples/inpaint/) con modelli normali e di inpainting.
    - [ControlNet e T2I-Adapter](https://comfyanonymous.github.io/ComfyUI_examples/controlnet/)
    - [Modelli di upscale (ESRGAN, varianti ESRGAN, SwinIR, Swin2SR, ecc.)](https://comfyanonymous.github.io/ComfyUI_examples/upscale_models/)
    - [GLIGEN](https://comfyanonymous.github.io/ComfyUI_examples/gligen/)
    - [Model Merging](https://comfyanonymous.github.io/ComfyUI_examples/model_merging/)
    - [Modelli LCM e Loras](https://comfyanonymous.github.io/ComfyUI_examples/lcm/)
    - Anteprime latenti con [TAESD](#how-to-show-high-quality-previews)
    - Funziona completamente offline: il core non scarica mai nulla a meno che non lo vogliate.
    - Nodi API opzionali per usare modelli a pagamento di provider esterni tramite la [Comfy API](https://docs.comfy.org/tutorials/api-nodes/overview) online; disabilitare con: `--disable-api-nodes`
    - [File di configurazione](extra_model_paths.yaml.example) per impostare i percorsi di ricerca dei modelli.

    Esempi di workflow nella [pagina Examples](https://comfyanonymous.github.io/ComfyUI_examples/)

  upgradeDescription: |
    Aggiornamento di ComfyUI alla versione 0.26.0

    Modifiche principali:
    - **[Nuovo supporto modelli]** Aggiunto supporto per generazione testo Qwen3-VL, SCAIL-2 multi-reference, Krea2, Boogu-Image, Bernini-R (Wan Video) e Depth Anything 3; nodi API partner aggiornati con Kling V3-Turbo, Luma Rays 3.2 e HappyHorse 1.1
    - **[Miglioramenti 3D]** Nuovi nodi `Load3DAdvanced`, `PreviewGaussianSplat` e `PreviewPointCloud`; `Load3D` ora accetta percorsi output/temp; input e output dei nodi di anteprima 3D riordinati
    - **[Video e audio]** Nodi audio consolidati in un unico nodo `SaveAudioAdvanced`; aggiunto supporto output video a 10 bit; corretti crash non deterministico e edge bleed nella decodifica video con larghezza non allineata; `SaveWEBM` ora supporta il salvataggio del canale alpha
    - **[Memoria e prestazioni]** Nuovo flag di avvio `--high-ram`; gestione VRAM dinamica aggiornata con `--reserve-vram` / `--vram-headroom`; `cuda malloc` abilitato automaticamente su CUDA 130+; i modelli LTX2 guadagnano il campionamento della context window
    - **[API e backend]** Nuovi endpoint di annullamento job (`POST /api/jobs/{job_id}/cancel`); Assets API guadagna paginazione basata su cursor e filtro `job_ids`; nuovo flag CLI `--enable-telemetry` e opzione diagnostica `--debug-hang`
    - **[Nodi e workflow]** Nuovo nodo primitivo `Color`; i nodi Save espongono ora socket di output; diversi nodi rinominati e ricategorizzati; Qwen3-VL può essere usato come text encoder Flux2 Klein
    - **[Sicurezza e stabilità]** Gli shard del dataset di training vengono ora caricati con `weights_only=True`; corretti crash Ideogram fp8, crash Flux KV cache split-batch e bug di rendering della griglia immagini

    Note di rilascio complete su: https://github.com/Comfy-Org/ComfyUI/releases/tag/v0.26.0


apiVersion: v1
data:
  nginx.conf: |
      server {
        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        listen 8080;
        access_log /dev/stdout;
        error_log /dev/stderr;

        proxy_connect_timeout                          30s;
        proxy_send_timeout                             60s;
        proxy_read_timeout                             300s;
        proxy_set_header      host                      $host;
        proxy_set_header      x-forwarded-host          $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-BFL-USER {{ .Values.bfl.username}};

        proxy_http_version 1.1;

        proxy_set_header upgrade $http_upgrade;
        proxy_set_header connection "upgrade";

        location / {
            resolver coredns.kube-system.svc.cluster.local valid=10s;
            proxy_pass http://comfyui.comfyuisharev2server-shared:8190;
            add_header X-Frame-Options "";
            proxy_next_upstream error timeout http_502 http_503 http_504 http_403;
            proxy_next_upstream_tries 3;
        }
      }

      server {

        client_body_temp_path /tmp/client_body;

        proxy_temp_path /tmp/proxy;

        fastcgi_temp_path /tmp/fastcgi;

        uwsgi_temp_path /tmp/uwsgi;

        scgi_temp_path /tmp/scgi;
        listen 8081;
        access_log /dev/stdout;
        error_log /dev/stderr;

        proxy_connect_timeout                          30s;
        proxy_send_timeout                             60s;
        proxy_read_timeout                             300s;
        proxy_set_header      host                      $host;
        proxy_set_header      x-forwarded-host          $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-BFL-USER {{ .Values.bfl.username}};

        proxy_http_version 1.1;

        proxy_set_header upgrade $http_upgrade;
        proxy_set_header connection "upgrade";

        location /api {
            resolver coredns.kube-system.svc.cluster.local valid=10s;
            proxy_pass http://comfyui.comfyuisharev2server-shared:3000;
            add_header X-Frame-Options "";
            proxy_next_upstream error timeout http_502 http_503 http_504 http_403;
            proxy_next_upstream_tries 3;
        }

        location / {
            resolver coredns.kube-system.svc.cluster.local valid=10s;
            proxy_pass http://comfyui.comfyuisharev2server-shared:8080;
            add_header X-Frame-Options "";
            proxy_next_upstream error timeout http_502 http_503 http_504 http_403;
            proxy_next_upstream_tries 3;
        }
      }

      server {

        client_body_temp_path /tmp/client_body;

        proxy_temp_path /tmp/proxy;

        fastcgi_temp_path /tmp/fastcgi;

        uwsgi_temp_path /tmp/uwsgi;

        scgi_temp_path /tmp/scgi;
        listen 8082;
        access_log /dev/stdout;
        error_log /dev/stderr;

        proxy_connect_timeout                          30s;
        proxy_send_timeout                             60s;
        proxy_read_timeout                             300s;
        proxy_set_header      host                      $host;
        proxy_set_header      x-forwarded-host          $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-BFL-USER {{ .Values.bfl.username}};

        proxy_http_version 1.1;

        proxy_set_header upgrade $http_upgrade;
        proxy_set_header connection "upgrade";

        location / {
            resolver coredns.kube-system.svc.cluster.local valid=10s;
            proxy_pass http://comfyui.comfyuisharev2server-shared:3000;
            add_header X-Frame-Options "";
            proxy_next_upstream error timeout http_502 http_503 http_504 http_403;
            proxy_next_upstream_tries 3;
        }
      }

kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: comfyuientrance
  name: {{ .Release.Name }}
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: comfyuientrance
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: comfyuientrance
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8081
              protocol: TCP
            - containerPort: 8082
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            timeoutSeconds: 30
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty

---
apiVersion: v1
kind: Service
metadata:
  name: comfyuientrance
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: comfyuientrance
  ports:
    - name: comfyuientrance
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: comfyuilauncherweb
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: comfyuilauncherserver
      protocol: TCP
      port: 8082
      targetPort: 8082


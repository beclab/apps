metadata:
  title: Directus
  description: Una plataforma de datos componible para crear su CMS headless, BaaS y más
spec:
  fullDescription: |
    Directus convierte su BD en un CMS headless, paneles de administración o apps con UI personalizada, APIs instantáneas, auth y más.

    Directus es una API en tiempo real y un panel de aplicaciones para gestionar contenido de bases de datos SQL.
    - API REST y GraphQL. Capa al instante una API Node.js ultrarrápida sobre cualquier base SQL.
    - Gestionar SQL puro. Funciona con bases nuevas o existentes, sin migración.
    - Elija su base de datos. Compatible con PostgreSQL, MySQL, SQLite, OracleDB, CockroachDB, MariaDB y MS-SQL.
    - On-prem o cloud. Ejecute en local, instale on-premises o use nuestro servicio Cloud de autoservicio.
    - Totalmente extensible. Pensado para white-label; es fácil personalizar la plataforma modular.
    - Panel moderno. Nuestra app Vue.js sin código es segura e intuitiva para usuarios no técnicos, sin formación.

    **Características principales**
    Automatizar: Automatice flujos, dispare acciones y conecte sus herramientas. Flujos potentes sin escribir código.

    Extender: Extienda y personalice cada parte de Directus. Desde interfaces a medida hasta flujos complejos, ajústelo a su equipo.

    Personalizar: Ofrezca una experiencia totalmente de marca a su equipo o clientes. Adapte la interfaz a su marca.

    Visualizar: Cree paneles a medida con visibilidad en tiempo real de lo importante. Siga métricas, detecte tendencias y decida más rápido.

  upgradeDescription: |
    v1.0.26: Actualización a la imagen oficial `directus/directus:12.3.1`. Chown de subidas en appData a uid 1000 para que File Library pueda escribir. Aumentar cuota de disco. Confiar en el proxy inverso de Olares (`IP_TRUST_PROXY=true`).

    Cambios incompatibles de Directus 12 (léalos antes de actualizar):
    - Aplicación de licencia: nivel Core por defecto; SSO y reglas de política personalizadas requieren licencia tras un período de gracia de 30 días en actualizaciones.
    - WYSIWYG es Tiptap; `tinymceOverrides` de TinyMCE ya no aplican.
    - Se eliminan `/utils/hash/generate` y `/utils/hash/verify`.
    - Flow Update/Delete Items ya no apunta a todos los ítems cuando la consulta está vacía.
    - Las conexiones WebSocket respetan `CORS_ORIGIN`. La imagen Docker ya no incluye npm/npx.

    12.3.1: fragmentos GraphQL, fuga de heartbeat WebSocket, correo de registro público, breadcrumbs MCP OAuth.

    Véase https://github.com/directus/directus/releases/tag/v12.3.1 y https://directus.com/docs/releases/breaking-changes/version-12

metadata:
  title: Directus
  description: Eine zusammensetzbare Datenplattform für Headless CMS, BaaS und mehr
spec:
  fullDescription: |
    Directus macht Ihre DB zu einem Headless CMS, Admin-Panels oder Apps mit eigener UI, sofortigen APIs, Auth und mehr.

    Directus ist eine Echtzeit-API und ein App-Dashboard zur Verwaltung von SQL-Datenbankinhalten.
    - REST- & GraphQL-API. Legt sofort eine blitzschnelle Node.js-API über jede SQL-Datenbank.
    - Reines SQL verwalten. Funktioniert mit neuen oder bestehenden SQL-Datenbanken, ohne Migration.
    - Datenbank wählen. Unterstützt PostgreSQL, MySQL, SQLite, OracleDB, CockroachDB, MariaDB und MS-SQL.
    - On-Prem oder Cloud. Lokal betreiben, on-premises installieren oder unseren Self-Service-Cloud-Dienst nutzen.
    - Vollständig erweiterbar. Für White-Label gebaut — die modulare Plattform lässt sich leicht anpassen.
    - Modernes Dashboard. Unsere No-Code-Vue.js-App ist sicher und intuitiv für nicht-technische Nutzer, ohne Schulung.

    **Hauptfunktionen**
    Automatisieren: Workflows automatisieren, Aktionen auslösen und Tools verbinden. Leistungsstarke Automationen ohne eine Zeile Code.

    Erweitern: Jeden Teil von Directus erweitern und anpassen. Von eigenen Interfaces bis zu komplexen Workflows — genau so, wie Ihr Team es braucht.

    Anpassen: Ein vollständig gebrandetes Erlebnis für Team oder Kunden. Die Oberfläche an Ihre Marke anpassen.

    Visualisieren: Eigene Dashboards für Echtzeit-Einblick in das Wesentliche. Kennzahlen verfolgen, Trends erkennen und schneller bessere Entscheidungen treffen.

  upgradeDescription: |
    v1.0.26: Upgrade auf offizielles `directus/directus:12.3.1`. Chown der appData-Uploads auf uid 1000, damit File-Library-Schreibvorgänge gelingen. Disk-Quota erhöhen. Olares-Reverse-Proxy vertrauen (`IP_TRUST_PROXY=true`).

    Breaking Changes in Directus 12 (vor dem Upgrade lesen):
    - Lizenzdurchsetzung: Standardmäßig Core-Tier; SSO und eigene Policy-Regeln brauchen nach einer 30-tägigen Schonfrist bei Upgrades eine Lizenz.
    - WYSIWYG ist Tiptap; TinyMCE-`tinymceOverrides` gelten nicht mehr.
    - `/utils/hash/generate` und `/utils/hash/verify` wurden entfernt.
    - Flow Update/Delete Items zielen nicht mehr auf alle Items, wenn die Query leer ist.
    - WebSocket-Verbindungen respektieren `CORS_ORIGIN`. Das Docker-Image enthält kein npm/npx mehr.

    12.3.1: GraphQL-Fragmente, WebSocket-Heartbeat-Leak, öffentliche Registrierungs-E-Mail, MCP-OAuth-Breadcrumbs.

    Siehe https://github.com/directus/directus/releases/tag/v12.3.1 und https://directus.com/docs/releases/breaking-changes/version-12

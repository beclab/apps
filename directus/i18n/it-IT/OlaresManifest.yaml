metadata:
  title: Directus
  description: Una piattaforma dati componibile per creare il tuo Headless CMS, BaaS e altro
spec:
  fullDescription: |
    Directus trasforma il tuo DB in un CMS headless, pannelli admin o app con UI personalizzata, API istantanee, auth e altro.

    Directus è un'API in tempo reale e una dashboard di app per gestire contenuti di database SQL.
    - API REST e GraphQL. Aggiunge subito un'API Node.js velocissima su qualsiasi database SQL.
    - Gestisci SQL puro. Funziona con database nuovi o esistenti, senza migrazione.
    - Scegli il database. Supporta PostgreSQL, MySQL, SQLite, OracleDB, CockroachDB, MariaDB e MS-SQL.
    - On-prem o cloud. Esegui in locale, installa on-premises o usa il nostro Cloud self-service.
    - Completamente estensibile. Pensato per white-label; è facile personalizzare la piattaforma modulare.
    - Dashboard moderna. La nostra app Vue.js no-code è sicura e intuitiva per utenti non tecnici, senza formazione.

    **Funzionalità principali**
    Automatizzare: Automatizza workflow, attiva azioni e collega i tuoi strumenti. Flussi potenti senza scrivere codice.

    Estendere: Estendi e personalizza ogni parte di Directus. Da interfacce custom a workflow complessi, adattalo al team.

    Personalizzare: Offri un'esperienza completamente brandizzata al team o ai clienti. Adatta l'interfaccia al tuo brand.

    Visualizzare: Crea dashboard personalizzate con visibilità in tempo reale su ciò che conta. Monitora metriche, individua trend e decidi più in fretta.

  upgradeDescription: |
    v1.0.26: Upgrade all'immagine ufficiale `directus/directus:12.3.1`. Chown degli upload in appData a uid 1000 così File Library può scrivere. Aumentare la quota disco. Fidarsi del reverse proxy Olares (`IP_TRUST_PROXY=true`).

    Breaking change di Directus 12 (leggere prima dell'upgrade):
    - Enforcement della licenza: tier Core di default; SSO e regole di policy personalizzate richiedono una licenza dopo 30 giorni di grazia sugli upgrade.
    - WYSIWYG è Tiptap; `tinymceOverrides` di TinyMCE non si applicano più.
    - Rimossi `/utils/hash/generate` e `/utils/hash/verify`.
    - Flow Update/Delete Items non punta più a tutti gli item quando la query è vuota.
    - Le connessioni WebSocket rispettano `CORS_ORIGIN`. L'immagine Docker non include più npm/npx.

    12.3.1: frammenti GraphQL, leak heartbeat WebSocket, email di registrazione pubblica, breadcrumb MCP OAuth.

    Vedi https://github.com/directus/directus/releases/tag/v12.3.1 e https://directus.com/docs/releases/breaking-changes/version-12

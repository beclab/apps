metadata:
  title: Directus
  description: Une plateforme de données composable pour créer votre CMS headless, BaaS et plus
spec:
  fullDescription: |
    Directus transforme votre BD en CMS headless, panneaux d'administration ou apps avec UI personnalisée, API instantanées, auth et plus.

    Directus est une API temps réel et un tableau de bord d'applications pour gérer le contenu de bases SQL.
    - API REST et GraphQL. Ajoute instantanément une API Node.js ultra-rapide sur toute base SQL.
    - Gérer du SQL pur. Fonctionne avec des bases nouvelles ou existantes, sans migration.
    - Choisissez votre base. Prend en charge PostgreSQL, MySQL, SQLite, OracleDB, CockroachDB, MariaDB et MS-SQL.
    - On-prem ou cloud. Exécutez en local, installez on-premises ou utilisez notre Cloud en libre-service.
    - Entièrement extensible. Conçu pour le white-label ; la plateforme modulaire est facile à personnaliser.
    - Tableau de bord moderne. Notre app Vue.js no-code est sûre et intuitive pour les non-techniciens, sans formation.

    **Fonctionnalités clés**
    Automatiser : Automatisez des workflows, déclenchez des actions et connectez vos outils. Des flux puissants sans écrire de code.

    Étendre : Étendez et personnalisez chaque partie de Directus. Des interfaces custom aux workflows complexes, adaptez-le à votre équipe.

    Personnaliser : Offrez une expérience entièrement à votre marque à l'équipe ou aux clients. Adaptez l'interface à votre identité.

    Visualiser : Créez des tableaux de bord sur mesure pour une visibilité en temps réel sur l'essentiel. Suivez les métriques, repérez les tendances et décidez plus vite.

  upgradeDescription: |
    v1.0.26 : Mise à niveau vers l'image officielle `directus/directus:12.3.1`. Chown des uploads appData vers uid 1000 pour que File Library puisse écrire. Augmenter le quota disque. Faire confiance au reverse proxy Olares (`IP_TRUST_PROXY=true`).

    Changements incompatibles Directus 12 (à lire avant la mise à niveau) :
    - Application de licence : niveau Core par défaut ; SSO et règles de politique personnalisées nécessitent une licence après 30 jours de grâce sur les upgrades.
    - WYSIWYG est Tiptap ; les `tinymceOverrides` TinyMCE ne s'appliquent plus.
    - `/utils/hash/generate` et `/utils/hash/verify` sont supprimés.
    - Flow Update/Delete Items ne cible plus tous les éléments lorsque la requête est vide.
    - Les connexions WebSocket respectent `CORS_ORIGIN`. L'image Docker n'inclut plus npm/npx.

    12.3.1 : fragments GraphQL, fuite heartbeat WebSocket, e-mail d'inscription publique, fil d'Ariane MCP OAuth.

    Voir https://github.com/directus/directus/releases/tag/v12.3.1 et https://directus.com/docs/releases/breaking-changes/version-12

metadata:
  title: Directus
  description: ヘッドレス CMS、BaaS などを構築するコンポーザブルなデータプラットフォーム
spec:
  fullDescription: |
    Directus は DB をヘッドレス CMS、管理パネル、カスタム UI のアプリ、即時 API、認証などに変えます。

    Directus は SQL データベースのコンテンツを管理するリアルタイム API とアプリダッシュボードです。
    - REST および GraphQL API。あらゆる SQL データベースの上に高速な Node.js API を即座に重ねます。
    - 純粋な SQL を管理。新規・既存の SQL データベースで動作し、移行は不要です。
    - データベースを選択。PostgreSQL、MySQL、SQLite、OracleDB、CockroachDB、MariaDB、MS-SQL をサポート。
    - オンプレまたはクラウド。ローカル実行、オンプレインストール、またはセルフサービス Cloud を利用。
    - 完全に拡張可能。ホワイトラベル向けに設計され、モジュラーなプラットフォームを簡単にカスタマイズできます。
    - モダンなダッシュボード。ノーコードの Vue.js アプリは非技術者にも安全で直感的で、研修は不要です。

    **主な機能**
    自動化: ワークフローを自動化し、アクションをトリガーし、ツールを接続。コードなしで強力な自動化フローを構築。

    拡張: Directus のあらゆる部分を拡張・カスタマイズ。カスタムインターフェースから複雑なワークフローまで、チームの必要に合わせて。

    カスタマイズ: チームやクライアントに完全ブランド化の体験を提供。インターフェースをブランドに合わせて調整。

    可視化: 重要な指標をリアルタイムで見えるカスタムダッシュボードを構築。メトリクス追跡、トレンド発見、より速い意思決定。

  upgradeDescription: |
    v1.0.26: 公式 `directus/directus:12.3.1` へアップグレード。File Library の書き込みが成功するよう appData アップロードを uid 1000 に chown。ディスククォータを引き上げ。Olares リバースプロキシを信頼（`IP_TRUST_PROXY=true`）。

    Directus 12 の破壊的変更（アップグレード前に確認）:
    - ライセンス強制: デフォルトは Core ティア; SSO とカスタムポリシールールはアップグレード後 30 日の猶予のあとライセンスが必要。
    - WYSIWYG は Tiptap; TinyMCE の `tinymceOverrides` は無効。
    - `/utils/hash/generate` と `/utils/hash/verify` を削除。
    - Flow の Update/Delete Items はクエリが空のとき全アイテムを対象にしなくなりました。
    - WebSocket 接続は `CORS_ORIGIN` に従います。Docker イメージに npm/npx は含まれません。

    12.3.1: GraphQL フラグメント、WebSocket ハートビートリーク、公開登録メール、MCP OAuth パンくず。

    参照: https://github.com/directus/directus/releases/tag/v12.3.1 および https://directus.com/docs/releases/breaking-changes/version-12

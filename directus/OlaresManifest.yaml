olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  directus: 1
  directus-redis: 1
metadata:
  name: directus
  description: A composable data platform to build your Headless CMS, BaaS, and more.
  icon: https://app.cdn.olares.com/appstore/directus/icon.png
  appid: directus
  version: '1.0.27'
  title: Directus
  categories:
  - Developer Tools
  - workspace
  - developer
  tags:
  - data

permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '12.3.1'
  featuredImage: https://app.cdn.olares.com/appstore/directus/1.jpg
  promoteImage:
  - https://app.cdn.olares.com/appstore/directus/1.jpg
  - https://app.cdn.olares.com/appstore/directus/2.jpg
  - https://app.cdn.olares.com/appstore/directus/3.jpg    
  - https://app.cdn.olares.com/appstore/directus/4.jpg
  - https://app.cdn.olares.com/appstore/directus/5.jpg
  fullDescription: |
    Directus turns your DB into a headless CMS, admin panels, or apps with a custom UI, instant APIs, auth & more.

    Directus is a real-time API and App dashboard for managing SQL database content.
    - REST & GraphQL API. Instantly layers a blazingly fast Node.js API on top of any SQL database.
    - Manage Pure SQL. Works with new or existing SQL databases, no migration required.
    - Choose your Database. Supports PostgreSQL, MySQL, SQLite, OracleDB, CockroachDB, MariaDB, and MS-SQL.
    - On-Prem or Cloud. Run locally, install on-premises, or use our self-service Cloud service.
    - Completely Extensible. Built to white-label, it is easy to customize our modular platform.
    - A Modern Dashboard. Our no-code Vue.js app is safe and intuitive for non-technical users, no training required.

    **Key Features**
    Automate: Automate workflows, trigger actions, and connect your tools. Build powerful automation flows without writing a line of code.

    Extend: Extend and customize every part of Directus. From custom interfaces to complex workflows, make it work exactly how your team needs.

    Customize: Deliver a fully branded experience to your team or clients. Customize the interface to match your brand perfectly.

    Visualize: Build custom dashboards that give your team real-time visibility into what matters most. Track metrics, spot trends, and make better decisions faster.

  upgradeDescription: |
    v1.0.26: Upgrade to official `directus/directus:12.3.1`. Chown appData uploads to uid 1000 so File Library writes succeed. Raise disk quota. Trust the Olares reverse proxy (`IP_TRUST_PROXY=true`).

    Directus 12 breaking changes (read before upgrade):
    - License enforcement: Core tier by default; SSO and custom policy rules need a license after a 30-day grace period on upgrades.
    - WYSIWYG is Tiptap; TinyMCE `tinymceOverrides` no longer apply.
    - `/utils/hash/generate` and `/utils/hash/verify` are removed.
    - Flow Update/Delete Items no longer target all items when query is empty.
    - WebSocket connections honor `CORS_ORIGIN`. The Docker image no longer includes npm/npx.

    12.3.1: GraphQL fragments, WebSocket heartbeat leak, public registration email, MCP OAuth breadcrumbs.

    See https://github.com/directus/directus/releases/tag/v12.3.1 and https://directus.com/docs/releases/breaking-changes/version-12

  developer: Monospace Inc
  website: https://directus.io/
  sourceCode: https://github.com/directus/directus
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 522Mi
  limitedMemory: 3Gi
  requiredDisk: 1Gi
  limitedDisk: 10Gi
  requiredCpu: 260m
  limitedCpu: 3
  doc: https://docs.directus.io/
  license:
  - text: Business Source License
    url: https://github.com/directus/directus?tab=License-1-ov-file
  supportArch:
  - amd64
  - arm64
  runAsUser: true
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: directus
  port: 8055
  host: directus
  title: Directus
  icon: https://app.cdn.olares.com/appstore/directus/icon.png
  authLevel: internal
  openMethod: window
middleware:
  postgres:
    username: directus
    databases:
    - name: directus
      distributed: false
envs:
  - envName: SECRET
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: 'replace-with-secure-random-value'
  - envName: ADMIN_EMAIL
    type: email
    required: true
    editable: false
  - envName: ADMIN_PASSWORD
    type: password
    required: true
    editable: false
    description: "Password must be at least 6 characters long"
    regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{6,}$'
apiVersion: v1
kind: Secret
metadata:
  name: presenton-app
  namespace: {{ .Release.Namespace | quote }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%v/%s" .Values.postgres.username (.Values.postgres.password | urlquery) .Values.postgres.host .Values.postgres.port .Values.postgres.databases.presenton | quote }}

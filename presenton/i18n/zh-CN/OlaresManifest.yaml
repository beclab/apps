metadata:
  title: Presenton
  description: 使用 AI 创建可编辑的演示文稿并导出 PowerPoint 或 PDF
spec:
  fullDescription: 'Presenton 根据提示词或文档创建演示文稿，支持编辑幻灯片并导出 PowerPoint 或 PDF。选择模板、检查大纲并调整结果后即可导出。


    应用使用 AI Router 的 default-chat 生成文本。本应用关闭图片生成，基础流程无需单独配置图片模型凭证。


    演示文稿记录使用 Olares PostgreSQL。上传文档、素材和导出文件保存在持久应用存储中。本应用固定使用上游 0.9.12-beta 容器镜像，分享前请检查生成内容和排版。'

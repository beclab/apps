olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: presenton
  appid: presenton
  title: Presenton
  description: Create editable presentations with AI and export PowerPoint or PDF
  icon: https://cdn.olares.com/images/2026/10/468a0c71cefe5f675b0a263fc1558627.png
  version: 0.0.8
  categories:
  - Creativity
  - workspace
entrances:
- name: presenton
  host: presenton
  port: 3000
  title: Presenton
  icon: https://cdn.olares.com/images/2026/10/468a0c71cefe5f675b0a263fc1558627.png
  authLevel: private
  openMethod: window
spec:
  versionName: 0.9.12-beta
  developer: Presenton
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  requiredCpu: 300m
  limitedCpu: '4'
  requiredMemory: 1Gi
  limitedMemory: 6Gi
  requiredDisk: 5Gi
  limitedDisk: 20Gi
  locale:
  - en-US
  - zh-CN
  fullDescription: 'Presenton creates presentations from prompts or documents, with
    editable slides and PowerPoint or PDF export. Select a template, review the outline
    and refine the result before exporting.


    The application uses AI Router default-chat for text generation. Image generation
    is disabled in this package, so no separate image-model credentials are needed
    for the basic workflow.


    Presentation records use Olares PostgreSQL. Uploaded documents, assets and exported
    files persist in application storage. This package pins the upstream 0.9.12-beta
    container image by digest; review generated content and layout before sharing.'
  website: https://github.com/presenton/presenton
  sourceCode: https://github.com/presenton/presenton
  license:
  - text: Apache-2.0
    url: https://github.com/presenton/presenton/blob/main/LICENSE
  featuredImage: https://cdn.olares.com/images/2026/10/556f8c7c459dbf6c5a052b197db7cc5c.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/556f8c7c459dbf6c5a052b197db7cc5c.png
  - https://cdn.olares.com/images/2026/10/296da728c3f61d95cd4346928bea9c78.png
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: router
    type: application
    version: '>=1.0.0'
workloadReplicas:
  presenton: 1
middleware:
  postgres:
    username: presenton
    databases:
    - name: presenton

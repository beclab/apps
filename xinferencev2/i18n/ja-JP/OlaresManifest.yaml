metadata:
  title: Xinference
  description: モデルサービングを簡単に
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **概要**
    Xorbits Inference（Xinference）は、言語・音声認識・マルチモーダルモデルのサービング向けに設計された強力で多用途なライブラリです。Xorbits Inference なら、自前モデルや組み込みの最先端モデルをわずか 1 コマンドで簡単にデプロイ・サーブできます。研究者、開発者、データサイエンティストを問わず、最先端 AI モデルの潜在能力を最大限に引き出せます。

    主な機能
    Model Serving Made Easy：大規模言語・音声認識・マルチモーダルモデルのサービングを簡素化。実験・本番向けに 1 コマンドでセットアップとデプロイが可能。

    最先端モデル：組み込みの最先端モデルを 1 コマンドで試せる。Inference は最先端オープンソースモデルへのアクセスを提供！

    異種ハードウェア活用：ggml でハードウェアリソースを最大限活用。GPU と CPU を含む異種ハードウェアをインテリジェントに使い、推論タスクを加速。

    柔軟な API とインタフェース：OpenAI 互換 RESTful API（Function Calling API 含む）、RPC、CLI、WebUI など複数インタフェースでシームレスなモデル管理と対話。

    分散デプロイ：分散デプロイシナリオに優れ、複数デバイス／マシンへの推論分散をシームレスに実現。

    サードパーティライブラリとの組み込み統合：LangChain、LlamaIndex、Dify、Chatbox など人気ライブラリとシームレス連携。

  upgradeDescription: |
    **Xinference v2.0.0 リリースノート**

    **新機能**
    - 複数の新モデルをサポート追加：
      * Qwen3-VL-Embedding-2B/8B（Embedding モデル）
      * Qwen3-VL-Reranker-2B/8B（Reranker モデル）
      * MinerU2.5-2509-1.2B（OCR モデル）
      * GLM-4.6（Large Language Model）
      * Z-Image（画像モデル）
    - 動画 GGUF キャッシュ管理を追加
    - chat_template.jinja テンプレート対応
    - UI 改善：ブラウザロケールをデフォルト言語に、公式サイトとモデルハブへのリンクを追加

    **性能最適化**
    - モデル起動時の 504 タイムアウト解消のため Nginx プロキシタイムアウト設定を拡大
      * proxy_send_timeout: 60s → 3600s
      * proxy_read_timeout: 1800s → 3600s
      * proxy_connect_timeout: 60s → 300s
    - 不要なダウンロードをスキップするよう LLM キャッシュ設定を最適化

    **バグ修正**
    - transformers バージョン互換性問題（< 5.0.0）を修正
    - ダウンロード中のキャッシュマネージャブロック問題を修正
    - 既知の複数問題を修正

    **参考**
    - リリースノート：https://github.com/xorbitsai/inference/releases/tag/v2.0.0

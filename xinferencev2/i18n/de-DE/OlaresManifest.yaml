metadata:
  title: Xinference
  description: Model Serving leicht gemacht
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **ÜBERSICHT**
    Xorbits Inference (Xinference) ist eine leistungsstarke und vielseitige Bibliothek zum Bereitstellen von Sprach-, Spracherkennungs- und multimodalen Modellen. Mit Xorbits Inference können Sie Ihre oder integrierte State-of-the-Art-Modelle mühelos mit nur einem Befehl bereitstellen und servieren. Ob Forscher, Entwickler oder Data Scientist — Xorbits Inference hilft Ihnen, das volle Potenzial modernster KI-Modelle auszuschöpfen.

    Hauptfunktionen
    Model Serving Made Easy: Vereinfachen Sie das Serving großer Sprach-, Spracherkennungs- und multimodaler Modelle. Mit einem einzigen Befehl richten Sie Modelle für Experimente und Produktion ein und stellen sie bereit.

    State-of-the-Art-Modelle: Experimentieren Sie mit integrierten Spitzenmodellen mit einem einzigen Befehl. Inference bietet Zugang zu State-of-the-Art-Open-Source-Modellen!

    Heterogene Hardware-Nutzung: Nutzen Sie Ihre Hardware-Ressourcen mit ggml optimal. Xorbits Inference nutzt heterogene Hardware — inklusive GPUs und CPUs — intelligent, um Inference-Aufgaben zu beschleunigen.

    Flexible API und Interfaces: Mehrere Schnittstellen zur Interaktion mit Ihren Modellen — OpenAI-kompatible RESTful API (inkl. Function Calling API), RPC, CLI und WebUI für nahtloses Modellmanagement und Interaktion.

    Verteilte Bereitstellung: Hervorragend in verteilten Szenarien — nahtlose Verteilung der Modell-Inference über mehrere Geräte oder Maschinen.

    Eingebaute Integration mit Drittanbieter-Bibliotheken: Xorbits Inference integriert sich nahtlos mit beliebten Bibliotheken wie LangChain, LlamaIndex, Dify und Chatbox.

  upgradeDescription: |
    **Xinference v2.0.0 Release Notes**

    **Neue Funktionen**
    - Unterstützung für mehrere neue Modelle hinzugefügt:
      * Qwen3-VL-Embedding-2B/8B (Embedding-Modelle)
      * Qwen3-VL-Reranker-2B/8B (Reranker-Modelle)
      * MinerU2.5-2509-1.2B (OCR-Modell)
      * GLM-4.6 (Large Language Model)
      * Z-Image (Bildmodell)
    - Video-GGUF-Cache-Verwaltung hinzugefügt
    - Unterstützung für chat_template.jinja-Templates
    - UI-Verbesserungen: Browser-Locale als Standardsprache, Links zu offizieller Website und Model Hub hinzugefügt

    **Leistungsoptimierungen**
    - Nginx-Proxy-Timeout-Konfiguration erhöht, um 504-Timeouts beim Starten von Modellen zu beheben
      * proxy_send_timeout: 60s → 3600s
      * proxy_read_timeout: 1800s → 3600s
      * proxy_connect_timeout: 60s → 300s
    - LLM-Cache-Konfiguration optimiert, um unnötige Downloads zu überspringen

    **Bugfixes**
    - Kompatibilitätsproblem mit transformers-Version (< 5.0.0) behoben
    - Blockierendes Problem des Cache Managers während Downloads behoben
    - Mehrere bekannte Probleme behoben

    **Referenzen**
    - Release Notes: https://github.com/xorbitsai/inference/releases/tag/v2.0.0

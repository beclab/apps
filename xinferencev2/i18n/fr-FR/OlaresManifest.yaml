metadata:
  title: Xinference
  description: Le Model Serving simplifié
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **APERÇU**
    Xorbits Inference (Xinference) est une bibliothèque puissante et polyvalente conçue pour servir des modèles de langage, de reconnaissance vocale et multimodaux. Avec Xorbits Inference, vous pouvez déployer et servir vos modèles ou des modèles intégrés de pointe sans effort avec une seule commande. Que vous soyez chercheur, développeur ou data scientist, Xorbits Inference vous permet d'exploiter pleinement le potentiel des modèles d'IA de pointe.

    Fonctionnalités clés
    Model Serving Made Easy : Simplifiez le processus de serving de grands modèles de langage, de reconnaissance vocale et multimodaux. Vous pouvez configurer et déployer vos modèles pour l'expérimentation et la production avec une seule commande.

    Modèles de pointe : Expérimentez avec des modèles intégrés de pointe avec une seule commande. Inference donne accès à des modèles open source de pointe !

    Utilisation de matériel hétérogène : Tirez le meilleur parti de vos ressources matérielles avec ggml. Xorbits Inference utilise intelligemment le matériel hétérogène, y compris GPU et CPU, pour accélérer vos tâches d'inférence.

    API et interfaces flexibles : Offre plusieurs interfaces pour interagir avec vos modèles, prenant en charge une API RESTful compatible OpenAI (y compris Function Calling API), RPC, CLI et WebUI pour une gestion et une interaction fluides.

    Déploiement distribué : Excel dans les scénarios de déploiement distribué, permettant la distribution fluide de l'inférence de modèles sur plusieurs appareils ou machines.

    Intégration intégrée avec des bibliothèques tierces : Xorbits Inference s'intègre de façon transparente avec des bibliothèques populaires dont LangChain, LlamaIndex, Dify et Chatbox.

  upgradeDescription: |
    **Notes de version Xinference v2.0.0**

    **Nouvelles fonctionnalités**
    - Ajout de la prise en charge de plusieurs nouveaux modèles :
      * Qwen3-VL-Embedding-2B/8B (modèles Embedding)
      * Qwen3-VL-Reranker-2B/8B (modèles Reranker)
      * MinerU2.5-2509-1.2B (modèle OCR)
      * GLM-4.6 (Large Language Model)
      * Z-Image (modèle d'image)
    - Ajout de la gestion du cache vidéo GGUF
    - Prise en charge des templates chat_template.jinja
    - Améliorations UI : utiliser la locale du navigateur comme langue par défaut, ajouter des liens vers le site officiel et le model hub

    **Optimisations de performance**
    - Augmentation de la configuration de timeout du proxy Nginx pour résoudre les timeouts 504 lors du lancement des modèles
      * proxy_send_timeout : 60s → 3600s
      * proxy_read_timeout : 1800s → 3600s
      * proxy_connect_timeout : 60s → 300s
    - Optimisation de la configuration du cache LLM pour ignorer les téléchargements inutiles

    **Corrections de bugs**
    - Correction du problème de compatibilité de version de transformers (< 5.0.0)
    - Correction du blocage du cache manager pendant les téléchargements
    - Correction de plusieurs problèmes connus

    **Références**
    - Notes de version : https://github.com/xorbitsai/inference/releases/tag/v2.0.0

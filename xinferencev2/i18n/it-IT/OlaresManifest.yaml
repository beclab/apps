metadata:
  title: Xinference
  description: Model Serving reso semplice
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA**
    Xorbits Inference (Xinference) è una libreria potente e versatile progettata per servire modelli di linguaggio, riconoscimento vocale e multimodali. Con Xorbits Inference, puoi distribuire e servire i tuoi modelli o i modelli built-in all'avanguardia senza sforzo con un solo comando. Che tu sia un ricercatore, uno sviluppatore o un data scientist, Xorbits Inference ti permette di sfruttare appieno il potenziale dei modelli IA di punta.

    Caratteristiche principali
    Model Serving Made Easy: Semplifica il processo di serving di grandi modelli di linguaggio, riconoscimento vocale e multimodali. Puoi configurare e distribuire i tuoi modelli per sperimentazione e produzione con un solo comando.

    Modelli all'avanguardia: Sperimenta con modelli built-in all'avanguardia con un solo comando. Inference fornisce accesso a modelli open-source all'avanguardia!

    Utilizzo di hardware eterogeneo: Sfrutta al massimo le risorse hardware con ggml. Xorbits Inference utilizza in modo intelligente hardware eterogeneo, incluse GPU e CPU, per accelerare i task di inferenza.

    API e interfacce flessibili: Offre più interfacce per interagire con i tuoi modelli, supportando API RESTful compatibile OpenAI (inclusa Function Calling API), RPC, CLI e WebUI per una gestione e interazione senza soluzione di continuità.

    Deployment distribuito: Eccelle negli scenari di deployment distribuito, consentendo la distribuzione senza soluzione di continuità dell'inferenza dei modelli su più dispositivi o macchine.

    Integrazione built-in con librerie di terze parti: Xorbits Inference si integra senza soluzione di continuità con librerie popolari tra cui LangChain, LlamaIndex, Dify e Chatbox.

  upgradeDescription: |
    **Note di rilascio Xinference v2.0.0**

    **Nuove funzionalità**
    - Aggiunto supporto per diversi nuovi modelli:
      * Qwen3-VL-Embedding-2B/8B (modelli Embedding)
      * Qwen3-VL-Reranker-2B/8B (modelli Reranker)
      * MinerU2.5-2509-1.2B (modello OCR)
      * GLM-4.6 (Large Language Model)
      * Z-Image (modello immagine)
    - Aggiunta gestione della cache video GGUF
    - Supporto per template chat_template.jinja
    - Miglioramenti UI: usa la locale del browser come lingua predefinita, aggiungi link al sito ufficiale e al model hub

    **Ottimizzazioni delle prestazioni**
    - Aumentata la configurazione di timeout del proxy Nginx per risolvere i timeout 504 all'avvio dei modelli
      * proxy_send_timeout: 60s → 3600s
      * proxy_read_timeout: 1800s → 3600s
      * proxy_connect_timeout: 60s → 300s
    - Ottimizzata la configurazione della cache LLM per saltare download non necessari

    **Correzioni di bug**
    - Risolto il problema di compatibilità della versione di transformers (< 5.0.0)
    - Risolto il blocco del cache manager durante i download
    - Risolti diversi problemi noti

    **Riferimenti**
    - Note di rilascio: https://github.com/xorbitsai/inference/releases/tag/v2.0.0

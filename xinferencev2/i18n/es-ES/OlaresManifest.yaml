metadata:
  title: Xinference
  description: Model Serving hecho fácil
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **RESUMEN**
    Xorbits Inference (Xinference) es una biblioteca potente y versátil diseñada para servir modelos de lenguaje, reconocimiento de voz y multimodales. Con Xorbits Inference, puedes desplegar y servir tus modelos o los modelos integrados de última generación sin esfuerzo con un solo comando. Ya seas investigador, desarrollador o científico de datos, Xorbits Inference te permite aprovechar todo el potencial de los modelos de IA de vanguardia.

    Características clave
    Model Serving Made Easy: Simplifica el proceso de servir modelos grandes de lenguaje, reconocimiento de voz y multimodales. Puedes configurar y desplegar tus modelos para experimentación y producción con un solo comando.

    Modelos de última generación: Experimenta con modelos integrados de vanguardia con un solo comando. Inference proporciona acceso a modelos open-source de última generación.

    Utilización de hardware heterogéneo: Aprovecha al máximo tus recursos de hardware con ggml. Xorbits Inference utiliza de forma inteligente hardware heterogéneo, incluidas GPUs y CPUs, para acelerar tus tareas de inferencia.

    API e interfaces flexibles: Ofrece múltiples interfaces para interactuar con tus modelos, con soporte de API RESTful compatible con OpenAI (incluida Function Calling API), RPC, CLI y WebUI para una gestión e interacción fluidas.

    Despliegue distribuido: Sobresale en escenarios de despliegue distribuido, permitiendo la distribución fluida de la inferencia de modelos entre múltiples dispositivos o máquinas.

    Integración integrada con bibliotecas de terceros: Xorbits Inference se integra sin fisuras con bibliotecas populares como LangChain, LlamaIndex, Dify y Chatbox.

  upgradeDescription: |
    **Notas de la versión Xinference v2.0.0**

    **Nuevas funciones**
    - Añadido soporte para varios modelos nuevos:
      * Qwen3-VL-Embedding-2B/8B (modelos de Embedding)
      * Qwen3-VL-Reranker-2B/8B (modelos Reranker)
      * MinerU2.5-2509-1.2B (modelo OCR)
      * GLM-4.6 (Large Language Model)
      * Z-Image (modelo de imagen)
    - Añadida gestión de caché de vídeo GGUF
    - Soporte para plantillas chat_template.jinja
    - Mejoras de UI: usar la locale del navegador como idioma por defecto, añadir enlaces al sitio oficial y al model hub

    **Optimizaciones de rendimiento**
    - Aumentada la configuración de timeout del proxy Nginx para resolver problemas de timeout 504 al lanzar modelos
      * proxy_send_timeout: 60s → 3600s
      * proxy_read_timeout: 1800s → 3600s
      * proxy_connect_timeout: 60s → 300s
    - Optimizada la configuración de caché LLM para omitir descargas innecesarias

    **Correcciones de errores**
    - Corregido el problema de compatibilidad de versión de transformers (< 5.0.0)
    - Corregido el bloqueo del cache manager durante las descargas
    - Corregidos varios problemas conocidos

    **Referencias**
    - Notas de la versión: https://github.com/xorbitsai/inference/releases/tag/v2.0.0

metadata:
  title: Odoo
  description: ビジネスのすべてを一つのプラットフォームで
spec:
  upgradeDescription: |
    Odoo 18.0 のイメージを 18.0-20250618 から 18.0-20260926 に更新します。既存のデータベースと永続ファイルのパスは維持されます。
  fullDescription: |
    **デフォルト認証情報**
    ユーザー名: admin
    パスワード: admin
    ユーザー名とパスワードはできるだけ早く変更してください。

    **概要**
    Odoo は、Web ベースのオープンソース業務アプリケーションスイートです。

    Odoo アプリは単独でも利用できますが、相互にシームレスに連携します。複数のアプリをインストールすることで、完全な機能を備えたオープンソース ERP を構築できます。

    **機能一覧**
    E コマース: Odoo の E コマースソフトウェアは、これまでにないものです。魅力的な商品カタログと優れた商品説明ページを作成できます。

    CRM: セールスファネル内で作業し、次のアクション、新着メッセージ、有望案件、予想収益を視覚的にすぐ確認できます。

    販売: テンプレートを使い、洗練されたプロ仕様の見積書を数分で作成できます。明確な価格の提案を送り、顧客が承認、拒否、または詳細情報を依頼できるようにします。

    在庫: プロセス時間を短縮し、取引を自動化し、在庫水準を抑え、Odoo の複式在庫管理ですべての業務を完全に追跡できます。

    購買: 調達提案を自動化し、見積依頼を開始し、発注書を追跡し、仕入先情報、入荷、仕入先請求書を管理します。

    製造: Odoo ですべての組立および製造業務を管理します。製造オーダーと作業オーダーを自動的にスケジュールできます。

    プロジェクト: Odoo のリアルタイム共同プロジェクト管理で作業を完遂できます。顧客契約から最終請求まで、すべてを追跡します。

    マーケティング: リード、商談、顧客に一括メールを簡単に送信できます。メールキャンペーンの成果を追跡し、コンバージョン率を改善します。

    イベント: 会議、カンファレンス、研修、ウェビナーのいずれを開催する場合も、オンラインイベントとイベントサイトの管理に必要な機能が揃っています。

    請求: 顧客に送った見積書を基に請求書を作成します。プロ仕様の請求書をワンクリックで直接送信できます。オンライン決済と自動フォローアップにも対応します。

    人事: ナレッジ共有、採用、評価、タイムシート、契約、勤怠、給与計算など、すべての人事業務を簡単に管理できます。

    財務: 洗練された多機能な会計ソフトウェアで、あらゆる企業に対応します。統合分析会計から予算、資産、複数企業の連結まで扱えます。

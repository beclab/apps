metadata:
  title: Odoo
  description: Toute votre entreprise sur une seule plateforme
spec:
  upgradeDescription: |
    Met à jour l’image Odoo 18.0 de 18.0-20250618 vers 18.0-20260926. La base de données et les chemins des fichiers persistants sont conservés.
  fullDescription: |
    **Identifiants par défaut**
    Nom d’utilisateur : admin
    Mot de passe : admin
    Veuillez modifier le nom d’utilisateur et le mot de passe dès que possible.

    **Présentation**
    Odoo est une suite d’applications professionnelles open source basées sur le Web.

    Les applications Odoo peuvent être utilisées séparément, mais elles s’intègrent aussi parfaitement. En installant plusieurs applications, vous obtenez ainsi un ERP open source complet.

    **Liste des fonctionnalités**
    E-commerce : Le logiciel d’e-commerce d’Odoo ne ressemble à aucun autre. Créez un superbe catalogue de produits et d’excellentes pages de description.

    CRM : Travaillez dans votre entonnoir de vente et obtenez instantanément des informations visuelles sur les prochaines actions, les nouveaux messages, les meilleures opportunités et les revenus attendus.

    Ventes : Utilisez des modèles pour créer en quelques minutes des devis professionnels et soignés. Envoyez des offres aux tarifs clairs et laissez le client les accepter, les refuser ou demander plus d’informations.

    Stocks : Réduisez les délais de traitement, automatisez les transactions, diminuez les niveaux de stock et bénéficiez d’une traçabilité complète grâce à l’inventaire en partie double d’Odoo.

    Achats : Automatisez les propositions d’approvisionnement, lancez des demandes de devis, suivez les commandes et gérez les informations fournisseurs, les réceptions de produits et les factures fournisseurs.

    Fabrication : Utilisez Odoo pour gérer toutes vos opérations d’assemblage et/ou de fabrication. Planifiez automatiquement les ordres de fabrication et de travail.

    Projets : La gestion de projet collaborative et en temps réel d’Odoo vous aide à accomplir votre travail. Suivez tout, du contrat client à la facturation finale.

    Marketing : Envoyez facilement des publipostages à vos prospects, opportunités et clients. Suivez les performances des campagnes afin d’améliorer les taux de conversion.

    Événements : Que vous organisiez des réunions, conférences, formations ou webinaires, Odoo propose toutes les fonctions nécessaires pour gérer vos événements en ligne et leurs sites Web.

    Facturation : Créez des factures à partir des devis envoyés à vos clients. Envoyez des factures professionnelles directement en un clic. Paiements en ligne et relances automatisées.

    Ressources humaines : Gérez facilement toutes vos opérations RH : partage de connaissances, recrutement, évaluations, feuilles de temps, contrats, présence, paie, etc.

    Finance : Élégant et complet, notre logiciel de comptabilité convient à toutes les entreprises, de la comptabilité analytique intégrée aux budgets, immobilisations et consolidations multi-entreprises.

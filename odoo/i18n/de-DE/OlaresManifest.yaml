  fullDescription: |
    **Standard-Anmeldedaten**
    Benutzername: admin
    Passwort: admin
    Bitte ändern Sie Benutzername und Passwort so bald wie möglich.

    **Überblick**
    Odoo ist eine Suite webbasierter Open-Source-Geschäftsanwendungen.

    Odoo-Apps können als eigenständige Anwendungen genutzt werden, lassen sich aber auch nahtlos integrieren. Wenn Sie mehrere Apps installieren, erhalten Sie so ein vollwertiges Open-Source-ERP.

    **Funktionsliste**
    E-Commerce: Die E-Commerce-Software von Odoo ist einzigartig. Erstellen Sie einen großartigen Produktkatalog und überzeugende Produktbeschreibungsseiten.

    CRM: Arbeiten Sie direkt in Ihrem Verkaufstrichter und erhalten Sie sofort visuelle Informationen zu nächsten Schritten, neuen Nachrichten, Top-Chancen und erwarteten Umsätzen.

    Vertrieb: Erstellen Sie mithilfe von Vorlagen in wenigen Minuten professionelle Angebote. Senden Sie Angebote mit klaren Preisen und lassen Sie Kunden diese annehmen, ablehnen oder weitere Informationen anfordern.

    Lager: Verkürzen Sie Prozesszeiten, automatisieren Sie Transaktionen, reduzieren Sie Lagerbestände und erhalten Sie mit der doppelten Lagerbuchführung von Odoo eine vollständige Rückverfolgbarkeit aller Vorgänge.

    Einkauf: Automatisieren Sie Beschaffungsvorschläge, starten Sie Angebotsanfragen, verfolgen Sie Bestellungen und verwalten Sie Lieferantendaten, Wareneingänge und Lieferantenrechnungen.

    Fertigung: Verwalten Sie mit Odoo alle Montage- und/oder Fertigungsvorgänge. Planen Sie Fertigungs- und Arbeitsaufträge automatisch.

    Projekte: Das kollaborative Echtzeit-Projektmanagement von Odoo hilft Ihnen, Aufgaben zu erledigen. Behalten Sie alles im Blick – vom Kundenvertrag bis zur Schlussrechnung.

    Marketing: Versenden Sie einfach Massenmailings an Leads, Verkaufschancen und Kunden. Verfolgen Sie die Leistung Ihrer Mailingkampagnen, um Konversionsraten zu verbessern.

    Veranstaltungen: Ob Meetings, Konferenzen, Schulungen oder Webinare – Odoo bietet alle Funktionen zur Verwaltung Ihrer Online-Veranstaltungen und Veranstaltungswebsites.

    Rechnungsstellung: Erstellen Sie Rechnungen aus Angeboten, die Sie Ihren Kunden gesendet haben. Versenden Sie mit nur einem Klick professionell gestaltete Rechnungen. Online-Zahlungen und automatische Nachverfolgung.

    Personalwesen: Verwalten Sie sämtliche Personalprozesse einfach: Wissensaustausch, Bewerbermanagement, Beurteilungen, Zeiterfassung, Verträge, Anwesenheit, Gehaltsabrechnung usw.

    Finanzen: Unsere elegante und voll ausgestattete Buchhaltungssoftware eignet sich für jedes Unternehmen – von integrierter analytischer Buchführung über Budgets und Anlagen bis zur Konsolidierung mehrerer Unternehmen.

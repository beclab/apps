  title: Odoo
  description: Tutta la tua azienda su un'unica piattaforma
spec:
  upgradeDescription: |
    Aggiorna l’immagine Odoo 18.0 da 18.0-20250618 a 18.0-20260926. Il database e i percorsi dei file persistenti vengono mantenuti.
  fullDescription: |
    **Credenziali predefinite**
    Nome utente: admin
    Password: admin
    Modifica nome utente e password il prima possibile.

    **Panoramica**
    Odoo è una suite di applicazioni aziendali open source basate sul web.

    Le app Odoo possono essere utilizzate come applicazioni autonome, ma si integrano anche perfettamente tra loro: installando più app si ottiene un ERP open source completo.

    **Elenco delle funzionalità**
    E-commerce: Il software di e-commerce di Odoo è diverso da qualsiasi altro. Crea uno splendido catalogo prodotti e ottime pagine di descrizione.

    CRM: Lavora nel funnel di vendita e ottieni subito informazioni visive sulle prossime azioni, i nuovi messaggi, le opportunità migliori e i ricavi previsti.

    Vendite: Usa i modelli per creare preventivi professionali e curati in pochi minuti. Invia offerte con prezzi chiari e consenti al cliente di accettarle, rifiutarle o chiedere maggiori informazioni.

    Magazzino: Riduci i tempi dei processi, automatizza le transazioni, diminuisci le scorte e ottieni la tracciabilità completa di tutte le operazioni grazie al magazzino a doppia entrata di Odoo.

    Acquisti: Automatizza le proposte di approvvigionamento, avvia richieste di preventivo, monitora gli ordini e gestisci informazioni sui fornitori, ricezioni dei prodotti e fatture dei fornitori.

    Produzione: Usa Odoo per gestire tutte le operazioni di assemblaggio e/o produzione. Pianifica automaticamente ordini di produzione e ordini di lavoro.

    Progetti: La gestione collaborativa e in tempo reale dei progetti di Odoo ti aiuta a completare il lavoro. Tieni sotto controllo tutto, dal contratto con il cliente alla fatturazione finale.

    Marketing: Invia facilmente comunicazioni di massa a lead, opportunità e clienti. Monitora le prestazioni delle campagne per migliorare i tassi di conversione.

    Eventi: Che tu organizzi riunioni, conferenze, corsi o webinar, Odoo offre tutte le funzionalità necessarie per gestire eventi online e relativi siti web.

    Fatturazione: Crea fatture sulla base dei preventivi inviati ai clienti. Invia fatture professionali direttamente con un clic. Pagamenti online e solleciti automatici.

    Risorse umane: Gestisci facilmente tutte le operazioni HR: condivisione delle conoscenze, selezione, valutazioni, fogli ore, contratti, presenze, stipendi e altro.

    Finanza: Elegante e completo, il nostro software di contabilità è adatto a qualsiasi azienda. Dalla contabilità analitica integrata a budget, cespiti e consolidamento multi-azienda.

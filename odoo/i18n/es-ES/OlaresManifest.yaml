  fullDescription: |
    **Credenciales predeterminadas**
    Usuario: admin
    Contraseña: admin
    Cambia el usuario y la contraseña lo antes posible.

    **Descripción general**
    Odoo es un conjunto de aplicaciones empresariales de código abierto basadas en web.

    Las aplicaciones de Odoo pueden utilizarse de forma independiente, pero también se integran a la perfección, por lo que al instalar varias aplicaciones obtienes un ERP de código abierto completo.

    **Lista de funciones**
    Comercio electrónico: El software de comercio electrónico de Odoo es diferente a todo lo que hayas visto. Consigue un catálogo de productos excelente y magníficas páginas de descripción de productos.

    CRM: Trabaja dentro de tu embudo de ventas y obtén al instante información visual sobre las próximas acciones, los mensajes nuevos, las mejores oportunidades y los ingresos previstos.

    Ventas: Usa plantillas para crear presupuestos profesionales y cuidados en cuestión de minutos. Envía ofertas con precios claros y permite que el cliente las acepte, rechace o solicite más información.

    Inventario: Reduce los tiempos de proceso, automatiza transacciones, disminuye tus niveles de existencias y consigue una trazabilidad completa de todas las operaciones con el inventario de doble entrada de Odoo.

    Compras: Automatiza propuestas de aprovisionamiento, inicia solicitudes de presupuesto, realiza el seguimiento de pedidos y gestiona la información de proveedores, las recepciones de productos y las facturas de proveedores.

    Fabricación: Usa Odoo para gestionar todas tus operaciones de montaje y/o fabricación. Programa automáticamente órdenes de fabricación y de trabajo.

    Proyectos: La gestión de proyectos colaborativa y en tiempo real de Odoo te ayuda a completar el trabajo. Controla todo, desde el contrato del cliente hasta la facturación final.

    Marketing: Envía fácilmente correos masivos a tus clientes potenciales, oportunidades y clientes. Supervisa el rendimiento de las campañas para mejorar las tasas de conversión.

    Eventos: Tanto si organizas reuniones, conferencias, formaciones o seminarios web, Odoo te ofrece todas las funciones necesarias para gestionar tus eventos en línea y sus sitios web.

    Facturación: Crea facturas a partir de los presupuestos enviados a tus clientes. Envía facturas de aspecto profesional directamente con un solo clic. Pagos en línea y seguimientos automatizados.

    Recursos humanos: Gestiona fácilmente todas tus operaciones de RR. HH.: intercambio de conocimientos, contratación, evaluaciones, partes de horas, contratos, asistencia, nóminas, etc.

    Finanzas: Elegante y completo, nuestro software de contabilidad sirve para cualquier empresa. Desde contabilidad analítica integrada hasta presupuestos, activos y consolidación de varias empresas.

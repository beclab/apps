---
apiVersion: v1
data:
  nginx.conf: |
    server {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      listen 8080;
      access_log /dev/stdout;
      error_log /dev/stderr;

      proxy_connect_timeout                          30s;
      proxy_send_timeout                             60s;
      proxy_read_timeout                             300s;
      proxy_set_header      host                      $host;
      proxy_set_header      x-forwarded-host          $http_host;

      proxy_http_version 1.1;

      proxy_set_header upgrade $http_upgrade;
      proxy_set_header connection "upgrade";

      location / {
        add_header X-Frame-Options "";
        proxy_pass http://ollama.ollamaserver-shared:11434;
      }
    }
    server {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      listen 8081;
      access_log /dev/stdout;
      error_log /dev/stderr;

      proxy_connect_timeout                          30s;
      proxy_send_timeout                             60s;
      proxy_read_timeout                             300s;
      proxy_set_header      host                      $host;
      proxy_set_header      x-forwarded-host          $http_host;

      proxy_http_version 1.1;

      proxy_set_header upgrade $http_upgrade;
      proxy_set_header connection "upgrade";

      location / {
        add_header X-Frame-Options "";
        proxy_pass http://terminal.ollamaserver-shared:80;
      }
    }

kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: ollamaclient
  name: {{ .Release.Name }}
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ollamaclient
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: ollamaclient
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 30
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 10
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     host: ollama.ollama-{{ .Values.admin }}
          #     port: 7860
          #     scheme: HTTP
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          #   successThreshold: 1
          #   failureThreshold: 10
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty

---
apiVersion: v1
kind: Service
metadata:
  name: ollamaclient
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: ollamaclient
  ports:
    - name: ollamaclient
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: terminalclient
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: ollamaclient
  ports:
    - name: ollamaclient
      protocol: TCP
      port: 8081
      targetPort: 8081

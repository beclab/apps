metadata:
  title: Ollama
  description: Démarrez avec les grands modèles de langage

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **APERÇU**
    Ollama est une interface conviviale pour exécuter des grands modèles de langage (LLM) en local. C'est un outil précieux pour les chercheurs, les développeurs et quiconque souhaite expérimenter avec les modèles de langage. Avec Ollama, vous pouvez facilement télécharger et exécuter des LLM, personnaliser et créer les vôtres, et discuter avec vos LLM en utilisant des fichiers sur votre appareil.

    Ollama prend en charge un large éventail de modèles, notamment :
    - Llama 3 8B
    - Llama 3 70B
    - Phi 3 Mini 3.8B
    - Phi 3 Medium 14B
    - Gemma 2 9B
    - Gemma 2 27B
    - Mistral 7B
    - Moondream 2 1.4B
    - Neural Chat 7B
    - Starling 7B
    - Code Llama 7B
    - Llama 2 Uncensored 7B
    - LLaVA 7B
    - Solar 10.7B

  upgradeDescription: |
    Mettre à niveau le terminal web Ollama de beclab/terminal:v0.0.8 vers v0.0.14 et porter la limite mémoire du conteneur terminal à 512Mi. Le runtime Ollama reste v0.30.11.

    Mise à niveau d'Ollama de v0.30.6 vers v0.30.11

    **Nouveautés**

    v0.30.11 (2026-06-26)
    - Nouveau modèle : Ornith — une famille de modèles de coding agentiques open source qui s'améliorent d'elles-mêmes (9B / 35B MoE, contexte 256K, licence MIT). Lancez-le avec `ollama run ornith` (ou `ornith:9b` / `ornith:35b`). Il fonctionne dans cette version via le template de chat générique ; le renderer/parser Ornith dédié pour une sortie de tool-call agentique plus propre arrivera dans une version ultérieure
    - `ollama launch` installe désormais automatiquement opencode et Claude Code lorsqu'ils manquent, et ajoute la détection de capacité de thinking pour opencode
    - Correction de la classification Vulkan iGPU/dGPU inversée sur les machines Windows à graphiques hybrides ; Windows utilise désormais le chargeur Vulkan de l'hôte
    - Décodage spéculatif MLX unifié et réglé ; marge de génération préservée pour les prompts décalés
    - `ollama ps` ne compte plus deux fois les poids mmap'd en offload partiel ; l'offload mmproj est désormais dimensionné selon la mémoire du projecteur
    - Aucune nouvelle variable d'environnement dans cette version

    v0.30.6 (2026-06-05)
    - Nouveaux modèles : poids Gemma 4 QAT (Quantization-Aware Training) qui réduisent drastiquement l'utilisation mémoire et améliorent les performances on-device — tags se terminant par `-qat` (p. ex. `gemma4:e2b-it-qat`, `gemma4:12b-it-qat`, `gemma4:31b-it-qat`)
    - `ollama launch omp` s'intègre désormais à Oh My Pi, un agent de coding IA avec intégration IDE
    - Les couches d'embedding MLX utilisent désormais l'échelle globale NVFP4 pour une quantification améliorée sur Apple Silicon

    v0.30.5 (2026-06-04)
    - Correction du crash par exception en virgule flottante de `gemma4:12b` sur x86, CUDA, Linux et Windows
    - `ollama launch hermes-desktop` ignore désormais la reconstruction lorsqu'une app de bureau empaquetée est déjà installée
    - `ollama launch hermes` prend désormais en charge les installations Windows natives via l'installeur PowerShell Hermes
    - Ajout de la documentation d'intégration Cline CLI

    v0.30.0 (2026-05-13)
    - Ollama 0.30 améliore la compatibilité et les performances en utilisant llama.cpp, en enrichissant le moteur MLX sur Apple Silicon pour un support matériel plus large
    - Prend en charge une gamme plus large de modèles, y compris les modèles basés sur GGUF de Hugging Face et les modèles fine-tunés
    - Performances plus rapides sur le matériel NVIDIA
    - Définir `LLAMA_ARG_FIT_TARGET=1024` (marge VRAM libre par GPU en MiB ; ne doit pas être vide — une valeur vide fait planter le llama-server 0.30)
    - Monter CUDA ComputeCache dans Home/Ollama/.nv (partagé entre toutes les apps Ollama) pour accélérer le warmup des kernels GPU

    **Problèmes connus**
    - `laguna-xs.2` n'est pas encore pris en charge sur Windows/Linux
    - `llama3.2-vision` n'est pas encore pris en charge
    - `nomic-embed-text` convertit désormais les entrées en minuscules selon la model card (les versions antérieures préservaient incorrectement la casse mixte)

    v0.24.0 (2026-05-14)
    - Ollama 0.24 ajoute la prise en charge de la Codex App (bureau OpenAI pour les threads Codex avec support worktree et git) ; utilisez `ollama launch codex-app` et `ollama launch codex-app --restore` pour revenir en arrière
    - Codex peut ouvrir des serveurs locaux dans un navigateur intégré pour les annotations, et prend en charge le mode review pour commenter le code dans l'app
    - Remaniement du sampler MLX pour une qualité de génération améliorée sur Apple Silicon

    v0.23.2 (2026-05-07)
    - `ollama launch` n'inclut plus Claude Desktop car l'intégration tierce est limitée aux modèles Anthropic
    - Utilisez `ollama launch claude-desktop --restore` pour restaurer Claude Desktop à son état normal
    - Les réponses `/api/show` sont désormais mises en cache, améliorant la latence médiane d'environ 6,7× ce qui accélère les intégrations comme VS Code
    - Flux de sauvegarde amélioré lors de la gestion des intégrations de launch
    - Mise en page plus propre de la génération d'images dans le runner MLX

    Pour des notes de version détaillées, visitez :
    https://github.com/ollama/ollama/releases

metadata:
  title: Ollama
  description: Großsprachmodelle schnell zum Laufen bringen

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **ÜBERSICHT**
    Ollama ist eine benutzerfreundliche Oberfläche zum lokalen Ausführen großer Sprachmodelle (LLMs). Es ist ein wertvolles Tool für Forscher, Entwickler und alle, die mit Sprachmodellen experimentieren möchten. Mit Ollama können Sie LLMs einfach herunterladen und ausführen, eigene anpassen und erstellen sowie mit Ihren LLMs anhand von Dateien auf Ihrem Gerät chatten.

    Ollama unterstützt eine große Bandbreite an Modellen, darunter:
    - Llama 3 8B
    - Llama 3 70B
    - Phi 3 Mini 3.8B
    - Phi 3 Medium 14B
    - Gemma 2 9B
    - Gemma 2 27B
    - Mistral 7B
    - Moondream 2 1.4B
    - Neural Chat 7B
    - Starling 7B
    - Code Llama 7B
    - Llama 2 Uncensored 7B
    - LLaVA 7B
    - Solar 10.7B

  upgradeDescription: |
    Web-Terminal von beclab/terminal:v0.0.8 auf v0.0.14 aktualisieren und das Speicherlimit des Terminal-Containers auf 512Mi anheben. Ollama-Runtime bleibt v0.30.11.

    Upgrade von Ollama von v0.30.6 auf v0.30.11

    **Änderungen**

    v0.30.11 (2026-06-26)
    - Neues Modell: Ornith — eine selbstverbessernde Open-Source agentische Coding-Modellfamilie (9B / 35B MoE, 256K Kontext, MIT-lizenziert). Ausführen mit `ollama run ornith` (oder `ornith:9b` / `ornith:35b`). Läuft in diesem Release über das generische Chat-Template; der dedizierte Ornith-Renderer/Parser für sauberere agentische Tool-Call-Ausgabe folgt in einem späteren Release
    - `ollama launch` installiert nun automatisch opencode und Claude Code, wenn sie fehlen, und fügt Thinking-Capability-Erkennung für opencode hinzu
    - Invertierte iGPU/dGPU-Vulkan-Klassifikation auf Windows-Hybrid-Grafiksystemen behoben; Windows nutzt nun den Host-Vulkan-Loader
    - MLX Speculative Decoding vereinheitlicht und abgestimmt; Generation Headroom für shifted Prompts erhalten
    - `ollama ps` zählt mmap'd Weights bei partiellem Offload nicht mehr doppelt; mmproj-Offload wird nun nach Projector-Speicher dimensioniert
    - Keine neuen Umgebungsvariablen in diesem Release

    v0.30.6 (2026-06-05)
    - Neue Modelle: Gemma 4 QAT (Quantization-Aware Training)-Gewichte, die den Speicherverbrauch drastisch senken und die On-Device-Leistung steigern — Tags endend auf `-qat` (z. B. `gemma4:e2b-it-qat`, `gemma4:12b-it-qat`, `gemma4:31b-it-qat`)
    - `ollama launch omp` integriert sich nun mit Oh My Pi, einem KI-Coding-Agenten mit IDE-Integration
    - MLX Embedding-Layer nutzen nun NVFP4 Global Scale für verbesserte Quantisierung auf Apple Silicon

    v0.30.5 (2026-06-04)
    - Floating-Point-Exception-Absturz von `gemma4:12b` auf x86, CUDA, Linux und Windows behoben
    - `ollama launch hermes-desktop` überspringt nun den Rebuild, wenn eine gepackte Desktop-App bereits installiert ist
    - `ollama launch hermes` unterstützt nun native Windows-Installationen über den Hermes PowerShell-Installer
    - Cline-CLI-Integrationsdokumentation hinzugefügt

    v0.30.0 (2026-05-13)
    - Ollama 0.30 verbessert Kompatibilität und Leistung mit llama.cpp und erweitert die MLX-Engine auf Apple Silicon für breitere Hardware-Unterstützung
    - Unterstützt eine größere Bandbreite an Modellen, einschließlich GGUF-basierter Modelle von Hugging Face und feinabgestimmter Modelle
    - Schnellere Leistung auf NVIDIA-Hardware
    - `LLAMA_ARG_FIT_TARGET=1024` setzen (freier VRAM-Rand pro GPU in MiB; muss nicht leer sein — ein leerer Wert lässt den 0.30 llama-server abstürzen)
    - CUDA ComputeCache unter Home/Ollama/.nv mounten (gemeinsam für alle Ollama-Apps), um das GPU-Kernel-Warmup zu beschleunigen

    **Bekannte Probleme**
    - `laguna-xs.2` wird unter Windows/Linux noch nicht unterstützt
    - `llama3.2-vision` wird noch nicht unterstützt
    - `nomic-embed-text` wandelt Eingaben nun gemäß Model Card in Kleinbuchstaben um (frühere Versionen behielten fälschlich Groß-/Kleinschreibung)

    v0.24.0 (2026-05-14)
    - Ollama 0.24 fügt Unterstützung für die Codex App hinzu (OpenAI Desktop für Codex-Threads mit Worktree- und Git-Unterstützung); `ollama launch codex-app` und `ollama launch codex-app --restore` zum Zurücksetzen verwenden
    - Codex kann lokale Server in einem integrierten Browser für Annotationen öffnen und unterstützt den Review-Modus zum Kommentieren von Code in der App
    - MLX-Sampler für verbesserte Generierungsqualität auf Apple Silicon überarbeitet

    v0.23.2 (2026-05-07)
    - `ollama launch` enthält Claude Desktop nicht mehr, da die Drittanbieter-Integration auf Anthropic-Modelle beschränkt ist
    - `ollama launch claude-desktop --restore` verwenden, um Claude Desktop in den Normalzustand zurückzusetzen
    - `/api/show`-Antworten werden nun gecacht, was die Medianlatenz um ~6,7× verbessert und Integrationen wie VS Code beschleunigt
    - Verbesserter Backup-Workflow bei der Verwaltung von Launch-Integrationen
    - Klareres Layout der Bildgenerierung im MLX-Runner

    Detaillierte Release Notes:
    https://github.com/ollama/ollama/releases

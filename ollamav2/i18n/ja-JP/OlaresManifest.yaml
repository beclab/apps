metadata:
  title: Ollama
  description: 大規模言語モデルをすばやく始められます

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **概要**
    Ollama は大規模言語モデル（LLM）をローカルで実行するための使いやすいインターフェースです。研究者、開発者、言語モデルを試したいすべての人にとって貴重なツールです。Ollama なら LLM のダウンロードと実行、独自モデルのカスタマイズと作成、デバイス上のファイルを使った LLM とのチャットが簡単にできます。

    Ollama は幅広いモデルをサポートします：
    - Llama 3 8B
    - Llama 3 70B
    - Phi 3 Mini 3.8B
    - Phi 3 Medium 14B
    - Gemma 2 9B
    - Gemma 2 27B
    - Mistral 7B
    - Moondream 2 1.4B
    - Neural Chat 7B
    - Starling 7B
    - Code Llama 7B
    - Llama 2 Uncensored 7B
    - LLaVA 7B
    - Solar 10.7B

  upgradeDescription: |
    Ollama の Web ターミナルを beclab/terminal:v0.0.8 から v0.0.14 へアップグレードし、terminal コンテナのメモリ上限を 512Mi に引き上げます。Ollama ランタイムは v0.30.11 のままです。

    Ollama を v0.30.6 から v0.30.11 へアップグレード

    **変更点**

    v0.30.11 (2026-06-26)
    - 新モデル：Ornith — 自己改善するオープンソースのエージェンティック・コーディングモデルファミリー（9B / 35B MoE、256K コンテキスト、MIT ライセンス）。`ollama run ornith`（または `ornith:9b` / `ornith:35b`）で実行。本リリースでは汎用チャットテンプレート経由で動作；よりクリーンなエージェンティック・ツール呼び出し出力向けの専用 Ornith レンダラー／パーサーは後続リリースで提供
    - `ollama launch` は不足時に opencode と Claude Code を自動インストールし、opencode の thinking 能力検出を追加
    - Windows ハイブリッドグラフィックスでの反転した iGPU/dGPU Vulkan 分類を修正；Windows はホストの Vulkan ローダーを使用
    - MLX 投機的デコーディングを統一・調整；シフトしたプロンプトの生成ヘッドルームを維持
    - `ollama ps` が部分オフロード時に mmap 済み重みを二重カウントしなくなり；mmproj オフロードはプロジェクターメモリでサイズ決定
    - 本リリースに新しい環境変数なし

    v0.30.6 (2026-06-05)
    - 新モデル：メモリ使用を大幅に削減しオンデバイス性能を高める Gemma 4 QAT（Quantization-Aware Training）重み — `-qat` で終わるタグ（例：`gemma4:e2b-it-qat`、`gemma4:12b-it-qat`、`gemma4:31b-it-qat`）
    - `ollama launch omp` が IDE 統合付き AI コーディングエージェント Oh My Pi と連携
    - MLX 埋め込み層が Apple Silicon 向けに改善された量子化のため NVFP4 グローバルスケールを使用

    v0.30.5 (2026-06-04)
    - x86、CUDA、Linux、Windows での `gemma4:12b` 浮動小数点例外クラッシュを修正
    - パッケージ済みデスクトップアプリが既にインストールされている場合、`ollama launch hermes-desktop` は再ビルドをスキップ
    - `ollama launch hermes` が Hermes PowerShell インストーラ経由のネイティブ Windows インストールに対応
    - Cline CLI 統合ドキュメントを追加

    v0.30.0 (2026-05-13)
    - Ollama 0.30 は llama.cpp を用いて互換性と性能を向上し、Apple Silicon 上の MLX エンジンを強化してより広いハードウェア対応を実現
    - Hugging Face の GGUF ベースモデルや fine-tuned モデルを含む、より幅広いモデルをサポート
    - NVIDIA ハードウェアでの高速化
    - `LLAMA_ARG_FIT_TARGET=1024` を設定（GPU あたりの空き VRAM マージン、MiB；空であってはならない — 空値は 0.30 llama-server をクラッシュさせる）
    - GPU カーネルのウォームアップ高速化のため CUDA ComputeCache を Home/Ollama/.nv にマウント（全 Ollama アプリで共有）

    **既知の問題**
    - `laguna-xs.2` はまだ Windows/Linux で未サポート
    - `llama3.2-vision` はまだ未サポート
    - `nomic-embed-text` はモデルカードに従い入力を小文字化（以前のバージョンは誤って大文字小文字を保持）

    v0.24.0 (2026-05-14)
    - Ollama 0.24 が Codex App（worktree と git 対応の Codex スレッド向け OpenAI デスクトップ）をサポート；`ollama launch codex-app` と `ollama launch codex-app --restore` で復元
    - Codex は注釈用に組み込みブラウザでローカルサーバーを開け、アプリ内でコードにコメントするレビューモードに対応
    - Apple Silicon での生成品質向上のため MLX サンプラーを再設計

    v0.23.2 (2026-05-07)
    - サードパーティ統合が Anthropic モデルに限定されるため、`ollama launch` は Claude Desktop を含めなくなった
    - `ollama launch claude-desktop --restore` で Claude Desktop を通常状態に復元
    - `/api/show` 応答がキャッシュされ、中央値レイテンシが約 ~6.7x改善し VS Code などの統合が高速化
    - launch 統合管理時のバックアップワークフローを改善
    - MLX ランナーの画像生成レイアウトをよりクリーンに

    詳細なリリースノート：
    https://github.com/ollama/ollama/releases

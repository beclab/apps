metadata:
  title: Ollama
  description: Ponte en marcha con grandes modelos de lenguaje

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **RESUMEN**
    Ollama es una interfaz fácil de usar para ejecutar grandes modelos de lenguaje (LLMs) en local. Es una herramienta valiosa para investigadores, desarrolladores y cualquiera que quiera experimentar con modelos de lenguaje. Con Ollama, puedes descargar y ejecutar LLMs fácilmente, personalizar y crear los tuyos, y chatear con tus LLMs usando archivos de tu dispositivo.

    Ollama admite una amplia gama de modelos, entre ellos:
    - Llama 3 8B
    - Llama 3 70B
    - Phi 3 Mini 3.8B
    - Phi 3 Medium 14B
    - Gemma 2 9B
    - Gemma 2 27B
    - Mistral 7B
    - Moondream 2 1.4B
    - Neural Chat 7B
    - Starling 7B
    - Code Llama 7B
    - Llama 2 Uncensored 7B
    - LLaVA 7B
    - Solar 10.7B

  upgradeDescription: |
    Actualizar el terminal web de Ollama de beclab/terminal:v0.0.8 a v0.0.14 y subir el límite de memoria del contenedor terminal a 512Mi. El runtime de Ollama sigue en v0.30.11.

    Actualizar Ollama de v0.30.6 a v0.30.11

    **Cambios**

    v0.30.11 (2026-06-26)
    - Nuevo modelo: Ornith — una familia de modelos de coding agenticos open-source que se auto-mejoran (9B / 35B MoE, contexto 256K, licencia MIT). Ejecútalo con `ollama run ornith` (o `ornith:9b` / `ornith:35b`). En esta versión funciona mediante la plantilla de chat genérica; el renderer/parser dedicado de Ornith para una salida de tool-call agentica más limpia llega en una versión posterior
    - `ollama launch` ahora instala automáticamente opencode y Claude Code cuando faltan, y añade detección de capacidad de thinking para opencode
    - Corregida la clasificación Vulkan iGPU/dGPU invertida en máquinas Windows con gráficos híbridos; Windows ahora usa el cargador Vulkan del host
    - Decodificación especulativa MLX unificada y ajustada; se preserva el margen de generación para prompts desplazados
    - `ollama ps` ya no cuenta dos veces los pesos mmap'd en offload parcial; el offload mmproj ahora se dimensiona por la memoria del proyector
    - No hay nuevas variables de entorno en esta versión

    v0.30.6 (2026-06-05)
    - Nuevos modelos: pesos Gemma 4 QAT (Quantization-Aware Training) que reducen drásticamente el uso de memoria y mejoran el rendimiento on-device — etiquetas que terminan en `-qat` (p. ej. `gemma4:e2b-it-qat`, `gemma4:12b-it-qat`, `gemma4:31b-it-qat`)
    - `ollama launch omp` ahora se integra con Oh My Pi, un agente de coding IA con integración IDE
    - Las capas de embedding MLX usan ahora escala global NVFP4 para una cuantización mejorada en Apple Silicon

    v0.30.5 (2026-06-04)
    - Corregido el crash por excepción de punto flotante de `gemma4:12b` en x86, CUDA, Linux y Windows
    - `ollama launch hermes-desktop` ahora omite la reconstrucción cuando ya hay una app de escritorio empaquetada instalada
    - `ollama launch hermes` ahora admite instalaciones nativas de Windows mediante el instalador PowerShell de Hermes
    - Añadida documentación de integración de Cline CLI

    v0.30.0 (2026-05-13)
    - Ollama 0.30 mejora la compatibilidad y el rendimiento usando llama.cpp, ampliando el motor MLX en Apple Silicon para un soporte de hardware más amplio
    - Admite una gama más amplia de modelos, incluidos modelos basados en GGUF de Hugging Face y modelos fine-tuned
    - Mayor rendimiento en hardware NVIDIA
    - Establece `LLAMA_ARG_FIT_TARGET=1024` (margen libre de VRAM por GPU en MiB; no debe estar vacío — un valor vacío hace fallar el llama-server 0.30)
    - Monta CUDA ComputeCache en Home/Ollama/.nv (compartida entre todas las apps Ollama) para acelerar el warmup de kernels GPU

    **Problemas conocidos**
    - `laguna-xs.2` aún no es compatible en Windows/Linux
    - `llama3.2-vision` aún no es compatible
    - `nomic-embed-text` ahora convierte las entradas a minúsculas según la model card (versiones anteriores preservaban incorrectamente mayúsculas y minúsculas)

    v0.24.0 (2026-05-14)
    - Ollama 0.24 añade soporte para la Codex App (escritorio OpenAI para hilos Codex con soporte de worktree y git); usa `ollama launch codex-app` y `ollama launch codex-app --restore` para revertir
    - Codex puede abrir servidores locales en un navegador integrado para anotaciones, y admite el modo review para comentar código en la app
    - Remodelado el sampler MLX para mejorar la calidad de generación en Apple Silicon

    v0.23.2 (2026-05-07)
    - `ollama launch` ya no incluye Claude Desktop porque la integración de terceros está limitada a modelos Anthropic
    - Usa `ollama launch claude-desktop --restore` para restaurar Claude Desktop a su estado normal
    - Las respuestas de `/api/show` ahora se almacenan en caché, mejorando la latencia mediana ~6.7x y acelerando integraciones como VS Code
    - Flujo de backup mejorado al gestionar integraciones de launch
    - Diseño más limpio de generación de imágenes en el runner MLX

    Para notas de versión detalladas, visita:
    https://github.com/ollama/ollama/releases

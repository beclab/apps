metadata:
  title: Ollama
  description: Inizia a usare i grandi modelli linguistici

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA**
    Ollama è un'interfaccia facile da usare per eseguire grandi modelli linguistici (LLM) in locale. È uno strumento prezioso per ricercatori, sviluppatori e chiunque voglia sperimentare con i modelli linguistici. Con Ollama puoi scaricare ed eseguire facilmente gli LLM, personalizzare e creare i tuoi, e chattare con i tuoi LLM usando file sul tuo dispositivo.

    Ollama supporta un'ampia gamma di modelli, tra cui:
    - Llama 3 8B
    - Llama 3 70B
    - Phi 3 Mini 3.8B
    - Phi 3 Medium 14B
    - Gemma 2 9B
    - Gemma 2 27B
    - Mistral 7B
    - Moondream 2 1.4B
    - Neural Chat 7B
    - Starling 7B
    - Code Llama 7B
    - Llama 2 Uncensored 7B
    - LLaVA 7B
    - Solar 10.7B

  upgradeDescription: |
    Aggiornare il terminale web di Ollama da beclab/terminal:v0.0.8 a v0.0.14 e alzare il limite di memoria del container terminal a 512Mi. Il runtime Ollama resta v0.30.11.

    Aggiornare Ollama da v0.30.6 a v0.30.11

    **Novità**

    v0.30.11 (2026-06-26)
    - Nuovo modello: Ornith — una famiglia di modelli di coding agentici open-source che si auto-migliorano (9B / 35B MoE, contesto 256K, licenza MIT). Eseguilo con `ollama run ornith` (o `ornith:9b` / `ornith:35b`). In questo rilascio funziona tramite il template di chat generico; il renderer/parser dedicato di Ornith per un output di tool-call agentico più pulito arriverà in un rilascio successivo
    - `ollama launch` ora installa automaticamente opencode e Claude Code quando mancano, e aggiunge il rilevamento della capacità di thinking per opencode
    - Corretta la classificazione Vulkan iGPU/dGPU invertita su macchine Windows con grafica ibrida; Windows ora usa il loader Vulkan dell'host
    - Decodifica speculativa MLX unificata e messa a punto; preservato il margine di generazione per prompt spostati
    - `ollama ps` non conta più due volte i pesi mmap'd in offload parziale; l'offload mmproj è ora dimensionato in base alla memoria del proiettore
    - Nessuna nuova variabile d'ambiente in questo rilascio

    v0.30.6 (2026-06-05)
    - Nuovi modelli: pesi Gemma 4 QAT (Quantization-Aware Training) che riducono drasticamente l'uso di memoria e migliorano le prestazioni on-device — tag che terminano con `-qat` (ad es. `gemma4:e2b-it-qat`, `gemma4:12b-it-qat`, `gemma4:31b-it-qat`)
    - `ollama launch omp` ora si integra con Oh My Pi, un agente di coding IA con integrazione IDE
    - I layer di embedding MLX usano ora la scala globale NVFP4 per una quantizzazione migliorata su Apple Silicon

    v0.30.5 (2026-06-04)
    - Corretto il crash per floating point exception di `gemma4:12b` su x86, CUDA, Linux e Windows
    - `ollama launch hermes-desktop` ora salta la ricostruzione quando un'app desktop pacchettizzata è già installata
    - `ollama launch hermes` ora supporta installazioni native Windows tramite l'installer PowerShell di Hermes
    - Aggiunta documentazione di integrazione Cline CLI

    v0.30.0 (2026-05-13)
    - Ollama 0.30 migliora compatibilità e prestazioni usando llama.cpp, potenziando il motore MLX su Apple Silicon per un supporto hardware più ampio
    - Supporta una gamma più ampia di modelli, inclusi modelli basati su GGUF da Hugging Face e modelli fine-tuned
    - Prestazioni più rapide su hardware NVIDIA
    - Imposta `LLAMA_ARG_FIT_TARGET=1024` (margine VRAM libero per GPU in MiB; non deve essere vuoto — un valore vuoto fa crashare il llama-server 0.30)
    - Monta CUDA ComputeCache in Home/Ollama/.nv (condivisa tra tutte le app Ollama) per accelerare il warmup dei kernel GPU

    **Problemi noti**
    - `laguna-xs.2` non è ancora supportato su Windows/Linux
    - `llama3.2-vision` non è ancora supportato
    - `nomic-embed-text` ora converte gli input in minuscolo secondo la model card (le versioni precedenti preservavano erroneamente maiuscole/minuscole)

    v0.24.0 (2026-05-14)
    - Ollama 0.24 aggiunge il supporto per la Codex App (desktop OpenAI per thread Codex con supporto worktree e git); usa `ollama launch codex-app` e `ollama launch codex-app --restore` per ripristinare
    - Codex può aprire server locali in un browser integrato per le annotazioni e supporta la modalità review per commentare il codice nell'app
    - Rielaborato lo sampler MLX per una migliore qualità di generazione su Apple Silicon

    v0.23.2 (2026-05-07)
    - `ollama launch` non include più Claude Desktop perché l'integrazione di terze parti è limitata ai modelli Anthropic
    - Usa `ollama launch claude-desktop --restore` per ripristinare Claude Desktop al suo stato normale
    - Le risposte di `/api/show` sono ora in cache, migliorando la latenza mediana di ~6.7x e accelerando integrazioni come VS Code
    - Flusso di backup migliorato nella gestione delle integrazioni di launch
    - Layout più pulito della generazione di immagini nel runner MLX

    Per note di rilascio dettagliate, visita:
    https://github.com/ollama/ollama/releases

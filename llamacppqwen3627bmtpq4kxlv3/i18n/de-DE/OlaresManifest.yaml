  fullDescription: |
    **Model Overview**
    Qwen3.6-27B MTP ist eine Textmodell-Variante mit eingebauten Multi-Token-Prediction-(MTP)-Heads aus der Qwen-Serie (Alibaba). MTP-Draft-Decoding sagt mehrere Tokens pro Schritt voraus und erhöht den Generierungsdurchsatz. Es unterstützt Thinking und Tool Calling. Diese App stellt den `UD-Q4_K_XL`-GGUF-Build von `unsloth/Qwen3.6-27B-MTP-GGUF` über llama.cpp bereit (nur Text-Preset, kein Vision/mmproj).

    Empfohlen, wenn Sie sehr hohe Token-Generierungsgeschwindigkeit brauchen. Modelle mit MTP-Technologie beschleunigen das Decode, indem sie in jedem Schritt mehrere Tokens entwerfen.

    **Preset Configuration**
    - Model: `unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL`
    - Capabilities: thinking, tools
    - Engine args: `-c 100352 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 2` (98K Kontext, MTP draft-2, voller GPU-Offload, q8_0 KV-Cache)
    - MTP erhöht den VRAM-Bedarf moderat; bei OOM bei vollem 98K-Kontext `-c` reduzieren (z. B. `-c 65536`).
    - Required GPU memory: `23Gi`

    **Accelerator modes**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Nutzt `23Gi` GPU-Speicher; `-ngl all` für volle GPU  |
    | `nvidia-gb10`  | GPU (Spark)       | Wie oben, aber Speicher wird vom Pod verwaltet     |
    
    **How It Works**
    Zuerst lädt die Model Console das Modell herunter und bereitet es vor, dann startet `llama.cpp` den Serve, wenn bereit. MTP (`--spec-type draft-mtp`) nutzt den eingebauten Draft-Head des Modells, um mehrere Tokens pro Schritt vorauszusagen und den Decode-Durchsatz zu erhöhen.

    **Stack**
    - **llama.cpp**: Führt das Modell aus und bedient API-Anfragen (Port 8081)
    - **Model Console**: Lädt das Modell herunter, zeigt Fortschritt und stellt die OpenAI-API auf Port 8090 bereit, mit Proxy zu `llamacpp`

    **Model Storage**
    Alle Modelldateien liegen in einem gemeinsamen Ordner unter `appCommon/huggingface`, gemountet als `/cache/hf/hub`. Alle ähnlichen Apps nutzen diesen Ort für Modelle.

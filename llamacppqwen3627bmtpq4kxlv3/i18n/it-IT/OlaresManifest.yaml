  fullDescription: |
    **Model Overview**
    Qwen3.6-27B MTP è una variante di modello di testo con teste Multi-Token Prediction (MTP) integrate della serie Qwen (Alibaba). Il draft decoding MTP predice più token per passo per un throughput di generazione più alto. Supporta thinking e tool calling. Questa app serve il build GGUF `UD-Q4_K_XL` da `unsloth/Qwen3.6-27B-MTP-GGUF` via llama.cpp (preset solo testo, senza vision/mmproj).

    Consigliato quando serve una velocità di generazione token molto alta. I modelli con tecnologia MTP accelerano il decode redigendo più token a ogni passo.

    **Preset Configuration**
    - Model: `unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL`
    - Capabilities: thinking, tools
    - Engine args: `-c 100352 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 2` (contesto 98K, MTP draft-2, offload GPU completo, cache KV q8_0)
    - MTP aggiunge un overhead VRAM modesto; in caso di OOM a contesto 98K pieno, riduci `-c` (es. `-c 65536`).
    - Required GPU memory: `23Gi`

    **Accelerator modes**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` di memoria GPU; `-ngl all` per GPU completa  |
    | `nvidia-gb10`  | GPU (Spark)       | Come sopra, ma la memoria è gestita dal pod     |
    
    **How It Works**
    Prima Model Console scarica il modello e lo prepara, poi `llama.cpp` inizia a servire quando è pronto. MTP (`--spec-type draft-mtp`) usa la draft head integrata del modello per predire più token per passo e aumentare il throughput di decode.

    **Stack**
    - **llama.cpp**: Esegue il modello e serve le richieste API (porta 8081)
    - **Model Console**: Scarica il modello, mostra i progressi e fornisce l’API OpenAI sulla porta 8090, facendo proxy verso `llamacpp`

    **Model Storage**
    Tutti i file del modello sono memorizzati in una cartella condivisa in `appCommon/huggingface`, montata come `/cache/hf/hub`. Tutte le app simili usano questa posizione per i modelli.

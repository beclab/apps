metadata:
  description: "使用 llama.cpp 运行 Qwen3.6-27B MTP UD-Q4_K_XL 模型。"
  title: Qwen3.6-27B MTP (llama.cpp)

spec:
  upgradeDescription: |
    v1.0.23: Model Console（llm-init）版本更新为 v1.7.21。

    v1.0.22: Model Console 升级到 llm-init v1.7.19。

    v1.0.21: 内存预算纳入时间分片换出到主机内存的那部分显存（引擎 limit 30Gi→38Gi、request 6Gi→7Gi，应用 limitedMemory 32Gi→40Gi、requiredMemory 7Gi→8Gi）。旧上限已被占满，另一个模型占用显卡时容器会被 OOM kill。显存配额不变。

    v1.0.15: 下调 NVIDIA 主机内存预留，方便 1.12.6 时间分片节点安装（引擎 request 21Gi→6Gi，应用 requiredMemory 22Gi→7Gi）。显存配额不变。

    v1.0.11: bump llm-init to v1.3.8.
    v1.0.10: bump llama.cpp to `server-cuda12-b10068`; HF_TOKEN via Secret + OLARES_SYSTEM_HUGGINGFACE_*.

    v1.0.9: Move `HF_TOKEN` into Kubernetes Secret (`secretKeyRef`); map HF env from `OLARES_SYSTEM_HUGGINGFACE_*`.

    v1.0.8: LLAMACPP_MEMORY_LIMIT 30Gi; llm-init limit 2Gi; limitedMemory 32Gi (30+2).
    v1.0.7: nvidia host memory — requiredMemory 22Gi, LLAMACPP_MEMORY_REQUEST 21Gi, LLAMACPP_MEMORY_LIMIT 26Gi, limitedMemory 30Gi.
    v1.0.6: nvidia host memory — requiredMemory 16Gi, LLAMACPP_MEMORY_REQUEST 15Gi, LLAMACPP_MEMORY_LIMIT 19Gi, limitedMemory 26Gi.
    v1.0.5: bump engine args to -c 131072.
    v1.0.5: align nvidia and nvidia-gb10 requiredCpu=1300m.
    v1.0.4: bump llama.cpp to server-cuda12-b10068.
    v1.0.4: bump llm-init to v1.3.1.
    v1.0.4: align nvidia requiredMemory=12Gi and LLAMACPP_MEMORY_REQUEST=11Gi (qwopus pattern).
  fullDescription: |
    **模型简介**
    Qwen3.6-27B MTP 是阿里巴巴 Qwen 系列带内置 Multi-Token Prediction (MTP) 草稿头的文本模型变体。MTP 草稿解码每步预测多个 token，提升生成吞吐。支持思考与工具调用。本应用通过 llama.cpp 运行 `unsloth/Qwen3.6-27B-MTP-GGUF` 的 `UD-Q4_K_XL` GGUF 量化版本（纯文本预设，不含视觉/mmproj）。

    适合对 token 生成速度有极高要求的场景。带 MTP 技术的模型通过每步草稿多个 token 来加速解码。

    **预设配置**
    - 模型：`unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL`
    - 能力：思考、工具
    - 引擎参数：`-c 100352 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 2`（98K 上下文、MTP draft-2、全量 GPU 卸载、q8_0 KV 缓存）
    - MTP 增加少量显存占用；如果全 98K 上下文时 OOM，减少 `-c`（例如 `-c 65536`）。
    - 所需显存：`23Gi`

    **加速器模式**
    | 模式           | 设备             | 说明                                        |
    |----------------|------------------|---------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 使用 `23Gi` 显存，`-ngl all` 完全利用 GPU   |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                  |
    
    **工作流程说明**
    首先，Model Console 下载并准备模型，然后 `llama.cpp` 在模型就绪后启动服务。MTP（`--spec-type draft-mtp`）利用模型内置草稿头每步预测多个 token，提升解码吞吐。

    **技术栈说明**
    - **llama.cpp**：运行模型并通过 8081 端口提供 API 服务
    - **Model Console**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。


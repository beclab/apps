  fullDescription: |
    **Model Overview**
    Qwen3.6-27B MTP es una variante de modelo de texto con cabezas Multi-Token Prediction (MTP) integradas de la serie Qwen (Alibaba). La decodificación draft MTP predice varios tokens por paso para mayor throughput de generación. Admite thinking y tool calling. Esta app sirve el build GGUF `UD-Q4_K_XL` de `unsloth/Qwen3.6-27B-MTP-GGUF` vía llama.cpp (preset solo texto, sin vision/mmproj).

    Recomendado cuando necesitas una velocidad de generación de tokens muy alta. Los modelos con tecnología MTP aceleran el decode al redactar varios tokens en cada paso.

    **Preset Configuration**
    - Model: `unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL`
    - Capabilities: thinking, tools
    - Engine args: `-c 100352 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 2` (contexto 98K, MTP draft-2, offload GPU completo, caché KV q8_0)
    - MTP añade un overhead modesto de VRAM; si hay OOM a contexto 98K completo, reduce `-c` (p. ej. `-c 65536`).
    - Required GPU memory: `23Gi`

    **Accelerator modes**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` de memoria GPU; `-ngl all` para GPU completa  |
    | `nvidia-gb10`  | GPU (Spark)       | Como arriba, pero la memoria la gestiona el pod     |
    
    **How It Works**
    Primero, Model Console descarga el modelo y lo prepara, luego `llama.cpp` empieza a servir cuando está listo. MTP (`--spec-type draft-mtp`) usa la cabeza draft integrada del modelo para predecir varios tokens por paso y aumentar el throughput de decode.

    **Stack**
    - **llama.cpp**: Ejecuta el modelo y atiende peticiones API (puerto 8081)
    - **Model Console**: Descarga el modelo, muestra el progreso y ofrece la API OpenAI en el puerto 8090, haciendo proxy a `llamacpp`

    **Model Storage**
    Todos los archivos del modelo se almacenan en una carpeta compartida en `appCommon/huggingface`, montada como `/cache/hf/hub`. Todas las apps similares usan esta ubicación para modelos.

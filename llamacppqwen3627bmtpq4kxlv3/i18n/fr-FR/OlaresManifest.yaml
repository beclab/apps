  fullDescription: |
    **Model Overview**
    Qwen3.6-27B MTP est une variante de modèle texte avec têtes Multi-Token Prediction (MTP) intégrées de la série Qwen (Alibaba). Le draft decoding MTP prédit plusieurs tokens par étape pour un débit de génération plus élevé. Il prend en charge thinking et tool calling. Cette app sert le build GGUF `UD-Q4_K_XL` de `unsloth/Qwen3.6-27B-MTP-GGUF` via llama.cpp (preset texte seul, sans vision/mmproj).

    Recommandé lorsque vous avez besoin d’une vitesse de génération de tokens très élevée. Les modèles avec technologie MTP accélèrent le decode en rédigeant plusieurs tokens à chaque étape.

    **Preset Configuration**
    - Model : `unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL`
    - Capabilities : thinking, tools
    - Engine args : `-c 100352 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 2` (contexte 98K, MTP draft-2, offload GPU complet, cache KV q8_0)
    - MTP ajoute un overhead VRAM modeste ; en cas d’OOM à contexte 98K plein, réduisez `-c` (p. ex. `-c 65536`).
    - Required GPU memory : `23Gi`

    **Accelerator modes**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Utilise `23Gi` de mémoire GPU ; `-ngl all` pour GPU complète  |
    | `nvidia-gb10`  | GPU (Spark)       | Comme ci-dessus, mais la mémoire est gérée par le pod     |
    
    **How It Works**
    D’abord, Model Console télécharge le modèle et le prépare, puis `llama.cpp` commence à servir lorsqu’il est prêt. MTP (`--spec-type draft-mtp`) utilise la tête draft intégrée du modèle pour prédire plusieurs tokens par étape et augmenter le débit de decode.

    **Stack**
    - **llama.cpp** : Exécute le modèle et sert les requêtes API (port 8081)
    - **Model Console** : Télécharge le modèle, affiche la progression et fournit l’API OpenAI sur le port 8090, en proxy vers `llamacpp`

    **Model Storage**
    Tous les fichiers de modèle sont stockés dans un dossier partagé à `appCommon/huggingface`, monté comme `/cache/hf/hub`. Toutes les apps similaires utilisent cet emplacement pour les modèles.

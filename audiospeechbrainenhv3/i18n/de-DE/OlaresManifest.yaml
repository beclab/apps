metadata:
  description: Ein Modell zum Verringern von Rauschen und Verzerrungen in Sprachaufnahmen
  title: SpeechBrain Enhance

spec:
  fullDescription: |
    SpeechBrain Enhance verarbeitet Sprachaufnahmen, um Hintergrundgeräusche und Verzerrungen zu verringern. Das bereinigte Audio kann direkt wiedergegeben oder zur Transkription und Analyse an andere Anwendungen übergeben werden.

    **Hauptfunktionen**
    - Hintergrundgeräusche in Sprachaufnahmen verringern.
    - Ein verbessertes Audiosignal für Wiedergabe oder weitere Verarbeitung erzeugen.
    - Aufnahmen für Transkription und Audioanalyse vorbereiten.
    - Sprachverbesserung für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `2Gi` Grafikspeicher ist erforderlich.

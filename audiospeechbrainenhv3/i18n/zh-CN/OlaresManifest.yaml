metadata:
  description: 用于减少录音中噪声和失真的语音增强模型
  title: SpeechBrain Enhance

spec:
  fullDescription: |
    SpeechBrain Enhance 可处理语音录音，减少背景噪声和失真。处理后的音频可以直接播放，也可以交给其他应用进行转写或分析。

    **主要功能**
    - 减少语音录音中的背景噪声。
    - 生成用于播放或后续处理的增强音频。
    - 为转写和音频分析准备录音。
    - 向兼容的 Olares 应用提供语音增强能力。

    需要配备至少 `2Gi` 显存的兼容 NVIDIA GPU。

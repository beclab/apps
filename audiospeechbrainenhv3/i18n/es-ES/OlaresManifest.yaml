metadata:
  description: Un modelo para reducir el ruido y la distorsión en grabaciones de voz
  title: SpeechBrain Enhance

spec:
  fullDescription: |
    SpeechBrain Enhance procesa una grabación de voz para reducir el ruido de fondo y la distorsión. El audio limpio puede reproducirse directamente o enviarse a otra aplicación para su transcripción o análisis.

    **Funciones principales**
    - Reducir el ruido de fondo en grabaciones de voz.
    - Producir una señal de audio mejorada para reproducción o procesamiento posterior.
    - Preparar grabaciones para transcripción y análisis de audio.
    - Poner la mejora de voz a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `2Gi` de memoria gráfica.

olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiospeechbrainenhv3
  icon: https://app.cdn.olares.com/appstore/audioengines/speechbrain/icon.png
  description: A model for reducing noise and distortion in recorded speech
  appid: audiospeechbrainenhv3
  title: SpeechBrain Enhance
  version: '1.0.15'
  categories:
    - AI
    - models
  tags:
  - audio
  
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audiospeechbrainenhv3api
    host: sharedentrances-api
    port: 0
    title: SpeechBrain Enhance API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/audioengines/speechbrain/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audiospeechbrainenhv3
    port: 8090
    host: download-svc
    title: SpeechBrain Enhance
    icon: https://app.cdn.olares.com/appstore/audioengines/speechbrain/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiospeechbrainenhv3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'speechbrain/mtl-mimic-voicebank'
  fullDescription: |
    SpeechBrain Enhance processes a voice recording to reduce background noise and distortion. The cleaned audio can be played directly or passed to another application for transcription or analysis.

    **Key features**
    - Reduce background noise in recorded speech.
    - Produce an enhanced audio signal for playback or further processing.
    - Prepare recordings for transcription and audio analysis.
    - Make speech enhancement available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `2Gi` of GPU memory is required.

  developer: SpeechBrain
  website: https://speechbrain.github.io/
  sourceCode: https://huggingface.co/speechbrain/mtl-mimic-voicebank
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  license:
    - text: Apache-2.0
      url: https://huggingface.co/speechbrain/mtl-mimic-voicebank

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "3"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 30Gi
      limitedMemory: "10Gi"
      requiredMemory: "2304Mi"
      requiredGPUMemory: "2Gi"
      limitedGPUMemory: "2Gi"
    - mode: nvidia-gb10
      limitedCpu: "3"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 30Gi
      limitedMemory: "6Gi"
      requiredMemory: "2304Mi"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://speechbrain/mtl-mimic-voicebank"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "speechbrain/mtl-mimic-voicebank"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "enhance"
    multiSelect: true
    splitter: ","
    options:
    - title: Enhance (denoise)
      value: enhance
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "6Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    description: "Engine-native flags (llm-init ENGINE_ARGS), e.g. --amp to enable fp16."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN

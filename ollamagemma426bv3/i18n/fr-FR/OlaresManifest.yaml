metadata:
  title: Gemma 4 26B (Ollama)
  description: Un modèle d’IA local pour générer du texte, aider à coder et comprendre des images
spec:
  fullDescription: |
    Gemma 4 26B A4B est un modèle de Google DeepMind qui reçoit du texte et des images et génère des réponses textuelles. Cette application exécute le modèle localement avec Ollama pour les conversations, l’aide à la programmation et les questions sur des images.

    **Fonctionnalités principales**

    - Générer et résumer du texte, répondre aux questions et aider à programmer.
    - Interpréter des images et répondre à des requêtes combinant texte et images.
    - Utiliser un mode de réflexion pour les tâches de raisonnement.
    - Prendre en charge les appels d’outils dans les applications compatibles qui fournissent ces outils.

    **Utiliser le modèle sur Olares**

    L’application télécharge `gemma4:26b` depuis la bibliothèque Ollama. Model Console affiche la progression du téléchargement et gère le modèle pour les applications Olares compatibles. La fenêtre de contexte par défaut est de 128K tokens, ce qui limite la quantité de conversation et d’autres données d’entrée que le modèle peut traiter en une fois.

    [Documentation de Gemma 4](https://ai.google.dev/gemma/docs/core/model_card_4)

metadata:
  title: Gemma 4 26B (Ollama)
  description: Un modello IA locale per generare testo, assistere nella programmazione e comprendere immagini
spec:
  fullDescription: |
    Gemma 4 26B A4B è un modello di Google DeepMind che riceve testo e immagini e genera risposte testuali. Questa app esegue il modello localmente con Ollama per conversazioni, assistenza nella programmazione e domande sulle immagini.

    **Funzionalità principali**

    - Generare e riassumere testi, rispondere a domande e aiutare nella programmazione.
    - Interpretare immagini e rispondere a richieste che combinano testo e immagini.
    - Usare una modalità di riflessione per le attività di ragionamento.
    - Supportare le chiamate agli strumenti nelle applicazioni compatibili che li mettono a disposizione.

    **Usare il modello su Olares**

    L’app scarica `gemma4:26b` dalla libreria Ollama. Model Console mostra l’avanzamento del download e gestisce il modello per le applicazioni Olares compatibili. La finestra di contesto predefinita è di 128K token e limita la quantità di conversazione e di altri dati in ingresso che il modello può elaborare in una volta.

    [Documentazione di Gemma 4](https://ai.google.dev/gemma/docs/core/model_card_4)

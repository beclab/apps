metadata:
  title: Gemma 4 26B (Ollama)
  description: Un modelo de IA local para generar texto, ayudar a programar y comprender imágenes
spec:
  fullDescription: |
    Gemma 4 26B A4B es un modelo de Google DeepMind que recibe texto e imágenes y genera respuestas de texto. Esta aplicación ejecuta el modelo localmente con Ollama para conversaciones, ayuda con la programación y preguntas sobre imágenes.

    **Funciones principales**

    - Generar y resumir textos, responder preguntas y ayudar con la programación.
    - Interpretar imágenes y responder a instrucciones que combinan texto e imágenes.
    - Utilizar un modo de pensamiento para tareas de razonamiento.
    - Admitir llamadas a herramientas en aplicaciones compatibles que las proporcionen.

    **Usar el modelo en Olares**

    La aplicación descarga `gemma4:26b` de la biblioteca de Ollama. Model Console muestra el progreso de la descarga y gestiona el modelo para las aplicaciones Olares compatibles. La ventana de contexto predeterminada es de 128K tokens y limita la cantidad de conversación y de otras entradas que el modelo puede procesar a la vez.

    [Documentación de Gemma 4](https://ai.google.dev/gemma/docs/core/model_card_4)

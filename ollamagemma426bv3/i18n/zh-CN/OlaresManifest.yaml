metadata:
  title: Gemma 4 26B (Ollama)
  description: 用于文本生成、编程辅助和图像理解的本地 AI 模型
spec:
  fullDescription: |
    Gemma 4 26B A4B 是 Google DeepMind 开发的模型，可接收文本和图像输入并生成文本回复。本应用通过 Ollama 在本地运行该模型，用于对话、编程辅助和图像问答。

    **主要功能**

    - 生成和总结文本、回答问题并辅助编程。
    - 理解图像，响应同时包含文本和图像的提示。
    - 使用思考模式处理推理任务。
    - 在提供工具的兼容应用中支持工具调用。

    **在 Olares 上使用模型**

    本应用从 Ollama 模型库下载 `gemma4:26b`。Model Console 显示下载进度并管理模型，供兼容的 Olares 应用使用。默认上下文窗口为 128K tokens，决定模型一次能够处理多少对话和其他输入内容。

    [Gemma 4 文档](https://ai.google.dev/gemma/docs/core/model_card_4)

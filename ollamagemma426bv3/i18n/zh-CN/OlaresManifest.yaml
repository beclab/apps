metadata:
  description: "使用 Ollama 运行 Gemma 4 26B 模型。"
  title: Gemma 4 26B (Ollama)

spec:
  upgradeDescription: |
    v1.0.17: Model Console（llm-init）版本更新为 v1.7.21。

    v1.0.16: Model Console 升级到 llm-init v1.7.19。

    v1.0.14: Model Console 现在可以重启 Ollama daemon。llm-init 与 daemon 共享 appCache 下的 RUN_DIR，wrapper 改在 supervise_engine 下启动 `ollama serve`，因此在模型卡上修改 engine_args 会让 daemon 带着新参数重新起来。模型卡也会在 Pod 重启后保留——它落盘之后优先级高于应用设置里的 ENGINE_ARGS。

    v1.0.11: 下调 NVIDIA 主机内存预留，方便 1.12.6 时间分片节点安装（引擎 request 21Gi→6Gi，应用 requiredMemory 22Gi→7Gi）。显存配额不变。

    v1.0.6: bump ollama to 0.32.1.
    v1.0.5: nvidia host memory — requiredMemory 22Gi, OLLAMA_MEMORY_REQUEST 21Gi, OLLAMA_MEMORY_LIMIT 30Gi; llm-init limit 2Gi; limitedMemory 32Gi.
    v1.0.4: bump ollama to 0.31.2.
    v1.0.4: bump llm-init to v1.3.1.
  fullDescription: |
    **模型简介**
    Gemma 4 26B 是 Google Gemma 4 系列的混合专家模型，经指令微调，适用于推理、编程与多模态任务。支持思考、工具调用与视觉能力，Gemma 4 系列还覆盖视频与音频等多模态场景。本应用从 Ollama 模型库拉取 `gemma4:26b`。

    适合需要高解码吞吐与丰富多模态能力的场景。Gemma 4 26B 在视觉、视频与音频等负载上提供广泛的多模态能力。

    **预设配置**
    - 模型：`gemma4:26b`
    - 能力：思考、工具、视觉
    - 引擎参数：`OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=131072 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1`（128K 上下文、模型常驻显存、Flash Attention、q8_0 KV 缓存）
    - 所需显存：`23Gi`

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 使用 `23Gi` 显存；Ollama 默认使用 GPU                        |
    | `nvidia-gb10`  | GPU (Spark)      | 与上相同，显存由 pod 管理                                    |
    
    **工作流程说明**
    首先，Model Console 从 Ollama 模型库拉取并准备模型，然后 Ollama 守护进程在模型准备好后启动服务。两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **Ollama 守护进程**（11434 端口）：拉取并服务模型
    - **Model Console**（8090 端口）：驱动模型拉取、展示进度，并通过 OpenAI API 代理到 Ollama

    **模型存储**
    所有拉取的模型存储在共享目录 `appCommon/ollama`。所有基于 Ollama 的应用共享此位置，相同 blob 按 digest 去重。


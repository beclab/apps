metadata:
  title: Gemma 4 26B (Ollama)
  description: 文章生成、プログラミング支援、画像理解のためのローカルAIモデル
spec:
  fullDescription: |
    Gemma 4 26B A4BはGoogle DeepMindのモデルで、テキストと画像を入力として受け取り、テキストで回答します。このアプリはOllamaでモデルをローカル実行し、会話、プログラミング支援、画像についての質問に利用できます。

    **主な機能**

    - 文章の生成と要約、質問への回答、プログラミングの支援を行います。
    - 画像を解釈し、テキストと画像を組み合わせたプロンプトに回答します。
    - 推論タスクに思考モードを利用できます。
    - ツールを提供する対応アプリでツール呼び出しをサポートします。

    **Olaresでモデルを使う**

    このアプリはOllamaライブラリから`gemma4:26b`をダウンロードします。Model Consoleでダウンロードの進捗を表示し、対応するOlaresアプリで利用できるようモデルを管理します。デフォルトのコンテキストウィンドウは128Kトークンで、モデルが一度に処理できる会話やその他の入力の量を制限します。

    [Gemma 4のドキュメント](https://ai.google.dev/gemma/docs/core/model_card_4)

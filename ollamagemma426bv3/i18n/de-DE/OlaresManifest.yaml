metadata:
  description: "Gemma 4 26B, bereitgestellt mit Ollama"
  title: Gemma 4 26B (Ollama)
spec:
  upgradeDescription: |
    v1.0.17: Model Console (llm-init) wurde auf v1.7.21 aktualisiert.

    v1.0.16: Model Console wird auf llm-init v1.7.19 aktualisiert.

    v1.0.14: Die Model Console kann den Ollama-Daemon jetzt neu starten. llm-init und der Daemon teilen sich ein RUN_DIR unter appCache, und der Wrapper startet `ollama serve` unter supervise_engine — eine Änderung von engine_args auf der Modellkarte startet den Daemon mit den neuen Werten neu. Die Modellkarte übersteht jetzt auch einen Pod-Neustart und hat als Datei auf der Platte Vorrang vor der App-Einstellung ENGINE_ARGS.

    v1.0.11: NVIDIA-Hostspeicherreservierung gesenkt, damit 1.12.6 Timeslice-Knoten einfacher installieren können (Engine-Anforderung 21Gi→6Gi, erforderlicher Chart-Speicher 22Gi→7Gi). GPU-Kontingent unverändert.

    v1.0.6: Ollama auf 0.32.1 aktualisiert.
    v1.0.5: NVIDIA-Hostspeicher – requiredMemory 22Gi, OLLAMA_MEMORY_REQUEST 21Gi, OLLAMA_MEMORY_LIMIT 30Gi; llm-init-Limit 2Gi; limitedMemory 32Gi.
    v1.0.4: Ollama auf 0.31.2 aktualisiert.
    v1.0.4: llm-init auf v1.3.1 aktualisiert.
  fullDescription: |
    **Modellübersicht**
    Gemma 4 26B ist ein Mixture-of-Experts-Modell aus Googles Gemma-4-Familie, das für Schlussfolgerungen, Programmierung und multimodale Aufgaben instruktionsoptimiert wurde. Es unterstützt Denken, Tool-Aufrufe und Bildverarbeitung sowie in der Gemma-4-Reihe eine breite multimodale Abdeckung einschließlich Video und Audio. Diese App lädt `gemma4:26b` aus der Ollama-Bibliothek.

    Empfohlen, wenn Sie hohen Dekodierungsdurchsatz zusammen mit umfassender multimodaler Unterstützung benötigen. Gemma 4 26B bietet umfangreiche multimodale Funktionen für Bild-, Video- und Audio-Workloads.

    **Voreingestellte Konfiguration**
    - Modell: `gemma4:26b`
    - Fähigkeiten: Denken, Tools, Bildverarbeitung
    - Engine-Argumente: `OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=131072 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1` (128K Kontext, Modell im VRAM behalten, Flash Attention, q8_0 KV-Cache)
    - Erforderlicher GPU-Speicher: `23Gi`

    **Beschleunigermodi**
    | Modus          | Gerät             | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Verwendet `23Gi` GPU-Speicher; Ollama nutzt standardmäßig die GPU   |
    | `nvidia-gb10`  | GPU (Spark)       | Wie oben, aber der Speicher wird vom Pod verwaltet                   |

    **Funktionsweise**
    Zuerst lädt Model Console das Modell aus der Ollama-Bibliothek und bereitet es vor. Anschließend beginnt der Ollama-Daemon mit der Bereitstellung. Beide Komponenten laufen getrennt, teilen jedoch Dateien und Fortschrittsinformationen.

    **Stack**
    - **Ollama-Daemon** (Port 11434): lädt das Modell und stellt es bereit
    - **Model Console** (Port 8090): steuert den Modelldownload, zeigt den Fortschritt und stellt die OpenAI API über einen Proxy zu Ollama bereit

    **Modellspeicher**
    Alle geladenen Modelle werden im gemeinsamen Ordner `appCommon/ollama` gespeichert. Alle Ollama-basierten Apps nutzen diesen Speicherort, sodass Blobs installationsübergreifend anhand ihres Digests dedupliziert werden.

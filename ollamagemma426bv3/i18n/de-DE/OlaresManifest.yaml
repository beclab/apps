metadata:
  title: Gemma 4 26B (Ollama)
  description: Ein lokales KI-Modell für Textgenerierung, Programmierhilfe und Bildverständnis
spec:
  fullDescription: |
    Gemma 4 26B A4B ist ein Modell von Google DeepMind, das Text und Bilder als Eingabe verarbeitet und Textantworten erzeugt. Diese App führt das Modell lokal mit Ollama aus, um Gespräche, Programmierhilfe und Fragen zu Bildern zu ermöglichen.

    **Hauptfunktionen**

    - Texte erzeugen und zusammenfassen, Fragen beantworten und beim Programmieren helfen.
    - Bilder interpretieren und auf Eingaben antworten, die Text und Bilder kombinieren.
    - Einen Denkmodus für Schlussfolgerungsaufgaben nutzen.
    - Werkzeugaufrufe in kompatiblen Anwendungen unterstützen, die Werkzeuge bereitstellen.

    **Das Modell auf Olares verwenden**

    Die App lädt `gemma4:26b` aus der Ollama-Bibliothek herunter. Model Console zeigt den Downloadfortschritt an und verwaltet das Modell für kompatible Olares-Anwendungen. Das voreingestellte Kontextfenster umfasst 128K Tokens und begrenzt die Menge an Gesprächsinhalten und weiteren Eingaben, die das Modell gleichzeitig verarbeiten kann.

    [Gemma-4-Dokumentation](https://ai.google.dev/gemma/docs/core/model_card_4)

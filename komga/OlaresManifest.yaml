olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  komgaweb: 1
  komga: 1
metadata:
  name: komga
  description: A media server for your comics, mangas, BDs, magazines and eBooks.
  icon: https://app.cdn.olares.com/appstore/komga/icon.png
  appid: komga
  version: '1.0.16'
  title: Komga
  categories:
  - Fun
  - homelab
  tags:
  - reading

entrances:
- name: komga
  port: 8080
  host: komga-web-svc
  title: Komga
  icon: https://app.cdn.olares.com/appstore/komga/icon.png
  authLevel: internal
  openMethod: window
permission:
  appData: true
  appCache: true
  userData:
  - Home
  externalData: true
spec:
  versionName: '1.26.3'
  featuredImage: https://app.cdn.olares.com/appstore/komga/1.webp
  promoteImage:
  - https://app.cdn.olares.com/appstore/komga/1.webp
  - https://app.cdn.olares.com/appstore/komga/2.webp
  - https://app.cdn.olares.com/appstore/komga/3.webp
  - https://app.cdn.olares.com/appstore/komga/4.webp

  fullDescription: |
    Komga is a media server for your comics, mangas, BDs, magazines and eBooks.

    **Features**
    - Browse libraries, series and books via a responsive web UI that works on desktop, tablets and phones
    - Organize your library with collections and read lists
    - Edit metadata for your series and books
    - Import embedded metadata automatically
    - Webreader with multiple reading modes
    - Manage multiple users, with per-library access control, age restrictions, and labels restrictions
    - Offers a REST API, many community tools and scripts can interact with Komga
    - Download book files, whole series, or read lists
    - Duplicate files detection
    - Duplicate pages detection and removal
    - Import books from outside your libraries directly into your series folder
    - Import ComicRack cbl read lists
  upgradeDescription: |
    Raise Spring Boot multipart limits to 500MB (`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`, plus Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`) so poster and file uploads are not rejected with HTTP 413 after the Spring default of 1MB per file.

    Upgrade Komga from 1.24.1 to 1.26.3 and switch the app image from `beclab/gotson-komga:1.24.1` to the official `gotson/komga:1.26.3` (the beclab mirror has no 1.26.x tags).

    Raise the OpenResty reverse-proxy upload limit to `client_max_body_size 500m` so CBZ/CBR/PDF uploads are not rejected with HTTP 413 (official OpenResty defaults to 1m). Roll `komgaweb` when the nginx ConfigMap changes (`checksum/nginx-config`), because a `subPath` mount does not pick up in-place ConfigMap updates.

    Komga 1.26 highlights:
    - NextUI beta, served alongside the existing WebUI (`/next`)
    - Native RAR5 support
    - Referential API v2, poster access restrictions, and EPUB/divina detection fixes

    Latest release note at: https://github.com/gotson/komga/releases/tag/1.26.3

  developer: gotson
  website: https://komga.org/
  sourceCode: https://github.com/gotson/komga
  submitter: Olares
  locale:

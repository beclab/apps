metadata:
  title: Komga
  description: Ein Medienserver für Comics, Mangas, BDs, Magazine und E-Books
spec:
  fullDescription: |
    Komga ist ein Medienserver für Ihre Comics, Mangas, BDs, Magazine und E-Books.
    
    **Funktionen**
    - Bibliotheken, Serien und Bücher über eine responsive Web-UI durchsuchen, die auf Desktop, Tablets und Handys funktioniert
    - Bibliothek mit Collections und Leselisten organisieren
    - Metadaten für Serien und Bücher bearbeiten
    - Eingebettete Metadaten automatisch importieren
    - Webreader mit mehreren Lesemodi
    - Mehrere Benutzer verwalten, mit Zugriffskontrolle pro Bibliothek, Altersbeschränkungen und Label-Einschränkungen
    - Bietet eine REST-API; viele Community-Tools und Skripte können mit Komga interagieren
    - Buchdateien, ganze Serien oder Leselisten herunterladen
    - Erkennung doppelter Dateien
    - Erkennung und Entfernung doppelter Seiten
    - Bücher von außerhalb Ihrer Bibliotheken direkt in Ihren Serienordner importieren
    - ComicRack-cbl-Leselisten importieren
  upgradeDescription: |
    Aktualisiert komga von 1.26.3 auf 1.30.0. Enthält die in den Versionshinweisen beschriebenen Verbesserungen und Fehlerbehebungen.

    Versionshinweise: https://github.com/gotson/komga/releases/tag/1.30.0

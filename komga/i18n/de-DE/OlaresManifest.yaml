metadata:
  title: Komga
  description: Ein Medienserver für Comics, Mangas, BDs, Magazine und E-Books
spec:
  fullDescription: |
    Komga ist ein Medienserver für Ihre Comics, Mangas, BDs, Magazine und E-Books.
    
    **Funktionen**
    - Bibliotheken, Serien und Bücher über eine responsive Web-UI durchsuchen, die auf Desktop, Tablets und Handys funktioniert
    - Bibliothek mit Collections und Leselisten organisieren
    - Metadaten für Serien und Bücher bearbeiten
    - Eingebettete Metadaten automatisch importieren
    - Webreader mit mehreren Lesemodi
    - Mehrere Benutzer verwalten, mit Zugriffskontrolle pro Bibliothek, Altersbeschränkungen und Label-Einschränkungen
    - Bietet eine REST-API; viele Community-Tools und Skripte können mit Komga interagieren
    - Buchdateien, ganze Serien oder Leselisten herunterladen
    - Erkennung doppelter Dateien
    - Erkennung und Entfernung doppelter Seiten
    - Bücher von außerhalb Ihrer Bibliotheken direkt in Ihren Serienordner importieren
    - ComicRack-cbl-Leselisten importieren
  upgradeDescription: |
    Spring-Boot-Multipart-Limits auf 500MB erhöht (`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`, plus Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`), damit Poster- und Datei-Uploads nach dem Spring-Standard von 1MB pro Datei nicht mit HTTP 413 abgelehnt werden.
    
    Komga von 1.24.1 auf 1.26.3 aktualisiert und App-Image von `beclab/gotson-komga:1.24.1` auf das offizielle `gotson/komga:1.26.3` umgestellt (der beclab-Mirror hat keine 1.26.x-Tags).
    
    OpenResty-Reverse-Proxy-Upload-Limit auf `client_max_body_size 500m` erhöht, damit CBZ/CBR/PDF-Uploads nicht mit HTTP 413 abgelehnt werden (offizielles OpenResty standardmäßig 1m). `komgaweb` rollen, wenn sich die nginx-ConfigMap ändert (`checksum/nginx-config`), da ein `subPath`-Mount In-Place-ConfigMap-Updates nicht übernimmt.
    
    Highlights von Komga 1.26:
    - NextUI-Beta, neben der bestehenden WebUI (`/next`)
    - Native RAR5-Unterstützung
    - Referential API v2, Poster-Zugriffsbeschränkungen und EPUB/divina-Erkennungsfixes
    
    Neueste Release Note: https://github.com/gotson/komga/releases/tag/1.26.3

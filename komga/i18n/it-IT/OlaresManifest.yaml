metadata:
  title: Komga
  description: Un media server per fumetti, manga, BD, riviste ed eBook
spec:
  fullDescription: |
    Komga è un media server per i tuoi fumetti, manga, BD, riviste ed eBook.
    
    **Funzioni**
    - Sfoglia librerie, serie e libri tramite una web UI responsive che funziona su desktop, tablet e telefoni
    - Organizza la libreria con collection e read list
    - Modifica i metadati di serie e libri
    - Importa automaticamente i metadati incorporati
    - Webreader con più modalità di lettura
    - Gestisci più utenti, con controllo accessi per libreria, restrizioni di età e label
    - Offre una REST API; molti tool e script della community possono interagire con Komga
    - Scarica file di libri, serie intere o read list
    - Rilevamento file duplicati
    - Rilevamento e rimozione di pagine duplicate
    - Importa libri da fuori le librerie direttamente nella cartella della serie
    - Importa read list ComicRack cbl
  upgradeDescription: |
    Aumento dei limiti multipart di Spring Boot a 500MB (`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`, più Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`) così upload di poster e file non vengono rifiutati con HTTP 413 dopo il default Spring di 1MB per file.
    
    Aggiornamento di Komga da 1.24.1 a 1.26.3 e passaggio dell'immagine da `beclab/gotson-komga:1.24.1` all'ufficiale `gotson/komga:1.26.3` (il mirror beclab non ha tag 1.26.x).
    
    Aumento del limite di upload del reverse proxy OpenResty a `client_max_body_size 500m` così gli upload CBZ/CBR/PDF non vengono rifiutati con HTTP 413 (OpenResty ufficiale default 1m). Esegui il roll di `komgaweb` quando cambia il ConfigMap nginx (`checksum/nginx-config`), perché un mount `subPath` non raccoglie aggiornamenti in-place del ConfigMap.
    
    Highlight di Komga 1.26:
    - NextUI beta, servita insieme alla WebUI esistente (`/next`)
    - Supporto nativo RAR5
    - Referential API v2, restrizioni accesso poster e fix rilevamento EPUB/divina
    
    Ultima release note: https://github.com/gotson/komga/releases/tag/1.26.3

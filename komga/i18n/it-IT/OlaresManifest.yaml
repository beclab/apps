metadata:
  title: Komga
  description: Un media server per fumetti, manga, BD, riviste ed eBook
spec:
  fullDescription: |
    Komga è un media server per i tuoi fumetti, manga, BD, riviste ed eBook.
    
    **Funzioni**
    - Sfoglia librerie, serie e libri tramite una web UI responsive che funziona su desktop, tablet e telefoni
    - Organizza la libreria con collection e read list
    - Modifica i metadati di serie e libri
    - Importa automaticamente i metadati incorporati
    - Webreader con più modalità di lettura
    - Gestisci più utenti, con controllo accessi per libreria, restrizioni di età e label
    - Offre una REST API; molti tool e script della community possono interagire con Komga
    - Scarica file di libri, serie intere o read list
    - Rilevamento file duplicati
    - Rilevamento e rimozione di pagine duplicate
    - Importa libri da fuori le librerie direttamente nella cartella della serie
    - Importa read list ComicRack cbl
  upgradeDescription: |
    Aggiorna komga da 1.26.3 a 1.30.0. Include i miglioramenti e le correzioni descritti nelle note di rilascio.

    Note di rilascio: https://github.com/gotson/komga/releases/tag/1.30.0

metadata:
  title: Komga
  description: Un serveur multimédia pour vos comics, mangas, BD, magazines et eBooks
spec:
  fullDescription: |
    Komga est un serveur multimédia pour vos comics, mangas, BD, magazines et eBooks.
    
    **Fonctionnalités**
    - Parcourir bibliothèques, séries et livres via une UI web responsive qui fonctionne sur bureau, tablettes et téléphones
    - Organiser votre bibliothèque avec des collections et des listes de lecture
    - Modifier les métadonnées de vos séries et livres
    - Importer automatiquement les métadonnées intégrées
    - Lecteur web avec plusieurs modes de lecture
    - Gérer plusieurs utilisateurs, avec contrôle d'accès par bibliothèque, restrictions d'âge et de labels
    - Offre une API REST ; de nombreux outils et scripts communautaires peuvent interagir avec Komga
    - Télécharger des fichiers de livres, des séries entières ou des listes de lecture
    - Détection des fichiers en double
    - Détection et suppression des pages en double
    - Importer des livres depuis l'extérieur de vos bibliothèques directement dans le dossier de série
    - Importer des listes de lecture ComicRack cbl
  upgradeDescription: |
    Augmentation des limites multipart Spring Boot à 500MB (`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`, plus Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`) afin que les téléversements d'affiches et de fichiers ne soient pas rejetés avec HTTP 413 après le défaut Spring de 1MB par fichier.
    
    Mise à niveau de Komga de 1.24.1 à 1.26.3 et passage de l'image `beclab/gotson-komga:1.24.1` à l'officielle `gotson/komga:1.26.3` (le miroir beclab n'a pas de tags 1.26.x).
    
    Augmentation de la limite d'upload du reverse proxy OpenResty à `client_max_body_size 500m` pour que les uploads CBZ/CBR/PDF ne soient pas rejetés avec HTTP 413 (OpenResty officiel par défaut à 1m). Redémarrer `komgaweb` lorsque le ConfigMap nginx change (`checksum/nginx-config`), car un montage `subPath` ne prend pas en compte les mises à jour in-place du ConfigMap.
    
    Points forts de Komga 1.26 :
    - NextUI bêta, servi aux côtés de la WebUI existante (`/next`)
    - Prise en charge native RAR5
    - Referential API v2, restrictions d'accès aux affiches et correctifs de détection EPUB/divina
    
    Dernière note : https://github.com/gotson/komga/releases/tag/1.26.3

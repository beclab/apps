metadata:
  title: Komga
  description: コミック、マンガ、BD、雑誌、電子書籍向けのメディアサーバー
spec:
  fullDescription: |
    Komga はコミック、マンガ、BD、雑誌、電子書籍向けのメディアサーバーです。
    
    **機能**
    - デスクトップ、タブレット、スマホで使えるレスポンシブ Web UI でライブラリ、シリーズ、書籍を閲覧
    - コレクションと読書リストでライブラリを整理
    - シリーズと書籍のメタデータを編集
    - 埋め込みメタデータを自動インポート
    - 複数の読書モードを備えた Web リーダー
    - ライブラリ単位のアクセス制御、年齢制限、ラベル制限付きで複数ユーザーを管理
    - REST API を提供。多くのコミュニティツールやスクリプトが Komga と連携可能
    - 書籍ファイル、シリーズ全体、読書リストをダウンロード
    - 重複ファイル検出
    - 重複ページの検出と削除
    - ライブラリ外からシリーズフォルダへ直接書籍をインポート
    - ComicRack cbl 読書リストをインポート
  upgradeDescription: |
    Spring Boot の multipart 上限を 500MB に引き上げ（`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`、および Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`）。Spring 既定の 1MB/ファイルでポスターやファイルアップロードが HTTP 413 にならないようにします。
    
    Komga を 1.24.1 から 1.26.3 へアップグレードし、イメージを `beclab/gotson-komga:1.24.1` から公式 `gotson/komga:1.26.3` に切り替え（beclab ミラーに 1.26.x タグなし）。
    
    OpenResty リバースプロキシのアップロード上限を `client_max_body_size 500m` に引き上げ、CBZ/CBR/PDF が HTTP 413 にならないように（公式 OpenResty 既定は 1m）。nginx ConfigMap 変更時（`checksum/nginx-config`）は `komgaweb` をロール。`subPath` マウントは ConfigMap のインプレース更新を拾いません。
    
    Komga 1.26 のハイライト:
    - 既存 WebUI と並ぶ NextUI ベータ（`/next`）
    - ネイティブ RAR5 サポート
    - Referential API v2、ポスターアクセス制限、EPUB/divina 検出の修正
    
    最新リリースノート: https://github.com/gotson/komga/releases/tag/1.26.3

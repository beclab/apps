metadata:
  title: Komga
  description: 漫画、漫画、 BD、杂志和电子书的媒体服务器。
spec:
  fullDescription: |
    Komga 是一款媒体服务器，可存储您的漫画、漫画、BD、杂志和电子书。

    **功能**
    - 通过可在桌面、平板电脑和手机上运行的响应式 Web UI 浏览图书馆、系列和书籍
    - 使用收藏和阅读列表整理您的图书馆
    - 编辑系列和书籍的元数据
    - 自动导入嵌入式元数据
    - 提供多种阅读模式的 Web 阅读器
    - 管理多个用户，并设置每个图书馆的访问权限、年龄限制和标签限制
    - 提供 REST API，许多社区工具和脚本可以与 Komga 交互
    - 下载书籍文件、整个系列或阅读列表
    - 重复文件检测
    - 重复页面检测和删除
    - 将图书馆外部的书籍直接导入到您的系列文件夹中
    - 导入 ComicRack 的 cbl 阅读列表
  
  upgradeDescription: |
    将 Spring Boot multipart 上传上限提升到 500MB（`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`，以及 Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`），避免封面和文件上传因 Spring 默认单文件 1MB 返回 HTTP 413。

    将 Komga 从 1.24.1 升级到 1.26.3，应用镜像由 `beclab/gotson-komga:1.24.1` 切换为官方 `gotson/komga:1.26.3`（beclab 镜像仓库没有 1.26.x 标签）。

    将 OpenResty 反向代理上传限制提升为 `client_max_body_size 500m`，避免 CBZ/CBR/PDF 上传因默认 1m 限制返回 HTTP 413。nginx ConfigMap 变更时通过 `checksum/nginx-config` 滚动重建 `komgaweb`（`subPath` 挂载不会随 ConfigMap 原地更新）。

    Komga 1.26 要点：
    - NextUI 测试版，与现有 WebUI 并存（`/next`）
    - 原生 RAR5 支持
    - Referential API v2、封面访问限制以及 EPUB/divina 检测修复

    最新发布说明见: https://github.com/gotson/komga/releases/tag/1.26.3

metadata:
  title: Komga
  description: Un servidor multimedia para tus cómics, mangas, BDs, revistas y eBooks
spec:
  fullDescription: |
    Komga es un servidor multimedia para tus cómics, mangas, BDs, revistas y eBooks.
    
    **Funciones**
    - Explorar bibliotecas, series y libros mediante una UI web responsive que funciona en escritorio, tablets y móviles
    - Organizar tu biblioteca con colecciones y listas de lectura
    - Editar metadatos de series y libros
    - Importar metadatos incrustados automáticamente
    - Lector web con múltiples modos de lectura
    - Gestionar varios usuarios, con control de acceso por biblioteca, restricciones de edad y etiquetas
    - Ofrece una API REST; muchas herramientas y scripts de la comunidad pueden interactuar con Komga
    - Descargar archivos de libros, series completas o listas de lectura
    - Detección de archivos duplicados
    - Detección y eliminación de páginas duplicadas
    - Importar libros desde fuera de tus bibliotecas directamente a la carpeta de la serie
    - Importar listas de lectura ComicRack cbl
  upgradeDescription: |
    Aumento de los límites multipart de Spring Boot a 500MB (`SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE` / `MAX_REQUEST_SIZE`, más Tomcat `MAX_HTTP_FORM_POST_SIZE` / `MAX_SWALLOW_SIZE`) para que las subidas de pósters y archivos no se rechacen con HTTP 413 tras el valor predeterminado de Spring de 1MB por archivo.
    
    Actualización de Komga de 1.24.1 a 1.26.3 y cambio de la imagen de `beclab/gotson-komga:1.24.1` a la oficial `gotson/komga:1.26.3` (el espejo beclab no tiene etiquetas 1.26.x).
    
    Aumento del límite de subida del reverse proxy OpenResty a `client_max_body_size 500m` para que las subidas CBZ/CBR/PDF no se rechacen con HTTP 413 (OpenResty oficial por defecto 1m). Reiniciar `komgaweb` cuando cambie el ConfigMap de nginx (`checksum/nginx-config`), porque un montaje `subPath` no recoge actualizaciones in-place del ConfigMap.
    
    Aspectos destacados de Komga 1.26:
    - NextUI beta, servida junto a la WebUI existente (`/next`)
    - Soporte nativo RAR5
    - Referential API v2, restricciones de acceso a pósters y correcciones de detección EPUB/divina
    
    Última nota: https://github.com/gotson/komga/releases/tag/1.26.3

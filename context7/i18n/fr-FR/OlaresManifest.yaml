metadata:
  title: Context7
  description: Documentation de code à jour pour les LLM et éditeurs de code AI
spec:
  upgradeDescription: |
    Remplacement de l’image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l’image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l’image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Context7 apporte une documentation à jour et spécifique à la version, ainsi que des exemples de code, directement dans votre assistant de coding AI. Fini le code obsolète et les API inventées.

    **Deux modes :**
    - CLI + Skills — installe un skill qui guide votre agent pour récupérer la doc via des commandes CLI (sans MCP)ctx7
    - MCP — enregistre un serveur MCP Context7 pour que votre agent appelle nativement les outils de documentation

    **Fonctionnalités**
    - Accès à la documentation en temps réel : Donne aux modèles AI accès à la documentation actuelle de milliers de bibliothèques et frameworks
    - Résolution automatique des bibliothèques : Trouve et récupère automatiquement la documentation pertinente selon les requêtes
    - Contenu à jour : Fournit toujours la dernière documentation des sources officielles
    - Intégration facile : Configuration simple sans réglage supplémentaire
    - Intégration transparente avec VS Code : Fonctionne directement avec les fonctions AI intégrées de VS Code

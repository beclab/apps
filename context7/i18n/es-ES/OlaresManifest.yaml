metadata:
  title: Context7
  description: Documentación de código actualizada para LLMs y editores de código con AI
spec:
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear montajes de configuración nginx y rutas de logs con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Context7 lleva documentación actualizada y específica de versión, junto con ejemplos de código, directamente a tu asistente de codificación con AI. Adiós al código obsoleto y a las APIs inventadas.

    **Funciona en dos modos:**
    - CLI + Skills — instala un skill que guía a tu agente para obtener docs con comandos CLI (sin MCP)ctx7
    - MCP — registra un servidor MCP de Context7 para que tu agente llame nativamente a herramientas de documentación

    **Funciones**
    - Acceso a documentación en tiempo real: Da a los modelos de AI acceso a documentación actual de miles de bibliotecas y frameworks
    - Resolución automática de bibliotecas: Encuentra y recupera documentación relevante según las consultas del usuario
    - Contenido actualizado: Siempre ofrece la documentación más reciente de fuentes oficiales
    - Integración sencilla: Configuración simple sin configuración adicional
    - Integración fluida con VS Code: Funciona directamente con las funciones de AI integradas de VS Code

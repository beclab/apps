metadata:
  title: Context7
  description: 为 LLM 和 AI 代码编辑器提供最新代码文档的 MCP 服务器
spec:
  upgradeDescription: |
    将反向代理镜像从 Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）切换为官方 OpenResty 镜像 `openresty/openresty:1.29.2.5-bookworm-fat`。

    同步调整 nginx 配置挂载与日志路径以匹配官方镜像布局（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`），并移除 Bitnami 专用的 `OPENRESTY_CONF_FILE` 配置。
  fullDescription: |
    Context7 让最新、特定版本的代码文档和代码示例直接集成到你的 AI 编程助手中。这意味着不再有过时的代码或“臆想”API。

    **支持两种模式：**
    - CLI + Skills — 安装一个 Skill，通过 CLI 命令引导你的 Agent 获取文档（无需 MCP）
    - MCP — 注册 Context7 MCP 服务器，使你的 Agent 能够原生调用文档工具

    **功能特点**
    - 实时文档访问：为 AI 模型提供数千个库和框架的最新官方文档
    - 自动库解析：根据用户查询自动查找并获取相关文档
    - 始终保持最新：始终提供来自官方来源的最新文档内容
    - 易于集成：简单设置，无需额外配置
    - 无缝 VS Code 集成：可直接与 VS Code 内置 AI 功能协同使用

metadata:
  title: Context7
  description: Aktuelle Code-Dokumentation für LLMs und AI-Code-Editoren
spec:
  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernen.
  fullDescription: |
    Context7 bringt aktuelle, versionsspezifische Dokumentation und Code-Beispiele direkt in Ihren AI-Coding-Assistenten. Kein veralteter Code und keine halluzinierten APIs mehr.

    **Zwei Modi:**
    - CLI + Skills — installiert einen Skill, der Ihren Agenten anleitet, Docs per CLI-Befehlen abzurufen (kein MCP nötig)ctx7
    - MCP — registriert einen Context7-MCP-Server, damit Ihr Agent Dokumentations-Tools nativ aufrufen kann

    **Funktionen**
    - Echtzeit-Dokumentationszugriff: Gibt AI-Modellen Zugriff auf aktuelle Dokumentation für Tausende von Bibliotheken und Frameworks
    - Automatische Bibliotheksauflösung: Findet und holt relevante Dokumentation automatisch anhand von Nutzeranfragen
    - Aktuelle Inhalte: Liefert stets die neueste Dokumentation aus offiziellen Quellen
    - Einfache Integration: Einfaches Setup ohne zusätzliche Konfiguration
    - Nahtlose VS-Code-Integration: Funktioniert direkt mit den integrierten AI-Funktionen von VS Code

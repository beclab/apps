# Engine wrapper for embed-server.
#
# embed.sh is a verbatim copy of llm-init deploy/wrappers/embed.sh. The
# helpers it sources are NOT here: llm-init publishes common.sh into the
# shared run dir and the Deployment points WRAPPER_COMMON at that copy, so
# supervise_engine -- which is what makes POST /api/engine/restart work --
# has one implementation instead of one per chart. The script waits for it,
# because nothing orders the two Deployments.
#
# This therefore requires an llm-init image that publishes the helpers, and
# there is no copy left here to fall back to: with an older image the engine
# waits out WRAPPER_COMMON_WAIT and exits. Bump llmInitTag in _helpers.tpl
# in the same change that ships this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: embed-server-wrappers
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: embed-server
data:
  embed.sh: |
    #!/bin/sh
    # Embed (IREmbeddingServer) engine wrapper.
    #
    # Waits for llm-init sentinel, sets EMBED_MODEL_DIR from model_path,
    # then runs embed_server under supervise_engine so POST /api/engine/restart
    # can relaunch an engine that has wedged. Engine configuration uses
    # IREmbeddingServer native env (MODEL_ID, EMBED_DEVICE, ...), NOT llm-init
    # ENGINE_ARGS: config.ParseEngineArgs rejects a non-empty value for this
    # kind, so there is no engine_args handoff to wait for.
    #
    # MODEL_ID selects a compile-time registry entry (embed_core registry).
    # GET /v1/models advertises ModelSpec.model_name; llm-init MODEL_NAME
    # must match that logical name (see deploy/compose/.env.example).
    #
    # Required env (embed container):
    #   MODEL_ID -- registry id, e.g. embeddinggemma-300m-ov
    # Optional env:
    #   EMBED_SERVER_BIN -- override binary (default /usr/local/bin/embed_server)
    #   EMBED_PORT       -- default 8080 (matches deriveEngineURL for embed)

    # shellcheck disable=SC2034
    ENGINE=embed
    # Source the shared helpers: the sibling copy by default, or the one
    # llm-init publishes into RUN_DIR when WRAPPER_COMMON says so. That copy
    # can arrive late — the two containers are separate Deployments with no
    # ordering between them — so waiting here is the normal path.
    # Keep this block byte-identical across wrappers (tests/wrappers checks).
    WRAPPER_COMMON=${WRAPPER_COMMON:-"$(dirname "$0")/common.sh"}
    _wc=0
    while [ ! -f "$WRAPPER_COMMON" ] && [ "$_wc" -lt "${WRAPPER_COMMON_WAIT:-3600}" ]; do
        printf '[wrapper] waiting for %s (elapsed=%ss)\n' "$WRAPPER_COMMON" "$_wc"
        sleep 5
        _wc=$((_wc + 5))
    done
    [ -f "$WRAPPER_COMMON" ] || { printf '[wrapper] %s never appeared\n' "$WRAPPER_COMMON" >&2; exit 1; }
    unset _wc
    # shellcheck source=common.sh
    . "$WRAPPER_COMMON"

    wait_for_sentinel
    MODEL_PATH=$(read_model_path)
    export EMBED_MODEL_DIR="$MODEL_PATH"

    EMBED_SERVER_BIN="${EMBED_SERVER_BIN:-/usr/local/bin/embed_server}"
    if [ ! -x "$EMBED_SERVER_BIN" ]; then
        EMBED_SERVER_BIN="$(command -v embed_server 2>/dev/null || true)"
    fi
    if [ -z "$EMBED_SERVER_BIN" ] || [ ! -x "$EMBED_SERVER_BIN" ]; then
        log "embed_server binary not found (checked /usr/local/bin/embed_server, \$PATH, \$EMBED_SERVER_BIN)"
        exit 127
    fi

    run_embed() {
        log "starting embed_server model_dir=$MODEL_PATH model_id=${MODEL_ID:-unset} port=${EMBED_PORT:-8080}"
        exec "$EMBED_SERVER_BIN" "$@"
    }

    supervise_engine run_embed "$@"

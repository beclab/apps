metadata:
  title: EmbeddingGemma
  description: "Un modelo multilingüe de embeddings de texto para la búsqueda semántica"

spec:
  fullDescription: |
    EmbeddingGemma convierte el texto en vectores numéricos que representan su significado. Las aplicaciones pueden comparar estos vectores para encontrar pasajes relacionados, agrupar documentos similares o recuperar contexto para las respuestas de IA.

    Esta aplicación pone el modelo EmbeddingGemma-300M de Google a disposición de las aplicaciones Olares compatibles. El modelo admite más de 100 idiomas y está diseñado para generar embeddings de texto, en lugar de respuestas.

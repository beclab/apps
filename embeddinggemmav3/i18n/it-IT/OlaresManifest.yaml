metadata:
  title: EmbeddingGemma
  description: "Un modello multilingue di embedding testuali per la ricerca semantica"

spec:
  fullDescription: |
    EmbeddingGemma trasforma il testo in vettori numerici che ne rappresentano il significato. Le applicazioni possono confrontare questi vettori per trovare passaggi pertinenti, raggruppare documenti simili o recuperare il contesto per le risposte dell'IA.

    Questa app rende disponibile il modello EmbeddingGemma-300M di Google alle applicazioni Olares compatibili. Il modello supporta oltre 100 lingue ed è destinato alla creazione di embedding testuali, anziché alla generazione di risposte.

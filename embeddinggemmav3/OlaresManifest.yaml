olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: embeddinggemmav3
  icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
  description: "A multilingual text embedding model for semantic search"
  appid: embeddinggemmav3
  title: EmbeddingGemma
  version: '1.1.5'
  categories:
    - AI
    - models
  tags:
    - embedding
sharedEntrances:
  - name: embeddinggemmav3
    host: sharedentrances-api
    port: 0
    title: EmbeddingGemma API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
entrances:
  - name: embedclient
    port: 8090
    host: download-svc
    title: EmbeddingGemma
    icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
    openMethod: window
    authLevel: internal
  - name: embedapi
    port: 8090
    host: download-svc
    title: EmbeddingGemma API
    icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
    invisible: true
    openMethod: window
    authLevel: internal
#   embeddinggemmav3 — embed-server engine Deployment (== appid / Release.Name)
#   llminit            — llm-init (ENGINE_KIND=embed): download + API proxy
workloadReplicas:
  embeddinggemmav3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: '0.1.0'
  fullDescription: |
    EmbeddingGemma turns text into numerical vectors that represent its meaning. Applications can compare these vectors to find related passages, group similar documents, or retrieve context for AI answers.

    This app makes Google's EmbeddingGemma-300M model available to compatible Olares applications. The model supports more than 100 languages and is intended for text embedding rather than generating answers.
  developer: Google DeepMind
  website: https://ai.google.dev/gemma/docs/embeddinggemma
  sourceCode: https://huggingface.co/google/embeddinggemma-300m
  doc: https://ai.google.dev/gemma/docs/embeddinggemma
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  license:
    - text: Gemma Terms of Use
      url: https://ai.google.dev/gemma/terms
  accelerator:
    - mode: cpu
      requiredCpu: 400m
      limitedCpu: "6"
      requiredMemory: 3Gi
      limitedMemory: 5Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi
    - mode: nvidia
      requiredCpu: 400m
      limitedCpu: "6"
      requiredMemory: 3Gi
      limitedMemory: 5Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 2048Mi
      limitedGPUMemory: 4096Mi
    - mode: nvidia-gb10
      requiredCpu: 400m
      limitedCpu: "6"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi
    - mode: intel
      requiredCpu: 400m
      limitedCpu: "6"
      requiredMemory: 3Gi
      limitedMemory: 5Gi
      requiredDisk: 3Gi
      limitedDisk: 50Gi

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  allowMultipleInstall: true
  LLMGatewaySupported: true
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "embeddinggemma-300m"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "embedding"
    options:
    - title: Embedding
      value: embedding
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error

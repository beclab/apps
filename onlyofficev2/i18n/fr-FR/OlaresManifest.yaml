metadata:
  title: OnlyOffice
  description: Gérez votre office privé avec ONLYOFFICE
spec:
  fullDescription: |
    ONLYOFFICE Docs est une suite bureautique collaborative en ligne gratuite comprenant des visionneuses et éditeurs pour textes, tableurs et présentations, formulaires et PDF, pleinement compatible avec les formats Office Open XML : .docx, .xlsx, .pptx et permettant l'édition collaborative en temps réel.

    **NOTE IMPORTANTE**
    Au premier démarrage d'ONLYOFFICE, allez dans ControlHub. Dans le pod onlyoffice, ouvrez le terminal du conteneur « onlyoffice ». Saisissez la commande `supervisorctl start ds:example`. Puis revenez à la page d'accueil et cliquez sur « go to test example » pour l'essayer.

    ONLYOFFICE Docs inclut les éditeurs suivants :
    **ONLYOFFICE Document Editor**
    **ONLYOFFICE Spreadsheet Editor**
    **ONLYOFFICE Presentation Editor**
    **ONLYOFFICE Form Creator**
    **ONLYOFFICE PDF editor, reader & converter**

    Les éditeurs permettent de créer, modifier, enregistrer et exporter des documents texte, tableurs et présentations, et offrent en plus :
    **Édition collaborative**
    **Prise en charge des hiéroglyphes**
    **Révision**
    **Vérification orthographique**
  upgradeDescription: |
    Mise à niveau vers 9.2.0
    Changelog complet : https://github.com/ONLYOFFICE/DocumentServer/blob/master/CHANGELOG.md#920

    Nouveautés de 9.2.0
    Nouvelles fonctionnalités
    **Tous les éditeurs**
    Ajout de la possibilité de personnaliser les raccourcis clavier
    Ajout de la possibilité d'enregistrer certaines actions exécutées en tant que macro dans tous les éditeurs, sauf PDF

    **Presentation Editor**
    Insertion d'équations depuis une ressource tierce implémentée

    **Forms**
    Possibilité de sélectionner le rôle pour lequel de nouveaux champs seront ajoutés
    Possibilité d'ajouter des libellés aux cases à cocher et boutons radio. En mode remplissage, cliquer sur le libellé équivaut à cliquer sur la case

    **PDF Editor**
    Possibilité de changer la couleur du texte masqué (Redact)
    Insertion d'équations depuis une ressource tierce implémentée

    **Sécurité**
    Redis mis à jour vers des versions non affectées par CVE-2025-49844
    Correction de la vulnérabilité permettant d'ajouter une plage nommée dans un classeur protégé via websocket
    Correction de la vulnérabilité XSS dans denyEditingRights
    Correction des vulnérabilités dans linux-libc-dev permettant l'élévation de privilèges et le vol de données depuis les processus de l'hyperviseur (CVE-2025-38352, CVE-2025-40300)

    **Back-end**
    Apparence de la barre latérale améliorée et icônes ajoutées au Admin Panel

    **API**
    Méthodes ajoutées pour obtenir et définir le texte des cases à cocher et boutons radio
    Méthodes ajoutées pour l'identifiant numérique d'un paragraphe, enregistré dans le fichier
    Méthode ajoutée pour supprimer un formulaire du document avec possibilité de conserver le contenu, similaire à Content Control
    Méthode ajoutée pour obtenir les formulaires
    La méthode GetAllContentControls, qui renvoie un Content Control, ne renvoie plus les formulaires
    Événement onParagraphText ajouté, indiquant que le contenu du paragraphe a changé, avec l'objet json suivant :
    Événements ajoutés pour travailler avec les annotations :

    **Plugins**
    Ajout de la vérification Grammar & Spelling dans les Document et Form Editors dans le plugin AI

metadata:
  title: OnlyOffice
  description: Gestisci il tuo office privato con ONLYOFFICE
spec:
  fullDescription: |
    ONLYOFFICE Docs è una suite office collaborativa online gratuita con visualizzatori ed editor per testi, fogli di calcolo e presentazioni, moduli e PDF, pienamente compatibile con i formati Office Open XML: .docx, .xlsx, .pptx e con editing collaborativo in tempo reale.

    **NOTA IMPORTANTE**
    Al primo avvio di ONLYOFFICE, vai a ControlHub. Nel pod onlyoffice, apri il terminale del container «onlyoffice». Esegui il comando `supervisorctl start ds:example`. Poi torna alla pagina di benvenuto e clicca su «go to test example» per provarlo.

    ONLYOFFICE Docs include i seguenti editor:
    **ONLYOFFICE Document Editor**
    **ONLYOFFICE Spreadsheet Editor**
    **ONLYOFFICE Presentation Editor**
    **ONLYOFFICE Form Creator**
    **ONLYOFFICE PDF editor, reader & converter**

    Gli editor consentono di creare, modificare, salvare ed esportare documenti di testo, fogli e presentazioni e hanno inoltre:
    **Editing collaborativo**
    **Supporto geroglifici**
    **Revisione**
    **Controllo ortografico**
  upgradeDescription: |
    Upgrade a 9.2.0
    Changelog completo: https://github.com/ONLYOFFICE/DocumentServer/blob/master/CHANGELOG.md#920

    Novità in 9.2.0
    Nuove funzionalità
    **Tutti gli editor**
    Aggiunta la possibilità di personalizzare le scorciatoie da tastiera
    Aggiunta la possibilità di registrare alcune azioni eseguite come macro in tutti gli editor, tranne PDF

    **Presentation Editor**
    Implementato l'inserimento di equazioni da una risorsa di terze parti

    **Forms**
    Implementata la possibilità di selezionare il ruolo per cui verranno aggiunti nuovi campi
    Implementata la possibilità di aggiungere etichette a checkbox e radio button. In modalità compilazione, cliccare sull'etichetta equivale a cliccare sulla checkbox

    **PDF Editor**
    Aggiunta la possibilità di cambiare il colore del testo nascosto (Redact)
    Implementato l'inserimento di equazioni da una risorsa di terze parti

    **Sicurezza**
    Redis aggiornato a versioni non affette da CVE-2025-49844
    Corretta la vulnerabilità che permetteva di aggiungere un named range in una cartella protetta via websocket
    Corretta la vulnerabilità XSS in denyEditingRights
    Corrette vulnerabilità in linux-libc-dev che permettevano escalation di privilegi e furto dati dai processi dell'hypervisor (CVE-2025-38352, CVE-2025-40300)

    **Back-end**
    Migliorato l'aspetto della sidebar e aggiunte icone all'Admin Panel

    **API**
    Aggiunti metodi per ottenere e impostare testo di checkbox e radio button
    Aggiunti metodi per l'identificatore numerico di un paragrafo, salvato nel file
    Aggiunto un metodo per eliminare un form dal documento con possibilità di conservare il contenuto, analogo a Content Control
    Aggiunto un metodo per ottenere i form
    Il metodo GetAllContentControls, che restituisce un Content Control, non restituisce più i form

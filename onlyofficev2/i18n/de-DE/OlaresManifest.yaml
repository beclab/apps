metadata:
  title: OnlyOffice
  description: Betreiben Sie Ihr privates Office mit ONLYOFFICE
spec:
  fullDescription: |
    ONLYOFFICE Docs ist eine kostenlose kollaborative Online-Office-Suite mit Viewern und Editoren für Texte, Tabellen und Präsentationen, Formulare und PDF — vollständig kompatibel mit Office Open XML-Formaten: .docx, .xlsx, .pptx und mit Echtzeit-Kollaboration.

    **WICHTIGER HINWEIS**
    Beim ersten Start von ONLYOFFICE navigieren Sie zu ControlHub. Im onlyoffice-Pod öffnen Sie das Terminal des Containers „onlyoffice“. Geben Sie den Befehl `supervisorctl start ds:example` ein. Kehren Sie dann zur Willkommensseite zurück und klicken Sie auf „go to test example“, um es auszuprobieren.

    ONLYOFFICE Docs umfasst die folgenden Editoren:
    **ONLYOFFICE Document Editor**
    **ONLYOFFICE Spreadsheet Editor**
    **ONLYOFFICE Presentation Editor**
    **ONLYOFFICE Form Creator**
    **ONLYOFFICE PDF editor, reader & converter**

    Die Editoren ermöglichen Erstellen, Bearbeiten, Speichern und Exportieren von Text-, Tabellen- und Präsentationsdokumenten und bieten zusätzlich:
    **Kollaboratives Bearbeiten**
    **Hieroglyphen-Unterstützung**
    **Reviewing**
    **Rechtschreibprüfung**
  upgradeDescription: |
    Upgrade auf 9.2.0
    Vollständiges Changelog: https://github.com/ONLYOFFICE/DocumentServer/blob/master/CHANGELOG.md#920

    Neu in 9.2.0
    Neue Funktionen
    **Alle Editoren**
    Möglichkeit hinzugefügt, Tastenkürzel anzupassen
    Möglichkeit hinzugefügt, einige ausgeführte Aktionen als Makro aufzuzeichnen — in allen Editoren außer PDF

    **Presentation Editor**
    Einfügen von Gleichungen aus einer Drittanbieter-Ressource implementiert

    **Forms**
    Möglichkeit implementiert, die Rolle auszuwählen, für die neue Felder hinzugefügt werden
    Möglichkeit implementiert, Beschriftungen für Kontrollkästchen und Optionsfelder hinzuzufügen. Im Ausfüllmodus wirkt ein Klick auf die Beschriftung wie ein Klick auf das Kontrollkästchen selbst

    **PDF Editor**
    Möglichkeit hinzugefügt, die Farbe für verborgenen Text (Redact) zu ändern
    Einfügen von Gleichungen aus einer Drittanbieter-Ressource implementiert

    **Sicherheit**
    Redis auf Versionen aktualisiert, die nicht von CVE-2025-49844 betroffen sind
    Schwachstelle behoben, die das Hinzufügen eines Named Range in einer geschützten Arbeitsmappe per Websocket erlaubte
    XSS-Schwachstelle in denyEditingRights behoben
    Schwachstellen in linux-libc-dev behoben, die Privilege Escalation und Datendiebstahl aus Hypervisor-Prozessen ermöglichten (CVE-2025-38352, CVE-2025-40300)

    **Back-end**
    Erscheinungsbild der Seitenleiste verbessert und Icons zum Admin Panel hinzugefügt

    **API**
    Methoden zum Abrufen und Setzen von Text für Kontrollkästchen und Optionsfelder hinzugefügt
    Methoden für die numerische Kennung eines Absatzes hinzugefügt, die in der Datei gespeichert wird
    Methode zum Löschen eines Formulars aus dem Dokument mit optionaler Inhaltserhaltung hinzugefügt, ähnlich Content Control
    Methode zum Abrufen von Formularen hinzugefügt
    Die Methode GetAllContentControls, die ein Content Control zurückgibt, liefert keine Formulare mehr
    Event onParagraphText hinzugefügt, das angibt, dass der Absatzinhalt geändert wurde, mit folgendem JSON-Objekt:
    Events für die Arbeit mit Annotationen hinzugefügt:

    **Plugins**
    Grammar- & Spelling-Prüfung im Document- und Form-Editor im AI-Plugin hinzugefügt

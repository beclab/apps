metadata:
  title: OnlyOffice
  description: Ejecute su oficina privada con ONLYOFFICE
spec:
  fullDescription: |
    ONLYOFFICE Docs es una suite ofimática colaborativa en línea gratuita con visores y editores de textos, hojas de cálculo y presentaciones, formularios y PDF, totalmente compatible con formatos Office Open XML: .docx, .xlsx, .pptx y con edición colaborativa en tiempo real.

    **NOTA IMPORTANTE**
    Al iniciar ONLYOFFICE por primera vez, vaya a ControlHub. En el pod onlyoffice, abra la terminal del contenedor «onlyoffice». Ejecute el comando `supervisorctl start ds:example`. Luego vuelva a la página de bienvenida y haga clic en «go to test example» para probarlo.

    ONLYOFFICE Docs incluye los siguientes editores:
    **ONLYOFFICE Document Editor**
    **ONLYOFFICE Spreadsheet Editor**
    **ONLYOFFICE Presentation Editor**
    **ONLYOFFICE Form Creator**
    **ONLYOFFICE PDF editor, reader & converter**

    Los editores permiten crear, editar, guardar y exportar documentos de texto, hojas y presentaciones, y además tienen:
    **Edición colaborativa**
    **Soporte de jeroglíficos**
    **Revisión**
    **Corrección ortográfica**
  upgradeDescription: |
    Actualización a 9.2.0
    Ver changelog completo en: https://github.com/ONLYOFFICE/DocumentServer/blob/master/CHANGELOG.md#920

    Novedades en 9.2.0
    Nuevas funciones
    **Todos los editores**
    Añadida la capacidad de personalizar atajos de teclado
    Añadida la capacidad de grabar algunas acciones ejecutadas como macro en todos los editores, excepto PDF

    **Presentation Editor**
    Implementada la inserción de ecuaciones desde un recurso de terceros

    **Forms**
    Implementada la capacidad de seleccionar el rol para el que se añadirán nuevos campos
    Implementada la capacidad de añadir etiquetas a casillas y botones de opción. En modo de relleno, hacer clic en la etiqueta equivale a hacer clic en la casilla

    **PDF Editor**
    Añadida la capacidad de cambiar el color del texto oculto (Redact)
    Implementada la inserción de ecuaciones desde un recurso de terceros

    **Seguridad**
    Redis actualizado a versiones no afectadas por CVE-2025-49844
    Corregida la vulnerabilidad que permitía añadir un named range en un libro protegido vía websocket
    Corregida la vulnerabilidad XSS en denyEditingRights
    Corregidas vulnerabilidades en linux-libc-dev que permitían escalar privilegios y robar datos de procesos del hipervisor (CVE-2025-38352, CVE-2025-40300)

    **Back-end**
    Mejorada la apariencia de la barra lateral y añadidos iconos al Admin Panel

    **API**
    Añadidos métodos para obtener y establecer texto de casillas y botones de opción
    Añadidos métodos para el identificador numérico de un párrafo, guardado en el archivo
    Añadido un método para eliminar un formulario del documento con opción de conservar el contenido, similar a Content Control
    Añadido un método para obtener formularios
    El método GetAllContentControls, que devuelve un Content Control, ya no devuelve formularios
    Añadido el evento onParagraphText, que indica que el contenido del párrafo cambió, con el siguiente objeto json:
    Añadidos eventos para trabajar con anotaciones:

    **Plugins**
    Añadida comprobación Grammar & Spelling en Document y Form Editors en el plugin AI

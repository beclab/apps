metadata:
  title: OnlyOffice
  description: ONLYOFFICE でプライベートなオフィスを運用
spec:
  fullDescription: |
    ONLYOFFICE Docs は、テキスト・表計算・プレゼンテーション、フォーム、PDF のビューアとエディタを備えた無料の共同編集オンラインオフィススイートで、Office Open XML 形式（.docx、.xlsx、.pptx）と完全互換、リアルタイム共同編集に対応します。

    **重要なお知らせ**
    ONLYOFFICE を初めて起動するときは ControlHub に移動してください。onlyoffice ポッドで「onlyoffice」コンテナのターミナルを開き、コマンド `supervisorctl start ds:example` を実行します。その後ウェルカムページに戻り、「go to test example」をクリックして試せます。

    ONLYOFFICE Docs には次のエディタが含まれます:
    **ONLYOFFICE Document Editor**
    **ONLYOFFICE Spreadsheet Editor**
    **ONLYOFFICE Presentation Editor**
    **ONLYOFFICE Form Creator**
    **ONLYOFFICE PDF editor, reader & converter**

    エディタではテキスト・表計算・プレゼンテーション文書の作成・編集・保存・エクスポートができ、さらに次の機能があります:
    **共同編集**
    **象形文字サポート**
    **レビュー**
    **スペルチェック**
  upgradeDescription: |
    9.2.0 へアップグレード
    変更履歴全文: https://github.com/ONLYOFFICE/DocumentServer/blob/master/CHANGELOG.md#920

    9.2.0 の新機能
    新機能
    **すべてのエディタ**
    キーボードショートカットのカスタマイズ機能を追加
    PDF を除くすべてのエディタで、実行した一部操作をマクロとして記録する機能を追加

    **Presentation Editor**
    サードパーティリソースからの数式挿入を実装

    **Forms**
    新しいフィールドを追加する対象ロールを選択する機能を実装
    チェックボックスとラジオボタンにラベルを追加する機能を実装。入力モードではラベルクリックがチェックボックス本体のクリックと同様に動作

    **PDF Editor**
    隠れたテキスト（Redact）の色変更機能を追加
    サードパーティリソースからの数式挿入を実装

    **セキュリティ**
    CVE-2025-49844 の影響を受けないバージョンへ Redis を更新
    保護されたブックに websocket 経由で名前付き範囲を追加できる脆弱性を修正
    denyEditingRights の XSS 脆弱性を修正
    システム権限昇格とハイパーバイザプロセスからのデータ窃取を許す linux-libc-dev の脆弱性を修正（CVE-2025-38352、CVE-2025-40300）

    **Back-end**
    サイドバーの見た目を改善し、Admin Panel にアイコンを追加

    **API**
    チェックボックスとラジオボタンのテキスト取得・設定メソッドを追加
    ファイルに保存される段落の数値識別子を扱うメソッドを追加
    Content Control と同様に内容を残してフォームを削除するメソッドを追加
    フォーム取得メソッドを追加
    Content Control を返す GetAllContentControls メソッドはフォームを返さなくなりました
    段落内容が変更されたことを示す onParagraphText イベントを追加（次の json オブジェクト付き）:
    注釈操作用イベントを追加:

    **Plugins**
    AI プラグインの Document / Form エディタに Grammar & Spelling チェックを追加

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: "{{ .Release.Namespace }}"
data:
  nginx.conf: |
    server {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      listen 8080;
      access_log /dev/stdout;
      error_log /dev/stderr;

      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 300s;

      proxy_set_header host $host;
      proxy_set_header x-forwarded-host $http_host;
      proxy_http_version 1.1;
      proxy_set_header upgrade $http_upgrade;
      proxy_set_header connection "upgrade";

      proxy_set_header X-BFL-USER {{ .Values.bfl.username }};
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Authorization $http_x_authorization;

      location /coauthoring/CommandService.ashx {
        add_header X-Frame-Options "";
        proxy_pass http://onlyoffice-svc.onlyofficev2server-shared:80/coauthoring/CommandService.ashx;
      }

      location /ConvertService.ashx {
        add_header X-Frame-Options "";
        proxy_pass http://onlyoffice-svc.onlyofficev2server-shared:80/ConvertService.ashx;
      }

      location /coauthoring/ {
        add_header X-Frame-Options "";
        proxy_pass http://onlyoffice-svc.onlyofficev2server-shared:80/coauthoring/;
      }

      location /web-apps {
        add_header X-Frame-Options "";
        proxy_pass http://onlyoffice-svc.onlyofficev2server-shared:80/web-apps;
      }

      location ~ ^/9.2.0 {
        add_header X-Frame-Options "";
        proxy_pass http://onlyoffice-svc.onlyofficev2server-shared:80;
      }

      location /cache {
        add_header X-Frame-Options "";
        proxy_pass http://onlyoffice-svc.onlyofficev2server-shared:80/cache;
      }

      location / {
        add_header X-Frame-Options "";
        proxy_pass http://onlyofficeclient.onlyofficev2server-shared:3000;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: onlyoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: onlyoffice
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: onlyoffice
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
                  [ "$http_code" -ge 200 ] && [ "$http_code" -lt 500 ]
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 240
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty

---
apiVersion: v1
kind: Service
metadata:
  name: onlyofficeproxy
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    io.kompose.service: onlyoffice
  ports:
    - name: onlyoffice
      protocol: TCP
      port: 8080
      targetPort: 8080

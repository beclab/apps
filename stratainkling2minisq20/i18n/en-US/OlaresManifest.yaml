metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 for multimodal agentic coding, tool use, and concurrent serving, powered locally by Strata"
spec:
  upgradeDescription: |
    Updates the Inkling engine to 0.1.71 (image tag `0.2.23-inkling0.1.71-cuda13`, Strata 0.2.23): replies start sooner when many users are waiting (last first token at 32 users 20.4 s to 5.0 s), and the K/V cache moves to system memory automatically when the experts would not fit next to it.

    Measured on the Olares One (23 GiB limit emulated, 16K context per user, 128 new tokens), engine 0.1.71 against 0.1.70: one request unchanged (mean of 6 prompts 201.4 tok/s, tokens identical); 32K prompt unchanged (prefill 2,821 tok/s, decode 86.1). End to end / steady tok/s: 16 users 234 / 465 to 314 / 456; 24 users 112 / 259 to 286 / 391; 32 users 104 / 227 to 310 / 474. Last first token at 32 users 20.4 s to 5.0 s. All 3,072 experts stay on the card up to 32 users. Best level: 16 users end to end, 32 users steady. This app offers `--parallel 1..32`; 64 users is not offered (the experts go hybrid).

    [Strata 0.2.23 release notes](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini is a 26.4B-parameter looped Mixture-of-Experts multimodal model (3.4B active per pass / 5.4B looped-active across 48 virtual visits) engineered for agentic software engineering, tool use, fast direct responses, and visual understanding. This app runs Strata's native `.strata` v1.1 bit-exact lossless `SQ-20` edition locally using the dedicated `strata-inkling` C++/CUDA engine.

    Strata is an open-source inference engine for running frontier AI models locally. For Inkling-2-Mini `SQ-20`, the 18.04 GiB lossless checkpoint fits inside a 24 GiB GPU, leaving room for the paged SWA-1024 + compact 8-visit Global KV cache across multiple concurrent requests. Model Console connects the engine to Olares.

    **Key features**

    - Generate direct responses from text and image inputs (`Inkling-2-Mini-Vision-v2.strata`, 0.64 GB lossless BF16) with OpenAI-compatible tool calling.
    - Speed up generation with the DFlash 2 drafter (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0.55 GB): a small second model that guesses the next tokens, which the main model then checks. The engine turns it on per card and per number of parallel requests; `--draft off` disables it. On the Olares One it is loaded for one request and at 16 slots; at 2 to 15 slots and at 24 and 32 slots the engine runs without it (at 24 and 32 slots the experts stay on the card).
    - Serve multiple requests concurrently via continuous batching (`--parallel 1..32`, default `8`).
    - Use Model Console to download the model, monitor readiness, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition (`SQ-20`, file `Inkling-2-Mini-SQv2-20.strata`, 19.37 GB) uses bit-exact native `SF4+MX8` weights. Default context is 16,384 tokens per request with 8 concurrent request slots (`--parallel 1..32`); one request (`--parallel 1`) runs 32,768 tokens. On the Olares One the engine loads DFlash 2 for one request and at 16 parallel requests, and runs without it at 2 to 15 and at 24 and 32 (the default 8 slots run without it; at 24 and 32 the experts stay on the card). A single request can use 131,072 tokens (`--parallel 1 --context 131072`): all 3,072 experts stay on the card and the K/V cache is split between GPU and system memory automatically.

    **Before first use**

    First startup downloads 20.6 GB across `Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, and `chat_template.jinja`. Because `.strata` v1.1 loads directly without GGUF repacking, startup proceeds straight to model loading once the download completes.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer (22+ GiB GPU memory) are required.

    Credits: Inkling-2-Mini by Thinking Machines (Apache-2.0). DFlash 2 drafter weights by Inco AI / z-lab (Apache-2.0); the file used here is Strata's converted copy of them (8-bit and 4-bit matrices), with a statement of changes in its repository.

    [Model documentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantized model](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [DFlash 2 drafter](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata documentation](https://github.com/Niko1221/Strata)

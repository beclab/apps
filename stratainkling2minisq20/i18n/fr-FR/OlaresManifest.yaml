metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 pour le codage agentique multimodal, l'utilisation d'outils et le service concurrent en local avec Strata"
spec:
  upgradeDescription: |
    Version initiale de Thinking Machines Inkling-2-Mini SQ-20 sur Strata v0.2.19 (`strata-inkling`) et Model Console (`llm-init` v1.7.26), dimensionnee pour les GPU NVIDIA 24 GiB dont Olares One.

    - Execute les poids natifs `.strata` v1.1 sans perte `SQ-20` (`19,35 Go` / `18,02 GiB`, `SF4+MX8` exact au bit pres + drafteur `DSpark` Block-8 integre) et le shard Vision `BF16` (`0,64 Go`) 100% en VRAM 24 GiB.
    - Prend en charge des reponses directes rapides, la lecture d'images multimodale integree, les appels d'outils compatibles OpenAI et le batching continu (`--parallel 1..64`, defaut `8`).
    - Aucune conversion GGUF au premier demarrage.

    [Strata v0.2.19](https://github.com/Niko1221/Strata/releases/tag/v0.2.19)
  fullDescription: |
    Thinking Machines Inkling-2-Mini est un modele multimodal Looped MoE de 26,4B parametres concu pour le developpement logiciel agentique, l'utilisation d'outils, les reponses directes rapides et la comprehension visuelle. Cette application execute localement l'edition native sans perte `.strata` v1.1 `SQ-20` via le moteur dedie `strata-inkling`.

    **Fonctionnalites principales**

    - Entrees texte et image (`Inkling-2-Mini-Vision.strata`, 0,64 Go BF16 sans perte) et appels d'outils compatibles OpenAI.
    - Acceleration par le drafteur speculatif integre `DSpark` Block-8 et requetes concurrentes (`--parallel 1..64`, defaut `8`).
    - Gestion via Model Console et integration via Olares Router ou API compatible OpenAI.

    **Avant la premiere utilisation**

    Le premier demarrage telecharge 20,0 Go (`Inkling-2-Mini-SQ-20.strata`, `Inkling-2-Mini-Vision.strata`, `tokenizer.json`, `chat_template.jinja`). Necessite un CPU amd64 AVX2 et un pilote NVIDIA R580 ou plus recent avec 22+ GiB de VRAM.

    [Documentation du modele](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modele quantifie](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Documentation Strata](https://github.com/Niko1221/Strata)

metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 pour le codage agentique multimodal, l'utilisation d'outils et le service concurrent en local avec Strata"
spec:
  upgradeDescription: |
    Met a jour le moteur Inkling en 0.1.71 (etiquette d'image `0.2.23-inkling0.1.71-cuda13`, Strata 0.2.23) : les reponses commencent plus tot quand beaucoup d'utilisateurs attendent (dernier premier jeton avec 32 utilisateurs 20,4 s a 5,0 s) et deplace automatiquement le cache K/V vers la memoire systeme quand les experts ne tiendraient pas a cote.

    Mesure sur l'Olares One (limite de 23 GiB emulee, contexte de 16K par utilisateur, 128 nouveaux jetons), moteur 0.1.71 contre 0.1.70 : une requete inchangee (moyenne de 6 prompts 201,4 tok/s, jetons identiques) ; prompt de 32K inchange (prefill 2 821 tok/s, decode 86,1). De bout en bout / stable en tok/s : 16 utilisateurs 234 / 465 a 314 / 456 ; 24 utilisateurs 112 / 259 a 286 / 391 ; 32 utilisateurs 104 / 227 a 310 / 474 . Dernier premier jeton avec 32 utilisateurs 20,4 s a 5,0 s. Les 3 072 experts restent sur la carte jusqu'a 32 utilisateurs. Meilleur niveau : 16 utilisateurs de bout en bout, 32 utilisateurs en regime stable. Cette application propose `--parallel 1..32` ; 64 utilisateurs ne sont pas proposes (les experts passent en mode hybride).

    [Strata v0.2.23](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini est un modele multimodal Looped MoE de 26,4B parametres concu pour le developpement logiciel agentique, l'utilisation d'outils, les reponses directes rapides et la comprehension visuelle. Cette application execute localement l'edition native sans perte `.strata` v1.1 `SQ-20` via le moteur dedie `strata-inkling`.

    **Fonctionnalites principales**

    - Entrees texte et image (`Inkling-2-Mini-Vision-v2.strata`, 0,64 Go BF16 sans perte) et appels d'outils compatibles OpenAI.
    - Drafteur DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 Go) : un petit second modele qui propose les jetons suivants, que le modele principal verifie. Le moteur l'active par carte et par nombre de requetes paralleles ; `--draft off` le desactive. Sur l'Olares One il est charge pour une requete et a 16 emplacements ; a 2 a 15 emplacements et a 24 et 32 emplacements le moteur tourne sans lui (a 24 et 32 emplacements les experts restent sur la carte).
    - Requetes concurrentes par batching continu (`--parallel 1..32`, defaut `8`).
    - Gestion via Model Console et integration via Olares Router ou API compatible OpenAI.

    **Avant la premiere utilisation**

    Le premier demarrage telecharge 20,6 Go (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Necessite un CPU amd64 AVX2 et un pilote NVIDIA R580 ou plus recent avec 22+ GiB de VRAM.

    Credits : Inkling-2-Mini par Thinking Machines (Apache-2.0). Poids du drafteur DFlash 2 par Inco AI / z-lab (Apache-2.0) ; le fichier utilise ici est la copie convertie par Strata, avec la declaration des modifications dans son depot.

    [Documentation du modele](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modele quantifie](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Drafteur DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentation Strata](https://github.com/Niko1221/Strata)

metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 pour le codage agentique multimodal, l'utilisation d'outils et le service concurrent en local avec Strata"
spec:
  upgradeDescription: |
    Met a jour Inkling-2-Mini SQ-20 vers Strata v0.2.23 (`strata-inkling`) avec Model Console (`llm-init` v1.7.26).

    - Nouveau fichier de modele `Inkling-2-Mini-SQv2-20.strata` (`19,37 Go`) : la version SQ-20 dans la disposition de fichier de 16 KiB reajustee, avec le nouveau fichier d'image `Inkling-2-Mini-Vision-v2.strata` (`0,64 Go`). Les deux sont fixes sur un commit Hugging Face et verifies par leur taille.
    - DFlash 2 remplace DSpark comme drafteur. C'est un fichier supplementaire, `Inkling-2-Mini-DFlash2-mix.safetensors` (`0,55 Go`), telecharge a cote du modele. Le moteur decide par carte et par nombre de requetes paralleles s'il l'utilise ; `--draft off` dans ENGINE_ARGS le desactive. Sans ce fichier, le modele tourne sans drafteur.
    - Le premier demarrage apres cette mise a jour telecharge les nouveaux fichiers (`20,6 Go` au total) avant de charger le modele.
  fullDescription: |
    Thinking Machines Inkling-2-Mini est un modele multimodal Looped MoE de 26,4B parametres concu pour le developpement logiciel agentique, l'utilisation d'outils, les reponses directes rapides et la comprehension visuelle. Cette application execute localement l'edition native sans perte `.strata` v1.1 `SQ-20` via le moteur dedie `strata-inkling`.

    **Fonctionnalites principales**

    - Entrees texte et image (`Inkling-2-Mini-Vision-v2.strata`, 0,64 Go BF16 sans perte) et appels d'outils compatibles OpenAI.
    - Drafteur DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 Go) : un petit second modele qui propose les jetons suivants, que le modele principal verifie. Le moteur l'active par carte et par nombre de requetes paralleles ; `--draft off` le desactive.
    - Requetes concurrentes par batching continu (`--parallel 1..16`, defaut `8`).
    - Gestion via Model Console et integration via Olares Router ou API compatible OpenAI.

    **Avant la premiere utilisation**

    Le premier demarrage telecharge 20,6 Go (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Necessite un CPU amd64 AVX2 et un pilote NVIDIA R580 ou plus recent avec 22+ GiB de VRAM.

    Credits : Inkling-2-Mini par Thinking Machines (Apache-2.0). Poids du drafteur DFlash 2 par Inco AI / z-lab (Apache-2.0) ; le fichier utilise ici est la copie convertie par Strata, avec la declaration des modifications dans son depot.

    [Documentation du modele](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modele quantifie](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Drafteur DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentation Strata](https://github.com/Niko1221/Strata)

metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 per coding agentico multimodale, uso di strumenti e servizio concorrente in locale con Strata"
spec:
  upgradeDescription: |
    Aggiorna il motore Inkling alla 0.1.71 (tag immagine `0.2.23-inkling0.1.71-cuda13`, Strata 0.2.23): le risposte iniziano prima quando molti utenti sono in attesa (ultimo primo token con 32 utenti 20,4 s a 5,0 s) e sposta automaticamente la cache K/V nella memoria di sistema quando gli esperti non ci starebbero accanto.

    Misurato sull'Olares One (limite di 23 GiB emulato, contesto 16K per utente, 128 nuovi token), motore 0.1.71 contro 0.1.70: una richiesta invariata (media di 6 prompt 201,4 tok/s, token identici); prompt da 32K invariato (prefill 2.821 tok/s, decode 86,1). End to end / stabile in tok/s: 16 utenti 234 / 465 a 314 / 456; 24 utenti 112 / 259 a 286 / 391; 32 utenti 104 / 227 a 310 / 474. Ultimo primo token con 32 utenti 20,4 s a 5,0 s. Tutti i 3.072 esperti restano sulla scheda fino a 32 utenti. Livello migliore: 16 utenti end to end, 32 utenti stabile. Questa app offre `--parallel 1..32`; 64 utenti non sono offerti (gli esperti passano in modalita ibrida).

    [Strata v0.2.23](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini e un modello multimodale Looped MoE da 26,4B parametri progettato per ingegneria del software agentica, uso di strumenti, risposte dirette rapide e comprensione visiva. Questa app esegue localmente l'edizione nativa lossless `.strata` v1.1 `SQ-20` tramite il motore dedicato `strata-inkling`.

    **Funzionalita principali**

    - Input testo e immagini (`Inkling-2-Mini-Vision-v2.strata`, 0,64 GB BF16 lossless) e tool calling compatibile con OpenAI.
    - Drafter DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): un piccolo secondo modello che propone i token successivi, che il modello principale verifica. Il motore lo attiva per scheda e per numero di richieste parallele; `--draft off` lo disattiva. Sull'Olares One viene caricato per una richiesta e con 16 slot; con 2-15 slot e con 24 e 32 slot il motore funziona senza (con 24 e 32 slot gli esperti restano sulla scheda).
    - Richieste concorrenti tramite batching continuo (`--parallel 1..32`, predefinito `8`).
    - Gestione tramite Model Console e integrazione con Olares Router o API compatibile con OpenAI.

    **Prima del primo utilizzo**

    Il primo avvio scarica 20,6 GB (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Richiede CPU amd64 AVX2 e driver NVIDIA R580 o successivo con 22+ GiB di VRAM.

    Crediti: Inkling-2-Mini di Thinking Machines (Apache-2.0). Pesi del drafter DFlash 2 di Inco AI / z-lab (Apache-2.0); il file usato qui e la copia convertita da Strata, con la dichiarazione delle modifiche nel suo repository.

    [Documentazione del modello](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modello quantizzato](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Drafter DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentazione Strata](https://github.com/Niko1221/Strata)

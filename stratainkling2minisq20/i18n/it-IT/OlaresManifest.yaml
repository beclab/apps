metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 per coding agentico multimodale, uso di strumenti e servizio concorrente in locale con Strata"
spec:
  upgradeDescription: |
    Aggiorna Inkling-2-Mini SQ-20 a Strata v0.2.23 (`strata-inkling`) con Model Console (`llm-init` v1.7.26).

    - Nuovo file del modello `Inkling-2-Mini-SQv2-20.strata` (`19,37 GB`): la build SQ-20 nel layout di file da 16 KiB riallineato, con il nuovo file per le immagini `Inkling-2-Mini-Vision-v2.strata` (`0,64 GB`). Entrambi sono fissati a un commit di Hugging Face e verificati per dimensione.
    - DFlash 2 sostituisce DSpark come drafter. E un file aggiuntivo, `Inkling-2-Mini-DFlash2-mix.safetensors` (`0,55 GB`), scaricato accanto al modello. Il motore decide per scheda e per numero di richieste parallele se usarlo; `--draft off` in ENGINE_ARGS lo disattiva. Senza il file il modello gira senza drafter.
    - Il primo avvio dopo questo aggiornamento scarica i nuovi file (`20,6 GB` in totale) prima di caricare il modello.
  fullDescription: |
    Thinking Machines Inkling-2-Mini e un modello multimodale Looped MoE da 26,4B parametri progettato per ingegneria del software agentica, uso di strumenti, risposte dirette rapide e comprensione visiva. Questa app esegue localmente l'edizione nativa lossless `.strata` v1.1 `SQ-20` tramite il motore dedicato `strata-inkling`.

    **Funzionalita principali**

    - Input testo e immagini (`Inkling-2-Mini-Vision-v2.strata`, 0,64 GB BF16 lossless) e tool calling compatibile con OpenAI.
    - Drafter DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): un piccolo secondo modello che propone i token successivi, che il modello principale verifica. Il motore lo attiva per scheda e per numero di richieste parallele; `--draft off` lo disattiva.
    - Richieste concorrenti tramite batching continuo (`--parallel 1..16`, predefinito `8`).
    - Gestione tramite Model Console e integrazione con Olares Router o API compatibile con OpenAI.

    **Prima del primo utilizzo**

    Il primo avvio scarica 20,6 GB (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Richiede CPU amd64 AVX2 e driver NVIDIA R580 o successivo con 22+ GiB di VRAM.

    Crediti: Inkling-2-Mini di Thinking Machines (Apache-2.0). Pesi del drafter DFlash 2 di Inco AI / z-lab (Apache-2.0); il file usato qui e la copia convertita da Strata, con la dichiarazione delle modifiche nel suo repository.

    [Documentazione del modello](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modello quantizzato](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Drafter DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentazione Strata](https://github.com/Niko1221/Strata)

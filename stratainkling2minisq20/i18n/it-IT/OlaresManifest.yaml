metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 per coding agentico multimodale, uso di strumenti e servizio concorrente in locale con Strata"
spec:
  upgradeDescription: |
    Rilascio iniziale di Thinking Machines Inkling-2-Mini SQ-20 su Strata v0.2.19 (`strata-inkling`) e Model Console (`llm-init` v1.7.26), ottimizzato per GPU NVIDIA da 24 GiB incluso Olares One.

    - Esegue pesi nativi `.strata` v1.1 lossless `SQ-20` (`19,35 GB` / `18,02 GiB`, `SF4+MX8` bit-exact + drafter integrato `DSpark` Block-8) e shard Vision `BF16` (`0,64 GB`) al 100% nella VRAM da 24 GiB.
    - Supporta risposte dirette a bassa latenza, lettura multimodale delle immagini, tool calling compatibile OpenAI e batching continuo (`--parallel 1..64`, predefinito `8`).
    - Nessuna attesa di conversione GGUF al primo avvio.

    [Strata v0.2.19](https://github.com/Niko1221/Strata/releases/tag/v0.2.19)
  fullDescription: |
    Thinking Machines Inkling-2-Mini e un modello multimodale Looped MoE da 26,4B parametri progettato per ingegneria del software agentica, uso di strumenti, risposte dirette rapide e comprensione visiva. Questa app esegue localmente l'edizione nativa lossless `.strata` v1.1 `SQ-20` tramite il motore dedicato `strata-inkling`.

    **Funzionalita principali**

    - Input testo e immagini (`Inkling-2-Mini-Vision.strata`, 0,64 GB BF16 lossless) e tool calling compatibile con OpenAI.
    - Decodifica speculativa integrata `DSpark` Block-8 e richieste concorrenti (`--parallel 1..64`, predefinito `8`).
    - Gestione tramite Model Console e integrazione con Olares Router o API compatibile con OpenAI.

    **Prima del primo utilizzo**

    Il primo avvio scarica 20,0 GB (`Inkling-2-Mini-SQ-20.strata`, `Inkling-2-Mini-Vision.strata`, `tokenizer.json`, `chat_template.jinja`). Richiede CPU amd64 AVX2 e driver NVIDIA R580 o successivo con 22+ GiB di VRAM.

    [Documentazione del modello](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modello quantizzato](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Documentazione Strata](https://github.com/Niko1221/Strata)

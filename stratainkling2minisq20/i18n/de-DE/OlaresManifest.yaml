metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 fuer multimodales Agenten-Coding, Tool-Nutzung und parallele Anfragen, lokal betrieben mit Strata"
spec:
  upgradeDescription: |
    Aktualisiert Inkling-2-Mini SQ-20 auf Strata v0.2.23 (`strata-inkling`) mit Model Console (`llm-init` v1.7.26).

    - Neue Modelldatei `Inkling-2-Mini-SQv2-20.strata` (`19,37 GB`): der SQ-20-Build im neu ausgerichteten 16-KiB-Dateilayout, dazu die neue Bilddatei `Inkling-2-Mini-Vision-v2.strata` (`0,64 GB`). Beide sind an einen Hugging-Face-Commit gebunden und werden per Dateigroesse geprueft.
    - DFlash 2 ersetzt DSpark als Drafter. Es ist eine zusaetzliche Datei, `Inkling-2-Mini-DFlash2-mix.safetensors` (`0,55 GB`), die neben dem Modell geladen wird. Die Engine entscheidet pro Karte und pro Anzahl paralleler Anfragen, ob sie genutzt wird; `--draft off` in ENGINE_ARGS schaltet sie ab. Ohne die Datei laeuft das Modell ohne Drafter.
    - Der erste Start nach diesem Update laedt die neuen Dateien (`20,6 GB` insgesamt), bevor das Modell geladen wird.
  fullDescription: |
    Thinking Machines Inkling-2-Mini ist ein multimodales 26,4B-Looped-MoE-Modell fuer agentische Softwareentwicklung, Tool-Nutzung, schnelle direkte Antworten und Bildverstaendnis. Diese App fuehrt die verlustfreie native `.strata`-v1.1-`SQ-20`-Edition lokal ueber die dedizierte C++/CUDA-Engine `strata-inkling` aus.

    **Hauptfunktionen**

    - Text- und Bildeingaben (`Inkling-2-Mini-Vision-v2.strata`, 0,64 GB verlustfreies BF16) sowie OpenAI-kompatibles Tool-Calling.
    - DFlash-2-Drafter (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): ein kleines zweites Modell, das die naechsten Tokens raet und vom Hauptmodell geprueft wird. Die Engine schaltet ihn pro Karte und pro Anzahl paralleler Anfragen ein; `--draft off` deaktiviert ihn.
    - Parallele Anfragen per Continuous Batching (`--parallel 1..16`, Standard `8`).
    - Verwaltung ueber Model Console sowie Anbindung ueber Olares Router oder die OpenAI-kompatible API.

    **Vor der ersten Nutzung**

    Beim ersten Start werden 20,6 GB geladen (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Erfordert auf amd64 eine AVX2-CPU und einen NVIDIA-Treiber ab R580 mit mindestens 22 GiB VRAM.

    Quellen: Inkling-2-Mini von Thinking Machines (Apache-2.0). DFlash-2-Drafter-Gewichte von Inco AI / z-lab (Apache-2.0); die hier genutzte Datei ist die von Strata konvertierte Kopie, mit Aenderungsvermerk in ihrem Repository.

    [Modelldokumentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantisiertes Modell](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [DFlash-2-Drafter](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)

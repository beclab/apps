metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 fuer multimodales Agenten-Coding, Tool-Nutzung und parallele Anfragen, lokal betrieben mit Strata"
spec:
  upgradeDescription: |
    Erstveroeffentlichung von Thinking Machines Inkling-2-Mini SQ-20 auf Strata v0.2.19 (`strata-inkling`) und Model Console (`llm-init` v1.7.26), optimiert fuer 24-GiB-NVIDIA-GPUs einschliesslich Olares One.

    - Fuehrt native verlustfreie `.strata`-v1.1-`SQ-20`-Gewichte (`19,35 GB` / `18,02 GiB`, bitgenaues `0.00000`-KLD-`SF4+MX8` + integrierter `DSpark`-Block-8-Drafter) sowie den verlustfreien `BF16`-Vision-Shard (`0,64 GB`) vollstaendig im 24-GiB-VRAM aus.
    - Unterstuetzt schnelle direkte Antworten, integriertes Bildverstaendnis, OpenAI-kompatibles Tool-Calling und Continuous Batching (`--parallel 1..64`, Standard `8`).
    - Keine GGUF-Konvertierung beim ersten Start.

    [Strata v0.2.19](https://github.com/Niko1221/Strata/releases/tag/v0.2.19)
  fullDescription: |
    Thinking Machines Inkling-2-Mini ist ein multimodales 26,4B-Looped-MoE-Modell fuer agentische Softwareentwicklung, Tool-Nutzung, schnelle direkte Antworten und Bildverstaendnis. Diese App fuehrt die verlustfreie native `.strata`-v1.1-`SQ-20`-Edition lokal ueber die dedizierte C++/CUDA-Engine `strata-inkling` aus.

    **Hauptfunktionen**

    - Text- und Bildeingaben (`Inkling-2-Mini-Vision.strata`, 0,64 GB verlustfreies BF16) sowie OpenAI-kompatibles Tool-Calling.
    - Integrierter 3-Layer-`DSpark`-Block-8-Speculative-Drafter und parallele Anfragen (`--parallel 1..64`, Standard `8`).
    - Verwaltung ueber Model Console sowie Anbindung ueber Olares Router oder die OpenAI-kompatible API.

    **Vor der ersten Nutzung**

    Beim ersten Start werden 20,0 GB geladen (`Inkling-2-Mini-SQ-20.strata`, `Inkling-2-Mini-Vision.strata`, `tokenizer.json`, `chat_template.jinja`). Erfordert auf amd64 eine AVX2-CPU und einen NVIDIA-Treiber ab R580 mit mindestens 22 GiB VRAM.

    [Modelldokumentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantisiertes Modell](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)

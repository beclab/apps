metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 fuer multimodales Agenten-Coding, Tool-Nutzung und parallele Anfragen, lokal betrieben mit Strata"
spec:
  upgradeDescription: |
    Aktualisiert die Inkling-Engine auf 0.1.71 (Image-Tag `0.2.23-inkling0.1.71-cuda13`, Strata 0.2.23): Antworten beginnen frueher, wenn viele Nutzer warten (letztes erstes Token bei 32 Nutzern 20,4 s auf 5,0 s); verlagert den K/V-Cache automatisch in den Arbeitsspeicher, wenn die Experten sonst nicht daneben passen wuerden.

    Gemessen auf dem Olares One (23-GiB-Limit emuliert, 16K Kontext pro Nutzer, 128 neue Tokens), Engine 0.1.71 gegen 0.1.70: eine Anfrage unveraendert (Mittel aus 6 Prompts 201,4 tok/s, Tokens identisch); 32K-Prompt unveraendert (Prefill 2.821 tok/s, Decode 86,1). End-to-End / stetig in tok/s: 16 Nutzer 234 / 465 auf 314 / 456; 24 Nutzer 112 / 259 auf 286 / 391; 32 Nutzer 104 / 227 auf 310 / 474. Letztes erstes Token bei 32 Nutzern 20,4 s auf 5,0 s. Alle 3.072 Experten bleiben bis 32 Nutzer auf der Karte. Beste Stufe: 16 Nutzer End-to-End, 32 Nutzer stetig. Diese App bietet `--parallel 1..32`; 64 Nutzer werden nicht angeboten (die Experten gehen in den gemischten Betrieb).

    [Strata v0.2.23](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini ist ein multimodales 26,4B-Looped-MoE-Modell fuer agentische Softwareentwicklung, Tool-Nutzung, schnelle direkte Antworten und Bildverstaendnis. Diese App fuehrt die verlustfreie native `.strata`-v1.1-`SQ-20`-Edition lokal ueber die dedizierte C++/CUDA-Engine `strata-inkling` aus.

    **Hauptfunktionen**

    - Text- und Bildeingaben (`Inkling-2-Mini-Vision-v2.strata`, 0,64 GB verlustfreies BF16) sowie OpenAI-kompatibles Tool-Calling.
    - DFlash-2-Drafter (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): ein kleines zweites Modell, das die naechsten Tokens raet und vom Hauptmodell geprueft wird. Die Engine schaltet ihn pro Karte und pro Anzahl paralleler Anfragen ein; `--draft off` deaktiviert ihn. Auf dem Olares One wird er fuer eine Anfrage und bei 16 Slots geladen; bei 2 bis 15 Slots sowie bei 24 und 32 Slots laeuft die Engine ohne ihn (bei 24 und 32 Slots bleiben die Experten auf der Karte).
    - Parallele Anfragen per Continuous Batching (`--parallel 1..32`, Standard `8`).
    - Verwaltung ueber Model Console sowie Anbindung ueber Olares Router oder die OpenAI-kompatible API.

    **Vor der ersten Nutzung**

    Beim ersten Start werden 20,6 GB geladen (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Erfordert auf amd64 eine AVX2-CPU und einen NVIDIA-Treiber ab R580 mit mindestens 22 GiB VRAM.

    Quellen: Inkling-2-Mini von Thinking Machines (Apache-2.0). DFlash-2-Drafter-Gewichte von Inco AI / z-lab (Apache-2.0); die hier genutzte Datei ist die von Strata konvertierte Kopie, mit Aenderungsvermerk in ihrem Repository.

    [Modelldokumentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantisiertes Modell](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [DFlash-2-Drafter](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)

metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 para programacion agentica multimodal, uso de herramientas y servicio concurrente en local con Strata"
spec:
  upgradeDescription: |
    Actualiza el motor Inkling a 0.1.71 (etiqueta de imagen `0.2.23-inkling0.1.71-cuda13`, Strata 0.2.23): las respuestas empiezan antes cuando hay muchos usuarios esperando (ultimo primer token con 32 usuarios 20,4 s a 5,0 s) y mueve la cache K/V a la memoria del sistema automaticamente cuando los expertos no cabrian junto a ella.

    Medido en el Olares One (limite de 23 GiB emulado, contexto de 16K por usuario, 128 tokens nuevos), motor 0.1.71 frente a 0.1.70: una peticion sin cambios (media de 6 prompts 201,4 tok/s, tokens identicos); prompt de 32K sin cambios (prefill 2.821 tok/s, decode 86,1). De extremo a extremo / estable en tok/s: 16 usuarios 234 / 465 a 314 / 456; 24 usuarios 112 / 259 a 286 / 391; 32 usuarios 104 / 227 a 310 / 474. Ultimo primer token con 32 usuarios 20,4 s a 5,0 s. Los 3.072 expertos permanecen en la tarjeta hasta 32 usuarios. Mejor nivel: 16 usuarios de extremo a extremo, 32 usuarios estable. Esta aplicacion ofrece `--parallel 1..32`; 64 usuarios no se ofrecen (los expertos pasan a modo hibrido).

    [Strata v0.2.23](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini es un modelo multimodal Looped MoE de 26,4B parametros disenado para ingenieria de software agentica, uso de herramientas, respuestas directas rapidas y comprension visual. Esta aplicacion ejecuta localmente la edicion nativa sin perdida `.strata` v1.1 `SQ-20` con el motor dedicado `strata-inkling`.

    **Caracteristicas principales**

    - Entradas de texto e imagen (`Inkling-2-Mini-Vision-v2.strata`, 0,64 GB BF16 sin perdida) y tool calling compatible con OpenAI.
    - Borrador DFlash 2 (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0,55 GB): un modelo pequeno que propone los siguientes tokens y que el modelo principal comprueba. El motor lo activa por tarjeta y por numero de peticiones paralelas; `--draft off` lo desactiva. En el Olares One se carga para una peticion y con 16 ranuras; con 2 a 15 ranuras y con 24 y 32 ranuras el motor funciona sin el (con 24 y 32 ranuras los expertos permanecen en la tarjeta).
    - Peticiones concurrentes mediante lotes continuos (`--parallel 1..32`, predeterminado `8`).
    - Gestion mediante Model Console y conexion por Olares Router o API compatible con OpenAI.

    **Antes del primer uso**

    El primer inicio descarga 20,6 GB (`Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, `chat_template.jinja`). Requiere CPU amd64 con AVX2 y controlador NVIDIA R580 o posterior con 22+ GiB de VRAM.

    Creditos: Inkling-2-Mini de Thinking Machines (Apache-2.0). Pesos del borrador DFlash 2 de Inco AI / z-lab (Apache-2.0); el archivo usado aqui es la copia convertida por Strata, con la declaracion de cambios en su repositorio.

    [Documentacion del modelo](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modelo cuantizado](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Borrador DFlash 2](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Documentacion de Strata](https://github.com/Niko1221/Strata)

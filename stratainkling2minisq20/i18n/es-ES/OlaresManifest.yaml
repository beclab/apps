metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Thinking Machines Inkling-2-Mini SQ-20 para programacion agentica multimodal, uso de herramientas y servicio concurrente en local con Strata"
spec:
  upgradeDescription: |
    Lanzamiento inicial de Thinking Machines Inkling-2-Mini SQ-20 con Strata v0.2.19 (`strata-inkling`) y Model Console (`llm-init` v1.7.26), optimizado para GPUs NVIDIA de 24 GiB incluido Olares One.

    - Ejecuta pesos nativos `.strata` v1.1 sin perdida `SQ-20` (`19,35 GB` / `18,02 GiB`, `SF4+MX8` bit-exacto + borrador especulativo `DSpark` Block-8 integrado) y el modulo Vision `BF16` (`0,64 GB`) 100% en VRAM de 24 GiB.
    - Compatible con respuestas directas de baja latencia, lectura multimodal de imagenes, llamadas a herramientas compatibles con OpenAI y procesamiento concurrente (`--parallel 1..64`, predeterminado `8`).
    - Sin espera de conversion GGUF en el primer arranque.

    [Strata v0.2.19](https://github.com/Niko1221/Strata/releases/tag/v0.2.19)
  fullDescription: |
    Thinking Machines Inkling-2-Mini es un modelo multimodal Looped MoE de 26,4B parametros disenado para ingenieria de software agentica, uso de herramientas, respuestas directas rapidas y comprension visual. Esta aplicacion ejecuta localmente la edicion nativa sin perdida `.strata` v1.1 `SQ-20` con el motor dedicado `strata-inkling`.

    **Caracteristicas principales**

    - Entradas de texto e imagen (`Inkling-2-Mini-Vision.strata`, 0,64 GB BF16 sin perdida) y tool calling compatible con OpenAI.
    - Decodificacion especulativa integrada `DSpark` Block-8 y lotes continuos concurrentes (`--parallel 1..64`, predeterminado `8`).
    - Gestion mediante Model Console y conexion por Olares Router o API compatible con OpenAI.

    **Antes del primer uso**

    El primer inicio descarga 20,0 GB (`Inkling-2-Mini-SQ-20.strata`, `Inkling-2-Mini-Vision.strata`, `tokenizer.json`, `chat_template.jinja`). Requiere CPU amd64 con AVX2 y controlador NVIDIA R580 o posterior con 22+ GiB de VRAM.

    [Documentacion del modelo](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Modelo cuantizado](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Documentacion de Strata](https://github.com/Niko1221/Strata)

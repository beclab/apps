metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Strata によりローカル動作する Thinking Machines Inkling-2-Mini SQ-20（マルチモーダル・エージェント開発・ツール連携・並列処理対応）"
spec:
  upgradeDescription: |
    Inkling エンジンを 0.1.71（イメージタグ `0.2.23-inkling0.1.71-cuda13`、Strata 0.2.23）に更新します。多数のユーザーが待機している場合に応答が早く始まり（32 ユーザーでの最後の最初のトークン 20.4 秒から 5.0 秒）、エキスパートが収まらない場合は K/V キャッシュを自動的にシステムメモリへ移します。

    Olares One での実測（23 GiB の制限をエミュレート、ユーザーあたり 16K コンテキスト、新規 128 トークン）、エンジン 0.1.71 対 0.1.70：単一リクエストは変わらず（6 プロンプトの平均 201.4 tok/s、トークン一致）、32K プロンプトも変わらず（プリフィル 2,821 tok/s、デコード 86.1）。エンドツーエンド / 定常 tok/s：16 ユーザー 234 / 465 から 314 / 456、24 ユーザー 112 / 259 から 286 / 391、32 ユーザー 104 / 227 から 310 / 474。32 ユーザーでの最後の最初のトークンは 20.4 秒から 5.0 秒。3,072 個のエキスパートは 32 ユーザーまでカード上に収まります。最良の水準：エンドツーエンドは 16 ユーザー、定常は 32 ユーザー。本アプリは `--parallel 1..32` を提供します。64 ユーザーは提供しません（エキスパートがハイブリッド配置になります）。

    [Strata v0.2.23](https://github.com/Niko1221/Strata/releases/tag/v0.2.23)
  fullDescription: |
    Thinking Machines Inkling-2-Mini は、エージェント型ソフトウェア開発、ツール利用、高速な直接応答、視覚理解向けに設計された 26.4B パラメータの Looped MoE マルチモーダルモデルです。本アプリは専用 C++/CUDA エンジン `strata-inkling` を用いてネイティブ `.strata` v1.1 ロスレス `SQ-20` 版をローカル実行します。

    **主な機能**

    - テキストおよび画像入力（`Inkling-2-Mini-Vision-v2.strata`、0.64 GB ロスレス BF16）と OpenAI 互換ツール呼び出し。
    - DFlash 2 ドラフター（`Inkling-2-Mini-DFlash2-mix.safetensors`、0.55 GB）：次のトークンを推測する小型の第 2 モデルで、メインモデルがそれを検証します。エンジンがカードと並列リクエスト数ごとに有効化し、`--draft off` で無効にできます。Olares One では、単一リクエストと 16 スロットで読み込まれ、2〜15 スロットおよび 24・32 スロットではエンジンはこれなしで動作します（24・32 スロットではエキスパートがカード上に残ります）。
    - 連続バッチによる並列リクエスト処理（`--parallel 1..32`、既定 `8`）。
    - Model Console でのモデル管理、Olares Router または OpenAI 互換チャット API 経由での連携。

    **初回利用前に**

    初回起動時に 20.6 GB（`Inkling-2-Mini-SQv2-20.strata`、`Inkling-2-Mini-Vision-v2.strata`、`Inkling-2-Mini-DFlash2-mix.safetensors`、`tokenizer.json`、`chat_template.jinja`）をダウンロードします。amd64 環境では AVX2 対応 CPU および R580 以降の NVIDIA ドライバ（22+ GiB VRAM）が必要です。

    クレジット：Inkling-2-Mini は Thinking Machines（Apache-2.0）。DFlash 2 ドラフターの重みは Inco AI / z-lab（Apache-2.0）。ここで使用するファイルは Strata が変換したコピーで、変更点の記載はそのリポジトリにあります。

    [モデルドキュメント](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [量子化モデル](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [DFlash 2 ドラフター](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata ドキュメント](https://github.com/Niko1221/Strata)

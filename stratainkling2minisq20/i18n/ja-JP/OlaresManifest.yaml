metadata:
  title: Inkling-2-Mini SQ-20 (Strata)
  description: "Strata によりローカル動作する Thinking Machines Inkling-2-Mini SQ-20（マルチモーダル・エージェント開発・ツール連携・並列処理対応）"
spec:
  upgradeDescription: |
    Strata v0.2.19（`strata-inkling`）および Model Console（`llm-init` v1.7.26）向けに Thinking Machines Inkling-2-Mini SQ-20 を初回リリース。Olares One を含む 24 GiB NVIDIA GPU 向けに最適化されています。

    - ネイティブ `.strata` v1.1 ロスレス `SQ-20` 重み（`19.35 GB` / `18.02 GiB`、ビット完全一致 `SF4+MX8` + 内蔵 `DSpark` Block-8 ドラフター）およびロスレス `BF16` Vision シャード（`0.64 GB`）を 24 GiB VRAM に 100% 常駐実行。
    - 低遅延の直接応答、マルチモーダル画像認識、OpenAI 互換ツール呼び出し、連続バッチ並列処理（`--parallel 1..64`、既定 `8`）に対応。
    - 初回起動時の GGUF 変換待ちなし。

    [Strata v0.2.19](https://github.com/Niko1221/Strata/releases/tag/v0.2.19)
  fullDescription: |
    Thinking Machines Inkling-2-Mini は、エージェント型ソフトウェア開発、ツール利用、高速な直接応答、視覚理解向けに設計された 26.4B パラメータの Looped MoE マルチモーダルモデルです。本アプリは専用 C++/CUDA エンジン `strata-inkling` を用いてネイティブ `.strata` v1.1 ロスレス `SQ-20` 版をローカル実行します。

    **主な機能**

    - テキストおよび画像入力（`Inkling-2-Mini-Vision.strata`、0.64 GB ロスレス BF16）と OpenAI 互換ツール呼び出し。
    - 内蔵 3 層 `DSpark` Block-8 投機的デコーディングおよび並列リクエスト処理（`--parallel 1..64`、既定 `8`）。
    - Model Console でのモデル管理、Olares Router または OpenAI 互換チャット API 経由での連携。

    **初回利用前に**

    初回起動時に 20.0 GB（`Inkling-2-Mini-SQ-20.strata`、`Inkling-2-Mini-Vision.strata`、`tokenizer.json`、`chat_template.jinja`）をダウンロードします。amd64 環境では AVX2 対応 CPU および R580 以降の NVIDIA ドライバ（22+ GiB VRAM）が必要です。

    [モデルドキュメント](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [量子化モデル](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Strata ドキュメント](https://github.com/Niko1221/Strata)

{{- $dom := .Values.domain | default dict -}}
{{- $us := .Values.userspace | default dict -}}
{{- $appCommon := $us.appCommon | default "/olares/common" -}}
{{- $appCache := $us.appCache | default "/olares/cache" -}}
{{- $strataclientDomainENV := split "," ($dom.strataclient | default "localhost") -}}
{{- $strataclientDomain := index $strataclientDomainENV "_0" -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- $supportsGroups := dict
      "vision" "supports_vision"
      "tools" "supports_function_calling,supports_parallel_function_calling,supports_tool_choice"
      "none" ""
      "embedding" "" -}}
{{- $modelSupports := $oe.MODEL_SUPPORTS | default "" -}}
{{- $expandedSupports := list -}}
{{- range $tok := splitList "," $modelSupports -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- if hasKey $supportsGroups $tok -}}
{{- $mapped := index $supportsGroups $tok -}}
{{- if $mapped -}}
{{- $expandedSupports = append $expandedSupports $mapped -}}
{{- end -}}
{{- else -}}
{{- $expandedSupports = append $expandedSupports $tok -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $modelSupports = join "," $expandedSupports -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- $logLevel := $oe.LOG_LEVEL | default "info" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $runStateHostPath := include "strata.runStateHostPath" . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llminit
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llm-init
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ $appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
        - name: legacy-run-state
          hostPath:
            path: {{ printf "%s/%s" $appCache (include "strata.runStateSubpath" .) | quote }}
            type: DirectoryOrCreate
      initContainers:
        - name: migrate-run-state
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              mkdir -p /run/llm-init
              chown 1000:1000 /run/llm-init
              if [ -f /run/llm-init/model-spec.json ]; then
                exit 0
              fi
              if [ -f /legacy-run-state/model-spec.json ]; then
                stage=/run/llm-init/.legacy-migration
                mkdir -p "$stage"
                cp -a /legacy-run-state/. "$stage/"
                mv "$stage/model-spec.json" /run/llm-init/.model-spec.migrating
                cp -a "$stage/." /run/llm-init/
                rm -rf "$stage"
                mv /run/llm-init/.model-spec.migrating /run/llm-init/model-spec.json
              fi
          volumeMounts:
            - {name: legacy-run-state, mountPath: /legacy-run-state, readOnly: true}
            - {name: run-state, mountPath: /run/llm-init}
          securityContext: {runAsUser: 0}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              hub={{ include "strata.hfPath" . | quote }}
              mkdir -p "$hub/.locks"
              chown 1000:1000 "$hub" "$hub/.locks" /run/llm-init
              # One folder per Hugging Face repository in MODEL_SOURCE: the model pack and the DFlash 2 drafter.
              for name in models--strata-engine--Inkling-2-Mini-Strata models--strata-engine--Inkling-2-Mini-DFlash2; do
                repo="$hub/$name"
                mkdir -p "$hub/.locks/$name" "$repo/blobs" "$repo/refs" "$repo/snapshots"
                chown 1000:1000 "$hub/.locks/$name" "$repo" "$repo/blobs" "$repo/refs" "$repo/snapshots"
              done
          volumeMounts:
            - name: hf-cache
              mountPath: {{ include "strata.hfPath" . }}
            - name: run-state
              mountPath: /run/llm-init
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 0
      containers:
        - name: llm-init
          image: {{ .Values.images.llmInit | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HUB_CACHE
              value: {{ include "strata.hfPath" . | quote }}
            - name: ENGINE_KIND
              value: strata
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: {{ $modelSource | quote }}
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
{{- if $modelSupports }}
            - name: MODEL_SUPPORTS
              value: "{{ $modelSupports }}"
{{- end }}
            - name: ENGINE_ARGS
              value: {{ $engineArgs | quote }}
            - name: HF_ENABLE_XET
              value: "true"
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "{{ $logLevel }}"
            - name: LOG_FORMAT
              value: json
            - name: APP_URL
              value: "https://{{ $strataclientDomain }}"
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: {{ include "strata.hfPath" . }}
            - name: run-state
              mountPath: /run/llm-init
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP

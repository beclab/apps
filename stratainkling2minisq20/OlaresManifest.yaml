envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://strata-engine/Inkling-2-Mini-Strata --include Inkling-2-Mini-SQ-20.strata,hf://strata-engine/Inkling-2-Mini-Strata --include Inkling-2-Mini-Vision.strata,hf://strata-engine/Inkling-2-Mini-Strata --include tokenizer.json,hf://strata-engine/Inkling-2-Mini-Strata --include chat_template.jinja
  description: Native .strata v1.1 lossless SQ-20 checkpoint, BF16 Vision shard, and o200k tokenizer/template sharing one HF snapshot.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: inkling-2-mini-sq-20
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: vision,tools
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: --context 32768 --parallel 8
  description: Strata setup.py / strata-inkling options. Model/source/host/port/GPU/vision are managed by the chart. Supports --context up to 1048576, --parallel 1..64, --kv-dtype auto|fp16|fp8, and --draft dspark|off. Saving engine_args in Model Console relaunches without re-downloading weights.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '1'
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 6Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: '10'
  description: CPU limit for the Strata engine, in cores (platform quota cap 12). Saving this relaunches the engine.
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 20Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 22Gi

envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://strata-engine/Inkling-2-Mini-Strata --revision 5623ceb47d7a01db827460ce1c23e7818a75661b --include Inkling-2-Mini-SQv2-20.strata,hf://strata-engine/Inkling-2-Mini-Strata --revision 5623ceb47d7a01db827460ce1c23e7818a75661b --include Inkling-2-Mini-Vision-v2.strata,hf://strata-engine/Inkling-2-Mini-Strata --revision 5623ceb47d7a01db827460ce1c23e7818a75661b --include tokenizer.json,hf://strata-engine/Inkling-2-Mini-Strata --revision 5623ceb47d7a01db827460ce1c23e7818a75661b --include chat_template.jinja,hf://strata-engine/Inkling-2-Mini-DFlash2 --revision 04ecd36faef74e696f0a7b6b3c119264442a6234 --include Inkling-2-Mini-DFlash2-mix.safetensors
  description: Native .strata v1.1 lossless SQ-20 v2 checkpoint (sha256 429671f8eb5b50e593856e6eb82ebb7da9d1f07e99b553438b196f72cc86a6d6), BF16 Vision v2 shard and o200k tokenizer/template sharing one pinned HF snapshot, plus the DFlash 2 drafter file (sha256 cf7dbb08560dfd99544af0cdbab2915406fc571f516b19aff0fe113b9458d387) from a second pinned repository; the main model is listed first.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: inkling-2-mini-sq-20
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: vision,tools
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  # OLARES-0223, Olares One, 0.2.23 tip engine: 8 slots at 16K context 226 tok/s end to end, 16 slots 234 tok/s (DFlash 2 loaded, all experts on the card); 32 slots moves about 300 experts to host RAM (112 tok/s)
  # and 64 slots about 1,382 (58 tok/s), so 16 is the largest offered. On this card (23.4 GiB reported, under the 24 GiB class) the engine loads no drafter for 2 to 15 slots; one slot and 16 slots draft.
  default: --context 16384 --parallel 8
  description: Strata setup.py / strata-inkling options. Model/source/host/port/GPU/vision are managed by the chart. Supports --context per request slot (16384 at 8 to 16 slots, 32768 for one request, or 131072 for one request with all experts still on the card), --parallel 1..16, --kv-dtype auto|fp16|fp8, and --draft off|dflash2 (--draft on loads DFlash 2 past the engine's memory check). Saving engine_args in Model Console relaunches without re-downloading weights.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: '1'
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 6Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: '10'
  description: CPU limit for the Strata engine, in cores (platform quota cap 12). Saving this relaunches the engine.
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 20Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 23Gi

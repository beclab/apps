spec:
  onlyAdmin: true
  versionName: Inkling-2-Mini SQ-20
  upgradeDescription: |
    Updates Inkling-2-Mini SQ-20 to Strata v0.2.23 (`strata-inkling`) with Model Console (`llm-init` v1.7.26).

    - New model file `Inkling-2-Mini-SQv2-20.strata` (`19.37 GB`): the SQ-20 build in the re-adjusted 16 KiB file layout, with the new picture file `Inkling-2-Mini-Vision-v2.strata` (`0.64 GB`). Both are pinned to one Hugging Face commit and checked by size.
    - DFlash 2 replaces DSpark as the drafter. It is one extra file, `Inkling-2-Mini-DFlash2-mix.safetensors` (`0.55 GB`), downloaded next to the model. The engine decides per card and per number of parallel requests whether to use it; `--draft off` in ENGINE_ARGS turns it off. Without the file the model runs with no drafter.
    - The first start after this update downloads the new files (`20.6 GB` in total) before the model loads.
  fullDescription: |
    Thinking Machines Inkling-2-Mini is a 26.4B-parameter looped Mixture-of-Experts multimodal model (3.4B active per pass / 5.4B looped-active across 48 virtual visits) engineered for agentic software engineering, tool use, fast direct responses, and visual understanding. This app runs Strata's native `.strata` v1.1 bit-exact lossless `SQ-20` edition locally using the dedicated `strata-inkling` C++/CUDA engine.

    Strata is an open-source inference engine for running frontier AI models locally. For Inkling-2-Mini `SQ-20`, the 18.04 GiB lossless checkpoint fits inside a 24 GiB GPU, leaving room for the paged SWA-1024 + compact 8-visit Global KV cache across multiple concurrent requests. Model Console connects the engine to Olares.

    **Key features**

    - Generate direct responses from text and image inputs (`Inkling-2-Mini-Vision-v2.strata`, 0.64 GB lossless BF16) with OpenAI-compatible tool calling.
    - Speed up generation with the DFlash 2 drafter (`Inkling-2-Mini-DFlash2-mix.safetensors`, 0.55 GB): a small second model that guesses the next tokens, which the main model then checks. The engine turns it on per card and per number of parallel requests; `--draft off` disables it.
    - Serve multiple requests concurrently via continuous batching (`--parallel 1..16`, default `8`).
    - Use Model Console to download the model, monitor readiness, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition (`SQ-20`, file `Inkling-2-Mini-SQv2-20.strata`, 19.37 GB) uses bit-exact native `SF4+MX8` weights. Default context is 16,384 tokens per request with 8 concurrent request slots (`--parallel 1..16`); one request (`--parallel 1`) runs 32,768 tokens. On the Olares One the engine uses DFlash 2 for one request and at 16 parallel requests, and loads no drafter for 2 to 15 (the default 8 slots run without it). A single request can use 131,072 tokens (`--parallel 1 --context 131072`): all 3,072 experts stay on the card and the K/V cache is split between GPU and system memory automatically.

    **Before first use**

    First startup downloads 20.6 GB across `Inkling-2-Mini-SQv2-20.strata`, `Inkling-2-Mini-Vision-v2.strata`, `Inkling-2-Mini-DFlash2-mix.safetensors`, `tokenizer.json`, and `chat_template.jinja`. Because `.strata` v1.1 loads directly without GGUF repacking, startup proceeds straight to model loading once the download completes.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer (22+ GiB GPU memory) are required.

    Credits: Inkling-2-Mini by Thinking Machines (Apache-2.0). DFlash 2 drafter weights by Inco AI / z-lab (Apache-2.0); the file used here is Strata's converted copy of them (8-bit and 4-bit matrices), with a statement of changes in its repository.

    [Model documentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantized model](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [DFlash 2 drafter](https://huggingface.co/strata-engine/Inkling-2-Mini-DFlash2) · [Strata documentation](https://github.com/Niko1221/Strata)
  developer: Thinking Machines (model); Niko1221 (Strata engine); Inco AI and z-lab (DFlash 2 drafter)
  website: https://huggingface.co/thinkingmachines/Inkling-2-Mini
  sourceCode: https://github.com/Niko1221/Strata
  doc: https://github.com/Niko1221/Strata#readme
  submitter: Niko1221

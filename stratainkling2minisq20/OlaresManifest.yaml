  accelerator:
  - mode: nvidia
    limitedCpu: '12'
    requiredCpu: 1300m
    # llm-init (beclab/model-console, internal/lifecycle/ensure.go) removes no Hugging Face snapshot, so an upgrade from 0.0.1 keeps the old SQ-20 files (19,346,685,952 B + 636,526,592 B)
    # beside the new five files (20,589,105,542 B): about 37.8 GiB. limitedDisk 48Gi leaves about 10 GiB over that; a fresh install needs 19.2 GiB (requiredDisk 24Gi).
    requiredDisk: 24Gi
    limitedDisk: 48Gi
    # OLARES-0223 (Olares One, SQ-20 v2 + DFlash 2): all 3,072 experts stay on the card from 22,016 MiB; the prefill chunk is 1,024 from 23,552 MiB (= 23Gi, the value here) and 512 below it
    # (9K prompt: 3,655 against 3,100 tok/s). At 21.5 GiB the experts go hybrid and decode falls to 47 tok/s. Engine RSS under 3 GB at 32K single stream; 8 slots at 16K put about 3.1 GiB of KV in host RAM (16 slots 3.9 GiB): 8Gi request / 24Gi limit kept.
    requiredMemory: 8Gi
    limitedMemory: 24Gi
    requiredGPUMemory: 23Gi
    limitedGPUMemory: 24Gi
  supportArch:
  - amd64
  runAsUser: true

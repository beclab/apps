spec:
  onlyAdmin: true
  versionName: Inkling-2-Mini SQ-20
  upgradeDescription: |
    Initial release of Thinking Machines Inkling-2-Mini SQ-20 on Strata v0.2.19 (`strata-inkling`) and Model Console (`llm-init` v1.7.26), sized for 24 GiB NVIDIA GPUs including Olares One.

    - Runs native `.strata` v1.1 lossless `SQ-20` weights (`19.35 GB` / `18.02 GiB`, bit-exact `0.00000` KLD native `SF4+MX8` LLM + embedded `DSpark` Block-8 Recurrent Markov drafter) and lossless `BF16` Vision shard (`0.64 GB`) 100% resident in 24 GiB VRAM.
    - Supports direct low-latency responses, built-in multimodal image reading, OpenAI-compatible tool calling, and continuous batching (`--parallel 1..64`, default `8`).
    - Zero GGUF conversion wait on first startup: proceeds straight from Hugging Face download to serving.

    [Strata v0.2.19](https://github.com/Niko1221/Strata/releases/tag/v0.2.19)
  fullDescription: |
    Thinking Machines Inkling-2-Mini is a 26.4B-parameter looped Mixture-of-Experts multimodal model (3.4B active per pass / 5.4B looped-active across 48 virtual visits) engineered for agentic software engineering, tool use, fast direct responses, and visual understanding. This app runs Strata's native `.strata` v1.1 bit-exact lossless `SQ-20` edition locally using the dedicated `strata-inkling` C++/CUDA engine.

    Strata is an open-source inference engine for running frontier AI models locally. For Inkling-2-Mini `SQ-20`, the entire 18.02 GiB lossless checkpoint and embedded `DSpark` Block-8 speculative drafter fit 100% inside a 24 GiB GPU, leaving headroom for paged SWA-1024 + compact 8-visit Global KV cache across multiple concurrent requests. Model Console connects the engine to Olares.

    **Key features**

    - Generate direct responses from text and image inputs (`Inkling-2-Mini-Vision.strata`, 0.64 GB lossless BF16) with OpenAI-compatible tool calling.
    - Accelerate generation with the embedded 3-layer `DSpark` Block-8 Recurrent Markov speculative drafter.
    - Serve multiple requests concurrently via continuous batching (`--parallel 1..64`, default `8`).
    - Use Model Console to download the model, monitor readiness, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition (`SQ-20`) runs 100% VRAM-resident on 24 GiB GPUs (including Olares One) with bit-exact native `SF4+MX8` weights (`0.00000` KLD). Default context is 32,768 tokens (configurable up to 1,048,576 tokens) with 8 concurrent request slots by default.

    **Before first use**

    First startup downloads 20.0 GB across `Inkling-2-Mini-SQ-20.strata`, `Inkling-2-Mini-Vision.strata`, `tokenizer.json`, and `chat_template.jinja`. Because `.strata` v1.1 loads directly without GGUF repacking, startup proceeds straight to model loading once the download completes.

    On amd64, an AVX2-capable CPU and an NVIDIA driver from the R580 series or newer (22+ GiB GPU memory) are required.

    [Model documentation](https://huggingface.co/thinkingmachines/Inkling-2-Mini) · [Quantized model](https://huggingface.co/strata-engine/Inkling-2-Mini-Strata) · [Strata documentation](https://github.com/Niko1221/Strata)
  developer: Thinking Machines (model); Niko1221 (Strata engine)
  website: https://huggingface.co/thinkingmachines/Inkling-2-Mini

metadata:
  title: Jina CLIP v2
  description: "意味に基づく検索のための多言語テキスト・画像埋め込みモデル"

spec:
  fullDescription: |
    Jina CLIP v2は、テキストと画像を共通の空間にある数値ベクトルに変換します。対応するアプリはこれらのベクトルを使い、文章の説明から画像を探したり、文章同士の意味を比較したりできます。

    モデルは89言語のテキスト入力に対応しています。このアプリは、テキストと画像の埋め込み機能を対応するOlaresアプリに提供します。

    モデルの重みはCC BY-NC 4.0の下で非商用利用に限り提供されます。商用ライセンスについてはJina AIにお問い合わせください。

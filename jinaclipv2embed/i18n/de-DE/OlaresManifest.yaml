metadata:
  title: Jina CLIP v2
  description: "Mehrsprachige Text- und Bild-Embeddings für die semantische Suche"

spec:
  fullDescription: |
    Jina CLIP v2 wandelt Text und Bilder in Zahlenvektoren in einem gemeinsamen Vektorraum um. Kompatible Anwendungen können damit Bilder anhand von Textbeschreibungen finden oder die Bedeutung von Textpassagen vergleichen.

    Das Modell unterstützt Texteingaben in 89 Sprachen. Diese App stellt seine Text- und Bild-Embeddings für kompatible Olares-Anwendungen bereit.

    Die Modellgewichte stehen unter CC BY-NC 4.0 für die nichtkommerzielle Nutzung. Wenden Sie sich für eine kommerzielle Lizenz an Jina AI.

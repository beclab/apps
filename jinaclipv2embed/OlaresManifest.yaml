olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: jinaclipv2embed
  icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
  description: "Multilingual text and image embeddings for semantic search"
  appid: jinaclipv2embed
  title: Jina CLIP v2
  version: '1.0.13'
  categories:
    - AI
    - models
  tags:
    - embedding
sharedEntrances:
  - name: jinaclipv2embed
    host: sharedentrances-api
    port: 0
    title: Jina CLIP v2 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
entrances:
  - name: clipclient
    port: 8090
    host: download-svc
    title: Jina CLIP v2
    icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
    openMethod: window
    authLevel: internal
  - name: clipapi
    port: 8090
    host: download-svc
    title: Jina CLIP v2 API
    icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
    invisible: true
    openMethod: window
    authLevel: internal
#   jinaclipv2embed — embed-server engine Deployment (== appid / Release.Name)
#   llminit           — llm-init (ENGINE_KIND=clipembed): download + API proxy
workloadReplicas:
  jinaclipv2embed: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'jina-clip-v2'
  fullDescription: |
    Jina CLIP v2 converts text and images into numerical vectors in a shared space. Compatible applications can use these vectors to find images from text descriptions or compare the meaning of text passages.

    The model supports 89 languages for text input. This app provides its text and image embedding capabilities to compatible Olares applications.

    Model weights are licensed for non-commercial use under CC BY-NC 4.0. Contact Jina AI for commercial licensing.
  developer: Jina AI
  website: https://jina.ai/
  sourceCode: https://huggingface.co/jinaai/jina-clip-v2
  doc: https://huggingface.co/jinaai/jina-clip-v2
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  license:
    - text: CC BY-NC 4.0
      url: https://creativecommons.org/licenses/by-nc/4.0/
  accelerator:
    # Olares upload validates Σ(all container limits) ≤ accelerator limits:
    #   embed-server 4 CPU / 6Gi (+ llm-init 1 CPU / 1Gi) → need limitedCpu≥5, limitedMemory≥7Gi
    #   nvidia-gb10 embed-server 14Gi → Σ memory 15Gi, limitedMemory 16Gi
    # Profile: /var/wangzhong/local-dev/llminit/clipembed_resource_reports/Jina-CLIP-v2-资源画像.md
    - mode: cpu
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 5Gi
      limitedDisk: 50Gi
    - mode: nvidia
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 10Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 10240Mi
      limitedGPUMemory: 12288Mi
    - mode: nvidia-gb10
      # No requiredGPUMemory/limitedGPUMemory on nvidia-gb10 (Spark unified memory).
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 12Gi
      limitedMemory: 16Gi
      requiredDisk: 10Gi
      limitedDisk: 50Gi
    - mode: intel
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 5Gi
      limitedDisk: 50Gi

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  allowMultipleInstall: true
  LLMGatewaySupported: true
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "jina-clip-v2"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "embedding"
    options:
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "embedding_image_input"
    options:
    - title: Image input (same vector space as text)
      value: embedding_image_input
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error

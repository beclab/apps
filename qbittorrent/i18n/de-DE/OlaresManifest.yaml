metadata:
  title: qBittorrent
  description: Kostenloser BitTorrent-Downloader
spec:
  fullDescription: |
    qBittorrent ist ein etablierter Open-Source-BitTorrent-Client. qBittorrent hat einen geringen Footprint und bietet zugleich alle Funktionen, die Sie benötigen. Es nutzt die hochmoderne Bibliothek libtorrent-rasterbar und ermöglicht so höhere Download- und Upload-Geschwindigkeiten sowie hervorragende Unterstützung der neuesten BitTorrent-Protokollfunktionen.

    **FUNKTIONEN**
    - Polierte µTorrent-ähnliche Benutzeroberfläche
    - Keine Werbung
    - Gut integrierte und erweiterbare Suchmaschine
      - Gleichzeitige Suche in vielen Torrent-Suchseiten
      - Kategoriespezifische Suchanfragen (z. B. Bücher, Musik, Software)
    - RSS-Feed-Unterstützung mit erweiterten Download-Filtern (inkl. Regex)
    - Viele unterstützte BitTorrent-Erweiterungen:
      - Magnet-Links
      - Distributed Hash Table (DHT), Peer Exchange Protocol (PEX), Local Peer Discovery (LSD)
      - Private Torrents
      - Verschlüsselte Verbindungen
      - und vieles mehr...
    - Fernsteuerung über die mit AJAX geschriebene Web-Benutzeroberfläche
      - Fast identisch zur regulären GUI
    - Sequentielles Herunterladen (in Reihenfolge)
    - Erweiterte Kontrolle über Torrents, Tracker und Peers
      - Torrent-Warteschlange und Priorisierung
      - Auswahl und Priorisierung von Torrent-Inhalten
    - Bandbreitenplaner
    - Torrent-Erstellungstool
    - IP-Filterung (kompatibel mit eMule- & PeerGuardian-Format)
    - IPv6-konform
    - UPnP- / NAT-PMP-Portweiterleitung
    - Verfügbar auf allen Plattformen: Windows, Linux, macOS, FreeBSD, OS/2
    - Verfügbar in ~70 Sprachen
  upgradeDescription: |
    v1.0.31: qBittorrent von 5.2.2 auf 5.2.3 aktualisieren.

    Behebt Migrationen, Datenbank-Deadlocks, Tracker- und Web-Seed-Kodierung,
    RSS-Intervalle, Plugin-Zählung, relative UI-Themenpfade und WebUI-CSS.

    Hinweise: https://github.com/qbittorrent/qBittorrent/releases/tag/release-5.2.3

    Upgrade von qBittorrent auf Version 5.2.2 (2026-06-25)
    Konfigurationsänderungen: External-Verzeichnis zum Downloadpfad hinzugefügt.
    - Standard-Mountpfad des Olares Home Directory auf /olares/userdata/home geändert
    - Standard-Mountpfad des Olares External Directory auf /olares/userdata/external geändert

    Upgrade-Highlights:
    - [Sicherheit] Mehrere Sicherheitsfixes: lokaler Dateizugriff in WebAPI-/RSS-/Search-Modulen verhindert (v5.1.2); SSRF über HTTP-Umleitung gepatcht (v5.2.1); X-Forwarded-Host-Header auf Reverse-Proxy-Modus beschränkt, um Host-Spoofing zu verhindern (v5.2.2)
    - [Neue Funktionen] Statusleiste zeigt jetzt freien Speicherplatz und externe IP-Adresse; Tracker-Liste kann von einer URL abgerufen werden; Share-Limits pro Kategorie; optionaler Systemneustart bei Download-Abschluss; erweiterter Filter „Tracker status“ hinzugefügt
    - [WebUI-Überarbeitung] Große WebUI-Neuschreibung: virtuelles Listen-Rendering für deutlich bessere Leistung bei großen Torrent-Warteschlangen; neue UI zur Torrent-Erstellung; neu gestaltetes Anmeldeformular; Basic Auth und API-Key-Authentifizierung; konfigurierbare Anzeigedichte
    - [WebAPI & Suche] Neue Endpunkte: app/processInfo, setComment; Unterstützung für API-Key-Auth; SOCKS4/SOCKS4a-Proxy für die Suchmaschine; mehrere gleichzeitige Suchen mit persistenter Historie und Tab-Sitzungen
    - [Stabilitätsfixes] Leere Ordner nach Löschen/Verschieben von Torrents behoben; veraltete Lockfile verursachte Startfehler; getrandom()-Abstürze auf bestimmten Linux-Setups; vorzeitiges Reannounce vor Anwendung von Interface-Änderungen
    - [Plattformunterstützung] Windows-NSIS-Installer mit nativem ARM64-Build; Linux erhält D-Bus-Dateimanager-Integration; AppImages unterstützen Wayland nativ

    Vollständiges Changelog: https://www.qbittorrent.org/news#mon-jun-15th-2026---qbittorrent-v5.2.2-release

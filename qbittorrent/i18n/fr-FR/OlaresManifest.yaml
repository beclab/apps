metadata:
  title: qBittorrent
  description: Téléchargeur BitTorrent gratuit
spec:
  fullDescription: |
    qBittorrent est un client BitTorrent open source bien établi. qBittorrent a une empreinte légère tout en offrant toutes les fonctionnalités dont vous pourriez avoir besoin. Il utilise la bibliothèque avancée libtorrent-rasterbar, ce qui signifie une plus grande vitesse de téléchargement et d'envoi, ainsi qu'un excellent support des dernières fonctionnalités du protocole BitTorrent.

    **FONCTIONNALITÉS**
    - Interface utilisateur soignée de type µTorrent
    - Pas de publicités
    - Moteur de recherche bien intégré et extensible
      - Recherche simultanée sur de nombreux sites de recherche de torrents
      - Requêtes de recherche spécifiques par catégorie (p. ex. Livres, Musique, Logiciels)
    - Prise en charge des flux RSS avec filtres de téléchargement avancés (y compris regex)
    - De nombreuses extensions BitTorrent prises en charge :
      - Liens magnet
      - Distributed hash table (DHT), peer exchange protocol (PEX), local peer discovery (LSD)
      - Torrents privés
      - Connexions chiffrées
      - et bien plus encore...
    - Contrôle à distance via l'interface web écrite en AJAX
      - Presque identique à l'interface graphique classique
    - Téléchargement séquentiel (télécharger dans l'ordre)
    - Contrôle avancé sur les torrents, trackers et peers
      - File d'attente et priorisation des torrents
      - Sélection et priorisation du contenu des torrents
    - Planificateur de bande passante
    - Outil de création de torrents
    - Filtrage IP (compatible avec les formats eMule et PeerGuardian)
    - Conforme à IPv6
    - Prise en charge du transfert de ports UPnP / NAT-PMP
    - Disponible sur toutes les plateformes : Windows, Linux, macOS, FreeBSD, OS/2
    - Disponible en ~70 langues
  upgradeDescription: |
    v1.0.31 : Mettre qBittorrent à niveau de 5.2.2 vers 5.2.3.

    Corrige les migrations, blocages de base, encodages tracker et Web Seed,
    intervalles RSS, comptage des plugins, chemins de thèmes et CSS WebUI.

    Notes : https://github.com/qbittorrent/qBittorrent/releases/tag/release-5.2.3

    Mise à niveau de qBittorrent vers la version 5.2.2 (2026-06-25)
    Changements de configuration : ajouter le répertoire External au chemin de téléchargement.
    - Changer le chemin de montage par défaut du Olares Home Directory vers /olares/userdata/home
    - Changer le chemin de montage par défaut du Olares External Directory vers /olares/userdata/external

    Points forts de la mise à niveau :
    - [Sécurité] Plusieurs correctifs de sécurité : accès aux fichiers locaux empêché dans les modules WebAPI/RSS/Search (v5.1.2) ; SSRF via redirection HTTP corrigée (v5.2.1) ; en-tête X-Forwarded-Host restreint au mode reverse proxy uniquement pour empêcher le spoofing d'hôte (v5.2.2)
    - [Nouvelles fonctionnalités] La barre d'état affiche désormais l'espace disque libre et l'adresse IP externe ; la liste des trackers peut être récupérée depuis une URL ; limites de partage par catégorie ; redémarrage système optionnel à la fin du téléchargement ; filtre avancé « Tracker status » ajouté
    - [Refonte WebUI] Réécriture majeure de la WebUI : rendu de liste virtuelle pour des performances nettement meilleures avec de grandes files de torrents ; nouvelle UI de création de torrents ; formulaire de connexion redessiné ; authentification Basic Auth et clé API ; densité d'affichage configurable
    - [WebAPI et recherche] Nouveaux endpoints : app/processInfo, setComment ; prise en charge de l'auth par clé API ; proxy SOCKS4/SOCKS4a pour le moteur de recherche ; recherches multiples simultanées avec historique persistant et sessions d'onglets
    - [Correctifs de stabilité] Correction des dossiers vides laissés après suppression/déplacement de torrents ; lockfile obsolète provoquant des échecs de démarrage ; plantages getrandom() sur certains setups Linux ; reannounce prématuré avant l'application des changements d'interface
    - [Prise en charge des plateformes] L'installeur NSIS Windows ajoute une build ARM64 native ; Linux gagne l'intégration du gestionnaire de fichiers via D-Bus ; les AppImages prennent désormais Wayland en charge de façon native

    Changelog complet : https://www.qbittorrent.org/news#mon-jun-15th-2026---qbittorrent-v5.2.2-release

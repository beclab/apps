metadata:
  title: qBittorrent
  description: Descargador BitTorrent gratuito
spec:
  fullDescription: |
    qBittorrent es un cliente BitTorrent de código abierto consolidado. qBittorrent tiene una huella ligera y, a la vez, ofrece todas las funciones que puedas necesitar. Usa la avanzada biblioteca libtorrent-rasterbar, lo que se traduce en mayor velocidad de descarga y subida, así como un excelente soporte de las últimas funciones del protocolo BitTorrent.

    **FUNCIONES**
    - Interfaz de usuario pulida similar a µTorrent
    - Sin anuncios
    - Motor de búsqueda bien integrado y extensible
      - Búsqueda simultánea en muchos sitios de búsqueda de torrents
      - Solicitudes de búsqueda específicas por categoría (p. ej. Libros, Música, Software)
    - Soporte de feeds RSS con filtros de descarga avanzados (incl. regex)
    - Muchas extensiones BitTorrent admitidas:
      - Enlaces magnet
      - Distributed hash table (DHT), peer exchange protocol (PEX), local peer discovery (LSD)
      - Torrents privados
      - Conexiones cifradas
      - y muchas más...
    - Control remoto mediante interfaz web escrita con AJAX
      - Casi idéntica a la GUI habitual
    - Descarga secuencial (descargar en orden)
    - Control avanzado sobre torrents, trackers y peers
      - Cola y priorización de torrents
      - Selección y priorización del contenido del torrent
    - Programador de ancho de banda
    - Herramienta de creación de torrents
    - Filtrado IP (compatible con formatos eMule y PeerGuardian)
    - Compatible con IPv6
    - Soporte de reenvío de puertos UPnP / NAT-PMP
    - Disponible en todas las plataformas: Windows, Linux, macOS, FreeBSD, OS/2
    - Disponible en ~70 idiomas
  upgradeDescription: |
    v1.0.31: Actualizar qBittorrent de 5.2.2 a 5.2.3.

    Corrige migraciones, bloqueos de base de datos, codificación de trackers y
    Web Seeds, intervalos RSS, recuento de plugins, rutas de temas y CSS WebUI.

    Notas: https://github.com/qbittorrent/qBittorrent/releases/tag/release-5.2.3

    Actualizar qBittorrent a la versión 5.2.2 (2026-06-25)
    Cambios de configuración: añadir el directorio External a la ruta de descarga.
    - Cambiar la ruta de montaje por defecto del Olares Home Directory a /olares/userdata/home
    - Cambiar la ruta de montaje por defecto del Olares External Directory a /olares/userdata/external

    Destacados de la actualización:
    - [Seguridad] Varias correcciones de seguridad: se impidió el acceso a archivos locales en los módulos WebAPI/RSS/Search (v5.1.2); se parcheó SSRF vía redirección HTTP (v5.2.1); se restringió el encabezado X-Forwarded-Host al modo reverse proxy para evitar spoofing de host (v5.2.2)
    - [Nuevas funciones] La barra de estado ahora muestra el espacio libre en disco y la IP externa; la lista de trackers se puede obtener desde una URL; límites de share por categoría; reinicio opcional del sistema al completar la descarga; añadido filtro avanzado "Tracker status"
    - [Renovación de WebUI] Reescritura mayor de la WebUI: renderizado de lista virtual para un rendimiento mucho mejor con colas grandes de torrents; nueva UI de creación de torrents; formulario de login rediseñado; autenticación Basic Auth y API Key; densidad de visualización configurable
    - [WebAPI y búsqueda] Nuevos endpoints: app/processInfo, setComment; soporte de autenticación por API Key; proxy SOCKS4/SOCKS4a para el motor de búsqueda; múltiples búsquedas simultáneas con historial persistente y sesiones de pestañas
    - [Correcciones de estabilidad] Corregidas carpetas vacías tras eliminar/mover torrents; lockfile obsoleto que provocaba fallos de arranque; crashes de getrandom() en ciertos setups Linux; reannounce prematuro antes de aplicar cambios de interfaz
    - [Soporte de plataforma] El instalador NSIS de Windows añade build nativo ARM64; Linux gana integración del administrador de archivos por D-Bus; las AppImages ahora soportan Wayland de forma nativa

    Changelog completo: https://www.qbittorrent.org/news#mon-jun-15th-2026---qbittorrent-v5.2.2-release

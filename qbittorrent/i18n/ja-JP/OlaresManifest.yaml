metadata:
  title: qBittorrent
  description: 無料の BitTorrent ダウンローダー
spec:
  fullDescription: |
    qBittorrent は定評のあるオープンソース BitTorrent クライアントです。フットプリントは軽く、必要な機能はすべて備えます。高度な libtorrent-rasterbar ライブラリを使用し、高いダウンロード／アップロード速度と BitTorrent プロトコル最新機能への優れた対応を実現します。

    **機能**
    - 洗練された µTorrent 風ユーザーインタフェース
    - 広告なし
    - よく統合され拡張可能な検索エンジン
      - 多数の Torrent 検索サイトでの同時検索
      - カテゴリ別検索リクエスト（例：Books、Music、Software）
    - 高度なダウンロードフィルタ（正規表現含む）付き RSS フィード対応
    - 多数の BitTorrent 拡張に対応：
      - Magnet リンク
      - Distributed hash table（DHT）、peer exchange protocol（PEX）、local peer discovery（LSD）
      - プライベート torrent
      - 暗号化接続
      - その他多数…
    - AJAX 製 Web ユーザーインタフェースによるリモート制御
      - 通常の GUI とほぼ同一
    - シーケンシャルダウンロード（順番どおりにダウンロード）
    - torrent・トラッカー・ピアの高度な制御
      - torrent のキューイングと優先度付け
      - torrent コンテンツの選択と優先度付け
    - 帯域スケジューラ
    - torrent 作成ツール
    - IP フィルタリング（eMule & PeerGuardian 形式互換）
    - IPv6 準拠
    - UPnP / NAT-PMP ポート転送対応
    - 全プラットフォームで利用可能：Windows、Linux、macOS、FreeBSD、OS/2
    - 約 70 言語に対応
  upgradeDescription: |
    v1.0.31: qBittorrent を 5.2.2 から 5.2.3 へ更新。

    移行処理、データベースのデッドロック、Tracker と Web Seed の文字コード、
    RSS 間隔、検索プラグイン数、テーマパス、WebUI CSS を修正します。

    リリースノート: https://github.com/qbittorrent/qBittorrent/releases/tag/release-5.2.3

    qBittorrent をバージョン 5.2.2（2026-06-25）へアップグレード
    設定変更：ダウンロードパスに External ディレクトリを追加。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - Olares External Directory のデフォルトマウントパスを /olares/userdata/external に変更

    アップグレードのハイライト：
    - [セキュリティ] 複数のセキュリティ修正：WebAPI/RSS/Search モジュールでのローカルファイルアクセスを防止（v5.1.2）；HTTP リダイレクト経由の SSRF を修正（v5.2.1）；ホストスプーフィング防止のため X-Forwarded-Host ヘッダーをリバースプロキシモードのみに制限（v5.2.2）
    - [新機能] ステータスバーに空きディスク容量と外部 IP アドレスを表示；トラッカー一覧を URL から取得可能；カテゴリごとの共有制限；ダウンロード完了時の任意のシステム再起動；高度な「Tracker status」フィルタを追加
    - [WebUI 刷新] WebUI の大規模書き換え：大きな torrent キューで大幅に性能向上する仮想リスト描画；新しい torrent 作成 UI；ログインフォーム再設計；Basic Auth と API Key 認証；表示密度の設定
    - [WebAPI & 検索] 新エンドポイント：app/processInfo、setComment；API Key 認証対応；検索エンジン向け SOCKS4/SOCKS4a プロキシ；永続履歴とタブセッション付きの複数同時検索
    - [安定性修正] torrent 削除／移動後に空フォルダが残る問題；起動失敗の原因となる古い lockfile；特定 Linux 環境での getrandom() クラッシュ；インタフェース変更適用前の早期 reannounce
    - [プラットフォーム対応] Windows NSIS インストーラにネイティブ ARM64 ビルドを追加；Linux で D-Bus ファイルマネージャ統合；AppImage が Wayland をネイティブサポート

    完全な変更履歴：https://www.qbittorrent.org/news#mon-jun-15th-2026---qbittorrent-v5.2.2-release

metadata:
  title: qBittorrent
  description: Downloader BitTorrent gratuito
spec:
  fullDescription: |
    qBittorrent è un client BitTorrent open-source consolidato. qBittorrent ha un footprint leggero e al contempo offre tutte le funzionalità di cui potresti aver bisogno. Usa l'avanzata libreria libtorrent-rasterbar, il che significa maggiore velocità di download e upload, nonché un eccellente supporto delle ultime funzionalità del protocollo BitTorrent.

    **FUNZIONALITÀ**
    - Interfaccia utente rifinita simile a µTorrent
    - Nessuna pubblicità
    - Motore di ricerca ben integrato ed estensibile
      - Ricerca simultanea in molti siti di ricerca torrent
      - Richieste di ricerca specifiche per categoria (ad es. Libri, Musica, Software)
    - Supporto feed RSS con filtri di download avanzati (incl. regex)
    - Molte estensioni BitTorrent supportate:
      - Link magnet
      - Distributed hash table (DHT), peer exchange protocol (PEX), local peer discovery (LSD)
      - Torrent privati
      - Connessioni crittografate
      - e molto altro...
    - Controllo remoto tramite interfaccia web scritta con AJAX
      - Quasi identica alla GUI regolare
    - Download sequenziale (scarica in ordine)
    - Controllo avanzato su torrent, tracker e peer
      - Accodamento e prioritizzazione dei torrent
      - Selezione e prioritizzazione del contenuto del torrent
    - Pianificatore della banda
    - Strumento di creazione torrent
    - Filtraggio IP (compatibile con i formati eMule e PeerGuardian)
    - Conforme a IPv6
    - Supporto al port forwarding UPnP / NAT-PMP
    - Disponibile su tutte le piattaforme: Windows, Linux, macOS, FreeBSD, OS/2
    - Disponibile in ~70 lingue
  upgradeDescription: |
    v1.0.31: Aggiorna qBittorrent da 5.2.2 a 5.2.3.

    Corregge migrazioni, deadlock del database, codifica di tracker e Web Seed,
    intervalli RSS, conteggio plugin, percorsi dei temi e CSS della WebUI.

    Note: https://github.com/qbittorrent/qBittorrent/releases/tag/release-5.2.3

    Aggiornare qBittorrent alla versione 5.2.2 (2026-06-25)
    Modifiche di configurazione: aggiungere la directory External al percorso di download.
    - Cambiare il percorso di mount predefinito di Olares Home Directory in /olares/userdata/home
    - Cambiare il percorso di mount predefinito di Olares External Directory in /olares/userdata/external

    Highlight dell'upgrade:
    - [Sicurezza] Multiple correzioni di sicurezza: impedito l'accesso a file locali nei moduli WebAPI/RSS/Search (v5.1.2); patchata SSRF tramite redirect HTTP (v5.2.1); ristretto l'header X-Forwarded-Host alla sola modalità reverse proxy per prevenire lo spoofing dell'host (v5.2.2)
    - [Nuove funzionalità] La barra di stato ora mostra lo spazio disco libero e l'indirizzo IP esterno; l'elenco dei tracker può essere recuperato da un URL; limiti di share per categoria; riavvio opzionale del sistema al completamento del download; aggiunto filtro avanzato "Tracker status"
    - [Rifacimento WebUI] Maggiore riscrittura della WebUI: rendering a lista virtuale per prestazioni significativamente migliori con code torrent grandi; nuova UI di creazione torrent; form di login ridisegnato; autenticazione Basic Auth e API Key; densità di visualizzazione configurabile
    - [WebAPI e ricerca] Nuovi endpoint: app/processInfo, setComment; supporto auth API Key; proxy SOCKS4/SOCKS4a per il motore di ricerca; ricerche multiple simultanee con cronologia persistente e sessioni a schede
    - [Correzioni di stabilità] Corrette cartelle vuote lasciate dopo eliminazione/spostamento torrent; lockfile obsoleto che causava fallimenti all'avvio; crash di getrandom() su specifici setup Linux; reannounce prematuro prima dell'applicazione delle modifiche all'interfaccia
    - [Supporto piattaforme] L'installer NSIS Windows aggiunge build nativa ARM64; Linux ottiene integrazione del file manager via D-Bus; le AppImages ora supportano Wayland in modo nativo

    Changelog completo: https://www.qbittorrent.org/news#mon-jun-15th-2026---qbittorrent-v5.2.2-release

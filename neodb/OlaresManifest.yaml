olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  neodb: 1
metadata:
  name: neodb
  description: Open source Fediverse cultural tracking service to mark, review, and discover books, movies, music, and games.
  icon: https://raw.githubusercontent.com/Inverstar/neodb/main/icon-256.png
  appid: neodb
  version: '1.0.8'
  title: NeoDB
  categories:
  - homelab
  - workspace
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.20.0'
  upgradeDescription: |
    - Add AIDockerCloud to maintainers list.
    - Upgrade NeoDB from 0.19.6.3 to 0.20.0.
    - 0.20.0 lets incoming federated catalog search be turned off in config and advertises federated catalog search in nodeinfo. 0.19.13 stops the login page from creating a session for bots. 0.19.12 improves catalog import and deduplication.
    - 0.19.11 adds multi-line replies and quotes, Mastodon cross-posting for non-public pieces, and season episode sorting. 0.19.10 redesigns the articles and reviews experience and adds scheduled statuses with optional backdating in the Mastodon API.
    - 0.19.9.1 adds a recommendation API for dismissed items with a source filter and refreshes translations, dependencies and certificates. 0.19.8 adds a direct messages UI and an opt-in Mastodon streaming API, plus security hardening. 0.19.7 is a performance release.
    - Database migrations ship with the image and run through the migration init-container on startup; if a migration fails the container will not start. Back up the database before upgrading.
    - NEODB_ADMIN_HANDLES, the administrator init script and the Django ModelBackend login path are unchanged.
    - The typesense and busybox sidecar images are untouched.
  fullDescription: |
    NeoDB is an open-source, decentralized cultural tracking service for the Fediverse and Atmosphere.

    **Key Features:**
    - **Cultural Product Catalog**: Manage and discover books, movies, TV shows, music albums, games, podcasts, and performances.
    - **Personal Collections**: Mark items as wishlist, in progress, complete, or dropped; rate, write notes, and review.
    - **Fediverse & ActivityPub**: Follow and interact with users across Mastodon, Takahē, and other ActivityPub platforms.
    - **Import & Export**: Seamlessly import your reading and watch lists from Douban, Goodreads, Letterboxd, Steam, and StoryGraph.
    - **Open & Extensible**: Built-in full-text search with Typesense, OpenAPI developer console, and Mastodon-compatible APIs.
  developer: NeoDB
  website: https://neodb.net
  sourceCode: https://github.com/neodb-social/neodb
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 512Mi
  limitedMemory: 2048Mi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  requiredCpu: 0.2
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  allowedOutboundPorts:
  - 80
  - 443
entrances:
- name: neodb
  port: 8000
  host: neodb-service
  title: NeoDB
  icon: https://raw.githubusercontent.com/Inverstar/neodb/main/icon-256.png
  authLevel: public
  openMethod: window
middleware:
  postgres:
    username: neodb
    password: neodb
    databases:
    - name: neodb
      distributed: true
    - name: takahe
      distributed: true
  redis:
    namespace: neodb
envs:
  - envName: ADMIN_USERNAME
    type: string
    required: false
    default: "admin"
    editable: true
    applyOnChange: true
    description: "Initial administrator username (default: admin)"
  - envName: ADMIN_PASSWORD
    type: password
    required: false
    editable: true
    applyOnChange: true
    description: "Administrator password. If left empty, a 16-character random password is generated and printed in migration logs. You can change this password here anytime."
  - envName: NEODB_EMAIL_URL
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: "SMTP URL for email login (e.g. smtp://user:password@smtp.example.com:465). If empty, Olares system SMTP will be used automatically if configured."
  - envName: NEODB_EMAIL_FROM
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: "Sender email address (e.g. no-reply@example.com)."
  - envName: NEODB_ADMIN_HANDLES
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: "Accounts to auto-promote to superuser on registration/login (format: type:handle, e.g. email:admin@example.com or mastodon:user@mastodon.social). Separate multiple entries with commas."
  - envName: SMTP_SERVER
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_SERVER
  - envName: SMTP_PORT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PORT
  - envName: SMTP_LOGIN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_USERNAME
  - envName: SMTP_PASSWORD
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PASSWORD
  - envName: SMTP_FROM_ADDRESS
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_FROM_ADDRESS

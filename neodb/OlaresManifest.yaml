olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  neodb: 1
metadata:
  name: neodb
  description: Open source Fediverse cultural tracking service to mark, review, and discover books, movies, music, and games.
  icon: https://raw.githubusercontent.com/Inverstar/neodb/main/icon-256.png
  appid: neodb
  version: '1.0.9'
  title: NeoDB
  categories:
  - homelab
  - workspace
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.20.2'
  upgradeDescription: |
    - Upgrade NeoDB from 0.20.0 to 0.20.2. 0.20.2 is a security release and should be applied to any instance reachable from the network.
    - 0.20.1 shows event time and place, video duration and link post target in Fedi posts, accepts HEIC profile images on upload, and links BookWyrm reviews to catalog items.
    - Two new Django migrations ship with the image: catalog 0027 backfills credits from relations, and journal 0021 registers BookWyrm peers.
    - Migrations run through the migration init-container on startup; if a migration fails the container will not start. Back up the database before upgrading.
    - The init-container also refreshes the administrator account, so ADMIN_USERNAME, ADMIN_PASSWORD and NEODB_ADMIN_HANDLES keep working as before.
    - The chart's configuration and environment variables are unchanged, and the typesense and busybox sidecar images are untouched.
  fullDescription: |
    NeoDB is an open-source, decentralized cultural tracking service for the Fediverse and Atmosphere.

    **Key Features:**
    - **Cultural Product Catalog**: Manage and discover books, movies, TV shows, music albums, games, podcasts, and performances.
    - **Personal Collections**: Mark items as wishlist, in progress, complete, or dropped; rate, write notes, and review.
    - **Fediverse & ActivityPub**: Follow and interact with users across Mastodon, Takahē, and other ActivityPub platforms.
    - **Import & Export**: Seamlessly import your reading and watch lists from Douban, Goodreads, Letterboxd, Steam, and StoryGraph.
    - **Open & Extensible**: Built-in full-text search with Typesense, OpenAPI developer console, and Mastodon-compatible APIs.
  developer: NeoDB
  website: https://neodb.net
  sourceCode: https://github.com/neodb-social/neodb
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  requiredMemory: 512Mi
  limitedMemory: 2048Mi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  requiredCpu: 0.2
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  allowedOutboundPorts:
  - 80
  - 443
entrances:
- name: neodb
  port: 8000
  host: neodb-service
  title: NeoDB
  icon: https://raw.githubusercontent.com/Inverstar/neodb/main/icon-256.png
  authLevel: public
  openMethod: window
middleware:
  postgres:
    username: neodb
    password: neodb
    databases:
    - name: neodb
      distributed: true
    - name: takahe
      distributed: true
  redis:
    namespace: neodb
envs:
  - envName: ADMIN_USERNAME
    type: string
    required: false
    default: "admin"
    editable: true
    applyOnChange: true
    description: "Initial administrator username (default: admin)"
  - envName: ADMIN_PASSWORD
    type: password
    required: false
    editable: true
    applyOnChange: true
    description: "Administrator password. If left empty, a 16-character random password is generated and printed in migration logs. You can change this password here anytime."
  - envName: NEODB_EMAIL_URL
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: "SMTP URL for email login (e.g. smtp://user:password@smtp.example.com:465). If empty, Olares system SMTP will be used automatically if configured."
  - envName: NEODB_EMAIL_FROM
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: "Sender email address (e.g. no-reply@example.com)."
  - envName: NEODB_ADMIN_HANDLES
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: "Accounts to auto-promote to superuser on registration/login (format: type:handle, e.g. email:admin@example.com or mastodon:user@mastodon.social). Separate multiple entries with commas."
  - envName: SMTP_SERVER
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_SERVER
  - envName: SMTP_PORT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PORT
  - envName: SMTP_LOGIN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_USERNAME
  - envName: SMTP_PASSWORD
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PASSWORD
  - envName: SMTP_FROM_ADDRESS
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_FROM_ADDRESS

metadata:
  title: NeoDB
  description: 面向联邦宇宙（Fediverse）的开源书影音记录与文化发现平台。
spec:
  upgradeDescription: |
    - NeoDB 从 0.20.0 升级到 0.20.2。0.20.2 是安全修复版本，任何可从网络访问的实例都应及时更新。
    - 0.20.1 在 Fedi 帖子中显示活动时间与地点、视频时长和链接帖目标，上传头像支持 HEIC 格式，并将 BookWyrm 评论关联到目录条目。
    - 镜像中包含两个新的 Django 迁移：catalog 0027 从关系记录回填 credits，journal 0021 注册 BookWyrm 节点。
    - 迁移在启动时由 migration init-container 执行；迁移失败则容器不会启动。升级前请先备份数据库。
    - init-container 同时会刷新管理员账号，ADMIN_USERNAME、ADMIN_PASSWORD 与 NEODB_ADMIN_HANDLES 的用法保持不变。
    - 本 chart 的配置与环境变量未改动，typesense 与 busybox 边车镜像也未改动。
  fullDescription: |
    **记录你所爱的一切。**

    NeoDB 是一个去中心化、面向联邦宇宙（Fediverse）与 Atmosphere 的开源书影音文化产品标记与交流平台。

    **主要功能：**
    - **文化条目库**：浏览和发现图书、电影、剧集、音乐专辑、游戏、播客与舞台演出。
    - **个人收藏与标记**：标记想读/在读/读过/搁置，支持打分、撰写笔记、短评与自定义豆列/书单。
    - **联邦宇宙互联**：基于 ActivityPub 协议，可与 Mastodon、Takahē 等去中心化社交网络用户互相关注与广播动态。
    - **数据导入与导出**：一键从豆瓣、Goodreads、Letterboxd、Steam 和 StoryGraph 导入你的观影/阅读档案。
    - **开放生态**：内置 Typesense 全文搜索引擎、OpenAPI 开发者接口，并兼容 Mastodon 客户端生态。

metadata:
  title: NeoDB
  description: 面向联邦宇宙（Fediverse）的开源书影音记录与文化发现平台。
spec:
  upgradeDescription: |
    - 添加 AIDockerCloud 到应用维护者列表。
    - NeoDB 从 0.19.6.3 升级到 0.20.0。
    - 0.20.0 支持在配置中关闭入站的联邦目录搜索，并在 nodeinfo 中公布联邦目录搜索能力。0.19.13 阻止登录页被机器人创建会话。0.19.12 改进目录导入与去重。
    - 0.19.11 支持多行回复与引用，非公开条目无法转发时向 Mastodon 投递副本，并支持剧集排序。0.19.10 重新设计文章与评论体验，Mastodon API 支持定时发布状态与可选回溯发布时间。
    - 0.19.9.1 新增针对已忽略条目的推荐 API 与来源筛选，并更新翻译、依赖与证书。0.19.8 新增私信界面与默认关闭的 Mastodon streaming API，并做安全加固。0.19.7 为性能优化版本。
    - 数据库迁移随镜像提供，启动时由 migration init-container 执行；迁移失败则容器不会启动。升级前请先备份数据库。
    - NEODB_ADMIN_HANDLES、管理员初始化脚本与 Django ModelBackend 登录路径均未变更。
    - typesense 与 busybox 边车镜像未改动。
  fullDescription: |
    **记录你所爱的一切。**

    NeoDB 是一个去中心化、面向联邦宇宙（Fediverse）与 Atmosphere 的开源书影音文化产品标记与交流平台。

    **主要功能：**
    - **文化条目库**：浏览和发现图书、电影、剧集、音乐专辑、游戏、播客与舞台演出。
    - **个人收藏与标记**：标记想读/在读/读过/搁置，支持打分、撰写笔记、短评与自定义豆列/书单。
    - **联邦宇宙互联**：基于 ActivityPub 协议，可与 Mastodon、Takahē 等去中心化社交网络用户互相关注与广播动态。
    - **数据导入与导出**：一键从豆瓣、Goodreads、Letterboxd、Steam 和 StoryGraph 导入你的观影/阅读档案。
    - **开放生态**：内置 Typesense 全文搜索引擎、OpenAPI 开发者接口，并兼容 Mastodon 客户端生态。

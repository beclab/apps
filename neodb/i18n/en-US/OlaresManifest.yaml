metadata:
  title: NeoDB
  description: Open source Fediverse cultural tracking service to mark, review, and discover books, movies, music, and games.
spec:
  upgradeDescription: |
    - Add AIDockerCloud to maintainers list.
    - Upgrade NeoDB from 0.19.6.3 to 0.20.0.
    - 0.20.0 lets incoming federated catalog search be turned off in config and advertises federated catalog search in nodeinfo. 0.19.13 stops the login page from creating a session for bots. 0.19.12 improves catalog import and deduplication.
    - 0.19.11 adds multi-line replies and quotes, Mastodon cross-posting for non-public pieces, and season episode sorting. 0.19.10 redesigns the articles and reviews experience and adds scheduled statuses with optional backdating in the Mastodon API.
    - 0.19.9.1 adds a recommendation API for dismissed items with a source filter and refreshes translations, dependencies and certificates. 0.19.8 adds a direct messages UI and an opt-in Mastodon streaming API, plus security hardening. 0.19.7 is a performance release.
    - Database migrations ship with the image and run through the migration init-container on startup; if a migration fails the container will not start. Back up the database before upgrading.
    - NEODB_ADMIN_HANDLES, the administrator init script and the Django ModelBackend login path are unchanged.
    - The typesense and busybox sidecar images are untouched.
  fullDescription: |
    **Mark the things you love.**

    NeoDB is an open-source, decentralized cultural tracking service for the Fediverse and Atmosphere.

    **Key Features:**
    - **Cultural Product Catalog**: Manage and discover books, movies, TV shows, music albums, games, podcasts, and performances.
    - **Personal Collections**: Mark items as wishlist, in progress, complete, or dropped; rate, write notes, and review.
    - **Fediverse & ActivityPub**: Follow and interact with users across Mastodon, Takahē, and other ActivityPub platforms.
    - **Import & Export**: Seamlessly import your reading and watch lists from Douban, Goodreads, Letterboxd, Steam, and StoryGraph.
    - **Open & Extensible**: Built-in full-text search with Typesense, OpenAPI developer console, and Mastodon-compatible APIs.

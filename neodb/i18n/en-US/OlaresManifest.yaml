metadata:
  title: NeoDB
  description: Open source Fediverse cultural tracking service to mark, review, and discover books, movies, music, and games.
spec:
  upgradeDescription: |
    - Add NEODB_ADMIN_HANDLES to Manage Environment Variables for auto-promoting accounts (email or Fediverse handles) to superuser.
    - Fix administrator initialization script execution in migration init-container by replacing shell inline commands with a dedicated Python initialization script.
    - Restore Django ModelBackend to authentication backends, enabling direct username and password login for the administrator at /neodb-admin/.
  fullDescription: |
    **Mark the things you love.**

    NeoDB is an open-source, decentralized cultural tracking service for the Fediverse and Atmosphere.

    **Key Features:**
    - **Cultural Product Catalog**: Manage and discover books, movies, TV shows, music albums, games, podcasts, and performances.
    - **Personal Collections**: Mark items as wishlist, in progress, complete, or dropped; rate, write notes, and review.
    - **Fediverse & ActivityPub**: Follow and interact with users across Mastodon, Takahē, and other ActivityPub platforms.
    - **Import & Export**: Seamlessly import your reading and watch lists from Douban, Goodreads, Letterboxd, Steam, and StoryGraph.
    - **Open & Extensible**: Built-in full-text search with Typesense, OpenAPI developer console, and Mastodon-compatible APIs.

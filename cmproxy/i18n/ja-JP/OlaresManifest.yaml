metadata:
  title: ChatGPT Web Midjourney Proxy
  description: ChatGPT などすべてをひとつの UI で
spec:
  fullDescription: |
    ChatGPT web、Midjourney、GPTs、Suno、Luma、Runway、Viggle、Flux、Ideogram、Realtime、Pika、Udio をひとつの UI で完結
    Web / PWA / Linux / Win / MacOS プラットフォームを同時サポート

    **対応機能**
    Kling のテキストから動画、画像から動画、描画をサポート。
    Ideogram の描画をサポート。
    Runway のテキストから動画、画像から動画をサポート。
    Luma のテキストから動画、画像から動画をサポート。
    Viggle のダンスをサポート。
    Suno のオーディオからオーディオ生成をサポート。
    独立した Suno モジュールをサポート（歌詞と音楽スタイルを調整可能）
    元の ChatGPT web の全機能
    ChatGPT web はカスタム API キーと base_url をサポート
    Midjourney テキストから画像
    Midjourney blend 画像 + テキストから画像
    Midjourney 画像バリエーション U1〜U4、V1〜V4、および再描画
    Midjourney 部分再描画
    Midjourney 1.5x および 2x ズーム
    Midjourney 2x および 4x HD
    Midjourney の左右上下への拡張
    Midjourney は midjourney-proxy と midjourney-proxy-plus の両方をサポート
    画像からの Midjourney テキスト
    localforage によるローカル画像保存
    midjourney や niji など異なるボットをサポート
    InsightFace 顔置換をサポート
    Midjourney 画像ブレンド
    Midjourney シード取得
    DALL-E-3 画像生成
    ChatGPT フロントエンドのモデル選択
    ChatGPT フロントエンドはカスタムモデル、コンテキスト数、返信数をサポート
    ChatGPT は GPT-4-Vision-Preview 向けの画像アップロードをサポート
    ChatGPT はバックエンドのファイルアップロードをサポート（GPT-4-All、GPT-4-Gizmo-xxx などのモデル向け）。デフォルトはオフ、環境変数 API_UPLOADER=1 で有効化可能
    ChatGPT は GPT-4-All、GPT-4-V、GPT-4-Gizmo-(gizmo_id) などのリバースモデルをサポート
    ChatGPT はハイパーリンクによるモデル切り替えをサポート
    ChatGPT は ChatGPT スタイルのハイパーリンクによるモデル切り替えをサポート
    ChatGPT は GPTs マルチモーダルをサポート
    ChatGPT は TTS whisper をサポート
    即時音声認識（ブラウザ内蔵 ASR）v2.15.7 以降
    その他多数
  upgradeDescription: |
    上流リリース：[v2.26.4](https://github.com/Dooy/chatgpt-web-midjourney-proxy/releases/tag/v2.26.4)

    **変更点**

    - DALL·E の画像サイズを手動入力できます。
    - `gpt-image` リクエストの先頭で画像アップロードが許可されます。

    **修正**

    - 空のエラーメッセージが使える内容に戻ります。


metadata:
  title: ChatGPT Web Midjourney Proxy
  description: Une UI pour tout faire avec ChatGPT et plus
spec:
  fullDescription: |
    Une UI pour tout faire avec ChatGPT web, Midjourney, GPTs, Suno, Luma, Runway, Viggle, Flux, Ideogram, Realtime, Pika, Udio
    Prise en charge simultanée des plateformes Web / PWA / Linux / Win / MacOS

    **Fonctionnalités prises en charge**
    Prise en charge de Kling pour le texte-vers-vidéo, l'image-vers-vidéo et le dessin.
    Prise en charge d'Ideogram pour le dessin.
    Prise en charge de Runway pour le texte-vers-vidéo et l'image-vers-vidéo.
    Prise en charge de Luma pour le texte-vers-vidéo et l'image-vers-vidéo.
    Prise en charge de Viggle pour la danse.
    Prise en charge de Suno pour la génération audio-vers-audio.
    Prise en charge du module Suno autonome, avec paroles et style musical réglables
    Toutes les fonctionnalités d'origine de ChatGPT web
    ChatGPT web prend en charge les clés API personnalisées et base_url
    Midjourney texte-vers-image
    Midjourney blend image + texte-vers-image
    Variations d'image Midjourney U1 à U4, V1 à V4 et redessin
    Redessin partiel Midjourney
    Zoom Midjourney 1.5x et 2x
    Midjourney HD 2x et 4x
    Extensions Midjourney à gauche, droite, haut et bas
    Midjourney prend en charge midjourney-proxy et midjourney-proxy-plus
    Texte Midjourney à partir d'images
    Stockage d'images local avec localforage
    Prise en charge de différents bots comme midjourney et niji
    Prise en charge du remplacement de visage InsightFace
    Mélange d'images Midjourney
    Obtenir le seed Midjourney
    Génération d'images DALL-E-3
    Sélection de modèle côté frontend ChatGPT
    Le frontend ChatGPT prend en charge les modèles personnalisés, le nombre de contextes et le nombre de réponses
    ChatGPT prend en charge les téléversements d'images pour GPT-4-Vision-Preview
    ChatGPT prend en charge les téléversements de fichiers backend (pour des modèles comme GPT-4-All, GPT-4-Gizmo-xxx) désactivés par défaut ; activables avec la variable d'environnement API_UPLOADER=1
    ChatGPT prend en charge les modèles reverse comme GPT-4-All, GPT-4-V, GPT-4-Gizmo-(gizmo_id)
    ChatGPT prend en charge le changement de modèle par hyperlien
    ChatGPT prend en charge le changement de modèle par hyperlien style ChatGPT
    ChatGPT prend en charge GPTs multimodal
    ChatGPT prend en charge TTS whisper
    Reconnaissance vocale instantanée (ASR intégrée du navigateur) v2.15.7 et versions ultérieures
    Et plus encore
  upgradeDescription: |
    Version en amont : [v2.26.4](https://github.com/Dooy/chatgpt-web-midjourney-proxy/releases/tag/v2.26.4)

    **Nouveautés**

    - La taille d’image DALL·E peut être saisie manuellement.
    - Le téléversement d’image est autorisé au début d’une requête `gpt-image`.

    **Corrections**

    - Les messages d’erreur vides redeviennent un message utilisable.


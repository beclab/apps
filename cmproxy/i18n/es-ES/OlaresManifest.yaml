metadata:
  title: ChatGPT Web Midjourney Proxy
  description: Una UI lo hace todo con ChatGPT y más
spec:
  fullDescription: |
    Una UI lo hace todo con ChatGPT web, Midjourney, GPTs, Suno, Luma, Runway, Viggle, Flux, Ideogram, Realtime, Pika, Udio
    Soporte simultáneo de las plataformas Web / PWA / Linux / Win / MacOS

    **Funciones compatibles**
    Compatibilidad con Kling para texto a vídeo, imagen a vídeo y dibujo.
    Compatibilidad con Ideogram para dibujo.
    Compatibilidad con Runway para texto a vídeo e imagen a vídeo.
    Compatibilidad con Luma para texto a vídeo e imagen a vídeo.
    Compatibilidad con Viggle para baile.
    Compatibilidad con Suno para generación de audio a audio.
    Compatibilidad con el módulo independiente de Suno, con letras y estilo musical ajustables
    Todas las funciones originales de ChatGPT web
    ChatGPT web admite claves API personalizadas y base_url
    Midjourney texto a imagen
    Midjourney blend imagen + texto a imagen
    Variaciones de imagen Midjourney U1 a U4, V1 a V4 y redibujado
    Redibujado parcial de Midjourney
    Zoom Midjourney 1.5x y 2x
    Midjourney HD 2x y 4x
    Extensiones Midjourney a la izquierda, derecha, arriba y abajo
    Midjourney admite tanto midjourney-proxy como midjourney-proxy-plus
    Texto Midjourney a partir de imágenes
    Almacenamiento local de imágenes con localforage
    Compatibilidad con diferentes bots como midjourney y niji
    Compatibilidad con reemplazo facial InsightFace
    Mezcla de imágenes Midjourney
    Obtener seed de Midjourney
    Generación de imágenes DALL-E-3
    Selección de modelo en el frontend de ChatGPT
    El frontend de ChatGPT admite modelos personalizados, número de contexto y recuento de respuestas
    ChatGPT admite cargas de imágenes para GPT-4-Vision-Preview
    ChatGPT admite cargas de archivos en el backend (para modelos como GPT-4-All, GPT-4-Gizmo-xxx) desactivado por defecto; se puede activar con la variable de entorno API_UPLOADER=1
    ChatGPT admite modelos reverse como GPT-4-All, GPT-4-V, GPT-4-Gizmo-(gizmo_id)
    ChatGPT admite cambio de modelo por hipervínculo
    ChatGPT admite cambio de modelo por hipervínculo al estilo ChatGPT
    ChatGPT admite GPTs multimodal
    ChatGPT admite TTS whisper
    Reconocimiento de voz instantáneo (ASR integrado del navegador) v2.15.7 y superior
    Y más
  upgradeDescription: |
    Versión upstream: [v2.26.4](https://github.com/Dooy/chatgpt-web-midjourney-proxy/releases/tag/v2.26.4)

    **Novedades**

    - El tamaño de imagen de DALL·E se puede introducir manualmente.
    - Se permite subir una imagen al inicio de una solicitud `gpt-image`.

    **Correcciones**

    - Los mensajes de error vacíos vuelven a ser un mensaje usable.


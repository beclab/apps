metadata:
  title: ChatGPT Web Midjourney Proxy
  description: Una UI fa tutto con ChatGPT e altro
spec:
  fullDescription: |
    Una UI fa tutto con ChatGPT web, Midjourney, GPTs, Suno, Luma, Runway, Viggle, Flux, Ideogram, Realtime, Pika, Udio
    Supporto simultaneo delle piattaforme Web / PWA / Linux / Win / MacOS

    **Funzionalità supportate**
    Supporto Kling per text-to-video, image-to-video e disegno.
    Supporto Ideogram per il disegno.
    Supporto Runway per text-to-video e image-to-video.
    Supporto Luma per text-to-video e image-to-video.
    Supporto Viggle per la danza.
    Supporto Suno per la generazione audio-to-audio.
    Supporto per il modulo Suno autonomo, con testi e stile musicale regolabili
    Tutte le funzionalità originali di ChatGPT web
    ChatGPT web supporta chiavi API personalizzate e base_url
    Midjourney text-to-image
    Midjourney blend immagine + text-to-image
    Variazioni immagine Midjourney U1–U4, V1–V4 e ridisegno
    Ridisegno parziale Midjourney
    Zoom Midjourney 1.5x e 2x
    Midjourney HD 2x e 4x
    Estensioni Midjourney a sinistra, destra, alto e basso
    Midjourney supporta sia midjourney-proxy sia midjourney-proxy-plus
    Testo Midjourney dalle immagini
    Archiviazione locale delle immagini con localforage
    Supporto per diversi bot come midjourney e niji
    Supporto per sostituzione del volto InsightFace
    Miscela immagini Midjourney
    Recupero seed Midjourney
    Generazione immagini DALL-E-3
    Selezione del modello nel frontend ChatGPT
    Il frontend ChatGPT supporta modelli personalizzati, numero di contesto e conteggio risposte
    ChatGPT supporta upload di immagini per GPT-4-Vision-Preview
    ChatGPT supporta upload di file backend (per modelli come GPT-4-All, GPT-4-Gizmo-xxx) disattivato di default; attivabile con la variabile d'ambiente API_UPLOADER=1
    ChatGPT supporta modelli reverse come GPT-4-All, GPT-4-V, GPT-4-Gizmo-(gizmo_id)
    ChatGPT supporta il cambio modello tramite hyperlink
    ChatGPT supporta il cambio modello tramite hyperlink in stile ChatGPT
    ChatGPT supporta GPTs multimodale
    ChatGPT supporta TTS whisper
    Riconoscimento vocale istantaneo (ASR integrato del browser) dalla v2.15.7 in su
    E altro
  upgradeDescription: |
    Release upstream: [v2.26.4](https://github.com/Dooy/chatgpt-web-midjourney-proxy/releases/tag/v2.26.4)

    **Novità**

    - La dimensione dell’immagine DALL·E può essere inserita manualmente.
    - Il caricamento delle immagini è consentito all’inizio di una richiesta `gpt-image`.

    **Correzioni**

    - I messaggi di errore vuoti tornano a un messaggio utilizzabile.


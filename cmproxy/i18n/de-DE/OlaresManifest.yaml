metadata:
  title: ChatGPT Web Midjourney Proxy
  description: Eine UI für alles mit ChatGPT und mehr
spec:
  fullDescription: |
    Eine UI für alles mit ChatGPT Web, Midjourney, GPTs, Suno, Luma, Runway, Viggle, Flux, Ideogram, Realtime, Pika, Udio
    Gleichzeitige Unterstützung der Plattformen Web / PWA / Linux / Win / MacOS

    **Unterstützte Funktionen**
    Unterstützung von Kling für Text-zu-Video, Bild-zu-Video und Zeichnen.
    Unterstützung von Ideogram für Zeichnen.
    Unterstützung von Runway für Text-zu-Video und Bild-zu-Video.
    Unterstützung von Luma für Text-zu-Video und Bild-zu-Video.
    Unterstützung von Viggle für Tanz.
    Unterstützung von Suno für Audio-zu-Audio-Generierung.
    Unterstützung für das eigenständige Suno-Modul, mit anpassbaren Lyrics und Musikstil
    Alle originalen ChatGPT-Web-Funktionen
    ChatGPT Web unterstützt benutzerdefinierte API-Keys und base_url
    Midjourney Text-zu-Bild
    Midjourney Blend Bild + Text-zu-Bild
    Midjourney Bildvariationen U1 bis U4, V1 bis V4 und Neuzeichnen
    Midjourney partielles Neuzeichnen
    Midjourney 1.5x- und 2x-Zoom
    Midjourney 2x- und 4x-HD
    Midjourney-Erweiterungen nach links, rechts, oben und unten
    Midjourney unterstützt sowohl midjourney-proxy als auch midjourney-proxy-plus
    Midjourney Text aus Bildern
    Lokale Bildspeicherung mit localforage
    Unterstützung verschiedener Bots wie midjourney und niji
    Unterstützung für InsightFace-Gesichtsersetzung
    Midjourney-Bildmischung
    Midjourney Seed abrufen
    DALL-E-3-Bildgenerierung
    ChatGPT-Frontend-Modellauswahl
    ChatGPT-Frontend unterstützt benutzerdefinierte Modelle, Kontextanzahl und Antwortanzahl
    ChatGPT unterstützt Bild-Uploads für GPT-4-Vision-Preview
    ChatGPT unterstützt Backend-Datei-Uploads (für Modelle wie GPT-4-All, GPT-4-Gizmo-xxx) standardmäßig aus, kann mit der Umgebungsvariable API_UPLOADER=1 aktiviert werden
    ChatGPT unterstützt Reverse-Modelle wie GPT-4-All, GPT-4-V, GPT-4-Gizmo-(gizmo_id)
    ChatGPT unterstützt Hyperlink-Modellwechsel
    ChatGPT unterstützt ChatGPT-Stil-Hyperlink-Modellwechsel
    ChatGPT unterstützt GPTs multimodal
    ChatGPT unterstützt TTS whisper
    Sofortige Spracherkennung (browserinterne ASR) ab v2.15.7
    Und mehr
  upgradeDescription: |
    Upstream-Release: [v2.26.4](https://github.com/Dooy/chatgpt-web-midjourney-proxy/releases/tag/v2.26.4)

    **Änderungen**

    - Die DALL·E-Bildgröße kann manuell eingegeben werden.
    - Ein Bild-Upload ist am Anfang einer `gpt-image`-Anfrage erlaubt.

    **Fehlerbehebungen**

    - Leere Fehlermeldungen werden wieder zu einer nutzbaren Meldung.


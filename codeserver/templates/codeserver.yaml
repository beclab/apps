{{- $gpu := .Values.gpu | default ((.Values.GPU | default dict).Type) | default "cpu" -}}
apiVersion: v1
data:
  config.yaml: |
    bind-addr: 127.0.0.1:8080
    auth: none

kind: ConfigMap
metadata:
  name: codeserver-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ randAlphaNum 16 | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
kind: Service
apiVersion: v1
metadata:
  name: dev
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  selector:
    app: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  {{- if eq $gpu "nvidia" }}
  annotations:
    applications.app.bytetrade.io/gpu-inject: "code-server"
  {{- end }}
spec:
  replicas: {{ .Values.workloads.codeserver.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    type: Recreate  
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      volumes:
        - name: code
          hostPath:
            type: DirectoryOrCreate
            path: {{ .Values.userspace.userData }}/Code
        - name: codeserver-config
          configMap:
            name: codeserver-config
            defaultMode: 438
            items:
            - key: config.yaml
              path: config.yaml
      initContainers:
        - name: init-permissions
          image: 'docker.io/beclab/aboveos-busybox:1.37.0'
          command:
            - sh
            - '-ec'
            - |
              mkdir -p /home/coder/.config/code-server
              chown 1000:1000 /home/coder /home/coder/.config /home/coder/.config/code-server
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: code
              mountPath: /home/coder
        - name: init-config
          image: 'docker.io/beclab/aboveos-busybox:1.37.0'
          command:
            - sh
            - '-ec'
            - |
              if [ ! -f /home/coder/.config/code-server/config.yaml ]; then
                cp /config.yaml /home/coder/.config/code-server/config.yaml
              fi
          securityContext:
            runAsUser: 1000
          resources: {}
          volumeMounts:
            - name: code
              mountPath: /home/coder
            - name: codeserver-config
              mountPath: /config.yaml
              subPath: config.yaml
      containers:
        - name: code-server
          image: "codercom/code-server:4.138.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 4000Mi
          ports:
            - name: cs-port
              containerPort: 8080
              protocol: TCP
            - name: ext-port
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /home/coder
          env:
            {{- if eq $gpu "nvidia" }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            {{- end }}
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name:  {{ .Release.Name }}-secret
                  key: password
            - name: OS_SYSTEM_SERVER
              value: system-server.user-system-{{ .Values.bfl.username }}
            - name: NAME_SPACE
              value: {{ .Release.Namespace }}

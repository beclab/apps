metadata:
  title: Code Server
  description: VS Code nel browser
spec:
  fullDescription: |
    Esegui VS Code su qualsiasi macchina e accedi dal browser.
    
    **Punti salienti**
    - Programma su qualsiasi dispositivo con un ambiente di sviluppo coerente.
    - Usa server cloud per accelerare test, compilazioni, download e altro.
    - Risparmia batteria in movimento; tutte le attività intensive vengono eseguite sul tuo server.
    - Le funzioni di VS Code sono supportate, ma non tutte le estensioni
    
    code-server è un progetto open-source che trasforma Visual Studio Code (VS Code) in un server, consentendogli di funzionare su qualsiasi macchina. Di conseguenza, gli sviluppatori possono accedere a VS Code da qualsiasi dispositivo con connessione Internet, aprendo nuove possibilità per lo sviluppo remoto.
    
    code-server si distingue per la compatibilità con la maggior parte delle estensioni VS Code. Questa funzione consente agli sviluppatori di personalizzare l'ambiente di coding alle proprie esigenze, anche lavorando da remoto.
    
    Uno dei vantaggi significativi di code-server è mantenere un ambiente di sviluppo coerente su dispositivi diversi, riducendo i problemi di codice che si comporta diversamente su macchine differenti.
  upgradeDescription: |
    Release upstream: [code-server 4.135.0](https://github.com/coder/code-server/releases/tag/v4.135.0)

    **Novità**

    - L’editor è ora VS Code 1.135.0.


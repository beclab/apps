metadata:
  title: Code Server
  description: VS Code en el navegador
spec:
  fullDescription: |
    Ejecute VS Code en cualquier máquina y acceda a él desde el navegador.
    
    **Aspectos destacados**
    - Programe en cualquier dispositivo con un entorno de desarrollo coherente.
    - Use servidores en la nube para acelerar pruebas, compilaciones, descargas y más.
    - Conserve la batería cuando esté en movimiento; todas las tareas intensivas se ejecutan en su servidor.
    - Se admiten las funciones de VS Code, pero no todas las extensiones
    
    code-server es un proyecto de código abierto que convierte Visual Studio Code (VS Code) en un servidor, permitiendo ejecutarlo en cualquier máquina. Así, los desarrolladores pueden acceder a VS Code desde cualquier dispositivo con conexión a Internet, abriendo nuevas posibilidades para el desarrollo remoto.
    
    code-server destaca por su compatibilidad con la mayoría de las extensiones de VS Code. Esta función permite a los desarrolladores adaptar su entorno de codificación a sus necesidades específicas, incluso al trabajar de forma remota.
    
    Una de las ventajas significativas de code-server es mantener un entorno de desarrollo coherente en diversos dispositivos, reduciendo problemas con código que se comporta de forma distinta en distintas máquinas.
  upgradeDescription: |
    Versión upstream: [code-server 4.135.0](https://github.com/coder/code-server/releases/tag/v4.135.0)

    **Novedades**

    - El editor es ahora VS Code 1.135.0.


metadata:
  title: Code Server
  description: VS Code dans le navigateur
spec:
  fullDescription: |
    Exécutez VS Code sur n'importe quelle machine et accédez-y depuis le navigateur.
    
    **Points forts**
    - Codez sur n'importe quel appareil avec un environnement de développement cohérent.
    - Utilisez des serveurs cloud pour accélérer tests, compilations, téléchargements, etc.
    - Préservez la batterie en déplacement ; toutes les tâches intensives s'exécutent sur votre serveur.
    - Les fonctionnalités de VS Code sont prises en charge, mais pas toutes les extensions
    
    code-server est un projet open source qui transforme Visual Studio Code (VS Code) en serveur, lui permettant de s'exécuter sur n'importe quelle machine. Ainsi, les développeurs peuvent accéder à VS Code depuis tout appareil connecté à Internet, ouvrant de nouvelles possibilités pour le développement à distance.
    
    code-server se distingue par sa compatibilité avec la plupart des extensions VS Code. Cette fonctionnalité permet aux développeurs d'adapter leur environnement de codage à leurs besoins, même à distance.
    
    L'un des avantages majeurs de code-server est de maintenir un environnement de développement cohérent sur divers appareils, réduisant les problèmes de code se comportant différemment selon les machines.
  upgradeDescription: |
    Version en amont : [code-server 4.135.0](https://github.com/coder/code-server/releases/tag/v4.135.0)

    **Nouveautés**

    - L’éditeur est désormais VS Code 1.135.0.


metadata:
  title: Code Server
  description: VS Code im Browser
spec:
  fullDescription: |
    Führen Sie VS Code auf jedem Rechner aus und greifen Sie im Browser darauf zu.
    
    **Highlights**
    - Programmieren Sie auf jedem Gerät mit einer konsistenten Entwicklungsumgebung.
    - Nutzen Sie Cloud-Server, um Tests, Kompilierungen, Downloads und mehr zu beschleunigen.
    - Schonung des Akkus unterwegs; alle rechenintensiven Aufgaben laufen auf Ihrem Server.
    - VS-Code-Funktionen werden unterstützt, aber nicht alle Erweiterungen
    
    code-server ist ein Open-Source-Projekt, das Visual Studio Code (VS Code) in einen Server verwandelt und so auf jeder Maschine laufen lässt. Dadurch können Entwickler von jedem Gerät mit Internetverbindung auf VS Code zugreifen und neue Möglichkeiten für Remote-Entwicklung eröffnen.
    
    code-server zeichnet sich durch die Kompatibilität mit den meisten VS-Code-Erweiterungen aus. So können Entwickler ihre Coding-Umgebung auch remote an ihre Bedürfnisse anpassen.
    
    Ein großer Vorteil von code-server ist die konsistente Entwicklungsumgebung über verschiedene Geräte hinweg, was Probleme mit unterschiedlich verhaltenem Code auf verschiedenen Maschinen verringert.
  upgradeDescription: |
    Upstream-Release: [code-server 4.135.0](https://github.com/coder/code-server/releases/tag/v4.135.0)

    **Änderungen**

    - Der Editor ist jetzt VS Code 1.135.0.


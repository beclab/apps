metadata:
  title: Code Server
  description: ブラウザで使える VS Code
spec:
  fullDescription: |
    どのマシンでも VS Code を実行し、ブラウザからアクセスできます。
    
    **ハイライト**
    - 一貫した開発環境で、どのデバイスからでもコーディング。
    - クラウドサーバーでテスト、コンパイル、ダウンロードなどを高速化。
    - 外出先でもバッテリーを節約。重い処理はすべてサーバー側で実行。
    - VS Code の機能はサポートされますが、すべての拡張機能が使えるわけではありません
    
    code-server は Visual Studio Code（VS Code）をサーバー化するオープンソースプロジェクトで、どのマシン上でも実行できます。その結果、インターネット接続のあるどのデバイスからでも VS Code にアクセスでき、リモート開発の新たな可能性が広がります。
    
    code-server はほとんどの VS Code 拡張機能との互換性が強みです。リモート作業時でも、コーディング環境を自分のニーズに合わせてカスタマイズできます。
    
    code-server の大きな利点のひとつは、多様なデバイス間で一貫した開発環境を保てることであり、マシンごとにコードの挙動が異なる問題を減らせます。
  upgradeDescription: |
    上流リリース：[code-server 4.135.0](https://github.com/coder/code-server/releases/tag/v4.135.0)

    **変更点**

    - エディターは VS Code 1.135.0 になりました。


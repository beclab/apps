metadata:
  title: Qwen3 30B (vLLM)
  description: Die neueste Generation großer Sprachmodelle der Qwen-Serie mit einer umfassenden Suite dichter und Mixture-of-Experts-(MoE)-Modelle
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    
    **ModellÜBERSICHT**
    Qwen3 ist die neueste Generation großer Sprachmodelle der Qwen-Serie und bietet eine umfassende Suite dichter und Mixture-of-Experts-(MoE)-Modelle. Aufgebaut auf umfangreichem Training liefert Qwen3 bahnbrechende Fortschritte in Reasoning, Instruction-Following, Agenten-Fähigkeiten und Mehrsprachigkeit.
    
    Hauptfunktionen:
    Einzigartige Unterstützung für nahtloses Umschalten zwischen Thinking-Modus (für komplexe logische Reasoning-, Mathematik- und Coding-Aufgaben) und Non-Thinking-Modus (für effizienten, allgemeinen Dialog) innerhalb eines einzigen Modells – für optimale Leistung in verschiedenen Szenarien.
    
    Deutlich verbesserte Reasoning-Fähigkeiten, die frühere QwQ-Modelle (im Thinking-Modus) und Qwen2.5-Instruct-Modelle (im Non-Thinking-Modus) in Mathematik, Codegenerierung und Common-Sense-Logik übertreffen.
    
    Überlegene Ausrichtung an menschlichen Präferenzen – stark in kreativem Schreiben, Rollenspiel, Mehrturn-Dialogen und Instruction Following für natürlichere, ansprechendere Gespräche.
    
    Expertise in Agenten-Fähigkeiten mit präziser Integration externer Tools in Thinking- und Non-Thinking-Modi sowie führender Leistung unter Open-Source-Modellen bei komplexen agentenbasierten Aufgaben.
    
    Unterstützung von über 100 Sprachen und Dialekten mit starken Fähigkeiten für mehrsprachiges Instruction Following und Übersetzung.
  upgradeDescription: |
    vLLM-Runtime auf v0.22.0-cu129 aktualisiert; -O3-Optimierung aktiviert und torch.compile- / FlashInfer-Cache persistent gemacht.

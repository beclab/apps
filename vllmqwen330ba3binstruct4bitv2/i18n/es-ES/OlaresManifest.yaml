metadata:
  title: Qwen3 30B (vLLM)
  description: La última generación de grandes modelos de lenguaje de la serie Qwen, con un conjunto completo de modelos densos y de mezcla de expertos (MoE)
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla a través de la aplicación de referencia.
    
    **RESUMEN DEL MODELO**
    Qwen3 es la última generación de grandes modelos de lenguaje de la serie Qwen, con un conjunto completo de modelos densos y de mezcla de expertos (MoE). Basado en un entrenamiento exhaustivo, Qwen3 aporta avances revolucionarios en razonamiento, seguimiento de instrucciones, capacidades de agente y soporte multilingüe.
    
    Funciones clave:
    Soporte único para el cambio fluido entre el modo thinking (para razonamiento lógico complejo, matemáticas y código) y el modo non-thinking (para diálogo general eficiente) dentro de un mismo modelo, asegurando un rendimiento óptimo en diversos escenarios.
    
    Mejora significativa de las capacidades de razonamiento, superando a los modelos QwQ anteriores (en modo thinking) y a los modelos instruct Qwen2.5 (en modo non-thinking) en matemáticas, generación de código y razonamiento de sentido común.
    
    Alineación superior con las preferencias humanas, destacando en escritura creativa, juego de roles, diálogos multiturno y seguimiento de instrucciones, para una experiencia conversacional más natural e inmersiva.
    
    Experiencia en capacidades de agente, permitiendo una integración precisa con herramientas externas en modos thinking y non-thinking, y logrando un rendimiento líder entre modelos de código abierto en tareas complejas basadas en agentes.
    
    Soporte de más de 100 idiomas y dialectos con fuertes capacidades de seguimiento de instrucciones multilingües y traducción.
  upgradeDescription: |
    Actualización del runtime vLLM a v0.22.0-cu129; habilitación de la optimización -O3 y persistencia de la caché de torch.compile / FlashInfer.

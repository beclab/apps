metadata:
  title: BGE-M3 (Ollama/CPU)
  description: Kit de herramientas de recuperación todo en uno para búsqueda y RAG
spec:
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Actualizar la imagen del proxy de la API de Olares a beclab/harveyff-olares-ollama:v0.1.21.
  fullDescription: |
    **NOTA IMPORTANTE**
    Este modelo se ejecuta solo en CPU. Si desea ejecutarlo en GPU, instale la versión genérica del programa Ollama.

    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **RESUMEN DEL MODELO**
    BGE-M3 se basa en la arquitectura XLM-RoBERTa y destaca por su versatilidad en Multi-Funcionalidad, Multi-Lingüismo y Multi-Granularidad:
    - Multi-Funcionalidad: Puede realizar simultáneamente las tres funcionalidades comunes de recuperación de un modelo de embedding: dense retrieval, multi-vector retrieval y sparse retrieval.
    - Multi-Lingüismo: Puede admitir más de 100 idiomas de trabajo.
    - Multi-Granularidad: Puede procesar entradas de distintas granularidades, desde oraciones cortas hasta documentos largos de hasta 8192 tokens.

    **Detalles del modelo**
    - Nombre del modelo: BAAI/bge-m3
    - Parámetros: 567m
    - Dimensión: 1024
    - Longitud de secuencia: 8192

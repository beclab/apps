metadata:
  title: BGE-M3 (Ollama/CPU)
  description: Toolkit di retrieval tutto-in-uno per ricerca e RAG
spec:
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Aggiorna l'immagine del proxy API di Olares a beclab/harveyff-olares-ollama:v0.1.21.
  fullDescription: |
    **NOTA IMPORTANTE**
    Questo modello viene eseguito solo su CPU. Se vuoi eseguirlo su GPU, installa la versione generica del programma Ollama.

    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA DEL MODELLO**
    BGE-M3 si basa sull'architettura XLM-RoBERTa e si distingue per la versatilità in Multi-Funzionalità, Multi-Lingualità e Multi-Granularità:
    - Multi-Funzionalità: può eseguire contemporaneamente le tre funzionalità di retrieval comuni dei modelli di embedding: dense retrieval, multi-vector retrieval e sparse retrieval.
    - Multi-Lingualità: può supportare più di 100 lingue di lavoro.
    - Multi-Granularità: può elaborare input di diverse granularità, da frasi brevi a documenti lunghi fino a 8192 token.

    **Dettagli del modello**
    - Nome modello: BAAI/bge-m3
    - Parametri: 567m
    - Dimensione: 1024
    - Lunghezza sequenza: 8192

metadata:
  title: BGE-M3 (Ollama/CPU)
  description: 検索と RAG のためのワンストップ検索ツールキット
spec:
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（全 Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。
  fullDescription: |
    **重要なお知らせ**
    このモデルは CPU のみで動作します。GPU で実行する場合は、汎用版の Ollama プログラムをインストールしてください。

    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **モデル概要**
    BGE-M3 は XLM-RoBERTa アーキテクチャに基づき、Multi-Functionality・Multi-Linguality・Multi-Granularity の多用途性で際立ちます:
    - Multi-Functionality: embedding モデルの一般的な 3 つの検索機能（dense retrieval、multi-vector retrieval、sparse retrieval）を同時に実行可能。
    - Multi-Linguality: 100 以上の作業言語に対応。
    - Multi-Granularity: 短い文から最大 8192 トークンの長文まで、異なる粒度の入力を処理可能。

    **モデル詳細**
    - モデル名: BAAI/bge-m3
    - パラメータ: 567m
    - 次元: 1024
    - シーケンス長: 8192

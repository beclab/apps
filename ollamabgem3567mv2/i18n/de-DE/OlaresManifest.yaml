metadata:
  title: BGE-M3 (Ollama/CPU)
  description: All-in-one-Retrieval-Toolkit für Suche und RAG
spec:
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.

    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisieren.
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dieses Modell läuft nur auf der CPU. Wenn Sie es auf der GPU ausführen möchten, installieren Sie bitte die generische Version des Ollama-Programms.

    Dies ist eine Shared App. Nach der Installation durch den Olares Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **MODELLÜBERSICHT**
    BGE-M3 basiert auf der XLM-RoBERTa-Architektur und zeichnet sich durch Vielseitigkeit in Multi-Funktionalität, Multi-Lingualität und Multi-Granularität aus:
    - Multi-Funktionalität: Es kann gleichzeitig die drei gängigen Retrieval-Funktionen von Embedding-Modellen ausführen: dense retrieval, multi-vector retrieval und sparse retrieval.
    - Multi-Lingualität: Es unterstützt mehr als 100 Arbeitssprachen.
    - Multi-Granularität: Es kann Eingaben unterschiedlicher Granularität verarbeiten – von kurzen Sätzen bis zu langen Dokumenten mit bis zu 8192 Tokens.

    **Modelldetails**
    - Modellname: BAAI/bge-m3
    - Parameter: 567m
    - Dimension: 1024
    - Sequenzlänge: 8192

metadata:
  title: BGE-M3 (Ollama/CPU)
  description: Boîte à outils de retrieval tout-en-un pour la recherche et le RAG
spec:
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé dans Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Mettre à niveau l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.
  fullDescription: |
    **NOTE IMPORTANTE**
    Ce modèle s'exécute uniquement sur CPU. Si vous souhaitez l'exécuter sur GPU, veuillez installer la version générique du programme Ollama.

    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.

    **APERÇU DU MODÈLE**
    BGE-M3 est basé sur l'architecture XLM-RoBERTa et se distingue par sa polyvalence en Multi-Fonctionnalité, Multi-Linguisme et Multi-Granularité :
    - Multi-Fonctionnalité : il peut exécuter simultanément les trois fonctionnalités de retrieval courantes d'un modèle d'embedding : dense retrieval, multi-vector retrieval et sparse retrieval.
    - Multi-Linguisme : il peut prendre en charge plus de 100 langues de travail.
    - Multi-Granularité : il peut traiter des entrées de différentes granularités, des phrases courtes aux longs documents jusqu'à 8192 jetons.

    **Détails du modèle**
    - Nom du modèle : BAAI/bge-m3
    - Paramètres : 567m
    - Dimension : 1024
    - Longueur de séquence : 8192

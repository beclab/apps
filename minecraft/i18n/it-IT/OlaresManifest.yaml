metadata:
  title: Minecraft
  description: Server dedicato Minecraft Java Edition
spec:
  fullDescription: |
    Un server dedicato vanilla di Minecraft Java Edition. Non c'è interfaccia web — apri il terminale della console dal desktop e unisciti con il client ufficiale Minecraft Java.

    Il primo avvio scarica il jar ufficiale del server (alcuni minuti). I dati del mondo sono salvati nella directory dati di questa app.

    Sulla stessa LAN, apri Impostazioni → Rete → Overlay gateway, attiva il gateway e abilita Overlay per questa app, poi unisciti con l'IP LAN e la porta mostrati lì (TCP 25565).

    Overlay e VPN possono essere usati insieme. Per VPN, usa l’indirizzo e la porta esterna di questa istanza in Impostazioni → App → Minecraft → Porte. Ogni nuova istanza riceve una porta esterna propria.

    Clone crea un’istanza indipendente con configurazione e directory dati proprie. Non copia mondi esistenti. I mod sono in Data/<instance-name>/data/mods.

    Scegli Minecraft 1.12.2, 1.16.5, 1.18.2, 1.19.2, 1.20.1, 1.21.1, 26.2 o LATEST durante l’installazione; Java viene selezionato automaticamente. LATEST può aggiornarsi al riavvio. Il client deve corrispondere al server. Scegli Vanilla, Forge o Fabric e versioni compatibili con i tuoi mod. La verifica account è attiva per default e disattivabile nelle variabili di ambiente; vengono disattivati anche i profili sicuri e il server si riavvia. Modalità offline solo per giocatori fidati. Cambiare modalità modifica gli UUID e può influire su inventari e permessi. Esegui backup e non aprire mondi con versioni precedenti.

    I comandi cheat sono disattivati per impostazione predefinita. Attiva «Consenti cheat» nelle variabili d’ambiente per far usare a ogni giocatore che entra comandi come /give e /gamemode e per abilitare i blocchi di comando. /stop resta sulla console. Disattivando si revoca quell’accesso e il server si riavvia. Solo per giocatori fidati.

    Il limite di giocatori è 8 per impostazione predefinita e si cambia nelle variabili d’ambiente, da 1 a 100. La modifica riavvia il server. Un limite più alto usa più memoria.

  upgradeDescription: |
    Corretti i nomi duplicati dei deployment del server e della console; mantenuto il supporto Clone e Overlay.

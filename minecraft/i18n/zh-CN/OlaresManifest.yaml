metadata:
  title: Minecraft
  description: Minecraft Java 版专用服务器。
spec:
  fullDescription: |
    原版 Minecraft Java 版专用服务器。没有网页界面——从桌面打开控制台终端，用官方 Java 客户端加入。

    首次启动会下载官方服务端 jar（可能需要几分钟）。存档保存在本应用的数据目录。

    同一局域网内：打开「设置 → 网络 → Overlay 网关」，开启网关并为本应用打开 Overlay，使用页面显示的局域网 IP 与端口（TCP 25565）进服。

    Overlay 与 VPN 可同时使用。通过 VPN 进服时，使用「设置 → 应用 → 对应 Minecraft 实例 → 端口」显示的地址与外部端口。每个新实例会分配独立的外部端口。

    Clone 可创建独立服务器实例，各实例使用独立配置和数据目录，不会复制已有世界。该实例的服务端模组目录为 Data/<实例名称>/data/mods。

    安装时可选择 Minecraft 1.12.2、1.16.5、1.18.2、1.19.2、1.20.1、1.21.1、26.2 或 LATEST，自动匹配 Java。LATEST 可能在重启时更新。客户端须与服务端版本一致；安装时可选择 Vanilla、Forge 或 Fabric，并按模组包要求固定游戏和加载器版本。停服后将服务端模组放到 Data/<instance-name>/data/mods，再启动。

    正版验证默认开启，可在应用环境变量设置中关闭，同时关闭安全配置文件验证并重启服务。离线模式不校验玩家身份，仅供可信玩家使用。切换模式会改变玩家 UUID，可能影响背包和权限。修改前请备份存档，不要降级已有世界。

    作弊模式默认关闭。在应用环境变量中开启后，加入的玩家可以使用 /give、/gamemode 等指令，并启用命令方块。该权限不包含关服指令，关服仍在控制台操作。关闭后会清空玩家管理员列表并重启服务。请仅在可信玩家之间使用。

    最大在线人数默认 8 人，可在应用环境变量中改为 1 到 100。修改后会重启服务。人数越高，占用的内存越多。

  upgradeDescription: |
    修复游戏服务和控制台工作负载同名导致的安装失败，保留 Clone 和 Overlay 支持。

metadata:
  title: Minecraft
  description: Minecraft Java 版专用服务器。
spec:
  fullDescription: |
    原版 Minecraft Java 版专用服务器。没有网页界面——从桌面打开控制台终端，用官方 Java 客户端加入。

    首次启动会下载官方服务端 jar（可能需要几分钟）。存档保存在本应用的数据目录。

    同一局域网内：打开「设置 → 网络 → Overlay 网关」，开启网关并为本应用打开 Overlay，使用页面显示的局域网 IP 与端口（TCP 25565）进服。

    Overlay 与 VPN 可同时使用。通过 VPN 进服（包括玩家不在同一网络时）请填 `<olares-id>.olares.com:25565`（例如 olarestest001.olares.com:25565）。

    Java 客户端版本须与服务器一致。已开启 online mode，需要正版 Microsoft 账号。

  upgradeDescription: |
    通过 nodeAffinity 将游戏服 Pod 固定到 control-plane（master），以配合 Overlay 网关局域网访问。

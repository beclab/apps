metadata:
  title: Minecraft
  description: Serveur dédié Minecraft Java Edition
spec:
  fullDescription: |
    Minecraft Java Edition server with Vanilla, Forge, and Fabric installation options.

    Le premier démarrage télécharge le jar officiel du serveur (quelques minutes). Les données du monde sont stockées dans le répertoire de données de cette app.

    Sur le même LAN, ouvrez Paramètres → Réseau → Overlay gateway, activez la passerelle et activez Overlay pour cette app, puis rejoignez avec l'IP LAN et le port affichés (TCP 25565).

    Overlay et VPN peuvent être utilisés ensemble. Pour le VPN, utilisez l’adresse et le port externe de cette instance dans Paramètres → Applications → Minecraft → Ports. Chaque nouvelle instance reçoit son propre port externe.

    Clone crée une instance indépendante avec sa propre configuration et son répertoire de données. Les mondes existants ne sont pas copiés. Les mods sont dans Data/<instance-name>/data/mods.

    Choisissez Minecraft 1.12.2, 1.16.5, 1.18.2, 1.19.2, 1.20.1, 1.21.1, 26.2 ou LATEST à l’installation ; Java est adapté automatiquement. LATEST peut se mettre à jour au redémarrage. Le client doit correspondre au serveur. Choisissez Vanilla, Forge ou Fabric et des versions compatibles avec vos mods. La vérification des comptes est activée par défaut et désactivable dans les variables d’environnement ; la vérification des profils sécurisés est aussi désactivée et le serveur redémarre. Mode hors ligne réservé aux joueurs de confiance. Changer de mode modifie les UUID et peut affecter inventaires et permissions. Sauvegardez les mondes et ne les rétrogradez pas.

    Les commandes de triche sont désactivées par défaut. Activez « Autoriser les triches » dans les variables d’environnement pour que chaque joueur qui rejoint puisse utiliser /give et /gamemode, et pour activer les blocs de commande. /stop reste sur la console. Désactiver retire cet accès et redémarre le serveur. Réservé aux joueurs de confiance.

    La limite de joueurs est de 8 par défaut et se règle dans les variables d’environnement, de 1 à 100. La modifier redémarre le serveur. Une limite plus haute consomme plus de mémoire.

  upgradeDescription: |
    Correction des noms de déploiement identiques du serveur et de la console ; Clone et Overlay restent disponibles.

metadata:
  title: Minecraft
  description: Minecraft Java Edition dedicated server.
spec:
  fullDescription: |
    A vanilla Minecraft Java Edition dedicated server. There is no web UI — open the console terminal from the desktop, and join from the official Minecraft Java client.

    First start downloads the official server jar (a few minutes). World data is stored in this app's data directory.

    On the same LAN, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app, then join using the LAN IP and port shown there (TCP 25565).

    Overlay and VPN can be used at the same time. For VPN — including when players are on a different network — join at `<olares-id>.olares.com:25565` (for example olarestest001.olares.com:25565).

    The Java client version must match the server. Online mode is on, so a genuine Microsoft account is required.

  upgradeDescription: |
    Pin the game server pod to control-plane (master) via nodeAffinity for overlay gateway LAN access.

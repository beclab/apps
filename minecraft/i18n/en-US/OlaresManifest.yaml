metadata:
  title: Minecraft
  description: Minecraft Java Edition dedicated server.
spec:
  fullDescription: |
    Minecraft Java Edition server with Vanilla, Forge, and Fabric installation options.

    First start downloads the official server jar (a few minutes). World data is stored in this app's data directory.

    On the same LAN, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app, then join using the LAN IP and port shown there (TCP 25565).

    Overlay and VPN can be used together. For VPN connections, use the address and external port shown for this instance in Settings → Apps → Minecraft → Ports. Each new instance receives its own external port.

    Clone creates an independent server instance with its own configuration and data directory. It does not copy an existing world. Use Data/<instance-name>/data/mods for that instance’s server-side mods.

    Select Minecraft 1.12.2, 1.16.5, 1.18.2, 1.19.2, 1.20.1, 1.21.1, 26.2, or LATEST during installation; Java is selected automatically. LATEST may update on restart. The client must match the server. Choose Vanilla, Forge, or Fabric at installation. Pin compatible game and loader versions for your modpack. Upload server-side mods to Data/<instance-name>/data/mods while the server is stopped.

    Online mode is enabled by default and can be disabled in the app environment settings, which also disables secure profile enforcement and restarts the server. Offline mode does not verify identities; use it with trusted players only. Switching modes changes player UUIDs and may affect inventories and permissions. Back up worlds before changes; never downgrade an existing world.

    Cheat commands are off by default. Turn on Allow cheats in the app environment settings to let every player who joins use commands such as /give and /gamemode. That setting also enables command blocks. It does not grant server-stop commands; those stay on the console. Turning it off clears the player operator list and restarts the server. Use it only with trusted players.

    The player limit defaults to 8 and can be changed in the app environment settings. Allowed values are 1 to 100. Changing it restarts the server. Higher limits use more memory.

  upgradeDescription: |
    Fix duplicate game and console Deployment names during installation; retain Clone and Overlay support.

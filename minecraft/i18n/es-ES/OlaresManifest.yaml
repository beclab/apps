metadata:
  title: Minecraft
  description: Servidor dedicado de Minecraft Java Edition
spec:
  fullDescription: |
    Un servidor dedicado vanilla de Minecraft Java Edition. No hay interfaz web — abre la terminal de consola desde el escritorio y únete con el cliente oficial de Minecraft Java.

    El primer arranque descarga el jar oficial del servidor (unos minutos). Los datos del mundo se guardan en el directorio de datos de esta app.

    En la misma LAN, abre Ajustes → Red → Overlay gateway, activa la pasarela y habilita Overlay para esta app, luego únete con la IP LAN y el puerto mostrados allí (TCP 25565).

    Overlay y VPN pueden usarse juntos. Para VPN, usa la dirección y el puerto externo de esta instancia en Ajustes → Aplicaciones → Minecraft → Puertos. Cada instancia nueva recibe su propio puerto externo.

    Clone crea una instancia independiente con su propia configuración y directorio de datos. No copia mundos existentes. Los mods se guardan en Data/<instance-name>/data/mods.

    Elige Minecraft 1.12.2, 1.16.5, 1.18.2, 1.19.2, 1.20.1, 1.21.1, 26.2 o LATEST al instalar; Java se selecciona automáticamente. LATEST puede actualizarse al reiniciar. El cliente debe coincidir con el servidor. Elige Vanilla, Forge o Fabric al instalar; usa versiones del juego y del cargador compatibles con tus mods. La verificación de cuentas está activada por defecto y puede desactivarse en las variables de entorno; también se desactiva la comprobación de perfiles seguros y se reinicia el servidor. Modo offline solo para jugadores de confianza. Cambiar de modo modifica los UUID y puede afectar inventarios y permisos. Haz una copia de seguridad; no abras mundos con versiones anteriores.

    Los comandos de truco están desactivados por defecto. Activa «Permitir trucos» en las variables de entorno para que cada jugador que entre pueda usar /give y /gamemode, y para activar los bloques de comandos. /stop sigue en la consola. Desactivarlo quita ese acceso y reinicia el servidor. Úsalo solo con jugadores de confianza.

    El límite de jugadores es 8 por defecto y se puede cambiar en las variables de entorno, de 1 a 100. Cambiarlo reinicia el servidor. Un límite mayor usa más memoria.

  upgradeDescription: |
    Corrige los nombres duplicados de los despliegues del servidor y la consola; mantiene Clone y Overlay.

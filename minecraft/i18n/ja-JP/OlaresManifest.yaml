metadata:
  title: Minecraft
  description: Minecraft Java Edition 専用サーバー
spec:
  fullDescription: |
    バニラの Minecraft Java Edition 専用サーバーです。Web UI はありません — デスクトップからコンソール端末を開き、公式 Minecraft Java クライアントから参加してください。

    初回起動時に公式サーバー jar をダウンロードします（数分）。ワールドデータはこのアプリのデータディレクトリに保存されます。

    同一 LAN では、設定 → ネットワーク → Overlay gateway を開き、ゲートウェイをオンにしてこのアプリの Overlay を有効にしたうえで、表示される LAN IP とポート（TCP 25565）で参加します。

    Overlay と VPN は併用できます。VPN 接続では「設定 → アプリ → 対象の Minecraft → ポート」に表示されるアドレスと外部ポートを使ってください。新しいインスタンスには個別の外部ポートが割り当てられます。

    Clone は独立した設定とデータディレクトリを持つサーバーを作成します。既存のワールドはコピーしません。MOD は Data/<instance-name>/data/mods に配置してください。

    インストール時に Minecraft 1.12.2、1.16.5、1.18.2、1.19.2、1.20.1、1.21.1、26.2、LATEST を選択でき、Java は自動選択されます。LATEST は再起動時に更新される場合があります。クライアントとサーバーのバージョンを一致させてください。インストール時に Vanilla、Forge、Fabric を選択できます。ゲームとローダーは MOD に対応するバージョンを指定してください。アカウント認証は初期状態で有効です。環境変数で無効にすると、セキュアプロファイル認証も無効になり再起動します。オフラインモードは信頼できるプレイヤー限定です。モード変更は UUID を変え、所持品や権限に影響する場合があります。変更前にバックアップし、既存ワールドを古いバージョンで開かないでください。

    チートコマンドは初期状態でオフです。環境変数で「チートを許可」をオンにすると、参加したプレイヤーは /give や /gamemode などを使え、コマンドブロックも有効になります。/stop はコンソールのままです。オフにするとその権限は取り消され、サーバーが再起動します。信頼できるプレイヤーだけに使ってください。

    最大同時参加人数の初期値は 8 人です。環境変数で 1 から 100 に変更でき、変更するとサーバーが再起動します。人数が多いほどメモリを使います。

  upgradeDescription: |
    ゲームサーバーとコンソールの Deployment 名の重複によるインストール失敗を修正。Clone と Overlay は引き続き利用できます。

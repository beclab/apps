metadata:
  title: Minecraft
  description: Dedizierter Server für Minecraft Java Edition
spec:
  fullDescription: |
    Ein Vanilla-Minecraft-Java-Edition-Server. Es gibt keine Web-UI — öffne das Konsolen-Terminal vom Desktop und tritt über den offiziellen Minecraft-Java-Client bei.

    Beim ersten Start wird das offizielle Server-JAR heruntergeladen (einige Minuten). Weltdaten werden im Datenverzeichnis dieser App gespeichert.

    Im selben LAN: Einstellungen → Netzwerk → Overlay-Gateway öffnen, Gateway einschalten und Overlay für diese App aktivieren, dann mit der dort angezeigten LAN-IP und dem Port beitreten (TCP 25565).

    Overlay und VPN können gleichzeitig genutzt werden. Für VPN die Adresse und den externen Port dieser Instanz unter Einstellungen → Apps → Minecraft → Ports verwenden. Jede neue Instanz erhält einen eigenen externen Port.

    Clone erstellt eine unabhängige Serverinstanz mit eigener Konfiguration und eigenem Datenverzeichnis. Bestehende Welten werden nicht kopiert. Mods liegen unter Data/<instance-name>/data/mods.

    Bei der Installation Minecraft 1.12.2, 1.16.5, 1.18.2, 1.19.2, 1.20.1, 1.21.1, 26.2 oder LATEST wählen; Java wird automatisch angepasst. LATEST kann beim Neustart aktualisiert werden. Client und Server müssen übereinstimmen. Vanilla, Forge oder Fabric bei der Installation wählen; Spiel- und Loader-Versionen müssen zum Modpack passen. Die Kontoprüfung ist standardmäßig aktiv und in den App-Umgebungsvariablen abschaltbar; dabei wird auch die Prüfung sicherer Profile deaktiviert und der Server neu gestartet. Offline-Modus nur für vertrauenswürdige Spieler. Ein Moduswechsel ändert UUIDs und kann Inventare und Rechte beeinflussen. Welten vor Änderungen sichern und nicht downgraden.

    Cheat-Befehle sind standardmäßig aus. „Cheats erlauben“ in den App-Umgebungsvariablen gibt jedem beitretenden Spieler Befehle wie /give und /gamemode und aktiviert Befehlsblöcke. /stop bleibt an der Konsole. Ausschalten entzieht diese Rechte und startet den Server neu. Nur für vertrauenswürdige Spieler.

    Die Spielergrenze ist standardmäßig 8 und in den App-Umgebungsvariablen änderbar (1 bis 100). Eine Änderung startet den Server neu. Höhere Werte brauchen mehr Speicher.

  upgradeDescription: |
    Doppelte Deployment-Namen von Spielserver und Konsole beim Installieren beheben; Clone und Overlay bleiben unterstützt.

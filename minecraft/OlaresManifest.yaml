olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  minecraft: 1
  terminal: 1

metadata:
  name: minecraft
  appid: minecraft
  title: Minecraft
  description: Minecraft Java Edition dedicated server.
  icon: https://cdn.olares.com/images/2026/08/115f197fbf485c4afaf008ed273e83bd.png
  version: 0.1.14
  categories:
  - Fun
  - homelab
  tags:
  - gaming

entrances:
- name: terminal
  host: terminal
  port: 80
  title: Minecraft Console
  icon: https://cdn.olares.com/images/2026/08/115f197fbf485c4afaf008ed273e83bd.png
  authLevel: private
  openMethod: window

ports:
- name: minecraft
  host: minecraft
  port: 25565
  protocol: tcp
  exposePort: 25565

overlayGateway:
  enable: true
  entrances:
  - title: Minecraft Java
    workload: minecraft
    port: 25565
    protocol: tcp
    description: Join with Minecraft Java Edition (TCP 25565)

tailscale:
  acls:
  - proto: tcp
    dst:
    - "*:25565"

permission:
  appData: true

spec:
  versionName: "26.2"
  developer: itzg
  website: https://www.minecraft.net/
  sourceCode: https://github.com/itzg/docker-minecraft-server
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://docker-minecraft-server.readthedocs.io/
  license:
  - text: Minecraft EULA
    url: https://www.minecraft.net/en-us/eula
  requiredMemory: 4Gi
  limitedMemory: 8Gi
  requiredDisk: 2Gi
  limitedDisk: 50Gi
  requiredCpu: 2
  limitedCpu: 6
  supportArch:
  - amd64
  - arm64
  runAsUser: true
  featuredImage: https://cdn.olares.com/images/2026/08/e48dd1623ddcfeb33c1c81333b8d927b.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/e48dd1623ddcfeb33c1c81333b8d927b.png
  - https://cdn.olares.com/images/2026/08/d3735a1d2ba194b7a76a6d5b619383e5.png
  - https://cdn.olares.com/images/2026/08/221e51b61d2bd779f6c774c378dbaacb.png
  fullDescription: |
    A vanilla Minecraft Java Edition dedicated server. There is no web UI — open the console terminal from the desktop, and join from the official Minecraft Java client.

    First start downloads the official server jar (a few minutes). World data is stored in this app's data directory.

    On the same LAN, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app, then join using the LAN IP and port shown there (TCP 25565).

    Overlay and VPN can be used at the same time. For VPN — including when players are on a different network — join at `<olares-id>.olares.com:25565` (for example olarestest001.olares.com:25565).

    The Java client version must match the server. Online mode is on, so a genuine Microsoft account is required.

  upgradeDescription: |
    Pin the game server pod to control-plane (master) via nodeAffinity for overlay gateway LAN access.

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

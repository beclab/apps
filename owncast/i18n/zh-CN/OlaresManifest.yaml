metadata:
  title: Owncast
  description: 一个免费的开源实时视频和网络聊天服务器，可与现有的流行广播软件一起使用。

spec:
  upgradeDescription: |
    上游发布：[Owncast 0.3.0](https://github.com/owncast/owncast/releases/tag/v0.3.0)

    **变更**

    - Featured streams 可在双方接受后展示其他正在直播的 Owncast 服务器。
    - 管理后台新增插件区，可浏览并安装插件，并按插件授予权限。
    - 自动播放可保持关闭、在浏览器允许时带声音播放，或以静音播放并显示取消静音控件。
    - 播放器的低延迟选项再次可用，默认关闭。

    默认管理员登录仍为 `/admin`，账号 `admin` / `abc123`。首次登录后请修改。

    **Olares 部署变更**

    - 从本应用的旧版 Owncast 升级时会重建推流临时目录、日志目录、HLS 缓存和指标目录，以便新进程启动。

  fullDescription: |
    **默认账号**
    管理员路径: /admin
    用户名: admin
    密码: abc123

    **应用概览**
    Owncast 是一款开源、自托管、去中心化、单用户的视频直播和聊天服务器，可让您以类似主流主流平台的风格运行自己的直播。它让您完全掌控内容、界面、审核和观众。

    **主要功能**
    自托管且独立
    - 完全掌控您的直播，让您可以创建自己想要的内容和社区。

    聊天
    - 流畅的内置聊天功能让您的观众也能参与其中。您可以添加自定义表情和聊天机器人，以鼓励观众参与。

    与您的软件兼容
    - 将您现有的直播软件连接到您的 Owncast 服务器，几分钟内即可在您自己的服务器上开始直播。

    Fediverse
    - 您的直播可以在 Fediverse 上覆盖更广泛的受众，让人们可以在 Mastodon 和其他 Fediverse 服务上关注和分享您的直播。

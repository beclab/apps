metadata:
  title: Owncast
  description: 既存の人気配信ソフトと使える、無料オープンソースのライブ動画＆Webチャットサーバー
spec:
  upgradeDescription: |
    上流リリース：[Owncast 0.3.0](https://github.com/owncast/owncast/releases/tag/v0.3.0)

    **変更内容**

    - Featured streams は、双方が承認した他の Owncast サーバーの配信中を表示できます。
    - 管理画面にプラグイン欄が追加され、プラグインごとの権限で閲覧・インストールできます。
    - 自動再生はオフのまま、ブラウザが許可すれば音声付き、またはミュート再生＋ミュート解除操作にできます。
    - プレーヤーの低遅延オプションが再び利用でき、既定ではオフです。

    既定の管理者ログインは引き続き `/admin` の `admin` / `abc123` です。初回ログイン後に変更してください。

    **Olares のデプロイ変更**

    - このアプリの古い Owncast からアップグレードすると、配信用一時ディレクトリを作り直し、新しいプロセスが起動できるようにします。

  fullDescription: |
    **デフォルト認証情報**
    AdminPath: /admin
    Username: admin
    Password: abc123

    **概要**
    Owncast はオープンソースのセルフホスト型・分散型・単一ユーザー向けライブ動画ストリーミング＆チャットサーバーで、大手配信サービスに似たスタイルで独自のライブを運用できます。コンテンツ、インターフェース、モデレーション、オーディエンスを完全に所有できます。

    **主な機能**
    セルフホスト＆独立
    - ストリームを完全に制御・所有し、望むコンテンツとコミュニティを作れます。

    チャット
    - 摩擦の少ない組み込みチャットで視聴者が参加できます。カスタム絵文字やチャットボットでエンゲージメントを高められます。

    既存ソフトと連携
    - 既存の配信ソフトを Owncast サーバーに向け、数分で自前サーバー配信を開始できます。

    Fediverse
    - ライブストリームを Fediverse でより広い視聴者に届け、Mastodon などでのフォローや共有が可能です。

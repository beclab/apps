metadata:
  title: Owncast
  description: Kostenloser Open-Source-Live-Video- und Webchat-Server für gängige Broadcast-Software
spec:
  upgradeDescription: |
    Upstream-Release: [Owncast 0.3.0](https://github.com/owncast/owncast/releases/tag/v0.3.0)

    **Änderungen**

    - Featured Streams können andere Owncast-Server zeigen, die live sind, nachdem beide Seiten zustimmen.
    - Die Admin-Oberfläche hat einen Plugin-Bereich zum Durchsuchen und Installieren von Plugins mit Berechtigungen pro Plugin.
    - Autoplay kann ausbleiben, mit Ton laufen, wenn der Browser es erlaubt, oder stumm mit einer Unmute-Steuerung laufen.
    - Die Option für geringere Latenz im Player ist wieder verfügbar und bleibt standardmäßig aus.

    Der Standard-Admin-Login bleibt `/admin` mit `admin` / `abc123`. Ändern Sie ihn nach der ersten Anmeldung.

    **Olares-Bereitstellungsänderungen**

    - Beim Upgrade von einer älteren Owncast auf dieser App wird das Stream-Temp-Verzeichnis neu angelegt, damit der neue Prozess starten kann.

  fullDescription: |
    **Standard-Zugangsdaten**
    AdminPath: /admin
    Username: admin
    Password: abc123

    **Übersicht**
    Owncast ist ein Open-Source-, selbst gehosteter, dezentraler Live-Video-Streaming- und Chat-Server für Einzelbenutzer, mit dem Sie eigene Live-Streams im Stil großer Mainstream-Angebote betreiben. Er bietet vollständige Kontrolle über Inhalte, Oberfläche, Moderation und Publikum.

    **Hauptfunktionen**
    Selbst gehostet und unabhängig
    - Volle Kontrolle und Besitz über Ihren Stream — erstellen Sie die Inhalte und Community, die Sie möchten.

    Chat
    - Der reibungslose integrierte Chat lässt Zuschauer Teil des Geschehens sein. Eigene Emotes und Chatbots fördern das Engagement.

    Funktioniert mit Ihrer Software
    - Richten Sie Ihre bestehende Broadcast-Software auf Ihren Owncast-Server und streamen Sie in Minuten auf Ihrem eigenen Server.

    Das Fediverse
    - Ihr Live-Stream kann im Fediverse ein größeres Publikum erreichen — Nutzer können Ihrem Stream auf Mastodon und anderen Fediverse-Diensten folgen und ihn teilen.

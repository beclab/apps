metadata:
  title: Owncast
  description: Servidor gratuito y de código abierto de vídeo en directo y chat web para usar con software de emisión popular
spec:
  upgradeDescription: |
    Versión upstream: [Owncast 0.3.0](https://github.com/owncast/owncast/releases/tag/v0.3.0)

    **Novedades**

    - Featured streams puede mostrar otros servidores Owncast en directo cuando ambas partes aceptan.
    - El admin incluye una sección de plugins para explorar e instalar plugins con permisos por plugin.
    - La reproducción automática puede permanecer desactivada, reproducir con audio si el navegador lo permite, o reproducir en silencio con un control para activar el sonido.
    - La opción de menor latencia del reproductor vuelve a estar disponible y permanece desactivada por defecto.

    El inicio de sesión de admin sigue siendo `/admin` con `admin` / `abc123`. Cámbielo tras el primer acceso.

    **Cambios de implementación en Olares**

    - Al actualizar desde un Owncast anterior en esta app se recrea el directorio temporal de stream para que el nuevo proceso pueda arrancar.

  fullDescription: |
    **Credenciales predeterminadas**
    AdminPath: /admin
    Username: admin
    Password: abc123

    **Resumen**
    Owncast es un servidor de streaming de vídeo en directo y chat de código abierto, autoalojado, descentralizado y para un solo usuario, para emitir streams al estilo de las grandes plataformas. Ofrece control total sobre tu contenido, interfaz, moderación y audiencia.

    **Funciones clave**
    Autoalojado e independiente
    - Control y propiedad totales de tu stream, para crear el contenido y la comunidad que quieras.

    Chat
    - El chat integrado sin fricción permite a tus espectadores formar parte de la acción. Incluye emotes personalizados y bots de chat para fomentar la participación.

    Funciona con tu software
    - Apunta tu software de emisión existente a tu servidor Owncast y empieza a emitir en tu propio servidor en minutos.

    El Fediverso
    - Tu directo puede llegar a más audiencia en el Fediverso, permitiendo seguir y compartir tu stream en Mastodon y otros servicios.

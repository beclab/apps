metadata:
  title: Owncast
  description: Serveur gratuit et open source de vidéo en direct et de chat web à utiliser avec les logiciels de diffusion populaires
spec:
  upgradeDescription: |
    Version amont : [Owncast 0.3.0](https://github.com/owncast/owncast/releases/tag/v0.3.0)

    **Nouveautés**

    - Featured streams peut afficher d'autres serveurs Owncast en direct après acceptation des deux côtés.
    - L'admin propose une section plugins pour parcourir et installer des plugins avec des permissions par plugin.
    - La lecture automatique peut rester désactivée, jouer avec le son si le navigateur l'autorise, ou jouer en sourdine avec une commande pour réactiver le son.
    - L'option de plus faible latence du lecteur est de nouveau disponible et reste désactivée par défaut.

    La connexion admin par défaut reste `/admin` avec `admin` / `abc123`. Modifiez-la après la première connexion.

    **Changements de déploiement Olares**

    - La mise à jour depuis une ancienne Owncast sur cette app recrée le répertoire temporaire de stream pour que le nouveau processus puisse démarrer.

  fullDescription: |
    **Identifiants par défaut**
    AdminPath: /admin
    Username: admin
    Password: abc123

    **Aperçu**
    Owncast est un serveur de streaming vidéo en direct et de chat open source, auto-hébergé, décentralisé et mono-utilisateur pour diffuser vos propres lives dans un style proche des grandes plateformes. Il offre une maîtrise totale de votre contenu, interface, modération et audience.

    **Fonctionnalités clés**
    Auto-hébergé et indépendant
    - Contrôle et propriété complets de votre stream, pour créer le contenu et la communauté que vous souhaitez.

    Chat
    - Le chat intégré sans friction permet à vos spectateurs de participer. Incluez des emotes personnalisées et des chat bots pour favoriser l'engagement.

    Fonctionne avec votre logiciel
    - Pointez votre logiciel de diffusion existant vers votre serveur Owncast et commencez à streamer sur votre propre serveur en quelques minutes.

    Le Fediverse
    - Votre live peut toucher un public plus large sur le Fediverse, permettant de suivre et de partager votre stream sur Mastodon et d'autres services.

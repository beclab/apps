metadata:
  title: Surya OCR 2
  description: "从文档图像和 PDF 中提取多语言文字"

spec:
  fullDescription: |
    Surya OCR 2 识别文档图像和 PDF 页面中的文字，将页面内容转换为文本，供兼容的 Olares 应用进一步处理。

    本应用使用 GGUF 格式的 Datalab Surya OCR 2 模型，需要受支持的 NVIDIA GPU。

    模型权重采用修改版 AI Pubs Open RAIL-M 许可。如果您或所属组织上一年度总营收或累计融资超过 500 万美元，除个人使用或研究外，使用将受到限制。许可还限制提供与 Datalab 竞争的产品或服务的主体使用。完整条款请参阅模型许可证；更广泛的授权请联系 Datalab。

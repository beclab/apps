metadata:
  title: Surya OCR 2
  description: "Extraction multilingue de texte à partir d’images de documents et de PDF"

spec:
  fullDescription: |
    Surya OCR 2 reconnaît le texte dans les images de documents et les pages PDF. Il transforme le contenu des pages en texte que les applications Olares compatibles peuvent traiter.

    Cette application utilise le modèle Surya OCR 2 de Datalab au format GGUF et nécessite un GPU NVIDIA pris en charge.

    Les poids du modèle sont soumis à une version modifiée de la licence AI Pubs Open RAIL-M. Sauf pour un usage personnel ou la recherche, l'utilisation par vous ou votre organisation est restreinte si le chiffre d'affaires brut de l'année précédente ou le financement total dépasse 5 millions de dollars US. La licence restreint aussi l'utilisation par les fournisseurs de produits ou services concurrents de Datalab. Consultez la licence du modèle pour les conditions complètes et contactez Datalab pour une licence plus étendue.

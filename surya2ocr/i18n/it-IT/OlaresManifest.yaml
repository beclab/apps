metadata:
  title: Surya OCR 2
  description: "Estrazione multilingue del testo da immagini di documenti e PDF"

spec:
  fullDescription: |
    Surya OCR 2 riconosce il testo nelle immagini di documenti e nelle pagine PDF, trasformandone il contenuto in testo che le applicazioni Olares compatibili possono elaborare ulteriormente.

    Questa app usa il modello Surya OCR 2 di Datalab in formato GGUF e richiede una GPU NVIDIA supportata.

    I pesi del modello usano una versione modificata della licenza AI Pubs Open RAIL-M. Salvo l'uso personale o per ricerca, l'utilizzo da parte vostra o della vostra organizzazione è limitato se i ricavi lordi dell'anno precedente o i finanziamenti totali superano 5 milioni di dollari USA. La licenza limita inoltre l'uso da parte di fornitori di prodotti o servizi concorrenti di Datalab. Consultare la licenza del modello per le condizioni complete e contattare Datalab per licenze più ampie.

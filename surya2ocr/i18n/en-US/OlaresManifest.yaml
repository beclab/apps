metadata:
  title: Surya OCR 2
  description: "Multilingual text extraction from document images and PDFs"

spec:
  fullDescription: |
    Surya OCR 2 recognizes text in document images and PDF pages, turning page content into text that compatible Olares applications can use for further processing.

    This app uses Datalab's Surya OCR 2 model in GGUF format and requires a supported NVIDIA GPU.

    The model weights use a modified AI Pubs Open RAIL-M license. Except for personal use or research, use by you or your organization is restricted if prior-year gross revenue or total funding exceeds US$5 million. The license also restricts use by providers of products or services that compete with Datalab. See the model license for the full terms and contact Datalab for broader licensing.

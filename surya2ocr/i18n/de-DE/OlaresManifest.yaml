metadata:
  title: Surya OCR 2
  description: "Mehrsprachige Textextraktion aus Dokumentbildern und PDFs"

spec:
  fullDescription: |
    Surya OCR 2 erkennt Text in Dokumentbildern und PDF-Seiten. Es wandelt Seiteninhalte in Text um, den kompatible Olares-Anwendungen weiterverarbeiten können.

    Diese App verwendet das Modell Surya OCR 2 von Datalab im GGUF-Format und benötigt eine unterstützte NVIDIA-GPU.

    Die Modellgewichte unterliegen einer modifizierten AI Pubs Open RAIL-M-Lizenz. Abgesehen von persönlicher Nutzung und Forschung ist die Nutzung durch Sie oder Ihre Organisation eingeschränkt, wenn der Bruttoumsatz des Vorjahres oder die gesamte Finanzierung 5 Millionen US-Dollar übersteigt. Die Lizenz beschränkt außerdem die Nutzung durch Anbieter von Produkten oder Diensten, die mit Datalab konkurrieren. Die vollständigen Bedingungen stehen in der Modelllizenz; für weitergehende Lizenzen wenden Sie sich an Datalab.

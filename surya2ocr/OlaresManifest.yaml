olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: surya2ocr
  icon: "https://app.cdn.olares.com/appstore/surya2ocr/icon.png"
  description: "Multilingual text extraction from document images and PDFs"
  appid: surya2ocr
  title: Surya OCR 2
  version: '1.0.13'
  categories:
    - AI
    - models
  tags:
    - ocr
sharedEntrances:
  - name: surya2ocr
    host: sharedentrances-api
    port: 0
    title: Surya OCR 2 API
    invisible: true
    authLevel: internal
    icon: "https://app.cdn.olares.com/appstore/surya2ocr/icon.png"
entrances:
  - name: ocrclient
    port: 8090
    host: download-svc
    title: Surya OCR 2
    icon: "https://app.cdn.olares.com/appstore/surya2ocr/icon.png"
    openMethod: window
    authLevel: internal
  - name: ocrapi
    port: 8090
    host: download-svc
    title: Surya OCR 2 API
    icon: "https://app.cdn.olares.com/appstore/surya2ocr/icon.png"
    invisible: true
    openMethod: window
    authLevel: internal
workloadReplicas:
  surya2ocr: 1
  llminit: 1
  ocradapter: 1
spec:
  onlyAdmin: true
  versionName: 'datalab-to/surya-ocr-2-gguf'
  fullDescription: |
    Surya OCR 2 recognizes text in document images and PDF pages, turning page content into text that compatible Olares applications can use for further processing.

    This app uses Datalab's Surya OCR 2 model in GGUF format and requires a supported NVIDIA GPU.

    The model weights use a modified AI Pubs Open RAIL-M license. Except for personal use or research, use by you or your organization is restricted if prior-year gross revenue or total funding exceeds US$5 million. The license also restricts use by providers of products or services that compete with Datalab. See the model license for the full terms and contact Datalab for broader licensing.
  developer: Datalab
  website: https://www.datalab.to/
  sourceCode: https://github.com/datalab-to/surya
  doc: https://huggingface.co/datalab-to/surya-ocr-2-gguf
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  license:
    - text: OpenRAIL
      url: https://huggingface.co/datalab-to/surya-ocr-2-gguf/blob/main/LICENSE
  accelerator:
    - mode: nvidia
      requiredCpu: "2"
      limitedCpu: "6"
      requiredMemory: "4Gi"
      limitedMemory: "8Gi"
      requiredDisk: "5Gi"
      limitedDisk: "50Gi"
      requiredGPUMemory: "10Gi"
      limitedGPUMemory: "11Gi"
    - mode: nvidia-gb10
      requiredCpu: "2"
      limitedCpu: "6"
      requiredMemory: "12Gi"
      limitedMemory: "16Gi"
      requiredDisk: "5Gi"
      limitedDisk: "50Gi"

  supportArch:
    - amd64
    - arm64

permission:
  appData: true
  appCache: true
  appCommon: true

middleware:
  redis:
    namespace: surya2ocr

options:
  apiTimeout: 0
  allowMultipleInstall: true
  LLMGatewaySupported: true
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system

envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://datalab-to/surya-ocr-2-gguf --include surya-2.gguf,hf://datalab-to/surya-ocr-2-gguf --include surya-2-mmproj.gguf"
    description: "Comma dual hf:// (main GGUF + mmproj). Each segment one --include so only the two GGUFs download."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "surya2"
    description: "OCRAdapter pipeline id (must be surya2)."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "ocr"
    options:
      - title: OCR
        value: ocr
  - envName: ENGINE_ARGS
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "-ngl 99 -c 16384 -n 4096 --image-min-tokens 1024"
    description: "llama.cpp flags on the engine Pod only (not llm-init). mmproj is auto-resolved next to the main GGUF."
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "10Gi"
    description: "Per-instance GPU memory (nvidia.com/gpumem). surya2 profile peak ~8.1Gi → 10Gi."
  - envName: LLAMACPP_CPU_REQUEST
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1250m"
  - envName: LLAMACPP_CPU_LIMIT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "4"
  - envName: LLAMACPP_MEMORY_REQUEST
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1Gi"
  - envName: LLAMACPP_MEMORY_LIMIT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "4Gi"
  - envName: OCR_PIPELINE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "surya2"
  - envName: OCR_MAX_INFLIGHT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1"
  - envName: OCR_PDF_STRATEGY
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "vision"
  - envName: OCR_DEFAULT_FORMAT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "text"
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    editable: true
    applyOnChange: true
    default: "info"
    options:
      - title: debug
        value: debug
      - title: info
        value: info
      - title: warn
        value: warn
      - title: error
        value: error

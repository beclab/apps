metadata:
  title: MongoDB 6.0
  description: Olares-Middleware für MongoDB
spec:
  fullDescription: |
    MongoDB ist eine beliebte dokumentenorientierte NoSQL-Datenbank zum Speichern und Abrufen von Daten. Sie bietet Skalierbarkeit, Flexibilität und hohe Leistung für moderne Anwendungen.

    Diese MongoDB-Middleware basiert auf Percona Server for MongoDB. Sie ist eine hoch skalierbare Datenbank, die vollständig mit MongoDB 6.0 Community Edition kompatibel ist.

    Die vollständige Liste der neuen Funktionen und Verbesserungen finden Sie in den Versionshinweisen zu MongoDB 6.0 Community Edition: https://www.mongodb.com/docs/v6.0/release-notes/6.0/.
  upgradeDescription: |
    Upgrade von mongodb auf Version 6.0.21

    Die von MongoDB Community Edition bereitgestellten und in Percona Server for MongoDB enthaltenen Fehlerkorrekturen sind:
    - SERVER-94405 - Automatische Aufteilung der Sitzungssammlung beim Downgrade auf Version 5.0.x und beim Festlegen der Feature Compatibility Version (FCV) auf 5.0 wieder aktiviert
    - SERVER-96252 - Problem beim Upgrade auf eine neue FCV behoben, wenn Bereichslöschaufgaben und kein gehashter Shard-Key-Index vorhanden sind, indem die Anzahl verwaister Dokumente auf null gesetzt wird
    - SERVER-98720 - Schwärzung des BSON-Befehls für Warnprotokolle vom Typ "Plan executor error" hinzugefügt, damit nicht der gesamte Befehlstext (möglicherweise einschließlich PII) in die Protokolle gelangt
    - SERVER-100594 - JSON-Rekursion auf 200 Ebenen begrenzt
    - SERVER-101298 - Abruf von Datenbank- und Sammlungssperren beim Abruf der globalen Sperre in der Komprimierung entfernt
    - SERVER-97842 - Problem mit Spitzen der MongoDB-CPU-Auslastung bei einer neueren OpenSSL-Version unter RHEL 9 behoben

    Die vollständige Änderungsliste finden Sie unter: https://www.mongodb.com/docs/v6.0/release-notes/6.0-changelog/#6.0.21-changelog

    Änderungsprotokoll
    Neue Funktionen:
    - PSMDB-1282 - Konfigurationsdateioption security.kmip.useLegacyProtocol hinzugefügt, um die Migration von MongoDB Enterprise Edition zu Percona Server for MongoDB zu vereinfachen

    Verbesserungen:
    - PSMDB-1620 - Keine leere Audit-Protokolldatei erstellen, wenn das Protokollziel nicht file ist
    - PSMDB-1621 - Prüfen, ob eine Audit-Protokolldatei am Standardpfad zum Schreiben geöffnet werden kann

    Behobene Fehler:
    - PSMDB-118 - Dateierweiterung des Audit-Protokolls wird jetzt entsprechend dem angegebenen Audit-Protokollformat erstellt.
    - PSMDB-121 - Problem behoben, bei dem der Server keine Audit-Protokolldatei am vom Benutzer angegebenen Pfad erstellen konnte, wenn der Prozess geforkt und ein relativer Pfad angegeben wurde; der Pfad wird nun in einen absoluten Pfad konvertiert
    - PSMDB-1227 - Festlegen eines Distinguished Name(DN)-Werts im Attributteil der LDAP-Abfrage ermöglicht
    - PSMDB-1392 - Sichergestellt, dass $backupCursor oplogEnd ohne Lücken zurückgibt (Vielen Dank an MingTotti Guoming He für die Meldung dieses Problems)
    - PSMDB-1614 - Fest codierte Portnummer in percona-server-enable-authentication.sh durch einen Platzhalter ersetzt
    - PSMDB-1617 - Fehlermeldungen bei unzureichenden Berechtigungen für den Zugriff auf Client-/CA-Zertifikate für die KMIP-Authentifizierung verbessert

    Die vollständigen Versionshinweise zu Percona Server for MongoDB finden Sie unter: https://docs.percona.com/percona-server-for-mongodb/6.0/release_notes/6.0.21-18.html

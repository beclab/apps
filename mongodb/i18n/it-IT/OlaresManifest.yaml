metadata:
  title: MongoDB 6.0
  description: Middleware Olares per MongoDB
spec:
  fullDescription: |
    MongoDB è un noto database NoSQL orientato ai documenti, utilizzato per archiviare e recuperare dati. È progettato per offrire scalabilità, flessibilità e prestazioni elevate alle applicazioni moderne.

    Questo middleware MongoDB è basato su Percona Server for MongoDB. È un database altamente scalabile e completamente compatibile con MongoDB 6.0 Community Edition.

    L'elenco completo delle nuove funzionalità e dei miglioramenti è disponibile nelle note di rilascio di MongoDB 6.0 Community Edition: https://www.mongodb.com/docs/v6.0/release-notes/6.0/.
  upgradeDescription: |
    Aggiornamento di mongodb alla versione 6.0.21

    Le correzioni fornite da MongoDB Community Edition e incluse in Percona Server for MongoDB sono le seguenti:
    - SERVER-94405 - Riattivata la suddivisione automatica della raccolta delle sessioni durante il downgrade alla versione 5.0.x e l'impostazione di Feature Compatibility Version (FCV) su 5.0
    - SERVER-96252 - Risolto il problema di aggiornamento a una nuova FCV in presenza di attività di eliminazione intervalli e senza un indice hash della chiave shard, impostando a zero il numero di documenti orfani
    - SERVER-98720 - Aggiunta la redazione del comando BSON per i log di avviso "Plan executor error", per evitare che l'intero testo del comando (potenzialmente comprendente PII) finisca nei log
    - SERVER-100594 - Limitata la ricorsione JSON a 200 livelli
    - SERVER-101298 - Rimossa l'acquisizione dei lock di database e raccolte durante l'acquisizione del lock globale nella compattazione
    - SERVER-97842 - Risolto il problema dei picchi di utilizzo della CPU di MongoDB con una versione più recente di OpenSSL su RHEL 9

    L'elenco completo delle modifiche è disponibile in: https://www.mongodb.com/docs/v6.0/release-notes/6.0-changelog/#6.0.21-changelog

    Registro delle modifiche
    Nuove funzionalità:
    - PSMDB-1282 - Aggiunta l'opzione del file di configurazione security.kmip.useLegacyProtocol per semplificare la migrazione da MongoDB Enterprise Edition a Percona Server for MongoDB

    Miglioramenti:
    - PSMDB-1620 - Non creare un file di audit log vuoto se la destinazione del log non è file
    - PSMDB-1621 - Verificare se un file di audit log può essere aperto in scrittura nel percorso predefinito

    Bug corretti:
    - PSMDB-118 - Corretta l'estensione del file di audit log affinché venga creata in base al formato di audit log specificato.
    - PSMDB-121 - Risolto il problema per cui il server non riusciva a creare un file di audit log nel percorso indicato dall'utente quando il processo era sottoposto a fork e veniva fornito un percorso relativo, convertendolo in un percorso assoluto
    - PSMDB-1227 - Consentita l'impostazione di un valore Distinguished Name(DN) nella parte degli attributi della query LDAP
    - PSMDB-1392 - Garantito che $backupCursor restituisca oplogEnd senza interruzioni (grazie a MingTotti Guoming He per aver segnalato il problema)
    - PSMDB-1614 - Sostituito un numero di porta hardcoded con un segnaposto in percona-server-enable-authentication.sh
    - PSMDB-1617 - Migliorati i messaggi di errore quando le autorizzazioni non sono sufficienti per accedere ai certificati client/CA per l'autenticazione KMIP

    Le note di rilascio complete di Percona Server for MongoDB sono disponibili in: https://docs.percona.com/percona-server-for-mongodb/6.0/release_notes/6.0.21-18.html

metadata:
  title: MongoDB 6.0
  description: Middleware Olares pour MongoDB
spec:
  fullDescription: |
    MongoDB est une base de données NoSQL orientée document très répandue, utilisée pour stocker et récupérer des données. Elle est conçue pour offrir évolutivité, flexibilité et hautes performances aux applications modernes.

    Ce middleware MongoDB repose sur Percona Server for MongoDB. Il s'agit d'une base de données hautement évolutive et entièrement compatible avec MongoDB 6.0 Community Edition.

    Vous trouverez la liste complète des nouvelles fonctionnalités et améliorations dans les notes de version de MongoDB 6.0 Community Edition : https://www.mongodb.com/docs/v6.0/release-notes/6.0/.
  upgradeDescription: |
    Mise à niveau de mongodb vers la version 6.0.21

    Les corrections fournies par MongoDB Community Edition et incluses dans Percona Server for MongoDB sont les suivantes :
    - SERVER-94405 - Réactivation du fractionnement automatique de la collection des sessions lors du retour à la version 5.0.x et du réglage de Feature Compatibility Version (FCV) sur 5.0
    - SERVER-96252 - Correction du problème de mise à niveau vers une nouvelle FCV lorsque des tâches de suppression de plage sont présentes sans index de clé de partition hachée, en définissant le nombre de documents orphelins sur zéro
    - SERVER-98720 - Ajout de la rédaction de la commande BSON dans les journaux d'avertissement "Plan executor error" afin d'éviter que le texte intégral de la commande (pouvant contenir des PII) ne se retrouve dans les journaux
    - SERVER-100594 - Limitation de la récursion JSON à 200 niveaux
    - SERVER-101298 - Suppression de l'acquisition des verrous de base de données et de collection lors de l'acquisition du verrou global pendant la compaction
    - SERVER-97842 - Correction des pics d'utilisation du processeur par MongoDB avec une version plus récente d'OpenSSL sous RHEL 9

    Consultez la liste complète des modifications sur : https://www.mongodb.com/docs/v6.0/release-notes/6.0-changelog/#6.0.21-changelog

    Journal des modifications
    Nouvelles fonctionnalités :
    - PSMDB-1282 - Ajout de l'option de configuration security.kmip.useLegacyProtocol afin de simplifier la migration de MongoDB Enterprise Edition vers Percona Server for MongoDB

    Améliorations :
    - PSMDB-1620 - Ne pas créer de fichier de journal d'audit vide si la destination du journal n'est pas file
    - PSMDB-1621 - Vérifier qu'un fichier de journal d'audit peut être ouvert en écriture au chemin par défaut

    Corrections de bugs :
    - PSMDB-118 - Correction de l'extension du fichier de journal d'audit afin qu'elle corresponde au format de journal d'audit spécifié.
    - PSMDB-121 - Correction de l'échec de création d'un fichier de journal d'audit au chemin fourni par l'utilisateur lorsque le processus est forké et qu'un chemin relatif est fourni, en le convertissant en chemin absolu
    - PSMDB-1227 - Autorisation de définir une valeur Distinguished Name(DN) dans la partie attributs de la requête LDAP
    - PSMDB-1392 - Garantie que $backupCursor renvoie oplogEnd sans trous (merci à MingTotti Guoming He d'avoir signalé ce problème)
    - PSMDB-1614 - Remplacement d'un numéro de port codé en dur par un espace réservé dans percona-server-enable-authentication.sh
    - PSMDB-1617 - Amélioration des messages d'erreur lorsque les autorisations d'accès aux certificats client/CA pour l'authentification KMIP sont insuffisantes

    Consultez les notes de version complètes de Percona Server for MongoDB sur : https://docs.percona.com/percona-server-for-mongodb/6.0/release_notes/6.0.21-18.html

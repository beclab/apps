metadata:
  title: MongoDB 6.0
  description: MongoDB 向け Olares ミドルウェア
spec:
  fullDescription: |
    MongoDB は、データの保存と取得に使用される、広く普及したドキュメント指向の NoSQL データベースです。最新のアプリケーションにスケーラビリティ、柔軟性、高いパフォーマンスを提供するよう設計されています。

    この MongoDB ミドルウェアは Percona Server for MongoDB をベースにしています。MongoDB 6.0 Community Edition と完全に互換性のある、拡張性の高いデータベースです。

    新機能と改善点の完全な一覧は、MongoDB 6.0 Community Edition のリリースノートで確認できます： https://www.mongodb.com/docs/v6.0/release-notes/6.0/
  upgradeDescription: |
    mongodb をバージョン 6.0.21 にアップグレード

    MongoDB Community Edition から提供され、Percona Server for MongoDB に含まれるバグ修正は次のとおりです。
    - SERVER-94405 - バージョン 5.0.x にダウングレードし、Feature Compatibility Version (FCV) を 5.0 に設定した際、セッションコレクションの自動分割を再有効化
    - SERVER-96252 - 範囲削除タスクがあり、ハッシュ化されたシャードキーインデックスがない場合の新しい FCV へのアップグレード問題を、孤立ドキュメント数をゼロに設定することで修正
    - SERVER-98720 - コマンドテキスト全体（PII を含む可能性あり）がログに残らないよう、"Plan executor error" 警告ログの BSON コマンドを編集する処理を追加
    - SERVER-100594 - JSON の再帰を 200 レベルに制限
    - SERVER-101298 - コンパクションでグローバルロックを取得する際のデータベースおよびコレクションロックの取得を削除
    - SERVER-97842 - RHEL 9 上で新しいバージョンの OpenSSL を使用した場合に MongoDB の CPU 使用率が急上昇する問題を修正

    変更の完全な一覧：https://www.mongodb.com/docs/v6.0/release-notes/6.0-changelog/#6.0.21-changelog

    変更履歴
    新機能：
    - PSMDB-1282 - MongoDB Enterprise Edition から Percona Server for MongoDB への移行を簡素化するため、security.kmip.useLegacyProtocol 設定ファイルオプションを追加

    改善：
    - PSMDB-1620 - ログの出力先が file でない場合、空の監査ログファイルを作成しない
    - PSMDB-1621 - デフォルトパスで監査ログファイルを書き込み用に開けるか確認

    修正されたバグ：
    - PSMDB-118 - 指定された監査ログ形式に基づいて監査ログファイルの拡張子が作成されるよう修正。
    - PSMDB-121 - プロセスが fork され、相対パスが指定された場合に、ユーザー指定パスへ監査ログファイルを作成できない問題を、絶対パスへ変換することで修正
    - PSMDB-1227 - LDAP クエリの属性部分に Distinguished Name(DN) 値を設定できるよう変更
    - PSMDB-1392 - $backupCursor が欠落のない oplogEnd を返すよう保証（問題を報告してくださった MingTotti Guoming He 氏に感謝します）
    - PSMDB-1614 - percona-server-enable-authentication.sh のハードコードされたポート番号をプレースホルダーに置換
    - PSMDB-1617 - KMIP 認証用のクライアント/CA 証明書へアクセスする権限が不足している場合のエラーメッセージを改善

    Percona Server for MongoDB の完全なリリースノート：https://docs.percona.com/percona-server-for-mongodb/6.0/release_notes/6.0.21-18.html

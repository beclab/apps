metadata:
  title: MongoDB 6.0
  description: Middleware de Olares para MongoDB
spec:
  fullDescription: |
    MongoDB es una popular base de datos NoSQL orientada a documentos que se utiliza para almacenar y recuperar datos. Está diseñada para proporcionar escalabilidad, flexibilidad y alto rendimiento a las aplicaciones modernas.

    Este middleware de MongoDB se basa en Percona Server for MongoDB. Es una base de datos altamente escalable y totalmente compatible con MongoDB 6.0 Community Edition.

    Puede consultar la lista completa de nuevas funciones y mejoras en las notas de la versión de MongoDB 6.0 Community Edition: https://www.mongodb.com/docs/v6.0/release-notes/6.0/.
  upgradeDescription: |
    Actualización de mongodb a la versión 6.0.21

    Las correcciones de errores proporcionadas por MongoDB Community Edition e incluidas en Percona Server for MongoDB son las siguientes:
    - SERVER-94405 - Se volvió a habilitar la división automática de la colección de sesiones al volver a la versión 5.0.x y establecer la Feature Compatibility Version (FCV) en 5.0
    - SERVER-96252 - Se corrigió el problema al actualizar a una nueva FCV cuando hay tareas de eliminación de rangos y no existe un índice de clave de fragmentación con hash, estableciendo en cero el número de documentos huérfanos
    - SERVER-98720 - Se añadió la ocultación del comando BSON en los registros de advertencia "Plan executor error" para evitar que el texto completo del comando (posiblemente con PII) termine en los registros
    - SERVER-100594 - Se limitó la recursión JSON a 200 niveles
    - SERVER-101298 - Se eliminó la adquisición de bloqueos de bases de datos y colecciones al adquirir el bloqueo global durante la compactación
    - SERVER-97842 - Se corrigieron los picos de uso de CPU de MongoDB con una versión más reciente de OpenSSL en RHEL 9

    Consulte la lista completa de cambios en: https://www.mongodb.com/docs/v6.0/release-notes/6.0-changelog/#6.0.21-changelog

    Registro de cambios
    Nuevas funciones:
    - PSMDB-1282 - Se añadió la opción de configuración security.kmip.useLegacyProtocol para simplificar la migración de MongoDB Enterprise Edition a Percona Server for MongoDB

    Mejoras:
    - PSMDB-1620 - No crear un archivo de registro de auditoría vacío si el destino del registro no es file
    - PSMDB-1621 - Comprobar si se puede abrir un archivo de registro de auditoría para escritura en la ruta predeterminada

    Errores corregidos:
    - PSMDB-118 - Se corrigió la extensión del archivo de registro de auditoría para que se cree según el formato de registro especificado.
    - PSMDB-121 - Se corrigió el fallo del servidor al crear un archivo de registro de auditoría en la ruta indicada por el usuario cuando el proceso se bifurca y se proporciona una ruta relativa, convirtiéndola en una ruta absoluta
    - PSMDB-1227 - Se permitió establecer un valor Distinguished Name(DN) en la parte de atributos de la consulta LDAP
    - PSMDB-1392 - Se garantizó que $backupCursor devuelva oplogEnd sin huecos (gracias a MingTotti Guoming He por informar del problema)
    - PSMDB-1614 - Se sustituyó un número de puerto fijo por un marcador de posición en percona-server-enable-authentication.sh
    - PSMDB-1617 - Se mejoraron los mensajes de error cuando los permisos son insuficientes para acceder a certificados de cliente/CA para la autenticación KMIP

    Consulte las notas completas de Percona Server for MongoDB en: https://docs.percona.com/percona-server-for-mongodb/6.0/release_notes/6.0.21-18.html

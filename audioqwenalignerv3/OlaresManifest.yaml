olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audioqwenalignerv3
  icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
  description: A model for matching transcript words to their times in a recording
  appid: audioqwenalignerv3
  title: Qwen3 Forced Aligner
  version: '1.0.28'
  categories:
    - AI
    - models
  tags:
  - audio

# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audioqwenalignerv3api
    host: sharedentrances-api
    port: 0
    title: Qwen3 Forced Aligner API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audioqwenalignerv3
    port: 8090
    host: download-svc
    title: Qwen3 Forced Aligner
    icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audioqwenalignerv3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'Qwen/Qwen3-ForcedAligner-0.6B'
  fullDescription: |
    Qwen3 Forced Aligner takes an audio recording and its existing transcript, then marks the start and end time of each word. It synchronizes known text with speech; it does not create a transcript by itself.

    **Key features**
    - Match transcript words to positions in an audio recording.
    - Produce word-level timestamps for supported languages.
    - Support subtitle and transcript synchronization.
    - Make alignment available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `4Gi` of GPU memory is required.

  developer: Alibaba
  website: https://qwen.ai/
  sourceCode: https://huggingface.co/Qwen/Qwen3-ForcedAligner-0.6B
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  doc: https://huggingface.co/Qwen/Qwen3-ForcedAligner-0.6B
  license:
    - text: Apache-2.0
      url: https://huggingface.co/Qwen/Qwen3-ForcedAligner-0.6B

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "20Gi"
      requiredMemory: "2304Mi"
      requiredGPUMemory: "4Gi"
      limitedGPUMemory: "4Gi"
    - mode: nvidia-gb10
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "8Gi"
      requiredMemory: "4352Mi"
    - mode: intel
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "20Gi"
      requiredMemory: "2304Mi"
    - mode: intel-gpu
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "20Gi"
      requiredMemory: "2304Mi"
      requiredGPUMemory: "4Gi"
      limitedGPUMemory: "4Gi"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://Qwen/Qwen3-ForcedAligner-0.6B"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "Qwen/Qwen3-ForcedAligner-0.6B"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "align"
    multiSelect: true
    splitter: ","
    options:
    - title: Align (forced alignment)
      value: align
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4Gi"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "16Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
    description: "Engine image override. Left empty, nvidia and nvidia-gb10 use
      docker.io/beclab/audio-qwen:v1.1.28; intel and intel-gpu use
      docker.io/beclab/audio-qwen-ov:v1.1.29. Filling this REPLACES that choice for every mode."
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    description: "Engine-native flags (llm-init ENGINE_ARGS); unset lets the image decide,
      except on the integrated GPU (mode intel, not intel-gpu) when the smallest node reports
      under 48Gi of memory: an empty box then becomes --align-batch off, one span a call.
      Arc is discrete and keeps batching on. At 48Gi or more, on any other mode, or when the
      total cannot be read, an empty box leaves batching on. Whatever is here REPLACES the whole list, so carry
      existing flags over when adding one.
      The forced aligner reads: --align-batch (on; group several spans into one model call),
      --no-kv-cache (off; the checkpoint builds a cache nothing reads), --gpu-budget-fraction
      (0.5; the share of the remaining grant one call may reach for) and --max-span-seconds
      (300; the longest span the model can put a timestamp on). Grouping is on by default: it
      moves a small number of timestamps by one or two 80 ms cells, leaving the words and the
      segment count unchanged. Write --align-batch off for one span a call. Switches take 1,
      true, yes or on, or 0, false, no or off; any other value falls back to the default and
      says so in the startup log."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN

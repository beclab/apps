metadata:
  description: 録音内の単語と発話時刻を対応付けるモデル
  title: Qwen3 Forced Aligner

spec:
  fullDescription: |
    Qwen3 Forced Alignerは、音声録音と既存の文字起こしを受け取り、各単語の開始時刻と終了時刻を示します。既知のテキストと音声を同期するモデルであり、文字起こし自体は作成しません。

    **主な機能**
    - 文字起こしの単語を録音内の位置に対応付けます。
    - 対応言語で単語単位のタイムスタンプを生成します。
    - 字幕と文字起こしの同期を支援します。
    - 対応するOlaresアプリからアラインメント機能を利用できます。

    `4Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。

metadata:
  description: Un modelo para asociar las palabras de una transcripción con sus tiempos en una grabación
  title: Qwen3 Forced Aligner

spec:
  fullDescription: |
    Qwen3 Forced Aligner recibe una grabación de audio y su transcripción existente, y marca el inicio y el final de cada palabra. Sincroniza texto conocido con el habla; no genera una transcripción por sí mismo.

    **Funciones principales**
    - Asociar las palabras de la transcripción con posiciones de una grabación.
    - Producir marcas de tiempo por palabra para los idiomas compatibles.
    - Facilitar la sincronización de subtítulos y transcripciones.
    - Poner la alineación a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `4Gi` de memoria gráfica.

metadata:
  description: Un modèle qui associe les mots d'une transcription à leur position temporelle dans un enregistrement
  title: Qwen3 Forced Aligner

spec:
  fullDescription: |
    Qwen3 Forced Aligner reçoit un enregistrement audio et sa transcription existante, puis indique le début et la fin de chaque mot. Il synchronise un texte connu avec la parole ; il ne produit pas lui-même de transcription.

    **Fonctionnalités principales**
    - Associer les mots de la transcription à leur position dans un enregistrement.
    - Produire des horodatages au niveau des mots pour les langues prises en charge.
    - Faciliter la synchronisation des sous-titres et des transcriptions.
    - Mettre l'alignement à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `4Gi` de mémoire vidéo est requis.

metadata:
  description: A model for matching transcript words to their times in a recording
  title: Qwen3 Forced Aligner

spec:
  fullDescription: |
    Qwen3 Forced Aligner takes an audio recording and its existing transcript, then marks the start and end time of each word. It synchronizes known text with speech; it does not create a transcript by itself.

    **Key features**
    - Match transcript words to positions in an audio recording.
    - Produce word-level timestamps for supported languages.
    - Support subtitle and transcript synchronization.
    - Make alignment available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `4Gi` of GPU memory is required.

metadata:
  description: 用于匹配录音中词语及其时间位置的模型
  title: Qwen3 Forced Aligner

spec:
  fullDescription: |
    Qwen3 Forced Aligner 接收音频录音及其现有文本，并标记每个词语的开始和结束时间。它用于同步已有文本与语音，不能自行生成转写文本。

    **主要功能**
    - 将文本中的词语与录音位置对应。
    - 为支持的语言生成词级时间戳。
    - 支持字幕和转写文本同步。
    - 向兼容的 Olares 应用提供对齐能力。

    需要配备至少 `4Gi` 显存的兼容 NVIDIA GPU。

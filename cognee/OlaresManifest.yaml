olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: cognee
  appid: cognee
  title: Cognee
  description: Build searchable knowledge graphs from documents and text
  icon: https://cdn.olares.com/images/2026/10/f18eb997b74cd4b8d7afb7049f2a588f.png
  version: 0.0.8
  categories:
  - AI
  - workspace
entrances:
- name: cognee
  host: cognee
  port: 3000
  title: Cognee
  icon: https://cdn.olares.com/images/2026/10/f18eb997b74cd4b8d7afb7049f2a588f.png
  authLevel: private
  openMethod: window
spec:
  versionName: 1.6.5-local
  developer: Cognee
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  requiredCpu: 300m
  limitedCpu: '4'
  requiredMemory: 1280Mi
  limitedMemory: 10Gi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  locale:
  - en-US
  - zh-CN
  fullDescription: 'Cognee turns text and documents into connected knowledge that
    you can search and explore. This package includes the web interface and API. Set
    a password during installation and sign in as default_user@example.com.


    AI Router default-chat is used for language tasks. A small embedding model runs
    locally inside Cognee and is downloaded on first use. Relational records use Olares
    PostgreSQL; uploaded data, graph files, vector indexes and model cache persist
    in application storage.


    This package pins an upstream development image. Initial model downloads can delay
    processing. Processing uses CPU and does not require a dedicated GPU.'
  website: https://github.com/topoteretes/cognee
  sourceCode: https://github.com/topoteretes/cognee
  license:
  - text: Apache-2.0
    url: https://github.com/topoteretes/cognee/blob/main/LICENSE
  featuredImage: https://cdn.olares.com/images/2026/10/e23764639d686484b849c1ddb9c872b8.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/e23764639d686484b849c1ddb9c872b8.png
  - https://cdn.olares.com/images/2026/10/4940bd1c0201211582d8ee2931235ae0.png
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: router
    type: application
    version: '>=1.0.0'
workloadReplicas:
  cognee: 1
middleware:
  postgres:
    username: cognee
    databases:
    - name: cognee
envs:
- envName: DEFAULT_USER_PASSWORD
  type: password
  required: true
  editable: false
  regex: ^.{12,}$
  description: Initial Cognee password, at least 12 characters. Sign in as default_user@example.com.
    Existing account passwords are preserved on upgrade.

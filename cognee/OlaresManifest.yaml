olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: cognee
  appid: cognee
  title: Cognee
  description: Build searchable knowledge graphs from documents and text
  icon: https://cdn.olares.com/images/2026/10/f18eb997b74cd4b8d7afb7049f2a588f.png
  version: 0.0.17
  categories:
  - AI
  - workspace
entrances:
- name: cognee
  host: cognee
  port: 3000
  title: Cognee
  icon: https://cdn.olares.com/images/2026/10/f18eb997b74cd4b8d7afb7049f2a588f.png
  authLevel: private
  openMethod: window
- name: api
  host: cognee
  port: 3001
  title: Cognee Agent API
  authLevel: internal
  invisible: true
  openMethod: default
- name: mcp
  host: cognee
  port: 3002
  title: Cognee MCP
  authLevel: internal
  invisible: true
  openMethod: default
spec:
  versionName: 1.6.6
  developer: Cognee
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  requiredCpu: 390m
  limitedCpu: '5.4'
  requiredMemory: 1600Mi
  limitedMemory: 11904Mi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  locale:
  - de-DE
  - en-US
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  - zh-CN
  fullDescription: 'Cognee turns text and documents into connected knowledge that
    you can search and explore. This package includes the web interface and API. Set
    a password with at least 12 characters during installation and sign in as default_user@example.com.
    Existing account passwords are preserved on upgrade.


    AI Router default-chat is used for language tasks. A small embedding model runs
    locally inside Cognee and is downloaded on first use. Relational records use Olares
    PostgreSQL; uploaded data, graph files, vector indexes and model cache persist
    in application storage.


    This package uses Cognee 1.6.6 and includes the official MCP server for assistant connections. Initial model downloads can delay
    processing. Processing uses CPU and does not require a dedicated GPU.


    MCP connections within Olares do not require a client API key by default and use default_user@example.com. Connected assistants share the permissions of this account, including adding and deleting knowledge. To require a client key, set MCP_AUTH_ENABLED to true in Settings and set MCP_API_KEY to a Cognee API key. Clients must send the same key in X-Api-Key.'
  website: https://github.com/topoteretes/cognee
  sourceCode: https://github.com/topoteretes/cognee
  license:
  - text: Apache-2.0
    url: https://github.com/topoteretes/cognee/blob/main/LICENSE
  featuredImage: https://cdn.olares.com/images/2026/10/e23764639d686484b849c1ddb9c872b8.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/e23764639d686484b849c1ddb9c872b8.png
  - https://cdn.olares.com/images/2026/10/4940bd1c0201211582d8ee2931235ae0.png
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: router
    type: application
    version: '>=1.0.0'
workloadReplicas:
  cognee: 1
middleware:
  postgres:
    username: cognee
    databases:
    - name: cognee
envs:
- envName: DEFAULT_USER_PASSWORD
  type: password
  required: true
  editable: false
  regex: ^.{12,}$
  description: Initial Cognee password, at least 12 characters. Sign in as default_user@example.com.
    Existing account passwords are preserved on upgrade.
- envName: MCP_API_KEY
  type: password
  required: false
  editable: true
  applyOnChange: true
  default: ''
  description: Required when MCP_AUTH_ENABLED is true. Create a Cognee API key and enter it here. MCP clients must send the same key in X-Api-Key. Ignored when client authentication is disabled.

- envName: MCP_AUTH_ENABLED
  type: bool
  required: false
  editable: true
  applyOnChange: true
  default: 'false'
  description: Require X-Api-Key for MCP clients. Disabled by default for internal Olares connections.

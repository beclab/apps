apiVersion: v1
kind: ConfigMap
metadata:
  name: cognee-agent-api
  namespace: {{ .Release.Namespace | quote }}
data:
  nginx.conf: |
    pid /tmp/agent-api-nginx.pid;
    error_log /dev/stderr;
    events { worker_connections 128; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/agent-api-body;
      proxy_temp_path /tmp/agent-api-proxy;
      fastcgi_temp_path /tmp/agent-api-fastcgi;
      uwsgi_temp_path /tmp/agent-api-uwsgi;
      scgi_temp_path /tmp/agent-api-scgi;
      server {
        listen 8082;
        client_max_body_size 145m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        location /api/v1/ { proxy_pass http://127.0.0.1:8000; }
        location / { return 404; }
      }
    }

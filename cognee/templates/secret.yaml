{{- $existing := lookup "v1" "Secret" .Release.Namespace "cognee-app" -}}
apiVersion: v1
kind: Secret
metadata:
  name: cognee-app
  namespace: {{ .Release.Namespace | quote }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  DEFAULT_USER_PASSWORD: {{ if and $existing $existing.data (index $existing.data "DEFAULT_USER_PASSWORD") }}{{ index $existing.data "DEFAULT_USER_PASSWORD" | b64dec | quote }}{{ else }}{{ .Values.olaresEnv.DEFAULT_USER_PASSWORD | default (randAlphaNum 32) | quote }}{{ end }}
  {{- range $key := list "FASTAPI_USERS_JWT_SECRET" "FASTAPI_USERS_RESET_PASSWORD_TOKEN_SECRET" "FASTAPI_USERS_VERIFICATION_TOKEN_SECRET" }}
  {{ $key }}: {{ if and $existing $existing.data (index $existing.data $key) }}{{ index $existing.data $key | b64dec | quote }}{{ else }}{{ randAlphaNum 64 | quote }}{{ end }}
  {{- end }}

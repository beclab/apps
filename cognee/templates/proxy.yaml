apiVersion: v1
kind: ConfigMap
metadata:
  name: cognee-proxy
  namespace: {{ .Release.Namespace | quote }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {worker_connections 1024;}
    http {
      include /etc/nginx/mime.types;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 100m;
      gzip on;
      gzip_min_length 512;
      gzip_proxied any;
      gzip_vary on;
      gzip_types application/json application/javascript text/css text/plain image/svg+xml;
      server {
        listen 8080;
        location /api/v1/ {proxy_pass http://127.0.0.1:8000; proxy_read_timeout 1800s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;}
        location /health {proxy_pass http://127.0.0.1:8000;}
        location /api/runtime-config {default_type application/json; return 200 '{"backendUrl":"https://{{ .Values.domain.cognee }}"}';}
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_set_header Host $host;
          proxy_set_header Accept-Encoding "";
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          sub_filter_once off;
          sub_filter 'http://127.0.0.1:8000' 'https://{{ .Values.domain.cognee }}';
        }
      }
    }

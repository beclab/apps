apiVersion: v1
kind: ConfigMap
metadata:
  name: cognee-proxy
  namespace: {{ .Release.Namespace | quote }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {worker_connections 1024;}
    http {
      include /etc/nginx/mime.types;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 100m;
      gzip on;
      gzip_min_length 512;
      gzip_proxied any;
      gzip_vary on;
      gzip_types application/json application/javascript text/css text/plain image/svg+xml;
      server {
        listen 8080;
        # Some upstream local-mode components still bake the API origin into JS.
        # Rewrite both forms in HTML and scripts before sending them to browsers.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/json;
        sub_filter 'http://127.0.0.1:8000' 'https://{{ .Values.domain.cognee }}';
        sub_filter 'http://localhost:8000' 'https://{{ .Values.domain.cognee }}';
        location /api/v1/ {proxy_pass http://127.0.0.1:8000; proxy_read_timeout 1800s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;}
        location = /docs {proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;}
        location = /docs/oauth2-redirect {proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;}
        location = /openapi.json {proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;}
        location /health {proxy_pass http://127.0.0.1:8000;}
        location /api/runtime-config {default_type application/json; return 200 '{"backendUrl":"https://{{ .Values.domain.cognee }}"}';}
        location ^~ /_next/static/ {
          proxy_pass http://127.0.0.1:3000;
          proxy_set_header Host $host;
          proxy_set_header Accept-Encoding "";
          # The rewritten assets depend on this installation's domain.
          proxy_hide_header Cache-Control;
          add_header Cache-Control "no-store" always;
        }
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_set_header Host $host;
          proxy_set_header Accept-Encoding "";
          proxy_http_version 1.1;
          proxy_set_header Connection "";
        }
      }
    }

metadata:
  title: Cognee
  description: Créer des graphes de connaissances interrogeables à partir de documents et de textes
spec:
  fullDescription: 'Cognee transforme les textes et les documents en connaissances reliées que vous pouvez rechercher et explorer. Ce paquet comprend l’interface web et l’API. Lors de l’installation, définissez un mot de passe d’au moins 12 caractères et connectez-vous avec default_user@example.com. Les mots de passe des comptes existants sont conservés lors des mises à niveau.


    Les tâches linguistiques utilisent AI Router default-chat. Un petit modèle d’embeddings s’exécute localement dans Cognee et est téléchargé à la première utilisation. Les données relationnelles utilisent Olares PostgreSQL ; les données importées, les fichiers de graphe, les index vectoriels et le cache des modèles sont conservés dans le stockage de l’application.


    Ce paquet utilise Cognee 1.6.6 et inclut le serveur MCP officiel pour les assistants. Les téléchargements initiaux des modèles peuvent retarder le traitement. Le traitement utilise le CPU et ne nécessite pas de GPU dédié.


    Par défaut, les connexions MCP au sein d’Olares ne nécessitent pas de clé API côté client et utilisent default_user@example.com. Les assistants connectés partagent les autorisations de ce compte, y compris l’ajout et la suppression de connaissances. Pour exiger une clé côté client, définissez MCP_AUTH_ENABLED sur true dans les paramètres et renseignez une clé API Cognee dans MCP_API_KEY. Les clients doivent envoyer la même clé via X-Api-Key.'

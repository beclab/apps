metadata:
  title: Cognee
  description: 从文档和文本构建可搜索的知识图谱
spec:
  fullDescription: 'Cognee 将文本和文档转化为相互关联的知识，支持搜索和浏览。本应用包含网页界面和 API。安装时设置密码，使用 default_user@example.com
    登录。


    语言任务使用 AI Router 的 default-chat。小型嵌入模型在 Cognee 内本地运行，首次使用时下载。关系数据使用 Olares PostgreSQL，上传内容、图数据库文件、向量索引及模型缓存保存在持久应用存储中。


    本应用固定使用上游开发版镜像。首次下载模型可能延迟处理。处理使用 CPU，无需专用 GPU。'
  featuredImage: https://cdn.olares.com/images/2026/10/e23764639d686484b849c1ddb9c872b8.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/e23764639d686484b849c1ddb9c872b8.png
  - https://cdn.olares.com/images/2026/10/4940bd1c0201211582d8ee2931235ae0.png
envs:
- envName: DEFAULT_USER_PASSWORD
  description: Cognee 初始密码，至少 12 个字符。使用 default_user@example.com 登录。升级时保留已有账号的密码。

metadata:
  title: Cognee
  description: 从文档和文本构建可搜索的知识图谱
spec:
  fullDescription: 'Cognee 将文本和文档转化为相互关联的知识，支持搜索和浏览。本应用包含网页界面和 API。安装时设置至少 12 个字符的密码，使用 default_user@example.com 登录。升级时保留现有账号密码。


    语言任务使用 AI Router 的 default-chat。小型嵌入模型在 Cognee 内本地运行，首次使用时下载。关系数据使用 Olares PostgreSQL，上传内容、图数据库文件、向量索引及模型缓存保存在持久应用存储中。


    本应用使用 Cognee 1.6.6，并集成官方 MCP 服务，供助手连接。首次下载模型可能延迟处理。处理使用 CPU，无需专用 GPU。


    Olares 内部 MCP 连接默认无需客户端 API 密钥，使用 default_user@example.com 账号。连接的助手共享该账号的权限，包括添加和删除知识。需要客户端提供密钥时，在设置中将 MCP_AUTH_ENABLED 设为 true，并将 MCP_API_KEY 设为 Cognee API 密钥。客户端须通过 X-Api-Key 发送同一密钥。'

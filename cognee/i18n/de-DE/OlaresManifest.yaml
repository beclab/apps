metadata:
  title: Cognee
  description: Durchsuchbare Wissensgraphen aus Dokumenten und Text erstellen
spec:
  fullDescription: 'Cognee verwandelt Texte und Dokumente in verknüpftes Wissen, das Sie durchsuchen und erkunden können. Dieses Paket enthält die Weboberfläche und die API. Legen Sie bei der Installation ein Passwort mit mindestens 12 Zeichen fest und melden Sie sich als default_user@example.com an. Passwörter bestehender Konten bleiben bei Upgrades erhalten.


    Für Sprachaufgaben wird AI Router default-chat verwendet. Ein kleines Embedding-Modell läuft lokal in Cognee und wird bei der ersten Verwendung heruntergeladen. Relationale Datensätze verwenden Olares PostgreSQL; hochgeladene Daten, Graphdateien, Vektorindizes und der Modellcache bleiben im Anwendungsspeicher erhalten.


    Dieses Paket verwendet Cognee 1.6.6 und enthält den offiziellen MCP-Server für Assistenten. Die anfänglichen Modell-Downloads können die Verarbeitung verzögern. Die Verarbeitung nutzt die CPU und erfordert keine dedizierte GPU.


    MCP-Verbindungen innerhalb von Olares benötigen standardmäßig keinen clientseitigen API-Schlüssel und verwenden default_user@example.com. Verbundene Assistenten erhalten die Berechtigungen dieses Kontos, einschließlich des Hinzufügens und Löschens von Wissen. Um einen clientseitigen Schlüssel zu verlangen, setzen Sie MCP_AUTH_ENABLED in den Einstellungen auf true und tragen Sie einen Cognee-API-Schlüssel in MCP_API_KEY ein. Clients müssen denselben Schlüssel über X-Api-Key senden.'

metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: Un modèle de programmation et de raisonnement servi avec llama.cpp

spec:
  upgradeDescription: |
    v1.0.21: Model Console (llm-init) a été mis à jour vers la version v1.7.21.

    Model Console est mis à jour vers llm-init v1.7.19.

    Cette console télécharge le modèle, affiche la progression et fournit l'API compatible OpenAI.
  fullDescription: |
    Qwopus3.6-27B-v2 est un fine-tune communautaire de Qwen3.6-27B pour le code, les mathématiques, le travail DevOps et les sorties structurées strictes. La Multi-Token Prediction (MTP) permet au modèle de rédiger plus d'un token par étape, ce qui peut augmenter la vitesse de génération. Cette application sert la version GGUF `Q4_K_M` texte uniquement issue de `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF` avec llama.cpp. Le préréglage prend en charge le raisonnement et l'appel d'outils, et n'inclut pas la vision.

    **Fonctionnalités principales**

    - Générer des réponses de code, de mathématiques et de type DevOps.
    - Utiliser le raisonnement et l'appel d'outils.
    - Rédiger plusieurs tokens par étape grâce aux têtes MTP intégrées.
    - Mettre le modèle à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible avec au moins `23Gi` de mémoire GPU est requis. Si un contexte 128K épuise la mémoire GPU, diminuez la valeur `-c` dans `ENGINE_ARGS`.

    Pour les détails du modèle, voir la [page GGUF Qwopus3.6-27B-v2-MTP](https://huggingface.co/Jackrong/Qwopus3.6-27B-v2-MTP-GGUF).

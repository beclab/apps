metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: llama.cppで提供するコーディングと推論のモデル

spec:
  upgradeDescription: |
    v1.0.21: Model Console（llm-init）を v1.7.21 に更新しました。

    Model Consoleはllm-init v1.7.19に更新されています。

    このコンソールはモデルをダウンロードし、進捗を表示し、OpenAI互換APIを提供します。
  fullDescription: |
    Qwopus3.6-27B-v2は、プログラミング、数学、DevOps、厳密な構造化出力向けにQwen3.6-27Bをコミュニティ微調整したモデルです。Multi-Token Prediction（MTP）により、モデルは1ステップあたり複数のトークンを起草でき、生成速度が上がる場合があります。このアプリはllama.cppで`Jackrong/Qwopus3.6-27B-v2-MTP-GGUF`のテキスト専用`Q4_K_M` GGUFビルドを提供します。プリセットは思考とツール呼び出しに対応し、ビジョンは含まれません。

    **主な機能**

    - コード、数学、DevOps向けの回答を生成します。
    - 思考とツール呼び出しを使います。
    - 組み込みMTPヘッドで1ステップあたり複数のトークンを起草します。
    - 対応するOlaresアプリからモデルを利用できるようにします。

    少なくとも`23Gi`のGPUメモリを備えた対応するNVIDIA GPUが必要です。128KコンテキストでGPUメモリが不足する場合は、`ENGINE_ARGS`の`-c`値を下げてください。

    モデルの詳細は[Qwopus3.6-27B-v2-MTP GGUFページ](https://huggingface.co/Jackrong/Qwopus3.6-27B-v2-MTP-GGUF)を参照してください。

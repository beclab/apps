metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: 使用 llama.cpp 提供的编程与推理模型

spec:
  upgradeDescription: |
    Model Console 现已更新为 llm-init v1.7.19。

    该控制台会下载模型、显示进度，并提供 OpenAI 兼容 API。
  fullDescription: |
    Qwopus3.6-27B-v2 是基于 Qwen3.6-27B 的社区微调模型，面向编程、数学、DevOps 工作以及严格的结构化输出。Multi-Token Prediction（MTP）可让模型每步起草多个 token，从而可能提高生成速度。本应用通过 llama.cpp 提供来自 `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF` 的纯文本 `Q4_K_M` GGUF 版本。该预设支持思考和工具调用，不含视觉能力。

    **主要功能**

    - 生成代码、数学和 DevOps 类回答。
    - 使用思考和工具调用。
    - 借助内置 MTP 头每步起草多个 token。
    - 向兼容的 Olares 应用提供该模型。

    需要配备至少 `23Gi` 显存的兼容 NVIDIA GPU。如果 128K 上下文导致显存不足，请在 `ENGINE_ARGS` 中调低 `-c` 值。

    模型详情见 [Qwopus3.6-27B-v2-MTP GGUF 页面](https://huggingface.co/Jackrong/Qwopus3.6-27B-v2-MTP-GGUF)。

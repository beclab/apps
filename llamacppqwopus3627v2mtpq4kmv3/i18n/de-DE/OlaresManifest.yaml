metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: Ein Modell für Programmierung und Reasoning, bereitgestellt mit llama.cpp

spec:
  upgradeDescription: |
    v1.0.21: Model Console (llm-init) wurde auf v1.7.21 aktualisiert.

    Model Console wird auf llm-init v1.7.19 aktualisiert.

    Diese Konsole lädt das Modell herunter, zeigt den Fortschritt und stellt die OpenAI-kompatible API bereit.
  fullDescription: |
    Qwopus3.6-27B-v2 ist ein Community-Fine-Tune von Qwen3.6-27B für Programmierung, Mathematik, DevOps-Arbeit und strikt strukturierte Ausgaben. Multi-Token Prediction (MTP) lässt das Modell mehr als ein Token pro Schritt entwerfen, was die Generierungsgeschwindigkeit erhöhen kann. Diese App stellt den textbasierten `Q4_K_M`-GGUF-Build von `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF` mit llama.cpp bereit. Das Preset unterstützt Nachdenken und Werkzeugaufrufe und enthält keine Vision.

    **Hauptfunktionen**

    - Code-, Mathematik- und DevOps-Antworten erzeugen.
    - Nachdenken und Werkzeugaufrufe nutzen.
    - Mit integrierten MTP-Köpfen mehrere Token pro Schritt entwerfen.
    - Das Modell für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `23Gi` GPU-Speicher ist erforderlich. Wenn ein 128K-Kontext den GPU-Speicher überschreitet, senken Sie den `-c`-Wert in `ENGINE_ARGS`.

    Details zum Modell finden Sie auf der [Qwopus3.6-27B-v2-MTP-GGUF-Seite](https://huggingface.co/Jackrong/Qwopus3.6-27B-v2-MTP-GGUF).

# Engine wrapper script, mounted into the llama.cpp (engine) container at
# /llm-init/wrappers. Sources the helpers llm-init publishes into RUN_DIR and
# runs llama-server under supervise_engine, so Model Console can relaunch the
# engine with updated model-card engine_args without restarting the Pod.
#
# Starts llama-server with -hf "$MODEL_NAME" (owner/repo or owner/repo:quant).
# Sentinel model_path is not used for load; llm-init ensure must populate HF cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-init-wrappers
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llamacpp
data:
  llamacpp.sh: |
    #!/bin/sh
    set -eu

    ENGINE=llamacpp
    # Source the shared helpers llm-init publishes into RUN_DIR. That copy can
    # arrive late - the two containers are separate Deployments with no ordering
    # between them - so waiting here is the normal path.
    WRAPPER_COMMON=${WRAPPER_COMMON:-"$(dirname "$0")/common.sh"}
    _wc=0
    while [ ! -f "$WRAPPER_COMMON" ] && [ "$_wc" -lt "${WRAPPER_COMMON_WAIT:-3600}" ]; do
        printf '[wrapper] waiting for %s (elapsed=%ss)\n' "$WRAPPER_COMMON" "$_wc"
        sleep 5
        _wc=$((_wc + 5))
    done
    [ -f "$WRAPPER_COMMON" ] || { printf '[wrapper] %s never appeared\n' "$WRAPPER_COMMON" >&2; exit 1; }
    unset _wc
    . "$WRAPPER_COMMON"

    looks_like_hf_repo_id() {
        s=$1
        case "$s" in
            ""|/*|./*|*://*) return 1 ;;
        esac
        case "$s" in
            */*)
                rest=${s#*/}
                case "$rest" in
                    */*) return 1 ;;
                esac
                return 0
                ;;
            *) return 1 ;;
        esac
    }

    wait_for_sentinel
    wait_for_engine_args_handoff

    if ! looks_like_hf_repo_id "${MODEL_NAME:-}"; then
        log "MODEL_NAME must be owner/repo or owner/repo:quant for -hf (got ${MODEL_NAME:-<empty>})"
        exit 1
    fi

    LLAMA_SERVER_BIN="${LLAMA_SERVER_BIN:-}"
    if [ -z "$LLAMA_SERVER_BIN" ]; then
        if [ -x /app/llama-server ]; then
            LLAMA_SERVER_BIN=/app/llama-server
        else
            LLAMA_SERVER_BIN="$(command -v llama-server 2>/dev/null || true)"
        fi
    fi
    if [ -z "$LLAMA_SERVER_BIN" ] || [ ! -x "$LLAMA_SERVER_BIN" ]; then
        log "llama-server binary not found"
        exit 127
    fi

    LLAMA_SERVER_DIR=$(dirname "$LLAMA_SERVER_BIN")
    export LD_LIBRARY_PATH="${LLAMA_SERVER_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
    if [ -d "${LLAMA_SERVER_DIR}/lib" ]; then
        export LD_LIBRARY_PATH="${LLAMA_SERVER_DIR}/lib:${LD_LIBRARY_PATH}"
    fi

    run_llamacpp() {
        # Preserve container CMD extras before ENGINE_ARGS word-splitting.
        extra_argv="$*"
        load_engine_args_from_handoff
        ARGV=""
        if [ -n "${ENGINE_ARGS:-}" ]; then
            # shellcheck disable=SC2086
            set -- $ENGINE_ARGS
            for tok in "$@"; do
                case "$tok" in
                    -*)             ARGV="$ARGV $tok" ;;
                    LLAMA_ARG_*=*)  export "$tok" && log "engine_args export: $tok" ;;
                    *=*)            log "engine_args drop non-LLAMA_ARG env: $tok" ;;
                    *)              ARGV="$ARGV $tok" ;;
                esac
            done
        fi
        log "starting llama.cpp with -hf=$MODEL_NAME alias=${MODEL_NAME:-unset} argv=${ARGV:-<empty>} (bin=$LLAMA_SERVER_BIN)"
        # shellcheck disable=SC2086
        exec "$LLAMA_SERVER_BIN" \
            -hf "$MODEL_NAME" \
            --alias "${MODEL_NAME:-llm-init-model}" \
            --host 0.0.0.0 \
            --port "${LLAMACPP_PORT:-8081}" \
            --metrics \
            $ARGV \
            $extra_argv
    }

    supervise_engine run_llamacpp "$@"

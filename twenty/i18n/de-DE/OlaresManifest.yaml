metadata:
  title: Twenty
  description: "Das führende Open-Source-CRM – eine moderne Alternative zu Salesforce"
spec:
  fullDescription: |
    Twenty ist ein quelloffenes CRM, das Ihnen die Bausteine bietet, um genau das zu erstellen, was Ihr Unternehmen benötigt.

    **Hauptfunktionen**
    - Kalender und E-Mails: Synchronisieren Sie Postfach und Kalender, um die gesamte Kommunikation in Ihren CRM-Datensätzen zu sehen. Mehr erfahren.
    - Datenmodell: Erstellen Sie benutzerdefinierte Objekte und Felder passend zu Ihren individuellen Geschäftsprozessen. Entdecken.
    - Datenmigration: Importieren und exportieren Sie Daten über CSV oder API. Erste Schritte.
    - Ansichten und Pipelines: Organisieren Sie Daten in Tabellenansichten, Kanban-Boards und Vertriebspipelines. Entdecken.
    - Workflows: Automatisieren Sie Geschäftsprozesse und integrieren Sie externe Werkzeuge. Automatisierungen erstellen.
    - KI: Erweitern Sie Ihr CRM mit KI-gestützten Funktionen und Agenten. KI entdecken.
    - Dashboards: Verfolgen Sie die Leistung mit benutzerdefinierten Berichten und Visualisierungen. Dashboards anzeigen.
    - Berechtigungen und Zugriff: Steuern Sie mit rollenbasierten Berechtigungen, wer Daten anzeigen, bearbeiten und verwalten darf. Zugriff konfigurieren.
    - Notizen und Aufgaben: Erstellen Sie für eine bessere Zusammenarbeit mit Datensätzen verknüpfte Notizen und Aufgaben.
    - API und Webhooks: Verbinden Sie andere Apps und erstellen Sie benutzerdefinierte Integrationen. Integration starten.
  upgradeDescription: |
    Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat` umstellen.

    nginx-Konfigurations-Mounts und Protokollpfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verkabelung entfernen.

    Twenty auf v2.22.0 (`twentycrm/twenty:v2.22.0`) aktualisieren.

    Sensible Anmeldedaten (`APP_SECRET`, `PG_DATABASE_URL`, `REDIS_URL`, `EMAIL_SMTP_PASSWORD`) in ein Kubernetes Secret verschieben und über `secretKeyRef` injizieren, damit Deployment-Spezifikationen keine Klartext-Secrets mehr enthalten.

    Vollständige Versionshinweise unter: https://github.com/twentyhq/twenty/releases/tag/v2.22.0

metadata:
  title: Twenty
  description: "ナンバーワンのオープンソース CRM – Salesforce に代わるモダンな選択肢"
spec:
  fullDescription: |
    Twenty は、ビジネスに必要なものを思いどおりに構築するための構成要素を提供するオープンソース CRM です。

    **主な機能**
    - カレンダーとメール: メールボックスとカレンダーを同期し、CRM レコード上ですべてのやり取りを確認できます。詳細を見る。
    - データモデル: 独自のビジネスプロセスに合わせてカスタムオブジェクトとフィールドを作成。詳しく見る。
    - データ移行: CSV または API でデータをインポート・エクスポート。始める。
    - ビューとパイプライン: テーブルビュー、kanban ボード、営業パイプラインでデータを整理。詳しく見る。
    - Workflows: ビジネスプロセスを自動化し、外部ツールと連携。自動化を構築。
    - AI: AI を活用した機能とエージェントで CRM を強化。AI を詳しく見る。
    - Dashboards: カスタムレポートと可視化でパフォーマンスを追跡。dashboards を表示。
    - 権限とアクセス: ロールベースの権限で、データを閲覧、編集、管理できるユーザーを制御。アクセスを設定。
    - メモとタスク: レコードに紐づくメモとタスクを作成し、共同作業を改善。
    - API と webhooks: 他のアプリに接続し、カスタム連携を構築。連携を開始。
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に変更。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。

    Twenty を v2.22.0（`twentycrm/twenty:v2.22.0`）にアップグレード。

    機密性の高い認証情報（`APP_SECRET`、`PG_DATABASE_URL`、`REDIS_URL`、`EMAIL_SMTP_PASSWORD`）を Kubernetes Secret に移動し、`secretKeyRef` で注入することで、Deployment 仕様に平文の Secrets が含まれないように変更。

    完全なリリースノート: https://github.com/twentyhq/twenty/releases/tag/v2.22.0

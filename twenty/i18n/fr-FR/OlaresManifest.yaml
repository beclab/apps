metadata:
  title: Twenty
  description: "Le CRM open source numéro 1, une alternative moderne à Salesforce"
spec:
  fullDescription: |
    Twenty est un CRM open source qui vous fournit les composants nécessaires pour créer exactement ce dont votre entreprise a besoin.

    **Fonctionnalités principales**
    - Calendrier et e-mails : synchronisez votre messagerie et votre calendrier pour afficher toutes les communications dans vos fiches CRM. En savoir plus.
    - Modèle de données : créez des objets et champs personnalisés adaptés à vos processus métier. Explorer.
    - Migration des données : importez et exportez vos données via CSV ou API. Commencer.
    - Vues et pipelines : organisez vos données avec des vues en tableau, des tableaux kanban et des pipelines de vente. Découvrir.
    - Workflows : automatisez vos processus métier et intégrez des outils externes. Créer des automatisations.
    - IA : enrichissez votre CRM de fonctionnalités et d'agents basés sur l'IA. Explorer l'IA.
    - Dashboards : suivez les performances avec des rapports et visualisations personnalisés. Voir les dashboards.
    - Autorisations et accès : contrôlez qui peut consulter, modifier et gérer vos données grâce aux autorisations par rôle. Configurer l'accès.
    - Notes et tâches : créez des notes et tâches liées à vos fiches pour mieux collaborer.
    - API et webhooks : connectez d'autres applications et créez des intégrations personnalisées. Commencer l'intégration.
  upgradeDescription: |
    Remplacer l'image de reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de configuration nginx et les chemins des journaux sur l'organisation de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) et supprimer le câblage `OPENRESTY_CONF_FILE` propre à Bitnami.

    Mettre Twenty à niveau vers v2.22.0 (`twentycrm/twenty:v2.22.0`).

    Déplacer les identifiants sensibles (`APP_SECRET`, `PG_DATABASE_URL`, `REDIS_URL`, `EMAIL_SMTP_PASSWORD`) dans un Kubernetes Secret et les injecter via `secretKeyRef`, afin que les spécifications Deployment ne contiennent plus de Secrets en clair.

    Notes de version complètes : https://github.com/twentyhq/twenty/releases/tag/v2.22.0

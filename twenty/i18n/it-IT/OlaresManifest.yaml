metadata:
  title: Twenty
  description: "Il CRM open source numero 1: un'alternativa moderna a Salesforce"
spec:
  fullDescription: |
    Twenty è un CRM open source che offre gli elementi necessari per creare esattamente ciò di cui la tua azienda ha bisogno.

    **Funzionalità principali**
    - Calendario ed email: sincronizza casella di posta e calendario per vedere tutte le comunicazioni nei record CRM. Scopri di più.
    - Modello dati: crea oggetti e campi personalizzati adatti ai tuoi processi aziendali. Esplora.
    - Migrazione dati: importa ed esporta i dati tramite CSV o API. Inizia.
    - Viste e pipeline: organizza i dati con viste tabellari, bacheche kanban e pipeline di vendita. Scopri.
    - Workflows: automatizza i processi aziendali e integra strumenti esterni. Crea automazioni.
    - AI: migliora il tuo CRM con funzionalità e agenti basati sull'AI. Esplora l'AI.
    - Dashboards: monitora le prestazioni con report e visualizzazioni personalizzati. Visualizza i dashboard.
    - Permessi e accesso: controlla chi può visualizzare, modificare e gestire i dati con permessi basati sui ruoli. Configura l'accesso.
    - Note e attività: crea note e attività collegate ai record per una migliore collaborazione.
    - API e webhook: collega altre app e crea integrazioni personalizzate. Inizia l'integrazione.
  upgradeDescription: |
    Cambiare l'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere la configurazione specifica di Bitnami `OPENRESTY_CONF_FILE`.

    Aggiornare Twenty a v2.22.0 (`twentycrm/twenty:v2.22.0`).

    Spostare le credenziali sensibili (`APP_SECRET`, `PG_DATABASE_URL`, `REDIS_URL`, `EMAIL_SMTP_PASSWORD`) in un Kubernetes Secret e inserirle tramite `secretKeyRef`, affinché le specifiche Deployment non contengano più Secrets in chiaro.

    Note di rilascio complete: https://github.com/twentyhq/twenty/releases/tag/v2.22.0

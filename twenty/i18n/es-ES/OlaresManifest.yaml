metadata:
  title: Twenty
  description: "El CRM de código abierto número 1: una alternativa moderna a Salesforce"
spec:
  fullDescription: |
    Twenty es un CRM de código abierto que ofrece los componentes necesarios para crear exactamente lo que necesita tu empresa.

    **Funciones principales**
    - Calendario y correo electrónico: sincroniza el buzón y el calendario para ver todas las comunicaciones en los registros del CRM. Más información.
    - Modelo de datos: crea objetos y campos personalizados adaptados a tus procesos empresariales. Explorar.
    - Migración de datos: importa y exporta datos mediante CSV o API. Comenzar.
    - Vistas y pipelines: organiza los datos con vistas de tabla, tableros kanban y pipelines de ventas. Descubrir.
    - Workflows: automatiza los procesos empresariales e integra herramientas externas. Crear automatizaciones.
    - IA: mejora tu CRM con funciones y agentes basados en IA. Explorar IA.
    - Dashboards: supervisa el rendimiento con informes y visualizaciones personalizados. Ver dashboards.
    - Permisos y acceso: controla mediante permisos basados en roles quién puede ver, editar y administrar tus datos. Configurar acceso.
    - Notas y tareas: crea notas y tareas vinculadas a tus registros para colaborar mejor.
    - API y webhooks: conecta otras aplicaciones y crea integraciones personalizadas. Empezar a integrar.
  upgradeDescription: |
    Cambiar la imagen del proxy inverso de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los montajes de configuración de nginx y las rutas de registro con la disposición de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) y eliminar la configuración específica de Bitnami `OPENRESTY_CONF_FILE`.

    Actualizar Twenty a v2.22.0 (`twentycrm/twenty:v2.22.0`).

    Mover las credenciales sensibles (`APP_SECRET`, `PG_DATABASE_URL`, `REDIS_URL`, `EMAIL_SMTP_PASSWORD`) a un Kubernetes Secret e inyectarlas mediante `secretKeyRef`, para que las especificaciones de Deployment ya no incluyan Secrets en texto plano.

    Notas completas de la versión: https://github.com/twentyhq/twenty/releases/tag/v2.22.0

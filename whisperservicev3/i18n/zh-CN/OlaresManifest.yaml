metadata:
  title: Whisper API
  description: 基于 WhisperX 的 FastAPI 服务
spec:
  fullDescription: |
    **使用须知**
    该应用为共享应用，在 Olares 内部仅会部署一个服务。每个用户可以安装一个桌面入口进行访问或使用共享入口进行 API 调用。

    **前置条件**
    安装前请配置 **HF_TOKEN**（来自 Olares 的 Hugging Face Token）和 **HF_ENDPOINT**。安装管理员的 Token 必须在 Hugging Face 上**已接受以下受限仓库的使用条款**：
    - `pyannote/speaker-diarization-3.1`
    - `pyannote/segmentation-3.0`

    安装时 llm-init 会将以下模型下载到共享 HF 缓存：
    - `Systran/faster-whisper-large-v3`（ASR，默认）
    - `pyannote/speaker-diarization-3.1`、`pyannote/segmentation-3.0`（说话人分离）
    - `jonatasgrosman/wav2vec2-large-xlsr-53-chinese-zh-cn`（中文逐词对齐）

    **性能说明**
    安装后首次转写可能较慢（模型载入 GPU），后续请求会更快。

    **应用概览**
    whisperX API 是一款用于增强和分析音频内容的工具。该 API 提供了一套用于处理音频和视频文件的服务，包括转录、对齐、说话人分割以及将转录内容与二值化结果合并。

    可用服务
    **语音转文本 (/speech-to-text)**
    - 上传音频/视频文件进行转录
    - 支持多种语言和 Whisper 模型

    **语音转文本 URL (/speech-to-text-url)**
    - 从 URL 转录音频/视频
    - 与直接上传功能相同

    **单个服务：**
    - 转录 (/service/transcribe)：将语音转换为文本
    - 对齐 (/service/align)：将转录文本与音频对齐
    - 分割 (/service/diarize)：说话人分割
    - 合并 (/service/combine)：将转录文本与区分大小写合并

    **任务管理：**
    - 获取所有任务 (/task/all)
    - 获取任务状态 (/task/{identifier})

    **健康检查端点：**
    - 基本健康检查 (/health)：简单的服务状态检查
    - 活跃度探测 (/health/live)：验证应用程序是否正在运行
    - 就绪度探测 (/health/ready)：检查应用程序是否已准备好接受请求（包括数据库连接检查）

    **任务历史**

    升级时会自动迁移任务历史并持久保存，无需手动备份数据库。

    **音频文件自动删除与留存设置**

    清理范围仅包括本版本为 API 请求创建的文件夹：上传的音频/视频副本、从 URL 下载的文件，以及视频转换产生的音频。保留用户设备上的原文件、转录结果、任务记录、模型文件和旧版 data 文件夹中的历史文件。

    - **AUTO_DELETE_SOURCE_AUDIO**：默认 true。音频解码到内存后即可删除文件，请求处理结束或失败时删除剩余请求文件。此行为不以转录成功为条件。设为 false 可保留请求文件；希望持续保留时，还需将 AUTO_CLEANUP_SOURCE_AUDIO 设为 false。更改配置无法恢复已删除的文件。
    - **AUTO_CLEANUP_SOURCE_AUDIO**：默认 true。每小时检查一次，按 SOURCE_AUDIO_RETENTION_HOURS 清理过期请求文件夹，包括保留的上传副本、URL 下载文件、转换音频和异常退出遗留文件。跳过仍在处理的请求。设为 false 关闭定时清理，但不影响第一个开关的即时删除，也不禁止管理员手动清理。重新开启后，已超过留存时间的文件可能在下一次检查时被删除。
    - **SOURCE_AUDIO_RETENTION_HOURS**：默认 24，支持 1–8760 的整数，单位为小时。仅在定时清理开启时生效。已结束的请求从结束时间计算；异常退出的请求从文件夹创建时间计算。到期后在下一次每小时检查时清理，不会延迟第一个开关的即时删除。
    - **AUDIO_CLEANUP_TOKEN**：可选管理员令牌。留空时关闭存储查看和手动清理接口。配置后，调用 GET /storage/audio 或 POST /storage/audio/cleanup 时需发送 Authorization: Bearer <token>。手动清理默认仅预览（dry_run=true），明确设置 dry_run=false 才执行删除；即使自动清理关闭，管理员仍可手动清理。请妥善保管令牌，持有者可以删除符合条件的请求文件。

    **常用配置**
    - 处理后删除（默认）：两个开关均为 true。24 小时留存期用于回收异常遗留文件。
    - 保留 7 天：AUTO_DELETE_SOURCE_AUDIO=false，AUTO_CLEANUP_SOURCE_AUDIO=true，SOURCE_AUDIO_RETENTION_HOURS=168。
    - 持续保留：两个开关均为 false，留存小时数不生效。管理员仍可手动清理。

  upgradeDescription: |
    v1.1.25：优化升级兼容性，将升级备份与历史音频分开保存。

    v1.1.24: 自动删除请求产生的音频副本，新增可配置的文件留存和受保护的清理接口，持久保存任务结果。保留已有历史文件。

    v1.1.23: Model Console（llm-init）版本更新为 v1.7.21。

    将反向代理镜像从 Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）切换为官方 OpenResty 镜像 `openresty/openresty:1.29.2.5-bookworm-fat`。

    同步调整 nginx 配置挂载与日志路径以匹配官方镜像布局（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`），并移除 Bitnami 专用的 `OPENRESTY_CONF_FILE` 配置。

    v1.1.11: 将 HF_TOKEN / HF_ENDPOINT 映射为 OLARES_SYSTEM_HUGGINGFACE_*（系统级）；HF_TOKEN required: false。

    将 Whisper API 迁移到 apiVersion v3 共享应用模式，并将模型下载切换为共享的 llm-init 下载器（whisperservicev2 → whisperservicev3）。改用上游官方镜像 `beclab/pavelzbornik-whisperx-fastapi:0.8.0`（nltk 与 VAD 已内置镜像）。以 `llm-init:v1.3.1` 下载专用 Deployment（`whisperservicev3download`）替换原有的 CDN tar.zst `downloader-init`，从 HF 拉取 `Systran/faster-whisper-large-v3`、`pyannote/speaker-diarization-3.1`、`pyannote/segmentation-3.0` 到跨应用共享 HF 缓存（App Common，`/cache/hf/hub`）；引擎经 `HF_HUB_CACHE` 读取并等待下载器 `/readyz`。英文对齐的 torchaudio 权重在首次逐词对齐时懒加载，缓存到持久化的 `/root/.cache`。将子 chart 扁平化为单一 chart（引擎以发布名命名、nginx 入口 `whisperserviceclient`），GPU 需求移入 accelerator 模式列表，新增 `appCommon` 与 `workloadReplicas`。说话人分离（pyannote）为受限仓库——管理员的 HF token 需已接受其条款。

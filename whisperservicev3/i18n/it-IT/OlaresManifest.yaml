metadata:
  title: Whisper API
  description: Servizio FastAPI basato su WhisperX
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Nell'intero sistema Olares verrà installato un solo servizio. Ogni utente può installare una voce desktop per accedere oppure usare l'ingresso condiviso per chiamare l'API del servizio.

    **PREREQUISITI**
    Prima dell'installazione, configura **HF_TOKEN** (mappato dal tuo token Hugging Face di Olares) e **HF_ENDPOINT**. Il token dell'admin che installa deve aver **accettato i termini d'uso** su Hugging Face per questi repository gated:
    - `pyannote/speaker-diarization-3.1`
    - `pyannote/segmentation-3.0`

    I modelli vengono scaricati in fase di installazione tramite llm-init nella cache HF condivisa:
    - `Systran/faster-whisper-large-v3` (ASR, predefinito)
    - `pyannote/speaker-diarization-3.1` e `pyannote/segmentation-3.0` (diarizzazione speaker)
    - `jonatasgrosman/wav2vec2-large-xlsr-53-chinese-zh-cn` (allineamento a livello di parola in cinese)

    **NOTA SULLE PRESTAZIONI**
    La prima trascrizione dopo l'installazione può richiedere sensibilmente più tempo mentre i modelli vengono caricati in memoria GPU; le richieste successive sono più veloci.

    **PANORAMICA**
    L'API whisperX è uno strumento per migliorare e analizzare i contenuti audio. Questa API offre un insieme di servizi per elaborare file audio e video, tra cui trascrizione, allineamento, diarizzazione e combinazione di trascritto con risultati di diarizzazione.

    Servizi disponibili
    **Speech-to-Text (/speech-to-text)**
    - Carica file audio/video per la trascrizione
    - Supporta più lingue e modelli Whisper

    **Speech-to-Text URL (/speech-to-text-url)**
    - Trascrivi audio/video da URL
    - Stesse funzioni del caricamento diretto

    **Servizi individuali:**
    - Transcribe (/service/transcribe): Converti parlato in testo
    - Align (/service/align): Allinea il trascritto con l'audio
    - Diarize (/service/diarize): Diarizzazione speaker
    - Combine (/service/combine): Unisci trascritto e diarizzazione

    **Gestione task:**
    - Ottieni tutti i task (/task/all)
    - Ottieni stato task (/task/{identifier})

    **Endpoint di health check:**
    - Health check di base (/health): Controllo semplice dello stato del servizio
    - Liveness probe (/health/live): Verifica se l'applicazione è in esecuzione
    - Readiness probe (/health/ready): Controlla se l'applicazione è pronta ad accettare richieste (include controllo connettività database)
  upgradeDescription: |
    Passare l'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico Bitnami `OPENRESTY_CONF_FILE`.

    v1.1.11: Mappare HF_TOKEN / HF_ENDPOINT da OLARES_SYSTEM_HUGGINGFACE_* (livello sistema); HF_TOKEN required: false.

    Immagine llm-init aggiornata a `beclab/llm-init:v1.3.1`.

    Whisper API migrata al pattern di app condivisa apiVersion v3 e provisioning modelli passato al downloader llm-init condiviso (whisperservicev2 → whisperservicev3). Ora esegue l'immagine upstream `beclab/pavelzbornik-whisperx-fastapi:0.8.0` (nltk + VAD inclusi). Il `downloader-init` CDN tar.zst su misura è stato sostituito da un Deployment solo-download `llm-init:v1.3.1` (`whisperservicev3download`) che recupera i repo HF (`Systran/faster-whisper-large-v3`, `pyannote/speaker-diarization-3.1`, `pyannote/segmentation-3.0`) nella cache HF condivisa tra app (App Common, `/cache/hf/hub`); il motore li legge via `HF_HUB_CACHE` e fa gating su `/readyz`. Il peso di allineamento torchaudio inglese viene scaricato lazy al primo allineamento a livello di parola e memorizzato in una `/root/.cache` persistente. Sottograph appiattiti in un unico chart (engine nominato dalla release, ingresso nginx `whisperserviceclient`), requisito GPU spostato nell'elenco modalità accelerator, e aggiunti `appCommon` + `workloadReplicas`. La diarizzazione (pyannote) è gated — il token HF admin deve averne accettato i termini.

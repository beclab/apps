apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-audio-retention
  namespace: {{ .Release.Namespace }}
data:
  gunicorn_conf.py: |
    def post_fork(server, worker):
        from retention import install
        install()

  retention.py: |
    """Own request files explicitly; never sweep legacy data or user inputs."""
    import contextvars
    import fcntl
    import hashlib
    import hmac
    import json
    import logging
    import os
    import re
    import shutil
    import tempfile
    import threading
    import time
    import uuid
    from pathlib import Path

    log = logging.getLogger('whisper.audio_retention')
    current_directory = contextvars.ContextVar('whisper_request_directory', default=None)
    MARKER = 'whisper-audio-request-v1'
    AUDIO_ROUTES = {
        '/speech-to-text', '/speech-to-text-url', '/service/transcribe',
        '/service/align', '/service/diarize', '/service/combine',
        '/v1/audio/transcriptions', '/v1/audio/translations',
    }

    class ManagedFiles:
        def __init__(self, root, retain=False, hours=24):
            self.root = Path(root).resolve()
            self.root.mkdir(parents=True, exist_ok=True)
            self.retain = retain
            self.seconds = float(hours) * 3600
            if not 3600 <= self.seconds <= 365 * 86400:
                raise ValueError('Audio retention must be between 1 and 8760 hours')
            self.last_cleanup = None

        def begin(self):
            directory = self.root / ('req-' + uuid.uuid4().hex)
            directory.mkdir(mode=0o700)
            if os.geteuid() == 0:
                os.chown(directory, 1000, 1000)
            lock = open(directory / '.active', 'x+b')
            fcntl.flock(lock, fcntl.LOCK_EX)
            (directory / '.managed.json').write_text(json.dumps({
                'kind': MARKER, 'created': time.time(), 'finished': None,
            }))
            return directory, lock

        def is_owned(self, path):
            directory = current_directory.get()
            path = Path(path)
            return directory is not None and not path.is_symlink() and path.resolve().parent == directory

        def release_loaded_files(self):
            if self.retain:
                return
            directory = current_directory.get()
            if directory is not None:
                for path in directory.iterdir():
                    if not path.name.startswith('.') and path.is_file() and not path.is_symlink():
                        path.unlink(missing_ok=True)

        def finish(self, directory, lock):
            try:
                if self.retain:
                    marker = directory / '.managed.json'
                    data = json.loads(marker.read_text())
                    data['finished'] = time.time()
                    pending = directory / '.managed.pending'
                    try:
                        pending.write_text(json.dumps(data))
                        pending.replace(marker)
                    except OSError:
                        log.exception('Could not update retention timestamp; original ownership marker preserved')
                else:
                    shutil.rmtree(directory)
            finally:
                lock.close()

        def inventory(self):
            count = size = active = 0
            for directory in self.root.iterdir():
                if directory.is_symlink() or not directory.is_dir() or not re.fullmatch(r'req-[0-9a-f]{32}', directory.name):
                    continue
                marker = directory / '.managed.json'
                if marker.is_symlink() or not marker.is_file():
                    continue
                try:
                    data = json.loads(marker.read_text())
                    if data.get('kind') != MARKER:
                        continue
                    flags = os.O_RDWR | os.O_NOFOLLOW
                    with os.fdopen(os.open(directory / '.active', flags), 'r+b') as lock:
                        try:
                            fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                        except BlockingIOError:
                            active += 1
                    for path in directory.iterdir():
                        if not path.name.startswith('.') and path.is_file() and not path.is_symlink():
                            count += 1
                            size += path.stat().st_size
                except (OSError, ValueError):
                    continue
            return {'files': count, 'bytes': size, 'active_requests': active}

        def cleanup(self, dry_run=True, hours=None):
            cutoff = time.time() - (self.seconds if hours is None else float(hours) * 3600)
            count = files = size = errors = 0
            for directory in list(self.root.iterdir()):
                if directory.is_symlink() or not directory.is_dir() or not re.fullmatch(r'req-[0-9a-f]{32}', directory.name):
                    continue
                marker = directory / '.managed.json'
                if marker.is_symlink() or not marker.is_file():
                    continue
                try:
                    with os.fdopen(os.open(directory / '.active', os.O_RDWR | os.O_NOFOLLOW), 'r+b') as lock:
                        try:
                            fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                        except BlockingIOError:
                            continue
                        data = json.loads(marker.read_text())
                        if data.get('kind') != MARKER:
                            continue
                        timestamp = data.get('finished') or data.get('created')
                        if not isinstance(timestamp, (float, int)) or timestamp > cutoff:
                            continue
                        candidates = [p for p in directory.iterdir() if not p.name.startswith('.') and p.is_file() and not p.is_symlink()]
                        candidate_bytes = sum(p.stat().st_size for p in candidates)
                        if not dry_run:
                            shutil.rmtree(directory)
                        count += 1
                        files += len(candidates)
                        size += candidate_bytes
                except (OSError, ValueError):
                    errors += 1
                    log.warning('Could not inspect a managed request directory', exc_info=True)
            result = {'dry_run': dry_run, 'directories': count, 'files': files, 'bytes': size, 'errors': errors}
            if not dry_run:
                self.last_cleanup = {'time': time.time(), **result}
            return result

    class RequestFilesMiddleware:
        def __init__(self, app, manager):
            self.app, self.manager = app, manager

        async def __call__(self, scope, receive, send):
            if scope['type'] != 'http' or scope.get('method') != 'POST' or scope.get('path', '').rstrip('/') not in AUDIO_ROUTES:
                return await self.app(scope, receive, send)
            directory, lock = self.manager.begin()
            token = current_directory.set(directory)
            try:
                await self.app(scope, receive, send)
            finally:
                try:
                    self.manager.finish(directory, lock)
                finally:
                    current_directory.reset(token)

    def install():
        # Upstream request schemas hard-code cuda/float16 independently of Config.
        # Set their defaults before routes import them, matching the selected mode.
        from app.schemas import WhisperModelParams
        WhisperModelParams.model_fields['device'].default.default = os.environ['DEVICE']
        WhisperModelParams.model_fields['compute_type'].default.default = os.environ['COMPUTE_TYPE']
        WhisperModelParams.model_rebuild(force=True)
        from app import audio, files
        from app.services import file_service
        manager = ManagedFiles(
            os.getenv('AUDIO_REQUEST_DIR', '/request-data'),
            os.getenv('AUTO_DELETE_SOURCE_AUDIO', 'true').lower() == 'false',
            os.getenv('SOURCE_AUDIO_RETENTION_HOURS', '24'),
        )
        auto_cleanup = os.getenv('AUTO_CLEANUP_SOURCE_AUDIO', 'true').lower() != 'false'
        original_tempfile = tempfile.NamedTemporaryFile
        def owned_tempfile(*args, **kwargs):
            directory = current_directory.get()
            if directory is not None:
                kwargs['dir'] = directory
            temporary = original_tempfile(*args, **kwargs)
            if directory is not None and os.geteuid() == 0:
                os.chown(temporary.name, 1000, 1000)
            return temporary
        for module in (audio, files, file_service):
            module.NamedTemporaryFile = owned_tempfile
        original_process = audio.process_audio_file
        def process_and_release(path):
            try:
                return original_process(path)
            finally:
                if manager.is_owned(path):
                    manager.release_loaded_files()
        audio.process_audio_file = process_and_release
        # The services package can import API routes indirectly. Replace any
        # already-bound references as well as future imports.
        import sys
        for name, module in list(sys.modules.items()):
            if name.startswith('app.') and getattr(module, 'process_audio_file', None) is original_process:
                module.process_audio_file = process_and_release
        from app.main import app
        from fastapi import Header, HTTPException
        from pydantic import BaseModel, Field
        app.state.audio_storage = manager
        app.add_middleware(RequestFilesMiddleware, manager=manager)

        def authorize(authorization):
            expected = os.getenv('AUDIO_CLEANUP_TOKEN', '')
            provided = authorization.removeprefix('Bearer ') if authorization else ''
            if not expected or not hmac.compare_digest(provided.encode('utf-8'), expected.encode('utf-8')):
                raise HTTPException(403, 'Audio storage administration is disabled or the token is invalid')

        @app.get('/storage/audio', tags=['Audio storage'])
        def storage_status(authorization: str = Header(default='')):
            authorize(authorization)
            legacy = Path('/legacy-data')
            legacy_files = [p for p in legacy.iterdir() if p.is_file() and not p.is_symlink()] if legacy.is_dir() else []
            return {
                'managed': manager.inventory(), 'retain_source_audio': manager.retain,
                'auto_delete_source_audio': not manager.retain, 'auto_cleanup_source_audio': auto_cleanup,
                'retention_hours': manager.seconds / 3600,
                'legacy': {'read_only': True, 'files': len(legacy_files), 'bytes': sum(p.stat().st_size for p in legacy_files)},
                'last_cleanup': manager.last_cleanup,
            }

        class CleanupOptions(BaseModel):
            dry_run: bool = True
            older_than_hours: float = Field(default=manager.seconds / 3600, ge=1, le=8760)

        @app.post('/storage/audio/cleanup', tags=['Audio storage'])
        def cleanup_storage(options: CleanupOptions, authorization: str = Header(default='')):
            authorize(authorization)
            return manager.cleanup(options.dry_run, options.older_than_hours)

        def sweep():
            while True:
                try:
                    manager.cleanup(dry_run=False)
                except Exception:
                    log.exception('Managed audio cleanup failed')
                time.sleep(3600)
        if auto_cleanup:
            threading.Thread(target=sweep, daemon=True, name='audio-cleanup').start()
        log.info('Request audio cleanup enabled; retain=%s, hours=%s; legacy data excluded', manager.retain, manager.seconds / 3600)

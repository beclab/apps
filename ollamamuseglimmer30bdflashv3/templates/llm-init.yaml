{{- $ollamaclientDomainENV := split "," .Values.domain.ollamaclient -}}
{{- $ollamaclientDomain := index $ollamaclientDomainENV "_0" -}}
{{- /* Model identity + source are clone-configurable via olaresEnv. This
       base currently supports the ollama:// source shape only
       (MODEL_SOURCE=ollama://<library-tag>); hf:// GGUF support was
       intentionally removed for now. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- /* MODEL_SUPPORTS is a multi-select of coarse capability GROUPS (vision /
       tools / thinking / embedding). Expand each group one-to-many into the
       supports_* keys llm-init validates against its gateway AllSupports mirror,
       then re-join into the CSV the container env expects. "none" is the
       required-field fallback (no extra capabilities); legacy "embedding"
       token is kept as an alias. Unknown tokens pass through verbatim so a raw supports_* key still
       works. */ -}}
{{- $supportsGroups := dict
      "vision" "supports_vision"
      "tools" "supports_function_calling,supports_parallel_function_calling,supports_tool_choice"
      "thinking" "supports_reasoning,supports_reasoning_effort"
      "none" ""
      "embedding" "" -}}
{{- $modelSupports := $oe.MODEL_SUPPORTS | default "" -}}
{{- $expandedSupports := list -}}
{{- range $tok := splitList "," $modelSupports -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- if hasKey $supportsGroups $tok -}}
{{- $mapped := index $supportsGroups $tok -}}
{{- if $mapped -}}
{{- $expandedSupports = append $expandedSupports $mapped -}}
{{- end -}}
{{- else -}}
{{- $expandedSupports = append $expandedSupports $tok -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $modelSupports = join "," $expandedSupports -}}
{{- $logLevel := $oe.LOG_LEVEL | default "debug" -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- $gpuType = .Values.GPU.Type | default "nvidia" -}}
{{- end -}}
{{- /* User ENGINE_ARGS for llm-init: never OLLAMA_KEEP_ALIVE (see engineArgsForLlminit).
       Empty when user leaves ENGINE_ARGS blank — keep_alive is ollama-daemon-only. */ -}}
{{- $engineArgs := include "ollamamuseglimmer30bdflashv3.engineArgsForLlminit" (dict "Args" ($oe.ENGINE_ARGS | default "")) -}}
{{- /* Shared RUN_DIR host path. Same convention as llamacppllmbasev3:
       appCache (run/scratch state, not user data), namespaced per release.
       Declared in both templates -- helm renders each file on its own. */ -}}
{{- $runStateHostPath := printf "%s/llm-init-run/%s" .Values.userspace.appCache .Release.Name -}}
---
# llm-init Pod (no GPU). Talks to the ollama daemon via the "ollama"
# Service on :11434 (defined in templates/ollama.yaml). llm-init derives
# that URL from ENGINE_KIND, so the Service name must be "ollama".
# Exposes the OpenAI-compatible /v1/*
# surface and the unified /api/progress + /healthz endpoints on :8090.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Static name (llminit) — engine Deployment uses {{ .Release.Name }} for
  # allowMultipleInstall. Label stays io.kompose.service: llm-init.
  name: llminit
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llm-init
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
    spec:
      restartPolicy: Always
      volumes:
        # Shared RUN_DIR: the one-way handoff channel to the ollama daemon
        # (engine_args, engine_restart, wrappers/common.sh). llm-init and the
        # daemon are separate Deployments, so an emptyDir cannot carry it --
        # it has to be a path both Pods can reach.
        #
        # model-spec.json and progress_state.json live here too (both default
        # under RUN_DIR), so a Model Console card edit survives a Pod restart.
        # Consequence worth knowing: once the card exists on disk it wins over
        # the chart's ENGINE_ARGS env, so a later edit of the ENGINE_ARGS
        # setting is logged as ignored rather than applied. Edit engine args on
        # the model card, not in the app settings.
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
      initContainers:
        # hostPath dirs are created root-owned; llm-init runs as UID 1000.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - "mkdir -p /run/llm-init/wrappers && chown -R 1000:1000 /run/llm-init || true"
          volumeMounts:
            - name: run-state
              mountPath: /run/llm-init
          securityContext:
            runAsUser: 0
      containers:
        - name: llm-init
          image: docker.io/beclab/llm-init:v1.7.21
          imagePullPolicy: IfNotPresent
          env:
            - name: ENGINE_KIND
              value: ollama
            - name: RUN_DIR
              value: /run/llm-init
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: "{{ $modelSource }}"
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
{{- if $modelSupports }}
            - name: MODEL_SUPPORTS
              value: "{{ $modelSupports }}"
{{- end }}
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "{{ $logLevel }}"
            - name: LOG_FORMAT
              value: json
            - name: APP_URL
              value: "https://{{ $ollamaclientDomain }}"
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: run-state
              mountPath: /run/llm-init
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # model pull needs headroom; 256Mi can get OOMKilled mid-pull
              # -> pod restart -> state machine wedges. 1Gi is safe.
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP

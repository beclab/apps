metadata:
  title: Muse Glimmer 30B DFlash
  description: Un modelo de IA local para texto, comprensión de imágenes y tareas con herramientas
spec:
  fullDescription: |
    Muse Glimmer 30B es un modelo de Meta que recibe texto e imágenes y genera respuestas de texto. Admite razonamiento, ayuda con la programación y tareas que utilizan herramientas. Esta aplicación ejecuta el modelo localmente con Ollama e incluye DFlash, un modelo auxiliar que propone texto para que el modelo principal lo compruebe, lo que ayuda a acelerar la generación.

    **Funciones principales**

    - Responder a instrucciones de texto y preguntas sobre imágenes, incluidas capturas de pantalla, gráficos y documentos.
    - Utilizar el razonamiento y las llamadas a herramientas en aplicaciones compatibles que las proporcionen.
    - Realizar tareas que requieren varios pasos.
    - Acelerar la generación de texto con DFlash; la velocidad depende del hardware y de la solicitud.

    **Usar el modelo en Olares**

    Model Console descarga y gestiona `muse-glimmer:30b-q4_K_M-dflash` para las aplicaciones Olares compatibles. La ventana de contexto predeterminada es de 128K tokens y limita la cantidad de conversación y de otras entradas que el modelo puede procesar a la vez.

    [Información del modelo Muse Glimmer](https://huggingface.co/meta-models/Muse-Glimmer-30B)

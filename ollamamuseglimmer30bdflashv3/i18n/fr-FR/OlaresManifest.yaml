metadata:
  title: Muse Glimmer 30B DFlash
  description: Un modèle d’IA local pour le texte, la compréhension d’images et les tâches avec outils
spec:
  fullDescription: |
    Muse Glimmer 30B est un modèle de Meta qui reçoit du texte et des images et génère des réponses textuelles. Il prend en charge le raisonnement, l’aide à la programmation et les tâches faisant appel à des outils. Cette application exécute le modèle localement avec Ollama et inclut DFlash, un modèle auxiliaire qui propose du texte à vérifier par le modèle principal afin d’accélérer la génération.

    **Fonctionnalités principales**

    - Répondre aux requêtes textuelles et aux questions sur des images, notamment des captures d’écran, des graphiques et des documents.
    - Utiliser la réflexion et les appels d’outils dans les applications compatibles qui fournissent ces outils.
    - Traiter des tâches nécessitant plusieurs étapes.
    - Accélérer la génération de texte avec DFlash ; la vitesse dépend du matériel et de la requête.

    **Utiliser le modèle sur Olares**

    Model Console télécharge et gère `muse-glimmer:30b-q4_K_M-dflash` pour les applications Olares compatibles. La fenêtre de contexte par défaut est de 128K tokens, ce qui limite la quantité de conversation et d’autres données d’entrée que le modèle peut traiter en une fois.

    [Présentation du modèle Muse Glimmer](https://huggingface.co/meta-models/Muse-Glimmer-30B)

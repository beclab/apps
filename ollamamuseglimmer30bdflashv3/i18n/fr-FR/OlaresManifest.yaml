metadata:
  description: Muse Glimmer 30B Q4_K_M + décodage spéculatif DFlash via Ollama
  title: Muse Glimmer 30B DFlash
spec:
  upgradeDescription: |
    v1.0.12: Model Console (llm-init) a été mis à jour vers la version v1.7.21.

    v1.0.11 : Model Console passe à llm-init v1.7.19.

    v1.0.9 : La Model Console peut désormais redémarrer le démon Ollama. llm-init et le démon partagent un RUN_DIR sous appCache, et le wrapper lance `ollama serve` sous supervise_engine : modifier engine_args sur la carte du modèle relance le démon avec les nouvelles valeurs. La carte du modèle survit aussi à un redémarrage du Pod et, écrite sur disque, prime sur le paramètre ENGINE_ARGS de l’application.

    v1.0.6 : Baisser la réservation mémoire hôte NVIDIA pour faciliter l'installation sur les nœuds timeslice 1.12.6 (requête moteur 19Gi→6Gi, chart requiredMemory 20Gi→7Gi). Quota GPU inchangé.
    
    v1.0.1 : corriger l'encodage i18n zh-CN ; documenter le débit de décodage DFlash (~35-65 tok/s).
    v1.0.0 : version initiale - Muse Glimmer 30B Q4_K_M avec DFlash drafter inclus via Ollama 0.32.8-rc0.
  fullDescription: |
    **Aperçu du modèle**
    
    Même Muse Glimmer 30B Q4_K_M que le tag standard, avec DFlash drafter inclus pour une génération plus rapide. Tag : `muse-glimmer:30b-q4_K_M-dflash` (~20GB, contexte 128K). Nécessite Ollama 0.32.8-rc0+.
    
    **Preset :** thinking + tools + vision ; GPU `22Gi` ; Modelfile `draft_num_predict=3` ; débit de décodage typique **~35-65 tok/s** (selon le GPU).
    
    **Stack :** démon Ollama (11434) + Model Console (8090). Modèles stockés dans `appCommon/ollama`.

metadata:
  description: Muse Glimmer 30B Q4_K_M + Ollama 経由の DFlash 投機的デコード
  title: Muse Glimmer 30B DFlash
spec:
  upgradeDescription: |
    v1.0.12: Model Console（llm-init）を v1.7.21 に更新しました。

    v1.0.11: Model Console を llm-init v1.7.19 にアップグレードしました。

    v1.0.9: Model Console から Ollama デーモンを再起動できるようになりました。llm-init とデーモンが appCache 配下の RUN_DIR を共有し、wrapper は supervise_engine のもとで `ollama serve` を起動するため、モデルカードの engine_args を変更するとデーモンが新しい値で起動し直します。モデルカードは Pod 再起動後も保持され、ディスク上のカードはアプリ設定の ENGINE_ARGS より優先されます。

    v1.0.6: 1.12.6 timeslice ノードがインストールしやすくなるよう NVIDIA ホストメモリ予約を引き下げ（エンジン要求 19Gi→6Gi、chart requiredMemory 20Gi→7Gi）。GPU クォータは変更なし。
    
    v1.0.1: zh-CN i18n エンコーディングを修正；DFlash デコードスループット（~35-65 tok/s）を文書化。
    v1.0.0: 初回リリース - Ollama 0.32.8-rc0 経由で DFlash ドラフター同梱の Muse Glimmer 30B Q4_K_M。
  fullDescription: |
    **モデル概要**
    
    標準タグと同じ Muse Glimmer 30B Q4_K_M に、より高速な生成のための DFlash ドラフターを同梱。タグ: `muse-glimmer:30b-q4_K_M-dflash`（約 20GB、128K コンテキスト）。Ollama 0.32.8-rc0+ が必要。
    
    **プリセット:** thinking + tools + vision；GPU `22Gi`；Modelfile `draft_num_predict=3`；典型的なデコードスループット **~35-65 tok/s**（GPU 依存）。
    
    **スタック:** Ollama デーモン（11434）+ Model Console（8090）。モデルは `appCommon/ollama` に保存。

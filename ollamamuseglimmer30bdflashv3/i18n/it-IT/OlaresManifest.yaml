metadata:
  description: Muse Glimmer 30B Q4_K_M + decodifica speculativa DFlash tramite Ollama
  title: Muse Glimmer 30B DFlash
spec:
  upgradeDescription: |
    v1.0.12: Model Console (llm-init) è stato aggiornato alla versione v1.7.21.

    v1.0.11: Model Console viene aggiornato a llm-init v1.7.19.

    v1.0.9: La Model Console ora può riavviare il daemon Ollama. llm-init e il daemon condividono una RUN_DIR sotto appCache e il wrapper avvia `ollama serve` con supervise_engine, quindi modificare engine_args sulla scheda del modello riavvia il daemon con i nuovi valori. La scheda del modello sopravvive anche a un riavvio del Pod e, essendo su disco, ha la precedenza sull'impostazione ENGINE_ARGS dell'app.

    v1.0.6: Ridurre la prenotazione di memoria host NVIDIA così che i nodi timeslice 1.12.6 possano installare più facilmente (richiesta engine 19Gi→6Gi, chart requiredMemory 20Gi→7Gi). Quota GPU invariata.
    
    v1.0.1: correggere la codifica i18n zh-CN; documentare il throughput di decode DFlash (~35-65 tok/s).
    v1.0.0: rilascio iniziale - Muse Glimmer 30B Q4_K_M con DFlash drafter incluso tramite Ollama 0.32.8-rc0.
  fullDescription: |
    **Panoramica del modello**
    
    Stesso Muse Glimmer 30B Q4_K_M del tag standard, con DFlash drafter incluso per una generazione più rapida. Tag: `muse-glimmer:30b-q4_K_M-dflash` (~20GB, contesto 128K). Richiede Ollama 0.32.8-rc0+.
    
    **Preset:** thinking + tools + vision; GPU `22Gi`; Modelfile `draft_num_predict=3`; throughput di decode tipico **~35-65 tok/s** (dipende dalla GPU).
    
    **Stack:** demone Ollama (11434) + Model Console (8090). Modelli memorizzati in `appCommon/ollama`.

metadata:
  title: Muse Glimmer 30B DFlash
  description: Un modello IA locale per testo, comprensione delle immagini e attività con strumenti
spec:
  fullDescription: |
    Muse Glimmer 30B è un modello di Meta che riceve testo e immagini e genera risposte testuali. Supporta il ragionamento, l’assistenza nella programmazione e le attività che usano strumenti. Questa app esegue il modello localmente con Ollama e include DFlash, un modello ausiliario che propone testo da verificare al modello principale, contribuendo ad accelerare la generazione.

    **Funzionalità principali**

    - Rispondere a richieste testuali e a domande su immagini, inclusi screenshot, grafici e documenti.
    - Usare le funzioni di ragionamento e le chiamate agli strumenti nelle applicazioni compatibili che li forniscono.
    - Svolgere attività che richiedono più passaggi.
    - Accelerare la generazione di testo con DFlash; la velocità dipende dall’hardware e dalla richiesta.

    **Usare il modello su Olares**

    Model Console scarica e gestisce `muse-glimmer:30b-q4_K_M-dflash` per le applicazioni Olares compatibili. La finestra di contesto predefinita è di 128K token e limita la quantità di conversazione e di altri dati in ingresso che il modello può elaborare in una volta.

    [Informazioni sul modello Muse Glimmer](https://huggingface.co/meta-models/Muse-Glimmer-30B)

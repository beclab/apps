metadata:
  title: Muse Glimmer 30B DFlash
  description: Ein lokales KI-Modell für Text, Bildverständnis und Aufgaben mit Werkzeugnutzung
spec:
  fullDescription: |
    Muse Glimmer 30B ist ein Modell von Meta, das Text und Bilder als Eingabe verarbeitet und Textantworten erzeugt. Es unterstützt Schlussfolgerungen, Programmierhilfe und Aufgaben mit Werkzeugnutzung. Diese App führt das Modell lokal mit Ollama aus und enthält DFlash. Dieses Hilfsmodell schlägt Text vor, den das Hauptmodell prüft, um die Generierung zu beschleunigen.

    **Hauptfunktionen**

    - Auf Texteingaben und Fragen zu Bildern antworten, darunter Screenshots, Diagramme und Dokumente.
    - Denkfunktionen und Werkzeugaufrufe in kompatiblen Anwendungen nutzen, die Werkzeuge bereitstellen.
    - Aufgaben mit mehreren Schritten bearbeiten.
    - Die Textgenerierung mit DFlash beschleunigen; die Geschwindigkeit hängt von der Hardware und der Anfrage ab.

    **Das Modell auf Olares verwenden**

    Model Console lädt `muse-glimmer:30b-q4_K_M-dflash` herunter und verwaltet es für kompatible Olares-Anwendungen. Das voreingestellte Kontextfenster umfasst 128K Tokens und begrenzt die Menge an Gesprächsinhalten und weiteren Eingaben, die das Modell gleichzeitig verarbeiten kann.

    [Informationen zum Modell Muse Glimmer](https://huggingface.co/meta-models/Muse-Glimmer-30B)

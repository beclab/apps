metadata:
  description: Muse Glimmer 30B Q4_K_M + DFlash spekulative Dekodierung über Ollama
  title: Muse Glimmer 30B DFlash
spec:
  upgradeDescription: |
    v1.0.12: Model Console (llm-init) wurde auf v1.7.21 aktualisiert.

    v1.0.11: Model Console wird auf llm-init v1.7.19 aktualisiert.

    v1.0.9: Die Model Console kann den Ollama-Daemon jetzt neu starten. llm-init und der Daemon teilen sich ein RUN_DIR unter appCache, und der Wrapper startet `ollama serve` unter supervise_engine — eine Änderung von engine_args auf der Modellkarte startet den Daemon mit den neuen Werten neu. Die Modellkarte übersteht jetzt auch einen Pod-Neustart und hat als Datei auf der Platte Vorrang vor der App-Einstellung ENGINE_ARGS.

    v1.0.6: NVIDIA-Hostspeicher-Reservierung gesenkt, damit 1.12.6 Timeslice-Knoten leichter installieren können (Engine-Request 19Gi→6Gi, Chart requiredMemory 20Gi→7Gi). GPU-Kontingent unverändert.
    
    v1.0.1: zh-CN-i18n-Kodierung behoben; DFlash-Decode-Durchsatz dokumentiert (~35-65 tok/s).
    v1.0.0: Erstveröffentlichung - Muse Glimmer 30B Q4_K_M mit gebündeltem DFlash-Drafter über Ollama 0.32.8-rc0.
  fullDescription: |
    **Modellübersicht**
    
    Gleiches Muse Glimmer 30B Q4_K_M wie das Standard-Tag, mit gebündeltem DFlash-Drafter für schnellere Generierung. Tag: `muse-glimmer:30b-q4_K_M-dflash` (~20GB, 128K Kontext). Erfordert Ollama 0.32.8-rc0+.
    
    **Preset:** thinking + tools + vision; `22Gi` GPU; Modelfile `draft_num_predict=3`; typischer Decode-Durchsatz **~35-65 tok/s** (GPU-abhängig).
    
    **Stack:** Ollama-Daemon (11434) + Model Console (8090). Modelle gespeichert unter `appCommon/ollama`.

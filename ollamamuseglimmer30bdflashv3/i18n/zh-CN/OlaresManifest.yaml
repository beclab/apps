metadata:
  title: Muse Glimmer 30B DFlash
  description: 用于文本处理、图像理解和工具调用任务的本地 AI 模型
spec:
  fullDescription: |
    Muse Glimmer 30B 是 Meta 开发的模型，可接收文本和图像输入并生成文本回复，支持推理、编程辅助和需要使用工具的任务。本应用通过 Ollama 在本地运行模型，并包含 DFlash 辅助模型。DFlash 先提出候选文本，再由主模型检查，以帮助加快生成速度。

    **主要功能**

    - 响应文本提示，并回答有关截图、图表、文档等图像的问题。
    - 在提供工具的兼容应用中使用思考和工具调用功能。
    - 处理需要多个步骤的任务。
    - 使用 DFlash 加速文本生成；速度取决于硬件和具体请求。

    **在 Olares 上使用模型**

    Model Console 下载并管理 `muse-glimmer:30b-q4_K_M-dflash`，供兼容的 Olares 应用使用。默认上下文窗口为 128K tokens，决定模型一次能够处理多少对话和其他输入内容。

    [Muse Glimmer 模型介绍](https://huggingface.co/meta-models/Muse-Glimmer-30B)

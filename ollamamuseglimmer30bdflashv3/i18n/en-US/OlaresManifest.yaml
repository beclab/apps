metadata:

  description: "Muse Glimmer 30B Q4_K_M + DFlash speculative decoding via Ollama."

  title: Muse Glimmer 30B DFlash



spec:
  upgradeDescription: |
    v1.0.12: Model Console (llm-init) updated to v1.7.21.

    v1.0.11: Model Console upgrades to llm-init v1.7.19.

    v1.0.9: Model Console can now restart the Ollama daemon. llm-init and the daemon share a RUN_DIR under appCache, and the wrapper runs `ollama serve` under supervise_engine, so editing engine_args on the model card relaunches the daemon with the new values. The model card now also survives a Pod restart — and, being on disk, takes precedence over the ENGINE_ARGS app setting.

    v1.0.6: Lower the NVIDIA host-memory reservation so 1.12.6 timeslice nodes can install more easily (engine request 19Gi→6Gi, chart requiredMemory 20Gi→7Gi). GPU quota unchanged.

    v1.0.1: fix zh-CN i18n encoding; document DFlash decode throughput (~35-65 tok/s).
    v1.0.0: initial release - Muse Glimmer 30B Q4_K_M with bundled DFlash drafter via Ollama 0.32.8-rc0.

  fullDescription: |

    **Model Overview**

    Same Muse Glimmer 30B Q4_K_M as the standard tag, with bundled DFlash drafter for faster generation. Tag: `muse-glimmer:30b-q4_K_M-dflash` (~20GB, 128K context). Requires Ollama 0.32.8-rc0+.



    **Preset:** thinking + tools + vision; `22Gi` GPU; Modelfile `draft_num_predict=3`; typical decode throughput **~35-65 tok/s** (GPU-dependent).



    **Stack:** Ollama daemon (11434) + Model Console (8090). Models stored at `appCommon/ollama`.


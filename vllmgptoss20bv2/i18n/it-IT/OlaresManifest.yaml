metadata:
  title: GPT-OSS 20B (vLLM)
  description: "Modelli open-weight di OpenAI progettati per ragionamento potente, task agentici e casi d’uso versatili per sviluppatori"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un’app condivisa. Una volta installata dall’Admin Olares, tutti gli utenti del cluster possono usarla tramite l’app di riferimento.

    **PANORAMICA MODELLO**
    Benvenuti nella serie gpt-oss, i modelli open-weight di OpenAI progettati per ragionamento potente, task agentici e casi d’uso versatili per sviluppatori.

    **Modelli:**
    Rilasciamo due varianti di questi modelli aperti:
    gpt-oss-120b
    — per produzione, uso generale e alto ragionamento che entra in una singola GPU da 80GB (come NVIDIA H100 o AMD MI300X) (117B parametri con 5.1B attivi)

    gpt-oss-20b
    — per latenza inferiore e casi d’uso locali o specializzati (21B parametri con 3.6B attivi)

    Entrambi i modelli sono stati addestrati sul nostro formato di risposta harmony e devono essere usati solo con il formato harmony, altrimenti non funzioneranno correttamente.

    **Punti salienti**
    - Licenza Apache 2.0 permissiva: Costruisci liberamente senza restrizioni copyleft né rischio di brevetti — ideale per sperimentazione, personalizzazione e deployment commerciale.
    - Effort di ragionamento configurabile: Regola facilmente l’effort (low, medium, high) in base al caso d’uso e alle esigenze di latenza.
    - Full chain-of-thought: Accesso completo al processo di ragionamento del modello, per debug più semplice e maggiore fiducia negli output. Non destinato agli utenti finali.
    - Fine-tunable: Personalizza completamente i modelli al tuo caso d’uso tramite fine-tuning dei parametri.
    - Capacità agentiche: Usa le capacità native per function calling, web browsing, esecuzione di codice Python e Structured Outputs.
    - Quantizzazione MXFP4: I modelli sono stati post-addestrati con quantizzazione MXFP4 dei pesi MoE, consentendo a gpt-oss-120b di girare su una singola GPU da 80GB (come NVIDIA H100 o AMD MI300X) e a gpt-oss-20b entro 16GB di memoria. Tutte le eval sono state eseguite con la stessa quantizzazione MXFP4.

  upgradeDescription: |
    Aggiornare il runtime vLLM a v0.22.0-cu129; abilitare l’ottimizzazione -O3 e rendere persistente la cache torch.compile / FlashInfer.

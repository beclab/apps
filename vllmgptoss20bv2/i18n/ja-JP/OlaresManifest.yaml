metadata:
  title: GPT-OSS 20B (vLLM)
  description: "強力な推論、エージェンティックなタスク、多様な開発者ユースケース向けの OpenAI オープンウェイトモデル"

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。

    **モデル概要**
    gpt-oss シリーズへようこそ。強力な推論、エージェンティックなタスク、多様な開発者ユースケース向けに設計された OpenAI のオープンウェイトモデルです。

    **モデル:**
    これらのオープンモデルを 2 種類公開しています:
    gpt-oss-120b
    — 本番・汎用・高推論向け。単一の 80GB GPU（NVIDIA H100 や AMD MI300X など）に収まる（117B パラメータ、うち 5.1B アクティブ）

    gpt-oss-20b
    — 低レイテンシ、ローカルまたは特化ユースケース向け（21B パラメータ、うち 3.6B アクティブ）

    両モデルは harmony 応答フォーマットで学習されており、harmony フォーマットでのみ使用してください。それ以外では正しく動作しません。

    **機能ハイライト**
    - 寛容な Apache 2.0 ライセンス: コピーレフト制限や特許リスクなしで自由に構築 — 実験、カスタマイズ、商用展開に最適。
    - 設定可能な推論努力: ユースケースとレイテンシ要件に応じて推論努力（low、medium、high）を簡単に調整。
    - 完全な chain-of-thought: モデルの推論過程への完全アクセスでデバッグを容易にし、出力への信頼を高める。エンドユーザー向け表示は想定していません。
    - ファインチューン可能: パラメータ fine-tuning でユースケースに完全カスタマイズ。
    - エージェンティック能力: function calling、Web 閲覧、Python コード実行、Structured Outputs のネイティブ機能を利用。
    - MXFP4 量子化: MoE 重みの MXFP4 量子化でポストトレーニングされ、gpt-oss-120b は単一 80GB GPU（NVIDIA H100 や AMD MI300X など）で、gpt-oss-20b は 16GB メモリ内で動作。すべての評価は同じ MXFP4 量子化で実施。

  upgradeDescription: |
    vLLM ランタイムを v0.22.0-cu129 へアップグレード。-O3 最適化を有効化し、torch.compile / FlashInfer キャッシュを永続化。

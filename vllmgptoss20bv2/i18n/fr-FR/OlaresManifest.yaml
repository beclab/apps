metadata:
  title: GPT-OSS 20B (vLLM)
  description: "Modèles open-weight d’OpenAI conçus pour un raisonnement puissant, des tâches agentiques et des cas d’usage développeur polyvalents"

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s’agit d’une app partagée. Une fois installée par l’Admin Olares, tous les utilisateurs du cluster peuvent l’utiliser via l’app de référence.

    **APERÇU DU MODÈLE**
    Bienvenue dans la série gpt-oss, les modèles open-weight d’OpenAI conçus pour un raisonnement puissant, des tâches agentiques et des cas d’usage développeur polyvalents.

    **Modèles :**
    Nous publions deux variantes de ces modèles ouverts :
    gpt-oss-120b
    — pour la production, l’usage général et un fort raisonnement, tenant sur un seul GPU 80 Go (comme NVIDIA H100 ou AMD MI300X) (117B paramètres dont 5,1B actifs)

    gpt-oss-20b
    — pour une latence plus faible et des cas d’usage locaux ou spécialisés (21B paramètres dont 3,6B actifs)

    Les deux modèles ont été entraînés sur notre format de réponse harmony et ne doivent être utilisés qu’avec le format harmony, sinon ils ne fonctionneront pas correctement.

    **Points forts**
    - Licence Apache 2.0 permissive : Construisez librement sans restrictions copyleft ni risque de brevet — idéal pour l’expérimentation, la personnalisation et le déploiement commercial.
    - Effort de raisonnement configurable : Ajustez facilement l’effort (low, medium, high) selon votre cas d’usage et vos besoins de latence.
    - Chaîne de pensée complète : Accès complet au processus de raisonnement du modèle, facilitant le débogage et renforçant la confiance. Non destiné à être montré aux utilisateurs finaux.
    - Affinable : Personnalisez entièrement les modèles à votre cas d’usage via le fine-tuning des paramètres.
    - Capacités agentiques : Utilisez les capacités natives pour function calling, navigation web, exécution de code Python et Structured Outputs.
    - Quantification MXFP4 : Les modèles ont été post-entraînés avec une quantification MXFP4 des poids MoE, permettant à gpt-oss-120b de tourner sur un seul GPU 80 Go (comme NVIDIA H100 ou AMD MI300X) et à gpt-oss-20b dans 16 Go de mémoire. Toutes les évaluations ont été réalisées avec la même quantification MXFP4.

  upgradeDescription: |
    Mise à niveau du runtime vLLM vers v0.22.0-cu129 ; activer l’optimisation -O3 et persister le cache torch.compile / FlashInfer.

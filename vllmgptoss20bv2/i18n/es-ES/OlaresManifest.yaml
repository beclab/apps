metadata:
  title: GPT-OSS 20B (vLLM)
  description: "Modelos de pesos abiertos de OpenAI diseñados para razonamiento potente, tareas agenticas y casos de uso versátiles para desarrolladores"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Admin de Olares, todos los usuarios del clúster pueden usarla mediante la app de referencia.

    **RESUMEN DEL MODELO**
    Bienvenido a la serie gpt-oss, los modelos de pesos abiertos de OpenAI diseñados para razonamiento potente, tareas agenticas y casos de uso versátiles para desarrolladores.

    **Modelos:**
    Publicamos dos variantes de estos modelos abiertos:
    gpt-oss-120b
    — para producción, uso general y alto razonamiento que cabe en una sola GPU de 80GB (como NVIDIA H100 o AMD MI300X) (117B parámetros con 5.1B activos)

    gpt-oss-20b
    — para menor latencia y casos de uso locales o especializados (21B parámetros con 3.6B activos)

    Ambos modelos se entrenaron con nuestro formato de respuesta harmony y solo deben usarse con el formato harmony; de lo contrario no funcionarán correctamente.

    **Aspectos destacados**
    - Licencia Apache 2.0 permisiva: Construye libremente sin restricciones copyleft ni riesgo de patentes — ideal para experimentación, personalización y despliegue comercial.
    - Esfuerzo de razonamiento configurable: Ajusta fácilmente el esfuerzo (low, medium, high) según tu caso de uso y necesidades de latencia.
    - Cadena de pensamiento completa: Acceso completo al proceso de razonamiento del modelo, facilitando la depuración y aumentando la confianza. No está pensado para mostrarlo a usuarios finales.
    - Ajustable: Personaliza por completo los modelos a tu caso de uso mediante fine-tuning de parámetros.
    - Capacidades agenticas: Usa las capacidades nativas para function calling, navegación web, ejecución de código Python y Structured Outputs.
    - Cuantización MXFP4: Los modelos se post-entrenaron con cuantización MXFP4 de los pesos MoE, permitiendo que gpt-oss-120b corra en una sola GPU de 80GB (como NVIDIA H100 o AMD MI300X) y gpt-oss-20b dentro de 16GB de memoria. Todas las evaluaciones se hicieron con la misma cuantización MXFP4.

  upgradeDescription: |
    Actualizar el runtime vLLM a v0.22.0-cu129; habilitar la optimización -O3 y persistir la caché de torch.compile / FlashInfer.

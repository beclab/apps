metadata:
  title: GPT-OSS 20B (vLLM)
  description: "OpenAIs Open-Weight-Modelle für starkes Reasoning, agentische Aufgaben und vielseitige Entwickler-Anwendungsfälle"

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.

    **MODELLÜBERSICHT**
    Willkommen zur gpt-oss-Serie, OpenAIs Open-Weight-Modelle für starkes Reasoning, agentische Aufgaben und vielseitige Entwickler-Anwendungsfälle.

    **Modelle:**
    Wir veröffentlichen zwei Varianten dieser offenen Modelle:
    gpt-oss-120b
    — für Produktion, allgemeine Zwecke und hohes Reasoning, passend auf eine einzelne 80GB-GPU (wie NVIDIA H100 oder AMD MI300X) (117B Parameter mit 5,1B aktiven Parametern)

    gpt-oss-20b
    — für niedrigere Latenz sowie lokale oder spezialisierte Anwendungsfälle (21B Parameter mit 3,6B aktiven Parametern)

    Beide Modelle wurden auf unserem Harmony-Antwortformat trainiert und sollten nur mit dem Harmony-Format verwendet werden, sonst funktionieren sie nicht korrekt.

    **Funktionsschwerpunkte**
    - Freizügige Apache 2.0 Lizenz: Frei bauen ohne Copyleft-Einschränkungen oder Patentrisken — ideal für Experimente, Anpassung und kommerziellen Einsatz.
    - Konfigurierbarer Reasoning-Aufwand: Reasoning-Aufwand (low, medium, high) leicht an Anwendungsfall und Latenzbedarf anpassen.
    - Vollständige Chain-of-Thought: Voller Zugriff auf den Reasoning-Prozess des Modells für einfacheres Debugging und mehr Vertrauen in Ausgaben. Nicht für Endnutzer gedacht.
    - Feinabstimmung: Modelle per Parameter-Fine-Tuning vollständig an Ihren Anwendungsfall anpassen.
    - Agentische Fähigkeiten: Native Fähigkeiten für Function Calling, Web-Browsing, Python-Codeausführung und Structured Outputs.
    - MXFP4-Quantisierung: Die Modelle wurden mit MXFP4-Quantisierung der MoE-Gewichte nachtrainiert, sodass gpt-oss-120b auf einer einzelnen 80GB-GPU (wie NVIDIA H100 oder AMD MI300X) und gpt-oss-20b innerhalb von 16GB Speicher läuft. Alle Evals erfolgten mit derselben MXFP4-Quantisierung.

  upgradeDescription: |
    Upgrade der vLLM-Runtime auf v0.22.0-cu129; -O3-Optimierung aktivieren und torch.compile- / FlashInfer-Cache persistent speichern.

metadata:
  title: NocoDB
  description: Alternative open source à Airtable
spec:
  fullDescription: |
    NocoDB permet de créer des solutions de base de données no-code avec la simplicité des tableurs.
    
    NocoDB fournit une interface tableur intuitive pour créer des bases de données en ligne, à partir de zéro ou en se connectant à des bases. Vous pouvez transformer n'importe quel MySQL, PostgreSQL, SQL Server, SQLite et MariaDB en un tableur intelligent et accéder à vos données via des UI interactives comme Kanban, Form et Gallery, ou via API et SQL.
    
    
    Fonctionnalités
    
    * Interface tableur riche avec plusieurs vues et types de cellules variés.
    
    * Partagez bases / vues avec l'équipe.
    
    * Contrôle d'accès fin à différents niveaux.
    
    * Connectez-vous sans friction à chat, e-mail et stockage pour les automatisations de workflow.
    
    * Invoquez des actions de façon programmatique avec des API REST ou le SDK NocoDB.
    
    * Synchronisez les changements de schéma hors de la GUI NocoDB.
    
    * Tous les journaux d'opérations utilisateur sont conservés sous Audit.
  upgradeDescription: |
    Mise à niveau vers **2026.09.0** (`nocodb/nocodb:2026.09.0`).
    
    **Points forts**
    * Calendar Sync (Google / Outlook / CalDAV) — plans payants / sous licence
    * Annotations d'image sur les pièces jointes — plans payants / sous licence
    * Déclencheur de commentaire de workflow ; pièces jointes de commentaires et webhooks de commentaires
    * Formule : `MD5()` / `SHA256()` / `SHA512()`, `DATETIME_FORMAT()`, formats de calendrier Jalali
    * Calendrier : export .ics, échelle temporelle personnalisée, améliorations du calendrier mobile
    * Import Excel : ignorer des feuilles ; créer de nouveaux champs pendant l'import
    * Self-hosting : résolution du plan de licence à partir du type de licence signé ; les essais expirés retombent sur Community au lieu de bloquer l'UI
    * Nouvelles env optionnelles : `NC_ALLOW_LOCAL_DATA_IMPORT`, `NC_AI_*` (non requises pour l'installation par défaut)
    * Déplacer `NC_DB` et `NC_AUTH_JWT_SECRET` dans un Kubernetes Secret (`secretKeyRef`)
    * Supprimer les branches de chemin obsolètes `sysVersion >=1.12.3` (le minimum Olares est 1.12.6)
    
    **Env / démarrage**
    * Format de chaîne de connexion `NC_DB` inchangé (`pg://host:port?u=&p=&d=`)
    * Le volume de données reste `/usr/app/data` ; le port HTTP reste `8080`
    * Aucun nouvel argument de démarrage requis pour cette mise à niveau
    
    Notes complètes : https://github.com/nocodb/nocodb/releases/tag/2026.09.0

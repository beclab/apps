metadata:
  title: NocoDB
  description: Alternative open source à Airtable
spec:
  fullDescription: |
    NocoDB permet de créer des solutions de base de données no-code avec la simplicité des tableurs.
    
    NocoDB fournit une interface tableur intuitive pour créer des bases de données en ligne, à partir de zéro ou en se connectant à des bases. Vous pouvez transformer n'importe quel MySQL, PostgreSQL, SQL Server, SQLite et MariaDB en un tableur intelligent et accéder à vos données via des UI interactives comme Kanban, Form et Gallery, ou via API et SQL.
    
    
    Fonctionnalités
    
    * Interface tableur riche avec plusieurs vues et types de cellules variés.
    
    * Partagez bases / vues avec l'équipe.
    
    * Contrôle d'accès fin à différents niveaux.
    
    * Connectez-vous sans friction à chat, e-mail et stockage pour les automatisations de workflow.
    
    * Invoquez des actions de façon programmatique avec des API REST ou le SDK NocoDB.
    
    * Synchronisez les changements de schéma hors de la GUI NocoDB.
    
    * Tous les journaux d'opérations utilisateur sont conservés sous Audit.
  upgradeDescription: |
    Met à jour NocoDB vers 2026.10.1 avec des améliorations des tables et de MCP. Les dates PostgreSQL/SQLite dans les API, webhooks et CSV incluent les millisecondes ; adaptez les formats fixes. Changer le mot de passe révoque les jetons API et connexions OAuth. Les clients MCP limités peuvent utiliser `/mcp-discovery`.

    Notes de version : https://github.com/NocoDB/NocoDB/releases/tag/2026.10.1

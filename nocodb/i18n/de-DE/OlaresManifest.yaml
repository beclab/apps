metadata:
  title: NocoDB
  description: Open-Source-Airtable-Alternative
spec:
  fullDescription: |
    NocoDB ermöglicht den Aufbau von No-Code-Datenbanklösungen mit der Einfachheit von Tabellenkalkulationen.
    
    NocoDB bietet eine intuitive Tabellenoberfläche zum Erstellen von Online-Datenbanken – von Grund auf oder durch Verbindung mit Datenbanken. Sie können jedes MySQL, PostgreSQL, SQL Server, SQLite & MariaDB in eine intelligente Tabelle verwandeln und über interaktive UIs wie Kanban, Form und Gallery oder über API und SQL auf Ihre Daten zugreifen.
    
    
    Funktionen
    
    * Reichhaltige Tabellenoberfläche mit mehreren Ansichten und variantenreichen Zelltypen.
    
    * Bases / Views mit dem Team teilen.
    
    * Feingranulare Zugriffskontrolle auf verschiedenen Ebenen.
    
    * Nahtlose Verbindung zu Chat, E-Mail und Speicherdiensten für Workflow-Automatisierungen.
    
    * Programmatische Aktionen über REST-APIs oder NocoDB SDK.
    
    * Schema-Änderungen außerhalb der NocoDB-GUI synchronisieren.
    
    * Alle Benutzeroperationsprotokolle werden unter Audit aufbewahrt.
  upgradeDescription: |
    Aktualisiert NocoDB auf 2026.10.1 mit Tabellen- und MCP-Verbesserungen. PostgreSQL/SQLite-Zeitstempel in APIs, Webhooks und CSV enthalten nun Millisekunden; passen Sie feste Parser an. Passwortänderungen widerrufen API-Tokens und OAuth-Verbindungen. MCP-Clients mit Werkzeuglimits können `/mcp-discovery` verwenden.

    Versionshinweise: https://github.com/NocoDB/NocoDB/releases/tag/2026.10.1

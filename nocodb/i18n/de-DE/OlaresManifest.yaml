metadata:
  title: NocoDB
  description: Open-Source-Airtable-Alternative
spec:
  fullDescription: |
    NocoDB ermöglicht den Aufbau von No-Code-Datenbanklösungen mit der Einfachheit von Tabellenkalkulationen.
    
    NocoDB bietet eine intuitive Tabellenoberfläche zum Erstellen von Online-Datenbanken – von Grund auf oder durch Verbindung mit Datenbanken. Sie können jedes MySQL, PostgreSQL, SQL Server, SQLite & MariaDB in eine intelligente Tabelle verwandeln und über interaktive UIs wie Kanban, Form und Gallery oder über API und SQL auf Ihre Daten zugreifen.
    
    
    Funktionen
    
    * Reichhaltige Tabellenoberfläche mit mehreren Ansichten und variantenreichen Zelltypen.
    
    * Bases / Views mit dem Team teilen.
    
    * Feingranulare Zugriffskontrolle auf verschiedenen Ebenen.
    
    * Nahtlose Verbindung zu Chat, E-Mail und Speicherdiensten für Workflow-Automatisierungen.
    
    * Programmatische Aktionen über REST-APIs oder NocoDB SDK.
    
    * Schema-Änderungen außerhalb der NocoDB-GUI synchronisieren.
    
    * Alle Benutzeroperationsprotokolle werden unter Audit aufbewahrt.
  upgradeDescription: |
    Upgrade auf **2026.09.0** (`nocodb/nocodb:2026.09.0`).
    
    **Highlights**
    * Calendar Sync (Google / Outlook / CalDAV) — bezahlte / lizenzierte Pläne
    * Bildannotationen an Anhängen — bezahlte / lizenzierte Pläne
    * Workflow-Kommentar-Trigger; Kommentaranhänge und Kommentar-Webhooks
    * Formel: `MD5()` / `SHA256()` / `SHA512()`, `DATETIME_FORMAT()`, Jalali-Kalenderformate
    * Kalender: .ics-Export, benutzerdefinierte Zeitskala, mobile Kalenderverbesserungen
    * Excel-Import: Blätter überspringen; neue Felder während des Imports erstellen
    * Self-Hosting: Lizenzplanauflösung aus signiertem Lizenztyp; abgelaufene Trials fallen auf Community zurück statt die UI zu blockieren
    * Neue optionale Env: `NC_ALLOW_LOCAL_DATA_IMPORT`, `NC_AI_*` (für Standardinstallation nicht erforderlich)
    * `NC_DB` und `NC_AUTH_JWT_SECRET` in Kubernetes Secret (`secretKeyRef`) verschoben
    * Veraltete `sysVersion >=1.12.3`-Pfadverzweigungen entfernt (Olares-Minimum ist 1.12.6)
    
    **Env / Startup**
    * `NC_DB`-Connection-String-Format unverändert (`pg://host:port?u=&p=&d=`)
    * Datenvolume weiterhin `/usr/app/data`; HTTP-Port weiterhin `8080`
    * Keine neuen erforderlichen Startup-Args für dieses Upgrade
    
    Vollständige Release Notes: https://github.com/nocodb/nocodb/releases/tag/2026.09.0

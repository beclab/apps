metadata:
  title: NocoDB
  description: Alternativa open source ad Airtable
spec:
  fullDescription: |
    NocoDB consente di creare soluzioni database no-code con la semplicità dei fogli di calcolo.
    
    NocoDB offre un'interfaccia intuitiva a foglio di calcolo per creare database online, da zero o collegandosi a database. Puoi trasformare qualsiasi MySQL, PostgreSQL, SQL Server, SQLite e MariaDB in un foglio di calcolo intelligente e accedere ai dati tramite UI interattive come Kanban, Form e Gallery, oppure via API e SQL.
    
    
    Funzioni
    
    * Ricca interfaccia a foglio di calcolo con più viste e tipi di cella variati.
    
    * Condividi base / viste con il team.
    
    * Controllo accessi a grana fine a diversi livelli.
    
    * Collegati senza attriti a chat, email e storage per le automazioni di workflow.
    
    * Invoca azioni in modo programmatico con REST API o NocoDB SDK.
    
    * Sincronizza le modifiche allo schema fuori dalla GUI di NocoDB.
    
    * Tutti i log delle operazioni utente sono conservati in Audit.
  upgradeDescription: |
    Aggiornamento a **2026.09.0** (`nocodb/nocodb:2026.09.0`).
    
    **Highlight**
    * Calendar Sync (Google / Outlook / CalDAV) — piani a pagamento / con licenza
    * Annotazioni immagine sugli allegati — piani a pagamento / con licenza
    * Trigger commento workflow; allegati commento e webhook commento
    * Formula: `MD5()` / `SHA256()` / `SHA512()`, `DATETIME_FORMAT()`, formati calendario Jalali
    * Calendario: export .ics, scala temporale personalizzata, miglioramenti calendario mobile
    * Import Excel: salta fogli; crea nuovi campi durante l'import
    * Self-hosting: risoluzione del piano licenza dal tipo di licenza firmato; i trial scaduti tornano a Community invece di bloccare la UI
    * Nuove env opzionali: `NC_ALLOW_LOCAL_DATA_IMPORT`, `NC_AI_*` (non richieste per l'installazione predefinita)
    * Spostare `NC_DB` e `NC_AUTH_JWT_SECRET` in Kubernetes Secret (`secretKeyRef`)
    * Rimuovere i rami di path obsoleti `sysVersion >=1.12.3` (il minimo Olares è 1.12.6)
    
    **Env / avvio**
    * Formato connection string `NC_DB` invariato (`pg://host:port?u=&p=&d=`)
    * Il volume dati resta `/usr/app/data`; la porta HTTP resta `8080`
    * Nessun nuovo arg di avvio richiesto per questo upgrade
    
    Note complete: https://github.com/nocodb/nocodb/releases/tag/2026.09.0

metadata:
  title: NocoDB
  description: オープンソースの Airtable 代替
spec:
  fullDescription: |
    NocoDB は、スプレッドシートの手軽さでノーコードのデータベースソリューションを構築できます。
    
    NocoDB は、ゼロから、または既存データベースへの接続によりオンラインデータベースを作成するための直感的なスプレッドシート UI を提供します。MySQL、PostgreSQL、SQL Server、SQLite、MariaDB をスマートスプレッドシートに変え、Kanban、Form、Gallery などの対話 UI、または API と SQL 経由でデータにアクセスできます。
    
    
    機能
    
    * 複数ビューと多様なセル型を備えた充実したスプレッドシート UI。
    
    * ベース／ビューをチームと共有。
    
    * 各レベルのきめ細かいアクセス制御。
    
    * チャット、メール、ストレージサービスにシームレス接続してワークフロー自動化。
    
    * REST API または NocoDB SDK でプログラムからアクションを呼び出し。
    
    * NocoDB GUI 外でのスキーマ変更を同期。
    
    * すべてのユーザー操作ログを Audit に保持。
  upgradeDescription: |
    NocoDB を 2026.10.1 に更新し、テーブルと MCP を改善します。PostgreSQL/SQLite の API、Webhook、CSV の日時にミリ秒が含まれます。固定形式の解析を調整してください。パスワード変更で API トークンと OAuth 接続が失効します。ツール数制限のある MCP クライアントは `/mcp-discovery` を利用できます。

    リリースノート: https://github.com/NocoDB/NocoDB/releases/tag/2026.10.1

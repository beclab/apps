metadata:
  title: NocoDB
  description: オープンソースの Airtable 代替
spec:
  fullDescription: |
    NocoDB は、スプレッドシートの手軽さでノーコードのデータベースソリューションを構築できます。
    
    NocoDB は、ゼロから、または既存データベースへの接続によりオンラインデータベースを作成するための直感的なスプレッドシート UI を提供します。MySQL、PostgreSQL、SQL Server、SQLite、MariaDB をスマートスプレッドシートに変え、Kanban、Form、Gallery などの対話 UI、または API と SQL 経由でデータにアクセスできます。
    
    
    機能
    
    * 複数ビューと多様なセル型を備えた充実したスプレッドシート UI。
    
    * ベース／ビューをチームと共有。
    
    * 各レベルのきめ細かいアクセス制御。
    
    * チャット、メール、ストレージサービスにシームレス接続してワークフロー自動化。
    
    * REST API または NocoDB SDK でプログラムからアクションを呼び出し。
    
    * NocoDB GUI 外でのスキーマ変更を同期。
    
    * すべてのユーザー操作ログを Audit に保持。
  upgradeDescription: |
    **2026.09.0**（`nocodb/nocodb:2026.09.0`）へアップグレード。
    
    **ハイライト**
    * Calendar Sync（Google / Outlook / CalDAV）— 有料／ライセンスプラン
    * 添付への画像アノテーション — 有料／ライセンスプラン
    * ワークフローコメントトリガー; コメント添付とコメント Webhook
    * 数式: `MD5()` / `SHA256()` / `SHA512()`、`DATETIME_FORMAT()`、Jalali カレンダー形式
    * カレンダー: .ics エクスポート、カスタム時間スケール、モバイルカレンダー改善
    * Excel インポート: シートをスキップ; インポート中に新規フィールド作成
    * セルフホスト: 署名済みライセンスタイプからのプラン解決; 期限切れトライアルは UI をブロックせず Community にフォールバック
    * 新しい任意 env: `NC_ALLOW_LOCAL_DATA_IMPORT`、`NC_AI_*`（既定インストールでは不要）
    * `NC_DB` と `NC_AUTH_JWT_SECRET` を Kubernetes Secret（`secretKeyRef`）へ移動
    * 古い `sysVersion >=1.12.3` パス分岐を削除（Olares 最小は 1.12.6）
    
    **Env / 起動**
    * `NC_DB` 接続文字列形式は変更なし（`pg://host:port?u=&p=&d=`）
    * データボリュームは引き続き `/usr/app/data`; HTTP ポートは引き続き `8080`
    * 本アップグレードで新しい必須起動引数なし
    
    完全なリリースノート: https://github.com/nocodb/nocodb/releases/tag/2026.09.0

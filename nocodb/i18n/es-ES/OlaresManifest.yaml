metadata:
  title: NocoDB
  description: Alternativa open source a Airtable
spec:
  fullDescription: |
    NocoDB permite construir soluciones de base de datos no-code con la facilidad de las hojas de cálculo.
    
    NocoDB ofrece una interfaz intuitiva tipo hoja de cálculo para crear bases de datos online, desde cero o conectándose a bases de datos. Puedes convertir cualquier MySQL, PostgreSQL, SQL Server, SQLite y MariaDB en una hoja de cálculo inteligente y acceder a tus datos mediante UIs interactivas como Kanban, Form y Gallery, o vía API y SQL.
    
    
    Funciones
    
    * Rica interfaz de hoja de cálculo con múltiples vistas y tipos de celda variados.
    
    * Compartir bases / vistas con el equipo.
    
    * Control de acceso de grano fino en distintos niveles.
    
    * Conéctate sin fricción a chat, correo y almacenamiento para automatizaciones de flujo de trabajo.
    
    * Invoca acciones de forma programática con REST APIs o el SDK de NocoDB.
    
    * Sincroniza cambios de esquema fuera de la GUI de NocoDB.
    
    * Todos los registros de operaciones de usuario se conservan en Audit.
  upgradeDescription: |
    Actualización a **2026.09.0** (`nocodb/nocodb:2026.09.0`).
    
    **Aspectos destacados**
    * Calendar Sync (Google / Outlook / CalDAV) — planes de pago / con licencia
    * Anotaciones de imagen en adjuntos — planes de pago / con licencia
    * Disparador de comentarios de workflow; adjuntos de comentarios y webhooks de comentarios
    * Fórmula: `MD5()` / `SHA256()` / `SHA512()`, `DATETIME_FORMAT()`, formatos de calendario Jalali
    * Calendario: exportación .ics, escala temporal personalizada, mejoras del calendario móvil
    * Importación Excel: omitir hojas; crear nuevos campos al importar
    * Self-hosting: resolución del plan de licencia desde el tipo de licencia firmada; los trials caducados vuelven a Community en lugar de bloquear la UI
    * Nuevas env opcionales: `NC_ALLOW_LOCAL_DATA_IMPORT`, `NC_AI_*` (no requeridas para la instalación por defecto)
    * Mover `NC_DB` y `NC_AUTH_JWT_SECRET` a Kubernetes Secret (`secretKeyRef`)
    * Eliminar ramas de ruta obsoletas `sysVersion >=1.12.3` (el mínimo de Olares es 1.12.6)
    
    **Env / arranque**
    * Formato de cadena de conexión `NC_DB` sin cambios (`pg://host:port?u=&p=&d=`)
    * El volumen de datos sigue siendo `/usr/app/data`; el puerto HTTP sigue siendo `8080`
    * No hay nuevos args de arranque requeridos para esta actualización
    
    Notas completas: https://github.com/nocodb/nocodb/releases/tag/2026.09.0

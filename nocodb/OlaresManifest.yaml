---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  nocodb: 1
metadata:
  name: nocodb
  description: Open Source Airtable Alternative.
  icon: https://app.cdn.olares.com/appstore/nocodb/icon.png
  appid: nocodb
  version: "1.0.22"
  title: NocoDB
  categories:
  - Productivity_v112
  - workspace
  - developer
  tags:
  - data
  - low-code

permission:
  appData: true
  appCache: true
spec:
  versionName: "2026.10.1"
  fullDescription: |
    NocoDB allows building no-code database solutions with ease of spreadsheets.

    NocoDB provides an intuitive spreadsheet interface for creating online databases, either from scratch or by connecting to databases. You can turn any MySQL, PostgreSQL, SQL Server, SQLite & MariaDB into a smart spreadsheet and access your data through interactive UIs like Kanban, Form, and Gallery, or via API and SQL.

    Features

    * Rich spreadsheet interface with multiple views and variant cell types.

    * Share bases / views with team.

    * Fine-grained Access Control at different levels.

    * Connect seamlessly to your chat, email, storage service for workflow automations.

    * Programmatic invoke actions using REST APIs or NocoDB SDK.

    * Sync your schema changes outside NocoDB GUI.

    * All the user operation logs are kept under Audit.

  upgradeDescription: |
    Upgrade NocoDB to 2026.10.1 with table and MCP improvements. PostgreSQL/SQLite timestamps in APIs, webhooks and CSV exports now include milliseconds; adjust fixed-format parsers. Password changes revoke API tokens and OAuth connections. MCP clients with tool limits can use `/mcp-discovery`.

    Release notes: https://github.com/NocoDB/NocoDB/releases/tag/2026.10.1

  promoteImage:
  - https://app.cdn.olares.com/appstore/nocodb/promote_image_1v2.webp
  - https://app.cdn.olares.com/appstore/nocodb/promote_image_2v2.webp
  - https://app.cdn.olares.com/appstore/nocodb/promote_image_3v2.webp
  - https://app.cdn.olares.com/appstore/nocodb/promote_image_4v2.webp
  developer: NocoDB
  website: https://nocodb.com/
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 128Mi
  limitedDisk: 100Gi
  requiredCpu: 0.5
  limitedCpu: 1
  doc: https://docs.nocodb.com/
  legal:
  - text: Privacy Policy
    url: https://nocodb.com/privacy
  - text: Security policy
    url: https://github.com/nocodb/nocodb/security/policy
  - text: Terms of Use
    url: https://nocodb.com/terms-of-service
  license:
  - text: Sustainable Use License (Fair-code)
    url: https://github.com/nocodb/nocodb/releases/tag/0.301.0
  supportArch:
  - amd64
  - arm64
  runAsUser: true
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 465
  - 587
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: nocodb-svc
  port: 80
  host: nocodb-svc
  title: NocoDB
  icon: https://app.cdn.olares.com/appstore/nocodb/icon.png
  authLevel: public
  openMethod: window
middleware:
  postgres:
    username: postgres
    password: postgres
    databases:
    - name: nocodb
      distributed: true

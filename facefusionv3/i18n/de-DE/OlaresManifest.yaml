metadata:
  title: FaceFusion
  description: Führende Plattform für Gesichtsbearbeitung
spec:
  fullDescription: |
    FaceFusion ist eine führende Plattform für Gesichtsbearbeitung. Sie ermöglicht müheloses Face-Swapping und atemberaubende Foto-Manipulationen.

    **Key Features:**
    Advanced Facical Image Generation and Editing
    - Nutzt hochwertige Algorithmen für nahtloses und realistisches Blending von Gesichtsmerkmalen mit anpassbarer Intensität; bietet Facial Morphing, Blending mehrerer Gesichter, realistische Transformationen

    Multiple Face Swapping:
    - Unterstützt das Austauschen mehrerer Gesichter in einem Projekt.

    Real-Time Processing:
    - Sofortige Vorschauen und Ergebnisse für schnelle, interaktive Face Fusion.

    Age Modification:
    - Scheinbares Alter eines Gesichts ändern

    Lip Sync:
    - Stellt sicher, dass getauschte Gesichter in Videos perfekt mit dem Audio synchronisiert sind und natürliche Mundbewegungen erzeugen.

    Deep Swapper (DeepFaceLive Models):
    - Dedizierter Face-Swap-Prozessor mit community-trainierten DeepFaceLive-`.dfm`-Modellen und einer integrierten Bibliothek von über 24 Celebrity-Gesichtern.

    **Model storage (App Common, shared)**
    FaceFusion-Modellpakete (3.0.0 → 3.6.0) liegen im gemeinsamen Cross-App App-Common-
    HF-Hub-Cache (`appCommon/huggingface`, fester Containerpfad `/cache/hf/hub`).
    Ein `llm-init`-Download-only-Sidecar holt jedes Repo über den
    `OLARES_USER_HUGGINGFACE_SERVICE` des Nutzers in diesen Store; die Engine mountet denselben Store und
    wartet auf `download-svc:/readyz`, bevor sie die flache
    `/facefusion/.assets/models`-Ansicht als ephemeren Symlink-Farm über
    die gecachten Snapshots neu aufbaut. Modellbytes werden dedupliziert und appübergreifend wiederverwendet.
  upgradeDescription: |
    Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat` umgestellt.

    Nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images angepasst (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernt.

    llm-init-Image auf `beclab/llm-init:v1.3.1` aktualisiert.

    V3 Shared-App-Migration von FaceFusion (Engine 3.6.1).

    **What's Changed**

    - **Download architecture**: spezieller `harveyff-hf-downloader-only`
      Job durch shared `llm-init` Download-only Deployment
      (`facefusiondownloader`) ersetzt, analog speachesv3 / acestep15v3. Modellpakete landen nun
      im gemeinsamen Cross-App-HF-Cache (App Common, `/cache/hf/hub`) im
      Standardlayout `models--owner--repo/snapshots/<sha>/...`; die Engine wartet
      auf `download-svc:/readyz` statt per-Repo-`.done`-Sentinels und baut
      das flache `/facefusion/.assets/models`-Layout beim Start als Symlink-Farm neu auf.
    - **Entrance routing**: nginx an acestep15v3 angeglichen — llm-init-API-
      Pfade an download-svc gepinnt; `/` wartet auf Modell-Download UND Gradio-Readiness
      und lädt vom Download-Dashboard automatisch via `/__app_ready` in die App um.
    - **Architecture**: Engine-Deployment heißt jetzt nach der App-ID
      (`facefusionv3`); nginx-Entrance (`facefusionproxy`) und Downloader
      (`facefusiondownloader`) sind unabhängige Workloads via
      `workloadReplicas`.
    - **HF env**: HF-Mirror / Token kommen vom System-HF-Konto des Nutzers
      via `valueFrom` (lokal als `HF_ENDPOINT` / `HF_TOKEN` deklariert; Templates
      referenzieren `OLARES_USER_*`-Namen nicht mehr direkt, wie von v3 verlangt).
    - **Resources**: `limitedMemory` auf 21Gi erhöht, damit Engine (16Gi) + llm-init
      (4Gi) + nginx (256Mi) Limits in die Envelope passen.

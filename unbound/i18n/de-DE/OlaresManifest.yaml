metadata:
  title: Unbound
  description: Ein DNS-Resolver, der Domainnamen auflöst, Antworten validiert und zwischenspeichert
spec:
  fullDescription: |
    Unbound ist ein DNS-Resolver, der Domainnamen in IP-Adressen übersetzt. Er kann Antworten durch Abfragen der DNS-Hierarchie ermitteln, digital signierte DNS-Daten mit DNSSEC validieren und Ergebnisse für spätere Anfragen zwischenspeichern.

    **Hauptfunktionen**

    - Domainnamen rekursiv auflösen, ohne jede Anfrage an einen öffentlichen DNS-Resolver weiterzuleiten.
    - DNSSEC-Signaturen prüfen, um die Authentizität und Integrität signierter DNS-Daten zu bestätigen.
    - Zwischengespeicherte Antworten für wiederholte Anfragen nutzen.
    - Als vorgeschalteter Resolver für einen DNS-Filter wie AdGuard Home dienen.

    **Unbound auf Olares verwenden**

    Ein Administrator installiert einen gemeinsam genutzten Resolver. Apps und Geräte müssen so konfiguriert werden, dass sie ihn direkt oder über einen DNS-Filter nutzen. Konfigurieren Sie Unbound, indem Sie `unbound.conf` im mitgelieferten Terminal bearbeiten. Die Konfiguration bleibt über Neustarts und Upgrades hinweg erhalten; eine grafische Konfigurationsoberfläche ist nicht vorhanden.

    Die rekursive Auflösung erfordert ausgehenden DNS-Zugriff über Port 53. Wenn Ihr Netzwerk diesen Zugriff blockiert oder abfängt, können Sie alternativ die Weiterleitung an einen DNS-over-TLS-Anbieter über Port 853 konfigurieren. DNSSEC validiert DNS-Daten, verschlüsselt jedoch keine Anfragen; rekursive Anfragen an DNS-Server werden im Klartext gesendet.

    [Unbound-Dokumentation](https://unbound.docs.nlnetlabs.nl/)

metadata:
  title: Unbound
  description: Un resolver DNS che risolve i nomi di dominio, convalida e memorizza le risposte in cache
spec:
  fullDescription: |
    Unbound è un resolver DNS che traduce i nomi di dominio in indirizzi IP. Può trovare le risposte interrogando la gerarchia DNS, convalidare i dati DNS firmati digitalmente tramite DNSSEC e memorizzare i risultati in cache per le richieste successive.

    **Funzionalità principali**

    - Risolvere i nomi di dominio in modo ricorsivo senza inoltrare ogni richiesta a un resolver DNS pubblico.
    - Verificare le firme DNSSEC per confermare l’autenticità e l’integrità dei dati DNS firmati.
    - Riutilizzare le risposte in cache per le richieste ripetute.
    - Fungere da resolver a monte per un filtro DNS come AdGuard Home.

    **Usare Unbound su Olares**

    Un amministratore installa un unico resolver condiviso. Le app e i dispositivi devono essere configurati per utilizzarlo, direttamente o tramite un filtro DNS. Configura Unbound modificando `unbound.conf` nel terminale incluso. La configurazione viene conservata dopo i riavvii e gli aggiornamenti; non è disponibile un’interfaccia grafica di configurazione.

    La risoluzione ricorsiva richiede l’accesso DNS in uscita sulla porta 53. Se la rete blocca o intercetta questo accesso, puoi configurare in alternativa l’inoltro a un provider DNS-over-TLS sulla porta 853. DNSSEC convalida i dati DNS, ma non cifra le richieste; le richieste ricorsive ai server DNS vengono inviate in chiaro.

    [Documentazione di Unbound](https://unbound.docs.nlnetlabs.nl/)

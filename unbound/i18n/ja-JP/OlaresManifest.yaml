metadata:
  title: Unbound
  description: ドメイン名の名前解決、応答の検証、結果のキャッシュを行うDNSリゾルバー
spec:
  fullDescription: |
    Unboundは、ドメイン名をIPアドレスに変換するDNSリゾルバーです。DNSの階層をたどって問い合わせることで応答を取得し、DNSSECでデジタル署名付きのDNSデータを検証して、後続の問い合わせに備えて結果をキャッシュできます。

    **主な機能**

    - すべての問い合わせをパブリックDNSリゾルバーに転送することなく、ドメイン名を再帰的に解決します。
    - DNSSEC署名を確認し、署名付きDNSデータの真正性と完全性を検証します。
    - 繰り返される問い合わせにキャッシュ済みの応答を再利用します。
    - AdGuard HomeなどのDNSフィルターの上流リゾルバーとして利用できます。

    **OlaresでUnboundを使う**

    管理者が共有リゾルバーを1つインストールします。アプリやデバイスは、直接またはDNSフィルター経由でこのリゾルバーを利用するように設定する必要があります。付属のターミナルで`unbound.conf`を編集してUnboundを設定します。設定は再起動やアップグレード後も保持されます。グラフィカルな設定画面はありません。

    再帰的な名前解決には、ポート53での外向きDNS通信が必要です。ネットワークがこの通信を遮断または傍受する場合は、代わりにポート853でDNS-over-TLSプロバイダーへ転送する設定が可能です。DNSSECはDNSデータを検証しますが、問い合わせを暗号化するものではありません。DNSサーバーへの再帰的な問い合わせは平文で送信されます。

    [Unboundのドキュメント](https://unbound.docs.nlnetlabs.nl/)

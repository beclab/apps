metadata:
  title: Unbound
  description: 提供域名解析、应答验证和结果缓存的 DNS 解析器
spec:
  fullDescription: |
    Unbound 是将域名转换为 IP 地址的 DNS 解析器。它可以逐级查询 DNS 服务器以获取解析结果，通过 DNSSEC 验证带有数字签名的 DNS 数据，并缓存结果以供后续请求使用。

    **主要功能**

    - 通过递归查询解析域名，无需将每个请求转发给公共 DNS 解析器。
    - 校验 DNSSEC 签名，验证已签名 DNS 数据的真实性与完整性。
    - 对重复查询复用缓存中的解析结果。
    - 作为 AdGuard Home 等 DNS 过滤器的上游解析服务。

    **在 Olares 上使用 Unbound**

    管理员安装一个共享解析服务。应用和设备需要配置为直接使用它，或通过 DNS 过滤器使用它。在随附的终端中编辑 `unbound.conf` 即可配置 Unbound。配置会持久保存，重启和升级后保留；不提供图形化配置界面。

    递归解析需要允许通过 53 端口向外发送 DNS 查询。如果网络封锁或拦截此类连接，可以配置为通过 853 端口向 DNS-over-TLS 服务商转发查询。DNSSEC 用于验证 DNS 数据，不会加密查询；向 DNS 服务器发送的递归查询为明文。

    [Unbound 文档](https://unbound.docs.nlnetlabs.nl/)

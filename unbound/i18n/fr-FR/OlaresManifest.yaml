metadata:
  title: Unbound
  description: Un résolveur DNS qui résout les noms de domaine, valide et met en cache les réponses
spec:
  fullDescription: |
    Unbound est un résolveur DNS qui traduit les noms de domaine en adresses IP. Il peut trouver les réponses en interrogeant la hiérarchie DNS, valider les données DNS signées numériquement avec DNSSEC et mettre les résultats en cache pour les requêtes suivantes.

    **Fonctionnalités principales**

    - Résoudre les noms de domaine de manière récursive sans transmettre chaque requête à un résolveur DNS public.
    - Vérifier les signatures DNSSEC pour contrôler l’authenticité et l’intégrité des données DNS signées.
    - Réutiliser les réponses en cache pour les requêtes répétées.
    - Servir de résolveur en amont pour un filtre DNS tel qu’AdGuard Home.

    **Utiliser Unbound sur Olares**

    Un administrateur installe un résolveur partagé. Les applications et les appareils doivent être configurés pour l’utiliser, directement ou par l’intermédiaire d’un filtre DNS. Configurez Unbound en modifiant `unbound.conf` dans le terminal fourni. La configuration est conservée après les redémarrages et les mises à niveau ; aucune interface graphique de configuration n’est proposée.

    La résolution récursive nécessite un accès DNS sortant sur le port 53. Si votre réseau bloque ou intercepte cet accès, vous pouvez configurer le transfert vers un fournisseur DNS-over-TLS sur le port 853. DNSSEC valide les données DNS, mais ne chiffre pas les requêtes ; les requêtes récursives envoyées aux serveurs DNS sont en clair.

    [Documentation d’Unbound](https://unbound.docs.nlnetlabs.nl/)

metadata:
  title: Unbound
  description: Un resolvedor DNS que resuelve nombres de dominio, valida respuestas y las guarda en caché
spec:
  fullDescription: |
    Unbound es un resolvedor DNS que traduce nombres de dominio a direcciones IP. Puede obtener respuestas consultando la jerarquía DNS, validar datos DNS firmados digitalmente mediante DNSSEC y guardar los resultados en caché para solicitudes posteriores.

    **Funciones principales**

    - Resolver nombres de dominio de forma recursiva sin reenviar cada solicitud a un resolvedor DNS público.
    - Comprobar las firmas DNSSEC para verificar la autenticidad y la integridad de los datos DNS firmados.
    - Reutilizar las respuestas en caché para consultas repetidas.
    - Actuar como resolvedor ascendente para un filtro DNS como AdGuard Home.

    **Usar Unbound en Olares**

    Un administrador instala un único resolvedor compartido. Las aplicaciones y los dispositivos deben configurarse para utilizarlo, directamente o a través de un filtro DNS. Configura Unbound editando `unbound.conf` en el terminal incluido. La configuración se conserva tras los reinicios y las actualizaciones; no hay una interfaz gráfica de configuración.

    La resolución recursiva requiere acceso DNS saliente por el puerto 53. Si tu red bloquea o intercepta este acceso, puedes configurar como alternativa el reenvío a un proveedor DNS-over-TLS por el puerto 853. DNSSEC valida los datos DNS, pero no cifra las consultas; las consultas recursivas a los servidores DNS se envían en texto claro.

    [Documentación de Unbound](https://unbound.docs.nlnetlabs.nl/)

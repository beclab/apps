apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: unbound
spec:
  replicas: {{ .Values.workloads.unbound.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: unbound
  # appData is a hostPath mount; a rolling update would run two pods against
  # the same config directory on the same node.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Harmless where the mesh is not injected, and necessary where it is:
        # linkerd redirects every outbound TCP port except 443/6443 through its
        # proxy. Resolver egress has no use for the mesh -- no mTLS, no identity,
        # no useful telemetry -- and routing DoT (853) through a proxy that does
        # protocol detection is a good way to break it. UDP is already untouched
        # (linkerd is TCP-only); this keeps the TCP paths consistent with it.
        config.linkerd.io/skip-outbound-ports: "53,853"
      labels:
        io.kompose.service: unbound
        # Selector the terminal sidecar uses to find this pod.
        bytetrade.io/terminal: unbound
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # appData is a hostPath mount, and Olares does not pre-chown the paths it
        # grants: DirectoryOrCreate makes the volume root root-owned, so a
        # uid-1000 process cannot write its config or trust anchor into it.
        # fsGroup does not help -- the hostPath mounter reports Managed: false,
        # so kubelet applies no ownership change at all.
        # Non-recursive on purpose: chown -R has been observed to fail on
        # subdirectories the app itself created as uid 1000, which turns an
        # upgrade of a working install into a permanent Initializing loop.
        - name: init-permissions
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /opt/unbound/etc/unbound
              chown 1000:1000 /opt/unbound/etc/unbound
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /opt/unbound/etc/unbound
      containers:
        # Container name must stay "unbound": the terminal execs into it by name.
        - name: unbound
          image: docker.io/beclab/unbound:{{ .Values.image.version }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dns-tcp
              containerPort: 5335
              protocol: TCP
            - name: dns-udp
              containerPort: 5335
              protocol: UDP
          env:
            - name: TZ
              value: Etc/UTC
            # The address users actually point their DNS filter at: the node's
            # own address plus the exposed port, which survives a reinstall.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 5335
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: conf
              mountPath: /opt/unbound/etc/unbound
      restartPolicy: Always
      volumes:
        - name: conf
          hostPath:
            path: "{{ .Values.userspace.appData }}/etc"
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: unbound
spec:
  type: ClusterIP
  selector:
    io.kompose.service: unbound
  ports:
    # TCP is the supported path: the service mesh does not proxy UDP.
    - name: dns-tcp
      protocol: TCP
      port: 5335
      targetPort: 5335
    - name: dns-udp
      protocol: UDP
      port: 5335
      targetPort: 5335
---
# Reached from the LAN through the platform's L4 proxy rather than the HTTP
# gateway: DNS is neither HTTP nor TLS-with-SNI, so the gateway cannot carry it,
# and it has no UDP path at all. One Service per protocol, which is the shape
# the L4 translator consumes.
apiVersion: v1
kind: Service
metadata:
  name: unbound-5335-tcp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: unbound
spec:
  type: ClusterIP
  selector:
    io.kompose.service: unbound
  ports:
    - name: unbound-5335-tcp
      protocol: TCP
      port: 30535
      targetPort: 5335
---
apiVersion: v1
kind: Service
metadata:
  name: unbound-5335-udp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: unbound
spec:
  type: ClusterIP
  selector:
    io.kompose.service: unbound
  ports:
    - name: unbound-5335-udp
      protocol: UDP
      port: 30536
      targetPort: 5335

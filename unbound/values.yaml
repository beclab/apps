image:
  # The published image tag: v<upstream Unbound release>-<packaging revision>.
  # The revision moves on its own when the image changes but Unbound does not
  # -- a corrected entrypoint or helper script -- so this is not the same value
  # as Chart.yaml appVersion / the manifest's spec.versionName, which carry the
  # upstream release alone. Never name a tag that has not been published.
  version: 'v1.26.1-1'
  # IfNotPresent, as every other chart in this repo uses. A local build is made
  # available by importing it into the node's containerd, not by weakening this.
  pullPolicy: IfNotPresent

userspace:
  appData: ""

workloads:
  unbound:
    replicaCount: 1
  terminal:
    replicaCount: 1

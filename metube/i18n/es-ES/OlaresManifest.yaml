metadata:
  title: Metube
  description: Descargador de YouTube autoalojado
spec:
  upgradeDescription: |
    Cambios desde la versión pública 2026.08.28
    • Previsualiza una lista de reproducción y elige qué vídeos añadir a la cola. Puedes introducir una contraseña para cada vídeo protegido.
    • Las descargas de audio ofrecen formato automático y permiten guardar etiquetas con carátula, solo etiquetas o ninguna etiqueta.
    • Las descargas de listas y canales conservan los prefijos de archivo personalizados. Las suscripciones usan la plantilla de nombres de las listas. Los subtítulos guardados en carpetas personalizadas se registran con la ruta correcta.
    • Las transferencias interrumpidas se reintentan con esperas crecientes. Las descargas no pueden escribir en el directorio de estado. Las tareas restauradas respetan los permisos vigentes de las opciones de descarga. Incluye yt-dlp 2026.11.23.

    Notas de versión: https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    Una interfaz gráfica web basada en youtube-dl (que utiliza la bifurcación yt-dlp) y compatible con listas de reproducción. Permite descargar vídeos de YouTube y decenas de otros sitios web.

    Características principales:
    Opciones de distintas calidades de vídeo
    Capacidad de descargar solo audio
    Descargas por lotes
    Gestión de la cola de descargas
    Compatibilidad con más de 1000 sitios web además de YouTube
    Seguimiento del progreso de las descargas
    Interfaz adaptada a dispositivos móviles

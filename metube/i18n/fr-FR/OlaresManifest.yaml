metadata:
  title: Metube
  description: Téléchargeur YouTube auto-hébergé
spec:
  upgradeDescription: |
    Nouveautés depuis la version publique 2026.08.28
    • Prévisualisez une playlist et choisissez les vidéos à ajouter à la file. Vous pouvez saisir un mot de passe pour chaque vidéo protégée.
    • Le téléchargement audio propose un format automatique et trois choix pour les métadonnées : avec pochette, sans pochette ou sans métadonnées.
    • Les playlists et les chaînes conservent les préfixes de nom de fichier. Les abonnements utilisent le modèle de nommage des playlists. Le chemin des sous-titres enregistrés dans un dossier personnalisé est correctement conservé.
    • Les transferts interrompus sont relancés avec un délai croissant. Les téléchargements ne peuvent plus écrire dans le répertoire d’état. Les tâches restaurées respectent les autorisations actuelles des options de téléchargement. Inclut yt-dlp 2026.11.23.

    Notes de version : https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    Une interface utilisateur graphique web basée sur youtube-dl (utilisant le fork yt-dlp) et prenant en charge les listes de lecture. Elle permet de télécharger des vidéos depuis YouTube et des dizaines d'autres sites web.

    Fonctionnalités principales :
    Plusieurs options de qualité vidéo
    Téléchargement audio uniquement
    Téléchargements par lots
    Gestion de la file d'attente des téléchargements
    Prise en charge de plus de 1000 sites web en plus de YouTube
    Suivi de la progression des téléchargements
    Interface adaptée aux appareils mobiles

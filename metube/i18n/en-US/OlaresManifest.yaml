metadata:
  title: Metube
  description: Self-hosted YouTube downloader
spec:
  upgradeDescription: |
    Changes since the public release 2026.08.28
    • Preview a playlist and select individual videos before adding them to the queue. Enter a video password for an individual download.
    • Audio downloads offer Auto format and a choice of tags with cover art, tags only, or no tags.
    • Playlist and channel downloads retain custom filename prefixes. Subscriptions use the playlist naming template, and captions saved to custom folders are recorded at the correct path.
    • Interrupted transfers now retry with backoff. Downloads are kept out of the state directory, and restored jobs respect the configured options permissions. Includes yt-dlp 2026.11.23.

    Release notes: https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    A web graphical user interface based on youtube-dl (using the yt-dlp fork) that supports playlists.Allows downloading videos from YouTube and dozens of other websites.

    Key features:
    Support for multiple video quality options
    Audio-only download capability
    Batch download support
    Download queue management
    Support for 1000+ websites beyond YouTube
    Progress tracking for downloads
    Mobile-friendly interface

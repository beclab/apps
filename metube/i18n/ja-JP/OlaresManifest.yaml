metadata:
  title: Metube
  description: セルフホスト型 YouTube ダウンローダー
spec:
  upgradeDescription: |
    公開版 2026.08.28 からの主な変更
    • プレイリストをプレビューし、ダウンロードしたい動画だけをキューに追加できます。パスワード付き動画では、ダウンロードごとにパスワードを指定できます。
    • 音声形式に「自動」を追加しました。タグとカバー画像の両方、タグのみ、どちらも保存しない、の3種類から選べます。
    • プレイリストとチャンネルのダウンロードでファイル名の接頭辞が保持されます。購読からのダウンロードにはプレイリスト用の命名テンプレートが適用され、指定フォルダーの字幕も正しいパスで記録されます。
    • 転送が中断すると、待ち時間を延ばしながら再試行します。状態保存ディレクトリへのダウンロードを防ぎ、復元したタスクにも現在のダウンロードオプションの権限設定を適用します。yt-dlp を 2026.11.23 に更新しました。

    リリースノート: https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    youtube-dl（yt-dlp フォークを使用）をベースにした、プレイリスト対応の Web グラフィカルユーザーインターフェースです。YouTube をはじめ、数十の Web サイトから動画をダウンロードできます。

    主な機能：
    複数の動画品質オプション
    音声のみのダウンロード
    一括ダウンロード
    ダウンロードキュー管理
    YouTube 以外の 1000 以上の Web サイトに対応
    ダウンロード進捗の追跡
    モバイル対応インターフェース

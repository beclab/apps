metadata:
  title: Metube
  description: Selbst gehosteter YouTube-Downloader
spec:
  upgradeDescription: |
    Änderungen seit der öffentlichen Version 2026.08.28
    • Wiedergabelisten vorab ansehen und einzelne Videos auswählen. Für geschützte Videos lässt sich pro Download ein Passwort eingeben.
    • Audiodownloads bieten ein automatisches Format sowie Tags mit Cover, nur Tags oder keine Tags.
    • Downloads von Wiedergabelisten und Kanälen behalten eigene Dateinamenpräfixe. Abonnements verwenden die Namensvorlage für Wiedergabelisten. Untertitel in eigenen Ordnern werden mit dem richtigen Pfad erfasst.
    • Unterbrochene Übertragungen werden mit zunehmender Wartezeit wiederholt. Das Statusverzeichnis ist vor Download-Schreibzugriffen geschützt. Wiederhergestellte Aufträge beachten die aktuellen Berechtigungen für Downloadoptionen. Enthält yt-dlp 2026.11.23.

    Versionshinweise: https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    Eine grafische Web-Benutzeroberfläche auf Basis von youtube-dl (unter Verwendung des yt-dlp-Forks), die Wiedergabelisten unterstützt. Ermöglicht das Herunterladen von Videos von YouTube und Dutzenden anderen Websites.

    Hauptfunktionen:
    Unterstützung mehrerer Videoqualitätsoptionen
    Nur-Audio-Downloads
    Batch-Downloads
    Verwaltung der Download-Warteschlange
    Unterstützung für über 1000 Websites neben YouTube
    Fortschrittsanzeige für Downloads
    Mobilfreundliche Benutzeroberfläche

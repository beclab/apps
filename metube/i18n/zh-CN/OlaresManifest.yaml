metadata:
  title: Metube
  description: 自托管的YouTube下载器
spec:
  upgradeDescription: |
    自正式版 2026.08.28 起的累计更新
    • 添加播放列表前可先预览，勾选想下载的视频。下载受密码保护的视频时，可为单个任务输入视频密码。
    • 音频下载新增「自动」格式，可选择写入标签和封面、仅写入标签，或两者都不写入。
    • 播放列表和频道下载会保留自定义文件名前缀，订阅下载会使用播放列表命名模板，保存到自定义目录的字幕也会记录正确路径。
    • 传输中断后会自动重试，并逐步延长重试间隔。下载文件不能写入应用状态目录，恢复的任务会遵循当前的下载选项权限设置。内置 yt-dlp 已更新至 2026.11.23。

    发行说明：https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    一个基于 youtube-dl（使用 yt-dlp 分支）支持播放列表的网页图形界面，支持从 YouTube 及数十个其他网站下载视频。

    主要特性：
    支持多种视频画质选项
    支持仅下载音频
    支持批量下载
    下载队列管理
    支持 1000+ 个除 YouTube 以外的网站
    下载进度跟踪
    移动端友好界面

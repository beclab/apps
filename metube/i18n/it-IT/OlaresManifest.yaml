metadata:
  title: Metube
  description: Downloader YouTube self-hosted
spec:
  upgradeDescription: |
    Novità dalla versione pubblica 2026.08.28
    • Visualizza l’anteprima di una playlist e scegli i video da aggiungere alla coda. Puoi inserire una password per ogni video protetto.
    • Per l’audio puoi scegliere il formato automatico e salvare tag con copertina, solo tag oppure nessun tag.
    • I download di playlist e canali mantengono i prefissi personalizzati. Gli abbonamenti usano il modello dei nomi delle playlist. I sottotitoli salvati in cartelle personalizzate vengono registrati con il percorso corretto.
    • I trasferimenti interrotti vengono ritentati a intervalli crescenti. I download non possono scrivere nella directory di stato. Le attività ripristinate rispettano i permessi correnti per le opzioni di download. Include yt-dlp 2026.11.23.

    Note di rilascio: https://github.com/alexta69/MeTube/compare/2026.08.28...2026.11.24

  fullDescription: |
    Un'interfaccia utente grafica web basata su youtube-dl (che utilizza il fork yt-dlp) con supporto per le playlist. Consente di scaricare video da YouTube e decine di altri siti web.

    Funzionalità principali:
    Supporto per più opzioni di qualità video
    Download del solo audio
    Supporto per download in batch
    Gestione della coda di download
    Supporto per oltre 1000 siti web oltre a YouTube
    Monitoraggio dell'avanzamento dei download
    Interfaccia ottimizzata per dispositivi mobili

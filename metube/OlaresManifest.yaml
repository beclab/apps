olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  metubeingress: 1
  metube: 1
metadata:
  name: metube
  description: Self-hosted YouTube downloader
  icon: https://app.cdn.olares.com/appstore/metube/icon.png
  appid: metube
  version: '1.0.13'
  title: Metube
  categories:
  - Utilities_v112
  - homelab
  tags:
  - downloader

permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  upgradeDescription: |
    Run the official OpenResty entrance as UID/GID 1000 with writable runtime paths.
    Upgrade MeTube from 2026.01.11 to 2026.08.28 (`alexta69/metube:2026.08.28`).

    This tag updates yt-dlp and the download UI. Releases: https://github.com/alexta69/metube/releases

    Switch the reverse-proxy image from Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) to the official OpenResty image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Align nginx config mounts and log paths with the official image layout (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), and drop Bitnami-specific `OPENRESTY_CONF_FILE` wiring.
  versionName: '2026.08.28'
  promoteImage:
  - https://app.cdn.olares.com/appstore/metube/1.webp
  - https://app.cdn.olares.com/appstore/metube/2.webp
  - https://app.cdn.olares.com/appstore/metube/3.webp

  fullDescription: |
    A web graphical user interface based on youtube-dl (using the yt-dlp fork) that supports playlists.Allows downloading videos from YouTube and dozens of other websites.

    Key features:
    Support for multiple video quality options
    Audio-only download capability
    Batch download support
    Download queue management
    Support for 1000+ websites beyond YouTube
    Progress tracking for downloads
    Mobile-friendly interface
  developer: alexta69
  website: http://www.hectic.net
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 512Mi
  limitedMemory: 2.5Gi
  requiredDisk: 256Mi
  limitedDisk: 5Gi
  requiredCpu: 0.6
  limitedCpu: 2
  doc: https://github.com/alexta69/metube
  supportArch:
  - amd64
  - arm64
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
  - authLevel: internal
    host: metubeingress
    icon: https://app.cdn.olares.com/appstore/metube/icon.png
    name: metube
    openMethod: window
    port: 8080
    title: Metube

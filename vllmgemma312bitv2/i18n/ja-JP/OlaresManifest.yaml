metadata:
  title: Gemma3 12B (vLLM)
  description: 単一 GPU で動作する、現時点で最も高性能なモデル

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **モデル概要**
    Gemma は Gemini 技術に基づく Google の軽量モデルファミリーです。Gemma 3 モデルはマルチモーダル（テキストと画像を処理）で、140 以上の言語に対応する 128K コンテキストウィンドウを備えます。270M、1B、4B、12B、27B パラメータのサイズがあり、質問応答・要約・推論に優れ、コンパクトな設計によりリソースの限られたデバイスへの展開も可能です。

    **入出力**
    入力：
    - 質問、プロンプト、要約対象ドキュメントなどのテキスト文字列
    - 896 x 896 に正規化し、各 256 トークンに符号化された画像
    - 4B / 12B / 27B サイズは合計入力コンテキスト 128K トークン、1B サイズは 32K トークン

    出力：
    - 入力への応答として生成されるテキスト（質問への回答、画像内容の分析、ドキュメントの要約など）
    - 合計出力コンテキスト 8192 トークン

    **主な特長**
    画像とテキスト入力：マルチモーダル機能により画像とテキストを入力して視覚データを理解・分析。
    128K トークンコンテキスト：より多くのデータ分析と複雑な問題解決のための大きな入力コンテキスト。
    関数呼び出し：プログラミングインタフェースと連携する自然言語インタフェースを構築。
    幅広い言語対応：140 以上の言語サポートで、自言語での作業や AI アプリの言語能力拡張が可能。
    開発者向けモデルサイズ：タスクと計算リソースに合わせてモデルサイズ（270M、1B、4B、12B、27B）と精度を選択。

  upgradeDescription: |
    vLLM ランタイムを v0.22.0-cu129 へアップグレード；-O3 最適化を有効化し torch.compile / FlashInfer キャッシュを永続化。

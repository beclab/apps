metadata:
  title: Gemma3 12B (vLLM)
  description: Il modello attuale più capace che gira su una singola GPU

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA DEL MODELLO**
    Gemma è una famiglia leggera di modelli di Google basata sulla tecnologia Gemini. I modelli Gemma 3 sono multimodali — elaborano testo e immagini — e offrono una finestra di contesto da 128K con supporto per oltre 140 lingue. Disponibili nelle dimensioni 270M, 1B, 4B, 12B e 27B parametri, eccellono in risposta alle domande, riassunti e ragionamento, mentre il design compatto consente il deployment su dispositivi con risorse limitate.

    **Input e output**
    Input:
    - Stringa di testo, come una domanda, un prompt o un documento da riassumere
    - Immagini, normalizzate a risoluzione 896 x 896 e codificate in 256 token ciascuna
    - Contesto totale di input di 128K token per le dimensioni 4B, 12B e 27B, e 32K token per la dimensione 1B

    Output:
    - Testo generato in risposta all'input, come una risposta a una domanda, analisi del contenuto di un'immagine o riassunto di un documento
    - Contesto totale di output di 8192 token

    **Caratteristiche principali**
    Input immagine e testo: le capacità multimodali consentono di inserire immagini e testo per comprendere e analizzare dati visivi.
    Contesto da 128K token: contesto di input significativamente ampio per analizzare più dati e risolvere problemi più complessi.
    Function calling: crea interfacce in linguaggio naturale per lavorare con interfacce di programmazione.
    Ampio supporto linguistico: lavora nella tua lingua o espandi le capacità linguistiche della tua applicazione IA con supporto per oltre 140 lingue.
    Dimensioni modello amichevoli per gli sviluppatori: scegli una dimensione (270M, 1B, 4B, 12B, 27B) e un livello di precisione adatti al tuo compito e alle risorse di calcolo.

  upgradeDescription: |
    Aggiornare il runtime vLLM a v0.22.0-cu129; abilitare l'ottimizzazione -O3 e persistere la cache di torch.compile / FlashInfer.

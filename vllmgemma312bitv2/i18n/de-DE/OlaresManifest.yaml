metadata:
  title: Gemma3 12B (vLLM)
  description: Das derzeit leistungsfähigste Modell, das auf einer einzelnen GPU läuft

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **MODELLÜBERSICHT**
    Gemma ist eine leichtgewichtige Modellfamilie von Google, basierend auf Gemini-Technologie. Die Gemma-3-Modelle sind multimodal — sie verarbeiten Text und Bilder — und bieten ein 128K-Kontextfenster mit Unterstützung für über 140 Sprachen. Verfügbar in den Größen 270M, 1B, 4B, 12B und 27B Parameter, glänzen sie bei Fragebeantwortung, Zusammenfassung und Reasoning, während ihr kompaktes Design den Einsatz auf ressourcenbeschränkten Geräten ermöglicht.

    **Eingaben und Ausgaben**
    Eingabe:
    - Textzeichenkette, z. B. eine Frage, ein Prompt oder ein zusammenzufassendes Dokument
    - Bilder, auf 896 × 896 normalisiert und jeweils zu 256 Tokens kodiert
    - Gesamter Eingabekontext von 128K Tokens für die Größen 4B, 12B und 27B sowie 32K Tokens für die Größe 1B

    Ausgabe:
    - Generierter Text als Antwort auf die Eingabe, z. B. eine Antwort auf eine Frage, Bildanalyse oder Dokumentzusammenfassung
    - Gesamter Ausgabekontext von 8192 Tokens

    **Hauptfunktionen**
    Bild- und Texteingabe: Multimodale Fähigkeiten ermöglichen Bild- und Texteingabe zum Verstehen und Analysieren visueller Daten.
    128K-Token-Kontext: Deutlich großer Eingabekontext zur Analyse von mehr Daten und Lösung komplexerer Probleme.
    Function Calling: Natürlichsprachliche Schnittstellen für Programmier-APIs erstellen.
    Breite Sprachunterstützung: In Ihrer Sprache arbeiten oder die Sprachfähigkeiten Ihrer KI-Anwendung auf über 140 Sprachen erweitern.
    Entwicklerfreundliche Modellgrößen: Wählen Sie eine Modellgröße (270M, 1B, 4B, 12B, 27B) und Präzisionsstufe passend zu Aufgabe und Rechenressourcen.

  upgradeDescription: |
    Upgrade der vLLM-Runtime auf v0.22.0-cu129; -O3-Optimierung aktivieren und torch.compile- / FlashInfer-Cache persistieren.

metadata:
  title: Gemma3 12B (vLLM)
  description: Le modèle actuel le plus capable qui s'exécute sur un seul GPU

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **APERÇU DU MODÈLE**
    Gemma est une famille légère de modèles de Google basée sur la technologie Gemini. Les modèles Gemma 3 sont multimodaux — ils traitent texte et images — et offrent une fenêtre de contexte de 128K avec prise en charge de plus de 140 langues. Disponibles en tailles 270M, 1B, 4B, 12B et 27B paramètres, ils excellent en réponse aux questions, résumé et raisonnement, tandis que leur conception compacte permet le déploiement sur des appareils à ressources limitées.

    **Entrées et sorties**
    Entrée :
    - Chaîne de texte, telle qu'une question, un prompt ou un document à résumer
    - Images, normalisées à la résolution 896 x 896 et encodées en 256 tokens chacune
    - Contexte d'entrée total de 128K tokens pour les tailles 4B, 12B et 27B, et 32K tokens pour la taille 1B

    Sortie :
    - Texte généré en réponse à l'entrée, tel qu'une réponse à une question, une analyse du contenu d'une image ou un résumé de document
    - Contexte de sortie total de 8192 tokens

    **Fonctionnalités clés**
    Entrée image et texte : les capacités multimodales permettent d'entrer images et texte pour comprendre et analyser des données visuelles.
    Contexte de 128K tokens : contexte d'entrée significativement large pour analyser plus de données et résoudre des problèmes plus complexes.
    Function calling : créez des interfaces en langage naturel pour travailler avec des interfaces de programmation.
    Large prise en charge linguistique : travaillez dans votre langue ou étendez les capacités linguistiques de votre application IA avec la prise en charge de plus de 140 langues.
    Tailles de modèle adaptées aux développeurs : choisissez une taille (270M, 1B, 4B, 12B, 27B) et un niveau de précision adaptés à votre tâche et à vos ressources de calcul.

  upgradeDescription: |
    Mettre à niveau le runtime vLLM vers v0.22.0-cu129 ; activer l'optimisation -O3 et persister le cache torch.compile / FlashInfer.

metadata:
  title: Gemma3 12B (vLLM)
  description: El modelo actual más capaz que se ejecuta en una sola GPU

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **RESUMEN DEL MODELO**
    Gemma es una familia ligera de modelos de Google basada en la tecnología Gemini. Los modelos Gemma 3 son multimodales —procesan texto e imágenes— y cuentan con una ventana de contexto de 128K con soporte para más de 140 idiomas. Disponibles en tamaños de 270M, 1B, 4B, 12B y 27B parámetros, destacan en respuesta a preguntas, resumen y razonamiento, mientras que su diseño compacto permite el despliegue en dispositivos con recursos limitados.

    **Entradas y salidas**
    Entrada:
    - Cadena de texto, como una pregunta, un prompt o un documento a resumir
    - Imágenes, normalizadas a resolución 896 x 896 y codificadas a 256 tokens cada una
    - Contexto total de entrada de 128K tokens para los tamaños 4B, 12B y 27B, y 32K tokens para el tamaño 1B

    Salida:
    - Texto generado en respuesta a la entrada, como una respuesta a una pregunta, análisis de contenido de imagen o resumen de un documento
    - Contexto total de salida de 8192 tokens

    **Características clave**
    Entrada de imagen y texto: las capacidades multimodales permiten introducir imágenes y texto para comprender y analizar datos visuales.
    Contexto de 128K tokens: contexto de entrada significativamente grande para analizar más datos y resolver problemas más complejos.
    Function calling: crea interfaces en lenguaje natural para trabajar con interfaces de programación.
    Amplio soporte de idiomas: trabaja en tu idioma o amplía las capacidades lingüísticas de tu aplicación de IA con soporte para más de 140 idiomas.
    Tamaños de modelo amigables para desarrolladores: elige un tamaño (270M, 1B, 4B, 12B, 27B) y un nivel de precisión que se adapte a tu tarea y recursos de cómputo.

  upgradeDescription: |
    Actualizar el runtime de vLLM a v0.22.0-cu129; habilitar la optimización -O3 y persistir la caché de torch.compile / FlashInfer.

metadata:
  title: Bifrost
  description: The Fastest Enterprise AI Gateway
spec:
  fullDescription: |
    Bifrost is a high-performance AI gateway that unifies access to 15+ providers (OpenAI, Anthropic, AWS Bedrock, Google Vertex, and more) through a single OpenAI-compatible API. Deploy in seconds with zero configuration and get automatic failover, load balancing, semantic caching, and enterprise-grade features.

    **Key Features**
    - Unified Interface: Connect to all major AI providers via one OpenAI-compatible API, drastically reducing integration costs.
    - High-Availability Architecture: Seamless failover between providers and models, paired with intelligent load balancing, to ensure zero service downtime.
    - Semantic Caching: Intelligently caches responses based on semantic similarity, significantly cutting costs and latency.
    - Multimodal Support: Unified support for text, images, audio, and streaming, all behind a common interface.
    - Enterprise Control: Budget management, SSO integration, fine-grained access control, and end-to-end observability.
    - Zero-Code Migration: One-click replacement of existing OpenAI/Anthropic/GenAI APIs, with zero-code integration for popular AI SDKs.
  upgradeDescription: |
    **Back up your data** manually before upgrading!
    Upgrade Bifrost to v1.6.7 (`maximhq/bifrost:v1.6.7`).

    What's Changed (v1.6.7):
    - Virtual key budget overrides (temporary override amount / cycles) across governance store, admin APIs, and UI.
    - User-scoped routing and pricing overrides (`user_id` CEL / enterprise user picker).
    - Background live model catalog refresh (`live_models_sync_interval`, default 1h).
    - Stream truncation detection so upstream SSE death surfaces as an error instead of a clean `[DONE]`.
    - Access profile schema: `blacklisted_models`, weighted routing seed, and `model_budgets`.
    - New guardrail integrations: Lakera and Repello Argus.
    - Fixes: empty-stream hang, vLLM Responses streaming, Gemini tool schema constraints, HuggingFace model ID duplication, multinode rate-limit CPU, and more.

    Also switch the reverse-proxy image from Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) to official `openresty/openresty:1.29.2.5-bookworm-fat`, align nginx mounts/log paths (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), and drop Bitnami-specific `OPENRESTY_CONF_FILE` wiring.

    Full release notes: https://docs.getbifrost.ai/changelogs/v1.6.7

metadata:
  title: Bifrost
  description: 全球最快的企业级AI网关
spec:
  fullDescription: |
    Bifrost 是一款高性能的人工智能网关，它通过一个与 OpenAI 兼容的单一 API，统一了对 15 家以上供应商（包括 OpenAI、Anthropic、AWS Bedrock、Google Vertex 等）的访问。部署在数秒内完成，还能获得自动故障转移、负载均衡、语义缓存以及企业级功能。

    **主要特性**
    - 统一接口：通过一个与 OpenAI 兼容的单一 API，统一了对 15 家以上供应商（包括 OpenAI、Anthropic、AWS Bedrock、Google Vertex 等）的访问。
    - 高可用架构：无缝故障转移和负载均衡，确保零服务中断。
    - 语义缓存：基于语义相似度智能缓存响应，显著降低成本和延迟。
    - 多模态支持：统一支持文本、图像、音频和流式传输，所有功能都通过一个共同接口实现。
    - 企业控制：预算管理、SSO 集成、细粒度访问控制和端到端可观测性。
    - 零代码迁移：一键替换现有的 OpenAI/Anthropic/GenAI API，无需代码集成即可用于流行的 AI SDK。
  upgradeDescription: |
    **在升级前备份数据！**
    升级 Bifrost 至 v1.6.7（`maximhq/bifrost:v1.6.7`）。

    更新内容（v1.6.7）：
    - 虚拟密钥预算临时覆盖（覆盖额度 / 周期），覆盖治理存储、管理 API 与 UI。
    - 路由与定价覆盖支持按用户作用域（`user_id` CEL / 企业用户选择器）。
    - 后台刷新实时模型目录（`live_models_sync_interval`，默认 1 小时）。
    - 流截断检测：上游 SSE 异常结束会报错，而不再伪装成干净的 `[DONE]`。
    - Access Profile schema 新增 `blacklisted_models`、加权路由种子与 `model_budgets`。
    - 新增护栏集成：Lakera、Repello Argus。
    - 修复：空流挂起、vLLM Responses 流式、Gemini 工具 schema 约束、HuggingFace 模型 ID 重复、多节点限流高 CPU 等。

    同时将反向代理镜像从 Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）切换为官方 `openresty/openresty:1.29.2.5-bookworm-fat`，并同步 nginx 挂载/日志路径（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`），移除 Bitnami 专用的 `OPENRESTY_CONF_FILE`。

    完整发布说明请见：https://docs.getbifrost.ai/changelogs/v1.6.7

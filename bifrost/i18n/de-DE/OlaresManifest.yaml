metadata:
  title: Bifrost
  description: Das schnellste Enterprise-AI-Gateway
spec:
  fullDescription: |
    Bifrost ist ein hochleistungsfähiges AI-Gateway, das den Zugriff auf 15+ Anbieter (OpenAI, Anthropic, AWS Bedrock, Google Vertex und mehr) über eine einzige OpenAI-kompatible API vereinheitlicht. In Sekunden ohne Konfiguration bereitstellen und automatisches Failover, Lastverteilung, semantisches Caching und Enterprise-Funktionen erhalten.
    
    **Wichtige Funktionen**
    - Unified Interface: Verbinden Sie sich mit allen großen AI-Anbietern über eine OpenAI-kompatible API und senken Sie Integrationskosten drastisch.
    - High-Availability Architecture: Nahtloses Failover zwischen Anbietern und Modellen, gepaart mit intelligenter Lastverteilung, für null Service-Ausfallzeiten.
    - Semantic Caching: Zwischenspeichert Antworten intelligent basierend auf semantischer Ähnlichkeit und senkt Kosten und Latenz erheblich.
    - Multimodal Support: Einheitliche Unterstützung für Text, Bilder, Audio und Streaming hinter einer gemeinsamen Schnittstelle.
    - Enterprise Control: Budgetverwaltung, SSO-Integration, fein granulierte Zugriffskontrolle und End-to-End-Observability.
    - Zero-Code Migration: Ein-Klick-Ersatz bestehender OpenAI/Anthropic/GenAI-APIs, mit Zero-Code-Integration für beliebte AI-SDKs.
  upgradeDescription: |
    **Sichern Sie Ihre Daten** manuell vor dem Upgrade!
    Bifrost auf v1.6.7 aktualisieren (`maximhq/bifrost:v1.6.7`).
    
    Änderungen (v1.6.7):
    - Virtual-Key-Budget-Overrides (vorübergehende Override-Beträge / Zyklen) über Governance-Store, Admin-APIs und UI.
    - Nutzerbezogene Routing- und Preis-Overrides (`user_id` CEL / Enterprise-User-Picker).
    - Hintergrund-Aktualisierung des Live-Modellkatalogs (`live_models_sync_interval`, Standard 1h).
    - Erkennung von Stream-Trunkierung, sodass Upstream-SSE-Ausfälle als Fehler statt als sauberes `[DONE]` erscheinen.
    - Access-Profile-Schema: `blacklisted_models`, gewichteter Routing-Seed und `model_budgets`.
    - Neue Guardrail-Integrationen: Lakera und Repello Argus.
    - Fixes: Empty-Stream-Hang, vLLM-Responses-Streaming, Gemini-Tool-Schema-Constraints, HuggingFace-Modell-ID-Duplikation, Multinode-Rate-Limit-CPU und mehr.
    
    Außerdem Wechsel des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen `openresty/openresty:1.29.2.5-bookworm-fat`, Angleichung der nginx-Mounts/Log-Pfade (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    Vollständige Release Notes: https://docs.getbifrost.ai/changelogs/v1.6.7

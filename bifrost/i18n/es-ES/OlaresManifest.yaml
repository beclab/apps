metadata:
  title: Bifrost
  description: La pasarela de IA empresarial más rápida
spec:
  fullDescription: |
    Bifrost es una pasarela de IA de alto rendimiento que unifica el acceso a más de 15 proveedores (OpenAI, Anthropic, AWS Bedrock, Google Vertex y más) a través de una única API compatible con OpenAI. Despliégala en segundos sin configuración y obtén failover automático, balanceo de carga, caché semántica y funciones de nivel empresarial.
    
    **Funciones clave**
    - Unified Interface: Conéctate a todos los principales proveedores de IA mediante una API compatible con OpenAI, reduciendo drásticamente los costes de integración.
    - High-Availability Architecture: Failover fluido entre proveedores y modelos, junto con balanceo de carga inteligente, para cero tiempo de inactividad del servicio.
    - Semantic Caching: Almacena en caché respuestas de forma inteligente según similitud semántica, recortando significativamente costes y latencia.
    - Multimodal Support: Soporte unificado para texto, imágenes, audio y streaming detrás de una interfaz común.
    - Enterprise Control: Gestión de presupuestos, integración SSO, control de acceso fino y observabilidad de extremo a extremo.
    - Zero-Code Migration: Sustitución con un clic de APIs OpenAI/Anthropic/GenAI existentes, con integración sin código para SDKs de IA populares.
  upgradeDescription: |
    ¡Haz una **copia de seguridad de tus datos** manualmente antes de actualizar!
    Actualizar Bifrost a v1.6.7 (`maximhq/bifrost:v1.6.7`).
    
    Cambios (v1.6.7):
    - Overrides de presupuesto de claves virtuales (importe / ciclos de override temporal) en governance store, APIs de admin y UI.
    - Overrides de enrutamiento y precios por usuario (`user_id` CEL / selector de usuarios enterprise).
    - Actualización en segundo plano del catálogo de modelos en vivo (`live_models_sync_interval`, predeterminado 1h).
    - Detección de truncado de stream para que la muerte SSE upstream aparezca como error en lugar de un `[DONE]` limpio.
    - Esquema de perfil de acceso: `blacklisted_models`, semilla de enrutamiento ponderado y `model_budgets`.
    - Nuevas integraciones de guardrails: Lakera y Repello Argus.
    - Correcciones: cuelgue de stream vacío, streaming de Responses de vLLM, restricciones de esquema de herramientas Gemini, duplicación de ID de modelo HuggingFace, CPU de rate-limit multinodo, y más.
    
    También cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la oficial `openresty/openresty:1.29.2.5-bookworm-fat`, alinear montajes/rutas de logs de nginx (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
    
    Notas de la versión completas: https://docs.getbifrost.ai/changelogs/v1.6.7

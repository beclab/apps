metadata:
  title: Bifrost
  description: Il gateway AI enterprise più veloce
spec:
  fullDescription: |
    Bifrost è un gateway AI ad alte prestazioni che unifica l'accesso a oltre 15 provider (OpenAI, Anthropic, AWS Bedrock, Google Vertex e altri) tramite una singola API compatibile con OpenAI. Distribuiscilo in pochi secondi senza configurazione e ottieni failover automatico, bilanciamento del carico, caching semantico e funzionalità di livello enterprise.
    
    **Funzionalità chiave**
    - Unified Interface: Connettiti a tutti i principali provider AI tramite un'API compatibile con OpenAI, riducendo drasticamente i costi di integrazione.
    - High-Availability Architecture: Failover fluido tra provider e modelli, abbinato a bilanciamento del carico intelligente, per zero downtime del servizio.
    - Semantic Caching: Memorizza intelligentemente le risposte in base alla similarità semantica, riducendo significativamente costi e latenza.
    - Multimodal Support: Supporto unificato per testo, immagini, audio e streaming dietro un'interfaccia comune.
    - Enterprise Control: Gestione del budget, integrazione SSO, controllo degli accessi a grana fine e osservabilità end-to-end.
    - Zero-Code Migration: Sostituzione con un clic delle API OpenAI/Anthropic/GenAI esistenti, con integrazione zero-code per gli SDK AI più diffusi.
  upgradeDescription: |
    Esegui un **backup dei dati** manualmente prima dell'aggiornamento!
    Aggiornare Bifrost a v1.6.7 (`maximhq/bifrost:v1.6.7`).
    
    Modifiche (v1.6.7):
    - Override del budget delle chiavi virtuali (importo / cicli di override temporanei) su governance store, API admin e UI.
    - Override di routing e prezzi con ambito utente (`user_id` CEL / selettore utenti enterprise).
    - Aggiornamento in background del catalogo modelli live (`live_models_sync_interval`, predefinito 1h).
    - Rilevamento della troncatura dello stream così che la morte SSE upstream emerga come errore invece di un `[DONE]` pulito.
    - Schema del profilo di accesso: `blacklisted_models`, seed di routing ponderato e `model_budgets`.
    - Nuove integrazioni guardrail: Lakera e Repello Argus.
    - Fix: hang dello stream vuoto, streaming Responses di vLLM, vincoli dello schema tool Gemini, duplicazione ID modello HuggingFace, CPU rate-limit multinode e altro.
    
    Inoltre passare l'immagine reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'ufficiale `openresty/openresty:1.29.2.5-bookworm-fat`, allineare mount/percorsi log nginx (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il cablaggio specifico Bitnami di `OPENRESTY_CONF_FILE`.
    
    Note di rilascio complete: https://docs.getbifrost.ai/changelogs/v1.6.7

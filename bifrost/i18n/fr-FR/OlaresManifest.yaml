metadata:
  title: Bifrost
  description: "La passerelle IA d'entreprise la plus rapide"
spec:
  fullDescription: |
    Bifrost est une passerelle IA haute performance qui unifie l'accès à plus de 15 fournisseurs (OpenAI, Anthropic, AWS Bedrock, Google Vertex et plus) via une seule API compatible OpenAI. Déployez en quelques secondes sans configuration et obtenez basculement automatique, répartition de charge, cache sémantique et fonctionnalités de niveau entreprise.
    
    **Fonctionnalités clés**
    - Unified Interface : Connectez-vous à tous les principaux fournisseurs IA via une API compatible OpenAI, réduisant drastiquement les coûts d'intégration.
    - High-Availability Architecture : Basculement fluide entre fournisseurs et modèles, associé à une répartition de charge intelligente, pour zéro temps d'arrêt du service.
    - Semantic Caching : Met en cache intelligemment les réponses selon la similarité sémantique, réduisant significativement coûts et latence.
    - Multimodal Support : Prise en charge unifiée du texte, des images, de l'audio et du streaming derrière une interface commune.
    - Enterprise Control : Gestion budgétaire, intégration SSO, contrôle d'accès fin et observabilité de bout en bout.
    - Zero-Code Migration : Remplacement en un clic des API OpenAI/Anthropic/GenAI existantes, avec intégration sans code pour les SDK IA populaires.
  upgradeDescription: |
    **Sauvegardez vos données** manuellement avant la mise à jour !
    Mettre à jour Bifrost vers v1.6.7 (`maximhq/bifrost:v1.6.7`).
    
    Changements (v1.6.7) :
    - Overrides de budget des clés virtuelles (montant / cycles d'override temporaires) sur le governance store, les API admin et l'UI.
    - Overrides de routage et de tarification par utilisateur (`user_id` CEL / sélecteur d'utilisateurs enterprise).
    - Actualisation en arrière-plan du catalogue de modèles live (`live_models_sync_interval`, défaut 1h).
    - Détection de troncature de flux pour que la mort SSE amont apparaisse comme une erreur au lieu d'un `[DONE]` propre.
    - Schéma de profil d'accès : `blacklisted_models`, graine de routage pondéré et `model_budgets`.
    - Nouvelles intégrations de garde-fous : Lakera et Repello Argus.
    - Correctifs : blocage de flux vide, streaming Responses vLLM, contraintes de schéma d'outils Gemini, duplication d'ID modèle HuggingFace, CPU de rate-limit multinœud, et plus.
    
    Également, remplacer l'image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'officielle `openresty/openresty:1.29.2.5-bookworm-fat`, aligner les montages/chemins de logs nginx (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) et supprimer le câblage spécifique Bitnami de `OPENRESTY_CONF_FILE`.
    
    Notes de version complètes : https://docs.getbifrost.ai/changelogs/v1.6.7

metadata:
  title: Bifrost
  description: 最速のエンタープライズ AI ゲートウェイ
spec:
  fullDescription: |
    Bifrost は、単一の OpenAI 互換 API を通じて 15 以上のプロバイダー（OpenAI、Anthropic、AWS Bedrock、Google Vertex など）へのアクセスを統合する高性能 AI ゲートウェイです。ゼロ設定で数秒でデプロイし、自動フェイルオーバー、ロードバランシング、セマンティックキャッシュ、エンタープライズ級の機能を利用できます。
    
    **主な機能**
    - Unified Interface: 単一の OpenAI 互換 API ですべての主要 AI プロバイダーに接続し、統合コストを大幅に削減。
    - High-Availability Architecture: プロバイダーとモデル間のシームレスなフェイルオーバーとインテリジェントなロードバランシングで、サービスダウンタイムゼロを実現。
    - Semantic Caching: 意味的類似性に基づいて応答をインテリジェントにキャッシュし、コストとレイテンシを大幅に削減。
    - Multimodal Support: 共通インターフェースの背後でテキスト、画像、音声、ストリーミングを統一サポート。
    - Enterprise Control: 予算管理、SSO 統合、細粒度アクセス制御、エンドツーエンドのオブザーバビリティ。
    - Zero-Code Migration: 既存の OpenAI/Anthropic/GenAI API をワンクリックで置き換え、人気の AI SDK 向けゼロコード統合。
  upgradeDescription: |
    アップグレード前にデータを手動で**バックアップ**してください！
    Bifrost を v1.6.7（`maximhq/bifrost:v1.6.7`）にアップグレード。
    
    変更内容（v1.6.7）：
    - ガバナンスストア、管理 API、UI にわたる仮想キー予算オーバーライド（一時的なオーバーライド額／サイクル）。
    - ユーザースコープのルーティングと価格オーバーライド（`user_id` CEL／エンタープライズユーザーピッカー）。
    - ライブモデルカタログのバックグラウンド更新（`live_models_sync_interval`、デフォルト 1h）。
    - ストリーム切り捨て検出により、上流 SSE の切断をクリーンな `[DONE]` ではなくエラーとして表面化。
    - アクセスプロファイルスキーマ：`blacklisted_models`、重み付きルーティングシード、`model_budgets`。
    - 新しいガードレール統合：Lakera と Repello Argus。
    - 修正：空ストリームハング、vLLM Responses ストリーミング、Gemini ツールスキーマ制約、HuggingFace モデル ID 重複、マルチノードレート制限 CPU など。
    
    また、リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 `openresty/openresty:1.29.2.5-bookworm-fat` に切り替え、nginx マウント／ログパス（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）を合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
    
    完全なリリースノート: https://docs.getbifrost.ai/changelogs/v1.6.7

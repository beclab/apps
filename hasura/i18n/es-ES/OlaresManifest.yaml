metadata:
  title: Hasura
  description: APIs GraphQL en tiempo real instantáneas y ultrarrápidas sobre su BD con control de acceso fino; también dispara webhooks en eventos de base de datos
spec:
  upgradeDescription: |
    El chart 1.0.18 actualiza Hasura Community Edition de v2.48.4-ce a v2.51.0-ce.
    Imagen: docker.io/beclab/hasura-graphql-engine:v2.51.0-ce.
    El admin secret y la conexión a PostgreSQL y Redis de Olares no cambian. Hasura aplica las migraciones del catálogo al arrancar. Si ya existe hdb_catalog.hdb_version, un init container escribe antes un volcado pg_dump en appData/backups/chart-1.0.18/hasura.dump. Los arranques posteriores y una base sin esa tabla lo omiten.
    GitHub no tiene una página de lanzamiento de v2.51.0. Las últimas notas publicadas del motor son v2.50.3: https://github.com/hasura/graphql-engine/releases/tag/v2.50.3
  fullDescription: |
    **Secreto de administrador predeterminado:**
    qwer1234

    **¿Qué es Hasura?**
    El motor Hasura es un proyecto de código abierto que acelera la construcción de aplicaciones modernas proporcionando acceso a los datos a través de un único endpoint de API componible y seguro.

    **Acelerar el desarrollo de APIs**
    Con un enfoque impulsado por metadatos, Hasura reduce el tiempo y el esfuerzo necesarios para configurar y mantener una API robusta (GraphQL, REST, etc.) sobre sus datos.
    Agilice cada paso del ciclo de vida de la API para entregar sin esfuerzo una capa de acceso que desbloquea sus datos.
    - Del dominio a la API en minutos
    - Evolución de API sin esfuerzo
    - Rendimiento máximo. Cero esfuerzo.

    **APIs low-code impulsadas por metadatos y por el dominio**
    Connect — Hasura introspecta su dominio y genera los metadatos que impulsan la API. Estos metadatos capturan el mapeo de datos a API y sirven como un plano totalmente personalizable para su API.
    Query — En tiempo de ejecución, el motor Hasura actúa como un compilador que traduce dinámicamente la solicitud de API a la consulta más eficiente y compacta en el «idioma» que entienden las fuentes de datos upstream.

    **Una API increíble para todos sus datos.**
    Hasura genera una API estandarizada y autodocumentada con una composabilidad increíble. Busque, descubra, comprenda y componga de forma flexible solo los datos que necesita de una sola vez, sin importar de qué dominio provengan o cómo estén almacenados.
    - Composabilidad increíblemente buena
    - No más esperas por funciones de API
    - Visualice, descubra, explore

    **Tenemos un conector para eso**
    Con un rico ecosistema de conectores de datos nativos de código abierto, y la capacidad de crear los suyos, obtener una API potente sobre sus datos, o añadir sus datos a una API supergraph existente, es un paso.

    **Control de acceso granular**
    Configure privilegios basados en roles hasta el nivel de campo directamente en Hasura o rellénelos desde su sistema de autorización existente para exponer la API de forma segura a desarrolladores dentro o fuera de su organización.

    **Una experiencia que los desarrolladores amarán**
    Hasura encaja en sus flujos CI/CD existentes, permitiendo a los desarrolladores construir e iterar rápidamente sobre su API sin romper cosas.

    **Agilizar la colaboración entre equipos de dominio**
    Con un modelo de gobernanza federada, varios equipos de dominio pueden construir y evolucionar de forma colaborativa la API supergraph unificada. Los equipos de dominio pueden avanzar con autonomía y velocidad, cumpliendo al mismo tiempo las normas de gobernanza centralizadas.

    **Sin puntos ciegos**
    Anticípese a los problemas y mejore continuamente su API con datos detallados de rendimiento, tracing y uso

    **Continuidad, asegurada.**
    Hasura despliega al instante la API en una infraestructura runtime serverless global. Obtenga garantías operativas de fiabilidad, rendimiento y escala, sin el trabajo operativo.

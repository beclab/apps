metadata:
  title: Hasura
  description: API GraphQL realtime istantanee e rapidissime sul tuo DB con controllo degli accessi fine; inoltre attiva webhook sugli eventi del database
spec:
  upgradeDescription: |
    Il chart 1.0.18 aggiorna Hasura Community Edition da v2.48.4-ce a v2.51.0-ce.
    Immagine: docker.io/beclab/hasura-graphql-engine:v2.51.0-ce.
    L'admin secret e il collegamento PostgreSQL e Redis di Olares restano invariati. Hasura applica le migrazioni del catalogo all'avvio. Se hdb_catalog.hdb_version esiste già, un init container scrive prima un dump pg_dump in appData/backups/chart-1.0.18/hasura.dump. Gli avvii successivi e un database senza quella tabella saltano la copia.
    GitHub non ha una pagina di release v2.51.0. Le ultime note pubblicate del motore sono v2.50.3: https://github.com/hasura/graphql-engine/releases/tag/v2.50.3
  fullDescription: |
    **Segreto admin predefinito:**
    qwer1234

    **Cos'è Hasura?**
    Il motore Hasura è un progetto open source che accelera la costruzione di applicazioni moderne fornendo l'accesso ai dati tramite un unico endpoint API componibile e sicuro.

    **Accelerare lo sviluppo API**
    Con un approccio guidato dai metadati, Hasura riduce il tempo e lo sforzo necessari per configurare e mantenere un'API robusta (GraphQL, REST, ecc.) sui tuoi dati.
    Semplifica ogni fase del ciclo di vita dell'API per consegnare senza sforzo un livello di accesso che sblocca i tuoi dati.
    - Dal dominio all'API in minuti
    - Evoluzione dell'API senza sforzo
    - Prestazioni di picco. Zero sforzo.

    **API low-code guidate da metadati e dal dominio**
    Connect — Hasura introspeziona il tuo dominio e genera i metadati che alimentano l'API. Questi metadati catturano la mappatura dati-API e fungono da blueprint completamente personalizzabile per la tua API.
    Query — A runtime, il motore Hasura agisce come un compilatore che traduce dinamicamente la richiesta API nella query più efficiente e compatta nel «linguaggio» compreso dalle sorgenti dati upstream.

    **Un'unica incredibile API per tutti i tuoi dati.**
    Hasura genera un'API standardizzata e autodocumentata con incredibile composabilità. Cerca, scopri, comprendi e componi in modo flessibile solo i dati di cui hai bisogno in un colpo solo — indipendentemente dal dominio da cui provengono o da come sono archiviati.
    - Composabilità incredibilmente buona
    - Niente più attese per le funzionalità API
    - Visualizza, scopri, esplora

    **Abbiamo un connettore per quello**
    Con un ricco ecosistema di connettori dati nativi open source, e la possibilità di crearne di tuoi, ottenere una potente API sui tuoi dati, o aggiungere i tuoi dati a un'API supergraph esistente, è un passo.

    **Controllo degli accessi granulare**
    Configura privilegi basati sui ruoli fino al livello di campo direttamente in Hasura o popolali dal tuo sistema di autorizzazione esistente per esporre in sicurezza l'API agli sviluppatori dentro o fuori la tua organizzazione.

    **Un'esperienza che gli sviluppatori ameranno**
    Hasura si inserisce nei tuoi workflow CI/CD esistenti, consentendo agli sviluppatori di costruire e iterare rapidamente sulla tua API senza rompere le cose.

    **Semplificare la collaborazione tra i team di dominio**
    Con un modello di governance federata, più team di dominio possono costruire ed evolvere in modo collaborativo l'API supergraph unificata. I team di dominio possono muoversi con autonomia e velocità, restando conformi alle norme di governance centralizzate.

    **Nessun punto cieco**
    Anticipa i problemi e migliora continuamente la tua API con dati dettagliati di prestazioni, tracing e utilizzo

    **Continuità, assicurata.**
    Hasura distribuisce istantaneamente l'API su un'infrastruttura runtime serverless globale. Ottieni garanzie operative su affidabilità, prestazioni e scala, senza il lavoro operativo.

metadata:
  title: Hasura
  description: "Blitzschnelle, sofortige Echtzeit-GraphQL-APIs auf Ihrer DB mit feingranularer Zugriffskontrolle;\
  \ außerdem Webhooks bei Datenbankereignissen auslösen"
spec:
  upgradeDescription: |
    Chart 1.0.18 aktualisiert die Hasura Community Edition von v2.48.4-ce auf v2.51.0-ce.
    Image: docker.io/beclab/hasura-graphql-engine:v2.51.0-ce.
    Admin-Secret sowie die Olares-PostgreSQL- und Redis-Anbindung bleiben unverändert. Hasura führt Catalog-Migrationen beim Start aus. Existiert hdb_catalog.hdb_version, schreibt ein Init-Container vorher ein pg_dump-Archiv nach appData/backups/chart-1.0.18/hasura.dump. Spätere Starts und eine Datenbank ohne diese Tabelle überspringen das.
    GitHub hat keine Release-Seite für v2.51.0. Die letzten veröffentlichten Engine-Notizen sind v2.50.3: https://github.com/hasura/graphql-engine/releases/tag/v2.50.3
  fullDescription: |
    **Standard-Admin-Geheimnis:**
    qwer1234

    **Was ist Hasura?**
    Die Hasura-Engine ist ein Open-Source-Projekt, das den Aufbau moderner Anwendungen beschleunigt, indem es den Zugriff auf Daten über einen einzigen, komponierbaren, sicheren API-Endpunkt bereitstellt.

    **API-Entwicklung beschleunigen**
    Mit einem metadatengetriebenen Ansatz verkürzt Hasura den Zeit- und Arbeitsaufwand für Aufbau und Wartung einer robusten API (GraphQL, REST usw.) auf Ihren Daten.
    Optimieren Sie jeden Schritt des API-Lebenszyklus, um mühelos eine Zugriffsschicht zu liefern, die Ihre Daten freischaltet.
    - Von der Domäne zur API in Minuten
    - Mühelose API-Evolution
    - Spitzenleistung. Null Aufwand.

    **Low-Code metadatengetrieben, domänengetrieben APIs**
    Connect – Hasura introspektiert Ihre Domäne und erzeugt die Metadaten, die die API antreiben. Diese Metadaten erfassen das Mapping von Daten zu API und dienen als vollständig anpassbarer Bauplan für Ihre API.
    Query – Zur Laufzeit agiert die Hasura-Engine wie ein Compiler, der die API-Anfrage dynamisch in die effizienteste und kompakteste Abfrage in der „Sprache“ der Upstream-Datenquellen übersetzt.

    **Eine unglaubliche API für all Ihre Daten.**
    Hasura erzeugt eine standardisierte, selbst dokumentierte API mit unglaublicher Komponierbarkeit. Suchen, entdecken, verstehen und flexibel nur die Daten zusammenstellen, die Sie brauchen – egal aus welcher Domäne die Daten stammen oder wie sie gespeichert sind.
    - Unmöglich gute Komponierbarkeit
    - Kein Warten mehr auf API-Features
    - Visualisieren, entdecken, erkunden

    **Wir haben einen Connector dafür**
    Mit einem reichen Ökosystem Open-Source-nativer Daten-Connectoren und der Möglichkeit, eigene zu bauen, ist eine leistungsstarke API auf Ihren Daten oder das Hinzufügen Ihrer Daten zu einer bestehenden Supergraph-API ein Schritt.

    **Granulare Zugriffskontrolle**
    Konfigurieren Sie rollenbasierte Privilegien bis auf Feldebene direkt in Hasura oder befüllen Sie sie aus Ihrem bestehenden Autorisierungssystem, um die API sicher für Entwickler innerhalb oder außerhalb Ihrer Organisation freizugeben.

    **Ein Erlebnis, das Entwickler lieben werden**
    Hasura fügt sich in Ihre bestehenden CI/CD-Workflows ein und ermöglicht Entwicklern, Ihre API schnell zu bauen und zu iterieren – ohne Dinge kaputtzumachen.

    **Zusammenarbeit über Domänenteams hinweg optimieren**
    Mit einem föderierten Governance-Modell können mehrere Domänenteams die einheitliche Supergraph-API gemeinsam aufbauen und weiterentwickeln. Domänenteams können mit Autonomie und Tempo vorankommen und bleiben zugleich konform mit zentralen Governance-Normen.

    **Keine blinden Flecken**
    Bleiben Sie Problemen voraus und verbessern Sie Ihre API kontinuierlich mit detaillierten Leistungs-, Tracing- und Nutzungsdaten

    **Kontinuität, sichergestellt.**
    Hasura stellt die API sofort auf einer globalen Serverless-Runtime-Infrastruktur bereit. Erhalten Sie operative Garantien für Zuverlässigkeit, Leistung und Skalierung – ohne den operativen Aufwand.

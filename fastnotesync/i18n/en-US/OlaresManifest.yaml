metadata:
  title: Fast Note Sync
  description: Fast Note Sync Service is a self-hosted platform designed for real-time synchronization of Obsidian notes.
spec:
  upgradeDescription: |
    v1.0.3: Upgrade Fast Note Sync Service from 3.5.1 to 3.6.1.
    - 3.5.7 fixes a serious issue where concurrent note or file saves could lose data because of a misused lock, and stops backup temp files from piling up (backup retention now defaults to 10 days).
    - 3.6.0 adds manual conflict handling for multi-device sync and an API to purge expired web login tokens; it also fixes "object not found" on Git pull and inaccurate WebSocket client IPs.
    - 3.6.1 adds MCP access behind reverse proxies (Cloudflare Tunnel or loopback proxy) and Vault repository discovery for authenticated users; it also fixes history ownership not migrating after a note rename, custom Cron backup policies silently degrading to once per minute, and MCP sessions returning 404 that clients could not recover from.
    - No protocol-breaking change is announced in these releases; the client 2.2.0+ requirement introduced in 3.5.1 still applies.
    - This chart changes no configuration or environment variable, and reuses the existing data and config volumes as-is.
  fullDescription: |
    Fast Note Sync Service is a high-performance, low-latency Obsidian note synchronization, online management, and remote REST API service platform.

metadata:
  title: Fast Note Sync
  description: Fast Note Sync Service 是一个为 Obsidian 设计的高性能、低延迟的自托管笔记实时同步平台。
spec:
  upgradeDescription: |
    v1.0.3：Fast Note Sync Service 从 3.5.1 升级到 3.6.1。
    - 3.5.7 修复了并发保存笔记或文件时因并发锁误用导致部分数据丢失的严重问题，并修复备份暂存文件永久堆积（备份保留天数默认改为 10 天）。
    - 3.6.0 支持多端同步时的手动冲突处理，新增清理过期 Web 登录令牌的接口，并修复 Git 同步拉取报 "object not found"、WebSocket 在线客户端 IP 获取不准确的问题。
    - 3.6.1 支持在反向代理（Cloudflare Tunnel / 回环代理）环境下访问 MCP，支持已鉴权用户自动发现 Vault 存储库，并修复重命名笔记后历史版本归属未迁移、自定义 Cron 备份策略解析失败后退化为每分钟执行、MCP 长连接返回 404 后客户端无法自动恢复等问题。
    - 这些版本未提及破坏性协议变更，3.5.1 起要求的客户端 2.2.0+ 依然适用。
    - 本 chart 未改动任何配置或环境变量，原有数据卷与配置卷沿用不变。
  fullDescription: |
    Fast Note Sync Service 是一个高性能、低延迟的 Obsidian 笔记同步、在线管理及远程 REST API 服务平台。基于 Golang + Websocket + React 构建。

    **主要功能：**
    - 支持 Obsidian Fast Note Sync 插件，提供多端秒级实时同步。
    - 完美的附件同步支持，支持大附件的分片上传和下载。
    - 原生支持 Model Context Protocol (MCP)，可无缝接入 Cherry Studio、Cursor 等 AI 客户端作为知识库。
    - 提供标准的 REST API 接口用于笔记自动增删改查。
    - 内置现代化的 Web 管理面板，方便管理用户、仓库及笔记，并支持历史版本和回收站。
    - 适配多种存储协议（如本地存储、S3、WebDAV 等）以及多种数据库（SQLite, MySQL, PostgreSQL）。

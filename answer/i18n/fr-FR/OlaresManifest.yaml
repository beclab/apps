metadata:
  title: Answer
  description: "Un logiciel de plateforme Q&R pour les équipes de toute taille"
spec:
  upgradeDescription: |
    Mise à jour de Apache Answer de 2.0.1 vers 2.0.2. Améliore les conversations IA et les notifications par e-mail, et corrige les liens courts, les contrôles des autorisations et le traitement des requêtes.

    https://github.com/apache/answer/releases/tag/v2.0.2

  fullDescription: |
    Un logiciel de plateforme Q&R pour les équipes de toute taille. Qu'il s'agisse d'un forum communautaire, d'un centre d'aide ou d'une plateforme de gestion des connaissances, vous pouvez toujours compter sur Apache Answer.

    **Fonctionnalités**
    Expérience Q&R allégée
    - Question et réponse : Soumettez et répondez aux questions sans effort.
    - Aperçu en temps réel avec Markdown : Créez votre contenu et voyez le formatage au fur et à mesure avec un Markdown intuitif côte à côte, compatible avec CommonMark.
    - Mentionner un expert : Notifiez les utilisateurs pertinents de la communauté qui pourraient avoir la réponse pour une réponse plus rapide.
    - Recherche avancée : Trouvez rapidement le contenu recherché avec des options de filtrage et tag, nom d'utilisateur, score, etc.
    - Suggestions en temps réel : Découvrez des questions pertinentes pendant que vous tapez, et passez directement à elles.

    Gestion de communauté sans tracas
    - Rôles Admin/Modérateur/Utilisateur : Gérez les niveaux d'accès des utilisateurs pour un contrôle optimal.
    - Ajouter des utilisateurs en masse : Ajoutez plusieurs utilisateurs à la fois et développez la communauté efficacement.
    - Système de tags : Organisez le contenu avec des tags pour une catégorisation efficace et une navigation aisée.
    - Édition ouverte et collaboration : Tout le monde peut modifier les questions, réponses et tags existants pour garder le contenu exact et à jour.
    - Historique des révisions transparent : Chaque modification peut être suivie et stockée pour référence, permettant de voir comment le contenu a évolué.

    Cultiver une communauté florissante
    - Système de votes : Construisez une meilleure communauté avec votre voix : upvotez les grandes réponses, downvotez celles qui ne le sont pas.
    - Système de réputation : Gagnez de la reconnaissance grâce aux contributions et débloquez des privilèges dans la communauté.
    - Notification : Soyez toujours notifié des nouveaux commentaires, réponses, invitations, votes, et plus.
    - Suivre des tags : Suivez des tags et restez au courant de vos Q&R préférées.
    - Profil utilisateur : Montrez fièrement expertise, centres d'intérêt et contributions à la communauté.

    Personnalisation et plugins
    - Thèmes et mises en page : Personnalisez la communauté en ligne pour qu'elle corresponde à votre identité.
    - Plugins : Renforcez Apache Answer avec des plugins construits par la communauté, comme la connexion tierce, le cache, la recherche, etc.

    Confidentialité et sécurité
    - Contrôle d'accès à la connexion : Contrôlez les inscriptions, méthodes de connexion et domaines e-mail autorisés pour créer un environnement sécurisé.
    - Contrôle d'accès au contenu : Le contenu n'est accessible qu'aux membres de la communauté, gardant les discussions en sécurité.

    Plus
    - Multilingue : Construisez et hébergez votre communauté dans différentes langues traduites par la communauté.
    - Mise en page responsive : Rejoignez la conversation communautaire sans friction depuis n'importe quel appareil.
    - Mode sombre : Personnalisez l'expérience communautaire pour rester concentré.
    - Séparation front-end et back-end : C'est un monorepo qui contient à la fois le frontend et le backend.

metadata:
  title: Answer
  description: Un software de plataforma de preguntas y respuestas para equipos de cualquier escala
spec:
  upgradeDescription: |
    Actualiza Apache Answer de 2.0.1 a 2.0.2. Mejora los registros de conversaciones de IA y las notificaciones por correo, y corrige la edición con enlaces cortos, los permisos y el procesamiento de solicitudes.

    https://github.com/apache/answer/releases/tag/v2.0.2

  fullDescription: |
    Un software de plataforma de preguntas y respuestas para equipos de cualquier escala. Ya sea un foro comunitario, un centro de ayuda o una plataforma de gestión del conocimiento, siempre puede contar con Apache Answer.

    **Características**
    Experiencia de Q&A simplificada
    - Pregunta y respuesta: Envíe y responda preguntas sin esfuerzo.
    - Vista previa en tiempo real con Markdown: Cree contenido y vea el formato mientras escribe con Markdown intuitivo lado a lado, compatible con CommonMark.
    - Mencionar a un experto: Notifique a usuarios relevantes de la comunidad que puedan tener la respuesta para una respuesta más rápida.
    - Búsqueda avanzada: Encuentre rápidamente el contenido que busca con opciones de filtrado y etiqueta, nombre de usuario, puntuación, etc.
    - Sugerencias en tiempo real: Descubra preguntas relevantes mientras escribe y salte directamente a ellas.

    Gestión comunitaria sin complicaciones
    - Roles Admin/Moderador/Usuario: Gestione los niveles de acceso de los usuarios para un control óptimo.
    - Añadir usuarios en masa: Añada varios usuarios a la vez y amplíe la comunidad de forma eficiente.
    - Sistema de etiquetas: Organice el contenido con etiquetas para una categorización eficiente y una navegación sencilla.
    - Edición abierta y colaboración: Cualquiera puede editar preguntas, respuestas y etiquetas existentes para mantener el contenido preciso y actualizado.
    - Historial de revisiones transparente: Cada edición puede rastrearse y almacenarse como referencia, permitiendo ver cómo ha evolucionado el contenido.

    Cultivar una comunidad próspera
    - Sistema de votos: Construya una mejor comunidad con su voz: vote a favor las grandes respuestas y en contra las que no lo son.
    - Sistema de reputación: Gane reconocimiento con contribuciones y desbloquee privilegios en la comunidad.
    - Notificación: Reciba siempre avisos de nuevos comentarios, respuestas, invitaciones, votos y más.
    - Seguir etiquetas: Siga etiquetas y manténgase al día de sus Q&A favoritas.
    - Perfil de usuario: Muestre con orgullo experiencia, intereses y contribuciones a la comunidad.

    Personalización y plugins
    - Temas y diseños: Personalice la comunidad en línea para que coincida con su identidad.
    - Plugins: Potencie Apache Answer con plugins creados por la comunidad, como inicio de sesión de terceros, caché, búsqueda, etc.

    Privacidad y seguridad
    - Control de acceso al inicio de sesión: Controle registros, métodos de inicio de sesión y dominios de correo permitidos para crear un entorno seguro.
    - Control de acceso al contenido: El contenido solo es accesible para los miembros de la comunidad, manteniendo seguras las discusiones.

    Más
    - Multilingüe: Construya y aloje su comunidad en distintos idiomas traducidos por la comunidad.
    - Diseño responsivo: Únase a la conversación comunitaria sin problemas desde cualquier dispositivo.
    - Modo oscuro: Personalice la experiencia comunitaria para mantener la concentración.
    - Separación de front-end y back-end: Es un monorepo que contiene tanto el frontend como el backend.

metadata:
  title: Answer
  description: "Un software di piattaforma Q&A per team di qualsiasi dimensione"
spec:
  upgradeDescription: |
    Aggiorna Apache Answer da 2.0.1 a 2.0.2. Migliora le conversazioni IA e le notifiche email e corregge i collegamenti brevi, i controlli delle autorizzazioni e la gestione delle richieste.

    https://github.com/apache/answer/releases/tag/v2.0.2

  fullDescription: |
    Un software di piattaforma Q&A per team di qualsiasi dimensione. Che si tratti di un forum della community, di un help center o di una piattaforma di knowledge management, puoi sempre contare su Apache Answer.

    **Funzionalità**
    Esperienza Q&A snella
    - Domanda e risposta: Invia e rispondi alle domande senza sforzo.
    - Anteprima in tempo reale con Markdown: Crea i contenuti e vedi la formattazione mentre digiti con Markdown intuitivo affiancato, compatibile con CommonMark.
    - Avvisa un esperto: Notifica gli utenti rilevanti della community che potrebbero avere la risposta per una risposta più rapida.
    - Ricerca avanzata: Trova rapidamente i contenuti che cerchi con opzioni di filtro e tag, nome utente, punteggio, ecc.
    - Suggerimenti in tempo reale: Scopri domande rilevanti mentre digiti e vai direttamente ad esse.

    Gestione della community senza problemi
    - Ruoli Admin/Moderatore/Utente: Gestisci i livelli di accesso degli utenti per un controllo ottimale.
    - Aggiungi utenti in blocco: Aggiungi più utenti contemporaneamente ed espandi la community in modo efficiente.
    - Sistema di tagging: Organizza i contenuti con i tag per una categorizzazione efficiente e una navigazione semplice.
    - Editing aperto e collaborazione: Chiunque può modificare domande, risposte e tag esistenti per mantenere i contenuti accurati e aggiornati.
    - Cronologia delle revisioni trasparente: Ogni modifica può essere tracciata e archiviata per riferimento, permettendo di vedere come i contenuti sono evoluti nel tempo.

    Coltivare una community fiorente
    - Sistema di voti: Costruisci una community migliore con la tua voce: upvote le grandi risposte e downvote quelle che non lo sono.
    - Sistema di reputazione: Guadagna riconoscimento con i contributi e sblocca privilegi nella community.
    - Notifica: Ricevi sempre notifiche di nuovi commenti, risposte, inviti, voti e altro.
    - Segui i tag: Segui i tag e resta aggiornato sulle tue Q&A preferite.
    - Profilo utente: Mostra con orgoglio competenza, interessi e contributi alla community.

    Personalizzazione e plugin
    - Temi e layout: Personalizza la community online per riflettere la tua identità.
    - Plugin: Potenzia Apache Answer con plugin costruiti dalla community, come login di terze parti, cache, ricerca, ecc.

    Privacy e sicurezza
    - Controllo dell'accesso al login: Controlla registrazioni, metodi di login e domini email consentiti per creare un ambiente sicuro.
    - Controllo dell'accesso ai contenuti: I contenuti sono accessibili solo ai membri della community, mantenendo sicure le discussioni.

    Altro
    - Multilingue: Costruisci e ospita la tua community in diverse lingue tradotte dalla community.
    - Layout responsive: Partecipa alla conversazione della community senza interruzioni da qualsiasi dispositivo.
    - Dark Mode: Personalizza l'esperienza della community per restare concentrato.
    - Separazione di front-end e back-end: È un monorepo che contiene sia il frontend sia il backend.

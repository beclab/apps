metadata:
  title: Answer
  description: "あらゆる規模のチーム向けの Q&A プラットフォームソフトウェア"
spec:
  upgradeDescription: |
    Apache Answer を 2.0.1 から 2.0.2 に更新します。AI 対話記録とメール通知を改善し、短縮リンクでの編集、権限チェック、リクエスト処理の問題を修正します。

    https://github.com/apache/answer/releases/tag/v2.0.2

  fullDescription: |
    あらゆる規模のチーム向けの Q&A プラットフォームソフトウェア。コミュニティフォーラム、ヘルプセンター、ナレッジ管理プラットフォームのいずれでも、Apache Answer を信頼できます。

    **機能**
    スムーズな Q&A 体験
    - 質問と回答: 手間なく質問を投稿・回答。
    - Markdown リアルタイムプレビュー: 直感的な Markdown を並べて入力しながら書式を確認。CommonMark 互換。
    - 専門家に通知: 答えを持ちそうなコミュニティの関連ユーザーに通知し、より早く回答を得る。
    - 高度な検索: フィルタやタグ、ユーザー名、スコアなどで目的のコンテンツをすばやく検索。
    - リアルタイム候補: 入力中に関連質問を発見し、すぐにジャンプ。

    手間のないコミュニティ管理
    - 管理者／モデレーター／ユーザー役割: 最適な制御のためユーザーアクセスレベルを管理。
    - 一括ユーザー追加: 複数ユーザーを一度に追加し、効率よくコミュニティを拡大。
    - タグシステム: タグでコンテンツを整理し、効率的な分類と容易なナビを実現。
    - オープン編集とコラボレーション: 誰でも既存の質問・回答・タグを編集し、正確で最新の状態を維持。
    - 透明な改訂履歴: すべての編集を追跡・保存でき、コンテンツの変遷を確認可能。

    活気あるコミュニティを育てる
    - 投票システム: 良い回答にupvote、そうでないものにdownvoteして、より良いコミュニティを構築。
    - 評判システム: 貢献で認知を得て、コミュニティ内の特権を解除。
    - 通知: 新しいコメント、回答、招待、投票などを常に通知。
    - タグをフォロー: タグをフォローして、お気に入りの Q&A を把握。
    - ユーザープロフィール: 専門性、興味、コミュニティへの貢献を誇りを持って表示。

    カスタマイズとプラグイン
    - テーマとレイアウト: オンラインコミュニティをアイデンティティに合わせてカスタマイズ。
    - プラグイン: サードパーティログイン、キャッシュ、検索などコミュニティ製プラグインで Apache Answer を強化。

    プライバシーとセキュリティ
    - ログインアクセス制御: 登録、ログイン方法、許可メールドメインを管理し、安全な環境を構築。
    - コンテンツアクセス制御: コンテンツはコミュニティメンバーのみがアクセスでき、議論を安全に保つ。

    その他
    - 多言語: コミュニティ翻訳によるさまざまな言語でコミュニティを構築・ホスト。
    - レスポンシブレイアウト: どのデバイスからでもシームレスに参加。
    - ダークモード: 集中できるようコミュニティ体験をパーソナライズ。
    - フロントエンドとバックエンドの分離: フロントとバックの両方を含むモノレポ。

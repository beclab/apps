metadata:
  title: Answer
  description: "Eine Q&A-Plattform-Software für Teams jeder Größe"
spec:
  upgradeDescription: |
    Apache Answer von 2.0.1 auf 2.0.2 aktualisieren. Verbessert KI-Gesprächsprotokolle und E-Mail-Benachrichtigungen; behebt Probleme mit Kurzlinks, Berechtigungsprüfungen und der Anfrageverarbeitung.

    https://github.com/apache/answer/releases/tag/v2.0.2

  fullDescription: |
    Eine Q&A-Plattform-Software für Teams jeder Größe. Ob Community-Forum, Helpcenter oder Wissensmanagement-Plattform – Sie können sich immer auf Apache Answer verlassen.

    **Funktionen**
    Schlanke Q&A-Erfahrung
    - Frage & Antwort: Fragen mühelos stellen und beantworten.
    - Echtzeitvorschau mit Markdown: Inhalte erstellen und die Formatierung beim Tippen mit intuitivem Markdown nebeneinander sehen, kompatibel mit CommonMark.
    - Einen Experten anpingen: Relevante Nutzer in der Community benachrichtigen, die die Antwort haben könnten – für eine schnellere Antwort.
    - Erweiterte Suche: Gesuchte Inhalte schnell finden mit Filteroptionen sowie Tag, Benutzername, Score usw.
    - Echtzeitvorschläge: Relevante Fragen entdecken, während Sie tippen, und direkt dorthin springen.

    Unkomplizierte Community-Verwaltung
    - Admin-/Moderator-/Benutzerrollen: Benutzerzugriffsstufen für optimale Kontrolle verwalten.
    - Benutzer in Massen hinzufügen: Mehrere Benutzer auf einmal hinzufügen und die Community effizient erweitern.
    - Tagging-System: Inhalte mit Tags für effiziente Kategorisierung und einfache Navigation organisieren.
    - Offenes Bearbeiten und Zusammenarbeit: Jeder kann bestehende Fragen, Antworten und Tags bearbeiten, um Inhalte aktuell und korrekt zu halten.
    - Transparente Revisionshistorie: Jede Bearbeitung kann nachverfolgt und gespeichert werden, sodass Nutzer die Entwicklung der Inhalte sehen.

    Eine florierende Community fördern
    - Abstimmungssystem: Bauen Sie mit Ihrer Stimme eine bessere Community: gute Antworten hochvoten, schlechte heruntervoten.
    - Reputationssystem: Anerkennung durch Beiträge verdienen und Privilegien in der Community freischalten.
    - Benachrichtigung: Immer über neue Kommentare, Antworten, Einladungen, Stimmen und mehr informiert werden.
    - Tags folgen: Tags folgen und bei Ihren Lieblings-Q&A auf dem Laufenden bleiben.
    - Benutzerprofil: Expertise, Interessen und Beiträge zur Community mit Stolz zeigen.

    Anpassung und Plugins
    - Themes und Layouts: Die Online-Community an Ihre Identität anpassen.
    - Plugins: Apache Answer mit von der Community gebauten Plugins erweitern, z. B. Drittanbieter-Login, Cache, Suche usw.

    Privatsphäre und Sicherheit
    - Login-Zugriffskontrolle: Registrierungen, Anmeldemethoden und erlaubte E-Mail-Domains steuern, um eine sichere Umgebung zu schaffen.
    - Inhalts-Zugriffskontrolle: Inhalte sind nur für Community-Mitglieder zugänglich und halten Diskussionen sicher.

    Mehr
    - Mehrsprachig: Ihre Community in verschiedenen Sprachen aufbauen und hosten, übersetzt von der Community.
    - Responsives Layout: Nahtlos von jedem Gerät aus an der Community-Konversation teilnehmen.
    - Dark Mode: Community-Erlebnis personalisieren, um konzentriert zu bleiben.
    - Trennung von Frontend und Backend: Es ist ein Monorepo, das Frontend und Backend enthält.

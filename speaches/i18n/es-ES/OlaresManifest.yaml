metadata:
  title: Speaches
  description: Servidor TTS/STT compatible con OpenAI
spec:
  fullDescription: |
    Speaches es un servidor compatible con la API de OpenAI que admite transcripción, traducción y generación de voz en streaming. Speech-to-Text funciona con faster-whisper y para Text-to-Speech se usan Piper y Kokoro. Este proyecto aspira a ser Ollama, pero para modelos TTS/STT.

    **Funciones clave**
    - Text-to-Speech impulsado por modelos Kokoro y Piper.
    - Speech-to-Text impulsado por faster-whisper para transcripción de alta calidad.
    - API compatible con OpenAI (/v1/audio/speech, /v1/audio/transcriptions, etc.).
    - Interfaz web Gradio integrada para pruebas interactivas.
    - Terminal integrada para gestión de modelos por CLI (descargar, listar, eliminar).
    - Aceleración GPU (NVIDIA CUDA) con respaldo en CPU.
    - Entrada compartida para integración fluida con otras apps de Olares.

    **Modelos preinstalados**
    - Kokoro-82M-v1.0-ONNX (TTS) — síntesis de voz ligera y de alta calidad.
    - faster-whisper-small (STT) — reconocimiento de voz rápido y preciso.
    - Se pueden descargar modelos adicionales mediante la entrada Terminal.

    **Uso**
    - Abre la UI de Speaches para probar TTS/STT de forma interactiva con Gradio.
    - Usa el Terminal para descargar modelos adicionales desde HuggingFace.
    - Otras apps de Olares pueden llamar a la API mediante la entrada compartida o la entrada API.
    - La API es totalmente compatible con SDKs y bibliotecas de OpenAI.

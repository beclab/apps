metadata:
  title: Speaches
  description: Serveur TTS/STT compatible OpenAI
spec:
  fullDescription: |
    Speaches est un serveur compatible avec l'API OpenAI prenant en charge la transcription, la traduction et la génération de parole en streaming. Speech-to-Text s'appuie sur faster-whisper ; pour Text-to-Speech, Piper et Kokoro sont utilisés. Ce projet vise à être Ollama, mais pour les modèles TTS/STT.

    **Fonctionnalités clés**
    - Text-to-Speech propulsé par les modèles Kokoro et Piper.
    - Speech-to-Text propulsé par faster-whisper pour une transcription de haute qualité.
    - API compatible OpenAI (/v1/audio/speech, /v1/audio/transcriptions, etc.).
    - Interface web Gradio intégrée pour des tests interactifs.
    - Terminal intégré pour la gestion CLI des modèles (télécharger, lister, supprimer).
    - Accélération GPU (NVIDIA CUDA) avec repli CPU.
    - Entrée partagée pour une intégration fluide avec d'autres applications Olares.

    **Modèles préinstallés**
    - Kokoro-82M-v1.0-ONNX (TTS) — synthèse vocale légère et de haute qualité.
    - faster-whisper-small (STT) — reconnaissance vocale rapide et précise.
    - Des modèles supplémentaires peuvent être téléchargés via l'entrée Terminal.

    **Utilisation**
    - Ouvrez l'UI Speaches pour tester TTS/STT interactivement via Gradio.
    - Utilisez le Terminal pour télécharger des modèles supplémentaires depuis HuggingFace.
    - D'autres applications Olares peuvent appeler l'API via l'entrée partagée ou l'entrée API.
    - L'API est entièrement compatible avec les SDK et bibliothèques OpenAI.

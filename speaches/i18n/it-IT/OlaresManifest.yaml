metadata:
  title: Speaches
  description: Server TTS/STT compatibile con OpenAI
spec:
  fullDescription: |
    Speaches è un server compatibile con l'API OpenAI che supporta trascrizione, traduzione e generazione vocale in streaming. Speech-to-Text è basato su faster-whisper; per Text-to-Speech si usano Piper e Kokoro. Questo progetto punta a essere Ollama, ma per i modelli TTS/STT.

    **Funzionalità principali**
    - Text-to-Speech basato sui modelli Kokoro e Piper.
    - Speech-to-Text basato su faster-whisper per trascrizioni di alta qualità.
    - API compatibile con OpenAI (/v1/audio/speech, /v1/audio/transcriptions, ecc.).
    - Web UI Gradio integrata per test interattivi.
    - Terminale integrato per la gestione modelli da CLI (download, elenco, rimozione).
    - Accelerazione GPU (NVIDIA CUDA) con fallback CPU.
    - Ingresso condiviso per integrazione fluida con altre app Olares.

    **Modelli preinstallati**
    - Kokoro-82M-v1.0-ONNX (TTS) — sintesi vocale leggera e di alta qualità.
    - faster-whisper-small (STT) — riconoscimento vocale rapido e accurato.
    - Modelli aggiuntivi scaricabili tramite l'ingresso Terminal.

    **Utilizzo**
    - Apri la UI Speaches per testare TTS/STT interattivamente via Gradio.
    - Usa il Terminal per scaricare modelli aggiuntivi da HuggingFace.
    - Altre app Olares possono chiamare l'API tramite l'ingresso condiviso o l'ingresso API.
    - L'API è pienamente compatibile con SDK e librerie OpenAI.

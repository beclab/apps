metadata:
  title: Speaches
  description: OpenAI-kompatibler TTS/STT-Server
spec:
  fullDescription: |
    Speaches ist ein OpenAI-API-kompatibler Server mit Unterstützung für Streaming-Transkription, Übersetzung und Sprachgenerierung. Speech-to-Text wird von faster-whisper betrieben, für Text-to-Speech werden Piper und Kokoro verwendet. Dieses Projekt zielt darauf ab, Ollama — aber für TTS/STT-Modelle — zu sein.

    **Hauptfunktionen**
    - Text-to-Speech mit Kokoro- und Piper-Modellen.
    - Speech-to-Text mit faster-whisper für hochwertige Transkription.
    - OpenAI-kompatible API (/v1/audio/speech, /v1/audio/transcriptions usw.).
    - Integrierte Gradio-Web-UI für interaktives Testen.
    - Integriertes Terminal für CLI-Modellverwaltung (Modelle herunterladen, auflisten, entfernen).
    - GPU-Beschleunigung (NVIDIA CUDA) mit CPU-Fallback.
    - Gemeinsamer Eingang für nahtlose Integration mit anderen Olares-Apps.

    **Vorinstallierte Modelle**
    - Kokoro-82M-v1.0-ONNX (TTS) — leichtgewichtige, hochwertige Sprachsynthese.
    - faster-whisper-small (STT) — schnelle und genaue Spracherkennung.
    - Zusätzliche Modelle können über den Terminal-Eingang heruntergeladen werden.

    **Nutzung**
    - Öffnen Sie die Speaches-UI, um TTS/STT interaktiv über die Gradio-Oberfläche zu testen.
    - Nutzen Sie das Terminal, um zusätzliche Modelle von HuggingFace herunterzuladen.
    - Andere Olares-Apps können die API über den gemeinsamen oder den API-Eingang aufrufen.
    - Die API ist vollständig kompatibel mit OpenAI-SDKs und -Bibliotheken.

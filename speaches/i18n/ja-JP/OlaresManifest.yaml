metadata:
  title: Speaches
  description: OpenAI 互換の TTS/STT サーバー
spec:
  fullDescription: |
    Speaches はストリーミング文字起こし、翻訳、音声生成に対応した OpenAI API 互換サーバーです。Speech-to-Text は faster-whisper、Text-to-Speech は Piper と Kokoro を使用します。このプロジェクトは TTS/STT モデル向けの Ollama を目指しています。

    **主な機能**
    - Kokoro および Piper モデルによる Text-to-Speech。
    - faster-whisper による高品質な Speech-to-Text。
    - OpenAI 互換 API（/v1/audio/speech、/v1/audio/transcriptions など）。
    - 対話的テスト用の組み込み Gradio Web UI。
    - CLI モデル管理用の組み込みターミナル（ダウンロード、一覧、削除）。
    - GPU 加速（NVIDIA CUDA）と CPU フォールバック。
    - 他の Olares アプリとのシームレス連携用共有エントランス。

    **プリインストールモデル**
    - Kokoro-82M-v1.0-ONNX（TTS）— 軽量で高品質な音声合成。
    - faster-whisper-small（STT）— 高速で正確な音声認識。
    - 追加モデルは Terminal エントランスからダウンロード可能。

    **使い方**
    - Speaches UI を開き、Gradio で TTS/STT を対話的にテスト。
    - Terminal で HuggingFace から追加モデルをダウンロード。
    - 他の Olares アプリは共有エントランスまたは API エントランス経由で API を呼び出せます。
    - API は OpenAI SDK・ライブラリと完全互換です。

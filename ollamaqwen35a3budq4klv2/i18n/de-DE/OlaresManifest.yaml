metadata:
  title: Qwen3.5 35B A3B UD-Q4 (Ollama)
  description: Qwen3.5-35B-A3B GGUF (Q4_K_L-Quantisierung) lokal über Ollama ausführen

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über die Referenz-App nutzen.

    **MODELL**
    Qwen3.5-35B-A3B ist ein Mixture-of-Experts-Modell der Qwen3.5-Serie von Alibaba. Es aktiviert 3B Parameter von insgesamt 35B und liefert starke Leistung bei geringerem Ressourcenverbrauch. Qwen3.5 integriert Durchbrüche in multimodalem Lernen, Architektur-Effizienz und Reinforcement Learning, um Entwickler und Unternehmen mit außergewöhnlichen Fähigkeiten zu stärken.

    - Modell: Qwen3.5-35B-A3B-UD-Q4_K_L
    - Quelle: unsloth/Qwen3.5-35B-A3B-GGUF (Hugging Face)
    - Quantisierung: Q4_K_L
    - Kontext: 131072
    - Backend: Ollama

  upgradeDescription: |
    Upgrade der Ollama-Runtime auf ollama/ollama:0.30.10.
    Upgrade des Olares-API-Proxys auf beclab/harveyff-olares-ollama:v0.1.22 (OpenAI vision image_url-Weiterleitung).

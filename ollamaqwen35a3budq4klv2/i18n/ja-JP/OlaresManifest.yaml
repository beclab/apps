metadata:
  title: Qwen3.5 35B A3B UD-Q4 (Ollama)
  description: Qwen3.5-35B-A3B GGUF（Q4_K_L 量子化）を Ollama 経由でローカル実行

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。

    **モデル**
    Qwen3.5-35B-A3B は Alibaba の Qwen3.5 シリーズの Mixture-of-Experts モデルです。総 35B のうち 3B パラメータを活性化し、低いリソース使用量で高い性能を発揮します。Qwen3.5 はマルチモーダル学習、アーキテクチャ効率、強化学習のブレークスルーを統合し、開発者や企業に前例のない能力を提供します。

    - モデル: Qwen3.5-35B-A3B-UD-Q4_K_L
    - ソース: unsloth/Qwen3.5-35B-A3B-GGUF（Hugging Face）
    - 量子化: Q4_K_L
    - コンテキスト: 131072
    - バックエンド: Ollama

  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 へアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 へアップグレード（OpenAI vision image_url 転送）。

metadata:
  title: Qwen3.5 35B A3B UD-Q4 (Ollama)
  description: Ejecuta Qwen3.5-35B-A3B GGUF (cuantización Q4_K_L) localmente vía Ollama

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Admin de Olares, todos los usuarios del clúster pueden usarla mediante la app de referencia.

    **MODELO**
    Qwen3.5-35B-A3B es un modelo Mixture-of-Experts de la serie Qwen3.5 de Alibaba. Activa 3B parámetros de un total de 35B, ofreciendo un rendimiento sólido con menor uso de recursos. Qwen3.5 integra avances en aprendizaje multimodal, eficiencia arquitectónica y aprendizaje por refuerzo para potenciar a desarrolladores y empresas.

    - Modelo: Qwen3.5-35B-A3B-UD-Q4_K_L
    - Fuente: unsloth/Qwen3.5-35B-A3B-GGUF (Hugging Face)
    - Cuantización: Q4_K_L
    - Contexto: 131072
    - Backend: Ollama

  upgradeDescription: |
    Actualizar el runtime de Ollama a ollama/ollama:0.30.10.
    Actualizar el proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).

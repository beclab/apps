metadata:
  title: Qwen3.5 35B A3B UD-Q4 (Ollama)
  description: Exécutez Qwen3.5-35B-A3B GGUF (quantification Q4_K_L) en local via Ollama

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s’agit d’une app partagée. Une fois installée par l’Admin Olares, tous les utilisateurs du cluster peuvent l’utiliser via l’app de référence.

    **MODÈLE**
    Qwen3.5-35B-A3B est un modèle Mixture-of-Experts de la série Qwen3.5 d’Alibaba. Il active 3B paramètres sur 35B au total, offrant de solides performances avec moins de ressources. Qwen3.5 intègre des avancées en apprentissage multimodal, efficacité architecturale et apprentissage par renforcement pour renforcer développeurs et entreprises.

    - Modèle : Qwen3.5-35B-A3B-UD-Q4_K_L
    - Source : unsloth/Qwen3.5-35B-A3B-GGUF (Hugging Face)
    - Quantification : Q4_K_L
    - Contexte : 131072
    - Backend : Ollama

  upgradeDescription: |
    Mise à niveau du runtime Ollama vers ollama/ollama:0.30.10.
    Mise à niveau du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).

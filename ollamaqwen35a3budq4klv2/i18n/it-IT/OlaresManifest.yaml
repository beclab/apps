metadata:
  title: Qwen3.5 35B A3B UD-Q4 (Ollama)
  description: Esegui Qwen3.5-35B-A3B GGUF (quantizzazione Q4_K_L) in locale via Ollama

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un’app condivisa. Una volta installata dall’Admin Olares, tutti gli utenti del cluster possono usarla tramite l’app di riferimento.

    **MODELLO**
    Qwen3.5-35B-A3B è un modello Mixture-of-Experts della serie Qwen3.5 di Alibaba. Attiva 3B parametri su 35B totali, offrendo prestazioni solide con minore uso di risorse. Qwen3.5 integra progressi nell’apprendimento multimodale, nell’efficienza architetturale e nel reinforcement learning per potenziare sviluppatori e imprese.

    - Modello: Qwen3.5-35B-A3B-UD-Q4_K_L
    - Fonte: unsloth/Qwen3.5-35B-A3B-GGUF (Hugging Face)
    - Quantizzazione: Q4_K_L
    - Contesto: 131072
    - Backend: Ollama

  upgradeDescription: |
    Aggiornare il runtime Ollama a ollama/ollama:0.30.10.
    Aggiornare il proxy API Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url vision OpenAI).

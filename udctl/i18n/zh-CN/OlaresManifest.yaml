metadata:
  title: udctl
  description: 人与 AI Agent 共用的私密工作空间，集中管理任务、笔记、文件、财务与 Agent 协作编排。
spec:
  fullDescription: |
    **udctl**（UnDercontrol）是人与 AI Agent 共用的私密工作空间：任务、对话和知识都存在这里，Agent 的定义、技能和跨机器的编排也在这里；一个人不用 Agent 照样能用；一份数据，Web、桌面、手机、命令行和聊天软件都是它的入口。

    **主要功能：**
    - **任务与看板**：一切皆任务（待办、文档、决策记录、草稿等），看板基于视图查询，一份数据多看板呈现。
    - **笔记与知识库**：任务关联长文本 Markdown 笔记，支持代码高亮、Mermaid 图表与双向链接。
    - **AI Agent 团队协同**：定义 Agent 角色，在任务评论或对话中直接指派工作，结果自动回写任务；支持定时任务调度。
    - **个人财务管理**：多币种账户、日常收支、预算管理与月度汇总。
    - **一切皆代码（Everything as Code）**：任务、笔记、Agent 和技能均可通过 `ud apply` 命令行与 Markdown/YAML 互转同步。
    - **私有部署与数据隐私**：数据完全存储在您的 Olares 私有云本地 SQLite 中，绝不上传第三方。
  upgradeDescription: |
    - udctl 从 0.183.0 升级到 0.188.0，覆盖 0.184.0 到 0.188.0 共六个上游版本。
    - 升级前请先备份应用数据卷中的 SQLite 数据库：迁移在容器启动时自动执行，且没有向下迁移脚本。请先升级服务端再升级各客户端，因为新版桌面端与 `ud` daemon 拒绝在旧版服务端上启动会话。
    - 0.187.0 会执行 00127 与 00128 两个迁移（为 queue_tasks 与 todolist_items 各加两个索引；00128 只是清理 00127 开发构建可能留下的改动）。0.185.0、0.186.0 与 0.188.0 没有新增迁移。
    - 0.184.1 有一个**会删除数据**的迁移：它会删掉每个看板上的 projectDir、tmuxSession、cliContext 与 implTool 设置，回滚也无法恢复。若有看板依赖过这些设置，请在升级后改为在看板所属项目或任务上设置目录，并在任务上设置 tmux 会话、CLI 上下文或 agent CLI。
    - 看板设置收敛为 Scope Tags、Project 与 Kanban Prompt（0.184.1）。会话的工作目录现在依次取自任务、看板所属项目、你的默认项目。
    - 沿途新增能力：会话侧边聊天与侧边栏会话列表（0.186.0）、重新设计的 Ask Alfred 面板（0.185.0）、首次使用与日常界面的一轮改进以及新增 AI 服务商时的一键厂商预设（0.187.0）、桌面端自绘标题栏并带检查更新按钮、照片查看器新增 Details 按钮（0.188.0）。
    - 工作区会话每次启动都会向服务端确认能否运行，不再依赖本地缓存的 CLI 目录（0.188.0）；直答助手统一改称 Alfred。本 chart 的配置项与环境变量未变。

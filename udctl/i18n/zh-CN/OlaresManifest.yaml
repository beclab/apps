metadata:
  title: udctl
  description: 人与 AI Agent 共用的私密工作空间，集中管理任务、笔记、文件、财务与 Agent 协作编排。
spec:
  fullDescription: |
    **udctl**（UnDercontrol）是人与 AI Agent 共用的私密工作空间：任务、对话和知识都存在这里，Agent 的定义、技能和跨机器的编排也在这里；一个人不用 Agent 照样能用；一份数据，Web、桌面、手机、命令行和聊天软件都是它的入口。

    **主要功能：**
    - **任务与看板**：一切皆任务（待办、文档、决策记录、草稿等），看板基于视图查询，一份数据多看板呈现。
    - **笔记与知识库**：任务关联长文本 Markdown 笔记，支持代码高亮、Mermaid 图表与双向链接。
    - **AI Agent 团队协同**：定义 Agent 角色，在任务评论或对话中直接指派工作，结果自动回写任务；支持定时任务调度。
    - **个人财务管理**：多币种账户、日常收支、预算管理与月度汇总。
    - **一切皆代码（Everything as Code）**：任务、笔记、Agent 和技能均可通过 `ud apply` 命令行与 Markdown/YAML 互转同步。
    - **私有部署与数据隐私**：数据完全存储在您的 Olares 私有云本地 SQLite 中，绝不上传第三方。
  upgradeDescription: |
    - udctl 从 0.188.0 升级到 0.195.0，覆盖 0.189.0 到 0.195.0 共七个上游版本。
    - 升级前请先备份应用数据卷中的 SQLite 数据库：迁移在容器启动时自动执行，没有向下迁移脚本，且这次跨版本会分多批执行。请先升级服务端再升级各客户端，因为新版桌面端与 `ud` 会调用旧版服务端没有的接口。
    - 首次启动会执行的迁移：00129、00130（0.189.0，desktop-commands 表加列）、00131（0.190.0，新增表）、00132 至 00135（0.191.0，收支记录改存账号 id；00133 为预留空迁移）、00136（0.192.0，注册与邀请相关表）、00137（0.193.0，为每个文件版本存版本号）、00138（0.194.1，插件相关表）。这些迁移只新增列或表；0.195.0 没有迁移也没有新设置项。
    - 0.194.0 上游未发布 Docker 镜像，自托管需从 0.193.0 直接跳到 0.194.1，再到 0.195.0。桌面端现在要求 macOS 13 或更高；服务端新增可选变量 UD_PLUGIN_DIR（本 chart 未设置）。
    - 沿途新增能力：`ud desktop pages` 与 `ud desktop open page`（0.189.0）、设置页改为单页滚动（0.190.0）、macOS 桌面端支持自更新（0.191.0）、注册控制与邀请奖励以及按账号过滤收支（0.192.0）、文件版本可查看/恢复/下载/删除（0.193.0）、可安装的 draw.io 与 Excalidraw 插件并升级到 Electron 45（0.194.1）、资源管理器支持文件夹管理与表格复制/下载（0.195.0）。
    - 设置页移除了 Finance 与 Dashboard 开关（0.193.0）；本 chart 的配置项与环境变量未变。

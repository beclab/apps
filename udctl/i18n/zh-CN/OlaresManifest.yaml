metadata:
  title: udctl
  description: 人与 AI Agent 共用的私密工作空间，集中管理任务、笔记、文件、财务与 Agent 协作编排。
spec:
  fullDescription: |
    **udctl**（UnDercontrol）是人与 AI Agent 共用的私密工作空间：任务、对话和知识都存在这里，Agent 的定义、技能和跨机器的编排也在这里；一个人不用 Agent 照样能用；一份数据，Web、桌面、手机、命令行和聊天软件都是它的入口。

    **主要功能：**
    - **任务与看板**：一切皆任务（待办、文档、决策记录、草稿等），看板基于视图查询，一份数据多看板呈现。
    - **笔记与知识库**：任务关联长文本 Markdown 笔记，支持代码高亮、Mermaid 图表与双向链接。
    - **AI Agent 团队协同**：定义 Agent 角色，在任务评论或对话中直接指派工作，结果自动回写任务；支持定时任务调度。
    - **个人财务管理**：多币种账户、日常收支、预算管理与月度汇总。
    - **一切皆代码（Everything as Code）**：任务、笔记、Agent 和技能均可通过 `ud apply` 命令行与 Markdown/YAML 互转同步。
    - **私有部署与数据隐私**：数据完全存储在您的 Olares 私有云本地 SQLite 中，绝不上传第三方。
  upgradeDescription: |
    - 添加 AIDockerCloud 到应用维护者列表。
    - udctl (UnDercontrol) 0.162.0 Olares 应用首发版本。
    - 采用一体化容器交付，包含 Web 前端、REST 后端、SQLite 存储及自动持久化 JWT 密钥管理。
    - udctl 从 0.162.0 升级到 0.183.0，跨越 22 个上游版本和一条很长的 SQLite 迁移链；仅 0.183.0 一个版本就要执行 00122 到 00125 这批迁移。迁移在容器启动时自动执行，因此升级前请先备份应用数据卷中的 SQLite 数据库，并先升级服务端再升级各客户端。
    - 0.177.1 专门修复了旧 SQLite 数据库的升级路径，因此应一次性升到 0.183.0，不要在中途某个版本停留。
    - 沿途新增能力：与 agent 的对话以及服务端运行的 agent（0.178-0.182）、可自行排列的单一侧边栏（0.181）、Slack 作为消息通道（此前已有 Telegram 与 Discord，0.183）、agent 定时提问（0.183）、任务/agent/技能/文件的统一回收站（0.164）、文件备注与批量打标签（0.166-0.167）、交易/预算/账户导出 CSV（0.163）、照片页（0.162）。
    - 需要注意的破坏性变更：0.174.0 把 CLI 的 time block 资源改名为 time slot；0.175.0 下线 agent triggers 并包含 CLI 破坏性变更。本 chart 的配置项未变。

metadata:
  title: udctl
  description: A private workspace for people and AI agents to manage tasks, notes, files, finances, and agent teams.
spec:
  fullDescription: |
    **udctl** (UnDercontrol) is a private workspace for people and AI agents: tasks, threads, and knowledge live here; so do each agent's definition, skills, and scheduling across your machines; and it works just as well for one person with no agents at all. One data source; web, desktop, mobile, CLI, and chat clients on top of it.

    **Key Features:**
    - **Tasks and Boards**: Everything is a task — a to-do, a document, a decision record, or a draft. Boards are saved queries over the same data, so one task can sit on several boards without copies.
    - **Notes & Knowledge**: Long-form markdown next to tasks, with code blocks, Mermaid diagrams, and bi-directional links.
    - **Agent Team**: Define agents, delegate work from comments or chat, and get results written back to tasks. Scheduled jobs run agents on a timer.
    - **Finance Tracking**: Multi-currency accounts, expenses, budgets, and monthly rollups.
    - **Everything as Code**: Tasks, notes, agents, and skills round-trip through CLI (`ud apply`) as markdown with YAML frontmatter.
    - **Self-Hosted & Private**: Your data stays on your personal Olares cloud with local SQLite storage.
  upgradeDescription: |
    - Upgrade udctl from 0.183.0 to 0.188.0, spanning the 0.184.0 to 0.188.0 upstream releases.
    - Back up the SQLite database in the app data volume before upgrading: migrations run on container startup and there are no down-migrations. Upgrade the server before any client, because a new desktop app or `ud` daemon refuses to start sessions against an older server.
    - 0.187.0 runs migrations 00127 and 00128 (two indexes on queue_tasks and todolist_items; 00128 only undoes what a development build of 00127 may have created). 0.185.0, 0.186.0 and 0.188.0 add no migration.
    - 0.184.1 runs one migration that deletes data: it removes the board-level projectDir, tmuxSession, cliContext and implTool settings from every board, and rolling back does not bring them back. If a board relied on them, set the folder on the board's project or on its tasks, and the tmux session, CLI context or agent CLI on its tasks after the upgrade.
    - Board settings are narrowed to Scope Tags, Project and Kanban Prompt (0.184.1). A session's folder now comes from the task, then the board's project, then your default project.
    - Functionality added along the way: side chat and a Conversations list in the sidebar (0.186.0), the redesigned Ask Alfred panel (0.185.0), a pass over the first-run and everyday web screens plus vendor presets when adding an AI provider (0.187.0), the desktop app drawing its own title bar with a Check for updates button, and a Details button in the photo viewer (0.188.0).
    - Workspace sessions are now checked with the server every time they start instead of relying on a local copy of the CLI catalog (0.188.0), and the direct-answer assistant is called Alfred everywhere. The chart's configuration keys and environment variables are unchanged.

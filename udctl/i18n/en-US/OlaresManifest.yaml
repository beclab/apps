metadata:
  title: udctl
  description: A private workspace for people and AI agents to manage tasks, notes, files, finances, and agent teams.
spec:
  fullDescription: |
    **udctl** (UnDercontrol) is a private workspace for people and AI agents: tasks, threads, and knowledge live here; so do each agent's definition, skills, and scheduling across your machines; and it works just as well for one person with no agents at all. One data source; web, desktop, mobile, CLI, and chat clients on top of it.

    **Key Features:**
    - **Tasks and Boards**: Everything is a task — a to-do, a document, a decision record, or a draft. Boards are saved queries over the same data, so one task can sit on several boards without copies.
    - **Notes & Knowledge**: Long-form markdown next to tasks, with code blocks, Mermaid diagrams, and bi-directional links.
    - **Agent Team**: Define agents, delegate work from comments or chat, and get results written back to tasks. Scheduled jobs run agents on a timer.
    - **Finance Tracking**: Multi-currency accounts, expenses, budgets, and monthly rollups.
    - **Everything as Code**: Tasks, notes, agents, and skills round-trip through CLI (`ud apply`) as markdown with YAML frontmatter.
    - **Self-Hosted & Private**: Your data stays on your personal Olares cloud with local SQLite storage.
  upgradeDescription: |
    - Add AIDockerCloud to maintainers list.
    - Initial release of udctl (UnDercontrol) 0.162.0 for Olares.
    - Bundled all-in-one container with web frontend, REST backend, SQLite storage, and automatic JWT secrets management.
    - Upgrade udctl from 0.162.0 to 0.183.0. This spans 22 upstream releases and a long chain of SQLite migrations; 0.183.0 alone runs migrations 00122 to 00125. The container applies them on startup, so back up the SQLite database in the app data volume before upgrading, and update the server before any client.
    - 0.177.1 fixes the upgrade path for old SQLite databases, so going straight to 0.183.0 is the supported route rather than stopping in between.
    - Functionality added along the way: conversations with agents and agents that run on the server (0.178-0.182), a single sidebar you arrange yourself (0.181), Slack as a messenger next to Telegram and Discord (0.183), scheduled agent questions (0.183), one recycle bin for tasks, agents, skills and files (0.164), notes on files and batch tagging (0.166-0.167), CSV export of transactions, budgets and accounts (0.163), a Photos page (0.162).
    - Breaking changes to be aware of: 0.174.0 renames the CLI time block resource to time slot; 0.175.0 retires agent triggers and carries CLI breaking changes. The chart's configuration keys are unchanged.

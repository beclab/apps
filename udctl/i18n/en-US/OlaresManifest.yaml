metadata:
  title: udctl
  description: A private workspace for people and AI agents to manage tasks, notes, files, finances, and agent teams.
spec:
  fullDescription: |
    **udctl** (UnDercontrol) is a private workspace for people and AI agents: tasks, threads, and knowledge live here; so do each agent's definition, skills, and scheduling across your machines; and it works just as well for one person with no agents at all. One data source; web, desktop, mobile, CLI, and chat clients on top of it.

    **Key Features:**
    - **Tasks and Boards**: Everything is a task — a to-do, a document, a decision record, or a draft. Boards are saved queries over the same data, so one task can sit on several boards without copies.
    - **Notes & Knowledge**: Long-form markdown next to tasks, with code blocks, Mermaid diagrams, and bi-directional links.
    - **Agent Team**: Define agents, delegate work from comments or chat, and get results written back to tasks. Scheduled jobs run agents on a timer.
    - **Finance Tracking**: Multi-currency accounts, expenses, budgets, and monthly rollups.
    - **Everything as Code**: Tasks, notes, agents, and skills round-trip through CLI (`ud apply`) as markdown with YAML frontmatter.
    - **Self-Hosted & Private**: Your data stays on your personal Olares cloud with local SQLite storage.
  upgradeDescription: |
    - Upgrade udctl from 0.188.0 to 0.195.0, spanning the 0.189.0 to 0.195.0 upstream releases.
    - Back up the SQLite database in the app data volume before upgrading: the migrations run on container startup, there are no down-migrations, and this jump applies them in several batches. Upgrade the server before any client, because the new desktop app and `ud` call endpoints an older server does not have.
    - Migrations run on first boot: 00129 and 00130 (0.189.0, desktop-commands columns), 00131 (0.190.0, new tables), 00132 to 00135 (0.191.0, account ids on expenses and income; 00133 is a reserved no-op), 00136 (0.192.0, sign-up and invite tables), 00137 (0.193.0, a stored version number per file version) and 00138 (0.194.1, plugin tables). All of them only add columns or tables; 0.195.0 adds no migration and no new setting.
    - 0.194.0 never published a Docker image, so self-hosted installs go from 0.193.0 straight to 0.194.1 and then 0.195.0. The desktop app now needs macOS 13 or later, and the server reads an optional UD_PLUGIN_DIR (the chart leaves it unset).
    - Functionality added along the way: `ud desktop pages` and `ud desktop open page` (0.189.0), Settings as one scrollable page (0.190.0), self-update for the macOS desktop app (0.191.0), sign-up controls with an invite bonus and per-account transaction filters (0.192.0), file versions with restore, download and delete (0.193.0), installable draw.io and Excalidraw plugins with Electron 45 (0.194.1), and folder management plus table copy/download in the Explorer (0.195.0).
    - The Finance and Dashboard switches are gone from Settings (0.193.0); the chart's configuration keys and environment variables are unchanged.

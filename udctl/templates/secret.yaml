{{- $secretName := "udctl-secret" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $jwtSecret := "" -}}
{{- if and $existing $existing.data (index $existing.data "JWT_SECRET") -}}
  {{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec -}}
{{- else if .Values.config.jwtSecret -}}
  {{- $jwtSecret = .Values.config.jwtSecret -}}
{{- else -}}
  {{- $jwtSecret = randAlphaNum 48 -}}
{{- end -}}
{{- $encKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "UD_ENCRYPTION_KEY") -}}
  {{- $encKey = index $existing.data "UD_ENCRYPTION_KEY" | b64dec -}}
{{- else if .Values.config.encryptionKey -}}
  {{- $encKey = .Values.config.encryptionKey -}}
{{- else -}}
  {{- $encKey = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: udctl
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ $jwtSecret | quote }}
  UD_ENCRYPTION_KEY: {{ $encKey | quote }}

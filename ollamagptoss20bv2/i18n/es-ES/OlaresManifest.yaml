metadata:
  title: GPT-OSS 20B (Ollama)
  description: Modelos de pesos abiertos de OpenAI diseñados para razonamiento potente, tareas agénticas y casos de uso versátiles para desarrolladores

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.

    **RESUMEN DEL MODELO**
    Bienvenido a la serie gpt-oss, los modelos de pesos abiertos de OpenAI diseñados para razonamiento potente, tareas agénticas y casos de uso versátiles para desarrolladores.

    **Modelos:**
    Publicamos dos variantes de estos modelos abiertos:
    gpt-oss-120b
    - para producción, uso general y alto razonamiento que cabe en una sola GPU de 80GB (como NVIDIA H100 o AMD MI300X) (117B parámetros con 5.1B activos)

    gpt-oss-20b
    - para menor latencia y casos de uso locales o especializados (21B parámetros con 3.6B activos)

    Ambos modelos se entrenaron con nuestro formato de respuesta harmony y solo deben usarse con el formato harmony; de lo contrario no funcionarán correctamente.

    **Aspectos destacados**
    - Licencia permisiva Apache 2.0: construye libremente sin restricciones copyleft ni riesgo de patentes — ideal para experimentación, personalización y despliegue comercial.
    - Esfuerzo de razonamiento configurable: ajusta fácilmente el esfuerzo (bajo, medio, alto) según tu caso de uso y necesidades de latencia.
    - Cadena de pensamiento completa: acceso completo al proceso de razonamiento del modelo, facilitando la depuración y aumentando la confianza en las salidas. No está pensado para mostrarse a usuarios finales.
    - Ajustable (fine-tunable): personaliza completamente los modelos mediante fine-tuning de parámetros.
    - Capacidades agénticas: usa las capacidades nativas para function calling, navegación web, ejecución de código Python y Structured Outputs.
    - Cuantización MXFP4: los modelos se post-entrenaron con cuantización MXFP4 de los pesos MoE, permitiendo que gpt-oss-120b se ejecute en una sola GPU de 80GB (como NVIDIA H100 o AMD MI300X) y gpt-oss-20b en 16GB de memoria. Todas las evaluaciones usaron la misma cuantización MXFP4.
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.

    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

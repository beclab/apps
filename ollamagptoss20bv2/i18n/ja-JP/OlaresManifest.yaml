metadata:
  title: GPT-OSS 20B (Ollama)
  description: 強力な推論、エージェントタスク、多彩な開発者ユースケース向けに設計された OpenAI のオープンウェイトモデル

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ経由で利用できます。

    **モデル概要**
    gpt-oss シリーズへようこそ。強力な推論、エージェントタスク、多彩な開発者ユースケース向けに設計された OpenAI のオープンウェイトモデルです。

    **モデル：**
    これらオープンモデルの 2 つのバリエーションを公開しています：
    gpt-oss-120b
    - 本番・汎用・高推論向けで、単一の 80GB GPU（NVIDIA H100 や AMD MI300X など）に収まる（117B パラメータ、うちアクティブ 5.1B）

    gpt-oss-20b
    - 低レイテンシ、ローカルまたは特化ユースケース向け（21B パラメータ、うちアクティブ 3.6B）

    両モデルは harmony レスポンス形式で学習されており、正しく動作させるには harmony 形式でのみ使用してください。

    **主な特長**
    - 寛容な Apache 2.0 ライセンス：コピーレフト制限や特許リスクなしで自由に構築 — 実験、カスタマイズ、商用展開に最適。
    - 設定可能な推論努力：ユースケースとレイテンシ要件に応じて推論努力（低・中・高）を簡単に調整。
    - 完全な Chain-of-Thought：モデルの推論過程へ完全アクセスし、デバッグを容易にし出力への信頼を高める。エンドユーザーへの表示は想定していません。
    - ファインチューニング可能：パラメータ fine-tuning で特定ユースケースに完全カスタマイズ。
    - エージェント能力：関数呼び出し、Web ブラウジング、Python コード実行、Structured Outputs のネイティブ機能を利用。
    - MXFP4 量子化：MoE 重みの MXFP4 量子化でポストトレーニングされ、gpt-oss-120b は単一 80GB GPU（NVIDIA H100 や AMD MI300X など）で、gpt-oss-20b は 16GB メモリ内で動作。すべての評価も同一の MXFP4 量子化で実施。
  upgradeDescription: |
    Ollama ランタイム：ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API：beclab/harveyff-olares-ollama:v0.1.21。

    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 へアップグレード。

metadata:
  title: GPT-OSS 20B (Ollama)
  description: Modèles open-weight d'OpenAI conçus pour un raisonnement puissant, des tâches agentiques et des cas d'usage développeur polyvalents

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une app partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.

    **APERÇU DU MODÈLE**
    Bienvenue dans la série gpt-oss, les modèles open-weight d'OpenAI conçus pour un raisonnement puissant, des tâches agentiques et des cas d'usage développeur polyvalents.

    **Modèles :**
    Nous publions deux variantes de ces modèles ouverts :
    gpt-oss-120b
    - pour la production, l'usage général et le raisonnement élevé qui tiennent dans un seul GPU 80 Go (comme NVIDIA H100 ou AMD MI300X) (117B paramètres dont 5,1B actifs)

    gpt-oss-20b
    - pour une latence plus faible et des cas d'usage locaux ou spécialisés (21B paramètres dont 3,6B actifs)

    Les deux modèles ont été entraînés sur notre format de réponse harmony et ne doivent être utilisés qu'avec le format harmony, sinon ils ne fonctionneront pas correctement.

    **Points forts**
    - Licence permissive Apache 2.0 : construisez librement sans restrictions copyleft ni risque de brevet — idéal pour l'expérimentation, la personnalisation et le déploiement commercial.
    - Effort de raisonnement configurable : ajustez facilement l'effort (faible, moyen, élevé) selon votre cas d'usage et vos besoins de latence.
    - Chaîne de pensée complète : accès complet au processus de raisonnement du modèle, facilitant le débogage et renforçant la confiance dans les sorties. Non destiné à être montré aux utilisateurs finaux.
    - Fine-tunable : personnalisez pleinement les modèles via le fine-tuning des paramètres.
    - Capacités agentiques : utilisez les capacités natives pour le function calling, la navigation web, l'exécution de code Python et les Structured Outputs.
    - Quantification MXFP4 : les modèles ont été post-entraînés avec une quantification MXFP4 des poids MoE, permettant à gpt-oss-120b de tourner sur un seul GPU 80 Go (comme NVIDIA H100 ou AMD MI300X) et à gpt-oss-20b dans 16 Go de mémoire. Toutes les évaluations ont utilisé la même quantification MXFP4.
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé dans Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.

    Mise à niveau de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

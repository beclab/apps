olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  anythingllm: 1
metadata:
  name: anythingllm
  description: The all-in-one AI app you were looking for
  icon: https://app.cdn.olares.com/appstore/anythingllm/icon.png
  appid: anythingllm
  version: "1.0.23"
  title: AnythingLLM
  categories:
  - Utilities_v112
  - agents
  tags:
  - framework
  - workbench

permission:
  appData: true
  appCache: true
  userData:
    - Home
spec:
  runAsUser: true
  versionName: "1.18.0"
  featuredImage: https://app.cdn.olares.com/appstore/anythingllm/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/anythingllm/1.webp
    - https://app.cdn.olares.com/appstore/anythingllm/2.webp
    - https://app.cdn.olares.com/appstore/anythingllm/3.webp
    - https://app.cdn.olares.com/appstore/anythingllm/4.webp
    - https://app.cdn.olares.com/appstore/anythingllm/5.webp
  fullDescription: |
    AnythingLLM: The all-in-one AI app you were looking for.
    Chat with your docs, use AI Agents, hyper-configurable, multi-user, & no frustrating set up required.

    AnythingLLM is a full-stack application that enables you to turn any document, resource, or piece of content into context that any LLM can use as references during chatting. This application allows you to pick and choose which LLM or Vector Database you want to use as well as supporting multi-user management and permissions.

    Cool features of AnythingLLM
    - Custom AI Agents
    - No-code AI Agent builder
    - Multi-modal support (both closed and open-source LLMs!)
    - Multi-user instance support and permissioning Docker version only
    - Agents inside your workspace (browse the web, etc)
    - Custom Embeddable Chat widget for your website Docker version only
    - Multiple document type support (PDF, TXT, DOCX, etc)
    - Simple chat UI with Drag-n-Drop funcitonality and clear citations.
    - 100% Cloud deployment ready.
    - Works with all popular closed and open-source LLM providers.
    - Built-in cost & time-saving measures for managing very large documents compared to any other chat UI.
    - Full Developer API for custom integrations!
  upgradeDescription: |
    Highlights across this upgrade:
    - Workspace settings save automatically; supported models gain reasoning-effort controls.
    - Improves document selection and embedding error messages, keeps chat attachments isolated by conversation, and improves agent tool compatibility.

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.17.0

    Upgrade to AnythingLLM 1.18.0.
    Before upgrading an existing installation, export /app/server/.env from the OLD running container to /app/server/storage/.env. Older charts did not persist this file. Do this before replacing the old pod; the candidate refuses an existing database without its exported configuration.
    - Persist the application configuration, accounts, workspaces and storage.
    - Verify a SQLite and storage backup before upstream database migrations.
    - Run as UID 1000 and initialize only the storage root and comkey directory.
    - Use /api/ping for health checks.
    Release notes: https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.18.0
  developer: Mintplex Labs
  website: https://anythingllm.com/
  sourceCode: https://github.com/Mintplex-Labs/anything-llm
  submitter: Olares
  doc: https://docs.anythingllm.com/
  license:
    - text: MIT
      url: https://github.com/Mintplex-Labs/anything-llm?tab=MIT-1-ov-file
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  requiredCpu: 100m
  limitedCpu: 1000m
  supportArch:
    - amd64
    - arm64
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
entrances:
  - name: anythingllm
    port: 3001
    host: anythingllm
    title: AnythingLLM
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/anythingllm/icon.png
    openMethod: window

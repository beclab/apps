metadata:
  title: AnythingLLM
  description: 探していたオールインワン AI アプリ
spec:
  fullDescription: |
    AnythingLLM: 探していたオールインワン AI アプリ。
    ドキュメントとチャット、AI Agents の利用、高度な設定、マルチユーザー対応、面倒なセットアップ不要。
    
    AnythingLLM は、任意のドキュメント・リソース・コンテンツを、どの LLM でもチャット中の参照として使えるコンテキストに変換するフルスタックアプリケーションです。使用する LLM や Vector Database を選べ、マルチユーザー管理と権限にも対応します。
    
    AnythingLLM の便利な機能:
    - Custom AI Agents
    - ノーコード AI Agent ビルダー
    - マルチモーダル対応（クローズド／オープンソース LLM 両方）
    - マルチユーザーインスタンスと権限（Docker 版のみ）
    - ワークスペース内 Agents（Web 閲覧など）
    - Web サイト向け埋め込み可能カスタムチャットウィジェット（Docker 版のみ）
    - 複数ドキュメント形式対応（PDF、TXT、DOCX など）
    - ドラッグ＆ドロップと明確な引用付きのシンプルなチャット UI
    - 100% クラウドデプロイ対応
    - 主要なクローズド／オープンソース LLM プロバイダーすべてに対応
    - 他のチャット UI と比べ、非常に大きなドキュメント管理のコスト・時間節約機能を内蔵
    - カスタム連携向けフル Developer API！
  upgradeDescription: |
    今回の複数バージョンにわたる更新の主な変更：
    - ワークスペース設定の自動保存と、対応モデルの推論強度の調整に対応。
    - 文書選択とインデックス作成失敗時の表示を改善し、添付ファイルを会話ごとに分離。エージェントのツール呼び出しの互換性も改善。

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.17.0

    AnythingLLM 1.18.0 に更新。

    更新前に、稼働中の旧コンテナから /app/server/.env を /app/server/storage/.env にコピーしてください。旧 Chart はこのファイルを永続化していません。既存 DB に設定のエクスポートがない場合、初期化を停止します。

    設定、アカウント、ワークスペース、文書を永続化し、DB 移行前にバックアップを検証。UID 1000 で実行し、/api/ping で正常性を確認。

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.18.0

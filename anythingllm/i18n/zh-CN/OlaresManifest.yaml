metadata:
  title: AnythingLLM
  description: 您一直在寻找的全方位AI应用程序。
spec:
  fullDescription: |
    AnythingLLM： 您一直在寻找的全方位AI应用程序。
    与您的文档聊天，使用AI代理，高度可配置，多用户，无需繁琐的设置。

    AnythingLLM 是一个全栈应用程序，可以将任何文档、资源（如网址链接、音频、视频）或内容片段转换为上下文，以便任何大语言模型（LLM）在聊天期间作为参考使用。此应用程序允许您选择使用哪个LLM或向量数据库，同时支持多用户管理并设置不同权限。

    AnythingLLM的一些酷炫特性
    - 多用户实例支持和权限管理
    - 工作区内的智能体Agent（浏览网页、运行代码等）
    - 为您的网站定制的可嵌入聊天窗口
    - 支持多种文档类型（PDF、TXT、DOCX等）
    - 通过简单的用户界面管理向量数据库中的文档
    - 两种对话模式：聊天和查询。聊天模式保留先前的对话记录。查询模式则是针对您的文档做简单问答
    - 聊天中会提供所引用的相应文档内容
    - 100%云部署就绪。
    - 部署你自己的LLM模型
    - 管理超大文档时高效、低耗。只需要一次就可以嵌入（Embedding）一个庞大的文档或文字记录。比其他文档聊天机器人解决方案节省90%的成本。
    - 全套的开发人员API，用于自定义集成！
  upgradeDescription: |
    本次跨版本升级亮点：
    - 工作区设置支持自动保存，并可调节受支持模型的推理强度。
    - 改进文档选择与索引失败提示，按会话隔离聊天附件，并改善智能体工具调用兼容性。

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.17.0

    升级至 AnythingLLM 1.18.0。

    替换旧容器前自动导出并校验运行中实例的原配置，无需手工导出。无法取得原配置时停止升级，避免覆盖设置；已中断且缺少配置的升级需先恢复原配置。

    持久保存配置、账号、工作区和文档；上游数据库迁移前校验数据库及文件备份。以 UID 1000 运行，使用 /api/ping 健康检查。

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.18.0

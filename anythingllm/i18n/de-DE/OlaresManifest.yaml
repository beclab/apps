metadata:
  title: AnythingLLM
  description: Die All-in-one-KI-App, nach der Sie gesucht haben
spec:
  fullDescription: |
    AnythingLLM: Die All-in-one-KI-App, nach der Sie gesucht haben.
    Chatten Sie mit Ihren Docs, nutzen Sie AI Agents, hochgradig konfigurierbar, Multi-User – ohne frustrierendes Setup.
    
    AnythingLLM ist eine Full-Stack-Anwendung, mit der Sie jedes Dokument, jede Ressource oder jeden Inhalt in Kontext verwandeln, den jedes LLM beim Chatten als Referenz nutzen kann. Sie wählen LLM oder Vector Database nach Wunsch und erhalten Multi-User-Verwaltung sowie Berechtigungen.
    
    Coole Funktionen von AnythingLLM:
    - Custom AI Agents
    - No-code AI Agent Builder
    - Multimodale Unterstützung (geschlossene und Open-Source-LLMs!)
    - Multi-User-Instanzen und Berechtigungen (nur Docker-Version)
    - Agents in Ihrem Workspace (Web browsen usw.)
    - Einbettbares Custom-Chat-Widget für Ihre Website (nur Docker-Version)
    - Unterstützung mehrerer Dokumenttypen (PDF, TXT, DOCX usw.)
    - Einfache Chat-UI mit Drag-and-Drop und klaren Zitaten
    - 100 % Cloud-Deployment-fähig
    - Funktioniert mit allen gängigen geschlossenen und Open-Source-LLM-Anbietern
    - Eingebaute Kosten- und Zeitsparmaßnahmen für sehr große Dokumente im Vergleich zu anderen Chat-UIs
    - Vollständige Developer API für individuelle Integrationen!
  upgradeDescription: |
    Highlights dieses versionsübergreifenden Updates:
    - Workspace-Einstellungen werden automatisch gespeichert; unterstützte Modelle bieten eine Steuerung des Denkaufwands.
    - Verbessert die Dokumentauswahl und Fehlermeldungen beim Einbetten, trennt Chat-Anhänge nach Unterhaltung und verbessert die Kompatibilität von Agentenwerkzeugen.

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.17.0

    Aktualisierung auf AnythingLLM 1.18.0.

    Vor dem Upgrade /app/server/.env aus dem ALTEN laufenden Container nach /app/server/storage/.env kopieren. Ältere Charts speicherten diese Datei nicht dauerhaft. Bei vorhandener Datenbank ohne exportierte Konfiguration wird die Initialisierung angehalten.

    Konfiguration, Konten, Arbeitsbereiche und Dokumente dauerhaft speichern; Datenbank- und Dateisicherungen vor Migrationen prüfen. Ausführung als UID 1000, Zustandsprüfung über /api/ping.

    https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.18.0

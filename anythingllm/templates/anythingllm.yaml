apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: anythingllm
spec:
  replicas: {{ .Values.workloads.anythingllm.replicaCount }}
  selector:
    matchLabels:
      app: anythingllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: anythingllm
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          imagePullPolicy: Always
          command:
            - sh
            - "-c"
            - |
              set -eu
              if [ -f /app/server/storage/anythingllm.db ] && [ ! -f /app/server/storage/.env ]; then
                echo "Original configuration is unavailable. Refusing to migrate the existing database. The pre-upgrade hook exports it from a running legacy instance; for an already interrupted upgrade, recover the original .env from backup before resuming. Do not create an empty replacement file."
                exit 1
              fi
              mkdir -p /app/server/storage/comkey
              [ -f /app/server/storage/.env ] || touch /app/server/storage/.env
              chown 1000:1000 /app/server/storage /app/server/storage/comkey
              chmod 770 /app/server/storage /app/server/storage/comkey
              chown 1000:1000 /app/server/storage/.env
              chmod 600 /app/server/storage/.env
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: anythingllm-storage
              mountPath: /app/server/storage
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          securityContext:
            runAsUser: 0
        - name: backup-before-migration
          image: docker.io/mintplexlabs/anythingllm:1.18.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          command: [python3, /upgrade/backup.py]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: anythingllm-storage, mountPath: /app/server/storage}
            - {name: upgrade-backup, mountPath: /upgrade, readOnly: true}
      containers:
        - name: anythingllm
          image: "docker.io/mintplexlabs/anythingllm:1.18.0"
          command:
            - /bin/bash
            - -ec
            - |
              test -f /app/server/storage/.env
              rm -f /app/server/.env
              ln -s /app/server/storage/.env /app/server/.env
              exec /bin/bash /usr/local/bin/docker-entrypoint.sh
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: DISPLAY
              value: ":0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anythingllm
                  key: app-password
          envFrom:
            - configMapRef:
                name: anythingllm-config
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 60
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: 3001
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - mountPath: /app/server/storage
              name: anythingllm-storage
      volumes:
        - name: upgrade-backup
          configMap:
            name: anythingllm-upgrade
        - name: anythingllm-storage
          hostPath:
            {{- if .Values.sysVersion }}
              {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: "{{ .Values.userspace.appData }}"
              {{- else }}
            path: "{{ .Values.userspace.appData }}/{{ .Release.Name }}"
              {{- end }}
            {{- else }}
            path: "{{ .Values.userspace.appData }}/{{ .Release.Name }}"
            {{- end }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: anythingllm
spec:
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app: anythingllm

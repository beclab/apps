metadata:
  title: 'Locius'
  description: '你的私人 AI 智能体'
spec:
  fullDescription: |
    Locius 是运行在你的 Olares 上的私人 AI 智能体（local-first / 默认私密 / 7×24 在线）。它不只是聊天：会把你的需求拆成多步计划，在邮件、文档、团队聊天和网页之间把事情做完——而且在做任何重要的事之前都会先问你。名字来自拉丁语 genius loci「守护一方的灵」。

    **能做什么**

    - **对话 → 计划 → 执行**：说出你的需求，Locius 自动规划并逐步执行，每一次工具调用都看得见。
    - **Gmail**：支持多个邮箱的搜索、阅读、草稿、回复与发送；营销邮件一键退订；验证码和重置链接对模型自动屏蔽。
    - **Notion 与 Slack**：查资料、把报告写进 Notion、更新任务表；读取频道和讨论串、发送消息。
    - **浏览器**：独立的 Chromium，受限 API（禁止执行任意 JavaScript），实时画面，登录/验证码可由你接管。
    - **MCP 连接器**：接入任意 MCP（Model Context Protocol）服务器，工具定义锁定，防止被悄悄篡改。
    - **自动化**：场景目标（持续推进直到达成）、事件触发（新邮件 / Slack 新消息 / Notion 变化）、定时任务。
    - **Telegram 遥控**：在手机上布置任务、看进度、一键审批。
    - **记忆与技能**：记住你让它记住的事，并沉淀可复用的技能。

    **安全设计**

    - **Sentinel 哨兵**：独立的权限服务，对每个操作做 ALLOW / DENY / ASK 决策；发送、发布、付款、删除一律等你批准。
    - **凭据保险箱**：应用专用密码和令牌加密保存在 Sentinel 中，Agent 和模型永远看不到。
    - **防提示注入**：邮件、网页和工具结果一律视为不可信内容；一旦发现可疑内容，所有写操作都升级为人工审批。
    - **审计记录**：所有模型调用、工具调用、权限决策和审批都写入只追加的哈希链日志。

    默认使用 Olares 本机提供的模型，也可以换成任何 OpenAI 兼容接口。支持中文与 English 界面。
  upgradeDescription: |
    0.2.2：为上架 Olares 应用商店做准备——正式图标和截图，源代码公开（MIT 许可证），去除个人化的默认设置。
    0.2.1：新增英文界面（右上角可切换 中文 / EN）；应用商店信息中英双语；默认模型不可用时自动选择可用的模型。
    0.2.0：新增 MCP 连接器框架；Notion、Slack 连接器；事件触发器；场景目标；「自动化」页面。
    0.1.1：Telegram 双向遥控与审批；多个 Gmail 邮箱；一键退订；手机端界面；浏览器接管支持 Google 登录弹窗。
    0.1.0：首个版本。

metadata:
  title: 'Locius'
  description: '你的私人 AI 智能体'
spec:
  fullDescription: |
    Locius 是运行在你的 Olares 上的私人 AI 智能体（local-first / 默认私密 / 7×24 在线）。它不只是聊天：会把你的需求拆成多步计划，在邮件、文档、团队聊天和网页之间把事情做完——而且在做任何重要的事之前都会先问你。名字来自拉丁语 genius loci「守护一方的灵」。

    **能做什么**

    - **对话 → 计划 → 执行**：说出你的需求，Locius 自动规划并逐步执行，每一次工具调用都看得见。
    - **Gmail**：支持多个邮箱的搜索、阅读、草稿、回复与发送；营销邮件一键退订；验证码和重置链接对模型自动屏蔽。
    - **Notion 与 Slack**：查资料、把报告写进 Notion、更新任务表；读取频道和讨论串、发送消息。
    - **浏览器**：独立的 Chromium，受限 API（禁止执行任意 JavaScript），实时画面，登录/验证码可由你接管。
    - **MCP 连接器**：接入任意 MCP（Model Context Protocol）服务器，工具定义锁定，防止被悄悄篡改。
    - **自动化**：场景目标（持续推进直到达成）、事件触发（新邮件 / Slack 新消息 / Notion 变化）、定时任务。
    - **Telegram 遥控**：在手机上布置任务、看进度、一键审批。
    - **记忆与技能**：记住你让它记住的事，并沉淀可复用的技能。

    **安全设计**

    - **Sentinel 哨兵**：独立的权限服务，对每个操作做 ALLOW / DENY / ASK 决策；发送、发布、付款、删除一律等你批准。
    - **凭据保险箱**：应用专用密码和令牌加密保存在 Sentinel 中，Agent 和模型永远看不到。
    - **防提示注入**：邮件、网页和工具结果一律视为不可信内容；一旦发现可疑内容，所有写操作都升级为人工审批。
    - **审计记录**：所有模型调用、工具调用、权限决策和审批都写入只追加的哈希链日志。

    默认使用 Olares 本机提供的模型，也可以换成任何 OpenAI 兼容接口。支持中文与 English 界面。
  upgradeDescription: |
    0.2.10：在 Amazon 这类大网站上也能网购了。Agent 现在能“看”网页：browser_look 会截图并给每个可点击元素标上编号，交给视觉模型识别（默认用本机模型，也可在「设置 → 视觉模型」单独指定）；browser_find 可以在长页面里按文字找到商品和按钮；滚动后能看到页面的下一部分。「加入购物车」不再需要审批（购买、结账仍需你批准）。新增网购技能。
    0.2.9：英文模式全程生效——语言设置优先于记忆里的语言偏好；如果模型仍用中文回答，Locius 会让它改写成英文。
    0.2.8：语言改为在「设置 → Agent → 语言」里选择（顶部的语言按钮已移除），并且决定 Agent 写的所有内容：选 English 时，思考过程、任务计划、回答、通知和定时任务汇报全部用英文，模型看到的指令和工具说明也只有英文（修复英文系统下仍用中文回答的问题，beclab/Olares#4201）。第一次使用时自动跟随浏览器语言。订餐厅会给每家候选餐厅单独派一个子 Agent 核实空位，不再只查第一家。
    0.2.7：新增 Google 日历连接——查看日程、找空闲时间、新建和改期（邀请他人、修改、删除都要你批准）；用你自己的 Google Cloud 授权，令牌只存在本机保险箱。新增订餐厅技能：用 Google 地图找餐厅，通过 Reserve with Google、Chope、TableCheck 或餐厅官网核实真实空位，你批准后预订，还能把订位加进日历。客服技能扩展到退货退款、取消订阅、账单问题，全部通过网页在线客服沟通。可以生成和读取 Excel（.xlsx）。遇到拦截自动浏览器的网站，不再反复重试，而是换其他来源。长时间的调研任务会给最后的交付留出步数，PDF、邮件不会再因为步数用完而做不出来。
    0.2.6：Locius 可以直接把文件发给你——它生成的报告、PDF、图片、表格会出现在对话里，点「下载」即可；如果你是在 Telegram 里让它做的，文件会直接发到 Telegram。新增本机生成 PDF（支持中文、表格、图片、页码），文件在 Olares 本机断网打印，不再上传到在线转换网站。下载来的网页文件不会在应用里直接打开，更安全。英文模式下，任务计划、回答和提醒都会用英文。对话列表可以拖动边缘调宽，长标题会显示两行。
    0.2.5：对话页面不会再一直停在「规划中」——实时连接断开（电脑休眠、网络切换、登录会话刷新）后会自动重连并补上错过的进度，结果和审批请求不用重新打开对话就能显示。
    0.2.4：Agent 不会再反复执行同一个操作把步数耗光（完全相同的重复调用会被拦截）；RSS/Atom 订阅源会显示成清晰的标题列表；定时任务如果步数用完或出错，会标记为失败并通知你（应用内 + Telegram）。
    0.2.3：定时任务不再被卡住——上一次运行一直在等审批时，到了下一次运行时间会自动取消旧的并重新运行（同时在应用和 Telegram 里提醒你）；定时任务卡片会显示「被跳过」和上次运行状态；审批面板新增「最近已处理」记录。Telegram「检测 Chat ID」在机器人已连接时也能正常识别。
    0.2.2：为上架 Olares 应用商店做准备——正式图标和截图，源代码公开（MIT 许可证），去除个人化的默认设置。
    0.2.1：新增英文界面（右上角可切换 中文 / EN）；应用商店信息中英双语；默认模型不可用时自动选择可用的模型。
    0.2.0：新增 MCP 连接器框架；Notion、Slack 连接器；事件触发器；场景目标；「自动化」页面。
    0.1.1：Telegram 双向遥控与审批；多个 Gmail 邮箱；一键退订；手机端界面；浏览器接管支持 Google 登录弹窗。
    0.1.0：首个版本。

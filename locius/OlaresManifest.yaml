    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-5-audit.webp
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-6-mobile.webp
  fullDescription: |
    Locius is a private AI agent that lives on your Olares — local-first, private by default and always on. It doesn't just chat: it plans multi-step tasks and carries them out across your email, documents, team chat and the web, and it asks before doing anything that matters.

    **What it does**

    - **Chat → plan → act** – describe what you need; Locius makes a plan and works through it step by step, showing every tool call.
    - **Gmail** – search, read, draft, reply and send across several mailboxes; one-click unsubscribe from newsletters. Sign-in codes and reset links are hidden from the model.
    - **Notion & Slack** – look things up, write reports into Notion, update task boards, read channels and threads, post messages.
    - **Web browser** – its own Chromium with a restricted API (no arbitrary JavaScript), live view, and human takeover for logins and CAPTCHAs.
    - **MCP connectors** – plug in any MCP server; tool definitions are pinned so a server can't quietly change them.
    - **Automations** – goals it keeps pushing for days until they're achieved, event triggers (new email, Slack message, Notion change) and schedules.
    - **Telegram remote control** – give tasks, follow progress and approve actions with one tap from your phone.
    - **Memory & skills** – remembers what you ask it to remember, and learns reusable skills.

    **Safe by design**

    - **Sentinel** – an independent guard service decides ALLOW / DENY / ASK for every action. Sending, posting, paying and deleting always wait for your approval.
    - **Credentials in a vault** – app passwords and tokens are encrypted in Sentinel; the agent and the model never see them.
    - **Prompt-injection defences** – emails, web pages and tool results are treated as untrusted; suspicious content escalates every write to human approval.
    - **Audit trail** – every model call, tool call, decision and approval goes into an append-only, hash-chained log.

    Runs on the local models served by your Olares by default — any OpenAI-compatible endpoint works. English and 中文 interface.
  upgradeDescription: |
    0.2.10: Online shopping works on big sites like Amazon. The agent can now see the page: browser_look screenshots the screen with every clickable element labelled and asks a vision model (your local model by default, or set one in Settings → Vision model), browser_find locates products and buttons anywhere on a long page, and scrolling shows the next part of the page. "Add to Cart" no longer asks for approval (buying and checkout still do). New online-shopping skill.
    0.2.9: English mode is enforced end to end: the language setting now overrides language preferences stored in memory, and if the model still answers in Chinese, Locius has it rewrite the answer in English.
    0.2.8: Language is now a setting (Settings → Agent → Language) instead of a button in the top bar, and it decides everything the agent writes: with English, its reasoning, task plans, answers, notifications and scheduled reports are all in English, and the model only sees English instructions and tool descriptions (fixes replies in Chinese on English systems, beclab/Olares#4201). On first use the language follows your browser. Restaurant booking now checks every shortlisted restaurant with its own sub-agent, so all of them get verified times.
    0.2.7: Google Calendar connector — see your events, find free time, and create or reschedule events (inviting others, changes and deletions ask for approval); you connect it with your own Google Cloud client and the token stays in the vault. New restaurant-booking skill: finds places on Google Maps, checks real availability through Reserve with Google, Chope, TableCheck or the restaurant's own page, books after your approval and can add the booking to your calendar. Customer-service skill now covers returns and refunds, cancelling subscriptions and billing questions over web chat. Excel export (.xlsx) and Excel reading. When a site blocks automated browsers, Locius stops retrying it and switches to another source. Long research tasks keep their last steps for the deliverable, so the PDF or email is still produced.
    0.2.6: Locius can send you files: reports, PDFs, images and spreadsheets it makes show up in the chat with a Download button (and arrive as files on Telegram when you asked there). New local PDF export (Chinese, tables, images, page numbers) — documents are printed on your Olares with no network, never uploaded to online converters. Downloaded web pages are never opened inside the app. In English mode, plans, answers and notices are written in English. The chat list can be widened by dragging its edge, and long chat titles wrap to two lines.
    0.2.5: The chat page no longer gets stuck on "Planning": if the live connection drops (sleep, network change, session refresh) it reconnects and catches up by itself, so results and approval requests show up without reopening the chat.
    0.2.4: Agents no longer burn their whole step budget repeating one call (identical repeats are blocked), RSS/Atom feeds open as a clean headline list, and a scheduled run that runs out of steps or errors is marked failed and you are notified (app + Telegram).
    0.2.3: Automations no longer get stuck: a scheduled run still waiting for your approval is cancelled when the next run is due (with a Telegram/app notice), skipped runs are shown on the schedule card, and the approvals drawer lists recent decisions. "Detect chat ID" for Telegram now works while the bot is connected.
    0.2.2: Ready for Olares Market — official icon and screenshots, public source code (MIT), no personal defaults.
    0.2.1: English interface (switch 中文 / EN in the top bar), localized store listing; if the default model isn't served, Locius picks an available one automatically.
    0.2.0: MCP connector framework; Notion and Slack connectors; event triggers; goals; new Automations page.
    0.1.1: Telegram remote control and approvals; multiple Gmail mailboxes; one-click unsubscribe; mobile layout; browser takeover for Google sign-in pop-ups.
    0.1.0: First release.

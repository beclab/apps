metadata:
  title: Qwen3.6 27B UD-XL (Ollama)
  description: Modelos multimodales de código abierto que ofrecen utilidad y rendimiento excepcionales
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de la app de referencia.
    El tráfico de usuario pasa por el proxy hacia Ollama.
    
    **MODELO**
    Usa cuantización dinámica Unsloth de `unsloth/Qwen3.6-27B-GGUF` (`Qwen3.6-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La cuantización UD de precisión mixta preserva calidad cercana a Q5_K_M manteniendo el rendimiento de decodificación cercano al Q4_K_M estándar, con visión completa (mmproj) retenida.
    La plantilla de chat usa las directivas RENDERER/PARSER integradas `qwen3.5` de Ollama, igualando la calidad de salida del paquete oficial `qwen3.6`.
    
    Qwen3.6 representa un salto significativo, integrando avances en aprendizaje multimodal, eficiencia arquitectónica, escala de reinforcement learning y accesibilidad global para empoderar a desarrolladores y empresas con capacidad y eficiencia sin precedentes.
    
    Qwen3.6 incluye las siguientes mejoras:
    
    Unified Vision-Language Foundation: El entrenamiento early fusion en tokens multimodales logra paridad intergeneracional con Qwen3 y supera a los modelos Qwen3-VL en benchmarks de razonamiento, coding, agentes y comprensión visual.
    
    Efficient Hybrid Architecture: Gated Delta Networks combinadas con Mixture-of-Experts dispersos ofrecen inferencia de alto rendimiento con latencia y sobrecoste mínimos.
    
    Scalable RL Generalization: Reinforcement learning escalado en entornos de millones de agentes con distribuciones de tareas progresivamente complejas para una adaptabilidad robusta en el mundo real.
    
    Global Linguistic Coverage: Soporte ampliado a 201 idiomas y dialectos, permitiendo un despliegue mundial inclusivo con comprensión cultural y regional matizada.
    
    Next-Generation Training Infrastructure: Eficiencia de entrenamiento multimodal cercana al 100 % respecto al entrenamiento solo texto y frameworks RL asíncronos que soportan scaffolds de agentes a gran escala y orquestación de entornos.
  upgradeDescription: |
    Actualizar el runtime de Ollama a ollama/ollama:0.30.10.
    Actualizar el proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.22 (reenvío de image_url de visión OpenAI).

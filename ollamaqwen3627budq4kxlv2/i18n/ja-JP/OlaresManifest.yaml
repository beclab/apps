metadata:
  title: Qwen3.6 27B UD-XL (Ollama)
  description: 卓越した実用性と性能を提供するオープンソース・マルチモーダルモデル
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    ユーザートラフィックはプロキシ経由で Ollama に送られます。
    
    **モデル**
    `unsloth/Qwen3.6-27B-GGUF` の Unsloth Dynamic 量子化（`Qwen3.6-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`）を使用。
    混合精度 UD 量子化は Q5_K_M に近い品質を保ちつつ、標準 Q4_K_M に近いデコードスループットを維持し、フルビジョン（mmproj）も保持します。
    チャットテンプレートは Ollama 組み込みの `qwen3.5` RENDERER/PARSER ディレクティブを使用し、公式 `qwen3.6` パッケージの出力品質に一致します。
    
    Qwen3.6 は、マルチモーダル学習、アーキテクチャ効率、強化学習のスケール、グローバルなアクセシビリティにおけるブレークスルーを統合し、開発者と企業に前例のない能力と効率を提供する大きな飛躍です。
    
    Qwen3.6 の強化点：
    
    Unified Vision-Language Foundation: マルチモーダルトークンでの早期融合学習により Qwen3 との世代間パリティを達成し、推論・コーディング・エージェント・視覚理解ベンチマークで Qwen3-VL モデルを上回ります。
    
    Efficient Hybrid Architecture: Gated Delta Networks とスパース Mixture-of-Experts の組み合わせにより、最小のレイテンシとコストオーバーヘッドで高スループット推論を実現。
    
    Scalable RL Generalization: 徐々に複雑になるタスク分布を持つ百万エージェント環境で強化学習をスケールし、実世界での堅牢な適応性を確保。
    
    Global Linguistic Coverage: 201 の言語と方言への対応を拡大し、文化・地域のニュアンスを踏まえた包摂的な世界展開を可能に。
    
    Next-Generation Training Infrastructure: テキストのみの学習と比べてほぼ 100% のマルチモーダル学習効率と、大規模エージェント足場と環境オーケストレーションを支える非同期 RL フレームワーク。
  upgradeDescription: |
    Ollama ランタイムを ollama/ollama:0.30.10 にアップグレード。
    Olares API プロキシを beclab/harveyff-olares-ollama:v0.1.22 にアップグレード（OpenAI vision image_url 転送）。

metadata:
  title: Qwen3.6 27B UD-XL (Ollama)
  description: Open-Source-Multimodalmodelle mit außergewöhnlichem Nutzen und Leistung
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsame App. Nach der Installation durch den Olares Admin können alle Nutzer im Cluster sie über die Referenz-App nutzen.
    Nutzer-Traffic geht über den Proxy zu Ollama.
    
    **MODELL**
    Verwendet Unsloth Dynamic Quant von `unsloth/Qwen3.6-27B-GGUF` (`Qwen3.6-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    Die gemischtpräzise UD-Quantisierung bewahrt Qualität nahe Q5_K_M und hält den Decode-Durchsatz nahe dem Standard-Q4_K_M, bei voller Vision (mmproj).
    Das Chat-Template nutzt die eingebauten `qwen3.5` RENDERER/PARSER-Direktiven von Ollama und entspricht der Ausgabequalität des offiziellen `qwen3.6`-Pakets.
    
    Qwen3.6 stellt einen bedeutenden Fortschritt dar und integriert Durchbrüche im multimodalen Lernen, der architektonischen Effizienz, dem Reinforcement-Learning-Maßstab und der globalen Zugänglichkeit, um Entwickler und Unternehmen mit beispielloser Fähigkeit und Effizienz zu befähigen.
    
    Qwen3.6 bietet folgende Verbesserungen:
    
    Unified Vision-Language Foundation: Early-Fusion-Training auf multimodalen Tokens erreicht generationsübergreifende Parität mit Qwen3 und übertrifft Qwen3-VL-Modelle bei Reasoning-, Coding-, Agenten- und visuellen Verständnis-Benchmarks.
    
    Efficient Hybrid Architecture: Gated Delta Networks kombiniert mit sparsamen Mixture-of-Experts liefern High-Throughput-Inferenz mit minimaler Latenz und Kostenoverhead.
    
    Scalable RL Generalization: Reinforcement Learning skaliert über Million-Agent-Umgebungen mit zunehmend komplexen Aufgabenverteilungen für robuste Anpassungsfähigkeit in der realen Welt.
    
    Global Linguistic Coverage: Erweiterte Unterstützung auf 201 Sprachen und Dialekte für inklusive, weltweite Bereitstellung mit nuancierterem kulturellem und regionalem Verständnis.
    
    Next-Generation Training Infrastructure: Nahezu 100 % multimodale Trainingseffizienz im Vergleich zu text-only Training und asynchrone RL-Frameworks für massiv skalierte Agent-Scaffolds und Umgebungsorchestrierung.
  upgradeDescription: |
    Ollama-Runtime auf ollama/ollama:0.30.10 aktualisieren.
    Olares-API-Proxy auf beclab/harveyff-olares-ollama:v0.1.22 aktualisieren (OpenAI-Vision image_url-Weiterleitung).

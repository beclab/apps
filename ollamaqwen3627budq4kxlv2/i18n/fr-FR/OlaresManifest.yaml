metadata:
  title: Qwen3.6 27B UD-XL (Ollama)
  description: Modèles multimodaux open source offrant une utilité et des performances exceptionnelles
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via l'app de référence.
    Le trafic utilisateur passe par le proxy vers Ollama.
    
    **MODÈLE**
    Utilise la quantification dynamique Unsloth de `unsloth/Qwen3.6-27B-GGUF` (`Qwen3.6-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La quantification UD en précision mixte préserve une qualité proche de Q5_K_M tout en maintenant un débit de décodage proche du Q4_K_M standard, avec la vision complète (mmproj) conservée.
    Le modèle de chat utilise les directives RENDERER/PARSER intégrées `qwen3.5` d'Ollama, correspondant à la qualité de sortie du paquet officiel `qwen3.6`.
    
    Qwen3.6 représente un bond significatif, intégrant des avancées en apprentissage multimodal, efficacité architecturale, échelle du reinforcement learning et accessibilité mondiale pour doter développeurs et entreprises d'une capacité et d'une efficacité sans précédent.
    
    Qwen3.6 présente les améliorations suivantes :
    
    Unified Vision-Language Foundation : L'entraînement early fusion sur des tokens multimodaux atteint la parité intergénérationnelle avec Qwen3 et surpasse les modèles Qwen3-VL sur les benchmarks de raisonnement, coding, agents et compréhension visuelle.
    
    Efficient Hybrid Architecture : Les Gated Delta Networks combinés à un Mixture-of-Experts sparse offrent une inférence à haut débit avec une latence et un surcoût minimaux.
    
    Scalable RL Generalization : Reinforcement learning mis à l'échelle sur des environnements à un million d'agents avec des distributions de tâches progressivement complexes pour une adaptabilité robuste au monde réel.
    
    Global Linguistic Coverage : Prise en charge étendue à 201 langues et dialectes, permettant un déploiement mondial inclusif avec une compréhension culturelle et régionale nuancée.
    
    Next-Generation Training Infrastructure : Efficacité d'entraînement multimodal proche de 100 % par rapport à l'entraînement texte seul et frameworks RL asynchrones supportant des scaffolds d'agents à grande échelle et l'orchestration d'environnements.
  upgradeDescription: |
    Mettre à jour le runtime Ollama vers ollama/ollama:0.30.10.
    Mettre à jour le proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.22 (transfert image_url vision OpenAI).

metadata:
  title: Qwen3.6 27B UD-XL (Ollama)
  description: Modelli multimodali open source che offrono utilità e prestazioni eccezionali
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    Il traffico utente passa attraverso il proxy verso Ollama.
    
    **MODELLO**
    Usa la quantizzazione dinamica Unsloth da `unsloth/Qwen3.6-27B-GGUF` (`Qwen3.6-27B-UD-Q4_K_XL.gguf` + `mmproj-F16.gguf`).
    La quantizzazione UD a precisione mista preserva qualità vicina a Q5_K_M mantenendo il throughput di decode vicino al Q4_K_M standard, con visione completa (mmproj) mantenuta.
    Il template di chat usa le direttive RENDERER/PARSER integrate `qwen3.5` di Ollama, allineandosi alla qualità di output del pacchetto ufficiale `qwen3.6`.
    
    Qwen3.6 rappresenta un significativo passo avanti, integrando progressi nell'apprendimento multimodale, nell'efficienza architetturale, nella scala del reinforcement learning e nell'accessibilità globale per potenziare sviluppatori e imprese con capacità ed efficienza senza precedenti.
    
    Qwen3.6 presenta i seguenti miglioramenti:
    
    Unified Vision-Language Foundation: Il training early fusion sui token multimodali raggiunge la parità intergenerazionale con Qwen3 e supera i modelli Qwen3-VL nei benchmark di ragionamento, coding, agenti e comprensione visuale.
    
    Efficient Hybrid Architecture: Gated Delta Networks combinate con Mixture-of-Experts sparsi offrono inferenza ad alto throughput con latenza e overhead di costo minimi.
    
    Scalable RL Generalization: Reinforcement learning scalato su ambienti con milioni di agenti e distribuzioni di task progressivamente complesse per una robusta adattabilità nel mondo reale.
    
    Global Linguistic Coverage: Supporto ampliato a 201 lingue e dialetti, consentendo un deployment mondiale inclusivo con comprensione culturale e regionale sfumata.
    
    Next-Generation Training Infrastructure: Efficienza di training multimodale quasi al 100% rispetto al training solo testo e framework RL asincroni che supportano scaffold di agenti su larga scala e orchestrazione degli ambienti.
  upgradeDescription: |
    Aggiornare il runtime Ollama a ollama/ollama:0.30.10.
    Aggiornare il proxy API Olares a beclab/harveyff-olares-ollama:v0.1.22 (inoltro image_url visione OpenAI).

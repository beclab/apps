metadata:
  title: Isaac Lab
  description: "Cadre unifié pour l'apprentissage robotique basé sur NVIDIA Isaac Sim"
spec:
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Isaac Lab est un framework open source accéléré par GPU conçu pour unifier et simplifier les flux de recherche en robotique, tels que l'apprentissage par renforcement, l'apprentissage par imitation et la planification de mouvements. Construit sur NVIDIA Isaac Sim, il combine une simulation physique et de capteurs rapide et précise, ce qui en fait un choix idéal pour le transfert sim-to-real en robotique.
    
    Isaac Lab fournit aux développeurs des fonctionnalités essentielles pour une simulation précise des capteurs, telles que des caméras basées sur RTX, un LIDAR ou des capteurs de contact. L'accélération GPU permet d'exécuter des simulations et des calculs complexes plus rapidement, ce qui est clé pour les processus itératifs comme l'apprentissage par renforcement et les tâches intensives en données. De plus, Isaac Lab peut s'exécuter localement ou être distribué dans le cloud, offrant de la flexibilité pour les déploiements à grande échelle.
    
    Fonctionnalités clés
    Isaac Lab offre un ensemble complet d'outils et d'environnements conçus pour faciliter l'apprentissage robotique :
    
    Robots : Une collection diversifiée de robots, des manipulateurs et quadrupèdes aux humanoides, avec plus de 16 modèles couramment disponibles.
    Environments : Implémentations prêtes à l'entraînement de plus de 30 environnements, entraînables avec des frameworks d'apprentissage par renforcement populaires tels que RSL RL, SKRL, RL Games ou Stable Baselines. Nous prenons également en charge l'apprentissage par renforcement multi-agents.
    Physics : Corps rigides, systèmes articulés, objets déformables
    Sensors : Caméras RGB/profondeur/segmentation, annotations de caméra, IMU, capteurs de contact, ray casters.

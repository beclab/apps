metadata:
  title: Isaac Lab
  description: "Framework unificato per l'apprendimento robotico basato su NVIDIA Isaac Sim"
spec:
  upgradeDescription: |
    Sostituzione dell'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineamento dei mount della configurazione nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimozione del cablaggio specifico Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Isaac Lab è un framework open-source accelerato da GPU progettato per unificare e semplificare i flussi di lavoro di ricerca in robotica, come reinforcement learning, imitation learning e motion planning. Basato su NVIDIA Isaac Sim, combina simulazione fisica e dei sensori rapida e accurata, rendendolo ideale per il trasferimento sim-to-real in robotica.
    
    Isaac Lab offre agli sviluppatori funzioni essenziali per una simulazione accurata dei sensori, come telecamere basate su RTX, LIDAR o sensori di contatto. L'accelerazione GPU consente di eseguire simulazioni e calcoli complessi più rapidamente, fondamentale per processi iterativi come il reinforcement learning e attività ad alta intensità di dati. Inoltre, Isaac Lab può essere eseguito localmente o distribuito nel cloud, offrendo flessibilità per deployment su larga scala.
    
    Funzioni principali
    Isaac Lab offre un set completo di strumenti e ambienti progettati per facilitare il robot learning:
    
    Robots: Una raccolta diversificata di robot, da manipulatori e quadrupedi a umanoidi, con più di 16 modelli comunemente disponibili.
    Environments: Implementazioni pronte all'addestramento di oltre 30 ambienti, addestrabili con framework di reinforcement learning popolari come RSL RL, SKRL, RL Games o Stable Baselines. Supportiamo anche il reinforcement learning multi-agente.
    Physics: Corpi rigidi, sistemi articolati, oggetti deformabili
    Sensors: Telecamere RGB/profondità/segmentazione, annotazioni telecamera, IMU, sensori di contatto, ray casters.

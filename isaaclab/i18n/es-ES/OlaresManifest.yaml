metadata:
  title: Isaac Lab
  description: Marco unificado para el aprendizaje robótico basado en NVIDIA Isaac Sim
spec:
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Isaac Lab es un marco de código abierto acelerado por GPU diseñado para unificar y simplificar flujos de trabajo de investigación en robótica, como el aprendizaje por refuerzo, el aprendizaje por imitación y la planificación de movimiento. Construido sobre NVIDIA Isaac Sim, combina simulación física y de sensores rápida y precisa, lo que lo convierte en una opción ideal para la transferencia sim-to-real en robótica.
    
    Isaac Lab ofrece a los desarrolladores funciones esenciales para una simulación precisa de sensores, como cámaras basadas en RTX, LIDAR o sensores de contacto. La aceleración GPU permite ejecutar simulaciones y cálculos complejos más rápido, clave para procesos iterativos como el aprendizaje por refuerzo y tareas intensivas en datos. Además, Isaac Lab puede ejecutarse localmente o distribuirse en la nube, ofreciendo flexibilidad para despliegues a gran escala.
    
    Funciones clave
    Isaac Lab ofrece un conjunto completo de herramientas y entornos diseñados para facilitar el aprendizaje robótico:
    
    Robots: Una diversa colección de robots, desde manipuladores y cuadrúpedos hasta humanoides, con más de 16 modelos habituales.
    Environments: Implementaciones listas para entrenar de más de 30 entornos, que pueden entrenarse con frameworks populares de aprendizaje por refuerzo como RSL RL, SKRL, RL Games o Stable Baselines. También admitimos aprendizaje por refuerzo multiagente.
    Physics: Cuerpos rígidos, sistemas articulados, objetos deformables
    Sensors: Cámaras RGB/profundidad/segmentación, anotaciones de cámara, IMU, sensores de contacto, ray casters.

metadata:
  title: Isaac Lab
  description: Einheitliches Framework für Robot Learning auf Basis von NVIDIA Isaac Sim
spec:
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
  fullDescription: |
    Isaac Lab ist ein GPU-beschleunigtes Open-Source-Framework, das Robotik-Forschungs-Workflows wie Reinforcement Learning, Imitation Learning und Motion Planning vereinheitlicht und vereinfacht. Aufgebaut auf NVIDIA Isaac Sim kombiniert es schnelle und genaue Physik- und Sensorsimulation und eignet sich ideal für den Sim-to-Real-Transfer in der Robotik.
    
    Isaac Lab bietet Entwicklern wesentliche Funktionen für genaue Sensorsimulation, z. B. RTX-basierte Kameras, LIDAR oder Kontaktsensoren. Die GPU-Beschleunigung ermöglicht komplexere Simulationen und Berechnungen schneller – entscheidend für iterative Prozesse wie Reinforcement Learning und datenintensive Aufgaben. Zudem kann Isaac Lab lokal oder verteilt in der Cloud laufen und bietet Flexibilität für groß angelegte Deployments.
    
    Hauptfunktionen
    Isaac Lab bietet ein umfassendes Set an Tools und Umgebungen für Robot Learning:
    
    Robots: Eine vielfältige Sammlung von Robotern – von Manipulatoren und Quadrupeden bis zu Humanoiden – mit mehr als 16 gängigen Modellen.
    Environments: Fertige Implementierungen von mehr als 30 Umgebungen, trainierbar mit beliebten Reinforcement-Learning-Frameworks wie RSL RL, SKRL, RL Games oder Stable Baselines. Auch Multi-Agent Reinforcement Learning wird unterstützt.
    Physics: Starre Körper, artikulierte Systeme, verformbare Objekte
    Sensors: RGB-/Tiefen-/Segmentierungskameras, Kamera-Annotationen, IMU, Kontaktsensoren, Ray Caster.

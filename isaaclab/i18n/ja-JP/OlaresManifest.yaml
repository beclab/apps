metadata:
  title: Isaac Lab
  description: NVIDIA Isaac Sim 上に構築されたロボット学習のための統合フレームワーク
spec:
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
  fullDescription: |
    Isaac Lab は、強化学習、模倣学習、モーションプランニングなどのロボティクス研究ワークフローを統一・簡素化するために設計された、GPU 加速のオープンソースフレームワークです。NVIDIA Isaac Sim 上に構築され、高速で正確な物理・センサーシミュレーションを組み合わせ、ロボティクスにおける sim-to-real 転送に最適です。
    
    Isaac Lab は、RTX ベースのカメラ、LIDAR、接触センサーなど、正確なセンサーシミュレーションに不可欠な機能を開発者に提供します。GPU 加速により、複雑なシミュレーションと計算をより速く実行でき、強化学習やデータ集約型タスクなどの反復プロセスに重要です。さらに、Isaac Lab はローカル実行やクラウド分散にも対応し、大規模デプロイに柔軟性を提供します。
    
    主な機能
    Isaac Lab はロボット学習を促進する包括的なツールと環境を提供します:
    
    Robots: マニピュレータ、四足歩行ロボット、ヒューマノイドなど、一般的なモデルを 16 以上含む多様なロボットコレクション。
    Environments: RSL RL、SKRL、RL Games、Stable Baselines などの人気強化学習フレームワークで訓練可能な 30 以上の環境の準備済み実装。マルチエージェント強化学習もサポート。
    Physics: 剛体、関節系、変形可能オブジェクト
    Sensors: RGB/深度/セグメンテーションカメラ、カメラアノテーション、IMU、接触センサー、レイキャスター。

olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: odysseus
  appid: odysseus
  title: Odysseus
  description: A self-hosted AI workspace for chat, research and personal productivity
  icon: https://cdn.olares.com/images/2026/10/39924fb9fe4ed086d6de5a2d4e496d3a.png
  version: 0.0.18
  categories:
  - Productivity_v112
  - agents
entrances:
- name: odysseus
  host: odysseus
  port: 7000
  title: Odysseus
  authLevel: internal
  openMethod: window
  icon: https://cdn.olares.com/images/2026/10/39924fb9fe4ed086d6de5a2d4e496d3a.png
spec:
  versionName: 1.0.3
  runAsUser: true
  developer: odysseus-dev
  website: https://odysseus-dev.github.io/odysseus/
  sourceCode: https://github.com/odysseus-dev/odysseus
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  fullDescription: |
    Odysseus brings AI chat, agents, research and personal information into one self-hosted workspace.

    - Chat with local or cloud models, attach images and keep conversation history.
    - Use agents, skills and MCP tools for connected workflows.
    - Research the web and write reports with source links.
    - Manage documents, notes, tasks, email, calendars and contacts.
    - Connect compatible speech services for transcription and read-aloud.

    Configure a compatible model endpoint in Settings. On Olares, you can use Router and its default-chat route. Email and calendar integrations require your own service configuration.

    Word/PDF features require optional dependencies. Built-in AI denoising, upscaling, background removal and SAM segmentation require additional model runtimes and are not included. Local GPU model serving and the host Docker socket are not configured by this package.
  requiredCpu: 600m
  limitedCpu: '5'
  requiredMemory: 2Gi
  limitedMemory: 8Gi
  requiredDisk: 5Gi
  limitedDisk: 50Gi
  supportArch:
  - amd64
  featuredImage: https://cdn.olares.com/images/2026/10/de2a9f39ec7a0c80812198d41218bb28.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/de2a9f39ec7a0c80812198d41218bb28.png
  - https://cdn.olares.com/images/2026/10/3dc75c8f74956ca99faff3ef3161477d.png
  - https://cdn.olares.com/images/2026/10/28228b7abf2417c401d8f0c44feba1a2.png
permission:
  appData: true
  appCache: true
middleware:
  postgres:
    username: odysseus
    databases:
    - name: odysseus
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 22
  - 143
  - 465
  - 587
  - 993
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  - name: postgres
    type: middleware
    version: '>=17.0.0-0'
    mandatory: true
  - name: searxngv3
    type: application
    version: '>=1.1.0-0'
    mandatory: false
workloadReplicas:
  odysseus: 1
  chromadb: 1
envs:
- envName: ADMIN_PASSWORD
  type: password
  required: false
  editable: false
  regex: ^(.{8,72})?$
  description: Initial password for admin (8–72 characters). Leave blank to generate one in the odysseus-config Secret. Existing
    accounts keep their password.
- envName: SEARXNG_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Optional SearXNG entrance URL, without /search. Leave blank to configure search later.

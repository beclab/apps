{{- $previous := lookup "v1" "Secret" .Release.Namespace "odysseus-config" -}}
{{- $password := .Values.olaresEnv.ADMIN_PASSWORD | default "" -}}
{{- if not $password -}}
{{- if and $previous $previous.data (index $previous.data "ODYSSEUS_ADMIN_PASSWORD") -}}
{{- $password = index $previous.data "ODYSSEUS_ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: odysseus-config
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ODYSSEUS_ADMIN_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:%v/%s" .Values.postgres.username (.Values.postgres.password | urlquery) .Values.postgres.host .Values.postgres.port .Values.postgres.databases.odysseus | quote }}

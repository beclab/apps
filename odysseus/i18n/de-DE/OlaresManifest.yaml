metadata:
  title: Odysseus
  description: Ein selbst gehosteter KI-Arbeitsbereich für Chat, Recherche und Produktivität
spec:
  fullDescription: |
    Odysseus vereint KI-Chat, Agenten, Recherche und persönliche Informationen in einem selbst gehosteten Arbeitsbereich.

    - Mit lokalen oder Cloud-Modellen chatten, Bilder anhängen und Verläufe speichern.
    - Agenten, Skills und MCP-Werkzeuge für verbundene Arbeitsabläufe nutzen.
    - Im Web recherchieren und Berichte mit Quellenlinks erstellen.
    - Dokumente, Notizen, Aufgaben, E-Mails, Kalender und Kontakte verwalten.
    - Kompatible Sprachdienste für Transkription und Vorlesen verbinden.

    Konfigurieren Sie einen kompatiblen Modell-Endpunkt in den Einstellungen. Unter Olares können Sie Router mit der Route default-chat verwenden. E-Mail und Kalender erfordern eine eigene Dienstkonfiguration.

    Word/PDF-Komponenten werden bei der Initialisierung automatisch installiert. Die Erstinstallation benötigt Internetzugang zum Herunterladen dieser Komponenten. KI-Entrauschung, Hochskalierung, Hintergrundentfernung und SAM-Segmentierung benötigen zusätzliche Modellumgebungen und sind nicht enthalten. Lokales GPU-Modellhosting und der Docker-Socket des Hosts werden nicht eingerichtet.
envs:
- envName: ADMIN_PASSWORD
  description: Anfängliches Admin-Passwort (8–72 Zeichen). Leer lassen, um ein Passwort im Secret odysseus-config zu erzeugen.
    Bestehende Konten behalten ihr Passwort.
- envName: SEARXNG_URL
  description: Optionale SearXNG-URL ohne /search. Leer lassen, um die Suche später einzurichten.

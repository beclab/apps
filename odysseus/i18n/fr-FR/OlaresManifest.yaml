metadata:
  title: Odysseus
  description: Un espace IA auto-hébergé pour le chat, la recherche et la productivité personnelle
spec:
  fullDescription: |
    Odysseus réunit chat IA, agents, recherche et informations personnelles dans un espace auto-hébergé.

    - Discutez avec des modèles locaux ou cloud, joignez des images et conservez l’historique.
    - Reliez vos flux de travail avec des agents, compétences et outils MCP.
    - Effectuez des recherches web et rédigez des rapports avec des liens vers les sources.
    - Gérez documents, notes, tâches, e-mails, calendriers et contacts.
    - Connectez des services vocaux compatibles pour la transcription et la lecture à voix haute.

    Configurez un point d’accès de modèle compatible dans les paramètres. Sur Olares, utilisez Router et sa route default-chat. Les e-mails et calendriers nécessitent la configuration de vos propres services.

    Les fonctions Word/PDF nécessitent des dépendances optionnelles. Le débruitage, l’agrandissement, la suppression d’arrière-plan et la segmentation SAM par IA exigent des environnements supplémentaires non inclus. Ce paquet ne configure ni serveur de modèle GPU local ni socket Docker de l’hôte.
envs:
- envName: ADMIN_PASSWORD
  description: Mot de passe admin initial (8–72 caractères). Laissez vide pour le générer dans le Secret odysseus-config.
    Les comptes existants conservent leur mot de passe.
- envName: SEARXNG_URL
  description: URL SearXNG facultative sans /search. Laissez vide pour configurer la recherche plus tard.

metadata:
  title: Odysseus
  description: チャット、調査、個人の作業をまとめるセルフホスト型 AI ワークスペース
spec:
  fullDescription: |
    Odysseus は AI チャット、エージェント、調査、個人情報の管理を一つのセルフホスト環境にまとめます。

    - ローカルまたはクラウドのモデルと対話し、画像を添付して履歴を保存できます。
    - エージェント、スキル、MCP ツールで作業を連携できます。
    - ウェブを調査し、出典リンク付きのレポートを作成できます。
    - 文書、メモ、タスク、メール、カレンダー、連絡先を管理できます。
    - 対応する音声サービスと接続して文字起こしと読み上げを利用できます。

    設定で対応モデルのエンドポイントを指定してください。Olares では Router の default-chat ルートを利用できます。メールとカレンダーは利用するサービスの設定が必要です。

    Word/PDF 解析コンポーネントは初期化時に自動インストールされます。初回はダウンロードのためインターネット接続が必要です。AI ノイズ除去、拡大、背景除去、SAM 分割には別途モデル実行環境が必要で、本パッケージには含まれません。ローカル GPU モデルサーバーやホストの Docker ソケットも設定されません。
envs:
- envName: ADMIN_PASSWORD
  description: 初期 admin パスワード（8～72 文字）。空欄の場合は odysseus-config Secret に生成されます。既存アカウントのパスワードは保持されます。
- envName: SEARXNG_URL
  description: 任意の SearXNG URL。/search は含めないでください。空欄の場合は後から設定できます。

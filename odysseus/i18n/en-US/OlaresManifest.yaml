metadata:
  title: Odysseus
  description: A self-hosted AI workspace for chat, research and personal productivity
spec:
  fullDescription: |
    Odysseus brings AI chat, agents, research and personal information into one self-hosted workspace.

    - Chat with local or cloud models, attach images and keep conversation history.
    - Use agents, skills and MCP tools for connected workflows.
    - Research the web and write reports with source links.
    - Manage documents, notes, tasks, email, calendars and contacts.
    - Connect compatible speech services for transcription and read-aloud.

    Configure a compatible model endpoint in Settings. On Olares, you can use Router and its default-chat route. Email and calendar integrations require your own service configuration.

    Word/PDF parsers are installed automatically during initialization. First installation requires internet access to download these components. Built-in AI denoising, upscaling, background removal and SAM segmentation require additional model runtimes and are not included. Local GPU model serving and the host Docker socket are not configured by this package.
envs:
- envName: ADMIN_PASSWORD
  description: Initial admin password (8–72 characters). Leave blank to generate a password in the odysseus-config Secret.
    Existing accounts retain their password.
- envName: SEARXNG_URL
  description: Optional SearXNG URL without /search. Leave blank to configure search later.

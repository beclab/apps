metadata:
  title: Odysseus
  description: 集 AI 聊天、研究和个人效率工具于一体的自托管工作空间
spec:
  fullDescription: |
    Odysseus 将 AI 聊天、智能体、研究和个人信息管理整合到一个自托管工作空间。

    - 连接本地或云端模型，发送图片并保存对话历史。
    - 通过智能体、技能和 MCP 工具连接工作流程。
    - 搜索网页并生成带来源链接的研究报告。
    - 管理文档、笔记、任务、邮件、日历和联系人。
    - 连接兼容的语音服务，实现语音识别和朗读。

    请在设置中配置兼容的模型端点。在 Olares 上可使用 Router 的 default-chat 路由。邮件和日历集成需要自行配置相应服务。

    Word/PDF 功能需要可选依赖。内置 AI 降噪、放大、去背景和 SAM 分割需要额外模型运行环境，本包不包含。本包不配置本地 GPU 模型服务或宿主机 Docker 套接字。
envs:
- envName: ADMIN_PASSWORD
  description: 初始管理员密码（8–72 个字符）。留空将在 odysseus-config Secret 中生成密码。已有账号保留原密码。
- envName: SEARXNG_URL
  description: 可选 SearXNG 地址，不含 /search。留空可稍后配置搜索。

metadata:
  title: Odysseus
  description: Un espacio de IA autoalojado para chat, investigación y productividad personal
spec:
  fullDescription: |
    Odysseus reúne chat de IA, agentes, investigación e información personal en un espacio autoalojado.

    - Conversa con modelos locales o en la nube, adjunta imágenes y guarda el historial.
    - Conecta flujos de trabajo con agentes, habilidades y herramientas MCP.
    - Investiga en la web y redacta informes con enlaces a las fuentes.
    - Gestiona documentos, notas, tareas, correo, calendarios y contactos.
    - Conecta servicios de voz compatibles para transcripción y lectura en voz alta.

    Configura un punto de acceso de modelos compatible en Ajustes. En Olares puedes usar Router y su ruta default-chat. El correo y los calendarios requieren configurar tus propios servicios.

    Los componentes Word/PDF se instalan automáticamente durante la inicialización. La primera instalación requiere acceso a Internet para descargarlos. La reducción de ruido, ampliación, eliminación de fondos y segmentación SAM con IA requieren entornos de modelos adicionales no incluidos. Este paquete no configura modelos GPU locales ni el socket Docker del sistema anfitrión.
envs:
- envName: ADMIN_PASSWORD
  description: Contraseña inicial de admin (8–72 caracteres). Déjala vacía para generarla en el Secret odysseus-config. Las
    cuentas existentes conservan su contraseña.
- envName: SEARXNG_URL
  description: URL opcional de SearXNG sin /search. Déjala vacía para configurar la búsqueda más tarde.

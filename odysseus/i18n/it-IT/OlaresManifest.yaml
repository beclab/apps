metadata:
  title: Odysseus
  description: Uno spazio IA self-hosted per chat, ricerca e produttività personale
spec:
  fullDescription: |
    Odysseus riunisce chat IA, agenti, ricerca e informazioni personali in uno spazio self-hosted.

    - Chatta con modelli locali o cloud, allega immagini e conserva la cronologia.
    - Collega i flussi di lavoro con agenti, abilità e strumenti MCP.
    - Cerca sul web e scrivi rapporti con collegamenti alle fonti.
    - Gestisci documenti, note, attività, e-mail, calendari e contatti.
    - Collega servizi vocali compatibili per trascrizione e lettura ad alta voce.

    Configura un endpoint di modello compatibile nelle impostazioni. Su Olares puoi usare Router e la rotta default-chat. E-mail e calendari richiedono la configurazione dei tuoi servizi.

    I componenti Word/PDF vengono installati automaticamente durante l’inizializzazione. La prima installazione richiede Internet per scaricarli. Riduzione del rumore, ingrandimento, rimozione dello sfondo e segmentazione SAM con IA richiedono ambienti di modelli aggiuntivi non inclusi. Il pacchetto non configura modelli GPU locali né il socket Docker dell’host.
envs:
- envName: ADMIN_PASSWORD
  description: Password admin iniziale (8–72 caratteri). Lascia vuoto per generarla nel Secret odysseus-config. Gli account
    esistenti mantengono la password.
- envName: SEARXNG_URL
  description: URL SearXNG opzionale senza /search. Lascia vuoto per configurare la ricerca in seguito.

metadata:
  title: GLM-4.7-Flash (Ollama)
  description: GLM-4.7-Flash は高性能で高速応答の言語モデルです
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares 管理者がインストールすると、クラスター内のすべてのユーザーが参照アプリ経由で利用できます。
    
    **モデル概要**
    GLM-4.7-Flash は、速度と効率に最適化された高性能・高速応答の言語モデルです。低レイテンシと少ないリソース要件を保ちつつ優れた性能を提供します。
    
    **機能**
    高性能
    - 最適化された推論による高速応答
    - 効率的なリソース利用
    - 優れた性能対速度比
    
    本番向け最適化
    - 低いメモリフットプリント
    - 高速な推論速度
    - リアルタイムアプリケーションに適合
  upgradeDescription: |
    Ollama ランタイム: ollama/ollama:0.30.0。CUDA ComputeCache は Home/Ollama/.nv で共有（すべての Ollama アプリ）。Proxy API: beclab/harveyff-olares-ollama:v0.1.21。
    
    Olares API プロキシイメージを beclab/harveyff-olares-ollama:v0.1.21 にアップグレード。

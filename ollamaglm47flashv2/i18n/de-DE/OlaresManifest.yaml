metadata:
  title: GLM-4.7-Flash (Ollama)
  description: GLM-4.7-Flash ist ein leistungsstarkes, schnell reagierendes Sprachmodell
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.
    
    **MODELLÜBERSICHT**
    GLM-4.7-Flash ist ein leistungsstarkes, schnell reagierendes Sprachmodell, optimiert für Geschwindigkeit und Effizienz. Es bietet hervorragende Leistung bei geringer Latenz und geringen Ressourcenanforderungen.
    
    **Funktionen**
    HOHE LEISTUNG
    - Schnelle Antwortzeiten mit optimierter Inferenz
    - Effiziente Ressourcennutzung
    - Hervorragendes Leistungs-Geschwindigkeits-Verhältnis
    
    FÜR PRODUKTION OPTIMIERT
    - Geringer Speicherbedarf
    - Schnelle Inferenzgeschwindigkeit
    - Geeignet für Echtzeitanwendungen
  upgradeDescription: |
    Ollama-Runtime: ollama/ollama:0.30.0. CUDA ComputeCache gemeinsam unter Home/Ollama/.nv (alle Ollama-Apps). Proxy-API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Olares-API-Proxy-Image auf beclab/harveyff-olares-ollama:v0.1.21 aktualisiert.

metadata:
  title: GLM-4.7-Flash (Ollama)
  description: GLM-4.7-Flash est un modèle de langage haute performance à réponse rapide
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'administrateur Olares, tous les utilisateurs du cluster peuvent l'utiliser via l'application de référence.
    
    **APERÇU DU MODÈLE**
    GLM-4.7-Flash est un modèle de langage haute performance à réponse rapide, optimisé pour la vitesse et l'efficacité. Il offre d'excellentes performances tout en maintenant une faible latence et des besoins en ressources réduits.
    
    **Fonctionnalités**
    HAUTE PERFORMANCE
    - Temps de réponse rapides avec une inférence optimisée
    - Utilisation efficace des ressources
    - Excellent rapport performance/vitesse
    
    OPTIMISÉ POUR LA PRODUCTION
    - Empreinte mémoire faible
    - Vitesse d'inférence élevée
    - Adapté aux applications en temps réel
  upgradeDescription: |
    Runtime Ollama : ollama/ollama:0.30.0. CUDA ComputeCache partagé sous Home/Ollama/.nv (toutes les apps Ollama). Proxy API : beclab/harveyff-olares-ollama:v0.1.21.
    
    Mise à jour de l'image du proxy API Olares vers beclab/harveyff-olares-ollama:v0.1.21.

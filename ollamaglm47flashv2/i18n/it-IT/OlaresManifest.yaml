metadata:
  title: GLM-4.7-Flash (Ollama)
  description: GLM-4.7-Flash è un modello linguistico ad alte prestazioni e a risposta rapida
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'amministratore Olares, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.
    
    **PANORAMICA DEL MODELLO**
    GLM-4.7-Flash è un modello linguistico ad alte prestazioni e a risposta rapida, ottimizzato per velocità ed efficienza. Offre prestazioni eccellenti mantenendo bassa latenza e requisiti di risorse contenuti.
    
    **Funzioni**
    ALTE PRESTAZIONI
    - Tempi di risposta rapidi con inferenza ottimizzata
    - Utilizzo efficiente delle risorse
    - Eccellente rapporto prestazioni-velocità
    
    OTTIMIZZATO PER LA PRODUZIONE
    - Basso footprint di memoria
    - Velocità di inferenza elevata
    - Adatto ad applicazioni in tempo reale
  upgradeDescription: |
    Runtime Ollama: ollama/ollama:0.30.0. CUDA ComputeCache condivisa in Home/Ollama/.nv (tutte le app Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Aggiornamento dell'immagine del proxy API Olares a beclab/harveyff-olares-ollama:v0.1.21.

metadata:
  title: GLM-4.7-Flash (Ollama)
  description: GLM-4.7-Flash es un modelo de lenguaje de alto rendimiento y respuesta rápida
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Una vez instalada por el administrador de Olares, todos los usuarios del clúster pueden usarla a través de la aplicación de referencia.
    
    **RESUMEN DEL MODELO**
    GLM-4.7-Flash es un modelo de lenguaje de alto rendimiento y respuesta rápida, optimizado para velocidad y eficiencia. Ofrece un excelente rendimiento manteniendo baja latencia y requisitos de recursos.
    
    **Funciones**
    ALTO RENDIMIENTO
    - Tiempos de respuesta rápidos con inferencia optimizada
    - Uso eficiente de recursos
    - Excelente relación rendimiento-velocidad
    
    OPTIMIZADO PARA PRODUCCIÓN
    - Huella de memoria reducida
    - Velocidad de inferencia rápida
    - Adecuado para aplicaciones en tiempo real
  upgradeDescription: |
    Runtime de Ollama: ollama/ollama:0.30.0. CUDA ComputeCache compartida en Home/Ollama/.nv (todas las apps Ollama). Proxy API: beclab/harveyff-olares-ollama:v0.1.21.
    
    Actualización de la imagen del proxy API de Olares a beclab/harveyff-olares-ollama:v0.1.21.

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: unsloth
  title: Unsloth
  description: Local UI to run and train open models
  icon: https://cdn.olares.com/images/2026/10/5f55abfd7b5570282f8f886b7e576944.png
  version: 0.0.7
  categories:
  - AI
  - models
spec:
  developer: Unsloth AI
  website: https://unsloth.ai
  sourceCode: https://github.com/unslothai/unsloth
  doc: https://unsloth.ai/docs/new/studio
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  featuredImage: https://cdn.olares.com/images/2026/10/6e34a511bfb473c9939ed7c97a21d4b2.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/6e34a511bfb473c9939ed7c97a21d4b2.png
  - https://cdn.olares.com/images/2026/10/6c5db04bb15f47836d8908d6f400044a.png
  - https://cdn.olares.com/images/2026/10/7ac014da93f8cdef5d4264ad6a44af5d.png
  - https://cdn.olares.com/images/2026/10/8adc6b85523266a21887fa5883df1445.png
  fullDescription: |
    Unsloth Studio is a local browser UI for running and fine-tuning open models. This package also includes JupyterLab.

    Load a GGUF or safetensors model, chat with it, prepare a dataset with Data Recipes, run a short LoRA or QLoRA training job, and export a checkpoint to GGUF. Studio and Jupyter each ask for a password during installation. The Studio password is stored on first boot and is not replaced by later environment changes.

    An NVIDIA GPU is required for the GPU mode. This chart declares amd64 only. Image and video models in Studio are large: the smallest image stack is about 7 GB, and the smallest video stack is about 61 GB. A 24 GB GPU can hold the small image model after the GPU binding is raised above the 4 GB floor. The video stack does not fit this GPU or the application memory limit.

    The upstream repository is Apache-2.0. The Studio interface shipped in the image includes AGPL-3.0 components.
  license:
  - text: Apache-2.0
    url: https://github.com/unslothai/unsloth/blob/main/LICENSE
  versionName: "2026.10.10"
  runAsUser: true
  supportArch:
  - amd64
  accelerator:
  - mode: cpu
    requiredCpu: "3"
    limitedCpu: "13"
    requiredMemory: 13Gi
    limitedMemory: 49Gi
    requiredDisk: 20Gi
    limitedDisk: 200Gi
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: "3"
    limitedCpu: "13"
    requiredMemory: 13Gi
    limitedMemory: 49Gi
    requiredDisk: 20Gi
    limitedDisk: 200Gi
    requiredGPUMemory: 4Gi
    limitedGPUMemory: 23Gi
entrances:
- name: unsloth
  host: unsloth
  port: 8000
  title: Unsloth Studio
  authLevel: private
  openMethod: window
  icon: https://cdn.olares.com/images/2026/10/5f55abfd7b5570282f8f886b7e576944.png
- name: jupyter
  host: unsloth
  port: 8888
  title: JupyterLab
  authLevel: private
  openMethod: window
  icon: https://cdn.olares.com/images/2026/10/5f55abfd7b5570282f8f886b7e576944.png
permission:
  appData: true
  appCache: true
  appCommon: true
  userData:
  - Home
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  required: true
  type: password
  editable: false
  regex: '^.{8,}$'
  description: Initial Unsloth Studio password for user unsloth (min 8 characters). Used only on the first boot; later changes do not replace the password stored in app data.
- envName: JUPYTER_PASSWORD
  required: true
  type: password
  editable: true
  applyOnChange: true
  regex: '^.{8,}$'
  description: JupyterLab password (min 8 characters)
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_USER_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_USER_HUGGINGFACE_TOKEN
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
workloadReplicas:
  unsloth: 1

{{- $oe := .Values.olaresEnv | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  UNSLOTH_STUDIO_PASSWORD: {{ $oe.UNSLOTH_STUDIO_PASSWORD | default "" | quote }}
  JUPYTER_PASSWORD: {{ $oe.JUPYTER_PASSWORD | default "" | quote }}
  {{- if $oe.SYSTEM_HF_TOKEN }}
  HF_TOKEN: {{ $oe.SYSTEM_HF_TOKEN | quote }}
  {{- end }}

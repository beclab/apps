metadata:
  title: Unsloth
  description: Local UI to run and train open models
spec:
  fullDescription: |
    Unsloth Studio is a local browser UI for running and fine-tuning open models. This package also includes JupyterLab.

    Load a GGUF or safetensors model, chat with it, prepare a dataset with Data Recipes, run a short LoRA or QLoRA training job, and export a checkpoint to GGUF. Studio and Jupyter each ask for a password during installation. The Studio password is stored on first boot and is not replaced by later environment changes.

    An NVIDIA GPU is required for the GPU mode. This chart declares amd64 only. Image and video models in Studio are large: the smallest image stack is about 7 GB, and the smallest video stack is about 61 GB. A 24 GB GPU can hold the small image model after the GPU binding is raised above the 4 GB floor. The video stack does not fit this GPU or the application memory limit.

    The upstream repository is Apache-2.0. The Studio interface shipped in the image includes AGPL-3.0 components.
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: Initial Unsloth Studio password for user unsloth (min 8 characters). Used only on the first boot; later changes do not replace the password stored in app data.
- envName: JUPYTER_PASSWORD
  description: JupyterLab password (min 8 characters)

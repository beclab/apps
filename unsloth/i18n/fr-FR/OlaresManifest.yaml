metadata:
  title: Unsloth
  description: Interface locale pour exécuter et entraîner des modèles ouverts
spec:
  upgradeDescription: |
    - Mise à jour vers l’image officielle unsloth/unsloth:nightly-2026.10.26. Installation avec GPU NVIDIA uniquement ; point de terminaison et jeton Hugging Face du système.
    - Nouveautés : prompts planifiés et préréglages réutilisables par modèle. Ouvrir Scheduled depuis More dans la barre latérale ; Studio doit rester actif. Enregistrer les préréglages dans le sélecteur de modèles.

    **Déchargement en cas d’inactivité**

    Les modèles de chat libèrent la mémoire GPU après 5 minutes d’inactivité par défaut, sans interrompre les réponses ni supprimer les fichiers. L’entraînement n’est pas affecté.

    Dans Olares **Settings > Applications > Unsloth**, modifier `UNSLOTH_MODEL_IDLE_TTL` : `300` signifie 5 minutes ; `0` désactive le déchargement automatique par défaut ; une valeur active doit être d’au moins `60` secondes. Les changements redémarrent l’application. Les réglages Studio enregistrés sont prioritaires ; **Keep model in GPU memory** empêche le déchargement automatique.

    Pour libérer la mémoire manuellement, ouvrir **Chat > sélecteur de modèles**, puis choisir **Eject model / Eject all** en bas à droite.

    Les mises à jour conservent les fichiers et les réglages Studio. Recharger les modèles après le redémarrage ; le délai par défaut de 5 minutes s’applique sauf réglage enregistré prioritaire.
  fullDescription: |
    Unsloth Studio est une interface de navigateur locale pour exécuter et affiner des modèles ouverts. Ce paquet inclut aussi JupyterLab.

    Chargez un modèle GGUF ou safetensors, discutez avec lui, préparez un jeu de données avec Data Recipes, lancez un court entraînement LoRA ou QLoRA, puis exportez un point de contrôle en GGUF. Studio et Jupyter demandent chacun un mot de passe à l’installation. Le mot de passe Studio est enregistré au premier démarrage et n’est pas remplacé par les modifications ultérieures de l’environnement.

    Le mode GPU nécessite un GPU NVIDIA. Ce paquet ne prend en charge qu’amd64. Les modèles image et vidéo de Studio sont volumineux : la plus petite pile image fait environ 7 Go, et la plus petite pile vidéo environ 61 Go. Un GPU de 24 Go peut contenir le petit modèle image si l’allocation GPU est relevée au-dessus du plancher de 4 Go. La pile vidéo ne tient ni sur ce GPU ni dans la limite de mémoire de l’application.

    Le dépôt amont est sous Apache-2.0. L’interface Studio livrée dans l’image inclut des composants AGPL-3.0.
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: Mot de passe initial d’Unsloth Studio pour l’utilisateur unsloth (8 caractères minimum). Utilisé uniquement au premier démarrage ; les modifications ultérieures ne remplacent pas le mot de passe enregistré dans les données de l’application.
- envName: JUPYTER_PASSWORD
  description: Mot de passe JupyterLab (8 caractères minimum)

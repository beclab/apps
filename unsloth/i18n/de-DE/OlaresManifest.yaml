metadata:
  title: Unsloth
  description: Lokale Oberfläche zum Ausführen und Trainieren offener Modelle
spec:
  upgradeDescription: |
    - Aktualisierung auf das offizielle Image unsloth/unsloth:nightly-2026.10.26. Nur NVIDIA-GPU-Installation; Hugging-Face-Endpunkt und Token aus den Systemeinstellungen.
    - Neu: geplante Prompts und wiederverwendbare Modellvorlagen. Scheduled über More in der Seitenleiste öffnen; Aufgaben laufen nur bei laufendem Studio. Vorlagen in der Modellauswahl speichern.

    **Entladen bei Inaktivität**

    Chatmodelle geben standardmäßig nach 5 Minuten Inaktivität GPU-Speicher frei, ohne Antworten zu unterbrechen oder Modelldateien zu löschen. Trainingsaufgaben bleiben unberührt.

    Unter Olares **Settings > Applications > Unsloth** `UNSLOTH_MODEL_IDLE_TTL` ändern: `300` bedeutet 5 Minuten; `0` deaktiviert das automatische Entladen als Standard. Aktivierte Werte müssen mindestens `60` Sekunden betragen. Änderungen starten die App neu. Gespeicherte Studio-Einstellungen haben Vorrang; **Keep model in GPU memory** verhindert das automatische Entladen.

    Zum manuellen Freigeben **Chat > Modellauswahl** öffnen und unten rechts **Eject model / Eject all** wählen.

    Upgrades behalten Modelldateien und Studio-Einstellungen bei. Modelle nach dem Dienstneustart erneut laden; ohne gespeicherte abweichende Einstellung gilt der Standard von 5 Minuten.
  fullDescription: |
    Unsloth Studio ist eine lokale Browseroberfläche zum Ausführen und Feinabstimmen offener Modelle. Dieses Paket enthält auch JupyterLab.

    Lade ein GGUF- oder Safetensors-Modell, unterhalte dich damit, bereite einen Datensatz mit Data Recipes vor, starte einen kurzen LoRA- oder QLoRA-Trainingslauf und exportiere einen Checkpoint nach GGUF. Studio und Jupyter fragen bei der Installation jeweils nach einem Passwort. Das Studio-Passwort wird beim ersten Start gespeichert und durch spätere Umgebungsänderungen nicht ersetzt.

    Für den GPU-Modus ist eine NVIDIA-GPU erforderlich. Dieses Paket unterstützt nur amd64. Bild- und Videomodelle in Studio sind groß: Der kleinste Bildstapel ist etwa 7 GB, der kleinste Videostapel etwa 61 GB. Eine 24-GB-GPU kann das kleine Bildmodell aufnehmen, wenn die GPU-Zuweisung über die Untergrenze von 4 GB angehoben wird. Der Videostapel passt weder auf diese GPU noch in das Speicherlimit der Anwendung.

    Das Upstream-Repository steht unter Apache-2.0. Die im Image enthaltene Studio-Oberfläche enthält AGPL-3.0-Komponenten.
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: Anfangspasswort für Unsloth Studio des Benutzers unsloth (mindestens 8 Zeichen). Wird nur beim ersten Start verwendet; spätere Änderungen ersetzen das in den Anwendungsdaten gespeicherte Passwort nicht.
- envName: JUPYTER_PASSWORD
  description: JupyterLab-Passwort (mindestens 8 Zeichen)

metadata:
  title: Unsloth
  description: Interfaccia locale per eseguire e addestrare modelli aperti
spec:
  upgradeDescription: |
    - Aggiornamento all’immagine ufficiale unsloth/unsloth:nightly-2026.10.26. Solo installazione con GPU NVIDIA; endpoint e token Hugging Face del sistema.
    - Novità: prompt pianificati e preset di esecuzione riutilizzabili. Aprire Scheduled da More nella barra laterale; le attività richiedono Studio in esecuzione. Salvare i preset nel selettore dei modelli.

    **Scaricamento per inattività**

    I modelli di chat liberano memoria GPU dopo 5 minuti di inattività per impostazione predefinita, senza interrompere risposte o eliminare file. L’addestramento non è interessato.

    In Olares **Settings > Applications > Unsloth**, modificare `UNSLOTH_MODEL_IDLE_TTL`: `300` significa 5 minuti; `0` disattiva lo scaricamento automatico predefinito; i valori attivi devono essere di almeno `60` secondi. Le modifiche riavviano l’app. Le impostazioni Studio salvate hanno la precedenza; **Keep model in GPU memory** impedisce lo scaricamento automatico.

    Per liberare memoria manualmente, aprire **Chat > selettore dei modelli** e scegliere **Eject model / Eject all** in basso a destra.

    Gli aggiornamenti conservano file e impostazioni Studio. Ricaricare i modelli dopo il riavvio; il valore predefinito di 5 minuti si applica salvo impostazioni salvate che lo sostituiscano.
  fullDescription: |
    Unsloth Studio è un’interfaccia browser locale per eseguire e affinare modelli aperti. Questo pacchetto include anche JupyterLab.

    Carica un modello GGUF o safetensors, conversa con esso, prepara un dataset con Data Recipes, avvia un breve addestramento LoRA o QLoRA ed esporta un checkpoint in GGUF. Studio e Jupyter chiedono una password durante l’installazione. La password di Studio viene salvata al primo avvio e le modifiche successive dell’ambiente non la sostituiscono.

    La modalità GPU richiede una GPU NVIDIA. Questo pacchetto supporta solo amd64. I modelli di immagine e video in Studio sono grandi: lo stack immagine più piccolo è di circa 7 GB e quello video di circa 61 GB. Una GPU da 24 GB può contenere il modello immagine piccolo se l’assegnazione GPU viene alzata sopra il minimo di 4 GB. Lo stack video non entra in questa GPU né nel limite di memoria dell’applicazione.

    Il repository upstream è Apache-2.0. L’interfaccia Studio inclusa nell’immagine contiene componenti AGPL-3.0.
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: Password iniziale di Unsloth Studio per l’utente unsloth (minimo 8 caratteri). Usata solo al primo avvio; le modifiche successive non sostituiscono la password salvata nei dati dell’applicazione.
- envName: JUPYTER_PASSWORD
  description: Password di JupyterLab (minimo 8 caratteri)

metadata:
  title: GitLab
  description: Ein webbasiertes Git-Repository-Management-Tool
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Der Standard-Benutzername für den Admin ist `root`.

    **ÜBERSICHT**
    GitLab ist eine Open-Source-End-to-End-Softwareentwicklungsplattform mit integrierter Versionskontrolle, Issue-Tracking, Code Review, CI/CD und mehr. Mit GitLab können Teams Code-Hosting, Versionskontrolle, Issue-Tracking, Continuous Integration und Deployment einfach handhaben.

    **FUNKTIONEN**
    Plan
    - GitLab ermöglicht Portfolioplanung und -verwaltung über Epics, Gruppen (Programme) und Meilensteine, um Fortschritte zu organisieren und zu verfolgen.

    Create
    - Mit GitLab können Sie Code und Projektdaten über leistungsstarke Branching-Tools erstellen, anzeigen und verwalten.

    Verify
    - GitLabs branchenführende CI-Funktionen ermöglichen automatisierte Tests, Static Analysis Security Testing, Dynamic Analysis Security Testing und Code-Qualitätsanalyse für schnelles Feedback an Entwickler und Tester.

    Package
    - Die private, sichere Container- und Package-Registry ist integriert und vorkonfiguriert, um nahtlos mit GitLab Source Code Management und CI/CD-Pipelines zu arbeiten.

    Secure
    - GitLab bietet Static Application Security Testing (SAST), Dynamic Application Security Testing (DAST), Container Scanning und Dependency Scanning, um sichere Anwendungen zusammen mit Lizenz-Compliance zu liefern.

    Deploy
    - Mit Zero-Touch Continuous Delivery (CD) direkt in der Pipeline können Deployments in mehrere Umgebungen wie Staging und Production automatisiert werden. Mit Feature Flags, integrierter Auditierung/Nachverfolgbarkeit und On-Demand-Umgebungen liefern Sie schneller und mit mehr Vertrauen.

    Monitor
    - Erhalten Sie Feedback und Tools, um Schwere und Häufigkeit von Incidents zu reduzieren, damit Sie Software häufig und mit Vertrauen freigeben können.

    Govern
    - GitLab hilft Nutzern, Sicherheitslücken, Richtlinien und Compliance in ihrer Organisation zu verwalten.
  upgradeDescription: |
    Hinweis zum Standard-Admin-Benutzernamen in der Beschreibung hinzugefügt.

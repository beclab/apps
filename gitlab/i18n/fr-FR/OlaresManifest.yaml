metadata:
  title: GitLab
  description: Un outil web de gestion de dépôts Git
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Le nom d’utilisateur admin par défaut est `root`.

    **APERÇU**
    GitLab est une plateforme open source de bout en bout pour le développement logiciel, avec contrôle de version, suivi des issues, revue de code, CI/CD et plus. Avec GitLab, les équipes gèrent facilement l’hébergement de code, le versionnement, le suivi des issues, l’intégration continue et le déploiement.

    **FONCTIONNALITÉS**
    Plan
    - GitLab permet la planification et la gestion de portefeuille via des epics, des groupes (programmes) et des jalons pour organiser et suivre les progrès.

    Create
    - Avec GitLab, vous pouvez créer, consulter et gérer le code et les données du projet grâce à de puissants outils de branching.

    Verify
    - Les capacités CI leaders de GitLab permettent des tests automatisés, le Static Analysis Security Testing, le Dynamic Analysis Security Testing et l’analyse de qualité du code pour un feedback rapide aux développeurs et testeurs.

    Package
    - Le registre privé et sécurisé de conteneurs et de packages est intégré et préconfiguré pour fonctionner sans friction avec la gestion du code source et les pipelines CI/CD de GitLab.

    Secure
    - GitLab fournit le Static Application Security Testing (SAST), le Dynamic Application Security Testing (DAST), le Container Scanning et le Dependency Scanning pour aider à livrer des applications sécurisées avec la conformité des licences.

    Deploy
    - Avec la Continuous Delivery (CD) zero-touch intégrée au pipeline, les déploiements peuvent être automatisés vers plusieurs environnements comme staging et production. Avec les feature flags, l’audit/traçabilité intégrés et les environnements à la demande, vous livrez plus vite et avec plus de confiance.

    Monitor
    - Obtenez du feedback et des outils pour réduire la gravité et la fréquence des incidents, afin de publier souvent avec confiance.

    Govern
    - GitLab aide les utilisateurs à gérer les vulnérabilités de sécurité, les politiques et la conformité dans leur organisation.
  upgradeDescription: |
    Ajout d’une note sur le nom d’utilisateur admin par défaut dans la description.

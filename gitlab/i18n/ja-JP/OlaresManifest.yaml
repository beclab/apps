metadata:
  title: GitLab
  description: Web ベースの Git リポジトリ管理ツール
spec:
  fullDescription: |
    **重要なお知らせ**
    管理者のデフォルトユーザー名は `root` です。

    **概要**
    GitLab は、バージョン管理、Issue 追跡、コードレビュー、CI/CD などを内蔵したオープンソースのエンドツーエンドソフトウェア開発プラットフォームです。GitLab により、チームはコードホスティング、バージョン管理、Issue 追跡、継続的インテグレーションとデプロイを容易に扱えます。

    **機能**
    Plan
    - GitLab はエピックス、グループ（プログラム）、マイルストーンによるポートフォリオ計画・管理で進捗を整理・追跡できます。

    Create
    - GitLab では強力なブランチングツールでコードとプロジェクトデータを作成・表示・管理できます。

    Verify
    - GitLab の業界をリードする CI 機能により、自動テスト、Static Analysis Security Testing、Dynamic Analysis Security Testing、コード品質分析で開発者・テスターへ迅速なフィードバックを提供します。

    Package
    - プライベートで安全なコンテナ／パッケージレジストリが組み込み済みで、GitLab のソースコード管理と CI/CD パイプラインとシームレスに連携するよう事前設定されています。

    Secure
    - GitLab は Static Application Security Testing（SAST）、Dynamic Application Security Testing（DAST）、Container Scanning、Dependency Scanning を提供し、ライセンスコンプライアンスとともに安全なアプリケーションの提供を支援します。

    Deploy
    - パイプラインに組み込まれたゼロタッチ Continuous Delivery（CD）により、ステージングや本番など複数環境へのデプロイを自動化できます。フィーチャーフラグ、組み込みの監査／トレーサビリティ、オンデマンド環境により、より速く自信を持ってデリバリーできます。

    Monitor
    - フィードバックとツールでインシデントの深刻度と頻度を下げ、自信を持って頻繁にソフトウェアをリリースできます。

    Govern
    - GitLab は組織全体のセキュリティ脆弱性、ポリシー、コンプライアンス管理を支援します。
  upgradeDescription: |
    説明にデフォルト管理者ユーザー名の注記を追加。

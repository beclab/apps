metadata:
  title: GitLab
  description: Una herramienta web de gestión de repositorios Git
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    El nombre de usuario de administrador por defecto es `root`.

    **RESUMEN**
    GitLab es una plataforma de desarrollo de software de código abierto de extremo a extremo con control de versiones, seguimiento de issues, code review, CI/CD y más. Con GitLab, los equipos pueden gestionar fácilmente el hosting de código, el control de versiones, el seguimiento de issues, la integración continua y el despliegue.

    **FUNCIONES**
    Plan
    - GitLab permite planificar y gestionar portfolios mediante épicas, grupos (programas) y hitos para organizar y seguir el progreso.

    Create
    - Con GitLab puedes crear, ver y gestionar código y datos del proyecto con potentes herramientas de branching.

    Verify
    - Las capacidades CI líderes de GitLab permiten pruebas automatizadas, Static Analysis Security Testing, Dynamic Analysis Security Testing y análisis de calidad de código para dar feedback rápido a desarrolladores y testers.

    Package
    - El registro privado y seguro de contenedores y paquetes viene integrado y preconfigurado para trabajar sin fricción con la gestión de código fuente y las pipelines CI/CD de GitLab.

    Secure
    - GitLab ofrece Static Application Security Testing (SAST), Dynamic Application Security Testing (DAST), Container Scanning y Dependency Scanning para ayudar a entregar aplicaciones seguras junto con cumplimiento de licencias.

    Deploy
    - Con Continuous Delivery (CD) zero-touch integrado en la pipeline, los despliegues pueden automatizarse a múltiples entornos como staging y producción. Con feature flags, auditoría/trazabilidad integrada y entornos bajo demanda, entregarás más rápido y con más confianza.

    Monitor
    - Obtén feedback y herramientas para reducir la severidad y la frecuencia de incidentes, de modo que puedas publicar software con frecuencia y confianza.

    Govern
    - GitLab ayuda a gestionar vulnerabilidades de seguridad, políticas y cumplimiento en toda la organización.
  upgradeDescription: |
    Se añadió una nota sobre el nombre de usuario de administrador por defecto en la descripción.

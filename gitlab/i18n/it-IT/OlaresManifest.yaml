metadata:
  title: GitLab
  description: Uno strumento web per la gestione di repository Git
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Il nome utente admin predefinito è `root`.

    **PANORAMICA**
    GitLab è una piattaforma open source end-to-end per lo sviluppo software con controllo di versione, issue tracking, code review, CI/CD e altro. Con GitLab i team gestiscono facilmente hosting del codice, versionamento, issue tracking, continuous integration e deployment.

    **FUNZIONALITÀ**
    Plan
    - GitLab abilita la pianificazione e la gestione del portfolio tramite epic, gruppi (programmi) e milestone per organizzare e monitorare i progressi.

    Create
    - Con GitLab puoi creare, visualizzare e gestire codice e dati di progetto con potenti strumenti di branching.

    Verify
    - Le capacità CI leader di settore di GitLab abilitano test automatici, Static Analysis Security Testing, Dynamic Analysis Security Testing e analisi della qualità del codice per feedback rapidi a sviluppatori e tester.

    Package
    - Il registry privato e sicuro di container e pacchetti è integrato e preconfigurato per lavorare senza attriti con la source code management e le pipeline CI/CD di GitLab.

    Secure
    - GitLab offre Static Application Security Testing (SAST), Dynamic Application Security Testing (DAST), Container Scanning e Dependency Scanning per aiutare a consegnare applicazioni sicure insieme alla compliance delle licenze.

    Deploy
    - Con Continuous Delivery (CD) zero-touch integrato nella pipeline, i deployment possono essere automatizzati su più ambienti come staging e production. Con feature flag, auditing/tracciabilità integrati e ambienti on-demand, consegnerai più velocemente e con più fiducia.

    Monitor
    - Ottieni feedback e strumenti per ridurre gravità e frequenza degli incidenti, così da rilasciare software spesso e con fiducia.

    Govern
    - GitLab aiuta gli utenti a gestire vulnerabilità di sicurezza, policy e compliance nella propria organizzazione.
  upgradeDescription: |
    Aggiunta nota sul nome utente admin predefinito nella descrizione.

metadata:
  title: AFFiNE
  description: Alternative open source à Notion, Miro et Airtable
spec:
  fullDescription: |
    AFFiNE est un espace de travail tout-en-un open source et un système d'exploitation pour tous les blocs de construction qui assemblent votre base de connaissances et bien plus — wiki, gestion des connaissances, présentation et assets numériques.
    C'est une meilleure alternative à Notion et Miro.
    
    **Fonctionnalités**
    Un vrai canevas pour des blocs sous toutes les formes. Docs et tableau blanc sont désormais entièrement fusionnés.
    - De nombreuses apps d'édition prétendent être un canevas de productivité, mais AFFiNE est l'une des rares qui vous permet de placer n'importe quel bloc de construction sur un canevas sans bords — texte enrichi, notes adhésives, pages web intégrées, bases de données multi-vues, pages liées, formes et même diapositives. Nous avons tout.
    
    Partenaire IA multimodal prêt pour tout travail
    - Rédiger un rapport professionnel ? Transformer un plan en diapositives expressives et présentables ? Résumer un article en mindmap bien structurée ? Trier votre plan de travail et backlog de tâches ? Ou... dessiner et coder des prototypes d'apps et de pages web directement avec un seul prompt ? Avec vous, AFFiNE AI pousse votre créativité aux limites de votre imagination.
    
    Local-first et collaboration en temps réel
    - Nous aimons l'idée du local-first : vous possédez toujours vos données sur votre disque, malgré le cloud. De plus, AFFiNE prend en charge la sync et les collaborations en temps réel sur le web et les clients multiplateformes.
    - Note : la collaboration multi-utilisateurs n'est pas encore prise en charge sur AFFiNE auto-hébergé.
  upgradeDescription: |
    Mettre à jour AFFiNE vers v0.27.2 ; déplacer `DATABASE_URL` dans un Kubernetes Secret (`secretKeyRef`).
    
    **Notes Chart / déploiement :**
    - Image : `beclab/toeverything-affine:0.25.7` → `0.27.2`
    - Commande de démarrage inchangée (`self-host-predeploy.js` Job de migration + serveur sur le port 3010)
    - Environnement runtime maintenu compatible avec le compose self-host officiel : `DATABASE_URL`, `REDIS_SERVER_HOST`, `AFFINE_INDEXER_ENABLED`, plus `AFFINE_SERVER_HOST` / `AFFINE_SERVER_HTTPS` pour le domaine d'entrée Olares
    - `DATABASE_URL` utilise `sslmode=disable` pour le Postgres système Olares (sinon le TLS BackendRuntime 0.27 rejette les certificats peer du middleware)
    - À partir du serveur 0.27, env n'est plus la source de configuration préférée pour certains réglages ; préférez Admin Panel ou `config.json` sous le volume de config pour les options avancées (voir https://docs.affine.pro/self-host-affine/install/configuration)
    - Compatibilité client/serveur : serveur 0.27+ nécessite clients >= 0.26 ; clients 0.27+ nécessitent serveur >= 0.27
    
    **Points forts upstream v0.27.2 :**
    - Client natif : corriger la perte possible de l'état de connexion
    - Backend : corriger les requêtes MCP potentiellement interceptées par accident
    
    Notes de version complètes : https://github.com/toeverything/AFFiNE/releases/tag/v0.27.2

metadata:
  title: AFFiNE
  description: Open-Source-Alternative zu Notion, Miro und Airtable
spec:
  fullDescription: |
    AFFiNE ist ein quelloffener All-in-One-Arbeitsbereich und ein Betriebssystem für alle Bausteine, die Ihre Wissensbasis und mehr zusammensetzen – Wiki, Wissensmanagement, Präsentation und digitale Assets.
    Es ist eine bessere Alternative zu Notion und Miro.
    
    **Funktionen**
    Eine echte Leinwand für Blöcke in jeder Form. Docs und Whiteboard sind jetzt vollständig zusammengeführt.
    - Viele Editor-Apps behaupten, eine Produktivitäts-Leinwand zu sein, aber AFFiNE gehört zu den wenigen, die es erlauben, jeden Baustein auf eine randlose Leinwand zu legen – Rich Text, Haftnotizen, eingebettete Webseiten, Multi-View-Datenbanken, verlinkte Seiten, Formen und sogar Folien. Wir haben alles.
    
    Multimodaler KI-Partner, bereit für jede Arbeit
    - Professionellen Arbeitsbericht schreiben? Eine Gliederung in ausdrucksstarke und präsentierbare Folien verwandeln? Einen Artikel in eine gut strukturierte Mindmap zusammenfassen? Jobplan und Aufgaben-Backlog sortieren? Oder... Prototypen von Apps und Webseiten direkt mit einem Prompt zeichnen und codieren? Mit Ihnen bringt AFFiNE AI Ihre Kreativität an den Rand Ihrer Vorstellungskraft.
    
    Local-first & Echtzeit-kollaborativ
    - Wir lieben die Idee von local-first, dass Sie Ihre Daten immer auf Ihrer Festplatte besitzen, trotz der Cloud. Darüber hinaus unterstützt AFFiNE Echtzeit-Sync und Kollaboration im Web und auf plattformübergreifenden Clients.
    - Hinweis: Mehrbenutzer-Kollaboration wird auf selbst gehostetem AFFiNE noch nicht unterstützt.
  upgradeDescription: |
    AFFiNE auf v0.27.2 aktualisieren; `DATABASE_URL` in Kubernetes Secret (`secretKeyRef`) verschieben.
    
    **Chart- / Deploy-Hinweise:**
    - Image: `beclab/toeverything-affine:0.25.7` → `0.27.2`
    - Startup-Befehl unverändert (`self-host-predeploy.js` Migrations-Job + Server auf Port 3010)
    - Runtime-Umgebung kompatibel mit offiziellem Self-Host-Compose gehalten: `DATABASE_URL`, `REDIS_SERVER_HOST`, `AFFINE_INDEXER_ENABLED`, plus `AFFINE_SERVER_HOST` / `AFFINE_SERVER_HTTPS` für die Olares-Entrance-Domain
    - `DATABASE_URL` verwendet `sslmode=disable` für Olares-System-Postgres (0.27 BackendRuntime TLS lehnt sonst Middleware-Peer-Zertifikate ab)
    - Ab Server 0.27 ist Env nicht mehr die bevorzugte Konfigurationsquelle für einige Einstellungen; bevorzugen Sie Admin Panel oder `config.json` unter dem Config-Volume für erweiterte Optionen (siehe https://docs.affine.pro/self-host-affine/install/configuration)
    - Client/Server-Kompatibilität: Server 0.27+ erfordert Clients >= 0.26; Clients 0.27+ erfordern Server >= 0.27
    
    **Upstream v0.27.2 Highlights:**
    - Native Client: Fix, dass Login-Status verloren gehen kann
    - Backend: Fix, dass MCP-Anfragen versehentlich abgefangen werden können
    
    Vollständige Release Notes: https://github.com/toeverything/AFFiNE/releases/tag/v0.27.2

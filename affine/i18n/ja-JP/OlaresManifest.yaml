metadata:
  title: AFFiNE
  description: Notion、Miro、Airtable のオープンソース代替
spec:
  fullDescription: |
    AFFiNE は、ナレッジベースなどを組み立てるすべてのビルディングブロックのためのオープンソース・オールインワンワークスペース兼オペレーティングシステムです — wiki、ナレッジマネジメント、プレゼンテーション、デジタルアセット。
    Notion と Miro のより良い代替です。
    
    **機能**
    あらゆる形式のブロックのための真のキャンバス。Docs とホワイトボードが完全に統合されました。
    - 多くのエディターアプリが生産性キャンバスを自称しますが、AFFiNE はエッジレスキャンバスにリッチテキスト、付箋、埋め込み Web ページ、マルチビューデータベース、リンクページ、図形、さらにはスライドなど、あらゆるビルディングブロックを置ける数少ないもののひとつです。すべて揃っています。
    
    あらゆる仕事にすぐ使えるマルチモーダル AI パートナー
    - プロの業務レポートを書く？アウトラインを表現力あるプレゼン可能なスライドに変える？記事を構造化されたマインドマップに要約する？仕事計画とタスクのバックログを整理する？あるいは…ひとつのプロンプトでアプリや Web ページのプロトタイプを描いてコードする？あなたと一緒に、AFFiNE AI は創造性を想像の限界まで押し上げます。
    
    ローカルファースト＆リアルタイム共同編集
    - クラウドがあってもディスク上のデータを常に所有するローカルファーストの考え方を大切にしています。さらに AFFiNE は Web およびクロスプラットフォームクライアントでのリアルタイム同期と共同作業をサポートします。
    - 注意: セルフホスト版 AFFiNE ではマルチユーザー共同編集はまだサポートされていません。
  upgradeDescription: |
    AFFiNE を 0.27.2 から 0.27.4 に更新します。サーバー側のガベージコレクションのメモリ使用量を修正し、録音の安定性を改善し、ジャーナルとコードブロックの問題を修正します。実験的な BYOK 設定は更新後に再設定が必要になる場合があります。

    https://github.com/toeverything/AFFiNE/releases/tag/v0.27.4

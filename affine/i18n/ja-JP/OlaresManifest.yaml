metadata:
  title: AFFiNE
  description: Notion、Miro、Airtable のオープンソース代替
spec:
  fullDescription: |
    AFFiNE は、ナレッジベースなどを組み立てるすべてのビルディングブロックのためのオープンソース・オールインワンワークスペース兼オペレーティングシステムです — wiki、ナレッジマネジメント、プレゼンテーション、デジタルアセット。
    Notion と Miro のより良い代替です。
    
    **機能**
    あらゆる形式のブロックのための真のキャンバス。Docs とホワイトボードが完全に統合されました。
    - 多くのエディターアプリが生産性キャンバスを自称しますが、AFFiNE はエッジレスキャンバスにリッチテキスト、付箋、埋め込み Web ページ、マルチビューデータベース、リンクページ、図形、さらにはスライドなど、あらゆるビルディングブロックを置ける数少ないもののひとつです。すべて揃っています。
    
    あらゆる仕事にすぐ使えるマルチモーダル AI パートナー
    - プロの業務レポートを書く？アウトラインを表現力あるプレゼン可能なスライドに変える？記事を構造化されたマインドマップに要約する？仕事計画とタスクのバックログを整理する？あるいは…ひとつのプロンプトでアプリや Web ページのプロトタイプを描いてコードする？あなたと一緒に、AFFiNE AI は創造性を想像の限界まで押し上げます。
    
    ローカルファースト＆リアルタイム共同編集
    - クラウドがあってもディスク上のデータを常に所有するローカルファーストの考え方を大切にしています。さらに AFFiNE は Web およびクロスプラットフォームクライアントでのリアルタイム同期と共同作業をサポートします。
    - 注意: セルフホスト版 AFFiNE ではマルチユーザー共同編集はまだサポートされていません。
  upgradeDescription: |
    AFFiNE を v0.27.2 にアップグレード；`DATABASE_URL` を Kubernetes Secret（`secretKeyRef`）へ移動。
    
    **Chart / デプロイメモ:**
    - イメージ: `beclab/toeverything-affine:0.25.7` → `0.27.2`
    - 起動コマンドは変更なし（`self-host-predeploy.js` 移行 Job + ポート 3010 のサーバー）
    - ランタイム環境は公式セルフホスト compose と互換を維持: `DATABASE_URL`、`REDIS_SERVER_HOST`、`AFFINE_INDEXER_ENABLED`、加えて Olares エントランスドメイン用の `AFFINE_SERVER_HOST` / `AFFINE_SERVER_HTTPS`
    - `DATABASE_URL` は Olares システム Postgres 向けに `sslmode=disable` を使用（そうしないと 0.27 BackendRuntime TLS がミドルウェアのピア証明書を拒否）
    - サーバー 0.27 以降、一部設定では env が推奨の設定源ではなくなりました；詳細オプションは Admin Panel または設定ボリューム配下の `config.json` を推奨（https://docs.affine.pro/self-host-affine/install/configuration 参照）
    - クライアント／サーバー互換性: サーバー 0.27+ はクライアント >= 0.26 が必要；クライアント 0.27+ はサーバー >= 0.27 が必要
    
    **Upstream v0.27.2 ハイライト:**
    - ネイティブクライアント: ログイン状態が失われる可能性を修正
    - バックエンド: MCP リクエストが誤ってインターセプトされる可能性を修正
    
    完全なリリースノート: https://github.com/toeverything/AFFiNE/releases/tag/v0.27.2

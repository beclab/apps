  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3B è un modello visivo-linguistico del team Qwen di Alibaba per la generazione di testo, la comprensione delle immagini, il ragionamento e le chiamate a strumenti nelle applicazioni compatibili. Usa un'architettura Mixture-of-Experts con 35 miliardi di parametri totali, di cui circa 3 miliardi attivi per token. Questa app esegue localmente l'edizione NVFP4 quantizzata a 4 bit di NVIDIA.

    FreeToken è il motore di inferenza di FlashML per eseguire modelli Mixture-of-Experts su hardware personale. Mantiene i pesi degli esperti nella memoria di sistema e ne conserva una parte nella cache della GPU, riducendo la necessità di caricare l'intero modello nella memoria della GPU. Model Console collega il motore a Olares e permette di scaricare il modello, verificarne lo stato e regolare le impostazioni.

    Questa edizione accetta testo e immagini, con un limite di contesto predefinito di 131.072 token e una richiesta in esecuzione alla volta. Il contesto disponibile dipende dalla memoria e dalle impostazioni del motore.

    Il primo avvio scarica circa 23,5 GB di file del modello e li converte nel formato di pesi riutilizzabile di FreeToken. Prevedere spazio di archiviazione e tempo di preparazione aggiuntivi per la conversione. Questa configurazione richiede una GPU NVIDIA con 23 GiB di memoria GPU disponibile, la memoria di sistema indicata nei requisiti delle risorse e un driver NVIDIA R580 o successivo.

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

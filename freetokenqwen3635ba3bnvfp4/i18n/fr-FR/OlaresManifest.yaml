metadata:
  description: "FreeToken pour exécuter Qwen3.6-35B-A3B : texte, compréhension d’images et appels d’outils"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3B est un modèle vision-langage de l'équipe Qwen d'Alibaba pour la génération de texte, la compréhension d'images, la réflexion et les appels d'outils dans les applications compatibles. Son architecture à mélange d'experts compte 35 milliards de paramètres, dont environ 3 milliards actifs par token. Cette application exécute localement l'édition quantifiée NVFP4 sur 4 bits de NVIDIA.

    FreeToken est le moteur d'inférence de FlashML pour exécuter des modèles à mélange d'experts sur du matériel personnel. Il conserve les poids des experts en mémoire système et en met une partie en cache sur le GPU, limitant le besoin de charger tout le modèle en mémoire GPU. Model Console relie le moteur à Olares et permet de télécharger le modèle, de consulter son état et d'ajuster les réglages.

    Cette édition accepte du texte et des images, avec une limite de contexte par défaut de 131 072 tokens et une seule requête en cours d'exécution. Le contexte disponible dépend de la mémoire et des réglages du moteur.

    Le premier démarrage télécharge environ 23,5 GB de fichiers de modèle et les convertit au format de poids réutilisable de FreeToken. Prévoyez du stockage et du temps de préparation supplémentaires pour cette conversion. Ce préréglage nécessite un GPU NVIDIA avec 23 GiB de mémoire GPU disponible, la mémoire système indiquée dans les exigences de ressources et un pilote NVIDIA R580 ou ultérieur.

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

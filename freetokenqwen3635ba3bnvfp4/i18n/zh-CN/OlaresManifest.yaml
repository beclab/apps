metadata:
  description: "FreeToken 驱动的 Qwen3.6-35B-A3B，支持文本生成、图像理解和工具调用"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3B 是阿里巴巴 Qwen 团队推出的视觉语言模型，可在兼容应用中用于文本生成、图像理解、思考和工具调用。它采用混合专家架构，总参数量为 350 亿，每个 token 约激活 30 亿参数。本应用在本地运行 NVIDIA 的 4 位 NVFP4 量化版本。

    FreeToken 是 FlashML 开发的推理引擎，用于在个人硬件上运行混合专家模型。它将专家权重保存在系统内存中，并在 GPU 上缓存当前使用的一部分权重，减少对完整模型装入显存的需求。Model Console 将引擎接入 Olares，可用于下载模型、查看状态和调整设置。

    本版本接受文本和图像输入，默认上下文上限为 131,072 个 token，同一时间运行一个请求。可用上下文取决于内存和引擎设置。

    首次启动会下载约 23.5 GB 的模型文件，并转换为 FreeToken 可复用的权重格式。请为转换预留额外存储空间和准备时间。此预设需要具有 23 GiB 可用显存的 NVIDIA GPU、资源要求中列出的系统内存，以及 R580 或更新版本的 NVIDIA 驱动。

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

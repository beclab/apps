metadata:
  description: "FreeToken-powered Qwen3.6-35B-A3B for text, image understanding, and tool calling"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3B is a vision-language model from Alibaba's Qwen team for text generation, image understanding, thinking, and tool calling in compatible applications. It uses a Mixture-of-Experts architecture with 35 billion parameters in total and about 3 billion active per token. This app runs NVIDIA's 4-bit NVFP4 quantized edition locally.

    FreeToken is FlashML's inference engine for running Mixture-of-Experts models on personal hardware. It keeps expert weights in system memory and caches a working set on the GPU, reducing the need to fit the whole model in GPU memory. Model Console connects the engine to Olares and lets you download the model, check its status, and adjust settings.

    This edition accepts text and images, with a default context limit of 131,072 tokens and one running request at a time. Available context depends on memory and engine settings.

    First startup downloads about 23.5 GB of model files and converts them to FreeToken's reusable weight format. Allow additional storage and preparation time for this conversion. The preset requires an NVIDIA GPU with 23 GiB of available GPU memory, system memory as listed in the resource requirements, and an NVIDIA R580 or newer driver.

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

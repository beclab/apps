metadata:
  description: "FreeTokenで動くQwen3.6-35B-A3Bによるテキスト生成・画像理解・ツール呼び出し"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3Bは、AlibabaのQwenチームによる視覚言語モデルです。対応するアプリでテキスト生成、画像理解、思考機能、ツール呼び出しを利用できます。Mixture-of-Experts構造を採用し、総パラメータ数は350億、トークンごとに約30億が有効になります。このアプリはNVIDIAの4ビットNVFP4量子化版をローカルで実行します。

    FreeTokenは、個人のハードウェアでMixture-of-Expertsモデルを実行するためのFlashMLの推論エンジンです。エキスパートの重みをシステムメモリに保持し、使用する一部をGPUにキャッシュすることで、モデル全体をGPUメモリに載せる必要性を減らします。Model Consoleを通じてOlaresに接続し、モデルのダウンロード、状態の確認、設定の調整を行えます。

    この構成はテキストと画像を入力でき、標準のコンテキスト上限は131,072トークンです。同時に実行するリクエストは1件です。利用できるコンテキストはメモリとエンジン設定に依存します。

    初回起動時に約23.5 GBのモデルファイルをダウンロードし、FreeTokenの再利用可能な重み形式に変換します。変換のための追加ストレージと準備時間を確保してください。この構成には、23 GiBの空きGPUメモリがあるNVIDIA GPU、リソース要件に記載されたシステムメモリ、R580以降のNVIDIAドライバが必要です。

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

metadata:
  description: "FreeToken-basierte Qwen3.6-35B-A3B-Inferenz für Text, Bildverständnis und Werkzeugaufrufe"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3B ist ein Vision-Language-Modell des Qwen-Teams von Alibaba für Textgenerierung, Bildverständnis, Denkprozesse und Werkzeugaufrufe in kompatiblen Anwendungen. Seine Mixture-of-Experts-Architektur umfasst 35 Milliarden Parameter, von denen etwa 3 Milliarden pro Token aktiv sind. Diese App führt NVIDIAs mit 4 Bit quantisierte NVFP4-Ausgabe lokal aus.

    FreeToken ist die Inferenz-Engine von FlashML für Mixture-of-Experts-Modelle auf eigener Hardware. Sie hält die Expertengewichte im Arbeitsspeicher und speichert einen benötigten Teil auf der GPU zwischen. Dadurch muss nicht das gesamte Modell in den GPU-Speicher passen. Model Console verbindet die Engine mit Olares und ermöglicht das Herunterladen des Modells, Statusabfragen und Einstellungsänderungen.

    Diese Ausgabe akzeptiert Text und Bilder, mit einer standardmäßigen Kontextgrenze von 131.072 Tokens und jeweils einer laufenden Anfrage. Der nutzbare Kontext hängt vom Speicher und den Engine-Einstellungen ab.

    Beim ersten Start werden etwa 23,5 GB Modelldateien heruntergeladen und in das wiederverwendbare Gewichtsformat von FreeToken konvertiert. Planen Sie zusätzlichen Speicherplatz und Vorbereitungszeit ein. Diese Voreinstellung benötigt eine NVIDIA-GPU mit 23 GiB verfügbarem GPU-Speicher, den in den Ressourcenanforderungen angegebenen Arbeitsspeicher und einen NVIDIA-Treiber ab R580.

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

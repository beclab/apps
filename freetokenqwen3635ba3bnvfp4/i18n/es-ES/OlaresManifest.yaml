metadata:
  description: "FreeToken como motor de Qwen3.6-35B-A3B para texto, comprensión de imágenes y uso de herramientas"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    Qwen3.6-35B-A3B es un modelo de visión y lenguaje del equipo Qwen de Alibaba para generar texto, comprender imágenes, razonar y usar herramientas en aplicaciones compatibles. Su arquitectura de mezcla de expertos tiene 35 mil millones de parámetros, con unos 3 mil millones activos por token. Esta aplicación ejecuta localmente la edición cuantizada NVFP4 de 4 bits de NVIDIA.

    FreeToken es el motor de inferencia de FlashML para ejecutar modelos de mezcla de expertos en equipos personales. Mantiene los pesos de los expertos en la memoria del sistema y almacena una parte en caché en la GPU, reduciendo la necesidad de cargar todo el modelo en la memoria de la GPU. Model Console conecta el motor a Olares y permite descargar el modelo, consultar su estado y ajustar la configuración.

    Esta edición admite texto e imágenes, con un límite de contexto predeterminado de 131.072 tokens y una solicitud en ejecución a la vez. El contexto disponible depende de la memoria y de la configuración del motor.

    El primer inicio descarga unos 23,5 GB de archivos del modelo y los convierte al formato de pesos reutilizable de FreeToken. Reserva almacenamiento y tiempo de preparación adicionales para la conversión. Este ajuste requiere una GPU NVIDIA con 23 GiB de memoria GPU disponible, la memoria del sistema indicada en los requisitos de recursos y un controlador NVIDIA R580 o posterior.

    [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) · [NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4) · [FreeToken](https://github.com/FlashML-org/FreeToken)

# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   freetokenqwen3635ba3bnvfp4 — engine Deployment (== appid / Release.Name)
#   llminit                    — llm-init / entrance Deployment
workloads:
  llminit:
    replicaCount: 1
  freetokenqwen3635ba3bnvfp4:
    replicaCount: 1

freetoken:
  cpuThreads: 4
  ftw:
    # Convert once before serving; reuse the persistent checkpoint on restarts.
    # Disable to use the original HF safetensors directory directly.
    enabled: true

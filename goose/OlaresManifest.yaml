olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: goose
  appid: goose
  title: Goose
  description: Personal AI agent backend for the native Goose Desktop client
  icon: https://cdn.olares.com/images/2026/10/d8a31384f33cc332763a33e320c63306.png
  version: 0.0.13
  categories: [Developer Tools, Productivity_v112, agents]
entrances:
  - name: gooseapi
    host: goose
    port: 3000
    title: Goose ACP
    icon: https://cdn.olares.com/images/2026/10/d8a31384f33cc332763a33e320c63306.png
    authLevel: internal
    invisible: true
  - name: terminal
    host: terminal
    port: 80
    title: Goose Terminal
    icon: https://cdn.olares.com/images/2026/10/d8a31384f33cc332763a33e320c63306.png
    openMethod: window
    authLevel: private
spec:
  versionName: '1.54.0'
  submitter: Olares
  locale: [en-US, zh-CN, de-DE, fr-FR, es-ES, it-IT, ja-JP]
  featuredImage: https://cdn.olares.com/images/2026/10/199d1b7234f47bc3a3643959a5e08b0f.png
  promoteImage:
    - https://cdn.olares.com/images/2026/10/199d1b7234f47bc3a3643959a5e08b0f.png
    - https://cdn.olares.com/images/2026/10/35a5c39b9cb38f77b3e6c5b20a623b9d.png
  runAsUser: true
  fullDescription: |
    Goose is an open-source AI agent for code, research, writing and workflows. This application runs the agent backend on Olares while you use the native Goose Desktop client on your computer.

    Features
    - Connect Goose Desktop to your Olares-hosted agent through ACP.
    - Keep configuration, sessions, Recipes and task output in persistent application storage.
    - Connect supported model providers, OpenAI-compatible endpoints and MCP extensions.
    - Use the management terminal for CLI conversations and configuration.

    Getting started
    1. Install Goose Desktop 1.54.0 on your computer and connect to your Olares network.
    2. Open Goose Terminal and run: printenv GOOSE_SERVER__SECRET_KEY
    3. Find the Goose ACP entrance URL in Olares Settings. In Desktop Settings > goose Server, enable the external server and enter its HTTPS URL and secret key. Set the remote working directory to /config/workspace.
    4. AI Router's default chat model is configured by default. To use other third-party models, change the application environment variables.

    Tasks execute on Olares and can be accessed through Goose Desktop on your computer or the built-in Goose Terminal. You can enable access to Home and External directories in the application environment variables to work with files stored there.
  website: https://goose-docs.ai/
  sourceCode: https://github.com/aaif-goose/goose
  developer: AAIF
  license:
    - {text: Apache-2.0, url: 'https://github.com/aaif-goose/goose/blob/main/LICENSE'}
  requiredCpu: 120m
  limitedCpu: '3'
  requiredMemory: 456Mi
  limitedMemory: 3Gi
  requiredDisk: 1Gi
  limitedDisk: 30Gi
  supportArch: [amd64, arm64]
permission:
  appData: true
  appCache: true
  userData: [Home]
  externalData: true
options:
  apiTimeout: 0
  dependencies:
    - {name: olares, type: system, version: '>=1.12.7-0'}
    - {name: router, type: application, version: '>=1.0.0'}
workloadReplicas:
  goose: 1
  terminal: 1
envs:
  - envName: TIMEZONE
    required: true
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_TIMEZONE
    description: Time zone inherited from your Olares settings.
  - {envName: GOOSE_DISABLE_SESSION_NAMING, type: bool, required: false, editable: true, applyOnChange: true, default: 'true', description: 'Disable automatic session titles to avoid concurrent title and chat requests. Set false to enable automatic titles.'}
  - {envName: GOOSE_PROVIDER, type: string, required: false, editable: true, applyOnChange: true, default: 'custom_olares_router', description: 'Defaults to AI Router. For third-party models, select a provider such as openai or anthropic and configure its endpoint and API key.'}
  - {envName: GOOSE_MODEL, type: string, required: false, editable: true, applyOnChange: true, default: 'default-chat', description: 'AI Router default chat model, or the model name for your selected third-party provider.'}
  - {envName: OPENAI_HOST, type: string, required: false, editable: true, applyOnChange: true, default: '', description: 'OpenAI-compatible server root URL without /v1.'}
  - {envName: OPENAI_BASE_PATH, type: string, required: false, editable: true, applyOnChange: true, default: 'v1/chat/completions', description: 'Chat completions request path.'}
  - {envName: OPENAI_API_KEY, type: password, required: false, editable: true, applyOnChange: true, default: '', description: 'OpenAI or gateway API key.'}
  - {envName: ANTHROPIC_API_KEY, type: password, required: false, editable: true, applyOnChange: true, default: '', description: 'Anthropic API key.'}
  - {envName: ALLOW_HOME_DIR_ACCESS, type: bool, required: false, editable: true, applyOnChange: true, default: 'false', description: 'Grant Home access at /config/Home.'}
  - {envName: ALLOW_EXTERNAL_DIR_ACCESS, type: bool, required: false, editable: true, applyOnChange: true, default: 'false', description: 'Grant External access at /config/External.'}

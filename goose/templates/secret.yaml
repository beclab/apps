{{- $oe := .Values.olaresEnv | default dict -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "goose-server" -}}
apiVersion: v1
kind: Secret
metadata:
  name: goose-server
  namespace: {{ .Release.Namespace | quote }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "server-key") }}
  server-key: {{ index $existing.data "server-key" | quote }}
  {{- else }}
  server-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- range $key := list "OPENAI_API_KEY" "ANTHROPIC_API_KEY" }}
  {{- with index $oe $key }}
  {{ $key }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}

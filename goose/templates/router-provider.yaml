apiVersion: v1
kind: ConfigMap
metadata:
  name: goose-router-provider
  namespace: {{ .Release.Namespace | quote }}
data:
  custom_olares_router.json: |
    {
      "name": "custom_olares_router",
      "engine": "openai",
      "display_name": "AI Router",
      "description": "Olares AI Router",
      "base_url": {{ printf "https://router.%s/v1/chat/completions" .Values.user.zone | toJson }},
      "api_key_env": "GOOSE_ROUTER_API_KEY",
      "models": [{"name": "default-chat", "context_limit": 131072}],
      "supports_streaming": true,
      "requires_auth": false
    }

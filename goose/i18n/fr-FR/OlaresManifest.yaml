metadata:
  title: Goose
  description: "Backend personnel d’agent IA pour le client natif Goose Desktop"
spec:
  fullDescription: |
    Goose est un agent IA open source pour le développement, la recherche, la rédaction et les workflows. Cette application exécute le backend de l’agent sur Olares, tandis que tu utilises le client natif Goose Desktop sur ton ordinateur.

    Fonctionnalités
    - Connecter Goose Desktop à ton agent hébergé sur Olares via ACP.
    - Conserver la configuration, les sessions, les Recipes et les résultats dans le stockage persistant de l’application.
    - Connecter les fournisseurs de modèles pris en charge, les interfaces compatibles OpenAI et les extensions MCP.
    - Utiliser le terminal d’administration pour les conversations en ligne de commande et la configuration.

    Premiers pas
    1. Installer Goose Desktop 1.54.0 sur ton ordinateur et te connecter au réseau Olares.
    2. Ouvrir Goose Terminal et exécuter : printenv GOOSE_SERVER__SECRET_KEY
    3. Trouver l’URL de l’entrée Goose ACP dans les paramètres Olares. Dans Settings > goose Server du client, activer le serveur externe, saisir son URL HTTPS et sa clé de connexion, puis définir /config/workspace comme dossier de travail distant.
    4. Le modèle de chat par défaut d’AI Router est préconfiguré. Pour utiliser d’autres modèles tiers, modifie les variables d’environnement de l’application.

    Les tâches s’exécutent sur Olares. Tu peux utiliser Goose Desktop sur ton ordinateur ou le Goose Terminal intégré. Les variables d’environnement de l’application permettent d’activer l’accès aux répertoires Home et External pour travailler avec les fichiers qui y sont stockés.

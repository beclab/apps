metadata:
  title: Goose
  description: "供 Goose Desktop 客户端连接的个人 AI 智能体后端"
spec:
  fullDescription: |
    Goose 是用于编程、调研、写作和工作流的开源 AI 智能体。本应用在 Olares 上运行智能体后端，你可以通过电脑上的原生 Goose Desktop 客户端使用它。

    功能
    - 通过 ACP 将 Goose Desktop 连接到 Olares 上的智能体。
    - 将配置、会话、Recipes 和任务产出保存在持久化应用存储中。
    - 连接受支持的模型服务商、OpenAI 兼容接口和 MCP 扩展。
    - 使用管理终端进行命令行对话和配置。

    开始使用
    1. 在电脑上安装 Goose Desktop 1.54.0，并连接到 Olares 网络。
    2. 打开 Goose Terminal，运行：printenv GOOSE_SERVER__SECRET_KEY
    3. 在 Olares 设置中找到 Goose ACP 入口地址。在客户端 Settings > goose Server 中启用外部服务器，填写 HTTPS 地址和连接密钥，并将远程工作目录设为 /config/workspace。
    4. 默认使用 AI Router 的默认聊天模型。如需使用其他第三方模型，可在应用环境变量中修改配置。

    任务在 Olares 上执行，可通过电脑上的 Goose Desktop 客户端或应用内的 Goose Terminal 使用。你可以在应用环境变量中开启 Home 和 External 目录访问，处理其中的文件。

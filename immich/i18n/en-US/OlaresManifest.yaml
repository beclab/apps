metadata:
  title: Immich
  description: High performance self-hosted photo and video management solution.
spec:
  fullDescription: |
    **OVERVIEW**
    Immich is a self-hosted photo and video management solution that allows you to back up your precious memories directly from your mobile phone.

    Here are some key features:
    **Web Portal and Mobile App**
    Immich provides a user-friendly web interface and a mobile app for both iOS and Android. You can easily browse, organize, and manage your media files.

    **Automatic Backup**
    Immich ensures that your photos and videos are automatically backed up, just like Google Photos. Say goodbye to manual uploads!

    **Bulk Upload**
    Need to transfer a large batch of files? Immich supports bulk uploads, making it efficient to migrate your existing media.

    **Partner Sharing**
    Share specific albums or memories with friends and family. Immich lets you collaborate and reminisce together.

    **Facial Recognition**
    Immich can recognize faces in your photos, making it easier to find specific people or moments.

    **Reverse Geocoding**
    Wondering where a particular photo was taken? Immich adds location information to your media.

  upgradeDescription: |
    Upgrade Immich from v3.2.0 to v3.3.5 with people sharing, birthday memories, image quality improvements, and security fixes.

    Highlights:
    - Shared people management: share people with other users in the same cluster group and collaborate on names and birth dates.
    - Birthday memories: revisit photos of a person on their birthday.
    - Higher-quality thumbnails and previews: more accurate image resampling improves detail and brightness. Regenerate existing thumbnails to apply the improvements.
    - New OCR models: multilingual PP-OCRv6 models offer different performance and accuracy options.
    - Security updates: certificate trust fixes and Node.js security patches.

    NAS upload storage:
    The optional UPLOAD_LOCATION setting selects where Immich stores uploaded media. Leave it empty for default local storage, or specify an NFS or SMB folder already mounted in Olares to store uploads directly on NAS. The database remains in Olares.

    Release notes:
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

metadata:
  title: Immich
  description: High performance self-hosted photo and video management solution.
spec:
  fullDescription: |
    **OVERVIEW**
    Immich is a self-hosted photo and video management solution that allows you to back up your precious memories directly from your mobile phone.

    Here are some key features:
    **Web Portal and Mobile App**
    Immich provides a user-friendly web interface and a mobile app for both iOS and Android. You can easily browse, organize, and manage your media files.

    **Automatic Backup**
    Immich ensures that your photos and videos are automatically backed up, just like Google Photos. Say goodbye to manual uploads!

    **Bulk Upload**
    Need to transfer a large batch of files? Immich supports bulk uploads, making it efficient to migrate your existing media.

    **Partner Sharing**
    Share specific albums or memories with friends and family. Immich lets you collaborate and reminisce together.

    **Facial Recognition**
    Immich can recognize faces in your photos, making it easier to find specific people or moments.

    **Reverse Geocoding**
    Wondering where a particular photo was taken? Immich adds location information to your media.

  upgradeDescription: |
    For users who sign in only with Olares single sign-on (OIDC): this release discontinues that option for security reasons. Before upgrading, ask an administrator to enable password login under Administration → Settings and set an Immich password for your existing account under Administration → Users. Verify that you can sign in with your original email and new password. Your library and albums are preserved.

    Upgrade Immich from v3.3.5 to v3.4.2. This release adds JPEG XL support, tags on mobile, and workflows that organize photos by keywords after OCR, such as filing receipts into an album. It also fixes integrity report downloads.
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - Fix Redis snapshot directory permissions to prevent failed uploads, missing thumbnails, and background job errors.
    - Missing thumbnails are regenerated in the background. For older videos without metadata, open the video menu, refresh metadata, wait for completion, then regenerate the thumbnail. For multiple assets, open Administration → Jobs and run Metadata Extraction for missing items. Once it finishes, run Generate Thumbnails for missing items.

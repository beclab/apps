metadata:
  title: Immich
  description: 高性能なセルフホスト型の写真・動画管理ソリューション
spec:
  fullDescription: |
    **概要**
    Immich はセルフホスト型の写真・動画管理ソリューションで、大切な思い出をスマートフォンから直接バックアップできます。

    主な機能:
    **Web ポータルとモバイルアプリ**
    使いやすい Web インターフェースと iOS/Android アプリでメディアを閲覧、整理、管理できます。

    **自動バックアップ**
    Google Photos のように写真と動画を自動バックアップします。

    **一括アップロード**
    大量のファイルを効率よく転送できます。

    **パートナー共有**
    アルバムや思い出を友人や家族と共有できます。

    **顔認識**
    写真内の顔を認識し、人物や場面を簡単に検索できます。

    **逆ジオコーディング**
    メディアに位置情報を追加します。
  upgradeDescription: |
    Immich を v3.2.0 から v3.3.5 に更新します。人物の共有、誕生日の思い出、画質の改善、セキュリティ修正が含まれます。

    主な更新内容：
    - 人物の共同管理：同じクラスタグループのユーザーと人物を共有し、名前や生年月日を共同で管理できます。
    - 誕生日の思い出：生年月日を設定した人物の誕生日に、関連する写真の思い出を表示します。
    - サムネイルとプレビューの画質向上：より正確なリサンプリングで細部や明るさを改善します。既存のサムネイルに適用するには再生成が必要です。
    - 新しい OCR モデル：多言語対応の PP-OCRv6 シリーズが、性能と精度に応じた選択肢を提供します。
    - セキュリティ更新：証明書の信頼性に関する修正と Node.js のセキュリティパッチを適用します。

    アップロード先を NAS に指定：
    任意の設定 UPLOAD_LOCATION で、アップロードしたメディアの保存先を指定できます。空欄の場合は既定のローカルストレージを使用し、Olares にマウント済みの NFS または SMB フォルダーを指定すると NAS に直接保存します。データベースは Olares に保持されます。

    リリースノート：
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

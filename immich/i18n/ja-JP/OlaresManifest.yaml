metadata:
  title: Immich
  description: 高性能なセルフホスト型の写真・動画管理ソリューション
spec:
  fullDescription: |
    **概要**
    Immich はセルフホスト型の写真・動画管理ソリューションで、大切な思い出をスマートフォンから直接バックアップできます。

    主な機能:
    **Web ポータルとモバイルアプリ**
    使いやすい Web インターフェースと iOS/Android アプリでメディアを閲覧、整理、管理できます。

    **自動バックアップ**
    Google Photos のように写真と動画を自動バックアップします。

    **一括アップロード**
    大量のファイルを効率よく転送できます。

    **パートナー共有**
    アルバムや思い出を友人や家族と共有できます。

    **顔認識**
    写真内の顔を認識し、人物や場面を簡単に検索できます。

    **逆ジオコーディング**
    メディアに位置情報を追加します。
  upgradeDescription: |
    サーバーと機械学習のイメージを同じバージョンにそろえ、Immich を v3.2.0 に更新します。
    新しい検索インターフェースと API、思い出ページ、タグの名前変更が含まれます。
    更新前にデータベースとメディアをバックアップしてください。任意機能のユーザー間での顔の
    グループ化に既存のメディアを含めるには、顔認識のリセットが必要です。リセットすると、
    対象となる人物の名前と生年月日が失われます。この更新ではリセットを実行しません。
    リリースノート: https://github.com/immich-app/immich/releases/tag/v3.2.0

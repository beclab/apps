metadata:
  title: Immich
  description: Solución autoalojada de alto rendimiento para gestionar fotos y vídeos
spec:
  fullDescription: |
    **DESCRIPCIÓN GENERAL**
    Immich es una solución autoalojada para gestionar fotos y vídeos que permite guardar tus recuerdos directamente desde el móvil.

    Funciones principales:
    **Portal web y aplicación móvil**
    Interfaz web intuitiva y aplicación para iOS y Android para explorar, organizar y gestionar tus archivos.

    **Copia automática**
    Copia tus fotos y vídeos automáticamente, como Google Photos.

    **Carga masiva**
    Transfiere grandes lotes de archivos con eficiencia.

    **Compartir con socios**
    Comparte álbumes o recuerdos con amigos y familiares.

    **Reconocimiento facial**
    Encuentra personas o momentos mediante el reconocimiento de rostros.

    **Geocodificación inversa**
    Añade información de ubicación a tus archivos.
  upgradeDescription: |
    Actualiza Immich de v3.2.0 a v3.3.5 con personas compartidas, recuerdos de cumpleaños, mejoras de calidad de imagen y correcciones de seguridad.

    Novedades:
    - Gestión compartida de personas: comparta personas con otros usuarios del mismo grupo de agrupación y gestione sus nombres y fechas de nacimiento de forma conjunta.
    - Recuerdos de cumpleaños: muestre recuerdos fotográficos en el cumpleaños de una persona.
    - Miniaturas y vistas previas de mayor calidad: un remuestreo más preciso mejora los detalles y la luminosidad. Regenere las miniaturas existentes para aplicar estas mejoras.
    - Nuevos modelos OCR: la familia multilingüe PP-OCRv6 ofrece distintas opciones de rendimiento y precisión.
    - Actualizaciones de seguridad: correcciones de confianza en certificados y parches de seguridad de Node.js.

    Almacenamiento NAS para cargas:
    La opción UPLOAD_LOCATION permite elegir dónde guardar los archivos multimedia cargados. Déjela vacía para usar el almacenamiento local predeterminado o indique una carpeta NFS o SMB ya montada en Olares para guardar las cargas directamente en el NAS. La base de datos permanece en Olares.

    Notas de la versión:
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

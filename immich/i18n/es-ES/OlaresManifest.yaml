metadata:
  title: Immich
  description: Solución autoalojada de alto rendimiento para gestionar fotos y vídeos
spec:
  fullDescription: |
    **DESCRIPCIÓN GENERAL**
    Immich es una solución autoalojada para gestionar fotos y vídeos que permite guardar tus recuerdos directamente desde el móvil.

    Funciones principales:
    **Portal web y aplicación móvil**
    Interfaz web intuitiva y aplicación para iOS y Android para explorar, organizar y gestionar tus archivos.

    **Copia automática**
    Copia tus fotos y vídeos automáticamente, como Google Photos.

    **Carga masiva**
    Transfiere grandes lotes de archivos con eficiencia.

    **Compartir con socios**
    Comparte álbumes o recuerdos con amigos y familiares.

    **Reconocimiento facial**
    Encuentra personas o momentos mediante el reconocimiento de rostros.

    **Geocodificación inversa**
    Añade información de ubicación a tus archivos.
  upgradeDescription: |
    Actualización de Immich a v3.2.0 con imágenes del servidor y de aprendizaje automático de la misma versión.
    Incluye la nueva interfaz y API de búsqueda, la página de recuerdos y la opción de renombrar etiquetas.
    Haga una copia de seguridad de la base de datos y los archivos multimedia antes de actualizar.
    La agrupación opcional de rostros entre usuarios requiere restablecer el reconocimiento facial
    para incluir los archivos existentes; se perderán los nombres y las fechas de nacimiento
    de las personas afectadas. Esta actualización no realiza ese restablecimiento.
    Notas de la versión: https://github.com/immich-app/immich/releases/tag/v3.2.0

metadata:
  title: Immich
  description: Solución autoalojada de alto rendimiento para gestionar fotos y vídeos
spec:
  fullDescription: |
    **DESCRIPCIÓN GENERAL**
    Immich es una solución autoalojada para gestionar fotos y vídeos que permite guardar tus recuerdos directamente desde el móvil.

    Funciones principales:
    **Portal web y aplicación móvil**
    Interfaz web intuitiva y aplicación para iOS y Android para explorar, organizar y gestionar tus archivos.

    **Copia automática**
    Copia tus fotos y vídeos automáticamente, como Google Photos.

    **Carga masiva**
    Transfiere grandes lotes de archivos con eficiencia.

    **Compartir con socios**
    Comparte álbumes o recuerdos con amigos y familiares.

    **Reconocimiento facial**
    Encuentra personas o momentos mediante el reconocimiento de rostros.

    **Geocodificación inversa**
    Añade información de ubicación a tus archivos.
  upgradeDescription: |
    Si solo accedes mediante el inicio de sesión único de Olares (OIDC), esta versión retira esa opción por seguridad. Antes de actualizar, pide al administrador que active el acceso con contraseña en Administración → Ajustes y asigne una contraseña de Immich a tu cuenta existente en Administración → Usuarios. Comprueba que puedes entrar con tu correo habitual y la nueva contraseña. Se conservan tu biblioteca y tus álbumes.

    Actualiza Immich de v3.3.5 a v3.4.2. Añade soporte para JPEG XL, etiquetas en móviles y flujos que organizan fotos por palabras clave tras el reconocimiento de texto. También corrige la descarga de informes de integridad.
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - Corrige los permisos de escritura de las instantáneas de Redis que provocaban fallos de carga, miniaturas ausentes y errores en tareas de fondo.
    - Las miniaturas pendientes se generan en segundo plano. Para vídeos antiguos sin metadatos, actualiza primero los metadatos desde el menú del vídeo y, cuando termine, regenera la miniatura. Para varios archivos, en Administración → Tareas, ejecuta la extracción de metadatos para los elementos que faltan. Cuando termine, genera las miniaturas que faltan.

metadata:
  description: 高性能自建照片视频管理方案。
  title: Immich
spec:
  fullDescription: |
    **应用概览**
    Immich 是一个自建的照片和视频管理方案，允许您直接从手机备份重要回忆。

    主要功能包括：
    **网页和移动应用**
    Immich 提供便捷的网页界面及 iOS 和 Android 应用。轻松浏览、整理和管理媒体文件。

    **自动备份**
    像 Google Photos 一样，Immich 自动备份您的照片和视频。再也不用手动上传了！

    **批量上传**
    需要传输大量文件？Immich 支持批量上传，迁移媒体高效便捷。

    **分享给伙伴**
    与亲友分享特定相册或记忆。 Immich 让您能够共同协作和回顾。

    **人脸识别**
    Immich 能识别照片中的人脸，帮您轻松找到特定人或时刻。

    **逆地理编码**
    想知道某张照片的拍摄地点？Immich 会为您的媒体添加地点信息。

  upgradeDescription: |
    将 Immich 从 v3.2.0 升级至 v3.3.5，带来人物共享、生日回忆、图像质量改进及安全修复。

    本次升级亮点：
    - 人物共享管理：可向同一聚类组中的其他用户共享人物，并协作维护姓名、出生日期等信息。
    - 生日回忆：在已设置生日的人物生日当天，展示相关照片回忆。
    - 更清晰的缩略图与预览：采用更准确的图像重采样方式，改善细节和明暗表现。已有缩略图需重新生成才能应用新效果。
    - 新增 OCR 模型：支持多语言 PP-OCRv6 系列，提供不同性能与精度选项。
    - 安全更新：包含证书信任链相关修复及 Node.js 安全补丁。

    支持 NAS 上传存储：
    新增可选配置 UPLOAD_LOCATION：留空使用默认本地存储，填写已挂载的 NFS 或 SMB 目录后，通过 Immich 上传的媒体将直接存储到 NAS，数据库仍保留在 Olares。

    上游发行说明：
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

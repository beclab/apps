metadata:
  description: 高性能自建照片视频管理方案。
  title: Immich
spec:
  fullDescription: |
    **应用概览**
    Immich 是一个自建的照片和视频管理方案，允许您直接从手机备份重要回忆。

    主要功能包括：
    **网页和移动应用**
    Immich 提供便捷的网页界面及 iOS 和 Android 应用。轻松浏览、整理和管理媒体文件。

    **自动备份**
    像 Google Photos 一样，Immich 自动备份您的照片和视频。再也不用手动上传了！

    **批量上传**
    需要传输大量文件？Immich 支持批量上传，迁移媒体高效便捷。

    **分享给伙伴**
    与亲友分享特定相册或记忆。 Immich 让您能够共同协作和回顾。

    **人脸识别**
    Immich 能识别照片中的人脸，帮您轻松找到特定人或时刻。

    **逆地理编码**
    想知道某张照片的拍摄地点？Immich 会为您的媒体添加地点信息。

  upgradeDescription: |
    仅使用 Olares 单点登录（OIDC）的用户请留意：出于安全原因，本版本停用该登录方式。升级前，请管理员启用密码登录并为原账号设置 Immich 密码（在「管理 → 设置」中开启密码登录，再到「管理 → 用户」编辑原账号并设置密码）。确认能用原邮箱和新密码登录后再升级，原图库和相册会保留。

    将 Immich 从 v3.3.5 升级至 v3.4.2。新版支持 JPEG XL 图像格式，移动端新增标签功能。工作流现在可以在文字识别完成后按关键词整理照片，例如将收据自动归入指定相册。v3.4.2 还修复了完整性报告下载问题。
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - 修复 Redis 快照目录的写入权限问题，解决由此导致的照片上传失败、缩略图缺失和后台任务异常。
    - 升级后会在后台补生成缺失的缩略图。若旧视频缺少元数据，请在视频的「⋮」菜单先选择「刷新元数据」，完成后再选择「重新生成缩略图」。 批量处理时，在「管理 → 任务」先对缺失项运行「提取元数据」，完成后再对缺失项运行「生成缩略图」。

metadata:
  description: 高性能自建照片视频管理方案。
  title: Immich
spec:
  fullDescription: |
    **应用概览**
    Immich 是一个自建的照片和视频管理方案，允许您直接从手机备份重要回忆。

    主要功能包括：
    **网页和移动应用**
    Immich 提供便捷的网页界面及 iOS 和 Android 应用。轻松浏览、整理和管理媒体文件。

    **自动备份**
    像 Google Photos 一样，Immich 自动备份您的照片和视频。再也不用手动上传了！

    **批量上传**
    需要传输大量文件？Immich 支持批量上传，迁移媒体高效便捷。

    **分享给伙伴**
    与亲友分享特定相册或记忆。 Immich 让您能够共同协作和回顾。

    **人脸识别**
    Immich 能识别照片中的人脸，帮您轻松找到特定人或时刻。

    **逆地理编码**
    想知道某张照片的拍摄地点？Immich 会为您的媒体添加地点信息。

  upgradeDescription: |
    将 Immich 升级至 v3.2.0，服务器与机器学习镜像使用相同版本。
    包含新的搜索界面与 API、回忆页面及标签重命名功能。
    升级前请备份数据库和媒体文件。如需让已有媒体参与可选的跨用户人脸聚类，
    需要重置人脸识别；这会丢失受影响人物的姓名和出生日期。
    本次升级不会触发该重置。
    发行说明：https://github.com/immich-app/immich/releases/tag/v3.2.0

metadata:
  title: Immich
  description: Leistungsstarke selbst gehostete Foto- und Videoverwaltung
spec:
  fullDescription: |
    **ÜBERBLICK**
    Immich ist eine selbst gehostete Foto- und Videoverwaltung, mit der Sie wertvolle Erinnerungen direkt vom Mobiltelefon sichern können.

    Wichtige Funktionen:
    **Webportal und mobile App**
    Benutzerfreundliche Weboberfläche sowie iOS- und Android-App zum Durchsuchen, Organisieren und Verwalten Ihrer Medien.

    **Automatische Sicherung**
    Fotos und Videos werden wie bei Google Photos automatisch gesichert.

    **Massen-Upload**
    Übertragen Sie große Dateimengen effizient.

    **Partnerfreigabe**
    Teilen Sie Alben oder Erinnerungen mit Freunden und Familie.

    **Gesichtserkennung**
    Findet Gesichter und erleichtert die Suche nach Personen oder Momenten.

    **Umgekehrte Geokodierung**
    Fügt Ihren Medien Standortinformationen hinzu.
  upgradeDescription: |
    Aktualisiert Immich von v3.2.0 auf v3.3.5 mit Personenfreigabe, Geburtstagserinnerungen, verbesserter Bildqualität und Sicherheitskorrekturen.

    Highlights:
    - Gemeinsame Personenverwaltung: Personen mit anderen Nutzern derselben Cluster-Gruppe teilen und Namen sowie Geburtsdaten gemeinsam pflegen.
    - Geburtstagserinnerungen: Am Geburtstag einer Person passende Fotoerinnerungen anzeigen.
    - Bessere Miniaturansichten und Vorschauen: Präziseres Resampling verbessert Details und Helligkeit. Vorhandene Miniaturansichten müssen neu erzeugt werden, um die Verbesserungen anzuwenden.
    - Neue OCR-Modelle: Mehrsprachige PP-OCRv6-Modelle bieten unterschiedliche Leistungs- und Genauigkeitsstufen.
    - Sicherheitsupdates: Korrekturen am Zertifikatsvertrauen und Sicherheitsupdates für Node.js.

    NAS-Speicher für Uploads:
    Mit dem optionalen UPLOAD_LOCATION wird der Speicherort hochgeladener Medien festgelegt. Leer lassen für den lokalen Standardspeicher oder einen bereits in Olares eingebundenen NFS- oder SMB-Ordner angeben, um Uploads direkt auf dem NAS zu speichern. Die Datenbank bleibt in Olares.

    Versionshinweise:
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

metadata:
  title: Immich
  description: Leistungsstarke selbst gehostete Foto- und Videoverwaltung
spec:
  fullDescription: |
    **ÜBERBLICK**
    Immich ist eine selbst gehostete Foto- und Videoverwaltung, mit der Sie wertvolle Erinnerungen direkt vom Mobiltelefon sichern können.

    Wichtige Funktionen:
    **Webportal und mobile App**
    Benutzerfreundliche Weboberfläche sowie iOS- und Android-App zum Durchsuchen, Organisieren und Verwalten Ihrer Medien.

    **Automatische Sicherung**
    Fotos und Videos werden wie bei Google Photos automatisch gesichert.

    **Massen-Upload**
    Übertragen Sie große Dateimengen effizient.

    **Partnerfreigabe**
    Teilen Sie Alben oder Erinnerungen mit Freunden und Familie.

    **Gesichtserkennung**
    Findet Gesichter und erleichtert die Suche nach Personen oder Momenten.

    **Umgekehrte Geokodierung**
    Fügt Ihren Medien Standortinformationen hinzu.
  upgradeDescription: |
    Immich wird auf v3.2.0 aktualisiert, mit zueinander passenden Server- und Machine-Learning-Images.
    Enthält die neue Suchoberfläche und API, eine Erinnerungsseite und das Umbenennen von Tags.
    Sichern Sie vor dem Upgrade die Datenbank und Ihre Medien. Die optionale benutzerübergreifende
    Gesichtsgruppierung erfordert ein Zurücksetzen der Gesichtserkennung, um vorhandene Medien
    einzubeziehen. Dabei gehen die Namen und Geburtsdaten der betroffenen Personen verloren.
    Dieses Upgrade löst kein solches Zurücksetzen aus.
    Versionshinweise: https://github.com/immich-app/immich/releases/tag/v3.2.0

metadata:
  title: Immich
  description: Solution auto-hébergée performante de gestion de photos et vidéos
spec:
  fullDescription: |
    **PRÉSENTATION**
    Immich est une solution auto-hébergée de gestion de photos et vidéos permettant de sauvegarder vos précieux souvenirs directement depuis votre téléphone.

    Fonctionnalités principales :
    **Portail Web et application mobile**
    Interface Web conviviale et application iOS et Android pour parcourir, organiser et gérer vos médias.

    **Sauvegarde automatique**
    Sauvegarde automatiquement vos photos et vidéos, comme Google Photos.

    **Importation en masse**
    Transférez efficacement de grands lots de fichiers.

    **Partage avec un partenaire**
    Partagez des albums ou souvenirs avec vos proches.

    **Reconnaissance faciale**
    Retrouvez facilement des personnes ou moments précis.

    **Géocodage inverse**
    Ajoute des informations de localisation à vos médias.
  upgradeDescription: |
    Si vous utilisez uniquement la connexion unique Olares (OIDC), cette version retire ce mode de connexion pour des raisons de sécurité. Avant la mise à jour, demandez à un administrateur d’activer la connexion par mot de passe dans Administration → Paramètres et de définir un mot de passe Immich pour votre compte existant dans Administration → Utilisateurs. Vérifiez la connexion avec votre adresse e-mail habituelle et ce mot de passe. Votre photothèque et vos albums sont conservés.

    Mise à jour d’Immich de v3.3.5 vers v3.4.2 avec prise en charge de JPEG XL, étiquettes sur mobile et classement des photos par mots-clés après reconnaissance de texte. Le téléchargement des rapports d’intégrité a été corrigé.
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - Corrige les droits d’écriture des instantanés Redis à l’origine d’échecs de téléversement, de miniatures manquantes et d’erreurs dans les tâches de fond.
    - Les miniatures manquantes sont générées en arrière-plan. Pour une ancienne vidéo sans métadonnées, actualisez les métadonnées dans son menu puis, une fois cette tâche terminée, régénérez sa miniature. Pour plusieurs fichiers, dans Administration → Tâches, lancez l’extraction des métadonnées manquantes. Une fois la tâche terminée, lancez la génération des miniatures manquantes.

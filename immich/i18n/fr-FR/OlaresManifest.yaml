metadata:
  title: Immich
  description: Solution auto-hébergée performante de gestion de photos et vidéos
spec:
  fullDescription: |
    **PRÉSENTATION**
    Immich est une solution auto-hébergée de gestion de photos et vidéos permettant de sauvegarder vos précieux souvenirs directement depuis votre téléphone.

    Fonctionnalités principales :
    **Portail Web et application mobile**
    Interface Web conviviale et application iOS et Android pour parcourir, organiser et gérer vos médias.

    **Sauvegarde automatique**
    Sauvegarde automatiquement vos photos et vidéos, comme Google Photos.

    **Importation en masse**
    Transférez efficacement de grands lots de fichiers.

    **Partage avec un partenaire**
    Partagez des albums ou souvenirs avec vos proches.

    **Reconnaissance faciale**
    Retrouvez facilement des personnes ou moments précis.

    **Géocodage inverse**
    Ajoute des informations de localisation à vos médias.
  upgradeDescription: |
    Mise à jour d’Immich de v3.2.0 vers v3.3.5 avec le partage de personnes, les souvenirs d’anniversaire, une meilleure qualité d’image et des correctifs de sécurité.

    Nouveautés :
    - Gestion partagée des personnes : partagez des personnes avec les utilisateurs du même groupe de regroupement et gérez ensemble leurs noms et dates de naissance.
    - Souvenirs d’anniversaire : retrouvez des souvenirs photo le jour de l’anniversaire d’une personne.
    - Miniatures et aperçus de meilleure qualité : un rééchantillonnage plus précis améliore les détails et la luminosité. Régénérez les miniatures existantes pour appliquer ces améliorations.
    - Nouveaux modèles OCR : la gamme multilingue PP-OCRv6 propose plusieurs niveaux de performances et de précision.
    - Sécurité : correctifs relatifs à la confiance des certificats et mises à jour de sécurité de Node.js.

    Stockage NAS des téléversements :
    Le paramètre facultatif UPLOAD_LOCATION définit où enregistrer les médias téléversés. Laissez-le vide pour utiliser le stockage local par défaut, ou indiquez un dossier NFS ou SMB déjà monté dans Olares pour enregistrer les téléversements directement sur le NAS. La base de données reste dans Olares.

    Notes de version :
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

metadata:
  title: Immich
  description: Soluzione self-hosted ad alte prestazioni per gestire foto e video
spec:
  fullDescription: |
    **PANORAMICA**
    Immich è una soluzione self-hosted per gestire foto e video che consente di salvare i tuoi ricordi direttamente dal telefono.

    Funzioni principali:
    **Portale web e app mobile**
    Interfaccia web intuitiva e app iOS e Android per sfogliare, organizzare e gestire i media.

    **Backup automatico**
    Esegue automaticamente il backup di foto e video, come Google Photos.

    **Caricamento in massa**
    Trasferisce in modo efficiente grandi quantità di file.

    **Condivisione con partner**
    Condividi album o ricordi con amici e familiari.

    **Riconoscimento facciale**
    Trova più facilmente persone o momenti specifici.

    **Geocodifica inversa**
    Aggiunge informazioni sulla posizione ai media.
  upgradeDescription: |
    Aggiornamento di Immich alla versione 3.2.0 con immagini del server e del servizio di apprendimento automatico della stessa versione.
    Include la nuova interfaccia e API di ricerca, la pagina dei ricordi e la possibilità di rinominare i tag.
    Eseguire il backup del database e dei file multimediali prima dell’aggiornamento. Il raggruppamento
    opzionale dei volti tra utenti richiede il ripristino del riconoscimento facciale per includere
    i file esistenti; i nomi e le date di nascita delle persone interessate andranno persi.
    Questo aggiornamento non avvia tale ripristino.
    Note di rilascio: https://github.com/immich-app/immich/releases/tag/v3.2.0

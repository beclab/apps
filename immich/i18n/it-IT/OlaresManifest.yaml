metadata:
  title: Immich
  description: Soluzione self-hosted ad alte prestazioni per gestire foto e video
spec:
  fullDescription: |
    **PANORAMICA**
    Immich è una soluzione self-hosted per gestire foto e video che consente di salvare i tuoi ricordi direttamente dal telefono.

    Funzioni principali:
    **Portale web e app mobile**
    Interfaccia web intuitiva e app iOS e Android per sfogliare, organizzare e gestire i media.

    **Backup automatico**
    Esegue automaticamente il backup di foto e video, come Google Photos.

    **Caricamento in massa**
    Trasferisce in modo efficiente grandi quantità di file.

    **Condivisione con partner**
    Condividi album o ricordi con amici e familiari.

    **Riconoscimento facciale**
    Trova più facilmente persone o momenti specifici.

    **Geocodifica inversa**
    Aggiunge informazioni sulla posizione ai media.
  upgradeDescription: |
    Aggiorna Immich da v3.2.0 a v3.3.5 con condivisione delle persone, ricordi di compleanno, migliore qualità delle immagini e correzioni di sicurezza.

    Novità:
    - Gestione condivisa delle persone: condividi le persone con gli utenti dello stesso gruppo di clustering e gestisci insieme nomi e date di nascita.
    - Ricordi di compleanno: visualizza ricordi fotografici nel giorno del compleanno di una persona.
    - Miniature e anteprime di qualità superiore: un ricampionamento più accurato migliora dettagli e luminosità. Rigenera le miniature esistenti per applicare i miglioramenti.
    - Nuovi modelli OCR: la famiglia multilingue PP-OCRv6 offre diverse opzioni di prestazioni e precisione.
    - Aggiornamenti di sicurezza: correzioni relative all’attendibilità dei certificati e patch di sicurezza di Node.js.

    Archiviazione NAS dei caricamenti:
    L’opzione UPLOAD_LOCATION definisce dove salvare i file multimediali caricati. Lasciala vuota per usare l’archiviazione locale predefinita oppure indica una cartella NFS o SMB già montata in Olares per salvare i caricamenti direttamente sul NAS. Il database rimane in Olares.

    Note di rilascio:
    https://github.com/immich-app/immich/releases/tag/v3.3.0
    https://github.com/immich-app/immich/releases/tag/v3.3.5

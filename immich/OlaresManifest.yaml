olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  immich-machine-learning: 1
  immich-redis: 1
  immich: 1
metadata:
  name: immich
  icon: https://app.cdn.olares.com/appstore/immich/icon.png
  description: High performance self-hosted photo and video management solution.
  appid: immich
  title: Immich
  version: '1.0.42'
  categories:
  - Lifestyle
  - homelab
  tags:
  - lifestyle
  - photos

entrances:
- name: immich
  host: immich-svc
  port: 80
  icon: https://app.cdn.olares.com/appstore/immich/icon.png
  title: Immich
  authLevel: internal
  openMethod: window
spec:
  versionName: '3.4.2'
  featuredImage: https://app.cdn.olares.com/appstore/immich/01.png
  promoteImage:
  - https://app.cdn.olares.com/appstore/immich/01.png
  - https://app.cdn.olares.com/appstore/immich/02.png
  - https://app.cdn.olares.com/appstore/immich/03.png
  - https://app.cdn.olares.com/appstore/immich/04.png

  fullDescription: |
    **OVERVIEW**
    Immich is a self-hosted photo and video management solution that allows you to back up your precious memories directly from your mobile phone.

    Here are some key features:
    **Web Portal and Mobile App**
    Immich provides a user-friendly web interface and a mobile app for both iOS and Android. You can easily browse, organize, and manage your media files.

    **Automatic Backup**
    Immich ensures that your photos and videos are automatically backed up, just like Google Photos. Say goodbye to manual uploads!

    **Bulk Upload**
    Need to transfer a large batch of files? Immich supports bulk uploads, making it efficient to migrate your existing media.

    **Partner Sharing**
    Share specific albums or memories with friends and family. Immich lets you collaborate and reminisce together.

    **Facial Recognition**
    Immich can recognize faces in your photos, making it easier to find specific people or moments.

    **Reverse Geocoding**
    Wondering where a particular photo was taken? Immich adds location information to your media.

  upgradeDescription: |
    For users who sign in only with Olares single sign-on (OIDC): this release discontinues that option for security reasons. Before upgrading, ask an administrator to enable password login under Administration → Settings and set an Immich password for your existing account under Administration → Users. Verify that you can sign in with your original email and new password. Your library and albums are preserved.

    Upgrade Immich from v3.3.5 to v3.4.2. This release adds JPEG XL support, tags on mobile, and workflows that organize photos by keywords after OCR, such as filing receipts into an album. It also fixes integrity report downloads.
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - Fix Redis snapshot directory permissions to prevent failed uploads, missing thumbnails, and background job errors.
    - Missing thumbnails are regenerated in the background. For older videos without metadata, open the video menu, refresh metadata, wait for completion, then regenerate the thumbnail. For multiple assets, open Administration → Jobs and run Metadata Extraction for missing items. Once it finishes, run Generate Thumbnails for missing items.

  developer: immich-app
  website: https://immich.app
  sourceCode: https://github.com/immich-app/immich
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  doc: https://immich.app/docs/overview/introduction
  license:
  - text: AGPL-3.0
    url: https://github.com/immich-app/immich?tab=AGPL-3.0-1-ov-file#readme
  requiredMemory: 2000Mi
  requiredDisk: 5Gi
  supportArch:
  - amd64
  - arm64
  requiredCpu: 600m
  limitedMemory: 8548Mi
  limitedCpu: 5500m
permission:
  appData: true
  appCache: true
  userData:
  - Home
  externalData: true
middleware:
  postgres:
    username: immich
    password: immich
    databases:
    - name: immich
      distributed: false
      extensions:
      - vchord
      - vector
      - earthdistance
      scripts:
      - BEGIN;
      - ALTER EXTENSION vector OWNER TO $dbusername;
      - COMMIT;
  redis:
    namespace: db0
options:
  mobileSupported: true
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
  oidc:
    enabled: false
    redirectUri: /auth/login
    entranceName: immich
envs:
- envName: HF_ENDPOINT
  required: true
  applyOnChange: true
  valueFrom:
    envName: OLARES_USER_HUGGINGFACE_SERVICE
- envName: UPLOAD_LOCATION
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: 'Leave empty to use default local storage. To store uploads on NAS, mount it in Olares Files first and enter a dedicated folder, for example /external_storage/my-nas/immich. Clearing or changing this value does not move files. Before switching, stop Immich, back up the database and media, and migrate the complete media folder to the selected destination.'

{{- $uploadLocation := get (.Values.olaresEnv | default dict) "UPLOAD_LOCATION" | default "" | toString -}}
{{- if $uploadLocation -}}
{{- if or (not (hasPrefix "/external_storage/" $uploadLocation)) (contains ".." $uploadLocation) (contains "//" $uploadLocation) (contains "\\" $uploadLocation) (contains "\n" $uploadLocation) (contains "\r" $uploadLocation) -}}
{{- fail "UPLOAD_LOCATION must be a directory below /external_storage/ without parent traversal or repeated separators" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
data:
  config.json: |
    {
      oauth: {
        autoLaunch: false,
        autoRegister: false,
        enabled: false,
        scope: "openid email profile"
      }
    }
kind: ConfigMap
metadata:
  name: config
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: immich
  name: immich
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ .Values.workloads.immich.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: immich
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/thumbnail-recovery: {{ include (print $.Template.BasePath "/thumbnail-recovery.yaml") . | sha256sum }}
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: immich
    spec:
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - "-ec"
            - |
              chown 1000:1000 /app-data-root /redis-data
          resources: {}
          volumeMounts:
            - name: app-data-root
              mountPath: /app-data-root
            - name: redis-data
              mountPath: /redis-data
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
        {{- if $uploadLocation }}
        - name: check-nas-storage
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -ec
            - |
              # A missing NAS must never become a local upload directory.
              awk '$5 == "/nas-data" { for (i=6; i<=NF; i++) if ($i == "-" && $(i+1) ~ /^(nfs|nfs4|cifs|smb3)$/) found=1 } END { exit !found }' /proc/self/mountinfo || {
                echo "UPLOAD_LOCATION is not mounted from NFS or SMB. Mount the NAS in Olares Files first." >&2
                exit 1
              }
              probe=$(mktemp /nas-data/.immich-write-check.XXXXXX)
              trap 'rm -f "$probe"' EXIT
              test -w /nas-data
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 8Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: appcache
              mountPath: /nas-data
        {{- end }}
      containers:
        - name: immich
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: REDIS_HOSTNAME
              value: redis-svc
            - name: REDIS_PASSWORD
              value: ""
            - name: DB_HOSTNAME
              value: {{ .Values.postgres.host }}
            - name: DB_USERNAME
              value: {{ .Values.postgres.username }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              value: {{ .Values.postgres.databases.immich }}
            - name: IMMICH_PORT
              value: "3001"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"
            - name: OAUTH_ENABLED
              value: "false"
          image: "beclab/immich-app-immich-server:v3.4.2"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2000Mi
            requests:
              cpu: 200m
              memory: 300Mi
          volumeMounts:
            - name: appcache
              mountPath: /data
            - name: home
              mountPath: /home
            - name: config
              mountPath: /config.json
              subPath: config.json
            - name: external-storage
              mountPath: /external_storage
              mountPropagation: Bidirectional
          securityContext:
            privileged: true
            {{- if $uploadLocation }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
        - name: thumbnail-recovery
          image: beclab/immich-app-immich-server:v3.4.2
          # Keep recovery failures independent of Immich readiness and release Node memory when done.
          command: ["sh", "-ec", "until node /recovery/recover.cjs; do sleep 120; done; exec sleep infinity"]
          env:
            - name: DB_HOSTNAME
              value: {{ .Values.postgres.host }}
            - name: DB_USERNAME
              value: {{ .Values.postgres.username }}
            - name: DB_DATABASE_NAME
              value: {{ .Values.postgres.databases.immich }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: recovery-script
              mountPath: /recovery
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: recovery-script
          configMap:
            name: {{ .Release.Name }}-thumbnail-recovery
        - name: appcache
          hostPath:
            {{- if $uploadLocation }}
            path: {{ printf "%s/%s" (trimSuffix "/" (required "NAS storage requires the Olares external-storage mount" .Values.sharedlib | toString)) (trimPrefix "/external_storage/" $uploadLocation) | quote }}
            type: Directory
            {{- else }}
            path: '{{ .Values.userspace.appData }}/data/upload'
            type: DirectoryOrCreate
            {{- end }}
        - name: learningcache
          hostPath:
            path: '{{ .Values.userspace.appData }}/machine-learning'
            type: DirectoryOrCreate
        - name: app-data-root
          hostPath:
            path: '{{ .Values.userspace.appData }}'
            type: DirectoryOrCreate
        - name: redis-data
          hostPath:
            path: '{{ .Values.userspace.appData }}/redis'
            type: DirectoryOrCreate
        - name: home
          hostPath:
            path: '{{ .Values.userspace.userData }}'
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: config
            defaultMode: 438
            items:
              - key: config.json
                path: config.json
        - name: external-storage
          hostPath:
            path: "{{ .Values.sharedlib }}"
            type: DirectoryOrCreate
status: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: immich
  name: immich-svc
  namespace: '{{ .Release.Namespace }}'
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 3001
  selector:
    io.kompose.service: immich
status:
  loadBalancer: {}

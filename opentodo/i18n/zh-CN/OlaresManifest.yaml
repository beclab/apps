metadata:
  title: OpenTodo
  description: 开源、本地优先的待办与任务管理应用，支持 CalDAV 日历同步与 AI MCP 协议
spec:
  fullDescription: |
    OpenTodo 是一个开源、本地优先且完全自托管的现代化任务管理系统。
    轻量快速、隐私至上，数据完全由您自主掌控。

    **核心特性：**
    - **本地优先架构：** 操作毫秒响应，完全支持离线使用，联网后多设备自动平滑同步。
    - **CalDAV 日历集成：** 原生支持 CalDAV 协议，可与 Apple 提醒事项、日历、Thunderbird 等无缝同步。
    - **AI 助手集成 (MCP)：** 内置 Model Context Protocol 端点，AI 智能体可直接安全读写与规划任务。
    - **Webhooks 与自动化：** 支持配置 Webhook，联动 Home Assistant、n8n 等家庭网络与自动化工作流。
    - **轻量单容器运行：** 高性能 Go 后端与现代嵌入式 Web 前端，开箱即用，占用极低。
  upgradeDescription: |
    v1.0.2：OpenTodo 从 0.22.0 升级到 1.0.0。
    - 1.0.0 起 API、同步协议、导出格式与升级路径在 1.x 内保持兼容，任意早期版本可直接升级，无需经过中间版本。
    - 启动时会执行 0.23.0 与 0.24.0 的数据库迁移，且没有向下迁移脚本：请先备份，并先升级服务端再升级各设备。
    - 长列表性能显著提升：手机上在 2000 条任务的项目里完成一条任务，耗时从约 220 ms 降到约 100 ms；列表、计数与角标改为按变更增量更新。
    - 包含 0.23.0 / 0.24.0 的可信性与安全改进：公开威胁模型、审计日志防篡改、MCP 端点改用 OAuth、刷新令牌轮换、首次安装校验更严格。
    - 无新增必需环境变量；写入高峰时 SQLite WAL 日志可能临时增长到约 16 MB。
    v1.0.1：添加 AIDockerCloud 到应用维护者列表。
    v1.0.0：OpenTodo 0.22.0 初始版本发布上线 Olares 应用市场。

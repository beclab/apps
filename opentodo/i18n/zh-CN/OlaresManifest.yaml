metadata:
  title: OpenTodo
  description: 开源、本地优先的待办与任务管理应用，支持 CalDAV 日历同步与 AI MCP 协议
spec:
  fullDescription: |
    OpenTodo 是一个开源、本地优先且完全自托管的现代化任务管理系统。
    轻量快速、隐私至上，数据完全由您自主掌控。

    **核心特性：**
    - **本地优先架构：** 操作毫秒响应，完全支持离线使用，联网后多设备自动平滑同步。
    - **CalDAV 日历集成：** 原生支持 CalDAV 协议，可与 Apple 提醒事项、日历、Thunderbird 等无缝同步。
    - **AI 助手集成 (MCP)：** 内置 Model Context Protocol 端点，AI 智能体可直接安全读写与规划任务。
    - **Webhooks 与自动化：** 支持配置 Webhook，联动 Home Assistant、n8n 等家庭网络与自动化工作流。
    - **轻量单容器运行：** 高性能 Go 后端与现代嵌入式 Web 前端，开箱即用，占用极低。
  upgradeDescription: |
    OpenTodo 0.22.0 初始版本发布上线 Olares 应用市场。

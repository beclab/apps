image:
  repository: ghcr.io/opentodoapp/opentodo
  tag: "0.22.0"
  pullPolicy: IfNotPresent

workloads:
  opentodo:
    replicaCount: 1

containerPort: 8080

userspace:
  appData: ""

olaresEnv: {}

env:
  baseUrl: ""
  setupToken: ""
  allowSignup: "false"
  trustedProxies: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

probes:
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  opentodo: 1

metadata:
  name: opentodo
  description: Open-source, local-first task manager with CalDAV and AI MCP support.
  icon: https://raw.githubusercontent.com/OpenTodoApp/OpenTodo/main/deploy/casaos/upstream/Apps/OpenTodo/icon.png
  appid: opentodo
  version: '1.0.2'
  title: OpenTodo
  categories:
  - Productivity_v112
  - workspace
  tags:
  - project-management
  - note-taking
  - utilities

permission:
  appData: true
  appCache: true

spec:
  versionName: '1.0.0'
  fullDescription: |
    OpenTodo is an open-source, local-first task manager you host yourself.
    Fast, responsive, and privacy-respecting with full data ownership.

    **Key Highlights:**
    - **Local-first Architecture:** Instant interaction, works completely offline, and syncs across devices when online.
    - **CalDAV Integration:** Connect seamlessly with Apple Reminders, Thunderbird, and other CalDAV calendar apps.
    - **AI Assistant Support (MCP):** Built-in Model Context Protocol endpoint allowing AI agents to read and manage tasks securely.
    - **Webhooks & Automation:** Trigger webhooks to connect with Home Assistant, n8n, and your custom workflows.
    - **Single Binary / Container:** Lightweight Go backend with embedded modern web interface.
  upgradeDescription: |
    v1.0.2: Upgrade OpenTodo from 0.22.0 to 1.0.0.
    - 1.0.0 keeps the API, sync protocol, export format and upgrade path compatible within 1.x; any earlier release can upgrade directly, with no version in between.
    - Startup runs the 0.23.0 and 0.24.0 database migrations, and there are no down-migrations: back up first, then upgrade the server before the devices.
    - Long lists are much faster: completing a task in a 2,000-task project on a phone drops from about 220 ms to about 100 ms; lists, counts and the badge now update incrementally.
    - Includes the 0.23.0 / 0.24.0 trust work: published threat model, tamper-evident audit log, OAuth on the MCP endpoint, refresh-token rotation and stricter first-run setup.
    - No new mandatory environment variable; the SQLite write-ahead log may temporarily grow to about 16 MB during bursts of writes.
    v1.0.1: Add AIDockerCloud to maintainers list.
    v1.0.0: Initial release of OpenTodo 0.22.0 on Olares.
  developer: OpenTodo
  website: https://opentodo.app
  sourceCode: https://github.com/OpenTodoApp/OpenTodo
  submitter: Inverstar
  locale:
  - en-US
  - zh-CN
  doc: https://github.com/OpenTodoApp/OpenTodo#readme
  requiredMemory: 64Mi
  limitedMemory: 1024Mi
  requiredDisk: 128Mi
  limitedDisk: 10Gi
  requiredCpu: 0.05
  limitedCpu: 1
  supportArch:
  - amd64
  - arm64

options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

envs:
- envName: OPENTODO_BASE_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: |
    Public URL the app is served from (e.g. https://opentodo.example.olares.com).
    Leave empty to infer automatically from incoming requests.
- envName: OPENTODO_ALLOW_SIGNUP
  type: string
  default: 'false'
  required: false
  editable: true
  applyOnChange: true
  description: |
    Allow anyone who can reach the server to create an account. Keep false to disable open registration after the first owner account is set up.
- envName: OPENTODO_SETUP_TOKEN
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: |
    Optional setup token (minimum 16 characters). When set, claiming and creating the first owner account requires this token.
- envName: OPENTODO_TRUSTED_PROXIES
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: |
    Trusted reverse proxies for forwarded client IP addresses. Defaults to private and loopback networks.

entrances:
- name: opentodo
  port: 8080
  host: opentodo-svc
  title: OpenTodo
  icon: https://raw.githubusercontent.com/OpenTodoApp/OpenTodo/main/deploy/casaos/upstream/Apps/OpenTodo/icon.png
  authLevel: public
  openMethod: window

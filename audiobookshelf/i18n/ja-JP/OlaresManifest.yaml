metadata:
  title: AudioBookShelf
  description: セルフホスト型のオーディオブック＆ポッドキャストサーバー
spec:
  fullDescription: |
    Audiobookshelf はセルフホスト型のオーディオブックおよびポッドキャストサーバーです。

    **機能**
    - Android・iOS アプリ（ベータ）を含む完全オープンソース
    - すべての音声フォーマットをオンザフライでストリーム
    - ポッドキャストを検索・追加し、エピソードを自動ダウンロード
    - カスタム権限付きマルチユーザー対応
    - ユーザーごとの進捗を保持し、デバイス間で同期
    - ライブラリ更新を自動検出、再スキャン不要
    - フォルダのドラッグ＆ドロップで書籍・ポッドキャストを一括アップロード
    - メタデータのバックアップ＋自動日次バックアップ
    - Progressive Web App (PWA)
    - Web アプリと Android アプリで Chromecast 対応
    - 複数ソースからメタデータとカバーアートを取得
    - チャプターエディタとチャプター検索（Audnexus API）
    - 音声ファイルを単一の m4b に結合
    - メタデータとカバー画像を音声ファイルに埋め込み
    - 基本的な電子書籍サポートとリーダー
        - Epub、pdf、cbr、cbz
        - 電子書籍をデバイスへ送信（例：Kindle）
    - ポッドキャストとオーディオブック用のオープン RSS フィード
  upgradeDescription: |
    Audiobookshelf を 2.36.0（`advplyr/audiobookshelf:2.36.0`）へアップグレード。

    セキュリティ重視のリリース。セッション管理（全デバイスログアウト／個別ログアウト）、OIDC コールバック検証、API/WebSocket でのリフレッシュトークン利用（CVE-2026-73085）、root アカウント削除、一括ダウンロードの権限チェックを修正。パスワード変更で既存セッションは無効化されます。

    詳細: https://github.com/advplyr/audiobookshelf/releases/tag/v2.36.0

metadata:
  title: AudioBookShelf
  description: Serveur auto-hébergé de livres audio et de podcasts
spec:
  fullDescription: |
    Audiobookshelf est un serveur auto-hébergé de livres audio et de podcasts.

    **Fonctionnalités**
    - Entièrement open-source, y compris l'application Android et iOS (en bêta)
    - Diffuse tous les formats audio à la volée
    - Recherche et ajout de podcasts pour télécharger les épisodes avec téléchargement automatique
    - Prise en charge multi-utilisateurs avec permissions personnalisées
    - Conserve la progression par utilisateur et synchronise entre appareils
    - Détecte automatiquement les mises à jour de la bibliothèque, sans rescan
    - Téléversement de livres et podcasts par glisser-déposer de dossiers en masse
    - Sauvegarde des métadonnées + sauvegardes quotidiennes automatisées
    - Progressive Web App (PWA)
    - Prise en charge Chromecast sur l'appli web et Android
    - Récupération des métadonnées et pochettes depuis plusieurs sources
    - Éditeur de chapitres et recherche de chapitres (API Audnexus)
    - Fusionnez vos fichiers audio en un seul m4b
    - Intégrez métadonnées et image de couverture dans vos fichiers audio
    - Prise en charge basique des ebooks et liseuse
        - Epub, pdf, cbr, cbz
        - Envoyer l'ebook vers un appareil (ex. Kindle)
    - Flux RSS ouverts pour podcasts et livres audio
  upgradeDescription: |
    Met à jour audiobookshelf de 2.36.0 vers 2.37.2. Inclut les améliorations et corrections décrites dans les notes de version.

    Notes de version : https://github.com/advplyr/audiobookshelf/releases/tag/v2.37.2

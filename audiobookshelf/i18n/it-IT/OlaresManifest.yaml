metadata:
  title: AudioBookShelf
  description: Server self-hosted per audiolibri e podcast
spec:
  fullDescription: |
    Audiobookshelf è un server self-hosted per audiolibri e podcast.

    **Funzionalità**
    - Completamente open-source, inclusa l'app Android e iOS (in beta)
    - Streaming al volo di tutti i formati audio
    - Cerca e aggiungi podcast per scaricare episodi con download automatico
    - Supporto multiutente con permessi personalizzati
    - Conserva i progressi per utente e li sincronizza tra dispositivi
    - Rileva automaticamente gli aggiornamenti della libreria, senza bisogno di riscansione
    - Carica libri e podcast con upload in blocco tramite cartelle drag and drop
    - Backup dei metadati + backup giornalieri automatici
    - Progressive Web App (PWA)
    - Supporto Chromecast nell'app web e Android
    - Recupera metadati e copertine da diverse fonti
    - Editor dei capitoli e lookup capitoli (API Audnexus)
    - Unisci i file audio in un singolo m4b
    - Incorpora metadati e immagine di copertina nei file audio
    - Supporto ebook di base e ereader
        - Epub, pdf, cbr, cbz
        - Invia ebook al dispositivo (es. Kindle)
    - Feed RSS aperti per podcast e audiolibri
  upgradeDescription: |
    Aggiorna audiobookshelf da 2.36.0 a 2.37.2. Include i miglioramenti e le correzioni descritti nelle note di rilascio.

    Note di rilascio: https://github.com/advplyr/audiobookshelf/releases/tag/v2.37.2

metadata:
  title: AudioBookShelf
  description: Servidor autoalojado de audiolibros y podcasts
spec:
  fullDescription: |
    Audiobookshelf es un servidor autoalojado de audiolibros y podcasts.

    **Funciones**
    - Completamente de código abierto, incluida la app de Android e iOS (en beta)
    - Transmite todos los formatos de audio al vuelo
    - Busca y añade podcasts para descargar episodios con descarga automática
    - Compatibilidad multiusuario con permisos personalizados
    - Guarda el progreso por usuario y lo sincroniza entre dispositivos
    - Detecta actualizaciones de la biblioteca automáticamente, sin necesidad de volver a escanear
    - Sube libros y podcasts con carga masiva arrastrando y soltando carpetas
    - Copia de seguridad de metadatos + copias diarias automatizadas
    - Progressive Web App (PWA)
    - Compatibilidad con Chromecast en la app web y Android
    - Obtiene metadatos y portadas de varias fuentes
    - Editor de capítulos y búsqueda de capítulos (API de Audnexus)
    - Combina tus archivos de audio en un solo m4b
    - Incrusta metadatos e imagen de portada en tus archivos de audio
    - Compatibilidad básica con ebooks y lector electrónico
        - Epub, pdf, cbr, cbz
        - Enviar ebook al dispositivo (p. ej. Kindle)
    - Feeds RSS abiertos para podcasts y audiolibros
  upgradeDescription: |
    Actualizar Audiobookshelf a 2.36.0 (`advplyr/audiobookshelf:2.36.0`).

    Versión de seguridad: gestión de sesiones (cerrar todas las sesiones / por sesión) y correcciones de validación OIDC, uso de refresh token en API/WebSocket (CVE-2026-73085), borrado de la cuenta root y comprobación de acceso en descargas masivas. Cambiar la contraseña invalida las sesiones existentes.

    Notas: https://github.com/advplyr/audiobookshelf/releases/tag/v2.36.0

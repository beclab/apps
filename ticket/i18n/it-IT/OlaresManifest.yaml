metadata:
  title: Ticket
  description: Il client ufficiale del servizio clienti di Olares
spec:
  fullDescription: |
    Ticket è il client ufficiale del servizio clienti di Olares. Consente agli utenti di raccogliere e caricare log, segnalare problemi, ricevere risposte dall’assistenza e seguire l’avanzamento delle richieste, direttamente dal proprio dispositivo Olares.

    **Funzionalità principali**

    - **Inviare ticket di assistenza con la diagnostica del dispositivo** - Allega automaticamente log di sistema e dati diagnostici per aiutare i team di assistenza a risolvere i problemi più rapidamente.
    - **Seguire lo stato dei ticket in tempo reale** - Resta aggiornato sull’avanzamento delle richieste senza lasciare il tuo dispositivo.
    - **Comunicare con il personale di assistenza** - Dialoga direttamente con il team di assistenza Olares tramite l’interfaccia di messaggistica integrata.
    - **Consultare la cronologia dei ticket** - Accedi al registro completo delle richieste e delle interazioni precedenti per consultarle facilmente.

    Puoi accedere a Ticket anche dalla pagina web di Olares Space: https://space.olares.com/

metadata:
  title: Ticket
  description: El cliente oficial de atención al cliente de Olares
spec:
  fullDescription: |
    Ticket es el cliente oficial de atención al cliente de Olares. Permite recopilar y subir registros, comunicar problemas, recibir respuestas del equipo de asistencia y seguir el progreso de las solicitudes, directamente desde el dispositivo Olares.

    **Funciones principales**

    - **Enviar tickets de asistencia con diagnósticos del dispositivo** - Adjunta automáticamente registros del sistema y datos de diagnóstico para ayudar a los equipos de asistencia a resolver los problemas más rápido.
    - **Seguir el estado de los tickets en tiempo real** - Mantente al día sobre el progreso de tus solicitudes sin salir de tu dispositivo.
    - **Comunicarse con el personal de asistencia** - Conversa directamente con el equipo de asistencia de Olares mediante la interfaz de mensajería integrada.
    - **Consultar el historial de tickets** - Accede al registro completo de todas las solicitudes e interacciones anteriores para consultarlas fácilmente.

    También puedes acceder a Ticket desde la página web de Olares Space: https://space.olares.com/

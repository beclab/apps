metadata:
  title: Ticket
  description: Le client officiel du service d’assistance Olares
spec:
  fullDescription: |
    Ticket est le client officiel du service d’assistance Olares. Il permet aux utilisateurs de collecter et d’envoyer des journaux, de signaler des problèmes, de recevoir les réponses de l’assistance et de suivre leur résolution, directement depuis leur appareil Olares.

    **Fonctionnalités principales**

    - **Soumettre des tickets avec les diagnostics de l’appareil** - Joignez automatiquement les journaux système et les données de diagnostic pour aider les équipes d’assistance à résoudre les problèmes plus rapidement.
    - **Suivre l’état des tickets en temps réel** - Restez informé de l’avancement de vos demandes sans quitter votre appareil.
    - **Communiquer avec l’assistance** - Discutez directement avec l’équipe d’assistance Olares grâce à l’interface de messagerie intégrée.
    - **Consulter l’historique des tickets** - Retrouvez l’ensemble de vos demandes et échanges précédents pour vous y référer facilement.

    Vous pouvez également accéder à Ticket depuis la page web d’Olares Space : https://space.olares.com/

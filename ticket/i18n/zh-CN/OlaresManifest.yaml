metadata:
  title: Ticket
  description: Olares 官方客户服务客户端
spec:
  fullDescription: |
    Ticket 是 Olares 官方客户服务客户端。用户可以直接在 Olares 设备上收集和上传日志、提交问题、接收支持团队的回复并跟踪处理进度。

    **主要功能**

    - **提交包含设备诊断信息的支持工单** - 自动附加系统日志和诊断数据，帮助支持团队更快地解决问题。
    - **实时跟踪工单状态** - 无需离开设备即可随时了解请求的处理进度。
    - **与支持人员沟通** - 通过内置消息界面与 Olares 支持团队直接对话。
    - **查看工单历史** - 查看以往提交的工单和完整沟通记录，便于参考。

    您还可以通过 Olares Space 网页访问 Ticket：https://space.olares.com/

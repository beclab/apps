metadata:
  title: Ticket
  description: Olares公式のカスタマーサービスクライアント
spec:
  fullDescription: |
    TicketはOlares公式のカスタマーサービスクライアントです。Olaresデバイスから直接、ログの収集とアップロード、問題の報告、サポートからの返信の受信、対応状況の確認を行えます。

    **主な機能**

    - **デバイスの診断情報を添えてサポートチケットを送信** - システムログと診断データを自動で添付し、サポートチームによる迅速な問題解決を支援します。
    - **チケットの状況をリアルタイムで確認** - デバイスを離れることなく、問い合わせの対応状況を確認できます。
    - **サポート担当者とやり取り** - 内蔵のメッセージ画面でOlaresサポートチームと直接会話できます。
    - **チケットの履歴を表示** - 過去に送信した問い合わせややり取りの全履歴を簡単に参照できます。

    Olares SpaceのウェブページからもTicketにアクセスできます：https://space.olares.com/

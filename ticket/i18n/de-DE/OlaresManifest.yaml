metadata:
  title: Ticket
  description: Der offizielle Kundenservice-Client für Olares
spec:
  fullDescription: |
    Ticket ist der offizielle Kundenservice-Client für Olares. Nutzer können Protokolle sammeln und hochladen, Probleme melden, Antworten vom Support erhalten und den Bearbeitungsfortschritt verfolgen – alles direkt auf ihrem Olares-Gerät.

    **Hauptfunktionen**

    - **Supporttickets mit Gerätediagnosen einreichen** - Fügen Sie Systemprotokolle und Diagnosedaten automatisch hinzu, damit Supportteams Probleme schneller lösen können.
    - **Ticketstatus in Echtzeit verfolgen** - Bleiben Sie über den Fortschritt Ihrer Anfragen informiert, ohne Ihr Gerät zu verlassen.
    - **Mit Supportmitarbeitern kommunizieren** - Sprechen Sie über die integrierte Nachrichtenoberfläche direkt mit dem Olares-Supportteam.
    - **Ticketverlauf einsehen** - Greifen Sie auf eine vollständige Übersicht aller bisherigen Anfragen und Gespräche zurück, um Informationen leicht nachzuschlagen.

    Sie können Ticket auch über die Olares Space-Webseite aufrufen: https://space.olares.com/

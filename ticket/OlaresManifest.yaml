olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  ticket-bff: 1
  ticket: 1
metadata:
  name: ticket
  description: Official customer service client for Olares
  icon: https://app.cdn.olares.com/appstore/ticket/icon.png
  appid: ticket
  version: '0.1.30'
  title: Ticket
  categories:
    - Utilities_v112
    - workspace

permission:
  appData: true
  appCache: true
  userData:
    - Home
spec:
  versionName: '0.0.30'
  fullDescription: |
    Ticket is the official customer service client for Olares. It allows users to collect and upload logs, submit issues, receive support replies, and track progress — all directly from their Olares device.

    **Key Features**

    - **Submit support tickets with device diagnostics** - Automatically attach system logs and diagnostic data to help support teams resolve issues faster.
    - **Track ticket status in real time** - Stay updated on the progress of your requests without leaving your device.
    - **Communicate with support staff** - Engage in direct conversations with the Olares support team through the integrated messaging interface.
    - **View ticket history** - Access a complete record of all past submissions and interactions for easy reference.

    You can also access Ticket from the Olares Space webpage: https://space.olares.com/

  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredMemory: 512Mi
  limitedMemory: 1Gi
  requiredDisk: 128Mi
  limitedDisk: 2Gi
  requiredCpu: 0.5
  limitedCpu: 2
  supportArch:
    - amd64
    - arm64
options:
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
entrances:
  - name: ticket
    port: 8080
    host: ticket-web-svc
    title: Ticket
    icon: https://app.cdn.olares.com/appstore/ticket/icon.png
    openMethod: window

metadata:
  title: SimpleMindMap
  description: Une bibliothèque de mind mapping simple et puissante pour le Web
spec:
  upgradeDescription: |
    SimpleMindMap a été mis à jour de la version 0.17.0 à la version 0.19.0. Consultez les [notes de version officielles](https://github.com/wanglin2/mind-map/releases/tag/0.19.0) pour connaître les changements du projet amont.
  fullDescription: |
    Simple mind map est une bibliothèque de mind mapping simple et puissante pour le Web.

    **Fonctionnalités**
    - Architecture en plugins : outre les fonctions principales, les autres sont fournies en plugins, utilisation à la demande, taille de paquet réduite
    - Prise en charge des diagrammes de structure logique (gauche, droite), mind maps, organigrammes, organigrammes en répertoire, frises chronologiques (horizontale, verticale), diagrammes en arête de poisson et autres structures
    - Plusieurs thèmes intégrés, styles hautement personnalisables, enregistrement de nouveaux thèmes
    - Le contenu des nœuds prend en charge le texte (normal, rich text), images, icônes, hyperliens, notes, libellés, résumés, formules mathématiques
    - Les nœuds prennent en charge le glisser-déposer (ajustement libre), plusieurs formes ; contenu de nœud extensible, personnalisation complète avec DDM
    - Prise en charge du glisser et du zoom du canevas
    - Prise en charge de la sélection multiple par glisser de souris et Ctrl+clic gauche
    - Export vers json, png, svg, pdf, markdown, xmind, txt ; import depuis json, xmind, markdown
    - Raccourcis clavier, avant/arrière, lignes d'association, recherche et remplacement, minimap, filigrane, barre de défilement, style dessin à main levée, lignes arc-en-ciel, marques et cadres
    - Configurations riches pour divers scénarios et habitudes d'utilisation
    - Prise en charge de l'édition collaborative
    - Prise en charge du mode présentation

metadata:
  title: SimpleMindMap
  description: Una biblioteca sencilla y potente de mapas mentales para la Web
spec:
  upgradeDescription: |
    SimpleMindMap se actualizó de la versión 0.17.0 a la 0.19.0. Consulta las [notas de la versión oficiales](https://github.com/wanglin2/mind-map/releases/tag/0.19.0) para conocer los cambios del proyecto original.
  fullDescription: |
    Simple mind map es una biblioteca sencilla y potente de mapas mentales para la Web.

    **Funciones**
    - Arquitectura de plugins: además de las funciones principales, otras se ofrecen como plugins, uso bajo demanda, menor tamaño del paquete
    - Admite diagramas de estructura lógica (izquierda, derecha), mapas mentales, organigramas, organigramas de directorio, líneas de tiempo (horizontal, vertical), diagramas de espina de pez y otras estructuras
    - Varios temas integrados, estilos altamente personalizables, registro de nuevos temas
    - El contenido de nodos admite texto (normal, texto enriquecido), imágenes, iconos, hipervínculos, notas, etiquetas, resúmenes, fórmulas matemáticas
    - Los nodos admiten arrastre (drag and drop, ajuste libre), múltiples formas; contenido de nodo extensible, personalización completa con DDM
    - Admite arrastre y zoom del lienzo
    - Admite selección múltiple por arrastre del ratón y Ctrl+clic izquierdo
    - Exportación a json, png, svg, pdf, markdown, xmind, txt; importación desde json, xmind, markdown
    - Atajos de teclado, adelante/atrás, líneas de asociación, buscar y reemplazar, minimapa, marca de agua, barra de desplazamiento, estilo dibujado a mano, líneas arcoíris, marcas y marcos
    - Configuraciones abundantes para diversos escenarios y hábitos de uso
    - Admite edición colaborativa
    - Admite modo presentación

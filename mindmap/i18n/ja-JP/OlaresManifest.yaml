metadata:
  title: SimpleMindMap
  description: Web 向けのシンプルで強力なマインドマップライブラリ
spec:
  upgradeDescription: |
    SimpleMindMapを0.17.0から0.19.0に更新しました。開発元の変更内容は[公式リリースノート](https://github.com/wanglin2/mind-map/releases/tag/0.19.0)をご覧ください。
  fullDescription: |
    Simple mind map は Web 向けのシンプルで強力なマインドマップライブラリです。

    **機能**
    - プラグインアーキテクチャ：コア機能以外はプラグインとして提供し、必要に応じて利用してパッケージサイズを削減
    - 論理構造図（左右）、マインドマップ、組織図、ディレクトリ組織図、タイムライン（横・縦）、フィッシュボーン図などの構造に対応
    - 複数の組み込みテーマ、高度にカスタマイズ可能なスタイル、新規テーマの登録に対応
    - ノード内容はテキスト（通常・リッチテキスト）、画像、アイコン、ハイパーリンク、メモ、ラベル、要約、数式に対応
    - ノードのドラッグ（ドラッグ＆ドロップ、自由調整）、複数のノード形状；ノード内容の拡張、DDM による完全カスタムに対応
    - キャンバスのドラッグとズームに対応
    - マウスドラッグ選択と Ctrl＋左クリックによる複数ノード選択に対応
    - json、png、svg、pdf、markdown、xmind、txt へのエクスポート、json、xmind、markdown からのインポートに対応
    - ショートカット、前後移動、関連線、検索と置換、ミニマップ、透かし、スクロールバー、手描きスタイル、虹色ライン、マーク、フレーム
    - さまざまなシナリオと利用習慣に対応する豊富な設定
    - 共同編集に対応
    - プレゼンテーションモードに対応

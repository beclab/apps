metadata:
  title: SimpleMindMap
  description: Eine einfache und leistungsstarke Mindmapping-Bibliothek für das Web
spec:
  upgradeDescription: |
    SimpleMindMap wurde von 0.17.0 auf 0.19.0 aktualisiert. Änderungen des ursprünglichen Projekts sind in den [offiziellen Versionshinweisen](https://github.com/wanglin2/mind-map/releases/tag/0.19.0) beschrieben.
  fullDescription: |
    Simple mind map ist eine einfache und leistungsstarke Mindmapping-Bibliothek für das Web.

    **Funktionen**
    - Plugin-Architektur: neben den Kernfunktionen werden weitere Funktionen als Plugins bereitgestellt, nach Bedarf nutzbar, kleinere Paketgröße
    - Unterstützung für logische Strukturdiagramme (links, rechts), Mindmaps, Organigramme, Verzeichnis-Organigramme, Zeitleisten (horizontal, vertikal), Fischgrätendiagramme und weitere Strukturen
    - Mehrere integrierte Themes, stark anpassbare Styles, Registrierung neuer Themes möglich
    - Knoteninhalt unterstützt Text (normal, Rich Text), Bilder, Icons, Hyperlinks, Notizen, Labels, Zusammenfassungen, mathematische Formeln
    - Knoten unterstützen Ziehen (Drag & Drop, freie Anpassung), mehrere Knotenformen; erweiterbarer Knoteninhalt, vollständige Anpassung mit DDM
    - Unterstützung für Canvas-Ziehen und Zoomen
    - Unterstützung für Mehrfachauswahl per Mausziehen und Strg+Linksklick
    - Export nach json, png, svg, pdf, markdown, xmind, txt; Import aus json, xmind, markdown
    - Tastenkürzel, Vor/Zurück, Verbindungslinien, Suchen und Ersetzen, Minimap, Wasserzeichen, Scrollbar, Handzeichnungsstil, Regenbogenlinien, Markierungen und Rahmen
    - Reichhaltige Konfigurationen für verschiedene Szenarien und Nutzungsgewohnheiten
    - Unterstützung für kollaboratives Bearbeiten
    - Unterstützung für Präsentationsmodus

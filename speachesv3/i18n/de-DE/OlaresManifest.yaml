metadata:
  title: Speaches
  description: OpenAI-kompatibler TTS/STT-Server
spec:
  fullDescription: |
    Speaches ist ein OpenAI-API-kompatibler Server für Streaming-Transkription, Übersetzung und Spracherzeugung. Speech-to-Text nutzt faster-whisper; für Text-to-Speech kommen piper und Kokoro zum Einsatz. Das Projekt strebt an, Ollama — aber für TTS/STT-Modelle — zu sein.

    **Hauptfunktionen**
    - Text-to-Speech mit Kokoro- und Piper-Modellen.
    - Speech-to-Text mit faster-whisper für hochwertige Transkription.
    - OpenAI-kompatible API (/v1/audio/speech, /v1/audio/transcriptions usw.).
    - Eingebaute Gradio-Web-UI für interaktives Testen.
    - Eingebautes Terminal für CLI-Modellverwaltung (herunterladen, auflisten, entfernen).
    - GPU-Beschleunigung (NVIDIA CUDA) mit CPU-Fallback.
    - Shared Entrance für nahtlose Integration mit anderen Olares-Apps.

    **Modellspeicher (App Common, gemeinsam)**
    HF-Modelle liegen im gemeinsamen App-Common-Store `appCommon/huggingface`,
    gemountet unter dem festen Containerpfad `/cache/hf/hub`. Ein llm-init-Download-only-
    Sidecar lädt die vorinstallierten STT/TTS-Modelle in diesen Store; Speaches mountet
    denselben Store und wartet, bis beide Modelle vorhanden sind, bevor es startet.

    **Vorinstallierte Modelle**
    - Kokoro-82M-v1.0-ONNX (TTS) — leichtgewichtige, hochwertige Sprachsynthese.
    - faster-whisper-small (STT) — schnelle und genaue Spracherkennung.
    - Weitere Modelle können über den Terminal-Entrance heruntergeladen werden.

    **Nutzung**
    - Öffnen Sie die Speaches-UI, um TTS/STT interaktiv über die Gradio-Oberfläche zu testen.
    - Nutzen Sie das Terminal, um weitere Modelle von HuggingFace herunterzuladen.
    - Andere Olares-Apps können die API über den Shared Entrance oder den API-Entrance aufrufen.
    - Die API ist vollständig kompatibel mit OpenAI-SDKs und -Bibliotheken.
  upgradeDescription: |
    Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat` umgestellt.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images angeglichen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernt.

    llm-init-Image auf `beclab/llm-init:v1.3.1` angehoben.

    V3-Migration der Shared App Speaches (Engine 0.8.2).
    - speachesserver- / speaches-Untercharts zu einem einzigen Chart zusammengeführt.
    - Das Engine-Deployment heißt jetzt nach der appid (speachesv3); nginx-
      Entrance (speachesingress) und Terminal sind getrennte Workloads, alle über
      workloadReplicas deklariert.
    - Modelle liegen nun im gemeinsamen App-Common-Store appCommon/huggingface
      (festes /cache/hf/hub) statt im pro-Nutzer-Verzeichnis Huggingface/speaches.
    - Neues llm-init-Download-only-Sidecar lädt die vorinstallierten STT/TTS-
      Modelle in den gemeinsamen Store; die Engine wartet, bis beide vorhanden sind.
    - HF-Mirror/Token kommen per valueFrom aus dem System-HF-Konto des Nutzers.

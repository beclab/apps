metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: Un modello di traduzione multilingue servito con llama.cpp

spec:
  upgradeDescription: |
    v1.0.36: Model Console (llm-init) è stato aggiornato alla versione v1.7.21.

  fullDescription: |
    Hy-MT2-1.8B traduce testo scritto tra molte lingue. Può seguire istruzioni su terminologia, stile e input strutturato. Questa app serve la build GGUF `Q4_K_M` con llama.cpp.

    **Funzionalità principali**

    - Tradurre testo tra molte lingue.
    - Seguire istruzioni di traduzione come terminologia e stile.
    - Rendere la traduzione disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `4Gi` di memoria GPU.

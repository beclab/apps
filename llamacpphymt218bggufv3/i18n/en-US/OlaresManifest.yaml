metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: A multilingual translation model served with llama.cpp

spec:
  upgradeDescription: |
    v1.0.36: Model Console (llm-init) updated to v1.7.21.

  fullDescription: |
    Hy-MT2-1.8B translates written text among many languages. It can follow instructions about terminology, style, and structured input. This app serves the `Q4_K_M` GGUF build with llama.cpp.

    **Key features**

    - Translate text between many languages.
    - Follow translation instructions such as terminology and style.
    - Make translation available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `4Gi` of GPU memory is required.

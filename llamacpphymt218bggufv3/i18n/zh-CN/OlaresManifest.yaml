metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: 使用 llama.cpp 提供的多语言翻译模型

spec:
  upgradeDescription: |
    v1.0.36: Model Console（llm-init）版本更新为 v1.7.21。

  fullDescription: |
    Hy-MT2-1.8B 可在多种语言之间翻译书面文本。它能遵循术语、文风和结构化输入等方面的说明。本应用通过 llama.cpp 提供 `Q4_K_M` GGUF 版本。

    **主要功能**

    - 在多种语言之间翻译文本。
    - 遵循术语和文风等翻译说明。
    - 向兼容的 Olares 应用提供翻译能力。

    需要配备至少 `4Gi` 显存的兼容 NVIDIA GPU。

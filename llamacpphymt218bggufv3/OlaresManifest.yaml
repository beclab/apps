olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: llamacpphymt218bggufv3
  icon: https://app.cdn.olares.com/appstore/llm/llamacpp/hymt2.png
  description: A multilingual translation model served with llama.cpp
  appid: llamacpphymt218bggufv3
  title: Hy-MT2-1.8B (llama.cpp)
  version: '1.0.36'
  categories:
    - AI
    - models
  tags:
    - translation
sharedEntrances:
  - name: llamacpphymt218bggufv3
    host: sharedentrances-api
    port: 0
    title: Hy-MT2-1.8B
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/llm/llamacpp/hymt2.png
entrances:
  - name: llamacppclient
    port: 8090
    host: download-svc
    title: Hy-MT2-1.8B
    icon: https://app.cdn.olares.com/appstore/llm/llamacpp/hymt2.png
    openMethod: window
    authLevel: internal
#   llamacpphymt218bggufv3 — engine Deployment (== appid / Release.Name)
#   llminit                  — llm-init / entrance Deployment
workloadReplicas:
  llamacpphymt218bggufv3: 1
  llminit: 1
spec:
  upgradeDescription: |
    v1.0.36: Model Console (llm-init) updated to v1.7.21.

  onlyAdmin: true
  versionName: 'tencent/Hy-MT2-1.8B-GGUF:Q4_K_M'
  fullDescription: |
    Hy-MT2-1.8B translates written text among many languages. It can follow instructions about terminology, style, and structured input. This app serves the `Q4_K_M` GGUF build with llama.cpp.

    **Key features**

    - Translate text between many languages.
    - Follow translation instructions such as terminology and style.
    - Make translation available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `4Gi` of GPU memory is required.
  developer: Tencent
  website: https://huggingface.co/tencent/Hy-MT2-1.8B
  sourceCode: https://huggingface.co/tencent/Hy-MT2-1.8B
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  doc: https://huggingface.co/tencent/Hy-MT2-1.8B
  license:
    - text: Apache-2.0
      url: https://huggingface.co/tencent/Hy-MT2-1.8B-GGUF

  accelerator:
    # Sum rule: accelerator >= engine (llamacpp) + llm-init.
    # nvidia: MEMORY_REQUEST 4Gi + llm-init 256Mi; MEMORY_LIMIT 8Gi + llm-init 2Gi.
    # nvidia-gb10: engine host mem = GPU 4Gi (+ llm-init); limit 4Gi + 2Gi.
    - mode: nvidia
      limitedCpu: "15360m"
      requiredCpu: "500m"
      requiredDisk: 50Mi
      limitedDisk: 100Gi
      limitedMemory: "10Gi"
      requiredMemory: "5Gi"
      requiredGPUMemory: "4Gi"
      limitedGPUMemory: "8Gi"
    - mode: nvidia-gb10
      limitedCpu: "15360m"
      requiredCpu: "500m"
      requiredDisk: 50Mi
      limitedDisk: 100Gi
      limitedMemory: "6Gi"
      requiredMemory: "5Gi"

  supportArch:
    - amd64
    - arm64
permission:
  appCache: true
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://tencent/Hy-MT2-1.8B-GGUF --include Hy-MT2-1.8B-Q4_K_M.gguf"
    description:  "Example: hf://unsloth/Qwen3-0.6B-GGUF --include Qwen3-0.6B-Q4_K_M.gguf. The source to download your model."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "tencent/Hy-MT2-1.8B-GGUF:Q4_K_M"
    description:  "Example: unsloth/Qwen3-0.6B-GGUF:Q4_K_M. The name of your model in `owner/repo:quant` format"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "translate"
    options:
    - title: Translate
      value: translate
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "none"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description:  "The model capabilities. /translate comes from MODEL_MODE=translate, not from this field."
  - envName: ENGINE_ARGS
    required: true
    default: "-c 65536 -ngl all -fa on -ctk q4_0 -ctv q4_0 --jinja -np 16 -kvu"
    type: string
    editable: true
    applyOnChange: true
    description:  "Example: -c 8192 -ngl all -fa on. Extra llama.cpp options."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LLAMACPP_CPU_REQUEST
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_REQUEST # + llm-init 256Mi <= requiredMemory (nvidia/gb10 5Gi)
    required: true
    default: "4Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_CPU_LIMIT
    required: true
    default: "4"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_LIMIT # + llm-init 2Gi <= limitedMemory (nvidia 10Gi / gb10 6Gi)
    required: true
    default: "8Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "4Gi"
    description:  "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model."
    regex: "^[0-9]+(Gi|Mi)?$"

apiVersion: v1
kind: ConfigMap
metadata:
  name: layatypeddecisionsv3-wrapper
  namespace: '{{ .Release.Namespace }}'
data:
  start.sh: |
    #!/bin/sh
    set -eu
    sentinel=/run/llm-init/model_path
    until [ -s "$sentinel" ]; do
      sleep 1
    done
    MODEL_SOURCE="$(sed -n '1p' "$sentinel")"
    test -n "$MODEL_SOURCE"
    export MODEL_SOURCE
    exec systemone-engine

metadata:
  title: Laya Typed Decisions
  description: "Un modelo System One para decisiones estructuradas a partir de textos en inglés"

spec:
  fullDescription: |
    Laya Typed Decisions evalúa textos en inglés y devuelve decisiones estructuradas: una selección entre opciones predefinidas (choice), una valoración en una escala definida (score) o la probabilidad de que una afirmación sea verdadera (noul). Está especializado en el análisis de trazas de agentes, la atención al cliente, el procesamiento de facturas y los incidentes de seguridad.

    Las aplicaciones Olares compatibles pueden acceder al modelo mediante la API /v1/systemone compatible con TypeSafe. Las aplicaciones que lo invocan deben seleccionarlo explícitamente; no se usa para el enrutamiento System One predeterminado de Olares.

    El modelo solo admite inglés, con un contexto de 1.024 tokens, hasta 20 opciones de elección y hasta 10 niveles de puntuación. El modo NVIDIA procesa las solicitudes por lotes y acepta hasta 100 solicitudes en curso. El modo CPU es una alternativa funcional y no ofrece las mismas garantías de concurrencia o rendimiento.

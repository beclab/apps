metadata:
  title: Laya Typed Decisions
  description: "Ein System One-Modell für strukturierte Entscheidungen aus englischen Texten"

spec:
  fullDescription: |
    Laya Typed Decisions wertet englische Texte aus und liefert strukturierte Entscheidungen: eine Auswahl aus vorgegebenen Optionen (choice), eine Bewertung auf einer festgelegten Skala (score) oder die Wahrscheinlichkeit, dass eine Aussage wahr ist (noul). Es ist auf die Analyse von Agentenabläufen, Kundenservice, Rechnungsverarbeitung und Sicherheitsvorfälle spezialisiert.

    Kompatible Olares-Anwendungen können das Modell über die TypeSafe-kompatible API /v1/systemone nutzen. Aufrufende Anwendungen müssen es ausdrücklich auswählen; es wird nicht für das standardmäßige System One-Routing von Olares verwendet.

    Das Modell unterstützt nur Englisch, mit einem Kontext von 1.024 Tokens, bis zu 20 Auswahloptionen und bis zu 10 Bewertungsstufen. Der NVIDIA-Modus verarbeitet Anfragen gebündelt und nimmt bis zu 100 gleichzeitig laufende Anfragen an. Der CPU-Modus dient als funktionale Ausweichlösung und bietet nicht dieselben Zusagen für Parallelität oder Leistung.

metadata:
  title: Laya Typed Decisions
  description: "从英文文本中作出结构化决策的 System One 模型"

spec:
  fullDescription: |
    Laya Typed Decisions 分析英文文本并返回结构化决策：从预定义选项中作出选择（choice）、按指定等级评分（score），或估计某个陈述为真的概率（noul）。该模型专用于智能体执行记录分析、客户服务、发票处理和安全事件场景。

    兼容的 Olares 应用可通过兼容 TypeSafe 的 /v1/systemone API 访问该模型。调用方必须显式选择它；它不会用于 Olares 默认的 System One 路由。

    模型仅支持英文，上下文长度为 1,024 个 token，最多支持 20 个候选选项和 10 个评分等级。NVIDIA 模式批量处理请求，最多接受 100 个同时处理中的请求。CPU 模式可作为功能性备用方案，但不提供相同的并发能力或性能保证。

metadata:
  title: Laya Typed Decisions
  description: "英語テキストから構造化された判断を返すSystem Oneモデル"

spec:
  fullDescription: |
    Laya Typed Decisionsは英語テキストを評価し、定義済みの選択肢からの選択（choice）、指定された段階での評価（score）、またはある記述が真である確率（noul）を返します。エージェントの実行記録の分析、カスタマーサービス、請求書処理、セキュリティインシデントに特化したモデルです。

    対応するOlaresアプリは、TypeSafe互換の/v1/systemone APIを通じてモデルを利用できます。呼び出し元が明示的に選択する必要があり、Olaresの標準のSystem Oneルーティングでは使用されません。

    モデルは英語のみに対応し、コンテキスト長は1,024トークン、選択肢は最大20個、評価段階は最大10段階です。NVIDIAモードではリクエストをまとめて処理し、最大100件の処理中リクエストを受け付けます。CPUモードは機能を利用するための代替手段であり、同じ並行処理能力や性能は保証されません。

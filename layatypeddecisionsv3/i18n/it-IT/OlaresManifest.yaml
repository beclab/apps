metadata:
  title: Laya Typed Decisions
  description: "Un modello System One per decisioni strutturate da testi in inglese"

spec:
  fullDescription: |
    Laya Typed Decisions analizza testi in inglese e restituisce decisioni strutturate: una selezione tra opzioni predefinite (choice), una valutazione su una scala definita (score) o la probabilità che un'affermazione sia vera (noul). È specializzato nell'analisi delle tracce degli agenti, nell'assistenza clienti, nell'elaborazione delle fatture e negli incidenti di sicurezza.

    Le applicazioni Olares compatibili possono accedere al modello tramite l'API /v1/systemone compatibile con TypeSafe. Le applicazioni chiamanti devono selezionarlo esplicitamente; non viene usato per l'instradamento System One predefinito di Olares.

    Il modello supporta solo l'inglese, con un contesto di 1.024 token, fino a 20 opzioni di scelta e fino a 10 livelli di valutazione. La modalità NVIDIA elabora le richieste in gruppi e accetta fino a 100 richieste in corso. La modalità CPU è un'alternativa funzionale e non offre le stesse garanzie di concorrenza o prestazioni.

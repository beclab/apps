metadata:
  title: Laya Typed Decisions
  description: "Un modèle System One de décision structurée à partir de textes anglais"

spec:
  fullDescription: |
    Laya Typed Decisions analyse des textes anglais et renvoie des décisions structurées : une sélection parmi des options prédéfinies (choice), une note sur une échelle définie (score) ou la probabilité qu'une affirmation soit vraie (noul). Il est spécialisé dans l'analyse des traces d'agents, le service client, le traitement des factures et les incidents de sécurité.

    Les applications Olares compatibles peuvent accéder au modèle via l'API /v1/systemone compatible avec TypeSafe. Les applications appelantes doivent le sélectionner explicitement ; il n'est pas utilisé pour le routage System One par défaut d'Olares.

    Le modèle prend uniquement en charge l'anglais, avec un contexte de 1 024 tokens, jusqu'à 20 options de choix et 10 niveaux de notation. Le mode NVIDIA traite les requêtes par lots et accepte jusqu'à 100 requêtes en cours. Le mode CPU offre une solution de repli fonctionnelle, sans les mêmes garanties de concurrence ou de performance.

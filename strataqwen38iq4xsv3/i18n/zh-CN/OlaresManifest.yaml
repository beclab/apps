metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "通过 Strata 本地运行的 Qwen3.8-Flash-Next，支持文本生成、推理和工具调用"
spec:
  upgradeDescription: |
    Strata 的 CPU 限制改为可编辑，引擎 OpenMP 线程数从 14 调到 8。Model Console 升级到 llm-init v1.7.26。

    - CPU 限制默认仍为 18 核，可在设置中修改。保存后会重新启动引擎。本版本的平台配额为 19 核。

    升级 Strata 至 0.2.14。DFlash2 独立持久化到 Common 目录，迁移可校验的旧缓存，重启或升级引擎后继续复用。

    - 运行状态迁至 Common，保留模型/revision 隔离。优先使用已有 Common 配置，否则迁移对应的旧 Cache 目录；首次迁移须在持有旧 Cache 的节点运行。移除同节点亲和限制，通过重试和本地快照读取共享启动脚本。
    - 采用上游按模型及显卡调优的 DFlash2 配置，支持启动失败后自动重试 MTP；保留 128K 上下文和单并发默认值。
    - 按模型名称及下载源 revision 隔离 Model Console 运行状态，升级后等待新权重下载，不再复用旧完成标记和模型卡。保留 Common 中已有下载缓存。
    - 升级至 Strata v0.2.13（引擎 0.1.59），支持 Unsloth Dynamic v3.1，并包含上游 NVIDIA 提示词处理优化。
    - 使用 UD-IQ4_XS-v31 四分片权重，固定 revision 为 `d96201194f103c906994f283f504209dc8d2a10c`。旧三分片模型需要重新下载为 v31。
    - 权重继续存放在 Common，保留 DFlash2 及 MTP 回退机制，并在准备模型前拒绝旧 snapshot 路径。

    [Strata v0.2.13](https://github.com/Niko1221/Strata/releases/tag/v0.2.13)
  fullDescription: |
    Qwen3.8-Flash-Next 是阿里巴巴 Qwen 团队推出的实验性 AI 模型，可用于回答问题和生成文本，并在兼容的应用中支持思考和工具调用。本应用通过 Strata 在本地运行 Unsloth 的 UD-IQ4_XS-v31 量化版本。

    Strata 是用于在本地运行大型 AI 模型的开源推理引擎。它协调使用 GPU 显存、系统内存和存储，使模型无需完整装入显存即可运行。Model Console 将推理引擎接入 Olares。

    **主要功能**

    - 生成文本回复，并在兼容的应用中支持思考和工具调用。
    - 通过 Model Console 下载模型、查看状态和调整引擎设置。
    - 通过 Olares Router 或兼容 OpenAI 的聊天 API 连接兼容的应用。

    **本版本说明**

    本版本仅接受文本输入，已关闭图像和视频输入。默认上下文上限为 131,072 个 token，每次处理一个请求。可用上下文取决于内存和引擎设置。

    **首次使用前**

    首次启动会下载约 94 GB 的模型文件及 Strata 所需的其他文件，然后准备模型。Model Console 显示主模型下载完成时，Strata 可能仍在准备模型。

    需要支持 AVX2 的 CPU，以及 R580 系列或更新版本的 NVIDIA 驱动。此预设面向配备 96 GiB 内存的主机。安装前请查看列出的资源要求。

    [模型文档](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [量化模型](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Strata 文档](https://github.com/Niko1221/Strata)

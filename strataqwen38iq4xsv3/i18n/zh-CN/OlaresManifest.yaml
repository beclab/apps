metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "通过 Strata 本地运行的 Qwen3.8-Flash-Next，支持文本生成、推理和工具调用"
spec:
  upgradeDescription: |
    将 MTP 草稿模型文件和已准备的模型文件存放到共享 Hugging Face 模型缓存目录下。

    已有 Strata 缓存不会自动迁移。如需复用，请在启动更新后的应用前，将旧 Strata 缓存目录中的内容复制到共享应用目录下的 `huggingface/strata/strataqwen38iq4xsv3`。否则，首次启动会重新下载和准备所需文件。
  fullDescription: |
    Qwen3.8-Flash-Next 是阿里巴巴 Qwen 团队推出的实验性 AI 模型，可用于回答问题和生成文本，并在兼容的应用中支持思考和工具调用。本应用通过 Strata 在本地运行 Unsloth 的 UD-IQ4_XS 量化版本。

    Strata 是用于在本地运行大型 AI 模型的开源推理引擎。它协调使用 GPU 显存、系统内存和存储，使模型无需完整装入显存即可运行。Model Console 将推理引擎接入 Olares。

    **主要功能**

    - 生成文本回复，并在兼容的应用中支持思考和工具调用。
    - 通过 Model Console 下载模型、查看状态和调整引擎设置。
    - 通过 Olares Router 或兼容 OpenAI 的聊天 API 连接兼容的应用。

    **本版本说明**

    本版本仅接受文本输入，已关闭图像和视频输入。默认上下文上限为 131,072 个 token，每次处理一个请求。可用上下文取决于内存和引擎设置。

    **首次使用前**

    首次启动会下载约 94 GB 的模型文件及 Strata 所需的其他文件，然后准备模型。Model Console 显示主模型下载完成时，Strata 可能仍在准备模型。

    需要支持 AVX2 的 CPU，以及 R580 系列或更新版本的 NVIDIA 驱动。此预设面向配备 96 GiB 内存的主机。安装前请查看列出的资源要求。

    [模型文档](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [量化模型](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Strata 文档](https://github.com/Niko1221/Strata)

metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "Qwen3.8-Flash-Next per testo, ragionamento e chiamate a strumenti, eseguito in locale con Strata"
spec:
  fullDescription: |
    Qwen3.8-Flash-Next è un modello sperimentale di IA del team Qwen di Alibaba per rispondere a domande e generare testo, con supporto per il ragionamento e le chiamate a strumenti nelle applicazioni compatibili. Questa app esegue localmente l'edizione quantizzata UD-IQ4_XS di Unsloth usando Strata.

    Strata è un motore di inferenza open source per eseguire grandi modelli di IA in locale. Coordina la memoria della GPU, la RAM di sistema e l'archiviazione, così il modello non deve essere contenuto interamente nella memoria della GPU. Model Console collega il motore a Olares.

    **Funzionalità principali**

    - Generare risposte testuali con supporto per una modalità di ragionamento e per le chiamate a strumenti nelle applicazioni compatibili.
    - Usare Model Console per scaricare il modello, visualizzarne lo stato e modificare le impostazioni del motore.
    - Collegare applicazioni compatibili tramite Olares Router o l’API di chat compatibile con OpenAI.

    **Questa edizione**

    Questa edizione accetta solo testo in ingresso; l’inserimento di immagini e video è disattivato. Il limite di contesto predefinito è di 131.072 token e viene elaborata una richiesta alla volta. Il contesto disponibile dipende dalla memoria e dalle impostazioni del motore.

    **Prima del primo utilizzo**

    Al primo avvio vengono scaricati circa 94 GB di file del modello, oltre ai file aggiuntivi necessari a Strata, quindi viene preparato il modello. Model Console può indicare che il download principale è terminato mentre Strata sta ancora preparando il modello.

    Sono necessari una CPU con supporto AVX2 e un driver NVIDIA della serie R580 o successiva. La configurazione predefinita è pensata per un host con 96 GiB di RAM. Consultare i requisiti di risorse indicati prima dell’installazione.

    [Documentazione del modello](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modello quantizzato](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Documentazione di Strata](https://github.com/Niko1221/Strata)

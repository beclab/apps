metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "Qwen3.8-Flash-Next für Textgenerierung, Schlussfolgern und Werkzeugaufrufe, lokal mit Strata"
spec:
  upgradeDescription: |
    Speichert MTP-Entwurfsmodelldateien und vorbereitete Modelldateien beim gemeinsamen Hugging-Face-Modellcache.

    Vorhandene Strata-Cachedateien werden nicht automatisch migriert. Um sie wiederzuverwenden, kopieren Sie den Inhalt des bisherigen Strata-Cacheverzeichnisses vor dem Start der aktualisierten App nach `huggingface/strata/strataqwen38iq4xsv3` im gemeinsamen App-Verzeichnis. Andernfalls werden die erforderlichen Dateien beim ersten Start erneut heruntergeladen und vorbereitet.
  fullDescription: |
    Qwen3.8-Flash-Next ist ein experimentelles KI-Modell des Qwen-Teams von Alibaba zum Beantworten von Fragen und Erzeugen von Texten. In kompatiblen Anwendungen unterstützt es Denkprozesse und Werkzeugaufrufe. Diese App führt Unsloths UD-IQ4_XS-Quantisierung lokal mit Strata aus.

    Strata ist eine Open-Source-Inferenz-Engine, die große KI-Modelle lokal ausführt. Sie koordiniert GPU-Speicher, Arbeitsspeicher und Datenspeicher, sodass das Modell nicht vollständig in den GPU-Speicher passen muss. Model Console verbindet die Engine mit Olares.

    **Hauptfunktionen**

    - Textantworten mit Unterstützung für einen Denkmodus und Tool-Aufrufe in kompatiblen Anwendungen erzeugen.
    - Mit Model Console das Modell herunterladen, seinen Status anzeigen und die Engine-Einstellungen anpassen.
    - Kompatible Anwendungen über Olares Router oder die OpenAI-kompatible Chat-API verbinden.

    **Diese Ausgabe**

    Diese Ausgabe akzeptiert ausschließlich Texteingaben; Bild- und Videoeingaben sind deaktiviert. Das voreingestellte Kontextlimit beträgt 131.072 Token. Es wird jeweils eine Anfrage verarbeitet. Der verfügbare Kontext hängt vom Speicher und den Engine-Einstellungen ab.

    **Vor der ersten Nutzung**

    Beim ersten Start werden etwa 94 GB Modelldateien sowie zusätzliche, von Strata benötigte Dateien heruntergeladen. Anschließend wird das Modell vorbereitet. Model Console kann den Hauptdownload bereits als abgeschlossen anzeigen, während Strata das Modell noch vorbereitet.

    Erforderlich sind eine CPU mit AVX2-Unterstützung und ein NVIDIA-Treiber der Reihe R580 oder neuer. Die Voreinstellung ist für einen Host mit 96 GiB RAM ausgelegt. Prüfen Sie vor der Installation die angegebenen Ressourcenanforderungen.

    [Modelldokumentation](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Quantisiertes Modell](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)

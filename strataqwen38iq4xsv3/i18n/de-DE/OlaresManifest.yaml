metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "Qwen3.8-Flash-Next für Textgenerierung, Schlussfolgern und Werkzeugaufrufe, lokal mit Strata"
spec:
  upgradeDescription: |
    Macht das CPU-Limit von Strata bearbeitbar und senkt die OpenMP-Threadzahl der Engine von 14 auf 8. Aktualisiert Model Console auf llm-init v1.7.26.

    - Das CPU-Limit bleibt standardmäßig bei 18 Kernen und kann in den Einstellungen geändert werden. Speichern startet die Engine neu. Das Kontingent dieser Edition beträgt 19 Kerne.

    Aktualisiert Strata auf 0.2.14. Speichert DFlash2 dauerhaft in Common und verwendet geprüfte alte Caches nach Neustarts und Engine-Upgrades weiter.

    - Verschiebt den Laufzeitstatus nach Common und behält die Modell-/Revisionsisolierung bei. Vorhandene Common-Konfiguration hat Vorrang; andernfalls wird der passende alte Cache migriert. Die erste Migration muss auf dessen Knoten laufen. Entfernt die Knotenaffinität und liest gemeinsame Hilfsskripte mit Wiederholungen über eine lokale Kopie.
    - Verwendet die DFlash2-Abstimmung für Modell und GPU mit automatischem MTP-Neustart; behält 128K Kontext und eine gleichzeitige Anfrage bei.
    - Trennt den Laufzeitstatus nach Modellname und Quellrevision. Upgrades warten auf die neuen Gewichte; vorhandene Downloads in Common bleiben erhalten.
    - Aktualisiert Strata auf v0.2.13 (Engine 0.1.59), mit Unterstützung für Unsloth Dynamic v3.1.
    - UD-IQ4_XS-v31 verwendet vier GGUF-Dateien der festen Revision `d96201194f103c906994f283f504209dc8d2a10c`. Das alte Modell mit drei Dateien muss als v31 neu heruntergeladen werden.

    [Strata v0.2.13](https://github.com/Niko1221/Strata/releases/tag/v0.2.13)
  fullDescription: |
    Qwen3.8-Flash-Next ist ein experimentelles KI-Modell des Qwen-Teams von Alibaba zum Beantworten von Fragen und Erzeugen von Texten. In kompatiblen Anwendungen unterstützt es Denkprozesse und Werkzeugaufrufe. Diese App führt Unsloths UD-IQ4_XS-v31-Quantisierung lokal mit Strata aus.

    Strata ist eine Open-Source-Inferenz-Engine, die große KI-Modelle lokal ausführt. Sie koordiniert GPU-Speicher, Arbeitsspeicher und Datenspeicher, sodass das Modell nicht vollständig in den GPU-Speicher passen muss. Model Console verbindet die Engine mit Olares.

    **Hauptfunktionen**

    - Textantworten mit Unterstützung für einen Denkmodus und Tool-Aufrufe in kompatiblen Anwendungen erzeugen.
    - Mit Model Console das Modell herunterladen, seinen Status anzeigen und die Engine-Einstellungen anpassen.
    - Kompatible Anwendungen über Olares Router oder die OpenAI-kompatible Chat-API verbinden.

    **Diese Ausgabe**

    Diese Ausgabe akzeptiert ausschließlich Texteingaben; Bild- und Videoeingaben sind deaktiviert. Das voreingestellte Kontextlimit beträgt 131.072 Token. Es wird jeweils eine Anfrage verarbeitet. Der verfügbare Kontext hängt vom Speicher und den Engine-Einstellungen ab.

    **Vor der ersten Nutzung**

    Beim ersten Start werden etwa 94 GB Modelldateien sowie zusätzliche, von Strata benötigte Dateien heruntergeladen. Anschließend wird das Modell vorbereitet. Model Console kann den Hauptdownload bereits als abgeschlossen anzeigen, während Strata das Modell noch vorbereitet.

    Erforderlich sind eine CPU mit AVX2-Unterstützung und ein NVIDIA-Treiber der Reihe R580 oder neuer. Die Voreinstellung ist für einen Host mit 96 GiB RAM ausgelegt. Prüfen Sie vor der Installation die angegebenen Ressourcenanforderungen.

    [Modelldokumentation](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Quantisiertes Modell](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)

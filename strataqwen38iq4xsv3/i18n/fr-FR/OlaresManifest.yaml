metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "Qwen3.8-Flash-Next pour générer du texte, raisonner et appeler des outils, en local avec Strata"
spec:
  upgradeDescription: |
    Rend la limite CPU de Strata modifiable et réduit le nombre de threads OpenMP du moteur de 14 à 8. Met à jour Model Console vers llm-init v1.7.26.

    - La limite CPU reste de 18 cœurs par défaut et peut être modifiée dans les paramètres. L’enregistrement relance le moteur. Le quota de cette édition est de 19 cœurs.

    Met à jour Strata vers 0.2.14. Conserve DFlash2 dans Common et réutilise les anciens caches vérifiés après redémarrage ou mise à jour du moteur.

    - Déplace l’état vers Common en conservant l’isolation par modèle et révision. La configuration existante est prioritaire ; sinon, le Cache correspondant est migré sur le nœud qui le contient. Supprime l’affinité au même nœud et réessaie la lecture des scripts partagés via une copie locale.
    - Utilise les réglages DFlash2 par modèle et GPU avec nouvelle tentative automatique via MTP ; conserve le contexte de 128K et une requête à la fois.
    - Isole l’état d’exécution par nom de modèle et révision de la source. Les mises à jour attendent les nouveaux poids et conservent les téléchargements dans Common.
    - Met à jour Strata vers v0.2.13 (moteur 0.1.59), avec prise en charge d’Unsloth Dynamic v3.1.
    - UD-IQ4_XS-v31 utilise quatre fichiers GGUF de la révision fixe `d96201194f103c906994f283f504209dc8d2a10c`. L’ancien modèle à trois fichiers doit être téléchargé à nouveau en version v31.

    [Strata v0.2.13](https://github.com/Niko1221/Strata/releases/tag/v0.2.13)
  fullDescription: |
    Qwen3.8-Flash-Next est un modèle d'IA expérimental de l'équipe Qwen d'Alibaba conçu pour répondre aux questions et générer du texte, avec des fonctions de réflexion et d'appel d'outils dans les applications compatibles. Cette application exécute localement l'édition quantifiée UD-IQ4_XS-v31 d'Unsloth avec Strata.

    Strata est un moteur d'inférence open source qui exécute de grands modèles d'IA localement. Il coordonne la mémoire GPU, la mémoire vive du système et le stockage afin que le modèle n'ait pas à tenir entièrement dans la mémoire GPU. Model Console relie le moteur à Olares.

    **Principales fonctionnalités**

    - Générer des réponses textuelles avec un mode de raisonnement et des appels d’outils dans les applications compatibles.
    - Utiliser Model Console pour télécharger le modèle, consulter son état et ajuster les paramètres du moteur.
    - Connecter des applications compatibles via Olares Router ou l’API de chat compatible avec OpenAI.

    **Cette édition**

    Cette édition accepte uniquement du texte en entrée ; les entrées image et vidéo sont désactivées. La limite de contexte par défaut est de 131 072 tokens, avec une seule requête traitée à la fois. Le contexte disponible dépend de la mémoire et des paramètres du moteur.

    **Avant la première utilisation**

    Au premier démarrage, environ 94 GB de fichiers du modèle sont téléchargés, ainsi que les fichiers supplémentaires nécessaires à Strata, puis le modèle est préparé. Model Console peut indiquer que le téléchargement principal est terminé alors que Strata prépare encore le modèle.

    Un processeur (CPU) prenant en charge AVX2 et un pilote NVIDIA de la série R580 ou ultérieure sont requis. La configuration par défaut est prévue pour un hôte disposant de 96 GiB de RAM. Consultez les ressources requises indiquées avant l’installation.

    [Documentation du modèle](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modèle quantifié](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Documentation de Strata](https://github.com/Niko1221/Strata)

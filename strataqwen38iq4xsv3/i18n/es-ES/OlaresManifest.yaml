metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "Qwen3.8-Flash-Next para generar texto, razonar y usar herramientas, ejecutado localmente con Strata"
spec:
  upgradeDescription: |
    Guarda los archivos del modelo de borrador MTP y los archivos del modelo preparados junto a la caché compartida de modelos de Hugging Face.

    Los archivos existentes de la caché de Strata no se migran automáticamente. Para reutilizarlos, copie el contenido del antiguo directorio de caché de Strata a `huggingface/strata/strataqwen38iq4xsv3` en el directorio compartido de aplicaciones antes de iniciar la aplicación actualizada. De lo contrario, el primer inicio volverá a descargar y preparar los archivos necesarios.
  fullDescription: |
    Qwen3.8-Flash-Next es un modelo experimental de IA del equipo Qwen de Alibaba para responder preguntas y generar texto, con funciones de razonamiento y uso de herramientas en aplicaciones compatibles. Esta aplicación ejecuta localmente la edición cuantizada UD-IQ4_XS de Unsloth mediante Strata.

    Strata es un motor de inferencia de código abierto para ejecutar grandes modelos de IA localmente. Coordina la memoria de la GPU, la RAM del sistema y el almacenamiento para que el modelo completo no tenga que caber en la memoria de la GPU. Model Console conecta el motor a Olares.

    **Funciones principales**

    - Generar respuestas de texto con un modo de razonamiento y llamadas a herramientas en aplicaciones compatibles.
    - Usar Model Console para descargar el modelo, consultar su estado y ajustar la configuración del motor.
    - Conectar aplicaciones compatibles mediante Olares Router o la API de chat compatible con OpenAI.

    **Esta edición**

    Esta edición solo admite texto como entrada; las entradas de imagen y vídeo están desactivadas. El límite de contexto predeterminado es de 131.072 tokens y se procesa una solicitud cada vez. El contexto disponible depende de la memoria y de la configuración del motor.

    **Antes del primer uso**

    En el primer inicio se descargan aproximadamente 94 GB de archivos del modelo, además de los archivos adicionales que necesita Strata. Después se prepara el modelo. Model Console puede indicar que la descarga principal ha finalizado mientras Strata aún está preparando el modelo.

    Se requieren una CPU compatible con AVX2 y un controlador NVIDIA de la serie R580 o posterior. La configuración predeterminada está pensada para un equipo con 96 GiB de RAM. Consulte los requisitos de recursos indicados antes de instalar la aplicación.

    [Documentación del modelo](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modelo cuantizado](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Documentación de Strata](https://github.com/Niko1221/Strata)

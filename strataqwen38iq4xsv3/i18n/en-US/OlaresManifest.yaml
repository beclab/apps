metadata:
  title: Qwen3.8-Flash-Next (Strata)
  description: "Qwen3.8-Flash-Next for text generation, reasoning, and tool calling, powered locally by Strata"
spec:
  upgradeDescription: |
    Makes the Strata CPU limit editable and lowers the engine OpenMP thread count from 14 to 8. Updates Model Console to llm-init v1.7.26.

    - The CPU limit stays 18 cores by default and can be changed in settings. Saving it relaunches the engine. This edition's platform quota is 19 cores.

    Updates Strata to 0.2.14. Persists DFlash2 in a dedicated Common directory, reusing verified older caches across restarts and engine upgrades.

    - Moves runtime state to Common while retaining model/revision isolation. Existing Common configuration takes priority; otherwise the matching legacy Cache directory is migrated. The first migration must run on the node holding that Cache. Removes same-node affinity and retries shared helper reads through a local snapshot.
    - Uses upstream DFlash2 model/card tuning with automatic MTP retry; keeps the 128K context and single-request defaults.
    - Isolates Model Console runtime state by model name and source revision, so upgrades wait for the new weights instead of reusing old completion markers and model cards. Existing Common downloads are retained.
    - Updates Strata to v0.2.13 (engine 0.1.59), with support for Unsloth Dynamic v3.1 and upstream NVIDIA prompt-processing improvements.
    - Uses UD-IQ4_XS-v31: four GGUF shards pinned to revision `d96201194f103c906994f283f504209dc8d2a10c`. The old three-shard model must be downloaded again as v31.
    - Keeps model weights in Common, preserves DFlash2 with MTP fallback, and rejects stale snapshot handoffs before preparation.

    [Strata v0.2.13](https://github.com/Niko1221/Strata/releases/tag/v0.2.13)
  fullDescription: |
    Qwen3.8-Flash-Next is an experimental AI model from Alibaba's Qwen team for answering questions and generating text, with support for thinking and tool calling in compatible applications. This app runs Unsloth's UD-IQ4_XS-v31 quantized edition locally using Strata.

    Strata is an open-source inference engine for running large AI models locally. It coordinates GPU memory, system RAM, and storage so the full model does not need to fit in GPU memory. Model Console connects the engine to Olares.

    **Key features**

    - Generate text responses with support for thinking and tool calling in compatible applications.
    - Use Model Console to download the model, view its status, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition accepts text input only; image and video input are disabled. The default context limit is 131,072 tokens, with one request processed at a time. Available context depends on memory and engine settings.

    **Before first use**

    First startup downloads approximately 94 GB of model files plus additional files needed by Strata, then prepares the model. Model Console may show the main download as complete while Strata is still preparing the model.

    An AVX2-capable CPU and an NVIDIA driver from the R580 series or newer are required. The preset is intended for a host with 96 GiB of RAM. See the listed resource requirements before installing.

    [Model documentation](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Quantized model](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Strata documentation](https://github.com/Niko1221/Strata)

{{- $strataclientDomainENV := split "," .Values.domain.strataclient -}}
{{- $strataclientDomain := index $strataclientDomainENV "_0" -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- /* MODEL_SUPPORTS is a multi-select of coarse capability GROUPS (vision /
       tools / thinking). Expand each group one-to-many into the supports_*
       keys llm-init validates against its gateway AllSupports mirror, then
       re-join into the CSV the container env expects. "none" is the
       required-field fallback (no extra capabilities); the legacy "embedding"
       token is kept as an alias for it. Unknown tokens pass through verbatim
       so a raw supports_* key still works. */ -}}
{{- $supportsGroups := dict
      "vision" "supports_vision"
      "tools" "supports_function_calling,supports_parallel_function_calling,supports_tool_choice"
      "thinking" "supports_reasoning,supports_reasoning_effort"
      "none" ""
      "embedding" "" -}}
{{- $modelSupports := $oe.MODEL_SUPPORTS | default "" -}}
{{- $expandedSupports := list -}}
{{- range $tok := splitList "," $modelSupports -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- if hasKey $supportsGroups $tok -}}
{{- $mapped := index $supportsGroups $tok -}}
{{- if $mapped -}}
{{- $expandedSupports = append $expandedSupports $mapped -}}
{{- end -}}
{{- else -}}
{{- $expandedSupports = append $expandedSupports $tok -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $modelSupports = join "," $expandedSupports -}}
{{- /* Publish reasoning levels and the default on the model card for Router. */ -}}
{{- $reasoningEffort := $oe.MODEL_REASONING_EFFORT | default "" -}}
{{- $reasoningEffortDefault := $oe.MODEL_REASONING_EFFORT_DEFAULT | default "" -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- $logLevel := $oe.LOG_LEVEL | default "debug" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $runStateHostPath := include "strata.runStateHostPath" . -}}
---
# llm-init Pod (no GPU). Downloads the checkpoint, writes sentinel + model_path,
# serves progress UI + OpenAI /v1/* proxy on :8090, and reverse-proxies the
# engine at the URL it derives from ENGINE_KIND.
#
# ENGINE_KIND=strata routes to the strata Service on port 8080.
# The sidecar image must include native Strata support.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Static name — engine Deployment uses {{ .Release.Name }} for allowMultipleInstall.
  name: llminit
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llm-init
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
    spec:
      restartPolicy: Always
      # Both pods share run-state and model hostPath mounts; follow the engine onto its node.
      # Keep the target instance label off this Pod to prevent self-affinity
      # from allowing llm-init to schedule before the engine on another node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - '{{ .Release.Name }}'
            namespaces:
            - {{ .Release.Namespace }}
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
      initContainers:
        # hostPath dirs are created root-owned; llm-init runs as UID 1000.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              hub={{ include "strata.hfPath" . | quote }}
              repo="$hub/models--unsloth--Qwen3.8-Flash-Next-GGUF"
              # The engine's nested mtp hostPath can create this parent as root.
              # Fix only these known directories, never recursively chown shared models.
              mkdir -p "$hub/.locks/models--unsloth--Qwen3.8-Flash-Next-GGUF" "$repo/blobs" "$repo/refs" "$repo/snapshots"
              chown 1000:1000 "$hub" "$hub/.locks" "$hub/.locks/models--unsloth--Qwen3.8-Flash-Next-GGUF" "$repo" "$repo/blobs" "$repo/refs" "$repo/snapshots" /run/llm-init
          volumeMounts:
            - name: hf-cache
              mountPath: {{ include "strata.hfPath" . }}
            - name: run-state
              mountPath: /run/llm-init
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 0
      containers:
        - name: llm-init
          # Upgrade to an image built with native ENGINE_KIND=strata support.
          image: {{ .Values.images.llmInit | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HUB_CACHE
              value: {{ include "strata.hfPath" . | quote }}
            - name: ENGINE_KIND
              value: strata
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: {{ $modelSource | quote }}
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
{{- if $modelSupports }}
            - name: MODEL_SUPPORTS
              value: "{{ $modelSupports }}"
{{- end }}
{{- if $reasoningEffort }}
            - name: MODEL_REASONING_EFFORT
              value: "{{ $reasoningEffort }}"
{{- end }}
{{- if $reasoningEffortDefault }}
            - name: MODEL_REASONING_EFFORT_DEFAULT
              value: "{{ $reasoningEffortDefault }}"
{{- end }}
            - name: ENGINE_ARGS
              value: {{ $engineArgs | quote }}
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "{{ $logLevel }}"
            - name: LOG_FORMAT
              value: json
            - name: APP_URL
              value: "https://{{ $strataclientDomain }}"
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: {{ include "strata.hfPath" . }}
            - name: run-state
              mountPath: /run/llm-init
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # The GGUF shards stream to disk with a bounded footprint,
              # but `hf download` still runs a python subprocess in this cgroup;
              # 2Gi gives the huggingface_hub CLI headroom on a 3-shard repo.
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP

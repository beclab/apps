# Scripts are embedded here, matching the FreeToken chart layout.
# The ConfigMap mounts them under /llm-init/wrappers in the engine container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-init-wrappers
  namespace: {{ .Release.Namespace }}
data:
  strata.sh: |
    #!/bin/sh
    set -eu

    ENGINE=strata
    WRAPPER_COMMON=${WRAPPER_COMMON:-"$(dirname "$0")/common.sh"}
    # Snapshot the shared helper locally; a cross-node update may briefly fail to open.
    _common_copy=$(mktemp "${TMPDIR:-/tmp}/strata-common.XXXXXX")
    _wc=0
    while ! cp "$WRAPPER_COMMON" "$_common_copy" 2>/dev/null; do
        if [ "$_wc" -ge "${WRAPPER_COMMON_WAIT:-3600}" ]; then
            rm -f "$_common_copy"
            printf '[wrapper] %s could not be read\n' "$WRAPPER_COMMON" >&2
            exit 1
        fi
        printf '[wrapper] waiting for %s (elapsed=%ss)\n' "$WRAPPER_COMMON" "$_wc"
        sleep 5
        _wc=$((_wc + 5))
    done
    # shellcheck source=common.sh
    . "$_common_copy"
    rm -f "$_common_copy"
    unset _wc _common_copy

    wait_for_sentinel
    wait_for_engine_args_handoff
    MODEL_PATH=$(read_model_path)

    export MODEL_PATH

    run_strata() {
        load_engine_args_from_handoff
        export ENGINE_ARGS
        exec "${STRATA_PYTHON:-/opt/strata/.venv/bin/python}" \
            "${STRATA_LAUNCHER:-/llm-init/wrappers/prepare-strata.py}" "$@"
    }

    supervise_engine run_strata "$@"
  prepare-strata.py: |
    #!/usr/bin/env python3
    """Prepare the downloaded GGUF with upstream setup.py, then exec its API server."""
    import hashlib
    import json
    import os
    from pathlib import Path
    import shlex
    import shutil
    import signal
    import subprocess
    import sys

    # These belong to the chart's download, networking and model contract.
    MANAGED = {
        '--family', '--model', '--data-dir', '--models-dir', '--gguf-dir', '--host',
        '--port', '--api-key', '--backend', '--vision', '--gpu', '--gpus', '--prebuilt',
        '--build', '--setup', '--yes', '--no-start', '--check', '--update', '--inspect',
        '--browser', '--no-browser', '--skip-build', '--rollback-engine', '--cuda',
    }


    def drop_pool_workers(argv):
        # setup.py counts host P+E cores and writes --pool-workers 15. This
        # container's CPU limit is lower, so those extra threads are throttled
        # together. The engine sizes the pool to the cgroup when the flag is
        # absent, which is the count its own startup warning asks for.
        out = []
        skip = False
        for arg in argv:
            if skip:
                skip = False
                continue
            if arg == '--pool-workers':
                skip = True
                continue
            if arg.startswith('--pool-workers='):
                continue
            out.append(arg)
        return out


    def publish_model_name(cfg):
        # Strata only enables DFlash2 for qwen3.8-flash-next-unsloth-*.
        # Model Console and Router keep the public id, published as an alias.
        public = os.environ.get('MODEL_NAME', '').strip()
        native = str(cfg.get('model_name') or '').strip()
        if not native:
            native = 'qwen3.8-flash-next-unsloth-ud-iq4_xs-v31'
        cfg['model_name'] = native
        if public and public != native:
            cfg['aliases'] = [public]


    def persist_dflash2(data, drafting, shared=Path('/dflash2')):
        shared.mkdir(parents=True, exist_ok=True)
        # Reuse a verified pack from an earlier engine-version cache before downloading.
        def ready(folder):
            return drafting.pack_ready(folder) or drafting.tuned_ok(folder) or drafting.converted_ok(folder)

        if not ready(shared.parent):
            for previous in sorted(data.parent.glob('*/dflash2')):
                if previous.is_dir() and not previous.is_symlink() and ready(previous.parent):
                    shutil.copytree(previous, shared, dirs_exist_ok=True)
                    print(f'[strata] reused DFlash2 cache from {previous}', flush=True)
                    break
        link = data / 'dflash2'
        if link.is_symlink():
            if link.resolve() == shared.resolve():
                return
            link.unlink()
        elif link.exists():
            # Preserve the old files; never delete a model directory during migration.
            link.rename(data / 'dflash2.legacy')
        link.symlink_to(shared, target_is_directory=True)


    def enable_dflash2(cfg, data, root):
        # Direct setup/server launches bypass the Terminal's drafter preparation.
        # The pack is checked and reused; a failed download leaves MTP in place.
        cfg['drafting'] = 'mtp'
        sys.path.insert(0, str(root))
        try:
            from strata_control import drafting, drafting_fetch
            from serve.server import drafting_vram_mib
        except Exception as exc:
            print(f'[strata] DFlash2 drafter was not prepared ({exc}). This start keeps MTP.', flush=True)
            return

        def progress(msg, _done, _total):
            print(f'[strata] {msg}', flush=True)

        try:
            persist_dflash2(data, drafting)
            backend, archs = drafting.detect_hardware()
            pack = drafting_fetch.ensure_for(
                data, model_name=cfg.get('model_name'), backend=backend,
                archs=archs, args=cfg.get('args') or [],
                vram_mib=drafting_vram_mib(cfg, backend, archs),
                progress=progress, throttle=True)
            if pack is None:
                print('[strata] DFlash2 drafter unavailable. This start keeps MTP.', flush=True)
                return
        except Exception as exc:
            print(f'[strata] DFlash2 drafter was not prepared ({exc}). This start keeps MTP.', flush=True)
            return
        # Auto applies upstream card-specific defaults and permits MTP retry on startup failure.
        cfg['drafting'] = 'auto'
        print(f'[strata] DFlash2 drafter ready: {pack}', flush=True)


    def setup_args(raw):
        args = shlex.split(raw)
        for arg in args:
            if arg.split('=', 1)[0] in MANAGED:
                raise ValueError(f'{arg}: managed by the Strata chart, not ENGINE_ARGS')
        return args


    def run_setup(command, cwd):
        # A restart during preparation must also stop pack/MTP subprocesses.
        child = subprocess.Popen(command, cwd=cwd, start_new_session=True)

        def stop(signum, _frame):
            os.killpg(child.pid, signal.SIGTERM)
            try:
                child.wait(timeout=10)
            except subprocess.TimeoutExpired:
                os.killpg(child.pid, signal.SIGKILL)
                child.wait()
            raise SystemExit(128 + signum)

        old = {sig: signal.signal(sig, stop) for sig in (signal.SIGTERM, signal.SIGINT)}
        try:
            if child.wait() != 0:
                raise RuntimeError('Strata setup failed; refusing to start with stale configuration')
        finally:
            for sig, handler in old.items():
                signal.signal(sig, handler)


    def main():
        root = Path(os.environ.get('STRATA_ROOT', '/opt/strata'))
        source = Path(os.environ['MODEL_PATH'])
        if source.is_file():
            source = source.parent
        if not source.is_dir() or not list(source.glob('*.gguf')):
            raise ValueError(f'No GGUF shards in {source}; MODEL_SOURCE must select the UD-IQ4_XS subdir')
        expected = [f'Qwen3.8-Flash-Next-UD-IQ4_XS-{i:05d}-of-00004.gguf' for i in range(1, 5)]
        missing = [name for name in expected if not (source / name).is_file()]
        if missing:
            raise ValueError(f'Incomplete GGUF snapshot; llm-init must download missing shards: {missing}')
        revision = 'd96201194f103c906994f283f504209dc8d2a10c'
        # Check the snapshot directory before resolving individual HF blob links.
        # An upgrade can briefly leave llm-init's previous model_path handoff.
        if source.parent.parent.name == 'snapshots' and source.parent.name != revision:
            raise ValueError(f'Wrong HF revision {source.parent.name}; expected {revision}. '
                             'Download the pinned v31 model in Model Console before starting.')
        args = setup_args(os.environ.get('ENGINE_ARGS', ''))
        defaults = ['--context', '131072', '--parallel', '1',
                    '--resident-budget-gib', '56', '--kv', 'int8',
                    '--kv-streaming', 'auto', '--vram-reserve-mib', '1024']
        # Never reuse a derived pack after changing the downloaded HF snapshot.
        identity = str(source.resolve()) + (root / 'engine/BUILD.json').read_text()
        key = hashlib.sha256(identity.encode()).hexdigest()[:20]
        data = Path(os.environ.get('STRATA_DATA', '/data')) / key
        data.mkdir(parents=True, exist_ok=True)
        # Unsloth setup writes SHA-256 .done markers beside the shards. Keep
        # shared HF blobs read-only, with writable links/markers in our cache.
        gguf = data / 'gguf'
        gguf.mkdir(exist_ok=True)
        for name in expected:
            shard = source / name
            link = gguf / shard.name
            if not link.is_symlink() or link.resolve() != shard.resolve():
                link.unlink(missing_ok=True)
                link.with_name(link.name + '.done').unlink(missing_ok=True)
                link.symlink_to(shard.resolve())
        port = os.environ.get('STRATA_PORT', '8080')
        generated = root / 'strata-unsloth-ud-iq4_xs-v31.json'
        # This file is generated by us, not an operator-owned model configuration.
        # Avoid upstream's merge of old settings (e.g. a removed parallel flag).
        generated.unlink(missing_ok=True)
        command = [sys.executable, str(root / 'setup.py'),
                   '--setup', '--yes', '--no-start', '--no-browser',
                   '--family', 'unsloth', '--model', 'UD-IQ4_XS-v31', '--backend', 'cuda',
                   '--gpu', '0', '--vision', 'no', '--data-dir', str(data),
                   '--gguf-dir', str(gguf), '--host', '0.0.0.0', '--port', port,
                   *defaults, *args]
        print('[strata] preparing GGUF and MTP cache; first start can take several minutes', flush=True)
        run_setup(command, root)
        cfg = json.loads(generated.read_text())
        cfg['args'] = drop_pool_workers(cfg.get('args') or [])
        publish_model_name(cfg)
        enable_dflash2(cfg, data, root)
        cfg['log'] = str(data / 'engine.log')
        cfg['open_browser'] = False
        cfg.pop('api_key', None)  # internal ClusterIP only; Olares authenticates the entrance.
        target = data / 'server.json'
        temporary = target.with_suffix('.tmp')
        temporary.write_text(json.dumps(cfg, indent=2))
        temporary.replace(target)
        os.chdir(root)
        os.execv(sys.executable, [sys.executable, str(root / 'serve/server.py'),
                                '--engine', 'strata', '--config', str(target),
                                '--host', '0.0.0.0', '--port', port])


    if __name__ == '__main__':
        main()
  strata-healthcheck.py: |
    #!/usr/bin/env python3
    import json
    import os
    import sys
    import urllib.request


    def healthy(state):
        return isinstance(state, dict) and state.get('status') == 'ok' and state.get('loaded') is True


    def main():
        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
        try:
            with opener.open('http://127.0.0.1:' + os.environ.get('STRATA_PORT', '8080') + '/health', timeout=3) as response:
                return 0 if healthy(json.load(response)) else 1
        except (OSError, ValueError):
            return 1


    if __name__ == '__main__':
        sys.exit(main())

metadata:
  title: Hoppscotch
  description: Open-Source-Ökosystem für API-Entwicklung
spec:
  fullDescription: |
    Hoppscotch ist eine Open-Source-Alternative zu Postman, Insomnia
    
    **Funktionen**
    
    **Lightweight:** Mit minimalistischem UI-Design gestaltet.
    **Fast:** Anfragen senden und Antworten in Echtzeit erhalten.
    **HTTP Methods:** Anfragemethoden definieren die Art der auszuführenden Aktion.
    **Theming:** Anpassbare Kombinationen für Hintergrund-, Vordergrund- und Akzentfarben — jetzt anpassen.
    **PWA:** Als Progressive Web App auf Ihrem Gerät installieren.
    **Request:** Antwort vom Endpunkt sofort abrufen.  
    **WebSocket:** Vollduplex-Kommunikationskanäle über eine einzelne TCP-Verbindung.
    **Server-Sent Events:** Update-Stream vom Server über eine HTTP-Verbindung ohne Polling empfangen.
    **Socket.IO:** Daten mit dem SocketIO-Server senden und empfangen.
    **MQTT:** Themen eines MQTT-Brokers abonnieren und veröffentlichen.
    **GraphQL:** GraphQL ist eine Abfragesprache für APIs und eine Runtime zur Erfüllung dieser Abfragen mit Ihren vorhandenen Daten.
    **Authorization:** Ermöglicht die Identifikation des Endnutzers.
    **Headers:** Beschreibt das Format, in dem der Body Ihrer Anfrage gesendet wird.    
    **Parameters:** Anfrageparameter nutzen, um variable Teile in simulierten Anfragen zu setzen.
    **Request Body:** Zum Senden und Empfangen von Daten über die REST API.
    **Response:** Enthält Statuszeile, Header und den Nachrichten-/Antwortbody.
    **History:** Anfrageeinträge werden mit Ihrem Cloud-/lokalen Session-Storage synchronisiert.
    **Collections:** Halten Sie API-Anfragen mit Collections und Ordnern organisiert. Mit einem Klick wiederverwenden.
    **Pre-Request Scripts:** Code-Snippets, die vor dem Senden der Anfrage ausgeführt werden.
    **Teams:** Hilft bei der Zusammenarbeit in Teams, um APIs schneller zu entwerfen, zu entwickeln und zu testen.
    **Workspaces:** Organisieren Sie persönliche und Team-Collections sowie Environments in Workspaces. Wechseln Sie leicht zwischen Workspaces, um mehrere Projekte zu verwalten.
    **Keyboard Shortcuts:** Für Effizienz optimiert.
    **Proxy:** Proxy-Modus in den Einstellungen aktivieren, um blockierte APIs zu erreichen.
    **i18n:** Erleben Sie die App in Ihrer Sprache.
    **Auth + Sync:** Anmelden und Daten in Echtzeit über alle Geräte synchronisieren.
    **Synchronize your data:** Handoff, um Aufgaben auf anderen Geräten fortzusetzen.
    **Post-Request Tests:** Tests zu einer Anfrage schreiben, die nach der Antwort ausgeführt werden.
    **Environments:** Umgebungsvariablen speichern und Werte in Anfragen und Skripten wiederverwenden.
    **Bulk Edit:** Schlüssel-Wert-Paare in großen Mengen bearbeiten.
    **Admin dashboard:** Team verwalten und Mitglieder einladen.
    **Add-ons:** Offizielle Add-ons für hoppscotch.

  upgradeDescription: |
    Upstream-Release: [Hoppscotch 2026.8.0](https://github.com/hoppscotch/hoppscotch/releases/tag/2026.8.0)

    **Änderungen**

    - REST- und GraphQL-Anfragen teilen einen Workspace.
    - Collection-Läufe können Zeilen aus einer CSV- oder JSON-Datendatei durchlaufen.
    - Der Hoppscotch-MCP-Server kann mit Collections, Requests und Environments arbeiten.

    **Fehlerbehebungen**

    - Die Anfragedokumentation bleibt beim Speichern erhalten.
    - Host-only-Cookies bleiben auf dem Host, der sie gesetzt hat.
    - Die Cookie-Erfassung funktioniert weiterhin, wenn der Agent nur `Set-Cookie` zurückgibt.
    - Diese Version enthält einen Sicherheits-Patch für Abhängigkeiten.

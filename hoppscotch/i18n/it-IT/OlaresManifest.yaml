metadata:
  title: Hoppscotch
  description: Ecosistema open source per lo sviluppo di API
spec:
  fullDescription: |
    Hoppscotch è un’alternativa open-source a Postman, Insomnia
    
    **Funzionalità**
    
    **Lightweight:** Realizzato con un design UI minimalista.
    **Fast:** Invia richieste e ricevi risposte in tempo reale.
    **HTTP Methods:** I metodi di richiesta definiscono il tipo di azione da eseguire.
    **Theming:** Combinazioni personalizzabili per colori di sfondo, primo piano e accento — personalizza ora.
    **PWA:** Installa come Progressive Web App sul tuo dispositivo.
    **Request:** Ottieni la risposta dall’endpoint all’istante.  
    **WebSocket:** Stabilisci canali di comunicazione full-duplex su una singola connessione TCP.
    **Server-Sent Events:** Ricevi un flusso di aggiornamenti dal server su una connessione HTTP senza ricorrere al polling.
    **Socket.IO:** Invia e ricevi dati con il server SocketIO.
    **MQTT:** Iscriviti e pubblica su topic di un broker MQTT.
    **GraphQL:** GraphQL è un linguaggio di query per API e un runtime per soddisfare quelle query con i tuoi dati esistenti.
    **Authorization:** Consente di identificare l’utente finale.
    **Headers:** Descrive il formato in cui viene inviato il body della richiesta.    
    **Parameters:** Usa i parametri di richiesta per impostare parti variabili nelle richieste simulate.
    **Request Body:** Usato per inviare e ricevere dati tramite la REST API.
    **Response:** Contiene la status line, gli header e il body del messaggio/risposta.
    **History:** Le voci di richiesta sono sincronizzate con lo storage di sessione cloud/locale.
    **Collections:** Tieni organizzate le richieste API con collection e cartelle. Riutile con un clic.
    **Pre-Request Scripts:** Snippet di codice associati a una richiesta ed eseguiti prima dell’invio.
    **Teams:** Aiuta a collaborare tra team per progettare, sviluppare e testare API più velocemente.
    **Workspaces:** Organizza collection e environment personali e di team in workspace. Passa facilmente tra workspace per gestire più progetti.
    **Keyboard Shortcuts:** Ottimizzato per l’efficienza.
    **Proxy:** Abilita la modalità Proxy dalle Impostazioni per accedere ad API bloccate.
    **i18n:** Usa l’app nella tua lingua.
    **Auth + Sync:** Accedi e sincronizza i dati in tempo reale su tutti i dispositivi.
    **Synchronize your data:** Handoff per continuare le attività su altri dispositivi.
    **Post-Request Tests:** Scrivi test associati a una richiesta eseguiti dopo la risposta.
    **Environments:** Le variabili d’ambiente permettono di memorizzare e riusare valori in richieste e script.
    **Bulk Edit:** Modifica coppie chiave-valore in blocco.
    **Admin dashboard:** Gestisci il team e invita membri.
    **Add-ons:** Add-on ufficiali per hoppscotch.

  upgradeDescription: |
    Release upstream: [Hoppscotch 2026.8.0](https://github.com/hoppscotch/hoppscotch/releases/tag/2026.8.0)

    **Novità**

    - Le richieste REST e GraphQL condividono un unico workspace.
    - Le esecuzioni delle collection possono iterare le righe di un file di dati CSV o JSON.
    - Il server MCP Hoppscotch può lavorare con collection, request e environment.

    **Correzioni**

    - La documentazione della request viene conservata al salvataggio.
    - I cookie host-only restano sull’host che li ha impostati.
    - L’acquisizione dei cookie funziona ancora quando l’Agent restituisce solo `Set-Cookie`.
    - Questa release include una patch di sicurezza delle dipendenze.

metadata:
  title: Hoppscotch
  description: Écosystème open source de développement d’API
spec:
  fullDescription: |
    Hoppscotch est une alternative open-source à Postman, Insomnia
    
    **Fonctionnalités**
    
    **Lightweight :** Conçu avec une UI minimaliste.
    **Fast :** Envoyez des requêtes et recevez des réponses en temps réel.
    **HTTP Methods :** Les méthodes de requête définissent le type d’action à exécuter.
    **Theming :** Combinaisons personnalisables pour les couleurs d’arrière-plan, de premier plan et d’accent — personnalisez maintenant.
    **PWA :** Installez-la comme Progressive Web App sur votre appareil.
    **Request :** Récupérez la réponse de l’endpoint instantanément.  
    **WebSocket :** Établissez des canaux de communication full-duplex sur une seule connexion TCP.
    **Server-Sent Events :** Recevez un flux de mises à jour d’un serveur via HTTP sans recourir au polling.
    **Socket.IO :** Envoyez et recevez des données avec le serveur SocketIO.
    **MQTT :** Abonnez-vous et publiez sur les topics d’un broker MQTT.
    **GraphQL :** GraphQL est un langage de requête pour les API et un runtime pour satisfaire ces requêtes avec vos données existantes.
    **Authorization :** Permet d’identifier l’utilisateur final.
    **Headers :** Décrit le format dans lequel le corps de votre requête est envoyé.    
    **Parameters :** Utilisez des paramètres de requête pour fixer des parties variables dans des requêtes simulées.
    **Request Body :** Utilisé pour envoyer et recevoir des données via l’API REST.
    **Response :** Contient la ligne de statut, les en-têtes et le corps du message/réponse.
    **History :** Les entrées de requête sont synchronisées avec votre stockage de session cloud/local.
    **Collections :** Organisez vos requêtes API avec des collections et des dossiers. Réutilisez-les en un clic.
    **Pre-Request Scripts :** Fragments de code associés à une requête et exécutés avant l’envoi.
    **Teams :** Aide à collaborer entre équipes pour concevoir, développer et tester des API plus vite.
    **Workspaces :** Organisez collections et environnements personnels et d’équipe en workspaces. Passez facilement d’un workspace à l’autre pour gérer plusieurs projets.
    **Keyboard Shortcuts :** Optimisé pour l’efficacité.
    **Proxy :** Activez le mode Proxy dans les Paramètres pour accéder aux API bloquées.
    **i18n :** Utilisez l’app dans votre langue.
    **Auth + Sync :** Connectez-vous et synchronisez vos données en temps réel sur tous vos appareils.
    **Synchronize your data :** Handoff pour continuer les tâches sur d’autres appareils.
    **Post-Request Tests :** Écrivez des tests associés à une requête exécutés après la réponse.
    **Environments :** Les variables d’environnement permettent de stocker et réutiliser des valeurs dans vos requêtes et scripts.
    **Bulk Edit :** Modifiez des paires clé-valeur en masse.
    **Admin dashboard :** Gérez votre équipe et invitez des membres.
    **Add-ons :** Add-ons officiels pour hoppscotch.

  upgradeDescription: |
    Version en amont : [Hoppscotch 2026.8.0](https://github.com/hoppscotch/hoppscotch/releases/tag/2026.8.0)

    **Nouveautés**

    - Les requêtes REST et GraphQL partagent un même espace de travail.
    - Les exécutions de collections peuvent parcourir les lignes d’un fichier de données CSV ou JSON.
    - Le serveur MCP Hoppscotch peut travailler avec les collections, les requêtes et les environnements.

    **Corrections**

    - La documentation de la requête est conservée lors de l’enregistrement.
    - Les cookies host-only restent sur l’hôte qui les a définis.
    - La capture des cookies fonctionne encore lorsque l’Agent ne renvoie que `Set-Cookie`.
    - Cette version inclut un correctif de sécurité des dépendances.

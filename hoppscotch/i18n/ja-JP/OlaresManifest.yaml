metadata:
  title: Hoppscotch
  description: オープンソースの API 開発エコシステム
spec:
  fullDescription: |
    Hoppscotch は Postman、Insomnia のオープンソース代替です
    
    **機能**
    
    **Lightweight:** ミニマルな UI デザインで構築。
    **Fast:** リクエストを送り、リアルタイムでレスポンスを取得。
    **HTTP Methods:** リクエストメソッドは実行するアクションの種類を定義します。
    **Theming:** 背景・前景・アクセント色の組み合わせをカスタマイズ — 今すぐ設定。
    **PWA:** デバイスに Progressive Web App としてインストール。
    **Request:** エンドポイントから即座にレスポンスを取得。  
    **WebSocket:** 単一 TCP 接続上でフルデュプレックス通信チャネルを確立。
    **Server-Sent Events:** ポーリングなしで HTTP 接続経由でサーバーから更新ストリームを受信。
    **Socket.IO:** SocketIO サーバーとデータの送受信。
    **MQTT:** MQTT ブローカーのトピックを購読・公開。
    **GraphQL:** GraphQL は API 向けのクエリ言語であり、既存データでクエリを満たすランタイムです。
    **Authorization:** エンドユーザーを識別できます。
    **Headers:** リクエスト本体の送信形式を記述します。    
    **Parameters:** リクエストパラメータでシミュレートされたリクエストの可変部分を設定。
    **Request Body:** REST API 経由でデータの送受信に使用。
    **Response:** ステータス行、ヘッダー、メッセージ／レスポンス本体を含む。
    **History:** リクエスト履歴はクラウド／ローカルのセッションストレージと同期。
    **Collections:** コレクションとフォルダで API リクエストを整理。ワンクリックで再利用。
    **Pre-Request Scripts:** リクエスト送信前に実行されるコードスニペット。
    **Teams:** チーム横断で API の設計・開発・テストを加速。
    **Workspaces:** 個人／チームのコレクションと環境をワークスペースに整理。ワークスペース切替で複数プロジェクトを管理。
    **Keyboard Shortcuts:** 効率重視に最適化。
    **Proxy:** 設定から Proxy Mode を有効化し、ブロックされた API にアクセス。
    **i18n:** お好みの言語でアプリを利用。
    **Auth + Sync:** サインインして全デバイスでデータをリアルタイム同期。
    **Synchronize your data:** Handoff で他デバイスのタスクを継続。
    **Post-Request Tests:** レスポンス後に実行されるリクエスト関連テストを記述。
    **Environments:** 環境変数でリクエストとスクリプトの値を保存・再利用。
    **Bulk Edit:** キー／値ペアを一括編集。
    **Admin dashboard:** チーム管理とメンバー招待。
    **Add-ons:** hoppscotch 公式アドオン。

  upgradeDescription: |
    上流リリース：[Hoppscotch 2026.8.0](https://github.com/hoppscotch/hoppscotch/releases/tag/2026.8.0)

    **変更点**

    - REST と GraphQL のリクエストが同一ワークスペースを共有します。
    - コレクション実行は CSV または JSON データファイルの行を反復できます。
    - Hoppscotch MCP サーバーはコレクション、リクエスト、環境を扱えます。

    **修正**

    - 保存時にリクエストドキュメントが保持されます。
    - host-only cookie は設定したホストに留まります。
    - Agent が `Set-Cookie` だけを返す場合でも cookie を取得できます。
    - このリリースには依存関係のセキュリティパッチが含まれます。

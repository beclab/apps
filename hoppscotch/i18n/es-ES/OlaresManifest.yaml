metadata:
  title: Hoppscotch
  description: Ecosistema open source para desarrollo de APIs
spec:
  fullDescription: |
    Hoppscotch es una alternativa de código abierto a Postman, Insomnia
    
    **Funciones**
    
    **Lightweight:** Diseñado con una UI minimalista.
    **Fast:** Envía peticiones y recibe respuestas en tiempo real.
    **HTTP Methods:** Los métodos de petición definen el tipo de acción que solicitas.
    **Theming:** Combinaciones personalizables de colores de fondo, primer plano y acento — personaliza ahora.
    **PWA:** Instálala como Progressive Web App en tu dispositivo.
    **Request:** Obtén la respuesta del endpoint al instante.  
    **WebSocket:** Establece canales de comunicación full-duplex sobre una sola conexión TCP.
    **Server-Sent Events:** Recibe un flujo de actualizaciones del servidor por HTTP sin recurrir a polling.
    **Socket.IO:** Envía y recibe datos con el servidor SocketIO.
    **MQTT:** Suscríbete y publica en topics de un broker MQTT.
    **GraphQL:** GraphQL es un lenguaje de consulta para APIs y un runtime para satisfacer esas consultas con tus datos existentes.
    **Authorization:** Permite identificar al usuario final.
    **Headers:** Describe el formato en que se envía el cuerpo de la petición.    
    **Parameters:** Usa parámetros de petición para fijar partes variables en peticiones simuladas.
    **Request Body:** Se usa para enviar y recibir datos vía la REST API.
    **Response:** Contiene la línea de estado, cabeceras y el cuerpo del mensaje/respuesta.
    **History:** Las entradas de petición se sincronizan con tu almacenamiento de sesión en la nube/local.
    **Collections:** Mantén tus peticiones API organizadas con colecciones y carpetas. Reutilízalas con un clic.
    **Pre-Request Scripts:** Fragmentos de código asociados a una petición que se ejecutan antes de enviarla.
    **Teams:** Ayuda a colaborar entre equipos para diseñar, desarrollar y probar APIs más rápido.
    **Workspaces:** Organiza colecciones y entornos personales y de equipo en workspaces. Cambia fácilmente entre workspaces para gestionar varios proyectos.
    **Keyboard Shortcuts:** Optimizado para la eficiencia.
    **Proxy:** Activa el modo Proxy en Ajustes para acceder a APIs bloqueadas.
    **i18n:** Usa la app en tu idioma.
    **Auth + Sync:** Inicia sesión y sincroniza tus datos en tiempo real en todos tus dispositivos.
    **Synchronize your data:** Handoff para continuar tareas en otros dispositivos.
    **Post-Request Tests:** Escribe tests asociados a una petición que se ejecutan tras la respuesta.
    **Environments:** Las variables de entorno permiten almacenar y reutilizar valores en peticiones y scripts.
    **Bulk Edit:** Edita pares clave-valor en bloque.
    **Admin dashboard:** Gestiona tu equipo e invita a miembros.
    **Add-ons:** Complementos oficiales para hoppscotch.

  upgradeDescription: |
    Versión upstream: [Hoppscotch 2026.8.0](https://github.com/hoppscotch/hoppscotch/releases/tag/2026.8.0)

    **Novedades**

    - Las solicitudes REST y GraphQL comparten un mismo espacio de trabajo.
    - Las ejecuciones de colecciones pueden recorrer filas de un archivo de datos CSV o JSON.
    - El servidor MCP de Hoppscotch puede trabajar con colecciones, solicitudes y entornos.

    **Correcciones**

    - La documentación de la solicitud se conserva al guardar.
    - Las cookies solo de host permanecen en el host que las estableció.
    - La captura de cookies sigue funcionando cuando el Agent solo devuelve `Set-Cookie`.
    - Esta versión incluye un parche de seguridad de dependencias.

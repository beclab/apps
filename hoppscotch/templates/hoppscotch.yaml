apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: hoppscotch
  namespace: {{ .Release.Namespace }}
  name: hoppscotch
spec:
  replicas: {{ .Values.workloads.hoppscotch.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: hoppscotch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: hoppscotch
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: seed-site
        image: "hoppscotch/hoppscotch:2026.8.0"
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command:
        - sh
        - -c
        - cp -a /site/. /seed/
        volumeMounts:
        - name: site
          mountPath: /seed
      containers:
      - name: hoppscotch
        image: "hoppscotch/hoppscotch:2026.8.0"
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command: ["sh", "-c", "pnpm exec prisma migrate deploy && node /usr/src/app/aio_run.mjs"]
        envFrom:
        - configMapRef:
            name: hoppscotch-config
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
            timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 12
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 500Mi
          limits:
            memory: 2Gi
            cpu: 1000m
        volumeMounts:
        - name: site
          mountPath: /site
      volumes:
      - name: site
        emptyDir: {}
      restartPolicy: Always


---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: hoppscotch
  name: hoppscotch-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    io.kompose.service: hoppscotch
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

metadata:
  title: Docmost
  description: Logiciel open source de wiki et documentation collaborative
spec:
  fullDescription: |
    Docmost est une alternative open source à Notion et Confluence. Que vous gériez un wiki, une base de connaissances ou une documentation de projet étendue, Docmost fournit les outils nécessaires pour créer, collaborer et partager des connaissances sans effort. Docmost est entièrement auto-hébergé et peut fonctionner dans des environnements air-gapped sans dépendances externes.

    Docmost prend en charge les Spaces. Vous pouvez créer des Spaces pour différentes équipes, projets ou départements selon vos besoins. Chaque Space a ses propres permissions. Avec une édition enterprise optionnelle, Docmost s'adapte aux besoins des plus grandes organisations avec SSO, IA, accès API et plus.

    **Fonctionnalités**
    - **Collaborative Real-time Editor :** Travaillez ensemble sur des pages en temps réel.
    - **Spaces :** Organisez vos pages par équipe, projets ou départements pour une meilleure collaboration.
    - **Permissions Management :** Contrôlez facilement l'accès au contenu avec des permissions intuitives au niveau workspace et space.
    - **Groups :** Accordez des permissions unifiées aux utilisateurs via des groupes.
    - **Nested Navigation :** Imbriquer, réordonner et glisser-déposer des pages via la barre latérale.
    - **Tables :** Insérer et modifier des tableaux avec colonnes redimensionnables, cellules fusionnables, lignes/colonnes d'en-tête et couleurs de fond de cellule.
    - **Diagrams :** Prise en charge intégrée de Draw.io, Excalidraw et Mermaid.
    - **Math Equations :** Écrire des équations mathématiques en ligne et au niveau bloc avec KaTeX.
    - **Callouts and Toggle Blocks :** Structurer votre contenu avec des avis callout et des blocs toggle repliables.
    - **Comments :** Ajouter des commentaires aux pages pour une meilleure communication et du feedback.
    - **Page History :** Suivre les changements avec un historique de versions complet et restaurer des versions précédentes.
    - **Public Sharing :** Partager publiquement vos pages, permettant à quiconque ayant le lien de les consulter.
    - **Search :** Recherche plein texte sur les pages avec filtres space et type.
    - **File Attachment :** Joindre des fichiers à vos pages pour référence et partage faciles.
    - **Import / Export :** Importer et exporter des pages aux formats Markdown et HTML.
      - Import d'archive ZIP
      - Import Notion :
      - Import Confluence (Enterprise) :
      - Import DOCX (Enterprise) :
    - **Print to PDF :** Générer des versions PDF des pages via la boîte de dialogue d'impression du navigateur.
    - **@ Mentions :** Mentionner des membres de l'équipe et lier des pages directement dans l'éditeur.
    - **Markdown Shortcuts :** Saisir la syntaxe Markdown directement dans l'éditeur et elle se convertit automatiquement en texte enrichi.
    - **Keyboard Shortcuts :** Ensemble complet de raccourcis clavier pour le formatage, la navigation et les actions de l'éditeur.
    - **Dark Mode :** Basculer entre les thèmes clair, sombre et système.
    - **Read/Edit Mode :** Définir un mode de page par défaut pour éviter les modifications accidentelles.
    - **Translations :** Disponible en plus de 12 langues

  upgradeDescription: |
    Version en amont : [Docmost 0.95.0](https://github.com/docmost/docmost/releases/tag/v0.95.0)

    **Nouveautés**

    - Les administrateurs de l’espace de travail peuvent définir un mode d’édition par défaut pour les nouveaux utilisateurs.
    - Le menu slash de l’éditeur inclut `/time` et recherche les noms de commandes traduits.

    **Corrections**

    - Les tableaux ne tremblent plus lors du basculement entre les modes édition et lecture.
    - Les en-têtes de tableau PDF s’alignent correctement.
    - Les blocs Draw.io copiés s’enregistrent sur une autre page.
    - Des problèmes d’interface des modèles sont traités.
    - Cette version inclut des correctifs de sécurité. L’amont recommande la mise à niveau.


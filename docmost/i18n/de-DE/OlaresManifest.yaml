metadata:
  title: Docmost
  description: Open-Source-Software für kollaborative Wikis und Dokumentation
spec:
  fullDescription: |
    Docmost ist eine quelloffene Alternative zu Notion und Confluence. Ob Sie ein Wiki, eine Wissensbasis oder umfangreiche Projektdokumentation verwalten – Docmost bietet die Werkzeuge, die Sie brauchen, um Wissen mühelos zu erstellen, zusammenzuarbeiten und zu teilen. Docmost ist vollständig selbst gehostet und kann in air-gapped Umgebungen ohne externe Abhängigkeiten laufen.

    Docmost unterstützt Spaces. Sie können Spaces für verschiedene Teams, Projekte oder Abteilungen je nach Bedarf erstellen. Jeder Space hat eigene Berechtigungen. Mit einer optionalen Enterprise Edition skaliert Docmost für größere Organisationen mit SSO, KI, API-Zugriff und mehr.

    **Funktionen**
    - **Collaborative Real-time Editor:** Gemeinsam in Echtzeit an Seiten arbeiten.
    - **Spaces:** Seiten nach Team, Projekten oder Abteilungen organisieren für bessere Zusammenarbeit.
    - **Permissions Management:** Zugriff auf Inhalte mit intuitiven Berechtigungen auf Workspace- und Space-Ebene steuern.
    - **Groups:** Einheitliche Berechtigungen über Gruppen an Nutzer vergeben.
    - **Nested Navigation:** Seiten über die Seitenleiste verschachteln, neu ordnen und per Drag-and-Drop verschieben.
    - **Tables:** Tabellen mit skalierbaren Spalten, zusammenführbaren Zellen, Kopfzeilen/-spalten und Zellhintergrundfarben einfügen und bearbeiten.
    - **Diagrams:** Eingebaute Unterstützung für Draw.io, Excalidraw und Mermaid.
    - **Math Equations:** Inline- und Block-Mathegleichungen mit KaTeX schreiben.
    - **Callouts and Toggle Blocks:** Inhalte mit Callout-Hinweisen und einklappbaren Toggle-Blöcken strukturieren.
    - **Comments:** Kommentare zu Seiten für bessere Kommunikation und Feedback hinzufügen.
    - **Page History:** Änderungen mit umfassender Versionshistorie verfolgen und frühere Versionen wiederherstellen.
    - **Public Sharing:** Seiten öffentlich teilen, sodass jeder mit dem Link sie ansehen kann.
    - **Search:** Volltextsuche über Seiten mit Space- und Typfiltern.
    - **File Attachment:** Dateien an Seiten anhängen für einfache Referenz und Freigabe.
    - **Import / Export:** Seiten in Markdown- und HTML-Formaten importieren und exportieren.
      - ZIP-Archiv-Import
      - Notion-Import:
      - Confluence-Import (Enterprise):
      - DOCX-Import (Enterprise):
    - **Print to PDF:** PDF-Versionen von Seiten über den Browser-Druckdialog erzeugen.
    - **@ Mentions:** Teammitglieder erwähnen und Seiten direkt im Editor verlinken.
    - **Markdown Shortcuts:** Markdown-Syntax direkt im Editor tippen – wird automatisch in Rich Text umgewandelt.
    - **Keyboard Shortcuts:** Vollständiger Satz von Tastenkürzeln für Formatierung, Navigation und Editoraktionen.
    - **Dark Mode:** Zwischen hellem, dunklem und System-Theme wechseln.
    - **Read/Edit Mode:** Standard-Seitenmodus setzen, um versehentliches Bearbeiten zu verhindern.
    - **Translations:** In 12+ Sprachen verfügbar

  upgradeDescription: |
    Upstream-Release: [Docmost 0.95.0](https://github.com/docmost/docmost/releases/tag/v0.95.0)

    **Änderungen**

    - Workspace-Admins können einen Standard-Bearbeitungsmodus für neue Benutzer festlegen.
    - Das Slash-Menü des Editors enthält `/time` und durchsucht übersetzte Befehlsnamen.

    **Fehlerbehebungen**

    - Tabellen zittern nicht mehr beim Wechsel zwischen Bearbeitungs- und Lesemodus.
    - PDF-Tabellenköpfe werden korrekt ausgerichtet.
    - Kopierte Draw.io-Blöcke speichern auf einer anderen Seite.
    - Probleme der Vorlagen-Oberfläche werden behoben.
    - Diese Version enthält Sicherheitskorrekturen. Upstream empfiehlt das Upgrade.


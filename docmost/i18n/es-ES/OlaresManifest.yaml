metadata:
  title: Docmost
  description: Software de wiki y documentación colaborativa de código abierto
spec:
  fullDescription: |
    Docmost es una alternativa de código abierto a Notion y Confluence. Ya gestiones un wiki, una base de conocimiento o una documentación de proyecto extensa, Docmost ofrece las herramientas que necesitas para crear, colaborar y compartir conocimiento sin esfuerzo. Docmost es totalmente autoalojado y puede ejecutarse en entornos air-gapped sin dependencias externas.

    Docmost admite Spaces. Puedes crear Spaces para distintos equipos, proyectos o departamentos según tus necesidades. Cada Space tiene sus propios permisos. Con una edición enterprise opcional, Docmost escala para organizaciones más grandes con SSO, IA, acceso API y más.

    **Funciones**
    - **Collaborative Real-time Editor:** Trabaja junto a otros en páginas en tiempo real.
    - **Spaces:** Organiza tus páginas por equipo, proyectos o departamentos para una mejor colaboración.
    - **Permissions Management:** Controla fácilmente el acceso al contenido con permisos intuitivos a nivel de workspace y space.
    - **Groups:** Concede permisos unificados a los usuarios mediante grupos.
    - **Nested Navigation:** Anida, reordena y arrastra y suelta páginas desde la barra lateral.
    - **Tables:** Inserta y edita tablas con columnas redimensionables, celdas combinables, filas/columnas de encabezado y colores de fondo de celda.
    - **Diagrams:** Soporte integrado para Draw.io, Excalidraw y Mermaid.
    - **Math Equations:** Escribe ecuaciones matemáticas en línea y a nivel de bloque con KaTeX.
    - **Callouts and Toggle Blocks:** Estructura tu contenido con avisos callout y bloques toggle colapsables.
    - **Comments:** Añade comentarios a las páginas para mejor comunicación y feedback.
    - **Page History:** Sigue los cambios con un historial de versiones completo y restaura versiones anteriores.
    - **Public Sharing:** Comparte páginas públicamente para que cualquiera con el enlace pueda verlas.
    - **Search:** Búsqueda de texto completo en páginas con filtros de space y tipo.
    - **File Attachment:** Adjunta archivos a tus páginas para referencia y compartición fáciles.
    - **Import / Export:** Importa y exporta páginas en formatos Markdown y HTML.
      - Importación de archivo ZIP
      - Importación de Notion:
      - Importación de Confluence (Enterprise):
      - Importación DOCX (Enterprise):
    - **Print to PDF:** Genera versiones PDF de páginas con el diálogo de impresión del navegador.
    - **@ Mentions:** Menciona a miembros del equipo y enlaza páginas directamente en el editor.
    - **Markdown Shortcuts:** Escribe sintaxis Markdown directamente en el editor y se convierte automáticamente a texto enriquecido.
    - **Keyboard Shortcuts:** Conjunto completo de atajos de teclado para formato, navegación y acciones del editor.
    - **Dark Mode:** Cambia entre temas claro, oscuro y del sistema.
    - **Read/Edit Mode:** Establece un modo de página predeterminado para evitar ediciones accidentales.
    - **Translations:** Disponible en más de 12 idiomas

  upgradeDescription: |
    Versión upstream: [Docmost 0.95.0](https://github.com/docmost/docmost/releases/tag/v0.95.0)

    **Novedades**

    - Los administradores del espacio de trabajo pueden establecer un modo de edición predeterminado para los usuarios nuevos.
    - El menú de barra del editor incluye `/time` y busca nombres de comandos traducidos.

    **Correcciones**

    - Las tablas ya no tiemblan al cambiar entre los modos de edición y lectura.
    - Los encabezados de tabla en PDF se alinean correctamente.
    - Los bloques Draw.io copiados se guardan en otra página.
    - Se abordan problemas de la interfaz de plantillas.
    - Esta versión incluye correcciones de seguridad. Upstream recomienda actualizar.


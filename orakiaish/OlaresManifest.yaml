apiVersion: v3
olaresManifest.version: "0.12.0"
olaresManifest.type: app
metadata:
  name: orakiaish
  appid: orakiaish
  version: "0.0.10"
  description: Local-first AI smart-home control
  icon: https://cdn.olares.com/images/2026/10/918594eb8b916c5063a6cbf34dd9faca.png
  title: AISH
  categories:
    - Lifestyle
    - homelab
    - agents
  tags:
    - automation
entrances:
  - name: orakiaish
    port: 8080
    title: AISH
    icon: https://cdn.olares.com/images/2026/10/918594eb8b916c5063a6cbf34dd9faca.png
    host: oraki-web
    authLevel: private
    openMethod: window
ports:
  # Voice satellites on the LAN reach the Hub's satellite gateway here.
  - name: satellite
    host: oraki-satellite
    port: 8790
    exposePort: 8790
    protocol: tcp
permission:
  appData: true
spec:
  versionName: "0.0.10"
  fullDescription: |
    AISH (AI Smart Home Hub) is a local-first control center for your smart home. It combines natural-language commands, device discovery, automations, scenes, and voice control in one private interface running on your Olares.

    Features
    **Natural-language control**
    Ask AISH to control lights and other connected devices without navigating dashboards. Conversations and command history stay on your own system.

    **Local device hub**
    Connect Zigbee, Matter, Bluetooth, HomeKit, and supported LAN or cloud ecosystems. AISH uses its bundled Home Assistant service as the local device engine.

    **Voice satellites**
    Pair compatible ESP32-S3 voice devices over Wi-Fi. AISH receives Opus audio, transcribes commands locally, runs the requested action, and sends synthesized speech back to the device.

    **Scenes and automations**
    Organize devices by room, create reusable scenes, and build automations from the same interface.

    **Local-first operation**
    Core application data, voice history, device state, and automation configuration are stored on your Olares.
  upgradeDescription: |
    Initial Olares Market release of AISH, including smart-home integrations,
    natural-language control, scenes, automations, and local voice services.
  developer: Second State
  website: https://www.secondstate.io/
  submitter: YouxinChu
  locale:
    - en-US
    - zh-CN
  supportArch:
    - arm64
  requiredCpu: "2"
  limitedCpu: "6"
  requiredMemory: 4Gi
  limitedMemory: 12Gi
  requiredDisk: 25Gi
workloadReplicas:
  oraki: 1
  hub: 1
  ha: 1
  matter: 1
  audio: 1
  voice: 1
options:
  allowMultipleInstall: false
  dependencies:
    - name: olares
      type: system
      version: ">=1.12.6-0"

metadata:
  title: AISH
  description: 本地优先的 AI 智能家居控制中心
spec:
  fullDescription: |
    AISH 是运行在 Olares 上的本地优先 AI 智能家居控制中心，将自然语言命令、设备发现、自动化、场景和语音控制整合在一个私密界面中。

    功能
    **自然语言控制**
    无需逐层查找控制面板，直接告诉 AISH 要操作的设备。对话和命令历史保存在您自己的系统中。

    **本地设备中枢**
    连接 Zigbee、Matter、蓝牙、HomeKit，以及支持的局域网或云端生态。AISH 使用内置的 Home Assistant 服务作为本地设备引擎。

    **语音卫星**
    通过 Wi-Fi 配对兼容的 ESP32-S3 语音设备。AISH 接收 Opus 音频，在本地识别命令、执行操作，并将合成语音传回设备播放。

    **场景与自动化**
    按房间整理设备，创建可复用的场景，并在同一界面中配置自动化。

    **本地优先运行**
    核心应用数据、语音历史、设备状态和自动化配置均存储在您的 Olares 上。
  upgradeDescription: |
    AISH 首次发布到 Olares Market，包含智能家居集成、自然语言控制、
    场景、自动化和本地语音服务。

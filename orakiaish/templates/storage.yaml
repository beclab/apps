{{- range $name, $size := dict "data" .Values.storage.dataSize "ha" .Values.storage.haSize "matter" .Values.storage.matterSize }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ include "oraki.fullname" $ }}-{{ $name }} }
spec:
  accessModes: [ReadWriteOnce]
  {{- with $.Values.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: { requests: { storage: {{ $size }} } }
---
{{- end }}

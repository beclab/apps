apiVersion: v1
kind: Secret
metadata: { name: {{ include "oraki.fullname" . }}-secrets }
type: Opaque
stringData:
  device-engine-token: {{ .Values.deviceEngine.externalToken | quote }}
  voice-service-key: "oraki-host-voice-v1"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ include "oraki.fullname" . }}-config }
data: { TZ: {{ .Values.timezone | quote }} }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ include "oraki.fullname" . }}-ha-config }
data:
  configuration.yaml: |
    default_config:
    http:
      server_host: 0.0.0.0
      server_port: 8123

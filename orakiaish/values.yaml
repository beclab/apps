images:
  web: { repository: ghcr.io/youxinchu/oraki-web, tag: "0.0.10", pullPolicy: IfNotPresent }
  hub: { repository: ghcr.io/youxinchu/oraki-hub, tag: "0.0.10", pullPolicy: IfNotPresent }
  ha: { repository: ghcr.io/youxinchu/oraki-ha-hub, tag: "0.0.10", pullPolicy: IfNotPresent }
  matter: { repository: ghcr.io/home-assistant-libs/python-matter-server, tag: stable, pullPolicy: IfNotPresent }
  audio: { repository: ghcr.io/youxinchu/oraki-audio, tag: "0.0.10", pullPolicy: IfNotPresent }
  voice: { repository: ghcr.io/youxinchu/oraki-voice, tag: "0.0.10", pullPolicy: IfNotPresent }
# Wi-Fi voice satellites (ESP32-S3-BOX-3 with xiaozhi firmware) connect to
# http://<Oraki IP>:<exposePort>/xiaozhi/ota/. exposePort must match
# OlaresManifest.yaml `ports`. Set address only if the node IP is not reachable.
satellite: { port: 8790, exposePort: 8790, address: "" }
# Legacy host microphone agent (oraki-host-voice), e.g. http://<Oraki IP>:4320.
# Leave empty when voice satellites are used.
hostVoice: { url: "" }
audio:
  enabled: true
  hostBluetooth: true
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
workloads:
  oraki: { replicaCount: 1 }
  hub: { replicaCount: 1 }
  ha: { replicaCount: 1 }
  matter: { replicaCount: 1 }
  audio: { replicaCount: 1 }
  voice: { replicaCount: 1 }
timezone: UTC
service: { type: ClusterIP, webPort: 8080, hubPort: 8787, haPort: 8123, matterPort: 5580 }
ingress: { enabled: false, host: "", tls: false }
storage: { dataSize: 10Gi, haSize: 10Gi, matterSize: 5Gi, storageClass: "" }
# By default, HA watches the host's /dev/serial/by-id directory and exposes a
# recognized Zigbee coordinator as /dev/oraki-zigbee. Set zigbeeDevice only to
# override discovery with a specific host device path.
hardware: { enabled: true, zigbeeDevice: "", hostNetwork: false }
deviceEngine: { externalUrl: "", externalToken: "" }
updates:
  enabled: false
  manifestUrl: ""
  agentUrl: ""
resources: {}

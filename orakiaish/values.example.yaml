images:
  web: { repository: REGISTRY/oraki-web, tag: "0.1.0" }
  hub: { repository: REGISTRY/oraki-hub, tag: "0.1.0" }
  ha: { repository: REGISTRY/oraki-ha-hub, tag: "0.1.0" }

timezone: Asia/Shanghai
ingress:
  enabled: true
  host: oraki.example.olares.com

# Optional: use an existing Home Assistant and leave hardware access disabled.
deviceEngine:
  externalUrl: ""
  externalToken: ""

# Optional override for a Zigbee coordinator that automatic discovery does not
# recognize. Leave empty for plug-and-play Sonoff discovery.
hardware:
  enabled: true
  zigbeeDevice: ""

# Optional self-hosted updater. Public Market builds leave this disabled and
# use Olares Market for upgrades.
updates:
  enabled: false
  manifestUrl: ""
  agentUrl: ""

metadata:
  title: SearXNG
  description: Busca sin ser rastreado

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el Olares Admin.

    **RESUMEN**
    SearXNG es un metabuscador de internet gratuito que agrega resultados de más de 70 servicios de búsqueda. Los usuarios no son rastreados ni perfilados. Además, SearXNG puede usarse a través de Tor para el anonimato en línea.

    **¿Por qué usarlo?**
    - SearXNG puede no ofrecerte resultados tan personalizados como Google, pero no genera un perfil sobre ti.
    - SearXNG no se preocupa por lo que buscas, nunca comparte nada con terceros y no puede usarse para comprometerte.
    - SearXNG es software libre, el código es 100% abierto, y todos son bienvenidos a mejorarlo.

    **Funciones**
    - autoalojado
    - sin seguimiento de usuarios / sin perfilado
    - scripts y cookies opcionales
    - conexiones seguras y cifradas
    - unas 200 motores de búsqueda
    - unas 60 traducciones
    - unas 100 instancias bien mantenidas en searx.space
    - fácil integración de motores de búsqueda
    - desarrollo profesional: CI, aseguramiento de calidad y UI con pruebas automatizadas

  upgradeDescription: |
    Actualiza SearXNG a 2026.11.5-3e95f6cd2. Actualiza la compilación fijada y los motores de búsqueda, incluida la corrección de renovación de sesión de Boardreader.

    Cambios del proyecto: https://github.com/searxng/searxng/commit/3e95f6cd2

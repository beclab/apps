metadata:
  title: SearXNG
  description: Suchen, ohne verfolgt zu werden

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer muss dennoch einen Desktop-Eintrag installieren, um den vom Olares Admin installierten Dienst zu nutzen.

    **ÜBERBLICK**
    SearXNG ist eine freie Internet-Metasuchmaschine, die Ergebnisse von mehr als 70 Suchdiensten aggregiert. Nutzer werden weder verfolgt noch profiliert. Zusätzlich kann SearXNG über Tor für Online-Anonymität genutzt werden.

    **Warum nutzen?**
    - SearXNG bietet vielleicht nicht so personalisierte Ergebnisse wie Google, erstellt aber kein Profil über dich.
    - SearXNG interessiert sich nicht dafür, wonach du suchst, teilt nichts mit Dritten und kann nicht genutzt werden, um dich zu kompromittieren.
    - SearXNG ist freie Software, der Code ist 100 % offen, und jeder ist willkommen, ihn zu verbessern.

    **Funktionen**
    - selbst gehostet
    - kein Nutzer-Tracking / kein Profiling
    - Skripte & Cookies sind optional
    - sichere, verschlüsselte Verbindungen
    - etwa 200 Suchmaschinen
    - etwa 60 Übersetzungen
    - etwa 100 gut gepflegte Instanzen auf searx.space
    - einfache Integration von Suchmaschinen
    - professionelle Entwicklung: CI, Qualitätssicherung & automatisiert getestete UI

  upgradeDescription: |
    SearXNG von 2026.5.10 auf 2026.9.25 (12f8b6515) aktualisiert. Ausführung mit UID/GID 1000 und beschreibbarem temporärem Cache; Konfigurations-Mounts und vorhandener Serverschlüssel bleiben erhalten.

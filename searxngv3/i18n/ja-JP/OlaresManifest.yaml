metadata:
  title: SearXNG
  description: 追跡されずに検索

spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体にインストールされるサービスは 1 つだけです。ただし、各ユーザーは Olares Admin がインストールしたサービスにアクセスするためデスクトップエントリをインストールする必要があります。

    **概要**
    SearXNG は 70 以上の検索サービスから結果を集約する無料のインターネットメタ検索エンジンです。ユーザーは追跡もプロファイリングもされません。さらにオンライン匿名性のため Tor 経由でも利用できます。

    **なぜ使うのか？**
    - SearXNG は Google ほどパーソナライズされた結果を出さないかもしれませんが、あなたについてのプロファイルは作りません。
    - 何を検索しても気にせず、第三者と何も共有せず、あなたを危険にさらす用途には使えません。
    - フリーソフトウェアでコードは 100% オープン。誰でも改善に参加できます。

    **機能**
    - セルフホスト
    - ユーザートラッキングなし／プロファイリングなし
    - スクリプトと Cookie は任意
    - 安全な暗号化接続
    - 約 200 の検索エンジン
    - 約 60 の翻訳
    - searx.space 上の約 100 のよく維持されたインスタンス
    - 検索エンジンの容易な統合
    - プロフェッショナルな開発: CI、品質保証、自動テスト UI

  upgradeDescription: |
    SearXNG を 2026.11.5-3e95f6cd2 に更新します。固定した上流ビルドと検索エンジン定義を更新し、Boardreader のセッション更新を修正します。

    上流の変更: https://github.com/searxng/searxng/commit/3e95f6cd2

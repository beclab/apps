metadata:
  title: SearXNG
  description: Cherchez sans être suivi

spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé sur l'ensemble du système Olares. Cependant, chaque utilisateur doit quand même installer une entrée bureau pour accéder et utiliser le service installé par l'Olares Admin.

    **APERÇU**
    SearXNG est un métamoteur de recherche internet libre qui agrège les résultats de plus de 70 services de recherche. Les utilisateurs ne sont ni suivis ni profilés. De plus, SearXNG peut être utilisé via Tor pour l'anonymat en ligne.

    **Pourquoi l'utiliser ?**
    - SearXNG peut ne pas offrir des résultats aussi personnalisés que Google, mais il ne génère pas de profil sur vous.
    - SearXNG ne se soucie pas de ce que vous recherchez, ne partage jamais rien avec un tiers, et ne peut pas être utilisé pour vous compromettre.
    - SearXNG est un logiciel libre, le code est 100 % ouvert, et chacun est le bienvenu pour l'améliorer.

    **Fonctionnalités**
    - auto-hébergé
    - pas de suivi utilisateur / pas de profilage
    - scripts et cookies optionnels
    - connexions sécurisées et chiffrées
    - environ 200 moteurs de recherche
    - environ 60 traductions
    - environ 100 instances bien maintenues sur searx.space
    - intégration facile de moteurs de recherche
    - développement professionnel : CI, assurance qualité et UI testée automatiquement

  upgradeDescription: |
    Mise à jour de SearXNG de 2026.5.10 vers 2026.9.25 (12f8b6515). Exécution avec UID/GID 1000 et un cache temporaire accessible en écriture ; conservation des montages de configuration et de la clé du serveur existante.

metadata:
  title: "GPT-OSS 120B (LLaMA.cpp)"
  description: "Modelli open-weight di OpenAI progettati per ragionamento potente, compiti agentici e casi d'uso versatili per sviluppatori"

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA DEL MODELLO**
    Benvenuto nella serie gpt-oss, i modelli open-weight di OpenAI progettati per ragionamento potente, compiti agentici e casi d'uso versatili per sviluppatori.

    **Modelli:**
    Stiamo rilasciando due varianti di questi modelli aperti:
    *gpt-oss-120b*
    - per produzione, uso generale e alto ragionamento che entra in una singola GPU da 80GB (come NVIDIA H100 o AMD MI300X) (117B parametri con 5.1B attivi)

    *gpt-oss-20b*
    - per latenza inferiore e casi d'uso locali o specializzati (21B parametri con 3.6B attivi)

    Entrambi i modelli sono stati addestrati sul nostro formato di risposta harmony e devono essere usati solo con il formato harmony, altrimenti non funzioneranno correttamente.

    **Punti salienti**
    - Licenza permissiva Apache 2.0: costruisci liberamente senza restrizioni copyleft né rischio di brevetti — ideale per sperimentazione, personalizzazione e deployment commerciale.
    - Effort di ragionamento configurabile: regola facilmente l'effort (basso, medio, alto) in base al caso d'uso e alle esigenze di latenza.
    - Chain-of-thought completa: accesso completo al processo di ragionamento del modello, facilitando il debug e aumentando la fiducia negli output. Non è pensato per essere mostrato agli utenti finali.
    - Fine-tunable: personalizza completamente i modelli tramite fine-tuning dei parametri.
    - Capacità agentiche: usa le capacità native per function calling, web browsing, esecuzione di codice Python e Structured Outputs.
    - Quantizzazione MXFP4: i modelli sono stati post-addestrati con quantizzazione MXFP4 dei pesi MoE, permettendo a gpt-oss-120b di girare su una singola GPU da 80GB (come NVIDIA H100 o AMD MI300X) e a gpt-oss-20b entro 16GB di memoria. Tutte le eval hanno usato la stessa quantizzazione MXFP4.
  upgradeDescription: |
    Separare il downloader del modello e il server LLaMA in Deployment distinti; aggiornare llama.cpp a server-cuda-b8445.

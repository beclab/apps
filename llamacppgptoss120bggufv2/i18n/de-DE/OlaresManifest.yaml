metadata:
  title: "GPT-OSS 120B (LLaMA.cpp)"
  description: "OpenAIs Open-Weight-Modelle für leistungsstarkes Reasoning, agentische Aufgaben und vielseitige Entwickler-Anwendungsfälle"

spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine geteilte App. Nach der Installation durch den Olares-Admin können alle Benutzer im Cluster sie über die Referenz-App nutzen.

    **MODELLÜBERSICHT**
    Willkommen bei der gpt-oss-Serie, OpenAIs Open-Weight-Modellen für leistungsstarkes Reasoning, agentische Aufgaben und vielseitige Entwickler-Anwendungsfälle.

    **Modelle:**
    Wir veröffentlichen zwei Varianten dieser offenen Modelle:
    *gpt-oss-120b*
    - für Produktion, Allzweck- und hohes Reasoning in einer einzelnen 80GB-GPU (wie NVIDIA H100 oder AMD MI300X) (117B Parameter mit 5,1B aktiven Parametern)

    *gpt-oss-20b*
    - für geringere Latenz sowie lokale oder spezialisierte Anwendungsfälle (21B Parameter mit 3,6B aktiven Parametern)

    Beide Modelle wurden auf unserem Harmony-Response-Format trainiert und sollten nur mit dem Harmony-Format verwendet werden, da sie sonst nicht korrekt funktionieren.

    **Feature-Highlights**
    - Freizügige Apache 2.0 Lizenz: Frei entwickeln ohne Copyleft-Beschränkungen oder Patentrisiken – ideal für Experimente, Anpassung und kommerziellen Einsatz.
    - Konfigurierbarer Reasoning-Aufwand: Reasoning-Aufwand (niedrig, mittel, hoch) je nach Anwendungsfall und Latenzbedarf leicht anpassen.
    - Vollständige Chain-of-Thought: Vollständiger Zugriff auf den Reasoning-Prozess des Modells für einfacheres Debugging und mehr Vertrauen in Ausgaben. Nicht für Endnutzer gedacht.
    - Feinabstimmung: Modelle per Parameter-Fine-Tuning vollständig an Ihren Anwendungsfall anpassen.
    - Agentische Fähigkeiten: Native Fähigkeiten für Function Calling, Web-Browsing, Python-Codeausführung und Structured Outputs nutzen.
    - MXFP4-Quantisierung: Die Modelle wurden mit MXFP4-Quantisierung der MoE-Gewichte nachtrainiert, sodass gpt-oss-120b auf einer einzelnen 80GB-GPU (wie NVIDIA H100 oder AMD MI300X) und gpt-oss-20b mit 16GB Speicher läuft. Alle Evals nutzten dieselbe MXFP4-Quantisierung.
  upgradeDescription: |
    Model-Downloader und LLaMA-Server in separate Deployments aufgeteilt; llama.cpp auf server-cuda-b8445 aktualisiert.

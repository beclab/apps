metadata:
  title: WeChat Markdown Editor
  description: "Un editor Markdown minimalista per WeChat"
spec:
  fullDescription: |
    WeChat Markdown Editor è un editor Markdown minimalista per WeChat: supporta sintassi Markdown, tavolozza colori, caricamento multiplo di immagini, download del documento con un clic, stili CSS personalizzati, reset con un clic e altre funzioni

    **Funzionalità**
    - Supporta tutta la sintassi Markdown di base e le formule matematiche
    - Offre rendering di diagrammi Mermaid e blocchi di avviso GFM
    - Temi di evidenziazione ricchi per i blocchi di codice per migliorare la leggibilità
    - Consente colori tema e stili CSS personalizzati, personalizzazione flessibile della visualizzazione
    - Fornisce caricamento multiplo di immagini e configurazione personalizzabile dell'image bed
    - Funzioni comode di importazione ed esportazione file per migliorare l'efficienza
    - Gestione locale dei contenuti integrata con salvataggio automatico delle bozze
  upgradeDescription: |
    Rilascio upstream: [doocs/md 2.1.0](https://github.com/doocs/md/releases/tag/v2.1.0)

    **Novità**

    - Barra laterale dell'assistente IA con chat, generazione di testo e generazione di immagini.
    - Supporto per diagrammi PlantUML e annotazioni Ruby.
    - Compressione automatica delle immagini e avanzamento del caricamento.


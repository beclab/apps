metadata:
  title: WeChat Markdown Editor
  description: "Un éditeur Markdown minimaliste pour WeChat"
spec:
  fullDescription: |
    WeChat Markdown Editor est un éditeur Markdown minimaliste pour WeChat : prend en charge la syntaxe Markdown, la palette de couleurs, le téléversement multiple d'images, le téléchargement de documents en un clic, les styles CSS personnalisés, la réinitialisation en un clic et d'autres fonctionnalités

    **Fonctionnalités**
    - Prend en charge toute la syntaxe Markdown de base et les formules mathématiques
    - Offre le rendu de diagrammes Mermaid et les blocs d'avertissement GFM
    - Thèmes riches de coloration syntaxique pour les blocs de code afin d'améliorer la lisibilité
    - Permet des couleurs de thème et des styles CSS personnalisés, personnalisation flexible de l'affichage
    - Fournit le téléversement multiple d'images et une configuration personnalisable de l'hébergement d'images
    - Fonctions pratiques d'import et d'export de fichiers pour gagner en efficacité
    - Gestion locale du contenu intégrée avec sauvegarde automatique des brouillons
  upgradeDescription: |
    Version amont : [doocs/md 2.1.0](https://github.com/doocs/md/releases/tag/v2.1.0)

    **Nouveautés**

    - Barre latérale d'assistant IA avec chat, génération de texte et génération d'images.
    - Prise en charge des diagrammes PlantUML et des annotations Ruby.
    - Compression automatique des images et progression du téléversement.


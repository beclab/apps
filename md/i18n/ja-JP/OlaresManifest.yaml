metadata:
  title: WeChat Markdown Editor
  description: "WeChat 向けのミニマリスト Markdown エディタ"
spec:
  fullDescription: |
    WeChat Markdown Editor は WeChat 向けのミニマリスト Markdown エディタです：Markdown 構文、カラーパレット、複数画像アップロード、ワンクリックでのドキュメントダウンロード、カスタム CSS、ワンクリックリセットなどの機能をサポートします

    **機能**
    - 基本的な Markdown 構文と数式をすべてサポート
    - Mermaid チャート描画と GFM 警告ブロックに対応
    - コードの可読性を高める豊富なコードブロック用ハイライトテーマ
    - テーマカラーと CSS スタイルをカスタム可能で、表示を柔軟に調整
    - 複数画像アップロードと画像ホスティング（画像床）のカスタム設定に対応
    - 効率向上のための便利なファイルのインポート／エクスポート
    - 下書きの自動保存に対応したローカルコンテンツ管理を内蔵
  upgradeDescription: |
    上流リリース：[doocs/md 2.1.0](https://github.com/doocs/md/releases/tag/v2.1.0)

    **変更内容**

    - チャット、テキスト生成、画像生成付きの AI アシスタントサイドバー。
    - PlantUML 図と Ruby 注釈のサポート。
    - 画像の自動圧縮とアップロード進捗。


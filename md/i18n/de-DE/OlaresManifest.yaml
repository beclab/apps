metadata:
  title: WeChat Markdown Editor
  description: "Ein minimalistischer Markdown-Editor für WeChat"
spec:
  fullDescription: |
    WeChat Markdown Editor ist ein minimalistischer Markdown-Editor für WeChat: unterstützt Markdown-Syntax, Farbpalette, Mehrfach-Bild-Upload, Dokument-Download mit einem Klick, benutzerdefiniertes CSS, Ein-Klick-Zurücksetzen und weitere Funktionen

    **Funktionen**
    - Unterstützt die gesamte grundlegende Markdown-Syntax sowie mathematische Formeln
    - Bietet Unterstützung für Mermaid-Diagramm-Rendering und GFM-Warnblöcke
    - Reichhaltige Highlight-Themes für Codeblöcke zur besseren Lesbarkeit
    - Ermöglicht benutzerdefinierte Theme-Farben und CSS-Styles für flexible Darstellung
    - Bietet Mehrfach-Bild-Upload und anpassbare Bild-Hosting-Konfiguration
    - Praktische Import- und Exportfunktionen für Dateien zur Effizienzsteigerung
    - Eingebaute lokale Inhaltsverwaltung mit automatischer Entwurfsspeicherung
  upgradeDescription: |
    Upstream-Release: [doocs/md 2.1.0](https://github.com/doocs/md/releases/tag/v2.1.0)

    **Änderungen**

    - KI-Assistent in der Seitenleiste mit Chat, Textgenerierung und Bildgenerierung.
    - Unterstützung für PlantUML-Diagramme und Ruby-Annotationen.
    - Automatische Bildkomprimierung und Upload-Fortschritt.


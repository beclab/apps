metadata:
  title: LLMFit
  description: 根据你的系统硬件自动匹配合适的 LLM 模型
spec:
  fullDescription: |
    数百种模型与提供方，一条命令即可找到适合你硬件运行的方案。

    LLMFit 能够根据你系统的内存（RAM）、CPU 和 GPU 自动推荐合适的 LLM 模型。它会自动检测你的硬件，从质量、速度、适配度和上下文四个维度为每个模型评分，告诉你哪些模型能在你的设备上流畅运行。

    通过网页控制面板查看。支持多 GPU 环境、MoE 架构、动态量化选择、推理速度测算，并兼容本地运行时（如 Ollama、llama.cpp、MLX、Docker Model Runner、LM Studio）。

    **功能特色**
    * 检测系统内存、CPU 核心数和 GPU（支持 NVIDIA、AMD、Intel Arc、Apple Silicon、昇腾等）
    * 多 GPU 支持，自动聚合显存
    * 从质量、速度、适配度、上下文四个维度为模型打分
    * 支持动态量化选择（Q8_0 到 Q2_K）
    * 兼容 MoE（专家混合）架构
    * 支持基于真实 GPU 带宽的速度估算
    * 支持筛选、排序和优选模型
    * 兼容 Ollama、llama.cpp、MLX 等本地运行时检测
    * 内置 200+ HuggingFace 模型数据库
    * 支持多场景过滤：通用、代码、推理、对话、多模态、嵌入
  upgradeDescription: |
    升级 LLMFit 镜像至 beclab/harveyff-llmfit:1.1.9（chart 1.0.15）。

    变更内容
    * 镜像：beclab/llmfit:v1.0.1 → beclab/harveyff-llmfit:1.1.9
    * 提高内存/CPU 限制，避免模型评分时 OOM 导致容器重启
    * 设置 LLMFIT_ALLOW_REMOTE=1，使 plan/download API 在 Olares 入口代理后可用
    * 保持 apiTimeout: 0，避免长时间请求被入口截断

metadata:
  title: LLMFit
  description: Tableau de bord web pour des recommandations LLM conscientes du matériel
spec:
  fullDescription: |
    Des centaines de modèles et de fournisseurs. Une commande pour trouver ce qui tourne sur votre matériel.

    LLMFit est un outil qui dimensionne correctement les modèles LLM selon la RAM, le CPU et le GPU de votre système. Il détecte votre matériel, note chaque modèle sur la qualité, la vitesse, l'adéquation et le contexte, et vous indique lesquels fonctionneront réellement bien sur votre machine.

    Livré avec un tableau de bord web. Prend en charge les configurations multi-GPU, les architectures MoE, la sélection dynamique de quantification, l'estimation de vitesse et les fournisseurs de runtime locaux (Ollama, llama.cpp, MLX, Docker Model Runner, LM Studio).

    **Fonctionnalités**
    * Détecte la RAM système, les cœurs CPU et le GPU (NVIDIA, AMD, Intel Arc, Apple Silicon, Ascend)
    * Prise en charge multi-GPU avec VRAM agrégée
    * Note les modèles sur 4 dimensions : Qualité, Vitesse, Adéquation, Contexte
    * Sélection dynamique de quantification (de Q8_0 à Q2_K)
    * Conscient des architectures MoE (Mixture-of-Experts)
    * Estimation de vitesse basée sur la bande passante mémoire GPU réelle
    * Tableau de bord web avec filtrage, tri et sélection des meilleurs modèles
    * Prend en charge la détection des fournisseurs de runtime Ollama, llama.cpp, MLX
    * Plus de 200 modèles HuggingFace dans la base de données
    * Filtrage par cas d'usage : General, Coding, Reasoning, Chat, Multimodal, Embedding
  upgradeDescription: |
    Mise à jour de LLMFit vers 1.1.16. Actualisation du catalogue de modèles et amélioration de la planification mémoire, quantification et disque. Maintien de la prise en charge des API de planification distante via Olares.

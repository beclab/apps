metadata:
  title: LLMFit
  description: Dashboard web per raccomandazioni LLM consapevoli dell'hardware
spec:
  fullDescription: |
    Centinaia di modelli e provider. Un comando per trovare cosa gira sul tuo hardware.

    LLMFit è uno strumento che dimensiona correttamente i modelli LLM rispetto a RAM, CPU e GPU del sistema. Rileva l'hardware, valuta ogni modello su qualità, velocità, adattamento e contesto, e ti dice quali funzioneranno davvero bene sulla tua macchina.

    Include una dashboard web. Supporta setup multi-GPU, architetture MoE, selezione dinamica della quantizzazione, stima della velocità e provider di runtime locali (Ollama, llama.cpp, MLX, Docker Model Runner, LM Studio).

    **Funzionalità**
    * Rileva RAM di sistema, core CPU e GPU (NVIDIA, AMD, Intel Arc, Apple Silicon, Ascend)
    * Supporto multi-GPU con VRAM aggregata
    * Valuta i modelli su 4 dimensioni: Qualità, Velocità, Adattamento, Contesto
    * Selezione dinamica della quantizzazione (da Q8_0 a Q2_K)
    * Consapevole delle architetture MoE (Mixture-of-Experts)
    * Stima della velocità basata sull'effettiva bandwidth di memoria GPU
    * Dashboard web con filtri, ordinamento e selezione dei migliori modelli
    * Supporta il rilevamento dei provider di runtime Ollama, llama.cpp, MLX
    * Oltre 200 modelli da HuggingFace nel database
    * Filtro per caso d'uso: General, Coding, Reasoning, Chat, Multimodal, Embedding
  upgradeDescription: |
    Aggiorna LLMFit alla versione 1.1.16. Aggiorna il catalogo dei modelli e migliora la pianificazione di memoria, quantizzazione e spazio su disco. Mantiene il supporto per le API di pianificazione remota tramite Olares.

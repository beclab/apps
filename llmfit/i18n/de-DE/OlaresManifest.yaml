metadata:
  title: LLMFit
  description: Web-Dashboard für hardwarebewusste LLM-Empfehlungen
spec:
  fullDescription: |
    Hunderte Modelle & Anbieter. Ein Befehl, um zu finden, was auf Ihrer Hardware läuft.

    LLMFit ist ein Tool, das LLM-Modelle an den RAM, die CPU und die GPU Ihres Systems anpasst. Es erkennt Ihre Hardware, bewertet jedes Modell nach Qualität, Geschwindigkeit, Passung und Kontext und sagt Ihnen, welche tatsächlich gut auf Ihrer Maschine laufen.

    Liefert ein Web-Dashboard mit. Unterstützt Multi-GPU-Setups, MoE-Architekturen, dynamische Quantisierungsauswahl, Geschwindigkeitsschätzung und lokale Runtime-Anbieter (Ollama, llama.cpp, MLX, Docker Model Runner, LM Studio).

    **Funktionen**
    * Erkennt System-RAM, CPU-Kerne und GPU (NVIDIA, AMD, Intel Arc, Apple Silicon, Ascend)
    * Multi-GPU-Unterstützung mit aggregiertem VRAM
    * Bewertet Modelle in 4 Dimensionen: Qualität, Geschwindigkeit, Passung, Kontext
    * Dynamische Quantisierungsauswahl (Q8_0 bis Q2_K)
    * MoE-(Mixture-of-Experts)-Architektur-bewusst
    * Geschwindigkeitsschätzung basierend auf tatsächlicher GPU-Speicherbandbreite
    * Web-Dashboard mit Filtern, Sortierung und Top-Modell-Auswahl
    * Unterstützt Erkennung der Runtime-Anbieter Ollama, llama.cpp, MLX
    * Über 200 Modelle von HuggingFace in der Datenbank
    * Anwendungsfall-Filter: General, Coding, Reasoning, Chat, Multimodal, Embedding
  upgradeDescription: |
    LLMFit auf 1.1.16 aktualisiert. Der Modellkatalog sowie die Planung von Speicher, Quantisierung und Festplattenbedarf wurden verbessert. Die Unterstützung der Remote-Planungs-API über Olares bleibt erhalten.

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  llmfit: 1
metadata:
  name: llmfit
  description: Web Dashboard for hardware-aware LLM recommendations
  icon: https://app.cdn.olares.com/appstore/llmfit/icon.png
  appid: llmfit
  version: '1.0.15'
  title: LLMFit
  categories:
  - Developer Tools
  - Utilities_v112
permission:
  appData: true
  appCache: true
entrances:
- name: llmfit-svc
  port: 8787
  host: llmfit-svc
  title: LLMFit
  icon: https://app.cdn.olares.com/appstore/llmfit/icon.png
  authLevel: private
  invisible: false
  openMethod: window
spec:
  versionName: '1.1.9'
  promoteImage:
    - https://app.cdn.olares.com/appstore/llmfit/1.webp
    - https://app.cdn.olares.com/appstore/llmfit/2.webp
  fullDescription: |
    Hundreds of models & providers. One command to find what runs on your hardware.

    LLMFit is a tool that right-sizes LLM models to your system's RAM, CPU, and GPU. Detects your hardware, scores each model across quality, speed, fit, and context dimensions, and tells you which ones will actually run well on your machine.

    Ships with an web dashboard. Supports multi-GPU setups, MoE architectures, dynamic quantization selection, speed estimation, and local runtime providers (Ollama, llama.cpp, MLX, Docker Model Runner, LM Studio).

    **Features**
    * Detects system RAM, CPU cores, and GPU (NVIDIA, AMD, Intel Arc, Apple Silicon, Ascend)
    * Multi-GPU support with aggregated VRAM
    * Scores models across 4 dimensions: Quality, Speed, Fit, Context
    * Dynamic quantization selection (Q8_0 through Q2_K)
    * MoE (Mixture-of-Experts) architecture aware
    * Speed estimation based on actual GPU memory bandwidth
    * Web Dashboard with filtering, sorting, and top-model selection
    * Supports Ollama, llama.cpp, MLX runtime provider detection
    * 200+ models from HuggingFace in database
    * Use-case filtering: General, Coding, Reasoning, Chat, Multimodal, Embedding
  upgradeDescription: |
    Upgrade LLMFit image to beclab/harveyff-llmfit:1.1.9 (chart 1.0.15).

    What's Changed
    * Image: beclab/llmfit:v1.0.1 → beclab/harveyff-llmfit:1.1.9
    * Raise memory/CPU limits so model fit scoring no longer OOM-kills the pod
    * Set LLMFIT_ALLOW_REMOTE=1 so plan/download APIs work behind the Olares entrance proxy
    * Keep apiTimeout: 0 for long dashboard requests
  developer: Alex Jones
  website: https://llmfit.axjns.dev/
  sourceCode: https://github.com/AlexsJones/llmfit
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://github.com/AlexsJones/llmfit#readme
  license:
  - text: MIT
    url: https://github.com/AlexsJones/llmfit/blob/main/LICENSE
  requiredMemory: 256Mi
  limitedMemory: 512Mi
  requiredDisk: 50Mi
  limitedDisk: 100Mi
  requiredCpu: 100m
  limitedCpu: "1"

  supportArch:
  - amd64
  - arm64
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  appScope:
    clusterScoped: false

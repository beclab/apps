metadata:
  title: Karakeep
  description: Eine selbst hostbare Bookmark-Everything-App mit KI-basierter automatischer Tagging- und Suchfunktion
spec:
  upgradeDescription: |
    Karakeep 0.35.0 überarbeitet die Lesezeichenkarten, die Leseansicht und die Einstellungen im Web, verbessert den Dunkelmodus und speichert Notizen beim Schreiben.

    - Die Leseansicht nutzt Defuddle, um Artikeltexte sauberer zu extrahieren. Hervorhebungen sind nach Artikel gruppiert und nach Farbe filterbar.
    - Intelligente Listen lassen sich mit Filtern erstellen und zeigen die Anzahl der Treffer sofort an. Große Listen laden schneller.
    - KI-Zusammenfassungen unterstützen jetzt Textnotizen, PDFs und Bilder. Die Textextraktion aus großen PDFs läuft in einem separaten Prozess.
    - Sicherheitskorrekturen stärken den Schutz bei der Anmeldung und die Privatsphäre in geteilten Listen. Das Chrome-Image für die Web-Erfassung wurde ebenfalls aktualisiert.

    Vor der Migration werden vorhandene Daten gesichert und geprüft. Sicherungen und Originaldaten bleiben im App-Datenverzeichnis unter .upgrade-backups/0.35.0 erhalten. Planen Sie zusätzlichen Speicherplatz ein. Beheben Sie vor einem Upgrade von 0.33.x E-Mail-Konflikte, die nur auf Groß- und Kleinschreibung beruhen, und melden Sie sich danach erneut an.

    Versionshinweise [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep (früher Hoarder) ist eine selbst hostbare Bookmark-Everything-App für Links, Notizen, Bilder und PDFs.

    Sie kombiniert automatische Metadatenextraktion, Volltextsuche, Listen-Zusammenarbeit und KI-basiertes automatisches Tagging, um gespeicherte Inhalte leichter zu organisieren und wiederzufinden.

    Wichtige Funktionen:
    - Links, Notizen, Bilder und PDFs speichern
    - Automatisches Abrufen von Titel, Beschreibung und Vorschaubild
    - Volltextsuche über gespeicherte Inhalte
    - KI-Tagging und Zusammenfassung (unterstützt lokale Modelle über Ollama)
    - Regelbasierte Automatisierung und RSS-Import
    - OCR für Bilder, Hervorhebungen und Massenaktionen
    - Browser-Erweiterungen, mobile Apps, API und Webhooks
    - Self-Hosting zuerst, mit datenschutzorientierter Bereitstellung

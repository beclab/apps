metadata:
  title: Karakeep
  description: Eine selbst hostbare Bookmark-Everything-App mit KI-basierter automatischer Tagging- und Suchfunktion
spec:
  upgradeDescription: |
    Upgrade Karakeep to 0.33.2 (`beclab/karakeep-app-karakeep:0.33.2`).

    Release notes: https://github.com/karakeep-app/karakeep/releases
  fullDescription: |
    Karakeep (früher Hoarder) ist eine selbst hostbare Bookmark-Everything-App für Links, Notizen, Bilder und PDFs.

    Sie kombiniert automatische Metadatenextraktion, Volltextsuche, Listen-Zusammenarbeit und KI-basiertes automatisches Tagging, um gespeicherte Inhalte leichter zu organisieren und wiederzufinden.

    Wichtige Funktionen:
    - Links, Notizen, Bilder und PDFs speichern
    - Automatisches Abrufen von Titel, Beschreibung und Vorschaubild
    - Volltextsuche über gespeicherte Inhalte
    - KI-Tagging und Zusammenfassung (unterstützt lokale Modelle über Ollama)
    - Regelbasierte Automatisierung und RSS-Import
    - OCR für Bilder, Hervorhebungen und Massenaktionen
    - Browser-Erweiterungen, mobile Apps, API und Webhooks
    - Self-Hosting zuerst, mit datenschutzorientierter Bereitstellung

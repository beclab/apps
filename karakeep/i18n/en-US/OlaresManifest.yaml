metadata:
  title: Karakeep
  description: A self-hostable bookmark-everything app with AI-based automatic tagging and search.
spec:
  upgradeDescription: |
    Karakeep 0.35.0 refreshes the web app with redesigned bookmark cards, reader and settings, improved dark mode, and notes that save as you type.

    - The reader uses Defuddle to extract cleaner article text. Highlights are grouped by article and can be filtered by color.
    - Build smart lists with filters and a live result count. Large smart lists load faster.
    - AI summaries now support text notes, PDFs, and images. Large PDF extraction runs in a separate process to keep workers responsive.
    - Security fixes improve sign-in protections and shared-list privacy. This package also updates the Chrome image used for web capture.

    The upgrade backs up and verifies existing data before migration. Backups and original data remain in .upgrade-backups/0.35.0 inside the app data directory. Allow extra disk space. If upgrading from 0.33.x, resolve email addresses that differ only in letter case before upgrading, then sign in again afterward.

    Release notes [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep (previously Hoarder) is a self-hostable bookmark-everything app for links, notes, images, and PDFs.

    It combines automatic metadata extraction, full text search, list collaboration, and AI-based automatic tagging to make saved content easier to organize and rediscover.

    Key capabilities:
    - Bookmark links, notes, images, and PDFs
    - Automatic fetch for title, description, and preview image
    - Full text search across saved content
    - AI tagging and summarization (supports local models via Ollama)
    - Rule-based automation and RSS ingestion
    - OCR for images, highlights, and bulk actions
    - Browser extensions, mobile apps, API, and webhooks
    - Self-hosting first with privacy-focused deployment

metadata:
  title: Karakeep
  description: AI による自動タグ付けと検索を備えた、セルフホスト可能なブックマーク万能アプリ
spec:
  upgradeDescription: |
    Karakeep 0.35.0では、Web版のブックマークカード、リーダー、設定画面を刷新し、ダークモードを改善しました。ノートは入力中に自動保存されます。

    - リーダーはDefuddleを使って記事本文を抽出します。ハイライトは記事ごとにまとめられ、色で絞り込めます。
    - フィルターを選んでスマートリストを作成でき、一致件数がリアルタイムで表示されます。大規模なリストの読み込みも高速になりました。
    - AIによる要約がテキストノート、PDF、画像に対応しました。大きなPDFのテキストは別プロセスで抽出します。
    - セキュリティ修正により、ログインの保護と共有リストのプライバシーが向上しました。Webページの取得に使うChromeイメージも更新しました。

    アップグレードでは、移行前に既存データをバックアップして検証します。バックアップと元データはアプリのデータディレクトリにある .upgrade-backups/0.35.0 に残るため、追加の空き容量を確保してください。0.33.xからアップグレードする場合は、大文字と小文字だけが異なるメールアドレスの競合を事前に解消し、完了後に再ログインしてください。

    リリースノート [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep（旧 Hoarder）は、リンク・メモ・画像・PDF 向けのセルフホスト可能なブックマーク万能アプリです。

    自動メタデータ抽出、全文検索、リスト共有、AI による自動タグ付けを組み合わせ、保存したコンテンツの整理と再発見を容易にします。

    主な機能:
    - リンク、メモ、画像、PDF のブックマーク
    - タイトル・説明・プレビュー画像の自動取得
    - 保存コンテンツの全文検索
    - AI タグ付けと要約（Ollama 経由のローカルモデル対応）
    - ルールベースの自動化と RSS 取り込み
    - 画像の OCR、ハイライト、一括操作
    - ブラウザ拡張、モバイルアプリ、API、Webhook
    - プライバシー重視のデプロイでセルフホスト優先

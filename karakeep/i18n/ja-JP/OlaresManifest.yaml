metadata:
  title: Karakeep
  description: AI による自動タグ付けと検索を備えた、セルフホスト可能なブックマーク万能アプリ
spec:
  upgradeDescription: |
    Upgrade Karakeep to 0.33.2 (`beclab/karakeep-app-karakeep:0.33.2`).

    Release notes: https://github.com/karakeep-app/karakeep/releases
  fullDescription: |
    Karakeep（旧 Hoarder）は、リンク・メモ・画像・PDF 向けのセルフホスト可能なブックマーク万能アプリです。

    自動メタデータ抽出、全文検索、リスト共有、AI による自動タグ付けを組み合わせ、保存したコンテンツの整理と再発見を容易にします。

    主な機能:
    - リンク、メモ、画像、PDF のブックマーク
    - タイトル・説明・プレビュー画像の自動取得
    - 保存コンテンツの全文検索
    - AI タグ付けと要約（Ollama 経由のローカルモデル対応）
    - ルールベースの自動化と RSS 取り込み
    - 画像の OCR、ハイライト、一括操作
    - ブラウザ拡張、モバイルアプリ、API、Webhook
    - プライバシー重視のデプロイでセルフホスト優先

metadata:
  title: Karakeep
  description: 面向个人与团队的数据收藏应用，支持 AI 自动标签与全文检索。
spec:
  upgradeDescription: |
    Karakeep 0.35.0 更新了网页端的书签卡片、阅读器和设置页，改善了深色模式，并支持边写边保存笔记。

    - 阅读器使用 Defuddle 提取更干净的文章正文。高亮按文章分组，支持按颜色筛选。
    - 使用筛选条件创建智能列表，实时查看匹配数量。大型智能列表加载更快。
    - AI 摘要支持文本笔记、PDF 和图片。大型 PDF 的文本提取在独立进程中执行，避免阻塞后台任务。
    - 安全修复加强了登录保护和共享列表的隐私。本次更新也替换了用于抓取网页的 Chrome 镜像。

    升级会在迁移前备份并校验现有数据。备份及原始数据保留在应用数据目录下的 .upgrade-backups/0.35.0，请预留额外磁盘空间。从 0.33.x 升级时，请先处理仅大小写不同的邮箱冲突，完成后重新登录。

    发行说明 [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep（原名 Hoarder）是一个可自托管的“全类型收藏”应用，可统一保存链接、笔记、图片和 PDF。

    它集成了元数据自动抓取、全文检索、列表协作与 AI 自动标签能力，让你更快地整理和再次找到已保存内容。

    主要能力：
    - 收藏链接、笔记、图片和 PDF
    - 自动抓取标题、摘要与预览图
    - 对保存内容进行全文检索
    - AI 自动标签与摘要（支持通过 Ollama 使用本地模型）
    - 规则引擎自动化与 RSS 自动入库
    - 图片 OCR、高亮摘录与批量操作
    - 浏览器扩展、移动端应用、REST API 与 Webhooks
    - 自托管优先，强调数据自主可控

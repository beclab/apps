metadata:
  title: Karakeep
  description: "Un'app self-hostable per salvare qualsiasi cosa, con tagging automatico e ricerca\
  \ basati sull'IA"
spec:
  upgradeDescription: |
    Karakeep 0.35.0 rinnova le schede dei segnalibri, il lettore e le impostazioni web, migliora la modalità scura e salva le note mentre scrivi.

    - Il lettore usa Defuddle per estrarre meglio il testo degli articoli. Le evidenziazioni sono raggruppate per articolo e filtrabili per colore.
    - Crea liste intelligenti tramite filtri e visualizza il numero di risultati in tempo reale. Le liste più grandi si caricano più in fretta.
    - I riassunti con IA supportano note di testo, PDF e immagini. L’estrazione del testo dai PDF di grandi dimensioni avviene in un processo separato.
    - Le correzioni di sicurezza migliorano la protezione dell’accesso e la riservatezza delle liste condivise. È aggiornata anche l’immagine Chrome usata per acquisire le pagine web.

    L’aggiornamento salva e verifica i dati prima della migrazione. I backup e i dati originali restano in .upgrade-backups/0.35.0, nella directory dei dati dell’app. Prevedi spazio aggiuntivo. Se aggiorni da 0.33.x, risolvi prima i conflitti tra indirizzi e-mail che differiscono solo per maiuscole e minuscole, quindi accedi di nuovo.

    Note di rilascio [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep (precedentemente Hoarder) è un'app self-hostable per salvare link, note, immagini e PDF.

    Combina estrazione automatica dei metadati, ricerca full-text, collaborazione sulle liste e tagging automatico basato sull'IA per organizzare e ritrovare più facilmente i contenuti salvati.

    Funzionalità principali:
    - Salvare link, note, immagini e PDF
    - Recupero automatico di titolo, descrizione e immagine di anteprima
    - Ricerca full-text sui contenuti salvati
    - Tagging e riassunto con IA (supporta modelli locali via Ollama)
    - Automazione basata su regole e ingestione RSS
    - OCR per immagini, evidenziazioni e azioni in blocco
    - Estensioni browser, app mobili, API e webhook
    - Self-hosting prioritario con distribuzione orientata alla privacy

metadata:
  title: Karakeep
  description: "Une application auto-hébergeable pour tout mettre en favoris, avec étiquetage automatique\
  \ et recherche basés sur l'IA"
spec:
  upgradeDescription: |
    Upgrade Karakeep to 0.33.2 (`beclab/karakeep-app-karakeep:0.33.2`).

    Release notes: https://github.com/karakeep-app/karakeep/releases
  fullDescription: |
    Karakeep (anciennement Hoarder) est une application auto-hébergeable pour les liens, notes, images et PDF.

    Elle combine l'extraction automatique de métadonnées, la recherche plein texte, la collaboration sur les listes et l'étiquetage automatique basé sur l'IA pour organiser et retrouver plus facilement le contenu enregistré.

    Principales capacités :
    - Mettre en favoris des liens, notes, images et PDF
    - Récupération automatique du titre, de la description et de l'image d'aperçu
    - Recherche plein texte dans le contenu enregistré
    - Étiquetage et résumé par IA (prend en charge les modèles locaux via Ollama)
    - Automatisation basée sur des règles et ingestion RSS
    - OCR pour les images, surlignages et actions en masse
    - Extensions de navigateur, applications mobiles, API et webhooks
    - Priorité à l'auto-hébergement avec un déploiement axé sur la confidentialité

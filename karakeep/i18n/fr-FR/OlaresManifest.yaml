metadata:
  title: Karakeep
  description: "Une application auto-hébergeable pour tout mettre en favoris, avec étiquetage automatique\
  \ et recherche basés sur l'IA"
spec:
  upgradeDescription: |
    Karakeep 0.35.0 repense les cartes de favoris, le lecteur et les paramètres de l’interface web, améliore le mode sombre et enregistre les notes pendant la saisie.

    - Le lecteur utilise Defuddle pour mieux extraire le texte des articles. Les surlignages sont regroupés par article et peuvent être filtrés par couleur.
    - Créez des listes intelligentes à l’aide de filtres et voyez le nombre de résultats en temps réel. Les grandes listes se chargent plus vite.
    - Les résumés par IA prennent en charge les notes textuelles, les PDF et les images. Un processus distinct extrait le texte des gros PDF.
    - Des correctifs renforcent la sécurité des connexions et la confidentialité des listes partagées. L’image Chrome utilisée pour capturer les pages web a aussi été mise à jour.

    La mise à jour sauvegarde et vérifie les données avant leur migration. Les sauvegardes et les originaux restent dans .upgrade-backups/0.35.0, dans le dossier de données de l’application. Prévoyez de l’espace supplémentaire. Avant une mise à jour depuis 0.33.x, résolvez les conflits entre adresses e-mail qui diffèrent uniquement par la casse, puis reconnectez-vous après la mise à jour.

    Notes de version [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep (anciennement Hoarder) est une application auto-hébergeable pour les liens, notes, images et PDF.

    Elle combine l'extraction automatique de métadonnées, la recherche plein texte, la collaboration sur les listes et l'étiquetage automatique basé sur l'IA pour organiser et retrouver plus facilement le contenu enregistré.

    Principales capacités :
    - Mettre en favoris des liens, notes, images et PDF
    - Récupération automatique du titre, de la description et de l'image d'aperçu
    - Recherche plein texte dans le contenu enregistré
    - Étiquetage et résumé par IA (prend en charge les modèles locaux via Ollama)
    - Automatisation basée sur des règles et ingestion RSS
    - OCR pour les images, surlignages et actions en masse
    - Extensions de navigateur, applications mobiles, API et webhooks
    - Priorité à l'auto-hébergement avec un déploiement axé sur la confidentialité

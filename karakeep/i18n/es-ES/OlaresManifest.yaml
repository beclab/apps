metadata:
  title: Karakeep
  description: "Una app autoalojable para marcar de todo, con etiquetado automático y búsqueda basados\
  \ en IA"
spec:
  upgradeDescription: |
    Karakeep 0.35.0 renueva las tarjetas de marcadores, el lector y los ajustes web, mejora el modo oscuro y guarda las notas mientras escribes.

    - El lector usa Defuddle para extraer mejor el texto de los artículos. Los resaltados se agrupan por artículo y se pueden filtrar por color.
    - Crea listas inteligentes con filtros y consulta el número de resultados en tiempo real. Las listas grandes cargan más rápido.
    - Los resúmenes con IA admiten notas de texto, PDF e imágenes. La extracción de texto de PDF grandes se ejecuta en un proceso separado.
    - Las correcciones de seguridad refuerzan el inicio de sesión y la privacidad de las listas compartidas. También se actualiza la imagen de Chrome que captura páginas web.

    La actualización respalda y verifica los datos antes de migrarlos. Las copias y los datos originales se conservan en .upgrade-backups/0.35.0, dentro del directorio de datos de la aplicación. Reserva espacio adicional. Si actualizas desde 0.33.x, resuelve primero los conflictos entre correos que solo difieren en mayúsculas y minúsculas y vuelve a iniciar sesión al terminar.

    Notas de la versión [Karakeep 0.35.0](https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0)

  fullDescription: |
    Karakeep (antes Hoarder) es una app autoalojable para guardar enlaces, notas, imágenes y PDF.

    Combina extracción automática de metadatos, búsqueda de texto completo, colaboración en listas y etiquetado automático basado en IA para organizar y redescubrir el contenido guardado con más facilidad.

    Capacidades clave:
    - Guardar enlaces, notas, imágenes y PDF
    - Obtención automática de título, descripción e imagen de vista previa
    - Búsqueda de texto completo en el contenido guardado
    - Etiquetado y resumen con IA (admite modelos locales vía Ollama)
    - Automatización basada en reglas e ingestión RSS
    - OCR para imágenes, resaltados y acciones masivas
    - Extensiones de navegador, apps móviles, API y webhooks
    - Prioridad al autoalojamiento con un despliegue centrado en la privacidad

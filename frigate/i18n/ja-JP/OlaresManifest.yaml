metadata:
  title: Frigate NVR
  description: IP カメラ向けのリアルタイムローカル物体検出付き NVR
spec:
  upgradeDescription: |
    Frigate を 0.17.2（`beclab/blakeblackshear-frigate:0.17.2`）へ。

    複数のセキュリティ勧告を含むメンテ版（go2rtc WebSocket カメラ ACL、パストラバーサル、exec: RCE フィルタ、RTSP 漏洩、WebSocket 管理操作）。エクスポートの任意 mp4 チャプターとライブプレビュー高速化も含む。

    詳細: https://github.com/blakeblackshear/frigate/releases/tag/v0.17.2
  fullDescription: |
    Frigate は、AI 物体検出付きの Home Assistant 向けに設計された完全ローカルの NVR です。OpenCV と Tensorflow を使用し、IP カメラ向けにローカルでリアルタイム物体検出を行います。

    **主な機能**
    - カスタムコンポーネントによる Home Assistant との密接な統合
    - 必要なとき・場所だけを対象に物体を探すことで、リソース使用を抑えつつ性能を最大化
    - 全フレーム処理よりリアルタイム性を重視したマルチプロセス活用
    - 非常に低オーバーヘッドの動体検知で物体検出の実行箇所を決定
    - TensorFlow による物体検出を別プロセスで実行し最大 FPS を実現
    - MQTT 通信で他システムへ容易に統合
    - 検出オブジェクトに基づく保持設定付きの録画
    - 24時間365日録画
    - RTSP による再配信でカメラへの接続数を削減
    - 低遅延ライブビュー向けの WebRTC ＆ MSE 対応

metadata:
  title: Frigate NVR
  description: NVR con detección local de objetos en tiempo real para cámaras IP
spec:
  upgradeDescription: |
    Actualizar Frigate a 0.17.2 (`beclab/blakeblackshear-frigate:0.17.2`).

    Mantenimiento con varios avisos de seguridad (ACL WebSocket go2rtc, path traversal, filtro exec RCE, fuga RTSP, ops admin por WebSocket). Capítulos mp4 opcionales y previews live más rápidas.

    Notas: https://github.com/blakeblackshear/frigate/releases/tag/v0.17.2
  fullDescription: |
    Frigate es un NVR completo y local diseñado para Home Assistant con detección de objetos por IA. Usa OpenCV y Tensorflow para realizar detección de objetos en tiempo real de forma local para cámaras IP.

    **Funciones principales**
    - Integración estrecha con Home Assistant mediante un componente personalizado
    - Diseñado para minimizar el uso de recursos y maximizar el rendimiento buscando objetos solo cuando y donde es necesario
    - Aprovecha intensamente el multiprocesamiento con énfasis en tiempo real frente a procesar cada fotograma
    - Usa detección de movimiento de muy bajo coste para decidir dónde ejecutar la detección de objetos
    - La detección de objetos con TensorFlow se ejecuta en procesos separados para máximo FPS
    - Comunica por MQTT para una fácil integración en otros sistemas
    - Graba vídeo con ajustes de retención basados en objetos detectados
    - Grabación 24/7
    - Re-streaming vía RTSP para reducir el número de conexiones a la cámara
    - Soporte WebRTC y MSE para vista en vivo de baja latencia

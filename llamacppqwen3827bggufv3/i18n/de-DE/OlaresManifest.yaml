metadata:
  description: "Qwen3.8-27B (GGUF UD-Q4_K_XL), bereitgestellt mit llama.cpp"
  title: Qwen3.8-27B (llama.cpp)
spec:
  upgradeDescription: |
    v1.0.21: Upgrade llama.cpp to server-cuda13-b12352 (from b11046). Highlights:
    - Faster prompt processing for Qwen3.8 on NVIDIA GPUs with new chunked Gated DeltaNet CUDA kernels and more fused operations.
    - More reliable MTP speculative decoding: draft state is saved and restored correctly, image prompts work with MTP, and drafts are verified with probabilistic sampling at non-zero temperatures.
    - Context checkpoints are shared instead of copied, reducing memory use for parallel requests.
    - The server exposes the reasoning effort levels (xhigh, medium, low) defined by the chat template.
    - Security fixes for media URL handling, CORS, and DNS rebinding.
  fullDescription: |
    **Modellübersicht**
    Qwen3.8-27B ist ein Vision-Language-Modell aus der Qwen-Serie (Alibaba), das auf der Qwen3.5-Architektur basiert. Es unterstützt Denken, Tool-Aufrufe und natives Bild-/Videoverständnis mit einem Kontextfenster von 256K. Diese App stellt den `UD-Q4_K_XL`-GGUF-Build aus `unsloth/Qwen3.8-27B-GGUF` über llama.cpp bereit.

    **Voreingestellte Konfiguration**
    - Modell: `unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL` (mit `mmproj-F16.gguf`-Projektor für Vision)
    - Fähigkeiten: Denken, Tools, Vision
    - Engine-Argumente: `-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 2 -kvu --spec-type draft-mtp --spec-draft-n-max 2` (102K Kontext, spekulative MTP-Dekodierung)
    - Erforderlicher GPU-Speicher: `23Gi`

    **Beschleunigermodi**
    | Modus          | Gerät             | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Verwendet `23Gi` GPU-Speicher; `-ngl all` für vollständige GPU-Nutzung |
    | `nvidia-gb10`  | GPU (Spark)       | Wie oben, aber der Speicher wird vom Pod verwaltet |

    **Funktionsweise**
    Zunächst lädt Model Console das Modell herunter und bereitet es vor. Anschließend stellt `llama.cpp` das Modell bereit, sobald es fertig ist. Diese beiden Komponenten werden getrennt ausgeführt, nutzen aber gemeinsame Dateien und Fortschrittsinformationen.

    **Stack**
    - **llama.cpp** (`server-cuda13-b12352`): Führt das Modell aus und stellt API-Anfragen bereit (Port 8081)
    - **Model Console**: Lädt das Modell herunter, zeigt den Fortschritt an und stellt die OpenAI API auf Port 8090 bereit, wobei Anfragen an `llamacpp` weitergeleitet werden.

    **Modellspeicher**
    Alle Modelldateien werden in einem gemeinsamen Ordner unter `appCommon/huggingface` gespeichert, der als `/cache/hf/hub` eingebunden ist. Alle ähnlichen Apps verwenden diesen Speicherort für Modelle.

metadata:
  description: "Qwen3.8-27B (GGUF UD-Q4_K_XL) served with llama.cpp."
  title: Qwen3.8-27B (llama.cpp)

spec:
  upgradeDescription: |
    v1.0.21: Upgrade llama.cpp to server-cuda13-b12352 (from b11046). Highlights:
    - Faster prompt processing for Qwen3.8 on NVIDIA GPUs with new chunked Gated DeltaNet CUDA kernels and more fused operations.
    - More reliable MTP speculative decoding: draft state is saved and restored correctly, image prompts work with MTP, and drafts are verified with probabilistic sampling at non-zero temperatures.
    - Context checkpoints are shared instead of copied, reducing memory use for parallel requests.
    - The server exposes the reasoning effort levels (xhigh, medium, low) defined by the chat template.
    - Security fixes for media URL handling, CORS, and DNS rebinding.
  fullDescription: |
    **Model Overview**
    Qwen3.8-27B is a vision-language model from the Qwen series (Alibaba), built on the Qwen3.5 architecture. It supports thinking, tool-calling, and native image/video understanding, with a 256K context window. This app serves the `UD-Q4_K_XL` GGUF build from `unsloth/Qwen3.8-27B-GGUF` via llama.cpp.

    **Preset Configuration**
    - Model: `unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL` (with `mmproj-F16.gguf` projector for vision)
    - Capabilities: thinking, tools, vision
    - Engine args: `-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 2 -kvu --spec-type draft-mtp --spec-draft-n-max 2` (102K shared pool, 2 slots, MTP speculative decode)
    - Required GPU memory: `23Gi`

    **Accelerator modes**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Uses `23Gi` GPU memory; `-ngl all` for full GPU  |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod     |

    **How It Works**
    First, Model Console downloads the model and gets it ready, then `llama.cpp` starts serving the model when it's ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp** (`server-cuda13-b12352`): Runs the model and serves API requests (port 8081)
    - **Model Console**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

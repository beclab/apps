metadata:
  description: "llama.cpp で提供される Qwen3.8-27B (GGUF UD-Q4_K_XL)"
  title: Qwen3.8-27B (llama.cpp)
spec:
  upgradeDescription: |
    v1.0.21: Upgrade llama.cpp to server-cuda13-b12352 (from b11046). Highlights:
    - Faster prompt processing for Qwen3.8 on NVIDIA GPUs with new chunked Gated DeltaNet CUDA kernels and more fused operations.
    - More reliable MTP speculative decoding: draft state is saved and restored correctly, image prompts work with MTP, and drafts are verified with probabilistic sampling at non-zero temperatures.
    - Context checkpoints are shared instead of copied, reducing memory use for parallel requests.
    - The server exposes the reasoning effort levels (xhigh, medium, low) defined by the chat template.
    - Security fixes for media URL handling, CORS, and DNS rebinding.
  fullDescription: |
    **モデル概要**
    Qwen3.8-27B は Qwen3.5 アーキテクチャを基盤とする Qwen シリーズ（Alibaba）のビジョン言語モデルです。推論、ツール呼び出し、ネイティブな画像/動画理解に対応し、256K のコンテキストウィンドウを備えています。このアプリは、`unsloth/Qwen3.8-27B-GGUF` の `UD-Q4_K_XL` GGUF ビルドを llama.cpp 経由で提供します。

    **プリセット構成**
    - モデル：`unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL`（ビジョン用の `mmproj-F16.gguf` プロジェクターを使用）
    - 機能：推論、ツール、ビジョン
    - エンジン引数：`-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 2 -kvu --spec-type draft-mtp --spec-draft-n-max 2`（102K コンテキスト、MTP 投機的デコード）
    - 必要な GPU メモリ：`23Gi`

    **アクセラレーターモード**
    | モード          | デバイス           | 詳細                                             |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | `23Gi` の GPU メモリを使用。`-ngl all` で GPU 全体を使用 |
    | `nvidia-gb10`  | GPU (Spark)       | 上記と同様ですが、メモリは pod によって管理されます |

    **動作の仕組み**
    まず Model Console がモデルをダウンロードして準備し、準備完了後に `llama.cpp` がモデルの提供を開始します。この 2 つは個別に動作しますが、ファイルと進捗情報を共有します。

    **スタック**
    - **llama.cpp** (`server-cuda13-b12352`)：モデルを実行し、API リクエストを処理します（ポート 8081）
    - **Model Console**：モデルをダウンロードして進捗を表示し、ポート 8090 で OpenAI API を提供して `llamacpp` にプロキシします。

    **モデルストレージ**
    すべてのモデルファイルは `appCommon/huggingface` の共有フォルダーに保存され、`/cache/hf/hub` としてマウントされます。同様のアプリはすべて、この場所をモデル用に使用します。

metadata:
  description: "Qwen3.8-27B (GGUF UD-Q4_K_XL) servito con llama.cpp"
  title: Qwen3.8-27B (llama.cpp)
spec:
  upgradeDescription: |
    v1.0.21: Upgrade llama.cpp to server-cuda13-b12352 (from b11046). Highlights:
    - Faster prompt processing for Qwen3.8 on NVIDIA GPUs with new chunked Gated DeltaNet CUDA kernels and more fused operations.
    - More reliable MTP speculative decoding: draft state is saved and restored correctly, image prompts work with MTP, and drafts are verified with probabilistic sampling at non-zero temperatures.
    - Context checkpoints are shared instead of copied, reducing memory use for parallel requests.
    - The server exposes the reasoning effort levels (xhigh, medium, low) defined by the chat template.
    - Security fixes for media URL handling, CORS, and DNS rebinding.
  fullDescription: |
    **Panoramica del modello**
    Qwen3.8-27B è un modello visione-linguaggio della serie Qwen (Alibaba), basato sull'architettura Qwen3.5. Supporta ragionamento, chiamate agli strumenti e comprensione nativa di immagini/video, con una finestra di contesto di 256K. Questa app serve la build GGUF `UD-Q4_K_XL` di `unsloth/Qwen3.8-27B-GGUF` tramite llama.cpp.

    **Configurazione predefinita**
    - Modello: `unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL` (con proiettore `mmproj-F16.gguf` per la visione)
    - Capacità: ragionamento, strumenti, visione
    - Argomenti del motore: `-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 2 -kvu --spec-type draft-mtp --spec-draft-n-max 2` (contesto 102K, decodifica speculativa MTP)
    - Memoria GPU richiesta: `23Gi`

    **Modalità acceleratore**
    | Modalità        | Dispositivo       | Dettagli                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` di memoria GPU; `-ngl all` per l'intera GPU |
    | `nvidia-gb10`  | GPU (Spark)       | Come sopra, ma la memoria è gestita dal pod      |

    **Come funziona**
    Model Console scarica e prepara il modello, quindi `llama.cpp` inizia a servirlo quando è pronto. Queste due parti vengono eseguite separatamente, ma condividono file e informazioni sull'avanzamento.

    **Stack**
    - **llama.cpp** (`server-cuda13-b12352`): Esegue il modello e serve le richieste API (porta 8081)
    - **Model Console**: Scarica il modello, mostra l'avanzamento e fornisce la OpenAI API sulla porta 8090, inoltrando le richieste a `llamacpp`.

    **Archiviazione del modello**
    Tutti i file del modello sono archiviati in una cartella condivisa in `appCommon/huggingface`, montata come `/cache/hf/hub`. Tutte le app simili utilizzano questa posizione per i modelli.

metadata:
  description: "Qwen3.8-27B (GGUF UD-Q4_K_XL) servito con llama.cpp"
  title: Qwen3.8-27B (llama.cpp)
spec:
  upgradeDescription: |
    v1.0.18: Upgrade llama.cpp to server-cuda13-b11046. Raise the NVIDIA host-memory limit by 10Gi (engine 38Gi to 48Gi, chart limitedMemory 40Gi to 50Gi).

    v1.0.17: Model Console (llm-init) è stato aggiornato alla versione v1.7.21.

    v1.0.16: Model Console viene aggiornato a llm-init v1.7.19.

    v1.0.14: Upgrade llama.cpp to server-cuda13-b10920. Keep the shared 102K context pool, two slots, and MTP draft depth 2.

    v1.0.13: Upgrade llama.cpp to server-cuda12-b10884 and set the default MTP draft depth to 2. Migrate exact previous presets while preserving custom engine arguments.

    v1.0.5: Aggiornamento di llm-init a v1.3.10; MODEL_REASONING_EFFORT e MODEL_REASONING_EFFORT_DEFAULT impostate come variabili di ambiente non modificabili; aggiornamento di llama.cpp a server-cuda12-b10548.

    v1.0.4: Pubblicazione nella scheda del modello dei livelli di ragionamento effettivamente accettati (low, medium, xhigh, predefinito xhigh), in modo che un client possa leggerli da Router anziché indovinarli. Richiede llm-init v1.3.10.

    v1.0.3: Riduzione della memoria host NVIDIA riservata per facilitare l'installazione sui nodi timeslice 1.12.6 (richiesta del motore da 21Gi a 6Gi, chart requiredMemory da 23Gi a 7Gi, sufficiente per il working set misurato di ~5.3Gi). La quota GPU rimane 23Gi.

    v1.0.0: Prima versione. llama.cpp server-cuda12-b10454, llm-init v1.3.5. Unsloth Qwen3.8-27B UD-Q4_K_XL + mmproj, contesto 102K (-c 104448), MTP --spec-draft-n-max 4, quota GPU 23Gi.
  fullDescription: |
    **Panoramica del modello**
    Qwen3.8-27B è un modello visione-linguaggio della serie Qwen (Alibaba), basato sull'architettura Qwen3.5. Supporta ragionamento, chiamate agli strumenti e comprensione nativa di immagini/video, con una finestra di contesto di 256K. Questa app serve la build GGUF `UD-Q4_K_XL` di `unsloth/Qwen3.8-27B-GGUF` tramite llama.cpp.

    **Configurazione predefinita**
    - Modello: `unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL` (con proiettore `mmproj-F16.gguf` per la visione)
    - Capacità: ragionamento, strumenti, visione
    - Argomenti del motore: `-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 2 -kvu --spec-type draft-mtp --spec-draft-n-max 2` (contesto 102K, decodifica speculativa MTP)
    - Memoria GPU richiesta: `23Gi`

    **Modalità acceleratore**
    | Modalità        | Dispositivo       | Dettagli                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` di memoria GPU; `-ngl all` per l'intera GPU |
    | `nvidia-gb10`  | GPU (Spark)       | Come sopra, ma la memoria è gestita dal pod      |

    **Come funziona**
    Model Console scarica e prepara il modello, quindi `llama.cpp` inizia a servirlo quando è pronto. Queste due parti vengono eseguite separatamente, ma condividono file e informazioni sull'avanzamento.

    **Stack**
    - **llama.cpp** (`server-cuda13-b11046`): Esegue il modello e serve le richieste API (porta 8081)
    - **Model Console**: Scarica il modello, mostra l'avanzamento e fornisce la OpenAI API sulla porta 8090, inoltrando le richieste a `llamacpp`.

    **Archiviazione del modello**
    Tutti i file del modello sono archiviati in una cartella condivisa in `appCommon/huggingface`, montata come `/cache/hf/hub`. Tutte le app simili utilizzano questa posizione per i modelli.

metadata:
  description: "使用 llama.cpp 运行 Qwen3.8-27B（GGUF UD-Q4_K_XL）模型。"
  title: Qwen3.8-27B (llama.cpp)

spec:
  fullDescription: |
    **模型简介**
    Qwen3.8-27B 是阿里巴巴 Qwen 系列的视觉语言模型，基于 Qwen3.5 架构，开箱即用支持思考、工具调用与原生图像/视频理解，上下文窗口 256K。本应用通过 llama.cpp 运行 `unsloth/Qwen3.8-27B-GGUF` 的 `UD-Q4_K_XL` GGUF 量化版本。

    **预设配置**
    - 模型：`unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL`（含 `mmproj-F16.gguf` 视觉投影文件）
    - 能力：思考、工具、视觉
    - 引擎参数：`-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 4`（102K 上下文、MTP 投机解码）
    - 所需显存：`23Gi`

    **加速器模式**
    | 模式           | 设备             | 说明                                        |
    |----------------|------------------|---------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 使用 `23Gi` 显存，`-ngl all` 完全利用 GPU   |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                  |

    **工作流程说明**
    首先，Model Console 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**（`server-cuda12-b10454`）：运行模型并通过 8081 端口提供 API 服务
    - **Model Console**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

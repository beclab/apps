metadata:
  title: Penpot
  description: Penpot is the web-based open-source design tool that bridges the gap
    between designers and developers.
spec:
  fullDescription: |
    Penpot is the first open-source design tool for design and code collaboration. Designers can create stunning designs, interactive prototypes, design systems at scale, while developers enjoy ready-to-use code and make their workflow easy and fast. And all of this with no handoff drama.

    **Why Penpot**
    Penpot expresses designs as code. Designers can do their best work and see it will be beautifully implemented by developers in a two-way collaboration.

    - Designed for developers
    Penpot was built to serve both designers and developers and create a fluid design-code process. You have the choice to enjoy real-time collaboration or play "solo".

    - Inspect mode
    Work with ready-to-use code and make your workflow easy and fast. The inspect tab gives instant access to SVG, CSS and HTML code.

    - Self host your own instance
    Provide your team or organization with a completely owned collaborative design tool. Use Penpot's cloud service or deploy your own Penpot server.

    - Integrations
    Penpot offers integration into the development toolchain, thanks to its support for webhooks and an API accessible through access tokens.

    **What's great for design**
    With Penpot you can design libraries to share and reuse; turn design elements into components and tokens to allow reusability and scalability; and build realistic user flows and interactions
  upgradeDescription: |
    Penpot is upgraded from 2.14.4 to 2.17, with improvements to design tokens, editing, and prototyping.
    Existing MCP clients need reconfiguration: the separate MCP URLs have been removed in favor of Penpot's built-in integration.

    - Use the built-in MCP integration to connect AI assistants to Penpot.
    - Apply design tokens directly in numeric fields and import tokens from linked libraries.
    - Find and replace text and layer names, and preview saved versions before restoring them.
    - Customize dashed strokes and apply layer blur effects.
    - Search for prototype interaction destinations and see authors and timestamps in version history.
    - Fix issues with SVG copying, text exports, and component variants.

    [Penpot 2.17.0 release notes](https://github.com/penpot/penpot/releases/tag/2.17.0)

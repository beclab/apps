metadata:
  title: Penpot
  description: Penpot 是一种基于网络的开源设计工具，旨在消除设计师和开发人员之间的隔阂

spec:
  fullDescription: |
    Penpot 是第一个用于设计和代码协作的开源设计工具。设计师可以创建令人惊叹的设计、交互式原型、大规模设计系统，而开发人员则可以享受即用型代码，使他们的工作流程变得简单快捷。而所有这些交接都会顺畅高效。

    **为什么选择 Penpot**
    
    Penpot 可将设计表达为代码。设计师可以尽其所能地工作，并在双向协作中看到他们的设计被开发人员完美实现。

    - 为开发人员而设计  
    Penpot 的构建旨在同时服务于设计师和开发人员，并创造一个流畅的设计-代码流程。你可以选择享受实时协作或“单独”工作。

    - 检查模式  
    使用即用型代码工作，使你的工作流程变得简单快捷。检查标签页提供了即时访问 SVG、CSS 和 HTML 代码的功能。

    - 自托管你自己的实例  
    为你的团队或组织提供一个完全自主的协作设计工具。使用 Penpot 的云服务或部署你自己的 Penpot 服务器。

    - 集成  
    由于支持 webhooks 和通过访问令牌可访问的 API，Penpot 提供了与开发工具链的集成。

    **设计的好处**
    使用 Penpot，你可以设计可共享和重用的库；将设计元素转换为组件和令牌，以实现可重用性和可扩展性；并构建真实的用户流程和交互。

  upgradeDescription: |
    Penpot 从 2.14.4 升级至 2.17，改进了设计令牌、编辑和原型制作功能。
    现有 MCP 客户端需要重新配置：独立 MCP 地址已移除，改为使用 Penpot 内置集成。

    - 通过内置 MCP 集成将 AI 助手连接到 Penpot。
    - 在数值输入框中直接应用设计令牌，并从关联库导入令牌。
    - 查找替换文本和图层名称，并在恢复已保存的版本前预览内容。
    - 自定义虚线描边，并应用图层模糊效果。
    - 搜索原型交互的目标，并在版本历史中查看作者和时间。
    - 修复 SVG 复制、文本导出和组件变体相关问题。

    [Penpot 2.17.0 发布说明](https://github.com/penpot/penpot/releases/tag/2.17.0)

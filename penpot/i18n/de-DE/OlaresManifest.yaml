metadata:
  title: Penpot
  description: Penpot ist das webbasierte Open-Source-Design-Tool, das die Lücke
    zwischen Designern und Entwicklern schließt
spec:
  fullDescription: |
    Penpot ist das erste Open-Source-Design-Tool für Design- und Code-Zusammenarbeit. Designer können beeindruckende Designs, interaktive Prototypen und Designsysteme in großem Maßstab erstellen, während Entwickler fertigen Code nutzen und ihren Workflow einfach und schnell gestalten. Und das alles ohne Handoff-Drama.

    **Warum Penpot**
    Penpot drückt Designs als Code aus. Designer können ihre beste Arbeit leisten und sehen, dass sie von Entwicklern in einer Zwei-Wege-Zusammenarbeit schön umgesetzt wird.

    - Für Entwickler konzipiert
    Penpot wurde gebaut, um Designern und Entwicklern zu dienen und einen flüssigen Design-Code-Prozess zu schaffen. Sie können Echtzeit-Zusammenarbeit genießen oder solo arbeiten.

    - Inspect-Modus
    Arbeiten Sie mit fertigem Code und machen Sie Ihren Workflow einfach und schnell. Der Inspect-Tab bietet sofortigen Zugriff auf SVG-, CSS- und HTML-Code.

    - Eigene Instanz selbst hosten
    Stellen Sie Ihrem Team oder Ihrer Organisation ein vollständig eigenes kollaboratives Design-Tool bereit. Nutzen Sie den Cloud-Dienst von Penpot oder betreiben Sie Ihren eigenen Penpot-Server.

    - Integrationen
    Penpot bietet Integration in die Entwicklungswerkzeugkette dank Webhook-Unterstützung und einer API über Access Tokens.

    **Was für Design großartig ist**
    Mit Penpot können Sie Bibliotheken zum Teilen und Wiederverwenden entwerfen; Designelemente in Komponenten und Tokens verwandeln, um Wiederverwendbarkeit und Skalierbarkeit zu ermöglichen; und realistische User Flows und Interaktionen aufbauen
  upgradeDescription: |
    Penpot wird von 2.14.4 auf 2.17 aktualisiert und verbessert Design-Tokens, Bearbeitung und Prototyping.
    Bestehende MCP-Clients müssen neu konfiguriert werden: Die separaten MCP-URLs wurden durch die integrierte MCP-Anbindung von Penpot ersetzt.

    - KI-Assistenten über die integrierte MCP-Anbindung mit Penpot verbinden.
    - Design-Tokens direkt in Zahlenfeldern anwenden und Tokens aus verknüpften Bibliotheken importieren.
    - Text und Ebenennamen suchen und ersetzen sowie gespeicherte Versionen vor der Wiederherstellung in einer Vorschau ansehen.
    - Gestrichelte Konturen anpassen und Ebenen mit einem Weichzeichnereffekt versehen.
    - Nach Zielen für Prototyp-Interaktionen suchen und Autoren sowie Zeitstempel im Versionsverlauf anzeigen.
    - Probleme beim Kopieren von SVG, beim Textexport und mit Komponentenvarianten beheben.

    [Versionshinweise zu Penpot 2.17.0](https://github.com/penpot/penpot/releases/tag/2.17.0)

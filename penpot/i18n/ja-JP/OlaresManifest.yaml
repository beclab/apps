metadata:
  title: Penpot
  description: Penpot はデザイナーと開発者の間のギャップを埋めるウェブベースのオープンソースデザインツールです
spec:
  fullDescription: |
    Penpot はデザインとコードの協業向け初のオープンソースデザインツールです。デザイナーは美しいデザイン、インタラクティブなプロトタイプ、大規模なデザインシステムを作成でき、開発者はすぐ使えるコードを活用してワークフローを簡単・高速にできます。ハンドオフの混乱もありません。

    **なぜ Penpot か**
    Penpot はデザインをコードとして表現します。デザイナーは最高の仕事ができ、双方向の協業で開発者によって美しく実装されるのを見られます。

    - 開発者向けに設計
    Penpot はデザイナーと開発者の両方に仕え、スムーズなデザイン〜コードプロセスを作るために構築されました。リアルタイム協業もソロ作業も選べます。

    - Inspect モード
    すぐ使えるコードで作業し、ワークフローを簡単・高速に。Inspect タブで SVG、CSS、HTML コードに即アクセス。

    - 自前インスタンスをセルフホスト
    チームや組織に完全に所有する協業デザインツールを提供。Penpot のクラウドサービスを使うか、自前の Penpot サーバーをデプロイ。

    - インテグレーション
    Webhook 対応とアクセストークン経由の API により、開発ツールチェーンへの統合を提供。

    **デザインに強い点**
    Penpot では共有・再利用するライブラリを設計し、デザイン要素をコンポーネントやトークンにして再利用性とスケーラビリティを高め、現実的なユーザーフローとインタラクションを構築できます
  upgradeDescription: |
    Penpotを2.14.4から2.17に更新し、デザイントークン、編集、プロトタイプ作成の機能を改善しました。
    既存のMCPクライアントは再設定が必要です。個別のMCP URLは廃止され、Penpot内蔵の連携機能に置き換わりました。

    - 内蔵のMCP連携機能でAIアシスタントをPenpotに接続できます。
    - 数値入力欄でデザイントークンを直接適用し、リンクされたライブラリからトークンをインポートできます。
    - テキストやレイヤー名の検索と置換、保存済みバージョンの復元前プレビューに対応しました。
    - 破線のストロークをカスタマイズし、レイヤーにぼかし効果を適用できます。
    - プロトタイプのインタラクションの移動先を検索し、バージョン履歴で作成者と日時を確認できます。
    - SVGのコピー、テキストのエクスポート、コンポーネントのバリアントに関する問題を修正しました。

    [Penpot 2.17.0リリースノート](https://github.com/penpot/penpot/releases/tag/2.17.0)

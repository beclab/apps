metadata:
  description: Un modelo de síntesis de voz con voces predefinidas, clonadas y diseñadas
  title: FireRedTTS3 Instruct

spec:
  fullDescription: |
    FireRedTTS3-Instruct convierte texto escrito en voz. Admite voces predefinidas, clonación a partir de una grabación de referencia y creación de voces mediante una descripción escrita.

    **Funciones principales**
    - Generar voz con voces predefinidas.
    - Clonar una voz a partir de audio de referencia y su transcripción correspondiente.
    - Diseñar y guardar una voz a partir de una descripción en lenguaje natural.
    - Reutilizar las voces clonadas y diseñadas en la misma instalación de Olares.

    Se requiere una GPU NVIDIA compatible con al menos `16Gi` de memoria gráfica.

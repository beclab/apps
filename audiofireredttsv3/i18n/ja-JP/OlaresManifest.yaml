metadata:
  description: プリセット、クローン、設計した音声に対応する音声合成モデル
  title: FireRedTTS3 Instruct

spec:
  fullDescription: |
    FireRedTTS3-Instructは、テキストを音声に変換します。プリセット音声、参照録音からの音声クローン、文章による説明からの音声作成に対応しています。

    **主な機能**
    - プリセット音声で音声を生成します。
    - 参照音声と対応する文字起こしから音声をクローンします。
    - 自然言語による説明から音声を設計して保存します。
    - クローンまたは設計した音声を同じOlares環境で再利用できます。

    `16Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。

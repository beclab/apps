metadata:
  description: Un modello di sintesi vocale con voci predefinite, clonate e progettate
  title: FireRedTTS3 Instruct

spec:
  fullDescription: |
    FireRedTTS3-Instruct trasforma il testo scritto in voce. Supporta voci predefinite, clonazione da una registrazione di riferimento e creazione di una voce da una descrizione scritta.

    **Funzionalità principali**
    - Generare parlato con voci predefinite.
    - Clonare una voce da un audio di riferimento e dalla trascrizione corrispondente.
    - Progettare e salvare una voce partendo da una descrizione in linguaggio naturale.
    - Riutilizzare le voci clonate e progettate sulla stessa installazione Olares.

    È necessaria una GPU NVIDIA compatibile con almeno `16Gi` di memoria video.

metadata:
  title: Open Design
  description: 在 Olares 上运行的本地优先 AI 设计工作室，支持幻灯片、原型与 Deck 生成。

spec:
  fullDescription: |
    ## 概述
    Open Design 来自 [nexu-io/open-design](https://github.com/nexu-io/open-design)，
    在 Olares 上以 Web 应用运行，支持 BYOK 模型提供商、OpenCode Agent 工作流，以及 HTML/PDF/PPTX 等真实产物。

    ## 能力
    - 通过提示词生成幻灯片、落地页、线框图与设计文档
    - 自带 API Key，可对接 Olares 上的 llama.cpp 或 LiteLLM 网关
    - 内置 OpenCode 运行时，支持 Agent 驱动的设计任务
    - 项目数据持久化在 appData

    ## 运行要求
    - Olares >= 1.12.6
    - amd64 节点
    - 可选：本地或 Olares 托管的 OpenAI 兼容模型 API

    ## 开始使用
    1. 从 Market 安装（测试源：`market.test`）。
    2. 打开 Open Design，进入 **设置 → 模型与提供商 → API 提供商**。
    3. 配置 Base URL、API Key 与模型；若使用 Olares 内网模型入口，请在 `OD_ALLOWED_INTERNAL_HOSTS` 中加入对应域名。
    4. 先用简单单页任务验证，再尝试多页 Deck。
  upgradeDescription: |
    ## Open Design 0.0.9

    - 首次 Olares 上架 chart，基于 nexu-io/od 0.19.1。
    - 自动安装 OpenCode（musl）以支持 BYOK Agent 任务。
    - 为无交互环境配置 OpenCode 目录权限（插件与项目目录）。
    - 提供 SSRF 白名单环境变量，便于对接 Olares 模型 API。

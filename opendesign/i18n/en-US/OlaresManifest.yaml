metadata:
  title: Open Design
  description: Local-first AI design studio for slides, prototypes, and decks on Olares

spec:
  fullDescription: |
    Open Design is a local-first AI design studio from nexu-io/open-design. On Olares it runs as a web app with BYOK model providers, OpenCode agent workflows, and real HTML/PDF/PPTX artifacts.

    Highlights
    - Generate slides, landing pages, wireframes, and design docs from prompts
    - Connect Olares-hosted llama.cpp or LiteLLM as OpenAI-compatible gateways
    - Bundled OpenCode runtime for agent-driven design tasks
    - Persistent project data under appData

    Recommended setup on Olares
    - Model: use a local Qwen3.8 model served by llama.cpp (for example Qwen3.8-27B) on your Olares node
    - Max tokens: set 65536 or 32768 in Open Design settings to reduce truncated runs on multi-step decks
    - Olares-hosted model Base URLs are auto-allowed from your configured provider hostname; add extra hostnames in OD_ALLOWED_INTERNAL_HOSTS only when needed

    Requirements
    - Olares >= 1.12.6
    - amd64 or arm64 node

    Getting started
    1. Install Open Design from Market.
    2. Install and start a local Qwen3.8 llama.cpp model, then copy its OpenAI-compatible Base URL.
    3. In Open Design, open Settings → Models & Providers → API Provider. Set Base URL, model id, and Max tokens (65536 or 32768).
    4. Start with a simple single-slide prompt, then move to multi-page decks.
  upgradeDescription: |
    Upgraded Open Design to 0.26.1.

    - Added Skill Discovery to select relevant guidance across 11 deliverable types, including interactive prototypes and motion work.
    - Keep the selected Skill guidance through follow-up revisions while respecting requests for planning or clarification.
    - Use registered agent runtimes and the same BYOK model connection in the app and the od CLI; project previews keep their browser storage isolated.
    - Start a project directly from Home with a stable workspace and first message, even while creation or uploads finish.
    - Improved motion-preview audio synchronization, comment-draft preservation, and recovery of completed project history.

    Retained OpenCode 1.18.30, private model endpoint support, and existing data at /app/.od.

    https://github.com/nexu-io/open-design/releases/tag/open-design-v0.26.1

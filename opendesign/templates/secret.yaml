apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: opendesign
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.olaresEnv.OPENAI_API_KEY | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.olaresEnv.ANTHROPIC_API_KEY | default "" | quote }}
  DEEPSEEK_API_KEY: {{ .Values.olaresEnv.DEEPSEEK_API_KEY | default "" | quote }}

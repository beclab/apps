{{- $opendesignDomainENV := split "," (.Values.domain.opendesign | default "") -}}
{{- $opendesignDomain := index $opendesignDomainENV "_0" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendesign
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: opendesign
spec:
  replicas: {{ .Values.workloads.opendesign.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: opendesign
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: opendesign
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: init-permissions
        image: docker.io/beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          for d in /app/.od /tmp /app/.od/.config/opencode; do
            mkdir -p "$d" && chown 1000:1000 "$d"
          done
          printf '%s\n' '{"permission":{"external_directory":{"/app/**":"allow"},"bash":{"*":"allow"},"read":{"*":"allow"},"write":{"*":"allow"}}}' > /app/.od/.config/opencode/opencode.json
          chown 1000:1000 /app/.od/.config/opencode/opencode.json
          APP_CONFIG=/app/.od/app-config.json
          if [ ! -f "$APP_CONFIG" ]; then
            cat > "$APP_CONFIG" <<'EOF'
          {
            "onboardingCompleted": true,
            "agentId": "opencode",
            "designSystemId": "default",
            "orbit": {
              "enabled": false,
              "time": "08:00",
              "templateSkillId": "orbit-general"
            },
            "projectLocations": [],
            "defaultProjectLocationId": "default"
          }
          EOF
          elif ! grep -q '"onboardingCompleted"' "$APP_CONFIG"; then
            tmp="${APP_CONFIG}.tmp"
            {
              IFS= read -r first || exit 1
              printf '%s\n' "$first"
              printf '%s\n' '  "onboardingCompleted": true,'
              cat
            } < "$APP_CONFIG" > "$tmp"
            mv "$tmp" "$APP_CONFIG"
          fi
          chown 1000:1000 "$APP_CONFIG"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: app-data
          mountPath: /app/.od
        - name: tmp
          mountPath: /tmp
      containers:
      - name: opendesign
        image: docker.io/beclab/harveyff-opendesign:0.22.1-4
        imagePullPolicy: IfNotPresent
        env:
        - name: HOME
          value: /app/.od
        - name: PATH
          value: /opt/opencode/bin:/usr/local/bin:/usr/bin:/bin
        - name: OPENCODE_CONFIG_CONTENT
          value: '{"permission":{"external_directory":{"/app/**":"allow"},"bash":{"*":"allow"},"read":{"*":"allow"},"write":{"*":"allow"}}}'
        - name: OD_OPENCODE_MAX_OUTPUT_TOKENS
          value: "65536"
        - name: OD_CHAT_RUN_INACTIVITY_TIMEOUT_MS
          value: "1800000"
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: --max-old-space-size=512
        - name: OD_BIND_HOST
          value: 0.0.0.0
        - name: OD_PORT
          value: "7456"
        - name: OD_WEB_PORT
          value: "7456"
        - name: OD_DISABLE_API_AUTH
          value: "1"
        - name: OD_ALLOWED_ORIGINS
          value: "https://{{ $opendesignDomain }}"
        - name: OD_ALLOWED_INTERNAL_HOSTS
          value: {{ .Values.olaresEnv.OD_ALLOWED_INTERNAL_HOSTS | default "" | quote }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: ANTHROPIC_API_KEY
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: DEEPSEEK_API_KEY
        ports:
        - name: http
          containerPort: 7456
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: app-data
          mountPath: /app/.od
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/health
            port: 7456
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/health
            port: 7456
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: app-data
        hostPath:
          type: DirectoryOrCreate
          path: {{ .Values.userspace.appData }}
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: opendesign
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: opendesign
spec:
  ports:
  - name: http
    port: 7456
    targetPort: 7456
  selector:
    io.kompose.service: opendesign

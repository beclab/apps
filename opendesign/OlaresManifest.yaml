olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  opendesign: 1
metadata:
  name: opendesign
  appid: opendesign
  title: Open Design
  description: Local-first AI design studio for slides, prototypes, and decks on Olares.
  icon: https://cdn.olares.com/images/2026/08/919ec8a2cbd0b0285ee33e455376c90b.png
  version: 0.0.14
  categories:
  - Creativity
  - agents
  - workspace
  tags:
  - workbench
  - design

spec:
  versionName: '0.19.2'
  featuredImage: https://cdn.olares.com/images/2026/08/0021804b205933301ee29bb63136a996.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/0021804b205933301ee29bb63136a996.png
  - https://cdn.olares.com/images/2026/08/a8738623c1c6426d237529f3ecfa889d.png
  - https://cdn.olares.com/images/2026/08/f14baaf81c224fe76aa76c90aa04ea63.png
  fullDescription: |
    Open Design is a local-first AI design studio from nexu-io/open-design. On Olares it runs as a web app with BYOK model providers, OpenCode agent workflows, and real HTML/PDF/PPTX artifacts.

    Highlights
    - Generate slides, landing pages, wireframes, and design docs from prompts
    - Connect Olares-hosted llama.cpp or LiteLLM as OpenAI-compatible gateways
    - Bundled OpenCode runtime for agent-driven design tasks
    - Persistent project data under appData

    Recommended setup on Olares
    - Model: use a local Qwen3.8 model served by llama.cpp (for example Qwen3.8-27B) on your Olares node
    - Max tokens: set 65536 or 32768 in Open Design settings to reduce truncated runs on multi-step decks
    - Olares-hosted model Base URLs are auto-allowed from your configured provider hostname; add extra hostnames in OD_ALLOWED_INTERNAL_HOSTS only when needed

    Requirements
    - Olares >= 1.12.6
    - amd64 or arm64 node

    Getting started
    1. Install Open Design from Market.
    2. Install and start a local Qwen3.8 llama.cpp model, then copy its OpenAI-compatible Base URL.
    3. In Open Design, open Settings → Models & Providers → API Provider. Set Base URL, model id, and Max tokens (65536 or 32768).
    4. Start with a simple single-slide prompt, then move to multi-page decks.
  upgradeDescription: |
    Open Design 0.0.14

    - Seed app-config with onboardingCompleted so Olares installs open the workspace directly.
    - Existing installs missing that flag are patched on pod start; no OpenDesign cloud login required.
  developer: nexu-io
  website: https://open-design.ai/
  sourceCode: https://github.com/nexu-io/open-design
  submitter: harveyff
  locale:
  - en-US
  - zh-CN
  license:
  - text: Apache-2.0
    url: https://github.com/nexu-io/open-design/blob/main/LICENSE
  runAsUser: true
  requiredCpu: 0.1
  limitedCpu: 1
  requiredMemory: 256Mi
  limitedMemory: 2Gi
  requiredDisk: 128Mi
  limitedDisk: 8Gi
  supportArch:
  - amd64
  - arm64
permission:
  appData: true
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 443
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
  - envName: OPENAI_API_KEY
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_OPENAI_APIKEY
  - envName: ANTHROPIC_API_KEY
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_ANTHROPIC_APIKEY
  - envName: DEEPSEEK_API_KEY
    type: password
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: Optional DeepSeek API key for agent-driven design generation.
  - envName: OD_ALLOWED_INTERNAL_HOSTS
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: >-
      Optional comma-separated extra hostnames for Olares-hosted model APIs.
      The configured BYOK Base URL hostname is auto-allowed; use this for
      additional entrances if needed. Example:
      abc12345.yourname.olares.com,def67890.shared.olares.com
entrances:
- name: opendesign
  host: opendesign
  port: 7456
  title: Open Design
  icon: https://cdn.olares.com/images/2026/08/919ec8a2cbd0b0285ee33e455376c90b.png
  openMethod: window
  authLevel: private

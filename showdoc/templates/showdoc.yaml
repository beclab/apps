kind: Deployment
apiVersion: apps/v1
metadata:
  name: showdoc
  namespace: {{ .Release.Namespace }}
  labels:
    app: showdoc
spec:
  replicas: {{ .Values.workloads.showdoc.replicaCount }}
  selector:
    matchLabels:
      app: showdoc
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/runtime: {{ include (print $.Template.BasePath "/runtime.yaml") . | sha256sum }}
      labels:
        app: showdoc
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: data
          hostPath:
            type: DirectoryOrCreate
            path: {{ .Values.userspace.userData }}/showdoc
        - name: runtime
          emptyDir: {}
        - name: runtime-config
          configMap:
            name: showdoc-runtime
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - '-c'
            - |
              set -e
              for d in /app-data-root /app-data-root/Sqlite /app-data-root/Public /app-data-root/Public/Uploads /app-data-root/install /runtime; do
                mkdir -p "$d"
                chown 1000:1000 "$d"
              done
          resources: {}
          volumeMounts:
            - name: data
              mountPath: /app-data-root
            - name: runtime
              mountPath: /runtime
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
      containers:
        - name: container-96l42k
          image: "docker.io/star7th/showdoc:v3.9.5"
          command: ["/bin/bash", "/etc/showdoc/start.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /
              port: http-0
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http-0
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http-0
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - name: http-0
              containerPort: 8080
              protocol: TCP
            - name: http-1
              containerPort: 443
              protocol: TCP
            - name: http-2
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /var/www/html
            - name: runtime-config
              mountPath: /etc/showdoc
              readOnly: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.schedule.nodeName }}
---
kind: Service
apiVersion: v1
metadata:
  name: showdoc
  namespace: {{ .Release.Namespace }}
  labels:
    app: showdoc
spec:
  ports:
    - name: http-web
      protocol: TCP
      port: 80
      targetPort: 8080
  selector:
    app: showdoc

---
apiVersion: v1
kind: Service
metadata:
  name: showdocmcp
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: mcp
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: showdoc
